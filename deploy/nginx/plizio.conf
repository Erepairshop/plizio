server {
    listen 80;
    listen [::]:80;
    server_name plizio.com www.plizio.com 178.162.253.184;

    # Redirect legacy GSC entry to real sitemap name
    rewrite ^/blog-sitemap.xml$ /sitemap-blog.xml permanent;

    client_max_body_size 50M;

    # poi-images: shared dir (not part of Next build output) — live-served
    location ^~ /poi-images/ {
        alias /home/erik/plizio/shared/poi-images/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Next.js static assets — proxy to Next so it serves with proper headers + ISR
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static sitemap.xml index (legacy file kept in public/)
    location = /sitemap.xml {
        root /home/erik/plizio/current/public;
        try_files /sitemap.xml @next;
    }

    # Default: proxy everything to Next.js (ISR + on-demand rendering)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location @next {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss image/svg+xml;
}
