server {
    listen 80;
    listen [::]:80;
    server_name plizio.com www.plizio.com 178.162.253.184;
    rewrite ^/blog-sitemap.xml$ /sitemap-blog.xml permanent;

    root /home/erik/plizio/current;
    index index.html;
    client_max_body_size 50M;

    location ^~ /poi-images/ {
        alias /home/erik/plizio/shared/poi-images/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /_next/static/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss image/svg+xml;
}
