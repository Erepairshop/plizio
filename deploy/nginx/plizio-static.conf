server {
    listen 80;
    listen [::]:80;
    server_name plizio.com www.plizio.com 178.162.253.184;
    rewrite ^/blog-sitemap.xml$ /sitemap-blog.xml permanent;
    # Old slug format compat: /<cc>-country/ paths redirect to /<country-slug>/
    rewrite "^/(en|de|hu|ro)/([^/]+)/([a-z]{2,3})-country/(.+)$" /$1/$2/$2/$4 permanent;

    root /home/erik/plizio/current;
    index index.html;
    client_max_body_size 50M;

    # Legacy /ort/ URL pattern from an old build structure — ~6000 such URLs
    # are still in Google's index (404 → soft, slow). Returning 410 Gone tells
    # Google to remove them quickly (within days vs months).
    # nginx interprets {2} as a directive token unless the regex is quoted.
    location ~ "^/[a-z][a-z]/[a-z]+/ort/.+" {
        return 410;
    }

    location ^~ /poi-images/ {
        alias /home/erik/plizio/shared/poi-images/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /_next/static/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    # Sitemap cache + gzip (Google fetch timeout fix, 5.9MB→458KB)
    location ~* /sitemap.*\.xml$ {
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        gzip on;
        gzip_types text/xml application/xml;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss application/xml text/xml image/svg+xml;
}
