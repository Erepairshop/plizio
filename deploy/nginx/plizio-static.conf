server {
    listen 80;
    listen [::]:80;
    server_name www.plizio.com;
    return 301 https://plizio.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name plizio.com 178.162.253.184;
    rewrite ^/blog-sitemap.xml$ /sitemap-blog.xml permanent;
    # Old slug format compat: /<cc>-country/ paths redirect to /<country-slug>/
    rewrite "^/(en|de|hu|ro)/([^/]+)/([a-z]{2,3})-country/(.+)$" /$1/$2/$2/$4 permanent;

    root /home/erik/plizio/current;
    index index.html;
    client_max_body_size 50M;

    # Append a slash only to an existing directory page requested without one.
    # Two-stage variable avoids redirecting already-slashed URLs to `//`.
    set $plizio_append_slash 0;
    if ($uri ~ ^.+[^/]$) { set $plizio_append_slash 1; }
    if (-f $request_filename/index.html) { set $plizio_append_slash "${plizio_append_slash}1"; }
    if ($plizio_append_slash = 11) { return 301 https://plizio.com$uri/; }

    # Stale-URL cleanup maps ($plizio_301/$plizio_410 defined at http level in
    # /etc/nginx/conf.d/plizio_404maps.conf, entry lists in /etc/nginx/plizio_*.map).
    # The wiring MUST live in THIS repo file: every deploy copies it over
    # sites-enabled/plizio.conf, so manual live edits get wiped (recurring trap).
    if ($plizio_301) { return 301 https://plizio.com$plizio_301; }
    if ($plizio_410) { return 410; }

    # Legacy /ort/ URL pattern from an old build structure — ~6000 such URLs
    # are still in Google's index (404 → soft, slow). Returning 410 Gone tells
    # Google to remove them quickly (within days vs months).
    # nginx interprets {2} as a directive token unless the regex is quoted.
    location ~ "^/[a-z][a-z]/[a-z]+/ort/.+" {
        return 410;
    }

    location ^~ /poi-images/ {
        alias /home/erik/plizio/shared/poi-images/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ^~ /poi-user-images/ {
        root /home/erik/plizio/shared;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri @poi_user_image_missing;
    }
    location @poi_user_image_missing {
        expires -1;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }
    location /_next/static/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    # Sitemap cache + gzip (Google fetch timeout fix, 5.9MB→458KB)
    location ~* /sitemap.*\.xml$ {
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        gzip on;
        gzip_types text/xml application/xml;
        try_files $uri =404;
    }
    # Deep pages under a language tree (/lang/country/<state-or-poi>/...):
    # page exists -> 200, missing -> 410 Gone (NOT 404) so Google drops stale
    # indexed URLs fast (orphan "germany fallback" 2-letter pseudo-states,
    # removed/renamed POI slugs, dead state indexes). Internal links + sitemap
    # only ever point at generated pages, so a miss here is permanently gone.
    location ~ "^/(de|en|hu|ro|fr|tr|hr)/[^/]+/.+" {
        try_files $uri $uri.html $uri/index.html =410;
    }
    # Visitor bug-report endpoint (dynamic PHP, file lives OUTSIDE the release
    # rotation at /home/erik/plizio/endpoint/report.php so deploys never touch it).
    # WITHOUT this block the deploy-vps "restore static nginx config" step copies
    # this file over the live config and the endpoint silently 404s (recurring bug).
    location = /report.php {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /home/erik/plizio/endpoint/report.php;
        include fastcgi_params;
    }
    location = /poi-image.php {
        client_max_body_size 10M;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /home/erik/plizio/endpoint/poi-image.php;
        include fastcgi_params;
    }
    location / {
        # Removed `$uri/` fallback — it returns 403 for directories without
        # index.html (POI parent dirs that contain subdir-POIs but no state-page).
        # 404 is correct here so Google deindexes properly instead of soft-404'ing.
        try_files $uri $uri.html $uri/index.html =404;
    }
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss application/xml text/xml image/svg+xml;
}
