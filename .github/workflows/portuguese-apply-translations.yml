name: Portuguese Apply Translations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which completed queue to apply"
        type: choice
        required: true
        default: "full"
        options: [full, missing-descadv, missing-citytips-structured]
      write:
        description: "Write files (false = dry-run)"
        type: choice
        required: true
        default: "false"
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: portuguese-apply-translations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, vps-plizio]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Portuguese translations
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode }}"
          # Same work-dir layout the translation workflow writes.
          WORK=/home/erik/plizio-translations/pt-20260806
          [ "$MODE" != "full" ] && WORK="/home/erik/plizio-translations/pt-$MODE-20260806"
          if [ ! -s "$WORK/manifest.json" ] || [ ! -s "$WORK/results.jsonl" ]; then
            echo "::error::No completed queue at $WORK — run the translation workflow first."
            exit 1
          fi
          FLAGS=""
          [ "${{ inputs.write }}" = "true" ] && FLAGS="--write"
          python3 scripts/native-rollout/apply-country-translations.py \
            --repo . --work-dir "$WORK" --language pt $FLAGS

      - name: Validate written JSON
        if: inputs.write == 'true'
        run: |
          set -euo pipefail
          COUNT=$(find public/data/i18n/pt -name '*.json' | wc -l)
          echo "pt sidecars: $COUNT"
          find public/data/i18n/pt -name '*.json' -print0 \
            | xargs -0 -n1 -P4 python3 -c 'import json,sys; json.load(open(sys.argv[1],encoding="utf-8"))'
          # No `| head` here: git dies on SIGPIPE and the step fails under `set -e`.
          CHANGED=$(git status --porcelain | wc -l)
          git status --porcelain > /tmp/pt-apply-changed.txt
          sed -n '1,20p' /tmp/pt-apply-changed.txt
          echo "changed files: $CHANGED"

      - name: Commit sidecars
        if: inputs.write == 'true'
        run: |
          set -euo pipefail
          git config user.name "plizio-azure-bot"
          git config user.email "borota25@gmail.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No translation changes"
            exit 0
          fi
          git commit -m "content(i18n): apply Portuguese native translations (${{ inputs.mode }})"
          git push origin HEAD:${GITHUB_REF_NAME}
