name: Native Sights Azure Translation

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Native country language"
        type: choice
        required: true
        options: [it, es, pt, fr, tr, hr, nl, pl]
      limit:
        description: "Pending batches to translate; 0 means all"
        required: true
        default: "0"

permissions:
  contents: write

concurrency:
  group: native-sights-azure-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: [self-hosted, vps-plizio]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build deterministic sight queue
        run: |
          set -euo pipefail
          NATIVE_LANG="${{ inputs.language }}"
          WORK="/home/erik/plizio-translations/native-sights-${NATIVE_LANG}-20260805-v1"
          SOURCE_REPO=/home/erik/plizio/current
          # A persistent self-hosted runner may retain results from an older run.
          # Recreate only this language's exact work directory before queueing.
          rm -rf "$WORK"
          # Sidecars come from THIS checkout: a freshly added language is not in the
          # rendered release yet, so reading them from $SOURCE_REPO would queue nothing.
          # The rendered English pages still come from the active release.
          python3 scripts/native-rollout/build-native-sights-queue.py \
            --repo "$SOURCE_REPO" --output-dir "$WORK" --language "$NATIVE_LANG" \
            --sidecar-root "$GITHUB_WORKSPACE/public/data/i18n/$NATIVE_LANG" \
            --only-missing
          cat "$WORK/summary.json"

      - name: Translate through Azure OpenAI
        env:
          BATCH_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          NATIVE_LANG="${{ inputs.language }}"
          WORK="/home/erik/plizio-translations/native-sights-${NATIVE_LANG}-20260805-v1"
          # Every supported native lang MUST be listed here — an unmapped code
          # silently fell through to Italian and mistranslated the whole run.
          case "$NATIVE_LANG" in
            it) LANGUAGE_NAME="Italian" ;;
            es) LANGUAGE_NAME="European Spanish" ;;
            pt) LANGUAGE_NAME="European Portuguese" ;;
            hr) LANGUAGE_NAME="Croatian" ;;
            fr) LANGUAGE_NAME="French" ;;
            tr) LANGUAGE_NAME="Turkish" ;;
            nl) LANGUAGE_NAME="Dutch" ;;
            pl) LANGUAGE_NAME="Polish" ;;
            *) echo "::error::No language name mapped for $NATIVE_LANG"; exit 1 ;;
          esac
          set -a
          source /home/erik/plizio-audits/poi-only-technical-20260731/.azure-openai.env
          set +a
          python3 scripts/native-rollout/run-azure-translation.py \
            --queue "$WORK/queue.json" --output "$WORK/results.jsonl" \
            --limit "$BATCH_LIMIT" --workers 4 --rpm 9 \
            --language-name "$LANGUAGE_NAME"

      - name: Persist run summary
        if: always()
        run: |
          set -euo pipefail
          NATIVE_LANG="${{ inputs.language }}"
          WORK="/home/erik/plizio-translations/native-sights-${NATIVE_LANG}-20260805-v1"
          python3 - "$WORK" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          queue = json.loads((root / "queue.json").read_text())
          rows = []
          if (root / "results.jsonl").exists():
              for line in (root / "results.jsonl").read_text(encoding="utf-8").splitlines():
                  try: rows.append(json.loads(line))
                  except json.JSONDecodeError: pass
          latest = {row.get("id"): row for row in rows}
          valid = [row for row in latest.values() if row.get("status") == "completed"]
          usage = {key: sum(int((row.get("usage") or {}).get(key, 0) or 0) for row in valid)
                   for key in ("input_tokens", "output_tokens", "total_tokens")}
          summary = {"batches": len(queue), "completed": len(valid),
                     "errors": sum(row.get("status") == "error" for row in latest.values()), "usage": usage}
          (root / "run-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary))
          PY

      - name: Apply translated sights into the native sidecars
        if: ${{ inputs.limit == '0' }}
        run: |
          set -euo pipefail
          NATIVE_LANG="${{ inputs.language }}"
          WORK="/home/erik/plizio-translations/native-sights-${NATIVE_LANG}-20260805-v1"
          python3 scripts/native-rollout/apply-country-translations.py \
            --repo . --work-dir "$WORK" --language "$NATIVE_LANG" --write
          CHANGED=$(git status --porcelain "public/data/i18n/$NATIVE_LANG" | wc -l)
          echo "changed sidecars: $CHANGED"

      - name: Commit translated sidecars
        if: ${{ inputs.limit == '0' }}
        run: |
          set -euo pipefail
          NATIVE_LANG="${{ inputs.language }}"
          git config user.name "plizio-azure-bot"
          git config user.email "borota25@gmail.com"
          git add "public/data/i18n/$NATIVE_LANG"
          if git diff --cached --quiet; then
            echo "No sight changes"
            exit 0
          fi
          git commit -m "content(sights): apply $NATIVE_LANG native sight translations"
          # --autostash: same reason as in native-country-apply-translations.yml,
          # the persistent runner checkout carries unstaged out/ deletions.
          git pull --rebase --autostash origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sights-${{ inputs.language }}-status
          path: /home/erik/plizio-translations/native-sights-${{ inputs.language }}-20260805-v1/*.json
          if-no-files-found: warn
