name: Deploy VPS (Leaseweb)

on:
  workflow_dispatch:
  push:
    branches: [main, europe-map-wiring]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  ARCHIVE_NAME: plizio-vps.tar.gz
  RELEASE_BASE: /home/erik/plizio
  KEEP_RELEASES: 5

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache .next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextcache-vps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextcache-vps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextcache-vps-${{ runner.os }}-

      - run: npm ci

      - name: Build (static export → out/)
        env:
          NODE_OPTIONS: --max-old-space-size=14336
        run: npx next build

      - name: Verify out/ produced
        run: test -f out/index.html && test -d out/_next

      - name: Pack archive
        run: tar -C out -czf "$ARCHIVE_NAME" .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 240
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload archive
        run: scp "$ARCHIVE_NAME" vps:/tmp/

      - name: Atomic release + activate
        run: |
          ssh vps bash -s <<'REMOTE'
          set -euo pipefail
          RELEASE_BASE="/home/erik/plizio"
          SHA="${GITHUB_SHA:-$(date -u +%Y%m%d-%H%M%S)}"
          # GH passes the sha through ssh env? no — derive from filename/time
          REL_DIR="$RELEASE_BASE/releases/$(date -u +%Y%m%d-%H%M%S)"
          mkdir -p "$REL_DIR"
          tar -xzf /tmp/plizio-vps.tar.gz -C "$REL_DIR"
          rm -f /tmp/plizio-vps.tar.gz
          test -f "$REL_DIR/index.html" && test -d "$REL_DIR/_next"
          # Ensure www-data can traverse the new release
          chmod 755 "$REL_DIR"
          find "$REL_DIR" -type d -exec chmod 755 {} +
          find "$REL_DIR" -type f -exec chmod 644 {} +
          # Atomic symlink swap
          ln -sfn "$REL_DIR" "$RELEASE_BASE/current.new"
          mv -Tf "$RELEASE_BASE/current.new" "$RELEASE_BASE/current"
          # Prune older releases beyond KEEP_RELEASES=5
          ls -1dt "$RELEASE_BASE"/releases/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
          # Reload nginx (no-op if config unchanged; ensures cache flush)
          sudo systemctl reload nginx
          echo "DEPLOYED: $REL_DIR"
          REMOTE

      - name: Smoke test
        run: |
          sleep 2
          STATUS=$(curl -sS -o /tmp/out.html -w "%{http_code}" http://${{ secrets.VPS_HOST }}/ )
          echo "HTTP $STATUS"
          test "$STATUS" = "200"
          head -c 200 /tmp/out.html
          echo
