name: Deploy VPS (Leaseweb)

on:
  workflow_dispatch:
    inputs:
      poi_mode:
        description: "POI HTML generation mode"
        type: choice
        default: delta
        options: [delta, full]
  # Push trigger DISABLED 2026-05-23 — disk-full incident + user wants manual control.
  # To re-enable: uncomment block below. Until then, run "Deploy VPS" manually via
  # GH Actions UI (workflow_dispatch).
  # push:
  #   branches: [main, europe-map-wiring]
  #   paths-ignore:
  #     - '**/*.md'
  #     - 'docs/**'
  #     - '.gitignore'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  RELEASE_BASE: /home/erik/plizio
  KEEP_RELEASES: 2

jobs:
  build-deploy:
    runs-on: [self-hosted, vps-plizio]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache .next (v2 — fresh after turbopack pollution 2026-05-19)
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextcache-vps-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextcache-vps-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextcache-vps-v2-${{ runner.os }}-

      - name: Purge stale build output (preserve .next/cache for incremental builds)
        shell: bash
        run: |
          # Remove EVERYTHING from .next except the cache subdir that the
          # actions/cache@v4 step just restored. Removes stale turbopack
          # artifacts, server/static outputs from previous builds.
          if [ -d .next ]; then
            find .next -mindepth 1 -maxdepth 1 ! -name cache -exec rm -rf {} +
          fi
          rm -rf out

      - name: Pre-build disk guard (prune orphan releases before building)
        shell: bash
        run: |
          # A full static export is ~24G; a crashed prior build leaves orphan
          # releases + the end-of-job rotation never ran -> disk fills and the
          # NEXT build crashes too (spiral). Prune everything except the LIVE
          # release at the START, so a build always has room.
          REL="${{ env.RELEASE_BASE }}/releases"
          CUR=$(readlink -f "${{ env.RELEASE_BASE }}/current" 2>/dev/null || echo "")
          if [ -d "$REL" ]; then
            for d in "$REL"/*/; do
              full=$(readlink -f "$d")
              [ -z "$full" ] && continue
              if [ "$full" = "$CUR" ]; then continue; fi
              echo "pre-build prune: $full"
              rm -rf "$full" || true
            done
          fi
          df -h / | tail -1

      - run: npm ci

      - name: Patch Next worker memory limit (4GB hard-cap → 12GB)
        shell: bash
        continue-on-error: true
        run: |
          # Next.js 16 spawns build workers with resourceLimits.maxOldGenerationSizeMb=4096.
          # Override every literal occurrence in compiled JS to allow large POI builds.
          FILES=$(grep -rl "maxOldGenerationSizeMb" node_modules/next/dist 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "No maxOldGenerationSizeMb literal found in Next dist. Trying resourceLimits pattern..."
            FILES=$(grep -rl "resourceLimits" node_modules/next/dist 2>/dev/null || true)
          fi
          if [ -z "$FILES" ]; then
            echo "WARN: no patchable file found; skipping patch"
            exit 0
          fi
          echo "Patching files:"; echo "$FILES" | head -20
          echo "$FILES" | xargs sed -i -E 's/maxOldGenerationSizeMb:\s*[0-9]+/maxOldGenerationSizeMb: 12288/g' || true
          AFTER=$(grep -rcE "maxOldGenerationSizeMb:\s*12288" node_modules/next/dist 2>/dev/null | grep -v ':0$' | wc -l || true)
          echo "Files with 12288 after patch: $AFTER"

      - name: Generate V2 POI JSON
        run: npx tsx scripts/prepare_v2_data.mjs

      - name: Build SEO index (lite POI/region JSON for slugs.ts)
        env:
          NODE_OPTIONS: --max-old-space-size=16384
        run: npx tsx scripts/build-seo-index.mts

      - name: Split POIs per country (lazy-fetch source)
        env:
          NODE_OPTIONS: --max-old-space-size=16384
        run: npx tsx scripts/split_pois_by_country.mts

      # POI id -> URL-per-lang index. REQUIRED before build-static-maps, which
      # reads _poi-url-index.json for the map-popup "Details" links. Without it
      # the file is missing on the runner (it's not committed) and every map
      # POI loses its link to the HTML page.
      - name: Build POI URL index
        env:
          NODE_OPTIONS: --max-old-space-size=16384
        run: npx tsx scripts/build-poi-url-index.mts

      # Regenerate the static country + metro maps from the freshly-split POI
      # JSONs so map markers always reflect the current data + dedup blocklist.
      # Runs before the Next build so public/*-map is copied into out/.
      - name: Build static country + metro maps
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx tsx scripts/build-static-maps.mts all

      # Spatial sight-grid for the client-side "sights within N km" filter on POI
      # pages (public/data/sight-grid/<lang>/<cell>.json, ~31MB, NOT committed).
      # Needs _poi-url-index.json (parent links) + sight-sv.json (pegman flags).
      - name: Build sight grid index
        env:
          NODE_OPTIONS: --max-old-space-size=16384
        run: npx tsx scripts/build-sight-grid.mts

      - name: Build (static export → out/)
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          GSP_LIMIT: '0'
        run: npm run build

      - name: Verify out/ produced
        run: test -f out/index.html && test -d out/_next

      - name: Flatten sitemap paths (Google directory-scope rule)
        run: node scripts/flatten-sitemap-paths.mjs

      # ─── Conditional POI HTML overlay ─────────────────────────────────
      # The 152K POI HTML generation takes 10-12 min. Skip it for UI-only
      # commits that don't touch POI data / SEO copy / generator script —
      # in that case we rsync the prior release's POI HTMLs into out/ so
      # the deploy still has all pages.
      - name: Detect whether POI HTML needs regenerating
        id: detect_poi
        shell: bash
        run: |
          set -euo pipefail
          POI_AFFECTING='^(lib/visualLab/data/.*[Pp]oi|lib/seo/|components/seo/|scripts/(generate-poi-html|build-seo-index|split_pois_by_country|prepare_v2_data|flatten-sitemap-paths|generate-image-sitemap)|public/poi-images/|public/data/poi-news/|public/data/sights/|public/data/official-links\.json|public/data/sight-image-map\.json|public/data/poi-yearly-highlights\.json|public/poi-static/poi\.css|app/\[lang\])'
          # Outputs: mode = full | delta | none ; before = last-deployed SHA (delta only)
          AFTER="${{ github.sha }}"
          CURRENT="${{ env.RELEASE_BASE }}/current"
          MODE_INPUT="${{ github.event.inputs.poi_mode }}"; MODE_INPUT="${MODE_INPUT:-delta}"
          BEFORE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$MODE_INPUT" = "full" ]; then
              echo "Manual FULL dispatch → regen all"; echo "mode=full" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # delta dispatch: BEFORE = commit recorded in the current live release
            if [ -f "$CURRENT/_audit/build_warnings.json" ]; then
              BEFORE=$(node -e "try{process.stdout.write((JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).commit)||'')}catch(e){}" "$CURRENT/_audit/build_warnings.json")
            fi
          else
            BEFORE="${{ github.event.before }}"
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ "$BEFORE" = "unknown" ] || [ "$BEFORE" = "local" ]; then
            echo "No usable BEFORE → FULL"; echo "mode=full" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ! -L "$CURRENT" ]; then
            echo "No current release to reuse → FULL"; echo "mode=full" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --depth=80 origin "$BEFORE" "$AFTER" 2>/dev/null || true
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "BEFORE SHA unreachable → FULL"; echo "mode=full" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" || true)
          echo "Changed files ($BEFORE..$AFTER):"; echo "$CHANGED" | head -60 || true
          if [ -z "$CHANGED" ]; then
            echo "No changes → none (reuse)"; echo "mode=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! echo "$CHANGED" | grep -qE "$POI_AFFECTING"; then
            echo "UI-only commit → none (reuse from current release)"; echo "mode=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "POI-affecting → delta (compute step decides delta-vs-full)"
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "mode=delta" >> "$GITHUB_OUTPUT"

      - name: Compute changed POI ids (delta)
        if: steps.detect_poi.outputs.mode == 'delta'
        id: delta
        shell: bash
        run: |
          set +e
          node scripts/compute-changed-pois.mjs "${{ steps.detect_poi.outputs.before }}" "${{ github.sha }}" _changed_pois.txt
          rc=$?
          if [ "$rc" -eq 3 ]; then echo "compute → FULL fallback (unmappable POI-affecting change)"; echo "delta_ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" -ne 0 ]; then echo "compute error rc=$rc → FULL fallback"; echo "delta_ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed POIs: $(wc -l < _changed_pois.txt)"
          echo "delta_ok=true" >> "$GITHUB_OUTPUT"

      - name: Generate POI HTML overlay (FULL — all 152K, overwrites Next POI pages)
        if: steps.detect_poi.outputs.mode == 'full' || steps.delta.outputs.delta_ok == 'false'
        env:
          OUT_DIR: out
          GEN_LIMIT: '0'
          # 16GB heap: a POI-szám + city-tips/FAQ/sights adat memóriában
          # túllépte a node default ~4GB-ot (2026-06-09 OOM 160K fájlnál).
          NODE_OPTIONS: --max-old-space-size=16384
        run: npx tsx scripts/generate-poi-html.mts

      - name: Generate POI HTML overlay (DELTA — reuse prev release + regen only changed)
        if: steps.detect_poi.outputs.mode == 'delta' && steps.delta.outputs.delta_ok == 'true'
        env:
          OUT_DIR: out
          GEN_LIMIT: '0'
          POI_IDS_FILE: _changed_pois.txt
          NODE_OPTIONS: --max-old-space-size=16384
        shell: bash
        run: |
          set -euo pipefail
          REAL=$(readlink -f "${{ env.RELEASE_BASE }}/current")
          echo "Reuse prev release HTML from $REAL (no-overwrite into out/)"
          rsync -a --ignore-existing "$REAL/" out/
          echo "Regenerating $(wc -l < _changed_pois.txt) changed POIs (delta)"
          npx tsx scripts/generate-poi-html.mts

      - name: Reuse POI HTMLs from current release (UI-only commit)
        if: steps.detect_poi.outputs.mode == 'none'
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="${{ env.RELEASE_BASE }}/current"
          if [ ! -L "$CURRENT" ]; then
            echo "ERROR: no current symlink at $CURRENT — cannot skip POI gen"
            exit 1
          fi
          REAL=$(readlink -f "$CURRENT")
          echo "Rsyncing POI HTMLs from $REAL into out/ (no-overwrite)"
          rsync -a --ignore-existing "$REAL/" out/

      - name: Verify HTML overlay
        run: |
          set -euo pipefail
          COUNT=$(find out -path "*/poi-static" -prune -o -mindepth 4 -name "index.html" -print | wc -l)
          echo "POI HTML count: $COUNT"
          test "$COUNT" -gt 100000

      - name: Beach-hub pages (Croatia muster - hub plus per-beach rich pages plus sitemap-beach.xml)
        env:
          OUT_DIR: out
        run: npx tsx scripts/build-beach-hub.mts

      # Country-sights hubs (/spanien-sehenswuerdigkeiten/ etc.). MUST run AFTER
      # generate-poi-html so it consumes the AUTHORITATIVE _poi-url-index.json
      # (id -> actually-written page path). Earlier this was not in CI at all, so
      # the hub links froze with stale/wrong paths and 404'd (2026-06-12).
      - name: Country-sights hubs (top-50 per country, uses authoritative url-index)
        env:
          OUT_DIR: out
        run: npx tsx scripts/build-country-sights.mts

      - name: Build sitemap.xml index from actual chunks (Next 16 export omits it)
        run: |
          set -euo pipefail
          node scripts/build-sitemap-index.mjs
          test -f out/sitemap.xml
          test -s out/sitemap.xml
          head -3 out/sitemap.xml
          echo "index chunk count: $(grep -c '<sitemap>' out/sitemap.xml)"

      - name: Generate image sitemap (for Google Image discovery)
        env:
          OUT_DIR: out
        run: npx tsx scripts/generate-image-sitemap.mts

      # GitHub Actions cache: 10 GB/repo, LRU-evicted. The key includes github.sha
      # so EVERY deploy saves a fresh .next/cache; at ~9 GB that means constant
      # eviction (2×9>10). Trim to a budget so multiple caches coexist and the
      # save/restore is fast. Runs AFTER the build (cache already used), BEFORE the
      # automatic post-job cache save. (2026-06-12)
      - name: Trim .next/cache to budget (GitHub 10GB cache limit)
        if: always()
        shell: bash
        run: |
          set +e
          D=.next/cache
          [ -d "$D" ] || exit 0
          BEFORE=$(du -sm "$D" 2>/dev/null | cut -f1)
          BUDGET=$((3072 * 1024 * 1024))   # 3 GB in bytes
          total=0
          # newest-first; once cumulative size passes the budget, delete the rest
          find "$D" -type f -printf '%T@ %s %p\n' | sort -rn | while read -r _ size path; do
            total=$((total + size))
            if [ "$total" -gt "$BUDGET" ]; then rm -f "$path"; fi
          done
          # drop now-empty dirs
          find "$D" -type d -empty -delete 2>/dev/null
          AFTER=$(du -sm "$D" 2>/dev/null | cut -f1)
          echo ".next/cache trimmed: ${BEFORE:-?}MB -> ${AFTER:-?}MB (budget 3072MB)"

      - name: Atomic static release + nginx reload
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%d-%H%M%S)
          REL_DIR="${{ env.RELEASE_BASE }}/releases/${TS}"
          mkdir -p "$REL_DIR"
          # Hard-link unchanged files from current release → ~10× faster than cp -a,
          # disk-usage stays flat (only changed files take new inodes).
          PREV=$(readlink -f "${{ env.RELEASE_BASE }}/current" 2>/dev/null || echo "")
          if [ -n "$PREV" ] && [ -d "$PREV" ]; then
            rsync -a --delete --link-dest="$PREV/" out/ "$REL_DIR/"
          else
            cp -a out/. "$REL_DIR"/
          fi
          test -f "$REL_DIR/index.html" && test -d "$REL_DIR/_next"
          chmod 755 "$REL_DIR"
          # Permissions on inner files: rsync/cp -a already preserved them from out/;
          # only fix-up needed if a stray perm slipped in (cheap metadata-only walk).
          find "$REL_DIR" -type d ! -perm 755 -exec chmod 755 {} + || true
          find "$REL_DIR" -type f ! -perm 644 -exec chmod 644 {} + || true
          # Symlink shared image dirs into release (live at shared/ outside the
          # release rotation so images survive across deploys).
          if [ -d "${{ env.RELEASE_BASE }}/shared/sight-images" ]; then
            ln -sfn "${{ env.RELEASE_BASE }}/shared/sight-images" "$REL_DIR/sight-images"
          fi
          if [ -d "${{ env.RELEASE_BASE }}/shared/poi-images" ]; then
            ln -sfn "${{ env.RELEASE_BASE }}/shared/poi-images" "$REL_DIR/poi-images"
          fi
          ln -sfn "$REL_DIR" "${{ env.RELEASE_BASE }}/current.new"
          mv -Tf "${{ env.RELEASE_BASE }}/current.new" "${{ env.RELEASE_BASE }}/current"
          # Release rotation: keep the newest KEEP_RELEASES, delete older ones.
          # Count-based (not age-based): many same-day deploys used to pile up under
          # the old 24h-stale rule and filled the disk (2026-05-30 incident).
          # The current target is ALWAYS protected by explicit resolved-path match,
          # so a deploy/prune race can never delete the live release (2026-05-19 bug).
          KEEP="${KEEP_RELEASES:-1}"
          CURRENT_TARGET=$(readlink -f "${{ env.RELEASE_BASE }}/current" 2>/dev/null || echo "")
          n=0
          for d in $(ls -1dt "${{ env.RELEASE_BASE }}/releases"/*/ 2>/dev/null); do
            full=$(readlink -f "$d")
            n=$((n+1))
            if [ "$full" = "$CURRENT_TARGET" ]; then continue; fi   # never delete live release
            if [ "$n" -le "$KEEP" ]; then continue; fi              # keep the newest KEEP
            echo "pruning old release: $full"
            rm -rf "$full" || true
          done
          echo "release rotation: kept newest $KEEP (+ current), $(ls -1d "${{ env.RELEASE_BASE }}/releases"/*/ 2>/dev/null | wc -l) remain"
          # Restore static nginx config if proxy was set
          if ! cmp -s deploy/nginx/plizio-static.conf /etc/nginx/sites-enabled/plizio.conf 2>/dev/null; then
            sudo cp deploy/nginx/plizio-static.conf /etc/nginx/sites-enabled/plizio.conf
            sudo nginx -t
          fi
          sudo systemctl reload nginx
          echo "DEPLOYED: $REL_DIR"

      - name: Smoke test
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/out.html -w "%{http_code}" http://localhost/)
          echo "HTTP $STATUS"
          test "$STATUS" = "200"

      # During the atomic symlink swap the sitemap files are briefly 404; if Google
      # (or a visitor) fetches in that window, Cloudflare caches the 404 for 1h
      # (Cache-Control: max-age=3600 on /sitemap*.xml). GSC then reports "HTTP 404"
      # for the submitted sitemap. Purge the sitemap URLs from CF cache after the
      # swap so the next fetch revalidates to the fresh 200.
      - name: Purge Cloudflare cache for sitemaps (avoid stale 404 from atomic swap)
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.CF_API_TOKEN }}" ] && [ -n "${{ secrets.CF_ZONE_ID }}" ]; then
            FILES=$(find out -maxdepth 1 -name 'sitemap*.xml' -printf '%f\n' \
              | sed 's#^#https://plizio.com/#' | jq -R . | jq -s '{files: .}')
            N=$(echo "$FILES" | jq '.files | length')
            echo "[cf-purge] purging $N sitemap URLs from Cloudflare cache"
            # CF purge limit is 30 URLs/call — chunk just in case the sitemap grows.
            echo "$FILES" | jq -c '.files | _nwise(30)' | while IFS= read -r chunk; do
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
                -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
                -H "Content-Type: application/json" \
                --data "{\"files\": $chunk}" | jq -r '.success'
            done
          else
            echo "[cf-purge] CF_API_TOKEN/CF_ZONE_ID secret not set, skipping CF purge"
          fi

      # Right after the purge the CF edge is cold; if Googlebot fetches a large
      # sitemap (2-3 MB) while the box is busy (a follow-up build saturates the
      # uplink), CF's origin pull can take 15-30s and Googlebot times out →
      # GSC "Sitemap konnte nicht gelesen werden". Origin (nginx static) serves
      # in ~0.01s, so the cure is to re-prime the CF cache here while the box is
      # idle (deploy just finished) — the next public fetch is a fast HIT, and the
      # 24h edge_ttl keeps it warm. Gzip is requested so we exercise the same path
      # Googlebot uses. Two passes: 1st warms (MISS), 2nd confirms HIT.
      - name: Re-warm sitemap cache (avoid cold CF→origin timeout for Googlebot)
        run: |
          set -uo pipefail
          for pass in 1 2; do
            for f in $(find out -maxdepth 1 -name 'sitemap*.xml' -printf '%f\n'); do
              code=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" \
                -H "Accept-Encoding: gzip" \
                -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" \
                --max-time 35 "https://plizio.com/$f" || echo "ERR")
              echo "[warm pass$pass] $f -> $code"
            done
          done
          echo "[warm] done — sitemap CF cache primed (24h edge_ttl)"
