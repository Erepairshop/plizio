name: Deploy VPS (Leaseweb)

on:
  workflow_dispatch:
  push:
    branches: [main, europe-map-wiring]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  RELEASE_BASE: /home/erik/plizio
  KEEP_RELEASES: 5

jobs:
  build-deploy:
    runs-on: [self-hosted, vps-plizio]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache .next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextcache-vps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextcache-vps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextcache-vps-${{ runner.os }}-

      - run: npm ci

      - name: Build (static export → out/)
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          NEXT_BUILD_WORKERS: '2'
          NEXT_PRIVATE_WORKER_LIMIT: '2'
        run: npx next build

      - name: Verify out/ produced
        run: test -f out/index.html && test -d out/_next

      - name: Local atomic release + activate
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%d-%H%M%S)
          REL_DIR="${{ env.RELEASE_BASE }}/releases/${TS}"
          mkdir -p "$REL_DIR"
          # Fast local copy — runner is on the same VPS as the deploy target
          cp -a out/. "$REL_DIR"/
          test -f "$REL_DIR/index.html" && test -d "$REL_DIR/_next"
          # Ensure www-data can traverse + read
          chmod 755 "$REL_DIR"
          find "$REL_DIR" -type d -exec chmod 755 {} +
          find "$REL_DIR" -type f -exec chmod 644 {} +
          # Atomic symlink swap (rename(2) is atomic on POSIX)
          ln -sfn "$REL_DIR" "${{ env.RELEASE_BASE }}/current.new"
          mv -Tf "${{ env.RELEASE_BASE }}/current.new" "${{ env.RELEASE_BASE }}/current"
          # Prune old releases — keep newest N
          ls -1dt "${{ env.RELEASE_BASE }}"/releases/*/ 2>/dev/null \
            | tail -n +$((${{ env.KEEP_RELEASES }} + 1)) | xargs -r rm -rf
          # Reload nginx (passwordless sudo configured)
          sudo systemctl reload nginx
          echo "DEPLOYED: $REL_DIR"

      - name: Smoke test
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/out.html -w "%{http_code}" http://localhost/)
          echo "HTTP $STATUS"
          test "$STATUS" = "200"
          head -c 200 /tmp/out.html
          echo
