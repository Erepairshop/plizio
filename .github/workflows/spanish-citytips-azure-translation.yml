name: Spanish City Tips Azure Translation

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Pending batches to translate; 0 means all"
        required: true
        default: "0"

concurrency:
  group: spanish-citytips-azure-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: [self-hosted, vps-plizio]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Build missing structured city-tips queue
        run: |
          set -euo pipefail
          WORK=/home/erik/plizio-translations/es-citytips-20260806
          SOURCE_REPO=/home/erik/plizio/current
          mkdir -p "$WORK"
          python3 scripts/native-rollout/build-spanish-queue.py \
            --repo "$SOURCE_REPO" \
            --output-dir "$WORK" \
            --mode missing-citytips-structured
          cat "$WORK/summary.json"

      - name: Translate through Azure OpenAI
        env:
          BATCH_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          WORK=/home/erik/plizio-translations/es-citytips-20260806
          set -a
          source /home/erik/plizio-audits/poi-only-technical-20260731/.azure-openai.env
          set +a
          python3 scripts/native-rollout/run-azure-translation.py \
            --queue "$WORK/queue.json" \
            --output "$WORK/results.jsonl" \
            --limit "$BATCH_LIMIT" \
            --workers 4 \
            --rpm 9

      - name: Persist run summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("/home/erik/plizio-translations/es-citytips-20260806")
          queue = json.loads((root / "queue.json").read_text()) if (root / "queue.json").exists() else []
          rows = []
          if (root / "results.jsonl").exists():
              for line in (root / "results.jsonl").read_text(encoding="utf-8").splitlines():
                  try:
                      rows.append(json.loads(line))
                  except json.JSONDecodeError:
                      pass
          latest = {row.get("id"): row for row in rows if row.get("id")}
          summary = {
              "batches": len(queue),
              "completed": sum(row.get("status") == "completed" for row in latest.values()),
              "errors": sum(row.get("status") == "error" for row in latest.values()),
          }
          (root / "run-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spanish-citytips-azure-status
          path: |
            /home/erik/plizio-translations/es-citytips-20260806/summary.json
            /home/erik/plizio-translations/es-citytips-20260806/run-summary.json
          if-no-files-found: warn
