name: Deploy POI Delta (content-only)

# Regenerate ONLY the targeted POI HTMLs and copy into the active VPS release.
# Use when only POI content (descAdv / sights / facts / image / name) changed —
# skips the ~30-min full Next build + sitemap regen.
#
# Input: POI_IDS — comma-separated POI ids OR a path to a file under public/data/.
# Example: "schwachhausen-extra,st-pauli-extra,merzig-extra"
# Example: "file:public/data/_thin-descadv-applied.txt"
# Special: "none" → skip HTML regen entirely (data-only deploy: public/data sync
#          + optional sight-grid rebuild).
# rebuild_grid: "true" → rebuild the spatial sight-grid (Umgebung "sights nearby"
#          cells) + copy into the release. Use after sights merges (fam rounds).

on:
  workflow_dispatch:
    inputs:
      poi_ids:
        description: 'Comma-separated POI ids OR "file:<repo-path-to-txt>" OR "none" (data-only)'
        required: true
        default: 'file:public/data/_thin-descadv-applied.txt'
      rebuild_grid:
        description: 'Rebuild sight-grid (after sights merge): true/false'
        required: false
        default: 'false'

concurrency:
  group: deploy-poi-delta
  cancel-in-progress: false

env:
  RELEASE_BASE: /home/erik/plizio

jobs:
  delta:
    runs-on: [self-hosted, vps-plizio]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve POI_IDS input → file
        id: ids
        run: |
          INPUT='${{ github.event.inputs.poi_ids }}'
          if [[ "$INPUT" == "none" ]]; then
            echo "POI_IDS_FILE=" >> $GITHUB_ENV
            echo "count=0" >> $GITHUB_OUTPUT
            echo "[delta] data-only mode (no HTML regen)"
          elif [[ "$INPUT" == file:* ]]; then
            FP="${INPUT#file:}"
            if [ ! -f "$FP" ]; then
              echo "::error::POI ids file not found: $FP"
              exit 1
            fi
            echo "POI_IDS_FILE=$PWD/$FP" >> $GITHUB_ENV
            COUNT=$(wc -l < "$FP" | tr -d ' ')
          else
            TMP="$RUNNER_TEMP/poi_ids.txt"
            echo "$INPUT" | tr ',' '\n' | sed '/^\s*$/d' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > "$TMP"
            echo "POI_IDS_FILE=$TMP" >> $GITHUB_ENV
            COUNT=$(wc -l < "$TMP" | tr -d ' ')
          fi
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "[delta] $COUNT POI ids to regenerate"

      - name: Install dependencies (cache-friendly)
        run: |
          # Self-hosted runner usually has node_modules cached; npm ci only if missing.
          if [ ! -d "node_modules" ]; then
            npm ci --no-audit --no-fund --prefer-offline
          fi

      - name: Locate active VPS release
        id: release
        run: |
          if [ -L "$RELEASE_BASE/current" ]; then
            ACTIVE=$(readlink -f "$RELEASE_BASE/current")
          else
            echo "::error::No active release symlink at $RELEASE_BASE/current"
            exit 1
          fi
          echo "active=$ACTIVE" >> $GITHUB_OUTPUT
          echo "[delta] active release: $ACTIVE"

      # Content JSONs are fetched client-side from /data/... — copy the committed
      # public/data into the live release so tips/itinerary/i18n/sights changes go
      # live WITHOUT a full build. Additive rsync (no --delete), excludes the
      # generated-only dirs that don't exist in the checkout.
      - name: Sync public/data content into active release
        run: |
          ACTIVE='${{ steps.release.outputs.active }}'
          rsync -a --exclude 'sight-grid/' --exclude 'pois/' public/data/ "$ACTIVE/data/"
          echo "[delta] public/data synced into $ACTIVE/data"

      # Spatial sight-grid rebuild (Umgebung "sights nearby" cells). Heavy
      # (~16GB heap, reads all POI sources) — opt-in via rebuild_grid input.
      # ELOFELTETELEK: V2 chunkok (allCountryPois importja oket!) + url-index.
      - name: Prepare V2 data chunks (grid prerequisite)
        if: github.event.inputs.rebuild_grid == 'true'
        run: npx tsx scripts/prepare_v2_data.mjs 2>&1 | tail -5

      - name: Build POI URL index (grid prerequisite)
        if: github.event.inputs.rebuild_grid == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=16384
        run: npx tsx scripts/build-poi-url-index.mts

      - name: Build + deploy sight grid
        if: github.event.inputs.rebuild_grid == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=16384
        run: |
          npx tsx scripts/build-sight-grid.mts
          ACTIVE='${{ steps.release.outputs.active }}'
          rsync -a public/data/sight-grid/ "$ACTIVE/data/sight-grid/"
          echo "[delta] sight-grid rebuilt + synced"

      - name: Prepare V2 data chunks (required by generate-poi-html)
        if: github.event.inputs.poi_ids != 'none'
        run: |
          # generate-poi-html.mts imports _all_v2_pois_*.json chunks that
          # prepare_v2_data.mjs writes from poiExtra*V2.ts. Re-run on each delta
          # so the latest source data is reflected.
          # Must use tsx (not bare node): Node 20 cannot import .ts files natively,
          # and prepare_v2_data does `await import('./poiExtra*V2.ts')` per file.
          npx tsx scripts/prepare_v2_data.mjs 2>&1 | tail -15

      - name: Generate targeted POI HTMLs into a staging out/
        if: github.event.inputs.poi_ids != 'none'
        run: |
          mkdir -p out_delta
          # Use tsx (in node_modules) — works on Node 20, no --experimental-strip-types needed.
          # Write to out_delta/ to avoid mixing with prior full-build artifacts.
          POI_IDS_FILE="$POI_IDS_FILE" OUT_DIR="$PWD/out_delta" \
            npx tsx scripts/generate-poi-html.mts 2>&1 | tail -30
          # Sanity check
          GENERATED=$(find out_delta -name 'index.html' -type f | wc -l)
          echo "[delta] generated $GENERATED HTML files in out_delta/"
          if [ "$GENERATED" -eq 0 ]; then
            echo "::error::No HTMLs generated — POI_IDS filter likely matched 0 POIs"
            exit 1
          fi

      - name: Diff + copy changed HTMLs into active release
        if: github.event.inputs.poi_ids != 'none'
        run: |
          ACTIVE='${{ steps.release.outputs.active }}'
          COPIED=0
          # Copy ALL HTMLs from out_delta (every file there is freshly generated)
          while IFS= read -r f; do
            REL="${f#out_delta/}"
            DEST="$ACTIVE/$REL"
            mkdir -p "$(dirname "$DEST")"
            cp "$f" "$DEST"
            COPIED=$((COPIED+1))
          done < <(find out_delta -name 'index.html' -type f)
          echo "[delta] copied $COPIED HTML files into active release"
          echo "## Delta deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- POI ids: ${{ steps.ids.outputs.count }}" >> $GITHUB_STEP_SUMMARY
          echo "- HTML files written: $COPIED" >> $GITHUB_STEP_SUMMARY
          echo "- Active release: $ACTIVE" >> $GITHUB_STEP_SUMMARY

      - name: Update sitemap lastmod + IndexNow ping
        if: github.event.inputs.poi_ids != 'none'
        run: |
          # Refresh sitemap.xml `lastmod` for affected URLs (so Googlebot re-crawls)
          # + reset IndexNow cooldown + immediate Bing/Yandex/Seznam ping.
          if [ -x /home/erik/_sitemap_touch_and_indexnow.py ]; then
            python3 /home/erik/_sitemap_touch_and_indexnow.py "$POI_IDS_FILE" 2>&1 | tail -20
          else
            echo "[delta] sitemap-touch script not found, skipping freshness signal"
          fi

      - name: Smoke test + diagnostic
        if: github.event.inputs.poi_ids != 'none'
        run: |
          set +e
          # List ALL paths written (debug — what slugs did buildPoiPath actually produce?)
          echo "## Generated paths (first 30)" >> $GITHUB_STEP_SUMMARY
          find out_delta -name 'index.html' -type f 2>/dev/null | head -30 | while read -r f; do
            REL="${f#out_delta/}"
            URL="https://plizio.com/${REL%/index.html}/"
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 6 "$URL")
            echo "- [$CODE] $URL" >> $GITHUB_STEP_SUMMARY
            echo "[$CODE] $URL"
          done
          # CF purge for the touched POI URLs (only if CF_API_TOKEN secret is set)
          if [ -n "${{ secrets.CF_API_TOKEN }}" ] && [ -n "${{ secrets.CF_ZONE_ID }}" ]; then
            echo "[delta] purging CF cache for changed POI URLs..."
            URLS_JSON=$(find out_delta -name 'index.html' -type f | while read -r f; do
              REL="${f#out_delta/}"
              URL="https://plizio.com/${REL%/index.html}/"
              echo "$URL"
            done | jq -R . | jq -s '{files: .}')
            # CF purge limit is 30 URLs per call — chunk if many
            echo "$URLS_JSON" | jq -c '.files | _nwise(30)' | while IFS= read -r chunk; do
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
                -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
                -H "Content-Type: application/json" \
                --data "{\"files\": $chunk}" | jq -r '.success'
            done
          else
            echo "[delta] CF_API_TOKEN secret not set, skipping CF purge"
          fi
