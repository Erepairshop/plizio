name: Chemistry Test Azure Translation

on:
  push:
    branches:
      - codex/kemia-translation-20260820
    paths:
      - ".github/workflows/kemia-test-azure-translation.yml"
      - "scripts/test-translation/**"
      - "translation-work/kemia-test/**"

permissions:
  contents: read

concurrency:
  group: chemistry-test-azure-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: [self-hosted, vps-plizio]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Translate Hungarian
        run: bash scripts/test-translation/run-kemia-language.sh hu Hungarian

      - name: Translate Romanian
        run: bash scripts/test-translation/run-kemia-language.sh ro Romanian

      - name: Translate English
        run: bash scripts/test-translation/run-kemia-language.sh en English

      - name: Validate exact coverage
        run: >-
          python3 scripts/test-translation/validate-kemia-results.py
          --manifest translation-work/kemia-test/source-manifest.json
          --result /home/erik/plizio-translations/kemia-test-20260820/result-hu.jsonl
          --result /home/erik/plizio-translations/kemia-test-20260820/result-ro.jsonl
          --result /home/erik/plizio-translations/kemia-test-20260820/result-en.jsonl

      - name: Upload translations
        uses: actions/upload-artifact@v4
        with:
          name: kemia-test-translations
          path: |
            translation-work/kemia-test/source-manifest.json
            /home/erik/plizio-translations/kemia-test-20260820/result-hu.jsonl
            /home/erik/plizio-translations/kemia-test-20260820/result-ro.jsonl
            /home/erik/plizio-translations/kemia-test-20260820/result-en.jsonl
          retention-days: 7
