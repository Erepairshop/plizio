nt ist: gehend, stehend, sitzend und liegend.","f":["Befindet sich südlich der ummauerten Stadt.","Die Statuen symbolisieren die vier Haltungen Buddhas."]},"wat-phra-si-sanphet-history-v2":{"i":"/poi-images/wat-phra-si-sanphet-history-v2.webp","s":"Der heiligste Tempel auf dem Gelände des alten Königspalastes in Ayutthaya, der als Vorbild für den Smaragd-Buddha-Tempel in Bangkok diente.","f":["Berühmt für seine drei großen, glockenförmigen Chedis.","Diente ausschließlich königlichen Zeremonien."]},"vimanmek-mansion-history-v2":{"i":"/poi-images/vimanmek-mansion-history-v2.webp","s":"Ein ehemaliger königlicher Palast in Bangkok, der als das größte Teakholzgebäude der Welt gilt.","f":["Ursprünglich auf der Insel Ko Sichang erbaut und später nach Bangkok verlegt.","Hat 81 Zimmer, Hallen und Vorzimmer."]},"wat-sri-chum-sukhothai-history-v2":{"i":"/poi-images/wat-sri-chum-sukhothai-history-v2.webp","s":"Ein Tempel im Geschichtspark Sukhothai, der eine massive, 15 Meter hohe sitzende Buddha-Statue namens 'Phra Achana' in einem würfelförmigen Mandapa beherbergt.","f":["Phra Achana bedeutet 'der, der nicht erschrocken ist'.","Eine Legende besagt, dass die Statue einst zu Soldaten sprach, um sie zu ermutigen."]},"battle-of-nong-sarai-history-v2":{"i":"/poi-images/battle-of-nong-sarai-history-v2.webp","s":"Eine historische Schlacht im Jahr 1593, bei der König Naresuan von Siam den burmesischen Kronprinzen Mingyi Swa in einem persönlichen Elefantenduell tötete.","f":["Führte zum Rückzug der burmesischen Armee.","Ein entscheidender Moment in der siamesischen Geschichte, der die Unabhängigkeit sicherte."]},"wat-cheun-tha-history-v2":{"i":"/poi-images/wat-cheun-tha-history-v2.webp","s":"Ein verlassener Tempel in Ayutthaya, bekannt für seine gut erhaltene Architektur im späten Ayutthaya-Stil.","f":["Befindet sich außerhalb der Hauptinsel von Ayutthaya.","Gilt als ein Meisterwerk der Architektur seiner Zeit."]},"khmer-ruins-of-lopburi-history-v2":{"i":"/poi-images/khmer-ruins-of-lopburi-history-v2.webp","s":"Ein berühmter Khmer-Tempel in Lopburi, bekannt für seine drei verbundenen Prangs und die große Affenpopulation, die ihn bewohnt.","f":["Erbaut im 13. Jahrhundert von König Jayavarman VII.","Ursprünglich ein hinduistischer Schrein, wurde aber später zu einem buddhistischen Tempel."]},"king-taksin-monument-history-v2":{"i":"/poi-images/king-taksin-monument-history-v2.webp","s":"Ein Denkmal in Chanthaburi, das König Taksin ehrt, der die siamesischen Streitkräfte nach dem Fall von Ayutthaya sammelte und das Königreich Thonburi gründete.","f":["Chanthaburi war Taksins Basis, um seine Armee wieder aufzubauen.","Die Statue zeigt den König auf einem Pferd sitzend."]},"cemetery-of-allied-prisoners-history-v2":{"i":"/poi-images/cemetery-of-allied-prisoners-history-v2.webp","s":"Der Hauptfriedhof für Opfer des Baus der 'Todesbahn' während des Zweiten Weltkriegs.","f":["Enthält die Gräber von fast 7.000 alliierten Kriegsgefangenen.","Die meisten Gefangenen waren Briten, Australier und Niederländer."]},"wat-phra-that-doi-suthep-history-v2":{"i":"/poi-images/wat-phra-that-doi-suthep-history-v2.webp","s":"Ein heiliger buddhistischer Tempel auf dem Berg Doi Suthep bei Chiang Mai.","f":["Gegründet im Jahr 1383.","Eine Treppe mit 309 Stufen, die von Nagas flankiert wird, führt zum Tempel."]},"jim-thompson-house-museum-history-v2":{"i":"/poi-images/jim-thompson-house-museum-history-v2.webp","s":"Ein Museum in Bangkok, das aus einem Komplex von sechs traditionellen thailändischen Teakholzhäusern besteht, die dem amerikanischen Geschäftsmann Jim Thompson gehörten.","f":["Jim Thompson war maßgeblich an der Wiederbelebung der thailändischen Seidenindustrie beteiligt.","Er verschwand 1967 auf mysteriöse Weise in Malaysia."]},"wat-lokayasutharam-history-v2":{"i":"/poi-images/wat-lokayasutharam-history-v2.webp","s":"Die Ruinen eines alten Tempels in Ayutthaya, der für seine riesige, im Freien liegende Buddha-Statue bekannt ist.","f":["Die Statue ist etwa 42 Meter lang und 8 Meter hoch.","Aus Ziegeln und Zement gefertigt."]},"wat-tham-suea-krabi-history-v2":{"i":"/poi-images/wat-tham-suea-krabi-history-v2.webp","s":"Ein buddhistischer Tempelkomplex in Krabi, der für seine Tigerpfotenabdrücke in der Höhle, hohe Buddha-Statuen und einen anstrengenden Aufstieg zu einem Gipfelschrein bekannt ist.","f":["Der Aufstieg zum Gipfel hat 1.237 Stufen.","Der Name leitet sich von der Legende eines Tigers ab, der in den Höhlen lebte."]},"three-pagodas-pass-history-v2":{"i":"/poi-images/three-pagodas-pass-history-v2.webp","s":"Ein Pass im Tenasserim-Gebirge, der Thailand und Myanmar verbindet.","f":["Der Pass ist nach drei kleinen, verfallenen Pagoden benannt.","Schauplatz vieler Schlachten zwischen burmesischen und siamesischen Armeen."]},"erawan-museum-history-v2":{"i":"/poi-images/erawan-museum-history-v2.webp","s":"Ein Museum in Samut Prakan, das für seine riesige, dreiköpfige Elefantenstatue bekannt ist.","f":["Der Elefant ist 29 Meter hoch.","Die drei Ebenen des Museums symbolisieren die Unterwelt, die Menschenwelt und den Himmel."]},"democracy-monument-bangkok-landmarks-v2":{"i":"/poi-images/democracy-monument-bangkok-landmarks-v2.webp","s":"Ein öffentliches Denkmal im Zentrum von Bangkok, das an die siamesische Revolution von 1932 erinnert, die die absolute Monarchie beendete.","f":["Entworfen vom italienischen Bildhauer Corrado Feroci.","Die vier Flügel symbolisieren die vier Zweige der thailändischen Streitkräfte."]},"victory-monument-bangkok-landmarks-v2":{"i":"/poi-images/victory-monument-bangkok-landmarks-v2.webp","s":"Ein großes Militärdenkmal in Bangkok, errichtet 1941, um den thailändischen Sieg im französisch-thailändischen Krieg zu feiern.","f":["Die zentrale Obelisk ist wie fünf Bajonette geformt, die zusammengefügt sind.","Umgeben von Statuen, die Heer, Marine, Luftwaffe, Polizei und Zivilisten repräsentieren."]},"giant-swing-bangkok-landmarks-v2":{"i":"/poi-images/giant-swing-bangkok-landmarks-v2.webp","s":"Eine religiöse Struktur im Herzen von Bangkok, die früher für eine jährliche brahmanische Zeremonie verwendet wurde.","f":["Erbaut im Jahr 1784.","Die Zeremonie wurde 1935 wegen Sicherheitsbedenken eingestellt."]},"baiyoke-tower-ii-landmarks-v2":{"i":"/poi-images/baiyoke-tower-ii-landmarks-v2.webp","s":"Ein 88-stöckiger Wolkenkratzer in Bangkok, der einst das höchste Gebäude Thailands war und einen Panoramablick über die Stadt bietet.","f":["Fertiggestellt im Jahr 1997.","Hat eine drehbare Aussichtsplattform auf der 84. Etage."]},"bridge-on-the-river-kwai-landmarks-v2":{"i":"/poi-images/bridge-on-the-river-kwai-landmarks-v2.webp","s":"Ein Teil der 'Todesbahn', die während des Zweiten Weltkriegs von alliierten Kriegsgefangenen gebaut wurde.","f":["Die ursprüngliche Brücke wurde bombardiert und teilweise zerstört.","Die heutige Brücke enthält Teile der ursprünglichen Struktur."]},"big-buddha-phuket-landmarks-v2":{"i":"/poi-images/big-buddha-phuket-landmarks-v2.webp","s":"Eine riesige sitzende Buddha-Statue aus Marmor auf dem Nakkerd-Hügel in Phuket, die von überall im Süden Phukets aus sichtbar ist.","f":["Die Statue ist 45 Meter hoch.","Der Bau begann 2004 und wurde hauptsächlich durch Spenden finanziert."]},"hellfire-pass-memorial-landmarks-v2":{"i":"/poi-images/hellfire-pass-memorial-landmarks-v2.webp","s":"Ein Eisenbahneinschnitt an der ehemaligen 'Todesbahn' in Kanchanaburi, der von alliierten Kriegsgefangenen von Hand durch massiven Fels gehauen wurde.","f":["Der Name stammt von der unheimlichen Szene der Gefangenen, die nachts bei Fackellicht arbeiteten.","Ein Museum und ein Wanderweg ehren die Opfer."]},"phimai-historical-park-landmarks-v2":{"i":"/poi-images/phimai-historical-park-landmarks-v2.webp","s":"Beherbergt einen der größten Khmer-Tempel in Thailand.","f":["Stammt aus dem 11. bis 12. Jahrhundert.","Ähnlich im Stil wie Angkor Wat in Kambodscha."]},"phanom-rung-historical-park-landmarks-v2":{"i":"/poi-images/phanom-rung-historical-park-landmarks-v2.webp","s":"Ein Khmer-Tempelkomplex auf dem Rand eines erloschenen Vulkans in der Provinz Buriram.","f":["Erbaut zwischen dem 10. und 13. Jahrhundert.","Berühmt für ein Phänomen, bei dem die Sonne perfekt durch alle 15 Türen scheint."]},"wat-chaiwatthanaram-landmarks-v2":{"i":"/poi-images/wat-chaiwatthanaram-landmarks-v2.webp","s":"Ein beeindruckender buddhistischer Tempel am Ufer des Chao Phraya Flusses in Ayutthaya, erbaut im Khmer-Stil.","f":["Erbaut 1630 von König Prasat Thong.","Soll die Residenz seiner Mutter gewesen sein."]},"king-narai-palace-lopburi-landmarks-v2":{"i":"/poi-images/king-narai-palace-lopburi-landmarks-v2.webp","s":"Ein Palastkomplex in Lopburi, erbaut von König Narai dem Großen im 17.","f":["Diente als zweite Hauptstadt des Ayutthaya-Königreichs.","Französische Architekten waren am Bau beteiligt."]},"golden-buddha-wat-traimit-landmarks-v2":{"i":"/poi-images/golden-buddha-wat-traimit-landmarks-v2.webp","s":"Ein Tempel in Bangkok, der die größte massive Gold-Buddha-Statue der Welt beherbergt.","f":["Die Statue wiegt etwa 5,5 Tonnen.","Sie war jahrhundertelang mit Gips bedeckt, um sie zu verbergen."]},"wat-saket-golden-mount-landmarks-v2":{"i":"/poi-images/wat-saket-golden-mount-landmarks-v2.webp","s":"Ein flacher künstlicher Hügel in Bangkok mit einem goldenen Chedi an der Spitze, der einen Panoramablick auf die Stadt bietet.","f":["Der Hügel wurde während der Herrschaft von König Rama III. gebaut.","Der Chedi beherbergt eine Buddha-Reliquie."]},"khao-chi-chan-buddha-mountain-landmarks-v2":{"i":"/poi-images/khao-chi-chan-buddha-mountain-landmarks-v2.webp","s":"Eine riesige goldene Buddha-Gravur auf der Seite eines Kalksteinbergs in der Nähe von Pattaya, geschaffen zu Ehren von König Bhumibol Adulyadej.","f":["Erstellt 1996 zum 50. Thronjubiläum des Königs.","Das Bild ist 109 Meter hoch."]},"wat-tham-pha-dan-landmarks-v2":{"i":"/poi-images/wat-tham-pha-dan-landmarks-v2.webp","s":"Ein einzigartiger Tempel in Sakon Nakhon, der in eine Klippe gebaut wurde und für seine großen, in den Fels gehauenen Skulpturen bekannt ist.","f":["Bietet einen Panoramablick auf die umliegende Landschaft.","Die Schnitzereien stellen buddhistische Lehren und Legenden dar."]},"mae-ya-waterfall-landmarks-v2":{"i":"/poi-images/mae-ya-waterfall-landmarks-v2.webp","s":"Einer der schönsten Wasserfälle im Nationalpark Doi Inthanon, der über eine 260 Meter breite Felswand in Kaskaden herabfällt.","f":["Der Wasserfall ist etwa 280 Meter hoch.","Sieht aus wie ein riesiger, fließender Vorhang aus Wasser."]},"sala-kaeoku-sculpture-park-landmarks-v2":{"i":"/poi-images/sala-kaeoku-sculpture-park-landmarks-v2.webp","s":"Ein Park in Nong Khai mit riesigen fantastischen Skulpturen, die von dem Mystiker Luang Pu Bunleua Sulilat geschaffen wurden und buddhistische und hinduistische Mythologie verbinden.","f":["Ähnelt dem Buddha Park in Laos, der vom selben Künstler geschaffen wurde.","Enthält über 100 Skulpturen."]},"wat-plai-laem-koh-samui-landmarks-v2":{"i":"/poi-images/wat-plai-laem-koh-samui-landmarks-v2.webp","s":"Ein farbenfroher buddhistischer Tempel auf Koh Samui, bekannt für seine riesige Statue der Guanyin, der Göttin des Mitgefühls, mit 18 Armen.","f":["Der Tempel ist von einem See umgeben.","Besucher können Fische im See füttern, um Verdienste zu erlangen."]},"red-lotus-sea-udon-thani-landmarks-v2":{"i":"/poi-images/red-lotus-sea-udon-thani-landmarks-v2.webp","s":"Ein großer Süßwassersee in der Provinz Udon Thani, der von Dezember bis Februar mit Millionen von rosa Lotusblüten bedeckt ist.","f":["Die beste Zeit für einen Besuch ist am frühen Morgen.","Bootsfahrten sind verfügbar, um die Blüten aus der Nähe zu sehen."]},"doi-inthanon-summit-landmarks-v2":{"i":"/poi-images/doi-inthanon-summit-landmarks-v2.webp","s":"Der höchste Punkt in Thailand, gelegen im Nationalpark Doi Inthanon.","f":["Die Höhe beträgt 2.565 Meter.","Die Temperaturen können in der kühlen Jahreszeit nahe dem Gefrierpunkt liegen."]},"sea-life-bangkok-ocean-world-life-v2":{"i":"/poi-images/sea-life-bangkok-ocean-world-life-v2.webp","s":"Ein Aquarium im Untergeschoss des Einkaufszentrums Siam Paragon, das eine beeindruckende Vielfalt an Meereslebewesen zeigt.","f":["Eines der größten Aquarien in Südostasien.","Bietet einen Unterwassertunnel."]},"samphran-elephant-ground-zoo-life-v2":{"i":"/poi-images/samphran-elephant-ground-zoo-life-v2.webp","s":"Ein beliebter Ort, der für seine Elefantenshows und Krokodil-Wrestling-Vorführungen bekannt ist.","f":["Die Elefantenshow stellt eine historische Schlacht nach.","Die Krokodilshow zeigt Stunts mit den Reptilien."]},"pattaya-sheep-farm-life-v2":{"i":"/poi-images/pattaya-sheep-farm-life-v2.webp","s":"Eine Farm mit einer märchenhaften Atmosphäre, auf der Besucher Schafe, Alpakas und andere Tiere füttern und mit ihnen interagieren können.","f":["Verfügt über einen Streichelzoo und eine Spielscheune.","Bietet verschiedene Fotomöglichkeiten mit Windmühlen und Skulpturen."]},"chatuchak-park-life-v2":{"i":"/poi-images/chatuchak-park-life-v2.webp","s":"Ein großer öffentlicher Park in Bangkok neben dem berühmten Chatuchak-Wochenendmarkt.","f":["Hat einen künstlichen See mit Brücken.","Beliebt zum Joggen und Picknicken."]},"the-blooms-orchid-park-life-v2":{"i":"/poi-images/the-blooms-orchid-park-life-v2.webp","s":"Ein Park in Ratchaburi, der sich auf den Anbau und die Ausstellung einer großen Vielfalt von Orchideenarten spezialisiert hat.","f":["Zeigt seltene und endemische thailändische Orchideen.","Bietet Workshops zum Orchideenanbau an."]},"krabi-elephant-sanctuary-life-v2":{"i":"/poi-images/krabi-elephant-sanctuary-life-v2.webp","s":"Ein ethisches Elefantencamp, in dem Besucher gerettete Elefanten in einer pflegenden Umgebung füttern, mit ihnen spazieren gehen und sie baden können.","f":["Kein Reiten der Elefanten erlaubt.","Fokus auf Bildung über die Notlage asiatischer Elefanten."]},"pororo-aquapark-bangkok-life-v2":{"i":"/poi-images/pororo-aquapark-bangkok-life-v2.webp","s":"Ein Wasserpark auf dem Dach des Einkaufszentrums CentralPlaza Bangna, thematisiert nach der beliebten koreanischen Zeichentrickfigur Pororo.","f":["Bietet mehrere Wasserrutschen und Pools.","Ideal für Familien mit kleinen Kindern."]},"chom-rom-bua-sakon-nakhon-life-v2":{"i":"/poi-images/chom-rom-bua-sakon-nakhon-life-v2.webp","s":"Eine landwirtschaftliche Attraktion am Nong Han See, wo verschiedene Lotusarten für kulinarische und dekorative Zwecke angebaut werden.","f":["Besucher können mehr über den Lotus-Anbau lernen.","Teile der Lotuspflanze werden in der lokalen Küche verwendet."]},"benchasiri-park-life-v2":{"i":"/poi-images/benchasiri-park-life-v2.webp","s":"Ein kompakter öffentlicher Park im Herzen des Viertels Sukhumvit in Bangkok, der der Königin Sirikit gewidmet ist.","f":["Eröffnet 1992 zum 60. Geburtstag der Königin.","Enthält eine Sammlung zeitgenössischer Skulpturen."]},"phu-phra-bat-historical-park-wildlife-v2":{"i":"/poi-images/phu-phra-bat-historical-park-wildlife-v2.webp","s":"Obwohl es sich um einen Geschichtspark handelt, beherbergt das Gebiet auch eine vielfältige Tierwelt in seinen Wäldern, darunter zahlreiche Vogelarten und kleine Säugetiere.","f":["Ein guter Ort für die Vogelbeobachtung.","Die Felsformationen bieten Lebensraum für Reptilien."]},"siam-amazing-park-life-v2":{"i":"/poi-images/siam-amazing-park-life-v2.webp","s":"Ein großer Vergnügungs- und Wasserpark in Bangkok, der eine Vielzahl von Fahrgeschäften und das größte Wellenbad der Welt bietet.","f":["Früher bekannt als Siam Park City.","Das Wellenbad ist von Guinness World Records zertifiziert."]},"singha-park-chiang-rai-agriculture-v2":{"i":"/poi-images/singha-park-chiang-rai-agriculture-v2.webp","s":"Ein landwirtschaftliches Tourismusziel, das Teeplantagen, Obstgärten und Blumenfelder umfasst und nachhaltige landwirtschaftliche Praktiken fördert.","f":["Anbau von Oolong-Tee.","Produziert auch eine Vielzahl von Früchten wie Jujube und Erdbeeren."]},"suan-luang-rama-ix-park-life-v2":{"i":"/poi-images/suan-luang-rama-ix-park-life-v2.webp","s":"Der größte öffentliche Park in Bangkok, der 1987 zum 60.","f":["Verfügt über einen großen See und einen botanischen Garten.","Internationale Gärten repräsentieren verschiedene Länder."]},"phu-chong-na-yoi-np-wildlife-v2":{"i":"/poi-images/phu-chong-na-yoi-np-wildlife-v2.webp","s":"Ein Nationalpark an der Grenze zu Laos und Kambodscha, bekannt für seine unberührten Wälder und die vielfältige Tierwelt, einschließlich seltener Vogelarten.","f":["Teil des Emerald Triangle-Waldkomplexes.","Beherbergt Wasserfälle wie den Bak Tew Yai."]},"art-in-paradise-bangkok-life-v2":{"i":"/poi-images/art-in-paradise-bangkok-life-v2.webp","s":"Ein interaktives 3D-Kunstmuseum, in dem Besucher Teil der Kunstwerke werden können, was zu lustigen und kreativen Fotos führt.","f":["Verfügt über mehrere Zonen mit unterschiedlichen Themen.","Die Gemälde erzeugen optische Täuschungen."]},"doi-tung-royal-villa-gardens-life-v2":{"i":"/poi-images/doi-tung-royal-villa-gardens-life-v2.webp","s":"Ein Projekt der verstorbenen Prinzessinmutter Srinagarindra, das einen wunderschönen Blumengarten, eine königliche Villa und Entwicklungsprojekte für die lokalen Bergvölker umfasst.","f":["Der Mae Fah Luang Garden ist berühmt für seine saisonalen Blumen.","Die königliche Villa ist im Schweizer Chalet-Stil gebaut."]},"phu-ruea-national-park-agriculture-v2":{"i":"/poi-images/phu-ruea-national-park-agriculture-v2.webp","s":"Bekannt für sein kühles Klima, ist diese Region ein Zentrum für den Anbau von gemäßigten Blumen wie Rosen und Lilien sowie für Weinberge.","f":["Wichtiger Lieferant von Blumen für den Markt in Bangkok.","Das Chateau de Loei ist ein bekanntes Weingut in der Gegend."]},"thale-noi-waterfowl-reserve-life-v2":{"i":"/poi-images/thale-noi-waterfowl-reserve-life-v2.webp","s":"Ein großes Feuchtgebiet im Norden des Songkhla-Sees, das ein Paradies für Vogelbeobachter ist und Tausenden von wandernden und heimischen Wasservögeln Schutz bietet.","f":["Teil des größeren Songkhla-See-Beckens.","Bedeckt mit Lotusblumen und anderer Wasserflora."]},"coro-field-ratchaburi-life-v2":{"i":"/poi-images/coro-field-ratchaburi-life-v2.webp","s":"Eine moderne Agrar-Tourismus-Farm in Ratchaburi, die sich auf den Anbau von hochwertigen japanischen Melonen und anderen Produkten konzentriert.","f":["Verwendet fortschrittliche landwirtschaftliche Technologien.","Besucher können an Pflanz- und Ernteaktivitäten teilnehmen."]},"sirindhorn-dinosaur-museum-life-v2":{"i":"/poi-images/sirindhorn-dinosaur-museum-life-v2.webp","s":"Ein geologisches Museum in der Provinz Kalasin, das sich auf Dinosaurierfossilien konzentriert, die in der Region gefunden wurden.","f":["Das erste Dinosaurier-Museum in Thailand.","Befindet sich an einer tatsächlichen Ausgrabungsstätte."]},"khao-yai-national-park-nature-v2":{"i":"/poi-images/khao-yai-national-park-nature-v2.webp","s":"Ein uralter Wald, der zum UNESCO-Weltkulturerbe gehört.","f":["Erster Nationalpark Thailands, gegründet 1962.","Heimat von über 300 Vogelarten."]},"doi-inthanon-national-park-nature-v2":{"i":"/poi-images/doi-inthanon-national-park-nature-v2.webp","s":"Bekannt als das 'Dach Thailands'.","f":["Enthält den höchsten Berg Thailands, Doi Inthanon.","Die Temperaturen können an der Spitze auf den Gefrierpunkt fallen."]},"erawan-national-park-nature-v2":{"i":"/poi-images/erawan-national-park-nature-v2.webp","s":"Berühmt für seinen siebenstufigen Wasserfall, der einem mythischen Elefanten ähnelt.","f":["Der Hauptanziehungspunkt ist der Erawan-Wasserfall.","Die Becken sind voller Fische, die an den Füßen der Schwimmer knabbern."]},"khao-sok-national-park-nature-v2":{"i":"/poi-images/khao-sok-national-park-nature-v2.webp","s":"Eine Landschaft aus hoch aufragenden Kalksteinfelsen und einem uralten Regenwald, der älter ist als der Amazonas.","f":["Enthält einen der ältesten Regenwälder der Welt.","Beherbergt die seltene Rafflesia-Blume, eine der größten der Welt."]},"mu-ko-similan-national-park-nature-v2":{"i":"/poi-images/     const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
