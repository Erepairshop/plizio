ekje."]},"yeongju-city-cities-v2":{"i":"/poi-images/yeongju-city-cities-v2.webp","s":"Un oraș cunoscut pentru istoria sa bogată confucianistă, Templul Buseoksa și specialitatea sa, ginsengul.","f":["Templul Buseoksa este renumit pentru sala sa principală din lemn.","Sosu Seowon este prima academie confucianistă din Coreea."]},"tongyeong-city-cities-v2":{"i":"/poi-images/tongyeong-city-cities-v2.webp","s":"Un oraș de coastă cunoscut drept 'Napoli al Coreei', renumit pentru peisajul său portuar frumos și legăturile cu amiralul Yi Sun-sin.","f":["Bază navală istorică sub amiralul Yi Sun-sin.","Satul Dongpirang este cunoscut pentru picturile sale murale."]},"sacheon-city-cities-v2":{"i":"/poi-images/sacheon-city-cities-v2.webp","s":"Un centru al industriei aerospațiale din Coreea și un oraș de coastă cu un pod pitoresc care leagă Insula Namhae.","f":["Sediul Korea Aerospace Industries (KAI).","Podul Samcheonpo este frumos luminat noaptea."]},"miryang-city-cities-v2":{"i":"/poi-images/miryang-city-cities-v2.webp","s":"Un oraș cunoscut pentru legenda lui Arang și Pavilionul Yeongnamnu, unul dintre cele mai frumoase pavilioane din Coreea.","f":["Pavilionul Yeongnamnu are vedere la râul Miryang.","Locul celebrului Festival Miryang Arirang."]},"ulsan-hyundai-heavy-industries-economic-v2":{"i":"/poi-images/ulsan-hyundai-heavy-industries-economic-v2.webp","s":"Cel mai mare șantier naval din lume, o piatră de temelie a economiei de export a Coreei de Sud.","f":["Fondat în 1972.","Produce supertancuri, transportoare de GNL și nave portcontainer."]},"busan-port-economic-v2":{"i":"/poi-images/busan-port-economic-v2.webp","s":"Cel mai mare port al Coreei de Sud și al șaselea cel mai mare port de containere din lume, o poartă vitală pentru comerțul global.","f":["Gestionează peste 75% din traficul de containere al Coreei de Sud.","Conectează peste 500 de porturi din 100 de țări."]},"posco-pohang-steel-works-economic-v2":{"i":"/poi-images/posco-pohang-steel-works-economic-v2.webp","s":"Una dintre cele mai mari și mai avansate oțelării din lume, un motor al dezvoltării industriale a Coreei de Sud.","f":["Fondat în 1968.","Cunoscut pentru eficiența sa ridicată și tehnologiile ecologice."]},"incheon-international-airport-economic-v2":{"i":"/poi-images/incheon-international-airport-economic-v2.webp","s":"Un centru global important pentru transportul aerian de marfă și poarta de intrare în Coreea de Sud, renumit pentru eficiența și facilitățile sale moderne.","f":["Unul dintre cele mai aglomerate aeroporturi din lume pentru transportul internațional de marfă.","Servește ca hub principal pentru Korean Air și Asiana Airlines."]},"gwangyang-port-economic-v2":{"i":"/poi-images/gwangyang-port-economic-v2.webp","s":"Un port strategic specializat în transportul de containere și oțel, deservind Oțelăria POSCO Gwangyang.","f":["Unul dintre cele mai mari porturi din Coreea de Sud.","Punct de transbordare important pentru produse din oțel."]},"samsung-digital-city-economic-v2":{"i":"/poi-images/samsung-digital-city-economic-v2.webp","s":"Sediul central și centrul de cercetare și dezvoltare al Samsung Electronics din Suwon, servind drept creierul gigantului tehnologic global.","f":["Găzduiește peste 35.000 de angajați.","Se concentrează pe dezvoltarea de smartphone-uri, semiconductori și alte tehnologii de ultimă generație."]},"hanul-nuclear-power-plant-economic-v2":{"i":"/poi-images/hanul-nuclear-power-plant-economic-v2.webp","s":"Una dintre cele mai mari centrale nucleare din lume, generând o parte semnificativă din electricitatea Coreei de Sud.","f":["Situată în provincia Gyeongsangbuk-do.","Operată de Korea Hydro & Nuclear Power."]},"sk-hynix-icheon-plant-economic-v2":{"i":"/poi-images/sk-hynix-icheon-plant-economic-v2.webp","s":"O unitate de producție majoră pentru SK Hynix, unul dintre cei mai importanți producători de memorii semiconductoare din lume.","f":["Specializată în memorii DRAM și NAND flash.","Contribuie semnificativ la poziția Coreei de Sud ca superputere în domeniul semiconductorilor."]},"dangjin-thermal-power-plant-economic-v2":{"i":"/poi-images/dangjin-thermal-power-plant-economic-v2.webp","s":"Cea mai mare termocentrală pe cărbune din Coreea de Sud, un producător major de electricitate, dar și subiectul unor dezbateri de mediu.","f":["Are o capacitate instalată de peste 6.000 MW.","Situată pe coasta de vest."]},"lg-chem-yeosu-plant-economic-v2":{"i":"/poi-images/lg-chem-yeosu-plant-economic-v2.webp","s":"Un complex petrochimic major care produce materii prime pentru o varietate de industrii, de la materiale plastice la baterii.","f":["Unul dintre cele mai mari situri de producție ale LG Chem.","Produce etilenă, propilenă și alte substanțe chimice."]},"gumi-electronics-complex-economic-v2":{"i":"/poi-images/gumi-electronics-complex-economic-v2.webp","s":"Unul dintre cele mai mari complexe industriale interioare din Coreea de Sud, axat pe producția de electronice, în special display-uri și dispozitive mobile.","f":["Găzduiește fabrici ale Samsung și LG.","Adesea denumit 'Silicon Valley' al Coreei."]},"pyeongtaek-port-economic-v2":{"i":"/poi-images/pyeongtaek-port-economic-v2.webp","s":"Un port în creștere rapidă, specializat în manipularea automobilelor și containerelor, situat în apropierea unor zone industriale majore.","f":["Port lider pentru exporturile de automobile din Coreea de Sud.","Deservește zona metropolitană Seul."]},"seosan-petrochemical-complex-economic-v2":{"i":"/poi-images/seosan-petrochemical-complex-economic-v2.webp","s":"Un alt centru petrochimic important din Coreea de Sud, care găzduiește companii precum Hanwha Total și Lotte Chemical.","f":["Produce o gamă largă de materiale plastice și produse chimice.","Beneficiază de locația sa de coastă pentru importul de materii prime."]},"kori-nuclear-power-plant-economic-v2":{"i":"/poi-images/kori-nuclear-power-plant-economic-v2.webp","s":"Prima centrală nucleară din Coreea de Sud, în funcțiune din 1978, punând bazele programului de energie nucleară al țării.","f":["Constă din mai multe reactoare de vârste diferite.","Cel mai vechi reactor a fost dezafectat în 2017."]},"changwon-machinery-industrial-complex-economic-v2":{"i":"/poi-images/changwon-machinery-industrial-complex-economic-v2.webp","s":"Un centru pentru industria de mașini din Coreea de Sud, producând o gamă largă de mașini de precizie și componente industriale.","f":["Planificat în anii 1970 ca un centru pentru industria grea.","Găzduiește companii precum Doosan și Hyundai Rotem."]},"taean-mine-economic-v2":{"i":"/poi-images/taean-mine-economic-v2.webp","s":"Deși exploatarea cărbunelui a scăzut în Coreea de Sud, această zonă reprezintă importanța istorică a mineritului pentru aprovizionarea cu energie a țării.","f":["Majoritatea minelor de cărbune din Coreea de Sud sunt acum închise.","Simbolizează tranziția către noi surse de energie."]},"pangyo-techno-valley-economic-v2":{"i":"/poi-images/pangyo-techno-valley-economic-v2.webp","s":"Un centru tehnologic modern care servește drept hub pentru IT, biotehnologie și alte industrii de înaltă tehnologie, adesea numit 'Silicon Valley' al Coreei.","f":["Situat în Seongnam, la sud de Seul.","Găzduiește sute de companii de tehnologie."]},"daesan-petrochemical-complex-economic-v2":{"i":"/poi-images/daesan-petrochemical-complex-economic-v2.webp","s":"Unul dintre cele trei mari complexe petrochimice de pe coasta de vest a Coreei de Sud, cu instalații majore de la Hyundai Oilbank, Hanwha Total și LG Chem.","f":["Un producător important de produse rafinate și chimice.","Situat strategic pentru comerțul cu China."]},"sihwa-lake-tidal-power-station-economic-v2":{"i":"/poi-images/sihwa-lake-tidal-power-station-economic-v2.webp","s":"Cea mai mare centrală mareomotrică din lume, un simbol al angajamentului Coreei de Sud față de energia regenerabilă.","f":["Utilizează forțele mareice de pe coasta de vest.","Are o capacitate instalată de 254 MW."]},"kia-hwaseong-plant-economic-v2":{"i":"/poi-images/kia-hwaseong-plant-economic-v2.webp","s":"Una dintre principalele unități de producție ale Kia Motors, care produce o gamă largă de vehicule pentru piețele interne și de export.","f":["Produce modele populare precum Sorento și Stinger.","Dispune de o pistă de testare proprie."]},"dmz-panmunjom-history-v2":{"i":"/poi-images/dmz-panmunjom-history-v2.webp","s":"O zonă tampon care divizează Peninsula Coreeană.","f":["Stabilită în 1953 după Războiul din Coreea.","Aproximativ 250 km lungime și 4 km lățime."]},"hwaseong-fortress-history-v2":{"i":"/poi-images/hwaseong-fortress-history-v2.webp","s":"O fortăreață impresionantă de la sfârșitul secolului al XVIII-lea în Suwon, care combină funcții militare, științifice și comerciale.","f":["Situl Patrimoniului Mondial UNESCO.","Construită de Regele Jeongjo."]},"seokguram-grotto-history-v2":{"i":"/poi-images/seokguram-grotto-history-v2.webp","s":"Un templu de piatră construit artificial pe Muntele Tohamsan, care adăpostește o statuie monumentală a lui Buddha.","f":["Parte a complexului Templului Bulguksa și sit al Patrimoniului Mondial UNESCO.","Statuia lui Buddha este orientată spre est, peste Marea Japoniei."]},"changdeokgung-palace-history-v2":{"i":"/poi-images/changdeokgung-palace-history-v2.webp","s":"Unul dintre cele Cinci Mari Palate, remarcat pentru integrarea sa armonioasă cu peisajul înconjurător.","f":["Situl Patrimoniului Mondial UNESCO.","Cel mai bine conservat dintre cele cinci palate din Seul."]},"gochang-dolmen-sites-history-v2":{"i":"/poi-images/gochang-dolmen-sites-history-v2.webp","s":"Cea mai mare și mai concentrată colecție de dolmene (morminte preistorice din piatră) din lume.","f":["Parte a Sitului Patrimoniului Mondial UNESCO Gochang, Hwasun și Ganghwa.","Peste 440 de dolmene au fost identificate în această zonă."]},"jongmyo-shrine-history-v2":{"i":"/poi-images/jongmyo-shrine-history-v2.webp","s":"Principalul sanctuar confucianist dedicat tăblițelor memoriale ale regilor și reginelor dinastiei Joseon.","f":["Situl Patrimoniului Mondial UNESCO.","Jongmyo Jeryeak, muzica ritualică, este un Patrimoniu Cultural Imaterial."]},"war-memorial-of-korea-history-v2":{"i":"/poi-images/war-memorial-of-korea-history-v2.webp","s":"Un muzeu masiv și un memorial din Seul, care documentează istoria militară a Coreei și îi comemorează pe cei care au luptat în războaiele națiunii.","f":["Deschis în 1994 pe fostul amplasament al sediului armatei.","Expoziția în aer liber prezintă avioane militare și tancuri."]},"haedong-yonggungsa-temple-history-v2":{"i":"/poi-images/haedong-yonggungsa-temple-history-v2.webp","s":"Unul dintre puținele temple din Coreea situate chiar pe coastă.","f":["Construit inițial în secolul al XIV-lea, în timpul dinastiei Goryeo.","Numele înseamnă 'Templul Palatului Dragonului Coreean'."]},"seodaemun-prison-history-v2":{"i":"/poi-images/seodaemun-prison-history-v2.webp","s":"O fostă închisoare construită în timpul perioadei coloniale japoneze.","f":["Construită în 1908.","Mulți luptători pentru independență, inclusiv Ryu Gwansun, au fost închiși și torturați aici."]},"independence-hall-korea-history-v2":{"i":"/poi-images/independence-hall-korea-history-v2.webp","s":"Un complex uriaș dedicat mișcării de independență a Coreei împotriva stăpânirii japoneze.","f":["Deschisă la 15 august 1987, la aniversarea eliberării.","Marea Sală a Națiunii este o piesă impunătoare de arhitectură tradițională."]},"mireuksa-temple-site-history-v2":{"i":"/poi-images/mireuksa-temple-site-history-v2.webp","s":"Ruinele celui mai mare templu budist din vechiul Regat Baekje.","f":["Parte a Sitului Patrimoniului Mondial UNESCO al Zonelor Istorice Baekje.","Pagoda de piatră a fost construită în secolul al VII-lea."]},"royal-tombs-joseon-dynasty-history-v2":{"i":"/poi-images/royal-tombs-joseon-dynasty-history-v2.webp","s":"O colecție de peste 40 de morminte, răspândite în 18 locații, dedicate regilor, reginelor și membrilor onorați ai dinastiei Joseon.","f":["Situl Patrimoniului Mondial UNESCO.","Mormintele au fost construite pe o perioadă de 500 de ani."]},"naganeupseong-folk-village-history-v2":{"i":"/poi-images/naganeupseong-folk-village-history-v2.webp","s":"Un oraș-fortăreață bine conservat din dinastia Joseon.","f":["Pe lista indicativă a Patrimoniului Mondial UNESCO.","Casele cu acoperiș de paie și zidurile de piatră sunt originale."]},"cheomseongdae-observatory-history-v2":{"i":"/poi-images/cheomseongdae-observatory-history-v2.webp","s":"Cel mai vechi observator astronomic existent din Asia de Est.","f":["Comoară Națională a Coreei.","Înseamnă 'platformă de observare a stelelor'."]},"turtle-ship-replica-history-v2":{"i":"/poi-images/turtle-ship-replica-history-v2.webp","s":"O replică a celebrei nave de război folosite de amiralul Yi Sun-sin în timpul Războaielor Imjin din secolul al XVI-lea.","f":["Prima navă blindată din lume.","Acoperișul era acoperit cu țepi de fier pentru a descuraja abordajul inamic."]},"battle-of-myeongnyang-site-history-v2":{"i":"/poi-images/battle-of-myeongnyang-site-history-v2.webp","s":"Strâmtoarea unde amiralul Yi Sun-sin a obținut o victorie miraculoasă cu doar 13 nave împotriva unei flote japoneze de peste 130 de nave în 1597.","f":["Curenții rapizi ai strâmtorii au jucat un rol crucial în strategia lui Yi.","Considerată una dintre cele mai mari victorii navale din istorie."]},"goryeo-celadon-museum-history-v2":{"i":"/poi-images/goryeo-celadon-museum-history-v2.webp","s":"Situat în Gangjin, acest muzeu este dedicat ceramicii celadon rafinate din dinastia Goryeo.","f":["Celadonul Goryeo este renumit pentru glazura sa unică de culoare albastru-verde.","Tehnica de incrustare Sanggam a fost o inovație a olarilor Goryeo."]},"hansan-island-history-v2":{"i":"/poi-images/hansan-island-history-v2.webp","s":"Locul faimoasei Bătălii de pe Insula Hansan din 1592, unde flota amiralului Yi Sun-sin a folosit o formațiune de 'aripă de cocor' pentru a învinge decisiv marina japoneză.","f":["Una dintre cele trei mari victorii din timpul Războaielor Imjin.","Victoria a perturbat grav liniile de aprovizionare japoneze."]},"gyeongbokgung-palace-landmarks-v2":{"i":"/poi-images/gyeongbokgung-palace-landmarks-v2.webp","s":"Palatul Gyeongbokgung, situat în Seul, a fost principalul palat regal al dinastiei Joseon și este un simbol iconic al istoriei și arhitecturii coreene.","f":["Construit în 1395.","Cel mai mare dintre cele Cinci Mari Palate."]},"n-seoul-tower-landmarks-v2":{"i":"/poi-images/n-seoul-tower-landmarks-v2.webp","s":"Turnul N din Seul, situat pe Muntele Namsan, oferă vederi panoramice ale orașului și este un loc popular atât pentru localnici, cât și pentru turiști.","f":["Deschis în 1980.","Un turn de comunicații și observație."]},"bukchon-hanok-village-landmarks-v2":{"i":"/poi-images/bukchon-hanok-village-landmarks-v2.webp","s":"Un sat tradițional coreean în inima Seulului, care păstrează sute de case tradiționale, numite hanok.","f":["Datează din timpul dinastiei Joseon.","O atracție turistică populară."]},"dmz-korea-landmarks-v2":{"i":"/poi-images/dmz-korea-landmarks-v2.webp","s":"Zona tampon dintre Coreea de Nord și Coreea de Sud.","f":["Stabilită în 1953 după Războiul Coreean.","Aproximativ 250 de kilometri lungime."]},"haedong-yonggungsa-temple-landmarks-v2":{"i":"/poi-images/haedong-yonggungsa-temple-landmarks-v2.webp","s":"Un templu budist rar din Busan, construit pe malul mării, spre deosebire de majoritatea care sunt situate în munți.","f":["Construit inițial în 1376.","Oferă o vedere spectaculoasă la răsărit."]},"bulguksa-temple-landmarks-v2":{"i":"/poi-images/bulguksa-temple-landmarks-v2.webp","s":"Un templu budist principal al Ordinului Jogye din Gyeongju, considerat o capodoperă a epocii de aur a artei budiste din Regatul Silla.","f":["Include șapte comori naționale ale Coreei de Sud.","Situl Patrimoniului Mondial UNESCO."]},"jeju-island-landmarks-v2":{"i":"/poi-images/jeju-island-landmarks-v2.webp","s":"Cea mai mare insulă din Coreea de Sud, cunoscută pentru peisajul său vulcanic de cratere și tuburi de lavă.","f":["Găzduiește Hallasan, cel mai înalt munte din Coreea de Sud.","Situl Patrimoniului Natural Mondial UNESCO."]},"seoraksan-national-park-landmarks-v2":{"i":"/poi-images/seoraksan-national-park-landmarks-v2.webp","s":"Găzduiește al treilea cel mai înalt munte din Coreea de Sud, Seoraksan.","f":["Rezervație a Biosferei UNESCO.","Cel mai înalt vârf este Daecheongbong (1.708m)."]},"hwaseong-fortress-landmarks-v2":{"i":"/poi-images/hwaseong-fortress-landmarks-v2.webp","s":"O fortăreață impresionantă din secolul al XVIII-lea în Suwon, care înconjoară orașul și combină funcții militare, științifice și comerciale.","f":["Situl Patrimoniului Mondial UNESCO.","Construită între 1794 și 1796."]},"gwanghwamun-gate-landmarks-v2":{"i":"/poi-images/gwanghwamun-gate-landmarks-v2.webp","s":"Poarta principală și cea mai mare a Palatului Gyeongbokgung din Seul.","f":["Construită inițial în 1395.","Distrusă și reconstruită de mai multe ori."]},"lotte-world-tower-landmarks-v2":{"i":"/poi-images/lotte-world-tower-landmarks-v2.webp","s":"Un zgârie-nori cu 123 de etaje situat în Seul.","f":["Deschis în 2017.","Înălțime de 555 de metri."]},"gamcheon-culture-village-landmarks-v2":{"i":"/poi-images/gamcheon-culture-village-landmarks-v2.webp","s":"Un sat colorat și artistic din Busan, cunoscut pentru străzile sale abrupte, aleile întortocheate și casele viu colorate.","f":["Format în anii 1950 ca o așezare pentru refugiații din Războiul Coreean.","Revitalizat ca centru de artă și cultură în 2009."]},"jeonju-hanok-village-landmarks-v2":{"i":"/poi-images/jeonju-hanok-village-landmarks-v2.webp","s":"Situat în orașul Jeonju, are peste 800 de case tradiționale coreene hanok.","f":["Renumit pentru mâncarea tradițională coreeană, cum ar fi Bibimbap.","Multe hanok-uri au fost transformate în pensiuni, restaurante și ceainării."]},"dongdaemun-design-plaza-landmarks-v2":{"i":"/poi-images/dongdaemun-design-plaza-landmarks-v2.webp","s":"Un punct de reper major al dezvoltării urbane în Seul, cu un design neofuturist distinctiv, proiectat de Zaha Hadid.","f":["Deschis în 2014.","Un centru pentru design, artă, modă și tehnologie."]},"boseong-green-tea-fields-landmarks-v2":{"i":"/poi-images/boseong-green-tea-fields-landmarks-v2.webp","s":"Plantații de ceai spectaculoase și întinse în Boseong, renumite pentru producția de ceai verde de înaltă calitate.","f":["Aproximativ 40% din ceaiul verde coreean este produs aici.","Peisaje frumoase, adesea folosite ca locații de filmare pentru drame și filme."]},"cheongsando-island-landmarks-v2":{"i":"/poi-images/cheongsando-island-landmarks-v2.webp","s":"Desemnată ca primul 'Oraș Lent' din Asia, este un loc unde modul de viață tradițional și natura nealterată sunt păstrate.","f":["Renumită pentru câmpurile sale de orz și rapiță.","Are trasee de mers pe jos numite 'Drumuri Lente'."]},"naganeupseong-folk-village-landmarks-v2":{"i":"/poi-images/naganeupseong-folk-village-landmarks-v2.webp","s":"Un oraș fortificat din dinastia Joseon, remarcabil de bine conservat, unde locuitorii încă trăiesc în case cu acoperiș de paie.","f":["Inscris pe lista tentativă a Patrimoniului Mondial UNESCO.","Zidul original al fortăreței are peste 1,4 km lungime."]},"seoraksan-national-park-life-v2":{"i":"/poi-images/seoraksan-national-park-life-v2.webp","s":"Un parc național din provincia Gangwon, renumit pentru munții săi pitorești, cascade și specii rare de animale.","f":["Rezervație a biosferei UNESCO","Adăpostește gorali și cocori Manciurieni"]},"boseong-green-tea-fields-life-v2":{"i":"/poi-images/boseong-green-tea-fields-life-v2.webp","s":"Cele mai mari și mai vechi plantații de ceai din Coreea de Sud, cunoscute pentru câmpurile lor terasate și ceaiul verde de înaltă calitate.","f":["Aproximativ 40% din ceaiul verde coreean este produs aici","Locație de filmare pentru multe drame coreene"]},"nami-island-life-v2":{"i":"/poi-images/nami-island-life-v2.webp","s":"O insulă în formă de semilună în Chuncheon, faimoasă pentru aleil function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
