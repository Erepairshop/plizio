uring, especially displays and mobile devices.","f":["Home to factories from Samsung and LG.","Often called the 'Silicon Valley' of Korea."]},"pyeongtaek-port-economic-v2":{"i":"/poi-images/pyeongtaek-port-economic-v2.webp","s":"A rapidly growing port specializing in automobile and container handling, located near major industrial areas.","f":["Leading port for automobile exports in South Korea.","Serves the Seoul metropolitan area."]},"seosan-petrochemical-complex-economic-v2":{"i":"/poi-images/seosan-petrochemical-complex-economic-v2.webp","s":"Another major petrochemical hub in South Korea, home to companies like Hanwha Total and Lotte Chemical.","f":["Produces a wide range of plastics and chemicals.","Benefits from its coastal location for importing raw materials."]},"kori-nuclear-power-plant-economic-v2":{"i":"/poi-images/kori-nuclear-power-plant-economic-v2.webp","s":"South Korea's first nuclear power plant, operating since 1978 and laying the foundation for the country's nuclear energy program.","f":["Consists of multiple reactors of different ages.","The oldest reactor was decommissioned in 2017."]},"changwon-machinery-industrial-complex-economic-v2":{"i":"/poi-images/changwon-machinery-industrial-complex-economic-v2.webp","s":"A hub for South Korea's machinery industry, producing a wide range of precision machinery and industrial components.","f":["Planned in the 1970s as a center for heavy industry.","Hosts companies like Doosan and Hyundai Rotem."]},"taean-mine-economic-v2":{"i":"/poi-images/taean-mine-economic-v2.webp","s":"Although coal mining has declined in South Korea, this area represents the historical importance of mining for the country's energy supply.","f":["Most coal mines in South Korea are now closed.","Symbolizes the transition to new energy sources."]},"pangyo-techno-valley-economic-v2":{"i":"/poi-images/pangyo-techno-valley-economic-v2.webp","s":"A modern technology hub serving as a center for IT, biotechnology, and other high-tech industries, often referred to as Korea's 'Silicon Valley'.","f":["Located in Seongnam, south of Seoul.","Hosts hundreds of technology companies."]},"daesan-petrochemical-complex-economic-v2":{"i":"/poi-images/daesan-petrochemical-complex-economic-v2.webp","s":"One of the three major petrochemical complexes on the west coast of South Korea, with major facilities from Hyundai Oilbank, Hanwha Total, and LG Chem.","f":["A major producer of refined products and chemicals.","Strategically located for trade with China."]},"sihwa-lake-tidal-power-station-economic-v2":{"i":"/poi-images/sihwa-lake-tidal-power-station-economic-v2.webp","s":"The world's largest tidal power station, a symbol of South Korea's commitment to renewable energy.","f":["Utilizes the tidal forces of the west coast.","Has an installed capacity of 254 MW."]},"kia-hwaseong-plant-economic-v2":{"i":"/poi-images/kia-hwaseong-plant-economic-v2.webp","s":"One of Kia Motors' main production facilities, manufacturing a wide range of vehicles for domestic and export markets.","f":["Produces popular models like the Sorento and the Stinger.","Has its own test track."]},"dmz-panmunjom-history-v2":{"i":"/poi-images/dmz-panmunjom-history-v2.webp","s":"A buffer zone that divides the Korean Peninsula.","f":["Established in 1953 after the Korean War.","Approximately 250km long and 4km wide."]},"hwaseong-fortress-history-v2":{"i":"/poi-images/hwaseong-fortress-history-v2.webp","s":"An impressive late 18th-century fortress in Suwon, combining military, scientific, and commercial functions.","f":["UNESCO World Heritage Site.","Built by King Jeongjo."]},"seokguram-grotto-history-v2":{"i":"/poi-images/seokguram-grotto-history-v2.webp","s":"An artificially created stone temple on Mount Tohamsan, housing a monumental Buddha statue.","f":["Part of the Bulguksa temple complex and a UNESCO World Heritage site.","The Buddha statue faces east over the Sea of Japan."]},"changdeokgung-palace-history-v2":{"i":"/poi-images/changdeokgung-palace-history-v2.webp","s":"One of the Five Grand Palaces, noted for its harmonious integration with the surrounding landscape.","f":["UNESCO World Heritage Site.","The most well-preserved of the five palaces in Seoul."]},"gochang-dolmen-sites-history-v2":{"i":"/poi-images/gochang-dolmen-sites-history-v2.webp","s":"The largest and most concentrated collection of dolmens (prehistoric stone tombs) in the world.","f":["Part of the Gochang, Hwasun and Ganghwa UNESCO World Heritage site.","Over 440 dolmens have been identified in this area."]},"jongmyo-shrine-history-v2":{"i":"/poi-images/jongmyo-shrine-history-v2.webp","s":"The supreme Confucian shrine dedicated to the memorial tablets of the kings and queens of the Joseon Dynasty.","f":["UNESCO World Heritage Site.","The Jongmyo Jeryeak, the ritual music, is an Intangible Cultural Heritage."]},"war-memorial-of-korea-history-v2":{"i":"/poi-images/war-memorial-of-korea-history-v2.webp","s":"A massive museum and memorial in Seoul, documenting Korea's military history and commemorating those who fought in the nation's wars.","f":["Opened in 1994 on the former site of the army headquarters.","The outdoor exhibition displays military aircraft and tanks."]},"haedong-yonggungsa-temple-history-v2":{"i":"/poi-images/haedong-yonggungsa-temple-history-v2.webp","s":"One of the few temples in Korea situated right on the coastline.","f":["Originally built in the 14th century during the Goryeo Dynasty.","The name means 'Korean Dragon Palace Temple'."]},"seodaemun-prison-history-v2":{"i":"/poi-images/seodaemun-prison-history-v2.webp","s":"A former prison built during the Japanese colonial period.","f":["Built in 1908.","Many independence activists, including Ryu Gwansun, were imprisoned and tortured here."]},"independence-hall-korea-history-v2":{"i":"/poi-images/independence-hall-korea-history-v2.webp","s":"A huge complex dedicated to the Korean independence movement against Japanese rule.","f":["Opened on August 15, 1987, the anniversary of liberation.","The Grand Hall of the Nation is a towering piece of traditional architecture."]},"mireuksa-temple-site-history-v2":{"i":"/poi-images/mireuksa-temple-site-history-v2.webp","s":"The ruins of the largest Buddhist temple of the ancient Baekje Kingdom.","f":["Part of the Baekje Historic Areas UNESCO World Heritage site.","The stone pagoda was built in the 7th century."]},"royal-tombs-joseon-dynasty-history-v2":{"i":"/poi-images/royal-tombs-joseon-dynasty-history-v2.webp","s":"A collection of over 40 tombs spread across 18 locations, dedicated to the kings, queens, and honored members of the Joseon Dynasty.","f":["UNESCO World Heritage Site.","The tombs were built over a period of 500 years."]},"naganeupseong-folk-village-history-v2":{"i":"/poi-images/naganeupseong-folk-village-history-v2.webp","s":"A well-preserved fortress town from the Joseon Dynasty.","f":["On the tentative list for UNESCO World Heritage.","The thatched-roof houses and stone walls are original."]},"cheomseongdae-observatory-history-v2":{"i":"/poi-images/cheomseongdae-observatory-history-v2.webp","s":"The oldest surviving astronomical observatory in East Asia.","f":["A National Treasure of Korea.","Means 'star-gazing platform'."]},"turtle-ship-replica-history-v2":{"i":"/poi-images/turtle-ship-replica-history-v2.webp","s":"A replica of the famous warship used by Admiral Yi Sun-sin during the Imjin Wars in the 16th century.","f":["The world's first ironclad armored ship.","The roof was covered with iron spikes to deter enemy boarding."]},"battle-of-myeongnyang-site-history-v2":{"i":"/poi-images/battle-of-myeongnyang-site-history-v2.webp","s":"The strait where Admiral Yi Sun-sin achieved a miraculous victory with just 13 ships against a Japanese fleet of over 130 in 1597.","f":["The strait's rapid tides played a crucial role in Yi's strategy.","Considered one of the greatest naval victories in history."]},"goryeo-celadon-museum-history-v2":{"i":"/poi-images/goryeo-celadon-museum-history-v2 es about 40% of Korea's green tea","A filming location for many Korean dramas"]},"nami-island-life-v2":{"i":"/poi-images/nami-island-life-v2.webp","s":"A half-moon shaped island in Chuncheon, famous for its beautiful tree-lined paths and as the filming location of the drama 'Winter Sonata'.","f":["Declared itself a 'cultural republic' in 2006","No telephone poles on the island (all wires are underground)"]},"suncheon-bay-wetlands-life-v2":{"i":"/poi-images/suncheon-bay-wetlands-life-v2.webp","s":"One of the world's largest coastal wetlands, home to vast reed fields and a major habitat for migratory birds.","f":["Home to the rare hooded crane","First Korean coastal area on the Ramsar list"]},"jeju-loveland-life-v2":{"i":"/poi-images/jeju-loveland-life-v2.webp","s":"A sculpture park on Jeju Island themed around eroticism and sexuality, created by art students.","f":["Features over 140 sculptures","Visitors must be at least 18 years old"]},"seoul-childrens-grand-park-life-v2":{"i":"/poi-images/seoul-childrens-grand-park-life-v2.webp","s":"A large park in Seoul that includes a zoo, botanical garden, amusement park, and various performance venues.","f":["Free admission to the park","Houses over 4,000 animals of 400 species"]},"ujong-rice-terraces-life-v2":{"i":"/poi-images/ujong-rice-terraces-life-v2.webp","s":"Beautiful rice terraces carved into the mountains, showcasing traditional farming methods in the Gangwon region.","f":["A popular subject for photographers","Demonstrates the harmony of man and nature"]},"jirisan-national-park-life-v2":{"i":"/poi-images/jirisan-national-park-life-v2.webp","s":"The first and largest national park in South Korea, home to diverse flora and fauna, including the Asiatic black bear.","f":["Spans across three provinces","The name means 'Mountain of the odd and wise people'"]},"everland-resort-life-v2":{"i":"/poi-images/everland-resort-life-v2.webp","s":"South Korea's largest theme park, featuring rides, a zoo called Zootopia, and a water ju-lake-eco-park-nature-v2":{"i":"/poi-images/gwangju-lake-eco-park-nature-v2.webp","s":"An ecological park by Gwangju Lake that highlights the importance of wetlands and water resources, providing a peaceful retreat.","f":["Includes wooden boardwalks through reed beds.","An important site for environmental education."]},"sogni-mountain-nature-v2":{"i":"/poi-images/sogni-mountain-nature-v2.webp","s":"A mountain in Songnisan National Park, its name meaning 'mountain that leaves the secular world'.","f":["Beopjusa Temple houses a massive gilt-bronze Buddha statue.","The main peak is Cheonwangbong (1,058m)."]},"seoul-forest-nature-v2":{"i":"/poi-images/seoul-forest-nature-v2.webp","s":"A large park in Seoul consisting of five distinct theme parks.","f":["Opened in 2005 as a 'gift' to the citizens.","Has a Culture & Arts Park, an Eco Forest, and a wetlands area."]},"ujin-geopark-nature-v2":{"i":"/poi-images/ujin-geopark-nature-v2.webp","s":"A geopark on the east coast showcasing geological sites like Seongryu Cave, a massive limestone cave.","f":["Seongryu Cave is approximately 250 million years old.","The park includes valleys, waterfalls, and coastal formations."]},"naejangsan-national-park-nature-v2":{"i":"/poi-images/naejangsan-national-park-nature-v2.webp","s":"Famous as one of the best places in Korea to see autumn foliage.","f":["The park is covered in crimson leaves in autumn.","Includes the Naejangsa and Baegyangsa temples."]},"guryong-valley-nature-v2":{"i":"/poi-images/guryong-valley-nature-v2.webp","s":"A scenic valley at the foot of Jirisan Mountain, renowned for its nine waterfalls and ponds known as 'Guryongpokpo'.","f":["Guryong means 'Nine Dragons'.","Legend says nine dragons lived here and ascended to heaven."]},"anmyeon-island-nature-v2":{"i":"/poi-images/anmyeon-island-nature-v2.webp","s":"The sixth largest island in Korea, connected to the mainland by a bridge.","f":["Kkotji Beach is famous for its sunsets.","Anmyeondo Recreational Forest has unique alley within Deogyusan National Park, stretching for 25 kilometers and known for its clear water and lush vegetation.","f":["The name means '9,000 turns', describing its length and complexity.","Home to 33 designated scenic spots along the valley."]},"daegwallyeong-plateau-relief-v2":{"i":"/poi-images/daegwallyeong-plateau-relief-v2.webp","s":"A high plateau in Gangwon province, renowned for its sheep farms, wind farms, and heavy winter snowfall, earning it the nickname 'Alps of Korea'.","f":["Located at about 800 meters above sea level.","The Daegwallyeong Sheep Farm is a major tourist attraction."]},"sobaek-mountains-relief-v2":{"i":"/poi-images/sobaek-mountains-relief-v2.webp","s":"A major mountain range branching from the Taebaek mountains and extending to Jirisan, encompassing several national parks and high peaks.","f":["Includes Sobaeksan National Park and Woraksan National Park.","The highest peak is Birobong at 1,439 meters."]},"byeonsan-peninsula-coast-relief-v2":{"i":"/poi-images/byeonsan-peninsula-coast-relief-v2.webp","s":"The coast of Byeonsanbando National Park features a unique landscape of sea cliffs, unusual rock formations, and wide tidal flats.","f":["Chaeseokgang Cliffs look like thousands of stacked books.","The only national park in Korea that comprises both mountains and sea."]},"palgongsan-mountain-relief-v2":{"i":"/poi-images/palgongsan-mountain-relief-v2.webp","s":"A sacred mountain near Daegu, home to many Buddhist temples and statues, including the famous Gatbawi Buddha.","f":["The main peak is Birobong at 1,192 meters.","The Gatbawi Buddha is a 9th-century stone statue known for granting wishes."]},"cheorwon-plain-relief-v2":{"i":"/poi-images/cheorwon-plain-relief-v2.webp","s":"A large lava plain near the DMZ, formed by volcanic activity.","f":["Known for Cheorwon Odae rice.","An important wintering spot for migratory birds like cranes."]},"ulleungdo-island-coast-relief-v2":{"i":"/poi-images/ulleungdo-island-coast-relief-v2.webp","s":"A const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=6;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry","other"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
