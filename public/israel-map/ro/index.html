const POI_CARD={"jerusalem-cities-v2":{"i":"/poi-images/jerusalem-cities-v2.webp","s":"Ierusalim este capitala Israelului și una dintre cele mai vechi așezări din lume, sfântă pentru trei religii monoteiste.","f":["Sfântă pentru iudaism, creștinism și islam.","Situată în Munții Iudeei."]},"tel-aviv-cities-v2":{"i":"/poi-images/tel-aviv-cities-v2.webp","s":"Tel Aviv este centrul economic și tehnologic al Israelului, renumit pentru viața de noapte vibrantă și plaje.","f":["Fondată în 1909 la periferia orașului Jaffa.","Cunoscută ca Orașul Alb pentru arhitectura Bauhaus."]},"haifa-cities-v2":{"i":"/poi-images/haifa-cities-v2.webp","s":"Haifa este al treilea oraș ca mărime din Israel, situat pitoresc pe versanții Muntelui Carmel, la Marea Mediterană.","f":["Găzduiește Centrul Mondial Bahá'í.","Principalul port maritim al Israelului."]},"rishon-lezion-cities-v2":{"i":"/poi-images/rishon-lezion-cities-v2.webp","s":"Rishon LeZion este al patrulea oraș ca mărime din Israel, situat în câmpia de coastă centrală, la sud de Tel Aviv.","f":["Fondat în 1882 de imigranți evrei.","Numele înseamnă Primul în Sion."]},"petah-tikva-cities-v2":{"i":"/poi-images/petah-tikva-cities-v2.webp","s":"Petah Tikva, cunoscută ca Mama așezărilor Moshavot, este un important oraș industrial la est de Tel Aviv.","f":["Fondat în 1878 ca așezare agricolă.","Un centru proeminent industrial și de înaltă tehnologie."]},"ashdod-cities-v2":{"i":"/poi-images/ashdod-cities-v2.webp","s":"Așdod este un important oraș de coastă și cel mai mare port din Israel, manipulând majoritatea mărfurilor din țară.","f":["Considerat unul dintre cele mai vechi orașe din lume.","Orașul modern a fost fondat în 1956."]},"netanya-cities-v2":{"i":"/poi-images/netanya-cities-v2.webp","s":"Netanya este o stațiune populară pe coasta Mării Mediterane, renumită pentru plajele sale lungi și frumoase.","f":["Numit după filantropul Nathan Straus.","O destinație turistică majoră."]},"beersheba-cities-v2":{"i":"/poi-images/beersheba-cities-v2.webp","s":"Beer Șeva este cel mai mare oraș din deșertul Negev, deseori numit capitala regiunii de sud a Israelului.","f":["Găzduiește Universitatea Ben-Gurion.","Are rădăcini care datează din vremuri biblice."]},"bnei-brak-cities-v2":{"i":"/poi-images/bnei-brak-cities-v2.webp","s":"Bnei Brak este un oraș dens populat la est de Tel Aviv, recunoscut ca un centru major al iudaismului ultraortodox.","f":["Unul dintre cele mai dens populate orașe din Israel.","Centrul culturii evreiești ortodoxe."]},"holon-cities-v2":{"i":"/poi-images/holon-cities-v2.webp","s":"Holon este un oraș pe fâșia de coastă centrală, cunoscut pentru accentul puternic pus pe muzee și activități de familie.","f":["Deseori numit Orașul Copiilor.","Găzduiește Design Museum Holon."]},"ramat-gan-cities-v2":{"i":"/poi-images/ramat-gan-cities-v2.webp","s":"Ramat Gan este un oraș învecinat cu Tel Aviv, unde se află Bursa de Diamante din Israel și înalți zgârie-nori.","f":["Numele se traduce prin Înălțimile Grădinii.","Are unele dintre cele mai înalte clădiri din Israel."]},"rehovot-cities-v2":{"i":"/poi-images/rehovot-cities-v2.webp","s":"Rehovot este un important centru științific și tehnologic din Districtul Central, cunoscut pentru instituțiile sale academice.","f":["Găzduiește Institutul de Științe Weizmann.","Primul președinte, Chaim Weizmann, a trăit aici."]},"ashkelon-cities-v2":{"i":"/poi-images/ashkelon-cities-v2.webp","s":"Așkelon este un oraș de coastă din Districtul de Sud, cu o istorie bogată care se întinde pe milenii.","f":["Dispune de un vechi port maritim.","Are un mare parc național cu ruine antice."]},"bat-yam-cities-v2":{"i":"/poi-images/bat-yam-cities-v2.webp","s":"Bat Yam este un oraș situat la Marea Mediterană, imediat la sud de Tel Aviv, cunoscut pentru promenada sa pe plajă.","f":["Numele înseamnă Fiica Mării.","Cunoscut pentru promenada sa lungă de pe coastă."]},"beit-shemesh-cities-v2":{"i":"/poi-images/beit-shemesh-cities-v2.webp","s":"Beit Șemeș este un oraș cu o creștere rapidă la vest de Ierusalim, situat în istorica Vale a Elah.","f":["Menționat în Biblia ebraică.","A cunoscut o creștere rapidă din anii 1990."]},"kfar-saba-cities-v2":{"i":"/poi-images/kfar-saba-cities-v2.webp","s":"Kfar Saba este un oraș vibrant în regiunea Sharon, recunoscut pentru calitatea ridicată a vieții și spațiile verzi.","f":["Numele înseamnă Satul Bunicului.","A fost înființat în 1903."]},"herzliya-cities-v2":{"i":"/poi-images/herzliya-cities-v2.webp","s":"Herzliya este un oraș prosper pe coasta centrală, faimos pentru marina sa și sectorul de înaltă tehnologie în plină expansiune.","f":["Numit după Theodor Herzl.","Găzduiește multe ambasade străine."]},"hadera-cities-v2":{"i":"/poi-images/hadera-cities-v2.webp","s":"Hadera este un oraș din Districtul Haifa, care leagă câmpia de coastă cu mai multe rezervații naturale diverse.","f":["Înființat în anul 1891.","Cunoscut pentru centrala electrică Orot Rabin."]},"modiin-cities-v2":{"i":"/poi-images/modiin-cities-v2.webp","s":"Modi'in este un oraș modern, meticulos planificat, situat la jumătatea distanței dintre Tel Aviv și Ierusalim.","f":["Recunoscut pentru planificarea sa urbană de înaltă calitate.","A fost fondat recent, în 1993."]},"nazareth-cities-v2":{"i":"/poi-images/nazareth-cities-v2.webp","s":"Nazaret este cel mai mare oraș arab din Israel și are o importanță imensă ca loc de pelerinaj creștin.","f":["Descris ca fiind casa din copilărie a lui Isus.","Găzduiește Bazilica Bunei Vestiri."]},"lod-cities-v2":{"i":"/poi-images/lod-cities-v2.webp","s":"Lod este un oraș la sud-est de Tel Aviv, servind ca un important nod de transport pentru întreaga țară.","f":["Găzduiește Aeroportul Internațional Ben Gurion.","Un oraș antic care datează de mii de ani."]},"ramla-cities-v2":{"i":"/poi-images/ramla-cities-v2.webp","s":"Ramla este un oraș istoric din centrul Israelului, fondat în mod unic în perioada islamică timpurie.","f":["Fondat în jurul anului 716 d.Hr.","Cunoscut pentru Piscina Arcurilor."]},"raanana-cities-v2":{"i":"/poi-images/raanana-cities-v2.webp","s":"Ra'anana este un oraș din sudul câmpiei Sharon, apreciat pentru mediul său verde și comunitatea mare de imigranți.","f":["Găzduiește mulți imigranți din țări vorbitoare de engleză.","Are un important parc industrial de înaltă tehnologie."]},"rahat-cities-v2":{"i":"/poi-images/rahat-cities-v2.webp","s":"Rahat este un oraș populat majoritar de beduini în nordul Negevului și cea mai mare așezare beduină din lume.","f":["Înființat în 1972 ca un oraș planificat.","Singura municipalitate beduină cu statut de oraș."]},"hod-hasharon-cities-v2":{"i":"/poi-images/hod-hasharon-cities-v2.webp","s":"Hod HaSharon este un oraș cu o dezvoltare rapidă din Districtul Central, caracterizat printr-o atmosferă rurală în mijlocul creșterii urbane.","f":["Format prin fuziunea a patru sate agricole.","Numele înseamnă Splendoarea Sharonului."]},"kiryat-ata-cities-v2":{"i":"/poi-images/kiryat-ata-cities-v2.webp","s":"Kiryat Ata este un oraș semnificativ din Districtul Haifa, fondat inițial de o organizație evreiască poloneză.","f":["Cel mai mare oraș din regiunea Krayot.","A fost înființat în anul 1925."]},"nahariya-cities-v2":{"i":"/poi-images/nahariya-cities-v2.webp","s":"Nahariya este cel mai nordic oraș de coastă din Israel, servind ca o destinație populară pentru vacanțele de vară.","f":["Fondat în 1935 de imigranți evrei germani.","Are o promenadă pitorească de-a lungul râului Ga'aton."]},"eilat-cities-v2":{"i":"/poi-images/eilat-cities-v2.webp","s":"Eilat este cel mai sudic oraș al Israelului, un port aglomerat și o stațiune populară în vârful nordic al Mării Roșii.","f":["Cunoscut pentru recifele sale de corali și locurile de scufundări.","Are un climat de deșert fierbinte."]},"afula-cities-v2":{"i":"/poi-images/afula-cities-v2.webp","s":"Afula este adesea cunoscută ca fiind capitala Văii Izreel, situată în Districtul de Nord al Israelului.","f":["A fost fondată în 1925 ca o așezare modernă.","Un important nod de transport regional."]},"tiberias-cities-v2":{"i":"/poi-images/tiberias-cities-v2.webp","s":"Tiberias este un oraș antic pe țărmul vestic al Mării Galileii, considerat unul dintre cele patru orașe sfinte ale iudaismului.","f":["Fondat în jurul anului 20 d.Hr. de Irod Antipa.","Cunoscut pentru izvoarele sale termale istorice."]},"il-port-haifa-economic-v2":{"i":"/poi-images/il-port-haifa-economic-v2.webp","s":"Cel mai mare port maritim din Israel, având un rol central în comerțul internațional și traficul de pasageri al țării.","f":["Deschis în anul 1933.","Nod important la Marea Mediterană."]},"il-port-ashdod-economic-v2":{"i":"/poi-images/il-port-ashdod-economic-v2.webp","s":"Un port de marfă important pe coasta mediteraneană, care gestionează o mare parte din importurile și exporturile Israelului.","f":["Al doilea port ca mărime din țară.","Construit în anii 1960."]},"il-port-eilat-economic-v2":{"i":"/poi-images/il-port-eilat-economic-v2.webp","s":"Singurul port al Israelului la Marea Roșie, oferind acces maritim direct către piețele din Asia și Africa de Est.","f":["Situat în Golful Aqaba.","Important pentru comerțul cu Asia."]},"il-orot-rabin-economic-v2":{"i":"/poi-images/il-orot-rabin-economic-v2.webp","s":"Cea mai mare centrală electrică din Israel, situată pe coasta Haderei, producând o parte semnificativă a energiei țării.","f":["Pusă în funcțiune în 1981.","Folosește în principal cărbune și gaz."]},"il-rutenberg-economic-v2":{"i":"/poi-images/il-rutenberg-economic-v2.webp","s":"O importantă centrală electrică pe cărbune și gaz lângă Așkelon, care joacă un rol major în aprovizionarea cu energie a sudului.","f":["Numită după Pinhas Rutenberg.","A doua cea mai mare centrală din țară."]},"il-reading-economic-v2":{"i":"/poi-images/il-reading-economic-v2.webp","s":"O centrală electrică istorică din Tel Aviv, operată în prezent cu gaze naturale, fiind un punct de reper pe coasta orașului.","f":["Deschisă în anul 1938.","Situată la gura râului Yarkon."]},"il-ashalim-economic-v2":{"i":"/poi-images/il-ashalim-economic-v2.webp","s":"O centrală solară inovatoare în deșertul Negev, cu unul dintre cele mai înalte turnuri solare din lume, furnizând energie regenerabilă.","f":["Înălțimea turnului este de peste 240 de metri.","Folosește mii de oglinzi."]},"il-haifa-refinery-economic-v2":{"i":"/poi-images/il-haifa-refinery-economic-v2.webp","s":"Una dintre cele mai mari rafinării de petrol din țară, cunoscută pentru turnurile sale de răcire iconice, reprezentând puterea industrială.","f":["Fondată în perioada mandatului britanic.","Aparține Grupului Bazan."]},"il-ashdod-refinery-economic-v2":{"i":"/poi-images/il-ashdod-refinery-economic-v2.webp","s":"Un complex petrochimic modern care produce și procesează o parte semnificativă din necesarul de combustibil al Israelului.","f":["Pusă în funcțiune în 1973.","A doua rafinărie ca mărime din Israel."]},"il-dead-sea-works-economic-v2":{"i":"/poi-images/il-dead-sea-works-economic-v2.webp","s":"Un complex industrial uriaș care extrage minerale valoroase precum potasiu, brom și magneziu din apa Mării Moarte.","f":["Fondată în anul 1929.","Unul dintre cei mai mari producători de îngrășăminte."]},"il-ramat-hovav-economic-v2":{"i":"/poi-images/il-ramat-hovav-economic-v2.webp","s":"Un centru major pentru industria chimică în sudul Israelului, găzduind numeroase fabrici și instalații de eliminare a deșeurilor.","f":["Situată la sud de Beer Șeva.","Se concentrează pe industria grea."]},"il-diamond-exchange-economic-v2":{"i":"/poi-images/il-diamond-exchange-economic-v2.webp","s":"Inima comerțului cu diamante din Israel în Ramat Gan, considerat unul dintre cele mai importante centre de pietre prețioase din lume.","f":["Un complex format din patru zgârie-nori.","Măsuri stricte de securitate."]},"il-matam-park-economic-v2":{"i":"/poi-images/il-matam-park-economic-v2.webp","s":"Primul și cel mai mare parc high-tech din Israel, situat în Haifa, atrăgând numeroase companii tehnologice globale și centre de cercetare.","f uciaților.","Este cea mai mare fortăreață medievală din Israel."]},"beit-shearim-history-v2":{"i":"/poi-images/beit-shearim-history-v2.webp","s":"Un vechi oraș evreiesc, cunoscut pentru marea sa necropolă și catacombele tăiate în stâncă.","f":["A fost sediul Sinedriului în secolul al III-lea.","Conține sute de morminte antice elaborate."]},"capernaum-history-v2":{"i":"/poi-images/capernaum-history-v2.webp","s":"Un vechi sat de pescari pe malul nordic al Mării Galileii.","f":["Cunoscut ca centrul lucrării lui Isus.","Prezintă rămășițele unei sinagogi antice bogat ornamentate din calcar."]},"horns-of-hattin-history-v2":{"i":"/poi-images/horns-of-hattin-history-v2.webp","s":"Un vulcan stins unde a avut loc o bătălie decisivă între cruciați și musulmani.","f":["Saladin a învins decisiv armata cruciată aici în 1187.","Victoria a dus la recucerirea musulmană a Ierusalimului."]},"belvoir-fortress-history-v2":{"i":"/poi-images/belvoir-fortress-history-v2.webp","s":"O fortăreață cruciată bine conservată, cu vedere la Valea Iordanului.","f":["Construită de Cavalerii Ospitalieri în 1168.","Este un exemplu excelent de castel cu design concentric."]},"herodium-history-v2":{"i":"/poi-images/herodium-history-v2.webp","s":"O fortăreață-palat în formă de con construită de regele Irod cel Mare.","f":["Mormântul lui Irod a fost descoperit aici în 2007.","A servit drept fortăreață în timpul revoltelor evreiești împotriva Romei."]},"valley-of-elah-history-v2":{"i":"/poi-images/valley-of-elah-history-v2.webp","s":"O vale lungă și puțin adâncă, recunoscută ca locul unei legendare bătălii biblice.","f":["Faimoasă ca fiind locul unde David l-a învins pe Goliat.","O rută antică importantă care conecta câmpia de coastă de Munții Iudeei."]},"dome-of-the-rock-landmarks-v2":{"i":"/poi-images/dome-of-the-rock-landmarks-v2.webp","s":"Domul Stâncii din Ierusalim este una dintre cele mai vechi structuri islamice din lume, dominând orizontul orașului vechi cu cupola sa aurie.","f":["Construit în seco let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
