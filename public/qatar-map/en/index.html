.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}

#svg.drag{cursor:grabbing}
.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}
.region:hover{fill:#2d3a78}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#000;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#60a5fa}
.poi.g-sight circle{fill:#fbbf24}
.poi.g-nature circle{fill:#22c55e}
.poi.g-history circle{fill:#c084fc}
.poi.g-industry circle{fill:#fb923c}
.poi.g-other circle{fill:#9ca3af}
.poi.dim{opacity:.18}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7;fill:#fff;opacity:1}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}

.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:#0d1230;border-top:1px solid #ffffff20;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -10px 40px #00000080}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a{display:flex;align-items:center;gap:.55rem;padding:.55rem .55rem;border-radius:8px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:active{background:#ffffff14}
.popup .list a .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.popup .list a .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup .list a .g{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}

.zoom button:active{background:#1a2240}

ers to Qatar.","Massively expanded during the 2022 World Cup."]},"qa-al-kharrara-cities-v2":{"i":"/poi-images/qa-al-kharrara-cities-v2.webp","s":"Deep in the stony south of Qatar lies Al Kharrara, a lonely desert settlement.","f":["A paradise for geologists due to rare rock layers.","Often records the highest summer temperatures in Qatar."]},"qa-rawdat-rashed-cities-v2":{"i":"/poi-images/qa-rawdat-rashed-cities-v2.webp","s":"Rawdat Rashed is a small village on the way from Doha to the west coast.","f":["The name 'Rawdat' roughly translates to 'garden' or 'meadow' in Arabic.","An important base for the region's water supply."]},"qa-al-zubarah-cities-v2":{"i":"/poi-images/qa-al-zubarah-cities-v2.webp","s":"Although almost uninhabited today, the ruined city of Al Zubarah is Qatar's most significant archaeological heritage.","f":["Was the first Qatari site added to the UNESCO World Heritage list.","Zubarah Fort is a classic example of Arab fortress architecture."]},"qa-muaither-cities-v2":{"i":"/poi-images/qa-muaither-cities-v2.webp","s":"Muaither is a lively and densely populated suburb in the Al Rayyan metropolitan area.","f":["Muaither Commercial Street is one of the longest shopping streets in the country.","Has its own professional football club, Muaither SC."]},"qa-al-sailiya-cities-v2":{"i":"/poi-images/qa-al-sailiya-cities-v2.webp","s":"Located west of the capital, Al Sailiya has evolved over the past decades from an agricultural area into a major logistics and residential center.","f":["The central vegetable market of Qatar is located here.","Home of the Al Sailiya Sports Club."]},"qa-al-kheesa-cities-v2":{"i":"/poi-images/qa-al-kheesa-cities-v2.webp","s":"A quiet, upscale residential neighborhood in the Al Daayen district.","f":["One of the preferred residential areas for wealthy Qataris.","Offers extremely quiet streets with no through traffic."]},"qa-leabaib-cities-v2":{"i":"/poi-images/qa-leabaib-cities-v2.webp","s":"Leabaib is a rapidly growing suburb near -economic-v2.webp","s":"An important port in northern Qatar facilitating trade with neighboring Gulf states.","f":["Recently modernized.","Focus on regional cargo."]},"qatar-financial-centre-economic-v2":{"i":"/poi-images/qatar-financial-centre-economic-v2.webp","s":"A major financial and business center attracting foreign investment to Qatar.","f":["Founded in 2005.","Offers its own legal system."]},"qatar-steel-plant-economic-v2":{"i":"/poi-images/qatar-steel-plant-economic-v2.webp","s":"One of the leading steel companies in the Gulf region, contributing significantly to infrastructure.","f":["Producing since 1978.","Headquartered in Mesaieed."]},"qatalum-aluminum-plant-economic-v2":{"i":"/poi-images/qatalum-aluminum-plant-economic-v2.webp","s":"One of the most efficient and environmentally friendly aluminum smelters in the world.","f":["Joint venture with Norsk Hydro.","Produces primary aluminum."]},"pearl-gtl-plant-economic-v2":{"i":"/poi-images/pearl-gtl-plant-economic-v2.webp","s":"The world's largest plant for converting natural gas into liquid fuels (Gas-to-Liquids).","f":["Collaboration with Shell.","Produces clean diesel."]},"barzan-gas-project-economic-v2":{"i":"/poi-images/barzan-gas-project-economic-v2.webp","s":"A massive project designed to meet Qatar's growing domestic energy demand.","f":["Focus on the local market.","Processes gas from the North Field."]},"doha-port-economic-v2":{"i":"/poi-images/doha-port-economic-v2.webp","s":"Once the country's main port, now redesigned for cruise ships and tourism.","f":["Centrally located in Doha.","Focus on cruise tourism."]},"umm-bab-cement-plant-economic-v2":{"i":"/poi-images/umm-bab-cement-plant-economic-v2.webp","s":"A crucial facility for cement production that supports Qatar's rapid construction growth.","f":["Produces high-quality cement.","Important for infrastructure."]},"ras-bufontas-free-zone-economic-v2":{"i":"/poi-images/ras-bufontas-free-zone-economic-v2.webp","s":"A state-of-the-art business and logistics center near Hamad International Airport.","f":["Offers tax incentives.","Focus on technology and logistics."]},"al-rayyan-industrial-area-economic-v2":{"i":"/poi-images/al-rayyan-industrial-area-economic-v2.webp","s":"A sprawling business park hosting numerous small and medium-sized manufacturing companies.","f":["Center for local manufacturing.","Major employer."]},"qafco-fertilizer-plant-economic-v2":{"i":"/poi-images/qafco-fertilizer-plant-economic-v2.webp","s":"Qatar's leading company for the production of ammonia and urea for global agriculture.","f":["World's largest exporter of urea.","Located in Mesaieed."]},"oryx-gtl-plant-economic-v2":{"i":"/poi-images/oryx-gtl-plant-economic-v2.webp","s":"A pioneering project in Qatar that converts natural gas into clean, high-quality liquid fuels.","f":["Joint venture with Sasol.","First facility of its kind in the region."]},"qatar-al-zubarah-fort-history-v2":{"i":"/poi-images/qatar-al-zubarah-fort-history-v2.webp","s":"This UNESCO World Heritage site is a well-preserved coastal fortress and an outstanding example of an 18th-century pearl merchant town.","f":["Constructed in 1938","Part of a former flourishing pearl-diving town"]},"qatar-barzan-towers-history-v2":{"i":"/poi-images/qatar-barzan-towers-history-v2.webp","s":"Built in the late 19th century, these watchtowers were designed to protect the local water sources and observe the moon.","f":["Constructed by Sheikh Mohammed bin Jassim Al Thani","The name translates to \"High Place\""]},"qatar-al-wajbah-fort-history-v2":{"i":"/poi-images/qatar-al-wajbah-fort-history-v2.webp","s":"One of the oldest forts in Qatar and the site of a decisive 1893 battle where Qatari forces defeated the Ottoman army.","f":["Site of the Battle of Al Wajbah (1893)","Constructed in the late 18th century"]},"qatar-zekreet-fort-history-v2":{"i":"/poi-images/qatar-zekreet-fort-history-v2.webp","s":"The ruins of this 18th-century fort on the west coast showcase a unique architectural style without traditional corner towers.","f":["Dates back to the late 18th century","Lacks traditional round towers"]},"qatar-al-koot-fort-history-v2":{"i":"/poi-images/qatar-al-koot-fort-history-v2.webp","s":"Also known as Doha Fort, this building originally served as a police station and prison in the heart of the traditional Souq Waqif.","f":["Constructed in 1927","Located right next to Souq Waqif"]},"qatar-al-rakiyat-fort-history-v2":{"i":"/poi-images/qatar-al-rakiyat-fort-history-v2.webp","s":"One of Qatar's most important desert forts from the 19th century, built to protect the freshwater wells of surrounding villages.","f":["The name translates to \"Well\"","Constructed in the 19th century"]},"qatar-al-jassasiya-rock-carvings-history-v2":{"i":"/poi-images/qatar-al-jassasiya-rock-carvings-history-v2.webp","s":"Qatar's most significant archaeological site for petroglyphs, featuring fascinating rock carvings of ships, animals, and geometric patterns.","f":["Discovered in 1957","Contains nearly 900 different petroglyphs"]},"qatar-murwab-fort-history-v2":{"i":"/poi-images/qatar-murwab-fort-history-v2.webp","s":"The remains of this ancient Islamic settlement from the Abbasid period offer insights into early settlement and life in historical Qatar.","f":["Dates back to the 9th century","Oldest known Islamic settlement in Qatar"]},"qatar-freiha-settlement-history-v2":{"i":"/poi-images/qatar-freiha-settlement-history-v2.webp","s":"One of Qatar's oldest abandoned coastal towns, once a thriving center for pearl divers before being deserted in the 19th century.","f":["Founded around the 18th century","Ruins of a mosque are still visible"]},"qatar-al-jumail-village-history-v2":{"i":"/poi-images/qatar-al-jumail-village-history-v2.webp","s":"A picturesque, abandoned fishing and pearl-diving village on the north coast, symbolizing the transition from traditional to modern Qatar.","f":["Inhabited until the mid-20th century","Means \"small and beautiful\" in Arabic"]},"qata ry-v2.webp","s":"The house demonstrates Doha's architectural transformation and preserves the memory of the early urban development of the traditional Msheireb district.","f":["Built by Sheikh Mohammed bin Jassim Al Thani","Focuses on the history of Doha"]},"qatar-wind-tower-house-history-v2":{"i":"/poi-images/qatar-wind-tower-house-history-v2.webp","s":"A rare surviving example of traditional Qatari cooling architecture, where a wind tower was used for natural ventilation of living spaces.","f":["Known as \"Badgir\" in Arabic","Catches the wind and funnels it downward"]},"qatar-al-ghuwairiya-fort-history-v2":{"i":"/poi-images/qatar-al-ghuwairiya-fort-history-v2.webp","s":"The ruins of this small desert outpost recall the strategic importance of inland routes and the control of scarce water resources.","f":["Constructed in the early modern period","Small, square watchpost"]},"qatar-ruwayda-settlement-history-v2":{"i":"/poi-images/qatar-ruwayda-settlement-history-v2.webp","s":"One of the largest archaeological sites in northwest Qatar, featuring a massive abandoned fort and the remains of a once-prosperous fishing village.","f":["Spans over 2.5 kilometers","Largest discovered fort in Qatar"]},"qatar-museum-of-islamic-art-landmarks-v2":{"i":"/poi-images/qatar-museum-of-islamic-art-landmarks-v2.webp","s":"The striking building on an artificial island houses one of the most comprehensive collections of Islamic art from three continents.","f":["Opened to the public in 2008.","Designed by architect I. M. Pei."]},"qatar-national-museum-landmarks-v2":{"i":"/poi-images/qatar-national-museum-landmarks-v2.webp","s":"The desert rose-inspired building tells the story of Qatar from its geological formation to the modern metropolis.","f":["Designed by Jean Nouvel.","The roof features 539 interlocking disks."]},"qatar-souq-waqif-landmarks-v2":{"i":"/poi-images/qatar-souq-waqif-landmarks-v2.webp","s":"The traditional market in the heart of the capital offers a labyrinth of alleys wi r areas."]},"qatar-snow-dunes-life-v2":{"i":"/poi-images/qatar-snow-dunes-life-v2.webp","s":"Snow Dunes is an indoor snow park in Qatar that allows winter activities like sliding and snowball fights in freezing temperatures.","f":["Produces real snow at -4 degrees.","Inspired by local winter legends."]},"qatar-kidzmondo-doha-life-v2":{"i":"/poi-images/qatar-kidzmondo-doha-life-v2.webp","s":"KidzMondo Doha is an interactive miniature city where children can playfully try out various professions and adult life.","f":["Over 80 different professions for kids.","Has its own currency (Kidlar)."]},"qatar-megapolis-entertainment-life-v2":{"i":"/poi-images/qatar-megapolis-entertainment-life-v2.webp","s":"The Megapolis Entertainment Center offers state-of-the-art arcade games, bowling, and escape rooms for youth and adults in The Pearl.","f":["Indoor entertainment complex.","Features modern VR games."]},"qatar-hotel-park-doha-life-v2":{"i":"/poi-images/qatar-hotel-park-doha-life-v2.webp","s":"The Hotel Park in the city center offers manicured lawns, water features, and an excellent environment for picnics against an impressive backdrop.","f":["Located behind the Sheraton Hotel.","Features large fountains."]},"qatar-barzan-olympic-park-life-v2":{"i":"/poi-images/qatar-barzan-olympic-park-life-v2.webp","s":"Barzan Olympic Park offers world-class sports facilities and large green spaces for the residents of Umm Salal and surrounding areas.","f":["Various sports fields available.","Features miniature models of Qatari buildings."]},"qatar-al-wakrah-public-garden-life-v2":{"i":"/poi-images/qatar-al-wakrah-public-garden-life-v2.webp","s":"Al Wakrah Public Garden is a peaceful oasis in the coastal town that attracts with beautiful flower beds and shaded seating areas.","f":["Many native tree species.","Offers a large children's playground."]},"qatar-north-sedra-farm-life-v2":{"i":"/poi-images/qatar-north-sedra-farm-life-v2.webp","s":"North Sedra Farm offers agrotourism experiences an eaches"]},"qa-alkaraana-lagoons-nature-v2":{"i":"/poi-images/qa-alkaraana-lagoons-nature-v2.webp","s":"A successfully rehabilitated wetland that has transformed from a former wastewater basin into a thriving sanctuary for migratory birds and native wildlife.","f":["Attracts ospreys and rare duck species","Features three large artificial lakes"]},"qa-umm-tais-national-park-nature-v2":{"i":"/poi-images/qa-umm-tais-national-park-nature-v2.webp","s":"An untouched island reserve at the northern tip of Qatar, consisting of sandy beaches, mangroves, and shallow waters that serve as nesting grounds for turtles.","f":["Important protected area for hawksbill turtles","Features a rich birdlife"]},"qa-dhal-al-misfir-nature-v2":{"i":"/poi-images/qa-dhal-al-misfir-nature-v2.webp","s":"A 40-meter-deep natural gypsum sinkhole that emits a phosphorescent glow and ranks among Qatar's most remarkable geological wonders.","f":["Its age is estimated at hundreds of thousands of years","The rock produces moon-like glittering reflections"]},"qa-wadi-hubara-nature-v2":{"i":"/poi-images/qa-wadi-hubara-nature-v2.webp","s":"A dried-up riverbed that transforms into a blooming oasis after the rare winter rains, attracting desert wildlife.","f":["Named after the houbara bustard","Displays remarkable desert flora"]},"qa-wadi-al-banat-nature-v2":{"i":"/poi-images/qa-wadi-al-banat-nature-v2.webp","s":"A historic river valley near Doha, noted today for its gentle terrain structures and serving as a popular destination for nature walks close to the city.","f":["Translates to Valley of the Girls","Provides shelter for desert foxes"]},"qa-al-safliya-island-nature-v2":{"i":"/poi-images/qa-al-safliya-island-nature-v2.webp","s":"A narrow, uninhabited sandy island off the coast of Doha, serving as an important resting area for migratory birds and a protected maritime habitat.","f":["Has no artificial structures","Offers great views of the Doha skyline"]},"qa-al-aliya-island-nature-v2":{"i":"/poi-images/qa-a hing artificially irrigated forests of drought-resistant tree species in Qatar.","f":["Uses recycled water for irrigation","Lowers the local ambient temperature"]},"qa-abu-nakhla-lake-nature-v2":{"i":"/poi-images/qa-abu-nakhla-lake-nature-v2.webp","s":"Another important artificial wetland system near Doha, fed by treated water and having bloomed into a surprisingly species-rich habitat.","f":["More than 130 bird species sighted","Contributes to Qatar's biodiversity"]},"qurayn-abu-al-bawl-relief-v2":{"i":"/poi-images/qurayn-abu-al-bawl-relief-v2.webp","s":"At approximately 103 meters above sea level, this is the highest point in Qatar, located in the south of the peninsula.","f":["The highest point in the country.","Located near the border with Saudi Arabia."]},"khor-al-adaid-relief-v2":{"i":"/poi-images/khor-al-adaid-relief-v2.webp","s":"An impressive natural wonder in southern Qatar where the sand dunes of the desert meet the waters of the Persian Gulf directly.","f":["UNESCO-recognized nature reserve.","Accessible only by off-road vehicles."]},"mesaieed-dunes-relief-v2":{"i":"/poi-images/mesaieed-dunes-relief-v2.webp","s":"A vast desert landscape south of Doha, known for its towering sand dunes and golden sand seas.","f":["Popular destination for dune bashing.","Contrasts with the nearby industrial city of Mesaieed."]},"ras-abrouq-relief-v2":{"i":"/poi-images/ras-abrouq-relief-v2.webp","s":"A bizarre lunar landscape of wind-swept limestone formations and mushroom-shaped rocks on the west coast of Qatar.","f":["Located near the village of Zekreet.","Popular spot for camping and nature photography."]},"dahl-al-misfir-relief-v2":{"i":"/poi-images/dahl-al-misfir-relief-v2.webp","s":"One of Qatar's largest accessible karst caves, whose walls consist of fascinating, phosphorescent gypsum rock.","f":["Approximately 40 meters deep.","The gypsum crystals glow slightly in the dark."]},"singing-sand-dunes-relief-v2":{"i":"/poi-images/singing-sand-dunes-relief-v2.webp","s":"These crescent-shaped dunes produce a deep, humming sound when sand grains rub against each other due to wind or movement.","f":["A rare acoustic phenomenon.","Best conditions are in the early morning hours."]},"jebel-nakhsh-relief-v2":{"i":"/poi-images/jebel-nakhsh-relief-v2.webp","s":"A prominent mountain range in southwestern Qatar, rich in fossils and offering panoramic views over the vast desert landscape.","f":["Reaches heights of up to 90 meters.","Important geological site for marine fossils."]},"jebel-fuwayrit-relief-v2":{"i":"/poi-images/jebel-fuwayrit-relief-v2.webp","s":"Small limestone hills on the northeast coast, whose weathered rock formations reach right to the edge of the sandy beach.","f":["Popular with rock climbers and boulderers.","Provides shelter for nesting sea turtles nearby."]},"dukhan-ridge-relief-v2":{"i":"/poi-images/dukhan-ridge-relief-v2.webp","s":"An elongated ridge on the west coast that is geologically significant as it houses the country's main oil reserves underneath.","f":["Formed by complex tectonic folding.","Dominates the western skyline of the peninsula."]},"al-thakhira-mangroves-relief-v2":{"i":"/poi-images/al-thakhira-mangroves-relief-v2.webp","s":"A lush, green ecosystem of mangrove forests that forms a sharp contrast to the surrounding arid desert environment.","f":["Important habitat for migratory birds.","Often explored by kayak."]},"wadi-al-banat-relief-v2":{"i":"/poi-images/wadi-al-banat-relief-v2.webp","s":"A dry river valley north of Doha that temporarily transforms into a green oasis after rare rainfalls.","f":["Translates to \"Valley of the Girls\".","Showcases the typical desert flora of Qatar."]},"sabkhat-dukhan-relief-v2":{"i":"/poi-images/sabkhat-dukhan-relief-v2.webp","s":"A vast, salt-crusted plain near the west coast formed by the evaporation of mineral-rich groundwater.","f":["One of the largest sabkhas in the country.","Extremely dry and cracked in the summer."]},"umm-tais-relief-v2":{"i":"/poi-images/umm-tais-relief-v2.webp","s":"An untouched barrier island and national park at the northern tip of Qatar with mangroves, sandy beaches, and shallow waters.","f":["Important nesting area for sea turtles.","Includes various fragile ecosystems."]},"wadi-al-sail-relief-v2":{"i":"/poi-images/wadi-al-sail-relief-v2.webp","s":"A natural depression that collects surface water in the region and was historically an important water source for nomadic tribes.","f":["Today heavily influenced by urban development.","Once a seasonal watercourse."]},"al-kharrara-depression-relief-v2":{"i":"/poi-images/al-kharrara-depression-relief-v2.webp","s":"A fascinating desert area with stony soils and deep gullies formed by millennia of wind erosion.","f":["Popular for desert safaris.","Pronounced karst phenomena."]},"ras-rakan-relief-v2":{"i":"/poi-images/ras-rakan-relief-v2.webp","s":"The northernmost tip of the Qatari peninsula, surrounded by shallow waters and coral reefs that make it difficult to access.","f":["The North Pole of Qatar.","Often becomes a small island at high tide."]},"fuwayrit-beach-relief-v2":{"i":"/poi-images/fuwayrit-beach-relief-v2.webp","s":"A picturesque stretch of coast with fine white sand and clear, shallow water, surrounded by unique rock formations.","f":["Closed annually during the turtle nesting season.","Soft, powdery sand."]},"zekreet-peninsula-relief-v2":{"i":"/poi-images/zekreet-peninsula-relief-v2.webp","s":"A remote peninsula on the west coast, characterized by rugged limestone cliffs, deserted beaches, and sparse desert flora.","f":["Known for the 'Film City' movie set.","Home to herds of Arabian oryx antelopes."]},"al-aamriya-desert-relief-v2":{"i":"/poi-images/al-aamriya-desert-relief-v2.webp","s":"A flat, expansive gravel desert that covers much of central and southern Qatar and exhibits extreme aridity.","f":["Typical hamada (gravel desert).","Home to hardy desert shrubs."]},"wadi-msheireb-relief-v2":{"i":"/poi-images/wadi-msheireb-relief-v2.webp","s" const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
