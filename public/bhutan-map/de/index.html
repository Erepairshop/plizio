const POI_CARD={"thimphu-cities-v2":{"i":"/poi-images/thimphu-cities-v2.webp","s":"Thimphu ist die Hauptstadt und größte Stadt von Bhutan, bekannt für ihre Mischung aus traditioneller Kultur und Moderne ohne Verkehrsampeln.","f":["Thimphu liegt im westlichen zentralen Teil von Bhutan.","Es wurde im Jahr 1961 zur Hauptstadt des Königreichs."]},"phuntsholing-cities-v2":{"i":"/poi-images/phuntsholing-cities-v2.webp","s":"Phuntsholing ist eine Grenzstadt im Süden von Bhutan, die als das wichtigste kommerzielle Zentrum und Tor nach Indien fungiert.","f":["Es grenzt an die indische Stadt Jaigaon.","Der grenzüberschreitende Handel ist das Rückgrat der lokalen Wirtschaft."]},"paro-cities-v2":{"i":"/poi-images/paro-cities-v2.webp","s":"Paro ist eine historische Stadt im Paro-Tal, Heimat des einzigen internationalen Flughafens von Bhutan und zahlreicher heiliger Stätten.","f":["Das berühmte Taktsang-Kloster befindet sich in der Nähe.","Die Stadt hat viele traditionelle bhutanische Häuser."]},"gelephu-cities-v2":{"i":"/poi-images/gelephu-cities-v2.webp","s":"Gelephu ist eine schnell wachsende Stadt im Süden Bhutans an der indischen Grenze, die für ihre warmen Quellen und tropische Landwirtschaft bekannt ist.","f":["Gelephu verfügt über einen Inlandsflughafen.","Es ist geplant, ein großes Achtsamkeits-Stadtprojekt zu werden."]},"samdrup-jongkhar-cities-v2":{"i":"/poi-images/samdrup-jongkhar-cities-v2.webp","s":"Samdrup Jongkhar ist die wichtigste Stadt im Südosten Bhutans und dient als wichtiger Handelspunkt mit dem indischen Bundesstaat Assam.","f":["Es ist eine der ältesten Städte in Bhutan.","Die Region ist reich an Kohle und anderen Mineralien."]},"wangdue-phodrang-cities-v2":{"i":"/poi-images/wangdue-phodrang-cities-v2.webp","s":"Wangdue Phodrang ist eine malerische Stadt, die um ihren großen historischen Dzong gebaut wurde, welcher eine wichtige Handelsroute kontrolliert.","f":["Die ursprüngliche Festung der Stadt brannte 2012 tragischerweise ab.","Die Gegend ist berühmt für Bambusprodukte und Schieferschnitzereien."]},"punakha-cities-v2":{"i":"/poi-images/punakha-cities-v2.webp","s":"Punakha war bis 1955 die Hauptstadt von Bhutan und ist berühmt für ihren majestätischen Dzong am Zusammenfluss zweier großer Flüsse.","f":["Es dient als Winterresidenz der zentralen klösterlichen Körperschaft.","Das Klima ist im Vergleich zu Thimphu relativ warm."]},"jakar-cities-v2":{"i":"/poi-images/jakar-cities-v2.webp","s":"Jakar, bekannt als das Zentrum der Region Bumthang, gilt als spirituelles Herzland Bhutans mit vielen alten Klöstern.","f":["Der Name Jakar bedeutet in der lokalen Sprache weißer Vogel.","Es ist berühmt für seine Honig- und Käseproduktion."]},"mongar-cities-v2":{"i":"/poi-images/mongar-cities-v2.webp","s":"Mongar ist eine wichtige Stadt im Osten Bhutans, die spektakulär auf der Seite eines Hügels statt in einem Tal liegt.","f":["Der Mongar Dzong ist einer der neuesten im Land und wurde 1930 erbaut.","Es markiert den Beginn von Ostbhutan."]},"trashigang-cities-v2":{"i":"/poi-images/trashigang-cities-v2.webp","s":"Trashigang ist eine geschäftige Stadt im Osten, die traditionell das Zentrum des Handels mit Tibet war und über dem Drangme Chhu-Fluss thront.","f":["Die Stadt hat eine große Bevölkerung von Nomaden aus Merak.","Das erste College von Bhutan befindet sich in der Nähe."]},"trongsa-cities-v2":{"i":"/poi-images/trongsa-cities-v2.webp","s":"Trongsa liegt geografisch im Zentrum Bhutans und war historisch von entscheidender Bedeutung für die Kontrolle des Königreichs.","f":["Der Trongsa Dzong ist die größte Festung in Bhutan.","Die königliche Familie hat hier ihre familiären Wurzeln."]},"samtse-cities-v2":{"i":"/poi-images/samtse-cities-v2.webp","s":"Samtse ist eine grenznahe Industriestadt im Südwesten Bhutans mit einer vielfältigen Bevölkerung und reichen Mineralvorkommen.","f":["Es war historisch bekannt für seine großen Kardamomplantagen.","Die Stadt weist deutliche kulturelle Einflüsse aus dem benachbarten Indien auf."]},"damphu-cities-v2":{"i":"/poi-images/damphu-cities-v2.webp","s":"Damphu ist das Verwaltungszentrum des Tsirang-Distrikts und berühmt für sein sanftes Klima und reiche landwirtschaftliche Erträge.","f":["Das Gebiet wird überwiegend von der Lhotshampa-Gemeinschaft bewohnt.","Es ist ein bedeutender Produzent von Bio-Gemüse im Land."]},"haa-cities-v2":{"i":"/poi-images/haa-cities-v2.webp","s":"Haa ist eine kleine, abgeschiedene Stadt im Westen Bhutans, eingebettet in ein tiefes Tal nahe der Grenze zu Tibet.","f":["Das Haa-Tal wurde erst 2002 für ausländische Touristen geöffnet.","Das lokale indische militärische Trainingsteam hat hier eine wichtige Basis."]},"lhuntse-cities-v2":{"i":"/poi-images/lhuntse-cities-v2.webp","s":"Lhuntse ist eine abgelegene Siedlung im Nordosten Bhutans, die weithin für ihre exquisiten und komplexen Webkünste anerkannt ist.","f":["Die Region ist die angestammte Heimat der königlichen Familie von Bhutan.","Kishu Thara, ein hoch geschätztes bhutanisches Textil, stammt von hier."]},"pemagatshel-cities-v2":{"i":"/poi-images/pemagatshel-cities-v2.webp","s":"Pemagatshel, bekannt für seine religiöse Bedeutung und Kunsthandwerker, ist ein kleiner Ort auf einem steilen Bergrücken im Osten Bhutans.","f":["Der Distrikt ist berühmt für seine traditionellen Holzschalen namens Dhapa.","Es ist ein wichtiges Zentrum für den Nyingma-Buddhismus."]},"zhemgang-cities-v2":{"i":"/poi-images/zhemgang-cities-v2.webp","s":"Zhemgang ist eine abgelegene Stadt in Zentralbhutan, die für ihre immense biologische Vielfalt und ihre tief verwurzelten animistischen Traditionen bekannt ist.","f":["Die Region gilt als einer der besten Orte zur Vogelbeobachtung in Bhutan.","Der Goldlangur, eine seltene Primatenart, wird hier häufig gesehen."]},"gasa-cities-v2":{"i":"/poi-images/gasa-cities-v2.webp","s":"Gasa ist die nördlichste und höchstgelegene Distrikthauptstadt Bhutans, die für ihre heilenden heißen Quellen und das harte Hochgebirgsklima berühmt ist.","f":["Die Stadt verzeichnet in den Wintermonaten starke Schneefälle.","Die Region ist die Heimat des nomadischen Layap-Volkes."]},"daga-cities-v2":{"i":"/poi-images/daga-cities-v2.webp","s":"Daga, auch bekannt als Dagana, ist eine historische Festungsstadt, die im 17.","f":["Die Region zeichnet sich durch steiles Gelände und tiefe Schluchten aus.","Die Landwirtschaft, insbesondere Orangen und Kardamom, ist eine wichtige wirtschaftliche Aktivität."]},"nganglam-cities-v2":{"i":"/poi-images/nganglam-cities-v2.webp","s":"Nganglam ist eine schnell wachsende Handelsstadt an der südlichen Grenze Bhutans, die von der Zementindustrie und neuen Verkehrsverbindungen angetrieben wird.","f":["Eine große Zementfabrik ist in der Nähe der Stadt in Betrieb.","Das Klima ist das ganze Jahr über heiß und feucht."]},"sarpang-cities-v2":{"i":"/poi-images/sarpang-cities-v2.webp","s":"Sarpang ist das Verwaltungszentrum des Sarpang-Distrikts und liegt am Rande der indischen Ebenen, umgeben von dichtem Dschungel.","f":["Das Gebiet ist während der Monsunzeit sehr hochwassergefährdet.","Die ursprüngliche Stadt musste aufgrund schwerer Überschwemmungen in der Vergangenheit verlegt werden."]},"tsimasham-cities-v2":{"i":"/poi-images/tsimasham-cities-v2.webp","s":"Tsimasham ist das Hauptquartier des Chukha-Distrikts und liegt strategisch günstig an der Hauptautobahn zwischen Thimphu und der indischen Grenze.","f":["Das nahegelegene Chukha-Wasserkraftwerk ist eine enorme nationale Einnahmequelle.","Die Stadt liegt hoch auf einem Kamm und bietet weite Ausblicke."]},"deothang-cities-v2":{"i":"/poi-images/deothang-cities-v2.webp","s":"Deothang ist eine malerische Stadt im Südosten Bhutans, die für ihre starke militärische Präsenz und Bildungseinrichtungen bekannt ist.","f":["Es war der Schauplatz des Duar-Krieges zwischen Bhutan und Britisch-Indien im Jahr 1865.","Das Jigme Namgyel Engineering College befindet sich hier."]},"kanglung-cities-v2":{"i":"/poi-images/kanglung-cities-v2.webp","s":"Kanglung ist eine bedeutende Bild   // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
