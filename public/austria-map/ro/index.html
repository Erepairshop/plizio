 Bavaria.","f":["Înălțime: 2522 m","Alpii Berchtesgaden"]},"austria-almkogel-relief-v2":{"i":"/poi-images/austria-almkogel-relief-v2.webp","s":"Almkogel este un munte cunoscut în Prealpii Austriei Superioare.","f":["Înălțime: 1513 m","Prealpi"]},"austria-feuerkogel-relief-v2":{"i":"/poi-images/austria-feuerkogel-relief-v2.webp","s":"Feuerkogel este muntele local al orașului Ebensee din Salzkammergut.","f":["Înălțime: 1625 m","Höllengebirge"]},"austria-traunstein-relief-v2":{"i":"/poi-images/austria-traunstein-relief-v2.webp","s":"Traunstein este un munte calcaros proeminent lângă lacul Traunsee din Salzkammergut.","f":["Înălțime: 1691 m","Salzkammergut"]},"austria-schafberg-relief-v2":{"i":"/poi-images/austria-schafberg-relief-v2.webp","s":"Schafberg este situat între lacul Wolfgangsee și Mondsee în Salzkammergut.","f":["Înălțime: 1782 m","Salzkammergut"]},"austria-hoher-dachtein-gletscher-relief-v2":{"i":"/poi-images/austria-hoher-dachtein-gletscher-relief-v2.webp","s":"Masivul Dachstein găzduiește cei mai estici ghețari din Alpi.","f":["Cei mai estici ghețari din Alpi","Turism"]},"austria-ansberg-relief-v2":{"i":"/poi-images/austria-ansberg-relief-v2.webp","s":"Ansberg este situat lângă Liezen în Stiria.","f":["Înălțime: 1845 m","Tauernii de Jos"]},"austria-planneralm-relief-v2":{"i":"/poi-images/austria-planneralm-relief-v2.webp","s":"Planneralm este o regiune montană înaltă în Stiria.","f":["Regiune montană înaltă","Domeniu schiabil"]},"austria-kaibling-relief-v2":{"i":"/poi-images/austria-kaibling-relief-v2.webp","s":"Hauser Kaibling este un munte important pentru schi în Alpii Schladming Tauern în Stiria.","f":["Înălțime: 2015 m","Alpii Schladming Tauern"]},"austria-dachstein-west-relief-v2":{"i":"/poi-images/austria-dachstein-west-relief-v2.webp","s":"Dachstein-West este o regiune cunoscută pentru schi în ramificațiile nordice ale masivului Dachstein.","f":["Regiune de schi","Poalele Dachstein"]},"austria-murtal-alpen-relief-v2":{"i":"/poi-images/austria-murtal-alpen-relief-v2.webp","s":"Alpii Murtal sunt situați în Stiria și fac parte din Tauernii de Jos.","f":["Parte a Tauernilor de Jos","Regiunea Mura"]},"austria-radstatter-tauern-relief-v2":{"i":"/poi-images/austria-radstatter-tauern-relief-v2.webp","s":"Tauernii Radstadt sunt un lanț muntos în Salzburg.","f":["Tauernii Radstadt","Salzburg"]},"austria-schladminger-tauern-relief-v2":{"i":"/poi-images/austria-schladminger-tauern-relief-v2.webp","s":"Alpii Schladming Tauern sunt o grupă muntoasă din Tauernii de Jos în Stiria și Salzburg.","f":["Tauernii de Jos","Stiria/Salzburg"]},"austria-seckauer-tauern-relief-v2":{"i":"/poi-images/austria-seckauer-tauern-relief-v2.webp","s":"Alpii Seckau Tauern formează partea cea mai estică a Tauernilor de Jos în Stiria.","f":["Estul Tauernilor de Jos","Stiria"]},"austria-rotsel-spitze-relief-v2":{"i":"/poi-images/austria-rotsel-spitze-relief-v2.webp","s":"Rötelspitze este un vârf cunoscut în zona de frontieră Tirol-Tirolul de Sud.","f":["Înălțime: 2818 m","Munte de frontieră"]},"austria-hohe-veitsch-relief-v2":{"i":"/poi-images/austria-hohe-veitsch-relief-v2.webp","s":"Hohe Veitsch este un munte în Alpii Mürzsteg din Stiria.","f":["Înălțime: 1981 m","Alpii Mürzsteg"]},"austria-herrenstein-relief-v2":{"i":"/poi-images/austria-herrenstein-relief-v2.webp","s":"Herrenstein este un munte în Alpii Calcaroși dintre Austria Inferioară și Stiria.","f":["Înălțime: 1650 m","Alpii Calcaroși"]},"austria-karmel-spitze-relief-v2":{"i":"/poi-images/austria-karmel-spitze-relief-v2.webp","s":"Karmelspitze este un vârf în grupul Hochschwab din Stiria.","f":["Înălțime: 1850 m","Hochschwab"]},"austria-grosse-wildstelle-relief-v2":{"i":"/poi-images/austria-grosse-wildstelle-relief-v2.webp","s":"Große Wildstelle este cel mai înalt vârf din Alpii Schladming Tauern.","f":["Înălțime: 2747 m","Alpii Schladming Tauern"]},"austria-hoher-trieber-relief-v2":{"i":"/poi-images/austria-hoher-trieber-relief-v2.webp","s":"Hoher Trieb este un munte în Tauernii de Jos din Stiria.","f":["Înălțime: 2190 m","Tauernii de Jos"]},"AT-Graz":{"i":"/geo-images/austria/graz.webp","s":"Graz este al doilea oraș ca mărime din Austria, cunoscut pentru centrul său vechi bine conservat și ca Oraș UNESCO al Designului.","f":["Graz este situat pe râul Mur în sud-estul Austriei.","Găzduiește patru universități cu o populație studențească mare."]},"AT-Linz":{"i":"/geo-images/austria/linz.webp","s":"Linz este al treilea oraș ca mărime din Austria, cunoscut pentru istoria sa industrială, arta media modernă și faimoasa Torta Linzer.","f":["Linz este situat central în Valea Dunării din Austria Superioară.","Noua Catedrală (Mariendom) este cea mai mare biserică din Austria după capacitate."]},"AT-Innsbruck":{"i":"/geo-images/austria/innsbruck.webp","s":"Innsbruck este capitala Tirolului și este cunoscut drept „Capitala Alpilor”, îmbinând istoria imperială cu sporturile montane spectaculoase.","f":["Innsbruck este situat în valea largă a râului Inn, flancată de munți înalți.","Acoperișul de Aur este acoperit cu 2.657 de șindrile de cupru aurit."]},"AT-Klagenfurt":{"i":"/geo-images/austria/klagenfurt.webp","s":"Klagenfurt am Wörthersee, capitala Carintiei, este considerată fermecătoarea perlă renascentistă a sudului austriac.","f":["Klagenfurt este al șaselea oraș ca mărime din Austria.","Conform legendei, orașul a fost construit pe o mlaștină drenată, unde trăia un balaur (Lindwurm)."]},"AT-Bregenz":{"i":"/geo-images/austria/bregenz.webp","s":"Bregenz, idilica capitală a Vorarlbergului, fascinează prin locația sa incomparabilă chiar pe malul Lacului Constanța și la poalele masivului Pfänder.","f":["Bregenz are cel mai important port austriac de pe Lacul Constanța.","Pfänder (1.064 m) este muntele local al orașului, accesibil cu telecabina."]},"AT-Eisenstadt":{"i":"/geo-images/austria/eisenstadt.webp","s":"Eisenstadt, capitala idilică a Burgenlandului, este un oraș de o eleganță istorică și o tradiție muzicală adânc înrădăcinată.","f":["Cu aproximativ 15.000 de locuitori, Eisenstadt este cea mai mică capitală de stat din Austria.","Joseph Haydn și-a petrecut mare parte din viață și a lucrat aici."]},"AT-StPolten":{"i":"/geo-images/austria/st-p-lten.webp","s":"St.","f":["St. Pölten a primit drepturile de oraș încă din 1159.","Orașul a fost ales capitală a statului în 1986, în urma unui referendum."]},"AT-Schoenbrunn":{"i":"/geo-images/austria/sch-nbrunn-palace.webp","s":"Palatul Schönbrunn din Viena este cel mai mare palat din Austria și unul dintre cele mai importante bunuri culturale ale țării.","f":["Schönbrunn are un număr impresionant de 1.441 de camere.","Împăratul Franz Joseph I s-a născut și a murit în acest palat."]},"AT-Hofburg":{"i":"/geo-images/austria/hofburg-palace.webp","s":"Hofburg, situat în inima Vienei, a fost timp de peste șase secole reședința principală și centrul de putere al puternicei dinastii de Habsburg.","f":["Cu aproximativ 2.600 de camere, Hofburg este unul dintre cele mai mari complexe de palate din Europa.","Găzduiește Trezoreria (Schatzkammer) cu Coroana Sfântului Imperiu Roman."]},"AT-Stephansdom":{"i":"/geo-images/austria/st-stephen-s-cathedral.webp","s":"Catedrala Sf.","f":["Turnul de Sud („Steffl”) are exact 136,4 metri înălțime.","În Turnul de Nord se află Pummerin, cel mai mare clopot din Austria."]},"AT-Mozarthaus":{"i":"/geo-images/austria/mozart-s-birthplace.webp","s":"Casa Mozart, situată la numărul 9 pe Getreidegasse în Salzburg, este locul faimos în întreaga lume unde s-a născut geniul muzical Wolfgang Amadeus Mozart pe 27 ianuarie 1756.","f":["Wolfgang Amadeus Mozart s-a născut aici în 1756.","Familia Mozart a locuit la etajul 3 al casei timp de 26 de ani."]},"AT-Mirabell":{"i":"/geo-images/austria/mirabell-palace.webp","s":"Palatul Mirabell este o capodoperă a arhitecturii baroce din Salzburg, construit în 1606 de prințul-arhiepiscop Wolf Dietrich von Raitenau pentru iubita sa, Salome Alt.","f":["Palatul a fost numit inițial Palatul Altenau.","Wolfgang Amadeus Mozart și tatăl său au cântat odată în Sala de Marmură."]},"AT-Grossglockner":{"i":"/geo-images/austria/grossglockner.webp","s":"Grossglockner, situat la granița dintre Carintia și Tirol, este cel mai înalt munte din Austria, având 3.798 de metri, și bijuteria maiestuoasă a lanțului Hohe Tauern.","f":["Grossglockner este cel mai înalt munte din Austria, având 3.798 m.","La baza sa se află Pasterze, cel mai mare ghețar din Austria."]},"AT-Zillertal":{"i":"/geo-images/austria/zillertal.webp","s":"Valea Zillertal din Tirol este una dintre cele mai faimoase și mai pline de viață văi alpine din Europa, care s-a impus ca destinație supremă pentru vacanțele active.","f":["Zillertal este cea mai mare vale laterală a Văii Inn din Tirol.","Ghețarul Hintertux permite schiatul în 365 de zile pe an."]},"AT-Kitzbuehel":{"i":"/geo-images/austria/kitzb-hel.webp","s":"Kitzbühel, situat în Tirol, este, fără îndoială, una dintre cele mai exclusiviste și prestigioase stațiuni de sporturi de iarnă din Alpi.","f":["Cursa Hahnenkamm de pe pârtia Streif este considerată una dintre cele mai dificile curse de schi din lume.","Orașul vechi din Kitzbühel are o vechime de peste 700 de ani."]},"AT-Hallstatt":{"i":"/geo-images/austria/hallstatt.webp","s":"Hallstatt este un sat faimos în întreaga lume pe malul lacului Hallstatt, cunoscut pentru casele sale pitorești din lemn și cea mai veche mină de sare din lume.","f":["Hallstatt are cea mai veche mină de sare din lume (peste 7.000 de ani).","A dat numele 'Culturii Hallstatt', o eră a epocii europene timpurii a fierului."]},"AT-Wolfgangsee":{"i":"/geo-images/austria/lake-wolfgang.webp","s":"Wolfgangsee (Lacul Wolfgang) este una dintre cele mai strălucitoare bijuterii naturale din Salzkammergut și fascinează cu apa sa cristalină, de un albastru intens, care atinge vara o calitate excel...","f":["Lacul este împărțit între landurile Salzburg și Austria Superioară.","Vara, apa limpede se încălzește până la 24°C."]},"AT-NeusiedlerSee":{"i":"/geo-images/austria/lake-neusiedl.webp","s":"Lacul Neusiedl (Neusiedler See) din Burgenland este un fenomen natural fascinant și cel mai mare lac din Austria.","f":["Lacul este împărțit între Austria și Ungaria (unde este numit Fertő tó).","Adâncimea medie a apei este de doar aproximativ 1 metru."]},"AT-Melk":{"i":"/geo-images/austria/melk-abbey.webp","s":"Abația Melk este o capodoperă barocă pe o stâncă deasupra Dunării, cunoscută pentru biblioteca sa magnifică și biserica aurită a abației.","f":["Abația Melk este cea mai mare mănăstire benedictină din Austria.","A fost complet reconstruită în stil baroc la începutul secolului al XVIII-lea de către arhitectul Jakob Prandt"]},"AT-Heiligenblut":{"i":"/geo-images/austria/heiligenblut.webp","s":"Heiligenblut am Großglockner este unul dintre cele mai pitorești și renumite sate de munte din Austria, situat la o altitudine de aproape 1.300 de metri în Parcul Național Hohe Tauern.","f":["Celebrul motiv fotografic arată biserica cu Grossglockner în fundal.","Numele orașului derivă din legenda despre „Sângele Sfânt” (Heiliges Blut)."]},"AT-Semmering":{"i":"/geo-images/austria/semmering-railway.webp","s":"Calea ferată Semmering (Semmeringbahn), care leagă Austria Inferioară de Stiria, nu este doar o arteră de transport importantă, ci și o capodoperă a ingineriei de la mijlocul secolului al XIX-lea.","f":["Construită între 1848 și 1854 de Carl Ritter von Ghega.","Depășește o diferență de altitudine de aproximativ 460 de metri."]},"AT-Grossalpenstrasse":{"i":"/geo-images/austria/grossglockner-high-alpine-road.webp","s":"Drumul Alpin Grossglockner (Großglockner Hochalpenstraße) nu este doar cel mai faimos drum alpin din Austria, ci și o minune arhitecturală construită în anii 1930 în mijlocul unor peisaje montane s...","f":["A fost construit între 1930 și 1935 într-o realizare inginerească magistrală.","Cel mai înalt punct al trecătoarei este Hochtor la 2.504 metri deasupra nivelului mării."]},"AT-Hohensalzburg":{"i":"/geo-images/austria/hohensalzburg.webp","s":"Fortăreața Hohensalzburg este un simbol vizibil de departe al orașului lui Mozart, Salzburg, așezată maiestuos pe dealul Festungsberg, deasupra acoperișurilor centrului vechi în stil baroc.","f":["Cu aproximativ 7.000 de metri pătrați de suprafață construită, este unul dintre cele mai mari castele din Euro","Fortăreața nu a fost niciodată asediată cu succes pe parcursul a 900 de ani."]},"AT-Belvedere":{"i":"/geo-images/austria/belvedere.webp","s":"Palatul Belvedere din Viena este unul dintre cele mai magnifice complexe de palate baroce din Europa și este format din două clădiri – Belvedere Superior și Inferior.","f":["Complexul de palate a fost construit pentru comandantul Prințul Eugen de Savoia.","Este format din două palate: Belvedere Superior și Belvedere Inferior."]},"AT-Hohenwerfen":{"i":"/geo-images/austria/hohenwerfen.webp","s":"Impozantul Castel Hohenwerfen se înalță dramatic pe un con stâncos abrupt de 155 de metri înălțime, deasupra văii Salzach, fiind înconjurat de fundalul muntos impresionant al Munților Tennengebirge.","f":["Construit în 1077 de către Arhiepiscopul Gebhard de Salzburg.","A servit de-a lungul istoriei sale ca o închisoare puternic fortificată pentru personalități de rang înalt."]},"AT-Eggenberg":{"i":"/geo-images/austria/eggenberg.webp","s":"Palatul Eggenberg, situat la periferia vestică a orașului Graz, este cel mai magnific complex de palate baroce din Stiria și a fost conceput ca o lucrare de artă alegorică complexă.","f":["Arhitectura palatului este un calendar arhitectural exact.","Are exact 365 de ferestre, reprezentând zilele unui an."]},"AT-Hochosterwitz":{"i":"/geo-images/austria/hochosterwitz.webp","s":"Castelul Hochosterwitz este cel mai impresionant reper istoric al Carintiei și este considerat unul dintre cele mai frumoase ansambluri de castele din Europa.","f":["Castelul este renumit în întreaga lume pentru ascensiunea sa prin 14 porți de castel securizate.","A fost construit pe o stâncă de calcar izolată, înaltă de 150 de metri."]},"AT-Ambras":{"i":"/geo-images/austria/ambras.webp","s":"Palatul Ambras este situat pitoresc pe un deal deasupra orașului Innsbruck din Tirol și reprezintă o moștenire culturală a Renașterii europene.","f":["Este considerat cel mai vechi muzeu din lume datorită colecțiilor lui Ferdinand al II-lea.","Camera de Artă și Curiozități conține obiecte bizare, cum ar fi corali, exotice și instrumente științifice."]},"AT-Krimml":{"i":"/geo-images/austria/krimml.webp","s":"Cascadele Krimml din landul Salzburg sunt, cu o înălțime impresionantă de 380 de metri, cele mai înalte cascade din Austria și se numără printre primele cinci ca înălțime din lume.","f":["La 380 de metri, Cascadele Krimml sunt cele mai înalte din Austria.","Apa se prăvălește în jos în trei cascade masive."]},"AT-HallstaetterSee":{"i":"/geo-images/austria/hallstatt.webp","s":"Lacul Hallstatt (Hallstätter See) din Salzkammergut este o bijuterie naturală de o frumusețe dramatică, încorporată ca un fiord întunecat adânc între pereții stâncoși abrupți ai masivului Dachstein.","f":["Lacul are o adâncime considerabilă de 125 de metri în cel mai adânc punct al său.","Face parte din nucleul regiunii Hallstatt-Dachstein/Salzkammergut din Patrimoniul Mondial UNESCO."]},"AT-Dachstein":{"i":"/geo-images/austria/dachstein.webp","s":"Dachstein este cel mai înalt munte din landurile Stiria și Austria Superioară și este, fără îndoială, unul dintre cele mai impunătoare masive din Alpii Calcaroși Nordici.","f":["Hoher Dachstein este cel mai înalt vârf al masivului, având 2.995 m.","Ghețarul Dachstein este cel mai estic ghețar din Alpi."]},"AT-Staatsoper":{"i":"/geo-images/austria/vienna.webp","s":"Opera de Stat din Viena (Wiener Staatsoper), situată magnific pe bulevardul Ringstrasse, este una dintre cele mai importante și renumite opere la nivel internațional din lume.","f":["Clădirea a fost proiectată de arhitecții August Sicard von Sicardsburg și Eduard van der Nüll.","Numită inițial 'Teatrul de Operă al Curții Imperiale și Regale' (K.K. Hof-Operntheater)."]},"AT-Albertina":{"i":"/geo-images/austria/albertina.webp","s":"Albertina, situată în inima Vienei, chiar lângă Hofburg, este unul dintre cele mai importante muzee de artă din lume.","f":["Fondată în 1776 de Ducele Albert de Saxa-Teschen.","Colecția de artă grafică cuprinde peste un milion de gravuri și 60.000 de desene."]},"AT-KHM":{"i":"/geo-images/austria/khm.webp","s":"Muzeul de Istorie a Artei (Kunsthistorisches Museum - KHM) din Viena este unul dintre cele mai magnifice și importante muzee din lume, construit de Împăratul Franz Joseph I pentru a prezenta public...","f":["Deschis în 1891, proiectat de Gottfried Semper și Karl Freiherr von Hasenauer.","Stă exact simetric față de geamănul său arhitectural, Muzeul de Istorie Naturală."]},"AT-Prater":{"i":"/geo-images/austria/prater.webp","s":"Praterul vienez (Wiener Prater) este un amestec fascinant între o zonă vastă de recreere naturală și faimosul parc de distracții, 'Wurstelprater'.","f":["Marea Roată din Viena a jucat un rol principal în filmul clasic noir „Al treilea om” (The Third Man).","Praterul a fost inițial un teren imperial de vânătoare și a fost deschis publicului în 1766."]},"AT-SchoenbrunnZoo":{"i":"/geo-images/austria/schoenbrunn-zoo.webp","s":"Grădina Zoologică Schönbrunn (Tiergarten Schönbrunn) din Viena este cea mai veche grădină zoologică existentă din lume, fiind fondată în 1752 de împăratul habsburgic Francisc I Ștefan, soțul Mariei...","f":["Grădina zoologică a fost fondată în 1752 ca o menajerie imperială.","Cuștile de animale baroce originale sunt așezate în formă de stea în jurul Pavilionului de Mic Dejun."]},"AT-Hundertwasser":{"i":"/geo-images/austria/hundertwasser.webp","s":"Casa Hundertwasser din al 3-lea district al Vienei este un proiect arhitectural colorat și neconvențional care întoarce pe dos regulile arhitecturii moderne.","f":["Proiectată de Friedensreich Hundertwasser, împreună cu arhitectul Josef Krawina.","Construită între 1983 și 1985 ca o clădire rezidențială a municipalității Vienei."]},"AT-Klosterneuburg":{"i":"/geo-images/austria/klosterneuburg.webp","s":"Abația Klosterneuburg (Stift Klosterneuburg), situată pitoresc la nord de Viena, chiar pe malul Dunării, este unul dintre cele mai importante centre religioase, culturale și istorice din Austria.","f":["Fondată în anul 1114 de Leopold al III-lea cel Sfânt.","Altarul de la Verdun (1181), realizat din plăci emailate, este una dintre cele mai importante opere de artă al"]},"AT-Achensee":{"i":"/geo-images/austria/achensee.webp","s":"Achensee (Lacul Achen), adesea numit cu afecțiune „Marea Tirolului”, este cel mai mare lac din Tirol și un paradis natural uluitor în inima Alpilor.","f":["Achensee este cel mai mare și cel mai adânc lac din landul Tirol.","Datorită vânturilor sale termice, este un punct de atracție pentru marinari și windsurferi."]},"AT-Pyramidenkogel":{"i":"/geo-images/austria/pyramidenkogel.webp","s":"Pyramidenkogel este o creastă muntoasă împădurită în Carintia, la sud de Wörthersee, dar este cunoscută cel mai mult pentru o structură uluitoare: Turnul de Observare Pyramidenkogel.","f":["Turnul de observare are exact 100 de metri înălțime, fiind cel mai înalt turn de lemn din lume.","Structura curbată constă din 16 suporturi masive din lemn stratificat încleiat."]},"AT-Arlberg":{"i":"/geo-images/austria/arlberg.webp","s":"Arlberg, granița montană naturală dintre landurile Tirol și Vorarlberg, este un mit global în sporturile de iarnă alpine și este considerat „leagănul schiului alpin”.","f":["Considerat „leagănul schiului alpin” (primul club de schi a fost fondat aici în 1901).","Ski Arlberg este cea mai mare zonă de schi din Austria, cu 302 km de pârtii."]},"at-villach":{"i":"/geo-images/austria/villach.webp","s":"Villach este al șaptelea oraș ca mărime din Austria și un important nod de transport în Carintia.","f":["Villach este al doilea oraș ca mărime din Carintia.","Orașul este situat la confluența râurilor Gail și Drava."]},"at-wiener-neustadt":{"i":"/geo-images/austria/wiener-neustadt.webp","s":"Wiener Neustadt este un oraș important din Austria Inferioară, situat la sud de Viena.","f":["Wiener Neustadt a fost fondat în 1194 de ducele Babenberg Leopold al V-lea.","O parte din răscumpărarea pentru Richard Inimă de Leu a fost folosită pentru a finanța fondarea orașului."]},"at-krems":{"i":"/geo-images/austria/krems.webp","s":"Krems an der Donau este al cincilea oraș ca mărime din Austria Inferioară și se află la marginea estică a regiunii Wachau.","f":["Krems a fost menționat pentru prima dată într-un document în anul 995.","Orașul formează un oraș dublu împreună cu Stein an der Donau."]},"at-wels":{"i":"/geo-images/austria/wels.webp","s":"Wels este al optulea oraș ca mărime din Austria și al doilea oraș ca mărime din Austria Superioară.","f":["Wels a fost un oraș important sub romani, cunoscut sub numele de Ovilava.","Împăratul Maximilian I a murit în Castelul Wels în 1519."]},"at-dornbirn":{"i":"/geo-images/austria/dornbirn.webp","s":"Dornbirn este cel mai populat oraș din statul austriac Vorarlberg și cel mai important nod economic al regiunii.","f":["Dornbirn are mai mulți locuitori decât capitala statului, Bregenz.","În secolul al XIX-lea, orașul a fost centrul industriei textile din Vorarlberg."]},"at-steyr":{"i":"/geo-images/austria/steyr.webp","s":"Steyr este un oraș istoric din Austria Superioară, situat la confluența râurilor Enns și Steyr.","f":["Steyr a fost o locație importantă pentru producția de arme și vehicule.","Bummerlhaus din piața orașului este o capodoperă a arhitecturii gotice."]},"at-feldkirch":{"i":"/geo-images/austria/feldkirch.webp","s":"Feldkirch este cea mai vestică municipalitate din Austria și se învecinează cu Liechtenstein și Elveția.","f":["Castelul Schattenburg este unul dintre cele mai bine conservate castele din Europa Centrală.","Feldkirch a primit drepturile de oraș în 1218 de la Hugo I de Montfort."]},"at-leoben":{"i":"/geo-images/austria/leoben.webp","s":"Leoben este al doilea oraș ca mărime din Stiria și este situat în centrul industriei miniere și metalurgice din Austria.","f":["Leoben este centrul economic al Stiriei Superioare.","Universitatea din Leoben a fost fondată în 1840."]},"at-wolfsberg":{"i":"/geo-images/austria/wolfsberg.webp","s":"Wolfsberg este al treilea oraș ca mărime din Carintia și centrul văii Lavant.","f":["Wolfsberg a fost menționat pentru prima dată într-un document în 1178.","Castelul Wolfsberg a fost reconstruit în secolul al XIX-lea în stil Tudor."]},"at-lienz":{"i":"/geo-images/austria/lienz.webp","s":"Lienz este capitala și centrul economic al Tirolului de Est.","f":["Lienz este singurul oraș din Tirolul de Est.","Orașul are o climă de tip mediteranean și mulți palmieri în centru."]},"at-zell-am-see":{"i":"/geo-images/austria/zell-am-see.webp","s":"Zell am See este un oraș pitoresc din statul Salzburg, situat pe malul lacului Zell.","f":["Lacul Zell are calitatea apei potabile.","Zell am See și Kaprun formează împreună una dintre cele mai importante regiuni turistice din Austria."]},"at-worthersee":{"i":"/geo-images/austria/worthersee.webp","s":"Lacul Wörthersee este cel mai mare și probabil cel mai faimos lac din Carintia.","f":["Lacul Wörthersee poate atinge temperaturi ale apei de până la 27 de grade Celsius vara.","Are aproape 17 kilometri lungime și până la 1,6 kilometri lățime."]},"at-kitzsteinhorn":{"i":"/geo-images/austria/kitzsteinhorn.webp","s":"Kitzsteinhorn este un munte din Hohe Tauern și găzduiește prima zonă de schi pe ghețar din Austria.","f":["Vârful Kitzsteinhorn se află la o altitudine de 3.203 metri.","Gipfelwelt 3000 este cel mai înalt punct din regiunea Salzburg ușor accesibil pentru oricine."]},"at-nockberge":{"i":"/geo-images/austria/nockberge.webp","s":"Parcul Biosferei Nockberge din Carintia este cunoscut pentru culmile sale blânde și rotunde (Nocken), care contrastează puternic cu vârfurile accidentate din alte regiuni alpine.","f":["Munții Nockberge constau în principal din roci de șist, ceea ce explică forma lor rotundă.","Drumul Nockalm are o lungime de 34 de kilometri și are 52 de curbe în ac de păr."]},"at-kalkalpen-np":{"i":"/geo-images/austria/kalkalpen-np.webp","s":"Parcul Național Kalkalpen din Austria Superioară protejează cea mai mare zonă forestieră contiguă din Austria.","f":["Parcul național include Munții Sengsen și Reichraminger Hintergebirge.","Patru cincimi din suprafața parcului național sunt acoperite de păduri."]},"at-gesauze":{"i":"/geo-images/austria/gesauze.webp","s":"Gesäuse din Stiria este cunoscut pentru vârfurile sale abrupte de calcar care se ridică deasupra râului tumultuos Enns.","f":["Numele „Gesäuse” provine de la vuietul puternic (Sausen) al râului Enns.","Parcul național a fost înființat în 2002."]},"at-thayatal-np":{"i":"/geo-images/austria/thayatal-np.webp","s":"Parcul Național Thayatal din Austria Inferioară este cel mai mic parc național din Austria și se învecinează cu Parcul Național Podyjí din Cehia.","f":["Cu o suprafață de aproximativ 1.330 de hectare, Parcul Național Thayatal este cel mai mic din Austria.","Valea Thaya este o vale de defileu clasică cu multe coturi de râu."]},"at-oetztal":{"i":"/geo-images/austria/oetztal.webp","s":"Valea Ötz (Ötztal) din Tirol este cea mai lungă vale laterală a văii Innului și este înconjurată de munți maiestuoși de 3.000 de metri.","f":["Valea Ötztal are aproximativ 65 de kilometri lungime.","Cascada Stuibenfall din Ötztal este cea mai înaltă cascadă din Tirol, cu o înălțime de 159 de metri."]},"at-eisriesenwelt":{"i":"/geo-images/austria/eisriesenwelt.webp","s":"Eisriesenwelt din Werfen este cea mai mare peșteră de gheață din lume.","f":["Cu o lungime de 42 km, Eisriesenwelt este considerat cel mai mare sistem de peșteri de gheață de pe Pământ.","Portalul peșterii este situat la o altitudine de 1.641 metri."]},"at-donau-auen-np":{"i":"/geo-images/austria/donau-auen-np.webp","s":"Parcul Național Donau-Auen se întinde între Viena și Bratislava și păstrează unul dintre ultimele peisaje mari de câmpie inundabilă a unui râu nereglat din Europa Centrală.","f":["Donau-Auen este cel mai mare peisaj de câmpie inundabilă naturală din Europa Centrală.","Parcul a fost fondat în 1996 după ce a fost împiedicată construirea unei centrale electrice la Hainburg."]},"at-gottweig-abbey":{"i":"/geo-images/austria/gottweig-abbey.webp","s":"Abația Göttweig este o mănăstire benedictină pe un deal la sud de Krems, în Austria Inferioară.","f":["Abația Göttweig a fost fondată în 1083 de episcopul Altmann din Passau.","După un incendiu în 1718, abația a fost reconstruită în stil baroc sub conducerea lui Johann Lukas von Hildebr"]},"at-stift-admont":{"i":"/geo-images/austria/stift-admont.webp","s":"Abația Admont din Stiria este cea mai veche mănăstire existentă din regiune și este cunoscută în întreaga lume pentru biblioteca sa uluitoare.","f":["Abația Admont a fost fondată în anul 1074.","Biblioteca mănăstirii are 70 de metri lungime, 14 metri lățime și 13 metri înălțime."]},"at-salzburg-festival":{"i":"/geo-images/austria/salzburg-festival.webp","s":"Festivalul de la Salzburg este cel mai important festival de muzică clasică și artele spectacolului din lume.","f":["Festivalul a fost fondat în 1920 de Max Reinhardt, Hugo von Hofmannsthal și Richard Strauss.","Ansamblul Festspielhaus din Salzburg include Grosses Festspielhaus, Haus für Mozart și Felsenreitschule."]},"at-minimundus":{"i":"/geo-images/austria/minimundus.webp","s":"Minimundus din Klagenfurt pe Lacul Wörthersee este un parc miniatural popular și este adesea menționat ca „mica lume de pe Wörthersee”.","f":["Toate modelele din Minimundus sunt construite la o scară uniformă de 1:25.","Parcul în miniatură a fost deschis în 1958."]},"at-schladming-dachstein":{"i":"/geo-images/austria/schladming-dachstein.webp","s":"Regiunea de vacanță Schladming-Dachstein din Stiria este una dintre cele mai importante destinații alpine din Austria.","f":["Leagănul de schi cu 4 munți leagă munții Hauser Kaibling, Planai, Hochwurzen și Reiteralm fără întrerupere.","Schladming a găzduit deja Campionatele Mondiale de Schi Alpin de mai multe ori (cel mai recent în 2013)."]},"at-kitzbuhel-ski":{"i":"/geo-images/austria/kitzbuhel-ski.webp","s":"Kitzbühel din Tirol este una dintre cele mai exclusiviste și cunoscute stațiuni de sporturi de iarnă din lume.","f":["Pârtia Streif este considerată cea mai dificilă și periculoasă pârtie de coborâre din lume.","În timpul cursei Hahnenkamm, schiorii ating viteze de până la 140 km/h la finalul coborârii."]},"at-mozarteum-salzburg":{"i":"/geo-images/austria/mozarteum-salzburg.webp","s":"Fundația Internațională Mozarteum din Salzburg are misiunea de a păstra moștenirea lui Wolfgang Amadeus Mozart.","f":["Fundația Mozarteum a fost fondată în 1880 de cetățenii din Salzburg.","Mozart s-a născut în 1756 în locul său de naștere din Getreidegasse."]},"at-riegersburg":{"i":"/geo-images/austria/riegersburg.webp","s":"Castelul Riegersburg stă maiestuos pe o stâncă de bazalt de 482 de metri înălțime a unui vulcan stins din sud-estul Stiriei.","f":["Castelul a fost menționat pentru prima dată într-un document din secolul al XI-lea.","Are un zid de apărare de 3 kilometri lungime cu unsprezece bastioane și șapte porți."]},"at-kufstein-fortress":{"i":"/geo-images/austria/kufstein-fortress.webp","s":"Fortăreața Kufstein este simbolul orașului Kufstein din Tirol și tronează vizibil de departe pe un deal deasupra râului Inn.","f":["Fortăreața a fost menționată pentru prima dată într-un document din secolul al XIII-lea ca proprietate a episc","Împăratul Maximilian I a extins masiv fortăreața în secolul al XVI-lea cu „Turnul Împăratului” (Kaiserturm) ro"]},"at-kreuzenstein":{"i":"/geo-images/austria/kreuzenstein.webp","s":"Castelul Kreuzenstein de lângă Viena este un castel spectaculos impresionant care a fost construit în secolul al XIX-lea pe rămășițele unui castel medieval în ruină.","f":["Castelul ori intia de Sud"]},"at-purkersdorf":{"i":"/geo-images/austria/at-purkersdorf.webp","s":"Purkersdorf este situat direct la granița cu Viena, în inima Pădurii Vieneze, combinând locuințele în natură cu farmecul istoric.","f":["Locație în Pădurea Vieneză","Sanatoriul Purkersdorf"]},"at-lauterach":{"i":"/geo-images/austria/at-lauterach.webp","s":"Lauterach este o municipalitate vibrantă din Valea Rinului, lângă Lacul Constanța, oferind un amestec perfect între rezervații naturale și dinamism economic.","f":["Locație în Valea Rinului","Zona umedă Lauteracher Ried"]},"at-maria-enzersdorf":{"i":"/geo-images/austria/at-maria-enzersdorf.webp","s":"Maria Enzersdorf, la marginea Pădurii Vieneze, impresionează prin impunătorul Castel Liechtenstein și tradiția sa bogată în viticultură din sudul Vienei.","f":["Castelul Liechtenstein","Castelul Hunyadi"]},"at-guntramsdorf":{"i":"/geo-images/austria/at-guntramsdorf.webp","s":"Guntramsdorf este un centru viticol și industrial important din regiunea termală, care impresionează prin iazurile sale și centrul istoric.","f":["Viticultură în regiunea termală","Centru industrial"]},"at-sankt-andrae":{"i":"/geo-images/austria/at-sankt-andrae.webp","s":"Sankt Andrä din Valea Lavant are o istorie semnificativă ca fost sediu episcopal și impresionează prin catedrala sa impunătoare.","f":["Locație în Valea Lavant","Fost sediu episcopal"]},"at-koeflach":{"i":"/geo-images/austria/at-koeflach.webp","s":"Köflach din Stiria de Vest este cunoscut sub numele de orașul Lipițanilor și oferă un amestec de wellness și istorie prin Therme Nova și tradiția sa minieră.","f":["Patria Lipițanilor la Piber","Therme Nova"]},"at-wiener-neudorf":{"i":"/geo-images/austria/at-wiener-neudorf.webp","s":"Wiener Neudorf este un centru economic puternic la sud de Viena, care îmbină zonele industriale moderne cu zone verzi de recreere și moștenirea istorică.","f":["Centrul industrial IZ NÖ-Süd","Conexiune Badner Bahn"]},"at-sankt-johann-in-tirol":{"i":"/geo-images/austria/at-sankt-johann-in-tirol.webp","s":"O comună de piață fermecătoare în inima Alpilor Kitzbühel, care îmbină perfect tradiția, istoria minieră și turismul modern de tot parcursul anului.","f":["Situat în bazinul larg al văii Leukental","Fost centru important pentru mineritul cuprului"]},"at-rum":{"i":"/geo-images/austria/at-rum.webp","s":"O comună de piață dinamică imediat la est de Innsbruck, care oferă o calitate ridicată a vieții la poalele maiestuoasei Nordkette.","f":["Vecin direct al capitalei provinciei Tirol","Situat în valea Inn pe munții de mijloc însoriți"]},"at-sankt-valentin":{"i":"/geo-images/austria/at-sankt-valentin.webp","s":"Cel mai vestic oraș din Austria Inferioară este un nod important de transport și locație industrială cu o bogată istorie feroviară.","f":["Nod important pe linia de cale ferată Westbahn","Sediul fabricii de tractoare Case IH pentru Europa"]},"at-velden-am-woerther-see":{"i":"/geo-images/austria/at-velden-am-woerther-see.webp","s":"O stațiune sofisticată pe malul vestic al lacului Wörthersee, cunoscută pentru castelul său plin de farmec, cazinoul și ca loc de întâlnire al înaltei societăți.","f":["Găzduiește faimosul castel galben de pe malul lacului","Una dintre cele mai exclusive stațiuni de vară din Austria"]},"at-attnang-puchheim":{"i":"/geo-images/austria/at-attnang-puchheim.webp","s":"Un oraș din Austria Superioară care este considerat unul dintre cele mai importante noduri feroviare ale țării și are o istorie modernă agitată.","f":["Nod feroviar strategic între Linz și Salzburg","Deține superba basilică de pelerinaj Maria Puchheim"]},"at-neusiedl-am-see":{"i":"/geo-images/austria/at-neusiedl-am-see.webp","s":"Poarta însorită către Parcul Național Neusiedler See-Seewinkel impresionează prin viticultura de primă clasă, sporturile nautice și farmecul panonic.","f":["Reședință de district pe malul nordic al lacului Neusiedler See","Centru important al viticulturii din Burgenland"]},"at-sierning":{"i":"/geo-images/austria/at-sierning.webp","s":"O comună de piață încărcată de istorie la poalele Alpilor din Austria Superioară, care impresionează prin castelul său superb și proximitatea de orașul industrial Steyr.","f":["Situat în valea pitorească a pârâului Sierning","Găzduiește castelul renascentist Sierning, care merită vizitat"]},"at-berndorf":{"i":"/geo-images/at/at-berndorf.webp","s":"Berndorf este un oraș industrial situat în valea Triesting, faimos pentru legătura istorică cu familia Krupp și pentru sălile de clasă unice în lume.","f":["Orașul industrial al dinastiei Krupp","Celebrele săli de clasă în stil istoric"]},"at-deutsch-wagram":{"i":"/geo-images/at/at-deutsch-wagram.webp","s":"Deutsch-Wagram, situat în câmpia Marchfeld, este faimos pentru bătălia istorică din 1809 și este considerat un oraș pionier al căilor ferate austriece.","f":["Locul bătăliei de la Wagram","Prima gară din Austria (Nordbahn)"]},"at-voels":{"i":"/geo-images/at/at-voels.webp","s":"Völs este o comună de piață animată situată la vest de Innsbruck, reprezentând o punte perfectă între confortul urban și natura alpină.","f":["Situat la vest de Innsbruck","Centru economic important (Cyta)"]},"at-fuerstenfeld":{"i":"/geo-images/at/at-fuerstenfeld.webp","s":"Fürstenfeld, capitala termală a Stiriei, impresionează prin farmecul său istoric, vechea fortăreață și cel mai mare ștrand în aer liber din Europa.","f":["Capitala termală a Stiriei","Cel mai mare ștrand din Europa"]},"at-neulengbach":{"i":"/geo-images/at/at-neulengbach.webp","s":"Neulengbach, situat în Wienerwald, îmbină istoria imperială cu moștenirea artistică, servind ca o poartă verde către capitala federală austriacă.","f":["Castelul impunător Neulengbach","Orașul lui Egon Schiele"]},"at-finkenstein-am-faaker-see":{"i":"/geo-images/at/at-finkenstein-am-faaker-see.webp","s":"Finkenstein am Faaker See impresionează prin locația sa lângă apele turcoaz, ruinele impunătoare ale castelului și munții Karawanken maiestuoși din fundal.","f":["Arena din cetatea Finke const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}

// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
