<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#060614;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:#0a0a1f;border-bottom:1px solid #ffffff14;position:relative;z-index:5}
header a.back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#ffffff14;color:#fff;text-decoration:none;font-weight:700}
header a.back:active{background:#ffffff28}
header h1{margin:0;font-size:1rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .langs{display:flex;gap:.25rem}
.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;background-image:radial-gradient(1.2px 1.2px at 12% 22%,#ffffff70,transparent),radial-gradient(1px 1px at 28% 68%,#ffffff55,transparent),radial-gradient(1.4px 1.4px at 47% 38%,#cfe4ff66,transparent),radial-gradient(1px 1px at 63% 18%,#ffffff50,transparent),radial-gradient(1.3px 1.3px at 78% 72%,#ffffff66,transparent),radial-gradient(1px 1px at 88% 33%,#cfe4ff55,transparent),radial-gradient(1px 1px at 38% 88%,#ffffff44,transparent),radial-gradient(1.2px 1.2px at 92% 58%,#ffffff55,transparent);background-repeat:no-repeat}
#svg{width:100%;height:100%;display:block;cursor:grab;position:relative;z-index:1}
#svg.drag{cursor:grabbing}
.region{fill:#161e3a;stroke:#6f9bf0;stroke-width:1.1;stroke-opacity:.7;transition:fill .15s}
.region:hover{fill:#28356e}
/* Island maps: the single island shape is decorative — don't let it grab taps
   (no sticky hover-highlight on touch, POI markers stay easy to tap). Pan still
   works via the svg background. */
#gR.noint .region{pointer-events:none}
#gR.noint .region:hover{fill:#161e3a}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#0a0f20;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#7cc0ff;filter:drop-shadow(0 0 2.4px #4aa6ff)}
.poi.g-sight circle{fill:#fcd34d;filter:drop-shadow(0 0 2.4px #f5b528)}
.poi.g-nature circle{fill:#4ade80;filter:drop-shadow(0 0 2.4px #22c55e)}
.poi.g-history circle{fill:#d0a6ff;filter:drop-shadow(0 0 2.4px #b266ff)}
.poi.g-industry circle{fill:#ffb066;filter:drop-shadow(0 0 2.4px #fb923c)}
.poi.g-other circle{fill:#b8c0cc;filter:drop-shadow(0 0 2px #9ca3af)}
.poi.dim{opacity:.16;pointer-events:none}
.poi.dim circle{filter:none}
.poi,.cluster{transition:opacity .2s}
#svg.dim-pois .poi,#svg.dim-pois .cluster{opacity:.1!important}
#svg.dim-pois .poi circle{filter:none}
.poi.match{pointer-events:auto}
.poi.match circle{stroke:#fff;stroke-width:2;filter:drop-shadow(0 0 4px #fff)}
.poi:hover circle,.poi.active circle{r:7.5;fill:#fff;opacity:1;filter:drop-shadow(0 0 6px #cfeaff) drop-shadow(0 0 11px #7fd0ff)}
.poi-metro{cursor:pointer}
.poi-metro .pm-halo{fill:#ffd54a;opacity:.18;animation:pmpulse 2.2s ease-in-out infinite}
.poi-metro .pm-ring{fill:none;stroke:#ffd54a;stroke-width:1.6;opacity:.85}
.poi-metro .pm-dot{fill:#fff;filter:drop-shadow(0 0 5px #ffd54a)}
.poi-metro .pm-label{fill:#fff;font-size:11px;font-weight:800;paint-order:stroke;stroke:#06061b;stroke-width:3.2px;stroke-linejoin:round;letter-spacing:.2px}
.poi-metro:hover .pm-ring,.poi-metro:focus .pm-ring{stroke-width:2.4;opacity:1}
.poi-metro:hover .pm-label{fill:#ffe98a}
@keyframes pmpulse{0%,100%{opacity:.16;transform:scale(1)}50%{opacity:.34;transform:scale(1.18)}}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:rgba(11,19,35,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(120,180,255,.3);border-radius:18px 18px 0 0;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -12px 44px rgba(0,0,0,.6)}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a,.popup .list .nl{display:flex;align-items:center;gap:.6rem;padding:.4rem .45rem;border-radius:10px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:hover,.popup .list a:active{background:rgba(120,180,255,.12)}
.popup .list .lthumb{width:42px;height:42px;border-radius:9px;flex-shrink:0;background:#1a2740 center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.popup .list .lthumb .dot{width:9px;height:9px;border-radius:50%}
.popup .list .lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.popup .list .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.popup .list .g{font-size:.64rem;color:#9fc4ff;text-transform:uppercase;letter-spacing:.04em}
.popup .list .lgo{color:#7fb0ff;font-size:1.2rem;font-weight:700;flex-shrink:0;padding-right:.3rem}
.popup .list .nl{color:#ffffffb0;font-style:normal}
.mapcard{position:fixed;z-index:20;width:max-content;min-width:150px;max-width:230px;background:rgba(11,19,35,.82);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);border:1px solid rgba(120,180,255,.34);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.62),0 0 0 1px rgba(120,180,255,.08);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-100%) translateY(-15px) scale(.95);transform-origin:bottom center;transition:opacity .16s,transform .16s}
.mapcard.open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-100%) translateY(-15px) scale(1)}
.mapcard--below{transform:translate(-50%,0) translateY(15px) scale(.95);transform-origin:top center}
.mapcard--below.open{transform:translate(-50%,0) translateY(15px) scale(1)}
.mapcard::after{content:"";position:absolute;left:var(--ax,50%);top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(11,19,35,.82)}
.mapcard--below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:rgba(11,19,35,.82)}
.mapcard .mc-img{width:100%;aspect-ratio:16/9;background:#1a2740 center/cover no-repeat;display:none;border-radius:13px 13px 0 0}
.mapcard .mc-img.has{display:block}
.mapcard .mc-body{padding:9px 11px 11px}
.mapcard .mc-type{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#7fb0ff;font-weight:700}
.mapcard .mc-name{font-size:.95rem;font-weight:800;color:#eef4ff;margin:1px 0 5px;line-height:1.2}
.mapcard .mc-desc{font-size:.76rem;color:#cfe0ff;line-height:1.4;margin:0 0 9px;display:none}
.mapcard .mc-desc.show{display:block}
.mapcard .mc-more{display:inline-block;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;text-decoration:none;font-weight:700;font-size:.78rem;padding:.42rem .75rem;border-radius:8px}
.mapcard .mc-x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:.95rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.burst{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}
.burst.open{display:block}
.burst-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst-line{stroke:rgba(120,185,255,.4);stroke-width:1.1;stroke-linecap:round;animation:burstFade .25s ease-out}
.burst-core{fill:#cdeeff;filter:drop-shadow(0 0 5px #7fd0ff)}
.burst-dots{position:absolute;inset:0}
.burst-dot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;animation:burstPop .22s ease-out}
.burst-dot .bd{width:15px;height:15px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(8,16,34,.6),0 0 10px currentColor;transition:transform .12s}
.burst-dot:hover .bd,.burst-dot:focus-visible .bd{transform:scale(1.3)}
.burst-dot .bl{font-size:.72rem;font-weight:700;color:#eef4ff;background:rgba(8,14,28,.82);border:1px solid rgba(120,180,255,.25);padding:1.5px 6px;border-radius:7px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
@keyframes burstPop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes burstFade{from{opacity:0}to{opacity:1}}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}
</style>

magasabb pontja"]},"austria-dachstein-gipfel-relief-v2":{"i":"/poi-images/austria-dachstein-gipfel-relief-v2.webp","s":"A Hoher Dachstein a Dachstein-hegység és Felső-Ausztria legmagasabb hegye.","f":["Magasság: 2995 m","Felső-Ausztria legmagasabb hegye"]},"austria-wildspitze-relief-v2":{"i":"/poi-images/austria-wildspitze-relief-v2.webp","s":"A Wildspitze 3768 méterrel az Ötztali-Alpok és Észak-Tirol legmagasabb hegye.","f":["Magasság: 3768 m","Észak-Tirol legmagasabb hegye"]},"austria-piz-buin-relief-v2":{"i":"/poi-images/austria-piz-buin-relief-v2.webp","s":"A Piz Buin Vorarlberg osztrák tartomány legmagasabb hegye.","f":["Magasság: 3312 m","Vorarlberg legmagasabb hegye"]},"austria-kitzsteinhorn-relief-v2":{"i":"/poi-images/austria-kitzsteinhorn-relief-v2.webp","s":"A Kitzsteinhorn egy ismert hegy a Magas-Tauernben, Kaprun közelében, Salzburgban.","f":["Magasság: 3203 m","Magas-Tauern"]},"austria-grimming-relief-v2":{"i":"/poi-images/austria-grimming-relief-v2.webp","s":"A Grimming egy jellegzetes hegy az Enns-völgyben, Stájerországban.","f":["Magasság: 2351 m","Szabadon álló tömb"]},"austria-zugspitze-at-relief-v2":{"i":"/poi-images/austria-zugspitze-at-relief-v2.webp","s":"A Zugspitze Németország és Ausztria határán fekszik.","f":["Magasság: 2962 m","Határhegy"]},"austria-grosser-priel-relief-v2":{"i":"/poi-images/austria-grosser-priel-relief-v2.webp","s":"A Großer Priel a Totes Gebirge legmagasabb csúcsa Felső-Ausztriában.","f":["Magasság: 2515 m","Totes Gebirge"]},"austria-hoher-goll-relief-v2":{"i":"/poi-images/austria-hoher-goll-relief-v2.webp","s":"A Hoher Göll a Berchtesgadeni-Alpok hegye Salzburg és Bajorország határán.","f":["Magasság: 2522 m","Berchtesgadeni-Alpok"]},"austria-almkogel-relief-v2":{"i":"/poi-images/austria-almkogel-relief-v2.webp","s":"Az Almkogel egy ismert hegy Felső-Ausztria előalpi régiójában.","f":["Magasság: 1513 m","Előalpok"]},"austria-feuerkogel-relief-v2":{"i":"/poi-images/austria-feuerkogel-relief-v2.webp","s":"A Feuerkogel Ebensee 'házi hegye' a Salzkammergutban.","f":["Magasság: 1625 m","Höllengebirge"]},"austria-traunstein-relief-v2":{"i":"/poi-images/austria-traunstein-relief-v2.webp","s":"A Traunstein egy jellegzetes mészkőhegy a Traun-tónál, a Salzkammergutban.","f":["Magasság: 1691 m","Salzkammergut"]},"austria-schafberg-relief-v2":{"i":"/poi-images/austria-schafberg-relief-v2.webp","s":"A Schafberg a Wolfgang-tó és a Mond-tó között fekszik a Salzkammergutban.","f":["Magasság: 1782 m","Salzkammergut"]},"austria-hoher-dachtein-gletscher-relief-v2":{"i":"/poi-images/austria-hoher-dachtein-gletscher-relief-v2.webp","s":"A Dachstein-masszívumban találhatók az Alpok legkeletibb gleccserei.","f":["Legkeletibb alpesi gleccserek","Turizmus"]},"austria-ansberg-relief-v2":{"i":"/poi-images/austria-ansberg-relief-v2.webp","s":"Az Ansberg Liezen közelében található Stájerországban.","f":["Magasság: 1845 m","Alacsony-Tauern"]},"austria-planneralm-relief-v2":{"i":"/poi-images/austria-planneralm-relief-v2.webp","s":"A Planneralm egy magashegyi legelőrégió Stájerországban.","f":["Magas-alpesi legelő","Síterep"]},"austria-kaibling-relief-v2":{"i":"/poi-images/austria-kaibling-relief-v2.webp","s":"A Hauser Kaibling egy jelentős síhegy a Schladmingi-Tauernben, Stájerországban.","f":["Magasság: 2015 m","Schladmingi-Tauern"]},"austria-dachstein-west-relief-v2":{"i":"/poi-images/austria-dachstein-west-relief-v2.webp","s":"A Dachstein-West egy ismert sírégió a Dachstein-masszívum északi nyúlványaiban.","f":["Sírégió","Dachstein-előhegység"]},"austria-murtal-alpen-relief-v2":{"i":"/poi-images/austria-murtal-alpen-relief-v2.webp","s":"A Murtali-Alpok Stájerországban fekszenek, és az Alacsony-Tauern részét képezik.","f":["Az Alacsony-Tauern része","Mura-régió"]},"austria-radstatter-tauern-relief-v2":{"i":"/poi-images/austria-radstatter-tauern-relief-v2.webp","s":"A Radstädti-Tauern egy hegyvonulat Salzburgban.","f":["Radstädti-Tauern","Salzburg"]},"austria-schladminger-tauern-relief-v2":{"i":"/poi-images/austria-schladminger-tauern-relief-v2.webp","s":"A Schladmingi-Tauern az Alacsony-Tauern hegységcsoportja Stájerországban és Salzburgban.","f":["Alacsony-Tauern","Stájerország/Salzburg"]},"austria-seckauer-tauern-relief-v2":{"i":"/poi-images/austria-seckauer-tauern-relief-v2.webp","s":"A Seckaui-Tauern az Alacsony-Tauern legkeletibb részét alkotja Stájerországban.","f":["Keleti Alacsony-Tauern","Stájerország"]},"austria-rotsel-spitze-relief-v2":{"i":"/poi-images/austria-rotsel-spitze-relief-v2.webp","s":"A Rötelspitze egy ismert csúcs a tiroli-dél-tiroli határvidéken.","f":["Magasság: 2818 m","Határhegy"]},"austria-hohe-veitsch-relief-v2":{"i":"/poi-images/austria-hohe-veitsch-relief-v2.webp","s":"A Hohe Veitsch egy hegy a Mürzsteger-Alpokban, Stájerországban.","f":["Magasság: 1981 m","Mürzsteger-Alpok"]},"austria-herrenstein-relief-v2":{"i":"/poi-images/austria-herrenstein-relief-v2.webp","s":"A Herrenstein egy hegy az alsó-ausztriai-stájerországi Mészkő-Alpokban.","f":["Magasság: 1650 m","Mészkő-Alpok"]},"austria-karmel-spitze-relief-v2":{"i":"/poi-images/austria-karmel-spitze-relief-v2.webp","s":"A Karmelspitze egy csúcs a Hochschwab-csoportban, Stájerországban.","f":["Magasság: 1850 m","Hochschwab"]},"austria-grosse-wildstelle-relief-v2":{"i":"/poi-images/austria-grosse-wildstelle-relief-v2.webp","s":"A Große Wildstelle a Schladmingi-Tauern legmagasabb csúcsa.","f":["Magasság: 2747 m","Schladmingi-Tauern"]},"austria-hoher-trieber-relief-v2":{"i":"/poi-images/austria-hoher-trieber-relief-v2.webp","s":"A Hoher Trieb egy hegy az Alacsony-Tauernben, Stájerországban.","f":["Magasság: 2190 m","Alacsony-Tauern"]},"AT-Graz":{"i":"/geo-images/austria/graz.webp","s":"Graz Ausztria második legnagyobb városa, amely jól megőrzött óvárosáról és UNESCO Design Város címéről ismert.","f":["Graz a Mura folyó partján fekszik, Ausztria délkeleti részén.","Négy egyetem otthona, így jelentős diákpopulációval rendelkezik."]},"AT-Linz":{"i":"/geo-images/austria/linz.webp","s":"Linz Ausztria harmadik legnagyobb városa, amely ipari múltjáról, modern médiaművészetéről és a híres Linzer tortáról ismert.","f":["Linz központilag, a felső-ausztriai Duna-völgyben helyezkedik el.","A Mária-dóm (Mariendom) befogadóképességét tekintve Ausztria legnagyobb temploma."]},"AT-Innsbruck":{"i":"/geo-images/austria/innsbruck.webp","s":"Innsbruck Tirol fővárosa, az 'Alpok fővárosaként' ismert, amely a császári történelmet látványos hegyi sportokkal ötvözi.","f":["Innsbruck a széles Inn-völgyben fekszik, magas hegyekkel övezve.","Az Aranytetőt 2657 tűziaranyozott réz zsindely fedi."]},"AT-Klagenfurt":{"i":"/geo-images/austria/klagenfurt.webp","s":"Klagenfurt am Wörthersee, Karintia fővárosa, az osztrák délvidék bájos reneszánsz gyöngyszemének számít.","f":["Klagenfurt Ausztria hatodik legnagyobb városa.","A legenda szerint a város egy kiszárított mocsárra épült, amelyben egy sárkány (Lindwurm) élt."]},"AT-Bregenz":{"i":"/geo-images/austria/bregenz.webp","s":"Bregenz, Vorarlberg idilli fővárosa, lenyűgöző fekvésével varázsolja el a látogatókat közvetlenül a Bóden-tó partján, a markáns Pfänder-hegység lábánál.","f":["Bregenzben található a legfontosabb osztrák kikötő a Bóden-tavon.","A Pfänder (1064 m) a város helyi hegye, amely felvonóval érhető el."]},"AT-Eisenstadt":{"i":"/geo-images/austria/eisenstadt.webp","s":"Kismarton (Eisenstadt), Burgenland idilli fővárosa, a történelmi elegancia és a mélyen gyökerező zenei hagyományok városa.","f":["Kismarton mintegy 15 000 lakosával Ausztria legkisebb tartományi fővárosa.","Joseph Haydn itt töltötte élete és alkotómunkája nagy részét."]},"AT-StPolten":{"i":"/geo-images/austria/st-p-lten.webp","s":"St.","f":["St. Pölten már 1159-ben városi rangot kapott.","A várost 1986-ban, egy népszavazást követően választották tartományi fővárossá."]},"AT-Schoenbrunn":{"i":"/geo-images/austria/sch-nbrunn-palace.webp","s":"A bécsi Schönbrunni kastély Ausztria legnagyobb kastélya és az ország egyik legjelentősebb kulturális értéke.","f":["Schönbrunn összesen lenyűgöző 1441 szobával rendelkezik.","Ferenc József császár itt született, és a kastélyban is halt meg."]},"AT-Hofburg":{"i":"/geo-images/austria/hofburg-palace.webp","s":"A bécsi Hofburg több mint hat évszázadon át a hatalmas Habsburg-dinasztia fő rezidenciája és hatalmi központja volt.","f":["Mintegy 2600 szobájával a Hofburg Európa egyik legnagyobb palotakomplexuma.","Itt található a Kincstár a Német-római Birodalom koronájával."]},"AT-Stephansdom":{"i":"/geo-images/austria/st-stephen-s-cathedral.webp","s":"A bécsiek által szeretetteljesen 'Steffl'-nek nevezett Szent István-dóm (Stephansdom) Bécs legfontosabb jelképe és Ausztria legjelentősebb gótikus épülete.","f":["A déli torony ('Steffl') pontosan 136,4 méter magas.","Az északi toronyban lóg a Pummerin, Ausztria legnagyobb harangja."]},"AT-Mozarthaus":{"i":"/geo-images/austria/mozart-s-birthplace.webp","s":"A salzburgi Getreidegasse 9.","f":["Itt született Wolfgang Amadeus Mozart 1756-ban.","A Mozart család 26 évig élt a ház 3. emeletén."]},"AT-Mirabell":{"i":"/geo-images/austria/mirabell-palace.webp","s":"A Mirabell-kastély a barokk építészet egyik salzburgi remekműve, amelyet 1606-ban Wolf Dietrich von Raitenau hercegérsek építtetett szeretőjének, Salome Alt-nak.","f":["A kastélyt eredetileg Altenau kastélynak (Schloss Altenau) hívták.","A Márványteremben egykor Wolfgang Amadeus Mozart és édesapja is zenélt."]},"AT-Grossglockner":{"i":"/geo-images/austria/grossglockner.webp","s":"A Karintia és Tirol határán fekvő Großglockner 3798 méterével Ausztria legmagasabb hegye, és a Magas-Tauern fenséges koronaékszere.","f":["A Großglockner 3798 méterével Ausztria legmagasabb hegye.","Lábánál fekszik a Pasterze, Ausztria legnagyobb gleccsere."]},"AT-Zillertal":{"i":"/geo-images/austria/zillertal.webp","s":"A tiroli Zillertal (Ziller-völgy) Európa egyik legismertebb és legélénkebb alpesi völgye, amely az aktív nyaralók végső célpontjaként vonult be a köztudatba.","f":["A Zillertal az Inn-völgy legnagyobb mellékvölgye Tirolban.","A Hintertux-gleccser az év 365 napján kínál síelési lehetőséget."]},"AT-Kitzbuehel":{"i":"/geo-images/austria/kitzb-hel.webp","s":"A tiroli Kitzbühel kétségtelenül az Alpok egyik legexkluzívabb és legrangosabb téli sportközpontja.","f":["A Streifen rendezett Hahnenkamm-versenyt a világ egyik legnehezebb síversenyének tartják.","Kitzbühel óvárosa több mint 700 éves."]},"AT-Hallstatt":{"i":"/geo-images/austria/hallstatt.webp","s":"Hallstatt egy világhírű falu a Hallstatti-tó partján, amely festői faházairól és a világ legrégebbi sóbányájáról ismert.","f":["Hallstattban található a világ legrégebbi, több mint 7000 éves sóbányája.","A korai európai vaskor egy korszakának, a 'Hallstatti kultúrának' névadója."]},"AT-Wolfgangsee":{"i":"/geo-images/austria/lake-wolfgang.webp","s":"A Wolfgangsee (Wolfgang-tó) a Salzkammergut egyik legragyogóbb természeti gyöngyszeme, amely kristálytiszta, mélykék vizével nyűgöz le; vize nyáron kiváló ivóvíz-minőséget ér el.","f":["A tó Salzburg és Felső-Ausztria tartományok között oszlik meg.","Nyáron a tiszta víz akár 24°C-ra is felmelegszik."]},"AT-NeusiedlerSee":{"i":"/geo-images/austria/lake-neusiedl.webp","s":"A burgenlandi Fertő tó (Neusiedler See) egy lenyűgöző természeti jelenség és Ausztria legnagyobb tava.","f":["A tavon Ausztria Magyarországgal osztozik (Fertő tó néven).","Az átlagos vízmélység mindössze körülbelül 1 méter."]},"AT-Melk":{"i":"/geo-images/austria/melk-abbey.webp","s":"A melki apátság egy barokk mestermű a Duna feletti sziklán, amely pompás könyvtáráról és aranyozott apátsági templomáról ismert.","f":["A melki apátság Ausztria legnagyobb bencés kolostora.","A 18. század elején Jakob Prandtauer építész teljesen újjáépítette barokk stílusban."]},"AT-Heiligenblut":{"i":"/geo-images/austria/heiligenblut.webp","s":"Heiligenblut am Großglockner Ausztria egyik legfestőibb és legismertebb hegyi faluja, amely közel 1300 méteres tengerszint feletti magasságban, a Magas-Tauern Nemzeti Parkban fekszik.","f":["A híres fotómotívum a templomot ábrázolja a Großglocknerrel a háttérben.","A település neve a 'Szent Vér' körüli legendából ered."]},"AT-Semmering":{"i":"/geo-images/austria/semmering-railway.webp","s":"A Semmering-vasút, amely Alsó-Ausztriát köti össze Stájerországgal, nemcsak egy fontos közlekedési ütőér, hanem a 19.","f":["Carl Ritter von Ghega építtette 1848 és 1854 között.","Körülbelül 460 méteres szintkülönbséget küzd le."]},"AT-Grossalpenstrasse":{"i":"/geo-images/austria/grossglockner-high-alpine-road.webp","s":"A Großglockner Magasalpesi Út (Hochalpenstraße) nemcsak Ausztria leghíresebb alpesi útja, hanem egy építészeti csoda is, amelyet az 1930-as években építettek lenyűgöző magashegyi tájak közepette.","f":["1930 és 1935 között épült egy mérnöki mestermű keretében.","A hágóút legmagasabb pontja a Hochtor, 2504 méteres magasságban."]},"AT-Hohensalzburg":{"i":"/geo-images/austria/hohensalzburg.webp","s":"A Hohensalzburg vára a Mozart-város, Salzburg messziről látható jelképe, amely fenségesen trónol a Festungsbergen (Várhegyen), magasan a barokk óváros tetői felett.","f":["Mintegy 7000 négyzetméteres beépített területével Európa egyik legnagyobb vára.","Az erődöt 900 év alatt soha nem ostromolták meg sikeresen."]},"AT-Belvedere":{"i":"/geo-images/austria/belvedere.webp","s":"A bécsi Belvedere kastély Európa egyik legpompásabb barokk kastélyegyüttese, amely két épületből – a Felső és az Alsó Belvedere-ből – áll.","f":["A kastélyegyüttest Savoyai Jenő herceg hadvezér számára építették.","Két kastélyból áll: a Felső és az Alsó Belvedere-ből."]},"AT-Hohenwerfen":{"i":"/geo-images/austria/hohenwerfen.webp","s":"A hatalmas Hohenwerfen vára drámaian emelkedik egy 155 méter magas, meredek sziklakúpon a Salzach völgye felett, a Tennengebirge (Tennen-hegység) lenyűgöző hegyi kulisszájával övezve.","f":["1077-ben építtette Gebhard salzburgi érsek.","Történelme során erősen megerősített börtönként szolgált magas rangú személyiségek számára."]},"AT-Eggenberg":{"i":"/geo-images/austria/eggenberg.webp","s":"Az Eggenberg-kastély, amely Graz nyugati szélén fekszik, Stájerország legpompásabb barokk kastélyegyüttese, és komplex allegorikus műalkotásként tervezték.","f":["A kastély építészete egy pontos építészeti naptár.","Pontosan 365 ablaka van, amelyek az év napjait jelképezik."]},"AT-Hochosterwitz":{"i":"/geo-images/austria/hochosterwitz.webp","s":"A Hochosterwitz vára Karintia leglenyűgözőbb történelmi jelképe, és Európa egyik legszebb váregyüttesének tartják.","f":["A vár világszerte híres a 14 megerősített várkapun átvezető feljárójáról.","Egy 150 méter magas, magányosan álló mészkősziklára épült."]},"AT-Ambras":{"i":"/geo-images/austria/ambras.webp","s":"Az Ambras-kastély festőien helyezkedik el egy magaslaton a tiroli Innsbruck felett, és az európai reneszánsz fontos kulturális öröksége.","f":["II. Ferdinánd gyűjteményeinek köszönhetően a világ legrégebbi múzeumának tartják.","A Művészeti és Csodakamra olyan bizarr tárgyakat rejt, mint korallok, egzotikumok és tudományos eszközök."]},"AT-Krimml":{"i":"/geo-images/austria/krimml.webp","s":"A Salzburg tartományban található Krimmli-vízesés lenyűgöző, 380 méteres esésmagasságával Ausztria legmagasabb vízesése, és a világ öt legmagasabb vízesésének egyike.","f":["A 380 méteres esésű Krimmli-vízesés a legmagasabb Ausztriában.","A víz három hatalmas lépcsőben, kaszkádszerűen zuhan a mélybe."]},"AT-HallstaetterSee":{"i":"/geo-images/austria/hallstatt.webp","s":"A Salzkammergutban található Hallstatti-tó (Hallstätter See) drámai szépségű természeti ékszerdoboz, amely sötét fjordként ékelődik a Dachstein-masszívum meredek sziklafalai közé.","f":["A tó a legmélyebb pontján jelentős, 125 méter mély.","A Hallstatt-Dachstein/Salzkammergut UNESCO világörökségi régió magjához tartozik."]},"AT-Dachstein":{"i":"/geo-images/austria/dachstein.webp","s":"A Dachstein Stájerország és Felső-Ausztria legmagasabb hegye, és kétségtelenül az Északi-Mészkőalpok egyik legimpozánsabb masszívuma.","f":["A Hoher Dachstein a masszívum legmagasabb csúcsa a maga 2995 méterével.","A Dachstein-gleccser az Alpok legkeletibb gleccsere."]},"AT-Staatsoper":{"i":"/geo-images/austria/vienna.webp","s":"A bécsi Ringstraße mentén pompázatosan elhelyezkedő Bécsi Állami Operaház (Wiener Staatsoper) a világ egyik nemzetközileg legjelentősebb és leghíresebb operaháza.","f":["Az épületet August Sicard von Sicardsburg és Eduard van der Nüll építészek tervezték.","Kezdetben 'Császári és Királyi Udvari Operaszínház' (K.K. Hof-Operntheater) néven ismerték."]},"AT-Albertina":{"i":"/geo-images/austria/albertina.webp","s":"A bécsi Albertina, amely közvetlenül a Hofburg mellett, a város szívében található, a világ egyik legjelentősebb művészeti múzeuma.","f":["Albert Szász–Tescheni herceg alapította 1776-ban.","A Grafikai Gyűjtemény több mint egymillió nyomatot és 60 000 rajzot foglal magában."]},"AT-KHM":{"i":"/geo-images/austria/khm.webp","s":"A bécsi Művészettörténeti Múzeum (KHM) a világ egyik legpompásabb és legjelentősebb múzeuma, amelyet I.","f":["1891-ben nyitotta meg kapuit, Gottfried Semper és Karl Freiherr von Hasenauer tervei alapján.","Pontosan szimmetrikusan áll építészeti ikertestvérével, a Természettudományi Múzeummal szemben."]},"AT-Prater":{"i":"/geo-images/austria/prater.webp","s":"A bécsi Práter (Wiener Prater) egy hatalmas, természethez közeli rekreációs terület és a híres vidámpark, a 'Wurstelprater' lenyűgöző keveréke.","f":["A bécsi Óriáskerék főszerepet játszott 'A harmadik ember' című klasszikus film noirban.","A Práter eredetileg császári vadászterület volt, amelyet 1766-ban nyitottak meg a nagyközönség előtt."]},"AT-SchoenbrunnZoo":{"i":"/geo-images/austria/schoenbrunn-zoo.webp","s":"A bécsi Schönbrunni Állatkert a világ legrégebbi, ma is működő állatkertje, amelyet 1752-ben alapított I.","f":["Az állatkertet 1752-ben császári menazsériaként alapították.","Az eredeti barokk állatketrecek csillag alakban helyezkednek el a Reggeliző pavilon körül."]},"AT-Hundertwasser":{"i":"/geo-images/austria/hundertwasser.webp","s":"A bécsi 3.","f":["Friedensreich Hundertwasser tervezte Josef Krawina építésszel közösen.","1983 és 1985 között épült Bécs városának lakóházaként."]},"AT-Klosterneuburg":{"i":"/geo-images/austria/klosterneuburg.webp","s":"A Bécstől északra, festőien közvetlenül a Duna partján fekvő Klosterneuburgi apátság (Stift Klosterneuburg) Ausztria egyik legjelentősebb vallási, kulturális és történelmi központja.","f":["1114-ben alapította III. (Szent) Lipót.","A zománctáblákból álló verduni oltár (1181) a középkor egyik legfontosabb műalkotása."]},"AT-Achensee":{"i":"/geo-images/austria/achensee.webp","s":"Az Achensee (Achen-tó), amelyet gyakran szeretettel 'Tiroli tengernek' is neveznek, Tirol legnagyobb tava és egy lélegzetelállító természeti paradicsom az Alpok szívében.","f":["Az Achensee Tirol tartomány legnagyobb és legmélyebb tava.","Termikus szeleinek köszönhetően a vitorlázók és szörfösök fellegvára."]},"AT-Pyramidenkogel":{"i":"/geo-images/austria/pyramidenkogel.webp","s":"A Pyramidenkogel egy erdős hegyhát Karintiában, a Wörthersee-től (Wörthi-tó) délre, amely azonban leginkább egy lélegzetelállító építményről híres: a Pyramidenkogel kilátótoronyról.","f":["A kilátótorony pontosan 100 méter magas, ezzel a világ legmagasabb fatornya.","Az ívelt szerkezet 16 hatalmas rétegelt lemez oszlopból áll."]},"AT-Arlberg":{"i":"/geo-images/austria/arlberg.webp","s":"Az Arlberg, a Tirol és Vorarlberg tartományok közötti természetes hegyi határ, az alpesi téli sportok világszerte ismert mítosza, és az 'alpesi síelés bölcsőjének' tartják.","f":["Az 'alpesi síelés bölcsőjének' tartják (az első síklubot itt alapították 1901-ben).","A Ski Arlberg 302 kilométernyi pályájával a legnagyobb síterep Ausztriában."]},"at-lienz":{"i":"/geo-images/austria/lienz.webp","s":"Lienz Kelet-Tirol fővárosa és gazdasági központja.","f":["Lienz az egyetlen város Kelet-Tirolban.","A város mediterrán hangulatú klímával és sok pálmafával rendelkezik a központban."]},"at-zell-am-see":{"i":"/geo-images/austria/zell-am-see.webp","s":"Zell am See egy festői város Salzburg tartományban, a Zeller See (Zelli-tó) partján.","f":["A Zeller See vize ivóvíz minőségű.","Zell am See és Kaprun együtt Ausztria egyik legfontosabb turisztikai régióját alkotja."]},"at-worthersee":{"i":"/geo-images/austria/worthersee.webp","s":"A Wörthersee (Wörthi-tó) Karintia legnagyobb és legismertebb tava.","f":["A Wörthersee vízhőmérséklete nyáron elérheti a 27 Celsius-fokot is.","Majdnem 17 kilométer hosszú és akár 1,6 kilométer széles is lehet."]},"at-kitzsteinhorn":{"i":"/geo-images/austria/kitzsteinhorn.webp","s":"A Kitzsteinhorn a Magas-Tauern egy hegye, és itt található Ausztria első gleccserek síterepe.","f":["A Kitzsteinhorn csúcsa 3203 méter magas.","A Gipfelwelt 3000 Salzburg tartomány legmagasabb, bárki számára könnyen megközelíthető pontja."]},"at-nockberge":{"i":"/geo-images/austria/nockberge.webp","s":"A karintiai Nockberge Bioszférapark ismert szelíd, kerekded hegyhátairól (Nocken), amelyek élesen elütnek más alpesi régiók zord csúcsaitól.","f":["A Nockberge főleg palakőzetből áll, ami megmagyarázza a hegyek kerekded formáját.","A Nockalmstraße 34 kilométer hosszú és 52 hajtűkanyarral rendelkezik."]},"at-kalkalpen-np":{"i":"/geo-images/austria/kalkalpen-np.webp","s":"A felső-ausztriai Kalkalpen (Mészkő-Alpok) Nemzeti Park Ausztria legnagyobb egybefüggő erdőterületét védi.","f":["A nemzeti park magában foglalja a Sengsen-hegységet és a Reichramingi Hintergebirgét.","A nemzeti park területének négyötödét erdő borítja."]},"at-gesauze":{"i":"/geo-images/austria/gesauze.webp","s":"A stájerországi Gesäuse vad mészkőcsúcsairól ismert, amelyek meredeken emelkednek a dübörgő Enns folyó fölé.","f":["A 'Gesäuse' név az Enns folyó hangos zúgásából (Sausen) származik.","A nemzeti parkot 2002-ben alapították."]},"at-thayatal-np":{"i":"/geo-images/austria/thayatal-np.webp","s":"Az alsó-ausztriai Thayatal Nemzeti Park Ausztria legkisebb nemzeti parkja, és a cseh Národní park Podyjí-vel határos.","f":["A Thayatal Nemzeti Park a maga mintegy 1330 hektárjával a legkisebb Ausztriában.","A Thayatal egy klasszikus áttöréses völgy sok folyókanyarulattal."]},"at-oetztal":{"i":"/geo-images/austria/oetztal.webp","s":"A tiroli Ötztal az Inn völgyének leghosszabb mellékvölgye, fenséges háromezres hegyekkel körülvéve.","f":["Az Ötztal mintegy 65 kilométer hosszú.","Az Ötztalban található Stuibenfall 159 méterével Tirol legmagasabb vízesése."]},"at-eisriesenwelt":{"i":"/geo-images/austria/eisriesenwelt.webp","s":"A werfeni Eisriesenwelt a világ legnagyobb jégbarlangja.","f":["A 42 km hosszú Eisriesenwelt a Föld legnagyobb jégbarlangrendszere.","A barlang bejárata 1641 méteres magasságban található."]},"at-donau-auen-np":{"i":"/geo-images/austria/donau-auen-np.webp","s":"A Donau-Auen Nemzeti Park Bécs és Pozsony között húzódik, és Közép-Európa egyik utolsó nagy, szabályozatlan folyami ártéri táját őrzi.","f":["A Donau-Auen Közép-Európa legnagyobb, természetközeli állapotban lévő folyami ártéri tája.","A parkot 1996-ban alapították, miután megakadályozták egy hainburgi erőmű építését."]},"at-gottweig-abbey":{"i":"/geo-images/austria/gottweig-abbey.webp","s":"A Göttweigi apátság egy bencés kolostor Alsó-Ausztriában, a Krems-től délre fekvő hegyen.","f":["A Göttweigi apátságot 1083-ban alapította Altmann passaui püspök.","Egy 1718-as tűzvész után a kolostort barokk stílusban építették újjá Johann Lukas von Hildebrandt vezetésével."]},"at-stift-admont":{"i":"/geo-images/austria/stift-admont.webp","s":"A stájerországi Admonti apátság a régió legrégebbi fennmaradt kolostora, és világszerte ismert lélegzetelállító könyvtáráról.","f":["Az Admonti apátságot 1074-ben alapították.","A kolostori könyvtár 70 méter hosszú, 14 méter széles és 13 méter magas."]},"at-salzburg-festival":{"i":"/geo-images/austria/salzburg-festival.webp","s":"A Salzburgi Ünnepi Játékok a klasszikus zene és előadóművészet világának legjelentősebb fesztiválja.","f":["A fesztivált 1920-ban alapította Max Reinhardt, Hugo von Hofmannsthal és Richard Strauss.","A salzburgi Fesztiválpalota-együttes magában foglalja a Nagy Fesztiválpalotát, a Haus für Mozartot és a Felsen"]},"at-minimundus":{"i":"/geo-images/austria/minimundus.webp","s":"A klagenfurti Wörthersee partján található Minimundus egy népszerű miniatűrpark, amelyet gyakran 'kis világnak a Wörtherseenél' is neveznek.","f":["A Minimundus minden makettje egységes, 1:25-ös méretarányban készült.","A miniatűrparkot 1958-ban nyitották meg."]},"at-schladming-dachstein":{"i":"/geo-images/austria/schladming-dachstein.webp","s":"A stájerországi Schladming-Dachstein üdülőrégió Ausztria vezető alpesi úti céljai közé tartozik.","f":["A 4 hegyes síhinta (4-Berge-Skischaukel) megszakítás nélkül köti össze a Hauser Kaibling, a Planai, a Hochwurz","Schladming már többször is rendezett alpesisí-világbajnokságot (legutóbb 2013-ban)."]},"at-kitzbuhel-ski":{"i":"/geo-images/austria/kitzbuhel-ski.webp","s":"A tiroli Kitzbühel a világ egyik legexkluzívabb és legismertebb téli sportközpontja.","f":["A Streif a világ legnehezebb és legveszélyesebb lesiklópályája.","A Hahnenkamm-versenyen a sízők a cél előtti egyenesben akár a 140 km/h-s sebességet is elérik."]},"at-mozarteum-salzburg":{"i":"/geo-images/austria/mozarteum-salzburg.webp","s":"A salzburgi Nemzetközi Mozarteum Alapítvány célja Wolfgang Amadeus Mozart örökségének megőrzése.","f":["A Mozarteum Alapítványt 1880-ban alapították Salzburg város polgárai.","Mozart 1756-ban született a Getreidegassén található szülőházában."]},"at-riegersburg":{"i":"/geo-images/austria/riegersburg.webp","s":"A Riegersburg fenségesen trónol egy kialudt vulkán 482 méter magas bazaltszikláján Délkelet-Stájerországban.","f":["A várat először a 11. században említik írásos emlékek.","3 kilométer hosszú védőfallal rendelkezik, tizenegy bástyával és hét kapuval."]},"at-kufstein-fortress":{"i":"/geo-images/austria/kufstein-fortress.webp","s":"A Kufsteini vár a tiroli Kufstein város jelképe, és messziről láthatóan magasodik egy dombon az Inn folyó felett.","f":["A várat először a 13. században említik írásban, mint a regensburgi püspökök tulajdonát.","I. Miksa császár a 16. században jelentősen kibővíttette az erődöt a kerek 'Császártoronnyal'."]},"at-kreuzenstein":{"i":"/geo-images/austria/kreuzenstein.webp","s":"A Bécshez közeli Kreuzenstein vára egy lenyűgöző látványvár, amelyet a 19.","f":["Az eredeti Kreuzenstein várát a harmincéves háború alatt, 1645-ben a svéd csapatok pusztították el.","A vár újjáépítése 1874-től 1906-ig tartott."]},"at-historic-centre-vienna":{"i":"/geo-images/austria/historic-centre-vienna.webp","s":"Bécs történelmi központja egy szűk területen sűríti össze a császári hagyományt, a barokk építészetet és az UNESCO-hangulatot.","f":["Az UNESCO-világörökség része, Bécs óvárosával együtt.","Itt található egymáshoz közel a Stephansdom, a Hofburg és a Ringstraße."]},"at-aspern-essling-battlefield":{"i":"/geo-images/austria/aspern-essling-battlefield.webp","s":"Az Aspern-Essling csatamező Ausztria napóleoni korszakának egyik leghíresebb ütközetére emlékeztet.","f":["Az 1809-es aspern-esslingi csata helyszíne.","Napóleon első nagy osztrák vereségeinek egyike."]},"at-mauthausen-memorial":{"i":"/geo-images/austria/mauthausen-memorial.webp","s":"A Mauthausen-emlékhely Ausztria és Európa egyik legfontosabb emlékező helye.","f":["Az egykori mauthauseni koncentrációs tábor területén áll.","Felső-Ausztriában, a Duna közelében található."]},"at-burg-seebenstein":{"i":"/geo-images/austria/burg-seebenstein.webp","s":"Seebenstein vára látványosan emelkedik a bécsi Alpok előtere fölé, és klasszikus osztrák vár-SEO célpont Alsó-Ausztriában.","f":["Dél-Alsó-Ausztriában található.","A település fölötti sziklán nagyon fotogén."]},"at-burg-aggstein":{"i":"/geo-images/austria/burg-aggstein.webp","s":"Aggstein vára a Wachau egyik leglátványosabb romja, és vonzza a középkor- és Duna-turizmust.","f":["A Wachau felett, const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}

function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,pend=false,dx=0,dy=0,sx=0,sy=0,pid=0;
// Drag uses a MOVE THRESHOLD: pointerdown only ARMS panning; we don't capture the
// pointer until it actually moves >4px. A click without movement therefore reaches
// the target's own handler — fixes desktop where setPointerCapture-on-down stole the
// click from .cluster and .region (country) elements (mobile tap was unaffected).
svg.addEventListener('pointerdown',e=>{if(e.isPrimary===false)return;pend=true;dr=false;dx=sx=e.clientX;dy=sy=e.clientY;pid=e.pointerId});
svg.addEventListener('pointermove',e=>{
  if(pend&&!dr){if(Math.hypot(e.clientX-sx,e.clientY-sy)<=4)return;dr=true;svg.classList.add('drag');try{svg.setPointerCapture(pid)}catch(_){}}
  if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()
});
svg.addEventListener('pointerup',()=>{pend=false;if(dr){dr=false;svg.classList.remove('drag');try{svg.releasePointerCapture(pid)}catch(_){}}});
svg.addEventListener('pointercancel',()=>{pend=false;dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false;pend=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});

  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Search-only entries (POIs on a sub-map): match by name, navigate to the sub-map.
  const extraHits=[];
  for(const e of SEARCH_EXTRA){if(e.s.includes(q)&&extraHits.length<20)extraHits.push(e)}
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0&&extraHits.length===0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0&&extraHits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  const exRow=e=>'<a data-extra="1" href="'+e.u+'"><span class="dot" style="background:#ffd54a"></span><span class="nm">'+e.n.replace(/[<>]/g,'')+'</span><span class="gr">›</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('')+extraHits.map(exRow).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const ax=e.target.closest('a[data-extra]');
  if(ax)return; // sub-map link: let the browser navigate
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
