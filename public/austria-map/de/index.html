rol.","f":["Höhe: 2818 m","Grenzberg"]},"austria-hohe-veitsch-relief-v2":{"i":"/poi-images/austria-hohe-veitsch-relief-v2.webp","s":"Die Hohe Veitsch ist ein Berg in den Mürzsteger Alpen in der Steiermark.","f":["Höhe: 1981 m","Mürzsteger Alpen"]},"austria-herrenstein-relief-v2":{"i":"/poi-images/austria-herrenstein-relief-v2.webp","s":"Der Herrenstein ist ein Berg in den niederösterreichisch-steirischen Kalkalpen.","f":["Höhe: 1650 m","Kalkalpen"]},"austria-karmel-spitze-relief-v2":{"i":"/poi-images/austria-karmel-spitze-relief-v2.webp","s":"Die Karmelspitze ist ein Gipfel in der Hochschwabgruppe in der Steiermark.","f":["Höhe: 1850 m","Hochschwab"]},"austria-grosse-wildstelle-relief-v2":{"i":"/poi-images/austria-grosse-wildstelle-relief-v2.webp","s":"Die Große Wildstelle ist der höchste Gipfel der Schladminger Tauern.","f":["Höhe: 2747 m","Schladminger Tauern"]},"austria-hoher-trieber-relief-v2":{"i":"/poi-images/austria-hoher-trieber-relief-v2.webp","s":"Der Hohe Trieb ist ein Berg in den Niederen Tauern in der Steiermark.","f":["Höhe: 2190 m","Niedere Tauern"]},"AT-Graz":{"i":"/geo-images/austria/graz.webp","s":"Graz ist die zweitgrößte Stadt Österreichs, bekannt für ihre gut erhaltene Altstadt und als UNESCO-City of Design.","f":["Graz liegt an der Mur im Südosten Österreichs.","Ist die Heimat von vier Universitäten mit vielen Studierenden."]},"AT-Linz":{"i":"/geo-images/austria/linz.webp","s":"Linz ist die drittgrößte Stadt Österreichs, bekannt für ihre industrielle Geschichte, moderne Medienkunst und die berühmte Linzer Torte.","f":["Linz liegt zentral im oberösterreichischen Donautal.","Der Mariendom ist die größte Kirche Österreichs nach Fassungsvermögen."]},"AT-Innsbruck":{"i":"/geo-images/austria/innsbruck.webp","s":"Innsbruck ist die Hauptstadt von Tirol und bekannt als 'Hauptstadt der Alpen', die kaiserliche Geschichte mit spektakulärem Bergsport verbindet.","f":["Innsbruck liegt im breiten Inntal, flankiert von hohen Gebirgen.","Das Goldene Dachl ist mit 2.657 feuervergoldeten Kupferschindeln bedeckt."]},"AT-Klagenfurt":{"i":"/geo-images/austria/klagenfurt.webp","s":"Klagenfurt am Wörthersee, die Hauptstadt Kärntens, gilt als die charmante Renaissance-Perle des österreichischen Südens.","f":["Klagenfurt ist die sechstgrößte Stadt Österreichs.","Der Legende nach entstand die Stadt auf einem trockengelegten Sumpf, in dem ein Lindwurm lebte."]},"AT-Bregenz":{"i":"/geo-images/austria/bregenz.webp","s":"Bregenz, die idyllische Hauptstadt Vorarlbergs, fasziniert durch ihre unvergleichliche Lage direkt an den Ufern des Bodensees und am Fuße des markanten Pfänder-Massivs.","f":["Bregenz besitzt den wichtigsten österreichischen Hafen am Bodensee.","Der Pfänder (1.064 m) ist der Hausberg der Stadt, erreichbar per Seilbahn."]},"AT-Eisenstadt":{"i":"/geo-images/austria/eisenstadt.webp","s":"Eisenstadt, die idyllische Landeshauptstadt des Burgenlandes, ist eine Stadt von historischer Eleganz und tief verwurzelter musikalischer Tradition.","f":["Eisenstadt ist mit rund 15.000 Einwohnern die kleinste Landeshauptstadt Österreichs.","Joseph Haydn verbrachte einen Großteil seines Lebens und Schaffens hier."]},"AT-StPolten":{"i":"/geo-images/austria/st-p-lten.webp","s":"St.","f":["St. Pölten erhielt das Stadtrecht bereits im Jahr 1159.","Die Stadt wurde 1986 nach einer Volksbefragung zur Landeshauptstadt gewählt."]},"AT-Schoenbrunn":{"i":"/geo-images/austria/sch-nbrunn-palace.webp","s":"Schloss Schönbrunn in Wien ist das größte Schloss Österreichs und eines der bedeutendsten Kulturgüter des Landes.","f":["Schönbrunn hat insgesamt beeindruckende 1.441 Zimmer.","Kaiser Franz Joseph I. wurde hier geboren und starb auch im Schloss."]},"AT-Hofburg":{"i":"/geo-images/austria/hofburg-palace.webp","s":"Die Hofburg im Herzen Wiens war über sechs Jahrhunderte lang die Hauptresidenz und das Machtzentrum der mächtigen Habsburger-Dynastie.","f":["Mit rund 2.600 Räumen ist die Hofburg einer der größten Palastkomplexe Europas.","Beherbergt die Schatzkammer mit der Krone des Heiligen Römischen Reiches."]},"AT-Stephansdom":{"i":"/geo-images/austria/st-stephen-s-cathedral.webp","s":"Der Stephansdom, von den Wienern liebevoll 'Steffl' genannt, ist das wichtigste Wahrzeichen Wiens und das bedeutendste gotische Bauwerk Österreichs.","f":["Der Südturm ('Steffl') ist exakt 136,4 Meter hoch.","Im Nordturm hängt die Pummerin, Österreichs größte Glocke."]},"AT-Mozarthaus":{"i":"/geo-images/austria/mozart-s-birthplace.webp","s":"Das Mozarthaus in der Salzburger Getreidegasse 9 ist der weltberühmte Ort, an dem am 27.","f":["Wolfgang Amadeus Mozart wurde hier 1756 geboren.","Die Familie Mozart lebte 26 Jahre lang im 3. Stock des Hauses."]},"AT-Mirabell":{"i":"/geo-images/austria/mirabell-palace.webp","s":"Schloss Mirabell ist ein Meisterwerk barocker Baukunst in Salzburg, das 1606 vom Fürsterzbischof Wolf Dietrich von Raitenau für seine Geliebte Salome Alt erbaut wurde.","f":["Das Schloss trug ursprünglich den Namen Schloss Altenau.","Im Marmorsaal haben schon Wolfgang Amadeus Mozart und sein Vater musiziert."]},"AT-Grossglockner":{"i":"/geo-images/austria/grossglockner.webp","s":"Der Großglockner, an der Grenze zwischen Kärnten und Tirol gelegen, ist mit 3.798 Metern der höchste Berg Österreichs und das majestätische Kronjuwel der Hohen Tauern.","f":["Der Großglockner ist mit 3.798 m der höchste Berg Österreichs.","An seinem Fuß liegt die Pasterze, der größte Gletscher Österreichs."]},"AT-Zillertal":{"i":"/geo-images/austria/zillertal.webp","s":"Das Zillertal in Tirol ist eines der bekanntesten und lebhaftesten Alpentäler Europas, das sich als ultimatives Ziel für Aktivurlauber etabliert hat.","f":["Das Zillertal ist das größte Seitental des Inntals in Tirol.","Der Hintertuxer Gletscher ermöglicht Skifahren an 365 Tagen im Jahr."]},"AT-Kitzbuehel":{"i":"/geo-images/austria/kitzb-hel.webp","s":"Kitzbühel in Tirol ist zweifellos einer der exklusivsten und prestigeträchtigsten Wintersportorte der Alpen.","f":["Das Hahnenkammrennen auf der Streif gilt als eines der schwersten Skirennen der Welt.","Die Altstadt Kitzbühels ist über 700 Jahre alt."]},"AT-Hallstatt":{"i":"/geo-images/austria/hallstatt.webp","s":"Hallstatt ist ein weltberühmtes Dorf am Hallstätter See, bekannt für seine malerischen Holzhäuser und das älteste Salzbergwerk der Welt.","f":["Hallstatt besitzt das älteste Salzbergwerk der Welt (über 7.000 Jahre alt).","Namensgeber für die 'Hallstattzeit', eine Epoche der frühen europäischen Eisenzeit."]},"AT-Wolfgangsee":{"i":"/geo-images/austria/lake-wolfgang.webp","s":"Der Wolfgangsee ist eines der schillerndsten Naturjuwele im Salzkammergut und fasziniert mit seinem glasklaren, tiefblauen Wasser, das im Sommer eine hervorragende Trinkwasserqualität erreicht.","f":["Der See teilt sich auf die Bundesländer Salzburg und Oberösterreich auf.","Im Sommer erwärmt sich das klare Wasser auf bis zu 24°C."]},"AT-NeusiedlerSee":{"i":"/geo-images/austria/lake-neusiedl.webp","s":"Der Neusiedler See im Burgenland ist ein faszinierendes Naturphänomen und der größte See Österreichs.","f":["Der See teilt sich Österreich mit Ungarn (dort Fertő tó genannt).","Die durchschnittliche Wassertiefe beträgt lediglich rund 1 Meter."]},"AT-Melk":{"i":"/geo-images/austria/melk-abbey.webp","s":"Das Stift Melk ist ein barockes Meisterwerk auf einem Felsen über der Donau, bekannt für seine prächtige Bibliothek und die goldene Stiftskirche.","f":["Das Stift Melk ist das größte Benediktinerkloster in Österreich.","Es wurde im frühen 18. Jahrhundert vom Architekten Jakob Prandtauer völlig neu im Barockstil erbaut."]},"AT-Heiligenblut":{"i":"/geo-images/austria/heiligenblut.webp","s":"Heiligenblut am Großglockner ist eines der malerischsten und bekanntesten Bergdörfer Österreichs, gelegen auf knapp 1.300 Metern Seehöhe im Nationalpark Hohe Tauern.","f":["Das berühmte Fotomotiv zeigt die Kirche mit dem Großglockner im Hintergrund.","Der Ortsname leitet sich von der Legende um das 'Heilige Blut' ab."]},"AT-Semmering":{"i":"/geo-images/austria/semmering-railway.webp","s":"Die Semmeringbahn, die Niederösterreich mit der Steiermark verbindet, ist nicht nur eine wichtige Verkehrsader, sondern ein Meisterwerk der Ingenieurskunst aus der Mitte des 19.","f":["Erbaut zwischen 1848 und 1854 von Carl Ritter von Ghega.","Überwindet einen Höhenunterschied von rund 460 Metern."]},"AT-Grossalpenstrasse":{"i":"/geo-images/austria/grossglockner-high-alpine-road.webp","s":"Die Großglockner Hochalpenstraße ist nicht nur die berühmteste Alpenstraße Österreichs, sondern auch ein architektonisches Wunderwerk, das in den 1930er Jahren inmitten spektakulärer Hochgebirgslan...","f":["Wurde zwischen 1930 und 1935 in einer ingenieurtechnischen Meisterleistung erbaut.","Der höchste Punkt der Passstraße ist das Hochtor auf 2.504 Metern Seehöhe."]},"AT-Hohensalzburg":{"i":"/geo-images/austria/hohensalzburg.webp","s":"Die Festung Hohensalzburg ist das weithin sichtbare Wahrzeichen der Mozartstadt Salzburg und thront majestätisch auf dem Festungsberg hoch über den Dächern der barocken Altstadt.","f":["Mit rund 7.000 Quadratmetern umbauter Fläche eine der größten Burgen Europas.","Die Burganlage wurde im Laufe von 900 Jahren nie erfolgreich belagert."]},"AT-Belvedere":{"i":"/geo-images/austria/belvedere.webp","s":"Schloss Belvedere in Wien ist eine der prächtigsten barocken Schlossanlagen Europas und besteht aus zwei Gebäuden – dem Oberen und Unteren Belvedere.","f":["Das Schlossensemble wurde für den Feldherrn Prinz Eugen von Savoyen errichtet.","Es besteht aus zwei Schlössern: dem Oberen und dem Unteren Belvedere."]},"AT-Hohenwerfen":{"i":"/geo-images/austria/hohenwerfen.webp","s":"Die mächtige Burg Hohenwerfen erhebt sich dramatisch auf einem 155 Meter hohen, steilen Felskegel hoch über dem Salzachtal und ist umgeben von der eindrucksvollen Gebirgskulisse des Tennengebirges.","f":["Erbaut im Jahr 1077 durch Erzbischof Gebhard von Salzburg.","Diente in ihrer Geschichte als stark befestigtes Gefängnis für hochrangige Persönlichkeiten."]},"AT-Eggenberg":{"i":"/geo-images/austria/eggenberg.webp","s":"Schloss Eggenberg, am westlichen Stadtrand von Graz gelegen, ist die prunkvollste barocke Schlossanlage der Steiermark und wurde als komplexes allegorisches Kunstwerk konzipiert.","f":["Die Architektur des Schlosses ist ein exakter architektonischer Kalender.","Besitzt genau 365 Fenster, die die Tage eines Jahres repräsentieren."]},"AT-Hochosterwitz":{"i":"/geo-images/austria/hochosterwitz.webp","s":"Die Burg Hochosterwitz ist Kärntens beeindruckendstes historisches Wahrzeichen und gilt als eines der schönsten Burgensembles Europas.","f":["Die Burg ist weltweit berühmt für ihren Aufstieg durch 14 gesicherte Burgtore.","Sie wurde auf einem 150 Meter hohen, alleinstehenden Kalksteinfelsen erbaut."]},"AT-Ambras":{"i":"/geo-images/austria/ambras.webp","s":"Schloss Ambras liegt malerisch eingebettet auf einer Anhöhe über Innsbruck in Tirol und ist ein kulturelles Erbe der europäischen Renaissance.","f":["Gilt dank der Sammlungen Ferdinands II. als das älteste Museum der Welt.","Die Kunst- und Wunderkammer enthält skurrile Objekte wie Korallen, Exotica und wissenschaftliche Instrumente."]},"AT-Krimml":{"i":"/geo-images/austria/krimml.webp","s":"Die Krimmler Wasserfälle im Bundesland Salzburg sind mit einer beeindruckenden Fallhöhe von 380 Metern die höchsten Wasserfälle Österreichs und gehören zu den fünthöchsten der Welt.","f":["Mit 380 Metern sind die Krimmler Wasserfälle die höchsten Österreichs.","Das Wasser stürzt in drei mächtigen Kaskaden in die Tiefe."]},"AT-HallstaetterSee":{"i":"/geo-images/austria/hallstatt.webp","s":"Der Hallstätter See im Salzkammergut ist ein Naturjuwel von dramatischer Schönheit, der wie ein dunkler Fjord tief zwischen die steilen Felswände des Dachsteinmassivs eingebettet ist.","f":["Der See ist an seiner tiefsten Stelle beachtliche 125 Meter tief.","Zählt zum Kern der UNESCO-Welterberegion Hallstatt-Dachstein/Salzkammergut."]},"AT-Dachstein":{"i":"/geo-images/austria/dachstein.webp","s":"Der Dachstein ist der höchste Berg der Bundesländer Steiermark und Oberösterreich und zweifellos eines der imposantesten Massive der Nördlichen Kalkalpen.","f":["Der Hohe Dachstein ist mit 2.995 m der höchste Gipfel des Massivs.","Der Dachsteingletscher ist der östlichste Gletscher der Alpen."]},"AT-Staatsoper":{"i":"/geo-images/austria/vienna.webp","s":"Die Wiener Staatsoper, prachtvoll an der Ringstraße gelegen, ist eines der international bedeutendsten und berühmtesten Opernhäuser der Welt.","f":["Das Gebäude wurde von den Architekten August Sicard von Sicardsburg und Eduard van der Nüll entworfen.","Anfangs als 'K.K. Hof-Operntheater' bezeichnet."]},"AT-Albertina":{"i":"/geo-images/austria/albertina.webp","s":"Die Albertina im Herzen Wiens, unmittelbar neben der Hofburg gelegen, ist eines der bedeutendsten Kunstmuseen der Welt.","f":["Gegründet 1776 von Herzog Albert von Sachsen-Teschen.","Die Grafische Sammlung umfasst über eine Million Druckgrafiken und 60.000 Zeichnungen."]},"AT-KHM":{"i":"/geo-images/austria/khm.webp","s":"Das Kunsthistorische Museum (KHM) in Wien ist eines der prachtvollsten und bedeutendsten Museen der Welt, das von Kaiser Franz Joseph I.","f":["Eröffnet im Jahr 1891, entworfen von Gottfried Semper und Karl Freiherr von Hasenauer.","Steht exakt symmetrisch gegenüber seinem architektonischen Zwilling, dem Naturhistorischen Museum."]},"AT-Prater":{"i":"/geo-images/austria/prater.webp","s":"Der Wiener Prater ist eine faszinierende Mischung aus einem riesigen naturnahen Erholungsgebiet und dem berühmten Vergnügungspark, dem 'Wurstelprater'.","f":["Das Wiener Riesenrad spielte eine Hauptrolle im Film noir-Klassiker 'Der dritte Mann'.","Der Prater war ursprünglich ein kaiserliches Jagdrevier und wurde 1766 für die Öffentlichkeit freigegeben."]},"AT-SchoenbrunnZoo":{"i":"/geo-images/austria/schoenbrunn-zoo.webp","s":"Der Tiergarten Schönbrunn in Wien ist der älteste noch bestehende Zoo der Welt und wurde 1752 vom Habsburger Kaiser Franz I.","f":["Der Tiergarten wurde 1752 als kaiserliche Menagerie gegründet.","Die ursprünglichen barocken Tierlogen sind sternförmig um den Frühstückspavillon angelegt."]},"AT-Hundertwasser":{"i":"/geo-images/austria/hundertwasser.webp","s":"Das Hundertwasserhaus im 3.","f":["Entworfen von Friedensreich Hundertwasser, gemeinsam mit dem Architekten Josef Krawina.","Erbaut zwischen 1983 und 1985 als Wohnhaus der Gemeinde Wien."]},"AT-Klosterneuburg":{"i":"/geo-images/austria/klosterneuburg.webp","s":"Das Stift Klosterneuburg, malerisch nördlich von Wien direkt an der Donau gelegen, ist eines der bedeutendsten religiösen, kulturellen und historischen Zentren Österreichs.","f":["Gegründet im Jahr 1114 von Leopold III., dem Heiligen.","Der Verduner Altar (1181) aus Emailtafeln ist eines der wichtigsten Kunstwerke des Mittelalters."]},"AT-Achensee":{"i":"/geo-images/austria/achensee.webp","s":"Der Achensee, oft auch liebevoll das 'Tiroler Meer' genannt, ist der größte See Tirols und ein atemberaubendes Naturparadies im Herzen der Alpen.","f":["Der Achensee ist der größte und tiefste See im Bundesland Tirol.","Wegen seiner thermischen Winde ist er ein Hotspot für Segler und Windsurfer."]},"AT-Pyramidenkogel":{"i":"/geo-images/austria/pyramidenkogel.webp","s":"Der Pyramidenkogel ist ein bewaldeter Berggrat in Kärnten südlich des Wörthersees, der sich jedoch vor allem durch ein atemberaubendes Bauwerk auszeichnet: Den Aussichtsturm Pyramidenkogel.","f":["Der Aussichtsturm ist exakt 100 Meter hoch und damit der höchste Holzturm der Welt.","Die geschwungene Struktur besteht aus 16 mächtigen Brettschichtholz-Stützen."]},"AT-Arlberg":{"i":"/geo-images/austria/arlberg.webp","s":"Der Arlberg, die natürliche Gebirgsgrenze zwischen den Bundesländern Tirol und Vorarlberg, ist ein weltweiter Mythos im alpinen Wintersport und gilt als die 'Wiege des alpinen Skilaufs'.","f":["Gilt als 'Wiege des alpinen Skilaufs' (der erste Skiclub wurde hier 1901 gegründet).","Ski Arlberg ist mit 302 Pistenkilometern das größte Skigebiet in Österreich."]},"at-villach":{"i":"/geo-images/austria/villach.webp","s":"Villach ist die siebtgrößte Stadt Österreichs und ein wichtiger Verkehrsknotenpunkt in Kärnten.","f":["Villach ist die zweitgrößte Stadt in Kärnten.","Die Stadt liegt an der Einmündung der Gail in die Drau."]},"at-wiener-neustadt":{"i":"/geo-images/austria/wiener-neustadt.webp","s":"Wiener Neustadt ist eine bedeutende Stadt in Niederösterreich, südlich von Wien gelegen.","f":["Wiener Neustadt wurde 1194 vom Babenberger-Herzog Leopold V. gegründet.","Ein Teil des Lösegelds für Richard Löwenherz wurde zur Finanzierung der Stadtgründung verwendet."]},"at-krems":{"i":"/geo-images/austria/krems.webp","s":"Krems an der Donau ist die fünftgrößte Stadt Niederösterreichs und liegt am östlichen Rand der Wachau.","f":["Krems wurde im Jahr 995 erstmals urkundlich erwähnt.","Die Stadt bildet zusammen mit Stein an der Donau eine Doppelstadt."]},"at-wels":{"i":"/geo-images/austria/wels.webp","s":"Wels ist die achtgrößte Stadt Österreichs und die zweitgrößte Stadt in Oberösterreich.","f":["Wels war unter den Römern als Ovilava eine wichtige Stadt.","Kaiser Maximilian I. starb 1519 in der Welser Burg."]},"at-dornbirn":{"i":"/geo-images/austria/dornbirn.webp","s":"Dornbirn ist die bevölkerungsreichste Stadt im österreichischen Bundesland Vorarlberg und der wichtigste wirtschaftliche Knotenpunkt der Region.","f":["Dornbirn hat mehr Einwohner als die Landeshauptstadt Bregenz.","Die Stadt war im 19. Jahrhundert das Zentrum der Vorarlberger Textilindustrie."]},"at-steyr":{"i":"/geo-images/austria/steyr.webp","s":"Steyr ist eine historische Stadt in Oberösterreich und liegt am Zusammenfluss von Enns und Steyr.","f":["Steyr war ein wichtiger Standort für die Waffen- und Fahrzeugproduktion.","Das Bummerlhaus am Stadtplatz ist ein Meisterwerk der Gotik."]},"at-feldkirch":{"i":"/geo-images/austria/feldkirch.webp","s":"Feldkirch ist die am weitesten westlich gelegene Gemeinde in Österreich und grenzt an Liechtenstein und die Schweiz.","f":["Die Schattenburg ist eine der am besten erhaltenen Burgen Mitteleuropas.","Feldkirch erhielt 1218 das Stadtrecht von Hugo I. von Montfort."]},"at-leoben":{"i":"/geo-images/austria/leoben.webp","s":"Leoben ist die zweitgrößte Stadt in der Steiermark und liegt im Zentrum des österreichischen Bergbau- und Hüttenwesens.","f":["Leoben ist das wirtschaftliche Zentrum der Obersteiermark.","Die Montanuniversität Leoben wurde 1840 gegründet."]},"at-wolfsberg":{"i":"/geo-images/austria/wolfsberg.webp","s":"Wolfsberg ist die drittgrößte Stadt Kärntens und das Zentrum des Lavanttals.","f":["Wolfsberg wurde 1178 erstmals urkundlich erwähnt.","Schloss Wolfsberg wurde im 19. Jahrhundert im Tudor-Stil umgebaut."]},"at-lienz":{"i":"/geo-images/austria/lienz.webp","s":"Lienz ist die Hauptstadt und das wirtschaftliche Zentrum von Osttirol.","f":["Lienz ist die einzige Stadt in Osttirol.","Die Stadt hat ein mediterran anmutendes Klima und viele Palmen im Zentrum."]},"at-zell-am-see":{"i":"/geo-images/austria/zell-am-see.webp","s":"Zell am See ist eine malerische Stadt im Salzburger Land, die am Ufer des Zeller Sees liegt.","f":["Der Zeller See hat Trinkwasserqualität.","Zell am See und Kaprun bilden zusammen eine der wichtigsten Tourismusregionen Österreichs."]},"at-worthersee":{"i":"/geo-images/austria/worthersee.webp","s":"Der Wörthersee ist der größte und wohl bekannteste See Kärntens.","f":["Der Wörthersee kann im Sommer Wassertemperaturen bis zu 27 Grad Celsius erreichen.","Er ist fast 17 Kilometer lang und bis zu 1,6 Kilometer breit."]},"at-kitzsteinhorn":{"i":"/geo-images/austria/kitzsteinhorn.webp","s":"Das Kitzsteinhorn ist ein Berg in den Hohen Tauern und beherbergt das erste Gletscherskigebiet Österreichs.","f":["Der Gipfel des Kitzsteinhorns liegt auf 3.203 Metern Höhe.","Die Gipfelwelt 3000 ist der höchste für jedermann bequem erreichbare Punkt im Salzburger Land."]},"at-nockberge":{"i":"/geo-images/austria/nockberge.webp","s":"Der Biosphärenpark Nockberge in Kärnten ist bekannt für seine sanften, runden Kuppen (Nocken), die sich von den schroffen Gipfeln anderer Alpenregionen deutlich abheben.","f":["Die Nockberge bestehen vorwiegend aus Schiefergestein, was ihre runde Form erklärt.","Die Nockalmstraße ist 34 Kilometer lang und hat 52 Kehren."]},"at-kalkalpen-np":{"i":"/geo-images/austria/kalkalpen-np.webp","s":"Der Nationalpark Kalkalpen in Oberösterreich schützt das größte zusammenhängende Waldgebiet Österreichs.","f":["Der Nationalpark umfasst das Sengsengebirge und das Reichraminger Hintergebirge.","Vier Fünftel der Nationalparkfläche sind von Wald bedeckt."]},"at-gesauze":{"i":"/geo-images/austria/gesauze.webp","s":"Das Gesäuse in der Steiermark ist bekannt für seine schroffen Kalkgipfel, die steil über dem tosenden Fluss Enns aufragen.","f":["Der Name 'Gesäuse' stammt vom lauten Rauschen (Sausen) des Flusses Enns.","Der Nationalpark wurde im Jahr 2002 gegründet."]},"at-thayatal-np":{"i":"/geo-images/austria/thayatal-np.webp","s":"Der Nationalpark Thayatal in Niederösterreich ist der kleinste Nationalpark Österreichs und grenzt an den tschechischen Národní park Podyjí.","f":["Der Nationalpark Thayatal ist mit rund 1.330 Hektar der kleinste in Österreich.","Das Thayatal ist ein klassisches Durchbruchstal mit vielen Flussschleifen."]},"at-oetztal":{"i":"/geo-images/austria/oetztal.webp","s":"Das Ötztal in Tirol ist das längste Seitental des Inntals und umgeben von majestätischen Dreitausendern.","f":["Das Ötztal ist rund 65 Kilometer lang.","Der Stuibenfall im Ötztal ist mit 159 Metern der höchste Wasserfall Tirols."]},"at-eisriesenwelt":{"i":"/geo-images/austria/eisriesenwelt.webp","s":"Die Eisriesenwelt in Werfen ist die größte Eishöhle der Welt.","f":["Die Eisriesenwelt gilt mit 42 km als das größte Eishöhlensystem der Erde.","Das Höhlenportal liegt auf einer Höhe von 1.641 Metern."]},"at-donau-auen-np":{"i":"/geo-images/austria/donau-auen-np.webp","s":"Der Nationalpark Donau-Auen erstreckt sich zwischen Wien und Bratislava und bewahrt eine der letzten großen unverbauten Flussauenlandschaften Mitteleuropas.","f":["Die Donau-Auen sind die größte naturnahe Flussauenlandschaft Mitteleuropas.","Der Park wurde 1996 gegründet, nachdem der Bau eines Kraftwerks bei Hainburg verhindert wurde."]},"at-gottweig-abbey":{"i":"/geo-images/austria/gottweig-abbey.webp","s":"Das Stift Göttweig ist ein Benediktinerkloster auf einem Hügel südlich von Krems in Niederösterreich.","f":["Das Stift Göttweig wurde 1083 vom Bischof Altmann von Passau gegründet.","Nach einem Brand 1718 wurde das Stift im Barockstil unter Johann Lukas von Hildebrandt neu erbaut."]},"at-stift-admont":{"i":"/geo-images/austria/stift-admont.webp","s":"Das Stift Admont in der Steiermark ist das älteste bestehende Kloster in der Region und weltweit bekannt für seine atemberaubende Stiftsbibliothek.","f":["Das Stift Admont wurde im Jahr 1074 gegründet.","Die Stiftsbibliothek ist 70 Meter lang, 14 Meter breit und 13 Meter hoch."]},"at-salzburg-festival":{"i":"/geo-images/austria/salzburg-festival.webp","s":"Die Salzburger Festspiele sind das weltweit bedeutendste Festival der klassischen Musik und darstellenden Kunst.","f":["Die Festspiele wurden 1920 von Max Reinhardt, Hugo von Hofmannsthal und Richard Strauss gegründet.","Das Festspielhaus-Ensemble in Salzburg umfasst das Große Festspielhaus, das Haus für Mozart und die Felsenreit"]},"at-minimundus":{"i":"/geo-images/austria/minimundus.webp","s":"Minimundus in Klagenfurt am Wörthersee ist ein beliebter Miniaturpark und wird oft als die 'kleine Welt am Wörthersee' bezeichnet.","f":["Alle Modelle im Minimundus sind im einheitlichen Maßstab 1:25 gebaut.","Der Miniaturpark wurde 1958 eröffnet."]},"at-schladming-dachstein":{"i":"/geo-images/austria/schladming-dachstein.webp","s":"Die Urlaubsregion Schladming-Dachstein in der Steiermark zählt zu den führenden Alpendestinationen Österreichs.","f":["Die 4-Berge-Skischaukel verbindet die Berge Hauser Kaibling, Planai, Hochwurzen und Reiteralm ohne Unterbrechu","Schladming trug bereits mehrmals die Alpine Skiweltmeisterschaft aus (zuletzt 2013)."]},"at-kitzbuhel-ski":{"i":"/geo-images/austria/kitzbuhel-ski.webp","s":"Kitzbühel in Tirol ist einer der exklusivsten und bekanntesten Wintersportorte der Welt.","f":["Die Streif gilt als die schwierigste und gefährlichste Abfahrtsstrecke der Welt.","Beim Hahnenkammrennen erreichen die Skirennläufer auf der Zielschusskante Geschwindigkeiten bis zu 140 km/h."]},"at-mozarteum-salzburg":{"i":"/geo-images/austria/mozarteum-salzburg.webp","s":"Die Internationale Stiftung Mozarteum in Salzburg hat es sich zur Aufgabe gemacht, das Erbe Wolfgang Amadeus Mozarts zu bewahren.","f":["Die Stiftung Mozarteum wurde 1880 von Bürgern der Stadt Salzburg gegründet.","In Mozarts Geburtshaus in der Getreidegasse kam er 1756 zur Welt."]},"at-riegersburg":{"i":"/geo-images/austria/riegersburg.webp","s":"Die Riegersburg thront majestätisch auf einem 482 Meter hohen Basaltfelsen eines erloschenen Vulkans in der Südoststeiermark.","f":["Die Burg wurde im 11. Jahrhundert erstmals urkundlich erwähnt.","Sie besitzt eine 3 Kilometer lange Wehrmauer mit elf Basteien und sieben Toren."]},"at-kufstein-fortress":{"i":"/geo-images/austria/kufstein-fortress.webp","s":"Die Festung Kufstein ist das Wahrzeichen der Stadt Kufstein in Tirol und thront weithin sichtbar auf einem Hügel über dem Fluss Inn.","f":["Die Festung wurde im 13. Jahrhundert erstmals urkundlich als Eigentum der Bischöfe von Regensburg erwähnt.","Kaiser Maximilian I. ließ die Festung im 16. Jahrhundert mit dem runden 'Kaiserturm' massiv ausbauen."]},"at-kreuzenstein":{"i":"/geo-images/austria/kreuzenstein.webp","s":"Die Burg Kreuzenstein nahe Wien ist eine beeindruckende Schauburg, die im 19.","f":["Die ursprüngliche Burg Kreuzenstein wurde während des Dreißigjährigen Krieges 1645 von schwedischen Truppen ze","Der Wiederaufbau der Burg dauerte von 1874 bis 1906."]},"at-historic-centre-vienna":{"i":"/geo-images/austria/historic-centre-vienna.webp","s":"Das historische Zentrum von Wien bündelt Kaisertradition, Barockarchitektur und UNESCO-Flair auf engem Raum.","f":["Teil des UNESCO-Welterbes Altstadt von Wien.","Hier liegen Stephansdom, Hofburg und Ringstraße dicht beieinander."]},"at-aspern-essling-battlefield":{"i":"/geo-images/austria/aspern-essling-battlefield.webp","s":"Das Schlachtfeld Aspern-Essling erinnert an eine der berühmtesten Auseinandersetzungen der napoleonischen Zeit in Österreich.","f":["Ort der Schlacht von Aspern und Essling 1809.","Erster großer Rückschlag Napoleons gegen Österreich."]},"at-mauthausen-memorial":{"i":"/geo-images/austria/mauthausen-memorial.webp","s":"Die Mauthausen-Gedenkstätte ist einer der wichtigsten Orte des Erinnerns in Österreich und Europa.","f":["Gedenkstätte auf dem Gelände des ehemaligen KZ Mauthausen.","Liegt nahe der Donau in Oberösterreich."]},"at-burg-seebenstein":{"i":"/geo-images/austria/burg-seebenstein.webp","s":"Die Burg Seebenstein erhebt sich markant über dem Wiener Alpenvorland und ist ein klassisches Ziel für Burgen-SEO in Niederösterreich.","f":["Liegt im südlichen Niederösterreich.","Fotogen auf einem Felsen über dem Ort."]},"at-burg-aggstein":{"i":"/geo-images/austria/burg-aggstein.webp","s":"Burg Aggstein ist eine der eindrucksvollsten Ruinen in der Wachau und ein Magnet für Mittelalter- und Donautourismus.","f":["Liegt in der Wachau über der Donau.","Eine der bekanntesten Burgruinen Niederösterreichs."]},"at-burg-golling":{"i":"/geo-images/austria/burg-golling.webp","s":"Burg Golling bewacht das Tor zum Tennengau und ist ein schönes Beispiel für eine alpine Höhenburg in Salzburg.","f":["Wichtige Höhenburg im Tennengau.","Liegt über dem Ort Golling an der Salzach."]},"at-burg-heidenreichstein":{"i":"/geo-images/austria/burg-heidenreichstein.webp","s":"Burg Heidenreichstein ist eine der bekanntesten Wasserburgen Österreichs und ein Musterbeispiel für das Waldviertel.","f":["Eine der bekanntesten Wasserburgen Österreichs.","Liegt im nördlichen Waldviertel."]},"at-burg-oberkapfenberg":{"i":"/geo-images/austria/burg-oberkapfenberg.webp","s":"Burg Oberkapfenberg wacht über das Mürztal und ist ein eindrucksvoller historischer Blickfang in der Steiermark.","f":["Liegt über Kapfenberg im Mürztal.","Markanter historischer Punkt in der Obersteiermark."]},"at-kahlenberg":{"i":"/geo-images/austria/kahlenberg.webp","s":"Der Kahlenberg über Wien ist ein berühmter Aussichtspunkt und ein starkes Natur-SEO-Ziel in der Hauptstadtregion.","f":["Bekannter Aussichtspunkt über Wien.","Liegt am Rand des Wienerwaldes."]},"at-gerlitzen":{"i":"/geo-images/austria/gerlitzen.webp","s":"Die Gerlitzen ist ein markanter Aussichts- und Skiberg über dem Ossiacher See in Kärnten.","f":["Liegt über dem Ossiacher See in Kärnten.","Beliebt für Wandern, Paragleiten und Skifahren."]},"at-rax":{"i":"/geo-images/austria/rax.webp","s":"Die Rax ist ein klassisches alpines Plateau in Niederösterreich und eine Ikone für Wandern und Klettersteige.","f":["Bekanntes Hochplateau in den Wiener Alpen.","Berühmt für Wanderwege und Berggasthöfe."]},"at-stuhleck":{"i":"/geo-images/austria/stuhleck.webp","s":"Das Stuhleck ist ein bekannter Wintersportberg in den Wiener Alpen und ein wichtiges Ziel für Ski-SEO in Österreich.","f":["Bekanntes Skigebiet in den Wiener Alpen.","Gut für Familien und Tagesgäste."]},"at-faaker-see":{"i":"/geo-images/austria/faaker-see.webp","s":"Der Faaker See gehört zu den farbintensivsten Seen Kärntens und steht für türkisfarbenes Wasser, Sommerurlaub und Badequalität.","f":["Türkisfarbener See in Kärnten.","Beliebt für Baden, SUP und Camping."]},"at-klopeiner-see":{"i":"/geo-images/austria/klopeiner-see.webp","s":"Der Klopeiner See gilt als einer der wärmsten Badeseen Österreichs und ist ein Klassiker für Sommerurlaub in Kärnten.","f":["Einer der wärmsten Badeseen Österreichs.","Liegt in Südkärnten."]},"at-pielach-river":{"i":"/geo-images/austria/pielach.webp","s":"Die Pielach ist ein wichtiger Fluss in Niederösterreich und prägt das Pielachtal mit seinen ruhigen Landschaften und Ortskernen.","f":["Fluss im Mostviertel von Niederösterreich.","Prägt das Pielachtal mit seinen Ortschaften."]},"at-moell-river":{"i":"/geo-images/austria/moell-river.webp","s":"Die Möll ist ein alpiner Fluss in Kärnten und steht für glasklares Wasser, enge Täler und Kraft der Bergnatur.","f":["Alpiner Fluss in Kärnten.","Verläuft durch enge Bergtäler."]},"at-secession-building":{"i":"/geo-images/austria/secession-building.webp","s":"Das Wiener Secessionsgebäude ist ein Ikonenbau der Moderne und ein starkes Ziel für Architektur-SEO in Österreich.","f":["Ikonisches Jugendstilgebäude in Wien.","Symbol der Secessionsbewegung um 1900."]},"at-karlskirche":{"i":"/geo-images/austria/karlskirche.webp","s":"Die Karlskirche zählt zu den berühmtesten Barockkirchen Europas und ist ein Kernmotiv für Wien-SEO.","f":["Berühmte Barockkirche in Wien.","Steht am Karlsplatz im Zentrum."]},"at-burgtheater":{"i":"/geo-images/austria/burgtheater.webp","s":"Das Burgtheater ist das wichtigste deutschsprachige Sprechtheater und ein kulturelles Aushängeschild Wiens.","f":["Nationalbühne Österreichs mit langer Tradition.","Liegt an der Wiener Ringstraße."]},"at-austrian-parliament":{"i":"/geo-images/austria/austrian-parliament.webp","s":"Das österreichische Parlament am Ring steht für Demokratie, Geschichte und monumentale Staatsarchitektur.","f":["Wichtiger Parlamentsbau an der Ringstraße.","Starkes Symbol der österreichischen Demokratie."]},"at-vienna-city-hall":{"i":"/geo-images/austria/vienna-city-hall.webp","s":"Das Wiener Rathaus ist ein neugotisches Monument und ein starkes Stadtmarkenzeichen an der Ringstraße.","f":["Neugotisches Wahrzeichen an der Ringstraße.","Sitz der Wiener Stadtverwaltung."]},"at-museumquartier":{"i":"/geo-images/austria/museumquartier.webp","s":"Das MuseumsQuartier gehört zu den größten Kulturarealen Europas ür Grüner Veltliner und Riesling."]},"at-marchfeld-vegetables":{"i":"/geo-images/austria/marchfeld-vegetables.webp","s":"Das Marchfeld ist einer der wichtigsten Gemüse- und Ackerbauräume Österreichs und steht für landwirtschaftliche Produktivität auf hohem Niveau.","f":["Wichtiges Gemüseanbaugebiet östlich von Wien.","Bekannt für Spargel, Zwiebeln und Feldfrüchte."]},"at-tulln-an-der-donau":{"i":"/geo-images/austria/tulln-an-der-donau.webp","s":"Tulln an der Donau ist eine lebendige Stadt in Niederösterreich mit starkem Bezug zum Fluss, zu Gärten und zur regionalen Landwirtschaft.","f":["Liegt direkt an der Donau in Niederösterreich.","Gilt als Garten- und Messestadt mit starkem Freizeitprofil."]},"at-neunkirchen-niederoesterreich":{"i":"/geo-images/austria/neunkirchen-niederoesterreich.webp","s":"Neunkirchen ist ein traditionsreicher Bezirkshauptort am Rand der Buckligen Welt und nahe der Semmeringregion.","f":["Bezirkshauptstadt im südlichen Niederösterreich.","Nahe an der Semmeringbahn und an alpinen Ausflugszielen."]},"at-hollabrunn":{"i":"/geo-images/austria/hollabrunn.webp","s":"Hollabrunn liegt im Weinviertel und steht für Weinbau, offene Landschaften und ein ruhiges Kleinstadtgefühl.","f":["Liegt im Weinviertel in Niederösterreich.","Bekannt für Weinbau und Kellergassen."]},"at-zwettl-niederoesterreich":{"i":"/geo-images/austria/at-zwettl-niederoesterreich.webp","s":"Zwettl ist eine historische Braustadt im Waldviertel, berühmt für ihr prachtvolles Zisterzienserstift und die unberührte Natur des Kamp-Tals.","f":["Stift Zwettl","Waldviertler Bierstadt"]},"at-bischofshofen":{"i":"/geo-images/austria/bischofshofen.webp","s":"Bischofshofen ist ein bedeutender Ort im Pongau und steht für alpinen Verkehr, Wintersport und Salzach-Tal-Atmosphäre.","f":["Liegt im Pongau im Bundesland Salzburg.","Ist international als Station der Vierschanzentournee bekannt."]},"at-gmunden":{"i":"/geo-images/austria/gmunden.webp","s":"Gmunden am Traunsee ist eine der elegantesten Städ let s=1,tx=0,ty=0;

function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});

svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});

  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
