 Betelnüssen."]},"hakha-cities-v2":{"i":"/poi-images/hakha-cities-v2.webp","s":"Die Hauptstadt des Chin-Staates, hoch in den Bergen gelegen mit spektakulären Ausblicken.","f":["Eine der abgelegensten Hauptstädte in Myanmar.","Das Klima ist hier aufgrund der Höhe oft sehr kalt."]},"loikaw-cities-v2":{"i":"/poi-images/loikaw-cities-v2.webp","s":"Die Hauptstadt des Kayah-Staates, bekannt für die malerische Taung-Kwe-Pagode auf einem Kalksteinhügel.","f":["In der Nähe des Lawpita-Wasserkraftwerks gelegen.","Eine der kleinsten Hauptstädte in Myanmar."]},"thandwe-cities-v2":{"i":"/poi-images/thandwe-cities-v2.webp","s":"Eine Küstenstadt im Rakhine-Staat, die als Tor zum berühmten Ngapali-Strand dient.","f":["Verfügt über einen wichtigen regionalen Flughafen.","Die Wirtschaft stützt sich auf Tourismus und Fischerei."]},"kengtung-cities-v2":{"i":"/poi-images/kengtung-cities-v2.webp","s":"Eine malerische Stadt im östlichen Shan-Staat, bekannt für ihre traditionelle Architektur und ethnische Vielfalt.","f":["Kulturelles Zentrum des Volkes der Khün.","Liegt in einer bergigen und bewaldeten Region."]},"muse-cities-v2":{"i":"/poi-images/muse-cities-v2.webp","s":"Eine wichtige Grenzstadt im nördlichen Shan-Staat, die durch starken Handel mit China geprägt ist.","f":["Einer der verkehrsreichsten Grenzübergänge Myanmars.","Spielt eine Schlüsselrolle in der regionalen Wirtschaft."]},"kyaukpyu-cities-v2":{"i":"/poi-images/kyaukpyu-cities-v2.webp","s":"Eine Küstenstadt auf der Insel Ramree im Rakhine-Staat, bekannt für ihren wichtigen Tiefseehafen.","f":["Startpunkt für Öl- und Gaspipelines nach China.","Wichtiger Teil der Sonderwirtschaftszone."]},"thilawa-special-economic-zone-economic-v2":{"i":"/poi-images/thilawa-special-economic-zone-economic-v2.webp","s":"Die erste in Betrieb genommene Sonderwirtschaftszone in Myanmar, die eine Vielzahl von Produktions- und Industrieanlagen in der Nähe von Yangon beherbergt.","f":["Es ist ein Joint Venture zwischen Myanmar und Japan.","Der kommerzielle Betrieb begann im September 2015."]},"kanbauk-gas-terminal-economic-v2":{"i":"/poi-images/kanbauk-gas-terminal-economic-v2.webp","s":"Eine wichtige Anlage in der Tanintharyi-Region, in der Erdgas von Offshore-Feldern verarbeitet und nach Thailand exportiert wird.","f":["Das Terminal empfängt Gas aus dem Yadanar-Projekt.","Die Gaspipeline verläuft direkt in die thailändische Provinz Ratchaburi."]},"letpadaung-copper-mine-economic-v2":{"i":"/poi-images/letpadaung-copper-mine-economic-v2.webp","s":"Eines der größten Kupferbergwerke Südostasiens in der Nähe von Monywa, das jedoch aufgrund sozialer und ökologischer Probleme stark umstritten ist.","f":["Das Projekt wird von Wanbao Mining aus China betrieben.","Die Mine befindet sich in der Sagaing-Region."]},"hpakant-jade-mine-economic-v2":{"i":"/poi-images/hpakant-jade-mine-economic-v2.webp","s":"Das weltweit größte und lukrativste Zentrum für den Abbau von Jadeit, das einen massiven wirtschaftlichen Wert generiert, aber für gefährliche Arbeitsbedingungen berüchtigt ist.","f":["Die Minen produzieren fast 70 Prozent des weltweiten hochwertigen Jadeits.","Erdrutsche stellen in der Region eine ständige und tödliche Gefahr dar."]},"myawaddy-border-trade-hub-economic-v2":{"i":"/poi-images/myawaddy-border-trade-hub-economic-v2.webp","s":"Der wichtigste Landgrenzübergang zwischen Myanmar und Thailand, der einen massiven Fluss von Waren und landwirtschaftlichen Produkten ermöglicht.","f":["Er verbindet die thailändische Stadt Mae Sot mit dem Kayin-Staat.","Die neue Asiatische Autobahn hat die Handelsrouten hier erheblich verbessert."]},"mogok-ruby-mines-economic-v2":{"i":"/poi-images/mogok-ruby-mines-economic-v2.webp","s":"Ein weltberühmtes Bergbaugebiet im Mandalay-Gebiet, das seit Jahrhunderten die begehrtesten Taubenblut-Rubine der Welt liefert.","f":["Die Region wird oft als das 'Tal der Rubine' bezeichnet.","Neben Rubinen werden hier auch Saphire und Spinelle gefördert."]},"105-mile-trade-zone-economic-v2":{"i":"/poi-images/105-mile-trade-zone-economic-v2.webp","s":"Die größte und wichtigste Grenzübergangsstelle an der Grenze zu China nahe Muse, durch die ein Großteil des bilateralen Handels fließt.","f":["Benannt nach der Entfernung zur Stadt Lashio (105 Meilen).","Hier werden täglich Hunderte von Lastwagen abgefertigt."]},"yeywa-hydropower-plant-economic-v2":{"i":"/poi-images/yeywa-hydropower-plant-economic-v2.webp","s":"Eines der wichtigsten Wasserkraftwerke Myanmars, gelegen am Fluss Myitnge, das einen großen Teil des nationalen Stromnetzes speist.","f":["Die Anlage hat eine installierte Kapazität von 790 Megawatt.","Es ist ein wichtiges Walzbeton-Damm-Projekt."]},"dawei-deep-sea-port-project-economic-v2":{"i":"/poi-images/dawei-deep-sea-port-project-economic-v2.webp","s":"Ein massives geplantes Infrastrukturprojekt zur Schaffung eines Tiefseehafens und einer Sonderwirtschaftszone, das Südostasien mit dem Indischen Ozean verbinden soll.","f":["Das Projekt zielt darauf ab, die Straße von Malakka zu umgehen.","Die Entwicklung hat sich aufgrund von Finanzierungsproblemen immer wieder verzögert."]},"kyaukpyu-special-economic-zone-economic-v2":{"i":"/poi-images/kyaukpyu-special-economic-zone-economic-v2.webp","s":"Eine strategisch wichtige Freihandels- und Industriezone im Rakhine-Staat, die von zentraler Bedeutung für den chinesisch-myanmarischen Wirtschaftskorridor ist.","f":["Der Tiefseehafen hier dient als Startpunkt für Öl- und Gaspipelines nach China.","Ein großer Teil des Geländes liegt auf der Insel Ramree."]},"tagaung-taung-nickel-mine-economic-v2":{"i":"/poi-images/tagaung-taung-nickel-mine-economic-v2.webp","s":"Ein bedeutendes Bergbau- und Schmelzprojekt für Ferronickel im Mandalay-Gebiet, das hauptsächlich für den Export bestimmt ist.","f":["Das Projekt wurde mit erheblichen chinesischen Investitionen realisiert.","Es ist die größte Nickelfabrik in Myanmar."]},"mann-oil-field-economic-v2":{"i":"/poi-images/mann-oil-field-economic-v2.webp","s":"Eines der produktivsten Onshore-Ölfelder Myanmars, das in der Magway-Region liegt und seit Jahrzehnten eine stabile Ölquelle für das Land darstellt.","f":["Das Feld wurde 1970 entdeckt.","Es gehört zu den am dichtesten gebohrten Ölfeldern des Landes."]},"chauk-oil-field-economic-v2":{"i":"/poi-images/chauk-oil-field-economic-v2.webp","s":"Ein historisches, aber immer noch aktives Ölfeld in Zentralmyanmar, das seit der britischen Kolonialzeit in Betrieb ist und sich entlang des Irrawaddy-Flusses erstreckt.","f":["Die Ölförderung in dieser Region begann bereits 1902.","Es ist ein wichtiges Zentrum der heimischen petrochemischen Industrie."]},"belin-sugar-mill-economic-v2":{"i":"/poi-images/belin-sugar-mill-economic-v2.webp","s":"Eine der wichtigsten landwirtschaftlichen Verarbeitungsanlagen im Mon-Staat, die das in der Umgebung angebaute Zuckerrohr zu raffiniertem Zucker für den Inlandsmarkt verarbeitet.","f":["Die Fabrik unterstützt Tausende von örtlichen Zuckerrohrbauern.","Sie spielt eine Schlüsselrolle für die regionale Wirtschaft."]},"shweli-1-hydropower-station-economic-v2":{"i":"/poi-images/shweli-1-hydropower-station-economic-v2.webp","s":"Ein großes Wasserkraftprojekt am Shweli-Fluss im Shan-Staat, das zur Energieversorgung sowohl Myanmars als auch der angrenzenden chinesischen Provinzen beiträgt.","f":["Das Kraftwerk hat eine installierte Leistung von 600 Megawatt.","Es wurde als Build-Operate-Transfer (BOT)-Projekt entwickelt."]},"yangon-inner-port-economic-v2":{"i":"/poi-images/yangon-inner-port-economic-v2.webp","s":"Der historische und wichtigste Flusshafen des Landes am Yangon-Fluss, der trotz Tiefgangsbeschränkungen einen großen Teil des Seehandels Myanmars abwickelt.","f":["Er wickelt fast 90 Prozent der legalen Importe und Exporte des Landes ab.","Der Hafen liegt etwa 30 Kilometer landeinwärts von der Andamanensee."]},"myanmar-industrial-port-economic-v2":{"i":"/poi-images/myanmar-industrial-port-economic-v2.webp","s":"Ein privat betriebenes Containerterminal in Yangon, das eine entscheidende Rolle in der Logistikkette Myanmars spielt und internationale Frachtschiffe bedient.","f":["Es ist eines der geschäftigsten Terminals im Großraum Yangon.","Das Terminal wurde nach dem Jahr 2000 modernisiert, um mehr Containerkapazitäten zu bewältigen."]},"heinda-tin-mine-economic-v2":{"i":"/poi-images/heinda-tin-mine-economic-v2.webp","s":"Eines der ältesten und größten Zinnbergwerke in der Tanintharyi-Region, das die reichen Mineralvorkommen der Tenasserim-Berge abbaut.","f":["Das Bergwerk ist seit den 1920er Jahren in Betrieb.","Der Zinnabbau hier erfolgt größtenteils im Tagebau."]},"tigyit-coal-power-plant-economic-v2":{"i":"/poi-images/tigyit-coal-power-plant-economic-v2.webp","s":"Myanmars größtes Kohlekraftwerk, gelegen im südlichen Shan-Staat, das Energie liefert, aber oft wegen seiner Umweltbelastung in der Kritik steht.","f":["Es hat eine Nennleistung von etwa 120 Megawatt.","Die Kohle wird aus den nahegelegenen Tigyit-Tagebauen bezogen."]},"myingyan-steel-mill-economic-v2":{"i":"/poi-images/myingyan-steel-mill-economic-v2.webp","s":"Ein staatliches Industriezentrum zur Stahlproduktion in der Mandalay-Region, das zur Deckung der Inlandsnachfrage nach Baumaterialien errichtet wurde.","f":["Die Anlage verwendet teilweise Eisenerz aus lokalen Lagerstätten.","Es ist ein Schlüsselprojekt der myanmarischen Schwerindustrie."]},"shwedagon-pagoda-history-v2":{"i":"/poi-images/shwedagon-pagoda-history-v2.webp","s":"Ein massiver goldener Stupa in Yangon, der als der heiligste buddhistische Schrein in Myanmar gilt und Reliquien von vier Buddhas enthält.","f":["Über 2.500 Jahre alt.","Mit echten Goldplatten bedeckt."]},"bagan-archaeological-zone-history-v2":{"i":"/poi-images/bagan-archaeological-zone-history-v2.webp","s":"Eine alte Stadt in der Mandalay-Region mit über 2.000 erhaltenen buddhistischen Tempeln und Pagoden aus dem 9.","f":["War die Hauptstadt des Königreichs Pagan.","Seit 2019 UNESCO-Weltkulturerbe."]},"mrauk-u-ruins-history-v2":{"i":"/poi-images/mrauk-u-ruins-history-v2.webp","s":"Die ehemalige Hauptstadt des Arakan-Reiches, bekannt für ihre einzigartigen, festungsähnlichen Steintempel.","f":["Gegründet im Jahr 1431.","War einst ein wichtiges Handelszentrum."]},"shwenandaw-monastery-history-v2":{"i":"/poi-images/shwenandaw-monastery-history-v2.webp","s":"Ein historisches buddhistisches Kloster in Mandalay, das für seine exquisiten Teakholz-Schnitzereien und traditionelle Architektur berühmt ist.","f":["Ursprünglich Teil des Königspalastes von Mandalay.","Erbaut im 19. Jahrhundert."]},"mandalay-palace-history-v2":{"i":"/poi-images/mandalay-palace-history-v2.webp","s":"Der letzte königliche Palast der birmanischen Monarchie, der als ummauerte Festung mit einem breiten Wassergraben im Zentrum von Mandalay errichtet wurde.","f":["Erbaut von König Mindon in den 1850er Jahren.","Im Zweiten Weltkrieg fast vollständig zerstört."]},"mahamuni-buddha-temple-history-v2":{"i":"/poi-images/mahamuni-buddha-temple-history-v2.webp","s":"Eine der wichtigsten buddhistischen Pilgerstätten in Myanmar, die eine hoch verehrte Buddha-Statue beherbergt.","f":["Die Statue ist mit dicken Schichten aus Blattgold bedeckt.","Ursprünglich aus dem Königreich Arakan gebracht."]},"sule-pagoda-history-v2":{"i":"/poi-images/sule-pagoda-history-v2.webp","s":"Eine historische Stupa, die sich im Herzen der Innenstadt von Yangon befindet und als Zentrum der Stadtplanung der britischen Kolonialzeit diente.","f":["Soll über 2.000 Jahre alt sein.","Hat eine ungewöhnliche achteckige Form."]},"inwa-ruins-history-v2":{"i":"/poi-images/inwa-ruins-history-v2.webp","s":"Die Überreste der alten Reichshauptstadt, die vom 14.","f":["Wurde mehrfach durch Erdbeben zerstört.","War vier Jahrhunderte lang die königliche Hauptstadt."]},"mingun-pahtodawgyi-history-v2":{"i":"/poi-images/mingun-pahtodawgyi-history-v2.webp","s":"Die Ruine einer gigantischen Pagode, die, wäre sie vollendet worden, die größte der Welt gewesen wäre.","f":["Der Bau wurde 1790 von König Bodawpaya begonnen.","Durch ein Erdbeben im Jahr 1839 schwer beschädigt."]},"kyaiktiyo-pagoda-history-v2":{"i":"/poi-images/kyaiktiyo-pagoda-history-v2.webp","s":"Besser bekannt als der Goldene Fels, ist diese kleine Pagode auf einem vergoldeten Granitblock erbaut, der prekär an der Kante einer Klippe balanciert.","f":["Eine der wichtigsten Pilgerstätten des Landes.","Der Legende nach wird der Fels durch ein Haar Buddhas im Gleichgewicht gehalten."]},"bogyoke-aung-san-museum-history-v2":{"i":"/poi-images/bogyoke-aung-san-museum-history-v2.webp","s":"Das ehemalige Wohnhaus von General Aung San, dem Gründer des modernen Myanmar, das heute als historisches Museum dient.","f":["Zeigt persönliche Gegenstände der Familie.","Aung San wurde 1947 ermordet."]},"taukkyan-war-cemetery-history-v2":{"i":"/poi-images/taukkyan-war-cemetery-history-v2.webp","s":"Ein Gedenkfriedhof für die alliierten Soldaten, die während des Zweiten Weltkriegs in den Schlachten von Burma gefallen sind.","f":["Wird von der Commonwealth War Graves Commission gepflegt.","Enthält die Gräber von über 6.000 Soldaten."]},"amarapura-historical-city-history-v2":{"i":"/poi-images/amarapura-historical-city-history-v2.webp","s":"Eine ehemalige Hauptstadt Myanmars, die für ihre Seidenweberei und die berühmte U-Bein-Brücke aus Teakholz bekannt ist.","f":["Wurde 1783 von König Bodawpaya gegründet.","Der Name bedeutet \"Stadt der Unsterblichkeit\"."]},"kuthodaw-pagoda-history-v2":{"i":"/poi-images/kuthodaw-pagoda-history-v2.webp","s":"Eine buddhistische Stupa in Mandalay, die das \"größte Buch der Welt\" enthält, bestehend aus Hunderten von Marmorplatten mit buddhistischen Texten.","f":["Es gibt 729 Marmorplatten.","Jede Platte befindet sich in einem eigenen kleinen Schrein."]},"botahtaung-pagoda-history-v2":{"i":"/poi-images/botahtaung-pagoda-history-v2.webp","s":"Eine historische Pagode am Flussufer von Yangon, die im Gegensatz zu den meisten anderen Stupas von innen hohl und begehbar ist.","f":["Wurde während des Zweiten Weltkriegs zerstört und wieder aufgebaut.","Der Name bedeutet \"1.000 Militäroffiziere\"."]},"hsinbyume-pagoda-history-v2":{"i":"/poi-images/hsinbyume-pagoda-history-v2.webp","s":"Eine markante weiße Pagode in Mingun, die architektonisch den mythologischen Berg Meru darstellt.","f":["Erbaut im Jahr 1816 von König Bagyidaw.","Ist Prinzessin Hsinbyume gewidmet."]},"kanbawzathadi-palace-history-v2":{"i":"/poi-images/kanbawzathadi-palace-history-v2.webp","s":"Ein rekonstruierter Palast in Bago, der die Pracht des birmanischen Reiches im 16.","f":["Das Original wurde 1599 niedergebrannt.","Die Ausgrabungen begannen erst 1990."]},"shwezigon-pagoda-history-v2":{"i":"/poi-images/shwezigon-pagoda-history-v2.webp","s":"Ein bedeutender buddhistischer Schrein in Nyaung-U nahe Bagan, der als Prototyp für viele spätere burmesische Stupas diente.","f":["Die Arbeiten wurden von König Anawrahta im 11. Jahrhundert begonnen.","Die vergoldete Stupa ist glockenförmig."]},"ananda-temple-history-v2":{"i":"/poi-images/ananda-temple-history-v2.webp","s":"Einer der schönsten und am besten erhaltenen Tempel in Bagan, bekannt für seine beeindruckende Architektur mit einem kreuzförmigen Grundriss.","f":["Erbaut um 1105 von König Kyanzittha.","Beherbergt vier massive stehende Buddha-Statuen."]},"kakku-pagodas-history-v2":{"i":"/poi-images/kakku-pagodas-history-v2.webp","s":"Ein abgelegener religiöser Komplex im Shan-Staat, der aus Tausenden dicht aneinander gedrängten alten Stupas besteht.","f":["Der Komplex umfasst fast 2.500 Stupas.","Viele stammen aus dem 16. Jahrhundert."]},"myanmar-u-bein-bridge-landmarks-v2":{"i":"/poi-images/myanmar-u-bein-bridge-landmarks-v2.webp","s":"Die längste und älteste Teakholzbrücke der Welt, die den Taungthaman-See in der Nähe von Amarapura überspannt.","f":["Erbaut um 1850.","Verwendet Holz aus einem ehemaligen Königspalast."]},"myanmar-inle-floating-gardens-landmarks-v2":{"i":"/poi-images/myanmar-inle-floating-gardens-landmarks-v2.webp","s":"Einzigartige landwirtschaftliche Flächen auf dem Inle-See, wo Bauern Tomaten und anderes Gemüse auf schwimmenden Inseln anbauen.","f":["Bestehen aus Schilf und Schlamm.","Die Inseln sind mit Bambusstangen am Seegrund befestigt."]},"myanmar-popa-taungkalat-landmarks-v2":{"i":"/poi-images/myanmar-popa-taungkalat-landmarks-v2.webp","s":"Ein buddhistisches Kloster, das spektakulär auf der Spitze eines steilen vulkanischen Pfropfens thront.","f":["777 Stufen führen zum Gipfel.","Gilt als die Heimat der mächtigsten Nats (Geister)."]},"myanmar-gokteik-viaduct-landmarks-v2":{"i":"/poi-images/myanmar-gokteik-viaduct-landmarks-v2.webp","s":"Eine beeindruckende Eisenbahnbrücke aus der britischen Kolonialzeit, die eine tiefe Schlucht im Shan-Staat überquert.","f":["Erbaut im Jahr 1900.","War bei Fertigstellung das größte Eisenbahntrestle der Welt."]},"myanmar-pindaya-caves-landmarks-v2":{"i":"/poi-images/myanmar-pindaya-caves-landmarks-v2.webp","s":"Ein bedeutendes Pilgerziel, das ein ausgedehntes Kalksteinhöhlensystem umfasst, welches Tausende von Buddha-Statuen beherbergt.","f":["Enthält über 8.000 Buddha-Statuen.","Die Statuen stammen aus verschiedenen Epochen."]},"myanmar-chaukhtatgyi-buddha-landmarks-v2":{"i":"/poi-images/myanmar-chaukhtatgyi-buddha-landmarks-v2.webp","s":"Ein Tempel in Yangon, der für seine riesige und detailreich verzierte liegende Buddha-Statue bekannt ist.","f":["Die Statue ist 65 Meter lang.","Die Fußsohlen tragen 108 glücksverheißende Symbole."]},"myanmar-laykyun-sekkya-landmarks-v2":{"i":"/poi-images/myanmar-laykyun-sekkya-landmarks-v2.webp","s":"Eine der höchsten Statuen der Welt, die einen stehenden Buddha in leuchtendem Gelb darstellt und die Landschaft von Monywa dominiert.","f":["Mit 116 Metern Höhe die dritthöchste Statue der Welt.","Die Bauzeit betrug 12 Jahre."]},"myanmar-thanboddhay-pagoda-landmarks-v2":{"i":"/poi-images/myanmar-thanboddhay-pagoda-landmarks-v2.webp","s":"Ein farbenfroher, unkonventioneller Tempelkomplex in Monywa, der mit über einer halben Million kleinen Buddha-Bildnissen geschmückt ist.","f":["Beherbergt genau 582.357 Buddha-Statuen.","Die Architektur erinnert an den Borobudur in Indonesien."]},"myanmar-karaweik-palace-landmarks-v2":{"i":"/poi-images/myanmar-karaweik-palace-landmarks-v2.webp","s":"Eine markante Betonstruktur in Form von zwei mythologischen Vögeln auf dem Kandawgyi-See, die als Veranstaltungsort dient.","f":["Wurde 1974 fertiggestellt.","Das Design basiert auf dem königlichen Lastkahn Pyigyimon."]},"myanmar-ngapali-beach-landmarks-v2":{"i":"/poi-images/myanmar-ngapali-beach-landmarks-v2.webp","s":"Myanmars bekanntester Strand, berühmt für seinen unberührten weißen Sand und das kristallklare Wasser des Golfs von Bengalen.","f":["Erstreckt sich über 7 Kilometer.","Der Name soll von italienischen Seeleuten stammen (Napoli)."]},"myanmar-kyauk-ka-lat-landmarks-v2":{"i":"/poi-images/myanmar-kyauk-ka-lat-landmarks-v2.webp","s":"Eine winzige, goldene Pagode, die spektakulär auf der Spitze einer schmalen, steil aufragenden Kalksteinfelsnadel erbaut wurde.","f":["Umgeben von einem künstlichen See.","Befindet sich in der Nähe von Hpa-An."]},"myanmar-saddan-cave-landmarks-v2":{"i":"/poi-images/myanmar-saddan-cave-landmarks-v2.webp","s":"Eine gewaltige Karsthöhle, die mit Buddha-Statuen gefüllt ist und deren Durchquerung zu einem versteckten See führt.","f":["Die Höhle ist fast 800 Meter lang.","Viele Teile sind unbeleuchtet und voller Fledermäuse."]},"myanmar-phaung-daw-oo-landmarks-v2":{"i":"/poi-images/myanmar-phaung-daw-oo-landmarks-v2.webp","s":"Das wichtigste Heiligtum am Inle-See, in dem sich fünf kleine Buddha-Statuen befinden, die bis zur Unkenntlichkeit mit Blattgold bedeckt sind.","f":["Nur Männer dürfen das Blattgold auftragen.","Einmal im Jahr werden die Statuen in einer Bootsprozession herumgefahren."]},"myanmar-maha-bandula-park-landmarks-v2":{"i":"/poi-images/myanmar-maha-bandula-park-landmarks-v2.webp","s":"Ein öffentlicher Park im Zentrum von Yangon, der von kolonialen Gebäuden umgeben ist und nach einem berühmten burmesischen General benannt wurde.","f":["Ursprünglich Fytche Square genannt.","Das Unabhängigkeitsdenkmal steht im Zentrum."]},"myanmar-independence-monument-landmarks-v2":{"i":"/poi-images/myanmar-independence-monument-landmarks-v2.webp","s":"Ein hoher, weißer Obelisk in Yangon, der an die Unabhängigkeit Myanmars von der britischen Herrschaft im Jahr 1948 erinnert.","f":["Ersetzte eine Statue von Königin Victoria.","Umgeben von fünf kleineren Säulen."]},"myanmar-kandawgyi-lake-landmarks-v2":{"i":"/poi-images/myanmar-kandawgyi-lake-landmarks-v2.webp","s":"Ein großer künstlicher See in Yangon, der zur britischen Kolonialzeit als Wasserreservoir angelegt wurde und heute ein Naherholungsgebiet ist.","f":["Bekannt als Royal Lake.","Wird vom Inya-See mit Wasser gespeist."]},"myanmar-kyaik-than-lan-landmarks-v2":{"i":"/poi-images/myanmar-kyaik-than-lan-landmarks-v2.webp","s":"Die höchste Pagode in Mawlamyine, die einen herrlichen Blick über die Stadt und den Fluss Thanlwin bietet.","f":["Soll Rudyard Kipling zu seinem Gedicht 'Mandalay' inspiriert haben.","Wurde im Jahr 875 erbaut."]},"myanmar-peik-chin-myaung-landmarks-v2":{"i":"/poi-images/myanmar-peik-chin-myaung-landmarks-v2.webp","s":"Eine tiefe Kalksteinhöhle in der Nähe von Pyin U Lwin, die zahlreiche Buddha-Statuen und Miniaturpagoden beherbergt.","f":["Auch bekannt als Maha-Nandamu-Höhle.","Ein unterirdischer Fluss fließt durch die Höhle."]},"myanmar-taung-kwe-pagoda-landmarks-v2":{"i":"/poi-images/myanmar-taung-kwe-pagoda-landmarks-v2.webp","s":"Das Wahrzeichen von Loikaw, bestehend aus mehreren goldenen Stupas, die auf schroffen Kalksteingipfeln verteilt sind.","f":["Der Name bedeutet 'Geteilter Berg'.","Die Gipfel sind durch kleine Brücken miteinander verbunden."]},"myanmar-dattawgyaik-waterfall-landmarks-v2":{"i":"/poi-images/myanmar-dattawgyaik-waterfall-landmarks-v2.webp","s":"Ein beeindruckender, mehrstufiger Wasserfall in der Nähe von Pyin U Lwin, der in ein kühles, klares Becken stürzt.","f":["Auch bekannt als Anisakan-Wasserfall.","Der Abstieg dauert etwa 45 Minuten."]},"kandawgyi-park-life-v2":{"i":"/poi-images/kandawgyi-park-life-v2.webp","s":"Ein malerischer Park um den Kandawgyi-See in Rangun, der einen friedlichen Rückzugsort mit üppigen Gärten und Blick auf die Shwedagon-Pagode bietet.","f":["Beliebter Ort für Spaziergänge bei Sonnenuntergang.","Beherbergt den beeindruckenden Karaweik-Palast auf dem See."]},"yangon-zoo-life-v2":{"i":"/poi-images/yangon-zoo-life-v2.webp","s":"Der älteste und zweitgrößte Zoo Myanmars, der eine Vielzahl von asiatischen und afrikanischen Tierarten beherbergt.","f":["Wurde 1906 während der britischen Kolonialzeit eröffnet.","Beherbergt seltene weiße Tiger und asiatische Elefanten."]},"kandawgyi-botanical-life-v2":{"i":"/poi-images/kandawgyi-botanical-life-v2.webp","s":"Ein weitläufiger botanischer Garten in der Bergstation Pyin Oo Lwin, bekannt für seine alpine Flora, Orchideen und Schmetterlinge.","f":["Wurde 1915 von einem britischen Botaniker gegründet.","Beherbergt über 480 Blumenarten und zahlreiche Baumarten."]},"aythaya-vineyard-life-v2":{"i":"/poi-images/aythaya-vineyard-life-v2.webp","s":"Das erste Weingut Myanmars, gelegen in den malerischen Shan-Bergen, das lokale Weinsorten in tropischem Klima produziert.","f":["Gegründet im Jahr 1999 von einem deutschen Unternehmer.","Befindet sich auf einer Höhe von über 1.200 Metern."]},"red-mountain-estate-life-v2":{"i":"/poi-images/red-mountain-estate-life-v2.webp","s":"Ein renommiertes Weingut in der Nähe des Inle-Sees, das französische Weinbautechniken nutzt, um Qualitätsweine in Asien herzustellen.","f":["Die Weinreben wurden aus Spanien und Frankreich importiert.","Beliebtes Ziel für Touristen, um den Sonnenuntergang zu beobachten."]},"peoples-square-park-life-v2":{"i":"/poi-images/peoples-square-park-life-v2.webp","s":"Ein großer öffentlicher Park in Rangun am Fuße der Shwedagon-Pagode, der grüne Rasenflächen und Springbrunnen bietet.","f":["Erstreckt sich über ein Gebiet von mehr als 130 Hektar.","Verfügt über ein Denkmal, das an die nationale Einheit erinnert."]},"shwesettaw-wildlife-life-v2":{"i":"/poi-images/shwesettaw-wildlife-life-v2.webp","s":"Ein Naturschutzgebiet in Zentralmyanmar, das eingerichtet wurde, um den vom Aussterben bedrohten burmesischen Sternschildkröten einen Lebensraum zu bieten.","f":["Schützt auch die endemische Eld-Hirsch-Population (Thamin).","Besteht hauptsächlich aus trockenen Laubwäldern."]},"meinmahla-kyun-life-v2":{"i":"/poi-images/meinmahla-kyun-life-v2.webp","s":"Ein geschütztes Mangrovengebiet im Irrawaddy-Delta, das eine entscheidende Rolle für das Ökosystem der Küste spielt und Krokodile schützt.","f":["Einer der letzten natürlichen Lebensräume des Leistenkrokodils in Myanmar.","Das Reservat ist auch ein wichtiger Nistplatz für Meeresschildkröten."]},"chatthin-wildlife-life-v2":{"i":"/poi-images/chatthin-wildlife-life-v2.webp","s":"Ein bedeutendes Schutzgebiet in der Sagaing-Region, das sich der Erhaltung des seltenen burmesischen Eld-Hirsches widmet.","f":["Wurde 1941 als eines der ältesten Reservate des Landes gegründet.","Die Landschaft ist von offenen Buschwäldern geprägt."]},"naypyidaw-zoo-life-v2":{"i":"/poi-images/naypyidaw-zoo-life-v2.webp","s":"Der größte Zoo Myanmars in der neuen Hauptstadt, der mit modernen Gehegen und einer Vielzahl exotischer Tiere gestaltet wurde.","f":["Eröffnete im Jahr 2008 nach der Verlegung der Hauptstadt.","Viele Tiere wurden aus dem alten Zoo in Rangun hierher gebracht."]},"naypyidaw-safari-life-v2":{"i":"/poi-images/naypyidaw-safari-life-v2.webp","s":"Ein weitläufiger Wildpark, in dem Besucher Tiere aus Asien, Afrika und Australien in einer naturnahen Umgebung von Buggys aus beobachten können.","f":["Der Park ist in drei verschiedene Kontinentalzonen unterteilt.","Besucher können afrikanische Löwen und Zebras hautnah erleben."]},"naypyidaw-water-fountain-life-v2":{"i":"/poi-images/naypyidaw-water-fountain-life-v2.webp","s":"Ein abendlicher Unterhaltungsort in der Hauptstadt, bekannt für seine musikalischen Wasserspiele und bunt beleuchteten Fontänen.","f":["Verfügt über einen großen See mit einer 90 Meter hohen Hauptfontäne.","Bietet abendliche Licht- und Musikshows an den Wochenenden."]},"national-herbal-park-life-v2":{"i":"/poi-images/national-herbal-park-life-v2.webp","s":"Ein weitläufiger Garten in Naypyidaw, der Tausende von Heilpflanzen aus verschiedenen Teilen Myanmars bewahrt und zur Schau stellt.","f":["Wurde angelegt, um das traditionelle burmesische Medizinwissen zu bewahren.","Beherbergt über 20.000 Pflanzen aus mehr als 700 Arten."]},"green-hill-valley-life-v2":{"i":"/poi-images/green-hill-valley-life-v2.webp","s":"Ein ethisches Elefantenschutzgebiet im Shan-Staat, das sich auf die Pflege von pensionierten Arbeitselefanten aus der Holzindustrie konzentriert.","f":["Besucher können Elefanten füttern und baden, anstatt auf ihnen zu reiten.","Das Camp führt auch aktive Wiederaufforstungsprogramme durch."]},"yadanabon-zoo-life-v2":{"i":"/poi-images/yadanabon-zoo-life-v2.webp","s":"Ein bekannter Zoo am Fuße des Mandalay Hills, der eine wichtige Rolle in der Zucht von endemischen birmanischen Tierarten spielt.","f":["Wurde 1989 eröffnet und ist Myanmars einziger Zoo für die vom Aussterben bedrohte burmesische Dachschildkröte.","Bietet spezielle Nacht-Safari-Touren an."]},"ayeyarwady-dolphin-area-life-v2":{"i":"/poi-images/ayeyarwady-dolphin-area-life-v2.webp","s":"Ein Flussabschnitt nördlich von Mandalay, der dem Schutz der seltenen Irrawaddy-Delfine dient, die für ihre Zusammenarbeit mit lokalen Fischern bekannt sind.","f":["Hier praktizieren Delfine und Menschen das seltene 'kooperative Fischen'.","Das Schutzgebiet erstreckt sich über rund 74 Kilometer des Flusses."]},"mandalay-moat-park-life-v2":{"i":"/poi-images/mandalay-moat-park-life-v2.webp","s":"Ein weitläufiger Erholungsbereich, der den breiten, wassergefüllten Graben des historischen Königspalastes von Mandalay umgibt.","f":["Der Wassergraben ist mehr als 60 Meter breit und fast 8 Kilometer lang.","Ein beliebter Ort für morgendliches Joggen und Tai-Chi."]},"pyin-oo-lwin-strawberries-life-v2":{"i":"/poi-images/pyin-oo-lwin-strawberries-life-v2.webp","s":"Landwirtschaftliche Terrassen in der gemäßigten Bergstation Pyin Oo Lwin, berühmt für den Anbau frischer Erdbeeren während der kühlen Jahreszeit.","f":["Das kühle Mikroklima der Region ist perfekt für Beerenfrüchte.","Besucher können während der Erntezeit ihre eigenen Erdbeeren pflücken."]},"bogyoke-park-life-v2":{"i":"/poi-images/bogyoke-park-life-v2.webp","s":"Ein ruhiger Stadtpark in Rangun, gelegen in der Nähe der Uferpromenade und des berühmten Bogyoke-Aung-San-Marktes.","f":["Benannt nach dem burmesischen Unabhängigkeitshelden General Aung San.","Bietet einen schattigen Rückzugsort vom geschäftigen Treiben der Innenstadt."]},"inle-lake-nature-v2":{"i":"/poi-images/inle-lake-nature-v2.webp","s":"Ein berühmter Süßwassersee im Shan-Staat, bekannt für seine schwimmenden Dörfer und Einbeinruderer.","f":["Fläche von etwa 116 km².","Heimat endemischer Fischarten."]},"irrawaddy-river-nature-v2":{"i":"/poi-images/irrawaddy-river-nature-v2.webp","s":"Der wichtigste und längste Fluss Myanmars, der als kommerzielle Wasserstraße und Lebensader des Landes dient.","f":["Längster Fluss Myanmars (2210 km).","Wichtige Wasserstraße."]},"chindwin-river-nature-v2":{"i":"/poi-images/chindwin-river-nature-v2.webp","s":"Der größte Nebenfluss des Irrawaddy, der durch malerische Täler und dichte Dschungel im Westen fließt.","f":["Größter Nebenfluss des Irrawaddy.","Entspringt im Kachin-Staat."]},"hkakabo-razi-nature-v2":{"i":"/poi-images/hkakabo-razi-nature-v2.webp","s":"Höchster Berg in Myanmar und ganz Südostasien, gelegen im nördlichen Kachin-Staat an der Grenze zu China.","f":["5881 Meter hoch.","Teil des Himalaya-Gebirges."]},"salween-river-nature-v2":{"i":"/poi-images/salween-river-nature-v2.webp","s":"Einer der längsten lake-nature-v2":{"i":"/poi-images/indawgyi-lake-nature-v2.webp","s":"Der größte Binnensee Myanmars und ein wichtiges Biosphärenreservat für Wasservögel.","f":["UNESCO-Biosphärenreservat seit 2017.","Etwa 24 km lang."]},"sittaung-river-nature-v2":{"i":"/poi-images/sittaung-river-nature-v2.webp","s":"Ein wichtiger Fluss in Zentral-Myanmar, bekannt für seine starke Gezeitenwelle nahe der Mündung.","f":["420 km lang.","Fließt in den Golf von Martaban."]},"moeyungyi-wetland-nature-v2":{"i":"/poi-images/moeyungyi-wetland-nature-v2.webp","s":"Ein künstlich angelegtes Feuchtgebiet in der Bago-Region, das zu einem wichtigen Rastplatz für Zugvögel wurde.","f":["1988 als Schutzgebiet ausgewiesen.","RAMSAR-Gebiet seit 2004."]},"lenya-national-park-nature-v2":{"i":"/poi-images/lenya-national-park-nature-v2.webp","s":"Ein geplanter Nationalpark im Süden Myanmars, der die tieflandigen tropischen Regenwälder der Tanintharyi-Region bewahrt.","f":["Reicht bis an die thailändische Grenze.","Heimat der seltenen Gurney-Pitta."]},"tanintharyi-nature-reserve-nature-v2":{"i":"/poi-images/tanintharyi-nature-reserve-nature-v2.webp","s":"Ein großes Schutzgebiet, das wichtige Biodiversitätskorridore zwischen Myanmar und Thailand schützt.","f":["1700 km² groß.","Finanziert teilweise durch Einnahmen aus Gaspipelines."]},"bago-yoma-nature-v2":{"i":"/poi-images/bago-yoma-nature-v2.webp","s":"Eine Bergkette, die die Becken der Flüsse Irrawaddy und Sittaung trennt, bekannt für ihre Teakholz-Wälder.","f":["Reicht bis auf 820 Meter Höhe.","Wichtige Quelle für hochwertiges Teakholz."]},"hukaung-valley-nature-v2":{"i":"/poi-images/hukaung-valley-nature-v2.webp","s":"Das größte Tigerreservat der Welt im abgelegenen Norden Myanmars, geprägt von dichten Dschungeln.","f":["17373 km² groß.","2001 als Schutzgebiet gegründet."]},"inya-lake-nature-v2":{"i":"/poi-images/inya-lake-nature-v2.webp","s":"Der größte künstliche See in Yangon, ein beliebtes Erholungsgebiet umgeben von Parks und Villen.","f":["1883 von den Briten angelegt.","Wichtige Wasserversorgung für Yangon."]},"shan-hills-relief-v2":{"i":"/poi-images/shan-hills-relief-v2.webp","s":"Ein ausgedehntes gebirgiges Hochland im Osten Myanmars, das für seine tiefen Schluchten und ethnische Vielfalt bekannt ist.","f":["Die durchschnittliche Höhe liegt bei etwa 1000 Metern.","Das Gebiet wird vom Saluen-Fluss durchschnitten."]},"arakan-mountains-relief-v2":{"i":"/poi-images/arakan-mountains-relief-v2.webp","s":"Ein bedeutender Gebirgszug im Westen Myanmars, der eine natürliche Barriere zwischen der Rakhine-Küste und dem zentralen Becken bildet.","f":["Der Gebirgszug gilt als Ausläufer des Himalaya.","Der höchste Punkt ist der 3053 Meter hohe Nat Ma Taung."]},"tenasserim-hills-relief-v2":{"i":"/poi-images/tenasserim-hills-relief-v2.webp","s":"Ein langer Gebirgszug, der das Rückgrat der Malaiischen Halbinsel bildet und entlang der Grenze zwischen Myanmar und Thailand verläuft.","f":["Das Gebirge ist mit dichten tropischen Regenwäldern bedeckt.","Es verfügt über reiche Zinn- und Wolframvorkommen."]},"patkai-range-relief-v2":{"i":"/poi-images/patkai-range-relief-v2.webp","s":"Ein markanter Gebirgszug an der Grenze zwischen Indien und Myanmar, gekennzeichnet durch steile Gipfel und tiefe Täler.","f":["Das Gebirge wird vom Pangsau-Pass durchquert.","Es ist die Heimat verschiedener Naga-Stämme."]},"kachin-hills-relief-v2":{"i":"/poi-images/kachin-hills-relief-v2.webp","s":"Eine zerklüftete Bergregion im Norden Myanmars, die eine komplexe Landschaft aus stark bewaldeten Kämmen und Schluchten bildet.","f":["Hier entspringen mehrere Nebenflüsse des Irrawaddy.","Die Region ist für ihre außergewöhnliche Artenvielfalt bekannt."]},"kumon-bum-mountains-relief-v2":{"i":"/poi-images/kumon-bum-mountains-relief-v2.webp","s":"Eine nördliche Ausdehnung des Gebirgssystems im Kachin-Staat, die einige der unzugänglichsten Gipfel Südostasiens beherbergt.","f":["Im südlichen Teil befindet sich die Region des Indawgyi-Sees.","Dichter tropischer D const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
