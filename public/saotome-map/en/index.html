const POI_CARD={"belem-cities-v2":{"i":"/poi-images/belem-cities-v2.webp","s":"Belém is a peaceful town in the green expanses of Mé-Zóchi where life proceeds in harmonious accord with nature.","f":["Known for its excellent tropical fruit juices and jams.","An important starting point for botanical expeditions into the highlands."]},"porto-alegre-cities-v2":{"i":"/poi-images/porto-alegre-cities-v2.webp","s":"Porto Alegre is the southern gateway to paradise, where time stands still on the white beaches of Ilhéu das Rolas.","f":["Main port for transport to the Equator island Ilhéu das Rolas.","Known for its pristine beaches like Praia Piscina."]},"ponta-do-sol-cities-v2":{"i":"/poi-images/ponta-do-sol-cities-v2.webp","s":"Ponta do Sol is the northwesternmost point of Príncipe where the sun transforms the Atlantic into a golden sea before sinking below the horizon.","f":["Northernmost point of Príncipe Island.","Famous for its spectacular sunsets over the ocean."]},"sao-tome-cities-v2":{"i":"/poi-images/sao-tome-cities-v2.webp","s":"São Tomé is the vibrant capital of the island nation and a place where colonial architecture meets tropical lifestyle.","f":["The city was founded in 1485 by the Portuguese.","Houses the historic São Sebastião fortress on the waterfront."]},"pantufo-cities-v2":{"i":"/poi-images/pantufo-cities-v2.webp","s":"Pantufo is a traditional fishing village on the outskirts of the capital, where time seems to pass more slowly.","f":["Known for its excellent seafood restaurants along the beach.","A major supplier for the fish market of São Tomé."]},"cruzeiro-cities-v2":{"i":"/poi-images/cruzeiro-cities-v2.webp","s":"Cruzeiro is nestled in the green hills behind the capital, offering a wide view over the Atlantic.","f":["Houses important educational institutions of the region.","Considered one of the preferred residential neighborhoods of the capital."]},"bobo-forro-cities-v2":{"i":"/poi-images/bobo-forro-cities-v2.webp","s":"Bobo Forro is the vibrant, popular heart on the outskirts of the capital, where the Forros culture is most alive.","f":["A center for traditional dances and music festivals.","Known for its lively markets and craft workshops."]},"praia-melao-cities-v2":{"i":"/poi-images/praia-melao-cities-v2.webp","s":"Praia Melão stretches along the southern coast of Água Grande, where the sea spray wets the tall palms.","f":["Houses one of the most important breweries in the country.","A popular spot for weekend trips from the capital."]},"quinta-da-favorita-cities-v2":{"i":"/poi-images/quinta-da-favorita-cities-v2.webp","s":"Quinta da Favorita is a green oasis of tranquility in the north of the capital, where the colonial past lives on in the magnificent gardens.","f":["Once a significant plantation for exotic fruits.","Known for its architecturally valuable colonial buildings."]},"santana-cities-v2":{"i":"/poi-images/santana-cities-v2.webp","s":"Santana, the capital of Cantagalo district, nestles into a bay overlooking the mysterious Santana Island.","f":["Capital of the Cantagalo district on the east coast.","Provides the best starting point for trips to Ilhéu de Santana."]},"ribeira-afonso-cities-v2":{"i":"/poi-images/ribeira-afonso-cities-v2.webp","s":"Ribeira Afonso is a place of rugged coastal beauty where the river of the same name flows powerfully into the Atlantic.","f":["Known for its impressive river estuary landscapes.","A historically important location for the transport of cocoa."]},"uba-budo-cities-v2":{"i":"/poi-images/uba-budo-cities-v2.webp","s":"Uba Budo lies deep in the hinterland of Cantagalo, surrounded by a sea of emerald jungle.","f":["A significant center for the cultivation of high-quality black pepper.","Houses a historic Roça (plantation) with well-preserved buildings."]},"sao-joao-dos-angolares-cities-v2":{"i":"/poi-images/sao-joao-dos-angolares-cities-v2.webp","s":"São João dos Angolares is the cradle of a proud culture that has its roots in a shipwreck centuries ago.","f":["Home to the Angolares ethnic group, descendants of shipwrecked slaves.","Known for Roça São João, a renowned center for art and gastronomy."]},"dona-augusta-cities-v2":{"i":"/poi-images/dona-augusta-cities-v2.webp","s":"Dona Augusta lies hidden on the wild southeast coast where the Obô forest meets the untamed Atlantic.","f":["Nearby are impressive basalt formations along the coast.","An important nesting site for rare tropical birds."]},"ribeira-peixe-cities-v2":{"i":"/poi-images/ribeira-peixe-cities-v2.webp","s":"Ribeira Peixe is a lively community in the deep south that has developed around one of the country's busiest oil palm plantations.","f":["Center of palm oil production in southern São Tomé.","Features a modern factory facility for processing palm fruits."]},"neves-cities-v2":{"i":"/poi-images/neves-cities-v2.webp","s":"Neves, the industrial powerhouse of the west, is a port city where the echo of history resonates loudly.","f":["Most important industrial location in the country with a major brewery.","Capital of the Lembá district on the northwest coast."]},"santa-catarina-cities-v2":{"i":"/poi-images/santa-catarina-cities-v2.webp","s":"Santa Catarina marks the end of the paved road on the west coast, where civilization shakes hands with the majestic Obô forest.","f":["Last town accessible via a paved road in the west.","Provides access to one of the island's most remote waterfalls."]},"diogo-vaz-cities-v2":{"i":"/poi-images/diogo-vaz-cities-v2.webp","s":"Diogo Vaz is a place that dreams of chocolate, for here one of the best cocoas in the world is processed with care and love.","f":["Namesake for a world-renowned gourmet chocolate brand.","Houses one of the country's most modern cocoa processing facilities."]},"henrique-cities-v2":{"i":"/poi-images/henrique-cities-v2.webp","s":"Henrique is situated high on the slopes of the Lembá district, where the view stretches across emerald forests to the sparkling Atlantic.","f":["An important center for the cultivation of genuine Bourbon vanilla.","Offers hiking trails to some of the highest points in the west."]},"ponta-figo-cities-v2":{"i":"/poi-images/ponta-figo-cities-v2.webp","s":"Ponta Figo is a place of encounter between sea and land where the cliffs watch over the west like stone guardians.","f":["Strategic point for whale watching during the season.","Features one of the oldest primary schools in the Lembá district."]},"generosa-cities-v2":{"i":"/poi-images/generosa-cities-v2.webp","s":"Generosa rightly bears its name, for the earth here is so bountiful that the orchards bear fruit almost all year round.","f":["A significant producer of organic bananas for the local market.","Known for its traditional medicinal herb gardens."]},"guadalupe-cities-v2":{"i":"/poi-images/guadalupe-cities-v2.webp","s":"Guadalupe, the proud capital of Lobata district, is a place of history and faith whose heart is the striking church on the square.","f":["Capital of the Lobata district in the north of the island.","Houses an important center for agricultural research."]},"santo-amaro-cities-v2":{"i":"/poi-images/santo-amaro-cities-v2.webp","s":"Santo Amaro is a bustling town along the main road to the north where trade and crafts flourish.","f":["A strategic transport hub in the Lobata district.","Known for its skilled carpenters and furniture makers."]},"conde-cities-v2":{"i":"/poi-images/conde-cities-v2.webp","s":"Conde is nestled in the gentle hills of Lobata where the soil is particularly rich in minerals, giving strength to the plants.","f":["An important growing area for root vegetables and tubers.","Known for its traditional pottery made from local clay."]},"micolo-cities-v2":{"i":"/poi-images/micolo-cities-v2.webp","s":"Micolo is a picturesque coastal town in the north where the sand is so fine that it sings underfoot.","f":["Famous for its beautiful, often deserted beaches.","An important ecosystem for the protection of coastal birds."]},"fernao-dias-cities-v2":{"i":"/poi-images/fernao-dias-cities-v2.webp","s":"Fernão Dias bears the name of an explorer and preserves to this day the spirit of adventure on the north coast.","f":["Historical shipping port for cocoa beans in the 19th century.","Offers some of the best spots for watching sunsets."]},"agostinho-neto-cities-v2":{"i":"/poi-images/agostinho-neto-cities-v2.webp","s":"Agostinho Neto, formerly known as Rio do Ouro, is a monumental testament to plantation culture that feels like its own city in the jungle.","f":["Largest historic Roça (plantation) in the country.","Houses an impressive hospital building in neoclassical style."]},"boa-entrada-cities-v2":{"i":"/poi-images/boa-entrada-cities-v2.webp","s":"Boa Entrada lives up to its name, welcoming visitors with an avenue of giant trees that seem to touch the sky.","f":["Known for the 'Jequitibá', one of the largest and oldest trees on the island.","Houses a significant Roça with a strong cultural identity."]},"canavial-cities-v2":{"i":"/poi-images/canavial-cities-v2.webp","s":"Canavial is a place of contrasts where the flat fields of the coastal strip meet the first elevations of the north.","f":["An important area for raising traditional cattle breeds.","Known for the production of local sugar cane spirit (Grogue)."]},"blublu-cities-v2":{"i":"/poi-images/blublu-cities-v2.webp","s":"Blublu is a lively suburb of Guadalupe where the waters of the Lobata River gave the town its name and rhythm.","f":["Known for its fertile alluvial soils along the Lobata River.","An important supply center for fresh vegetables in the region."]},"trindade-cities-v2":{"i":"/poi-images/trindade-cities-v2.webp","s":"Trindade, the capital of Mé-Zóchi, sits proudly in the fertile midlands of the island where the air is cooler and the soil is deep black.","f":["Second largest city on the island of São Tomé.","Historically known for the 'Batepá Massacre' in 1953."]},"madalena-cities-v2":{"i":"/poi-images/madalena-cities-v2.webp","s":"Madalena is a quiet suburb of Trindade where the gardens bloom so lushly they look like small jungles.","f":["Known for growing high-quality spices like cloves and cinnamon.","An important place for preserving traditional Santomean recipes."]},"bombom-cities-v2":{"i":"/poi-images/bombom-cities-v2.webp","s":"Bombom is a place of bustling activity on the outskirts of the capital where urban life and rural tranquility are balanced.","f":["An important center for local transportation.","Known for its diverse handcrafted products."]},"almas-cities-v2":{"i":"/poi-images/almas-cities-v2.webp","s":"Almas sits on the gentle plateaus of Mé-Zóchi where the souls of ancestors seem to whisper in the ancient coffee trees.","f":["One of the oldest coffee-growing areas on the island.","Known for its architecturally unique stone houses."]},"caixao-grande-cities-v2":{"i":"/poi-images/caixao-grande-cities-v2.webp","s":"Caixão Grande is a bustling town shaped by its location at an important transport hub in the midlands.","f":["An important hub for trade between north and south.","Known for its lively music scene and local dance groups."]},"santa-margarida-cities-v2":{"i":"/poi-images/santa-margarida-cities-v2.webp","s":"Santa Margarida lies hidden in the green labyrinth of Mé-Zóchi, a place where the forest silence is only interrupted by the distant sound of waterfalls.","f":["Nearby is one of the highest waterfalls in the midlands.","An important center for the study of traditional Santomean medicinal plants."]},"milagrosa-cities-v2":{"i":"/poi-images/milagrosa-cities-v2.webp","s":"Milagrosa bears its name as a tribute to the miracle of nature which has blessed this place with incredible fertility.","f":["A significant producer of aromatic black pepper.","Known for its religious processions and festivals."]},"batepa-cities-v2":{"i":"/poi-images/batepa-cities-v2.webp","s":"Batepá is a place of painful historical significance where the memory of the 1953 massacre deeply shapes the identity of its people.","f":["Central setting for the tragic events of 1953.","Houses an important memorial for the heroes of independence."]},"monte-cafe-cities-v2":{"i":"/poi-images/monte-cafe-cities-v2.webp","s":"Monte Café sits majestically in the cloud mountains of Mé-Zóchi, a historic center of coffee production that has preserved the charm of a bygone era.","f":["Founded in 1858, it is one of the oldest and most significant plantations.","Houses the Coffee Museum, documenting the history of cultivation."]},"santo-antonio-cities-v2":{"i":"/poi-images/santo-antonio-cities-v2.webp","s":"Santo António, the charming capital of Príncipe Island, is a town gently nestled on the banks of the Palhota River.","f":["Capital of the autonomous region of Príncipe and one of the smallest capitals in the world.","Known for its well-preserved Portuguese colonial architecture."]},"terreiro-velho-cities-v2":{"i":"/poi-images/terreiro-velho-cities-v2.webp","s":"Terreiro Velho is where chocolate dreams come true, high up on the hills of Príncipe overlooking the vast ocean.","f":["Home to the world-famous cocoa plantations of Claudio Corallo.","Offers some of the most spectacular panoramic views of the southern tip of Príncipe."]},"sundy-cities-v2":{"i":"/poi-images/sundy-cities-v2.webp","s":"Sundy is a place of science and stars nestled in the gentle plains of northern Príncipe.","f":["Site of Sir Arthur Eddington's famous solar eclipse expedition (1919).","Houses a luxury eco-resort in a historic manor house."]},"belo-monte-cities-v2":{"i":"/poi-images/belo-monte-cities-v2.webp","s":"Belo Monte perches on a headland in northeastern Príncipe, offering arguably the most breathtaking view of the entire archipelago.","f":["Features one of the world's most beautiful viewpoints over Banana Beach.","Houses a renowned hotel and a conservation center."]},"paciencia-cities-v2":{"i":"/poi-images/paciencia-cities-v2.webp","s":"Paciência lies on the edge of Príncipe's rainforests, a place where the name says it all and nature's tranquility heals the soul.","f":["An important center for harvesting wild pepper and cloves.","Known for its community of traditional healers."]},"nova-estrela-cities-v2":{"i":"/poi-images/nova-estrela-cities-v2.webp","s":"Nova Estrela sits like a sparkling jewel on the cliffs of Príncipe's east coast, a place of new hope and wide horizons.","f":["One of the best spots on Príncipe for stargazing.","Known for its modern fishing cooperative."]},"picao-cities-v2":{"i":"/poi-images/picao-cities-v2.webp","s":"Picão is a place of colors and dense green hidden in the mountainous hinterland of Príncipe.","f":["An important center for growing organic Cinchona (quinine bark).","Known for its diverse population of endemic parrots."]},"sao-joaquim-cities-v2":{"i":"/poi-images/sao-joaquim-cities-v2.webp","s":"São Joaquim is a historic hamlet in the heart of Príncipe where ruins of an old Roça tell of the power of time.","f":["Houses some of the best-preserved hydraulic systems of an old plantation.","An important site for researching local flora."]},"esperanca-cities-v2":{"i":"/poi-images/esperanca-cities-v2.webp","s":"Esperança bears the name of hope and is a shining example of the joy of life in the interior of Príncipe.","f":["A significant producer of exotic fruits like papaya and mango.","Known for its dedicated youth projects in environmental protection."]},"abade-cities-v2":{"i":"/poi-images/abade-cities-v2.webp","s":"Abade is a fishing village on the northeast coast of Príncipe where the Atlantic rolls ashore with a rare gentleness.","f":["One of the most important suppliers of fresh fish to Santo António.","Known for its calm and sheltered bays for swimming."]},"maria-correia-cities-v2":{"i":"/poi-images/maria-correia-cities-v2.webp","s":"Maria Correia lies on the rugged west coast of Príncipe where the ocean's power has shaped the cliffs over millennia.","f":["Provides access to some of the island's most dramatic rocky coasts.","Known for its stories of historic female settlers."]},"pantufo-sao-tome-cities-v2":{"i":"/poi-images/pantufo-sao-tome-cities-v2.webp","s":"This part of Pantufo is the modern extension of the historic fishing village where the capital's urban growth is noticeable.","f":["An up-and-coming residential area with many new construction projects.","Known for its lively seaside gastronomy scene."]},"henrique-lemba-cities-v2":{"i":"/poi-images/henrique-lemba-cities-v2.webp","s":"This settlement in the Lembá highlands is characterized by mountain wildness and the hard work of farmers wresting fertile fields from the slopes.","f":["An important reservoir for traditional healing knowledge.","Known for its high-quality small-scale coffee plantations."]},"blublu-lobata-cities-v2":{"i":"/poi-images/blublu-lobata-cities-v2.webp","s":"This higher-lying part of Blublu offers a wide view across the fertile plains of Lobata to the sparkling sea.","f":["A preferred residential area for Lobata's growing middle class.","Known for its architecturally interesting modern private houses."]},"bombom-me-zochi-cities-v2":{"i":"/poi-images/bombom-me-zochi-cities-v2.webp","s":"Bombom in the Mé-Zóchi district is a place of fertile hills and warm encounters.","f":["A significant producer of aromatic cocoa beans.","Known for its lively community and local festivals."]},"belo-monte-principe-cities-v2":{"i":"/poi-images/belo-monte-principe-cities-v2.webp","s":"This part of Belo Monte leads deeper into the untamed interior of Príncipe where the forest giants darken the sky.","f":["An important protected area for endemic plant species.","Known for its spectacular bird watching opportunities."]},"sandy-principe-cities-v2":{"i":"/poi-images/sandy-principe-cities-v2.webp","s":"The coastal part of Sundy is a place of wide beaches and deep blue sea where the Atlantic reveals its full beauty.","f":["Famous for its pristine coral reefs near the coast.","An important nesting ground for sea turtles during the season."]},"paciencia-principe-interior-cities-v2":{"i":"/poi-images/paciencia-principe-interior-cities-v2.webp","s":"The upper village of Paciência lies at the foot of Príncipe's steep mountains, a place of cool mornings and deep silence.","f":["An important center for preserving local legends and myths.","Known for its traditional ceremonies honoring the earth."]},"ponta-do-sol-principe-north-cities-v2":{"i":"/poi-images/ponta-do-sol-principe-north-cities-v2.webp","s":"The northern part of Ponta do Sol is a place of wide views and untamed sea air where the horizon seems boundless.","f":["Features one of the most distinctive coastlines in the entire region.","An important point for monitoring fishing grounds in the north."]},"nova-estrela-principe-east-cities-v2":{"i":"/poi-images/nova-estrela-principe-east-cities-v2.webp","s":"Nova Estrela in the east of Príncipe is a place of light and maritime vitality where the day begins with the sparkling of the waves.","f":["A significant center for traditional artisanal fishing.","Known for its colorful maritime processions."]},"picao-principe-hills-cities-v2":{"i":"/poi-images/picao-principe-hills-cities-v2.webp","s":"The Picão hills are an oasis of green where clouds often gently brush the canopy of the forest giants.","f":["An important growing area for rare allspice and cinnamon.","Known for its cool and refreshing mountain air."]},"sao-joaquim-principe-forest-cities-v2":{"i":"/poi-images/sao-joaquim-principe-forest-cities-v2.webp","s":"The forest edge of São Joaquim is a place of transition where civilization shakes hands with the dense Obô jungle.","f":["An important research area for local ethnobotany.","Known for its traditional forest beekeeping guilds."]},"esperanca-principe-valley-cities-v2":{"i":"/poi-images/esperanca-principe-valley-cities-v2.webp","s":"The Esperança valley is an oasis of tranquility and fertility where life proceeds at a leisurely pace.","f":["A significant producer of traditional Santomean root vegetables.","Known for its quiet and peaceful lifestyle."]},"abade-principe-north-cities-v2":{"i":"/poi-images/abade-principe-north-cities-v2.webp","s":"The northern part of Abade is a place of wide horizons and maritime freedom where the gaze wanders boundlessly over the Atlantic.","f":["An important base for coastal surveillance in the northeast.","Known for its robust fishing boats and experienced navigators."]},"maria-correia-principe-west-cities-v2":{"i":"/poi-images/maria-correia-principe-west-cities-v2.webp","s":"Maria Correia in the west of Príncipe is a place of wildness and untamed sea air where the Atlantic reveals its full primal force.","f":["An important protected area for marine biodiversity in the west.","Known for its dramatic rock formations and caves."]},"pantufo-agua-grande-coast-cities-v2":{"i":"/poi-images/pantufo-agua-grande-coast-cities-v2.webp","s":"The Pantufo coast is the heart of Água Grande's maritime identity where the day's catch is celebrated directly on the shore.","f":["A significant site for traditional fishing boat repair.","Known for its excellent grilled fish markets in the evening."]},"henrique-lemba-plateau-cities-v2":{"i":"/poi-images/henrique-lemba-plateau-cities-v2.webp","s":"The Henrique plateau offers a sublime view over the west of São Tomé, a place of cool air and wide vistas.","f":["An important site for preserving endangered mountain plants.","Known for its high-quality organic pepper plantations."]},"blublu-lobata-river-cities-v2":{"i":"/poi-images/blublu-lobata-river-cities-v2.webp","s":"On the riverbank of Blublu, life pulses to the rhythm of flowing water—a place of vitality and natural community.","f":["A significant center for growing fresh regional vegetables.","Known for its traditional water festivals on the riverbank."]},"bombom-me-zochi-plateau-cities-v2":{"i":"/poi-images/bombom-me-zochi-plateau-cities-v2.webp","s":"The Bombom plateau in Mé-Zóchi is a place of wide views and fertile hills where life proceeds at a steady pace.","f":["A significant producer of high-quality organic coffee.","Known for its architecturally interesting traditional houses."]},"belo-monte-principe-coast-cities-v2":{"i":"/poi-images/belo-monte-principe-coast-cities-v2.webp","s":"The coastal part of Belo Monte is a place of dramatic cliffs and azure sea where the Atlantic reveals its full primal force.","f":["Features some of the most spectacular natural arches and caves on the coast.","An important nesting ground for rare seabirds in the northeast."]},"sandy-principe-north-cities-v2":{"i":"/poi-images/sandy-principe-north-cities-v2.webp","s":"The northern part of Sundy is a place of wide plains and scientific curiosity where the horizon seems boundless.","f":["An important site for modern astronomical observations.","Known for its dedicated educational initiatives in natural sciences."]},"paciencia-principe-coast-cities-v2":{"i":"/poi-images/paciencia-principe-coast-cities-v2.webp","s":"The coastal part of Paciência is a place of gentle bays and rhythmic sea sounds where time seems to stand still on the golden beaches.","f":["Famous for its protected lagoons ideal for juvenile fish.","An important nesting ground for endangered waterbirds on the northeast coast."]},"schokoladenmanufaktur-corallo-economic-v2":{"i":"/poi-images/schokoladenmanufaktur-corallo-economic-v2.webp","s":"This world-famous factory in the capital São Tomé processes the finest cocoa from Príncipe Island into award-winning chocolate creations.","f":["Uses cocoa from its own plantation on Príncipe.","Known for chocolate with extremely high cocoa content."]},"brauerei-rosema-economic-v2":{"i":"/poi-images/brauerei-rosema-economic-v2.webp","s":"The Rosema Brewery in Neves is the most important beverage production facility on São Tomé and a symbol of national industry.","f":["Largest brewery in São Tomé and Príncipe.","The beer is traditionally sold in brown bottles without labels."]},"wasserkraftwerk-contador-economic-v2":{"i":"/poi-images/wasserkraftwerk-contador-economic-v2.webp","s":"The Contador Hydroelectric Plant harnesses the natural energy of the river of the same name to cover a significant portion of São Tomé Island's electricity needs.","f":["Most important source of clean electricity on the main island.","Uses a system of channels and penstocks in the mountains."]},"oelmuehle-ribeira-peixe-economic-v2":{"i":"/poi-images/oelmuehle-ribeira-peixe-economic-v2.webp","s":"In the heart of the vast oil palm plantations of Ribeira Peixe lies this modern oil mill that extracts crude oil from the fruits of the oil palm.","f":["Center of the country's modernized palm oil industry.","Processes tons of fresh palm fruit daily."]},"fischereihafen-pantufo-economic-v2":{"i":"/poi-images/fischereihafen-pantufo-economic-v2.webp","s":"The Pantufo fishing port is one of the most active seafood transshipment points near the capital.","f":["Known for catching large yellowfin tuna.","Center of traditional fish trade on the coast."]},"hafen-neves-economic-v2":{"i":"/poi-images/hafen-neves-economic-v2.webp","s":"The industrial port of Neves in the northwest of the island specializes in the handling of fuels and industrial goods.","f":["The only port with specialized oil and gas tanks.","Major point for receiving international tankers."]},"solarpark-sao-tome-economic-v2":{"i":"/poi-images/solarpark-sao-tome-economic-v2.webp","s":"The São Tomé Solar Park is the country's first major project to harness intense tropical solar radiation for electricity generation.","f":["First large-scale photovoltaic project in the country.","Contributes to reducing the archipelago's CO2 emissions."]},"kakaofabrik-cecab-economic-v2":{"i":"/poi-images/kakaofabrik-cecab-economic-v2.webp","s":"The CECAB factory is the heart of cooperative cocoa processing in São Tomé.","f":["Processes cocoa from over 2,000 certified smallholders.","Specializes in high-quality organic cocoa for gourmet markets."]},"mineralwasserwerk-bago-bago-economic-v2":{"i":"/poi-images/mineralwasserwerk-bago-bago-economic-v2.webp","s":"In the cool highlands of Mé-Zóchi, the Bago-Bago mineral water plant uses pure mountain springs to bottle high-quality drinking water.","f":["Uses water from pristine mountain springs in the national park.","Market leader for bottled drinking water on São Tomé."]},"fischereihafen-santana-economic-v2":{"i":"/poi-images/fischereihafen-santana-economic-v2.webp","s":"The Santana fishing port is the maritime hub of the Cantagalo district.","f":["Main landing point for fish on the east of the island.","Center of artisanal fishing in Cantagalo."]},"anlegestelle-porto-alegre-economic-v2":{"i":"/poi-images/anlegestelle-porto-alegre-economic-v2.webp","s":"The Porto Alegre jetty in the deep south is the most important logistical point for supplying Ilhéu das Rolas.","f":["Central departure point to the Equator island Ilhéu das Rolas.","Important transshipment point for southern agricultural products."]},"hafen-santo-antonio-economic-v2":{"i":"/poi-images/hafen-santo-antonio-economic-v2.webp","s":"The logistics port of Santo António is Príncipe Island's only maritime link to the outside world.","f":["Main gateway for all goods entering Príncipe Island.","Features specialized storage areas for containers and fuel."]},"kakaolagerhaus-hafen-economic-v2":{"i":"/poi-images/kakaolagerhaus-hafen-economic-v2.webp","s":"The cocoa warehouse at the main port of São Tomé is the final stop for beans before they head to the world market.","f":["Central collection point for cocoa-based exports.","Monitors the quality and weight of export shipments."]},"werft-sao-tome-economic-v2":{"i":"/poi-images/werft-sao-tome-economic-v2.webp","s":"The São Tomé shipyard is the central facility for the maintenance and repair of the national fleet.","f":["Most important center for maritime engineering in the country.","Ensures the operational capability of the island fleet."]},"steinbruch-morro-peixe-economic-v2":{"i":"/poi-images/steinbruch-morro-peixe-economic-v2.webp","s":"The Morro Peixe quarry is one of the most important sources of construction materials in northern São Tomé.","f":["Main supplier of basalt and phonolite rock.","Secures raw materials for national road construction projects."]},"baustoffwerk-neves-economic-v2":{"i":"/poi-images/baustoffwerk-neves-economic-v2.webp","s":"The construction materials plant in Neves specializes in manufacturing cement blocks, prefabricated parts, and other vital building materials.","f":["Center of cement processing in the northwest.","Produces standardized structural elements for building construction."]},"waermekraftwerk-sao-tome-economic-v2":{"i":"/poi-images/waermekraftwerk-sao-tome-economic-v2.webp","s":"The São Tomé thermal power plant is the primary energy source for the capital and surrounding areas.","f":["Main guarantor of grid stability in the capital.","Uses imported fossil fuels for energy generation."]},"fischverarbeitungszentrum-neves-economic-v2":{"i":"/poi-images/fischverarbeitungszentrum-neves-economic-v2.webp","s":"The Neves fish processing center specializes in refining and preserving catches from the west coast.","f":["Specializes in the production of dried fish and fillets.","Has the largest cold storage capacities in the northwest."]},"exportterminal-flughafen-economic-v2":{"i":"/poi-images/exportterminal-flughafen-economic-v2.webp","s":"The air export terminal at São Tomé International Airport specializes in the rapid shipment of perishable goods and high-quality products.","f":["Main hub for the country's time-critical exports.","Specialized handling of organic products and fresh fish."]},"forte-de-sao-sebastiao-history-v2":{"i":"/poi-images/forte-de-sao-sebastiao-history-v2.webp","s":"Built in 1575, the Fort of São Sebastião was the island's first stone defense structure, protecting the harbor from pirates and rival colonial powers.","f":["Built in 1575 for harbor defense","Now houses the National Museum"]},"catedral-de-sao-tome-history-v2":{"i":"/poi-images/catedral-de-sao-tome-history-v2.webp","s":"Founded in the 16th century, the cathedral is the seat of the Diocese of São Tomé.","f":["One of the oldest dioceses in sub-Saharan Africa","Combines Baroque and Neoclassical elements"]},"roca-agua-ize-history-v2":{"i":"/poi-images/roca-agua-ize-history-v2.webp","s":"Água Izé was once one of the most productive cocoa plantations on the island, resembling a small autonomous town.","f":["Former cocoa production center","Famous ruins of a large hospital"]},"roca-porto-real-history-v2":{"i":"/poi-images/roca-porto-real-history-v2.webp","s":"Located on Príncipe Island, Porto Real was one of the most powerful plantations in the archipelago.","f":["Largest plantation on Príncipe Island","Known for its imposing architecture"]},"roca-infante-d-henrique-history-v2":{"i":"/poi-images/roca-infante-d-henrique-history-v2.webp","s":"This plantation on Príncipe, named after the famous Portuguese prince, stands out for its well-preserved administrative buildings.","f":["Named after Infante Dom Henrique","Outstanding colonial architecture"]},"padrao-dos-descobrimentos-history-v2":{"i":"/poi-images/padrao-dos-descobrimentos-history-v2.webp","s":"Located near the coast of São Tomé, this monument marks the spot where the first Portuguese navigators landed in the 15th century.","f":["Commemorates the landing in 1470/1471","Statues of Santarém and Escobar"]},"roca-plancad-history-v2":{"i":"/poi-images/roca-plancad-history-v2.webp","s":"Roça Plancad is located in the cooler highlands of the Mé-Zóchi district and specialized in the cultivation of high-quality coffee and cocoa.","f":["High-altitude plantation in Mé-Zóchi","Specialized in coffee and cocoa"]},"roca-bemposta-history-v2":{"i":"/poi-images/roca-bemposta-history-v2.webp","s":"Roça Bemposta was a significant plantation in the central highlands of São Tomé.","f":["Center of the central highlands","Well-preserved administrative buildings"]},"forte-de-santo-antonio-da-ponta-da-mina-his st isolated plantations.","f":["Isolated location in the south","Caué district, near the wilderness"]},"roca-vista-alegre-history-v2":{"i":"/poi-images/roca-vista-alegre-history-v2.webp","s":"Known for its aesthetic layout and wide views over the Atlantic, Vista Alegre was a showcase of colonial agriculture.","f":["Panoramic view of the ocean","Aesthetically designed estate"]},"roca-santa-cecilia-history-v2":{"i":"/poi-images/roca-santa-cecilia-history-v2.webp","s":"Located in the fertile hinterland of Mé-Zóchi, Santa Cecília specialized in cultivating various tropical fruits alongside the ubiquitous cocoa.","f":["Diversified agriculture","Located in fertile hinterland"]},"roca-ribeira-palma-history-v2":{"i":"/poi-images/roca-ribeira-palma-history-v2.webp","s":"Located on the wild north coast in the Lembá district, Ribeira Palma was an outpost of the cocoa-based economy.","f":["Located in the Lembá district","Harsh conditions on the north coast"]},"roca-morro-peixe-history-v2":{"i":"/poi-images/roca-morro-peixe-history-v2.webp","s":"Morro Peixe is today better known as a fishing village and turtle sanctuary, but was originally a functioning roça.","f":["Connection between sea and land","Located in the Lobata district"]},"palacio-presidencial-st-landmarks-v2":{"i":"/poi-images/palacio-presidencial-st-landmarks-v2.webp","s":"The Presidential Palace is an elegant colonial-era building in the heart of the capital, serving as the official residence of the head of state.","f":["Former seat of the Portuguese governor.","Striking pink architecture in neoclassical style."]},"mercado-municipal-st-landmarks-v2":{"i":"/poi-images/mercado-municipal-st-landmarks-v2.webp","s":"The Municipal Market is the vibrant heart of trade in the capital, where the colors and scents of the archipelago meet.","f":["Center of daily life for locals.","Known for its variety of tropical fruits."]},"estadio-nacional-st-landmarks-v2":{"i":"/poi-images/estadio-nacional-st-landmarks-v2.webp","s":"The N e 1919 measurements.","Important destination for scientific tourists."]},"igreja-nossa-senhora-rosario-principe-landmarks-v2":{"i":"/poi-images/igreja-nossa-senhora-rosario-principe-landmarks-v2.webp","s":"The Church of Our Lady of the Rosary is the religious landmark of Santo António on Príncipe.","f":["Most important church building on Príncipe.","Center of local religious celebrations."]},"tribunal-supremo-justica-st-landmarks-v2":{"i":"/poi-images/tribunal-supremo-justica-st-landmarks-v2.webp","s":"The Supreme Court of Justice is the highest judicial authority in the country, housed in an architecturally significant building.","f":["Guardian of the Constitution.","Center of judicial power."]},"farol-lagoa-azul-landmarks-v2":{"i":"/poi-images/farol-lagoa-azul-landmarks-v2.webp","s":"The Lagoa Azul Lighthouse perches on a hill above the famous blue lagoon, guiding sailors on the north coast.","f":["Important navigation point for shipping.","One of the best viewpoints on the island."]},"farol-ponta-mina-landmarks-v2":{"i":"/poi-images/farol-ponta-mina-landmarks-v2.webp","s":"The Ponta da Mina Lighthouse is located at the eastern tip of the Santo António Bay on Príncipe.","f":["Located in the ruins of Fort Santo António.","Important for approaching the Port of Santo António."]},"centro-cultural-portugues-st-landmarks-v2":{"i":"/poi-images/centro-cultural-portugues-st-landmarks-v2.webp","s":"The Portuguese Cultural Center is an important venue for intellectual and artistic exchange in the capital.","f":["Center for contemporary art exhibitions.","Offers language courses and academic resources."]},"monumento-batepa-landmarks-v2":{"i":"/poi-images/monumento-batepa-landmarks-v2.webp","s":"The Batepá Memorial in Fernão Dias commemorates the victims of the 1953 massacre, a turning point in national consciousness and the quest for independence.","f":["Commemorates the tragic events of February 1953.","An important site for national days of remembrance."]},"arquivo-historico-nacional-st-landmarks-v2":{"i":"/poi-images/arquivo-historico-nacional-st-landmarks-v2.webp","s":"The National Historical Archive guards the written records of São Tomé and Príncipe's history since its discovery by the Portuguese.","f":["Houses documents from the entire colonial period.","Important center for historical research."]},"ponte-rio-agua-grande-landmarks-v2":{"i":"/poi-images/ponte-rio-agua-grande-landmarks-v2.webp","s":"The bridge over the Rio Água Grande is a functional and historic landmark in the center of São Tomé.","f":["Vital transport link in the city center.","Offers a view of urban life along the river."]},"esplanada-maritima-st-landmarks-v2":{"i":"/poi-images/esplanada-maritima-st-landmarks-v2.webp","s":"The Waterfront Promenade, locally known as the Marginal, is the most popular strolling area in the capital.","f":["Center of social life in the evenings.","Offers spectacular views of the bay and the port."]},"schildkroeten-praia-grande-life-v2":{"i":"/poi-images/schildkroeten-praia-grande-life-v2.webp","s":"Praia Grande is one of the most important nesting sites for sea turtles on the northern coast of São Tomé.","f":["Most important breeding site for the rare leatherback turtle on the island.","Nighttime observation tours are offered under strict regulations."]},"versuchszentrum-poto-life-v2":{"i":"/poi-images/versuchszentrum-poto-life-v2.webp","s":"The Potó research center is the scientific backbone of Santomean agriculture, where research is conducted to improve local crops.","f":["Houses an extensive seed bank for endemic crops.","Conducts training programs for local farmers."]},"kinderpark-sao-tome-life-v2":{"i":"/poi-images/kinderpark-sao-tome-life-v2.webp","s":"The children's park in the center of the capital is a colorful oasis of joy where the island's youngest residents can play to their heart's content.","f":["The only larger public playground in the capital.","Regular venue for children's birthday parties and local festivals."]},"garten-bom-successo-life-v2":{"i":"/poi-images/garten-bom-successo-life-v2.webp","s":"Located at the entrance to the Obô National Park, the Bom Successo Botanical Garden is a showcase of the incredible flora of São Tomé.","f":["Home to over 100 different endemic orchid species.","An important starting point for guided nature hikes."]},"vanille-farm-henrique-life-v2":{"i":"/poi-images/vanille-farm-henrique-life-v2.webp","s":"In the cooler highlands of Henrique lies a specialized farm dedicated to growing precious Bourbon vanilla.","f":["One of the few places on the island producing genuine Bourbon vanilla.","Pollination is done exclusively by hand by experienced workers."]},"papageien-principe-life-v2":{"i":"/poi-images/papageien-principe-life-v2.webp","s":"Deep within the protected biosphere reserve of Príncipe lies a special conservation area for the endemic Príncipe parrot.","f":["The Príncipe parrot is a strictly protected, endemic species.","The sanctuary works closely with international conservation organizations."]},"kaffee-nova-moca-life-v2":{"i":"/poi-images/kaffee-nova-moca-life-v2.webp","s":"High above the cloud forests of Mé-Zóchi lies the historic Nova Moca plantation, world-famous for producing high-quality Arabica coffee.","f":["Known for the 'Coffee of Kings', which was once supplied to European noble courts.","Offers tastings directly in the plantation's historic manor house."]},"schildkroeten-morro-peixe-life-v2":{"i":"/poi-images/schildkroeten-morro-peixe-life-v2.webp","s":"The Morro Peixe Turtle Camp is a dedicated conservation center on the northwestern coast run by the local community.","f":["Operated by the local NGO MARAPA.","A small museum provides information about the marine animals' life cycle."]},"kinderzentrum-principe-life-v2":{"i":"/poi-images/kinderzentrum-principe-life-v2.webp","s":"The children's leisure center in Santo António is the hub for play and education for the children on Príncipe Island.","f":["An important social project for the local community of Santo António.","Offers afternoon care and creative leisure activities."]},"gewuerzfarm-uba-budo-life-v2":{"i":"/poi-images/gewuerzfarm-uba-budo-life-v2.webp","s":"Deep in the green heart of Cantagalo lies the Uba Budo spice farm, a place where the air is filled with the intense scents of the Orient and the tropics.","f":["Specializes in the cultivation of organic black pepper.","The spices are still traditionally dried in the sun."]},"wal-beobachtung-leba-life-v2":{"i":"/poi-images/wal-beobachtung-leba-life-v2.webp","s":"Off the west coast of São Tomé, near Neves, lies an important area for observing humpback whales during their annual migration.","f":["Best observation time is during the mating season (July to October).","Whales can often be spotted directly from the shore with binoculars."]},"bananen-generosa-life-v2":{"i":"/poi-images/bananen-generosa-life-v2.webp","s":"The Generosa banana plantation in the west of the island is a prime example of the sustainable cultivation of various banana varieties.","f":["Produces over ten different banana varieties for the local market.","Harvest waste is used for composting."]},"korallen-micolo-life-v2":{"i":"/poi-images/korallen-micolo-life-v2.webp","s":"Off the picturesque coast of Micolo stretches an important protection zone for the sensitive coral reefs of the north.","f":["Home to rare fire corals and vibrant parrotfish.","Snorkeling is only allowed in designated areas."]},"kakaohof-diogo-vaz-life-v2":{"i":"/poi-images/kakaohof-diogo-vaz-life-v2.webp","s":"The Diogo Vaz cocoa farm is a significant center for cultivating high-quality fine cocoa on the west coast.","f":["Exclusively uses the rare Amelonado cocoa variety.","Offers interactive workshops on chocolate making."]},"orchideengarten-cantagalo-life-v2":{"i":"/poi-images/orchideengarten-cantagalo-life-v2.webp","s":"In the heart of the Cantagalo district lies this specialized garden dedicated to the preservation and breeding of the fascinating orchids of São Tomé.","f":["Home to some of the rarest orchids in the world.","An important research center for botanical studies."]},"spielplatz-independencia-life-v2":{"i":"/poi-images/spielplatz-independencia-life-v2.webp","s":"The playground at Independence Square in São Tomé is a favorite spot for urban families where children can play in a safe environment.","f":["Central meeting point for families in the capital.","Regular maintenance by the municipal administration."]},"palmoel-ribeira-peixe-life-v2":{"i":"/poi-images/palmoel-ribeira-peixe-life-v2.webp","s":"Ribeira Peixe in the deep south of the island is the heart of Santomean oil palm production.","f":["One of the largest and most modern plantations in the entire archipelago.","The extracted palm oil is primarily used for the local market."]},"vogelplatz-io-grande-life-v2":{"i":"/poi-images/vogelplatz-io-grande-life-v2.webp","s":"On the banks of the Rio Iô Grande in the Caué district lies one of the island's best spots for observing rare bird species.","f":["Home to over 20 endemic bird species of the archipelago.","Bird watching platforms allow an undisturbed view of the riverbank."]},"abenteuerspielplatz-neves-life-v2":{"i":"/poi-images/abenteuerspielplatz-neves-life-v2.webp","s":"The adventure playground in the industrial city of Neves offers the region's children an exciting place for physical activity and communal play.","f":["Created through an initiative of local businesses and the municipality.","Features special areas for toddlers and older children."]},"lernbauernhof-agostinho-neto-life-v2":{"i":"/poi-images/lernbauernhof-agostinho-neto-life-v2.webp","s":"The educational farm at the historic Roça Agostinho Neto is an innovative educational project that brings the importance of agriculture closer to students and visitors.","f":["A model project for agro-ecological education in São Tomé.","Offers special programs for school classes from across the country."]},"pico-de-sao-tome-nature-v2":{"i":"/poi-images/pico-de-sao-tome-nature-v2.webp","s":"Pico de São Tomé is the highest point on the island at 2024 meters, a majestic guardian over the Atlantic.","f":["Highest mountain in São Tomé and Príncipe.","Part of the Obô National Park."]},"pico-cao-grande-nature-v2":{"i":"/poi-images/pico-cao-grande-nature-v2.webp","s":"Pico Cão Grande is a spectacular volcanic plug that rises like a giant needle above the southern rainforest.","f":["Rises 370 meters above the surrounding terrain.","Composed of hard phonolite rock."]},"parque-nacional-obo-nature-v2":{"i":"/poi-images/parque-nacional-obo-nature-v2.webp","s":"Obô National Park protects the archipelago's most valuable rainforests and is a hotspot of biodiversity.","f":["Covers about 30 percent of São Tomé's land area.","Home to over 130 endemic plant species."]},"lagoa-azul-nature-v2":{"i":"/poi-images/lagoa-azul-nature-v2.webp","s":"Lagoa Azul is a dreamy bay on the north coast, famous for its brilliant turquoise waters.","f":["One of the best spots for snorkeling on São Tomé.","Unique occurrence of baobabs directly by the sea."]},"rio-io-grande-nature-v2":{"i":"/poi-images/rio-io-grande-nature-v2.webp","s":"Rio Iô Grande is one of the island's most water-rich rivers, meandering through the deep valleys of the south.","f":["Most important water source for the southern districts.","Offers spectacular gorges in its upper course."]},"pico-maria-fernandes-nature-v2":{"i":"/poi-images/pico-maria-fernandes-nature-v2.webp","s":"Pico Maria Fernandes is a prominent elevation in southern São Tomé that often stands in the shadow of the more famous Cão Grande but is no less impressive.","f":["An important landmark for sailors on the south coast.","Home to many rare epiphytic plants."]},"ilheu-santana-nature-v2":{"i":"/poi-images/ilheu-santana-nature-v2.webp","s":"Ilhéu Santana is a rocky island off the east coast of São Tomé, rising majestically from the blue of the Atlantic.","f":["Important breeding ground for sooty terns.","Offers excellent conditions for scuba diving."]},"pico-do-principe-nature-v2":{"i":"/poi-images/pico-do-principe-nature-v2.webp","s":"Pico do Príncipe is the highest elevation on Príncipe Island and the heart of its biosphere reserve.","f":["Highest point of Príncipe.","Home to many species found only on this one island."]},"rio-contador-nature-v2":{"i":"/poi-images/rio-contador-nature-v2.webp","s":"Rio Contador is a wild mountain river in northwestern São Tomé, crashing through spectacular gorges into the sea.","f":["Offers some of the most beautiful waterfalls on the island.","Important habitat for the rare São Tomé mountain wagtail."]},"rio-abade-nature-v2":{"i":"/poi-images/rio-abade-nature-v2.webp","s":"Rio Abade is a tranquil river draining the eastern midlands, flowing through some of the island's oldest plantation areas.","f":["Flows into the Atlantic near the town of Santana.","Known for its gentle river bends and idyllic picnic spots."]},"lagoa-amelia-nature-v2":{"i":"/poi-images/lagoa-amelia-nature-v2.webp","s":"Lagoa Amélia is not an ordinary lake but a rainwater-filled volcanic crater in the mountains of São Tomé, which now houses a fascinating marsh landscape.","f":["Located at an elevation of about 1450 meters.","Actually a silted-up crater lake."]},"ilheu-bom-bom-nature-v2":{"i":"/poi-images/ilheu-bom-bom-nature-v2.webp","s":"Ilhéu Bom Bom is a small, green pearl off the north coast of Príncipe, connected to the main island by a long wooden walkway.","f":["Home to an award-winning eco-resort.","An important spot for watching humpback whales (seasonally)."]},"pico-papagaio-nature-v2":{"i":"/poi-images/pico-papagaio-nature-v2.webp","s":"Pico Papagaio, also called Parrot Mountain, is a prominent, cone-shaped elevation on Príncipe that rises like a green pyramid from the forest.","f":["Offers spectacular views over Príncipe Island.","An important nesting site for the grey parrot."]},"rio-manuel-jorge-nature-v2":{"i":"/poi-images/rio-manuel-jorge-nature-v2.webp","s":"Rio Manuel Jorge is a lively river on the east coast of São Tomé, flowing through fertile plantation areas and dense forest.","f":["Flows into the sea near Santana.","Known for the Cascata de Manuel Jorge."]},"baia-das-agulhas-nature-v2":{"i":"/poi-images/baia-das-agulhas-nature-v2.webp","s":"Baía das Agulhas, the 'Bay of Needles,' is one of the most spectacular coastal stretches of Príncipe.","f":["Part of the Príncipe UNESCO Biosphere Reserve.","Only accessible by boat or via very challenging paths."]},"rio-cantagalo-nature-v2":{"i":"/poi-images/rio-cantagalo-nature-v2.webp","s":"Rio Cantagalo is an important river on the east coast that gives its name to the district of the same name.","f":["Important water supplier for agriculture in Cantagalo.","Known for its calm sections inviting for bathing."]},"pico-mesa-nature-v2":{"i":"/poi-images/pico-mesa-nature-v2.webp","s":"Pico Mesa, the 'Table Mountain' of Príncipe, is a unique mountain with a flat summit plateau that distinguishes it from the surrounding pointed peaks.","f":["One of the most distinctive geological features of Príncipe.","Offers a 360-degree view in clear weather."]},"ilheu-caroco-nature-v2":{"i":"/poi-images/ilheu-caroco-nature-v2.webp","s":"Ilhéu Caroço, also known as 'Jockey's Cap,' is a dramatic, cone-shaped rock island south of Príncipe.","f":["Known for its distinctive shape resembling a hat.","Uninhabited and strictly protected."]},"rio-caue-nature-v2":{"i":"/poi-images/rio-caue-nature-v2.webp","s":"Rio Caué is the lifeline of São Tomé's southernmost district, flowing through the heart of Obô National Park.","f":["Most important river in the Caué district.","Provides access to some of the most remote parts of the rainforest."]},"praia-jale-nature-v2":{"i":"/poi-images/praia-jale-nature-v2.webp","s":"Praia Jalé is a wild, natural beach in the deep south, world-renowned for its ecological significance.","f":["Most important nesting beach for endangered sea turtles.","Houses a simple but vital eco-camp for conservationists."]},"rio-lemba-nature-v2":{"i":"/poi-images/rio-lemba-nature-v2.webp","s":"Rio Lembá is the most significant river in the west of the island, a symbol of nature's untamed power.","f":["Largest river system in the Lembá district.","Known for its extremely fast currents during the rainy season."]},"cascata-sao-nicolau-nature-v2":{"i":"/poi-images/cascata-sao-nicolau-nature-v2.webp","s":"São Nicolau Waterfall is one of the island's most famous and photogenic waterfalls, nestled in the cool mountain forests of the Mé-Zóchi district.","f":["Easily accessible from the road to Monte Café.","Surrounded by lush, moisture-loving vegetation."]},"rio-agua-grande-nature-v2":{"i":"/poi-images/rio-agua-grande-nature-v2.webp","s":"Rio Água Grande is the historic river that gives the capital and its district their names.","f":["Namesake for the country's most populous district.","Played a crucial role in choosing the capital's location."]},"golfo-de-guine-nature-v2":{"i":"/poi-images/golfo-de-guine-nature-v2.webp","s":"The Gulf of Guinea surrounds the entire archipelago of São Tomé and Príncipe and is the cradle of the islands' tropical climate.","f":["Part of the tropical Atlantic.","Known for its strategic location on the Equator."]},"pico-cabumbe-relief-v2":{"i":"/poi-images/pico-cabumbe-relief-v2.webp","s":"Pico Cabumbé is a prominent peak in the south of São Tomé, rising above the dense rainforest.","f":["Reaches an elevation of approximately 1,403 meters above sea level.","Located in the southern part of the Obô National Park."]},"pico-ana-chaves-relief-v2":{"i":"/poi-images/pico-ana-chaves-relief-v2.webp","s":"This mountain in the center of São Tomé island is named after the legendary Ana Chaves.","f":["Located in the Mé-Zóchi district in the interior of the island.","The summit often offers a wide view over the central highlands."]},"pico-maria-amelia-relief-v2":{"i":"/poi-images/pico-maria-amelia-relief-v2.webp","s":"Pico Maria Amélia is another imposing peak in the southern highlands of São Tomé.","f":["Located west of the settlement of São João dos Angolares.","Part of the mountainous terrain of the Caué district."]},"pico-bastiao-relief-v2":{"i":"/poi-images/pico-bastiao-relief-v2.webp","s":"Pico Bastião is a distinctive geological formation on Príncipe Island.","f":["Located in the eastern part of Príncipe Island.","Important landmark for hikers in the island's interior."]},"pico-carvalhal-relief-v2":{"i":"/poi-images/pico-carvalhal-relief-v2.webp","s":"Located in the heart of the Mé-Zóchi district, Pico Carvalhal is a symbol of Central São Tomé's mountainous landscape.","f":["The region is known for its fertile volcanic soils.","Provides protection from strong Atlantic winds for the valleys."]},"pico-vinte-e-cinco-relief-v2":{"i":"/poi-images/pico-vinte-e-cinco-relief-v2.webp","s":"This mountain in the far southwest of São Tomé marks a wild and inaccessible region.","f":["Located in one of the island's wettest zones.","Access is difficult due to dense vegetation."]},"pico-formoso-relief-v2":{"i":"/poi-images/pico-formoso-relief-v2.webp","s":"Pico de Formoso, whose name means 'Beautiful Peak', lives up to its name.","f":["Important catchment area for Caué's water supply.","Humidity here stays above 90% almost year-round."]},"morro-fundao-relief-v2":{"i":"/poi-images/morro-fundao-relief-v2.webp","s":"Morro de Fundão is a prominent hill in the north of São Tomé, shaping the landscape of the Lobata district.","f":["Offers a drier microclimate than the island's center.","Important site for local agricultural projects."]},"morro-vilela-relief-v2":{"i":"/poi-images/morro-vilela-relief-v2.webp","s":"Morro Vilela is a significant elevation on the rugged west coast of São Tomé.","f":["Located in the Lembá district near the coast.","Notorious for strong winds and rough seas."]},"pico-palmira-relief-v2":{"i":"/poi-images/pico-palmira-relief-v2.webp","s":"Pico de Palmira is a mountain in the heart of São Tomé's coffee-growing region.","f":["The region around the mountain is known for its cool climate.","An important destination for agritourism hikes."]},"pico-gago-coutinho-relief-v2":{"i":"/poi-images/pico-gago-coutinho-relief-v2.webp","s":"Named after the famous Portuguese navigator, this mountain is an important surveying point in the south of the island.","f":["The summit often serves as a reference point for cartographers.","Part of the protected Obô National Park."]},"pico-esperanca-relief-v2":{"i":"/poi-images/pico-esperanca-relief-v2.webp","s":"Pico da Esperança is an elevation in eastern São Tomé, known for its scenic diversity.","f":["The name means 'Peak of Hope'.","Important site for local forestry."]},"pico-sao-joao-relief-v2":{"i":"/poi-images/pico-sao-joao-relief-v2.webp","s":"This mountain in eastern São Tomé towers over the bay of the same name and the surrounding valleys.","f":["Shapes the silhouette of the Cantagalo district.","The slopes are often covered by low-hanging clouds."]},"morro-estrela-relief-v2":{"i":"/poi-images/morro-estrela-relief-v2.webp","s":"Morro de Estrela is a steep cliff formation on the northwest coast of São Tomé.","f":["The name means 'Hill of the Star'.","Located in the remote Lembá district."]},"pico-sao-pedro-relief-v2":{"i":"/poi-images/pico-sao-pedro-relief-v2.webp","s":"Pico de São Pedro is a prominent peak near the capital that marks the beginning of the central highlands.","f":["An important part of São Tomé city's mountain panorama.","Serves as a watershed for local streams."]},"principe-rainforest-relief-v2":{"i":"/poi-images/principe-rainforest-relief-v2.webp","s":"The Príncipe rainforest is part of the UNESCO Biosphere Reserve and is considered one of Africa's best-preserved ecosystems.","f":["Home to more endemic species per square kilometer than almost anywhere else.","Often referred to as the 'African Galapagos'."]},"me-zochi-cloudforest-relief-v2":{"i":"/poi-images/me-zochi-cloudforest-relief-v2.webp","s":"In the higher elevations of the Mé-Zóchi district lies the mysterious cloud forest.","f":["Important source for condensation water formation.","Home to the rare São Tomé Fiscal (bird species)."]},"porto-alegre-mangrove-relief-v2":{"i":"/poi-images/porto-alegre-mangrove-relief-v2.webp","s":"In the far south of São Tomé, near Porto Alegre, extensive mangrove swamps stretch out.","f":["Most important mangrove site on São Tomé island.","Can best be explored by boat."]},"sao-tome-volcanic-massif-relief-v2":{"i":"/poi-images/sao-tome-volcanic-massif-relief-v2.webp","s":"The central volcanic massif is the geological backbone of São Tomé island.","f":["The massif was formed millions of years ago by hotspot volcanism.","Contains the highest elevations in the entire Gulf of Guinea."]}};

function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,pend=false,dx=0,dy=0,sx=0,sy=0,pid=0;
// Drag uses a MOVE THRESHOLD: pointerdown only ARMS panning; we don't capture the
// pointer until it actually moves >4px. A click without movement therefore reaches
// the target's own handler — fixes desktop where setPointerCapture-on-down stole the
// click from .cluster and .region (country) elements (mobile tap was unaffected).
svg.addEventListener('pointerdown',e=>{if(e.isPrimary===false)return;pend=true;dr=false;dx=sx=e.clientX;dy=sy=e.clientY;pid=e.pointerId});
svg.addEventListener('pointermove',e=>{
  if(pend&&!dr){if(Math.hypot(e.clientX-sx,e.clientY-sy)<=4)return;dr=true;svg.classList.add('drag');try{svg.setPointerCapture(pid)}catch(_){}}
  if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()
});
svg.addEventListener('pointerup',()=>{pend=false;if(dr){dr=false;svg.classList.remove('drag');try{svg.releasePointerCapture(pid)}catch(_){}}});
svg.addEventListener('pointercancel',()=>{pend=false;dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false;pend=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Search-only entries (POIs on a sub-map): match by name, navigate to the sub-map.
  const extraHits=[];
  for(const e of SEARCH_EXTRA){if(e.s.includes(q)&&extraHits.length<20)extraHits.push(e)}
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0&&extraHits.length===0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0&&extraHits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  const exRow=e=>'<a data-extra="1" href="'+e.u+'"><span class="dot" style="background:#ffd54a"></span><span class="nm">'+e.n.replace(/[<>]/g,'')+'</span><span class="gr">›</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('')+extraHits.map(exRow).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const ax=e.target.closest('a[data-extra]');
  if(ax)return; // sub-map link: let the browser navigate
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
