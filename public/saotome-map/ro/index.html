const POI_CARD={"belem-cities-v2":{"i":"/poi-images/belem-cities-v2.webp","s":"Belém este o localitate pașnică în întinderile verzi din Mé-Zóchi, unde viața se desfășoară într-o armonie perfectă cu natura.","f":["Cunoscut pentru sucurile sale de fructe tropicale și dulcețurile excelente.","Un punct de plecare important pentru expedițiile botanice în zonele înalte."]},"porto-alegre-cities-v2":{"i":"/poi-images/porto-alegre-cities-v2.webp","s":"Porto Alegre este poarta sudică către paradis, unde timpul stă în loc pe plajele albe ale insulei Ilhéu das Rolas.","f":["Portul principal pentru transportul către insula ecuatorială Ilhéu das Rolas.","Cunoscut pentru plajele sale virgine, precum Praia Piscina."]},"ponta-do-sol-cities-v2":{"i":"/poi-images/ponta-do-sol-cities-v2.webp","s":"Ponta do Sol este cel mai nord-vestic punct din Príncipe, unde soarele transformă Atlanticul într-o mare de aur înainte de a coborî sub orizont.","f":["Cel mai nordic punct al insulei Príncipe.","Faimos pentru apusurile sale de soare spectaculoase deasupra oceanului."]},"sao-tome-cities-v2":{"i":"/poi-images/sao-tome-cities-v2.webp","s":"São Tomé este capitala vibrantă a statului insular și un loc unde arhitectura colonială întâlnește stilul de viață tropical.","f":["Orașul a fost fondat în anul 1485 de către portughezi.","Găzduiește fortăreața istorică São Sebastião pe țărm."]},"pantufo-cities-v2":{"i":"/poi-images/pantufo-cities-v2.webp","s":"Pantufo este un sat de pescari tradițional la marginea capitalei, unde timpul pare să treacă mai încet.","f":["Cunoscut pentru restaurantele sale de pește excelente de pe plajă.","Un furnizor important pentru piața de pește din São Tomé."]},"cruzeiro-cities-v2":{"i":"/poi-images/cruzeiro-cities-v2.webp","s":"Cruzeiro este așezat în dealurile verzi din spatele capitalei, oferind o vedere largă asupra Atlanticului.","f":["Găzduiește instituții de învățământ importante din regiune.","Este considerat unul dintre cartierele rezidențiale preferate ale capitalei."]},"bobo-forro-cities-v2":{"i":"/poi-images/bobo-forro-cities-v2.webp","s":"Bobo Forro este inima populară vibrantă de la marginea capitalei, unde cultura forros este cea mai vie.","f":["Un centru pentru dansuri tradiționale și festivaluri de muzică.","Cunoscut pentru piețele sale pline de viață și atelierele meșteșugărești."]},"praia-melao-cities-v2":{"i":"/poi-images/praia-melao-cities-v2.webp","s":"Praia Melão se întinde de-a lungul coastei de sud a regiunii Água Grande, unde spuma mării umezește palmierii înalți.","f":["Găzduiește una dintre cele mai importante berării din țară.","Un loc popular pentru excursii de weekend din capitală."]},"quinta-da-favorita-cities-v2":{"i":"/poi-images/quinta-da-favorita-cities-v2.webp","s":"Quinta da Favorita este o oază verde de liniște în nordul capitalei, unde trecutul colonial dăinuie în grădinile magnifice.","f":["A fost cândva o plantație importantă de fructe exotice.","Cunoscut pentru clădirile sale coloniale valoroase din punct de vedere arhitectural."]},"santana-cities-v2":{"i":"/poi-images/santana-cities-v2.webp","s":"Santana, capitala districtului Cantagalo, se cuibărește într-un golf cu vedere spre misterioasa insulă Santana.","f":["Capitala districtului Cantagalo de pe coasta de est.","Oferă cel mai bun punct de plecare pentru excursii către Ilhéu de Santana."]},"ribeira-afonso-cities-v2":{"i":"/poi-images/ribeira-afonso-cities-v2.webp","s":"Ribeira Afonso este un loc al frumuseții costiere aspre, unde râul cu același nume se varsă cu forță în Atlantic.","f":["Cunoscut pentru peisajele sale impresionante de la gura de vărsare a râului.","Un loc important istoric pentru transportul de cacao."]},"uba-budo-cities-v2":{"i":"/poi-images/uba-budo-cities-v2.webp","s":"Uba Budo se află adânc în interiorul districtului Cantagalo, înconjurat de o mare de junglă de smarald.","f":["Un centru important pentru cultivarea piperului negru de înaltă calitate.","Găzduiește o roça (plantație) istorică cu clădiri bine conservate."]},"sao-joao-dos-angolares-cities-v2":{"i":"/poi-images/sao-joao-dos-angolares-cities-v2.webp","s":"São João dos Angolares este leagănul unei culturi mândre, care își are rădăcinile într-un naufragiu de acum câteva secole.","f":["Patria grupului etnic Angolares, urmașii sclavilor naufragiați.","Cunoscut pentru Roça São João, un centru renumit pentru artă și gastronomie."]},"dona-augusta-cities-v2":{"i":"/poi-images/dona-augusta-cities-v2.webp","s":"Dona Augusta se află ascunsă pe coasta sălbatică de sud-est, unde pădurea Obô întâlnește Atlanticul neîmblânzit.","f":["În apropiere se află formațiuni de bazalt impresionante pe coastă.","Un loc important de cuibărit pentru păsări tropicale rare."]},"ribeira-peixe-cities-v2":{"i":"/poi-images/ribeira-peixe-cities-v2.webp","s":"Ribeira Peixe este o comunitate plină de viață din sudul îndepărtat, care s-a dezvoltat în jurul uneia dintre cele mai active plantații de palmieri de ulei din țară.","f":["Centrul producției de ulei de palmier din sudul insulei São Tomé.","Deține o fabrică modernă pentru prelucrarea fructelor de palmier."]},"neves-cities-v2":{"i":"/poi-images/neves-cities-v2.webp","s":"Neves, forța industrială a vestului, este un oraș portuar în care ecoul istoriei răsună puternic.","f":["Cea mai importantă locație industrială din țară, având o berărie mare.","Capitala districtului Lembá de pe coasta de nord-vest."]},"santa-catarina-cities-v2":{"i":"/poi-images/santa-catarina-cities-v2.webp","s":"Santa Catarina marchează capătul drumului asfaltat de pe coasta de vest, acolo unde civilizația dă mâna cu maiestuoasa pădure Obô.","f":["Ultima localitate accesibilă pe un drum asfaltat în vest.","Oferă acces la una dintre cele mai retrase cascade de pe insulă."]},"diogo-vaz-cities-v2":{"i":"/poi-images/diogo-vaz-cities-v2.webp","s":"Diogo Vaz este un loc care visează la ciocolată, deoarece aici se prelucrează cu grijă și dragoste una dintre cele mai bune varietăți de cacao din lume.","f":["Dă numele unui brand de ciocolată gourmet cunoscut la nivel mondial.","Găzduiește una dintre cele mai moderne unități de prelucrare a cacauei din țară."]},"henrique-cities-v2":{"i":"/poi-images/henrique-cities-v2.webp","s":"Henrique se află sus, pe pantele districtului Lembá, de unde privirea se întinde peste pădurile de smarald până la sclipitorul Atlantic.","f":["Un centru important pentru cultivarea vaniliei Bourbon autentice.","Oferă trasee de drumeție către unele dintre cele mai înalte puncte din vest."]},"ponta-figo-cities-v2":{"i":"/poi-images/ponta-figo-cities-v2.webp","s":"Ponta Figo este un loc de întâlnire între mare și uscat, unde stâncile veghează ca niște străjeri de piatră asupra vestului.","f":["Punct strategic pentru observarea balenelor în timpul sezonului.","Deține una dintre cele mai vechi școli primare din districtul Lembá."]},"generosa-cities-v2":{"i":"/poi-images/generosa-cities-v2.webp","s":"Generosa își poartă numele pe merit, deoarece pământul de aici este atât de generos încât livezile dau roade aproape tot anul.","f":["Un producător important de banane bio pentru piața locală.","Cunoscut pentru grădinile sale tradiționale de plante medicinale."]},"guadalupe-cities-v2":{"i":"/poi-images/guadalupe-cities-v2.webp","s":"Guadalupe, capitala mândră a districtului Lobata, este un loc al istoriei și al credinței, a cărui inimă este biserica distinctivă din piață.","f":["Capitala districtului Lobata din nordul insulei.","Găzduiește un centru important pentru cercetare agricolă."]},"santo-amaro-cities-v2":{"i":"/poi-images/santo-amaro-cities-v2.webp","s":"Santo Amaro este o localitate activă pe drumul principal spre nord, unde comerțul și meșteșugurile înfloresc.","f":["Un nod de transport strategic în districtul Lobata.","Cunoscut pentru tâmplarii și producătorii săi de mobilă pricepuți."]},"conde-cities-v2":{"i":"/poi-images/conde-cities-v2.webp","s":"Conde este așezat în dealurile blânde din Lobata, unde solul este deosebit de bogat în minerale, oferind forță plantelor.","f":["O zonă importantă de cultivare a legumelor rădăcinoase și a tuberculilor.","Cunoscut pentru olăritul tradițional din lut local."]},"micolo-cities-v2":{"i":"/poi-images/micolo-cities-v2.webp","s":"Micolo este o localitate de coastă pitorească din nord, unde nisipul este atât de fin încât cântă sub picioare.","f":["Faimos pentru plajele sale superbe, adesea pustii.","Un ecosistem important pentru protecția păsărilor de coastă."]},"fernao-dias-cities-v2":{"i":"/poi-images/fernao-dias-cities-v2.webp","s":"Fernão Dias poartă numele unui explorator și păstrează până astăzi spiritul aventurii pe coasta de nord.","f":["Port istoric de încărcare pentru boabele de cacao în secolul al XIX-lea.","Oferă unele dintre cele mai bune locuri pentru observarea apusului de soare."]},"agostinho-neto-cities-v2":{"i":"/poi-images/agostinho-neto-cities-v2.webp","s":"Agostinho Neto, cunoscut anterior sub numele de Rio do Ouro, este o mărturie monumentală a culturii de plantație, care pare un oraș de sine stătător în junglă.","f":["Cea mai mare roça (plantație) istorică din țară.","Găzduiește o clădire de spital impresionantă în stil neoclasic."]},"boa-entrada-cities-v2":{"i":"/poi-images/boa-entrada-cities-v2.webp","s":"Boa Entrada își onorează numele și întâmpină vizitatorii cu o alee de arbori gigantici care par să atingă cerul.","f":["Cunoscut pentru 'Jequitibá', unul dintre cei mai mari și mai bătrâni arbori de pe insulă.","Găzduiește o roça importantă cu o identitate culturală puternică."]},"canavial-cities-v2":{"i":"/poi-images/canavial-cities-v2.webp","s":"Canavial este un loc al contrastelor, unde câmpurile plane ale fâșiei de coastă întâlnesc primele înălțimi ale nordului.","f":["O zonă importantă pentru creșterea raselor tradiționale de bovine.","Cunoscut pentru producția de rachiu local din trestie de zahăr (Grogue)."]},"blublu-cities-v2":{"i":"/poi-images/blublu-cities-v2.webp","s":"Blublu este o suburbie plină de viață a orașului Guadalupe, unde apele râului Lobata au dat numele și ritmul localității.","f":["Cunoscut pentru solurile sale aluvionare fertile de pe malul râului Lobata.","Un centru important de aprovizionare cu legume proaspete pentru regiune."]},"trindade-cities-v2":{"i":"/poi-images/trindade-cities-v2.webp","s":"Trindade, capitala districtului Mé-Zóchi, se află mândră în zona fertilă de mijloc a insulei, unde aerul este mai răcoros și solul de un negru intens.","f":["Al doilea oraș ca mărime de pe insula São Tomé.","Cunoscut istoric pentru 'Masacrul de la Batepá' din anul 1953."]},"madalena-cities-v2":{"i":"/poi-images/madalena-cities-v2.webp","s":"Madalena este o suburbie liniștită a orașului Trindade, în care grădinile înfloresc atât de luxuriant încât par mici jungle.","f":["Cunoscut pentru cultivarea mirodeniilor de înaltă calitate, precum cuișoarele și scorțișoara.","Un loc important pentru conservarea rețetelor tradiționale santomeze."]},"bombom-cities-v2":{"i":"/poi-images/bombom-cities-v2.webp","s":"Bombom este o localitate plină de animație la marginea capitalei, în care viața urbană și liniștea rurală se află în echilibru.","f":["Un centru important pentru transportul local.","Cunoscut pentru produsele sale meșteșugărești diverse."]},"almas-cities-v2":{"i":"/poi-images/almas-cities-v2.webp","s":"Almas este situat pe platourile blânde din Mé-Zóchi, unde sufletele strămoșilor par să șoptească printre arborii de cafea străvechi.","f":["Una dintre cele mai vechi zone de cultivare a cafelei de pe insulă.","Cunoscut pentru casele sale de piatră unice din punct de vedere arhitectural."]},"caixao-grande-cities-v2":{"i":"/poi-images/caixao-grande-cities-v2.webp","s":"Caixão Grande este o localitate plină de viață, marcată de poziția sa într-un nod de transport important din zona de mijloc.","f":["Un nod important pentru comerțul dintre nord și sud.","Cunoscut pentru scena sa muzicală vibrantă și grupurile de dans local."]},"santa-margarida-cities-v2":{"i":"/poi-images/santa-margarida-cities-v2.webp","s":"Santa Margarida se află ascunsă în labirintul verde din Mé-Zóchi, un loc unde liniștea pădurii este întreruptă doar de susurul îndepărtat al cascadelor.","f":["În apropiere se află una dintre cele mai înalte cascade din zona de mijloc.","Un centru important pentru studiul plantelor medicinale tradiționale santomeze."]},"milagrosa-cities-v2":{"i":"/poi-images/milagrosa-cities-v2.webp","s":"Milagrosa își poartă numele ca omagiu adus miracolului naturii, care a binecuvântat acest loc cu o fertilitate incredibilă.","f":["Un producător important de piper negru aromat.","Cunoscut pentru procesiunile și sărbătorile sale religioase."]},"batepa-cities-v2":{"i":"/poi-images/batepa-cities-v2.webp","s":"Batepá este un loc cu o semnificație istorică dureroasă, unde comemorarea masacrului din 1953 marchează profund identitatea oamenilor.","f":["Locul central al evenimentelor tragice din 1953.","Găzduiește un memorial important pentru eroii independenței."]},"monte-cafe-cities-v2":{"i":"/poi-images/monte-cafe-cities-v2.webp","s":"Monte Café este situat maiestuos în munții înnebulați din Mé-Zóchi, un centru istoric al producției de cafea care a păstrat farmecul unei ere trecute.","f":["Fondată în anul 1858, una dintre cele mai vechi și mai importante plantații.","Găzduiește Muzeul Cafelei, care documentează istoria cultivării."]},"santo-antonio-cities-v2":{"i":"/poi-images/santo-antonio-cities-v2.webp","s":"Santo António, capitala fermecătoare a insulei Príncipe, este un oraș care se cuibărește blând pe malurile râului Palhota.","f":["Capitala regiunii autonome Príncipe și cea mai mică capitală din lume.","Cunoscut pentru arhitectura sa colonială portugheză bine conservată."]},"terreiro-velho-cities-v2":{"i":"/poi-images/terreiro-velho-cities-v2.webp","s":"Terreiro Velho este locul unde visele despre ciocolată devin realitate, sus pe dealurile din Príncipe, cu vedere spre oceanul nesfârșit.","f":["Patria faimoaselor plantații de cacao ale lui Claudio Corallo.","Oferă unele dintre cele mai spectaculoase vederi panoramice asupra vârfului sudic al insulei Príncipe."]},"sundy-cities-v2":{"i":"/poi-images/sundy-cities-v2.webp","s":"Sundy este un loc al științei și al stelelor, așezat în câmpiile blânde din nordul insulei Príncipe.","f":["Locul faimoasei expediții a lui Sir Arthur Eddington pentru observarea eclipsei de soare (1919).","Găzduiește un eco-resort de lux într-un conac istoric."]},"belo-monte-cities-v2":{"i":"/poi-images/belo-monte-cities-v2.webp","s":"Belo Monte tronează pe o limbă de pământ în nord-estul insulei Príncipe și oferă probabil cea mai uluitoare priveliște din întregul arhipelag.","f":["Deține unul dintre cele mai frumoase puncte de belvedere din lume asupra plajei Banana Beach.","Găzduiește un hotel renumit și un centru pentru conservarea naturii."]},"paciencia-cities-v2":{"i":"/poi-images/paciencia-cities-v2.webp","s":"Paciência se află la marginea pădurilor tropicale din Príncipe, un loc unde numele este sugestiv, iar liniștea naturii vindecă sufletul.","f":["Un centru important pentru recoltarea piperului sălbatic și a cuișoarelor.","Cunoscut pentru comunitatea sa de tămăduitori tradiționali."]},"nova-estrela-cities-v2":{"i":"/poi-images/nova-estrela-cities-v2.webp","s":"Nova Estrela se află ca o bijuterie strălucitoare pe stâncile coastei de est a insulei Príncipe, un loc al noii speranțe și al orizonturilor largi.","f":["Unul dintre cele mai bune locuri din Príncipe pentru observarea cerului nocturn.","Cunoscut pentru cooperativa sa modernă de pescuit."]},"picao-cities-v2":{"i":"/poi-images/picao-cities-v2.webp","s":"Picão este un loc al culorilor și al verdelui dens, ascuns în interiorul muntos al insulei Príncipe.","f":["Un centru important pentru cultivarea biologică a arborelui de cinconă.","Cunoscut pentru populația sa diversă de papagali endemici."]},"sao-joaquim-cities-v2":{"i":"/poi-images/sao-joaquim-cities-v2.webp","s":"São Joaquim este un cătun încărcat de istorie în inima insulei Príncipe, unde ruinele unei vechi roça povestesc despre forța timpului.","f":["Găzduiește unele dintre cele mai bine conservate instalații hidraulice ale unei vechi plantații.","Un loc important pentru cercetarea florei locale."]},"esperanca-cities-v2":{"i":"/poi-images/esperanca-cities-v2.webp","s":"Esperança poartă numele speranței și este un exemplu strălucitor al bucuriei de viață din interiorul insulei Príncipe.","f":["Un producător important de fructe exotice, precum papaya și mango.","Cunoscut pentru proiectele sale de tineret dedicate protecției mediului."]},"abade-cities-v2":{"i":"/poi-images/abade-cities-v2.webp","s":"Abade este o localitate de pescari de pe coasta de nord-est a insulei Príncipe, unde Atlanticul se rostogolește spre țărm cu o blândețe rară.","f":["Unul dintre cei mai importanți furnizori de pește proaspăt pentru Santo António.","Cunoscut pentru golfurile sale liniștite și protejate, ideale pentru înot."]},"maria-correia-cities-v2":{"i":"/poi-images/maria-correia-cities-v2.webp","s":"Maria Correia se află pe coasta de vest sălbatică a insulei Príncipe, unde forța oceanului a modelat stâncile de-a lungul mileniilor.","f":["Oferă acces la unele dintre cele mai dramatice coaste stâncoase de pe insulă.","Cunoscut pentru poveștile sale despre femei coloniste istorice."]},"pantufo-sao-tome-cities-v2":{"i":"/poi-images/pantufo-sao-tome-cities-v2.webp","s":"Această parte a localității Pantufo este extensia modernă a satului istoric de pescari, unde se resimte creșterea urbană a capitalei.","f":["O zonă rezidențială emergentă, cu multe proiecte noi de construcție.","Cunoscut pentru scena sa gastronomică vibrantă de la malul mării."]},"henrique-lemba-cities-v2":{"i":"/poi-images/henrique-lemba-cities-v2.webp","s":"Această așezare din zonele înalte ale districtului Lembá este marcată de sălbăticia munților și de munca grea a fermierilor care smulg pantei câmpuri fertile.","f":["Un rezervor important pentru cunoștințele medicale tradiționale.","Cunoscut pentru micile sale plantații de cafea de înaltă calitate."]},"blublu-lobata-cities-v2":{"i":"/poi-images/blublu-lobata-cities-v2.webp","s":"Această parte mai înaltă a localității Blublu oferă o vedere largă peste câmpiile fertile din Lobata până la marea sclipitoare.","f":["O zonă rezidențială preferată pentru clasa de mijloc în creștere din Lobata.","Cunoscut pentru casele sale private moderne, interesante din punct de vedere arhitectural."]},"bombom-me-zochi-cities-v2":{"i":"/poi-images/bombom-me-zochi-cities-v2.webp","s":"Bombom din districtul Mé-Zóchi este un loc al dealurilor fertile și al întâlnirilor cordiale.","f":["Un producător important de boabe de cacao aromate.","Cunoscut pentru comunitatea sa vibrantă și sărbătorile locale."]},"belo-monte-principe-cities-v2":{"i":"/poi-images/belo-monte-principe-cities-v2.webp","s":"Această parte a localității Belo Monte duce mai adânc în interiorul neîmblânzit al insulei Príncipe, unde uriașii pădurii virgine întunecă cerul.","f":["O zonă de protecție importantă pentru speciile de plante endemice.","Cunoscut pentru oportunitățile sale spectaculoase de observare a păsărilor."]},"sandy-principe-cities-v2":{"i":"/poi-images/sandy-principe-cities-v2.webp","s":"Partea de coastă a localității Sundy este un loc al plajelor largi și al mării de un albastru profund, unde Atlanticul își dezvăluie întreaga frumusețe.","f":["Faimos pentru recifele de corali virgine din apropierea coastei.","Un loc important de cuibărit pentru țestoasele marine în timpul sezonului."]},"paciencia-principe-interior-cities-v2":{"i":"/poi-images/paciencia-principe-interior-cities-v2.webp","s":"Satul de sus din Paciência se află la poalele munților abrupți din Príncipe, un loc al dimineților răcoroase și al liniștii profunde.","f":["Un centru important pentru conservarea legendelor și miturilor locale.","Cunoscut pentru ceremoniile sale tradiționale de onorare a pământului."]},"ponta-do-sol-principe-north-cities-v2":{"i":"/poi-images/ponta-do-sol-principe-north-cities-v2.webp","s":"Partea const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
