*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#060614;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:#0a0a1f;border-bottom:1px solid #ffffff14;position:relative;z-index:5}
header a.back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#ffffff14;color:#fff;text-decoration:none;font-weight:700}
header a.back:active{background:#ffffff28}
header h1{margin:0;font-size:1rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .langs{display:flex;gap:.25rem}
.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;background-image:radial-gradient(1.2px 1.2px at 12% 22%,#ffffff70,transparent),radial-gradient(1px 1px at 28% 68%,#ffffff55,transparent),radial-gradient(1.4px 1.4px at 47% 38%,#cfe4ff66,transparent),radial-gradient(1px 1px at 63% 18%,#ffffff50,transparent),radial-gradient(1.3px 1.3px at 78% 72%,#ffffff66,transparent),radial-gradient(1px 1px at 88% 33%,#cfe4ff55,transparent),radial-gradient(1px 1px at 38% 88%,#ffffff44,transparent),radial-gradient(1.2px 1.2px at 92% 58%,#ffffff55,transparent);background-repeat:no-repeat}
#svg{width:100%;height:100%;display:block;cursor:grab;position:relative;z-index:1}
#svg.drag{cursor:grabbing}
.region{fill:#161e3a;stroke:#6f9bf0;stroke-width:1.1;stroke-opacity:.7;transition:fill .15s}
.region:hover{fill:#28356e}
/* Island maps: the single island shape is decorative — don't let it grab taps
   (no sticky hover-highlight on touch, POI markers stay easy to tap). Pan still
   works via the svg background. */
#gR.noint .region{pointer-events:none}
#gR.noint .region:hover{fill:#161e3a}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#0a0f20;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#7cc0ff;filter:drop-shadow(0 0 2.4px #4aa6ff)}
.poi.g-sight circle{fill:#fcd34d;filter:drop-shadow(0 0 2.4px #f5b528)}
.poi.g-nature circle{fill:#4ade80;filter:drop-shadow(0 0 2.4px #22c55e)}
.poi.g-history circle{fill:#d0a6ff;filter:drop-shadow(0 0 2.4px #b266ff)}
.poi.g-industry circle{fill:#ffb066;filter:drop-shadow(0 0 2.4px #fb923c)}
.poi.g-other circle{fill:#b8c0cc;filter:drop-shadow(0 0 2px #9ca3af)}
.poi.dim{opacity:.16;pointer-events:none}
.poi.dim circle{filter:none}
.poi,.cluster{transition:opacity .2s}
#svg.dim-pois .poi,#svg.dim-pois .cluster{opacity:.1!important}
#svg.dim-pois .poi circle{filter:none}
.poi.match{pointer-events:auto}
.poi.match circle{stroke:#fff;stroke-width:2;filter:drop-shadow(0 0 4px #fff)}
.poi:hover circle,.poi.active circle{r:7.5;fill:#fff;opacity:1;filter:drop-shadow(0 0 6px #cfeaff) drop-shadow(0 0 11px #7fd0ff)}
.poi-metro{cursor:pointer}
.poi-metro .pm-halo{fill:#ffd54a;opacity:.18;animation:pmpulse 2.2s ease-in-out infinite}
.poi-metro .pm-ring{fill:none;stroke:#ffd54a;stroke-width:1.6;opacity:.85}
.poi-metro .pm-dot{fill:#fff;filter:drop-shadow(0 0 5px #ffd54a)}
.poi-metro .pm-label{fill:#fff;font-size:11px;font-weight:800;paint-order:stroke;stroke:#06061b;stroke-width:3.2px;stroke-linejoin:round;letter-spacing:.2px}
.poi-metro:hover .pm-ring,.poi-metro:focus .pm-ring{stroke-width:2.4;opacity:1}
.poi-metro:hover .pm-label{fill:#ffe98a}
@keyframes pmpulse{0%,100%{opacity:.16;transform:scale(1)}50%{opacity:.34;transform:scale(1.18)}}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:rgba(11,19,35,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(120,180,255,.3);border-radius:18px 18px 0 0;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -12px 44px rgba(0,0,0,.6)}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a,.popup .list .nl{display:flex;align-items:center;gap:.6rem;padding:.4rem .45rem;border-radius:10px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:hover,.popup .list a:active{background:rgba(120,180,255,.12)}
.popup .list .lthumb{width:42px;height:42px;border-radius:9px;flex-shrink:0;background:#1a2740 center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.popup .list .lthumb .dot{width:9px;height:9px;border-radius:50%}
.popup .list .lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.popup .list .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.popup .list .g{font-size:.64rem;color:#9fc4ff;text-transform:uppercase;letter-spacing:.04em}
.popup .list .lgo{color:#7fb0ff;font-size:1.2rem;font-weight:700;flex-shrink:0;padding-right:.3rem}
.popup .list .nl{color:#ffffffb0;font-style:normal}
.mapcard{position:fixed;z-index:20;width:max-content;min-width:150px;max-width:230px;background:rgba(11,19,35,.82);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);border:1px solid rgba(120,180,255,.34);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.62),0 0 0 1px rgba(120,180,255,.08);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-100%) translateY(-15px) scale(.95);transform-origin:bottom center;transition:opacity .16s,transform .16s}
.mapcard.open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-100%) translateY(-15px) scale(1)}
.mapcard--below{transform:translate(-50%,0) translateY(15px) scale(.95);transform-origin:top center}
.mapcard--below.open{transform:translate(-50%,0) translateY(15px) scale(1)}
.mapcard::after{content:"";position:absolute;left:var(--ax,50%);top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(11,19,35,.82)}
.mapcard--below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:rgba(11,19,35,.82)}
.mapcard .mc-img{width:100%;aspect-ratio:16/9;background:#1a2740 center/cover no-repeat;display:none;border-radius:13px 13px 0 0}
.mapcard .mc-img.has{display:block}
.mapcard .mc-body{padding:9px 11px 11px}
.mapcard .mc-type{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#7fb0ff;font-weight:700}
.mapcard .mc-name{font-size:.95rem;font-weight:800;color:#eef4ff;margin:1px 0 5px;line-height:1.2}
.mapcard .mc-desc{font-size:.76rem;color:#cfe0ff;line-height:1.4;margin:0 0 9px;display:none}
.mapcard .mc-desc.show{display:block}
.mapcard .mc-more{display:inline-block;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;text-decoration:none;font-weight:700;font-size:.78rem;padding:.42rem .75rem;border-radius:8px}
.mapcard .mc-x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:.95rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.burst{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}
.burst.open{display:block}
.burst-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst-line{stroke:rgba(120,185,255,.4);stroke-width:1.1;stroke-linecap:round;animation:burstFade .25s ease-out}
.burst-core{fill:#cdeeff;filter:drop-shadow(0 0 5px #7fd0ff)}
.burst-dots{position:absolute;inset:0}
.burst-dot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;animation:burstPop .22s ease-out}
.burst-dot .bd{width:15px;height:15px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(8,16,34,.6),0 0 10px currentColor;transition:transform .12s}
.burst-dot:hover .bd,.burst-dot:focus-visible .bd{transform:scale(1.3)}
.burst-dot .bl{font-size:.72rem;font-weight:700;color:#eef4ff;background:rgba(8,14,28,.82);border:1px solid rgba(120,180,255,.25);padding:1.5px 6px;border-radius:7px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
@keyframes burstPop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes burstFade{from{opacity:0}to{opacity:1}}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}
</style>

const POI_CARD={"belem-cities-v2":{"i":"/poi-images/belem-cities-v2.webp","s":"Belém egy békés település Mé-Zóchi zöld lankáin, ahol az élet harmóniában telik a természettel.","f":["Kiváló trópusi gyümölcsleveiről és lekvárjairól ismert.","A felföldi botanikai expedíciók fontos kiindulópontja."]},"porto-alegre-cities-v2":{"i":"/poi-images/porto-alegre-cities-v2.webp","s":"Porto Alegre a paradicsom déli kapuja, ahol az idő megáll az Ilhéu das Rolas fehér homokos strandjain.","f":["Az Ilhéu das Rolas (Egyenlítő-sziget) felé tartó forgalom fő kikötője.","Érintetlen strandjairól ismert, mint például a Praia Piscina."]},"ponta-do-sol-cities-v2":{"i":"/poi-images/ponta-do-sol-cities-v2.webp","s":"Ponta do Sol Príncipe legészaknyugatibb pontja, ahol a nap az Atlanti-óceánt aranyszínű tengerévé változtatja, mielőtt a horizont mögé süllyedne.","f":["Príncipe szigetének legészakibb pontja.","Híres az óceán feletti látványos naplementéiről."]},"sao-tome-cities-v2":{"i":"/poi-images/sao-tome-cities-v2.webp","s":"São Tomé a szigetország lüktető fővárosa, ahol a gyarmati építészet és a trópusi életérzés találkozik.","f":["A várost 1485-ben alapították a portugálok.","Itt található a történelmi São Sebastião erőd a parton."]},"pantufo-cities-v2":{"i":"/poi-images/pantufo-cities-v2.webp","s":"Pantufo egy hagyományőrző halászfalu a főváros szélén, ahol az idő lassabban telik.","f":["Kiváló tengerparti haléttermeiről ismert.","São Tomé halpiacának egyik legfontosabb beszállítója."]},"cruzeiro-cities-v2":{"i":"/poi-images/cruzeiro-cities-v2.webp","s":"Cruzeiro a főváros mögötti zöld dombok között fészkel, széles kilátást nyújtva az Atlanti-óceánra.","f":["A régió fontos oktatási intézményeinek ad otthont.","A főváros egyik kedvelt lakónegyedének számít."]},"bobo-forro-cities-v2":{"i":"/poi-images/bobo-forro-cities-v2.webp","s":"Bobo Forro a főváros szélén fekvő lüktető, népi szív, ahol a forro kultúra a legélénkebb.","f":["A hagyományos táncok és zenei fesztiválok központja.","Élénk piacairól és kézműves műhelyeiről ismert."]},"praia-melao-cities-v2":{"i":"/poi-images/praia-melao-cities-v2.webp","s":"Praia Melão Água Grande déli partján húzódik, ahol a tenger habjai benedvesítik a magas pálmákat.","f":["Az ország egyik legfontosabb sörfőzdéjének ad otthont.","Népszerű hely a fővárosból induló hétvégi kirándulásokhoz."]},"quinta-da-favorita-cities-v2":{"i":"/poi-images/quinta-da-favorita-cities-v2.webp","s":"Quinta da Favorita a nyugalom zöld oázisa a főváros északi részén, ahol a gyarmati múlt tovább él a pompás kertekben.","f":["Egykor egzotikus gyümölcsök jelentős ültetvénye volt.","Építészetileg értékes gyarmati épületeiről ismert."]},"santana-cities-v2":{"i":"/poi-images/santana-cities-v2.webp","s":"Santana, Cantagalo körzet fővárosa, egy öbölbe simulva néz a titokzatos Santana-szigetre.","f":["Cantagalo körzet fővárosa a keleti parton.","A legjobb kiindulópont a Santana-szigetre (Ilhéu de Santana) induló kirándulásokhoz."]},"ribeira-afonso-cities-v2":{"i":"/poi-images/ribeira-afonso-cities-v2.webp","s":"Ribeira Afonso a zord parti szépség helye, ahol az azonos nevű folyó erőteljesen ömlik az Atlanti-óceánba.","f":["Lenyűgöző torkolati tájairól ismert.","Történelmileg fontos helyszín a kakaó elszállításában."]},"uba-budo-cities-v2":{"i":"/poi-images/uba-budo-cities-v2.webp","s":"Uba Budo mélyen Cantagalo hátországában fekszik, smaragdzöld dzsungeltengerrel körülvéve.","f":["A kiváló minőségű feketebors termesztésének jelentős központja.","Egy történelmi roça-nak (ültetvénynek) ad otthont jól megőrzött épületekkel."]},"sao-joao-dos-angolares-cities-v2":{"i":"/poi-images/sao-joao-dos-angolares-cities-v2.webp","s":"São João dos Angolares egy büszke kultúra bölcsője, amelynek gyökerei egy évszázadokkal ezelőtti hajótöréshez nyúlnak vissza.","f":["Az angolaresek etnikai csoportjának otthona, akik hajótörött rabszolgák leszármazottai.","A Roça São João-ról ismert, amely a művészet és a gasztronómia elismert központja."]},"dona-augusta-cities-v2":{"i":"/poi-images/dona-augusta-cities-v2.webp","s":"Dona Augusta rejtve fekszik a vad délkeleti parton, ahol az Obô-erdő és a megszelídíthetetlen Atlanti-óceán találkozik.","f":["A közelben lenyűgöző bazaltformációk találhatók a parton.","Ritka trópusi madarak fontos költőhelye."]},"ribeira-peixe-cities-v2":{"i":"/poi-images/ribeira-peixe-cities-v2.webp","s":"Ribeira Peixe egy élénk közösség a mély délen, amely az ország egyik legforgalmasabb olajpálma-ültetvénye köré szerveződött.","f":["A pálmaolaj-termelés központja São Tomé déli részén.","Modern gyáregységgel rendelkezik a pálmagyümölcs feldolgozásához."]},"neves-cities-v2":{"i":"/poi-images/neves-cities-v2.webp","s":"Neves, a nyugat ipari központja, egy olyan kikötőváros, ahol a történelem visszhangja hangosan cseng.","f":["Az ország legfontosabb ipari központja egy nagy sörfőzdével.","Lembá körzet fővárosa az északnyugati parton."]},"santa-catarina-cities-v2":{"i":"/poi-images/santa-catarina-cities-v2.webp","s":"Santa Catarina az aszfaltozott út végét jelzi a nyugati parton, ahol a civilizáció kezet nyújt a fenséges Obô-erdőnek.","f":["Az utolsó szilárd burkolatú úton elérhető település nyugaton.","Hozzáférést biztosít a sziget egyik legtávolabbi vízeséséhez."]},"diogo-vaz-cities-v2":{"i":"/poi-images/diogo-vaz-cities-v2.webp","s":"Diogo Vaz a csokoládéról álmodik, hiszen itt a világ egyik legjobb kakaóját dolgozzák fel gondossággal és szeretettel.","f":["Egy világszerte ismert ínyenc csokoládémárka névadója.","Az ország egyik legmodernebb kakaófeldolgozó üzemének ad otthont."]},"henrique-cities-v2":{"i":"/poi-images/henrique-cities-v2.webp","s":"Henrique magasan a Lembá körzet lankáin fekszik, ahonnan a kilátás a smaragdzöld erdőkön át egészen a csillogó Atlanti-óceánig ér.","f":["A valódi Bourbon-vanília termesztésének fontos központja.","Túraútvonalakat kínál a nyugati rész legmagasabb pontjaihoz."]},"ponta-figo-cities-v2":{"i":"/poi-images/ponta-figo-cities-v2.webp","s":"Ponta Figo a tenger és a szárazföld találkozásának helye, ahol a sziklák kőőrként vigyázzák a nyugatot.","f":["Stratégiai pont a bálnák megfigyelésére a szezon idején.","Lembá körzet egyik legrégebbi általános iskolájával rendelkezik."]},"generosa-cities-v2":{"i":"/poi-images/generosa-cities-v2.webp","s":"Generosa méltán viseli nevét, hiszen a föld itt olyan bőkezű, hogy a gyümölcsöskertek szinte egész évben teremnek.","f":["A helyi piac egyik jelentős bióbanán-termelője.","Hagyományos gyógynövénykertjeiről ismert."]},"guadalupe-cities-v2":{"i":"/poi-images/guadalupe-cities-v2.webp","s":"Guadalupe, Lobata körzet büszke fővárosa, a történelem és a hit helye, melynek szíve a főtéren álló jellegzetes templom.","f":["Lobata körzet fővárosa a sziget északi részén.","Egy fontos mezőgazdasági kutatóközpontnak ad otthont."]},"santo-amaro-cities-v2":{"i":"/poi-images/santo-amaro-cities-v2.webp","s":"Santo Amaro egy forgalmas település az északra vezető főút mentén, ahol a kereskedelem és a kézművesség virágzik.","f":["Stratégiai közlekedési csomópont Lobata körzetben.","Ügyes asztalosairól és bútorasztalosairól ismert."]},"conde-cities-v2":{"i":"/poi-images/conde-cities-v2.webp","s":"Conde Lobata lágy dombjai között fekszik, ahol a talaj különösen gazdag ásványi anyagokban, erőt adva a növényeknek.","f":["A gyökérzöldségek és gumós növények fontos termesztési területe.","Helyi agyagból készült hagyományos fazekasáruiról ismert."]},"micolo-cities-v2":{"i":"/poi-images/micolo-cities-v2.webp","s":"Micolo egy festői parti település északon, ahol a homok olyan finom, hogy énekel a lábak alatt.","f":["Híres gyönyörű, gyakran néptelen strandjairól.","A partmenti madarak védelme szempontjából fontos ökoszisztéma."]},"fernao-dias-cities-v2":{"i":"/poi-images/fernao-dias-cities-v2.webp","s":"Fernão Dias egy felfedező nevét viseli, és mindmáig őrzi a kalandvágy szellemét az északi parton.","f":["A 19. század történelmi kakaórakodó kikötője.","A sziget néhány legjobb naplemente-megfigyelő helyét kínálja."]},"agostinho-neto-cities-v2":{"i":"/poi-images/agostinho-neto-cities-v2.webp","s":"Agostinho Neto, korábbi nevén Rio do Ouro, az ültetvényes kultúra monumentális tanúja, amely szinte önálló városként hat a dzsungelben.","f":["Az ország legnagyobb történelmi roça-ja (ültetvénye).","Lenyűgöző neoklasszicista stílusú kórházépületnek ad otthont."]},"boa-entrada-cities-v2":{"i":"/poi-images/boa-entrada-cities-v2.webp","s":"Boa Entrada rászolgált a nevére: óriási fákból álló fasorral fogadja a látogatókat, amelyek szinte az eget érintik.","f":["A 'Jequitibá'-ról, a sziget egyik legnagyobb és legöregebb fájáról ismert.","Jelentős, erős kulturális identitással bíró roça-nak ad otthont."]},"canavial-cities-v2":{"i":"/poi-images/canavial-cities-v2.webp","s":"Canavial az ellentétek helye, ahol a parti sáv lapos mezői találkoznak az északi rész első magaslataival.","f":["Hagyományos szarvasmarhafajták tartásának fontos területe.","A helyi cukornád-pálinka (Grogue) készítéséről ismert."]},"blublu-cities-v2":{"i":"/poi-images/blublu-cities-v2.webp","s":"Blublu Guadalupe élénk elővárosa, ahol a Lobata-folyó vize adta a település nevét és ritmusát.","f":["A Lobata-folyó menti termékeny hordalékos talajáról ismert.","A régió friss zöldséggel való ellátásának egyik fontos központja."]},"trindade-cities-v2":{"i":"/poi-images/trindade-cities-v2.webp","s":"Trindade, Mé-Zóchi fővárosa, büszkén fekszik a sziget termékeny középső területein, ahol a levegő hűvösebb, a talaj pedig mélyfekete.","f":["São Tomé szigetének második legnagyobb városa.","Történelmileg az 1953-as 'batepái mészárlásról' ismert."]},"madalena-cities-v2":{"i":"/poi-images/madalena-cities-v2.webp","s":"Madalena Trindade egy csendes elővárosa, ahol a kertek olyan dúsan virágoznak, hogy kis dzsungelnek tűnnek.","f":["Kiváló minőségű fűszerek, például szegfűszeg és fahéj termesztéséről ismert.","A hagyományos São Tomé-i receptek megőrzésének fontos helyszíne."]},"bombom-cities-v2":{"i":"/poi-images/bombom-cities-v2.webp","s":"Bombom a főváros szélén fekvő, nyüzsgő település, ahol a városi élet és a vidéki nyugalom egyensúlyban van.","f":["A helyi közlekedés egyik fontos csomópontja.","Változatos kézműves termékeiről ismert."]},"almas-cities-v2":{"i":"/poi-images/almas-cities-v2.webp","s":"Almas Mé-Zóchi lágy fennsíkjain fekszik, ahol az ősök lelke suttogni látszik az ősi kávéfák között.","f":["A sziget egyik legrégebbi kávétermesztő vidéke.","Építészetileg egyedülálló kőházairól ismert."]},"caixao-grande-cities-v2":{"i":"/poi-images/caixao-grande-cities-v2.webp","s":"Caixão Grande egy nyüzsgő település, amelynek jellegét a belső területek egyik fontos közlekedési csomópontja határozza meg.","f":["Az észak és dél közötti kereskedelem fontos csomópontja.","Élénk zenei életéről és helyi tánccsoportjairól ismert."]},"santa-margarida-cities-v2":{"i":"/poi-images/santa-margarida-cities-v2.webp","s":"Santa Margarida Mé-Zóchi zöld labirintusában rejtőzik, egy hely, ahol az erdő csendjét csak a távoli vízesések zúgása szakítja meg.","f":["A közelben található a belső területek egyik legmagasabb vízesése.","A hagyományos São Tomé-i gyógynövények tanulmányozásának fontos központja."]},"milagrosa-cities-v2":{"i":"/poi-images/milagrosa-cities-v2.webp","s":"Milagrosa a természet csodája előtti tisztelgésként viseli nevét, amely ezt a helyet hihetetlen termékenységgel áldotta meg.","f":["Az aromás feketebors egyik jelentős termelője.","Vallási körmeneteiről és ünnepeiről ismert."]},"batepa-cities-v2":{"i":"/poi-images/batepa-cities-v2.webp","s":"Batepá fájdalmas történelmi jelentőségű hely, ahol az 1953-as mészárlás emléke mélyen meghatározza az emberek identitását.","f":["Az 1953-as tragikus események központi helyszíne.","A függetlenség hőseinek szentelt fontos emlékműnek ad otthont."]},"monte-cafe-cities-v2":{"i":"/poi-images/monte-cafe-cities-v2.webp","s":"Monte Café fenségesen fekszik Mé-Zóchi felhőbe burkolózó hegyei között, a kávétermesztés történelmi központjaként, amely megőrizte egy letűnt korszak báját.","f":["1858-ban alapították, az egyik legrégebbi és legjelentősebb ültetvény.","Itt található a Kávémúzeum, amely dokumentálja a termesztés történetét."]},"santo-antonio-cities-v2":{"i":"/poi-images/santo-antonio-cities-v2.webp","s":"Santo António, Príncipe szigetének bájos fővárosa, a Palhota-folyó partjához simuló település.","f":["Príncipe autonóm régió fővárosa, a világ egyik legkisebb fővárosa.","Jól megőrzött portugál gyarmati építészetéről ismert."]},"terreiro-velho-cities-v2":{"i":"/poi-images/terreiro-velho-cities-v2.webp","s":"Terreiro Velho az a hely, ahol a csokoládéálmok valóra válnak, magasan Príncipe dombjai között, kilátással a végtelen óceánra.","f":["Claudio Corallo világhírű kakaóültetvényeinek otthona.","Príncipe déli csücskére nyíló leglátványosabb panorámák egyikét kínálja."]},"sundy-cities-v2":{"i":"/poi-images/sundy-cities-v2.webp","s":"Sundy a tudomány és a csillagok helye, Észak-Príncipe lágy síkságai között.","f":["Sir Arthur Eddington híres 1919-es napfogyatkozás-expedíciójának helyszíne.","Egy luxus öko-üdülőhelynek ad otthont egy történelmi udvarházban."]},"belo-monte-cities-v2":{"i":"/poi-images/belo-monte-cities-v2.webp","s":"Belo Monte Príncipe északkeleti nyúlványán trónol, a szigetcsoport talán leglélegzetelállítóbb kilátását kínálva.","f":["A világ egyik legszebb kilátópontjával rendelkezik a Banana Beach-re.","Egy neves szállodának és egy természetvédelmi központnak ad otthont."]},"paciencia-cities-v2":{"i":"/poi-images/paciencia-cities-v2.webp","s":"Paciência Príncipe esőerdőinek szélén fekszik, egy hely, ahol a név kötelez: a természet nyugalma gyógyítja a lelket.","f":["A vadbors és a szegfűszeg betakarításának fontos központja.","Hagyományos gyógyító közösségéről ismert."]},"nova-estrela-cities-v2":{"i":"/poi-images/nova-estrela-cities-v2.webp","s":"Nova Estrela úgy fekszik Príncipe keleti partjának szikláin, mint egy csillogó ékszer; az új remény és a tágas horizontok helye.","f":["Príncipe egyik legjobb helyszíne az éjszakai égbolt megfigyelésére.","Modern halászati szövetkezetéről ismert."]},"picao-cities-v2":{"i":"/poi-images/picao-cities-v2.webp","s":"Picão a színek és a dús zöld helye, Príncipe hegyvidéki hátországában rejtőzve.","f":["A biológiai termesztésű Cinchona (kínafa) egyik fontos központja.","Az endemikus papagájok változatos populációjáról ismert."]},"sao-joaquim-cities-v2":{"i":"/poi-images/sao-joaquim-cities-v2.webp","s":"São Joaquim történelmi hangulatú tanya Príncipe szívében, ahol egy régi roça romjai az idő erejéről mesélnek.","f":["Egy régi ültetvény néhány legjobban megőrzött hidraulikus berendezésének ad otthont.","A helyi flóra kutatásának egyik fontos helyszíne."]},"esperanca-cities-v2":{"i":"/poi-images/esperanca-cities-v2.webp","s":"Esperança a remény nevét viseli, és Príncipe belső területeinek életörömének ragyogó példája.","f":["Egzotikus gyümölcsök, például papaya és mangó jelentős termelője.","Lelkes ifjúsági környezetvédelmi projektjeiről ismert."]},"abade-cities-v2":{"i":"/poi-images/abade-cities-v2.webp","s":"Abade egy halásztelepülés Príncipe északkeleti partján, ahol az Atlanti-óceán ritka szelídséggel gördül a partra.","f":["Santo António friss hallal való ellátásának egyik legfontosabb központja.","Csendes és védett öbleiről ismert, amelyek kiválóak úszáshoz."]},"maria-correia-cities-v2":{"i":"/poi-images/maria-correia-cities-v2.webp","s":"Maria Correia Príncipe vad nyugati partján fekszik, ahol az óceán ereje évezredek alatt formálta a sziklákat.","f":["Hozzáférést biztosít a sziget néhány legdrámaibb sziklás partvidékéhez.","Történelmi telepes nőkről szóló történeteiről ismert."]},"pantufo-sao-tome-cities-v2":{"i":"/poi-images/pantufo-sao-tome-cities-v2.webp","s":"Pantufo ezen része a történelmi halászfalu modern kiterjesztése, ahol a főváros városi növekedése már érezhető.","f":["Feltörekvő lakónegyed számos új építési projekttel.","Élénk tengerparti gasztronómiájáról ismert."]},"henrique-lemba-cities-v2":{"i":"/poi-images/henrique-lemba-cities-v2.webp","s":"Ez a Lembá-felföldön található település a hegyek vadságáról és azon parasztok kemény munkájáról szól, akik termékeny mezőket hódítanak el a lejtőktől.","f":["A hagyományos gyógyító tudás fontos tárháza.","Kiváló minőségű kávé-kisültetvényeiről ismert."]},"blublu-lobata-cities-v2":{"i":"/poi-images/blublu-lobata-cities-v2.webp","s":"Blublu ezen magasabban fekvő része tágas kilátást nyújt Lobata termékeny síkságaitól egészen a csillogó tengerig.","f":["Lobata növekvő középosztályának kedvelt lakóövezete.","Építészetileg érdekes modern magánházairól ismert."]},"bombom-me-zochi-cities-v2":{"i":"/poi-images/bombom-me-zochi-cities-v2.webp","s":"Mé-Zóchi körzet Bombom települése a termékeny dombok és a szívélyes találkozások helye.","f":["Az aromás kakaóbab egyik jelentős termelője.","Élénk közösségéről és helyi ünnepeiről ismert."]},"belo-monte-principe-cities-v2":{"i":"/poi-images/belo-monte-principe-cities-v2.webp","s":"Belo Monte ezen része mélyebbre vezet Príncipe zabolátlan belsejébe, ahol az őserdei óriásfák elsötétítik az eget.","f":["Az endemikus növényfajok egyik fontos védelmi területe.","Látványos madármegfigyelési lehetőségeiről ismert."]},"sandy-principe-cities-v2":{"i":"/poi-images/sandy-principe-cities-v2.webp","s":"Sundy tengerparti része a tágas strandok és a mélykék tenger helye, ahol az Atlanti-óceán teljes szépségét megmutatja.","f":["Híres a partközeli érintetlen korallzátonyairól.","A tengeri teknősök fontos költőhelye a szezon idején."]},"paciencia-principe-interior-cities-v2":{"i":"/poi-images/paciencia-principe-interior-cities-v2.webp","s":"Paciência felső faluja Príncipe meredek hegyeinek lábánál fekszik, a hűvös reggelek és a mély csend helye.","f":["A helyi legendák és mítoszok megőrzésének fontos központja.","A föld tiszteletére rendezett hagyományos ceremóniáiról ismert."]},"ponta-do-sol-principe-north-cities-v2":{"i":"/poi-images/ponta-do-sol-principe-north-cities-v2.webp","s":"Ponta do Sol északi része a tágas kilátások és a zabolátlan tengeri levegő helye, ahol a horizont határtalannak tűnik.","f":["Az egész régió egyik legjellegzetesebb partvonalával rendelkezik.","Az északi halászati területek ellenőrzésének fontos pontja."]},"nova-estrela-principe-east-cities-v2":{"i":"/poi-images/nova-estrela-principe-east-cities-v2.webp","s":"Nova Estrela Príncipe keleti részén a fény és a tengeri életerő helye, ahol a nap a hullámok csillogásával kezdődik.","f":["A hagyományos kézműves halászat egyik jelentős központja.","Színpompás tengeri körmeneteiről ismert."]},"picao-principe-hills-cities-v2":{"i":"/poi-images/picao-principe-hills-cities-v2.webp","s":"Picão dombvidéke a zöld oázisa, ahol a felhők gyakran lágyan simogatják az őserdei óriások lombkoronáját.","f":["A ritka piment és fahéj fontos termesztési területe.","Hűvös és frissítő hegyi levegőjéről ismert."]},"sao-joaquim-principe-forest-cities-v2":{"i":"/poi-images/sao-joaquim-principe-forest-cities-v2.webp","s":"São Joaquim erdőszéli része az átmenet helye, ahol a civilizáció kezet nyújt a sűrű Obô-dzsungelnek.","f":["A helyi etnobotanikai kutatások fontos területe.","Hagyományos erdei méhészcéheiről ismert."]},"esperanca-principe-valley-cities-v2":{"i":"/poi-images/esperanca-principe-valley-cities-v2.webp","s":"Esperança völgye a nyugalom és a termékenység oázisa, ahol az élet ráérős ütemben zajlik.","f":["A hagyományos São Tomé-i gyökérzöldségek egyik jelentős termelője.","Csendes és békés életmódjáról ismert."]},"abade-principe-north-cities-v2":{"i":"/poi-images/abade-principe-north-cities-v2.webp","s":"Abade északi része a tágas horizontok és a tengeri szabadság helye, ahol a tekintet határtalanul kalandozhat az Atlanti-óceán felett.","f":["Az északkeleti partvédelmi ellenőrzés egyik fontos támaszpontja.","Robusztus halászcsónakjairól és tapasztalt navigátorairól ismert."]},"maria-correia-principe-west-cities-v2":{"i":"/poi-images/maria-correia-principe-west-cities-v2.webp","s":"Príncipe nyugati részén Maria Correia a vadság és a zabolátlan tengeri levegő helye, ahol az Atlanti-óceán teljes őserővel mutatkozik meg.","f":["A nyugati tengeri élővilág fontos védelmi területe.","Drámai sziklaformációiról és barlangjairól ismert."]},"pantufo-agua-grande-coast-cities-v2":{"i":"/poi-images/pantufo-agua-grande-coast-cities-v2.webp","s":"Pantufo partvidéke Água Grande tengeri identitásának szíve, ahol a napi fogást közvetlenül a parton ünneplik.","f":["A hagyományos halászhajó-javítás egyik jelentős helyszíne.","Kiváló esti sült hal-piacairól ismert."]},"henrique-lemba-plateau-cities-v2":{"i":"/poi-images/henrique-lemba-plateau-cities-v2.webp","s":"Henrique fennsíkja fenséges kilátást nyújt São Tomé nyugati részére, a hűvös levegő és a tágas terek helye.","f":["A veszélyeztetett hegyi növények megőrzésének fontos helyszíne.","Kiváló minőségű biológiai borstermeléséről ismert."]},"blublu-lobata-river-cities-v2":{"i":"/poi-images/blublu-lobata-river-cities-v2.webp","s":"Blublu folyópartján az élet a folyó vízének ütemére lüktet, a vitalitás és a természetes közösség helye.","f":["A friss regionális zöldségtermesztés egyik jelentős központja.","Hagyományos folyóparti vízi ünnepeiről ismert."]},"bombom-me-zochi-plateau-cities-v2":{"i":"/poi-images/bombom-me-zochi-plateau-cities-v2.webp","s":"Mé-Zóchi Bombom-fennsíkja a tágas kilátások és a termékeny dombok helye, ahol az élet egyenletes ütemben zajlik.","f":["A kiváló minőségű biokávé egyik jelentős termelője.","Építészetileg érdekes hagyományos lakóházairól ismert."]},"belo-monte-principe-coast-cities-v2":{"i":"/poi-images/belo-monte-principe-coast-cities-v2.webp","s":"Belo Monte tengerparti része a drámai sziklák és az azúrkék tenger helye, ahol az Atlanti-óceán teljes őserővel mutatkozik meg.","f":["A partvidék néhány leglátványosabb természetes ívével és barlangjával rendelkezik.","Ritka tengeri madarak fontos költőhelye az északkeleti részen."]},"sandy-principe-north-cities-v2":{"i":"/poi-images/sandy-principe-north-cities-v2.webp","s":"Sundy északi része a tágas síkságok és a tudományos kíváncsiság helye, ahol a tekintet határtalannak tűnik.","f":["A modern csillagászati megfigyelések egyik fontos helyszíne.","Lelkes természettudományi oktatási kezdeményezéseiről ismert."]},"paciencia-principe-coast-cities-v2":{"i":"/poi-images/paciencia-principe-coast-cities-v2.webp","s":"Paciência tengerparti része a lágy öblök és a ritmikus tengerzúgás helye, ahol az idő megállni látszik az aranyszínű strandokon.","f":["Híres védett lagúnáiról, amelyek ideálisak a fiatal halak számára.","A veszélyeztetett vízimadarak fontos költőhelye az északkeleti parton."]},"schokoladenmanufaktur-corallo-economic-v2":{"i":"/poi-images/schokoladenmanufaktur-corallo-economic-v2.webp","s":"Ez a világhírű manufaktúra São Tomé fővárosában a Príncipe-szigetről származó legfinomabb kakaót dolgozza fel díjnyertes csokoládékülönlegességekké.","f":["Saját Príncipe-szigeti ültetvényéről származó kakaót használ.","Rendkívül magas kakaótartalmú csokoládéiról ismert."]},"brauerei-rosema-economic-v2":{"i":"/poi-images/brauerei-rosema-economic-v2.webp","s":"A nevesi Rosema sörfőzde São Tomé legjelentősebb italgyártó üzeme és a nemzeti ipar jelképe.","f":["São Tomé és Príncipe legnagyobb sörfőzdéje.","A sört hagyományosan címke nélküli barna üvegekben árulják."]},"wasserkraftwerk-contador-economic-v2":{"i":"/poi-images/wasserkraftwerk-contador-economic-v2.webp","s":"A Contador vízerőmű a hasonló nevű folyó természetes energiáját használja fel, hogy fedezze São Tomé sziget áramszükségletének jelentős részét.","f":["A tiszta energia legfontosabb forrása a főszigeten.","Csatornák és ejtőcsövek rendszerét használja a hegységben."]},"oelmuehle-ribeira-peixe-economic-v2":{"i":"/poi-images/oelmuehle-ribeira-peixe-economic-v2.webp","s":"A Ribeira Peixe-i hatalmas olajpálma-ültetvények szívében található ez a modern olajmalom, amely a nyersolajat vonja ki az olajpálma gyümölcseiből.","f":["Az ország modernizált pálmaolaj-iparának központja.","Naponta több tonna friss pálmagyümölcsöt dolgoz fel."]},"fischereihafen-pantufo-economic-v2":{"i":"/poi-images/fischereihafen-pantufo-economic-v2.webp","s":"A pantufoi halászkikötő a tenger gyümölcseinek egyik legaktívabb rakodóhelye a főváros közelében.","f":["A nagy sárgaúszójú tonhalak fogásáról ismert.","A parti hagyományos halkereskedelem központja."]},"hafen-neves-economic-v2":{"i":"/poi-images/hafen-neves-economic-v2.webp","s":"A sziget északnyugati részén található nevesi ipari kikötő üzemanyagok és ipari javak rakodására specializálódott.","f":["Az egyetlen kikötő speciális olaj- és gáztartályokkal.","A nemzetközi tartályhajók fogadásának fontos pontja."]},"solarpark-sao-tome-economic-v2":{"i":"/poi-images/solarpark-sao-tome-economic-v2.webp","s":"A São Tomé-i napelemfarm az ország első nagy projektje, amely az intenzív trópusi napsugárzást használja fel villamosenergia-termelésre.","f":["Az ország első nagyszabású fotovoltaikus projektje.","Hozzájárul a szigetcsoport CO2-kibocsátásának csökkentéséhez."]},"kakaofabrik-cecab-economic-v2":{"i":"/poi-images/kakaofabrik-cecab-economic-v2.webp","s":"A CECAB gyár a São Tomé-i szövetkezeti kakaófeldolgozás központja.","f":["Több mint 2000 minősített kisgazda kakaóját dolgozza fel.","Ínyenc piacok számára szánt kiváló minőségű biokakaóra specializálódott."]},"mineralwasserwerk-bago-bago-economic-v2":{"i":"/poi-images/mineralwasserwerk-bago-bago-economic-v2.webp","s":"Mé-Zóchi hűvös hegyvidékén a Bago-Bago ásványvízüzem a hegység tiszta forrásait használja fel kiváló minőségű ivóvíz palackozásához.","f":["A nemzeti park érintetlen hegyi forrásainak vizét használja.","Piacvezető a palackozott ivóvíz terén São Tomén."]},"fischereihafen-santana-economic-v2":{"i":"/poi-images/fischereihafen-santana-economic-v2.webp","s":"A santanai halászkikötő Cantagalo körzet tengeri központja.","f":["A sziget keleti részének legfontosabb halrakodóhelye.","A kézműves halászat központja Cantagalóban."]},"anlegestelle-porto-alegre-economic-v2":{"i":"/poi-images/anlegestelle-porto-alegre-economic-v2.webp","s":"A mély délen fekvő Porto Alegre-i móló az Ilhéu das Rolas ellátásának legfontosabb logisztikai pontja.","f":["Az Ilhéu das Rolas (Egyenlítő-sziget) felé tartó forgalom központi indulóhelye.","A déli mezőgazdasági termékek fontos rakodóhelye."]},"hafen-santo-antonio-economic-v2":{"i":"/poi-images/hafen-santo-antonio-economic-v2.webp","s":"A Santo António-i logisztikai kikötő a Príncipe-sziget egyetlen tengeri kapcsolata a külvilággal.","f":["A Príncipe-szigetre érkező összes áru fő belépési kapuja.","Speciális tárolóhelyekkel rendelkezik konténerek és üzemanyag számára."]},"kakaolagerhaus-hafen-economic-v2":{"i":"/poi-images/kakaolagerhaus-hafen-economic-v2.webp","s":"A São Tomé-i központi kikötő kakaóraktára a kakaóbab utolsó állomása, mielőtt elindulna a világpiacra.","f":["A kakaóalapú export központi gyűjtőhelye.","Ellenőrzi az exportszállítmányok minőségét és súlyát."]},"werft-sao-tome-economic-v2":{"i":"/poi-images/werft-sao-tome-economic-v2.webp","s":"A São Tomé-i hajógyár a nemzeti flotta karbantartásának és javításának központi létesítménye.","f":["Az ország legfontosabb tengerészeti mérnöki központja.","Biztosítja a szigeti flotta működőképességét."]},"steinbruch-morro-peixe-economic-v2":{"i":"/poi-images/steinbruch-morro-peixe-economic-v2.webp","s":"A Morro Peixe-i kőbánya az egyik legfontosabb építőanyag-forrás São Tomé északi részén.","f":["A bazalt és fonolit kőzet legfőbb beszállítója.","Nyersanyagot biztosít a nemzeti útépítési projektekhez."]},"baustoffwerk-neves-economic-v2":{"i":"/poi-images/baustoffwerk-neves-economic-v2.webp","s":"A nevesi építőanyag-gyár cementblokkok, előre gyártott elemek és más fontos építőanyagok gyártására specializálódott.","f":["Az északnyugati rész cementfeldolgozó központja.","Szabványosított építőelemeket gyárt a magasépítéshez."]},"waermekraftwerk-sao-tome-economic-v2":{"i":"/poi-images/waermekraftwerk-sao-tome-economic-v2.webp","s":"A São Tomé-i hőerőmű a fővár zik a történelmi Nova Moca ültetvény, amely kiváló minőségű Arabica kávétermeléséről világhírű.","f":["A 'királyok kávéjáról' ismert, amelyet egykor európai nemesi udvarokba szállítottak.","Kóstolókat kínálnak közvetlenül az ültetvény történelmi udvarházában."]},"schildkroeten-morro-peixe-life-v2":{"i":"/poi-images/schildkroeten-morro-peixe-life-v2.webp","s":"A Morro Peixe teknőstábor egy elkötelezett természetvédelmi központ az északnyugati parton, amelyet a helyi közösség vezet.","f":["A MARAPA helyi civil szervezet üzemelteti.","Egy kis múzeum tájékoztat a tengeri állatok életciklusáról."]},"kinderzentrum-principe-life-v2":{"i":"/poi-images/kinderzentrum-principe-life-v2.webp","s":"A Santo António-i gyermek szabadidőközpont a játék és az oktatás központja a Príncipe-szigeti gyerekek számára.","f":["Fontos szociális projekt Santo António helyi közössége számára.","Délutáni felügyeletet és kreatív szabadidős tevékenységeket kínál."]},"gewuerzfarm-uba-budo-life-v2":{"i":"/poi-images/gewuerzfarm-uba-budo-life-v2.webp","s":"Cantagalo zöld szívének mélyén fekszik az Uba Budo fűszerfarm, ahol a levegőt a Kelet és a trópusok intenzív illatai töltik meg.","f":["Biológiai termesztésű feketeborsra specializálódott.","A fűszereket még hagyományosan, a napon szárítják."]},"wal-beobachtung-leba-life-v2":{"i":"/poi-images/wal-beobachtung-leba-life-v2.webp","s":"São Tomé nyugati partjainál, Neves közelében található a hosszúszárnyú bálnák éves vándorlásának egyik fontos megfigyelőhelye.","f":["A legjobb megfigyelési időszak a párzási szezonban (júliustól októberig) van.","A bálnák gyakran közvetlenül a partról is láthatók távcsővel."]},"bananen-generosa-life-v2":{"i":"/poi-images/bananen-generosa-life-v2.webp","s":"A sziget nyugati részén található generosai banánültetvény mintapéldája a különböző banánfajták fenntartható termesztésének.","f":["Több mint tíz különböző banánfajtát termel a helyi piacra.","A betakarítási hulladékot komposztálásra használják."]},"korallen-micolo-li -images/ilheu-caroco-nature-v2.webp","s":"Az Ilhéu Caroço, más néven „zsokésapka”, egy drámai, kúp alakú sziklasziget Príncipétől délre.","f":["Jellegzetes, kalaphoz hasonló alakjáról ismert.","Lakatlan és szigorúan védett."]},"rio-caue-nature-v2":{"i":"/poi-images/rio-caue-nature-v2.webp","s":"A Rio Caué São Tomé legdélibbi körzetének élettere, amely az Obô Nemzeti Park szívén folyik keresztül.","f":["Caué körzet legfontosabb folyója.","Hozzáférést biztosít az esőerdő néhány legtávolabbi részéhez."]},"praia-jale-nature-v2":{"i":"/poi-images/praia-jale-nature-v2.webp","s":"A Praia Jalé egy vad, érintetlen tengerpart a mély délen, amely ökológiai jelentőségéről világszerte ismert.","f":["A veszélyeztetett tengeri teknősök legfontosabb fészkelőhelye.","Egy egyszerű, de fontos öko-tábornak ad otthont a természetvédők számára."]},"rio-lemba-nature-v2":{"i":"/poi-images/rio-lemba-nature-v2.webp","s":"A Rio Lembá a sziget nyugati részének legjelentősebb folyója, a természet megszelídíthetetlen erejének szimbóluma.","f":["Lembá körzet legnagyobb folyórendszere.","Az esős évszakban tapasztalható rendkívül gyors áramlatairól ismert."]},"cascata-sao-nicolau-nature-v2":{"i":"/poi-images/cascata-sao-nicolau-nature-v2.webp","s":"A São Nicolau-vízesés a sziget egyik legismertebb és legfotogénebb vízesése, amely Mé-Zóchi körzet hűvös hegyi erdőiben fészkel.","f":["Könnyen elérhető a Monte Café felé vezető útról.","Dús, nedvességkedvelő növényzet veszi körül."]},"rio-agua-grande-nature-v2":{"i":"/poi-images/rio-agua-grande-nature-v2.webp","s":"A Rio Água Grande az a történelmi folyó, amely a fővárosnak és körzetének a nevét adja.","f":["Az ország legnépesebb körzetének névadója.","Döntő szerepet játszott a főváros helyszínének kiválasztásában."]},"golfo-de-guine-nature-v2":{"i":"/poi-images/golfo-de-guine-nature-v2.webp","s":"A Guineai-öböl körülöleli São Tomé és Príncipe egész szigetcsoportját, és a szigetek trópusi éghajlatának bölcsője.","f":["A trópusi Atlanti-óceán része.","Az Egyenlítőnél elfoglalt stratégiai helyzetéről ismert."]},"pico-cabumbe-relief-v2":{"i":"/poi-images/pico-cabumbe-relief-v2.webp","s":"A Pico Cabumbé egy jellegzetes magaslat São Tomé déli részén, amely kiemelkedik a sűrű esőerdőből.","f":["Magassága körülbelül 1403 méter a tengerszint felett.","Az Obô Nemzeti Park déli részén található."]},"pico-ana-chaves-relief-v2":{"i":"/poi-images/pico-ana-chaves-relief-v2.webp","s":"Ez a hegy São Tomé szigetének közepén a legendás Ana Chavesről kapta a nevét.","f":["A szárazföld belsejében, Mé-Zóchi körzetben található.","A csúcsról gyakran nyílik kilátás a központi felföldre."]},"pico-maria-amelia-relief-v2":{"i":"/poi-images/pico-maria-amelia-relief-v2.webp","s":"A Pico Maria Amélia egy másik impozáns csúcs São Tomé déli felföldjén.","f":["São João dos Angolares településtől nyugatra található.","Caué körzet hegyvidéki terepének része."]},"pico-bastiao-relief-v2":{"i":"/poi-images/pico-bastiao-relief-v2.webp","s":"A Pico Bastião egy jellegzetes geológiai képződmény Príncipe szigetén.","f":["Príncipe szigetének keleti részén található.","Fontos tájékozódási pont a sziget belsejében túrázók számára."]},"pico-carvalhal-relief-v2":{"i":"/poi-images/pico-carvalhal-relief-v2.webp","s":"A Mé-Zóchi körzet szívében található Pico Carvalhal Közép-São Tomé hegyvidéki tájának szimbóluma.","f":["A régió termékeny vulkáni talajáról ismert.","Védelmet nyújt a völgyeknek az erős atlanti szelekkel szemben."]},"pico-vinte-e-cinco-relief-v2":{"i":"/poi-images/pico-vinte-e-cinco-relief-v2.webp","s":"Ez a hegy São Tomé távoli délnyugati részén egy vad és megközelíthetetlen régiót jelöl.","f":["A sziget egyik legcsapadékosabb zónájában található.","A sűrű növényzet miatt a hozzáférés nehéz."]},"pico-formoso-relief-v2":{"i":"/poi-images/pico-formoso-relief-v2.webp","s":"A Pico de Formoso, amelynek neve 'Szép Csúcsot' jelent, hű marad elnevezéséhez.","f":["Caué vízellátásának fontos vízgyűjtő területe.","A páratartalom itt szinte egész évben 90% fe ható jellegzetes magaslat, amely a központi hegyvidék kezdetét jelzi.","f":["São Tomé város hegyi panorámájának fontos része.","Vízválasztóként szolgál a helyi patakok számára."]},"principe-rainforest-relief-v2":{"i":"/poi-images/principe-rainforest-relief-v2.webp","s":"Príncipe esőerdője az UNESCO bioszféra-rezervátum része, és Afrika egyik legjobb állapotban megőrzött ökoszisztémájának tartják.","f":["Négyzetkilométerenként több endemikus fajnak ad otthont, mint szinte bármely más hely.","Gyakran az 'afrikai Galapagosként' emlegetik."]},"me-zochi-cloudforest-relief-v2":{"i":"/poi-images/me-zochi-cloudforest-relief-v2.webp","s":"Mé-Zóchi körzet magasabb vidékein terül el a titokzatos köderdő.","f":["A kondenzvíz-képződés fontos forrása.","Otthont ad a ritka São Tomé-i gébicsnek (madárfaj)."]},"porto-alegre-mangrove-relief-v2":{"i":"/poi-images/porto-alegre-mangrove-relief-v2.webp","s":"São Tomé legdélebbi részén, Porto Alegre közelében kiterjedt mocsári mangrovék terülnek el.","f":["São Tomé szigetének legfontosabb mangrovelőhelye.","Legjobban csónakkal fedezhető fel."]},"sao-tome-volcanic-massif-relief-v2":{"i":"/poi-images/sao-tome-volcanic-massif-relief-v2.webp","s":"A központi vulkáni masszívum São Tomé szigetének geológiai gerince.","f":["A masszívum évmilliókkal ezelőtt jött létre hotspot vulkanizmus révén.","Itt találhatók a Guineai-öböl legmagasabb pontjai."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}

function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,pend=false,dx=0,dy=0,sx=0,sy=0,pid=0;
// Drag uses a MOVE THRESHOLD: pointerdown only ARMS panning; we don't capture the
// pointer until it actually moves >4px. A click without movement therefore reaches
// the target's own handler — fixes desktop where setPointerCapture-on-down stole the
// click from .cluster and .region (country) elements (mobile tap was unaffected).
svg.addEventListener('pointerdown',e=>{if(e.isPrimary===false)return;pend=true;dr=false;dx=sx=e.clientX;dy=sy=e.clientY;pid=e.pointerId});
svg.addEventListener('pointermove',e=>{
  if(pend&&!dr){if(Math.hypot(e.clientX-sx,e.clientY-sy)<=4)return;dr=true;svg.classList.add('drag');try{svg.setPointerCapture(pid)}catch(_){}}
  if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()
});
svg.addEventListener('pointerup',()=>{pend=false;if(dr){dr=false;svg.classList.remove('drag');try{svg.releasePointerCapture(pid)}catch(_){}}});
svg.addEventListener('pointercancel',()=>{pend=false;dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false;pend=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Search-only entries (POIs on a sub-map): match by name, navigate to the sub-map.
  const extraHits=[];
  for(const e of SEARCH_EXTRA){if(e.s.includes(q)&&extraHits.length<20)extraHits.push(e)}
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0&&extraHits.length===0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0&&extraHits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  const exRow=e=>'<a data-extra="1" href="'+e.u+'"><span class="dot" style="background:#ffd54a"></span><span class="nm">'+e.n.replace(/[<>]/g,'')+'</span><span class="gr">›</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('')+extraHits.map(exRow).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const ax=e.target.closest('a[data-extra]');
  if(ax)return; // sub-map link: let the browser navigate
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
