.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}

.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}

.popup .single{display:none}.popup .list{display:none}

const POI_CARD={"belem-cities-v2":{"i":"/poi-images/belem-cities-v2.webp","s":"Belém ist ein friedlicher Ort in den grünen Weiten von Mé-Zóchi, in dem das Leben in einem harmonischen Einklang mit der Natur verläuft.","f":["Bekannt für seine exzellenten tropischen Fruchtsäfte und Konfitüren.","Ein wichtiger Ausgangspunkt für botanische Expeditionen ins Hochland."]},"porto-alegre-cities-v2":{"i":"/poi-images/porto-alegre-cities-v2.webp","s":"Porto Alegre ist das südliche Tor zum Paradies, wo die Zeit an den weißen Stränden der Ilhéu das Rolas stillsteht.","f":["Haupthafen für den Transport zur Äquatorinsel Ilhéu das Rolas.","Bekannt für seine unberührten Strände wie Praia Piscina."]},"ponta-do-sol-cities-v2":{"i":"/poi-images/ponta-do-sol-cities-v2.webp","s":"Ponta do Sol ist der nordwestlichste Punkt von Príncipe, wo die Sonne den Atlantik in ein goldenes Meer verwandelt, bevor sie hinter dem Horizont versinkt.","f":["Nördlichster Punkt der Insel Príncipe.","Berühmt für seine spektakulären Sonnenuntergänge über dem Ozean."]},"sao-tome-cities-v2":{"i":"/poi-images/sao-tome-cities-v2.webp","s":"São Tomé ist die pulsierende Hauptstadt des Inselstaates und ein Ort, an dem koloniale Architektur auf tropisches Lebensgefühl trifft.","f":["Die Stadt wurde im Jahr 1485 von den Portugiesen gegründet.","Beherbergt die historische Festung São Sebastião am Ufer."]},"pantufo-cities-v2":{"i":"/poi-images/pantufo-cities-v2.webp","s":"Pantufo ist ein traditionsreiches Fischerdorf am Rande der Hauptstadt, in dem die Zeit langsamer zu vergehen scheint.","f":["Bekannt für seine exzellenten Fischrestaurants am Strand.","Ein wichtiger Lieferant für den Fischmarkt von São Tomé."]},"cruzeiro-cities-v2":{"i":"/poi-images/cruzeiro-cities-v2.webp","s":"Cruzeiro liegt eingebettet in die grünen Hügel hinter der Hauptstadt und bietet einen weiten Blick über den Atlantik.","f":["Beherbergt wichtige Bildungseinrichtungen der Region.","Gilt als eines der bevorzugten Wohnviertel der Hauptstadt."]},"bobo-forro-cities-v2":{"i":"/poi-images/bobo-forro-cities-v2.webp","s":"Bobo Forro ist das pulsierende, volkstümliche Herz am Rande der Hauptstadt, wo die Kultur der Forros am lebendigsten ist.","f":["Ein Zentrum für traditionelle Tänze und Musikfestivals.","Bekannt für seine lebhaften Märkte und handwerklichen Werkstätten."]},"praia-melao-cities-v2":{"i":"/poi-images/praia-melao-cities-v2.webp","s":"Praia Melão erstreckt sich entlang der südlichen Küste von Água Grande, wo die Meeresgischt die hohen Palmen benetzt.","f":["Beherbergt eine der wichtigsten Brauereien des Landes.","Ein beliebter Ort für Wochenendausflüge aus der Hauptstadt."]},"quinta-da-favorita-cities-v2":{"i":"/poi-images/quinta-da-favorita-cities-v2.webp","s":"Quinta da Favorita ist eine grüne Oase der Ruhe im Norden der Hauptstadt, in der die koloniale Vergangenheit in den prächtigen Gärten weiterlebt.","f":["Einst eine bedeutende Plantage für exotische Früchte.","Bekannt für seine architektonisch wertvollen Kolonialbauten."]},"santana-cities-v2":{"i":"/poi-images/santana-cities-v2.webp","s":"Santana, die Hauptstadt des Bezirks Cantagalo, schmiegt sich an eine Bucht mit Blick auf die geheimnisvolle Insel Santana.","f":["Hauptstadt des Bezirks Cantagalo an der Ostküste.","Bietet den besten Ausgangspunkt für Ausflüge zur Ilhéu de Santana."]},"ribeira-afonso-cities-v2":{"i":"/poi-images/ribeira-afonso-cities-v2.webp","s":"Ribeira Afonso ist ein Ort der rauen Küstenschönheit, wo der gleichnamige Fluss kraftvoll in den Atlantik mündet.","f":["Bekannt für seine beeindruckenden Flussmündungslandschaften.","Ein historisch wichtiger Ort für den Abtransport von Kakao."]},"uba-budo-cities-v2":{"i":"/poi-images/uba-budo-cities-v2.webp","s":"Uba Budo liegt tief im Hinterland von Cantagalo, umgeben von einem Meer aus smaragdgrünem Dschungel.","f":["Ein bedeutendes Zentrum für den Anbau von hochwertigem schwarzem Pfeffer.","Beherbergt eine historische Roça (Plantage) mit gut erhaltenen Gebäuden."]},"sao-joao-dos-angolares-cities-v2":{"i":"/poi-images/sao-joao-dos-angolares-cities-v2.webp","s":"São João dos Angolares ist die Wiege einer stolzen Kultur, die ihre Wurzeln in einem Schiffbruch vor Jahrhunderten hat.","f":["Heimat der ethnischen Gruppe der Angolares, Nachfahren schiffbrüchiger Sklaven.","Bekannt für die Roça São João, ein renommiertes Zentrum für Kunst und Gastronomie."]},"dona-augusta-cities-v2":{"i":"/poi-images/dona-augusta-cities-v2.webp","s":"Dona Augusta liegt versteckt an der wilden Südostküste, wo der Obô-Wald auf den ungezähmten Atlantik trifft.","f":["In der Nähe befinden sich beeindruckende Basaltformationen an der Küste.","Ein wichtiger Brutplatz für seltene tropische Vögel."]},"ribeira-peixe-cities-v2":{"i":"/poi-images/ribeira-peixe-cities-v2.webp","s":"Ribeira Peixe ist eine lebendige Gemeinschaft im tiefen Süden, die sich um eine der geschäftigsten Ölpalmenplantagen des Landes entwickelt hat.","f":["Zentrum der Palmölproduktion im Süden von São Tomé.","Besitzt eine moderne Fabrikanlage für die Weiterverarbeitung von Palmfrüchten."]},"neves-cities-v2":{"i":"/poi-images/neves-cities-v2.webp","s":"Neves, das industrielle Kraftzentrum des Westens, ist eine Hafenstadt, in der das Echo der Geschichte laut nachhallt.","f":["Wichtigster Industriestandort des Landes mit einer großen Brauerei.","Hauptstadt des Bezirks Lembá an der Nordwestküste."]},"santa-catarina-cities-v2":{"i":"/poi-images/santa-catarina-cities-v2.webp","s":"Santa Catarina markiert das Ende der asphaltierten Straße an der Westküste, wo die Zivilisation dem majestätischen Obô-Wald die Hand reicht.","f":["Letzter über eine befestigte Straße erreichbare Ort im Westen.","Bietet Zugang zu einem der entlegensten Wasserfälle der Insel."]},"diogo-vaz-cities-v2":{"i":"/poi-images/diogo-vaz-cities-v2.webp","s":"Diogo Vaz ist ein Ort, der von der Schokolade träumt, denn hier wird einer der besten Kakaos der Welt mit Sorgfalt und Liebe verarbeitet.","f":["Namensgeber für eine weltweit bekannte Gourmet-Schokoladenmarke.","Beherbergt eine der modernsten Kakaoverarbeitungsanlagen des Landes."]},"henrique-cities-v2":{"i":"/poi-images/henrique-cities-v2.webp","s":"Henrique liegt hoch oben an den Hängen des Lembá-Bezirks, wo der Blick über die smaragdgrünen Wälder bis zum funkelnden Atlantik reicht.","f":["Ein wichtiges Zentrum für den Anbau von echter Bourbon-Vanille.","Bietet Wanderwege zu einigen der höchsten Punkte des Westens."]},"ponta-figo-cities-v2":{"i":"/poi-images/ponta-figo-cities-v2.webp","s":"Ponta Figo ist ein Ort der Begegnung zwischen Meer und Land, wo die Klippen wie steinerne Wächter über den Westen wachen.","f":["Strategischer Punkt für die Beobachtung von Walen während der Saison.","Besitzt eine der ältesten Grundschulen des Bezirks Lembá."]},"generosa-cities-v2":{"i":"/poi-images/generosa-cities-v2.webp","s":"Generosa trägt ihren Namen zu Recht, denn die Erde hier ist so freigiebig, dass die Obstgärten fast das ganze Jahr über Früchte tragen.","f":["Ein bedeutender Produzent von Bio-Bananen für den lokalen Markt.","Bekannt für seine traditionellen Heilkräutergärten."]},"guadalupe-cities-v2":{"i":"/poi-images/guadalupe-cities-v2.webp","s":"Guadalupe, die stolze Hauptstadt des Lobata-Bezirks, ist ein Ort der Geschichte und des Glaubens, dessen Herz die markante Kirche auf dem Platz ist.","f":["Hauptstadt des Bezirks Lobata im Norden der Insel.","Beherbergt ein wichtiges Zentrum für landwirtschaftliche Forschung."]},"santo-amaro-cities-v2":{"i":"/poi-images/santo-amaro-cities-v2.webp","s":"Santo Amaro ist ein geschäftiger Ort an der Hauptstraße nach Norden, in dem der Handel und das Handwerk blühen.","f":["Ein strategischer Verkehrsknotenpunkt im Lobata-Bezirk.","Bekannt für seine geschickten Tischler und Möbelbauer."]},"conde-cities-v2":{"i":"/poi-images/conde-cities-v2.webp","s":"Conde liegt eingebettet in die sanften Hügel von Lobata, wo der Boden besonders reich an Mineralien ist und den Pflanzen Kraft gibt.","f":["Ein wichtiges Anbaugebiet für Wurzelgemüse und Knollenfrüchte.","Bekannt für seine traditionelle Töpferei aus lokalem Lehm."]},"micolo-cities-v2":{"i":"/poi-images/micolo-cities-v2.webp","s":"Micolo ist ein malerischer Küstenort im Norden, an dem der Sand so fein ist, dass er unter den Füßen singt.","f":["Berühmt für seine wunderschönen, oft menschenleeren Strände.","Ein wichtiges Ökosystem für den Schutz von Küstenvögeln."]},"fernao-dias-cities-v2":{"i":"/poi-images/fernao-dias-cities-v2.webp","s":"Fernão Dias trägt den Namen eines Entdeckers und bewahrt bis heute den Geist der Abenteuerlust an der Nordküste.","f":["Historischer Verladehafen für Kakaobohnen im 19. Jahrhundert.","Bietet einige der besten Plätze für die Beobachtung von Sonnenuntergängen."]},"agostinho-neto-cities-v2":{"i":"/poi-images/agostinho-neto-cities-v2.webp","s":"Agostinho Neto, ehemals bekannt als Rio do Ouro, ist ein monumentales Zeugnis der Plantagenkultur, das wie eine eigene Stadt im Dschungel wirkt.","f":["Größte historische Roça (Plantage) des Landes.","Beherbergt ein beeindruckendes Krankenhausgebäude im neoklassizistischen Stil."]},"boa-entrada-cities-v2":{"i":"/poi-images/boa-entrada-cities-v2.webp","s":"Boa Entrada macht ihrem Namen alle Ehre und empfängt Besucher mit einer Allee aus gigantischen Bäumen, die den Himmel zu berühren scheinen.","f":["Bekannt für den 'Jequitibá', einen der größten und ältesten Bäume der Insel.","Beherbergt eine bedeutende Roça mit einer starken kulturellen Identität."]},"canavial-cities-v2":{"i":"/poi-images/canavial-cities-v2.webp","s":"Canavial ist ein Ort der Kontraste, wo die flachen Felder des Küstenstreifens auf die ersten Erhebungen des Nordens treffen.","f":["Ein wichtiges Gebiet für die Haltung von traditionellen Rinderrassen.","Bekannt für die Produktion von lokalem Zuckerrohrschnaps (Grogue)."]},"blublu-cities-v2":{"i":"/poi-images/blublu-cities-v2.webp","s":"Blublu ist ein lebendiger Vorort von Guadalupe, in dem das Wasser des Flusses Lobata dem Ort seinen Namen und se ille des Waldes nur durch das ferne Rauschen der Wasserfälle unterbrochen wird.","f":["In der Nähe befindet sich einer der höchsten Wasserfälle des Mittellandes.","Ein wichtiges Zentrum für das Studium traditioneller santomeischer Heilpflanzen."]},"milagrosa-cities-v2":{"i":"/poi-images/milagrosa-cities-v2.webp","s":"Milagrosa trägt ihren Namen als Hommage an das Wunder der Natur, die diesen Ort mit einer unglaublichen Fruchtbarkeit gesegnet hat.","f":["Ein bedeutender Produzent von aromatischem schwarzem Pfeffer.","Bekannt für seine religiösen Prozessionen und Feste."]},"batepa-cities-v2":{"i":"/poi-images/batepa-cities-v2.webp","s":"Batepá ist ein Ort von schmerzhafter historischer Bedeutung, an dem das Gedenken an das Massaker von 1953 die Identität der Menschen tief prägt.","f":["Zentraler Schauplatz der tragischen Ereignisse von 1953.","Beherbergt ein wichtiges Mahnmal für die Helden der Unabhängigkeit."]},"monte-cafe-cities-v2":{"i":"/poi-images/monte-cafe-cities-v2.webp","s":"Monte Café liegt majestätisch in den Wolkenbergen von Mé-Zóchi, ein historisches Zentrum der Kaffeeproduktion, das den Charme einer vergangenen Ära bewahrt hat.","f":["Gegründet im Jahr 1858, eine der ältesten und bedeutendsten Plantagen.","Beherbergt das Museum des Kaffees, das die Geschichte des Anbaus dokumentiert."]},"santo-antonio-cities-v2":{"i":"/poi-images/santo-antonio-cities-v2.webp","s":"Santo António, die charmante Hauptstadt der Insel Príncipe, ist eine Stadt, die sich sanft an die Ufer des Flusses Palhota schmiegt.","f":["Haupstadt der autonomen Region Príncipe und kleinste Hauptstadt der Welt.","Bekannt für seine gut erhaltene portugiesische Kolonialarchitektur."]},"terreiro-velho-cities-v2":{"i":"/poi-images/terreiro-velho-cities-v2.webp","s":"Terreiro Velho ist der Ort, an dem der Schokoladen-Träume wahr werden, hoch oben auf den Hügeln von Príncipe mit Blick auf den weiten Ozean.","f":["Heimat der weltberühmten Kakaoplantagen von Claudio Corallo.","Bietet einige der spe a-landmarks-v2.webp","s":"Das Mahnmal von Batepá in Fernão Dias erinnert an die Opfer des Massakers von 1953, ein Wendepunkt im nationalen Bewusstsein und im Streben nach Unabhängigkeit.","f":["Erinnert an die tragischen Ereignisse vom Februar 1953.","Wichtiger Ort für nationale Gedenktage."]},"arquivo-historico-nacional-st-landmarks-v2":{"i":"/poi-images/arquivo-historico-nacional-st-landmarks-v2.webp","s":"Das nationale historische Archiv hütet die schriftlichen Zeugnisse der Geschichte von São Tomé und Príncipe seit der Entdeckung durch die Portugiesen.","f":["Beherbergt Dokumente aus der gesamten Kolonialzeit.","Wichtiges Zentrum für historische Forschung."]},"ponte-rio-agua-grande-landmarks-v2":{"i":"/poi-images/ponte-rio-agua-grande-landmarks-v2.webp","s":"Die Brücke über den Rio Água Grande ist ein funktionales und historisches Wahrzeichen im Zentrum von São Tomé.","f":["Wichtige Verkehrsverbindung im Stadtzentrum.","Bietet einen Blick auf das städtische Leben am Fluss."]},"esplanada-maritima-st-landmarks-v2":{"i":"/poi-images/esplanada-maritima-st-landmarks-v2.webp","s":"Die Esplanada Marítima, lokal als Marginal bekannt, ist die beliebteste Flaniermeile der Hauptstadt.","f":["Zentrum des gesellschaftlichen Lebens am Abend.","Bietet spektakuläre Ausblicke auf die Bucht und den Hafen."]},"schildkroeten-praia-grande-life-v2":{"i":"/poi-images/schildkroeten-praia-grande-life-v2.webp","s":"Praia Grande ist einer der wichtigsten Nistplätze für Meeresschildkröten an der Nordküste von São Tomé.","f":["Wichtigster Brutplatz für die seltene Lederschildkröte auf der Insel.","Nächtliche Beobachtungstouren werden unter strengen Auflagen angeboten."]},"versuchszentrum-poto-life-v2":{"i":"/poi-images/versuchszentrum-poto-life-v2.webp","s":"Das Versuchszentrum Potó ist das wissenschaftliche Rückgrat der santomeischen Landwirtschaft, wo an der Verbesserung lokaler Nutzpflanzen geforscht wird.","f":["Beherbergt eine umfangreiche Samenbank für endemische Nutzpflanzen.","Führt Schulungsprogramme für lokale Landwirte durch."]},"kinderpark-sao-tome-life-v2":{"i":"/poi-images/kinderpark-sao-tome-life-v2.webp","s":"Der Kinderpark im Zentrum der Hauptstadt ist eine bunte Oase der Freude, in der die jüngsten Bewohner der Insel nach Herzenslust spielen können.","f":["Der einzige größere öffentliche Spielplatz in der Hauptstadt.","Regelmäßiger Austragungsort für Kindergeburtstage und lokale Feste."]},"garten-bom-successo-life-v2":{"i":"/poi-images/garten-bom-successo-life-v2.webp","s":"Am Eingang zum Obô-Nationalpark gelegen, ist der Botanische Garten Bom Successo ein Schaufenster der unglaublichen Flora von São Tomé.","f":["Beherbergt über 100 verschiedene endemische Orchideenarten.","Ein wichtiger Ausgangspunkt für geführte Naturwanderungen."]},"vanille-farm-henrique-life-v2":{"i":"/poi-images/vanille-farm-henrique-life-v2.webp","s":"In den kühleren Höhenlagen von Henrique erstreckt sich eine spezialisierte Farm, die sich dem Anbau der kostbaren Bourbon-Vanille widmet.","f":["Einer der wenigen Orte auf der Insel, der echte Bourbon-Vanille produziert.","Die Bestäubung erfolgt ausschließlich per Hand durch erfahrene Arbeiter."]},"papageien-principe-life-v2":{"i":"/poi-images/papageien-principe-life-v2.webp","s":"Tief im geschützten Biosphärenreservat von Príncipe befindet sich ein spezielles Schutzgebiet für den endemischen Príncipe-Papagei.","f":["Der Príncipe-Papagei ist eine streng geschützte, endemische Art.","Das Reservat arbeitet eng mit internationalen Naturschutzorganisationen zusammen."]},"kaffee-nova-moca-life-v2":{"i":"/poi-images/kaffee-nova-moca-life-v2.webp","s":"Hoch über den Wolkenwäldern von Mé-Zóchi liegt die historische Plantage Nova Moca, die für die Produktion von hochwertigem Arabica-Kaffee weltberühmt ist.","f":["Bekannt für den 'Kaffee der Könige', der einst an europäische Adelshöfe geliefert wurde.","Bietet Verkostungen direkt im historischen Herrenhaus der Plantage an."]},"schildkroeten-morro-peixe-life-v2":{"i":"/poi-images/schildkroeten-morro-peixe-life-v2.webp","s":"Das Schildkrötencamp Morro Peixe ist ein engagiertes Naturschutzzentrum an der nordwestlichen Küste, das von der lokalen Gemeinschaft geführt wird.","f":["Betrieben von der lokalen Nichtregierungsorganisation MARAPA.","Ein kleines Museum informiert über den Lebenszyklus der Meerestiere."]},"kinderzentrum-principe-life-v2":{"i":"/poi-images/kinderzentrum-principe-life-v2.webp","s":"Das Kinderfreizeitzentrum in Santo António ist der Mittelpunkt für Spiel und Bildung für die Kinder auf der Insel Príncipe.","f":["Ein wichtiges soziales Projekt für die lokale Gemeinschaft von Santo António.","Bietet Nachmittagsbetreuung und kreative Freizeitgestaltung an."]},"gewuerzfarm-uba-budo-life-v2":{"i":"/poi-images/gewuerzfarm-uba-budo-life-v2.webp","s":"Tief im grünen Herzen von Cantagalo liegt die Gewürzfarm von Uba Budo, ein Ort, an dem die Luft von den intensiven Düften des Orients und der Tropen erfüllt ist.","f":["Spezialisiert auf den Anbau von biologischem schwarzem Pfeffer.","Die Gewürze werden noch traditionell in der Sonne getrocknet."]},"wal-beobachtung-leba-life-v2":{"i":"/poi-images/wal-beobachtung-leba-life-v2.webp","s":"Vor der Westküste von São Tomé, in der Nähe von Neves, befindet sich ein wichtiges Gebiet für die Beobachtung von Buckelwalen während ihrer jährlichen Wanderung.","f":["Beste Beobachtungszeit ist während der Paarungssaison (Juli bis Oktober).","Wale können oft direkt vom Ufer aus mit dem Fernglas gesichtet werden."]},"bananen-generosa-life-v2":{"i":"/poi-images/bananen-generosa-life-v2.webp","s":"Die Bananenplantage von Generosa im Westen der Insel ist ein Musterbeispiel für den nachhaltigen Anbau verschiedener Bananensorten.","f":["Produziert über zehn verschiedene Bananensorten für den lokalen Markt.","Die Abfälle der Ernte werden zur Kompostgewinnung genutzt."]},"korallen-micolo-life-v2":{"i":"/poi-images/korallen-micolo-life-v2.webp","s":"Vor der malerischen Küste von Micolo erstreckt sich eine wichtige Schutzzone für die empfindlichen Korallenriffe des Nordens.","f":["Heimat von seltenen Feuerkorallen und bunten Papageifischen.","Schnorcheln ist nur in ausgewiesenen Bereichen erlaubt."]},"kakaohof-diogo-vaz-life-v2":{"i":"/poi-images/kakaohof-diogo-vaz-life-v2.webp","s":"Der Kakaohof von Diogo Vaz ist ein bedeutendes Zentrum für die Kultivierung von hochwertigem Edelkakao an der Westküste.","f":["Verwendet ausschließlich die seltene Kakaosorte Amelonado.","Bietet interaktive Workshops zur Schokoladenherstellung an."]},"orchideengarten-cantagalo-life-v2":{"i":"/poi-images/orchideengarten-cantagalo-life-v2.webp","s":"Im Herzen des Cantagalo-Bezirks liegt dieser spezialisierte Garten, der sich der Erhaltung und Zucht der faszinierenden Orchideen von São Tomé widmet.","f":["Beherbergt einige der seltensten Orchideen der Welt.","Ein wichtiges Forschungszentrum für botanische Studien."]},"spielplatz-independencia-life-v2":{"i":"/poi-images/spielplatz-independencia-life-v2.webp","s":"Der Spielplatz am Unabhängigkeitsplatz in São Tomé ist ein beliebter Ort für städtische Familien, an dem Kinder in einer sicheren Umgebung spielen können.","f":["Zentraler Treffpunkt für Familien in der Hauptstadt.","Regelmäßige Instandhaltung durch die Stadtverwaltung."]},"palmoel-ribeira-peixe-life-v2":{"i":"/poi-images/palmoel-ribeira-peixe-life-v2.webp","s":"Ribeira Peixe im tiefen Süden der Insel ist das Herz der santomeischen Palmölproduktion.","f":["Eine der größten und modernsten Plantagen im gesamten Archipel.","Das gewonnene Palmöl wird hauptsächlich für den lokalen Markt verwendet."]},"vogelplatz-io-grande-life-v2":{"i":"/poi-images/vogelplatz-io-grande-life-v2.webp","s":"An den Ufern des Rio Iô Grande im Distrikt Caué befindet sich einer der besten Plätze der Insel für die Beobachtung seltener Vogelarten.","f":["Heimat für über 20 endemische Vogelarten des Archipels.","Vogelbeobachtungsstege ermöglichen einen ungestörten Blick auf das Flussufer."]},"abenteuerspielplatz-neves-life-v2":{"i":"/poi-images/abenteuerspielplatz-neves-life-v2.webp","s":"Der Abenteuerspielplatz in der Industriestadt Neves bietet den Kindern der Region einen aufregenden Ort für körperliche Betätigung und gemeinsames Spiel.","f":["Entstanden durch eine Initiative lokaler Unternehmen und der Gemeinde.","Besitzt spezielle Bereiche für Kleinkinder und ältere Kinder."]},"lernbauernhof-agostinho-neto-life-v2":{"i":"/poi-images/lernbauernhof-agostinho-neto-life-v2.webp","s":"Der Lernbauernhof in der historischen Roça Agostinho Neto ist ein innovatives Bildungsprojekt, das Schülern und Besuchern die Bedeutung der Landwirtschaft näherbringt.","f":["Ein Vorzeigeprojekt für agrarökologische Bildung in São Tomé.","Bietet spezielle Programme für Schulklassen aus dem ganzen Land an."]},"pico-de-sao-tome-nature-v2":{"i":"/poi-images/pico-de-sao-tome-nature-v2.webp","s":"Der Pico de São Tomé ist mit 2024 Metern der höchste Punkt der Insel und ein majestätischer Wächter über dem Atlantik.","f":["Höchster Berg von São Tomé und Príncipe.","Teil des Obô-Nationalparks."]},"pico-cao-grande-nature-v2":{"i":"/poi-images/pico-cao-grande-nature-v2.webp","s":"Der Pico Cão Grande ist ein spektakulärer vulkanischer Härtling, der wie eine gigantische Nadel über den südlichen Regenwald ragt.","f":["Ragt 370 Meter über das umliegende Gelände hinaus.","Besteht aus hartem Phonolith-Gestein."]},"parque-nacional-obo-nature-v2":{"i":"/poi-images/parque-nacional-obo-nature-v2.webp","s":"Der Obô-Nationalpark schützt die wertvollsten Regenwälder des Archipels und ist ein Hotspot der biologischen Vielfalt.","f":["Deckt etwa 30 Prozent der Landfläche von São Tomé ab.","Heimat von über 130 endemischen Pflanzenarten."]},"lagoa-azul-nature-v2":{"i":"/poi-images/lagoa-azul-nature-v2.webp","s":"Die Lagoa Azul ist eine traumhafte Bucht an der Nordküste, die für ihr leuchtend türkisfarbenes Wasser berühmt ist.","f":["Einer der besten Orte für Schnorcheln auf São Tomé.","Einzigartiges Vorkommen von Baobabs direkt am Meer."]},"rio-io-grande-nature-v2":{"i":"/poi-images/rio-io-grande-nature-v2.webp","s":"Der Rio Iô Grande ist einer der wasserreichsten Flüsse der Insel und schlängelt sich durch die tiefen Täler des Südens.","f":["Wichtigste Wasserquelle für die südlichen Distrikte.","Bietet spektakuläre Schluchten im Oberlauf."]},"pico-maria-fernandes-nature-v2":{"i":"/poi-images/pico-maria-fernandes-nature-v2.webp","s":"Der Pico Maria Fernandes ist eine markante Erhebung im Süden von São Tomé, die oft im Schatten des bekannteren Cão Grande steht, aber nicht weniger beeindruckend ist.","f":["Ein wichtiger Orientierungspunkt für Seeleute an der Südküste.","Beherbergt viele seltene epiphytische Pflanzen."]},"ilheu-santana-nature-v2":{"i":"/poi-images/ilheu-santana-nature-v2.webp","s":"Die Ilhéu Santana ist eine felsige Insel vor der Ostküste von São Tomé, die sich majestätisch aus dem Blau des Atlantiks erhebt.","f":["Wichtiges Brutgebiet für Rußseeschwalben.","Bietet hervorragende Bedingungen für Gerätetauchen."]},"pico-do-principe-nature-v2":{"i":"/poi-images/pico-do-principe-nature-v2.webp","s":"Der Pico do Príncipe ist die höchste Erhebung der Insel Príncipe und das Herzstück ihres Biosphärenreservats.","f":["Höchster Punkt von Príncipe.","Heimat vieler Arten, die nur auf dieser einen Insel vorkommen."]},"rio-contador-nature-v2":{"i":"/poi-images/rio-contador-nature-v2.webp","s":"Der Rio Contador ist ein wilder Gebirgsfluss im Nordwesten von São Tomé, der durch spektakuläre Schluchten ins Meer stürzt.","f":["Bietet einige der schönsten Wasserfälle der Insel.","Wichtiger Lebensraum für die seltene São-Tomé-Bergstelze."]},"rio-abade-nature-v2":{"i":"/poi-images/rio-abade-nature-v2.webp","s":"Der Rio Abade ist ein ruhiger Fluss, der das östliche Mittelland entwässert und durch einige der ältesten Plantagengebiete der Insel fließt.","f":["Mündet in der Nähe der Stadt Santana in den Atlantik.","Bekannt für seine sanften Flusskurven und idyllischen Picknickplätze."]},"lagoa-amelia-nature-v2":{"i":"/poi-images/lagoa-amelia-nature-v2.webp","s":"Die Lagoa Amélia ist kein gewöhnlicher See, sondern ein mit Regenwasser gefüllter Vulkankrater in den Bergen von São Tomé, der heute eine faszinierende Sumpflandschaft beherbergt.","f":["Befindet sich auf einer Höhe von etwa 1450 Metern.","Eigentlich ein verlandeter Kratersee."]},"ilheu-bom-bom-nature-v2":{"i":"/poi-images/ilheu-bom-bom-nature-v2.webp","s":"Die Ilhéu Bom Bom ist eine kleine, grüne Perle vor der Nordküste von Príncipe, die durch einen langen Holzsteg mit der Hauptinsel verbunden ist.","f":["Beherbergt ein preisgekröntes Öko-Resort.","Ein wichtiger Ort für die Beobachtung von Buckelwalen (Saison)."]},"pico-papagaio-nature-v2":{"i":"/poi-images/pico-papagaio-nature-v2.webp","s":"Der Pico Papagaio, auch Papageienberg genannt, ist eine markante, kegelförmige Erhebung auf Príncipe, die wie eine grüne Pyramide aus dem Wald ragt.","f":["Bietet spektakuläre Aussichten über die Insel Príncipe.","Ein wichtiger Nistplatz für den Graupapagei."]},"rio-manuel-jorge-nature-v2":{"i":"/poi-images/rio-manuel-jorge-nature-v2.webp","s":"Der Rio Manuel Jorge ist ein lebhafter Fluss an der Ostküste von São Tomé, der durch fruchtbare Plantagengebiete und dichten Wald fließt.","f":["Mündet in der Nähe von Santana ins Meer.","Bekannt für die Cascata de Manuel Jorge."]},"baia-das-agulhas-nature-v2":{"i":"/poi-images/baia-das-agulhas-nature-v2.webp","s":"Die Baía das Agulhas, die 'Bucht der Nadeln', ist einer der spektakulärsten Küstenabschnitte von Príncipe.","f":["Teil des UNESCO-Biosphärenreservats Príncipe.","Nur per Boot oder über sehr anspruchsvolle Pfade erreichbar."]},"rio-cantagalo-nature-v2":{"i":"/poi-images/rio-cantagalo-nature-v2.webp","s":"Der Rio Cantagalo ist ein wichtiger Fluss an der Ostküste, der dem gleichnamigen Bezirk seinen Namen gibt.","f":["Wichtiger Wasserlieferant für die Landwirtschaft in Cantagalo.","Bekannt für seine ruhigen Abschnitte, die zum Baden einladen."]},"pico-mesa-nature-v2":{"i":"/poi-images/pico-mesa-nature-v2.webp","s":"Der Pico Mesa, der 'Tafelberg' von Príncipe, ist ein einzigartiger Berg mit einem flachen Gipfelplateau, das ihn von den umliegenden spitzen Gipfeln abhebt.","f":["Eines der markantesten geologischen Merkmale von Príncipe.","Bietet eine 360-Grad-Aussicht bei klarem Wetter."]},"ilheu-caroco-nature-v2":{"i":"/poi-images/ilheu-caroco-nature-v2.webp","s":"Die Ilhéu Caroço, auch als 'Jockey's Cap' bekannt, ist eine dramatische, kegelförmige Felsinsel südlich von Príncipe.","f":["Bekannt für seine markante Form, die einem Hut ähnelt.","Unbewohnt und streng geschützt."]},"rio-caue-nature-v2":{"i":"/poi-images/rio-caue-nature-v2.webp","s":"Der Rio Caué ist die Lebensader des südlichsten Bezirks von São Tomé und fließt durch das Herz des Obô-Nationalparks.","f":["Wichtigster Fluss im Bezirk Caué.","Bietet Zugang zu einigen der entlegensten Teile des Regenwaldes."]},"praia-jale-nature-v2":{"i":"/poi-images/praia-jale-nature-v2.webp","s":"Die Praia Jalé ist ein wilder, naturbelassener Strand im tiefen Süden, der für seine ökologische Bedeutung weltweit bekannt ist.","f":["Wichtigster Brutstrand für bedrohte Meeresschildkröten.","Beherbergt ein einfaches, aber wichtiges Öko-Camp für Naturschützer."]},"rio-lemba-nature-v2":{"i":"/poi-images/rio-lemba-nature-v2.webp","s":"Der Rio Lembá ist der bedeutendste Fluss im Westen der Insel und ein Symbol für die ungezähmte Kraft der Natur.","f":["Größtes Flusssystem im Distrikt Lembá.","Bekannt für seine extrem schnellen Strömungen während der Regenzeit."]},"cascata-sao-nicolau-nature-v2":{"i":"/poi-images/cascata-sao-nicolau-nature-v2.webp","s":"Die Cascata de São Nicolau ist einer der bekanntesten und fotogensten Wasserfälle der Insel, eingebettet in die kühlen Gebirgswälder des Mé-Zóchi-Distrikts.","f":["Leicht erreichbar von der Straße nach Monte Café.","Umgeben von üppiger, feuchtigkeitsliebender Vegetation."]},"rio-agua-grande-nature-v2":{"i":"/poi-images/rio-agua-grande-nature-v2.webp","s":"Der Rio Água Grande ist der historische Fluss, der der Hauptstadt und ihrem Bezirk den Namen gibt.","f":["Namensgeber für den bevölkerungsreichsten Bezirk des Landes.","Spielte eine entscheidende Rolle bei der Wahl des Standorts der Hauptstadt."]},"golfo-de-guine-nature-v2":{"i":"/poi-images/golfo-de-guine-nature-v2.webp","s":"Der Golf von Guinea umschließt den gesamten Archipel von São Tomé und Príncipe und ist die Wiege des tropischen Klimas der Inseln.","f":["Teil des tropischen Atlantiks.","Bekannt für seine strategische Lage am Äquator."]},"pico-cabumbe-relief-v2":{"i":"/poi-images/pico-cabumbe-relief-v2.webp","s":"Der Pico Cabumbé ist eine markante Erhebung im Süden von São Tomé, die aus dem dichten Regenwald hervorragt.","f":["Erreicht eine Höhe von etwa 1403 Metern über dem Meeresspiegel.","Befindet sich im südlichen Teil des Obô-Nationalparks."]},"pico-ana-chaves-relief-v2":{"i":"/poi-images/pico-ana-chaves-relief-v2.webp","s":"Dieser Berg im Zentrum der Insel São Tomé ist nach der legendären Ana Chaves benannt.","f":["Liegt im Distrikt Mé-Zóchi im Landesinneren.","Der Gipfel bietet oft eine weite Sicht über das zentrale Hochland."]},"pico-maria-amelia-relief-v2":{"i":"/poi-images/pico-maria-amelia-relief-v2.webp","s":"Der Pico Maria Amélia ist ein weiterer imposanter Gipfel im südlichen Hochland von São Tomé.","f":["Liegt westlich der Siedlung São João dos Angolares.","Teil des bergigen Terrains des Distrikts Caué."]},"pico-bastiao-relief-v2":{"i":"/poi-images/pico-bastiao-relief-v2.webp","s":"Der Pico Bastião ist eine markante geologische Formation auf der Insel Príncipe.","f":["Befindet sich im östlichen Teil der Insel Príncipe.","Wichtiger Orientierungspunkt für Wanderer im Inselinneren."]},"pico-carvalhal-relief-v2":{"i":"/poi-images/pico-carvalhal-relief-v2.webp","s":"Im Herzen des Distrikts Mé-Zóchi gelegen, ist der Pico Carvalhal ein Symbol für die gebirgige Landschaft Zentral-São Tomés.","f":["Die Region ist für ihre fruchtbaren Vulkanböden bekannt.","Bietet Schutz vor starken Atlantikwinden für die Täler."]},"pico-vinte-e-cinco-relief-v2":{"i":"/poi-images/pico-vinte-e-cinco-relief-v2.webp","s":"Dieser Berg im äußersten Südwesten von São Tomé markiert eine wilde und unzugängliche Region.","f":["Liegt in einer der niederschlagsreichsten Zonen der Insel.","Der Zugang ist aufgrund des dichten Bewuchses schwierig."]},"pico-formoso-relief-v2":{"i":"/poi-images/pico-formoso-relief-v2.webp","s":"Der Pico de Formoso, dessen Name 'Schöner Gipfel' bedeutet, macht seiner Bezeichnung alle Ehre.","f":["Wichtiges Einzugsgebiet für die Wasserversorgung von Caué.","Die Luftfeuchtigkeit liegt hier fast ganzjährig bei über 90%."]},"morro-fundao-relief-v2":{"i":"/poi-images/morro-fundao-relief-v2.webp","s":"Der Morro de Fundão ist ein markanter Hügel im Norden von São Tomé, der die Landschaft des Distrikts Lobata prägt.","f":["Bietet ein trockeneres Mikroklima als das Inselzentrum.","Wichtiger Standort für lokale Landwirtschaftsprojekte."]},"morro-vilela-relief-v2":{"i":"/poi-images/morro-vilela-relief-v2.webp","s":"Der Morro Vilela ist eine bedeutende Erhebung an der zerklüfteten Westküste von São Tomé.","f":["Befindet sich im Distrikt Lembá nahe der Küste.","Berüchtigt für starke Winde und raue See."]},"pico-palmira-relief-v2":{"i":"/poi-images/pico-palmira-relief-v2.webp","s":"Der Pico de Palmira ist ein Berg im Herzen der Kaffeeanbauregion von São Tomé.","f":["Die Region um den Berg ist für ihre Kühle bekannt.","Ein wichtiges Ziel für Agrotourismus-Wanderungen."]},"pico-gago-coutinho-relief-v2":{"i":"/poi-images/pico-gago-coutinho-relief-v2.webp","s":"Benannt nach dem berühmten portugiesischen Navigator, ist dieser Berg ein wichtiger Vermessungspunkt im Süden der Insel.","f":["Der Gipfel dient oft als Referenzpunkt für Kartenmacher.","Teil des geschützten Obô-Nationalparks."]},"pico-esperanca-relief-v2":{"i":"/poi-images/pico-esperanca-relief-v2.webp","s":"Der Pico da Esperança ist eine Erhebung im Osten von São Tomé, die für ihre landschaftliche Vielfalt bekannt ist.","f":["Der Name bedeutet 'Gipfel der Hoffnung'.","Wichtiger Standort für lokale Forstwirtschaft."]},"pico-sao-joao-relief-v2":{"i":"/poi-images/pico-sao-joao-relief-v2.webp","s":"Dieser Berg im Osten von São Tomé überragt die gleichnamige Bucht und die umliegenden Täler.","f":["Prägt die Silhouette des Distrikts Cantagalo.","Die Hänge sind oft von tiefhängenden Wolken bedeckt."]},"morro-estrela-relief-v2":{"i":"/poi-images/morro-estrela-relief-v2.webp","s":"Der Morro de Estrela ist eine steile Klippenformation an der Nordwestküste von São Tomé.","f":["Der Name bedeutet 'Hügel des Sterns'.","Befindet sich im abgelegenen Distrikt Lembá."]},"pico-sao-pedro-relief-v2":{"i":"/poi-images/pico-sao-pedro-relief-v2.webp","s":"Der Pico de São Pedro ist eine markante Erhebung nahe der Hauptstadt, die das zentrale Bergland einleitet.","f":["Ein wichtiger Teil des Gebirgspanoramas von São Tomé Stadt.","Dient als Wasserscheide für lokale Bäche."]},"principe-rainforest-relief-v2":{"i":"/poi-images/principe-rainforest-relief-v2.webp","s":"Der Regenwald von Príncipe gehört zum UNESCO-Biosphärenreservat und gilt als eines der besterhaltenen Ökosysteme Afrikas.","f":["Beherbergt mehr endemische Arten pro Quadratkilometer als fast jeder andere Ort.","Wird oft als das 'afrikanische Galapagos' bezeichnet."]},"me-zochi-cloudforest-relief-v2":{"i":"/poi-images/me-zochi-cloudforest-relief-v2.webp","s":"In den höheren Lagen des Mé-Zóchi-Distrikts erstreckt sich der geheimnisvolle Nebelwald.","f":["Wichtige Quelle für die Kondenswasserbildung.","Beherbergt den seltenen São-Tomé-Würger (Vogelart)."]},"porto-alegre-mangrove-relief-v2":{"i":"/poi-images/porto-alegre-mangrove-relief-v2.webp","s":"Im äußersten Süden von São Tomé, nahe Porto Alegre, erstrecken sich ausgedehnte Mangrovensümpfe.","f":["Wichtigster Mangrovenstandort der Insel São Tomé.","Kann am besten mit dem Boot erkundet werden."]},"sao-tome-volcanic-massif-relief-v2":{"i":"/poi-images/sao-tome-volcanic-massif-relief-v2.webp","s":"Das zentrale Vulkanmassiv ist das geologische Rückgrat der Insel São Tomé.","f":["Das Massiv entstand vor Millionen von Jahren durch Hotspot-Vulkanismus.","Enthält die höchsten Erhebungen des gesamten Golfs von Guinea."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
