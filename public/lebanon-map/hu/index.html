amely a libanoni történelmet és hagyományokat mutatja be.","f":["Az építkezés több mint 60 évig tartott.","Történelmi fegyverek gyűjteményének ad otthont."]},"beiteddine-palace-landmarks-v2":{"i":"/poi-images/beiteddine-palace-landmarks-v2.webp","s":"A 19.","f":["A libanoni emírek egykori székhelye.","Részletes mozaikjairól ismert."]},"byblos-castle-landmarks-v2":{"i":"/poi-images/byblos-castle-landmarks-v2.webp","s":"Egy keresztes lovagok által a 12.","f":["Az ókori Büblosz városának szívében található.","Kilátást nyújt a régi kikötőre."]},"sursock-museum-landmarks-v2":{"i":"/poi-images/sursock-museum-landmarks-v2.webp","s":"Egy modern és kortárs művészeti múzeum egy pompás bejrúti villában.","f":["1912-ben épült.","Velencei és oszmán építészeti elemeket ötvöz."]},"national-museum-of-beirut-landmarks-v2":{"i":"/poi-images/national-museum-of-beirut-landmarks-v2.webp","s":"Az ország legfontosabb régészeti múzeuma, amely Libanon történelmét őrzi.","f":["1942-ben nyitották meg.","Föníciai leletek nagy gyűjteményével rendelkezik."]},"baatara-gorge-waterfall-landmarks-v2":{"i":"/poi-images/baatara-gorge-waterfall-landmarks-v2.webp","s":"Látványos vízesés, amely három természetes mészkőhídon keresztül zuhan egy barlangba.","f":["A víz 255 méter mélybe zuhan.","Csak 1952-ben vált ismertté a nyugati kutatók számára."]},"mzaar-kfardebian-landmarks-v2":{"i":"/poi-images/mzaar-kfardebian-landmarks-v2.webp","s":"A Közel-Kelet legnagyobb és legismertebb síterepe, mindössze egy órányira Bejrúttól.","f":["80 kilométernyi sípályát kínál.","A legmagasabb csúcsok elérik a 2465 métert."]},"mohammad-al-amin-mosque-landmarks-v2":{"i":"/poi-images/mohammad-al-amin-mosque-landmarks-v2.webp","s":"Egy jellegzetes mecset Bejrút központjában, amely kék kupoláiról és oszmán építészetéről ismert.","f":["2008-ban készült el.","A minaretek 72 méter magasak."]},"saint-george-maronite-cathedral-landmarks-v2":{"i":"/poi-images/saint-george-maronite-cathedral-landmarks-v2.webp","s":"A bejrúti maronit ioszféra-rezervátum, amely gazdag erdőket, mély völgyeket és a római korból származó emberi települések nyomait őrzi.","f":["Több mint 130 madárfajnak ad otthont.","Ősi római lépcsőiről ismert."]},"bekaa-vineyards-life-v2":{"i":"/poi-images/bekaa-vineyards-life-v2.webp","s":"Libanon történelmi bortermelő vidékei, ahol az évszázados hagyományok találkoznak a modern szőlészeti technikákkal.","f":["Itt készül a libanoni borok nagy része.","A termesztési magasság több mint 1000 méter."]},"tannourine-cedar-life-v2":{"i":"/poi-images/tannourine-cedar-life-v2.webp","s":"Az ország egyik legsűrűbb cédruserdeje, amely drámai sziklás tájba van beágyazva, mély víznyelőkkel.","f":["A fák rendkívül meredek lejtőkön nőnek.","Népszerű terület a hegymászók és túrázók körében."]},"yammouneh-reserve-life-v2":{"i":"/poi-images/yammouneh-reserve-life-v2.webp","s":"Gazdag vízkészlettel rendelkező hegyvidéki völgy, amely egyedülálló endemikus halfajairól és geológiai képződményeiről ismert.","f":["84 természetes vízforrás található itt.","Egy különleges fürgefaj (Phoxinellus libanicus) otthona."]},"bentael-reserve-life-v2":{"i":"/poi-images/bentael-reserve-life-v2.webp","s":"Libanon egyik első természetvédelmi területe, amelyet a mediterrán fenyőerdők és a helyi vadvilág védelmére hoztak létre.","f":["A falubeliek maguk kezdeményezték 1981-ben.","Fontos állomás a tavaszi madárvonulás során."]},"rene-moawad-garden-life-v2":{"i":"/poi-images/rene-moawad-garden-life-v2.webp","s":"Bejrút egyik legrégebbi és legismertebb nyilvános parkja, amely zöld oázist kínál a forgalmas főváros szívében.","f":["Eredetileg 1907-ben nyílt meg Sanayeh kertként.","Népszerű találkozóhely családok és sétálók számára."]},"horsh-beirut-life-v2":{"i":"/poi-images/horsh-beirut-life-v2.webp","s":"Bejrút legnagyobb parkja, amely sűrű fenyőerdőből áll, és jelentősen hozzájárul a város levegőminőségéhez.","f":["Az erdő területe körülbelül 300 000 négyzetméter.","Sok éven át tartott az erdő újratelepítése."]},"animal-city-lebanon-life-v2":{"i":"/poi-images/animal-city-lebanon-life-v2.webp","s":"Egy családbarát állatkert Nahr el Kalbban, amely számos egzotikus és őshonos állatfajnak ad otthont.","f":["Libanon egyik legnagyobb állatkertje.","Oktatási túrákat is kínál iskolásoknak."]},"waves-aqua-park-life-v2":{"i":"/poi-images/waves-aqua-park-life-v2.webp","s":"A régió egyik legnagyobb vízi parkja, amely egy fenyőkkel borított dombon található, ideális családi kirándulásokhoz.","f":["60 000 négyzetméteres területet foglal magában.","Hatalmas hullámmedencékkel és csúszdákkal rendelkezik."]},"watergate-aqua-park-life-v2":{"i":"/poi-images/watergate-aqua-park-life-v2.webp","s":"Egy népszerű vidám- és vízipark Dbaye-ben, számos látványossággal gyerekek és felnőttek számára.","f":["Nagysebességű, kanyargós csúszdáiról ismert.","Saját gyermekrésszel rendelkezik sekély vízzel."]},"rio-lento-park-life-v2":{"i":"/poi-images/rio-lento-park-life-v2.webp","s":"Egy családközpontú vízipark, amelyet különösen a hosszú áramló csatornája (Lassú folyó) miatt értékelnek.","f":["A neve spanyolul 'lassú folyót' jelent.","A létesítményt természetes sziklafalak veszik körül."]},"bkassine-pine-forest-life-v2":{"i":"/poi-images/bkassine-pine-forest-life-v2.webp","s":"Libanon és az egész Közel-Kelet legnagyobb fenyőerdeje, amely az ökoturizmus festői helyszíne.","f":["Maga a falu védte és gondozta.","Függőhidakat és kiterjedt túraútvonalakat kínál."]},"litani-basin-agri-life-v2":{"i":"/poi-images/litani-basin-agri-life-v2.webp","s":"A Litáni folyó völgye Libanon legtermékenyebb talaját kínálja, és intenzív mezőgazdaságot tesz lehetővé.","f":["A Litáni a leghosszabb folyó, amely teljes egészében Libanonban folyik.","A gabona- és zöldségtermesztés fontos központja."]},"kfardebian-orchards-life-v2":{"i":"/poi-images/kfardebian-orchards-life-v2.webp","s":"A magasan fekvő teraszos mezőikről ismert gyümölcsösök a Közel-Kelet legropogósabb almáit termelik.","f":["A hegyek hűvös éjszakái ideálisak az almatermesztéshez.","Az almát gyakran exportálják az egész Öböl-térségbe."]},"hasbaya-olives-life-v2":{"i":"/poi-images/hasbaya-olives-life-v2.webp","s":"Egy dél-libanoni régió, amely ősi olajfáiról és hagyományos olívaolaj-termeléséről híres.","f":["A környéken néhány olajfa több mint ezer éves.","Az olajbogyószüret központi társadalmi esemény."]},"ammiq-wetland-life-v2":{"i":"/poi-images/ammiq-wetland-life-v2.webp","s":"A legnagyobb megmaradt édesvízi vizes élőhely Libanonban, amely kritikus élőhely a madarak és a vízibivalyok számára.","f":["Az Európa és Afrika közötti fontos madárvonulási útvonalon fekszik.","A mocsarak vize nyáron gyakran szinte teljesen kiszárad."]},"lebanon-qaraoun-lake-nature-v2":{"i":"/poi-images/lebanon-qaraoun-lake-nature-v2.webp","s":"A Qaraoun-tó Libanon legnagyobb mesterséges tava a Litáni-folyón.","f":["Felszíne körülbelül 12 négyzetkilométer.","1959-ben épült a gátja."]},"lebanon-nahr-ibrahim-nature-v2":{"i":"/poi-images/lebanon-nahr-ibrahim-nature-v2.webp","s":"A Nahr Ibrahim folyó a mitológiában Adonis-folyóként ismert.","f":["Körülbelül 30 kilométer hosszú.","Adonisz és Aphrodité mítoszához kötődik."]},"lebanon-afqa-grotto-nature-v2":{"i":"/poi-images/lebanon-afqa-grotto-nature-v2.webp","s":"Az Afqa-barlang a Nahr Ibrahim folyó forrása és egy szent hely.","f":["1200 méteres magasságban található.","Adonisz isten szent helye volt."]},"lebanon-jezzine-waterfall-nature-v2":{"i":"/poi-images/lebanon-jezzine-waterfall-nature-v2.webp","s":"A Jezzine-vízesés, más néven Shalouf, egy meredek szikláról zúdul alá.","f":["Körülbelül 74 méteres esési magasság.","Jezzine városának fő jelképe."]},"lebanon-nahr-el-assi-nature-v2":{"i":"/poi-images/lebanon-nahr-el-assi-nature-v2.webp","s":"A Nahr el-Assi az egyetlen folyó Libanonban, amely észak felé folyik.","f":["A neve 'lázadó folyót' jelent.","Az északi Bekaa-völgy legfontosabb folyója."]},"lebanon-kammouha-forest-nature-v2":{"i":"/poi-images/lebanon-kammouha-forest-nature-v2.webp","s":"Az Akkar régióban talá   // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
