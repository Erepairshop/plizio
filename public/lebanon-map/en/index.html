rome-history-v2.webp","s":"The best-preserved and largest Roman hippodrome in the world, which hosted spectacular chariot races in antiquity.","f":["Built in the 2nd century AD.","Could accommodate over 20,000 spectators."]},"beiteddine-palace-history-v2":{"i":"/poi-images/beiteddine-palace-history-v2.webp","s":"A masterpiece of 19th-century Lebanese architecture that served as the governmental seat of Emir Bashir Shihab II.","f":["The construction took over 30 years.","Now the summer residence of the president."]},"anjar-umayyad-city-history-v2":{"i":"/poi-images/anjar-umayyad-city-history-v2.webp","s":"The only surviving Umayyad city in Lebanon, with its street network laid out according to a strict Roman pattern.","f":["Founded in the early 8th century.","Features over 600 shops in the ruins."]},"sidon-sea-castle-history-v2":{"i":"/poi-images/sidon-sea-castle-history-v2.webp","s":"A fortress built by Crusaders in the 13th century on a small island off the coast, accessible via a stone bridge.","f":["Built as a fortress of the Holy Land.","Destroyed and rebuilt by the Mamluks."]},"temple-of-bacchus-history-v2":{"i":"/poi-images/temple-of-bacchus-history-v2.webp","s":"One of the best-preserved and largest Roman temples in the world, renowned for its fine and elaborate reliefs.","f":["Probably dedicated to the wine god Bacchus.","Larger than the Parthenon in Athens."]},"temple-of-jupiter-history-v2":{"i":"/poi-images/temple-of-jupiter-history-v2.webp","s":"Once the largest temple of the Roman Empire, of which only six massive Corinthian columns still soar into the sky today.","f":["The columns are 22 meters high.","The foundation contains the Trilithon stones."]},"tripoli-citadel-history-v2":{"i":"/poi-images/tripoli-citadel-history-v2.webp","s":"A massive fortress on a hill above the city, originally founded by the Crusader Raymond de Saint-Gilles.","f":["Also known as Qal'at Sanjil.","Expanded by Mamluks and Ottomans."]},"beaufort-castle-history-v2":{"i":"/poi-ima ife-v2.webp","s":"A small group of islands off the coast of Tripoli that serves as an important nesting site for endangered sea turtles.","f":["Consists of three flat limestone islands.","An important resting place for migratory birds."]},"tyre-coast-reserve-life-v2":{"i":"/poi-images/tyre-coast-reserve-life-v2.webp","s":"This coastal reserve includes Lebanon's most beautiful sandy beaches and important wetlands for freshwater animals.","f":["Nesting site for the loggerhead sea turtle.","Also contains ancient archaeological remains in the water."]},"jabal-moussa-reserve-life-v2":{"i":"/poi-images/jabal-moussa-reserve-life-v2.webp","s":"A UNESCO biosphere reserve that preserves rich forests, deep valleys, and traces of human settlement from the Roman era.","f":["Home to over 130 bird species.","Known for its ancient Roman stairs."]},"bekaa-vineyards-life-v2":{"i":"/poi-images/bekaa-vineyards-life-v2.webp","s":"The historic wine-growing regions of Lebanon, where centuries-old traditions meet modern viticultural techniques.","f":["Produces most of the Lebanese wines.","The cultivation altitude is over 1000 meters."]},"tannourine-cedar-life-v2":{"i":"/poi-images/tannourine-cedar-life-v2.webp","s":"One of the densest cedar forests in the country, nestled in a dramatic rocky landscape with deep sinkholes.","f":["The trees grow on extremely steep slopes.","A popular area for climbers and hikers."]},"yammouneh-reserve-life-v2":{"i":"/poi-images/yammouneh-reserve-life-v2.webp","s":"A mountain valley with rich water resources, known for its unique endemic fish species and geological formations.","f":["There are 84 natural water springs there.","Home to a special species of minnow (Phoxinellus libanicus)."]},"bentael-reserve-life-v2":{"i":"/poi-images/bentael-reserve-life-v2.webp","s":"One of the first nature reserves in Lebanon, established to protect the Mediterranean pine forests and local wildlife.","f":["Was initiated by the villagers themselves in 1981.","An important st     }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
