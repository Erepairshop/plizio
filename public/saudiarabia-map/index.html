*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#060614;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:#0a0a1f;border-bottom:1px solid #ffffff14;position:relative;z-index:5}
header a.back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#ffffff14;color:#fff;text-decoration:none;font-weight:700}
header a.back:active{background:#ffffff28}
header h1{margin:0;font-size:1rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .langs{display:flex;gap:.25rem}
.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.drag{cursor:grabbing}
.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}
.region:hover{fill:#2d3a78}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#000;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#60a5fa}
.poi.g-sight circle{fill:#fbbf24}
.poi.g-nature circle{fill:#22c55e}
.poi.g-history circle{fill:#c084fc}
.poi.g-industry circle{fill:#fb923c}
.poi.g-other circle{fill:#9ca3af}
.poi.dim{opacity:.18}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7;fill:#fff;opacity:1}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:#0d1230;border-top:1px solid #ffffff20;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -10px 40px #00000080}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a{display:flex;align-items:center;gap:.55rem;padding:.55rem .55rem;border-radius:8px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:active{background:#ffffff14}
.popup .list a .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.popup .list a .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup .list a .g{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.popup .list .nl{padding:.6rem;color:#ffffff70;font-size:.85rem;font-style:italic}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}

ties-v2.webp","s":"Al-Kaszím régió központja jelentős mezőgazdasági csomópont, amely különösen datolyatermeléséről híres.","f":["Itt található a világ legnagyobb datolyapiaca.","A környéket a hagyományos vályogépítészet jellemzi."]},"khamis-mushait-cities-v2":{"i":"/poi-images/khamis-mushait-cities-v2.webp","s":"Pehegéses kereskedőváros Aszír tartomány hegyei között, amely fontos katonai és üzleti központ.","f":["A város hagyományos ezüstpiacáról ismert.","A régió egyik legnépesebb települése."]},"abha-cities-v2":{"i":"/poi-images/abha-cities-v2.webp","s":"Aszír tartomány magasan fekvő fővárosa enyhe éghajlatával és festői hegyvidéki tájával sok látogatót vonz.","f":["A régió híres a falvak színesre festett házairól.","A közeli Aszír Nemzeti Park gazdag növényvilággal büszkélkedhet."]},"al-hofuf-cities-v2":{"i":"/poi-images/al-hofuf-cities-v2.webp","s":"Az Al-Aksza oázis városi központja mélyen gyökerezik a történelemben, és több millió datolyapálma övezi.","f":["Az Al-Aksza oázis az UNESCO Világörökség része.","A történelmi Kiszarija piac a város egyik fénypontja."]},"al-mubarraz-cities-v2":{"i":"/poi-images/al-mubarraz-cities-v2.webp","s":"Hofuf ikervárosa az Al-Aksza oázison belül, amely osztozik a terület termékeny öntözőrendszerén.","f":["Történelmileg hatalmas vályogvárak vették körül.","A város napjainkra egyre inkább összenő Hofuffal."]},"hail-cities-v2":{"i":"/poi-images/hail-cities-v2.webp","s":"A feltűnő gránithegyekkel körülvett város a Perzsiából Mekkába vezető történelmi zarándokúton fekszik.","f":["Az A'arif és a Barzan erődítmények a helyi nevezetességek.","Itt évente egy ismert nemzetközi rali versenyt is rendeznek."]},"najran-cities-v2":{"i":"/poi-images/najran-cities-v2.webp","s":"A jemen melletti déli város ősi romjairól és az Al-Aan palota vályogépítészetéről híres.","f":["Az Al-Ukhdud történelmi helyszín ókori településekről tanúskodik.","A város a termékeny Nadzsrán völgyben (vádi) található."]},"al-jubail-cities-v2":{"i":"/poi-images/al-jubail-cities-v2.webp","s":"Az egykori kis halászfalu a világ egyik legnagyobb iparvárosává nőtte ki magát.","f":["A szaúdi petrolkémiai ipar abszolút központja.","A várost az 1970-es években tervszerűen bővítették."]},"al-kharj-cities-v2":{"i":"/poi-images/al-kharj-cities-v2.webp","s":"A Rijádtól délre fekvő mezőgazdasági város történelmi vízgyűjtőknek és palotáknak ad otthont.","f":["Az Abdul-Aziz Király Palota egy jól ismert látványosság.","A régióban régi mészkőkutak (Dahl) is találhatók."]},"yanbu-cities-v2":{"i":"/poi-images/yanbu-cities-v2.webp","s":"A nyugati partvidéken fekvő tengerparti város a finomítóiról és a fontos kőolaj-exportkikötőjéről nevezetes.","f":["A város iparterületre és történelmi óvárosra oszlik.","Janbu népszerű célpont a Vörös-tenger búvárai számára."]},"qatif-cities-v2":{"i":"/poi-images/qatif-cities-v2.webp","s":"Kelet-Arábia egyik legrégebbi települése, amely gazdag mezőgazdasági és datolyapálma-termesztési hagyományokkal rendelkezik.","f":["A Khamis Souq történelmi piac a régió egyik látványossága.","A város ősi halászati örökséggel bír a Perzsa-öbölben."]},"arar-cities-v2":{"i":"/poi-images/arar-cities-v2.webp","s":"Az Északi Határvidék tartományának fővárosa egy széles síkságon fekszik, és a Transzarábiai Csővezeték megépítése után alapították.","f":["A város az iraki határ közelében fekszik.","A környező legelők tavasszal rendkívül népszerűek a helyiek körében."]},"sakakah-cities-v2":{"i":"/poi-images/sakakah-cities-v2.webp","s":"Al-Dzsauf régió fővárosát hatalmas olajfaültetvényei és jelentős régészeti lelőhelyei teszik különlegessé.","f":["A közeli Za'abal-kastély egy magaslaton trónol.","Rajajil, Szaúd-Arábia \"Stonehenge-e\" szintén a közelben található."]},"jizan-cities-v2":{"i":"/poi-images/jizan-cities-v2.webp","s":"Az ország délnyugati csücskében fekvő kikötőváros a Vörös-tengerből profitál, és gazdag mezőgazdasági területekkel rendelkezik.","f":["A régió papaja- és mangótermesztéséről híres.","Innen indulnak a kompok a Faraszán-szigetekre."]},"al-qurayyat-cities-v2":{"i":"/poi-images/al-qurayyat-cities-v2.webp","s":"A jordán határ közelében fekvő északi város elsősorban a kereskedelemről, a sólepárlásról és az olajbogyóiról híres.","f":["Itt található egy fontos határátkelő Jordánia felé.","A helyi klíma rendkívül kedvez az olajbogyó termesztésének."]},"dhahran-cities-v2":{"i":"/poi-images/dhahran-cities-v2.webp","s":"A szaúdi Aramco nemzeti kőolajtársaság központjaként a város az olajipar kiemeltebb adminisztratív bázisa.","f":["A modern Ithra (Világkulturális Központ) lenyűgöző épülete itt található.","A város gazdagsága nagyrészt az olajfellendülésen alapul."]},"al-bahah-cities-v2":{"i":"/poi-images/al-bahah-cities-v2.webp","s":"Erdők és hegyek között fekvő hegyvidéki város, amelyet hagyományos építészete és mezőgazdasági teraszai miatt becsülnek.","f":["A történelmi Dhee Ayn falu a régi kőházaival a közelben fekszik.","A régió éghajlata miatt a nyári turizmus kedvelt célpontja."]},"tarut-cities-v2":{"i":"/poi-images/tarut-cities-v2.webp","s":"A Perzsa-öböl egyik legrégebben lakott szigete, amely régészeti leleteiről és történelmi váráról ismert.","f":["A Tárút-erőd az óváros fölé magasodik.","A szigetet töltésutak kötik össze a szárazfölddel."]},"al-khobar-cities-v2":{"i":"/poi-images/al-khobar-cities-v2.webp","s":"Gazdag kereskedelmi és tengerparti város a Perzsa-öbölben, amely szoros kapcsolatban áll Bahreinnel.","f":["A Fahd Király Töltésút (Causeway) innen indul Bahrein felé.","A tengerparti sétány (Corniche) népszerű szabadidős célpont."]},"al-khafji-cities-v2":{"i":"/poi-images/al-khafji-cities-v2.webp","s":"Kuvait északkeleti határánál fekvő város, amely a semleges zónában talált kőolajnak köszönhetően indult gyors növekedésnek.","f":["A város a második öbölháború idején heves harcok színtere volt.","Tengerpartjai a régió legérintetlenebb partszakaszai közé tartoznak."]},"hafar-al-batin-cities-v2":{"i":"/poi-images/hafar-al-batin-cities-v2.webp","s":"Ez az északkeleten fekvő s ","f":["A megújuló energiákat támogatja.","A tiszta technológiák központja."]},"oxagon-neom-economic-v2":{"i":"/poi-images/oxagon-neom-economic-v2.webp","s":"Az Oxagon egy teljesen lebegő ipari város koncepciója, amely a Vörös-tenger partján épülő futurisztikus Neom projekt része.","f":["Lebegő ipari város Neomban.","100%-ban megújuló energiára támaszkodik."]},"ras-al-khair-industrial-city-economic-v2":{"i":"/poi-images/ras-al-khair-industrial-city-economic-v2.webp","s":"Rasz al-Khair egy új ipari város a keleti parton, amely az ásványkincsek bányászatára és feldolgozására specializálódott.","f":["A bányászat központja.","Hatalmas alumíniumgyárral rendelkezik."]},"jazan-economic-city-economic-v2":{"i":"/poi-images/jazan-economic-city-economic-v2.webp","s":"A Dzsízán Gazdasági Város célja, hogy nehéz- és könnyűipari beruházásokkal fellendítse a délnyugati régió fejlődését.","f":["A nem olajalapú ipart hivatott fellendíteni.","A jemeni határ közelében fekszik."]},"waad-al-shamal-economic-v2":{"i":"/poi-images/waad-al-shamal-economic-v2.webp","s":"A Wa'ad Al Shamal egy hatalmas ipari projekt az ország északi részén, amely a foszfát bányászatára és feldolgozására fókuszál.","f":["A foszfátbányászat központja.","Erősíti az északi régió gazdaságát."]},"shoaiba-power-plant-economic-v2":{"i":"/poi-images/shoaiba-power-plant-economic-v2.webp","s":"A Shoaiba Erőmű egy hatalmas komplexum, amely amellett, hogy jelentős mennyiségű áramot termel, a világ egyik legnagyobb vízsótalanító üzemét is magában foglalja.","f":["A világ egyik legnagyobb erőműve.","Áramtermelés és vízsótalanítás egyben."]},"petro-rabigh-economic-v2":{"i":"/poi-images/petro-rabigh-economic-v2.webp","s":"A Petro Rabigh a világ egyik legnagyobb integrált finomító és petrolkémiai üzeme, amely Szaúd-Arábia nyugati partján található.","f":["Hatalmas finomító és petrolkémiai komplexum.","Közös vállalat a Sumitomo Chemical-lal."]},"shaybah-oil-field-economic-v2":{"i":"/poi-images/shaybah-oil-field-economic-v2.webp","s":"A Rub al-Háli sivatagban elszigetelten fekvő Sajba olajmező a mérnöki tudományok mesterműve, amely ebben a zord környezetben teszi lehetővé az olajkitermelést.","f":["Mélyen a Rub al-Háli sivatagban található.","Kiváló minőségű kőolajat termel."]},"jafurah-gas-field-economic-v2":{"i":"/poi-images/jafurah-gas-field-economic-v2.webp","s":"A Dzsafúra gázmező Szaúd-Arábia legnagyobb nem hagyományos földgázmezője, amely kulcsszerepet játszik az ország energiaterveiben.","f":["Az ország legnagyobb nem hagyományos gázmezője.","Fontos az energetikai átálláshoz."]},"sudair-industrial-city-economic-v2":{"i":"/poi-images/sudair-industrial-city-economic-v2.webp","s":"A Szudair Ipari és Üzleti Város egy növekvő csomópont Rijádtól északra, amelynek célja Szaúd-Arábia ipari diverzifikációjának támogatása.","f":["Nagy ipari komplexum Rijád közelében.","Sok nemzetközi céget vonz."]},"hegra-history-v2":{"i":"/poi-images/hegra-history-v2.webp","s":"Egy ősi nabateus város lenyűgöző sziklasírokkal.","f":["Szaúd-Arábia első UNESCO világöröksége.","Az 1. században épült."]},"masmak-fortress-history-v2":{"i":"/poi-images/masmak-fortress-history-v2.webp","s":"Egy történelmi agyag- és téglaerőd Rijád központjában.","f":["1865-ben épült.","Fontos szerepe volt Szaúd-Arábia alapításában."]},"at-turaif-diriyah-history-v2":{"i":"/poi-images/at-turaif-diriyah-history-v2.webp","s":"A szaúdi királyi család eredeti otthona.","f":["A 15. században alapították.","2010 óta UNESCO világörökség."]},"al-ula-old-town-history-v2":{"i":"/poi-images/al-ula-old-town-history-v2.webp","s":"Egy régi oázisváros elhagyatott vályogtéglás házakkal.","f":["A 12. századtól a 20. századig lakták.","Fontos megálló a tömjénúton."]},"quba-mosque-history-v2":{"i":"/poi-images/quba-mosque-history-v2.webp","s":"A valaha épült első mecset, amelyet Mohamed próféta alapított.","f":["622-ben épült.","Medinában található."]},"uhud-battlefield-history-v2":{"i":"/poi-images/uhud-battlefield-history-v2.webp","s":"A híres uhudi c 2.webp","s":"Egy ősi himjarita város romjai keresztény vértanúk tragikus történetével.","f":["Az i. e. 6. századtól lakták.","A helyszínt a Korán is megemlíti."]},"al-muazzam-fort-history-v2":{"i":"/poi-images/al-muazzam-fort-history-v2.webp","s":"Fontos oszmán erőd a történelmi Hajj zarándokút mentén.","f":["1622-ben épült.","A zarándokok és a vízforrások védelmére szolgált."]},"tabuk-castle-history-v2":{"i":"/poi-images/tabuk-castle-history-v2.webp","s":"Egy 16.","f":["1559-ben épült.","Saját mecsettel rendelkezik a belsejében."]},"souq-okaz-history-v2":{"i":"/poi-images/souq-okaz-history-v2.webp","s":"Az iszlám előtti Arábia egyik leghíresebb piaca, ahol a költők találkoztak.","f":["A 6. században volt aktív.","Évente költészeti versenyt tartottak."]},"al-rajajil-history-v2":{"i":"/poi-images/al-rajajil-history-v2.webp","s":"Egy rejtélyes menhír-csoport, amelyet Szaúd-Arábia Stonehenge-ként ismernek.","f":["Az i. e. 4. évezredből származnak.","54 kőoszlopból állnak."]},"ain-zubaydah-history-v2":{"i":"/poi-images/ain-zubaydah-history-v2.webp","s":"Történelmi vízvezetékrendszer, amelyet Mekka és a zarándokok vízellátására építettek.","f":["A 9. században épült.","Zubajda hercegnő megbízásából."]},"kingdom-centre-landmarks-v2":{"i":"/poi-images/kingdom-centre-landmarks-v2.webp","s":"Ez az ikonikus rijádi felhőkarcoló fordított parabola alakjáról és az égi hídjáról ismert.","f":["Az épület 302 méter magas.","Az égi híd panorámás kilátást nyújt Rijádra."]},"kaaba-landmarks-v2":{"i":"/poi-images/kaaba-landmarks-v2.webp","s":"A mekkai al-Haram mecset közepén álló kocka alakú épület, az iszlám legszentebb helye.","f":["Több mint egymilliárd muszlim spirituális központja világszerte.","A muszlimok imairánya (kibla)."]},"abraj-al-bait-landmarks-v2":{"i":"/poi-images/abraj-al-bait-landmarks-v2.webp","s":"Gigantikus szállodakomplexum Mekkában, amely a világ legnagyobb óratornyával büszkélkedhet, közvetlenül a Nagymecset mellett.","f":["A központi szálloda 601 méter magas.","A világ legnagyobb számlapjával rendelkezik."]},"prophets-mosque-landmarks-v2":{"i":"/poi-images/prophets-mosque-landmarks-v2.webp","s":"Az iszlám második legszentebb helye Medinában, amelyet Mohamed próféta épített, és zöld kupoláiról ismert.","f":["Eredetileg a próféta lakóháza volt.","A Zöld Kupola jelzi Mohamed sírját."]},"king-fahds-fountain-landmarks-v2":{"i":"/poi-images/king-fahds-fountain-landmarks-v2.webp","s":"Ez a lenyűgöző dzsiddai szökőkút tengervizet lő a magasba rekordot jelentő magasságig.","f":["A világ legmagasabb szökőkútja.","A vízsugár akár a 312 méteres magasságot is eléri."]},"edge-of-the-world-landmarks-v2":{"i":"/poi-images/edge-of-the-world-landmarks-v2.webp","s":"Lélegzetelállító geológiai képződmény Rijádtól északnyugatra, drámai sziklákkal és végtelen sivatagi kilátással.","f":["A Tuvajk-hegység része.","Szinte függőlegesen zuhan 300 métert a mélybe."]},"elephant-rock-landmarks-v2":{"i":"/poi-images/elephant-rock-landmarks-v2.webp","s":"Egy hatalmas vörös homokkő monolit Al-Ula közelében, amely a természetes erózió révén egy elefánt megdöbbentő formáját vette fel.","f":["Al-Ula nevezetessége, Jabal AlFil néven is ismert.","A szikla 52 méter magas."]},"quba-mosque-landmarks-v2":{"i":"/poi-images/quba-mosque-landmarks-v2.webp","s":"Ez a vakítóan fehér medinai mecset az iszlám történelmének elsőként épült mecsetjének számít.","f":["Az alapkövet Mohamed próféta rakta le.","Kr. u. 622-ben épült."]},"al-faisaliyah-centre-landmarks-v2":{"i":"/poi-images/al-faisaliyah-centre-landmarks-v2.webp","s":"Feltűnő felhőkarcoló Rijádban, amely piramisszerű formájáról és a tetején lévő arany üveggömbről ismert.","f":["Az épület 267 méter magas.","Az aranygömb egy luxusétteremnek ad otthont."]},"jabal-al-nour-landmarks-v2":{"i":"/poi-images/jabal-al-nour-landmarks-v2.webp","s":"Egy jellegzetes hegy Mekka közelében, ahol a híres Híra barlang található, egy hatalmas spirituális jelentőségű hely.","f":["A név fordítása \"A Fény hegye\".","A hegy 642 méter magas."]},"maraya-concert-hall-landmarks-v2":{"i":"/poi-images/maraya-concert-hall-landmarks-v2.webp","s":"Ez a hihetetlen épület az Ashar-völgyben teljesen tükrökkel van borítva, amelyek visszatükrözik a sivatagi tájat.","f":["A világ legnagyobb tükörborítású épülete.","Közel 10 000 négyzetméter tükörfelülettel rendelkezik."]},"al-wahbah-crater-landmarks-v2":{"i":"/poi-images/al-wahbah-crater-landmarks-v2.webp","s":"Egy gigantikus vulkáni kráter a Harrat Kishb bazaltfennsík nyugati szélén, amelyet gyakran meteoritkráternek hisznek.","f":["A kráter átmérője 2 kilométer.","Körülbelül 250 méter mély."]},"kapsarc-landmarks-v2":{"i":"/poi-images/kapsarc-landmarks-v2.webp","s":"Egy korszerű kutatóközpont Rijádban, amely Zaha Hadid futurisztikus, sejtszerű építészetéről híres.","f":["A sztárépítész, Zaha Hadid tervezte.","Méhsejtszerű, kristályos szerkezetekből áll."]},"rijal-almaa-landmarks-v2":{"i":"/poi-images/rijal-almaa-landmarks-v2.webp","s":"Egy festői hegyi falu az Aszír régióban, amely egyedülálló, többszintes kőházairól és színes freskóiról ismert.","f":["A kőtornyok közül sok több mint 700 éves.","A házak kvarckőből és vályogból épültek."]},"ithra-center-landmarks-v2":{"i":"/poi-images/ithra-center-landmarks-v2.webp","s":"Építészeti csoda Dahránban, amely Szaúd-Arábia vezető kulturális és oktatási központjaként szolgál.","f":["A norvég Snøhetta építésziroda tervezte.","A dizájnt a sivatagi sima sziklák ihlették."]},"mount-uhud-landmarks-v2":{"i":"/poi-images/mount-uhud-landmarks-v2.webp","s":"Történelmi jelentőségű hegy Medinától északra, ahol a korai iszlám történelem egyik legfontosabb csatája zajlott.","f":["A híres uhudi csata helyszíne Kr. u. 625-ben.","A hegy 1077 méter magas."]},"sa-king-abdullah-park-life-v2":{"i":"/poi-images/sa-king-abdullah-park-life-v2.webp","s":"Egy nagy nyilvános park Rijádban kivilágított zenélő szökőkutakkal és széles sétányokkal.","f":["2013-ban nyitották meg.","Egy 12 méter széles gyalogos sétány található itt."]},"sa-salam-park-life-v2":{"i":"/poi-images/sa-salam-park-life-v2.webp","s":"Egy zöld oázis Rijád szívében, nagy mesterséges tóval és pálmafaligetekkel.","f":["A mesterséges tó 33 000 négyzetméteres.","Körülbelül 1000 datolyapálma nő a parkban."]},"sa-al-hada-rose-farms-life-v2":{"i":"/poi-images/sa-al-hada-rose-farms-life-v2.webp","s":"Teraszos virágföldek a hegyekben, amelyek a híres taifi rózsavíz előállításáról ismertek.","f":["Évente több millió rózsát termelnek itt.","A betakarítási szezon általában áprilisban van."]},"sa-fakieh-aquarium-life-v2":{"i":"/poi-images/sa-fakieh-aquarium-life-v2.webp","s":"Szaúd-Arábia egyetlen nyilvános akváriuma, amely a Vörös-tenger tengeri élővilágát mutatja be.","f":["Több mint 200 tengeri fajnak ad otthont.","Napi delfin- és oroszlánfókashow-kat tartanak."]},"sa-al-shallal-theme-park-life-v2":{"i":"/poi-images/sa-al-shallal-theme-park-life-v2.webp","s":"Egy nagy vidámpark Dzsidda tengerparti sétányán, hullámvasutakkal és jégpályával.","f":["Évente körülbelül egymillió látogatót vonz.","Ázsia egyik legnagyobb hullámvasútja található itt."]},"sa-riyadh-zoo-life-v2":{"i":"/poi-images/sa-riyadh-zoo-life-v2.webp","s":"Szaúd-Arábia legnagyobb és legrégebbi állatkertje, egzotikus és hazai állatok széles választékával.","f":["1957-ben alapították, eredetileg a királyi család számára.","Több mint 1500 állatnak ad otthont 40 fajból."]},"sa-al-ahsa-date-farms-life-v2":{"i":"/poi-images/sa-al-ahsa-date-farms-life-v2.webp","s":"A világ legnagyobb oázisa, amely hatalmas datolyapálma-ligeteiről és hagyományos öntözőrendszereiről ismert.","f":["Több mint 2,5 millió datolyapálmának ad otthont.","2018-ban az UNESCO Világörökség részévé nyilvánították."]},"sa-mahazat-as-sayd-life-v2":{"i":"/poi-images/sa-mahazat-as-sayd-life-v2.webp","s":"Egy teljesen bekerített természetvédelmi terület, amelyet veszélyeztetett sivatagi állatok visszatelepítésére használnak.","f":["2244 négyzetkilométeres területével rendkívül nagy.","Itt él a súlyosan veszélyeztetett arab bejza."]},"sa-national-museum-park-life-v2":{"i":"/poi-images/sa-national-museum-park-life-v2.webp","s":"Egy gyönyörűen parkosított kert a rijádi Nemzeti Múzeum körül, sétányokkal és csendes pihenőhelyekkel.","f":["A King Abdulaziz Történelmi Központ része.","Hagyományos iszlám kertelemeket tartalmaz."]},"sa-jubail-mangrove-park-life-v2":{"i":"/poi-images/sa-jubail-mangrove-park-life-v2.webp","s":"Védett vizes élőhely a Perzsa-öböl partján, amely számos madárfaj élőhelyéül szolgál.","f":["A mangrovefák védik a partot az eróziótól.","Fa pallósorok vezetnek a látogatók számára."]},"sa-taif-strawberry-farm-life-v2":{"i":"/poi-images/sa-taif-strawberry-farm-life-v2.webp","s":"Egy mezőgazdasági farm Taif hűvös hegyeiben, ahol a látogatók friss epret szedhetnek.","f":["A régió hűvös éghajlatát használja ki.","Olyan termékeket is kínálnak, mint az eperlekvár."]},"sa-atallah-happy-land-park-life-v2":{"i":"/poi-images/sa-atallah-happy-land-park-life-v2.webp","s":"Dzsidda egyik legrégebbi vidámparkja, vidámparki játékok és attrakciók széles választékával.","f":["Már 1986-ban megnyitotta kapuit.","Egy nagy óriáskerékkel rendelkezik, amely a tengerre néz."]},"sa-king-fahd-park-dammam-life-v2":{"i":"/poi-images/sa-king-fahd-park-dammam-life-v2.webp","s":"Egy kiterjedt rekreációs park Dammámban, mesterséges lagúnákkal, vízesésekkel és sok zöldfelülettel.","f":["Ez a legnagyobb park a szaúdi Keleti Tartományban.","1,2 millió négyzetméteres területet foglal el."]},"sa-nofa-wildlife-safari-life-v2":{"i":"/poi-images/sa-nofa-wildlife-safari-life-v2.webp","s":"Egy afrikai ihletésű vadaspark Rijád közelében, amely vezetett szafaritúrákat kínál.","f":["Több mint 700 állatnak, köztük zsiráfoknak és gepárdoknak ad otthont.","A területen egy golfpálya is található."]},"sa-al-rudaf-park-life-v2":{"i":"/poi-images/sa-al-rudaf-park-life-v2.webp","s":"Egy népszerű családi park Taifban, amely zenei szökőkútjairól és virágkiállításairól híres.","f":["A nagy szökőkút akár 80 méter magasra is fellövi a vizet.","A zöldterület több mint 560 000 négyzetméter."]},"sa-al-ghat-national-park-life-v2":{"i":"/poi-images/sa-al-ghat-national-park-life-v2.webp","s":"Sivatagos tájjal rendelkező természetvédelmi terület, amelyet akácfái és piknikezőhelyei miatt kedvelnek.","f":["Egy hegyekkel körülvett völgyben fekszik.","Fontos terület a helyi növényvilág megőrzése szempontjából."]},"sa-al-jouf-olive-orchards-life-v2":{"i":"/poi-images/sa-al-jouf-olive-orchards-life-v2.webp","s":"A Közel-Kelet legnagyobb olajbogyó-termesztő vidéke, amely kiváló minőségű olívaolajat állít elő.","f":["Több mint 18 millió olajfa található itt.","Guinness-rekorder, mint a legnagyobb modern olajbogyófarm."]},"sa-ibex-reserve-life-v2":{"i":"/poi-images/sa-ibex-reserve-life-v2.webp","s":"Egy hegyvidéki védett terület Rijádtól délre, amelyet kifejezetten a núbiai kőszáli kecske védelmére hoztak létre.","f":["Mély völgyeket és meredek sziklákat foglal magában.","A kőszáli kecskék mellett szirtiborzok és rókák is élnek itt."]},"sa-water-splash-park-life-v2":{"i":"/poi-images/sa-water-splash-park-life-v2.webp","s":"Egy családbarát vízi vidámpark Rijádban, medencékkel, csúszdákkal és piknikezőhelyekkel.","f":["Különösen népszerű a forró nyári hónapokban.","Külön részleggel rendelkezik a kisgyermekek számára."]},"sa-jeddah-corniche-parks-life-v2":{"i":"/poi-images/sa-jeddah-corniche-parks-life-v2.webp","s":"A Vörös-tenger partján húzódó, kilométereken át elterülő parkosított rekreációs területek sora.","f":["Modern művészeti szobrokkal van díszítve.","Népszerű hely naplementekor a kerékpározók és futók körében."]},"jabal-sawda-nature-v2":{"i":"/poi-images/jabal-sawda-nature-v2.webp","s":"Szaúd-Arábia legmagasabb hegycsúcsa, amely hűvösebb éghajlatáról és sűrű borókaerdeiről ismert.","f":["Magassága eléri a mintegy 3000 métert.","Népszerű úti cél a túrázók és a természet szerelmesei körében."]},"asir-national-park-nature-v2":{"i":"/poi-images/asir-national-park-nature-v2.webp","s":"Szaúd-Arábia első nemzeti parkja, amely érintetlen hegyvidéki tájat, valamint gazdag növény- és állatvilágot véd.","f":["1981-ben alapították.","A veszélyeztetett arab leopárd otthona."]},"wadi-hanifa-nature-v2":{"i":"/poi-images/wadi-hanifa-nature-v2.webp","s":"Rijádon kanyargó történelmi folyóvölgy, amelyet fontos ökológiai rekreációs területté alakítottak.","f":["120 kilométer hosszan terül el.","A főváros természetes víztisztítását szolgálja."]},"jabal-tuwaiq-nature-v2":{"i":"/poi-images/jabal-tuwaiq-nature-v2.webp","s":"Egy feltűnő mészkőgerinc, amely hatalmas gerincként húzódik végig a Nadzsd régión.","f":["Több mint 800 kilométer hosszan húzódik.","Meredek szikláit gyakran 'a világ peremének' nevezik."]},"al-asfar-lake-nature-v2":{"i":"/poi-images/al-asfar-lake-nature-v2.webp","s":"Egy kiterjedt vizes élőhely az Al-Ahsza oázisban, amely vándormadarak ezreinek nyújt menedéket.","f":["Az UNESCO által elismert világörökségi helyszín.","Homokdűnék és buja növényzet veszi körül."]},"farasan-islands-nature-v2":{"i":"/poi-images/farasan-islands-nature-v2.webp","s":"Jelentős tengeri természetvédelmi terület a Vörös-tengerben, érintetlen korallzátonyokkal és ritka állatfajokkal.","f":["Védi a helyi dugongpopulációt.","Fontos költőhely a tengeri teknősök számára."]},"jabal-al-lawz-nature-v2":{"i":"/poi-images/jabal-al-lawz-nature-v2.webp","s":"A Szaúd-Arábia északnyugati részén fekvő 'Mandula-hegy' az ország azon kevés helyeinek egyike, ahol télen havazik.","f":["Magassága eléri a 2580 métert.","Nevét az egykor itt nőtt mandulafákról kapta."]},"wadi-qanuna-nature-v2":{"i":"/poi-images/wadi-qanuna-nature-v2.webp","s":"A régió egyik legnagyobb és legszebb völgye, amelyen szinte egész évben víz folyik keresztül.","f":["A folyóvölgy hossza több mint 100 kilométer.","Pálmafák és buja helyi növényzet veszi körül."]},"raghadan-forest-nature-v2":{"i":"/poi-images/raghadan-forest-nature-v2.webp","s":"Sűrű erdőpark Al Baha közelében, amely ősi fáiról és a hegyekre nyíló lélegzetelállító kilátásáról ismert.","f":["Híres a parkban élő játékos páviánokról.","Függőhidakat kínál a látogatóknak."]},"al-kharrarah-nature-v2":{"i":"/poi-images/al-kharrarah-nature-v2.webp","s":"Lenyűgöző nemzeti park mélyvörös homokdűnékkel, amelyek esőzések után ideiglenes tavat hoznak létre.","f":["Az eső után kialakuló tavat a 'Folyékony fény tavának' is nevezik.","A Tuvajk-hegység közelében található."]},"sharaan-nature-reserve-nature-v2":{"i":"/poi-images/sharaan-nature-reserve-nature-v2.webp","s":"Védett terület az Al Ula régióban, amely a sivatag természetes élőhelyeinek és állatfajainak helyreállítására összpontosít.","f":["A cél az, hogy biztonságos menedékké váljon az arab leopárd számára.","Drámai homokkő formációkból áll."]},"thumamah-national-park-nature-v2":{"i":"/poi-images/thumamah-national-park-nature-v2.webp","s":"Egy kiterjedt sivatagi park Rijádtól északra, amely népszerű a terepjárós kalandok és a sivatagi kempingezés szerelmesei körében.","f":["Számos dűnével rendelkezik, amelyek ideálisak a homokdeszkázáshoz.","Hagyományos beduin sátrakat kínál a turistáknak."]},"jabal-daka-nature-v2":{"i":"/poi-images/jabal-daka-nature-v2.webp","s":"A Taif régió legmagasabb hegye, amely lélegzetelállító naplementéiről és meredek szikláiról ismert.","f":["A hegyet gyakran sűrű köd borítja.","Népszerű helyszín a csillagvizsgálók számára."]},"wadi-namar-nature-v2":{"i":"/poi-images/wadi-namar-nature-v2.webp","s":"Egy gyönyörű völgy mesterséges tóval és vízeséssel Rijádban, amely ideális hely a családi kirándulásokhoz.","f":["A tó partján egy 2 kilométer hosszú sétány található.","Népszerű piknikezőhely a helyiek körében."]},"raydah-escarpment-reserve-nature-v2":{"i":"/poi-images/raydah-escarpment-reserve-nature-v2.webp","s":"Meredeken lejtő természetvédelmi terület az Aszír-hegységben, amely sűrű erdőknek és ritka madárfajoknak ad otthont.","f":["Az aszíri szarka egyik utolsó megmaradt menedéke.","Mély szurdokok és magas sziklák jellemzik."]},"jabal-shada-nature-v2":{"i":"/poi-images/jabal-shada-nature-v2.webp","s":"Hegymasszívum, amely szokatlan sziklaalakzatairól és ősi barlanglakásairól híres.","f":["A barlangokat évezredek óta lakták emberek.","A gránittömböket a szél és az időjárás formálta."]},"uruq-bani-maarid-nature-v2":{"i":"/poi-images/uruq-bani-maarid-nature-v2.webp","s":"Természetvédelmi terület az Üres Negyed (Rub al-Háli) nyugati peremén, ahol sikeresen visszatelepítették az arab bejzát.","f":["Az UNESCO által elismert természeti világörökség.","A táj hatalmas, egyenes homokdűnékből áll."]},"king-salman-nature-v2":{"i":"/poi-images/king-salman-nature-v2.webp","s":"A Közel-Kelet egyik legnagyobb védett területe, amely Észak-Arábia történelmi tájait és biológiai sokféleségét őrzi.","f":["Olyan területet foglal magába, amely nagyobb, mint sok ország.","Olyan állatokat véd, mint az arab farkas és a homoki gazella."]},"rawdat-khuraim-nature-v2":{"i":"/poi-images/rawdat-khuraim-nature-v2.webp","s":"Egy zöld oázis és erdőterület a sivatag közepén, amelyet gyakran 'a király erdejének' is neveznek.","f":["Tavasszal a régió számtalan vadvirággal virágzik.","A királyi család kedvelt elvonulási helye."]},"jabal-qidr-nature-v2":{"i":"/poi-images/jabal-qidr-nature-v2.webp","s":"Egy feltűnő vulkáni kúp a Harrat Hajbar vulkáni mezőn, szurokfekete lávával.","f":["Szaúd-Arábia egyik legmagasabb vulkánjaként tartják számon.","A táj inkább egy idegen bolygóra hasonlít, mint egy sivatagra."]},"sa-rub-al-khali-relief-v2":{"i":"/poi-images/sa-rub-al-khali-relief-v2.webp","s":"A Föld legnagyobb egybefüggő homoksivataga, amely az Arab-félsziget déli részén terül el, és Üres negyedként is ismert.","f":["Területe körülbelül 650 000 km²","Szaúd-Arábia közel egyharmadát borítja"]},"sa-an-nafud-relief-v2":{"i":"/poi-images/sa-an-nafud-relief-v2.webp","s":"Szaúd-Arábia északi részének hatalmas homoksivataga, amely feltűnő, sarló alakú vöröses dűnéiről és hirtelen támadó erős szeleiről híres.","f":["Területe több mint 100 000 km²","Jellegzetes vörös homokjáról ismert"]},"sa-ad-dahna-relief-v2":{"i":"/poi-images/sa-ad-dahna-relief-v2.webp","s":"Ez a keskeny, de hosszú homokfolyosó köti össze az északi Nefúd-sivatagot a déli Rub al-Hálival, egy természetes vörös hidat alkotva.","f":["Több mint 1300 kilométer hosszan húzódik","Gyakran nevezik vörös homokfolyónak"]},"sa-hijaz-mountains-relief-v2":{"i":"/poi-images/sa-hijaz-mountains-relief-v2.webp","s":"Egy feltűnő hegylánc Szaúd-Arábia nyugati partján, amely meredeken ereszkedik a Vörös-tenger felé, és történelmileg fontos szerepet játszott.","f":["Elválasztja a parti síkságot a központi fennsíktól","Mekka és Medina szent városainak otthona"]},"sa-sarawat-mountains-relief-v2":{"i":"/poi-images/sa-sarawat-mountains-relief-v2.webp","s":"Az Arab-félsziget legmagasabb és legkiterjedtebb hegylánca, amelyet mélyen bevágódó völgyek és meredek sziklafalak jellemeznek.","f":["A nyugati parttal párhuzamosan fut","Itt találhatók az ország legmagasabb csúcsai"]},"sa-jabal-shammar-relief-v2":{"i":"/poi-images/sa-jabal-shammar-relief-v2.webp","s":"Egy zord hegyvidék az északi Háíl régióban, amelyet mély völgyek és masszív gránitsziklák uralnak.","f":["Két fő láncból áll: Adzsa és Szalma","A gránitsziklákon történelmi feliratok találhatók"]},"sa-midian-mountains-relief-v2":{"i":"/poi-images/sa-midian-mountains-relief-v2.webp","s":"Az ország legészaknyugatibb részén található hegység komplex geológiai képződményeiről és mély szurdokairól ismert.","f":["A nagyobb Hidzsáz-hegységrendszer része","A múltbeli vulkáni tevékenység formálta"]},"sa-wadi-ar-rummah-relief-v2":{"i":"/poi-images/sa-wadi-ar-rummah-relief-v2.webp","s":"Az Arab-félsziget leghosszabb és legszélesebb folyóvölgye, amely a nyugati hegyektől a keleti sivatagos területekig kígyózik.","f":["Teljes hossza körülbelül 600 kilométer","Csak heves esőzések után telik meg vízzel"]},"sa-wadi-ad-dawasir-relief-v2":{"i":"/poi-images/sa-wadi-ad-dawasir-relief-v2.webp","s":"Egy széles, termékeny völgy a déli Rijád régióban, amely mezőgazdasági oázisokkal töri meg a zord sivatagi tájat.","f":["Fontos csomópont a datolyatermesztésben","A Rub al-Háli pereméig nyúlik"]},"sa-wadi-fatima-relief-v2":{"i":"/poi-images/sa-wadi-fatima-relief-v2.webp","s":"Jelentős völgy Mekka és Dzsidda városai között, amely történelmileg a karavánok zöld éltető erejeként szolgált.","f":["Gátrendszerrel rendelkezik a vízszabályozáshoz","Hagyományosan citrusféléiről ismert"]},"sa-wadi-jizan-relief-v2":{"i":"/poi-images/sa-wadi-jizan-relief-v2.webp","s":"Rendkívül termékeny folyóvölgy az ország legdélnyugatibb részén, amely a Jemen felől érkező erős szezonális esőzésekből profitál.","f":["Az egyik legfontosabb mezőgazdasági terület","A Vádi Dzsízán gát a legnagyobb délen"]},"sa-harrat-khaybar-relief-v2":{"i":"/poi-images/sa-harrat-khaybar-relief-v2.webp","s":"Hatalmas vulkáni mező északnyugaton, amelyet kráterek, lávamezők és titokzatos ókori kőszerkezetek, úgynevezett „sárkánykapuk” borítanak.","f":["Több mint 12 000 km² területet borít","Komenditből álló fehér vulkánokat tartalmaz"]},"sa-harrat-rahat-relief-v2":{"i":"/poi-images/sa-harrat-rahat-relief-v2.webp","s":"A világ egyik legnagyobb lávamezeje, amely a szent várostól, Medinától délre húzódik, és fekete, zord tájat alkot.","f":["Körülbelül 300 kilométer hosszan terül el","Az 1256-os történelmi kitörés fenyegette Medinát"]},"sa-harrat-kishb-relief-v2":{"i":"/poi-images/sa-harrat-kishb-relief-v2.webp","s":"Egy vulkáni fennsík, amelyen lenyűgöző vulkáni kráterek találhatók, köztük a híres fehér Al-Wahbah-kráter a mező szélén.","f":["Területe körülbelül 6000 km²","Fiatalabb vulkáni tevékenység nyomait viseli magán"]},"sa-red-sea-coast-relief-v2":{"i":"/poi-images/sa-red-sea-coast-relief-v2.webp","s":"Az ország nyugati tengerpartja, amelyet lenyűgöző korallzátonyok, türkizkék víz és feltörekvő megaturisztikai projektek jellemeznek.","f":["Több mint 1700 kilométernyi partvonal","Érintetlen tengeri ökoszisztémák otthona"]},"sa-arabian-gulf-coast-relief-v2":{"i":"/poi-images/sa-arabian-gulf-coast-relief-v2.webp","s":"Szaúd-Arábia lapos, homokos keleti partja, amelyet történelmileg a gyöngykereskedelem jellemzett, ma pedig az ország olajiparának központja.","f":["A kikötők és sótalanító üzemek fontos helyszíne","Mangroveerdők is találhatók itt"]},"sa-tihamah-coastal-plain-relief-v2":{"i":"/poi-images/sa-tihamah-coastal-plain-relief-v2.webp","s":"Forró, párás parti síkság, amely a Vörös-tengerrel párhuzamosan fut, és a déli részén dúsabb növényzettel varázsol el.","f":["Szélessége 60 és 80 kilométer között változik","Magas páratartalom és rendkívül forró nyarak jellemzik"]},"sa-jabal-radhwa-relief-v2":{"i":"/poi-images/sa-jabal-radhwa-relief-v2.webp","s":"Feltűnő hegygerinc a Janbu régióban, amely vörösen emelkedik ki a környező síkságból, és a klasszikus arab költészetben is gyakran dicsőítették.","f":["Eléri a 2282 méteres magasságot","Zord természetéről és méztermeléséről ismert"]},"sa-jabal-salma-relief-v2":{"i":"/poi-images/sa-jabal-salma-relief-v2.webp","s":"A Dzsebel Sammar-hegység része, amely vulkáni krátereiről és mély vízlelőhelyeiről ismert, amelyek évezredek óta vonzzák a beduinokat.","f":["Legendák kötik a híres arab hőshöz, Hatim at-Tájhoz","Magassága eléri az 1200 métert"]},"sa-wadi-bisha-relief-v2":{"i":"/poi-images/sa-wadi-bisha-relief-v2.webp","s":"A délnyugat egyik legjelentősebb völgye, amelyet a Fahd király gát, a Közel-Kelet egyik legnagyobb duzzasztógátjának építése ural.","f":["A völgy több mint 400 kilométer hosszú","Fontos mezőgazdasági oázis több millió datolyapálmával"]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
