*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#060614;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:#0a0a1f;border-bottom:1px solid #ffffff14;position:relative;z-index:5}
header a.back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#ffffff14;color:#fff;text-decoration:none;font-weight:700}
header a.back:active{background:#ffffff28}
header h1{margin:0;font-size:1rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .langs{display:flex;gap:.25rem}
.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;background-image:radial-gradient(1.2px 1.2px at 12% 22%,#ffffff70,transparent),radial-gradient(1px 1px at 28% 68%,#ffffff55,transparent),radial-gradient(1.4px 1.4px at 47% 38%,#cfe4ff66,transparent),radial-gradient(1px 1px at 63% 18%,#ffffff50,transparent),radial-gradient(1.3px 1.3px at 78% 72%,#ffffff66,transparent),radial-gradient(1px 1px at 88% 33%,#cfe4ff55,transparent),radial-gradient(1px 1px at 38% 88%,#ffffff44,transparent),radial-gradient(1.2px 1.2px at 92% 58%,#ffffff55,transparent);background-repeat:no-repeat}
#svg{width:100%;height:100%;display:block;cursor:grab;position:relative;z-index:1}
#svg.drag{cursor:grabbing}
.region{fill:#161e3a;stroke:#6f9bf0;stroke-width:1.1;stroke-opacity:.7;transition:fill .15s}
.region:hover{fill:#28356e}
/* Island maps: the single island shape is decorative — don't let it grab taps
   (no sticky hover-highlight on touch, POI markers stay easy to tap). Pan still
   works via the svg background. */
#gR.noint .region{pointer-events:none}
#gR.noint .region:hover{fill:#161e3a}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#0a0f20;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#7cc0ff;filter:drop-shadow(0 0 2.4px #4aa6ff)}
.poi.g-sight circle{fill:#fcd34d;filter:drop-shadow(0 0 2.4px #f5b528)}
.poi.g-nature circle{fill:#4ade80;filter:drop-shadow(0 0 2.4px #22c55e)}
.poi.g-history circle{fill:#d0a6ff;filter:drop-shadow(0 0 2.4px #b266ff)}
.poi.g-industry circle{fill:#ffb066;filter:drop-shadow(0 0 2.4px #fb923c)}
.poi.g-other circle{fill:#b8c0cc;filter:drop-shadow(0 0 2px #9ca3af)}
.poi.dim{opacity:.16;pointer-events:none}
.poi.dim circle{filter:none}
.poi,.cluster{transition:opacity .2s}
#svg.dim-pois .poi,#svg.dim-pois .cluster{opacity:.1!important}
#svg.dim-pois .poi circle{filter:none}
.poi.match{pointer-events:auto}
.poi.match circle{stroke:#fff;stroke-width:2;filter:drop-shadow(0 0 4px #fff)}
.poi:hover circle,.poi.active circle{r:7.5;fill:#fff;opacity:1;filter:drop-shadow(0 0 6px #cfeaff) drop-shadow(0 0 11px #7fd0ff)}
.poi-metro{cursor:pointer}
.poi-metro .pm-halo{fill:#ffd54a;opacity:.18;animation:pmpulse 2.2s ease-in-out infinite}
.poi-metro .pm-ring{fill:none;stroke:#ffd54a;stroke-width:1.6;opacity:.85}
.poi-metro .pm-dot{fill:#fff;filter:drop-shadow(0 0 5px #ffd54a)}
.poi-metro .pm-label{fill:#fff;font-size:11px;font-weight:800;paint-order:stroke;stroke:#06061b;stroke-width:3.2px;stroke-linejoin:round;letter-spacing:.2px}
.poi-metro:hover .pm-ring,.poi-metro:focus .pm-ring{stroke-width:2.4;opacity:1}
.poi-metro:hover .pm-label{fill:#ffe98a}
@keyframes pmpulse{0%,100%{opacity:.16;transform:scale(1)}50%{opacity:.34;transform:scale(1.18)}}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:rgba(11,19,35,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(120,180,255,.3);border-radius:18px 18px 0 0;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -12px 44px rgba(0,0,0,.6)}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a,.popup .list .nl{display:flex;align-items:center;gap:.6rem;padding:.4rem .45rem;border-radius:10px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:hover,.popup .list a:active{background:rgba(120,180,255,.12)}
.popup .list .lthumb{width:42px;height:42px;border-radius:9px;flex-shrink:0;background:#1a2740 center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.popup .list .lthumb .dot{width:9px;height:9px;border-radius:50%}
.popup .list .lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.popup .list .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.popup .list .g{font-size:.64rem;color:#9fc4ff;text-transform:uppercase;letter-spacing:.04em}
.popup .list .lgo{color:#7fb0ff;font-size:1.2rem;font-weight:700;flex-shrink:0;padding-right:.3rem}
.popup .list .nl{color:#ffffffb0;font-style:normal}
.mapcard{position:fixed;z-index:20;width:max-content;min-width:150px;max-width:230px;background:rgba(11,19,35,.82);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);border:1px solid rgba(120,180,255,.34);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.62),0 0 0 1px rgba(120,180,255,.08);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-100%) translateY(-15px) scale(.95);transform-origin:bottom center;transition:opacity .16s,transform .16s}
.mapcard.open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-100%) translateY(-15px) scale(1)}
.mapcard--below{transform:translate(-50%,0) translateY(15px) scale(.95);transform-origin:top center}
.mapcard--below.open{transform:translate(-50%,0) translateY(15px) scale(1)}
.mapcard::after{content:"";position:absolute;left:var(--ax,50%);top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(11,19,35,.82)}
.mapcard--below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:rgba(11,19,35,.82)}
.mapcard .mc-img{width:100%;aspect-ratio:16/9;background:#1a2740 center/cover no-repeat;display:none;border-radius:13px 13px 0 0}
.mapcard .mc-img.has{display:block}
.mapcard .mc-body{padding:9px 11px 11px}
.mapcard .mc-type{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#7fb0ff;font-weight:700}
.mapcard .mc-name{font-size:.95rem;font-weight:800;color:#eef4ff;margin:1px 0 5px;line-height:1.2}
.mapcard .mc-desc{font-size:.76rem;color:#cfe0ff;line-height:1.4;margin:0 0 9px;display:none}
.mapcard .mc-desc.show{display:block}
.mapcard .mc-more{display:inline-block;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;text-decoration:none;font-weight:700;font-size:.78rem;padding:.42rem .75rem;border-radius:8px}
.mapcard .mc-sv{align-items:center;justify-content:center;width:28px;height:28px;margin-left:7px;vertical-align:-8px;border-radius:50%;background:#fbbc04;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.mapcard .mc-sv:hover{background:#f9ab00}
.mapcard .mc-sv svg{display:block}
.mapcard .mc-x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:.95rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.burst{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}
.burst.open{display:block}
.burst-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst-line{stroke:rgba(120,185,255,.4);stroke-width:1.1;stroke-linecap:round;animation:burstFade .25s ease-out}
.burst-core{fill:#cdeeff;filter:drop-shadow(0 0 5px #7fd0ff)}
.burst-dots{position:absolute;inset:0}
.burst-dot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;animation:burstPop .22s ease-out}
.burst-dot .bd{width:15px;height:15px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(8,16,34,.6),0 0 10px currentColor;transition:transform .12s}
.burst-dot:hover .bd,.burst-dot:focus-visible .bd{transform:scale(1.3)}
.burst-dot .bl{font-size:.72rem;font-weight:700;color:#eef4ff;background:rgba(8,14,28,.82);border:1px solid rgba(120,180,255,.25);padding:1.5px 6px;border-radius:7px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
@keyframes burstPop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes burstFade{from{opacity:0}to{opacity:1}}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}
</style>

-images/kp-tokchon-cities-v2.webp","s":"Tokchon is a thriving industrial city where North Korea's largest automobile factory for trucks operates.","f":["Home to the Sungri Motor Plant.","Important for national coal mining."]},"kp-kimchaek-cities-v2":{"i":"/poi-images/kp-kimchaek-cities-v2.webp","s":"Kimchaek, formerly Songjin, was named after a North Korean general and is an important port on the east coast.","f":["Important export port for industrial goods.","Has a major steel plant."]},"kp-rason-cities-v2":{"i":"/poi-images/kp-rason-cities-v2.webp","s":"Rason is a special economic zone in the far northeast where the borders of North Korea, China, and Russia meet.","f":["Free trade zone since the 1990s.","Year-round ice-free deep-water port."]},"kp-kusong-cities-v2":{"i":"/poi-images/kp-kusong-cities-v2.webp","s":"Kusong is located in the west of the country and has both military-strategic and industrial significance for the defense industry.","f":["Seat of the North Korean defense industry.","Includes secret underground production facilities."]},"kp-hyesan-cities-v2":{"i":"/poi-images/kp-hyesan-cities-v2.webp","s":"Hyesan is located on the Yalu River in the far north, known for freezing winters and the timber industry.","f":["Capital of the mountainous Ryanggang province.","Extremely cold winter temperatures below -20 °C."]},"kp-huichon-cities-v2":{"i":"/poi-images/kp-huichon-cities-v2.webp","s":"Huichon is a heavily industrialized city specializing in telecommunications and mechanical engineering.","f":["Manufacturing site for North Korean electronics.","Has several large hydroelectric power plants."]},"kp-jongju-cities-v2":{"i":"/poi-images/kp-jongju-cities-v2.webp","s":"Jongju is an agricultural transport hub in North Pyongan province by the Yellow Sea.","f":["Important station on the North Korean railway.","Center for fruit and rice cultivation."]},"kp-songrim-cities-v2":{"i":"/poi-images/kp-songrim-cities-v2.webp","s":"Songrim is located south of Pyongyang and is a central industrial city due to its massive Hwanghae Steel Works.","f":["Site of the large Hwanghae Steel Works.","Formerly known as Kyomipo."]},"kp-hoeryong-cities-v2":{"i":"/poi-images/kp-hoeryong-cities-v2.webp","s":"Hoeryong is located directly on the Tumen border with China and is famous as the birthplace of Kim Jong-suk, Kim Jong-il's mother.","f":["Important site of revolutionary history.","Popular pilgrimage destination for North Koreans."]},"kp-munchon-cities-v2":{"i":"/poi-images/kp-munchon-cities-v2.webp","s":"Munchon is a city on the east coast north of Wonsan that combines maritime economy and agriculture.","f":["Has several large shipbuilding facilities.","Major fishing infrastructure."]},"kp-manpo-cities-v2":{"i":"/poi-images/kp-manpo-cities-v2.webp","s":"Manpo is a picturesque city on the Yalu River acting as an important trading hub with the Chinese city of Ji'an.","f":["Connected to China by a railway bridge.","Area is dominated by dense coniferous forests."]},"kp-sonchon-cities-v2":{"i":"/poi-images/kp-sonchon-cities-v2.webp","s":"Sonchon is located in the plain of North Pyongan province and is characterized by vast rice fields.","f":["Important area for grain cultivation.","Was once a center of Christian missionary work."]},"kp-sinpho-cities-v2":{"i":"/poi-images/kp-sinpho-cities-v2.webp","s":"Sinpho is a coastal city on the Sea of Japan and is considered the heart of the North Korean submarine industry.","f":["Headquarters of the North Korean submarine fleet.","Has deep, protected bays."]},"kp-samjiyon-cities-v2":{"i":"/poi-images/kp-samjiyon-cities-v2.webp","s":"Samjiyon is located at the foot of the sacred Mount Paektu and was developed into a modern alpine model village.","f":["Located near the Paektusan massif.","Extensively modernized in recent years."]},"kp-pukchang-cities-v2":{"i":"/poi-images/kp-pukchang-cities-v2.webp","s":"Pukchang in South Pyongan province hosts North Korea's largest coal-fired power plant and is essential for the power supply.","f":["Seat of the Pukchang thermal power plant.","A major national energy supplier."]},"chongjin-steel-works-economic-v2":{"i":"/poi-images/chongjin-steel-works-economic-v2.webp","s":"A large steel plant located in the city of Chongjin, crucial for the North Korean economy.","f":["One of the largest steel plants in the country.","Produces a variety of steel products for domestic use and export."]},"hungnam-fertilizer-complex-economic-v2":{"i":"/poi-images/hungnam-fertilizer-complex-economic-v2.webp","s":"A massive industrial complex in Hungnam, vital for the production of fertilizers for the country's agriculture.","f":["One of the largest and oldest chemical complexes in North Korea.","Produces ammonium sulfate and other chemical products."]},"musan-iron-mine-economic-v2":{"i":"/poi-images/musan-iron-mine-economic-v2.webp","s":"One of the largest iron ore mines in Asia, located in Musan, which feeds the North Korean steel industry.","f":["An open-pit mine with vast estimated reserves.","A 98km pipeline transports the iron ore concentrate to the Chongjin Steel Works."]},"rason-port-economic-v2":{"i":"/poi-images/rason-port-economic-v2.webp","s":"A strategically important ice-free port in the Rason Special Economic Zone, facilitating trade with China and Russia.","f":["Has dedicated piers leased by China and Russia.","A key transit point for coal and other goods."]},"sinuiju-cosmetics-factory-economic-v2":{"i":"/poi-images/sinuiju-cosmetics-factory-economic-v2.webp","s":"A well-known factory in Sinuiju that produces a range of cosmetics for the North Korean domestic market.","f":["Produces the popular 'Bomhyanggi' (Scent of Spring) brand.","Was visited by Kim Jong-un as a model for modernizing light industry."]},"pukchang-thermal-power-plant-economic-v2":{"i":"/poi-images/pukchang-thermal-power-plant-economic-v2.webp","s":"The largest thermal power plant in North Korea, generating a significant portion of the country's electricity.","f":["Coal-fired power plant with a capacity of around 1,600 MW.","Production is often limited by coal shortages and aging equipment."]},"supung-hydroelectric-plant-economic-v2":{"i":"/poi-images/supung-hydroelectric-plant-economic-v2.webp","s":"A large hydroelectric dam on the Yalu River, operated jointly with China, providing electricity to both nations.","f":["Built during the Japanese occupation.","Has a capacity of around 700 MW."]},"hwanghae-iron-and-steel-complex-economic-v2":{"i":"/poi-images/hwanghae-iron-and-steel-complex-economic-v2.webp","s":"One of the largest steelworks in North Korea, located in Songnim.","f":["Originally established during the Japanese colonial period.","Produces a wide range of steel products, including rails and structural steel."]},"tanchon-port-economic-v2":{"i":"/poi-images/tanchon-port-economic-v2.webp","s":"An important port on the east coast, serving to export magnesite and other minerals from the nearby Tanchon mines.","f":["Infrastructure is focused on handling bulk cargo.","Closely tied to the Tanchon mining complex."]},"kumgol-zinc-mine-economic-v2":{"i":"/poi-images/kumgol-zinc-mine-economic-v2.webp","s":"Part of the Komdok Mining Complex, one of the largest producers of lead and zinc in Asia.","f":["The area is often called a 'sea of minerals'.","The mine has been in operation since the Japanese colonial period."]},"sunchon-vinalon-complex-economic-v2":{"i":"/poi-images/sunchon-vinalon-complex-economic-v2.webp","s":"A large factory complex that produces Vinalon, a synthetic fiber developed from anthracite coal and limestone.","f":["Vinalon is often called the 'Juche Fiber'.","The complex is a symbol of North Korea's economic self-reliance."]},"pyongyang-textile-mill-economic-v2":{"i":"/poi-images/pyongyang-textile-mill-economic-v2.webp","s":"One of the largest textile mills in Pyongyang, named in honor of Kim Jong-suk, Kim Il-sung's wife.","f":["Produces a wide range of fabrics from cotton and synthetic fibers.","A model factory for North Korea's light industry."]},"february-8-vinalon-complex-economic-v2":{"i":"/poi-images/february-8-vinalon-complex-economic-v2.webp","s":"Another major Vinalon production complex located near Hamhung, named for the founding day of the Korean People's Army.","f":["Intended to significantly boost the country's Vinalon production.","Construction began in the 1980s but was never fully completed."]},"taean-heavy-machine-complex-economic-v2":{"i":"/poi-images/taean-heavy-machine-complex-economic-v2.webp","s":"A large industrial complex near Nampo specializing in the production of heavy equipment for power plants.","f":["Produces turbines, generators, and large transformers.","Crucial for the construction and maintenance of North Korea's power infrastructure."]},"ryongsong-machine-complex-economic-v2":{"i":"/poi-images/ryongsong-machine-complex-economic-v2.webp","s":"A large machine plant in Hamhung that produces custom-made heavy machinery and industrial equipment.","f":["Known for producing large presses, rolling mills, and chemical reactors.","Plays a role in localizing industrial equipment."]},"kim-chaek-iron-and-steel-works-economic-v2":{"i":"/poi-images/kim-chaek-iron-and-steel-works-economic-v2.webp","s":"Another major steelworks, located in the city of Kimchaek.","f":["Closely linked to the Musan Mine for iron ore supply.","Originally built during Japanese rule as 'Seishin Iron Works'."]},"kusong-machine-tool-factory-economic-v2":{"i":"/poi-images/kusong-machine-tool-factory-economic-v2.webp","s":"An important factory in Kusong that specializes in producing machine tools for other industries.","f":["Products include lathes, milling machines, and drills.","Suspected of being involved in producing components for the missile program."]},"anju-coal-mining-complex-economic-v2":{"i":"/poi-images/anju-coal-mining-complex-economic-v2.webp","s":"One of the largest coal mining areas in North Korea, located in South Pyongan Province.","f":["Produces large quantities of anthracite coal.","The coal is used for thermal power plants and industry."]},"pyongyang-east-thermal-power-plant-economic-v2":{"i":"/poi-images/pyongyang-east-thermal-power-plant-economic-v2.webp","s":"An important power plant providing electricity and district heating to the capital city of Pyongyang.","f":["A coal-fired power plant.","Often operates at reduced capacity due to fuel shortages."]},"wiwon-power-plant-economic-v2":{"i":"/poi-images/wiwon-power-plant-economic-v2.webp","s":"A hydroelectric power plant on the Yalu River, jointly operated with China as part of a cascade of dams.","f":["Has a capacity of around 390 MW.","The power generated is shared between the two countries."]},"northkorea-songgyungwan-history-v2":{"i":"/poi-images/northkorea-songgyungwan-history-v2.webp","s":"The Koryo Museum in Kaesong was originally the highest Confucian academy of the Koryo Dynasty, known as Songgyungwan.","f":["Founded in 992 as the supreme educational institution.","Houses over 1,000 historical relics."]},"northkorea-sonjuk-bridge-history-v2":{"i":"/poi-images/northkorea-sonjuk-bridge-history-v2.webp","s":"Sonjuk Bridge is a small stone bridge in Kaesong, built in 1290.","f":["Built in 1290 from granite stone.","Site of the assassination of Jong Mong-ju (1392)."]},"northkorea-wang-gon-tomb-history-v2":{"i":"/poi-images/northkorea-wang-gon-tomb-history-v2.webp","s":"The Tomb of King Wang Gon, the founder of the Koryo Dynasty, lies in a wooded valley near Kaesong.","f":["Built in 943 for King Taejo (Wang Gon).","Heavily restored in the 1990s."]},"northkorea-pohyon-temple-history-v2":{"i":"/poi-images/northkorea-pohyon-temple-history-v2.webp","s":"Pohyon Temple in the Myohyang Mountains is one of North Korea's most important Buddhist complexes.","f":["Founded in 1042 during the Koryo period.","Houses the 13-story Sokka Pagoda."]},"northkorea-anak-tomb-3-history-v2":{"i":"/poi-images/northkorea-anak-tomb-3-history-v2.webp","s":"Anak Tomb No.","f":["Dates back to 357 AD.","Contains colorful, detailed wall paintings."]},"northkorea-kaesong-namdaemun-history-v2":{"i":"/poi-images/northkorea-kaesong-namdaemun-history-v2.webp","s":"Namdaemun (South Gate) is the only remaining gate of the ancient inner city wall of Kaesong, built towards the end of the Koryo Dynasty in 1394.","f":["Built in 1394 as part of the city fortifications.","The only surviving gate of the original seven."]},"northkorea-kongmin-tomb-history-v2":{"i":"/poi-images/northkorea-kongmin-tomb-history-v2.webp","s":"The Tomb of King Kongmin is one of the best-preserved royal mausoleums of the Koryo Dynasty, located in Kaesong.","f":["Built between 1365 and 1372.","Unique design with two adjacent mounds."]},"northkorea-kwangbop-temple-history-v2":{"i":"/poi-images/northkorea-kwangbop-temple-history-v2.webp","s":"Kwangbop Temple is located on Mount Taesong in Pyongyang.","f":["Originally founded in 392 AD.","Destroyed in the Korean War (1952), reconstructed in 1990."]},"northkorea-anhak-palace-ruins-history-v2":{"i":"/poi-images/northkorea-anhak-palace-ruins-history-v2.webp","s":"The ruins of Anhak Palace in Pyongyang mark the site of the grand royal residence of the Goguryeo Dynasty after the capital was moved there in 427.","f":["Built in 427 AD.","The palace consisted of 52 large buildings."]},"northkorea-taedong-gate-history-v2":{"i":"/poi-images/northkorea-taedong-gate-history-v2.webp","s":"The Taedong Gate (Taedongmun) is the surviving east gate of the ancient walled city of Pyongyang, sitting majestically on the banks of the Taedong River.","f":["Originally built in the 6th century.","The current wooden pavilion dates from 1635."]},"northkorea-ryongwang-pavilion-history-v2":{"i":"/poi-images/northkorea-ryongwang-pavilion-history-v2.webp","s":"The Ryongwang Pavilion is located right next to the Taedong Gate in Pyongyang and was built in the 12th century for defense as well as a lookout point over the river.","f":["Built in 1111 during the Koryo era.","Served as a military command post."]},"northkorea-ulmil-pavilion-history-v2":{"i":"/poi-images/northkorea-ulmil-pavilion-history-v2.webp","s":"The Ulmil Pavilion (Ulmildae) stands majestically on Moran Hill in the center of Pyongyang and originally dates back to the 6th century.","f":["Northwestern bastion of the Pyongyang city wall.","Foundation dates back to the 6th century."]},"northkorea-chilsong-gate-history-v2":{"i":"/poi-images/northkorea-chilsong-gate-history-v2.webp","s":"The Chilsong Gate (Gate of the Seven Stars) is the north gate of the ancient inner fortification of Pyongyang and is located on the edge of Moranbong Park.","f":["The north gate of the historical fortress of Pyongyang.","Located on Moran Hill."]},"northkorea-woljong-temple-history-v2":{"i":"/poi-images/northkorea-woljong-temple-history-v2.webp","s":"Woljong Temple is located deep in the dense forests of the Kuwol Mountains in South Hwanghae Province.","f":["Built in 846, later renovated in the Joseon period.","Located in the scenic Kuwol-san nature reserve."]},"northkorea-sungyang-seowon-history-v2":{"i":"/poi-images/northkorea-sungyang-seowon-history-v2.webp","s":"The Sungyang Academy in Kaesong, founded in 1573, is a classic example of a Seowon - a private Confucian academy of the Joseon period.","f":["Founded in 1573 as a Confucian academy.","Built in honor of the scholar Jong Mong-ju."]},"northkorea-manwoldae-ruins-history-v2":{"i":"/poi-images/northkorea-manwoldae-ruins-history-v2.webp","s":"Manwoldae, translated as 'Hill of the Full Moon', was the site of the magnificent royal palace of the Koryo Dynasty in Kaesong.","f":["Former main palace of the Koryo Empire.","Built in 919, burned in 1361."]},"northkorea-pyohun-temple-history-v2":{"i":"/poi-images/northkorea-pyohun-temple-history-v2.webp","s":"Pyohun Temple is one of the most famous surviving Buddhist temples in the Diamond Mountains (Kumgang-san).","f":["Built in 670 during the Silla era.","The most important of the once four great temples on Kumgang-san."]},"northkorea-kumsong-battlefield-history-v2":{"i":"/poi-images/northkorea-kumsong-battlefield-history-v2.webp","s":"The Kumsong Valley in Kangwon Province was the scene of the last and most massive offensive during the Korean War in July 1953, just weeks before the armistice.","f":["Scene of the Kumsong Offensive (July 1953).","The last major battle of the Korean War."]},"northkorea-hwangryong-fortress-history-v2":{"i":"/poi-images/northkorea-hwangryong-fortress-history-v2.webp","s":"The ruins of the Hwangryong Fortress (Yellow Dragon Fortress) stretch across the rugged coastal mountains near Nampo on the Yellow Sea.","f":["Built in the 5th century by Goguryeo.","Protected Pyongyang from maritime attacks."]},"northkorea-anguk-temple-history-v2":{"i":"/poi-images/northkorea-anguk-temple-history-v2.webp","s":"Anguk Temple in South Pyongan Province (near Pyongsong) is one of the oldest temples in North Korea, originally founded in 503 AD.","f":["Founded in 503, rebuilt in 1419.","Houses a 9-story stone pagoda."]},"juche-tower-landmarks-v2":{"i":"/poi-images/juche-tower-landmarks-v2.webp","s":"A monument in Pyongyang, symbolizing the Juche ideology.","f":["Inaugurated in 1982 for Kim Il-sung's 70th birthday.","Composed of 25,550 granite blocks, one for each day of Kim Il-sung's life up to his 70th birthday."]},"arch-of-triumph-pyongyang-landmarks-v2":{"i":"/poi-images/arch-of-triumph-pyongyang-landmarks-v2.webp","s":"Modeled on the Arc de Triomphe in Paris, built to commemorate the Korean resistance to Japan from 1925 to 1945.","f":["At 60 meters high, it is the second tallest triumphal arch in the world.","It was unveiled in 1982."]},"kumsusan-palace-of-the-sun-landmarks-v2":{"i":"/poi-images/kumsusan-palace-of-the-sun-landmarks-v2.webp","s":"Serves as the mausoleum for Kim Il-sung and Kim Jong-il, the former leaders of North Korea.","f":["Originally the official residence of Kim Il-sung.","It is the largest palace dedicated to a communist leader."]},"grand- oted as a model for the country's modern agriculture.","f":["Potatoes are an important staple food in this region.","The farms use mechanized equipment and tissue culture techniques."]},"kumgang-park-wonsan-life-v2":{"i":"/poi-images/kumgang-park-wonsan-life-v2.webp","s":"A public park in the coastal city of Wonsan, named after the famous Kumgang Mountains, serving as a recreational spot.","f":["Offers walking paths and views of the sea.","Often a venue for public events and celebrations."]},"rason-seafood-market-life-v2":{"i":"/poi-images/rason-seafood-market-life-v2.webp","s":"A market in the Rason Special Economic Zone where a variety of fresh and dried seafood is traded.","f":["Important for the local economy and cross-border trade.","Products include crab, squid, and various fish."]},"paektu-mountain-nature-v2":{"i":"/poi-images/paektu-mountain-nature-v2.webp","s":"An active volcano on the border with China and the highest mountain on the Korean Peninsula.","f":["Features a large crater lake called Heaven Lake at its summit.","Considered the spiritual birthplace of the Korean people in Korean mythology."]},"myohyang-mountains-nature-v2":{"i":"/poi-images/myohyang-mountains-nature-v2.webp","s":"A mountain range known for its mystical beauty and as one of Korea's most sacred places.","f":["The name means 'Mysterious Fragrant Mountain'.","Home to the Pohyon Buddhist temple."]},"kumgang-mountains-nature-v2":{"i":"/poi-images/kumgang-mountains-nature-v2.webp","s":"Also known as the Diamond Mountains, famous for its scenic rock formations, waterfalls, and ponds.","f":["The scenery changes dramatically with the seasons.","Divided into Inner, Outer, and Sea Kumgang."]},"taedong-river-nature-v2":{"i":"/poi-images/taedong-river-nature-v2.webp","s":"The second-longest river in North Korea, flowing through the capital city of Pyongyang.","f":["Approximately 439 km long.","The West Sea Barrage at its mouth regulates the water level."]},"yalu-river-nature-v2":{"i":"/poi-imag vince."]},"imjin-river-nature-v2":{"i":"/poi-images/imjin-river-nature-v2.webp","s":"A river that flows from North to South Korea, joining the Han River near Seoul.","f":["The seventh-largest river in Korea.","Site of several major battles throughout history."]},"sapho-lake-nature-v2":{"i":"/poi-images/sapho-lake-nature-v2.webp","s":"Another coastal lagoon near Hamhung that is an important bird habitat.","f":["Part of a larger wetland complex.","Important for local fishing."]},"ohyon-ri-laarch-forest-nature-v2":{"i":"/poi-images/ohyon-ri-laarch-forest-nature-v2.webp","s":"A protected area in Ryanggang Province, known for its extensive and ancient larch forests.","f":["Considered a Natural Monument.","The trees are adapted to the cold, harsh climate of the region."]},"ryongnim-virgin-forest-nature-v2":{"i":"/poi-images/ryongnim-virgin-forest-nature-v2.webp","s":"A large area of virgin forest in the Rangrim Mountains, home to rich biodiversity.","f":["Designated as a biosphere reserve.","Habitat for many rare species like the Manchurian black bear."]},"anam-bay-tidal-flat-nature-v2":{"i":"/poi-images/anam-bay-tidal-flat-nature-v2.webp","s":"A crucial wetland on the northeast coast, serving as a major stopover for migratory birds.","f":["Supports a large number of shorebirds.","The area's productivity is important for local fisheries."]},"kwail-county-forests-nature-v2":{"i":"/poi-images/kwail-county-forests-nature-v2.webp","s":"An area in South Hwanghae Province whose name means 'Fruit', renowned for its extensive orchards and forests.","f":["One of the country's largest fruit producers.","The forests help regulate the microclimate for fruit growing."]},"manphung-lake-nature-v2":{"i":"/poi-images/manphung-lake-nature-v2.webp","s":"An artificial lake northeast of Pyongyang, used for recreation and fishing.","f":["Part of an amusement park complex.","Popular for boating and water sports."]},"ullim-falls-nature-v2":{"i":"/poi-images/ullim-falls-nature-v2.webp","s":"A relatively newly discovered waterfall, its name meaning 'Echo', which has been developed into a tourist attraction.","f":["The main waterfall is 75 meters high.","Located in a remote valley near Wonsan."]},"kaema-plateau-relief-v2":{"i":"/poi-images/kaema-plateau-relief-v2.webp","s":"A large, high-altitude plateau in the north of North Korea, often called the 'Roof of Korea'.","f":["Average elevation of around 1,500 meters.","Drained by the Yalu and Tumen rivers."]},"chilbo-mountain-relief-v2":{"i":"/poi-images/chilbo-mountain-relief-v2.webp","s":"A mountain in North Hamgyong province, known for its exceptional rock formations and views of the Sea of Japan.","f":["The name means 'Seven Treasures'.","Divided into Inner, Outer, and Sea Chilbo."]},"kuwol-mountain-relief-v2":{"i":"/poi-images/kuwol-mountain-relief-v2.webp","s":"A mountain in South Hwanghae province, known for its scenic beauty and as one of Korea's sacred mountains.","f":["The name means 'Ninth Month Mountain'.","Home to several historic Buddhist temples and fortress ruins."]},"suyang-valley-relief-v2":{"i":"/poi-images/suyang-valley-relief-v2.webp","s":"A scenic valley near Haeju, known for its waterfalls and historical connections to the Goryeo dynasty.","f":["The Suyangsan Waterfall is a main attraction.","Said to have been a retreat for Goryeo dynasty loyalists."]},"tongchon-coast-relief-v2":{"i":"/poi-images/tongchon-coast-relief-v2.webp","s":"A stretch of coast in Kangwon province, featuring sandy beaches and scenic cliffs.","f":["Part of the greater Wonsan-Kalma tourist area.","Known for its clear waters."]},"musan-plateau-relief-v2":{"i":"/poi-images/musan-plateau-relief-v2.webp","s":"A plateau in North Hamgyong province, rich in iron ore deposits.","f":["The Musan Mine is one of the largest open-pit iron mines in Asia.","The region is crucial for North Korea's steel industry."]},"okryu-valley-relief-v2":{"i":"/poi-images/okryu-valley-relief-v2.webp","s":"A famous valley in the Kumgang Mountains, known for its jade-colored ponds and waterfalls.","f":["The name means 'Jade Stream Valley'.","One of the highlights of the Inner Kumgang hiking trails."]},"changbai-mountains-korean-side-relief-v2":{"i":"/poi-images/changbai-mountains-korean-side-relief-v2.webp","s":"The Korean side of the mountain range forming the border between China and North Korea.","f":["Includes Paektu Mountain, the highest peak.","Considered the backbone of the Korean Peninsula."]},"chosan-bay-coast-relief-v2":{"i":"/poi-images/chosan-bay-coast-relief-v2.webp","s":"A coastal area on the Yellow Sea in North Pyongan province, with extensive tidal flats.","f":["An important habitat for migratory birds.","The region is known for its clam and oyster farming."]},"puryong-valley-relief-v2":{"i":"/poi-images/puryong-valley-relief-v2.webp","s":"A valley in North Hamgyong province, through which the Puryong River flows.","f":["The area is known for its hydroelectric potential.","Surrounded by the Hamgyong Mountains."]},"taebaek-mountains-north-relief-v2":{"i":"/poi-images/taebaek-mountains-north-relief-v2.webp","s":"The northern extension of the Taebaek mountain range, which extends into North Korea and includes the Kumgang Mountains.","f":["Forms the main watershed of the Korean Peninsula.","The eastern slopes are steep, while the western slopes are more gentle."]},"ryongam-cavern-relief-v2":{"i":"/poi-images/ryongam-cavern-relief-v2.webp","s":"A large karst cave system near Pyongyang, known for its underground rivers and unique rock formations.","f":["Part of the greater Ryongmun cavern area.","The caves are filled with stalactites and stalagmites."]},"nandai-river-valley-relief-v2":{"i":"/poi-images/nandai-river-valley-relief-v2.webp","s":"The valley formed by the Nandai River as it flows through Hamhung to the Sea of Japan.","f":["The valley forms a fertile plain around Hamhung.","Important for agriculture and urban development."]},"ongjin-peninsula-coast-relief-v2":{"i":"/poi-images/ongjin-peninsula-coast-relief-v2.webp","s":"A peninsula on the Yellow Sea with a highly indented coastline and numerous offshore islands.","f":["Historically a location of military importance.","The coast is important for fishing and aquaculture."]},"hoechang-highlands-relief-v2":{"i":"/poi-images/hoechang-highlands-relief-v2.webp","s":"A mountainous region in South Pyongan province, part of Korea's central mountainous spine.","f":["Known for its mineral resources, including gold.","The area is sparsely populated and heavily forested."]},"sohung-river-valley-relief-v2":{"i":"/poi-images/sohung-river-valley-relief-v2.webp","s":"A fertile valley in North Hwanghae province, known for its agricultural output.","f":["One of the country's rice bowls.","The Sohung River irrigates the surrounding plains."]},"korea-bay-west-coast-relief-v2":{"i":"/poi-images/korea-bay-west-coast-relief-v2.webp","s":"The northern part of North Korea's west coast, forming the Korea Bay, with numerous islands and estuaries.","f":["Characterized by a large tidal range.","The estuary of the Yalu River is a major feature."]},"east-korea-bay-east-coast-relief-v2":{"i":"/poi-images/east-korea-bay-east-coast-relief-v2.webp","s":"A large bight on the east coast, including the cities of Hamhung and Wonsan, featuring deeper waters and sandy beaches.","f":["Major ports are located within this bay.","The tidal range is much smaller compared to the west coast."]},"songchon-river-gorge-relief-v2":{"i":"/poi-images/songchon-river-gorge-relief-v2.webp","s":"A gorge carved by the Songchon River through the central mountains of South Pyongan province.","f":["Known for its steep cliffs and dramatic scenery.","The area is rich in flora and fauna."]},"pyongyang-peneplain-relief-v2":{"i":"/poi-images/pyongyang-peneplain-relief-v2.webp","s":"An extensive, low-lying plain that surrounds the capital city of Pyongyang, one of the country's main agricultural regions.","f":["Crossed by the Taedong River and its tributaries.","Very fertile soil, ideal for rice cultivation."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}

function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,pend=false,dx=0,dy=0,sx=0,sy=0,pid=0;
// Drag uses a MOVE THRESHOLD: pointerdown only ARMS panning; we don't capture the
// pointer until it actually moves >4px. A click without movement therefore reaches
// the target's own handler — fixes desktop where setPointerCapture-on-down stole the
// click from .cluster and .region (country) elements (mobile tap was unaffected).
svg.addEventListener('pointerdown',e=>{if(e.isPrimary===false)return;pend=true;dr=false;dx=sx=e.clientX;dy=sy=e.clientY;pid=e.pointerId});
svg.addEventListener('pointermove',e=>{
  if(pend&&!dr){if(Math.hypot(e.clientX-sx,e.clientY-sy)<=4)return;dr=true;svg.classList.add('drag');try{svg.setPointerCapture(pid)}catch(_){}}
  if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()
});
svg.addEventListener('pointerup',()=>{pend=false;if(dr){dr=false;svg.classList.remove('drag');try{svg.releasePointerCapture(pid)}catch(_){}}});
svg.addEventListener('pointercancel',()=>{pend=false;dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false;pend=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');

const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
  const sv=document.getElementById('mcSv');
  if(c.v){var vAt=c.v.indexOf('@');sv.href='https://www.google.com/maps/@?api=1&map_action=pano&'+(vAt>0?'pano='+c.v.slice(0,vAt)+'&viewpoint='+c.v.slice(vAt+1):'viewpoint='+c.v);sv.style.display='inline-flex'}else{sv.style.display='none'}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Search-only entries (POIs on a sub-map): match by name, navigate to the sub-map.
  const extraHits=[];
  for(const e of SEARCH_EXTRA){if(e.s.includes(q)&&extraHits.length<20)extraHits.push(e)}
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0&&extraHits.length===0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0&&extraHits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  const exRow=e=>'<a data-extra="1" href="'+e.u+'"><span class="dot" style="background:#ffd54a"></span><span class="nm">'+e.n.replace(/[<>]/g,'')+'</span><span class="gr">›</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('')+extraHits.map(exRow).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const ax=e.target.closest('a[data-extra]');
  if(ax)return; // sub-map link: let the browser navigate
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
