 loc izolat din sud-estul Guineei-Bissau a fost proclamată unilateral independența față de Portugalia la 24 septembrie 1973.","f":["Locul primei Adunări Naționale.","Punct de hotar istoric al independenței."]},"guiledje-military-museum-history-v2":{"i":"/poi-images/guiledje-military-museum-history-v2.webp","s":"Guiledje a fost o bază militară strategică importantă în timpul războiului de eliberare.","f":["Fostă bază asediată.","Expune tancuri și arme originale."]},"cacheu-historic-center-history-v2":{"i":"/poi-images/cacheu-historic-center-history-v2.webp","s":"Centrul istoric din Cacheu cuprinde clădiri administrative coloniale și biserici din perioada portugheză.","f":["Unul dintre cele mai vechi locuri ale coloniei.","Include Casa Sclaviei."]},"kansala-ruins-history-v2":{"i":"/poi-images/kansala-ruins-history-v2.webp","s":"Kansalá a fost capitala fortificată a Imperiului Kaabu, un stat mandinka puternic care a dominat mari părți ale regiunii.","f":["Fosta capitală a Imperiului Kaabu.","Locul ultimei bătălii împotriva populației Fula."]},"porto-gole-history-v2":{"i":"/poi-images/porto-gole-history-v2.webp","s":"Un port fluvial istoric pe râul Geba, care a fost odată un punct important de transbordare pentru comerțul cu interiorul țării.","f":["Post comercial istoric pe râul Geba.","Punct important pentru exportul de mărfuri."]},"bissau-old-port-history-v2":{"i":"/poi-images/bissau-old-port-history-v2.webp","s":"Portul vechi (Porto de Bissau) este poarta istorică a orașului și a țării.","f":["Centrul economic original din Bissau.","Locul grevei istorice de la Pidjiguiti."]},"mansoa-mission-history-v2":{"i":"/poi-images/mansoa-mission-history-v2.webp","s":"Misiunea catolică din Mansôa este una dintre cele mai vechi instituții de învățământ din regiune.","f":["Centru important pentru educație.","Arhitectură colonială bine conservată."]},"canchungo-historic-site-history-v2":{"i":"/poi-images/canchungo-historic-site-history-v2.webp","s":"Canchungo, fost Vila Teixeira Pinto, are un trecut colonial bogat.","f":["Fost centru administrativ colonial.","Locul unor acorduri locale importante."]},"bafata-colonial-quarter-history-v2":{"i":"/poi-images/bafata-colonial-quarter-history-v2.webp","s":"Cartierul colonial din Bafatá este cunoscut pentru clădirile sale în culori pastelate și străzile pietruite.","f":["Clădiri coloniale bine conservate.","Oraș comercial important pe râul Geba."]},"farim-historic-town-history-v2":{"i":"/poi-images/farim-historic-town-history-v2.webp","s":"Farim a fost fondat în secolul al XVII-lea ca post portughez pentru a securiza comerțul împotriva raidurilor.","f":["Fondat în anul 1641.","Post istoric de protecție împotriva atacurilor."]},"fulacunda-ruins-history-v2":{"i":"/poi-images/fulacunda-ruins-history-v2.webp","s":"Fulacunda, în sudul țării, adăpostește vestigii ale infrastructurii coloniale care au făcut odată parte dintr-o rețea de posturi administrative și comerciale.","f":["Vestigii ale unui fost post comercial.","Simbol al istoriei coloniale regionale."]},"buba-historic-port-history-v2":{"i":"/poi-images/buba-historic-port-history-v2.webp","s":"Buba este situat la capătul Rio Grande de Buba și a fost istoric un port strategic pentru exportul de mărfuri din sud-est.","f":["Punctul terminus al Rio Grande de Buba.","Fost port de apă adâncă pentru mărfuri coloniale."]},"catio-historical-center-history-v2":{"i":"/poi-images/catio-historical-center-history-v2.webp","s":"Catió, în sudul îndepărtat, este un loc cu o arhitectură colonială distinctivă care amintește de perioada în care orașul era un centru pentru producția de orez.","f":["Centrul regiunii sudice a orezului.","Structură urbană colonială tradițională."]},"lino-correia-stadium-landmarks-v2":{"i":"/poi-images/lino-correia-stadium-landmarks-v2.webp","s":"Un stadion multifuncțional situat în inima orașului Bissau, utilizat în principal pentru meciuri de fotbal și fiind una dintre cele mai vechi structuri sportive din capitală.","f":["Găzduiește mai multe cluburi locale de fotbal.","Situat în apropierea portului din Bissau."]},"presidential-palace-bissau-landmarks-v2":{"i":"/poi-images/presidential-palace-bissau-landmarks-v2.webp","s":"Reședința oficială a președintelui Guineei-Bissau, o clădire colonială magnifică reconstruită după distrugerea sa în timpul războiului civil.","f":["A fost grav avariat în timpul războiului civil din 1998.","Una dintre cele mai proeminente clădiri din centrul orașului Bissau."]},"colinas-de-boe-palace-landmarks-v2":{"i":"/poi-images/colinas-de-boe-palace-landmarks-v2.webp","s":"Un complex guvernamental important din Bissau, care servește ca loc de întâlnire pentru adunările naționale și ceremonii de stat semnificative.","f":["Numit după regiunea Boé, unde a fost proclamată independența.","Găzduiește diverse birouri guvernamentale."]},"central-market-bissau-landmarks-v2":{"i":"/poi-images/central-market-bissau-landmarks-v2.webp","s":"Inima vibrantă a comerțului din Bissau, o piață colorată unde se vinde orice, de la alimente proaspete la meșteșuguri tradiționale.","f":["Un loc ideal pentru a observa viața de zi cu zi a locuitorilor.","Cunoscut pentru pește proaspăt și fructe tropicale."]},"bceao-building-bissau-landmarks-v2":{"i":"/poi-images/bceao-building-bissau-landmarks-v2.webp","s":"Sediul central al Băncii Centrale a Statelor din Africa de Vest în Bissau, o clădire modernă impunătoare care simbolizează stabilitatea economică a regiunii.","f":["Gestionează moneda franc CFA în Guineea-Bissau.","Una dintre cele mai bine securizate clădiri din oraș."]},"simao-mendes-hospital-landmarks-v2":{"i":"/poi-images/simao-mendes-hospital-landmarks-v2.webp","s":"Cel mai mare și important spital din țară, numit după un martir al luptei pentru independență, un punct de reper central în Bissau.","f":["Construit inițial în perioada colonială.","Servește ca spital universitar."]},"ilheu-do-rei-lighthouse-landmarks-v2":{"i":"/poi-images/ilheu-do-rei-lighthouse-landmarks-v2.webp","s":"Un far istoric situat pe o mică insulă vizavi de portul Bissau, care ghidează navele prin estuarul râului Geba.","f":["Oferă o vedere panoramică asupra orizontului orașului Bissau.","Indispensabil pentru siguranța traficului maritim din capitală."]},"stadium-24-september-landmarks-v2":{"i":"/poi-images/stadium-24-september-landmarks-v2.webp","s":"Cel mai mare stadion național din Guineea-Bissau, locul de desfășurare pentru meciuri internaționale de fotbal și celebrări naționale.","f":["Numit după ziua independenței țării.","Are o capacitate de aproximativ 20.000 de spectatori."]},"french-cultural-center-bissau-landmarks-v2":{"i":"/poi-images/french-cultural-center-bissau-landmarks-v2.webp","s":"Un centru cultural important din capitală, care oferă expoziții de artă, concerte și cursuri de limbă, promovând schimbul intercultural.","f":["Dispune de o bibliotecă și un cinematograf.","Un loc de întâlnire popular pentru artiști și intelectuali."]},"amilcar-cabral-university-landmarks-v2":{"i":"/poi-images/amilcar-cabral-university-landmarks-v2.webp","s":"Singura universitate publică din Guineea-Bissau, un centru pentru educație superioară și cercetare, numit după tatăl națiunii.","f":["A fost fondată în anul 2003.","Oferă cursuri în drept, medicină și științe sociale."]},"commercial-port-bissau-landmarks-v2":{"i":"/poi-images/commercial-port-bissau-landmarks-v2.webp","s":"Poarta economică a țării, prin care se desfășoară majoritatea exporturilor de caju și importurile de bunuri esențiale.","f":["Situat pe estuarul râului Geba.","Linia vitală pentru aprovizionarea capitalei și a interiorului țării."]},"bubaque-lighthouse-landmarks-v2":{"i":"/poi-images/bubaque-lighthouse-landmarks-v2.webp","s":"Un far proeminent pe insula Bubaque, servind ca punct de navigație important pentru navele din arhipelagul Bijagós.","f":["Marchează intrarea în cel mai important port al arhipelagului.","Un subiect foto popular pentru vizitatorii insulei."]},"bafata-bridge-landmarks-v2":{"i":"/poi-images/ba ande-relief-v2.webp","s":"Structura asemănătoare unui fjord a Rio Grande de Buba este unică din punct de vedere geologic în Africa de Vest, fiind tăiată adânc în podișul de coastă.","f":["Depresiune tectonică","Braț de mare adânc"]},"bolama-palm-forest-relief-v2":{"i":"/poi-images/bolama-palm-forest-relief-v2.webp","s":"Insula Bolama este acoperită de păduri dese de palmieri de ulei, care cresc atât sălbatic, cât și fiind cultivați de generații.","f":["Monocultură de palmieri","Floră insulară tropicală"]},"quinara-hills-relief-v2":{"i":"/poi-images/quinara-hills-relief-v2.webp","s":"Lanțurile de dealuri domoale din regiunea Quinará formează o cumpănă a apelor între marile sisteme fluviale din sud.","f":["Soluri lateritice","Savană deluroasă"]},"gabu-plateau-relief-v2":{"i":"/poi-images/gabu-plateau-relief-v2.webp","s":"Podișul Gabú din est este o zonă înaltă uscată, care marchează tranziția către zona saheliană a Africii de Vest.","f":["Relief semi-arid","Regiune de creștere a animalelor"]},"tombali-rainforest-relief-v2":{"i":"/poi-images/tombali-rainforest-relief-v2.webp","s":"În sudul extrem al Tombali se află ultimele resturi de pădure tropicală originară din Guineea-Bissau.","f":["Fragmente de pădure primară","Precipitații abundente"]},"cacheu-plain-relief-v2":{"i":"/poi-images/cacheu-plain-relief-v2.webp","s":"Câmpia Cacheu este o câmpie sedimentară joasă din nord, străbătută de numeroase brațe de mare și canale.","f":["Sedimente de coastă","Peisaj mlăștinos"]},"bubaque-coastal-relief-v2":{"i":"/poi-images/bubaque-coastal-relief-v2.webp","s":"Coasta din Bubaque prezintă formațiuni geologice interesante de laterit, care formează podișuri largi în timpul refluxului.","f":["Formațiuni de laterit","Podișuri de maree"]},"rubane-forest-relief-v2":{"i":"/poi-images/rubane-forest-relief-v2.webp","s":"Pădurea deasă de pe insula Rubane este un exemplu perfect de vegetație neatinsă a insulelor Bijagós.","f":["Pădure virgină insulară","Refugiu pentru plante rare"]},"bafata-hills-relief-v2":{"i":"/poi-images/bafata-hills-relief-v2.webp","s":"În jurul orașului Bafatá, terenul se ridică ușor, formând un peisaj deluros pitoresc deasupra râului Geba.","f":["Dealuri de mal","Soluri de pământ roșu"]},"farim-depression-relief-v2":{"i":"/poi-images/farim-depression-relief-v2.webp","s":"Depresiunea Farim din nordul țării este cunoscută pentru zăcămintele sale de fosfat și relieful său plat și întins.","f":["Depresiune geologică","Zonă bogată în minerale"]},"biombo-coastal-swamp-relief-v2":{"i":"/poi-images/biombo-coastal-swamp-relief-v2.webp","s":"Zonă mlăștinoasă din Biombo este un relief de tranziție între coastele nisipoase și câmpiile fluviale interioare.","f":["Pădure de mlaștină","Zonă de maree"]},"oio-plateau-relief-v2":{"i":"/poi-images/oio-plateau-relief-v2.webp","s":"Regiunea Oio constă predominant dintr-un podiș ușor ondulat, utilizat pentru agricultura pe scară largă.","f":["Podiș agrar","Relief vălurit"]},"galinhas-forest-relief-v2":{"i":"/poi-images/galinhas-forest-relief-v2.webp","s":"Insula Galinhas găzduiește o vegetație mixtă densă, formată din palmieri și arbori tropicali cu frunze căzătoare.","f":["Pădure mixtă","Biodiversitate insulară"]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=6;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry","other"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
