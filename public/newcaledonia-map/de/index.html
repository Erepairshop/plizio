#svg{width:100%;height:100%;display:block;cursor:grab;position:relative;z-index:1}

.region{fill:#161e3a;stroke:#6f9bf0;stroke-width:1.1;stroke-opacity:.7;transition:fill .15s}
.region:hover{fill:#28356e}

   works via the svg background. */
#gR.noint .region{pointer-events:none}

.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#0a0f20;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#7cc0ff;filter:drop-shadow(0 0 2.4px #4aa6ff)}
.poi.g-sight circle{fill:#fcd34d;filter:drop-shadow(0 0 2.4px #f5b528)}
.poi.g-nature circle{fill:#4ade80;filter:drop-shadow(0 0 2.4px #22c55e)}
.poi.g-history circle{fill:#d0a6ff;filter:drop-shadow(0 0 2.4px #b266ff)}
.poi.g-industry circle{fill:#ffb066;filter:drop-shadow(0 0 2.4px #fb923c)}
.poi.g-other circle{fill:#b8c0cc;filter:drop-shadow(0 0 2px #9ca3af)}
.poi.dim{opacity:.16;pointer-events:none}
.poi.dim circle{filter:none}
.poi,.cluster{transition:opacity .2s}
#svg.dim-pois .poi,#svg.dim-pois .cluster{opacity:.1!important}
#svg.dim-pois .poi circle{filter:none}
.poi.match{pointer-events:auto}
.poi.match circle{stroke:#fff;stroke-width:2;filter:drop-shadow(0 0 4px #fff)}
.poi:hover circle,.poi.active circle{r:7.5;fill:#fff;opacity:1;filter:drop-shadow(0 0 6px #cfeaff) drop-shadow(0 0 11px #7fd0ff)}
.poi-metro{cursor:pointer}
.poi-metro .pm-halo{fill:#ffd54a;opacity:.18;animation:pmpulse 2.2s ease-in-out infinite}
.poi-metro .pm-ring{fill:none;stroke:#ffd54a;stroke-width:1.6;opacity:.85}
.poi-metro .pm-dot{fill:#fff;filter:drop-shadow(0 0 5px #ffd54a)}
.poi-metro .pm-label{fill:#fff;font-size:11px;font-weight:800;paint-order:stroke;stroke:#06061b;stroke-width:3.2px;stroke-linejoin:round;letter-spacing:.2px}
.poi-metro:hover .pm-ring,.poi-metro:focus .pm-ring{stroke-width:2.4;opacity:1}
.poi-metro:hover .pm-label{fill:#ffe98a}
@keyframes pmpulse{0%,100%{opacity:.16;transform:scale(1)}50%{opacity:.34;transform:scale(1.18)}}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:rgba(11,19,35,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(120,180,255,.3);border-radius:18px 18px 0 0;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -12px 44px rgba(0,0,0,.6)}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a,.popup .list .nl{display:flex;align-items:center;gap:.6rem;padding:.4rem .45rem;border-radius:10px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:hover,.popup .list a:active{background:rgba(120,180,255,.12)}
.popup .list .lthumb{width:42px;height:42px;border-radius:9px;flex-shrink:0;background:#1a2740 center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.popup .list .lthumb .dot{width:9px;height:9px;border-radius:50%}
.popup .list .lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.popup .list .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.popup .list .g{font-size:.64rem;color:#9fc4ff;text-transform:uppercase;letter-spacing:.04em}
.popup .list .lgo{color:#7fb0ff;font-size:1.2rem;font-weight:700;flex-shrink:0;padding-right:.3rem}
.popup .list .nl{color:#ffffffb0;font-style:normal}

.mapcard.open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-100%) translateY(-15px) scale(1)}
.mapcard--below{transform:translate(-50%,0) translateY(15px) scale(.95);transform-origin:top center}
.mapcard--below.open{transform:translate(-50%,0) translateY(15px) scale(1)}
.mapcard::after{content:"";position:absolute;left:var(--ax,50%);top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(11,19,35,.82)}
.mapcard--below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:rgba(11,19,35,.82)}
.mapcard .mc-img{width:100%;aspect-ratio:16/9;background:#1a2740 center/cover no-repeat;display:none;border-radius:13px 13px 0 0}
.mapcard .mc-img.has{display:block}
.mapcard .mc-body{padding:9px 11px 11px}
.mapcard .mc-type{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#7fb0ff;font-weight:700}

.mapcard .mc-desc.show{display:block}
.mapcard .mc-more{display:inline-block;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;text-decoration:none;font-weight:700;font-size:.78rem;padding:.42rem .75rem;border-radius:8px}
.mapcard .mc-x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:.95rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.burst{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}
.burst.open{display:block}
.burst-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst-line{stroke:rgba(120,185,255,.4);stroke-width:1.1;stroke-linecap:round;animation:burstFade .25s ease-out}
.burst-core{fill:#cdeeff;filter:drop-shadow(0 0 5px #7fd0ff)}
.burst-dots{position:absolute;inset:0}
.burst-dot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;animation:burstPop .22s ease-out}
.burst-dot .bd{width:15px;height:15px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(8,16,34,.6),0 0 10px currentColor;transition:transform .12s}
.burst-dot:hover .bd,.burst-dot:focus-visible .bd{transform:scale(1.3)}
.burst-dot .bl{font-size:.72rem;font-weight:700;color:#eef4ff;background:rgba(8,14,28,.82);border:1px solid rgba(120,180,255,.25);padding:1.5px 6px;border-radius:7px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
@keyframes burstPop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes burstFade{from{opacity:0}to{opacity:1}}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}

const POI_CARD={"newcaledonia-noumea-cities-v2":{"i":"/poi-images/newcaledonia-noumea-cities-v2.webp","s":"Nouméa ist die Hauptstadt von Neukaledonien und liegt auf einer Halbinsel im Südwesten der Hauptinsel Grande Terre.","f":["Wurde im Jahr 1854 unter dem Namen Port-de-France gegründet.","Sitz des Sekretariats der Pazifischen Gemeinschaft."]},"newcaledonia-dumbea-cities-v2":{"i":"/poi-images/newcaledonia-dumbea-cities-v2.webp","s":"Dumbéa ist eine schnell wachsende Vorstadt von Nouméa und gehört zum Ballungsraum Groß-Nouméa.","f":["Zweitbevölkerungsreichste Gemeinde des Territoriums mit über 35.000 Einwohnern.","Beherbergt das größte Einkaufszentrum Neukaledoniens, das Knu-Mall."]},"newcaledonia-paita-cities-v2":{"i":"/poi-images/newcaledonia-paita-cities-v2.webp","s":"Païta liegt im Westen von Nouméa und beherbergt den wichtigsten internationalen Flughafen des Territoriums.","f":["Der internationale Flughafen La Tontouta befindet sich in dieser Gemeinde.","Traditionell bekannt für die jährliche Rindfleisch-Messe 'Fête du Bœuf'."]},"newcaledonia-kone-cities-v2":{"i":"/poi-images/newcaledonia-kone-cities-v2.webp","s":"Koné ist der Hauptort der Nordprovinz und ein wichtiges Zentrum für die Nickelindustrie im Norden.","f":["Standort der Koniambo-Nickelmine, einem der größten Industrieprojekte weltweit.","Das berühmte 'Herz von Voh' liegt ganz in der Nähe der Stadt."]},"newcaledonia-bourail-cities-v2":{"i":"/poi-images/newcaledonia-bourail-cities-v2.webp","s":"Bourail ist eine bedeutende Stadt an der Westküste, bekannt für ihre Viehzucht und touristischen Attraktionen.","f":["Zweitgrößte Gemeinde außerhalb des Ballungsraums Nouméa.","Beherbergt die berühmte Felsformation 'Bonhomme de Bourail'."]},"newcaledonia-koumac-cities-v2":{"i":"/poi-images/newcaledonia-koumac-cities-v2.webp","s":"Koumac ist ein wichtiges Versorgungszentrum im hohen Norden der Hauptinsel Grande Terre.","f":["Bekannt für seine beeindruckenden Kalksteinhöhlen in der Nähe.","Wichtiger Stopp für Reisende auf dem Weg zur Nordspitze der Insel."]},"newcaledonia-poindimie-cities-v2":{"i":"/poi-images/newcaledonia-poindimie-cities-v2.webp","s":"Poindimié ist das wichtigste wirtschaftliche und administrative Zentrum an der Nordostküste der Hauptinsel.","f":["Größte Gemeinde an der Ostküste mit etwa 5.000 Einwohnern.","Bedeutendes regionales Krankenhauszentrum für die Nordprovinz."]},"newcaledonia-houailou-cities-v2":{"i":"/poi-images/newcaledonia-houailou-cities-v2.webp","s":"Houaïlou ist eine Stadt an der Ostküste, die für ihren Lychee-Anbau und ihre Bergbautradition bekannt ist.","f":["Feiert jedes Jahr im Dezember das berühmte Lychee-Festival.","Wichtiger Standort für den Nickelabbau seit dem 19. Jahrhundert."]},"newcaledonia-canala-cities-v2":{"i":"/poi-images/newcaledonia-canala-cities-v2.webp","s":"Canala ist ein historisches Zentrum des Nickelbergbaus an der Ostküste von Neukaledonien.","f":["Ursprünglich im Jahr 1858 als Napoleonville gegründet.","Bekannt für seine heißen Quellen und spektakulären Wasserfälle."]},"newcaledonia-thio-cities-v2":{"i":"/poi-images/newcaledonia-thio-cities-v2.webp","s":"Thio gilt als die Wiege des Nickelbergbaus in Neukaledonien und liegt an der Südostküste.","f":["Hier wurde 1876 das erste Nickelerz auf der Insel abgebaut.","Beherbergt ein interessantes Bergbaumuseum in der alten Mine."]},"newcaledonia-hienghene-cities-v2":{"i":"/poi-images/newcaledonia-hienghene-cities-v2.webp","s":"Hienghène ist eine malerische Stadt an der Nordostküste, bekannt für ihre spektakulären Felsformationen.","f":["Heimat der berühmten 'Brütenden Henne', einer Kalksteininsel in der Bucht.","Ehemalige Wirkungsstätte des Kanak-Anführers Jean-Marie Tjibaou."]},"newcaledonia-la-foa-cities-v2":{"i":"/poi-images/newcaledonia-la-foa-cities-v2.webp","s":"La Foa ist ein landwirtschaftliches Zentrum im zentralen Westen von Grande Terre.","f":["Beherbergt die historische Passerelle Marguerite, eine Hängebrücke von Eiffel.","Veranstaltet jährlich ein bekanntes internationales Filmfestival."]},"newcaledonia-voh-cities-v2":{"i":"/poi-images/newcaledonia-voh-cities-v2.webp","s":"Voh ist eine Gemeinde im Norden, die weltberühmt für eine natürliche Herzform in ihren Mangroven ist.","f":["Das 'Herz von Voh' wurde durch Luftaufnahmen von Yann Arthus-Bertrand bekannt.","Einst ein bedeutendes Zentrum des Kaffeanbaus in Neukaledonien."]},"newcaledonia-pouembout-cities-v2":{"i":"/poi-images/newcaledonia-pouembout-cities-v2.webp","s":"Pouembout ist eine wachsende Stadt in der Nordprovinz, die eng mit der Entwicklung von Koné verbunden ist.","f":["Beherbergt eine wichtige landwirtschaftliche Fachhochschule.","Wichtiger Standort für die Verwaltung und Logistik des Koniambo-Projekts."]},"newcaledonia-ouegoa-cities-v2":{"i":"/poi-images/newcaledonia-ouegoa-cities-v2.webp","s":"Ouégoa ist eine historische Goldgräberstadt im Norden von Grande Terre am Ufer des Diahot-Flusses.","f":["Hier wurde im 19. Jahrhundert das erste Gold in Neukaledonien entdeckt.","Die Gemeinde liegt am längsten Fluss des Territoriums, dem Diahot."]},"newcaledonia-puebo-cities-v2":{"i":"/poi-images/newcaledonia-puebo-cities-v2.webp","s":"Pouébo ist ein historisch bedeutsamer Ort an der Nordostküste, wo Frankreich offiziell Besitz von der Insel ergriff.","f":["Ort der offiziellen Annexion Neukaledoniens durch Frankreich im Jahr 1853.","Bekannt für seine beeindruckenden Wasserfälle wie den Tao-Wasserfall."]},"newcaledonia-touho-cities-v2":{"i":"/poi-images/newcaledonia-touho-cities-v2.webp","s":"Touho ist eine charmante Küstenstadt an der Ostküste mit einem wichtigen regionalen Flugplatz.","f":["Der Flugplatz Touho verbindet die Ostküste mit Nouméa.","Beherbergt eine bekannte Hotelfachschule für das Territorium."]},"newcaledonia-ponerihouen-cities-v2":{"i":"/poi-images/newcaledonia-ponerihouen-cities-v2.webp","s":"Ponérihouen ist eine traditionelle Kanak-Gemeinde an der Ostküste, bekannt für ihre üppige Vegetation.","f":["Berühmt für die Produktion von hochwertigem Kaffee und Kakao.","Die Stadt liegt am Ufer eines breiten Flusses, der oft die Straße überflutet."]},"newcaledonia-poya-cities-v2":{"i":"/poi-images/newcaledonia-poya-cities-v2.webp","s":"Poya ist eine Stadt an der Westküste, deren Gemeindegebiet sich über zwei Provinzen erstreckt.","f":["Teilt sich administrativ zwischen der Nordprovinz und der Südprovinz auf.","Wichtiger Standort für den Nickelbergbau in den umliegenden Bergen."]},"newcaledonia-kaala-gomen-cities-v2":{"i":"/poi-images/newcaledonia-kaala-gomen-cities-v2.webp","s":"Kaala-Gomen ist eine ländliche Gemeinde im Nordwesten mit einer starken Bergbau- und Viehzuchttradition.","f":["Beherbergt das Kaala-Massiv, das reich an Nickelvorkommen ist.","Wichtiger Standort für die Salzgewinnung in den Küstenebenen."]},"newcaledonia-boulouparis-cities-v2":{"i":"/poi-images/newcaledonia-boulouparis-cities-v2.webp","s":"Boulouparis ist eine strategisch gelegene Stadt im Südwesten, die als Tor zur Westküste gilt.","f":["Bekannt für den Anbau von Tomaten und anderem Gemüse für Nouméa.","Hier befindet sich eine bekannte Hirschzuchtfarm und Jagdgebiete."]},"newcaledonia-yate-cities-v2":{"i":"/poi-images/newcaledonia-yate-cities-v2.webp","s":"Yaté ist eine Gemeinde im äußersten Südosten, bekannt für ihren großen Staudamm und den Nationalpark.","f":["Beherbergt den Yaté-Staudamm, der den Großteil des Stroms für Nouméa liefert.","Der Blaue Fluss Nationalpark (Parc de la Rivière Bleue) liegt in dieser Gemeinde."]},"newcaledonia-sarramea-cities-v2":{"i":"/poi-images/newcaledonia-sarramea-cities-v2.webp","s":"Sarraméa ist ein ruhiges Bergdorf im Landesinneren, bekannt für seine Kaffeetradition und Natur.","f":["Einzige Gemeinde in Neukaledonien ohne Zugang zum Meer.","Berühmt für die Produktion von hochwertigem Arabica-Kaffee."]},"newcaledonia-farino-cities-v2":{"i":"/poi-images/newcaledonia-farino-cities-v2.webp","s":"Farino ist die flächenmäßig kleinste Gemeinde Neukaledoniens und liegt eingebettet in den Bergen.","f":["Bekannt für den Giant Fern Park (Parc des Grandes Fougères).","Ein Zentrum für Ökotourismus und ländliche Gasthäuser."]},"newcaledonia-moindou-cities-v2":{"i":"/poi-images/newcaledonia-moindou-cities-v2.webp","s":"Moindou ist eine historische Stadt an der Westküste, die für ihr Erbe aus der Kolonialzeit bekannt ist.","f":["Beherbergt das Fort Teremba, ein ehemaliges Militärlager und Gefängnis.","Wichtiger Standort für den frühen Kohlebergbau auf der Insel."]},"newcaledonia-poum-cities-v2":{"i":"/poi-images/newcaledonia-poum-cities-v2.webp","s":"Poum ist die nördlichste Gemeinde auf der Hauptinsel Grande Terre und bekannt für ihre weißen Sandstrände.","f":["Wichtiger Standort für den Nickelabbau im Norden der Insel.","Beliebtes Ziel für Camping und Angeln in unberührter Natur."]},"newcaledonia-kouaoua-cities-v2":{"i":"/poi-images/newcaledonia-kouaoua-cities-v2.webp","s":"Kouaoua ist eine Bergbaustadt an der Ostküste, bekannt für eines der längsten Förderbänder der Welt.","f":["Das Förderband 'Serpentine' ist über 11 Kilometer lang.","Hauptwirtschaftszweig ist der Abbau und Export von Nickel."]},"newcaledonia-lifou-cities-v2":{"i":"/poi-images/newcaledonia-lifou-cities-v2.webp","s":"Lifou ist die größte und bevölkerungsreichste der Loyalitätsinseln und ein wichtiges Touristenziel.","f":["Wé ist das administrative Zentrum und die größte Siedlung.","Bekannt für seine Vanilleplantagen und die Produktion von Vanilleöl."]},"newcaledonia-mare-cities-v2":{"i":"/poi-images/newcaledonia-mare-cities-v2.webp","s":"Maré ist die zweitgrößte der Loyalitätsinseln, bekannt für ihre wilden Landschaften und tiefen Abgründe.","f":["Tadine ist das administrative Zentrum der Insel.","Berühmt für das Avocado-Festival, das jedes Jahr gefeiert wird."]},"newcaledonia-ouvea-cities-v2":{"i":"/poi-images/newcaledonia-ouvea-cities-v2.webp","s":"Ouvéa ist ein atemberaubendes Korallenatoll der Loyalitätsinseln mit einem 25 Kilometer langen Sandstrand.","f":["Fayaoué ist das administrative Zentrum des Atoll  Gemeinde Païta am Ufer des Tontouta-Flusses."]},"newcaledonia-plum-cities-v2":{"i":"/poi-images/newcaledonia-plum-cities-v2.webp","s":"Plum ist eine Küstensiedlung in der Gemeinde Mont-Dore, bekannt für ihre berühmte Quelle und den Strand.","f":["Die Quelle von Plum liefert kostenloses Mineralwasser für die Bevölkerung.","Beherbergt einen wichtigen Militärstützpunkt des Regiments RIMAP-NC."]},"newcaledonia-prony-cities-v2":{"i":"/poi-images/newcaledonia-prony-cities-v2.webp","s":"Prony ist ein historisches Dorf im äußersten Süden, bekannt für seine ehemalige Strafanstalt und die Nickelindustrie.","f":["Beherbergt die Ruinen eines alten Gefängnisses aus dem 19. Jahrhundert.","Wichtiger Standort für die moderne Nickelverarbeitung (Goro Nickel)."]},"newcaledonia-goro-cities-v2":{"i":"/poi-images/newcaledonia-goro-cities-v2.webp","s":"Goro ist ein traditionelles Kanak-Dorf im Süden, das heute durch eine der größten Nickelminen der Welt geprägt ist.","f":["Standort der Goro-Nickel-Anlage, eines massiven Industriekomplexes.","Das Dorf bewahrt trotz der Industrie seine traditionelle Struktur."]},"newcaledonia-chepenehe-cities-v2":{"i":"/poi-images/newcaledonia-chepenehe-cities-v2.webp","s":"Chépénéhé ist ein wichtiges Dorf an der Westküste von Lifou, bekannt als Anlegestelle für Kreuzfahrtschiffe.","f":["Wichtiger Ankunftsort für internationale Touristen auf Lifou.","Bekannt für den bunten lokalen Markt am Hafen."]},"newcaledonia-mouli-cities-v2":{"i":"/poi-images/newcaledonia-mouli-cities-v2.webp","s":"Mouli ist ein idyllisches Dorf auf der Insel Ouvéa, bekannt für seine berühmte Brücke und kristallklares Wasser.","f":["Die Mouli-Brücke bietet einen Blick auf Schildkröten und Rochen im Wasser.","Besitzt einen der weißesten Sandstrände des gesamten Pazifiks."]},"newcaledonia-la-roche-cities-v2":{"i":"/poi-images/newcaledonia-la-roche-cities-v2.webp","s":"La Roche ist ein historisches Dorf auf der Insel Maré, bekannt für seinen markanten Felsen und die alte Mission.","f":["Der Ort wird von einem riesigen Kalksteinfelsen überragt.","Standort einer der ältesten Kirchen auf den Loyalitätsinseln."]},"newcaledonia-eni-cities-v2":{"i":"/poi-images/newcaledonia-eni-cities-v2.webp","s":"Eni ist ein malerisches Dorf im Süden von Maré, bekannt für seine schönen Buchten und Korallenriffe.","f":["Ein Zentrum für den traditionellen Fischfang der Inselbewohner.","Bekannt für seine Gastfreundschaft und ländliche Unterkünfte."]},"newcaledonia-anse-vata-cities-v2":{"i":"/poi-images/newcaledonia-anse-vata-cities-v2.webp","s":"Anse Vata ist das touristische Herz von Nouméa, geprägt von Hotels, Restaurants und einem langen Strand.","f":["Wichtigster Standort für Windsurfen und Kitesurfen im Territorium.","Beherbergt das Aquarium der Lagune und das Ozeanographische Institut."]},"newcaledonia-baie-des-citrons-cities-v2":{"i":"/poi-images/newcaledonia-baie-des-citrons-cities-v2.webp","s":"Die Baie des Citrons ist ein beliebtes Viertel in Nouméa mit einer geschützten Bucht zum Schwimmen.","f":["Besitzt den beliebtesten Strand für Familien in der Hauptstadt.","Bekannt für seine lebhafte Promenade mit zahlreichen Bars und Cafés."]},"newcaledonia-ducos-cities-v2":{"i":"/poi-images/newcaledonia-ducos-cities-v2.webp","s":"Ducos ist das wichtigste Industrie- und Gewerbegebiet von Nouméa auf einer eigenen Halbinsel.","f":["Beherbergt den Großteil der Lagerhäuser und Werkstätten der Stadt.","War ursprünglich ein Standort für politische Gefangene der Pariser Kommune."]},"newcaledonia-magenta-cities-v2":{"i":"/poi-images/newcaledonia-magenta-cities-v2.webp","s":"Magenta ist ein Stadtteil von Nouméa, in dem sich der Inlandsflughafen des Territoriums befindet.","f":["Der Flughafen Magenta verbindet Nouméa mit den Inseln.","Beherbergt eine große Pferderennbahn (Hippodrome de Henri Milliard)."]},"newcaledonia-riviere-salee-cities-v2":{"i":"/poi-images/newcaledonia-riviere-salee-cities-v2.webp","s":"Rivière-Salée ist ein großes Wohnviertel im Norden von Nouméa, benannt nach dem dort fließenden 'salzigen Fluss'.","f":["Eines der bevölkerungsreichsten Viertel der Hauptstadt.","Wurde in den 1970er Jahren massiv als Wohngebiet ausgebaut."]},"newcaledonia-vallee-des-colons-cities-v2":{"i":"/poi-images/newcaledonia-vallee-des-colons-cities-v2.webp","s":"Vallée des Colons ist ein historisches Wohnviertel in Nouméa mit vielen traditionellen Kolonialhäusern.","f":["Eines der ältesten Viertel der Stadt außerhalb des Zentrums.","Bekannt für seine ruhigen Straßen und üppigen Gärten."]},"newcaledonia-koutio-cities-v2":{"i":"/poi-images/newcaledonia-koutio-cities-v2.webp","s":"Koutio ist ein bedeutender Vorort in der Gemeinde Dumbéa, der als Bindeglied zu Nouméa fungiert.","f":["Beherbergt das große Einkaufszentrum Kenu-In.","Standort wichtiger regionaler Sportanlagen wie dem Schwimmbad."]},"newcaledonia-yahoue-cities-v2":{"i":"/poi-images/newcaledonia-yahoue-cities-v2.webp","s":"Yahoué ist ein grünes Wohnviertel in Dumbéa, das am Fuße der Berge liegt und für seine Ruhe bekannt ist.","f":["Wurde am Ufer des gleichnamigen Yahoué-Flusses errichtet.","Beliebt bei Familien wegen der naturnahen Lage."]},"newcaledonia-robinson-cities-v2":{"i":"/poi-images/newcaledonia-robinson-cities-v2.webp","s":"Robinson ist ein bedeutender Stadtteil von Mont-Dore, der direkt an das Stadtgebiet von Nouméa grenzt.","f":["Eines der wichtigsten Handelsviertel der Gemeinde Mont-Dore.","Dient als Wohngebiet für viele Pendler, die in Nouméa arbeiten."]},"newcaledonia-boulari-cities-v2":{"i":"/poi-images/newcaledonia-boulari-cities-v2.webp","s":"Boulari ist das administrative Zentrum der Gemeinde Mont-Dore, gelegen an einer malerischen Bucht.","f":["Beherbergt das Rathaus und die wichtigsten Verwaltungsgebäude von Mont-Dore.","Verfügt über einen modernen Yachthafen und einen Kulturkomplex."]},"newcaledonia-doniambo-cities-v2":{"i":"/poi-images/newcaledonia-doniambo-cities-v2.webp","s":"Doniambo ist das industrielle Herz von Nouméa und beherbergt die riesige Nickelhütte der function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);

  gP.querySelectorAll('.poi').forEach(p=>{

  }

  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  const exRow=e=>'<a data-extra="1" href="'+e.u+'"><span class="dot" style="background:#ffd54a"></span><span class="nm">'+e.n.replace(/[<>]/g,'')+'</span><span class="gr">›</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('')+extraHits.map(exRow).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const ax=e.target.closest('a[data-extra]');
  if(ax)return; // sub-map link: let the browser navigate
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
