.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}

.burst-line{stroke:rgba(120,185,255,.4);stroke-width:1.1;stroke-linecap:round;animation:burstFade .25s ease-out}
.burst-core{fill:#cdeeff;filter:drop-shadow(0 0 5px #7fd0ff)}
.burst-dots{position:absolute;inset:0}

@keyframes burstPop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

const POI_CARD={"newcaledonia-noumea-cities-v2":{"i":"/poi-images/newcaledonia-noumea-cities-v2.webp","s":"Nouméa Új-Kaledónia fővárosa és legnagyobb városa, amely a fősziget délnyugati részén egy félszigeten terül el.","f":["1854-ben alapították Port-de-France néven a francia telepesek.","A Csendes-óceáni Közösség titkárságának székhelye található itt."]},"newcaledonia-dumbea-cities-v2":{"i":"/poi-images/newcaledonia-dumbea-cities-v2.webp","s":"Dumbéa Új-Kaledónia leggyorsabban növekvő városa, amely a fővárosi agglomeráció északi részén fekszik.","f":["A terület második legnépesebb községe, több mint 35 000 lakossal.","Itt található Új-Kaledónia legnagyobb bevásárlóközpontja, a Knu-Mall."]},"newcaledonia-paita-cities-v2":{"i":"/poi-images/newcaledonia-paita-cities-v2.webp","s":"Païta Nouméától északnyugatra található, és itt működik a terület legfontosabb nemzetközi repülőtere.","f":["A La Tontouta nemzetközi repülőtér ebben a községben található.","Hagyományosan az évente megrendezett marhahús-fesztiválról (Fête du Bœuf) ismert."]},"newcaledonia-kone-cities-v2":{"i":"/poi-images/newcaledonia-kone-cities-v2.webp","s":"Koné az Északi tartomány székhelye és a terület északi részének legfontosabb ipari központja.","f":["Itt található a Koniambo nikkelbánya, a világ egyik legnagyobb ipari projektje.","A híres 'Voh szíve' mangrove-formáció a város közvetlen közelében van."]},"newcaledonia-bourail-cities-v2":{"i":"/poi-images/newcaledonia-bourail-cities-v2.webp","s":"Bourail a nyugati part egyik legfontosabb városa, amely állattenyésztéséről és turisztikai látványosságairól híres.","f":["A második legnagyobb község a Nouméa környéki agglomeráción kívül.","Itt található a híres 'Bonhomme de Bourail' sziklaalakzat."]},"newcaledonia-koumac-cities-v2":{"i":"/poi-images/newcaledonia-koumac-cities-v2.webp","s":"Koumac a Grande Terre fősziget távoli északi részének legfontosabb szolgáltatási központja.","f":["A közelben található lenyűgöző mészkőbarlangjairól ismert.","Fontos megálló az utazók számára a sziget északi csúcsa felé."]},"newcaledonia-poindimie-cities-v2":{"i":"/poi-images/newcaledonia-poindimie-cities-v2.webp","s":"Poindimié a fősziget északkeleti partjának legfontosabb gazdasági és közigazgatási központja.","f":["A keleti part legnagyobb községe, körülbelül 5000 lakossal.","Jelentős regionális kórházi központ az Északi tartomány számára."]},"newcaledonia-houailou-cities-v2":{"i":"/poi-images/newcaledonia-houailou-cities-v2.webp","s":"Houaïlou a keleti part egyik városa, amely licsitermesztéséről és bányászati hagyományairól nevezetes.","f":["Minden év decemberében megrendezik itt a híres Licsi-fesztivált.","A 19. század óta fontos nikkelbányászati központ."]},"newcaledonia-canala-cities-v2":{"i":"/poi-images/newcaledonia-canala-cities-v2.webp","s":"Canala a nikkelbányászat egyik történelmi központja Új-Kaledónia keleti partján.","f":["Eredetileg 1858-ban alapították Napoleonville néven.","Híres forró vizes forrásairól és látványos vízeséseiről."]},"newcaledonia-thio-cities-v2":{"i":"/poi-images/newcaledonia-thio-cities-v2.webp","s":"Thio Új-Kaledónia nikkelbányászatának bölcsője, amely a délkeleti parton fekszik.","f":["Itt bányászták az első nikkelércet a szigeten 1876-ban.","Érdekes bányászati múzeumnak ad otthont a régi bánya területén."]},"newcaledonia-hienghene-cities-v2":{"i":"/poi-images/newcaledonia-hienghene-cities-v2.webp","s":"Hienghène egy festői város az északkeleti parton, amely látványos sziklaalakzatairól ismert.","f":["A híres 'Kotló tyúk' nevű, öbölben lévő mészkőszikla otthona.","Jean-Marie Tjibaou kanak vezető egykori lakóhelye és bázisa."]},"newcaledonia-la-foa-cities-v2":{"i":"/poi-images/newcaledonia-la-foa-cities-v2.webp","s":"La Foa egy mezőgazdasági központ Grande Terre szigetének középső-nyugati részén.","f":["Itt található a történelmi Passerelle Marguerite, egy Eiffel által tervezett híd.","Évente megrendezik itt a híres nemzetközi filmfesztivált."]},"newcaledonia-voh-cities-v2":{"i":"/poi-images/newcaledonia-voh-cities-v2.webp","s":"Voh egy északi község, amely a mangrovéerdőben kialakult természetes szívformáról világhírű.","f":["A 'Voh szíve' Yann Arthus-Bertrand légifotói révén vált világhírűvé.","Valamikor Új-Kaledónia kávétermesztésének egyik legfontosabb központja volt."]},"newcaledonia-pouembout-cities-v2":{"i":"/poi-images/newcaledonia-pouembout-cities-v2.webp","s":"Pouembout egy növekvő város az Északi tartományban, amely szorosan kapcsolódik Koné fejlődéséhez.","f":["Fontos mezőgazdasági szakközépiskolának és főiskolának ad otthont.","A Koniambo-projekt adminisztrációjának és logisztikájának egyik helyszíne."]},"newcaledonia-ouegoa-cities-v2":{"i":"/poi-images/newcaledonia-ouegoa-cities-v2.webp","s":"Ouégoa egy történelmi aranybányász város Grande Terre északi részén, a Diahot-folyó partján.","f":["Itt fedezték fel Új-Kaledónia első aranylelőhelyét a 19. században.","A község a terület leghosszabb folyója, a Diahot mentén fekszik."]},"newcaledonia-puebo-cities-v2":{"i":"/poi-images/newcaledonia-puebo-cities-v2.webp","s":"Pouébo történelmi jelentőségű település az északkeleti parton, ahol Franciaország hivatalosan birtokba vette a szigetet.","f":["Új-Kaledónia 1853-as francia annexiójának hivatalos helyszíne.","Lenyűgöző vízeséseiről ismert, mint például a Tao-vízesés."]},"newcaledonia-touho-cities-v2":{"i":"/poi-images/newcaledonia-touho-cities-v2.webp","s":"Touho egy bájos parti város a keleti parton, amely fontos regionális repülőtérrel rendelkezik.","f":["A Touho repülőtér köti össze a keleti partot Nouméával.","Itt található a terület egyik neves vendéglátóipari szakközépiskolája."]},"newcaledonia-ponerihouen-cities-v2":{"i":"/poi-images/newcaledonia-ponerihouen-cities-v2.webp","s":"Ponérihouen egy hagyományos kanak község a keleti parton, amely dús növényzetéről ismert.","f":["Kiváló minőségű kávé- és kakaótermeléséről híres.","A város egy széles folyó partján fekszik, amely gyakran elönti az utat."]},"newcaledonia-poya-cities-v2":{"i":"/poi-images/newcaledonia-poya-cities-v2.webp","s":"Poya egy város a nyugati parton, amelynek területe két tartományra oszlik.","f":["Közigazgatásilag az Északi és a Déli tartomány között oszlik meg.","Fontos nikkelbányászati központ a környező hegyekben."]},"newcaledonia-kaala-gomen-cities-v2":{"i":"/poi-images/newcaledonia-kaala-gomen-cities-v2.webp","s":"Kaala-Gomen egy vidéki község északnyugaton, erős bányászati és állattenyésztési hagyományokkal.","f":["Itt található a nikkelben gazdag Kaala-masszívum.","A tengerparti síkságokon fontos sólepárló üzemek működnek."]},"newcaledonia-boulouparis-cities-v2":{"i":"/poi-images/newcaledonia-boulouparis-cities-v2.webp","s":"Boulouparis egy stratégiai fekvésű város délnyugaton, amelyet a nyugati part kapujának tartanak.","f":["Nouméa számára itt termelnek jelentős mennyiségű paradicsomot és egyéb zöldséget.","Híres szarvasfarmmal és vadászterületekkel rendelkezik."]},"newcaledonia-yate-cities-v2":{"i":"/poi-images/newcaledonia-yate-cities-v2.webp","s":"Yaté egy község a távoli délkeleten, amely hatalmas gátjáról és nemzeti parkjáról ismert.","f":["Itt található a Yaté-gát, amely Nouméa áramellátásának nagy részét biztosítja.","A Kék Folyó Nemzeti Park (Parc de la Rivière Bleue) ebben a községben fekszik."]},"newcaledonia-sarramea-cities-v2":{"i":"/poi-images/newcaledonia-sarramea-cities-v2.webp","s":"Sarraméa egy csendes hegyi falu a sziget belsejében, amely kávéhagyományairól és természetéről ismert.","f":["Az egyetlen község Új-Kaledóniában, amely nem rendelkezik tengerparttal.","Híres a kiváló minőségű Arabica kávé termeléséről."]},"newcaledonia-farino-cities-v2":{"i":"/poi-images/newcaledonia-farino-cities-v2.webp","s":"Farino Új-Kaledónia területileg legkisebb községe, amely a hegyek között bújik meg.","f":["Híres az Óriáspáfrányok Parkjáról (Parc des Grandes Fougères).","Az ökoturizmus és a vidéki vendégházak egyik központja."]},"newcaledonia-moindou-cities-v2":{"i":"/poi-images/newcaledonia-moindou-cities-v2.webp","s":"Moindou egy történelmi város a nyugati parton, amely a gyarmati korszakból származó örökségéről ismert.","f":["Itt található a Fort Teremba, egy egykori katonai tábor és börtön.","A sziget korai kőszénbányászatának fontos helyszíne volt."]},"newcaledonia-poum-cities-v2":{"i":"/poi-images/newcaledonia-poum-cities-v2.webp","s":"Poum Grande Terre fősziget legészakibb községe, amely fehér homokos strandjairól ismert.","f":["Fontos nikkelbányászati helyszín a sziget északi részén.","Népszerű kempingező- és horgászhely az érintetlen természetben."]},"newcaledonia-kouaoua-cities-v2":{"i":"/poi-images/newcaledonia-kouaoua-cities-v2.webp","s":"Kouaoua egy bányászváros a keleti parton, amely a világ egyik leghosszabb szállítószalagjáról ismert.","f":["A 'Serpentine' nevű szállítószalag több mint 11 kilométer hosszú.","A város fő gazdasági ága a nikkelbányászat és -export."]},"newcaledonia-lifou-cities-v2":{"i":"/poi-images/newcaledonia-lifou-cities-v2.webp","s":"Lifou a Hűség-szigetek legnagyobb és legnépesebb tagja, egyben fontos turisztikai célpont.","f":["Wé a sziget közigazgatási központja és legnagyobb települése.","Vaníliaültetvényeiről és a vaníliaolaj-termelésről nevezetes."]},"newcaledonia-mare-cities-v2":{"i":"/poi-images/newcaledonia-mare-cities-v2.webp","s":"Maré a Hűség-szigetek második legnagyobb tagja, amely vad tájairól és mély szakadékairól ismert.","f":["Tadine a sziget közigazgatási központja.","Híres az évente megrendezett Avokádó-fesztiválról."]},"newcaledonia-ouvea-cities-v2":{"i":"/poi-images/newcaledonia-ouvea-cities-v2.webp","s":"Ouvéa a Hűség-szigetek egyik lélegzetelállító korallatollja, 25 kilométer hosszú homokos tengerparttal.","f":["Fayaoué az atoll közigazgatási központja.","A szigetet gyakran emlegetik 'a paradicsomhoz legközelebb lévő szigetként'."]},"newcaledonia-ile-des-pins-cities-v2":{"i":"/poi-images/newcaledonia-ile-des-pins-cities-v2.webp","s":"A Fenyő-sziget egy világhírű turisztikai célpont Grande Terre-től délre, amely különleges f ai központja, amelyet szállodák, éttermek és egy hosszú strand jellemez.","f":["A terület legfontosabb szörf- és kiteszörf-helyszíne.","Itt található a Lagúna Akvárium és az Óceánográfiai Intézet."]},"newcaledonia-baie-des-citrons-cities-v2":{"i":"/poi-images/newcaledonia-baie-des-citrons-cities-v2.webp","s":"A Citrom-öböl Nouméa egyik népszerű negyede, amely védett, úszásra kiválóan alkalmas öböllel rendelkezik.","f":["A főváros legnépszerűbb családbarát strandjával rendelkezik.","Élénk sétányáról ismert, számos bárral és kávézóval."]},"newcaledonia-ducos-cities-v2":{"i":"/poi-images/newcaledonia-ducos-cities-v2.webp","s":"Ducos Nouméa legfontosabb ipari és kereskedelmi övezete, amely egy saját félszigeten fekszik.","f":["Itt található a város raktárainak és műhelyeinek nagy része.","Eredetileg a párizsi kommün politikai foglyainak egyik helyszíne volt."]},"newcaledonia-magenta-cities-v2":{"i":"/poi-images/newcaledonia-magenta-cities-v2.webp","s":"Magenta Nouméa egyik városrésze, ahol a terület belföldi repülőtere található.","f":["A Magenta repülőtér köti össze Nouméát a környező szigetekkel.","Itt található a város nagy lóversenypályája (Hippodrome de Henri Milliard)."]},"newcaledonia-riviere-salee-cities-v2":{"i":"/poi-images/newcaledonia-riviere-salee-cities-v2.webp","s":"Rivière-Salée Nouméa északi részén fekvő nagy lakónegyed, amely a területén átfolyó 'sós folyóról' kapta nevét.","f":["A főváros egyik legnépesebb városrésze.","Az 1970-es években épült ki nagy arányban lakóövezetként."]},"newcaledonia-vallee-des-colons-cities-v2":{"i":"/poi-images/newcaledonia-vallee-des-colons-cities-v2.webp","s":"Vallée des Colons Nouméa egyik történelmi lakónegyede, ahol számos hagyományos gyarmati stílusú ház található.","f":["A város egyik legrégebbi negyede a központon kívül.","Csendes utcáiról és buja kertjeiről ismert."]},"newcaledonia-koutio-cities-v2":{"i":"/poi-images/newcaledonia-koutio-cities-v2.webp","s":"Koutio Dumbéa község egyik jelentős külvárosa, amely össz const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
</html>
