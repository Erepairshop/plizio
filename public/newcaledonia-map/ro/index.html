const POI_CARD={"newcaledonia-noumea-cities-v2":{"i":"/poi-images/newcaledonia-noumea-cities-v2.webp","s":"Nouméa este capitala și cel mai mare oraș din Noua Caledonie, situat pe o peninsulă în sud-vestul insulei Grande Terre.","f":["Fondat în anul 1854 sub numele inițial de Port-de-France.","Găzduiește sediul Secretariatului Comunității Pacificului."]},"newcaledonia-dumbea-cities-v2":{"i":"/poi-images/newcaledonia-dumbea-cities-v2.webp","s":"Dumbéa este o suburbie cu creștere rapidă a orașului Nouméa, făcând parte din zona metropolitană.","f":["A doua cea mai populată comună a teritoriului, cu peste 35.000 locuitori.","Găzduiește cel mai mare centru comercial din Noua Caledonie, Knu-Mall."]},"newcaledonia-paita-cities-v2":{"i":"/poi-images/newcaledonia-paita-cities-v2.webp","s":"Païta este situat la vest de Nouméa și găzduiește principalul aeroport internațional al teritoriului.","f":["Aeroportul internațional La Tontouta se află pe teritoriul acestei comune.","Cunoscut tradițional pentru festivalul anual al cărnii de vită 'Fête du Bœuf'."]},"newcaledonia-kone-cities-v2":{"i":"/poi-images/newcaledonia-kone-cities-v2.webp","s":"Koné este capitala Provinciei de Nord și un centru vital pentru industria nichelului din nord.","f":["Locația minei de nichel Koniambo, unul dintre cele mai mari proiecte industriale mondiale.","Celebrul 'Inima de la Voh' se află în imediata apropiere a orașului."]},"newcaledonia-bourail-cities-v2":{"i":"/poi-images/newcaledonia-bourail-cities-v2.webp","s":"Bourail este un oraș important de pe coasta de vest, cunoscut pentru creșterea vitelor și atracțiile turistice.","f":["A doua cea mai mare comună din afara zonei metropolitane Nouméa.","Găzduiește celebra formațiune stâncoasă 'Bonhomme de Bourail'."]},"newcaledonia-koumac-cities-v2":{"i":"/poi-images/newcaledonia-koumac-cities-v2.webp","s":"Koumac este un centru important de servicii în nordul îndepărtat al insulei principale Grande Terre.","f":["Cunoscut pentru peșterile sale de calcar impresionante aflate în apropiere.","Punct de oprire vital pentru călătorii spre vârful nordic al insulei."]},"newcaledonia-poindimie-cities-v2":{"i":"/poi-images/newcaledonia-poindimie-cities-v2.webp","s":"Poindimié este cel mai important centru economic și administrativ de pe coasta de nord-est.","f":["Cea mai mare comună de pe coasta de est, cu circa 5.000 de locuitori.","Centru spitalicesc regional major pentru Provincia de Nord."]},"newcaledonia-houailou-cities-v2":{"i":"/poi-images/newcaledonia-houailou-cities-v2.webp","s":"Houaïlou este un oraș de pe coasta de est, renumit pentru cultura de litchi și tradiția minieră.","f":["Găzduiește în fiecare decembrie celebrul Festival al Litchiului.","Locație importantă pentru mineritul de nichel încă din secolul al XIX-lea."]},"newcaledonia-canala-cities-v2":{"i":"/poi-images/newcaledonia-canala-cities-v2.webp","s":"Canala este un centru istoric al exploatării nichelului pe coasta de est a Noii Caledonii.","f":["Fondat inițial în anul 1858 sub denumirea de Napoleonville.","Cunoscut pentru izvoarele sale termale și cascadele spectaculoase."]},"newcaledonia-thio-cities-v2":{"i":"/poi-images/newcaledonia-thio-cities-v2.webp","s":"Thio este considerat leagănul mineritului de nichel din Noua Caledonie, situat pe coasta de sud-est.","f":["Aici a fost exploatat primul minereu de nichel de pe insulă în 1876.","Găzduiește un muzeu minier interesant în incinta vechii mine."]},"newcaledonia-hienghene-cities-v2":{"i":"/poi-images/newcaledonia-hienghene-cities-v2.webp","s":"Hienghène este un oraș pitoresc de pe coasta de nord-est, faimos pentru formațiunile sale stâncoase.","f":["Găzduiește celebra stâncă 'Găina care clocește' din golful local.","Fostul fieful al liderului kanak Jean-Marie Tjibaou."]},"newcaledonia-la-foa-cities-v2":{"i":"/poi-images/newcaledonia-la-foa-cities-v2.webp","s":"La Foa este un centru agricol situat în partea central-vestică a insulei Grande Terre.","f":["Găzduiește istorica Passerelle Marguerite, un pod proiectat de firma lui Eiffel.","Organizează anual un renumit festival internațional de film."]},"newcaledonia-voh-cities-v2":{"i":"/poi-images/newcaledonia-voh-cities-v2.webp","s":"Voh este o comună din nord, celebră în întreaga lume pentru forma de inimă din mangrove.","f":["Inima de la Voh a devenit faimoasă prin fotografiile aeriene ale lui Yann Arthus-Bertrand.","A fost cândva un centru major al producției de cafea din Noua Caledonie."]},"newcaledonia-pouembout-cities-v2":{"i":"/poi-images/newcaledonia-pouembout-cities-v2.webp","s":"Pouembout este un oraș în creștere din Provincia de Nord, legat strâns de dezvoltarea localității Koné.","f":["Găzduiește un important liceu cu profil agricol din regiune.","Locație strategică pentru administrația și logistica proiectului Koniambo."]},"newcaledonia-ouegoa-cities-v2":{"i":"/poi-images/newcaledonia-ouegoa-cities-v2.webp","s":"Ouégoa este un oraș istoric minier din nordul insulei Grande Terre, pe malul râului Diahot.","f":["Aici a fost descoperit primul zăcământ de aur din Noua Caledonie în secolul XIX.","Comuna este situată de-a lungul celui mai lung râu din teritoriu, Diahot."]},"newcaledonia-puebo-cities-v2":{"i":"/poi-images/newcaledonia-puebo-cities-v2.webp","s":"Pouébo este o localitate de importanță istorică de pe coasta de nord-est, unde Franța a luat posesia insulei.","f":["Locul anexării oficiale a Noii Caledonii de către Franța în 1853.","Cunoscut pentru cascadele sale impresionante, cum ar fi Cascada Tao."]},"newcaledonia-touho-cities-v2":{"i":"/poi-images/newcaledonia-touho-cities-v2.webp","s":"Touho este un oraș de coastă fermecător de pe coasta de est, cu un aerodrom regional important.","f":["Aerodromul Touho face legătura între coasta de est și Nouméa.","Găzduiește o școală hotelieră renumită pentru întregul teritoriu."]},"newcaledonia-ponerihouen-cities-v2":{"i":"/poi-images/newcaledonia-ponerihouen-cities-v2.webp","s":"Ponérihouen este o comună tradițională kanak de pe coasta de est, renumită pentru vegetația luxuriantă.","f":["Renumit pentru producția de cafea și cacao de înaltă calitate.","Orașul este situat pe malul unui râu lat care inundă adesea drumul."]},"newcaledonia-poya-cities-v2":{"i":"/poi-images/newcaledonia-poya-cities-v2.webp","s":"Poya este un oraș de pe coasta de vest, a cărui comună este divizată între două provincii.","f":["Administrativ, este împărțit între Provincia de Nord și Provincia de Sud.","Locație importantă pentru mineritul de nichel în munții din jur."]},"newcaledonia-kaala-gomen-cities-v2":{"i":"/poi-images/newcaledonia-kaala-gomen-cities-v2.webp","s":"Kaala-Gomen este o comună rurală din nord-vest, cu o tradiție puternică în minerit și creșterea vitelor.","f":["Găzduiește masivul Kaala, bogat în zăcăminte de nichel.","Locație importantă pentru extracția sării în zonele de coastă."]},"newcaledonia-boulouparis-cities-v2":{"i":"/poi-images/newcaledonia-boulouparis-cities-v2.webp","s":"Boulouparis este un oraș situat strategic în sud-vest, considerat poarta către coasta de vest.","f":["Cunoscut pentru cultivarea roșiilor și a altor legume pentru piața din Nouméa.","Găzduiește o fermă renumită de cerbi și zone de vânătoare."]},"newcaledonia-yate-cities-v2":{"i":"/poi-images/newcaledonia-yate-cities-v2.webp","s":"Yaté este o comună în extremul sud-est, cunoscută pentru marele său baraj și parcul național.","f":["Găzduiește barajul Yaté, care furnizează cea mai mare parte a energiei pentru Nouméa.","Parcul Național Rivière Bleue se află pe teritoriul acestei comune."]},"newcaledonia-sarramea-cities-v2":{"i":"/poi-images/newcaledonia-sarramea-cities-v2.webp","s":"Sarraméa este un sat montan liniștit din interiorul insulei, cunoscut pentru tradiția cafelei și natură.","f":["Singura comună din Noua Caledonie care nu are ieșire la mare.","Renumit pentru producția de cafea Arabica de calitate superioară."]},"newcaledonia-farino-cities-v2":{"i":"/poi-images/newcaledonia-farino-cities-v2.webp","s":"Farino este cea mai mică comună ca suprafață din Noua Caledonie, situată în munți.","f":["Cunoscut pentru Parcul Marilor Ferigi (Parc des Grandes Fougères).","Centru pentru ecoturism și pensiuni rurale."]},"newcaledonia-moindou-cities-v2":{"i":"/poi-images/newcaledonia-moindou-cities-v2.webp","s":"Moindou este un oraș istoric de pe coasta de vest, cunoscut pentru moștenirea sa din epoca colonială.","f":["Găzduiește Fort Teremba, o fostă tabără militară și închisoare.","Locație importantă pentru primele exploatări de cărbune de pe insulă."]},"newcaledonia-poum-cities-v2":{"i":"/poi-images/newcaledonia-poum-cities-v2.webp","s":"Poum este cea mai nordică comună de pe insula Grande Terre, renumită pentru plajele sale cu nisip alb.","f":["Locație importantă pentru mineritul de nichel în nordul insulei.","Destinație populară pentru camping și pescuit în natură virgină."]},"newcaledonia-kouaoua-cities-v2":{"i":"/poi-images/newcaledonia-kouaoua-cities-v2.webp","s":"Kouaoua este un oraș minier de pe coasta de est, faimos pentru una dintre cele mai lungi benzi rulante din lume.","f":["Banda rulantă 'Serpentine' are o lungime de peste 11 kilometri.","Activitatea economică principală este extracția și exportul de nichel."]},"newcaledonia-lifou-cities-v2":{"i":"/poi-images/newcaledonia-lifou-cities-v2.webp","s":"Lifou este cea mai mare și mai populată dintre Insulele Loialității, fiind o destinație turistică majoră.","f":["Wé este centrul administrativ și cea mai mare așezare.","Cunoscut pentru plantațiile de vanilie și producția de ulei de vanilie."]},"newcaledonia-mare-cities-v2":{"i":"/poi-images/newcaledonia-mare-cities-v2.webp","s":"Maré este a doua insulă ca mărime din arhipelagul Loialității, cunoscută pentru peisajele sălbatice.","f":["Tadine este centrul administrativ al insulei.","Faimos pentru Festivalul Avocadoului, celebrat în fiecare an."]},"newcaledonia-ouvea-cities-v2":{"i":"/poi-images/newcaledonia-ouvea-cities-v2.webp","s":"Ouvéa este un atol de corali superb din Insulele Loialității, cu o plajă de 25 km lungime.","f":["Fayaoué este centrul administrativ al atolului.","Insula este adesea numită 'insula cea mai apropiată de paradis'."]},"newcaledonia-ile-des-pins-cities-v2":{"i":"/poi-images/newcaledonia-ile-des-pins-cities-v2.webp","s":"Insula Pinilor este o insulă turistică faimoasă la sud de Grande Terre, cunoscută pentru pinii săi araucaria.","f":["Vao este satul principal și centrul administrativ al insulei.","Cunoscut pentru piscina naturală din golful Oro."]},"newcaledonia-belep-cities-v2":{"i":"/poi-images/newcaledonia-belep-cities-v2.webp","s":"Bélep este un arhipelag izolat în extremul nord al Noii Caledonii, cu o bogată tradiție în pescuit.","f":["Waala este singurul sat locuit de pe insula principală, Art.","Insulele au găzduit o colonie de leproși în secolul al XIX-lea."]},"newcaledonia-tadine-cities-v2":{"i":"/poi-images/newcaledonia-tadine-cities-v2.webp","s":"Tadine este localitatea principală de pe insula Maré și punctul major de sosire pentru nave.","f":["Găzduiește portul care leagă Maré de Nouméa.","Sediul administrației comunale și piață importantă."]},"newcaledonia-fayaoue-cities-v2":{"i":"/poi-images/newcaledonia-fayaoue-cities-v2.webp","s":"Fayaoué este centrul administrativ din Ouvéa, situat de-a lungul unei plaje spectaculoase de 25 km.","f":["Sediul primăriei și al jandarmeriei din Ouvéa.","Așezarea se întinde liniar de-a lungul drumului de coastă."]},"newcaledonia-vao-cities-v2":{"i":"/poi-images/newcaledonia-vao-cities-v2.webp","s":"Vao este satul principal de pe Insula Pinilor și inima spirituală a insulei, având o biserică marcantă.","f":["Găzduiește biserica catolică Notre-Dame de l'Assomption.","Sediul consiliului tradițional al căpeteniilor insulei."]},"newcaledonia-tontouta-cities-v2":{"i":"/poi-images/newcaledonia-tontouta-cities-v2.webp","s":"La Tontouta este cunoscută ca locație a aeroportului internațional din Noua Caledonie, la cca 50 km de Nouméa.","f":["Aeroportul La Tontouta este principala poartă de acces către lume.","Situată în comuna Païta, pe malul râului Tontouta."]},"newcaledonia-plum-cities-v2":{"i":"/poi-images/newcaledonia-plum-cities-v2.webp","s":"Plum este o așezare de coastă din comuna Mont-Dore, cunoscută pentru izvorul său faimos și plajă.","f":["Izvorul din Plum oferă apă minerală gratuită populației.","Găzduiește o bază militară importantă a regimentului RIMAP-NC."]},"newcaledonia-prony-cities-v2":{"i":"/poi-images/newcaledonia-prony-cities-v2.webp","s":"Prony este un sat istoric din extremul sud, cunoscut pentru fostul penitenciar și industria nichelului.","f":["Găzduiește ruinele unui vechi penitenciar din secolul al XIX-lea.","Locație majoră pentru procesarea modernă a nichelului (Goro Nickel)."]},"newcaledonia-goro-cities-v2":{"i":"/poi-images/newcaledonia-goro-cities-v2.webp","s":"Goro este un sat tradițional kanak din sud, marcat astăzi de una dintre cele mai mari mine de nichel.","f":["Locația uzinei Goro Nickel, un complex industrial masiv.","Satul își păstrează structura tradițională în ciuda prezenței industriale."]},"newcaledonia-chepenehe-cities-v2":{"i":"/poi-images/newcaledonia-chepenehe-cities-v2.webp","s":"Chépénéhé este un sat important pe coasta de vest a insulei Lifou, punct de ancorare pentru croaziere.","f":["Punct major de sosire pentru turiștii internaționali pe Lifou.","Cunoscut pentru piața locală colorată aflată lângă port."]},"newcaledonia-mouli-cities-v2":{"i":"/poi-images/newcaledonia-mouli-cities-v2.webp","s":"Mouli este un sat idilic de pe insula Ouvéa, faimos pentru podul său și apa cristalină.","f":["Podul Mouli oferă ocazia de a vedea țestoase și pisici de mare în apă.","Deține una dintre cele mai albe plaje de nisip din întreg Pacificul."]},"newcaledonia-la-roche-cities-v2":{"i":"/poi-images/newcaledonia-la-roche-cities-v2.webp","s":"La Roche este un sat istoric pe insula Maré, cunoscut pentru stânca sa distinctivă și vechea misiune.","f":["Localitatea este dominată de o stâncă de calcar masivă.","Locația uneia dintre cele mai vechi biserici din Insulele Loialității."]},"newcaledonia-eni-cities-v2":{"i":"/poi-images/newcaledonia-eni-cities-v2.webp","s":"Eni este un sat pitoresc în sudul insulei Maré, cunoscut pentru golful său frumos și recifele de corali.","f":["Centru pentru pescuitul tradițional al locuitorilor insulei.","Cunoscut pentru ospitalitatea sa și unitățile de cazare rurale."]},"newcaledonia-anse-vata-cities-v2":{"i":"/poi-images/newcaledonia-anse-vata-cities-v2.webp","s":"Anse Vata este inima turistică a orașului Nouméa, plină de hoteluri, restaurante și o plajă lungă.","f":["Principala locație pentru windsurf și kitesurf din teritoriu.","Găzduiește Acvariul Lagunei și Institutul Oceanografic."]},"newcaledonia-baie-des-citrons-cities-v2":{"i":"/poi-images/newcaledonia-baie-des-citrons-cities-v2.webp","s":"Baie des Citrons este un cartier popular din Nouméa, cu un golf adăpostit ideal pentru înot.","f":["Deține cea mai populară plajă pentru familii din capitală.","Cunoscut pentru faleza sa plină de viață, cu numeroase baruri și cafenele."]},"newcaledonia-ducos-cities-v2":{"i":"/poi-images/newcaledonia-ducos-cities-v2.webp","s":"Ducos este principala zonă industrială și comercială din Nouméa, situată pe o peninsulă proprie.","f":["Găzduiește majoritatea depozitelor și atelierelor din oraș.","A fost inițial o locație pentru prizonierii politici ai Comunei din Paris."]},"newcaledonia-magenta-cities-v2":{"i":"/poi-images/newcaledonia-magenta-cities-v2.webp","s":"Magenta este un cartier din Nouméa unde se află aeroportul intern al teritoriului.","f":["Aeroportul Magenta face legătura între Nouméa și restul insulelor.","Găzduiește un hipodrom mare (Hippodrome de Henri Milliard)."]},"newcaledonia-riviere-salee-cities-v2":{"i":"/poi-images/newcaledonia-riviere-salee-cities-v2.webp","s":"Rivière-Salée este un cartier rezidențial mare din nordul orașului Nouméa, numit după râul sărat local.","f":["Unul dintre cele mai populate cartiere din capitală.","Dezvoltat masiv ca zonă rezidențială în anii 1970."]},"newcaledonia-vallee-des-colons-cities-v2":{"i":"/poi-images/newcaledonia-vallee-des-colons-cities-v2.webp","s":"Vallée des Colons este un cartier rezidențial istoric din Nouméa, cu multe case coloniale tradiționale.","f":["Unul dintre cele mai vechi cartiere ale orașului în afara centrului.","Cunoscut pentru străzile sale liniștite și grădinile luxuriante."]},"newcaledonia-koutio-cities-v2":{"i":"/poi-images/newcaledonia-koutio-cities-v2.webp","s":"Koutio este o suburbie importantă din comuna Dumbéa, servind ca punct de legătură cu Nouméa.","f":["Găzduiește centrul comercial de mari dimensiuni Kenu-In.","Locație pentru facilități sportive regionale importante, precum piscina."]},"newcaledonia-yahoue-cities-v2":{"i":"/poi-images/newcaledonia-yahoue-cities-v2.webp","s":"Yahoué este un cartier rezidențial verde din Dumbéa, situat la poalele munților și cunoscut pentru liniște.","f":["Construit pe malurile râului Yahoué omonim.","Popular în rândul familiilor datorită apropierii de natură."]},"newcaledonia-robinson-cities-v2":{"i":"/poi-images/newcaledonia-robinson-cities-v2.webp","s":"Robinson este un cartier important din Mont-Dore, care se învecinează direct cu zona urbană a orașului Nouméa.","f":["Unul dintre cele mai importante cartiere comerciale din comuna Mont-Dore.","Servește ca zonă rezidențială pentru mulți navetiști care lucrează în Nouméa."]},"newcaledonia-boulari-cities-v2":{"i":"/poi-images/newcaledonia-boulari-cities-v2.webp","s":"Boulari este centrul administrativ al comunei Mont-Dore, situat într-un golf pitoresc.","f":["Găzduiește primăria și principalele clădiri administrative din Mont-Dore.","Dispune de o marină modernă și un complex cultural."]},"newcaledonia-doniambo-cities-v2":{"i":"/poi-images/newcaledonia-doniambo-cities-v2.webp","s":"Doniambo este inima industrială a orașului Nouméa, găzduind topitoria masivă de nichel a companiei SLN.","f":["Topitoria de nichel este unul dintre cele mai vizibile repere din portul Nouméa.","Funcțio const POI_INDEX={};

  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);

const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}

    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;

    });

    if(vis.length===0){c.classList.add('hidden')}

  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}

  }

    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.

    const visibleClusterIdx=new Set();

    }

  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
