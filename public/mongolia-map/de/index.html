or-ondor-cities-v2.webp","s":"Bor-Öndör ist eine relativ isolierte Bergbaustadt in der weiten Steppe.","f":["Isolierte Bergbaustadt in der Steppe.","Wurde in den 1980er Jahren ausgebaut."]},"mn-sharyn-gol-cities-v2":{"i":"/poi-images/mn-sharyn-gol-cities-v2.webp","s":"Scharyn Gol ist eine klassische sowjetische Kohlebergbaustadt, eingebettet in einem Tal.","f":["Klassische sowjetische Bergbaustadt.","Gegründet 1961 mit Hilfe der UdSSR."]},"mn-nalaikh-cities-v2":{"i":"/poi-images/mn-nalaikh-cities-v2.webp","s":"Nalaich, ehemals die wichtigste Kohlenmine für Ulaanbaatar, ist heute ein abgelegener Stadtbezirk.","f":["Abgelegener Stadtbezirk von Ulaanbaatar.","Einst wichtigste Kohlenmine der Hauptstadt."]},"mn-tosontsengel-cities-v2":{"i":"/poi-images/mn-tosontsengel-cities-v2.webp","s":"Tosontsengel gilt als eine der kältesten Siedlungen in der Mongolei.","f":["Eine der kältesten Siedlungen der Mongolei.","Umgeben von ausgedehnten Lärchenwäldern."]},"mn-khutul-cities-v2":{"i":"/poi-images/mn-khutul-cities-v2.webp","s":"Chötöl ist ein wichtiges Zentrum der Baustoffindustrie.","f":["Zentrum der Baustoffindustrie.","Als Industriestadt in der Sowjetzeit geplant."]},"mn-zamyn-uud-cities-v2":{"i":"/poi-images/mn-zamyn-uud-cities-v2.webp","s":"Dsamyn-Üüd ist der wichtigste Grenzübergang zwischen der Mongolei und China.","f":["Wichtigster Grenzübergang zu China.","Name bedeutet 'Tor des Weges'."]},"oyu-tolgoi-mine-economic-v2":{"i":"/poi-images/oyu-tolgoi-mine-economic-v2.webp","s":"Eines der größten Kupfer- und Goldvorkommen der Welt, tief in der Wüste Gobi gelegen.","f":["Wichtigster Wirtschaftsmotor der Mongolei.","Fördert täglich tausende Tonnen Erz."]},"tavan-tolgoi-mine-economic-v2":{"i":"/poi-images/tavan-tolgoi-mine-economic-v2.webp","s":"Ein gewaltiges Kohlevorkommen in der Süd-Gobi, das hauptsächlich hochwertige Kokskohle produziert.","f":["Eine der größten unerschlossenen Kohlelagerstätten.","Besitzt geschätzte Reserven von über 6 Milliarden Tonnen."]},"erdenet-mining-corporation-economic-v2":{"i":"/poi-images/erdenet-mining-corporation-economic-v2.webp","s":"Eine der größten offenen Kupferminen Asiens, die maßgeblich zur Entwicklung der gleichnamigen Stadt beitrug.","f":["Gegründet als mongolisch-russisches Joint Venture.","Produziert jährlich zehntausende Tonnen Kupferkonzentrat."]},"zamiin-uud-trade-zone-economic-v2":{"i":"/poi-images/zamiin-uud-trade-zone-economic-v2.webp","s":"Der wichtigste Grenzübergang und Handelsplatz zwischen der Mongolei und China, essenziell für den Import.","f":["Zentrum für die transmongolische Eisenbahn.","Bewältigt den Großteil der mongolischen Konsumgüterimporte."]},"altanbulag-trade-zone-economic-v2":{"i":"/poi-images/altanbulag-trade-zone-economic-v2.webp","s":"Ein bedeutender Handelsknotenpunkt an der russischen Grenze, der den Warenaustausch nach Norden fördert.","f":["Fördert die wirtschaftliche Zusammenarbeit mit Russland.","Bietet steuerliche Anreize für internationale Unternehmen."]},"gatsuurt-gold-mine-economic-v2":{"i":"/poi-images/gatsuurt-gold-mine-economic-v2.webp","s":"Eine bedeutende Goldlagerstätte im Norden des Landes, die durch moderne Bergbautechniken erschlossen wird.","f":["Verfügt über beträchtliche Goldreserven.","Spielt eine wichtige Rolle in der nationalen Edelmetallproduktion."]},"shivee-ovoo-coal-mine-economic-v2":{"i":"/poi-images/shivee-ovoo-coal-mine-economic-v2.webp","s":"Ein großer Tagebau, der maßgeblich zur Kohleversorgung der inländischen Kraftwerke beiträgt.","f":["Deckte historisch einen großen Teil des mongolischen Energiebedarfs.","Nutzt riesige Schaufelradbagger für den Abbau."]},"baganuur-coal-mine-economic-v2":{"i":"/poi-images/baganuur-coal-mine-economic-v2.webp","s":"Diese Mine liegt östlich von Ulaanbaatar und ist der Hauptlieferant für die Heiz- und Kraftwerke der Hauptstadt.","f":["Wurde in den späten 1970er Jahren eröffnet.","Liefert Millionen Tonnen Braunkohle pro Jahr."]},"salkhit-wind-farm-economic-v2":{"i":"/poi-images/salkhit-wind-farm-economic-v2.webp","s":"Der erste große Windpark der Mongolei, der einen wichtigen Schritt in Richtung erneuerbarer Energien darstellt.","f":["Produziert 50 Megawatt sauberen Strom.","Reduziert die Abhängigkeit von alten Kohlekraftwerken."]},"tsetsii-wind-farm-economic-v2":{"i":"/poi-images/tsetsii-wind-farm-economic-v2.webp","s":"Ein modernes Windenergieprojekt in der Wüste Gobi, das die starken und konstanten Wüstenwinde nutzt.","f":["Befindet sich in der windreichen Süd-Gobi.","Versorgt Minen und lokale Gemeinden mit Strom."]},"darkhan-metallurgical-plant-economic-v2":{"i":"/poi-images/darkhan-metallurgical-plant-economic-v2.webp","s":"Das größte Stahl- und Eisenwerk des Landes, das die mongolische Bau- und Infrastrukturindustrie mit Material versorgt.","f":["Verarbeitet lokal abgebautes Eisenerz.","Wurde mit ausländischer technologischer Hilfe modernisiert."]},"ulaanbaatar-power-plant-4-economic-v2":{"i":"/poi-images/ulaanbaatar-power-plant-4-economic-v2.webp","s":"Das größte Kraftwerk der Mongolei, das den Löwenanteil des Stroms und der Fernwärme für die Hauptstadt produziert.","f":["Ist ein klassisches Kohlekraftwerk.","Lebenswichtig für das Überleben während der extrem kalten Winter."]},"gobi-cashmere-factory-economic-v2":{"i":"/poi-images/gobi-cashmere-factory-economic-v2.webp","s":"Eine der größten Kaschmir-Verarbeitungsanlagen der Welt, die luxuriöse Textilien für den globalen Markt herstellt.","f":["Verarbeitet Kaschmir direkt von mongolischen Nomaden.","Exportiert hochwertige Kleidung in über 30 Länder."]},"tsagaan-suvarga-mine-economic-v2":{"i":"/poi-images/tsagaan-suvarga-mine-economic-v2.webp","s":"Ein riesiges Bergbauprojekt für Kupfer und Molybdän in der Wüste Gobi, das sich noch in der Entwicklung befindet.","f":["Benannt nach den markanten 'Weißen Stupa'-Felsformationen in der Nähe.","Wird als zukunftsweisendes Großprojekt gehandelt."]},"khushigt-valley-trade-zone-economic-v2":{"i":"/poi-images/khushigt-valley-trade-zone-economic-v2.webp","s":"Ein neues Entwicklungszentrum rund um den internationalen Flughafen von Ulaanbaatar, das Logistik und Handel bündeln soll.","f":["Wurde gemeinsam mit dem neuen Flughafen geplant.","Soll Verkehrsstaus in der Hauptstadt reduzieren."]},"boroo-gold-mine-economic-v2":{"i":"/poi-images/boroo-gold-mine-economic-v2.webp","s":"Eine der ersten erfolgreichen Goldminen mit ausländischer Investition, die stark zum Exportwachstum der Mongolei beitrug.","f":["Gehörte lange zu den lukrativsten Minen des Landes.","Nutzt moderne Extraktionstechnologien für hohe Ausbeute."]},"sainshand-industrial-park-economic-v2":{"i":"/poi-images/sainshand-industrial-park-economic-v2.webp","s":"Ein ehrgeiziges Mega-Projekt, das Rohstoffe aus der Gobi lokal verarbeiten und schwere Industrieanlagen ansiedeln soll.","f":["Soll Ölraffinerien und Zementwerke umfassen.","Profitiert von der direkten Anbindung an die Eisenbahn."]},"amgalan-thermal-power-plant-economic-v2":{"i":"/poi-images/amgalan-thermal-power-plant-economic-v2.webp","s":"Ein wichtiges Heizkraftwerk im Osten der Hauptstadt, das erbaut wurde, um den wachsenden Wärmebedarf neuer Wohnviertel zu decken.","f":["Verfügt über moderne Filtertechnologien.","Reduziert den Smog durch den Ersatz tausender kleiner Kohleöfen."]},"nalaikh-industrial-park-economic-v2":{"i":"/poi-images/nalaikh-industrial-park-economic-v2.webp","s":"Ein aufstrebendes Wirtschaftszentrum nahe Ulaanbaatar, das sich auf die Produktion von Baumaterialien konzentriert.","f":["Gebaut auf dem Gelände einer ehemaligen historischen Kohlemine.","Zielt darauf ab, Leichtindustrie aus der Innenstadt auszulagern."]},"ukhaa-khudag-mine-economic-v2":{"i":"/poi-images/ukhaa-khudag-mine-economic-v2.webp","s":"Eine hochmoderne Kohlemine in der Gobi, betrieben von der Mongolian Mining Corporation, bekannt für ihre integrierte Waschanlage.","f":["Verfügt über eine eigene 18-Megawatt-Kraftwerksanlage.","Gewinnt hochwertigen Kokskohle-Export nach China."]},"mn-erdene-zuu-history-v2":{"i":"/poi-images/mn-erdene-zuu-history-v2.webp","s":"Das Erdene Dsuu Kloster ist das wohl älteste erhaltene buddhistische Kloster der Mongolei.","f":["Erbaut im Jahr 1585 unter Abtai Sain Khan.","Die Außenmauer besteht aus 108 weißen Stupas."]},"mn-karakorum-history-v2":{"i":"/poi-images/mn-karakorum-history-v2.webp","s":"Karakorum war im 13.","f":["Gegründet um 1220 von Dschingis Khan.","War unter Ögedei Khan die Hauptstadt der Welt."]},"mn-zaisan-history-v2":{"i":"/poi-images/mn-zaisan-history-v2.webp","s":"Die Daisan-Gedenkstätte auf einem Hügel südlich von Ulaanbaatar ehrt die sowjetischen Soldaten, die im Zweiten Weltkrieg fielen.","f":["Erbaut von den Sowjets während des Kalten Krieges.","Erfordert den Aufstieg von über 600 Treppenstufen."]},"mn-amarbayasgalant-history-v2":{"i":"/poi-images/mn-amarbayasgalant-history-v2.webp","s":"Das Amarbajasgalant-Kloster im Norden der Mongolei ist eines der am besten erhaltenen buddhistischen Zentren des Landes.","f":["Gegründet zwischen 1727 und 1736.","Überlebte die kommunistischen Säuberungen der 1930er weitgehend unbeschadet."]},"mn-gandantegchinlen-history-v2":{"i":"/poi-images/mn-gandantegchinlen-history-v2.webp","s":"Das Gandantegtschinlen-Kloster ist das größte aktive buddhistische Zentrum in Ulaanbaatar.","f":["Gegründet im Jahr 1838 vom fünften Jebtsundamba Khutuktu.","War das einzige Kloster, das im Kommunismus teilweise geöffnet blieb."]},"mn-genghis-khan-statue-history-v2":{"i":"/poi-images/mn-genghis-khan-statue-history-v2.webp","s":"Das Dschingis-Khan-Reiterstandbild in Tsonjin Boldog ist mit 40 Metern die größte Reiterstatue der Welt.","f":["Die Statue ist 40 Meter hoch und glänzt silbern.","Besucher können durch das Innere bis auf den Kopf des Pferdes steigen."]},"mn-choijin-lama-history-v2":{"i":"/poi-images/mn-choijin-lama-history-v2.webp","s":"Der Tschoidschin-Lama-Tempel ist ein faszinierender architektonischer Komplex im Zentrum von Ulaanbaatar.","f":["Erbaut zwischen 1904 und 1908.","Dient heute als Museum für religiöse Kunst."]},"mn-khoshoo-tsaidam-history-v2":{"i":"/poi-images/mn-khoshoo-tsaidam-history-v2.webp","s":"Die Chöschöö-Tsaidam-Denkmäler im Orchon-Tal sind bedeutende Inschriftensteine aus dem 8.","f":["Die Steine stammen aus dem Jahr 732 und 735 n. Chr.","Die frühesten bekannten Beispiele alttürkischer Sprache."]},"mn-manzushir-history-v2":{"i":"/poi-images/mn-manzushir-history-v2.webp","s":"Die Ruinen des Mandschuschir-Klosters liegen eingebettet in den malerischen Bergen des Bogd Khan Uul.","f":["Gegründet im Jahr 1733.","Beherbergte in seiner Blütezeit über 300 Mönche."]},"mn-ongi-history-v2":{"i":"/poi-images/mn-ongi-history-v2.webp","s":"Ongiin-Chiid war einst eines der größten Klöster in der Wüste Gobi, gelegen am Ufer des Flusses Ongi.","f":["Gegründet im Jahr 1660.","Bestand aus zwei separaten Komplexen auf beiden Seiten des Flusses."]},"mn-baldan-bereeven-history-v2":{"i":"/poi-images/mn-baldan-bereeven-history-v2.webp","s":"Das Baldan Brijun Kloster liegt versteckt in den bewaldeten Bergen der Khentii-Provinz.","f":["Die Hauptbauphase begann 1777.","Das Gebäude wurde aus massiven Steinen und Ziegeln errichtet."]},"mn-khamariin-khiid-history-v2":{"i":"/poi-images/mn-khamariin-khiid-history-v2.webp","s":"Chamariin-Chiid ist ein bedeutendes buddhistisches Zentrum in der Wüste Gobi, das als spirituelles Energiezentrum ('Sambhala') gilt.","f":["Gegründet im Jahr 1820.","Berühmt als das Tor zur mythischen Welt Sambhala."]},"mn-khalkh-gol-history-v2":{"i":"/poi-images/mn-khalkh-gol-history-v2.webp","s":"Das Gebiet am Fluss Chalchin Gol war 1939 Schauplatz einer entscheidenden, aber wenig bekannten Schlacht.","f":["Die Kämpfe dauerten von Mai bis September 1939.","Verhinderte, dass Japan im Zweiten Weltkrieg die UdSSR angriff."]},"mn-bogd-khan-palace-history-v2":{"i":"/poi-images/mn-bogd-khan-palace-history-v2.webp","s":"Das Bogd-Khan-Palastmuseum in Ulaanbaatar war die Winterresidenz des achten Jebtsundamba Khutuktu, des letzten theokratischen Herrschers der Mongolei.","f":["Erbaut zwischen 1893 und 1903.","Der Bogd Khan lived hier fast 20 Jahre lang."]},"mn-tovkhon-history-v2":{"i":"/poi-images/mn-tovkhon-history-v2.webp","s":"Das Töwchön-Kloster thront spektakulär auf einem Berggipfel, umgeben von dichten Wäldern.","f":["Nur zu Fuß oder auf dem Pferderücken erreichbar.","Zanabazar entwickelte hier die Sojombo-Schrift, das mongolische Nationalsymbol."]},"mn-sangiin-kherem-history-v2":{"i":"/poi-images/mn-sangiin-kherem-history-v2.webp","s":"Die Ruinen der Festung Sangiin Kherem befinden sich im Norden der Stadt Chowd.","f":["Erbaut im Jahr 1762 von den Mandschu.","Die Lehmmauern waren ursprünglich vier Meter dick."]},"mn-uushigiin-uvur-history-v2":{"i":"/poi-images/mn-uushigiin-uvur-history-v2.webp","s":"Der Komplex von Uuschigiin Uwur in der Provinz Chöwsgöl beherbergt einige der besterhaltenen bronzezeitlichen Hirschsteine Eurasiens.","f":["Datieren etwa auf das 2. Jahrtausend v. Chr.","Der Komplex umfasst insgesamt 14 stehende Steine."]},"mn-altai-petroglyphs-history-v2":{"i":"/poi-images/mn-altai-petroglyphs-history-v2.webp","s":"Die Petroglyphen im mongolischen Altai bilden ein gewaltiges Freilichtmuseum prähistorischer Kunst.","f":["Die ältesten Zeichnungen zeigen Mammuts und Nashörner.","Erstrecken sich über drei große Täler im äußersten Westen."]},"mn-demchig-history-v2":{"i":"/poi-images/mn-demchig-history-v2.webp","s":"Die Ruinen des Demtschig-Klosters liegen in der Provinz Ömnö-Gobi, umgeben von bizarren roten Granitfelsen.","f":["Oft als Zentrum der Weltenenergie in der Gobi bezeichnet.","Wurde auf einem natürlichen Granitplateau errichtet."]},"mn-tsogt-taij-history-v2":{"i":"/poi-images/mn-tsogt-taij-history-v2.webp","s":"Die Ruinen der Burg von Tsogt Taidsch (Tsogtyn Tsagaan Baishing) sind die steinernen Überreste einer Festung aus dem 17.","f":["Erbaut im Jahr 1601.","Die Mauern bestehen aus massiven, unverputzten Steinen."]},"khongoryn-els-landmarks-v2":{"i":"/poi-images/khongoryn-els-landmarks-v2.webp","s":"Khongoryn Els, auch als 'Singender Sand' bekannt, sind die größten und spektakulärsten Sanddünen der Wüste Gobi in der Mongolei.","f":["Die Dünen erstrecken sich über 100 Kilometer Länge.","Einige Sandgipfel erreichen eine Höhe von bis zu 300 Metern."]},"bayanzag-flaming-cliffs-landmarks-v2":{"i":"/poi-images/bayanzag-flaming-cliffs-landmarks-v2.webp","s":"Die Flammenden Klippen, mongolisch Bajandsag, sind eine rötliche Sandsteinformation in der Wüste Gobi.","f":["Der Ort wurde durch den Forscher Roy Chapman Andrews berühmt.","1923 wurden hier die ersten Dinosaurier-Eier der Welt entdeckt."]},"yolyn-am-landmarks-v2":{"i":"/poi-images/yolyn-am-landmarks-v2.webp","s":"Yolyn Am, auch als Geierschlucht bekannt, ist eine tiefe und enge Schlucht im Gurwan-Saichan-Nationalpark.","f":["Die Schlucht wurde nach dem hier lebenden Bartgeier benannt.","Die Felswände ragen teilweise Hunderte von Metern steil empor."]},"turtle-rock-landmarks-v2":{"i":"/poi-images/turtle-rock-landmarks-v2.webp","s":"Der Schildkrötenfelsen ist eine imposante Granitfelsformation im Gorkhi-Terelj-Nationalpark, die natürlich die Form einer riesigen Schildkröte angenommen hat.","f":["Der Felsen ist etwa 24 Meter hoch.","Schildkröten gelten in der mongolischen Kultur als Symbol für langes Leben."]},"khustai-national-park-landmarks-v2":{"i":"/poi-images/khustai-national-park-landmarks-v2.webp","s":"Der Chustain-Nuruu-Nationalpark ist das wichtigste Schutzgebiet für die erfolgreiche Wiederansiedlung der Przewalski-Pferde, auch Takhi genannt.","f":["Das Przewalski-Pferd ist die letzte echte Wildpferdeart der Erde.","Der Park wurde 1993 speziell für dieses Auswilderungsprojekt gegründet."]},"orkhon-waterfall-landmarks-v2":{"i":"/poi-images/orkhon-waterfall-landmarks-v2.webp","s":"Der Orchon-Wasserfall, mongolisch Ulaan Tsutgalan, ist der berühmteste Wasserfall der Mongolei.","f":["Der Wasserfall stürzt etwa 20 Meter in die Tiefe.","Das Wasser fließt nur in den feuchten Sommermonaten in voller Stärke."]},"tsagaan-suvarga-landmarks-v2":{"i":"/poi-images/tsagaan-suvarga-landmarks-v2.webp","s":"Tsagaan Suvarga, was übersetzt Weiße Stupa bedeutet, ist eine steile Kalksteinformation in der Halbwüste, die durch Wind- und Wassererosion geformt wurde.","f":["Die Klippen erreichen eine Höhe von bis zu 30 Metern.","Die Gesteinsschichten weisen verschiedene Farben von Weiß bis Violett auf."]},"baga-gazriin-chuluu-landmarks-v2":{"i":"/poi-images/baga-gazriin-chuluu-landmarks-v2.webp","s":"Baga Gazriin Chuluu ist ein malerisches Granitfelsmassiv, das abrupt aus der flachen Steppe der Mittelgobi emporragt.","f":["Die Felsen bedecken eine Fläche von rund 300 Quadratkilometern.","Der höchste Punkt des Massivs liegt auf 1768 Metern."]},"khorgo-volcano-landmarks-v2":{"i":"/poi-images/khorgo-volcano-landmarks-v2.webp","s":"Der Chorgo-Vulkan ist ein erloschener Vulkan im Nationalpark Khorgo-Terkhiin Tsagaan Nuur.","f":["Der Krater ist 200 Meter breit und 70 bis 80 Meter tief.","Die letzte Eruption fand vor etwa 8000 Jahren statt."]},"terkhiin-tsagaan-nuur-landmarks-v2":{"i":"/poi-images/terkhiin-tsagaan-nuur-landmarks-v2.webp","s":"Der Terkhiin Tsagaan Nuur, oder Große Weiße See, ist ein wunderschöner Süßwassersee in der zentralen Mongolei, der von Vulkanen umgeben ist.","f":["Der See liegt auf einer Höhe von über 2000 Metern.","Er friert im Winter oft monatelang bis zum Grund zu."]},"tsenkher-hot-springs-landmarks-v2":{"i":"/poi-images/tsenkher-hot-springs-landmarks-v2.webp","s":"Die heißen Quellen von Tsenkher sind tief in den bewaldeten Bergen der Arkhangai-Provinz verborgen.","f":["Das Wasser enthält Natriumkarbonat, Kalzium und Schwefelwasserstoff.","Die Quellen sollen bei Gelenk- und Nervenerkrankungen helfen."]},"aryabal-meditation-temple-landmarks-v2":{"i":"/poi-images/aryabal-meditation-temple-landmarks-v2.webp","s":"Das Aryabal-Meditationszentrum ist ein buddhistischer Tempel im Gorkhi-Terelj-Nationalpark, der malerisch in einen steilen Berghang gebaut wurde.","f":["Der Tempel wurde zwischen 1998 und 2004 erbaut.","Die Architektur erinnert von oben betrachtet an den Kopf eines Elefanten."]},"sukhbaatar-square-landmarks-v2":{"i":"/poi-images/sukhbaatar-square-landmarks-v2.webp","s":"Der Süchbaatar-Platz ist das pulsierende Herz der Hauptstadt Ulaanbaatar.","f":["Der Platz ist nach Damdin Süchbaatar, dem Führer der Revolution von 1921, benannt.","Eine massive Statue von Dschingis Khan thront vor dem Parlamentsgebäude."]},"al-tai-tavan-bogd-landmarks-v2":{"i":"/poi-images/al-tai-tavan-bogd-landmarks-v2.webp","s":"Der Altai-Tavan-Bogd-Nationalpark im äußersten Westen der Mongolei ist berühmt für seine vergletscherten Gipfel, tiefen Seen und antiken Petroglyphen.","f":["Tavan Bogd bedeutet 'Fünf Heilige' und bezieht sich auf die fünf höchsten Gipfel.","Der Khüiten Peak ist mit 4374 Metern der höchste Berg der Mongolei."]},"khermen-tsav-landmarks-v2":{"i":"/poi-images/khermen-tsav-landmarks-v2.webp","s":"Khermen Tsav ist eine entlegene, zerklüftete Canyon-Landschaft aus rotem Sandstein tief in der Wüste Gobi.","f":["Der Canyon ist etwa 10 Kilometer lang und 100 bis 200 Meter tief.","Eine Sphinx-ähnliche Felsformation bewacht den Eingang des Canyons."]},"burkhan-khaldun-landmarks-v2":{"i":"/poi-images/burkhan-khaldun-landmarks-v2.webp","s":"Der Burchan Chaldun ist der heiligste Berg der Mongolei, versteckt in der bewaldeten Khentii-Gebirgskette.","f":["Der Berg ist seit 2015 ein UNESCO-Welterbe.","Traditionell ist Frauen der Aufstieg auf den Berg untersagt."]},"aglag-buteel-monastery-landmarks-v2":{"i":"/poi-images/aglag-buteel-monastery-landmarks-v2.webp","s":"Das Aglag Buteel Kloster ist ein einzigartiges spirituelles Zentrum und Museum, eingebettet in die schroffen Granitberge.","f":["Das Kloster wurde erst im Jahr 2011 gegründet.","Mystische und surreale Tierskulpturen säumen den Meditationspfad."]},"suikhent-petrified-forest-landmarks-v2":{"i":"/poi-images/suikhent-petrified-forest-landmarks-v2.webp","s":"Der versteinerte Wald von Suikhent ist eine paläontologische Sensation in der mongolischen Wüste.","f":["Die versteinerten Baumstämme stammen aus der Jurazeit.","Einige der Stämme erreichen Längen von bis zu 20 Metern."]},"shiliin-bogd-landmarks-v2":{"i":"/poi-images/shiliin-bogd-landmarks-v2.webp","s":"Der Shiliin Bogd ist ein markanter, erloschener Vulkankegel in der weitläufigen Steppe der Provinz Sükhbaatar.","f":["Der Berg erreicht eine Höhe von 1778 Metern.","Der Krater ist fast zwei Kilometer breit."]},"taikhar-chuluu-landmarks-v2":{"i":"/poi-images/taikhar-chuluu-landmarks-v2.webp","s":"Der Taikhar Chuluu ist ein massiver, 20 Meter hoher Granitblock, der rätselhafterweise mitten in der weiten Ebene am Fluss Tamir steht.","f":["Eine Legende besagt, ein Held habe den Felsen hierher geworfen, um eine Schlange zu zerquetschen.","Die ältesten Inschriften auf dem Felsen stammen aus dem 6. Jahrhundert."]},"mn-ikh-nart-life-v2":{"i":"/poi-images/mn-ikh-nart-life-v2.webp","s":"Ein geschütztes Gebiet, das für seine zerklüfteten Felsen und als wichtiger Lebensraum für die bedrohten Argali-Wildschafe und Sibirischen Steinböcke bekannt ist.","f":["Gegründet im Jahr 1996 zum Schutz der Tierwelt.","Beherbergt eine der größten Populationen von Argali-Schafen."]},"mn-gun-galuut-life-v2":{"i":"/poi-images/mn-gun-galuut-life-v2.webp","s":"Ein vielfältiges Ökosystem mit Hochgebirgen, Steppen und Seen, das Kranichen, Argali-Schafen und unzähligen Wasservögeln Zuflucht bietet.","f":["Liegt etwa 130 Kilometer östlich von Ulaanbaatar.","Bietet hervorragende Möglichkeiten zur Vogelbeobachtung."]},"mn-great-gobi-a-life-v2":{"i":"/poi-images/mn-great-gobi-a-life-v2.webp","s":"Ein riesiges und extrem trockenes Schutzgebiet, das der letzte Zufluchtsort des seltenen Gobi-Bären und des wilden Baktrischen Kamels ist.","f":["Eines der größten Biosphärenreservate der Welt.","Der Gobi-Bär (Mazaalai) ist vom Aussterben bedroht."]},"mn-great-gobi-b-life-v2":{"i":"/poi-images/mn-great-gobi-b-life-v2.webp","s":"Eine weite Halbwüstenregion im Südwesten der Mongolei, die sich der Erhaltung von Takhi-Wildpferden und asiatischen Wildeseln widmet.","f":["Wichtiger Ort für die Wiederansiedlung von Przewalski-Pferden.","Beherbergt Herden des asiatischen Wildesels (Khulan)."]},"mn-mongol-daguur-life-v2":{"i":"/poi-images/mn-mongol-daguur-life-v2.webp","s":"Ein grenzüberschreitendes Schutzgebiet in der Ostmongolei, geprägt von Feuchtgebieten und Steppen, das für Zugvögel von globaler Bedeutung ist.","f":["Teil eines internationalen Schutzgebiets mit Russland und China.","Berühmt für seltene Kranicharten wie den Weißnackenkranich."]},"mn-dariganga-reserve-life-v2":{"i":"/poi-images/mn-dariganga-reserve-life-v2.webp","s":"Ein Gebiet mit Vulkankegeln, Sanddünen und heiligen Seen, das großen Herden der mongolischen Gazelle als Lebensraum dient.","f":["Liegt am Rand der großen östlichen Steppe.","Der heilige Berg Altan Ovoo befindet sich in dieser Region."]},"mn-numrug-reserve-life-v2":{"i":"/poi-images/mn-numrug-reserve-life-v2.webp","s":"Eine unberührte Taiga- und Steppenlandschaft im äußersten Osten der Mongolei, die Heimat für Elche, Wölfe und den Ussuri-Braunbären ist.","f":["Eine der am wenigsten zugänglichen Regionen der Mongolei.","Markiert den Übergang zur Mandschurei."]},"mn-sharga-reserve-life-v2":{"i":"/poi-images/mn-sharga-reserve-life-v2.webp","s":"Ein Steppenreservat im Westen der Mongolei, das speziell zum Schutz der extrem bedrohten mongolischen Saiga-Antilope eingerichtet wurde.","f":["Die Saiga-Antilope ist an ihrer ungewöhnlichen rüsselartigen Nase zu erkennen.","Es gibt nur noch wenige Tausend Exemplare weltweit."]},"mn-lkhachinvandad-life-v2":{"i":"/poi-images/mn-lkhachinvandad-life-v2.webp","s":"Ein hügeliges Schutzgebiet im Osten des Landes, das sich der Erhaltung von Gazellen und dem Schutz ihres natürlichen Steppenlebensraums widmet.","f":["Wichtiger Wanderkorridor für die mongolische Gazelle.","Schützt die empfindliche Steppenflora vor Überweidung."]},"mn-tsaatan-camps-life-v2":{"i":"/poi-images/mn-tsaatan-camps-life-v2.webp","s":"In den nördlichen Wäldern der Taiga züchten die nomadischen Tsaatan-Familien Rentiere für Milch, Transport und als spirituelle Begleiter.","f":["Die Tsaatan sind eine der letzten Rentiernomaden der Welt.","Sie leben in traditionellen Tipi-Zelten (Urts)."]},"mn-uvs-seabuckthorn-life-v2":{"i":"/poi-images/mn-uvs-seabuckthorn-life-v2.webp","s":"Die Provinz Uws ist berühmt für den Anbau des robusten, vitaminreichen Sanddorns, der in dem rauen Klima hervorragend gedeiht und zu Saft und Öl verarbeitet wird.","f":["Der Sanddorn aus Uws ist als geografische Angabe geschützt.","Reich an Vitamin C und Antioxidantien."]},"mn-darkhan-wheat-life-v2":{"i":"/poi-images/mn-darkhan-wheat-life-v2.webp","s":"Rund um die Stadt Darchan erstrecken sich ausgedehnte landwirtschaftliche Flächen, die das Zentrum der mongolischen Weizen- und Getreideproduktion bilden.","f":["Darchan gilt als die Brotkorb-Region der Mongolei.","Weizen ist das wichtigste Ackerbauprodukt des Landes."]},"mn-selenge-farms-life-v2":{"i":"/poi-images/mn-selenge-farms-life-v2.webp","s":"Das fruchtbare Tal des Flusses Selenge ist das wichtigste Anbaugebiet für Gemüse wie Kartoffeln, Karotten und Kohl in der sonst trockenen Mongolei.","f":["Etwa die Hälfte des mongolischen Gemüses stammt von hier.","Begünstigt durch Flusssedimente und feuchteres Mikroklima."]},"mn-khovd-watermelon-life-v2":{"i":"/poi-images/mn-khovd-watermelon-life-v2.webp","s":"Dank warmer Sommer und geschickter Bewässerungssysteme kultivieren Bauern in der Provinz Chowd einige der süßesten Wassermelonen Zentralasiens.","f":["Oasenkultur am Rande des Altai-Gebirges.","Wassermelonen aus Chowd sind landesweit begehrt."]},"mn-gobi-camel-farm-life-v2":{"i":"/poi-images/mn-gobi-camel-farm-life-v2.webp","s":"In den weiten Ebenen der Ömnögovi-Provinz züchten Nomaden das zweihöckrige Kamel für Wolle, Milch und als robustes Lasttier.","f":["Mongolische Kamele ertragen Temperaturschwankungen von +40°C bis -40°C.","Ihre feine Unterwolle ist weltweit für Textilien geschätzt."]},"mn-ub-botanical-garden-life-v2":{"i":"/poi-images/mn-ub-botanical-garden-life-v2.webp","s":"Eine grüne Oase in der Hauptstadt, die zur Erforschung und Erhaltung der mongolischen Flora dient und eine Vielzahl einheimischer Pflanzenarten ausstellt.","f":["Gehört zur Mongolischen Akademie der Wissenschaften.","Schützt seltene und bedrohte Pflanzen der Steppe und Taiga."]},"mn-nairamdal-center-life-v2":{"i":"/poi-images/mn-nairamdal-center-life-v2.webp","s":"Ein berühmtes internationales Sommerlager nahe Ulaanbaatar, das seit Jahrzehnten Kinder aus aller Welt für Erholung und kulturellen Austausch zusammenbringt.","f":["Gegründet im Jahr 1978 mit Unterstützung vieler Länder.","Das Wort 'Nairamdal' bedeutet Freundschaft."]},"mn-national-amusement-park-life-v2":{"i":"/poi-images/mn-national-amusement-park-life-v2.webp","s":"Der größte Freizeitpark in Ulaanbaatar bietet Fahrgeschäfte, ein Riesenrad und künstliche Seen, was ihn zu einem beliebten Wochenendziel für Familien macht.","f":["Verfügt über eine Achterbahn und ein Spukhaus.","Im Winter wird oft eine große Eislaufbahn angelegt."]},"mn-buddha-park-life-v2":{"i":"/poi-images/mn-buddha-park-life-v2.webp","s":"Ein ruhiger Park am Fuße des Zaisan-Hügels, dominiert von einer 18 Meter hohen, goldenen Buddha-Statue, der als Ort der Besinnung dient.","f":["Die Statue wurde 2006 mit südkoreanischer Spende errichtet.","Unter der Statue befindet sich ein kleiner Raum mit Gebetsmühlen."]},"mn-misheel-kids-park-life-v2":{"i":"/poi-images/mn-misheel-kids-park-life-v2.webp","s":"Ein modernes Indoor- und Outdoor-Freizeitzentrum in Ulaanbaatar, das sich auf interaktive Spielbereiche und Trampoline für kleine Kinder spezialisiert hat.","f":["Bietet ganzjährig eine wetterunabhängige Spielumgebung.","Liegt im Misheel Expo Komplex, südlich der Innenstadt."]},"khovsgol-lake-nature-v2":{"i":"/poi-images/khovsgol-lake-nature-v2.webp","s":"Er wird oft als die 'dunkelblaue Perle' der Mongolei bezeichnet und ist der größte Süßwassersee des Landes.","f":["Fasst etwa 70 % des mongolischen Süßwassers.","Erreicht eine Tiefe von über 260 Metern."]},"orkhon-river-nature-v2":{"i":"/poi-images/orkhon-river-nature-v2.webp","s":"Der längste Fluss der Mongolei fließt durch ein historisch reiches Tal, das einst das Zentrum großer Nomadenreiche war.","f":["Hat eine Länge von 1124 Kilometern.","Mündet schließlich in die Selenge."]},"gobi-gurvansaikhan-nature-v2":{"i":"/poi-images/gobi-gurvansaikhan-nature-v2.webp","s":"Der größte Nationalpark der Mongolei schützt eine einzigartige Wüsten- und Berglandschaft, in der seltene Tierarten wie der Schneeleopard heimisch sind.","f":["Erstreckt sich über fast 27.000 Quadratkilometer.","Bedeutet übersetzt 'Die drei Schönen der Gobi'."]},"uvs-lake-nature-v2":{"i":"/poi-images/uvs-lake-nature-v2.webp","s":"Dieser riesige, flache Salzsee im Nordwesten der Mongolei ist das Zentrum eines abflusslosen Beckens von extremer klimatischer Bedeutung.","f":["Flächenmäßig der größte See der Mongolei.","Seine Umgebung ist ein UNESCO-Weltnaturerbe."]},"tuul-river-nature-v2":{"i":"/poi-images/tuul-river-nature-v2.webp","s":"Dieser heilige Fluss schlängelt sich durch den Khentii-Gebirgszug und fließt direkt durch die Hauptstadt Ulaanbaatar.","f":["Hat eine Länge von 704 Kilometern.","Sein Wasser ist von November bis Mitte April gefroren."]},"kharkhiraa-mountain-nature-v2":{"i":"/poi-images/kharkhiraa-mountain-nature-v2.webp","s":"Ein markanter Doppelgipfel im Altai-Gebirge, der von ausgedehnten Gletschern und tiefen Tälern geprägt ist.","f":["Der Hauptgipfel erreicht eine Höhe von über 4000 Metern.","Beliebt bei Bergsteigern und Abenteurern."]},"otgontenger-mountain-nature-v2":{"i":"/poi-images/otgontenger-mountain-nature-v2.webp","s":"Der höchste Berg im Changai-Gebirge ist ein verehrter, heiliger Gipfel, dessen schneebedeckte Kuppe schon von weitem sichtbar ist.","f":["Ist 4008 Meter hoch.","Er ist einer der drei heiligsten Berge der Mongolei."]},"khar-us-lake-nature-v2":{"i":"/poi-images/khar-us-lake-nature-v2.webp","s":"Dieser 'Schwarze Wassersee' im Westen der Mongolei ist durch eine große Schilfinsel in zwei Teile geteilt und ein Paradies für Wasservögel.","f":["Der See beheimatet eine riesige Kormoran-Kolonie.","Erfriert im Winter komplett."]},"onon-river-nature-v2":{"i":"/poi-images/onon-river-nature-v2.webp","s":"Der Fluss entspringt im Khentii-Gebirge und ist eng mit der Legende von Dschingis Khan verbunden, der an seinen Ufern geboren sein soll.","f":["Fließt weiter in das russische Amur-Becken.","Ist eines der wenigen unberührten Flusssysteme der Region."]},"khar-lake-zavkhan-nature-v2":{"i":"/poi-images/khar-lake-zavkhan-nature-v2.webp","s":"Eingebettet in massive Sanddünen, bietet dieser magische blaue See einen dramatischen Kontrast zur trockenen Wüstenlandschaft.","f":["Liegt am Rande der Bor-Khyar-Sanddünen.","Wird von unterirdischen Quellen gespeist."]},"selenge-river-nature-v2":{"i":"/poi-images/selenge-river-nature-v2.webp","s":"Ein mächtiger Wasserlauf, der den größten Teil der nördlichen Mongolei entwässert und entscheidend für das Ökosystem des Baikalsees ist.","f":["Trägt fast die Hälfte des Zuflusses des Baikalsees bei.","Fließt durch weite, fruchtbare Täler."]},"khangai-mountains-nature-v2":{"i":"/poi-images/khangai-mountains-nature-v2.webp","s":"Dieses grüne und wasserreiche Gebirgsmassiv im Zentrum des Landes zeichnet sich durch weite Almwiesen und dichte Lärchenwälder aus.","f":["Ist der Ursprung vieler großer Flüsse der Mongolei.","Bekannt für seine sanften, abgerundeten Gipfel."]},"khentii-mountains-nature-v2":{"i":"/poi-images/khentii-mountains-nature-v2.webp","s":"Eine raue, schwer zugängliche Bergkette im Nordosten, die als natürliche Barriere zwischen der sibirischen Taiga und der asiatischen Steppe wirkt.","f":["Gilt als Heimat des heiligen Berges Burchan Chaldun.","Bietet Lebensraum für Braunbären und Wölfe."]},"buir-lake-nature-v2":{"i":"/poi-images/buir-lake-nature-v2.webp","s":"Ein großer Süßwassersee im äußersten Osten der Mongolei, der sich über die Grenze nach China erstreckt und reich an Fischbeständen ist.","f":["Seine Sandstrände sind ein beliebtes lokales Ausflugsziel.","Der See friert im Winter fast bis zum Grund zu."]},"ikh-bogd-mountain-nature-v2":{"i":"/poi-images/ikh-bogd-mountain-nature-v2.webp","s":"Der höchste Gipfel des Gobi-Altai-Gebirges erhebt sich majestätisch aus der umliegenden Halbwüste und bietet spektakuläre Ausblicke.","f":["Erreicht eine Höhe von 3957 Metern.","Wurde 1957 von einem schweren Erdbeben erschüttert."]},"mongolian-altai-nature-v2":{"i":"/poi-images/mongolian-altai-nature-v2.webp","s":"Ein massives, vergletschertes Gebirgssystem, das die westliche Grenze der Mongolei prägt und von extremen Temperaturschwankungen dominiert wird.","f":["Erstreckt sich über 900 Kilometer Länge.","Heimat von Argalis und sibirischen Steinböcken."]},"kherlen-river-nature-v2":{"i":"/poi-images/kherlen-river-nature-v2.webp","s":"Einer der drei großen Flüsse der Ostmongolei, der durch weite Steppenlandschaften mäandert und wichtig für die nomadische Viehzucht ist.","f":["Über 1200 Kilometer lang.","Er mündet schließlich im fernen Hulun-Nuur in China."]},"khan-khentii-forest-nature-v2":{"i":"/poi-images/khan-khentii-forest-nature-v2.webp","s":"Ein dichtes, naturbelassenes Nadelwaldgebiet im Norden der Mongolei, das den Übergang von der mongolischen Steppe zur sibirischen Taiga markiert.","f":["Ist ein streng geschütztes Reservat.","Wird fast ausschließlich von Birken und Kiefern dominiert."]},"egiin-gol-nature-v2":{"i":"/poi-images/egiin-gol-nature-v2.webp","s":"Der einzige Abfluss des Chöwsgöl-Sees ist ein kristallklarer, reißender Fluss, der sich durch malerische, bewaldete Täler windet.","f":["Er ist etwa 475 Kilometer lang.","Gilt als einer der besten Orte zum Fliegenfischen auf Taimen."]},"bogd-khan-uul-forest-nature-v2":{"i":"/poi-images/bogd-khan-uul-forest-nature-v2.webp","s":"Das weltweit älteste offiziell anerkannte Naturschutzgebiet bietet ein dichtes Mosaik aus sibirischen Zedern und Lärchen direkt südlich der Hauptstadt.","f":["Steht bereits seit 1778 unter Schutz.","Bietet Lebensraum für Rotwild und Wildschweine."]},"khuiten-peak-relief-v2":{"i":"/poi-images/khuiten-peak-relief-v2.webp","s":"Der höchste Punkt der Mongolei liegt im Altai-Gebirge und ist dauerhaft mit Gletschern bedeckt.","f":["Erreicht eine Höhe von 4374 Metern.","Grenzt an China und Russland."]},"tsambagarav-mountain-relief-v2":{"i":"/poi-images/tsambagarav-mountain-relief-v2.webp","s":"Ein mächtiger, schneebedeckter Berg im Altai, der von nomadischen Adlerjägern umgeben ist.","f":["Erhebt sich auf 4195 Meter.","Ist Teil eines geschützten Nationalparks."]},"monkh-saridag-relief-v2":{"i":"/poi-images/monkh-saridag-relief-v2.webp","s":"Der höchste Gipfel des Sajan-Gebirges liegt an der Grenze zwischen der Mongolei und Russland.","f":["Erreicht 3491 Meter.","Bietet Ausblicke auf den Chöwsgöl-See."]},"dariganga-plateau-relief-v2":{"i":"/poi-images/dariganga-plateau-relief-v2.webp","s":"Eine weite Hochebene vulkanischen Ursprungs im Osten der Mongolei, bekannt für ihre weiten Graslandschaften.","f":["Verfügt über mehr als 200 Vulkankegel.","Ist ein wichtiges Gebiet für Zugvögel."]},"darkhad-valley-relief-v2":{"i":"/poi-images/darkhad-valley-relief-v2.webp","s":"Ein isoliertes Becken im Norden der Mongolei, das von Rentierzüchtern und dichten Wäldern geprägt ist.","f":["Ist etwa 160 Kilometer lang.","Beherbergt über 300 kleine Seen."]},"nemegt-basin-relief-v2":{"i":"/poi-images/nemegt-basin-relief-v2.webp","s":"Ein trockenes Tal in der Wüste Gobi, das weltweit für seine reichen Dinosaurierfossilien berühmt ist.","f":["Ein Zentrum der paläontologischen Forschung.","Die Landschaft besteht aus erodierten Canyons."]},"sutai-mountain-relief-v2":{"i":"/poi-images/sutai-mountain-relief-v2.webp","s":"Ein vergletscherter Gipfel an der Grenze mehrerer Provinzen, der von den lokalen Nomaden verehrt wird.","f":["Erreicht eine Höhe von 4220 Metern.","Ist ein beliebter Ort für Bergsteiger."]},"khasagt-khairkhan-relief-v2":{"i":"/poi-images/khasagt-khairkhan-relief-v2.webp","s":"Ein zerklüfteter Berg im Gobi-Altai, dessen Hänge Lebensraum für seltene Schneeleoparden bieten.","f":["Ist als Naturschutzgebiet ausgewiesen.","Erhebt sich auf fast 3600 Meter."]},"great-lakes-depression-relief-v2":{"i":"/poi-images/great-lakes-depression-relief-v2.webp","s":"Eine riesige semi-aride Senke im Westen der Mongolei, die mehrere bedeutende Salz- und Süßwasserseen umfasst.","f":["Umfasst eine Fläche von über 100.000 Quadratkilometern.","Ist ein wichtiges Ökosystem für Wüstentiere."]},"asralt-khairkhan-relief-v2":{"i":"/poi-images/asralt-khairkhan-relief-v2.webp","s":"Der höchste Berg des Chentii-Gebirges ist ein anspruchsvolles Ziel für Bergsteiger nahe der Hauptstadt.","f":["Erreicht 2799 Meter Höhe.","Oft im Winter wegen starkem Schneefall unzugänglich."]},"gobi-desert-relief-v2":{"i":"/poi-images/gobi-desert-relief-v2.webp","s":"Eine der größten Wüsten der Welt, geprägt von extremen Temperaturschwankungen und weiten Kiesebenen.","f":["Ist die sechstgrößte Wüste der Erde.","Ein großer Teil ist im Winter von Eis und Schnee bedeckt."]},"tost-mountains-relief-v2":{"i":"/poi-images/tost-mountains-relief-v2.webp","s":"Eine abgelegene Bergkette in der Süd-Gobi, die als weltweit erstes Schutzgebiet speziell für Schneeleoparden deklariert wurde.","f":["Liegt in der Provinz Ömnögowi.","Ist ein Modellprojekt für den Schutz gefährdeter Arten."]},"malchin-peak-relief-v2":{"i":"/poi-images/malchin-peak-relief-v2.webp","s":"Einer der fünf heiligen Gipfel des Tawan-Bogd-Massivs, der als einziger ohne spezielle Kletterausrüstung besteigbar ist.","f":["Steht genau auf der Grenze zu Russland.","Ist 4050 Meter hoch."]},"nairamdal-peak-relief-v2":{"i":"/poi-images/nairamdal-peak-relief-v2.webp","s":"Ein bedeutender Berggipfel im Altai, der den präzisen Dreiländereck zwischen der Mongolei, Russland und China markiert.","f":["Der Name bedeutet 'Freundschaft'.","Erreicht eine Höhe von 4180 Metern."]},"burkhan-buudai-relief-v2":{"i":"/poi-images/burkhan-buudai-relief-v2.webp","s":"Ein geschütztes Bergmassiv in der Provinz Gobi-Altai, das für seine reiche Flora und historische Heiligkeit bekannt ist.","f":["Erhebt sich auf 3765 Meter.","Wurde 1996 zum nationalen Schutzgebiet erklärt."]},"tarvagatai-range-relief-v2":{"i":"/poi-images/tarvagatai-range-relief-v2.webp","s":"Eine ausgedehnte, von dichten Nadelwäldern bedeckte Bergkette, die eine wichtige Wasserscheide in der zentralen Mongolei bildet.","f":["Bildet den westlichen Ausläufer des Changai-Gebirges.","Heimat von Braunbären und Sibirischen Moschustieren."]},"dayan-mountain-relief-v2":{"i":"/poi-images/dayan-mountain-relief-v2.webp","s":"Ein heiliger Berg in der Provinz Bajan-Ölgii, an dessen Hängen alte Petroglyphen und Grabstätten aus der Bronzezeit zu finden sind.","f":["Liegt in der Nähe des Dajan-Nuur-Sees.","Ist ein wichtiges archäologisches Gebiet."]},"aj-bogd-relief-v2":{"i":"/poi-images/aj-bogd-relief-v2.webp","s":"Ein markantes Massiv im Gobi-Altai, das durch raue klimatische Bedingungen und felsige Canyons charakterisiert wird.","f":["Erreicht 3802 Meter Höhe.","Ist sehr schwer zugänglich und wenig erforscht."]},"saylyugem-mountains-relief-v2":{"i":"/poi-images/saylyugem-mountains-relief-v2.webp","s":"Eine Bergkette, die als natürliche Barriere zwischen der mongolischen Steppe und der russischen Altai-Republik dient.","f":["Bietet Lebensraum für Argali-Wildschafe.","Wurde stark durch eiszeitliche Gletscher geformt."]},"uran-togoo-relief-v2":{"i":"/poi-images/uran-togoo-relief-v2.webp","s":"Ein malerischer, erloschener Vulkankegel, dessen bewaldeter Krater im Sommer einen kleinen, kreisrunden See birgt.","f":["Ist etwa 1686 Meter hoch.","Seit 1965 ein nationales Naturdenkmal."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
</html>
