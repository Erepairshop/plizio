ră.","f":["Fondat în secolul al XIII-lea î.Hr.","Cunoscut pentru taurii înaripați."]},"erbil-citadel-history-v2":{"i":"/poi-images/erbil-citadel-history-v2.webp","s":"O așezare fortificată pe o colină, unul dintre cele mai vechi locuri locuite continuu.","f":["Locuit de peste 6000 de ani.","Se ridică la 32 de metri deasupra orașului."]},"taq-kasra-history-v2":{"i":"/poi-images/taq-kasra-history-v2.webp","s":"Rămășița impresionantă a unui palat sasanid, cunoscută pentru bolta sa uriașă de cărămidă.","f":["Cea mai mare arcadă de cărămidă nearmată din lume.","Face parte din orașul antic Ctesifon."]},"assur-history-v2":{"i":"/poi-images/assur-history-v2.webp","s":"Prima capitală și centrul religios al Imperiului Asirian, pe fluviul Tigru.","f":["Fondat în mileniul 3 î.Hr.","Numit după zeul principal al asirienilor."]},"al-ukhaidir-fortress-history-v2":{"i":"/poi-images/al-ukhaidir-fortress-history-v2.webp","s":"O fortăreață masivă din perioada abbasidă, care se ridică singuratică în deșert.","f":["Construită la sfârșitul secolului al VIII-lea.","Prezintă arhitectură islamică timpurie."]},"dur-kurigalzu-history-v2":{"i":"/poi-images/dur-kurigalzu-history-v2.webp","s":"Un oraș antic din sudul Mesopotamiei, cu o ruină de zigurat vizibilă și astăzi.","f":["Fondat în secolul al XIV-lea î.Hr.","Capitala kasiților."]},"borsippa-history-v2":{"i":"/poi-images/borsippa-history-v2.webp","s":"Un important oraș sumerian și babilonian, adesea asociat cu Turnul Babel.","f":["Centrul cultului lui Nabu.","Turnul în trepte Birs Nimrud domină ruinele."]},"uruk-history-v2":{"i":"/poi-images/uruk-history-v2.webp","s":"Unul dintre primele orașe adevărate din istoria omenirii și patria legendarului rege Ghilgameș.","f":["A jucat un rol principal în urbanizarea timpurie.","Locul de origine al scrierii cuneiforme."]},"eridu-history-v2":{"i":"/poi-images/eridu-history-v2.webp","s":"Considerat în mitologia sumeriană drept primul oraș creat de zei.","f":["Una dintre cele mai vechi așezări din sudul Mesopotamiei.","Centrul de cult al zeului apei Enki."]},"lalish-temple-history-v2":{"i":"/poi-images/lalish-temple-history-v2.webp","s":"Cel mai sfânt sanctuar al yazidiților, situat într-o vale pitorească din nordul țării.","f":["Locul de înmormântare al șeicului Adi ibn Musafir.","Centrul pelerinajelor anuale yazidi."]},"kish-history-v2":{"i":"/poi-images/kish-history-v2.webp","s":"Un important oraș antic care, conform tradiției, a găzduit prima dinastie regală după Marele Potop.","f":["A fost un centru al Imperiului Akkadian.","Regii din Kish aveau o poziție dominantă."]},"imam-ali-mosque-history-v2":{"i":"/poi-images/imam-ali-mosque-history-v2.webp","s":"Unul dintre cele mai sfinte locuri ale islamului șiit și mormântul lui Ali ibn Abi Talib.","f":["Clădirea originală datează din secolul al X-lea.","Prezintă o cupolă masivă aurită."]},"imam-husayn-shrine-history-v2":{"i":"/poi-images/imam-husayn-shrine-history-v2.webp","s":"Mausoleul celui de-al treilea imam șiit și un centru de tradiții religioase profund înrădăcinate.","f":["Se află pe locul bătăliei de la Karbala.","Unul dintre cele mai vizitate locuri de pelerinaj din lume."]},"al-mustansiriya-university-history-v2":{"i":"/poi-images/al-mustansiriya-university-history-v2.webp","s":"Una dintre cele mai vechi clădiri universitare din lume, care a servit ca centru intelectual în perioada de glorie a Bagdadului.","f":["Fondată în 1227 de califul abbasid Al-Mustansir.","Aici se preda drept islamic, medicină și matematică."]},"al-shaheed-monument-history-v2":{"i":"/poi-images/al-shaheed-monument-history-v2.webp","s":"Un monument albastru iconic în Bagdad, care comemorează soldații căzuți în Primul Război din Golf.","f":["Constă dintr-o cupolă împărțită în două jumătăți.","Construit între 1981 și 1983."]},"al-mutanabbi-street-landmarks-v2":{"i":"/poi-images/al-mutanabbi-street-landmarks-v2.webp","s":"O stradă istorică din Bagdad, renumită pentru numeroasele sale librării și ca un centru cultural al Irakului.","f":["Numită după faimosul poet arab Al-Mutanabbi.","Vineri are loc aici o piață de carte mare și plină de viață."]},"baghdad-tower-landmarks-v2":{"i":"/poi-images/baghdad-tower-landmarks-v2.webp","s":"Un turn de televiziune impresionant din Bagdad, construit inițial în anii 1990, care oferă o platformă de observație.","f":["Turnul are o înălțime de peste 200 de metri.","A fost avariat de mai multe ori de războaie și reconstruit."]},"al-kadhimiya-mosque-landmarks-v2":{"i":"/poi-images/al-kadhimiya-mosque-landmarks-v2.webp","s":"Un altar islamic important din Bagdad, unde sunt înmormântați al șaptelea și al nouălea imam șiit.","f":["Moscheea este caracterizată de două cupole de aur izbitoare.","Atrage anual milioane de pelerini din întreaga lume."]},"abbasid-palace-landmarks-v2":{"i":"/poi-images/abbasid-palace-landmarks-v2.webp","s":"Una dintre puținele clădiri istorice rămase în Bagdad din epoca abbasidă, caracterizată prin arhitectura sa impresionantă din cărămidă.","f":["Construit la sfârșitul secolului al XII-lea pe malul râului Tigru.","A servit probabil odată ca școală teologică sau madrasa."]},"victory-arch-landmarks-v2":{"i":"/poi-images/victory-arch-landmarks-v2.webp","s":"Două arcuri de triumf gigantice sub formă de săbii încrucișate în Bagdad, care comemorează Primul Război din Golf.","f":["Mâinile care țin săbiile ar fi fost modelate după cele ale lui Saddam Hussein.","Arcurile au fost deschise oficial publicului în 1989."]},"unknown-soldier-monument-landmarks-v2":{"i":"/poi-images/unknown-soldier-monument-landmarks-v2.webp","s":"O structură monumentală din Bagdad care reprezintă un scut tradițional, dedicată soldaților căzuți în război.","f":["Designul a fost creat de arhitectul irakian Khaled Al-Rahal.","Scutul care cade simbolizează un războinic pe moarte."]},"shanidar-cave-landmarks-v2":{"i":"/poi-images/shanidar-cave-landmarks-v2.webp","s":"O peșteră faimoasă din Kurdistan, unde au fost descoperite rămășițe semnificative de neanderthalieni.","f":["Săpăturile au început în anii 1950 sub conducerea lui Ralph Solecki.","Au fost descoperite scheletele a zece neanderthalieni."]},"mudhaffar-minaret-landmarks-v2":{"i":"/poi-images/mudhaffar-minaret-landmarks-v2.webp","s":"Un minaret istoric din Erbil datând de la sfârșitul secolului al XII-lea, care se ridică la aproape 36 de metri înălțime.","f":["A fost construit sub domnia lui Muzaffar al-Din Abu Sa'id al-Kawkaburi.","Minaretul este faimos pentru modelul său de cărămidă pe diagonală."]},"great-mosque-kufa-landmarks-v2":{"i":"/poi-images/great-mosque-kufa-landmarks-v2.webp","s":"Una dintre cele mai vechi și sfinte moschei din lume, asociată cu multe evenimente istorice importante ale islamului.","f":["A fost fondată la mijlocul secolului al VII-lea.","Al patrulea calif Ali ibn Abi Talib a fost asasinat aici."]},"al-askari-shrine-landmarks-v2":{"i":"/poi-images/al-askari-shrine-landmarks-v2.webp","s":"Un altar șiit important din Samarra, renumit la nivel mondial pentru fosta sa cupolă de aur.","f":["Aici se odihnesc al zecelea și al unsprezecelea dintre cei doisprezece imami șiiți.","Faimoasa cupolă de aur a fost distrusă într-un bombardament din 2006 și ulterior reconstruită."]},"jalil-khayat-mosque-landmarks-v2":{"i":"/poi-images/jalil-khayat-mosque-landmarks-v2.webp","s":"Cea mai mare moschee din Erbil, a cărei arhitectură combină elemente otomane moderne cu măiestria locală.","f":["A fost finanțată de omul de afaceri kurd Jalil Khayat.","Moscheea poate găzdui până la 2.000 de credincioși."]},"al-qishla-landmarks-v2":{"i":"/poi-images/al-qishla-landmarks-v2.webp","s":"O clădire otomană istorică din Bagdad, cu un turn cu ceas caracteristic, construit în secolul al XIX-lea.","f":["Construit inițial ca o cazarmă militară otomană.","Ceasul turnului a fost donat de regele britanic George al V-lea."]},"tree-of-knowledge-landmarks-v2":{"i":"/poi-images/tree-of-knowledge-landmarks-v2.webp","s":"Un loc simbolic la confluența fluviilor Tigru și Eufrat, despre care legenda locală spune că a făcut parte din Grădina Edenului.","f":["Copacul original a murit cu mult timp în urmă.","Este situat în locul unde începe râul Shatt al-Arab."]},"ezekiel-tomb-landmarks-v2":{"i":"/poi-images/ezekiel-tomb-landmarks-v2.webp","s":"Un loc istoric de pelerinaj în Al Kifl, considerat în mod tradițional locul de odihnă al profetului biblic Ezechiel.","f":["Sit-ul este venerat atât de evrei, cât și de musulmani.","Până la mijlocul secolului al XX-lea, aici au avut loc mari pelerinaje evreiești."]},"al-nuri-mosque-landmarks-v2":{"i":"/poi-images/al-nuri-mosque-landmarks-v2.webp","s":"O moschee istorică din Mosul, renumită în special pentru faimosul său minaret înclinat.","f":["Construită la sfârșitul secolului al XII-lea de Nur ad-Din Zengi.","Minaretul înclinat, numit Al-Hadba, a fost un reper al orașului Mosul."]},"delal-bridge-landmarks-v2":{"i":"/poi-images/delal-bridge-landmarks-v2.webp","s":"Un vechi pod de piatră peste râul Khabur din Zakho, una dintre cele mai cunoscute structuri istorice din nordul Irakului.","f":["Este formată în întregime din pietre mari, fără utilizarea mortarului.","Este adesea asociată cu o poveste de dragoste tragică în legendele kurde locale."]},"abu-hanifa-mosque-landmarks-v2":{"i":"/poi-images/abu-hanifa-mosque-landmarks-v2.webp","s":"O moschee sunnită importantă din Bagdad, construită în jurul mormântului faimosului savant islamic Abu Hanifa.","f":["Clădirea originală a fost construită în anul 1065.","Abu Hanifa este fondatorul școlii de jurisprudență Hanafi a islamului sunnit."]},"gali-ali-beg-waterfall-landmarks-v2":{"i":"/poi-images/gali-ali-beg-waterfall-landmarks-v2.webp","s":"O cascadă spectaculoasă în munții kurzi, atât de iconică încât decorează și bancnotele irakiene.","f":["Apa se prăbușește într-un defileu îngust și impresionant.","O destinație populară pentru picnicuri și pentru a scăpa de căldura verii."]},"bekhal-waterfall-landmarks-v2":{"i":"/poi-images/bekhal-waterfall-landmarks-v2.webp","s":"O destinație turistică populară în regiunea muntoasă Rawanduz, renumită pentru cascadele sale răcoritoare și frumusețea naturală.","f":["Izvorul curge din munții înalți ai Kurdistanului.","Există numeroase mici cafenele și restaurante în jurul cascadei."]},"basra-sports-city-landmarks-v2":{"i":"/poi-images/basra-sports-city-landmarks-v2.webp","s":"Un complex sportiv ultramodern din sudul Irakului, care găzduiește cel mai mare stadion de fotbal din țară.","f":["Stadionul principal are o capacitate de 65.000 de spectatori.","Designul fațadei exterioare este inspirat de scoarța curmalului."]},"al-zawraa-park-life-v2":{"i":"/poi-images/al-zawraa-park-life-v2.webp","s":"Un parc public spațios din Bagdad, care include zone verzi, un parc de distracții și un stadion.","f":["Unul dintre cele mai mari parcuri din Bagdad.","A fost amenajat în anii 1970."]},"baghdad-zoo-life-v2":{"i":"/poi-images/baghdad-zoo-life-v2.webp","s":"Cea mai mare grădină zoologică din Irak, situată în Parcul Al-Zawraa, oferind familiilor o varietate de animale native și exotice.","f":["Deschis inițial în 1971.","Găzduiește sute de specii de animale."]},"sindbad-land-life-v2":{"i":"/poi-images/sindbad-land-life-v2.webp","s":"Un parc de distracții modern și popular din Bagdad, numit după celebrul personaj Sindbad Marinarul.","f":["Oferă numeroase atracții pentru copii.","O destinație populară pentru weekend."]},"sami-abdulrahman-park-life-v2":{"i":"/poi-images/sami-abdulrahman-park-life-v2.webp","s":"Cel mai mare parc din Erbil, construit pe locul unei foste baze militare, astăzi o oază verde de liniște.","f":["Se întinde pe sute de hectare.","Numit după politicianul kurd Sami Abdulrahman."]},"majidi-land-life-v2":{"i":"/poi-images/majidi-land-life-v2.webp","s":"Un complex de agrement pentru familii din Erbil, care combină facilitățile de cumpărături cu un parc de distracții acoperit.","f":["Perfect pentru distracție în lunile fierbinți de vară.","Dispune de un roller coaster în interiorul clădirii."]},"chavi-land-life-v2":{"i":"/poi-images/chavi-land-life-v2.webp","s":"Unul dintre cele mai mari parcuri de distracții din Regiunea Kurdistan, situat pe pantele muntelui Goizha din Sulaymaniyah.","f":["Dispune de o telecabină care oferă vederi panoramice.","Atrage anual mii de turiști."]},"azadi-park-life-v2":{"i":"/poi-images/azadi-park-life-v2.webp","s":"Un parc urban important din Sulaymaniyah, care oferă grădini frumoase, monumente și alei liniștite.","f":["Numele 'Azadi' înseamnă libertate în limba kurdă.","Parcul a fost anterior o bază militară."]},"basra-family-park-life-v2":{"i":"/poi-images/basra-family-park-life-v2.webp","s":"Un parc popular din sudul Irakului, care oferă familiilor din Basra un loc de recreere în oraș.","f":["Adesea aglomerat seara.","Dispune de locuri de joacă și mici cafenele."]},"mosul-woods-life-v2":{"i":"/poi-images/mosul-woods-life-v2.webp","s":"O zonă de recreere împădurită pe malurile Tigrului, considerată plămânul verde al orașului Mosul.","f":["Cunoscut local sub numele de 'Al-Ghabat'.","A fost parțial reîmpădurit după conflictele din ultimii ani."]},"shanidar-park-life-v2":{"i":"/poi-images/shanidar-park-life-v2.webp","s":"Un parc urban din Erbil, numit după celebra peșteră, cunoscut pentru galeriile sale de artă și arhitectura verde.","f":["Conectat la Parcul Minaret printr-o telecabină.","Găzduiește un centru pentru arta locală."]},"minaret-park-life-v2":{"i":"/poi-images/minaret-park-life-v2.webp","s":"Un parc istoric din Erbil, care înconjoară faimosul minaret Choli și oferă o atmosferă liniștită.","f":["Minaretul datează din secolul al XII-lea.","Un loc popular pentru picnicuri în familie."]},"barzan-nature-reserve-life-v2":{"i":"/poi-images/barzan-nature-reserve-life-v2.webp","s":"O arie protejată importantă din regiunea montană, cunoscută pentru flora și fauna sa bogată, incluzând capre sălbatice și leoparzi.","f":["Interdicțiile stricte de vânătoare protejează animalele sălbatice.","Oferă habitate importante pentru speciile rare de păsări."]},"bahr-al-najaf-reserve-life-v2":{"i":"/poi-images/bahr-al-najaf-reserve-life-v2.webp","s":"O depresiune din deșert care se transformă într-un lac după ploi abundente, atrăgând multe păsări migratoare.","f":["Dimensiunea corpului de apă variază foarte mult în funcție de sezon.","O zonă umedă importantă pentru pelicani și flamingo."]},"qara-dagh-reserve-life-v2":{"i":"/poi-images/qara-dagh-reserve-life-v2.webp","s":"O zonă montană împădurită care este unul dintre ultimele refugii pentru leopardul persan, pe cale de dispariție.","f":["Primele dovezi ale camerei capcană cu leopardul în Irak au fost înregistrate aici.","Dispune de păduri dense de stejari."]},"mesopotamian-marshes-np-life-v2":{"i":"/poi-images/mesopotamian-marshes-np-life-v2.webp","s":"Primul parc național din Irak, protejând biodiversitatea și cultura unică a arabilor din mlaștini.","f":["Zona a fost declarată Patrimoniu Mondial UNESCO în 2016.","Un loc de odihnă important pentru milioane de păsări migratoare."]},"al-gharraf-agriculture-life-v2":{"i":"/poi-images/al-gharraf-agriculture-life-v2.webp","s":"O zonă agricolă fertilă de-a lungul canalului Al-Gharraf, care se ramifică din Tigru, permițând agricultura tradițională.","f":["Cunoscută pentru cultivarea grâului și a orzului.","Una dintre cele mai vechi zone cultivate continuu din lume."]},"basra-date-palms-life-v2":{"i":"/poi-images/basra-date-palms-life-v2.webp","s":"Cândva cele mai mari livezi de curmali din lume pe malurile Shatt al-Arab, care și astăzi produc curmale de înaltă calitate.","f":["Înainte de anii 1980, aici existau peste 30 de milioane de curmali.","Irakul a fost cândva cel mai mare producător de curmale din lume."]},"sharazur-plain-life-v2":{"i":"/poi-images/sharazur-plain-life-v2.webp","s":"Una dintre cele mai fertile câmpii agricole din Regiunea Kurdistan, înconjurată de munți maiestuoși.","f":["Un centru pentru cultivarea legumelor și cerealelor.","A fost lăudată pentru agricultură încă din antichitate."]},"dohuk-dam-park-life-v2":{"i":"/poi-images/dohuk-dam-park-life-v2.webp","s":"O zonă pitorească de agrement la Lacul Dohuk, care oferă localnicilor și turiștilor oportunități de picnic și plimbări cu barca.","f":["Oferă vederi uluitoare la munți și apă.","O destinație de weekend foarte populară în regiune."]},"dream-city-dohuk-life-v2":{"i":"/poi-images/dream-city-dohuk-life-v2.webp","s":"Un parc modern de distracții în Dohuk, care oferă o varietate de atracții și opțiuni de divertisment pentru întreaga familie.","f":["Dispune de o roată panoramică mare cu vedere la oraș.","Unul dintre cele mai moderne parcuri de distracții din nordul Irakului."]},"tigris-nature-v2":{"i":"/poi-images/tigris-nature-v2.webp","s":"Tigrul este unul dintre cele două mari fluvii ale Mesopotamiei, curgând prin centrul Irakului.","f":["Lungime: aprox. 1.900 km.","Curge prin Bagdad."]},"euphrates-nature-v2":{"i":"/poi-images/euphrates-nature-v2.webp","s":"Eufratul este cel mai lung și cel mai important fluviu istoric din Orientul Mijlociu, modelând peisajul Irakului.","f":["Lungime: 2.800 km.","Formează Mesopotamia împreună cu Tigrul."]},"halgurd-nature-v2":{"i":"/poi-images/halgurd-nature-v2.webp","s":"Halgurd este cel mai înalt munte situat în întregime în Irak, aflat în Munții Zagros din Kurdistanul irakian.","f":["Altitudine: 3.607 metri.","Face parte din Munții Zagros."]},"cheekha-dar-nature-v2":{"i":"/poi-images/cheekha-dar-nature-v2.webp","s":"Cheekha Dar este cel mai înalt punct din Irak, situat chiar la granița cu Iranul.","f":["Altitudine: 3.611 metri.","Numele înseamnă \"cortul negru\"."]},"lake-tharthar-nature-v2":{"i":"/poi-images/lake-tharthar-nature-v2.webp","s":"Lacul Tharthar este cel mai mare lac ca suprafață din Irak și servește ca un rezervor important de apă.","f":["Suprafață: aprox. 2.710 km².","Extins artificial."]},"lake-habbaniyah-nature-v2":{"i":"/poi-images/lake-habbaniyah-nature-v2.webp","s":"Lacul Habbaniyah este un lac puțin adânc în deșertul provinciei Al-Anbar, folosit pentru controlul inundațiilor pe râul Eufrat.","f":["Servește la stocarea apei.","Zonă de recreere populară."]},"lake-razzaza-nature-v2":{"i":"/poi-images/lake-razzaza-nature-v2.webp","s":"Lacul Razzaza, cunoscut și sub numele de Bahr al-Milh (Marea de Sare), este al doilea lac ca mărime din țară.","f":["Salinitate foarte mare.","Habitat important pentru păsările migratoare."]},"hawizeh-marshes-nature-v2":{"i":"/poi-images/hawizeh-marshes-nature-v2.webp","s":"Mlaștinile Hawizeh sunt o zonă umedă imensă în sudul Irakului, la granița cu Iranul, adăpostind o biodiversitate unică.","f":["Parte a Patrimoniului Mondial Ahwar.","În mare parte cruțate de asanări masive."]},"hammar-marshes-nature-v2":{"i":"/poi-images/hammar-marshes-nature-v2.webp","s":"Mlaștinile Hammar formează partea sudică a mlaștinilor mesopotamiene, la sud de Eufrat.","f":["Lacul Hammar este cel mai mare corp de apă.","Căminul arabilor din mlaștini."]},"central-marshes-nature-v2":{"i":"/poi-images/central-marshes-nature-v2.webp","s":"Mlaștinile Centrale sunt situate în inima sudului Irakului, între Tigru și Eufrat, reprezentând un ecosistem important.","f":["Cunoscute și sub numele de mlaștinile Qurna.","Aproape distruse în anii 1990."]},"dukan-lake-nature-v2":{"i":"/poi-images/dukan-lake-nature-v2.webp","s":"Lacul Dukan este cel mai mare lac din Kurdistanul irakian, format de un baraj pe Micul Zab.","f":["Barajul a fost construit între 1954 și 1959.","Important pentru generarea de energie."]},"darbandikhan-lake-nature-v2":{"i":"/poi-images/darbandikhan-lake-nature-v2.webp","s":"Lacul Darbandikhan este un frumos lac de acumulare pe râul Diyala, în provincia Sulaymaniyah.","f":["Servește la irigare și generarea de energie.","Popular printre turiști."]},"sawa-lake-nature-v2":{"i":"/poi-images/sawa-lake-nature-v2.webp","s":"Lacul Sawa era un bazin endoreic în provincia al-Muthanna, cunoscut pentru salinitatea sa ridicată și formațiunile de calcar.","f":["A secat complet în 2022.","Nu avea afluenți de suprafață."]},"mosul-dam-lake-nature-v2":{"i":"/poi-images/mosul-dam-lake-nature-v2.webp","s":"Lacul Mosul de pe Tigru este cel mai mare lac de acumulare din Irak și furnizează apă importantă pentru agricultură.","f":["Creat prin construcția barajului Mosul.","Cel mai mare baraj din Irak."]},"qandil-mountains-nature-v2":{"i":"/poi-images/qandil-mountains-nature-v2.webp","s":"Munții Qandil sunt o regiune montană greu accesibilă în nordul Irakului, aproape de granița cu Turcia și Iran.","f":["Fac parte din Munții Zagros.","Cele mai înalte vârfuri depășesc 3.000 de metri."]},"sinjar-mountains-nature-v2":{"i":"/poi-images/sinjar-mountains-nature-v2.webp","s":"Munții Sinjar reprezintă un lanț muntos de aproximativ 100 km în nord-vestul Irakului, fiind inima comunității yazidi.","f":["Cel mai înalt punct: 1.463 metri.","Teritoriu sacru pentru yazidiți."]},"diyala-river-nature-v2":{"i":"/poi-images/diyala-river-nature-v2.webp","s":"Diyala este un important afluent al Tigrului, care izvorăște în Iran și se varsă la est de Bagdad.","f":["Lungime: aprox. 445 km.","Formează parțial granița cu Iranul."]},"great-zab-nature-v2":{"i":"/poi-images/great-zab-nature-v2.webp","s":"Marele Zab este un afluent al Tigrului din nordul Irakului, aducând cantități mari de apă de topire din munți.","f":["Lungime: aprox. 400 km.","Izvorăște în Turcia."]},"shatt-al-arab-nature-v2":{"i":"/poi-images/shatt-al-arab-nature-v2.webp","s":"Shatt al-Arab se formează prin confluența Eufratului cu Tigrul și se varsă în Golful Persic lângă Basra.","f":["Lungime: aprox. 200 km.","Râu de frontieră cu Iranul."]},"zawita-forest-nature-v2":{"i":"/poi-images/zawita-forest-nature-v2.webp","s":"Pădurea Zawita din provincia Dohuk este o zonă de recreere dens împădurită, renumită pentru pinii săi.","f":["Bogată în pini de Calabria.","Destinație turistică populară vara."]},"syrian-desert-relief-v2":{"i":"/poi-images/syrian-desert-relief-v2.webp","s":"Această regiune deșertică vastă din vestul țării este caracterizată de câmp :"/poi-images/mount-pira-magrun-relief-v2.webp","s":"Un vârf proeminent în Munții Zagros, lângă Sulaymaniyah, care este adesea învăluit în nori și zăpadă.","f":["Atinge o altitudine de 2.611 metri.","Domină peisajul la nord-vest de Sulaymaniyah."]},"makhoul-mountains-relief-v2":{"i":"/poi-images/makhoul-mountains-relief-v2.webp","s":"Un lanț de dealuri și munți pe malul vestic al Tigrului, care reprezintă o continuare a Munților Hamrin spre nord-vest.","f":["Se întinde paralel cu râul Tigru.","A fost locul unor fortărețe antice."]},"al-faw-coast-relief-v2":{"i":"/poi-images/al-faw-coast-relief-v2.webp","s":"Singura coastă a Irakului la Golful Persic, caracterizată prin întinderi de noroi și acces important la porturi.","f":["Irakul are doar aproximativ 58 de kilometri de coastă.","Cel mai important acces la Golful Persic."]},"southern-desert-relief-v2":{"i":"/poi-images/southern-desert-relief-v2.webp","s":"O câmpie întinsă și aridă care se întinde din provinciile sudice ale Irakului până la granița cu Arabia Saudită.","f":["Este numit \"Al-Hajar\" în arabă.","Constă în principal din platouri de calcar."]},"mount-azmar-relief-v2":{"i":"/poi-images/mount-azmar-relief-v2.webp","s":"Un lanț muntos chiar la marginea orașului Sulaymaniyah, care oferă o priveliște magnifică asupra întregii metropole urbane.","f":["Un loc popular pentru picnicuri printre localnici.","Oferă vederi panoramice asupra Sulaymaniyah."]},"mount-goizha-relief-v2":{"i":"/poi-images/mount-goizha-relief-v2.webp","s":"Împreună cu Muntele Azmar, acesta înconjoară Sulaymaniyah și este un element central al siluetei naturale a regiunii.","f":["Situat adiacent Muntelui Azmar.","Adesea acoperit de zăpadă iarna."]},"mount-khantur-relief-v2":{"i":"/poi-images/mount-khantur-relief-v2.webp","s":"Un munte proeminent lângă Zakho, la granița irakiano-turcă, cunoscut pentru stâncile sale abrupte și natura sălbatică.","f":["Găzduiește un sistem de peșteri naturale.","Are vedere la orașul Zakho."]},"mount-maqlub-relief-v2":{"i":"/poi-images/mount-maqlub-relief-v2.webp","s":"Un munte în Câmpia Ninive la nord-est de Mosul, cu importanță istorică pentru comunitățile creștine locale.","f":["Găzduiește Mănăstirea Mor Mattai.","Cunoscut și sub numele de Muntele Alfaf."]},"shahrizor-plain-relief-v2":{"i":"/poi-images/shahrizor-plain-relief-v2.webp","s":"O câmpie întinsă și fertilă în provincia Sulaymaniyah, înconjurată de lanțuri muntoase înalte.","f":["Una dintre cele mai fertile regiuni din țară.","Istoric, un centru al agriculturii."]},"gali-ali-beg-canyon-relief-v2":{"i":"/poi-images/gali-ali-beg-canyon-relief-v2.webp","s":"Un defileu adânc și impresionant în nord, prin care râurile de munte se înghesuie și formează cascade pitorești.","f":["Renumit pentru Cascada Gali Ali Beg.","Drumul Hamilton trece prin defileu."]},"bahr-al-najaf-depression-relief-v2":{"i":"/poi-images/bahr-al-najaf-depression-relief-v2.webp","s":"O depresiune mare lângă orașul Najaf, care se transformă într-o apă puțin adâncă sau într-o salină în funcție de precipitații.","f":["Numele înseamnă \"Marea din Najaf\".","Situat la granița cu deșertul vestic."]},"soran-valley-relief-v2":{"i":"/poi-images/soran-valley-relief-v2.webp","s":"O vale pitorească în guvernoratul Erbil, înconjurată de vârfuri acoperite de zăpadă și caracterizată de râuri și pajiști verzi.","f":["Valea este cunoscută pentru istoria sa bogată.","O destinație populară pentru ecoturism."]},"western-desert-relief-v2":{"i":"/poi-images/western-desert-relief-v2.webp","s":"Extinderea vastă a deșertului din provincia Al-Anbar, care ajunge până în Iordania și Siria și este brăzdată de ueduri.","f":["Ocupă aproape o treime din suprafața Irakului.","Cunoscut și sub numele de Al-Badiyat al-Shamiyah."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');

let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}

let dr=false,dx=0,dy=0;

let pD=0,pS=1;

const pop=document.getElementById('popup');

function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));

  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));

  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}

// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}

gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});

const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
