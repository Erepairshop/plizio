const POI_CARD={"liechtenstein-ochsenkopf-relief-v2":{"i":"/poi-images/liechtenstein-ochsenkopf-relief-v2.webp","s":"Ochsenkopf is a distinctive mountain in the Liechtenstein alpine region.","f":["Part of the Rätikon range","Alpine terrain"]},"liechtenstein-nospitz-relief-v2":{"i":"/poi-images/liechtenstein-nospitz-relief-v2.webp","s":"Nospitz is a prominent peak near Malbun in the Liechtenstein Oberland.","f":["Near Malbun","Exposed location"]},"li-cult-vaduz-castle":{"i":"/poi-images/li-cult-vaduz-castle.webp","s":"Vaduz Castle is the official residence of the Princely House and serves as a majestic landmark overlooking the capital city.","f":["The oldest parts of the keep date back to the 12th century.","It has been the primary residence of the Prince since 1938."]},"li-cult-gutenberg-castle":{"i":"/poi-images/li-cult-gutenberg-castle.webp","s":"This preserved medieval fortress stands on a seventy-meter high rock outcrop in Balzers and serves as a prominent cultural landmark today.","f":["The castle was originally built as a defensive structure in the 1200s.","It is one of two surviving castles in the country alongside Vaduz."]},"li-cult-kunstmuseum":{"i":"/poi-images/li-cult-kunstmuseum.webp","s":"The striking black cube in the heart of Vaduz displays an extensive collection of modern and contemporary art from international artists.","f":["The museum was completed by architects Morger & Degelo in 2000.","It focuses on three-dimensional artworks and large installations."]},"li-cult-landesmuseum":{"i":"/poi-images/li-cult-landesmuseum.webp","s":"This museum showcases the rich history and cultural heritage of Liechtenstein within a beautifully restored 15th-century building.","f":["The museum building dates back to 1438 and once housed a tavern.","It features 42 thematic rooms covering archaeology and folklore."]},"li-cult-red-house":{"i":"/poi-images/li-cult-red-house.webp","s":"The Red House is a historic late-medieval building in Vaduz, famous for its distinct red color and its location within a vineyard.","f":["The current structure dates primarily back to the year 1438.","It features a large wine press room and a stepped-gable tower."]},"li-cult-walser-museum":{"i":"/poi-images/li-cult-walser-museum.webp","s":"The Walser Museum in Triesenberg documents the unique history and culture of the Walser settlers who arrived in the 13th century.","f":["The museum opened in 1961 to preserve the local high-alpine heritage.","It includes a fully furnished 400-year-old traditional wooden house."]},"li-cult-st-florin":{"i":"/poi-images/li-cult-st-florin.webp","s":"St.","f":["Construction took place between 1869 and 1873 in Neo-Gothic style.","The architect, Friedrich von Schmidt, also designed Vienna City Hall."]},"li-cult-stamp-museum":{"i":"/poi-images/li-cult-stamp-museum.webp","s":"The Postage Stamp Museum displays the evolution of Liechtenstein's famous stamp designs and the history of its postal service.","f":["Established in 1930, it is a section of the National Museum.","Admission to the museum has traditionally been free of charge."]},"li-cult-treasure-chamber":{"i":"/poi-images/li-cult-treasure-chamber.webp","s":"The Treasure Chamber exhibits precious items from the Princely Collections, including royal regalia and unique Fabergé eggs.","f":["The museum opened in 2015 to showcase the Prince's private treasures.","It features the Apple Blossom Egg, a masterpiece by Carl Fabergé."]},"li-cult-parliament":{"i":"/poi-images/li-cult-parliament.webp","s":"The modern Parliament Building in Vaduz is a striking architectural landmark constructed with over a million yellow bricks.","f":["Opened in 2008, it houses the sessions of the 25 Landtag members.","Approximately 1.1 million bricks were used for the entire complex."]},"li-cult-old-rhine-bridge":{"i":"/poi-images/li-cult-old-rhine-bridge.webp","s":"The historic covered wooden bridge spans the Rhine River, serving as a scenic pedestrian link between Liechtenstein and Switzerland.","f":["The bridge is 135 meters long and built entirely of timber.","Construction was finished in 1901 using locally sourced wood."]},"li-poi-triesen-marienkapelle":{"i":"/poi-images/li-poi-triesen-marienkapelle.webp","s":"One of the oldest sacred buildings in the country with a beautiful view.","f":["Built around 9th century","Romanesque style"]},"li-poi-schaan-st-peter":{"i":"/poi-images/li-poi-schaan-st-peter.webp","s":"The oldest church in Liechtenstein, built on Roman foundations.","f":["Late antique origins","Roman excavations"]},"li-poi-eschen-pfruendhaus":{"i":"/poi-images/li-poi-eschen-pfruendhaus.webp","s":"A historic building that now serves as a cultural center and museum.","f":["Medieval core","Cultural events"]},"li-poi-schellenberg-obere-burg":{"i":"/poi-images/li-poi-schellenberg-obere-burg.webp","s":"The larger of the two castle ruins in Schellenberg, freely accessible to visitors.","f":["Built around 1200","Largest ruins in the country"]},"li-poi-schellenberg-untere-burg":{"i":"/poi-images/li-poi-schellenberg-untere-burg.webp","s":"A smaller but historically significant castle ruin on the northern slope of the Eschnerberg.","f":["Built around 1250","Minor wall remains"]},"li-nat-grauspitz":{"i":"/poi-images/li-nat-grauspitz.webp","s":"Grauspitz is the highest mountain in the Principality of Liechtenstein, reaching an elevation of 2,599 meters on the Swiss border.","f":["At 2,599 meters, it is the highest point of the entire country.","The mountain features two distinct peaks: Vorder and Hinter Grauspitz."]},"li-nat-naafkopf":{"i":"/poi-images/li-nat-naafkopf.webp","s":"Naafkopf is a significant border mountain where the national boundaries of Liechtenstein, Austria, and Switzerland converge.","f":["The summit reaches 2,570 meters and marks a triple international border.","It belongs to the Rätikon mountain group in the Central Eastern Alps."]},"li-nat-falknis":{"i":"/poi-images/li-nat-falknis.webp","s":"Falknis is a striking mountain peak in southwestern Liechtenstein, offering spectacular panoramic views of the Rhine Valley.","f":["The summit stands at an elevation of 2,562 meters above sea level.","It forms part of the international border between Liechtenstein and Switzerland."]},"li-nat-drei-schwestern":{"i":"/poi-images/li-nat-drei-schwestern.webp","s":"The Drei Schwestern (Three Sisters) is a prominent mountain ridge in the Rätikon range, forming a natural border with Austria.","f":["The highest peak of the trio reaches an elevation of 2,053 meters.","A famous local legend claims the rocks are three sisters turned to stone."]},"li-nat-sareiserjoch":{"i":"/poi-images/li-nat-sareiserjoch.webp","s":"Sareiserjoch is a scenic mountain pass above Malbun, serving as a gateway to numerous high-altitude trails in the Rätikon range.","f":["The pass is situated at an elevation of 1,991 meters above sea level.","A chairlift carries visitors from Malbun directly to the summit station."]},"li-nat-samina":{"i":"/poi-images/li-nat-samina.webp","s":"The Samina is the second longest river in Liechtenstein, flowing through the rugged and uninhabited Samina Valley towards Austria.","f":["The river flows for 17 kilometers before joining the Ill in Austria.","The Samina Valley is largely undeveloped and covered by dense forest."]},"li-nat-rhine":{"i":"/poi-images/li-nat-rhine.webp","s":"The Alpine Rhine forms the entire western border of Liechtenstein with Switzerland and defines the geography of the valley.","f":["The section of the Rhine bordering Liechtenstein is 27 kilometers long.","Flood protection embankments were extensively built in the 1800s."]},"li-nat-steg-reservoir":{"i":"/poi-images/li-nat-steg-reservoir.webp","s":"The Steg Reservoir, also known as Gänglesee, is a picturesque artificial lake used for hydroelectric power and recreation.","f":["The lake is located at an altitude of approximately 1,300 meters.","It provides water for the Samina hydroelectric power station downstream."]},"li-poi-planken-gafadura":{"i":"/poi-images/li-poi-planken-gafadura.webp","s":"A managed alpine hut at 1428m altitude, popular among hikers.","f":["Owned by the Alpine Club","Former hunting lodge"]},"li-poi-mauren-birka":{"i":"/poi-images/li-poi-mauren-birka.webp","s":"A beautiful nature reserve and park for bird lovers in Mauren.","f":["Rare bird species","Nature trail"]},"li-poi-gamprin-grossabunt":{"i":"/poi-images/li-poi-gamprin-grossabunt.webp","s":"The only swimming lake in Liechtenstein with ecological water treatment.","f":["Solar heated","No chlorine"]},"city-muehleholz-extra":{"i":"/poi-images/city-muehleholz-extra.webp","s":"A northern district of Vaduz that directly borders Schaan and is known for its educational centers.","f":["Directly borders the neighboring municipality of Schaan.","Home to the Liechtenstein Gymnasium."]},"city-ebenholz-extra":{"i":"/poi-images/city-ebenholz-extra.webp","s":"A quiet residential area above the center of Vaduz, offering a wide view over the Rhine Valley.","f":["Located on the hillside below Vaduz Castle.","Surrounded by vineyards and forests."]},"city-bartlegrosch-extra":{"i":"/poi-images/city-bartlegrosch-extra.webp","s":"A historical group of settlements in the heart of Vaduz, where traditional architecture has been preserved.","f":["One of the oldest inhabited parts of the capital.","Contains several listed half-timbered houses."]},"city-mitteldorf-extra":{"i":"/poi-images/city-mitteldorf-extra.webp","s":"A charming old town district of Vaduz with cobbled streets and the famous Red House.","f":["The Red House dates from the late Middle Ages.","The district is lined with numerous grapevines."]},"city-haberfeld-extra":{"i":"/poi-images/city-haberfeld-extra.webp","s":"A modern business and residential quarter in Vaduz that has developed strongly in recent decades.","f":["Houses various international financial institutions.","Features modern architecture and green spaces."]},"city-letten-vaduz-extra":{"i":"/poi-images/city-letten-vaduz-extra.webp","s":"A residential area in southern Vaduz, near the Rhine and surrounded by agricultural land.","f":["Located in the Rhine plain and is very flat.","Popular with cyclists due to its proximity to the Rhine dam."]},"city-quadratscha-extra":{"i":"/poi-images/city-quadratscha-extra.webp","s":"A quiet and green district in the south of Vaduz, known for its single-family homes and gardens.","f":["The name has Romance origins.","Offers direct access to the hiking trails towards Triesen."]},"city-spoerry-extra":{"i":"/poi-images/city-spoerry-extra.webp","s":"A former industrial area in Vaduz that is today a center for culture and university facilities.","f":["The area formerly belonged to a textile factory.","Parts of the University of Liechtenstein are housed here."]},"city-au-vaduz-extra":{"i":"/poi-images/city-au-vaduz-extra.webp","s":"Au is a tranquil and green residential district of Vaduz, extending along the banks of the Rhine in the northwestern part of the capital."},"city-dux-extra":{"i":"/poi-images/city-dux-extra.webp","s":"A recreation area and residential neighborhood above Schaan, bordering directly on the edge of the forest.","f":["Known for the Dux Chapel, a small pilgrimage church.","Starting point for many hikes to the Three Sisters massif."]},"city-forst-schaan-extra":{"i":"/poi-images/city-forst-schaan-extra.webp","s":"A western suburb of Schaan that features a mix of residential development and commercial areas.","f":["A large industrial area is located nearby.","Transport links to Switzerland are excellent."]},"city-specki-extra":{"i":"/poi-images/city-specki-extra.webp","s":"A densely populated district in the center of Schaan with many shopping facilities and restaurants.","f":["Considered the commercial heart of the municipality.","The Schaan train station is just a short walk away."]},"city-iradug-schaan-extra":{"i":"/poi-images/city-iradug-schaan-extra.webp","s":"A quiet quarter in Schaan, consisting mostly of traditional single-family homes.","f":["The name has old Rhaeto-Romanic roots.","The district has a very low traffic density."]},"city-rossfeld-extra":{"i":"/poi-images/city-rossfeld-extra.webp","s":"An area in the Schaan plain where sports facilities and leisure centers are located.","f":["Home to several local sports clubs.","Offers wide open spaces for outdoor activities."]},"city-riet-schaan-extra":{"i":"/poi-images/city-riet-schaan-extra.webp","s":"An agricultural wetland in Schaan that is important for nature conservation.","f":["The Riet is an important habitat for endangered bird species.","A network of canals drains the area."]},"city-birkahof-extra":{"i":"/poi-images/city-birkahof-extra.webp","s":"A small residential area surrounded by nature in the northern part of Schaan.","f":["Known for its old tree population.","Located near the border with the municipality of Eschen."]},"city-bardella-extra":{"i":"/poi-images/city-bardella-extra.webp","s":"Bardella is a small but fine hamlet belonging to the municipality of Mauren in Liechtenstein's Unterland (Lower Country)."},"city-matschils-extra":{"i":"/poi-images/city-matschils-extra.webp","s":"A picturesque district of Triesen, nestled against the steep slopes of the Falknis massif.","f":["Offers spectacular views of the Swiss Alps.","One of the sunniest neighborhoods in the municipality."]},"city-meierhof-extra":{"i":"/poi-images/city-meierhof-extra.webp","s":"A historical area in Triesen where agricultural estates of the nobility stood.","f":["The name indicates a former monastic estate.","Today a sought-after residential location."]},"city-poska-extra":{"i":"/poi-images/city-poska-extra.webp","s":"A densely wooded hillside area above the village center of Triesen.","f":["Serves as an important protection forest against rockfalls.","Popular for short nature walks."]},"city-maschlina-extra":{"i":"/poi-images/city-maschlina-extra.webp","s":"A residential neighborhood in Triesen that stands out for its family-friendly infrastructure.","f":["Has several playgrounds and kindergartens.","Located on a slope with views of the Rhine Valley."]},"city-sand-triesen-extra":{"i":"/poi-images/city-sand-triesen-extra.webp","s":"A commercial area on the outskirts of Triesen, near the main road that runs through the country.","f":["An important economic location for the municipality of Triesen.","Houses various artisan businesses."]},"city-gartnetsch-extra":{"i":"/poi-images/city-gartnetsch-extra.webp","s":"A quiet quarter in Triesen, characterized by traditional Liechtenstein architecture.","f":["Some old farmhouses have been elaborately restored here.","Located above the main traffic axis."]},"city-saega-extra":{"i":"/poi-images/city-saega-extra.webp","s":"The area around the old sawmill in Triesen, which today features modern residential buildings.","f":["The name derives from a historical wood saw.","A small mountain stream flows through it."]},"city-berschis-extra":{"i":"/poi-images/city-berschis-extra.webp","s":"A northern quarter in Triesen that touches the municipal border of Vaduz.","f":["Offers a mix of residential and small commercial areas.","Very good bus connections to the capital."]},"city-maels-extra":{"i":"/poi-images/city-maels-extra.webp","s":"The western part of the municipality of Balzers, which is closely linked to Gutenberg Castle.","f":["Balzers and Mäls together form the southernmost municipality of Liechtenstein.","Mäls has preserved its own rural character."]},"city-gutenberg-area-extra":{"i":"/poi-images/city-gutenberg-area-extra.webp","s":"The residential area at the foot of the Gutenberg castle hill in Balzers, surrounded by vineyards.","f":["The houses here enjoy an excellent view of the Rhine Valley.","The castle hill is a protected archaeological area."]},"city-stpeter-balzers-extra":{"i":"/poi-images/city-stpeter-balzers-extra.webp","s":"A historic quarter in Balzers near the old St.","f":["The chapel dates partly from the 15th century.","The district is located directly on the old trade a.webp","s":"A quiet holiday and alpine area high above Triesenberg, which is particularly attractive for families.","f":["The area is only accessible via a narrow mountain road.","Traditional wooden houses characterize the landscape."]},"city-masescha-extra":{"i":"/poi-images/city-masescha-extra.webp","s":"A hamlet on the mountain slope, historically founded by the Walsers as the first settlement in Liechtenstein.","f":["Houses the historic Chapel of St. Theodul.","Popular viewpoint overlooking Vaduz."]},"city-rotenboden-extra":{"i":"/poi-images/city-rotenboden-extra.webp","s":"A centrally located district of Triesenberg with good infrastructure and sweeping valley views.","f":["The name literally means 'red soil'.","An important residential area in the Walser municipality."]},"city-wangerberg-extra":{"i":"/poi-images/city-wangerberg-extra.webp","s":"A widely scattered hamlet south of the village center of Triesenberg on steep slopes.","f":["The farms are typical of Walser architecture.","Borders Triesen to the south."]},"city-steinort-extra":{"i":"/poi-images/city-steinort-extra.webp","s":"A rocky and quiet residential area that belongs to Triesenberg and is surrounded by nature.","f":["Offers numerous hiking trails right on the doorstep.","The avalanche defenses above are clearly visible."]},"city-rizlina-extra":{"i":"/poi-images/city-rizlina-extra.webp","s":"A small mountain hamlet on the way to the Samina valley, known for its remoteness.","f":["Often becomes a silent snow paradise in winter.","The surrounding area is heavily forested."]},"city-suecka-extra":{"i":"/poi-images/city-suecka-extra.webp","s":"An alpine settlement on the mountain ridge before the Steg tunnel, housing an inn.","f":["Popular resting place for mountain bikers and hikers.","Formerly an important crossing into the Samina valley."]},"city-guflina-extra":{"i":"/poi-images/city-guflina-extra.webp","s":"A characteristic hillside settlement of Triesenberg, whose houses seem to stick to the rock.","f":["The narrow streets require skill when driving.","Offers undisturbed sunsets in the Rhine Valley."]},"city-lavadina-extra":{"i":"/poi-images/city-lavadina-extra.webp","s":"A small, hidden hamlet in Triesenberg that exudes deep peace and tradition.","f":["Some farms still date from the 19th century.","Very low population."]},"city-nendeln-extra":{"i":"/poi-images/city-nendeln-extra.webp","s":"A busy village in the municipality of Eschen, located on the main traffic axis through the Liechtenstein lowlands.","f":["Has its own train station on the Feldkirch-Buchs line.","Houses a traditional ceramics manufactory (Schädler)."]},"city-schoenbuehl-extra":{"i":"/poi-images/city-schoenbuehl-extra.webp","s":"A quiet, elevated residential area in Eschen, offering a beautiful view over the lowlands.","f":["Considered one of the preferred residential locations in Eschen.","The architecture is modern and family-friendly."]},"city-bochs-eschen-extra":{"i":"/poi-images/city-bochs-eschen-extra.webp","s":"A historic quarter in the center of Eschen, near the parish church of St.","f":["The district was the old village core of Eschen.","The narrow streets reflect the historical village structure."]},"city-rofenberg-extra":{"i":"/poi-images/city-rofenberg-extra.webp","s":"A gentle hilly landscape in Eschen, where agriculture and modern villas coexist.","f":["Known for the small Rofenberg Chapel.","Offers extensive paths for walks in the greenery."]},"city-bruehl-eschen-extra":{"i":"/poi-images/city-bruehl-eschen-extra.webp","s":"Brühl is a district of Eschen whose name suggests a damp meadow or marshy area."},"city-eichen-extra":{"i":"/poi-images/city-eichen-extra.webp","s":"Eichen is a small but charming district on the outskirts of Eschen."},"city-haldengass-extra":{"i":"/poi-images/city-haldengass-extra.webp","s":"A steep but idyllic residential neighborhood in Eschen, located on the slopes of the Eschnerberg.","f":["Offers a quiet location with no through traffic.","The hillside location requires retaining walls and terraces."]},"city-presta-extra":{"i":"/poi-images/city-presta-extra.webp","s":"The Presta-Areal in Eschen is the vibrant economic heart of the municipality and a significant industrial site in Liechtenstein's Unterland."},"city-schaanwald-extra":{"i":"/poi-images/city-schaanwald-extra.webp","s":"A village in the municipality of Mauren, located right on the Austrian border.","f":["Location of the most important border crossing to Feldkirch (Austria).","Became economically important through the expansion of the customs road."]},"city-auf-berg-extra":{"i":"/poi-images/city-auf-berg-extra.webp","s":"The locality 'Auf Berg' (On the Hill) in the municipality of Mauren is a picturesque, slightly elevated residential area distinguished by its quiet atmosphere and proximity to nature."},"city-binza-extra":{"i":"/poi-images/city-binza-extra.webp","s":"Binza is a small, quiet hamlet belonging to the municipality of Mauren in the heart of Liechtenstein's Unterland."},"city-freiendorf-extra":{"i":"/poi-images/city-freiendorf-extra.webp","s":"Freiendorf is a district of Mauren, located in the eastern part of the municipality on the border with Schaanwald and thus with Austria."},"city-maurerberg-extra":{"i":"/poi-images/city-maurerberg-extra.webp","s":"A picturesque forest and meadow area on the northern edge of Mauren.","f":["A popular area for long walks.","Many benches offer views over the lowlands."]},"city-weiherring-extra":{"i":"/poi-images/city-weiherring-extra.webp","s":"A modern leisure facility and a residential area in the east of Mauren.","f":["The eponymous Weiherring Park is a meeting place for all generations.","Features playgrounds and sports fields."]},"city-fallsgass-extra":{"i":"/poi-images/city-fallsgass-extra.webp","s":"Fallsgass is a characteristic lane in the historic village centre of Mauren."},"city-gaensbach-extra":{"i":"/poi-images/city-gaensbach-extra.webp","s":"Gänsbach is a small, idyllic residential area ra.webp","s":"Holz is a small, secluded hamlet belonging to the municipality of Planken, Liechtenstein's smallest and highest-altitude community."},"city-nuella-planken-extra":{"i":"/poi-images/city-nuella-planken-extra.webp","s":"Nülla is a characteristic hamlet in the municipality of Planken, embodying the essence of alpine life in Liechtenstein."},"city-gsperr-extra":{"i":"/poi-images/city-gsperr-extra.webp","s":"Gsperr is a small, inconspicuous district of the Eschen-Nendeln municipality, consisting mainly of a commercial area and a few residential houses."},"city-ruettistein-extra":{"i":"/poi-images/city-ruettistein-extra.webp","s":"Rüttistein is a small but distinctive part of Planken, likely named after a prominent nearby rock formation."},"city-hinterschellenberg-extra":{"i":"/poi-images/city-hinterschellenberg-extra.webp","s":"Hinterschellenberg is a historic district in the north of the municipality of Schellenberg, near the Austrian border."},"city-vorderschellenberg-extra":{"i":"/poi-images/city-vorderschellenberg-extra.webp","s":"Vorderschellenberg is one of the main residential cores of the Schellenberg municipality, embodying the quiet, upscale lifestyle of Liechtenstein's 'Unterland' (lowlands)."},"city-stgeorg-schellenberg-extra":{"i":"/poi-images/city-stgeorg-schellenberg-extra.webp","s":"St."},"city-biedermann-extra":{"i":"/poi-images/city-biedermann-extra.webp","s":"The district around the Biedermann House, the oldest preserved wooden house in Liechtenstein in Schellenberg.","f":["The Biedermann House dates from the early 16th century.","Today it serves as a museum for rural living."]},"city-mittelschellenberg-extra":{"i":"/poi-images/city-mittelschellenberg-extra.webp","s":"The center of the municipality of Schellenberg with the municipal administration and modern facilities.","f":["The striking modern parish church is located here.","The village center is situated on a gentle mountain ridge."]},"city-gantenstein-extra":{"i":"/poi-images/city-ga ing high Rhine floods.","Home to many amphibian species."]},"city-halden-gamprin-extra":{"i":"/poi-images/city-halden-gamprin-extra.webp","s":"Halden is a small, quiet hamlet within the municipality of Gamprin in the Liechtenstein lowlands."},"city-salums-extra":{"i":"/poi-images/city-salums-extra.webp","s":"Salums is a tiny, secluded hamlet belonging to the municipality of Gamprin in the Liechtenstein lowlands."},"city-hasenacker-extra":{"i":"/poi-images/city-hasenacker-extra.webp","s":"Hasenacker is a small residential district in the municipality of Gamprin, characterized by its quiet and nature-oriented location."},"city-lutzfeld-extra":{"i":"/poi-images/city-lutzfeld-extra.webp","s":"Lutzfeld is a small, peaceful part of the Gamprin municipality, located in the heart of the Liechtenstein lowlands."},"city-oberau-gamprin-extra":{"i":"/poi-images/city-oberau-gamprin-extra.webp","s":"Oberau is a charming and quiet part of the Gamprin municipality, idyllically located in the Liechtenstein lowlands."},"city-badael-extra":{"i":"/poi-images/city-badael-extra.webp","s":"A small, hidden residential area on the hillside above Gamprin with lots of privacy.","f":["Accessible only via a dead-end street.","Located very close to the forest."]},"city-oberbuehl-extra":{"i":"/poi-images/city-oberbuehl-extra.webp","s":"A hillside settlement in the upper part of Gamprin, characterized by an excellent vantage point.","f":["Very quiet residential area on the edge of the forest.","One of the highest streets in Gamprin."]},"city-neufeld-gamprin-extra":{"i":"/poi-images/city-neufeld-gamprin-extra.webp","s":"A newly developed, modern residential neighborhood in the heart of the Gamprin municipality.","f":["The neighborhood was designed especially for young families.","Characterized by sustainable construction methods."]},"historical-vaduz-englaenderbau-extra":{"i":"/poi-images/historical-vaduz-englaenderbau-extra.webp","s":"The Engländerbau (English Building) in the centre of Vaduz is a   // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
