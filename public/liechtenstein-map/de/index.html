const POI_CARD={"liechtenstein-ochsenkopf-relief-v2":{"i":"/poi-images/liechtenstein-ochsenkopf-relief-v2.webp","s":"Der Ochsenkopf ist ein markanter Berg in der Liechtensteiner Alpenregion.","f":["Teil der Rätikon-Kette","Alpines Gelände"]},"liechtenstein-nospitz-relief-v2":{"i":"/poi-images/liechtenstein-nospitz-relief-v2.webp","s":"Der Nospitz ist ein markanter Gipfel nahe Malbun im Liechtensteiner Oberland.","f":["Nähe Malbun","Exponierte Lage"]},"li-cult-vaduz-castle":{"i":"/poi-images/li-cult-vaduz-castle.webp","s":"Schloss Vaduz ist der offizielle Wohnsitz des Fürstenhauses und thront als majestätisches Wahrzeichen auf einer Terrasse hoch über der Hauptstadt.","f":["Teile des Bergfrieds stammen vermutlich aus dem 12. Jahrhundert.","Seit 1938 dient das Schloss als ständiger Wohnsitz des Fürsten."]},"li-cult-gutenberg-castle":{"i":"/poi-images/li-cult-gutenberg-castle.webp","s":"Diese markante mittelalterliche Festung thront auf einem siebzig Meter hohen Felshügel über der Gemeinde Balzers im Süden Liechtensteins.","f":["Die Burg wurde im 13. Jahrhundert als Gralsburg errichtet.","Der Burghügel war bereits in der Jungsteinzeit besiedelt."]},"li-cult-kunstmuseum":{"i":"/poi-images/li-cult-kunstmuseum.webp","s":"Der markante schwarze Kubus im Zentrum von Vaduz beherbergt die staatliche Sammlung moderner und zeitgenössischer Kunst aus aller Welt.","f":["Das Gebäude wurde im Jahr 2000 feierlich eröffnet.","Die Architekten Morger, Degelo und Kerez entwarfen den Bau."]},"li-cult-landesmuseum":{"i":"/poi-images/li-cult-landesmuseum.webp","s":"Das Landesmuseum präsentiert die Geschichte, Kultur und Naturkunde des Fürstentums in einem historischen Gebäude aus dem 15.","f":["Das Hauptgebäude diente früher als herrschaftliches Gasthaus.","Die Sammlung umfasst über 3000 Exponate in 42 Ausstellungsräumen."]},"li-cult-red-house":{"i":"/poi-images/li-cult-red-house.webp","s":"Das Rote Haus mit seinem markanten Treppengiebel ist ein spätmittelalterliches Wohngebäude und ein Wahrzeichen des Vaduzer Mitteldorfs.","f":["Das Gebäude stammt ursprünglich aus dem 15. Jahrhundert.","Seit 1848 befindet sich das Haus im Besitz der Familie Rheinberger."]},"li-cult-walser-museum":{"i":"/poi-images/li-cult-walser-museum.webp","s":"Das Walsermuseum in Triesenberg dokumentiert die einzigartige Geschichte und Kultur der im 13.","f":["Das Museum wurde 1961 im alten Gemeindehaus eröffnet.","Ein 400 Jahre altes Walserhaus gehört zum Museumskomplex."]},"li-cult-st-florin":{"i":"/poi-images/li-cult-st-florin.webp","s":"Die neugotische Kathedrale St.","f":["Die Kirche wurde zwischen 1869 und 1873 errichtet.","Friedrich von Schmidt entwarf auch das Wiener Rathaus."]},"li-cult-stamp-museum":{"i":"/poi-images/li-cult-stamp-museum.webp","s":"Das Postmuseum zeigt die faszinierende Geschichte der liechtensteinischen Philatelie und Postgeschichte seit dem frühen 20.","f":["Das Museum wurde bereits im Jahr 1930 gegründet.","Der Eintritt in das Museum ist für alle Besucher kostenlos."]},"li-cult-treasure-chamber":{"i":"/poi-images/li-cult-treasure-chamber.webp","s":"Die Schatzkammer Liechtenstein präsentiert kostbare Exponate aus der fürstlichen Sammlung, darunter Prunkwaffen und wertvolle Fabergé-Eier.","f":["Die Schatzkammer wurde im Jahr 2015 neu eröffnet.","Ein Highlight ist das 'Apfelblüten-Ei' von Peter Carl Fabergé."]},"li-cult-parliament":{"i":"/poi-images/li-cult-parliament.webp","s":"Das moderne Landtagsgebäude am Peter-Kaiser-Platz besticht durch seine markante Architektur aus hellem Backstein und Glas.","f":["Das Gebäude wurde im Jahr 2008 nach Plänen von Hansjörg Göritz eröffnet.","Für die Fassade wurden rund eine Million Klinkersteine verwendet."]},"li-cult-old-rhine-bridge":{"i":"/poi-images/li-cult-old-rhine-bridge.webp","s":"Diese historische gedeckte Holzbrücke verbindet seit über hundert Jahren die liechtensteinische Hauptstadt Vaduz mit der Gemeinde Sevelen.","f":["Die Brücke hat eine Gesamtlänge von genau 135 Metern.","Sie wurde im Jahr 1901 erbaut und 2010 umfassend saniert."]},"li-poi-triesen-marienkapelle":{"i":"/poi-images/li-poi-triesen-marienkapelle.webp","s":"Eine der ältesten Sakralbauten des Landes mit wunderschöner Aussicht.","f":["Baujahr ca. 9. Jahrhundert","Romanischer Stil"]},"li-poi-schaan-st-peter":{"i":"/poi-images/li-poi-schaan-st-peter.webp","s":"Die älteste Kirche Liechtensteins, erbaut auf römischen Fundamenten.","f":["Spätantike Ursprünge","Römische Ausgrabungen"]},"li-poi-eschen-pfruendhaus":{"i":"/poi-images/li-poi-eschen-pfruendhaus.webp","s":"Ein historisches Gebäude, das heute als Kulturzentrum und Museum dient.","f":["Mittelalterlicher Kern","Kulturelle Veranstaltungen"]},"li-poi-schellenberg-obere-burg":{"i":"/poi-images/li-poi-schellenberg-obere-burg.webp","s":"Die größeren der beiden Burgruinen in Schellenberg, frei zugänglich für Besucher.","f":["Erbaut um 1200","Größte Ruine im Land"]},"li-poi-schellenberg-untere-burg":{"i":"/poi-images/li-poi-schellenberg-untere-burg.webp","s":"Eine kleinere, aber historisch bedeutende Burgruine am Nordhang des Eschnerbergs.","f":["Erbaut um 1250","Geringere Mauerreste"]},"li-nat-grauspitz":{"i":"/poi-images/li-nat-grauspitz.webp","s":"Der Grauspitz ist mit einer Höhe von 2599 Metern der höchste Berg des Fürstentums Liechtenstein an der Grenze zur Schweiz.","f":["Der Berg hat zwei Gipfel: den Vorder- und den Hintergrauspitz.","Es führt kein offiziell markierter Wanderweg direkt auf den Gipfel."]},"li-nat-naafkopf":{"i":"/poi-images/li-nat-naafkopf.webp","s":"Der Naafkopf ist ein markanter Grenzberg, an dem die Staatsgrenzen von Liechtenstein, Österreich und der Schweiz aufeinandertreffen.","f":["Der Gipfel liegt auf einer Höhe von 2570 Metern über Meer.","Er ist ein beliebtes Ziel für Bergsteiger in der Region Malbun."]},"li-nat-falknis":{"i":"/poi-images/li-nat-falknis.webp","s":"Der Falknis ist ein markanter Berggipfel im Südwesten Liechtensteins, der einen spektakulären Ausblick auf das Rheintal bietet.","f":["Der Gipfel liegt auf einer Höhe von 2562 Metern über Meer.","Er markiert den Grenzpunkt zwischen Liechtenstein und der Schweiz."]},"li-nat-drei-schwestern":{"i":"/poi-images/li-nat-drei-schwestern.webp","s":"Die Drei Schwestern sind eine markante Gebirgskette im Rätikon, die die natürliche Grenze zwischen Liechtenstein und Österreich bildet.","f":["Der höchste der drei Gipfel erreicht eine Höhe von 2053 Metern.","Eine bekannte Sage erzählt von drei versteinerten Schwestern."]},"li-nat-sareiserjoch":{"i":"/poi-images/li-nat-sareiserjoch.webp","s":"Das Sareiserjoch ist ein alpiner Gebirgspass oberhalb von Malbun, der als Ausgangspunkt für zahlreiche Wanderungen im Rätikon dient.","f":["Der Pass liegt auf einer Höhe von 1991 Metern über Meer.","Eine Sesselbahn befördert Gäste direkt von Malbun auf das Joch."]},"li-nat-samina":{"i":"/poi-images/li-nat-samina.webp","s":"Die Samina ist der zweitlängste Fluss Liechtensteins und fließt durch das wildromantische, unbewohnte Saminatal Richtung Norden.","f":["Der Fluss hat eine Gesamtlänge von etwa 17 Kilometern.","Die Samina mündet im österreichischen Frastanz in die Ill."]},"li-nat-rhine":{"i":"/poi-images/li-nat-rhine.webp","s":"Der Alpenrhein bildet die gesamte westliche Grenze Liechtensteins zur Schweiz und prägt das Landschaftsbild des weiten Tals.","f":["Der liechtensteinische Abschnitt des Rheins ist 27 Kilometer lang.","Hohe Dämme schützen das Land seit dem 19. Jahrhundert vor Fluten."]},"li-nat-steg-reservoir":{"i":"/poi-images/li-nat-steg-reservoir.webp","s":"Der Stausee Steg, auch Gänglesee genannt, ist ein idyllisches Gewässer im Saminatal, das zur Stromerzeugung und als Naherholungsgebiet dient.","f":["Der See liegt auf einer Höhe von rund 1300 Metern über Meer.","Das Wasser wird zur Energieerzeugung in das Kraftwerk Samina geleitet."]},"li-poi-planken-gafadura":{"i":"/poi-images/li-poi-planken-gafadura.webp","s":"Eine bewirtschaftete Alpenvereinshütte auf 1428 m Höhe, beliebt bei Wanderern.","f":["Eigentum des Alpenvereins","Ehemaliges Jagdschloss"]},"li-poi-mauren-birka":{"i":"/poi-images/li-poi-mauren-birka.webp","s":"Ein wunderschönes Naturschutzgebiet und Park für Vogelliebhaber in Mauren.","f":["Seltene Vogelarten","Naturlehrpfad"]},"li-poi-gamprin-grossabunt":{"i":"/poi-images/li-poi-gamprin-grossabunt.webp","s":"Der einzige Badesee Liechtensteins mit ökologischer Wasseraufbereitung.","f":["Solarbeheizt","Kein Chlor"]},"city-muehleholz-extra":{"i":"/poi-images/city-muehleholz-extra.webp","s":"Ein nördliches Stadtviertel von Vaduz, das direkt an Schaan grenzt und für seine Bildungszentren bekannt ist.","f":["Grenzt direkt an die Nachbargemeinde Schaan.","Heimat des Liechtensteinischen Gymnasiums."]},"city-ebenholz-extra":{"i":"/poi-images/city-ebenholz-extra.webp","s":"Ein ruhiges Wohngebiet oberhalb des Zentrums von Vaduz, das einen weiten Blick über das Rheintal bietet.","f":["Befindet sich am Hang unterhalb des Schlosses Vaduz.","Ist von Weinbergen und Wäldern umgeben."]},"city-bartlegrosch-extra":{"i":"/poi-images/city-bartlegrosch-extra.webp","s":"Eine historische Siedlungsgruppe im Herzen von Vaduz, in der sich traditionelle Architektur erhalten hat.","f":["Gehört zu den ältesten bewohnten Teilen der Hauptstadt.","Enthält mehrere denkmalgeschützte Fachwerkhäuser."]},"city-mitteldorf-extra":{"i":"/poi-images/city-mitteldorf-extra.webp","s":"Ein charmantes Altstadtviertel von Vaduz mit gepflasterten Gassen und dem berühmten Roten Haus.","f":["Das Rote Haus stammt aus dem Spätmittelalter.","Das Viertel ist von zahlreichen Weinreben gesäumt."]},"city-haberfeld-extra":{"i":"/poi-images/city-haberfeld-extra.webp","s":"Ein modernes Geschäfts- und Wohnquartier in Vaduz, das sich in den letzten Jahrzehnten stark entwickelt hat.","f":["Beherbergt verschiedene internationale Finanzinstitute.","Verfügt über moderne Architektur und Grünanlagen."]},"city-letten-vaduz-extra":{"i":"/poi-images/city-letten-vaduz-extra.webp","s":"Eine Wohngegend im südlichen Vaduz, nahe dem Rhein und umgeben von landwirtschaftlichen Nutzflächen.","f":["Liegt in der Rheinebene und ist sehr flach.","Beliebt bei Radfahrern durch die Nähe zum Rheindamm."]},"city-quadratscha-extra":{"i":"/poi-images/city-quadratscha-extra.webp","s":"Ein ruhiger und grüner Stadtteil im Süden von Vaduz, der für seine Einfamilienhäuser und Gärten bekannt ist.","f":["Der Name hat romanische Ursprünge.","Bietet direkten Zugang zu den Wanderwegen in Richtung Triesen."]},"city-spoerry-extra":{"i":"/poi-images/city-spoerry-extra.webp","s":"Ein ehemaliges Industriegebiet in Vaduz, das heute ein Zentrum für Kultur und Universitätseinrichtungen ist.","f":["Das Areal gehörte früher einer Textilfabrik.","Teile der Universität Liechtenstein sind hier untergebracht."]},"city-au-vaduz-extra":{"i":"/poi-images/city-au-vaduz-extra.webp","s":"Au ist ein ruhiger und grüner Ortsteil von Vaduz, der sich im nordwestlichen Teil der Hauptstadt entlang des Rheinufers erstreckt."},"city-dux-extra":{"i":"/poi-images/city-dux-extra.webp","s":"Ein Erholungsgebiet und Wohnviertel oberhalb von Schaan, das direkt an den Waldrand grenzt.","f":["Bekannt für die Duxkapelle, eine kleine Wallfahrtskirche.","Startpunkt für viele Wanderungen auf das Drei-Schwestern-Massiv."]},"city-forst-schaan-extra":{"i":"/poi-images/city-forst-schaan-extra.webp","s":"Ein westlicher Vorort von Schaan, der eine Mischung aus Wohnbebauung und Gewerbeflächen aufweist.","f":["In der Nähe befindet sich ein großes Industriegebiet.","Die Verkehrsanbindung in die Schweiz ist ausgezeichnet."]},"city-specki-extra":{"i":"/poi-images/city-specki-extra.webp","s":"Ein dicht besiedeltes Viertel im Zentrum von Schaan mit vielen Einkaufsmöglichkeiten und Restaurants.","f":["Gilt als das kommerzielle Herz der Gemeinde.","Der Schaaner Bahnhof ist nur einen kurzen Spaziergang entfernt."]},"city-iradug-schaan-extra":{"i":"/poi-images/city-iradug-schaan-extra.webp","s":"Ein ruhiges Quartier in Schaan, das überwiegend aus traditionellen Einfamilienhäusern besteht.","f":["Der Name hat alte rätoromanische Wurzeln.","Das Viertel hat eine sehr niedrige Verkehrsdichte."]},"city-rossfeld-extra":{"i":"/poi-images/city-rossfeld-extra.webp","s":"Ein Gebiet in der Ebene von Schaan, in dem sich Sportanlagen und Freizeiteinrichtungen befinden.","f":["Heimat mehrerer lokaler Sportvereine.","Bietet weite offene Flächen für Outdoor-Aktivitäten."]},"city-riet-schaan-extra":{"i":"/poi-images/city-riet-schaan-extra.webp","s":"Ein landwirtschaftlich genutztes Feuchtgebiet in Schaan, das für den Naturschutz wichtig ist.","f":["Das Riet ist ein wichtiger Lebensraum für bedrohte Vogelarten.","Ein Netz von Kanälen entwässert das Gebiet."]},"city-birkahof-extra":{"i":"/poi-images/city-birkahof-extra.webp","s":"Eine kleine, von Natur umgebene Wohnsiedlung im nördlichen Teil von Schaan.","f":["Bekannt für seinen alten Baumbestand.","Liegt nahe der Grenze zur Gemeinde Eschen."]},"city-bardella-extra":{"i":"/poi-images/city-bardella-extra.webp","s":"Bardella ist ein kleiner, aber feiner Weiler, der zur Gemeinde Mauren im Liechtensteiner Unterland gehört."},"city-matschils-extra":{"i":"/poi-images/city-matschils-extra.webp","s":"Ein malerischer Ortsteil von Triesen, der sich an die steilen Hänge des Falknis-Massivs schmiegt.","f":["Bietet eine spektakuläre Aussicht auf die Schweizer Alpen.","Eines der sonnigsten Viertel der Gemeinde."]},"city-meierhof-extra":{"i":"/poi-images/city-meierhof-extra.webp","s":"Ein historischer Bereich in Triesen, in dem landwirtschaftliche Güter des Adels standen.","f":["Der Name deutet auf einen ehemaligen klösterlichen Gutshof hin.","Heute eine gefragte Wohnlage."]},"city-poska-extra":{"i":"/poi-images/city-poska-extra.webp","s":"Ein dicht bewaldeter Hangbereich oberhalb des Dorfzentrums von Triesen.","f":["Dient als wichtiger Schutzwald gegen Steinschlag.","Beliebt für kurze Naturspaziergänge."]},"city-maschlina-extra":{"i":"/poi-images/city-maschlina-extra.webp","s":"Ein Wohnviertel in Triesen, das sich durch seine familienfreundliche Infrastruktur auszeichnet.","f":["Verfügt über mehrere Spielplätze und Kindergärten.","Befindet sich in Hanglage mit Rheintalblick."]},"city-sand-triesen-extra":{"i":"/poi-images/city-sand-triesen-extra.webp","s":"Ein Gewerbegebiet am Rande von Triesen, nahe der Hauptstraße, die durch das Land führt.","f":["Wichtiger Wirtschaftsstandort der Gemeinde Triesen.","Beherbergt verschiedene Handwerksbetriebe."]},"city-gartnetsch-extra":{"i":"/poi-images/city-gartnetsch-extra.webp","s":"Ein ruhiges Quartier in Triesen, geprägt von traditioneller liechtensteinischer Architektur.","f":["Einige alte Bauernhäuser wurden hier aufwendig restauriert.","Liegt oberhalb der Hauptverkehrsachse."]},"city-saega-extra":{"i":"/poi-images/city-saega-extra.webp","s":"Das Gebiet um die alte Sägemühle in Triesen, das heute moderne Wohnbauten aufweist.","f":["Der Name leitet sich von einer historischen Holzsäge ab.","Wird von einem kleinen Gebirgsbach durchflossen."]},"city-berschis-extra":{"i":"/poi-images/city-berschis-extra.webp","s":"Ein nördliches Quartier in Triesen, das an die Gemeindegrenze von Vaduz stößt.","f":["Bietet eine Mischung aus Wohn- und kleinen Gewerbeflächen.","Sehr gute Busverbindungen in die Hauptstadt."]},"city-maels-extra":{"i":"/poi-images/city-maels-extra.webp","s":"Der westliche Ortsteil der Gemeinde Balzers, der eng mit der Burg Gutenberg verbunden ist.","f":["Balzers und Mäls bilden zusammen die südlichste Gemeinde Liechtensteins.","Mäls hat einen eigenen, dörflichen Charakter bewahrt."]},"city-gutenberg-area-extra":{"i":"/poi-images/city-gutenberg-area-extra.webp","s":"Das Wohngebiet am Fuße des Burghügels von Gutenberg in Balzers, umgeben von Weinbergen.","f":["Die Häuser hier genießen eine hervorragende Aussicht auf das Rheintal.","Der Burghügel ist ein geschütztes archäologisches Gebiet."]},"city-stpeter-balzers-extra":{"i":"/poi-images/city-stpeter-balzers-extra.webp","s":"Ein historisches Viertel in Balzers nahe der alten St.","f":["Die Kapelle stammt teilweise aus dem 15. Jahrhundert.","Das Viertel liegt direkt am alten Handelsweg."]},"city-palduz-extra":{"i":"/poi-images/city-palduz-extra.webp","s":"Ein modernes Wohngebiet im östlichen Balzers, das sich in den Hang einbettet.","f":["Bietet eine ruhige Atmosphäre fernab der Durchgangsstraßen.","Beliebt bei jungen Familien."]},"city-junkerau-extra":{"i":"/poi-images/city-junkerau-extra.webp","s":"Eine Auenlandschaft und ein Wohngebiet im südöstlichen Teil von Balzers nahe der Schweizer Grenze.","f":["Der Name verweist auf früheren adligen Grundbesitz.","Ein beliebtes Gebiet für Reitsport und Spaziergänge."]},"city-hoefle-balzers-extra":{"i":"/poi-images/city-hoefle-balzers-extra.webp","s":"Ein zentral gelegenes Viertel in Balzers, das alte Gehöfte und moderne Infrastruktur vereint.","f":["Das Gemeindezentrum und Schulen sind leicht erreichbar.","Spiegelt die bauliche Entwicklung des Dorfes wider."]},"city-unterm-schloss-extra":{"i":"/poi-images/city-unterm-schloss-extra.webp","s":"Ein direkt an den Felsen von Gutenberg angrenzendes Viertel, das eine besondere historische Atmosphäre ausstrahlt.","f":["Die Häuser schmiegen sich eng an den steilen Fels.","Die Gassen sind hier besonders schmal und verwinkelt."]},"city-malbun-extra":{"i":"/poi-images/city-malbun-extra.webp","s":"Das einzige Skiresort und wichtigste Wintersportgebiet Liechtensteins, gelegen in einem hochalpinen Tal.","f":["Das Tal ist auf 1600 Metern Höhe gelegen.","Beliebtes Ziel für Wanderer im Sommer."]},"city-steg-extra":{"i":"/poi-images/city-steg-extra.webp","s":"Ein malerisches Bergdorf und Erholungsgebiet, das durch einen Tunnel von Triesenberg aus erreichbar ist.","f":["Verfügt über einen idyllischen Stausee, den Gänglesee.","Die traditionellen Hütten werden 'Maiensässe' genannt."]},"city-gaflei-extra":{"i":"/poi-images/city-gaflei-extra.webp","s":"Einer der höchstgelegenen besiedelten Orte Liechtensteins, bekannt für das ehemalige Kurhaus.","f":["Startpunkt des berühmten Fürstensteig-Wanderwegs.","Bietet spektakuläre Panoramablicke über das Rheintal."]},"city-silum-extra":{"i":"/poi-images/city-silum-extra.webp","s":"Ein ruhiges Ferien- und Alpgebiet hoch über Triesenberg, das besonders für Familien attraktiv ist.","f":["Das Gebiet ist nur über eine schmale Bergstraße erreichbar.","Traditionelle Holzhäuser prägen das Landschaftsbild."]},"city-masescha-extra":{"i":"/poi-images/city-masescha-extra.webp","s":"Ein Weiler am Berghang, der historisch von den Walsern als erste Siedlung in Liechtenstein gegründet wurde.","f":["Beherbergt die historische Kapelle St. Theodul.","Beliebter Aussichtspunkt mit Blick auf Vaduz."]},"city-rotenboden-extra":{"i":"/poi-images/city-rotenboden-extra.webp","s":"Ein zentral gelegener Ortsteil von Triesenberg mit einer guten Infrastruktur und weitem Talblick.","f":["Der Name bedeutet wörtlich 'roter Boden'.","Ein wichtiges Wohngebiet in der Walsergemeinde."]},"city-wangerberg-extra":{"i":"/poi-images/city-wangerberg-extra.webp","s":"Ein weit verstreuter Weiler südlich des Dorfzentrums von Triesenberg an steilen Hängen.","f":["Die Bauernhöfe sind typisch für die Walser Bauweise.","Grenzt im Süden an Triesen."]},"city-steinort-extra":{"i":"/poi-images/city-steinort-extra.webp","s":"Ein felsiger und ruhiger Wohnbereich, der zu Triesenberg gehört und von Natur umgeben ist.","f":["Bietet zahlreiche Wanderwege direkt vor der Haustür.","Die Lawinenverbauungen oberhalb sind gut sichtbar."]},"city-rizlina-extra":{"i":"/poi-images/city-rizlina-extra.webp","s":"Ein kleiner Bergweiler auf dem Weg ins Saminatal, bekannt für seine Abgeschiedenheit.","f":["Wird im Winter oft zu einem stillen Schnee-Paradies.","Die Umgebung ist stark bewaldet."]},"city-suecka-extra":{"i":"/poi-images/city-suecka-extra.webp","s":"Eine Alpsiedlung auf dem Bergrücken vor dem Steg-Tunnel, die einen Gasthof beherbergt.","f":["Beliebter Rastplatz für Mountainbiker und Wanderer.","Früher ein wichtiger Übergang ins Saminatal."]},"city-guflina-extra":{"i":"/poi-images/city-guflina-extra.webp","s":"Eine charakteristische Hangsiedlung von Triesenberg, deren Häuser scheinbar am Fels kleben.","f":["Die schmalen Straßen erfordern Geschick beim Fahren.","Bietet ungestörte Sonnenuntergänge im Rheintal."]},"city-lavadina-extra":{"i":"/poi-images/city-lavadina-extra.webp","s":"Ein kleiner, versteckter Weiler in Triesenberg, der eine tiefe Ruhe und Tradition ausstrahlt.","f":["Einige Höfe stammen noch aus dem 19. Jahrhundert.","Sehr geringe Einwohnerzahl."]},"city-nendeln-extra":{"i":"/poi-images/city-nendeln-extra.webp","s":"Ein geschäftiges Dorf in der Gemeinde Eschen, das an der Hauptverkehrsachse durchs Liechtensteiner Unterland liegt.","f":["Hat einen eigenen Bahnhof an der Strecke Feldkirch-Buchs.","Beherbergt eine traditionelle Keramikmanufaktur (Schädler)."]},"city-schoenbuehl-extra":{"i":"/poi-images/city-schoenbuehl-extra.webp","s":"Eine ruhige, erhöhte Wohnsiedlung in Eschen, die einen schönen Blick über das Unterland bietet.","f":["Gilt als eine der bevorzugten Wohnlagen in Eschen.","Die Architektur ist modern und familienfreundlich."]},"city-bochs-eschen-extra":{"i":"/poi-images/city-bochs-eschen-extra.webp","s":"Ein historisches Quartier im Zentrum von Eschen, nahe der Pfarrkirche St.","f":["Das Viertel war der alte Dorfkern von Eschen.","Die schmalen Straßen spiegeln die historische Dorfstruktur wider."]},"city-rofenberg-extra":{"i":"/poi-images/city-rofenberg-extra.webp","s":"Eine sanfte Hügellandschaft in Eschen, auf der Landwirtschaft und moderne Villen nebeneinander existieren.","f":["Bekannt für die kleine Rofenbergkapelle.","Bietet ausgedehnte Wege für Spaziergänge im Grünen."]},"city-bruehl-eschen-extra":{"i":"/poi-images/city-bruehl-eschen-extra.webp","s":"Brühl ist ein Ortsteil von Eschen, dessen Name auf eine feuchte Wiese oder ein Sumpfgebiet hindeutet."},"city-eichen-extra":{"i":"/poi-images/city-eichen-extra.webp","s":"Eichen ist ein kleiner, aber feiner Ortsteil am Rande von Eschen."},"city-haldengass-extra":{"i":"/poi-images/city-haldengass-extra.webp","s":"Ein steiles, aber idyllisches Wohnquartier in Eschen, das an den Hängen des Eschnerbergs liegt.","f":["Bietet eine ruhige Lage ohne Durchgangsverkehr.","Die Hanglage erfordert Stützmauern und Terrassen."]},"city-presta-extra":{"i":"/poi-images/city-presta-extra.webp","s":"Das Presta-Areal in Eschen ist das pulsierende wirtschaftliche Herz der Gemeinde und ein bedeutender Industriestandort im Liechtensteiner Unterland."},"city-schaanwald-extra":{"i":"/poi-images/city-schaanwald-extra.webp","s":"Ein Dorf in der Gemeinde Mauren, direkt an der österreichischen Grenze gelegen.","f":["Standort des wichtigsten Grenzübergangs nach Feldkirch (Österreich).","Wurde durch den Ausbau der Zollstraße wirtschaftlich wichtig."]},"city-auf-berg-extra":{"i":"/poi-images/city-auf-berg-extra.webp","s":"Der Ortsteil „Auf Berg“ in der Gemeinde Mauren ist eine malerische, leicht erhöhte Wohnlage, die sich durch ihre ruhige Atmosphäre und die Nähe zur Natur auszeichnet."},"city-binza-extra":{"i":"/poi-images/city-binza-extra.webp","s":"Binza ist ein kleiner, ruhiger Weiler, der zur Gemeinde Mauren im Herzen des Liechtensteiner Unterlandes gehört."},"city-freiendorf-extra":{"i":"/poi-images/city-freiendorf-extra.webp","s":"Freiendorf ist ein Ortsteil von Mauren, der im östlichen Teil der Gemeinde an der Grenze zu Schaanwald und somit zu Österreich liegt."},"city-maurerberg-extra":{"i":"/poi-images/city-maurerberg-extra.webp","s":"Ein malerisches Wald- und Wiesengebiet am nördlichen Rand von Mauren.","f":["Ein beliebtes Gebiet für ausgedehnte Spaziergänge.","Viele Bänke bieten Ausblicke über das Unterland."]},"city-weiherring-extra":{"i":"/poi-images/city-weiherring-extra.webp","s":"Eine moderne Freizeitanlage und ein Wohngebiet im Osten von Mauren.","f":["Der namensgebende Weiherring-Park ist ein Treffpunkt für alle Generationen.","Verfügt über Spiel- und Sportplätze."]},"city-fallsgass-extra":{"i":"/poi-images/city-fallsgass-extra.webp","s":"Die Fallsgass ist eine charakteristische Gasse im historischen Dorfkern von Mauren."},"city-gaensbach-extra":{"i":"/poi-images/city-gaensbach-extra.webp","s":"Gänsbach ist eine kleine, idyllische Wohngegend innerhalb der Gemeinde Mauren im Liechtensteiner Unterland."},"city-jonaboden-extra":{"i":"/poi-images/city-jonaboden-extra.webp","s":"Eine ruhige Hangsiedlung von Triesenberg, eingebettet in grüne Wiesen und Wälder.","f":["Gilt als Geheimtipp für Naturfreunde.","Liegt abseits der großen Verkehrswege nach Malbun."]},"city-hinter-prufatscheng-extra":{"i":"/poi-images/city-hinter-prufatscheng-extra.webp","s":"Hinter-Prufatscheng ist eine hochgelegene Alpsiedlung in der Gemeinde Triesenberg und verkörpert die Essenz der alpinen Abgeschiedenheit."},"city-samina-extra":{"i":"/poi-images/city-samina-extra.webp","s":"Ein abgelegenes, wildromantisches Gebirgstal im Osten Liechtensteins, unberührt und ursprünglich.","f":["Der Fluss Samina durchschneidet das Tal in Richtung Österreich.","Eine der unzugänglichsten Regionen des Landes."]},"city-saroja-extra":{"i":"/poi-images/city-saroja-extra.webp","s":"Der Weiler Saroja in der Gemeinde Planken ist untrennbar mit dem gleichnamigen Sarojasattel verbunden und dient als wichtiger Orientierungspunkt für Bergsteiger und Wanderer."},"city-gafadura-extra":{"i":"/poi-images/city-gafadura-extra.webp","s":"Gafadura ist kein traditionelles Dorf, sondern vielmehr ein Alpgebiet und der Standort der berühmten Gafadurahütte auf 1428 Metern Höhe oberhalb von Nendeln und Planken."},"city-ruetti-planken-extra":{"i":"/poi-images/city-ruetti-planken-extra.webp","s":"Der Name „Rütti“ deutet auf eine Rodung hin, und genau das ist dieser Weiler in Planken: eine Oase der Ruhe in einer Lichtung, umgeben von dichten Wäldern."},"city-wes-planken-extra":{"i":"/poi-images/city-wes-planken-extra.webp","s":"Wes ist ein kleiner, hochgelegener Weiler in der Gemeinde Planken, der für seine aussergewöhnliche Aussicht und seine sonnige Lage bekannt ist."},"city-schuetz-planken-extra":{"i":"/poi-images/city-schuetz-planken-extra.webp","s":"Schütz ist ein weiterer idyllischer Weiler, der zur sonnenverwöhnten Gemeinde Planken gehört."},"city-holz-planken-extra":{"i":"/poi-images/city-holz-planken-extra.webp","s":"Holz ist ein kleiner, abgeschiedener Weiler, der zur Gemeinde Planken gehört, der kleinsten und höchstgelegenen Gemeinde Liechtensteins."},"city-nuella-planken-extra":{"i":"/poi-images/city-nuella-planken-extra.webp","s":"Nülla ist ein charakteristischer Weiler in der Gemeinde Planken, der die Essenz des alpinen Lebens in Liechtenstein verkörpert."},"city-gsperr-extra":{"i":"/poi-images/city-gsperr-extra.webp","s":"Gsperr ist ein kleiner, unauffälliger Ortsteil der Gemeinde Eschen-Nendeln, der hauptsächlich aus einem Gewerbegebiet und einigen wenigen Wohnhäusern besteht."},"city-ruettistein-extra":{"i":"/poi-images/city-ruettistein-extra.webp","s":"Rüttistein ist ein kleiner, aber markanter Ortsteil von Planken, der seinen Namen wahrscheinlich von einer auffälligen Felsformation in der Nähe hat."},"city-hinterschellenberg-extra":{"i":"/poi-images/city-hinterschellenberg-extra.webp","s":"Hinterschellenberg ist ein geschichtsträchtiger Ortsteil im Norden der Gemeinde Schellenberg, nahe der österreichischen Grenze."},"city-vorderschellenberg-extra":{"i":"/poi-images/city-vorderschellenberg-extra.webp","s":"Vorderschellenberg ist einer der Hauptwohnkerne der Gemeinde Schellenberg und verkörpert den ruhigen, gehobenen Lebensstil im Liechtensteiner Unterland."},"city-stgeorg-schellenberg-extra":{"i":"/poi-images/city-stgeorg-schellenberg-extra.webp","s":"St."},"city-biedermann-extra":{"i":"/poi-images/city-biedermann-extra.webp","s":"Das Viertel um das Biedermannhaus, das älteste erhaltene Holzhaus Liechtensteins in Schellenberg.","f":["Das Biedermannhaus stammt aus dem frühen 16. Jahrhundert.","Es dient heute als Museum für bäuerliches Wohnen."]},"city-mittelschellenberg-extra":{"i":"/poi-images/city-mittelschellenberg-extra.webp","s":"Das Zentrum der Gemeinde Schellenberg mit der Gemeindeverwaltung und modernen Einrichtungen.","f":["Hier befindet sich die auffällige moderne Pfarrkirche.","Das Dorfzentrum liegt auf einem sanften Bergrücken."]},"city-gantenstein-extra":{"i":"/poi-images/city-gantenstein-extra.webp","s":"Ein bewaldeter Hügelbereich in Schellenberg, der sich bis zur österreichischen Grenze erstreckt.","f":["Bietet versteckte Pfade für Naturbeobachtungen.","War historisch ein wichtiger Verteidigungspunkt."]},"city-loch-schellenberg-extra":{"i":"/poi-images/city-loch-schellenberg-extra.webp","s":"Eine tiefergelegene kleine Senke auf dem Eschnerberg in Schellenberg.","f":["Das Mikroklima ist hier oft kühler als in der direkten Umgebung.","Wird landwirtschaftlich intensiv genutzt."]},"city-platta-extra":{"i":"/poi-images/city-platta-extra.webp","s":"Ein flaches Plateau-Gebiet in Schellenberg, ideal für landwirtschaftliche Betriebe und vereinzelte Wohnhäuser.","f":["Der Name deutet auf die flache Topographie hin.","Ein sonnenverwöhnter Ortsteil."]},"city-eichholz-extra":{"i":"/poi-images/city-eichholz-extra.webp","s":"Ein schattiges, ehemals von Eichen dominiertes Waldgebiet am Südhang von Schellenberg.","f":["Dient heute primär der Naherholung.","Bietet Schutz vor Erosion an den steilen Hängen."]},"city-limsenegg-extra":{"i":"/poi-images/city-limsenegg-extra.webp","s":"Ein erhöhtes Gebiet am nördlichen Ende Liechtensteins in der Gemeinde Ruggell.","f":["Ruggell ist eigentlich die flachste Gemeinde des Landes.","Bietet einen weiten Blick in die österreichische Ebene."]},"city-fofel-extra":{"i":"/poi-images/city-fofel-extra.webp","s":"Ein zentrales Wohnquartier in Ruggell, geprägt von weitläufigen Gärten und ruhigen Straßen.","f":["Das Gebiet hat in den letzten Jahren starken Zuwachs an jungen Familien erlebt.","Liegt nahe am Ruggeller Dorfzentrum."]},"city-oberweyer-extra":{"i":"/poi-images/city-oberweyer-extra.webp","s":"Ein historischer Ortsteil im östlichen Ruggell, nahe dem Anstieg zum Eschnerberg.","f":["Ehemaliges Feuchtgebiet, das teilweise trockengelegt wurde.","Beherbergt traditionelle Bauernhäuser."]},"city-unterweyer-extra":{"i":"/poi-images/city-unterweyer-extra.webp","s":"Ein durch moderne Wohn- und kleine Gewerbebauten geprägtes Gebiet nördlich von Oberweyer.","f":["Bietet eine sehr gute Anbindung an das Fahrradwegenetz.","Ein ruhiger und flacher Ortsteil."]},"city-nofels-grenze-extra":{"i":"/poi-images/city-nofels-grenze-extra.webp","s":"Das unmittelbare Grenzgebiet im Norden von Ruggell zum österreichischen Nofels.","f":["Ein kleiner, lokal genutzter Grenzübergang.","Das Gebiet ist dicht von Wäldern durchzogen."]},"city-bangserfeld-extra":{"i":"/poi-images/city-bangserfeld-extra.webp","s":"Ein weites, offenes Feldgebiet im Nordwesten von Ruggell, das landwirtschaftlich stark genutzt wird.","f":["Wichtiges Überwinterungsgebiet für Zugvögel.","Grenzt direkt an das Naturschutzgebiet Ruggeller Riet."]},"city-rheinau-ruggell-extra":{"i":"/poi-images/city-rheinau-ruggell-extra.webp","s":"Das Gebiet in Ruggell, das direkt am Rheindamm liegt und für Freizeitaktivitäten beliebt ist.","f":["Der Rheindamm bietet hier perfekte Bedingungen für Inlineskater.","Hier befindet sich das Dreiländereck (CH, AT, LI) in der Nähe."]},"city-ruggeller-riet-extra":{"i":"/poi-images/city-ruggeller-riet-extra.webp","s":"Das Ruggeller Riet ist kein Dorf, sondern das grösste und bedeutendste Naturschutzgebiet Liechtensteins, eine weitläufige Torfmoorlandschaft im Norden der Gemeinde Ruggell."},"city-bendern-extra":{"i":"/poi-images/city-bendern-extra.webp","s":"Bendern, ein historisches Herzstück der Gemeinde Gamprin im Liechtensteiner Unterland, ist weit mehr als nur ein malerisches Dorf am Fusse des Eschnerbergs."},"city-grossabuent-extra":{"i":"/poi-images/city-grossabuent-extra.webp","s":"Die Freizeitanlage Grossabünt in Gamprin ist ein modernes Juwel im Liechtensteiner Unterland und ein beliebtes Ziel für Einheimische und Besucher."},"city-kratzera-extra":{"i":"/poi-images/city-kratzera-extra.webp","s":"Kratzera ist eine kleine, beschauliche Siedlung in der Gemeinde Gamprin im Liechtensteiner Unterland."},"city-under-au-extra":{"i":"/poi-images/city-under-au-extra.webp","s":"Ein tiefer gelegener Bereich der Auenlandschaft in Gamprin, der oft feuchter und naturnäher ist.","f":["Dient bei starkem Rhein-Hochwasser als natürliches Rückhaltebecken.","Heimat vieler Amphibienarten."]},"city-halden-gamprin-extra":{"i":"/poi-images/city-halden-gamprin-extra.webp","s":"Halden ist ein kleiner, ruhiger Weiler innerhalb der Gemeinde Gamprin im Liechtensteiner Unterland."},"city-salums-extra":{"i":"/poi-images/city-salums-extra.webp","s":"Salums ist ein winziger, abgeschiedener Weiler, der zur Gemeinde Gamprin im Liechtensteiner Unterland gehört."},"city-hasenacker-extra":{"i":"/poi-images/city-hasenacker-extra.webp","s":"Hasenacker ist ein kleiner Wohnbezirk in der Gemeinde Gamprin, der sich durch seine ruhige und naturnahe Lage auszeichnet."},"city-lutzfeld-extra":{"i":"/poi-images/city-lutzfeld-extra.webp","s":"Lutzfeld ist ein kleiner, friedlicher Ortsteil der Gemeinde Gamprin, gelegen im Herzen des Liechtensteiner Unterlandes."},"city-oberau-gamprin-extra":{"i":"/poi-images/city-oberau-gamprin-extra.webp","s":"Oberau ist ein charmanter und ruhiger Ortsteil der Gemeinde Gamprin, idyllisch gelegen im Liechtensteiner Unterland."},"city-badael-extra":{"i":"/poi-images/city-badael-extra.webp","s":"Ein kleiner, versteckter Wohnort am Hang oberhalb von Gamprin mit viel Privatsphäre.","f":["Nur über eine Stichstraße erreichbar.","Liegt in unmittelbarer Waldnähe."]},"city-oberbuehl-extra":{"i":"/poi-images/city-oberbuehl-extra.webp","s":"Eine Hangsiedlung im oberen Teil von Gamprin, geprägt durch eine exzellente Aussichtslage.","f":["Sehr ruhige Wohnlage am Waldrand.","Eine der höchstgelegenen Straßen in Gamprin."]},"city-neufeld-gamprin-extra":{"i":"/poi-images/city-neufeld-gamprin-extra.webp","s":"Ein neu erschlossenes, modernes Wohnquartier im Herzen der Gemeinde Gamprin.","f":["Das Quartier wurde speziell für junge Familien konzipiert.","Zeichnet sich durch nachhaltige Bauweise aus."]},"historical-vaduz-englaenderbau-extra":{"i":"/poi-images/historical-vaduz-englaenderbau-extra.webp","s":"Der Engländerbau im Zentrum von Vaduz ist ein Schlüsselgebäude der liechtensteinischen Kunst- und Kulturszene."},"historical-vaduz-regierungsgebaeude-extra":{"i":"/poi-images/historical-vaduz-regierungsgebaeude-extra.webp","s":"Das Regierungsgebäude am Peter-Kaiser-Platz in Vaduz ist das prachtvolle Herz der Exekutive des Fürstentums Liechtenstein."},"historical-vaduz-rathaus-extra":{"i":"/poi-images/historical-vaduz-rathaus-extra.webp","s":"Das Rathaus von Vaduz, gelegen im Herzen des Städtles, ist ein markantes architektonisches Wahrzeichen und der politische Mittelpunkt der Hauptstadtgemeinde."},"historical-vaduz-schlossle-extra":{"i":"/poi-images/historical-vaduz-schlossle-extra.webp","s":"Das Schlössle in Vaduz ist ein historisches Anwesen mit reicher Geschichte.","f":["Historische Bedeutung in der Region.","Ein wichtiger Teil des kulturellen Erbes."]},"historical-vaduz-schalun-extra":{"i":"/poi-images/historical-vaduz-schalun-extra.webp","s":"Hoch über Vaduz, auf einem bewaldeten Felsvorsprung, thront die Ruine Schalun, vom Volksmund auch liebevoll „Wildschloss“ genannt."},"historical-balzers-alter-pfarrhof-extra":{"i":"/poi-images/historical-balzers-alter-pfarrhof-extra.webp","s":"Der Alte Pfarrhof in Balzers ist ein bedeutendes Kulturdenkmal der Gemeinde.","f":["Historische Bedeutung in der Region.","Ein wichtiger Teil des kulturellen Erbes."]},"historical-balzers-mariahilf-extra":{"i":"/poi-images/historical-balzers-mariahilf-extra.webp","s":"Die Wallfahrtskapelle Mariahilf in Balzers thront malerisch auf einem kleinen Hügel und bietet einen weiten Blick über das Rheintal bis zu den Schweizer Bergen."},"landmark-balzers-rheinbruecke-extra":{"i":"/poi-images/landmark-balzers-rheinbruecke-extr n-19-extra":{"i":"/poi-images/landscape-gamprin-19-extra.webp","s":"Ein kleiner alpiner See in Gamprin.","f":["Entstanden durch Rheinhochwasser","Einziges natürliches Seelein"]},"landscape-schellenberg-20-extra":{"i":"/poi-images/landscape-schellenberg-20-extra.webp","s":"Ein wunderschöner Aussichtspunkt in den Bergen bei Schellenberg mit Panoramablick.","f":["Höchster Punkt am Schellenberg","Blick auf zwei Länder"]},"landscape-planken-21-extra":{"i":"/poi-images/landscape-planken-21-extra.webp","s":"Ein ruhiger Wald in der Nähe von Planken.","f":["Steiles Waldgelände am Drei-Schwestern","Schutz für das Dorf Planken"]},"landscape-vaduz-22-extra":{"i":"/poi-images/landscape-vaduz-22-extra.webp","s":"Ein kleiner alpiner See in Vaduz.","f":["Entstanden durch Kiesabbau in den 1970er Jahren.","Teil des Naturschutzgebiets im Talboden."]},"landscape-schaan-23-extra":{"i":"/poi-images/landscape-schaan-23-extra.webp","s":"Ein wunderschöner Aussichtspunkt in den Bergen bei Schaan mit Panoramablick.","f":["Panorama über das Zentrum","Sicht auf Schloss Vaduz"]},"landscape-balzers-24-extra":{"i":"/poi-images/landscape-balzers-24-extra.webp","s":"Ein ruhiger Wald in der Nähe von Balzers.","f":["Teil der Liechtensteiner Wälder","Schutzwald gegen Lawinen"]},"landscape-triesen-25-extra":{"i":"/poi-images/landscape-triesen-25-extra.webp","s":"Ein kleiner alpiner See in Triesen.","f":["Künstlich angelegtes Biotop zur Artenförderung.","Umgeben von schilfbewachsenen Uferzonen."]},"landscape-eschen-26-extra":{"i":"/poi-images/landscape-eschen-26-extra.webp","s":"Ein wunderschöner Aussichtspunkt in den Bergen bei Eschen mit Panoramablick.","f":["Blick auf das Unterland","Höhepunkt im Eschener Gebiet"]},"landscape-mauren-27-extra":{"i":"/poi-images/landscape-mauren-27-extra.webp","s":"Ein ruhiger Wald in der Nähe von Mauren.","f":["Wald an der Grenze zu Österreich","Buchen- und Eschenbestände"]},"landscape-triesenberg-28-extra":{"i":"/poi-images/landscape-triesenberg-28-extra.webp","s":"Ein kleiner alpiner See in Triesenberg.","f":["Wird durch unterirdische Quellen gespeist.","Maximale Tiefe beträgt etwa drei Meter."]},"landscape-ruggell-29-extra":{"i":"/poi-images/landscape-ruggell-29-extra.webp","s":"Ein wunderschöner Aussichtspunkt in den Bergen bei Ruggell mit Panoramablick.","f":["Flacher Aussichtspunkt im Norden","Blick auf den Eschnerberg"]},"landscape-gamprin-30-extra":{"i":"/poi-images/landscape-gamprin-30-extra.webp","s":"Ein ruhiger Wald in der Nähe von Gamprin.","f":["Forst in der Nähe von Bendern","Mischwald aus Buche und Fichte"]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
