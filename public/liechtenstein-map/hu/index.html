const POI_CARD={"liechtenstein-ochsenkopf-relief-v2":{"i":"/poi-images/liechtenstein-ochsenkopf-relief-v2.webp","s":"Az Ochsenkopf a liechtensteini alpesi régió egyik jellegzetes hegye.","f":["A Rätikon-hegység része","Alpesi terep"]},"liechtenstein-nospitz-relief-v2":{"i":"/poi-images/liechtenstein-nospitz-relief-v2.webp","s":"A Nospitz egy jellegzetes csúcs a liechtensteini Oberlandban, Malbun közelében.","f":["Malbun közelében","Exponált fekvés"]},"li-cult-vaduz-castle":{"i":"/poi-images/li-cult-vaduz-castle.webp","s":"A vaduzi vár a fejedelmi család hivatalos lakóhelye, amely a város feletti domboldalon állva vigyázza a környék nyugalmát.","f":["A vár legrégebbi része a 12. századi öregtorony, falai 4 méter vastagok.","A fejedelmi család 1938 óta lakik életvitelszerűen a vár falai között."]},"li-cult-gutenberg-castle":{"i":"/poi-images/li-cult-gutenberg-castle.webp","s":"A Balzers felett magasodó sziklán álló erődítmény a fejedelemség egyik legépebben megmaradt vára, amely ma kulturális központként üzemel.","f":["A vár alapjai a 13. századból, a középkor virágkorából származnak.","A várudvar nyaranta népszerű szabadtéri színházi előadások helyszíne."]},"li-cult-kunstmuseum":{"i":"/poi-images/li-cult-kunstmuseum.webp","s":"A vaduzi városközpontban található minimalista fekete bazaltépület nemzetközi szintű kortárs művészeti kiállításoknak ad otthont.","f":["Az épület sötét falaiba csiszolt folyami kavicsokat kevertek a Rajnából.","A múzeum rendszeresen rendez időszaki tárlatokat a Hilti Art Foundationnel."]},"li-cult-landesmuseum":{"i":"/poi-images/li-cult-landesmuseum.webp","s":"A fejedelemség nemzeti múzeuma átfogó képet nyújt a régió történelméről, kultúrájáról és élővilágáról egy patinás vaduzi épületben.","f":["Az épület egykor a hercegi parlament és a bíróság székhelye is volt.","A múzeum állandó kiállítása a kőkorszaktól a modern korig tart."]},"li-cult-red-house":{"i":"/poi-images/li-cult-red-house.webp","s":"A vaduzi Mitteldorf negyedben álló Vörös Ház jellegzetes lépcsős ormával és mellette elterülő szőlőskertjével festői látványt nyújt.","f":["A ház melletti szőlőskertben ma is termelnek minőségi bort.","A 19. század közepén került a Rheinberger művészcsalád tulajdonába."]},"li-cult-walser-museum":{"i":"/poi-images/li-cult-walser-museum.webp","s":"A triesenbergi Walser Múzeum a 13.","f":["A múzeum egy 400 éves eredeti rönkházat is magában foglal.","A tárlat bemutatja a walser nyelvjárás sajátosságait és szavait."]},"li-cult-st-florin":{"i":"/poi-images/li-cult-st-florin.webp","s":"A Szent Florin-katedrális Vaduz neogótikus stílusú plébániatemploma, amely 1997 óta az érsekség székhelyeként szolgál.","f":["A templom építését Friedrich von Schmidt osztrák építész irányította.","A déli homlokzaton egy nagy rózsaablak díszíti az épületet."]},"li-cult-stamp-museum":{"i":"/poi-images/li-cult-stamp-museum.webp","s":"A vaduzi Postamúzeum a fejedelemség híres bélyegeinek gyűjteményét és a helyi postatörténet fejlődését mutatja be az érdeklődőknek.","f":["A múzeum 1930-ban nyílt meg, és a nemzeti múzeum része.","A belépés díjtalan, így a város egyik leglátogatottabb pontja."]},"li-cult-treasure-chamber":{"i":"/poi-images/li-cult-treasure-chamber.webp","s":"A Liechtensteini Kincstárban a fejedelmi család legértékesebb gyűjteményei, ékszerei és különleges műtárgyai tekinthetők meg Vaduzban.","f":["A múzeum a vaduzi kormányzati negyed Engländerbau épületében található.","A kiállítás fénypontja a fejedelmi süveg (korona) pontos másolata."]},"li-cult-parliament":{"i":"/poi-images/li-cult-parliament.webp","s":"A vaduzi kormányzati negyedben található modern parlamenti épület különleges sárga téglás borításával a demokrácia szimbóluma.","f":["Az épületet Hansjörg Göritz német építész tervezte meg.","A tető meredek formája a hagyományos építészeti elemeket idézi."]},"li-cult-old-rhine-bridge":{"i":"/poi-images/li-cult-old-rhine-bridge.webp","s":"A Vaduzt és a svájci Sevelent összekötő fedett fahíd a Rajna utolsó ilyen jellegű építménye ezen a folyószakaszon.","f":["A híd 1901-ben készült el, felváltva a korábbi kompátkelőt.","A tartószerkezet Howe-rendszerű rácsos tartókból épül fel."]},"li-poi-triesen-marienkapelle":{"i":"/poi-images/li-poi-triesen-marienkapelle.webp","s":"Az ország egyik legrégebbi szakrális építménye, gyönyörű kilátással.","f":["Kb. 9. századi építés","Román stílus"]},"li-poi-schaan-st-peter":{"i":"/poi-images/li-poi-schaan-st-peter.webp","s":"Liechtenstein legrégebbi temploma, római alapokra épült.","f":["Késő antik eredet","Római kori ásatások"]},"li-poi-eschen-pfruendhaus":{"i":"/poi-images/li-poi-eschen-pfruendhaus.webp","s":"Történelmi épület, amely ma kulturális központként és múzeumként szolgál.","f":["Középkori mag","Kulturális rendezvények"]},"li-poi-schellenberg-obere-burg":{"i":"/poi-images/li-poi-schellenberg-obere-burg.webp","s":"A két schellenbergi várrom közül a nagyobbik, szabadon látogatható.","f":["1200 körül épült","Az ország legnagyobb romvára"]},"li-poi-schellenberg-untere-burg":{"i":"/poi-images/li-poi-schellenberg-untere-burg.webp","s":"Kisebb, de történelmileg jelentős várrom az Eschnerberg északi lejtőjén.","f":["1250 körül épült","Kisebb falmaradványok"]},"li-nat-grauspitz":{"i":"/poi-images/li-nat-grauspitz.webp","s":"A Grauspitz Liechtenstein legmagasabb pontja, amely a svájci határon fekszik, és kihívást jelentő terepet kínál a hegymászóknak.","f":["A hegycsúcs pontos magassága 2599 méter a tengerszint felett.","Két különálló csúcsa van, melyek közül az elülső (Vorder) a magasabb."]},"li-nat-naafkopf":{"i":"/poi-images/li-nat-naafkopf.webp","s":"A Naafkopf egy különleges hegycsúcs, amely Liechtenstein, Ausztria és Svájc hármashatáránál emelkedik a magasba.","f":["A csúcs magassága 2570 méter, és három ország találkozási pontja.","A hegy lábánál található a népszerű Pfälzerhütte menedékház."]},"li-nat-falknis":{"i":"/poi-images/li-nat-falknis.webp","s":"A Falknis egy látványos hegycsúcs Liechtenstein délnyugati részén, amely népszerű célpont a tapasztalt túrázók körében.","f":["A hegycsúcs magassága 2562 méter, és a svájci határon fekszik.","A csúcsról belátható a Maienfeld környéki borvidék is."]},"li-nat-drei-schwestern":{"i":"/poi-images/li-nat-drei-schwestern.webp","s":"A Három Nővér sziklás csúcsai a Rätikon-hegység részét képezik, és látványos határvonalat alkotnak Liechtenstein és Ausztria között.","f":["A legmagasabb csúcs 2053 méterrel magasodik a tengerszint fölé.","A legenda szerint három lány kövült sziklává, mert vasárnap bogyót gyűjtöttek."]},"li-nat-sareiserjoch":{"i":"/poi-images/li-nat-sareiserjoch.webp","s":"A Sareiserjoch egy alpesi hágó Malbun felett, amely számos túraútvonal kiindulópontja és látványos kilátóhely a Rätikonban.","f":["A hágó 1991 méteres magasságban található a tenger felett.","Malbunból egy kényelmes libegő viszi fel a látogatókat a csúcsra."]},"li-nat-samina":{"i":"/poi-images/li-nat-samina.webp","s":"A Samina Liechtenstein második leghosszabb folyója, amely egy vadregényes, lakatlan völgyön keresztül folyik Ausztria felé.","f":["A folyó teljes hossza 17 kilométer, mielőtt az Ill folyóba torkollik.","A vízenergiát egy földalatti erőmű hasznosítja áramtermelésre."]},"li-nat-rhine":{"i":"/poi-images/li-nat-rhine.webp","s":"Az Alpesi Rajna alkotja Liechtenstein teljes nyugati határát Svájc felé, meghatározva a völgy arculatát és mezőgazdaságát.","f":["A folyó liechtensteini szakasza körülbelül 27 kilométer hosszú.","A part menti gátak tetején népszerű kerékpárutak találhatók."]},"li-nat-steg-reservoir":{"i":"/poi-images/li-nat-steg-reservoir.webp","s":"A Steg-víztározó, vagy más néven Gänglesee, egy mesterséges tó a Samina-völgyben, amely népszerű pihenőhely és fürdőhely.","f":["A tó 1300 méteres magasságban fekszik, hegyekkel körülvéve.","A vízparton kijelölt tűzrakó helyek várják a kirándulókat."]},"li-poi-planken-gafadura":{"i":"/poi-images/li-poi-planken-gafadura.webp","s":"Egy 1428 m magasságban fekvő, üzemeltetett alpesi menedékház, népszerű a túrázók körében.","f":["Az Alpesi Egyesület tulajdona","Egykori vadászkastély"]},"li-poi-mauren-birka":{"i":"/poi-images/li-poi-mauren-birka.webp","s":"Gyönyörű természetvédelmi terület és park a madárbarátok számára Maurenben.","f":["Ritka madárfajok","Tanösvény"]},"li-poi-gamprin-grossabunt":{"i":"/poi-images/li-poi-gamprin-grossabunt.webp","s":"Liechtenstein egyetlen fürdőtava ökológiai víztisztítással.","f":["Napenergiával fűtött","Klórmentes"]},"city-muehleholz-extra":{"i":"/poi-images/city-muehleholz-extra.webp","s":"Vaduz északi negyede, amely közvetlenül határos Schaan-nal, és oktatási központjairól ismert.","f":["Közvetlenül határos Schaan szomszédos községgel.","A Liechtensteini Gimnázium otthona."]},"city-ebenholz-extra":{"i":"/poi-images/city-ebenholz-extra.webp","s":"Csendes lakóövezet Vaduz központja felett, amely széles kilátást nyújt a Rajna-völgyre.","f":["A vaduzi kastély alatti hegyoldalban található.","Szőlőültetvények és erdők veszik körül."]},"city-bartlegrosch-extra":{"i":"/poi-images/city-bartlegrosch-extra.webp","s":"Történelmi településrész Vaduz szívében, ahol a hagyományos építészet a mai napig fennmaradt.","f":["A főváros egyik legrégebben lakott része.","Számos műemlékvédelem alatt álló favázas házzal rendelkezik."]},"city-mitteldorf-extra":{"i":"/poi-images/city-mitteldorf-extra.webp","s":"Vaduz bájos óvárosi negyede macskaköves utcákkal és a híres Piros Házzal.","f":["A Piros Ház a késő középkorból származik.","A negyedet számos szőlőtőke szegélyezi."]},"city-haberfeld-extra":{"i":"/poi-images/city-haberfeld-extra.webp","s":"Modern üzleti és lakónegyed Vaduzban, amely az elmúlt évtizedekben jelentősen fejlődött.","f":["Különböző nemzetközi pénzintézeteknek ad otthont.","Modern építészettel és zöldterületekkel rendelkezik."]},"city-letten-vaduz-extra":{"i":"/poi-images/city-letten-vaduz-extra.webp","s":"Lakóövezet Vaduz déli részén, a Rajna közelében, mezőgazdasági területekkel körülvéve.","f":["A Rajna-síkságon fekszik és nagyon sík.","Népszerű a kerékpárosok körében a Rajna-gát közelsége miatt."]},"city-quadratscha-extra":{"i":"/poi-images/city-quadratscha-extra.webp","s":"Csendes és zöld városrész Vaduz déli részén, amely családi házairól és kertjeiről ismert.","f":["A név újlatin eredetű.","Közvetlen hozzáférést biztosít a Triesen felé vezető túraútvonalakhoz."]},"city-spoerry-extra":{"i":"/poi-images/city-spoerry-extra.webp","s":"Egykori ipari terület Vaduzban, amely ma a kultúra és az egyetemi intézmények központja.","f":["A terület régen egy textilgyáré volt.","A Liechtensteini Egyetem egyes részei itt találhatók."]},"city-au-vaduz-extra":{"i":"/poi-images/city-au-vaduz-extra.webp","s":"Au egy csendes és zöldellő kerülete Vaduznak, a főváros északnyugati részén, közvetlenül a Rajna partján terül el."},"city-dux-extra":{"i":"/poi-images/city-dux-extra.webp","s":"Pihenőövezet és lakónegyed Schaan felett, amely közvetlenül az erdő szélével határos.","f":["A Dux-kápolnáról, egy kis zarándoktemplomról ismert.","Számos túra kiindulópontja a Három Nővér-hegység felé."]},"city-forst-schaan-extra":{"i":"/poi-images/city-forst-schaan-extra.webp","s":"Schaan nyugati külvárosa, amely a lakóépületek és a kereskedelmi területek keverékével rendelkezik.","f":["A közelben egy nagy ipari terület található.","A közlekedési kapcsolatok Svájc felé kiválóak."]},"city-specki-extra":{"i":"/poi-images/city-specki-extra.webp","s":"Sűrűn lakott negyed Schaan központjában, számos vásárlási lehetőséggel és étteremmel.","f":["A község kereskedelmi szívének tekintik.","A schaani vasútállomás csak egy rövid sétára található."]},"city-iradug-schaan-extra":{"i":"/poi-images/city-iradug-schaan-extra.webp","s":"Csendes negyed Schaanban, amely nagyrészt hagyományos családi házakból áll.","f":["A név régi rétoromán gyökerekkel rendelkezik.","A negyed nagyon alacsony forgalomsűrűséggel bír."]},"city-rossfeld-extra":{"i":"/poi-images/city-rossfeld-extra.webp","s":"A schaani síkságon található terület, ahol sportlétesítmények és szabadidős központok találhatók.","f":["Több helyi sportegyesület otthona.","Tágas, nyitott tereket kínál a szabadtéri tevékenységekhez."]},"city-riet-schaan-extra":{"i":"/poi-images/city-riet-schaan-extra.webp","s":"Mezőgazdasági célra használt vizes élőhely Schaanban, amely fontos a természetvédelem számára.","f":["A Riet fontos élőhely a veszélyeztetett madárfajok számára.","Egy csatornahálózat csapolja le a területet."]},"city-birkahof-extra":{"i":"/poi-images/city-birkahof-extra.webp","s":"Kicsi, természettel körülvett lakótelep Schaan északi részén.","f":["Idős fái miatt ismert.","Eschen község határának közelében fekszik."]},"city-bardella-extra":{"i":"/poi-images/city-bardella-extra.webp","s":"Bardella egy kicsi, de finom településrész, amely a liechtensteini Unterlandban található Mauren községhez tartozik."},"city-matschils-extra":{"i":"/poi-images/city-matschils-extra.webp","s":"Triesen festői része, amely a Falknis-hegység meredek lejtőibe simul.","f":["Látványos kilátást nyújt a svájci Alpokra.","A község egyik legnaposabb negyede."]},"city-meierhof-extra":{"i":"/poi-images/city-meierhof-extra.webp","s":"Triesen történelmi területe, ahol a nemesség mezőgazdasági birtokai álltak.","f":["A név egykori kolostori birtokra utal.","Ma keresett lakóövezet."]},"city-poska-extra":{"i":"/poi-images/city-poska-extra.webp","s":"Sűrűn erdősült hegyoldal Triesen faluközpontja felett.","f":["Fontos véderdőként szolgál a kőomlások ellen.","Népszerű a rövid természetjáró sétákhoz."]},"city-maschlina-extra":{"i":"/poi-images/city-maschlina-extra.webp","s":"Családbarát infrastruktúrájáról ismert lakónegyed Triesenben.","f":["Több játszótérrel és óvodával rendelkezik.","A hegyoldalban található, kilátással a Rajna-völgyre."]},"city-sand-triesen-extra":{"i":"/poi-images/city-sand-triesen-extra.webp","s":"Triesen szélén található kereskedelmi terület, közel az országon átvezető főúthoz.","f":["Triesen község fontos gazdasági központja.","Különféle kézműves vállalkozásoknak ad otthont."]},"city-gartnetsch-extra":{"i":"/poi-images/city-gartnetsch-extra.webp","s":"Csendes negyed Triesenben, amelyet a hagyományos liechtensteini építészet jellemez.","f":["Néhány régi parasztházat itt gondosan felújítottak.","A fő közlekedési tengely felett fekszik."]},"city-saega-extra":{"i":"/poi-images/city-saega-extra.webp","s":"A trieseni régi fűrészmalom körüli terület, ahol ma modern lakóépületek találhatók.","f":["A név egy történelmi fafűrészből származik.","Egy kis hegyi patak folyik át rajta."]},"city-berschis-extra":{"i":"/poi-images/city-berschis-extra.webp","s":"Északi negyed Triesenben, amely Vaduz községhatárával érintkezik.","f":["Lakó- és kis kereskedelmi területek keverékét kínálja.","Nagyon jó buszkapcsolatok a fővárosba."]},"city-maels-extra":{"i":"/poi-images/city-maels-extra.webp","s":"Balzers község nyugati része, amely szorosan kapcsolódik a Gutenberg-várhoz.","f":["Balzers és Mäls együttesen alkotják Liechtenstein legdélibb községét.","Mäls megőrizte sajátos, falusias jellegét."]},"city-gutenberg-area-extra":{"i":"/poi-images/city-gutenberg-area-extra.webp","s":"Lakóövezet a Gutenberg várhegy lábánál Balzersben, szőlőültetvényekkel körülvéve.","f":["Az itteni házakból kiváló kilátás nyílik a Rajna-völgyre.","A várhegy védett régészeti terület."]},"city-stpeter-balzers-extra":{"i":"/poi-images/city-stpeter-balzers-extra.webp","s":"Történelmi negyed Balzersben a régi Szent Péter-kápolna közelében, amelyet mezőgazdasági építmények jellemeznek.","f":["A kápolna részben a 15. századból származik.","A negyed közvetlenül a régi kereskedelmi útvonalon fekszik."]},"city-palduz-extra":{"i":"/poi-images/city-palduz-extra.webp","s":"Modern lakóövezet Kelet-Balzersben, amely beágyazódik a hegyoldalba.","f":["Csendes légkört kínál távol az átmenő útvonalaktól.","Népszerű a fiatal családok körében."]},"city-junkerau-extra":{"i":"/poi-images/city-junkerau-extra.webp","s":"Ártéri táj és lakóövezet Balzers délkeleti részén, a svájci határ közelében.","f":["A név egykori nemesi birtokra utal.","Népszerű terület lovagláshoz és sétákhoz."]},"city-hoefle-balzers-extra":{"i":"/poi-images/city-hoefle-balzers-extra.webp","s":"Központi elhelyezkedésű negyed Balzersben, amely régi tanyákat és modern infrastruktúrát ötvöz.","f":["A közösségi központ és az iskolák könnyen megközelíthetők.","Tükrözi a falu építészeti fejlődését."]},"city-unterm-schloss-extra":{"i":"/poi-images/city-unterm-schloss-extra.webp","s":"A Gutenberg-sziklákkal közvetlenül határos negyed, amely különleges történelmi hangulatot áraszt.","f":["A házak szorosan a meredek sziklához simulnak.","A sikátorok itt különösen szűkek és kanyargósak."]},"city-malbun-extra":{"i":"/poi-images/city-malbun-extra.webp","s":"Liechtenstein egyetlen síközpontja és legfontosabb téli sportterülete, amely egy magaslati völgyben fekszik.","f":["A völgy 1600 méteres magasságban fekszik.","Népszerű célpont a túrázók számára nyáron."]},"city-steg-extra":{"i":"/poi-images/city-steg-extra.webp","s":"Festői hegyi falu és üdülőterület, amely Triesenbergből egy alagúton keresztül közelíthető meg.","f":["Egy idilli víztározóval, a Gänglesee-vel büszkélkedhet.","A hagyományos kunyhókat 'Maiensässe'-nek hívják."]},"city-gaflei-extra":{"i":"/poi-images/city-gaflei-extra.webp","s":"Liechtenstein egyik legmagasabban fekvő lakott helye, amely az egykori szanatóriumról ismert.","f":["A híres Fürstensteig túraútvonal kiindulópontja.","Látványos panorámát nyújt a Rajna-völgyre."]},"city-silum-extra":{"i":"/poi-images/city-silum-extra.webp","s":"Csendes üdülő- és alpesi terület magasan Triesenberg felett, amely különösen a családok számára vonzó.","f":["A terület csak egy keskeny hegyi úton közelíthető meg.","A hagyományos faházak jellemzik a tájat."]},"city-masescha-extra":{"i":"/poi-images/city-masescha-extra.webp","s":"Hegyoldali falu, amelyet történelmileg a walserek alapítottak Liechtenstein első településeként.","f":["Itt található a történelmi St. Theodul kápolna.","Népszerű kilátó Vaduzra."]},"city-rotenboden-extra":{"i":"/poi-images/city-rotenboden-extra.webp","s":"Triesenberg központi elhelyezkedésű része, jó infrastruktúrával és széles völgykilátással.","f":["A név szó szerint 'piros talajt' jelent.","Fontos lakóövezet a walser községben."]},"city-wangerberg-extra":{"i":"/poi-images/city-wangerberg-extra.webp","s":"Triesenberg faluközpontjától délre, meredek lejtőkön szétszórtan fekvő falu.","f":["A tanyák a walser építészetre jellemzőek.","Délen Triesennel határos."]},"city-steinort-extra":{"i":"/poi-images/city-steinort-extra.webp","s":"Sziklás és csendes lakóövezet, amely Triesenberghez tartozik, és természet veszi körül.","f":["Számos túraútvonalat kínál közvetlenül az ajtó előtt.","A fenti lavinavédelmi építmények jól láthatóak."]},"city-rizlina-extra":{"i":"/poi-images/city-rizlina-extra.webp","s":"Kis hegyi falu a Samina-völgy felé vezető úton, amely elzártságáról ismert.","f":["Télen gyakran csendes hóparadicsommá válik.","A környék erősen erdős."]},"city-suecka-extra":{"i":"/poi-images/city-suecka-extra.webp","s":"Alpesi település a hegygerincen a Steg-alagút előtt, amely egy fogadónak is otthont ad.","f":["Népszerű pihenőhely a hegyikerékpárosok és túrázók körében.","Korábban fontos átkelő volt a Samina-völgybe."]},"city-guflina-extra":{"i":"/poi-images/city-guflina-extra.webp","s":"Triesenberg jellegzetes hegyoldali települése, amelynek házai látszólag a sziklához tapadnak.","f":["A szűk utcák ügyességet igényelnek a vezetéshez.","Zavartalan naplementéket kínál a Rajna-völgyben."]},"city-lavadina-extra":{"i":"/poi-images/city-lavadina-extra.webp","s":"Kis, elrejtett falu Triesenbergben, amely mély nyugalmat és hagyományt áraszt.","f":["Néhány tanya még a 19. századból származik.","Nagyon alacsony lakosságszám."]},"city-nendeln-extra":{"i":"/poi-images/city-nendeln-extra.webp","s":"Forgalmas falu Eschen községben, amely a liechtensteini alsóvidéken áthaladó fő közlekedési tengelyen fekszik.","f":["Saját vasútállomása van a Feldkirch-Buchs vonalon.","Egy hagyományos kerámiamanufaktúrának (Schädler) ad otthont."]},"city-schoenbuehl-extra":{"i":"/poi-images/city-schoenbuehl-extra.webp","s":"Csendes, megemelt lakótelep Eschenben, amely gyönyörű kilátást nyújt az Alsóvidékre.","f":["Eschen egyik kedvelt lakóövezeteként tartják számon.","Az építészet modern és családbarát."]},"city-bochs-eschen-extra":{"i":"/poi-images/city-bochs-eschen-extra.webp","s":"Történelmi negyed Eschen központjában, a Szent Márton plébániatemplom közelében.","f":["A negyed Eschen régi faluközpontja volt.","A szűk utcák tükrözik a történelmi faluszerkezetet."]},"city-rofenberg-extra":{"i":"/poi-images/city-rofenberg-extra.webp","s":"Szelíd dombvidék Eschenben, ahol a mezőgazdaság és a modern villák egymás mellett léteznek.","f":["A kis Rofenberg-kápolnáról ismert.","Kiterjedt utakat kínál a zöldben tett sétákhoz."]},"city-bruehl-eschen-extra":{"i":"/poi-images/city-bruehl-eschen-extra.webp","s":"Brühl egy olyan településrész Eschenben, amelynek neve nedves rétre vagy mocsaras területre utal."},"city-eichen-extra":{"i":"/poi-images/city-eichen-extra.webp","s":"Eichen egy kicsi, de kellemes településrész Eschen szélén."},"city-haldengass-extra":{"i":"/poi-images/city-haldengass-extra.webp","s":"Meredek, de idilli lakónegyed Eschenben, amely az Eschnerberg lejtőin fekszik.","f":["Csendes elhelyezkedést kínál átmenő forgalom nélkül.","A lejtős elhelyezkedés támfalakat és teraszokat igényel."]},"city-presta-extra":{"i":"/poi-images/city-presta-extra.webp","s":"Az Eschenben található Presta-Areal a település lüktető gazdasági szíve és egy jelentős ipari központ a liechtensteini Unterlandban."},"city-schaanwald-extra":{"i":"/poi-images/city-schaanwald-extra.webp","s":"Falu Mauren községben, közvetlenül az osztrák határ mentén.","f":["A legfontosabb határátkelőhely Feldkirch (Ausztria) felé.","A vámút fejlesztésével gazdaságilag fontossá vált."]},"city-auf-berg-extra":{"i":"/poi-images/city-auf-berg-extra.webp","s":"Az „Auf Berg” (Hegyen) nevű településrész Mauren községben egy festői, enyhén emelkedett lakóövezet, amelyet csendes légköre és a természet közelsége jellemez."},"city-binza-extra":{"i":"/poi-images/city-binza-extra.webp","s":"A Binza egy kicsi, csendes tanya, amely Mauren községhez tartozik a liechtensteini Unterland szívében."},"city-freiendorf-extra":{"i":"/poi-images/city-freiendorf-extra.webp","s":"A Freiendorf Mauren egyik településrésze, amely a község keleti részén, Schaanwald és így Ausztria határán fekszik."},"city-maurerberg-extra":{"i":"/poi-images/city-maurerberg-extra.webp","s":"Festői erdő- és réttáj Mauren északi szélén.","f":["Népszerű terület hosszú sétákhoz.","Sok pad nyújt kilátást az Alsóvidékre."]},"city-weiherring-extra":{"i":"/poi-images/city-weiherring-extra.webp","s":"Modern szabadidőpark és lakónegyed Mauren keleti részén.","f":["A névadó Weiherring-park minden generáció találkozóhelye.","Játszóterekkel és sportpályákkal rendelkezik."]},"city-fallsgass-extra":{"i":"/poi-images/city-fallsgass-extra.webp","s":"A Fallsgass egy jellegzetes sikátor Mauren történelmi faluközpontjában."},"city-gaensbach-extra":{"i":"/poi-images/city-gaensbach-extra.webp","s":"A Gänsbach egy kicsi, idilli lakóövezet Mauren községben, a liechtensteini Unterlandban."},"city-jonaboden-extra":{"i":"/poi-images/city-jonaboden-extra.webp","s":"Triesenberg csendes hegyoldali települése, zöld rétek és erdők közé ágyazva.","f":["A természetbarátok titkos tippjeként tartják számon.","Távol esik a Malbun felé vezető nagy közlekedési útvonalaktól."]},"city-hinter-prufatscheng-extra":{"i":"/poi-images/city-hinter-prufatscheng-extra.webp","s":"A Hinter-Prufatscheng egy magasan fekvő alpesi település Triesenberg községben, amely az alpesi elszigeteltség lényegét testesíti meg."},"city-samina-extra":{"i":"/poi-images/city-samina-extra.webp","s":"Elzárt, vadregényes hegyi völgy Liechtenstein keleti részén, érintetlen és eredeti.","f":["A Samina folyó átszeli a völgyet Ausztria felé.","Az ország egyik legnehezebben megközelíthető régiója."]},"city-saroja-extra":{"i":"/poi-images/city-saroja-extra.webp","s":"A Planken községhez tartozó Saroja településrész elválaszthatatlanul kapcsolódik az azonos nevű Sarojasattel hágóhoz, és fontos tájékozódási pont a hegymászók és túrázók számára."},"city-gafadura-extra":{"i":"/poi-images/city-gafadura-extra.webp","s":"A Gafadura nem egy hagyományos falu, hanem egy alpesi terület és a híres Gafadura menedékház helyszíne 1428 méteres magasságban, Nendeln és Planken felett."},"city-ruetti-planken-extra":{"i":"/poi-images/city-ruetti-planken-extra.webp","s":"A „Rütti” név irtásföldre utal, és pontosan ez jellemzi ezt a plankeni településrészt: a nyugalom oázisa egy erdei tisztáson, sűrű erdőkkel körülvéve."},"city-wes-planken-extra":{"i":"/poi-images/city-wes-planken-extra.webp","s":"Wes egy kicsi, magasan fekvő településrész Planken községében, amely rendkívüli kilátásáról és napos fekvéséről ismert."},"city-schuetz-planken-extra":{"i":"/poi-images/city-schuetz-planken-extra.webp","s":"Schütz egy újabb idilli településrész a napsütötte Planken községben."},"city-holz-planken-extra":{"i":"/poi-images/city-holz-planken-extra.webp","s":"Holz egy apró, eldugott településrész, amely Planken községhez tartozik, Liechtenstein legkisebb és legmagasabban fekvő önkormányzatához."},"city-nuella-planken-extra":{"i":"/poi-images/city-nuella-planken-extra.webp","s":"Nülla egy jellegzetes településrész Planken községében, amely Liechtenstein alpesi életének esszenciáját testesíti meg."},"city-gsperr-extra":{"i":"/poi-images/city-gsperr-extra.webp","s":"A Gsperr egy kicsi, feltűnésmentes településrész Eschen-Nendeln községben, amely főként egy ipari területből és néhány lakóházból áll."},"city-ruettistein-extra":{"i":"/poi-images/city-ruettistein-extra.webp","s":"Rüttistein egy kicsi, de jellegzetes része Planken községnek, amely valószínűleg egy közeli, feltűnő sziklaalakzatról kapta a nevét."},"city-hinterschellenberg-extra":{"i":"/poi-images/city-hinterschellenberg-extra.webp","s":"Hinterschellenberg egy történelmi jelentőségű településrész Schellenberg község északi részén, közel az osztrák határhoz."},"city-vorderschellenberg-extra":{"i":"/poi-images/city-vorderschellenberg-extra.webp","s":"Vorderschellenberg a schellenbergi közösség egyik fő lakóövezete, amely a liechtensteini „Unterland” csendes, emelkedett életszínvonalát testesíti meg."},"city-stgeorg-schellenberg-extra":{"i":"/poi-images/city-stgeorg-schellenberg-extra.webp","s":"A St."},"city-biedermann-extra":{"i":"/poi-images/city-biedermann-extra.webp","s":"A Biedermann-ház körüli negyed, amely Liechtenstein legrégebbi fennmaradt faháza Schellenbergben.","f":["A Biedermann-ház a 16. század elejéről származik.","Ma a paraszti életmód múzeumaként szolgál."]},"city-mittelschellenberg-extra":{"i":"/poi-images/city-mittelschellenberg-extra.webp","s":"Schellenberg község központja, a községi közigazgatással és modern létesítményekkel.","f":["Itt található a feltűnő, modern plébániatemplom.","A faluközpont egy lankás hegygerincen fekszik."]},"city-gantenstein-extra":{"i":"/poi-images/city-gantenstein-extra.webp","s":"Erdős dombvidék Schellenbergben, amely az osztrák határig húzódik.","f":["Rejtett ösvényeket kínál természetmegfigyeléshez.","Történelmileg fontos védelmi pont volt."]},"city-loch-schellenberg-extra":{"i":"/poi-images/city-loch-schellenberg-extra.webp","s":"Egy mélyebben fekvő kis mélyedés az Eschnerbergen Schellenbergben.","f":["A mikroklíma itt gyakran hűvösebb, mint a közvetlen környezetben.","Mezőgazdaságilag intenzíven hasznosítják."]},"city-platta-extra":{"i":"/poi-images/city-platta-extra.webp","s":"Lapos fennsíkterület Schellenbergben, amely ideális mezőgazdasági üzemek és szórványos lakóházak számára.","f":["A név a lapos topográfiára utal.","Napsütötte városrész."]},"city-eichholz-extra":{"i":"/poi-images/city-eichholz-extra.webp","s":"Árnyékos, korábban tölgyek által uralt erdőterület Schellenberg déli lejtőjén.","f":["Ma elsősorban a helyi rekreációt szolgálja.","Védelmet nyújt az erózió ellen a meredek lejtőkön."]},"city-limsenegg-extra":{"i":"/poi-images/city-limsenegg-extra.webp","s":"Magaslati terület Liechtenstein északi végén, Ruggell községben.","f":["Ruggell valójában az ország leglaposabb községe.","Széles kilátást nyújt az osztrák síkságra."]},"city-fofel-extra":{"i":"/poi-images/city-fofel-extra.webp","s":"Központi lakónegyed Ruggellben, tágas kertekkel és csendes utcákkal.","f":["A területen az elmúlt években jelentősen nőtt a fiatal családok száma.","Közel van a ruggelli faluközponthoz."]},"city-oberweyer-extra":{"i":"/poi-images/city-oberweyer-extra.webp","s":"Történelmi városrész Kelet-Ruggellben, az Eschnerberg emelkedője közelében.","f":["Korábbi vizes élőhely, amelyet részben lecsapoltak.","Hagyományos parasztházaknak ad otthont."]},"city-unterweyer-extra":{"i":"/poi-images/city-unterweyer-extra.webp","s":"Oberweyertől északra fekvő terület, amelyet modern lakó- és kisebb kereskedelmi épületek jellemeznek.","f":["Nagyon jó kapcsolatot biztosít a kerékpárút-hálózathoz.","Csendes és sík városrész."]},"city-nofels-grenze-extra":{"i":"/poi-images/city-nofels-grenze-extra.webp","s":"A közvetlen határterület Ruggell északi részén az osztrák Nofels felé.","f":["Kicsi, helyi jelentőségű határátkelőhely.","A területet sűrű erdők szelik át."]},"city-bangserfeld-extra":{"i":"/poi-images/city-bangserfeld-extra.webp","s":"Széles, nyílt mezőterület Ruggell északnyugati részén, amelyet erősen mezőgazdasági célra használnak.","f":["Fontos telelőhely a vándormadarak számára.","Közvetlenül a Ruggeller Riet természetvédelmi területtel határos."]},"city-rheinau-ruggell-extra":{"i":"/poi-images/city-rheinau-ruggell-extra.webp","s":"Ruggelli terület, amely közvetlenül a Rajna-gát mellett fekszik, és népszerű a szabadidős tevékenységekhez.","f":["A Rajna-gát itt tökéletes feltételeket kínál a görkorcsolyázók számára.","A hármashatár (CH, AT, LI) a közelben található."]},"city-ruggeller-riet-extra":{"i":"/poi-images/city-ruggeller-riet-extra.webp","s":"A Ruggeller Riet nem egy falu, hanem Liechtenstein legnagyobb és legjelentősebb természetvédelmi területe, egy kiterjedt tőzegláp Ruggell község északi részén."},"city-bendern-extra":{"i":"/poi-images/city-bendern-extra.webp","s":"Bendern, a liechtensteini síkvidéken (Unterland) fekvő Gamprin község történelmi központja, sokkal több, mint egy festői falu az Eschnerberg lábánál."},"city-grossabuent-extra":{"i":"/poi-images/city-grossabuent-extra.webp","s":"A gamprini Grossabünt szabadidőközpont egy modern gyöngyszem a liechtensteini síkvidéken, és kedvelt célpontja a helyieknek és a látogatóknak egyaránt."},"city-kratzera-extra":{"i":"/poi-images/city-kratzera-extra.webp","s":"A Kratzera egy kicsi, csendes település Gamprin községben, a liechtensteini síkvidéken."},"city-under-au-extra":{"i":"/poi-images/city-under-au-extra.webp","s":"A gamprini ártéri táj mélyebben fekvő része, amely gyakran nedvesebb és természetesebb.","f":["Erős rajnai árvíz esetén természetes vízvisszatartó medenceként szolgál.","Sok kétéltűfaj otthona."]},"city-halden-gamprin-extra":{"i":"/poi-images/city-halden-gamprin-extra.webp","s":"Halden egy kicsi, csendes településrész Gamprin községben, a liechtensteini síkvidéken."},"city-salums-extra":{"i":"/poi-images/city-salums-extra.webp","s":"A Salums egy apró, eldugott településrész, amely Gamprin községhez tartozik a liechtensteini síkvidéken."},"city-hasenacker-extra":{"i":"/poi-images/city-hasenacker-extra.webp","s":"A Hasenacker egy csendes, természetközeli fekvésű lakónegyed Gamprin községben."},"city-lutzfeld-extra":{"i":"/poi-images/city-lutzfeld-extra.webp","s":"A Lutzfeld egy kicsi, békés településrész Gamprin községben, a liechtensteini síkvidék szívében."},"city-oberau-gamprin-extra":{"i":"/poi-images/city-oberau-gamprin-extra.webp","s":"Az Oberau egy bájos és csendes településrész Gamprin községben, idilli helyen, a liechtensteini síkvidéken."},"city-badael-extra":{"i":"/poi-images/city-badael-extra.webp","s":"Kicsi, eldugott lakóhely a hegyoldalban Gamprin felett, sok magánélettel.","f":["Csak egy zsákutcán keresztül érhető el.","Közvetlenül az erdő közelében fekszik."]},"city-oberbuehl-extra":{"i":"/poi-images/city-oberbuehl-extra.webp","s":"Hegyoldali település Gamprin felső részén, amelyet kiváló kilátás jellemez.","f":["Nagyon csendes lakóövezet az erdő szélén.","Az egyik legmagasabban fekvő utca Gamprinban."]},"city-neufeld-gamprin-extra":{"i":"/poi-images/city-neufeld-gamprin-extra.webp","s":"Újonnan kialakított, modern lakónegyed Gamprin község szívében.","f":["A negyedet kifejezetten fiatal családok számára tervezték.","Fenntartható építészet jellemzi."]},"historical-vaduz-englaenderbau-extra":{"i":"/poi-images/historical-vaduz-englaenderbau-extra.webp","s":"A vaduzi központjában található Engländerbau (Angol-épület) a liechtensteini művészeti és kulturális élet egyik kulcsfontosságú épülete."},"historical-vaduz-regierungsgebaeude-extra":{"i":"/poi-images/historical-vaduz-regierungsgebaeude-extra.webp","s":"A vaduzi Peter-Kaiser-Platzon álló Kormányzati Épület (Regierungsgebäude) a Liechtensteini Hercegség végrehajtó hatalmának pompás központja."},"historical-vaduz-rathaus-extra":{"i":"/poi-images/historical-vaduz-rathaus-extra.webp","s":"A Vaduz szívében, a „Städtle”-ben található városháza egy jellegzetes építészeti nevezetesség és a fővárosi önkormányzat politikai központja."},"historical-vaduz-schlossle-extra":{"i":"/poi-images/historical-vaduz-schlossle-extra.webp","s":"A vaduzi Schlössle egy gazdag múltra visszatekintő történelmi birtok.","f":["Történelmi jelentőségű a régióban.","A kulturális örökség fontos része."]},"historical-vaduz-schalun-extra":{"i":"/poi-images/historical-vaduz-schalun-extra.webp","s":"Magasan Vaduz felett, egy erdős sziklakiszögellésen trónol a Schalun-várrom, amelyet a helyiek szeretettel „Vadkastélynak” (Wildschloss) is neveznek."},"historical-balzers-alter-pfarrhof-extra":{"i":"/poi-images/historical-balzers-alter-pfarrhof-extra.webp","s":"A régi balzersi plébánia a község jelentős kulturális műemléke.","f":["Történelmi jelentőségű a régióban.","A kulturális örökség fontos része."]},"historical-balzers-mariahilf-extra":{"i":"/poi-images/historical-balzers-mariahilf-extra.webp","s":"A balzersi Mariahilf zarándokkápolna festői helyen, egy kis dombon trónol, ahonnan széles kilátás nyílik a Rajna-völgyre egészen a svájci hegyekig."},"landmark-balzers-rheinbruecke-extra":{"i":"/poi-images/landmark-balzers-rheinbruecke-extra.webp","s":"A régi Rajna-híd köti össze a liechtensteini Balzerst a svájci Trübbachhal.","f":["Történelmi jelentőségű a régióban.","A kulturális örökség fontos része."]},"historical-triesen-kosthaus-extra":{"i":"/poi-images/historical-triesen-kosthaus-extra.webp","s":"A trieseni Kosthaus (étkezőház) a korai liechtensteini iparosodás időszakának egyedülálló társadalom- és építészettörténeti emlékműve."},"historical-triesen-fabrik-sporry-extra":{"i":"/poi-images/historical-triesen-fabrik-sporry-extra.webp","s":"Triesen egyik történelmi gyárépülete, amely Liechtenstein textiliparára emlékeztet.","f":["Történelmi jelentőségű a régióban.","A kulturális örökség fontos része."]},"historical-triesen-gasthaus-sonne-extra":{"i":"/poi-images/historical-triesen-gasthaus-sonne-extra.webp","s":"A Gasthaus zur Sonne történelmi fogadó Triesen szívében.","f":["Történelmi jelentőségű a régióban.","A kulturális örökség fontos része."]},"historical-triesen-st-gallus-extra":{"i":"/poi-images/historical-triesen-st-gallus-extra.webp","s":"A Szent Gallus plébániatemplom jelentős katolikus templom Triesenben.","f":["Történelmi jelentőségű a régióban.","A kulturális örökség fontos része."]},"historical-triesenberg-st-josef-extra":{"i":"/poi-images/historical-triesenberg-st-josef-extra.webp","s":"A triesenbergi Szent József plébániatemplom egy megkerülhetetlen nevezetesség, amely fenségesen trónol a Rajna-völgy feletti meredek lejtőn."},"historical-triesenberg-theodulskapelle-e const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=6;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry","other"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
