const POI_CARD={"liechtenstein-ochsenkopf-relief-v2":{"i":"/poi-images/liechtenstein-ochsenkopf-relief-v2.webp","s":"Ochsenkopf este un munte distinctiv în regiunea alpină din Liechtenstein.","f":["Parte a lanțului Rätikon","Teren alpin"]},"liechtenstein-nospitz-relief-v2":{"i":"/poi-images/liechtenstein-nospitz-relief-v2.webp","s":"Nospitz este un vârf proeminent situat lângă Malbun, în Oberlandul din Liechtenstein.","f":["Lângă Malbun","Locație expusă"]},"li-cult-vaduz-castle":{"i":"/poi-images/li-cult-vaduz-castle.webp","s":"Castelul Vaduz este reședința oficială a familiei princiare, situat strategic pe un promontoriu ce domină întreaga capitală.","f":["Turnul principal datează din secolul al XII-lea și are ziduri masive.","Accesul în interior este interzis turiștilor, fiind reședință privată."]},"li-cult-gutenberg-castle":{"i":"/poi-images/li-cult-gutenberg-castle.webp","s":"Această fortăreață medievală impunătoare este situată pe o stâncă deasupra localității Balzers, oferind o panoramă vastă asupra văii Rinului.","f":["Castelul nu a fost niciodată folosit ca reședință princiară oficială.","Donjonul central păstrează elemente arhitecturale din secolul al XII-lea."]},"li-cult-kunstmuseum":{"i":"/poi-images/li-cult-kunstmuseum.webp","s":"Acest edificiu modern din piatră bazaltică neagră adăpostește colecția națională de artă contemporană a principatului Liechtenstein.","f":["Muzeul a fost inaugurat oficial pe data de 12 noiembrie 2000.","Structura este recunoscută internațional pentru designul său minimalist."]},"li-cult-landesmuseum":{"i":"/poi-images/li-cult-landesmuseum.webp","s":"Muzeul Național oferă o perspectivă detaliată asupra istoriei și tradițiilor locale, fiind găzduit într-o fostă tavernă princiară.","f":["Complexul muzeal a fost renovat integral între anii 1999 și 2003.","Există o expoziție permanentă dedicată vânătorii și naturii alpine."]},"li-cult-red-house":{"i":"/poi-images/li-cult-red-house.webp","s":"Casa Roșie este o clădire istorică celebră din Vaduz, cunoscută pentru culoarea sa vibrantă și turnul cu fronton în trepte.","f":["Construcția originală a fost ridicată în secolul al XV-lea.","Turnul a fost adăugat ulterior pentru a servi procesului de vinificație."]},"li-cult-walser-museum":{"i":"/poi-images/li-cult-walser-museum.webp","s":"Muzeul Walser din Triesenberg documentează istoria unică a coloniștilor Walser care s-au stabilit în regiune în secolul al XIII-lea.","f":["Muzeul a fost înființat în 1961 de către comunitatea locală.","Include o casă tradițională veche de 400 de ani, perfect conservată."]},"li-cult-st-florin":{"i":"/poi-images/li-cult-st-florin.webp","s":"Catedrala Sfântul Florin este principalul lăcaș de cult catolic din Vaduz, fiind construită în stil neogotic în a doua jumătate a secolului XIX.","f":["Piatra de temelie a fost pusă în anul 1869 pe locul unei biserici vechi.","Turnul bisericii are o înălțime totală de 45 de metri."]},"li-cult-stamp-museum":{"i":"/poi-images/li-cult-stamp-museum.webp","s":"Muzeul Poștal din Vaduz prezintă o colecție vastă de mărci poștale rare și instrumente istorice folosite de serviciul poștal local.","f":["Fondat în 1930, muzeul este acum administrat de Muzeul Național.","Intrarea este gratuită, făcându-l o atracție populară pentru turiști."]},"li-cult-treasure-chamber":{"i":"/poi-images/li-cult-treasure-chamber.webp","s":"Camera Tezaurului expune obiecte de preț din colecția princiară, inclusiv faimoasele ouă Fabergé și coroane regale.","f":["Expoziția a fost inaugurată în anul 2015 într-un spațiu securizat.","Colecția include 'Oul cu flori de măr' creat de Peter Carl Fabergé."]},"li-cult-parliament":{"i":"/poi-images/li-cult-parliament.webp","s":"Clădirea Parlamentului din Vaduz este o piesă de arhitectură contemporană remarcabilă, construită integral din cărămidă galbenă.","f":["Construcția a fost finalizată în 2008 după șase ani de lucru.","Sunt folosite peste un milion de cărămizi speciale aduse din Germania."]},"li-cult-old-rhine-bridge":{"i":"/poi-images/li-cult-old-rhine-bridge.webp","s":"Acest pod istoric din lemn acoperit traversează fluviul Rin, legând capitala Vaduz de localitatea elvețiană Sevelen.","f":["Lungimea totală a podului este de 135 de metri între maluri.","Construcția a fost finalizată în 1901 pentru traficul rutier greu."]},"li-poi-triesen-marienkapelle":{"i":"/poi-images/li-poi-triesen-marienkapelle.webp","s":"Una dintre cele mai vechi clădiri sacre din țară, cu o priveliște minunată.","f":["Construită în sec. IX","Stil romanic"]},"li-poi-schaan-st-peter":{"i":"/poi-images/li-poi-schaan-st-peter.webp","s":"Cea mai veche biserică din Liechtenstein, construită pe fundații romane.","f":["Origini antice târzii","Săpături romane"]},"li-poi-eschen-pfruendhaus":{"i":"/poi-images/li-poi-eschen-pfruendhaus.webp","s":"O clădire istorică ce servește astăzi drept centru cultural și muzeu.","f":["Nucleu medieval","Evenimente culturale"]},"li-poi-schellenberg-obere-burg":{"i":"/poi-images/li-poi-schellenberg-obere-burg.webp","s":"Cea mai mare dintre cele două ruine de castel din Schellenberg, accesibilă vizitatorilor.","f":["Construit în jurul anului 1200","Cea mai mare ruină din țară"]},"li-poi-schellenberg-untere-burg":{"i":"/poi-images/li-poi-schellenberg-untere-burg.webp","s":"O ruină de castel mai mică, dar semnificativă istoric, pe versantul nordic al muntelui Eschnerberg.","f":["Construit în jurul anului 1250","Resturi de ziduri reduse"]},"li-nat-grauspitz":{"i":"/poi-images/li-nat-grauspitz.webp","s":"Grauspitz este cel mai înalt vârf din Liechtenstein, atingând o altitudine de 2599 de metri în masivul Rätikon.","f":["Altitudinea de 2599 metri îl face punctul culminant al țării.","Vârful este compus din două creste: Vorder Grauspitz și Hinter Grauspitz."]},"li-nat-naafkopf":{"i":"/poi-images/li-nat-naafkopf.webp","s":"Naafkopf este un munte simbolic situat la punctul de întâlnire a trei frontiere: Liechtenstein, Austria și Elveția.","f":["Altitudinea vârfului este de 2570 de metri deasupra mării.","Este un punct de triplex confinium (graniță triplă) în Alpii Rätikon."]},"li-nat-falknis":{"i":"/poi-images/li-nat-falknis.webp","s":"Falknis este un vârf muntos proeminent situat în sud-vestul Liechtensteinului, oferind priveliști superbe spre Elveția.","f":["Vârful atinge o înălțime de 2562 de metri deasupra nivelului mării.","Acest munte face parte din masivul Rätikon, la granița cu Elveția."]},"li-nat-drei-schwestern":{"i":"/poi-images/li-nat-drei-schwestern.webp","s":"Cele Trei Surori (Drei Schwestern) formează un lanț muntos spectaculos la granița dintre Liechtenstein și Austria.","f":["Altitudinea maximă a acestui masiv este de 2053 de metri.","Traseul montan include scări metalice fixate direct în peretele stâncos."]},"li-nat-sareiserjoch":{"i":"/poi-images/li-nat-sareiserjoch.webp","s":"Sareiserjoch este o trecătoare montană situată deasupra stațiunii Malbun, fiind un punct central pentru drumeții alpine.","f":["Trecătoarea se află la o altitudine de 1991 de metri.","Accesul este facilitat de un telescaun modern care pornește din Malbun."]},"li-nat-samina":{"i":"/poi-images/li-nat-samina.webp","s":"Râul Samina este al doilea curs de apă ca mărime din țară, traversând o vale montană sălbatică spre nord.","f":["Lungimea totală a râului este de aproximativ 17 kilometri.","Izvorăște din regiunea montană situată deasupra localității Steg."]},"li-nat-rhine":{"i":"/poi-images/li-nat-rhine.webp","s":"Rinul Alpin formează întreaga frontieră vestică a Liechtensteinului cu Elveția, fiind cursul de apă principal al regiunii.","f":["Segmentul de frontieră al Rinului are o lungime de 27 de kilometri.","Râul a fost canalizat în secolul al XIX-lea pentru a preveni inundațiile."]},"li-nat-steg-reservoir":{"i":"/poi-images/li-nat-steg-reservoir.webp","s":"Lacul de acumulare Steg, cunoscut și sub numele de Gänglesee, este o zonă de recreere populară situată în inima munților.","f":["Lacul este situat la o altitudine de aproximativ 1300 de metri.","Este alimentat de apele râului Samina și ale pâraielor adiacente."]},"li-poi-planken-gafadura":{"i":"/poi-images/li-poi-planken-gafadura.webp","s":"O cabană montană administrată, situată la 1428 m altitudine, populară printar drumeți.","f":["Proprietate a Clubului Alpin","Fost conac de vânătoare"]},"li-poi-mauren-birka":{"i":"/poi-images/li-poi-mauren-birka.webp","s":"O rezervație naturală frumoasă și un parc pentru iubitorii de păsări în Mauren.","f":["Specii rare de păsări","Traseu educativ"]},"li-poi-gamprin-grossabunt":{"i":"/poi-images/li-poi-gamprin-grossabunt.webp","s":"Singurul lac pentru înot din Liechtenstein, cu epurare ecologică a apei.","f":["Încălzit solar","Fără clor"]},"city-muehleholz-extra":{"i":"/poi-images/city-muehleholz-extra.webp","s":"Un cartier nordic din Vaduz, care se învecinează direct cu Schaan și este cunoscut pentru centrele sale educaționale.","f":["Se învecinează direct cu municipalitatea vecină Schaan.","Găzduiește Gimnaziul din Liechtenstein."]},"city-ebenholz-extra":{"i":"/poi-images/city-ebenholz-extra.webp","s":"O zonă rezidențială liniștită deasupra centrului orașului Vaduz, care oferă o vedere panoramică asupra văii Rinului.","f":["Este situat pe versantul de sub Castelul Vaduz.","Este înconjurat de podgorii și păduri."]},"city-bartlegrosch-extra":{"i":"/poi-images/city-bartlegrosch-extra.webp","s":"Un grup de așezări istorice în inima Vaduzului, unde s-a păstrat arhitectura tradițională.","f":["Aparține celor mai vechi părți locuite ale capitalei.","Conține mai multe case cu structură de lemn clasate."]},"city-mitteldorf-extra":{"i":"/poi-images/city-mitteldorf-extra.webp","s":"Un cartier fermecător din orașul vechi din Vaduz, cu alei pietruite și celebra Casă Roșie.","f":["Casa Roșie datează din Evul Mediu târziu.","Cartierul este mărginit de numeroase vițe de vie."]},"city-haberfeld-extra":{"i":"/poi-images/city-haberfeld-extra.webp","s":"Un cartier modern de afaceri și rezidențial din Vaduz, care s-a dezvoltat puternic în ultimele decenii.","f":["Găzduiește diverse instituții financiare internaționale.","Dispune de arhitectură modernă și spații verzi."]},"city-letten-vaduz-extra":{"i":"/poi-images/city-letten-vaduz-extra.webp","s":"O zonă rezidențială în sudul Vaduzului, aproape de Rin și înconjurată de terenuri agricole.","f":["Situată în câmpia Rinului și este foarte plată.","Populară printre bicicliști datorită apropierii de digul Rinului."]},"city-quadratscha-extra":{"i":"/poi-images/city-quadratscha-extra.webp","s":"O parte liniștită și verde a orașului din sudul Vaduzului, cunoscută pentru casele sale unifamiliale și grădini.","f":["Numele are origini romanice.","Oferă acces direct la traseele de drumeții spre Triesen."]},"city-spoerry-extra":{"i":"/poi-images/city-spoerry-extra.webp","s":"O fostă zonă industrială din Vaduz, care este astăzi un centru pentru cultură și facilități universitare.","f":["Zona a aparținut anterior unei fabrici de textile.","Aici sunt găzduite părți ale Universității din Liechtenstein."]},"city-au-vaduz-extra":{"i":"/poi-images/city-au-vaduz-extra.webp","s":"Au este un cartier rezidențial liniștit și verde al capitalei Vaduz, situat în partea de nord-vest, de-a lungul malurilor Rinului."},"city-dux-extra":{"i":"/poi-images/city-dux-extra.webp","s":"O zonă de agrement și un cartier rezidențial deasupra orașului Schaan, la marginea pădurii.","f":["Cunoscut pentru Capela Dux, o mică biserică de pelerinaj.","Punct de plecare pentru multe drumeții către masivul Trei Surori."]},"city-forst-schaan-extra":{"i":"/poi-images/city-forst-schaan-extra.webp","s":"O suburbie vestică a orașului Schaan, care prezintă un amestec de clădiri rezidențiale și zone comerciale.","f":["În apropiere există o mare zonă industrială.","Legăturile de transport către Elveția sunt excelente."]},"city-specki-extra":{"i":"/poi-images/city-specki-extra.webp","s":"Un cartier dens populat în centrul orașului Schaan, cu multe magazine și restaurante.","f":["Este considerat inima comercială a municipalității.","Gara din Schaan este la o scurtă plimbare."]},"city-iradug-schaan-extra":{"i":"/poi-images/city-iradug-schaan-extra.webp","s":"Un cartier liniștit din Schaan, format în principal din case unifamiliale tradiționale.","f":["Numele are vechi rădăcini retoromane.","Cartierul are o densitate a traficului foarte scăzută."]},"city-rossfeld-extra":{"i":"/poi-images/city-rossfeld-extra.webp","s":"O zonă în câmpia Schaan, unde se află facilități sportive și de agrement.","f":["Găzduiește mai multe cluburi sportive locale.","Oferă spații deschise largi pentru activități în aer liber."]},"city-riet-schaan-extra":{"i":"/poi-images/city-riet-schaan-extra.webp","s":"O zonă umedă agricolă din Schaan, importantă pentru conservarea naturii.","f":["Riet este un habitat important pentru speciile de păsări pe cale de dispariție.","O rețea de canale drenează zona."]},"city-birkahof-extra":{"i":"/poi-images/city-birkahof-extra.webp","s":"O mică zonă rezidențială înconjurată de natură în partea de nord a orașului Schaan.","f":["Cunoscut pentru copacii săi bătrâni.","Situat aproape de granița cu municipalitatea Eschen."]},"city-bardella-extra":{"i":"/poi-images/city-bardella-extra.webp","s":"Bardella este un cătun mic, dar cochet, care aparține comunei Mauren din regiunea Unterland a Liechtensteinului."},"city-matschils-extra":{"i":"/poi-images/city-matschils-extra.webp","s":"Un cartier pitoresc din Triesen, cuibărit pe versanții abrupți ai masivului Falknis.","f":["Oferă vederi spectaculoase asupra Alpilor elvețieni.","Unul dintre cele mai însorite cartiere ale municipalității."]},"city-meierhof-extra":{"i":"/poi-images/city-meierhof-extra.webp","s":"O zonă istorică din Triesen, unde se aflau proprietățile agricole ale nobilimii.","f":["Numele sugerează o fostă moșie monahală.","Astăzi o locație rezidențială căutată."]},"city-poska-extra":{"i":"/poi-images/city-poska-extra.webp","s":"O zonă de deal dens împădurită deasupra centrului satului Triesen.","f":["Servește ca o pădure de protecție importantă împotriva căderilor de pietre.","Popular pentru scurte plimbări în natură."]},"city-maschlina-extra":{"i":"/poi-images/city-maschlina-extra.webp","s":"Un cartier rezidențial din Triesen care se remarcă prin infrastructura sa potrivită pentru familii.","f":["Are mai multe locuri de joacă și grădinițe.","Situat pe o pantă cu vedere la valea Rinului."]},"city-sand-triesen-extra":{"i":"/poi-images/city-sand-triesen-extra.webp","s":"O zonă comercială la marginea orașului Triesen, aproape de drumul principal care traversează țara.","f":["O locație economică importantă a municipalității Triesen.","Găzduiește diverse afaceri artizanale."]},"city-gartnetsch-extra":{"i":"/poi-images/city-gartnetsch-extra.webp","s":"Un cartier liniștit din Triesen, caracterizat prin arhitectura tradițională din Liechtenstein.","f":["Aici au fost restaurate cu atenție câteva ferme vechi.","Situat deasupra axei principale de trafic."]},"city-saega-extra":{"i":"/poi-images/city-saega-extra.webp","s":"Zona din jurul vechii fabrici de cherestea din Triesen, care astăzi prezintă clădiri rezidențiale moderne.","f":["Numele derivă de la un ferăstrău istoric pentru lemn.","Este traversat de un mic pârâu de munte."]},"city-berschis-extra":{"i":"/poi-images/city-berschis-extra.webp","s":"Un cartier nordic din Triesen, care atinge granița municipalității Vaduz.","f":["Oferă o combinație de zone rezidențiale și mici zone comerciale.","Conexiuni foarte bune cu autobuzul către capitală."]},"city-maels-extra":{"i":"/poi-images/city-maels-extra.webp","s":"Partea vestică a municipalității Balzers, care este strâns legată de Castelul Gutenberg.","f":["Balzers și Mäls formează împreună cea mai sudică municipalitate din Liechtenstein.","Mäls și-a păstrat caracterul rural propriu."]},"city-gutenberg-area-extra":{"i":"/poi-images/city-gutenberg-area-extra.webp","s":"Zona rezidențială de la poalele dealului castelului Gutenberg din Balzers, înconjurată de podgorii.","f":["Casele de aici se bucură de o vedere excelentă asupra văii Rinului.","Dealul castelului este o zonă arheologică protejată."]},"city-stpeter-balzers-extra":{"i":"/poi-images/city-stpeter-balzers-extra.webp","s":"Un cartier istoric din Balzers, lângă vechea capelă Sf.","f":["Capela datează parțial din secolul al XV-lea.","Cartierul se află direct pe vechea rută comercială."]},"city-palduz-extra":{"i":"/poi-images/city-palduz-extra.webp","s":"O zonă rezidențială modernă în estul Balzers, care se integrează în pantă.","f":["Oferă o atmosferă liniștită, departe de drumurile de tranzit.","Popular printre familiile tinere."]},"city-junkerau-extra":{"i":"/poi-images/city-junkerau-extra.webp","s":"Un peisaj de luncă și o zonă rezidențială în partea de sud-est a Balzers, aproape de granița elvețiană.","f":["Numele face referire la o fostă moșie nobiliară.","O zonă populară pentru călărie și plimbări."]},"city-hoefle-balzers-extra":{"i":"/poi-images/city-hoefle-balzers-extra.webp","s":"Un cartier situat central în Balzers, care combină vechile ferme cu infrastructura modernă.","f":["Centrul comunitar și școlile sunt ușor accesibile.","Reflectă dezvoltarea arhitecturală a satului."]},"city-unterm-schloss-extra":{"i":"/poi-images/city-unterm-schloss-extra.webp","s":"Un cartier direct adiacent stâncilor din Gutenberg, care emană o atmosferă istorică deosebită.","f":["Casele se agață strâns de stânca abruptă.","Străduțele sunt deosebit de înguste și întortocheate aici."]},"city-malbun-extra":{"i":"/poi-images/city-malbun-extra.webp","s":"Singura stațiune de schi și cea mai importantă zonă de sporturi de iarnă din Liechtenstein, situată într-o vale alpină înaltă.","f":["Valea este situată la 1600 de metri altitudine.","O destinație populară pentru drumeții vara."]},"city-steg-extra":{"i":"/poi-images/city-steg-extra.webp","s":"Un sat de munte pitoresc și zonă de agrement, accesibil printr-un tunel din Triesenberg.","f":["Are un lac de acumulare idilic, Gänglesee.","Cabanele tradiționale se numesc 'Maiensässe'."]},"city-gaflei-extra":{"i":"/poi-images/city-gaflei-extra.webp","s":"Una dintre așezările aflate la cea mai mare altitudine din Liechtenstein, cunoscută pentru fostul sanatoriu.","f":["Punctul de plecare al celebrului traseu de drumeții Fürstensteig.","Oferă vederi panoramice spectaculoase asupra văii Rinului."]},"city-silum-extra":{"i":"/poi-images/city-silum-extra.webp","s":"O zonă liniștită de vacanță și alpină deasupra Triesenberg, care este deosebit de atractivă pentru familii.","f":["Zona este accesibilă doar printr-un drum montan îngust.","Casele tradiționale din lemn domină peisajul."]},"city-masescha-extra":{"i":"/poi-images/city-masescha-extra.webp","s":"Un cătun pe versantul muntelui, care a fost fondat istoric de walseri ca prima așezare din Liechtenstein.","f":["Găzduiește capela istorică Sf. Theodul.","Punct de belvedere popular cu vedere la Vaduz."]},"city-rotenboden-extra":{"i":"/poi-images/city-rotenboden-extra.webp","s":"Un cartier situat central din Triesenberg, cu o infrastructură bună și vederi largi spre vale.","f":["Numele înseamnă literal 'pământ roșu'.","O zonă rezidențială importantă în municipalitatea walser."]},"city-wangerberg-extra":{"i":"/poi-images/city-wangerberg-extra.webp","s":"Un cătun răspândit pe scară largă la sud de centrul satului Triesenberg, pe pante abrupte.","f":["Fermele sunt tipice pentru arhitectura walser.","Se învecinează cu Triesen la sud."]},"city-steinort-extra":{"i":"/poi-images/city-steinort-extra.webp","s":"O zonă rezidențială stâncoasă și liniștită, care aparține de Triesenberg și este înconjurată de natură.","f":["Oferă numeroase trasee de drumeție chiar în fața ușii.","Apărările împotriva avalanșelor de deasupra sunt clar vizibile."]},"city-rizlina-extra":{"i":"/poi-images/city-rizlina-extra.webp","s":"Un mic cătun de munte pe drumul spre valea Samina, cunoscut pentru izolarea sa.","f":["Devine adesea un paradis liniștit al zăpezii iarna.","Zona înconjurătoare este puternic împădurită."]},"city-suecka-extra":{"i":"/poi-images/city-suecka-extra.webp","s":"O așezare alpină pe creasta muntelui înainte de tunelul Steg, care găzduiește un han.","f":["Zonă de odihnă populară pentru bicicliștii montani și excursioniști.","Odată un punct de trecere important spre valea Samina."]},"city-guflina-extra":{"i":"/poi-images/city-guflina-extra.webp","s":"O așezare caracteristică pe pantă din Triesenberg, ale cărei case par a se lipi de stâncă.","f":["Străzile înguste necesită îndemânare la conducere.","Oferă apusuri de soare netulburate în valea Rinului."]},"city-lavadina-extra":{"i":"/poi-images/city-lavadina-extra.webp","s":"Un mic cătun ascuns din Triesenberg, care emană o liniște profundă și tradiție.","f":["Unele ferme datează încă din secolul al XIX-lea.","Populație foarte mică."]},"city-nendeln-extra":{"i":"/poi-images/city-nendeln-extra.webp","s":"Un sat aglomerat din municipalitatea Eschen, situat pe axa principală de trafic din regiunea inferioară a Liechtensteinului.","f":["Are propria gară pe linia Feldkirch-Buchs.","Găzduiește o manufactură tradițională de ceramică (Schädler)."]},"city-schoenbuehl-extra":{"i":"/poi-images/city-schoenbuehl-extra.webp","s":"O zonă rezidențială liniștită, înălțată în Eschen, care oferă o vedere frumoasă asupra regiunii inferioare.","f":["Este considerată una dintre locațiile rezidențiale preferate din Eschen.","Arhitectura este modernă și prietenoasă cu familiile."]},"city-bochs-eschen-extra":{"i":"/poi-images/city-bochs-eschen-extra.webp","s":"Un cartier istoric în centrul orașului Eschen, lângă biserica parohială Sf.","f":["Cartierul a fost vechiul centru al satului Eschen.","Străzile înguste reflectă structura istorică a satului."]},"city-rofenberg-extra":{"i":"/poi-images/city-rofenberg-extra.webp","s":"Un peisaj de dealuri domoale din Eschen, unde agricultura și vilele moderne coexistă.","f":["Cunoscut pentru mica capelă Rofenberg.","Oferă cărări întinse pentru plimbări în natură."]},"city-bruehl-eschen-extra":{"i":"/poi-images/city-bruehl-eschen-extra.webp","s":"Brühl este o parte a comunei Eschen, al cărei nume sugerează o pajiște umedă sau o zonă mlăștinoasă."},"city-eichen-extra":{"i":"/poi-images/city-eichen-extra.webp","s":"Eichen este o zonă mică, dar fermecătoare, la marginea comunei Eschen."},"city-haldengass-extra":{"i":"/poi-images/city-haldengass-extra.webp","s":"Un cartier rezidențial abrupt, dar idilic din Eschen, situat pe versanții muntelui Eschnerberg.","f":["Oferă o locație liniștită, fără trafic de tranzit.","Locația pe versant necesită ziduri de sprijin și terase."]},"city-presta-extra":{"i":"/poi-images/city-presta-extra.webp","s":"Zona Presta din Eschen este inima economică vibrantă a comunei și un important sit industrial în regiunea Unterland din Liechtenstein."},"city-schaanwald-extra":{"i":"/poi-images/city-schaanwald-extra.webp","s":"Un sat din municipalitatea Mauren, situat chiar la granița cu Austria.","f":["Locația celui mai important punct de trecere a frontierei către Feldkirch (Austria).","A devenit important din punct de vedere economic prin dezvoltarea drumului vamal."]},"city-auf-berg-extra":{"i":"/poi-images/city-auf-berg-extra.webp","s":"Cartierul „Auf Berg” (Pe Deal) din comuna Mauren este o zonă rezidențială pitorească, ușor înălțată, care se distinge prin atmosfera sa liniștită și apropierea de natură."},"city-binza-extra":{"i":"/poi-images/city-binza-extra.webp","s":"Binza este un cătun mic și liniștit, aparținând comunei Mauren, în inima regiunii Unterland din Liechtenstein."},"city-freiendorf-extra":{"i":"/poi-images/city-freiendorf-extra.webp","s":"Freiendorf este o localitate din Mauren, situată în partea de est a comunei, la granița cu Schaanwald și, prin urmare, cu Austria."},"city-maurerberg-extra":{"i":"/poi-images/city-maurerberg-extra.webp","s":"O zonă pitorească de pădure și pajiște la marginea de nord a orașului Mauren.","f":["O zonă populară pentru plimbări lungi.","Multe bănci oferă priveliști asupra regiunii inferioare."]},"city-weiherring-extra":{"i":"/poi-images/city-weiherring-extra.webp","s":"O facilitate modernă de agrement și o zonă rezidențială în estul orașului Mauren.","f":["Parcul Weiherring, care îi dă numele, este un loc de întâlnire pentru toate generațiile.","Are locuri de joacă și terenuri de sport."]},"city-fallsgass-extra":{"i":"/poi-images/city-fallsgass-extra.webp","s":"Fallsgass este o alee caracteristică în centrul istoric al satului Mauren."},"city-gaensbach-extra":{"i":"/poi-images/city-gaensbach-extra.webp","s":"Gänsbach este o mică și idilică zonă rezidențială în cadrul comunei Mauren, din regiunea Unterland a Liechtensteinului."},"city-jonaboden-extra":{"i":"/poi-images/city-jonaboden-extra.webp","s":"O așezare liniștită pe versant din Triesenberg, cuibărită în pajiști verzi și păduri.","f":["Este considerat un sfat secret pentru iubitorii de natură.","Este situat departe de rutele majore de trafic spre Malbun."]},"city-hinter-prufatscheng-extra":{"i":"/poi-images/city-hinter-prufatscheng-extra.webp","s":"Hinter-Prufatscheng este o așezare alpină la mare altitudine în comuna Triesenberg și întruchipează esența izolării alpine."},"city-samina-extra":{"i":"/poi-images/city-samina-extra.webp","s":"O vale montană îndepărtată, sălbatic de romantică în estul Liechtensteinului, neatinsă și virgină.","f":["Râul Samina taie valea spre Austria.","Una dintre cele mai inaccesibile regiuni ale țării."]},"city-saroja-extra":{"i":"/poi-images/city-saroja-extra.webp","s":"Cătunul Saroja din comuna Planken este indisolubil legat de șaua Sarojasattel cu același nume și servește drept un punct de orientare important pentru alpiniști și drumeți."},"city-gafadura-extra":{"i":"/poi-images/city-gafadura-extra.webp","s":"Gafadura nu este un sat tradițional, ci mai degrabă o zonă alpină și locația faimoasei cabane Gafadura, la o altitudine de 1428 de metri, deasupra localităților Nendeln și Planken."},"city-ruetti-planken-extra":{"i":"/poi-images/city-ruetti-planken-extra.webp","s":"Numele „Rütti” sugerează o poiană obținută prin defrișare, și exact asta este acest cătun din Planken: o oază de liniște într-o deschizătură, înconjurată de păduri dese."},"city-wes-planken-extra":{"i":"/poi-images/city-wes-planken-extra.webp","s":"Wes este un mic cătun situat la mare altitudine în comuna Planken, cunoscut pentru priveliștea sa excepțională și locația sa însorită."},"city-schuetz-planken-extra":{"i":"/poi-images/city-schuetz-planken-extra.webp","s":"Schütz este un alt cătun idilic aparținând comunei însorite Planken."},"city-holz-planken-extra":{"i":"/poi-images/city-holz-planken-extra.webp","s":"Holz este un cătun mic și izolat, aparținând comunei Planken, cea mai mică și mai înaltă municipalitate din Liechtenstein."},"city-nuella-planken-extra":{"i":"/poi-images/city-nuella-planken-extra.webp","s":"Nülla este un cătun caracteristic din comuna Planken, întruchipând esența vieții alpine din Liechtenstein."},"city-gsperr-extra":{"i":"/poi-images/city-gsperr-extra.webp","s":"Gsperr este o parte mică și discretă a comunei Eschen-Nendeln, constând în principal dintr-o zonă industrială și câteva case rezidențiale."},"city-ruettistein-extra":{"i":"/poi-images/city-ruettistein-extra.webp","s":"Rüttistein este o parte mică, dar distinctivă a comunei Planken, care probabil își trage numele de la o formațiune stâncoasă proeminentă din apropiere."},"city-hinterschellenberg-extra":{"i":"/poi-images/city-hinterschellenberg-extra.webp","s":"Hinterschellenberg este o localitate plină de istorie în nordul municipalității Schellenberg, aproape de granița cu Austria."},"city-vorderschellenberg-extra":{"i":"/poi-images/city-vorderschellenberg-extra.webp","s":"Vorderschellenberg este una dintre principalele zone rezidențiale ale comunei Schellenberg și întruchipează stilul de viață liniștit și de înaltă clasă din „Unterland”-ul (Țara de Jos) a Liechtenst..."},"city-stgeorg-schellenberg-extra":{"i":"/poi-images/city-stgeorg-schellenberg-extra.webp","s":"St."},"city-biedermann-extra":{"i":"/poi-images/city-biedermann-extra.webp","s":"Cartierul din jurul Casei Biedermann, cea mai veche casă din lemn păstrată din Liechtenstein în Schellenberg.","f":["Casa Biedermann datează de la începutul secolului al XVI-lea.","Astăzi servește ca muzeu al vieții rurale."]},"city-mittelschellenberg-extra":{"i":"/poi-images/city-mittelschellenberg-extra.webp","s":"Centrul municipalității Schellenberg cu administrația locală și facilități moderne.","f":["Aici se află biserica parohială modernă impresionantă.","Centrul satului este situat pe o creastă blândă a muntelui."]},"city-gantenstein-extra":{"i":"/poi-images/city-gantenstein-extra.webp","s":"O zonă de deal împădurită în Schellenberg, care se extinde până la granița austriacă.","f":["Oferă poteci ascunse pentru observarea naturii.","A fost istoric un punct de apărare important."]},"city-loch-schellenberg-extra":{"i":"/poi-images/city-loch-schellenberg-extra.webp","s":"O mică depresiune inferioară pe Eschnerberg în Schellenberg.","f":["Microclimatul de aici este adesea mai răcoros decât în zona imediat înconjurătoare.","Este folosit intens pentru agricultură."]},"city-platta-extra":{"i":"/poi-images/city-platta-extra.webp","s":"O zonă plată de platou în Schellenberg, ideală pentru ferme și case rezidențiale izolate.","f":["Numele sugerează topografia plată.","Un cartier răsfățat de soare."]},"city-eichholz-extra":{"i":"/poi-images/city-eichholz-extra.webp","s":"O zonă de pădure umbrită, dominată anterior de stejari, pe versantul sudic al Schellenbergului.","f":["Astăzi servește în primul rând recreerii locale.","Oferă protecție împotriva eroziunii pe pantele abrupte."]},"city-limsenegg-extra":{"i":"/poi-images/city-limsenegg-extra.webp","s":"O zonă ridicată la capătul de nord al Liechtensteinului, în municipalitatea Ruggell.","f":["Ruggell este de fapt cea mai plată municipalitate din țară.","Oferă o vedere largă asupra câmpiilor austriece."]},"city-fofel-extra":{"i":"/poi-images/city-fofel-extra.webp","s":"Un cartier rezidențial central în Ruggell, caracterizat prin grădini spațioase și străzi liniștite.","f":["Zona a cunoscut o creștere puternică a familiilor tinere în ultimii ani.","Situat aproape de centrul satului Ruggell."]},"city-oberweyer-extra":{"i":"/poi-images/city-oberweyer-extra.webp","s":"Un cartier istoric în estul orașului Ruggell, aproape de urcarea spre Eschnerberg.","f":["Fostă zonă umedă care a fost parțial secată.","Găzduiește ferme tradiționale."]},"city-unterweyer-extra":{"i":"/poi-images/city-unterweyer-extra.webp","s":"O zonă la nord de Oberweyer caracterizată prin clădiri rezidențiale și comerciale mici moderne.","f":["Oferă conexiuni foarte bune la rețeaua de piste de biciclete.","Un cartier liniștit și plat."]},"city-nofels-grenze-extra":{"i":"/poi-images/city-nofels-grenze-extra.webp","s":"Zona imediată de graniță din nordul orașului Ruggell cu austriacul Nofels.","f":["Un punct de trecere a frontierei mic, utilizat local.","Zona este traversată de păduri dese."]},"city-bangserfeld-extra":{"i":"/poi-images/city-bangserfeld-extra.webp","s":"O zonă largă, deschisă de câmp în nord-vestul orașului Ruggell, care este puternic folosită pentru agricultură.","f":["Zonă importantă de iernare pentru păsările migratoare.","Se învecinează direct cu rezervația naturală Ruggeller Riet."]},"city-rheinau-ruggell-extra":{"i":"/poi-images/city-rheinau-ruggell-extra.webp","s":"Zona din Ruggell, care se află chiar pe digul Rinului și este populară pentru activități de agrement.","f":["Digul Rinului oferă condiții perfecte pentru patinatorii cu role aici.","Punctul de graniță a trei țări (CH, AT, LI) este situat în apropiere."]},"city-ruggeller-riet-extra":{"i":"/poi-images/city-ruggeller-riet-extra.webp","s":"Ruggeller Riet nu este un sat, ci cea mai mare și mai importantă rezervație naturală din Liechtenstein, o vastă zonă de turbărie în nordul comunei Ruggell."},"city-bendern-extra":{"i":"/poi-images/city-bendern-extra.webp","s":"Bendern, o inimă istorică a comunei Gamprin din zona joasă a Liechtensteinului (Unterland), este mult mai mult decât un simplu sat pitoresc la poalele dealului Eschnerberg."},"city-grossabuent-extra":{"i":"/poi-images/city-grossabuent-extra.webp","s":"Complexul de agrement Grossabünt din Gamprin este o bijuterie modernă în zona joasă a Liechtensteinului și o destinație populară pentru localnici și vizitatori."},"city-kratzera-extra":{"i":"/poi-images/city-kratzera-extra.webp","s":"Kratzera este o așezare mică și liniștită din comuna Gamprin, în zona joasă a Liechtensteinului."},"city-under-au-extra":{"i":"/poi-images/city-under-au-extra.webp","s":"O zonă inferioară a peisajului de luncă din Gamprin, care este adesea mai umedă și mai naturală.","f":["Servește ca bazin natural de retenție în timpul apelor mari ale Rinului.","Găzduiește multe specii de amfibieni."]},"city-halden-gamprin-extra":{"i":"/poi-images/city-halden-gamprin-extra.webp","s":"Halden este un cătun mic și liniștit în cadrul comunei Gamprin, în zona joasă a Liechtensteinului."},"city-salums-extra":{"i":"/poi-images/city-salums-extra.webp","s":"Salums este un cătun minuscul și izolat, aparținând comunei Gamprin din zona joasă a Liechtensteinului."},"city-hasenacker-extra":{"i":"/poi-images/city-hasenacker-extra.webp","s":"Hasenacker este un mic district rezidențial din comuna Gamprin, remarcabil prin locația sa liniștită și apropiată de natură."},"city-lutzfeld-extra":{"i":"/poi-images/city-lutzfeld-extra.webp","s":"Lutzfeld este o mică și pașnică localitate a comunei Gamprin, situată în inima zonei joase a Liechtensteinului."},"city-oberau-gamprin-extra":{"i":"/poi-images/city-oberau-gamprin-extra.webp","s":"Oberau este o localitate fermecătoare și liniștită a comunei Gamprin, situată idilic în zona joasă a Liechtensteinului."},"city-badael-extra":{"i":"/poi-images/city-badael-extra.webp","s":"Un mic loc rezidențial ascuns pe dealul deasupra orașului Gamprin, cu multă intimitate.","f":["Accesibil doar printr-o stradă închisă.","Situat foarte aproape de pădure."]},"city-oberbuehl-extra":{"i":"/poi-images/city-oberbuehl-extra.webp","s":"O așezare pe pantă în partea superioară a orașului Gamprin, caracterizată printr-o locație cu vedere excelentă.","f":["Zonă rezidențială foarte liniștită la marginea pădurii.","Una dintre străzile aflate la cea mai mare altitudine din Gamprin."]},"city-neufeld-gamprin-extra":{"i":"/poi-images/city-neufeld-gamprin-extra.webp","s":"Un cartier rezidențial modern, recent dezvoltat în inima municipalității Gamprin.","f":["Cartierul a fost conceput special pentru familiile tinere.","Se caracterizează prin metode de construcție durabile."]},"historical-vaduz-englaenderbau-extra":{"i":"/poi-images/historical-vaduz-englaenderbau-extra.webp","s":"Engländerbau (Clădirea Engleză), situată în centrul orașului Vaduz, este o clădire cheie pe scena artistică și culturală din Liechtenstein."},"historical-vaduz-regierungsgebaeude-extra":{"i":"/poi-images/historical-vaduz-regierungsgebaeude-extra.webp","s":"Clădirea Guvernului din Piața Peter-Kaiser din Vaduz este inima magnifică a puterii executive a Principatului Liechtenstein."},"historical-vaduz-rathaus-extra":{"i":"/poi-images/historical-vaduz-rathaus-extra.webp","s":"Primăria din Vaduz, situată în inima zonei „Städtle”, este un reper arhitectural distinctiv și centrul politic al capitalei."},"historical-vaduz-schlossle-extra":{"i":"/poi-images/historical-vaduz-schlossle-extra.webp","s":"Schlössle din Vaduz este o proprietate istorică cu o istorie bogată.","f":["Semnificație istorică în regiune.","O parte importantă a patrimoniului cultural."]},"historical-vaduz-schalun-extra":{"i":"/poi-images/historical-vaduz-schalun-extra.webp","s":"Deasupra orașului Vaduz, pe o proeminență stâncoasă împădurită, se află ruinele castelului Schalun, cunoscut popular și sub numele de „Wildschloss” (Castelul Sălbatic)."},"historical-balzers-alter-pfarrhof-extra":{"i":"/poi-images/historical-balzers-alter-pfarrhof-extra.webp","s":"Vechea casă parohială din Balzers este un important monument cultural al comunității.","f":["Semnificație istorică în regiune.","O parte importantă a patrimoniului cultural."]},"historical-balzers-mariahilf-extra":{"i":"/poi-images/historical-balzers-mariahilf-extra.webp","s":"Capela de pelerinaj Mariahilf din Balzers este așezată pitoresc pe o colină, oferind o priveliște vastă asupra Văii Rinului până la munții elvețieni."},"landmark-balzers-rheinbruecke-extra":{"i":"/poi-images/landmark-balzers-rheinbruecke-extra.webp","s":"Vechiul pod peste Rin leagă Balzers din Liechtenstein de Trübbach din Elveția.","f":["Semnificație istorică în regiune.","O parte importantă a patrimoniului cultural."]},"historical-triesen-kosthaus-extra":{"i":"/poi-images/historical-triesen-kosthaus-extra.webp","s":"Kosthaus (Casa de Mese) din Triesen este un monument socio-istoric și arhitectural unic din perioada industrializării timpurii în Liechtenstein."},"historical-triesen-fabrik-sporry-extra":{"i":"/poi-images/historical-triesen-fabrik-sporry-extra.webp","s":"O clădire istorică a fabricii din Triesen care amintește de industria textilă a Liechtensteinului.","f":["Semnificație istorică în regiune.","O parte importantă a patrimoniului cultural."]},"historical-triesen-gasthaus-sonne-extra":{"i":"/poi-images/historical-triesen-gasthaus-sonne-extra.webp","s":"Gasthaus zur Sonne este o tavernă istorică din inima orașului Triesen.","f":["Semnificație istorică în regiune.","O parte importantă a patrimoniului cultural."]},"historical-triesen-st-gallus-extra":{"i":"/poi-images/historical-triesen-st-gallus-extra.webp","s":"Biserica parohială Sf.","f":["Semnificație istorică în regiune.","O parte importantă a patrimoniului cultural."]},"historical-triesenberg-st-josef-extra":{"i":"/poi-images/historical-triesenberg-st-josef-extra.webp","s":"Biserica parohială Sfântul Iosif din Triesenberg este un reper inconfundabil, așezată maiestuos pe o pantă abruptă deasupra Văii Rinului."},"historical-triesenberg-theodulskapelle-extra":{"i":"/poi-images/historical-triesenberg-theodulskapelle-extra.webp","s":"Ascunsă în enclava liniștită Masescha, deasupra Triesenbergului, Capela Sfântului Theodul se prezintă ca una dintre cele mai vechi și mai semnificative mărturii ale colonizării Walser în Liechtenst..."},"historical-triesenberg-walserhaus-extra":{"i":"/poi-images/historical-triesenberg-walserhaus-extra.webp","s":"Casa Walser din Triesenberg, care astăzi găzduiește Muzeul Walser, este o fereastră autentică către trecut și inima culturală a comunității Walser din Liechtenstein."},"historical-triesenberg-kapelle-steg-extra":{"i":"/poi-images/historical-triesenberg-kapelle-steg-extra.webp","s":"Amplasată în valea idilică Steg, un cătun liniștit aparținând comunei Triesenberg, Capela din Steg se află chiar pe malul micului lac Gänglesee."},"historical-triesenberg-friedenskirchlein-extra":{"i":"/poi-images/historical-triesenberg-friedenskirchlein-extra.webp","s":"Situată la înălțimea de 1600 de metri în Malbun, inima alpină a Liechtensteinului, Biserica Păcii (Friedenskirchlein) se înalță ca un simbol tăcut al contemplației și reculegerii."},"historical-schaan-roemerkastell-extra":{"i":"/poi-images/historical-schaan-roemerkastell-extra.webp","s":"Castrul roman din Schaan este unul dintre cele mai importante situri arheologice din Liechtenstein și o mărturie impresionantă a importanței strategice a regiunii acum aproape 2000 de ani."},"historical-schaan-st-laurentius-extra":{"i":"/poi-images/historical-schaan-st-laurentius-extra.webp","s":"Biserica parohială vizibilă de departe Sf.","f":["Semnificație istorică în regiune.","O parte importantă a patrimoniului cultural."]},"landmark-schaan-tak-extra":{"i":"/poi-images/landmark-schaan-tak-extra.webp","s":"Teatrul din Piața Bisericii este cel mai important centru cultural pentru artele spectacolului din țară.","f":["Semnificație istorică în regiune.","O parte importantă a patrimoniului cultural."]},"historical-schaan-domus-extra":{"i":" const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');

// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
