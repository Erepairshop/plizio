const POI_CARD={"concepcion-cities-v2":{"i":"/poi-images/concepcion-cities-v2.webp","s":"Un important oraș portuar din nordul Paraguayului, fondat în 1773, servind drept centru comercial pentru agricultură.","f":["Cunoscut pentru numeroasele clădiri în stil italian bine conservate.","Un important punct de tranzit pentru carnea de vită și lemn."]},"san-antonio-cities-v2":{"i":"/poi-images/san-antonio-cities-v2.webp","s":"Situat pe malul râului Paraguay, acest oraș industrial oferă mai multe porturi interioare importante pentru țară.","f":["Are facilități pentru exportul de cereale și boabe de soia.","Fondată în 1890, a experimentat un boom datorită industriei de ambalare a cărnii."]},"villarrica-cities-v2":{"i":"/poi-images/villarrica-cities-v2.webp","s":"Orașul de la poalele munților Ybytyruzú este adesea numit 'Orașul rătăcitor' din cauza istoriei sale zbuciumate.","f":["A fost mutată de șapte ori de la înființarea sa în 1570.","Centrul culturii academice și muzicale paraguayene."]},"santa-rita-cities-v2":{"i":"/poi-images/santa-rita-cities-v2.webp","s":"Fiind un centru agricol puternic influențat de coloniștii brazilieni, orașul este considerat unul dintre cele mai bogate din țară.","f":["Fondată în anul 1973.","Găzduiește Expo Santa Rita, un imens târg agricol."]},"asuncion-cities-v2":{"i":"/poi-images/asuncion-cities-v2.webp","s":"Capitala Paraguayului, fondată în 1537, este cel mai important centru economic și cultural al țării de pe malul râului Paraguay.","f":["Centrul istoric găzduiește Palacio de los López.","Este una dintre cele mai vechi așezări spaniole din America de Sud."]},"san-pedro-ycuamandiyu-cities-v2":{"i":"/poi-images/san-pedro-ycuamandiyu-cities-v2.webp","s":"Capitala departamentului San Pedro, fondată în 1786, este înconjurată de moșii agricole tradiționale.","f":["Joacă un rol central în producția de yerba mate.","Găzduiește o catedrală remarcabilă din perioada colonială."]},"caacupe-cities-v2":{"i":"/poi-images/caacupe-cities-v2.webp","s":"Acest centru spiritual al țării atrage milioane de pelerini la bazilică în fiecare an, pe 8 decembrie.","f":["Acasă la faimoasa Basílica de la Virgen de los Milagros.","A fost fondată oficial în 1770."]},"coronel-oviedo-cities-v2":{"i":"/poi-images/coronel-oviedo-cities-v2.webp","s":"Fiind un important nod de transport în mijlocul regiunii Orientale, orașul leagă Asunción de Ciudad del Este.","f":["Fondată în 1758 sub numele de Nuestra Señora del Rosario.","Puternic agricolă, în special datorită cultivării soiei."]},"caazapa-cities-v2":{"i":"/poi-images/caazapa-cities-v2.webp","s":"Acest oraș, fondat de franciscani în 1607, își păstrează și astăzi rădăcinile și legendele coloniale.","f":["Numele înseamnă 'Dincolo de pădure' în guarani.","Renumit pentru izvorul Ykua Bolaños, despre care se spune că are puteri vindecătoare."]},"encarnacion-cities-v2":{"i":"/poi-images/encarnacion-cities-v2.webp","s":"'Perla Sudului' este renumită pentru promenada sa de pe râul Paraná și pentru carnavalul anual spectaculos.","f":["Fondată în 1615 de iezuitul Roque González de Santa Cruz.","Conectat la orașul argentinian Posadas prin podul San Roque."]},"san-juan-bautista-cities-v2":{"i":"/poi-images/san-juan-bautista-cities-v2.webp","s":"Un centru al reducerilor iezuite din regiunea Misiones, cunoscut pentru cultura sa ecvestră și gaucho distinctă.","f":["Locul de naștere al celebrului chitarist paraguayan Agustín Barrios Mangoré.","Sărbătorește Festivalul Sfântului Ioan în fiecare an în iunie."]},"paraguari-cities-v2":{"i":"/poi-images/paraguari-cities-v2.webp","s":"Înconjurat de dealuri izbitoare, orașul a fost cândva un bastion important al administrației coloniale spaniole.","f":["În 1811, trupele paraguayene au învins aici armata argentiniană sub conducerea lui Belgrano.","Orașul este numit și 'Leagănul Independenței'."]},"ciudad-del-este-cities-v2":{"i":"/poi-images/ciudad-del-este-cities-v2.webp","s":"Al doilea oraș ca mărime din Paraguay, situat la granița triplă, este un centru masiv de comerț liber care atrage cumpărători din toată America de Sud.","f":["Fondată în 1957 ca Puerto Flor de Lis.","Situat în imediata apropiere a masivului baraj Itaipu."]},"aregua-cities-v2":{"i":"/poi-images/aregua-cities-v2.webp","s":"Orașul pitoresc de pe malul lacului Ypacaraí este cunoscut la nivel național pentru olărit și cultivarea căpșunilor.","f":["Festivalul Căpșunilor are loc aici în fiecare an în luna august.","Păstrează case arhitecturale fermecătoare în stil colonial din secolul al XIX-lea."]},"pilar-cities-v2":{"i":"/poi-images/pilar-cities-v2.webp","s":"Un oraș portuar liniștit pe râul Paraguay, apreciat pentru industria sa textilă din bumbac și clădirile istorice.","f":["Fondată în 1779 de Pedro Melo de Portugal.","Orașul găzduiește cea mai importantă fabrică de textile din țárá, Manufactura de Pilar."]},"pedro-juan-caballero-cities-v2":{"i":"/poi-images/pedro-juan-caballero-cities-v2.webp","s":"Acest oraș de graniță împarte o stradă cu orașul brazilian Ponta Porã și este un important centru comercial.","f":["Fondat în 1899 și numit după un erou al independenței.","Economia se bazează puternic pe turismul transfrontalier."]},"salto-del-guaira-cities-v2":{"i":"/poi-images/salto-del-guaira-cities-v2.webp","s":"Odinioară acasă la cascade spectaculoase, orașul este acum o destinație de cumpărături în plină expansiune la granița cu Brazilia.","f":["Faimoasele cascade au fost inundate de barajul Itaipu în 1982.","Unul dintre orașele cu cea mai rapidă creștere din Paraguay."]},"villa-hayes-cities-v2":{"i":"/poi-images/villa-hayes-cities-v2.webp","s":"Poarta de acces către regiunea Chaco, numită în onoarea președintelui american Rutherford B.","f":["Găzduiește un muzeu istoric și clădiri vechi coloniale.","Important centru de producție a oțelului din țară."]},"fuerte-olimpo-cities-v2":{"i":"/poi-images/fuerte-olimpo-cities-v2.webp","s":"Acest oraș îndepărtat din Alto Paraguay este situat idilic pe râul Paraguay și odinioară proteja granița de nord.","f":["Fondat în 1792 sub numele de Fuerte Borbón.","Puteți vizita o catedrală construită pe un deal aici."]},"filadelfia-cities-v2":{"i":"/poi-images/filadelfia-cities-v2.webp","s":"În inima Gran Chaco, acest oraș a fost fondat în anii 1930 de imigranți menoniți din Rusia.","f":["Germana este încă vorbită pe scară largă aici datorită rădăcinilor menonite.","Cel mai important centru de producție de lactate și carne din Chaco."]},"luque-cities-v2":{"i":"/poi-images/luque-cities-v2.webp","s":"Faimos pentru producția de bijuterii din filigran din aur și argint, precum și instrumente cu coarde lucrate manual.","f":["Aeroportul Internațional Silvio Pettirossi este situat în oraș.","A fost pe scurt capitala Paraguayului în 1868 în timpul Războiului Triplei Alianțe."]},"capiata-cities-v2":{"i":"/poi-images/capiata-cities-v2.webp","s":"Unul dintre cele mai populate orașe din regiunea metropolitană, caracterizat prin așezări dense și biserici istorice.","f":["Biserica Maicii Domnului Candelaria din secolul al XVIII-lea este un punct culminant.","Creată inițial în 1640 ca o misiune franciscană."]},"lambare-cities-v2":{"i":"/poi-images/lambare-cities-v2.webp","s":"Situat chiar la sud de capitală, orașul oferă Cerro Lambaré, al cărui vârf oferă o priveliște magnifică.","f":["A fost ridicat oficial la rangul de municipiu independent în 1962.","Numit după legendarul cacic indigen Lambaré."]},"fernando-de-la-mora-cities-v2":{"i":"/poi-images/fernando-de-la-mora-cities-v2.webp","s":"Un oraș comercial și rezidențial plin de viață, numit după unul dintre fondatorii independenței Paraguayului.","f":["Fost cunoscut sub numele de Zevala-cué.","A fost separat oficial de San Lorenzo în 1939 și a devenit un oraș propriu."]},"limpio-cities-v2":{"i":"/poi-images/limpio-cities-v2.webp","s":"Unul dintre cele mai vechi orașe din țară, caracterizat tradițional prin împletiturile din karanday pentru pălării.","f":["Fondată inițial sub numele de San José de los Campos Limpios de Tapuá.","Joacă un rol important în turismul artizanal."]},"nemby-cities-v2":{"i":"/poi-images/nemby-cities-v2.webp","s":"Un municipiu cu creștere rapidă la sud-est de capitală, unde agricultura face treptat loc industriei.","f":["Dispune de Cerro Ñemby, o fostă carieră de piatră care servește acum ca zonă de recreere.","Fondată pe 2 august 1899."]},"itaugua-cities-v2":{"i":"/poi-images/itaugua-cities-v2.webp","s":"Cunoscut la nivel internațional ca fiind casa ñandutí, o broderie caracteristică asemănătoare pânzei de păianjen.","f":["Festivalul anual Ñandutí atrage mii de vizitatori.","A fost fondat în 1728 de Martín de Barúa."]},"mariano-roque-alonso-cities-v2":{"i":"/poi-images/mariano-roque-alonso-cities-v2.webp","s":"Orașul este cel mai bine cunoscut ca locație pentru marele târg internațional anual de agricultură și industrie.","f":["Podul Puente Remanso leagă orașul de regiunea Chaco.","Fondată în 1945 din părți ale San Lorenzo și Limpio."]},"villa-elisa-cities-v2":{"i":"/poi-images/villa-elisa-cities-v2.webp","s":"O enclavă urbană liniștită din regiunea metropolitană, conturată de imigrația daneză de la sfârșitul secolului al XIX-lea.","f":["Fondată în 1899 de coloniști scandinavi.","Un important centru industrial, parțial datorită companiei petroliere de stat Petropar."]},"ypane-cities-v2":{"i":"/poi-images/ypane-cities-v2.webp","s":"Cunoscut drept 'Orașul Istoric', deoarece aici au avut loc bătălii străvechi și evenimente istorice.","f":["Numele înseamnă 'apă curgătoare' în Guarani.","Orașul păstrează multe monumente din Războiul Triplei Alianțe."]},"villeta-cities-v2":{"i":"/poi-images/villeta-cities-v2.webp","s":"Ca o putere industrială pe râul Paraguay, oraşul are porturi și facilități de ciment importante.","f":["Fondată în 1714 de Juan Gregorio Bazán de Pedraza.","Are un port prin care este exportată o mare parte a soiei paraguayene."]},"guarambare-cities-v2":{"i":"/poi-images/guarambare-cities-v2.webp","s":"Înconjurat de plantații de trestie de zahăr, acest oraș este renumit istoric pentru fabricile sale de zahăr.","f":["Fondată în 1538 de cuceritorul Domingo Martínez de Irala.","Sfântul patron al orașului este Fecioara Nașterii Domnului."]},"ypacarai-cities-v2":{"i":"/poi-images/ypacarai-cities-v2.webp","s":"Locul de naștere al legendarului cântec 'Recuerdos de Ypacaraí' atrage mulți muzicieni și turiști datorită lacului său mare.","f":["Aici are loc importantul Festival al Lacului Ypacaraí.","Gara locală a fost, din punct de vedere istoric, o stație cheie a căii ferate Carlos Antonio López."]},"presidente-franco-cities-v2":{"i":"/poi-images/presidente-franco-cities-v2.webp","s":"Situat la confluența râurilor Paraná și Iguazú, găzduiește uimitoarele cascade Saltos del Monday.","f":["Fondată în 1929 și numită după Manuel Franco.","Important pentru turismul din regiunea tri-frontalieră."]},"minga-guazu-cities-v2":{"i":"/poi-images/minga-guazu-cities-v2.webp","s":"Fondat în anii 1950 printr-un sistem cooperatist, acest oraș agricol înfloritor este cunoscut pentru industria sa.","f":["Numele înseamnă 'Muncă comunitară mare' în Guarani.","Găzduiește Aeroportul Internațional Guaraní."]},"hernandarias-cities-v2":{"i":"/poi-images/hernandarias-cities-v2.webp","s":"Ales numită cu mândrie 'Capitala Energiei Americii Latine', deoarece o mare parte a barajului Itaipu se află aici.","f":["Cel mai vechi oraș din departament, numit anterior Tacurupucu.","Rezervorul Itaipu este folosit aici în scopuri sportive și de agrement."]},"coronel-bogado-cities-v2":{"i":"/poi-images/coronel-bogado-cities-v2.webp","s":"Capitala autoproclamată a chipa, faimoasa pâine cu porumb și brânză din Paraguay, care atrage vizitatori cu produsele de panificație tradiționale.","f":["Aici are loc un festival special pentru pâinea chipa în fiecare an.","Fondat inițial sub numele Paraje Ka'i Puente."]},"san-estanislao-cities-v2":{"i":"/poi-images/san-estanislao-cities-v2.webp","s":"Cunoscută colocvial sub numele de Santaní, această reducere iezuită istorică își păstrează arhitectura prețioasă chiar și astăzi.","f":["Fondată de iezuiți în 1749.","În timpul războiului, Mariscal López a folosit o casă locală iezuită drept cartier general."]},"horqueta-cities-v2":{"i":"/poi-images/horqueta-cities-v2.webp","s":"Situat la o intersecție a rutelor istorice, orașul își trage numele de la cuvântul spaniol pentru 'bifurcație a drumului'.","f":["Fondată în anul 1793.","Este un centru binecunoscut pentru cultivarea și recoltarea pepenilor verzi în Paraguay."]},"capitan-bado-cities-v2":{"i":"/poi-images/capitan-bado-cities-v2.webp","s":"Înconjurat de păduri adânci și munții Amambay, orașul se învecinează direct cu Coronel Sapucaia din Brazilia.","f":["Numit după un celebru comandant din Războiul Triplei Alianțe.","Fondată inițial sub numele Ñu Verá."]},"curuguaty-cities-v2":{"i":"/poi-images/curuguaty-cities-v2.webp","s":"Amplasat în mijlocul vegetației luxuriante, acest sit istoric a servit drept ultima capitală în timpul retragerii lui López.","f":["Fondată în 1712 sub numele de Villa de San Isidro Labrador de los Reyes Católicos de Curuguaty.","Regiunea este bogată în resurse de lemn și yerba mate."]},"eusebio-ayala-cities-v2":{"i":"/poi-images/eusebio-ayala-cities-v2.webp","s":"Venerat la nivel național pentru coacerea chipa, în special a celebrului 'chipa barrero', care atrage vizitatori din întreaga regiune.","f":["A fost redenumit în onoarea fostului președinte Eusebio Ayala.","Numele original a fost San Roque de Barrero Grande."]},"piribebuy-cities-v2":{"i":"/poi-images/piribebuy-cities-v2.webp","s":"Un municipiu intersectat de dealuri și pârâuri, cunoscut pentru rezistența puternică în marele război din 1869.","f":["Găzduiește un muzeu istoric care păstrează artefacte de război.","În fiecare an sărbătoresc aici Festivalul Poncho-ului Dulce (Festival del Poncho Para'i)."]},"independencia-cities-v2":{"i":"/poi-images/independencia-cities-v2.webp","s":"Puternic influențat de imigranții germani și elvețieni, acest loc este cunoscut pentru podgoriile sale și pentru flerul bavarez din Ybytyruzú.","f":["Aici se sărbătorește adesea un Oktoberfest local.","Fondată în 1919 de imigranți din Pădurea Neagră și Baden."]},"carapegua-cities-v2":{"i":"/poi-images/carapegua-cities-v2.webp","s":"Fiind capitala textilă a Paraguayului, orașul furnizează țării hamace, poncho-uri și țesături țesute manual.","f":["Artizanii își țes bunurile în mare parte din bumbac domestic.","A fost fondată în 1725 de Martín de Barúa."]},"san-ignacio-guazu-cities-v2":{"i":"/poi-images/san-ignacio-guazu-cities-v2.webp","s":"Fiind cea mai veche reducere iezuită din Paraguay, orașul oferă astăzi perspective valoroase asupra artei baroc din acea epocă.","f":["Fondată în 1609 de părinții Marcial de Lorenzana și Francisco de San Martín.","Găzduiește un muzeu remarcabil cu sculpturi indigene-baroc."]},"loma-plata-cities-v2":{"i":"/poi-images/loma-plata-cities-v2.webp","s":"Fiind centrul coloniei menonite din Menno, așezarea se remarcă prin creșterea modernă a laptelui în Chaco uscat.","f":["Fondată în 1927, a fost prima așezare menonită din Chaco-ul paraguayan.","Oferă tururi istorice care ilustrează viața pionierilor."]},"mariscal-estigarribia-cities-v2":{"i":"/poi-images/mariscal-estigarribia-cities-v2.webp","s":"Situat adânc în teritoriul inospitalier al Chaco, orașul a fost un punct central de apărare în timpul războiului de la Chaco.","f":["Are una dintre cele mai lungi și mai moderne piste din Paraguay.","Astăzi servește ca un important centru regional pentru culturile indigene."]},"j-augusto-saldivar-cities-v2":{"i":"/poi-images/j-augusto-saldivar-cities-v2.webp","s":"Cunoscut inițial sub numele de Posta Leiva, acest oraș este astăzi un important centru al producției de legume.","f":["Fondat în 1985 ca un district independent.","Aprovizionează zilnic capitala Asunción cu produse agricole proaspete."]},"san-alberto-cities-v2":{"i":"/poi-images/san-alberto-cities-v2.webp","s":"Fiind unul dintre cele mai importante orașe agricole din regiune, este adesea denumită și capitala paraguayană a boabelor de soia.","f":["Populația este formată în mare parte din imigranți de origine braziliană.","Aici se desfășoară în fiecare an Agrofest."]},"doctor-juan-leon-mallorquin-cities-v2":{"i":"/poi-images/doctor-juan-leon-mallorquin-cities-v2.webp","s":"Situat de-a lungul importantului Traseu 2, acest oraș poartă numele unui politician și avocat paraguayan.","f":["Fondată în anul 1958.","Economia locală este susținută în principal de întreprinderi agricole mici și mijlocii."]},"cambyreta-cities-v2":{"i":"/poi-images/cambyreta-cities-v2.webp","s":"Ca oraș vecin cu Encarnación, Cambyretá este popular pentru malurile sale frumoase ale râurilor și cartierele rezidențiale liniștite.","f":["Numele înseamnă 'Țara laptelui' în Guarani.","A fost recunoscut oficial ca municipiu pe 23 aprilie 1946."]},"san-pedro-del-parana-cities-v2":{"i":"/poi-images/san-pedro-del-parana-cities-v2.webp","s":"Unul dintre cele mai vechi orașe din Itapúa, caracterizat prin dealuri domoale, terenuri întinse și sporturi ecvestre tradiționale.","f":["Fondat în 1789 de guvernatorul spaniol Joaquín Alós y Brú.","Aici izvorăsc numeroși afluenți ai fluviului Tebicuary."]},"tomas-romero-pereira-cities-v2":{"i":"/poi-images/tomas-romero-pereira-cities-v2.webp","s":"Cunoscut popular ca Maria Auxiliadora, acest oraș este renumit pentru cultivarea intensivă a morcovilor.","f":["Municipiul a fost fondat la 22 septembrie 1983.","În fiecare an se sărbătorește aici marele festival național al morcovului."]},"hohenau-cities-v2":{"i":"/poi-images/hohenau-cities-v2.webp","s":"Un loc puternic influențat de imigranții germani, făcând parte din Coloniile Unite din sudul țării.","f":["Fondată în 1900 de coloniști care au venit în principal din sudul Braziliei.","Deseori menționată ca 'Mama Coloniilor' din regiune."]},"capitan-miranda-cities-v2":{"i":"/poi-images/capitan-miranda-cities-v2.webp","s":"Un municipiu multicultural din apropiere de Encarnación, cunoscut pentru horticultura sa excepțional de productivă.","f":["A fost co-fondat de imigranți ruși, ucraineni și polonezi.","Se autoproclamă cu mândrie capitala horticolă a Paraguayului."]},"obligado-cities-v2":{"i":"/poi-images/obligado-cities-v2.webp","s":"Fiind capitala industrială a regiunii, Obligado este un pilon important al producției de yerba mate.","f":["O parte a Coloniilor Unite, fondată în 1912.","Găzduiește sediul Cooperativa Colonias Unidas, o uriașă întreprindere agricolă."]},"bella-vista-cities-v2":{"i":"/poi-images/bella-vista-cities-v2.webp","s":"Acest centru pitoresc al industriei ceaiului de mate impresionează prin plantațiile sale mari și atmosfera liniștită.","f":["Cunoscută oficial drept 'Capitala Națională a Yerba Mate'.","Fondată în 1918 de pionierii germani."]},"caaguazu-cities-v2":{"i":"/poi-images/caaguazu-cities-v2.webp","s":"Odinioară renumit pentru pădurile sale masive și industria lemnului, acum este 'Capitala Lemnului' din țară.","f":["Fondată în anul 1844.","Mulți dintre artizanii locali realizează piese de mobilier tradițional de înaltă calitate."]},"j-eulogio-estigarribia-cities-v2":{"i":"/poi-images/j-eulogio-estigarribia-cities-v2.webp","s":"Cunoscut sub denumirea colocvială de Campo 9, orașul este inima industriei moderne a lactatelor din Paraguay.","f":["A fost puternic promovat de emigranții menoniți.","Are cea mai mare concentrație de fabrici de procesare a laptelui din țară."]},"repatriacion-cities-v2":{"i":"/poi-images/repatriacion-cities-v2.webp","s":"Această comunitate agricolă a fost creată inițial pentru a facilita întoarcerea emigranților paraguayeni.","f":["Fondată oficial în 1963, sub președintele Stroessner.","Sprijinită economic de cultivarea de manioc, porumb și bumbac."]},"san-jose-de-los-arroyos-cities-v2":{"i":"/poi-images/san-jose-de-los-arroyos-cities-v2.webp","s":"Amplasat între pâraie și câmpuri, acest oraș liniștit este bogat în folclor și muzică tradițională.","f":["Orașul este deosebit de cunoscut pentru delicioas const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;

// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
