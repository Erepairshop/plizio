const POI_CARD={"concepcion-cities-v2":{"i":"/poi-images/concepcion-cities-v2.webp","s":"An important port city in northern Paraguay, founded in 1773 and serving as a commercial hub for agriculture.","f":["Known for its many well-preserved Italian-style buildings.","An important transshipment point for beef and timber."]},"san-antonio-cities-v2":{"i":"/poi-images/san-antonio-cities-v2.webp","s":"Located on the banks of the Paraguay River, this industrial city offers several important inland ports for the country.","f":["Has facilities for the export of grains and soybeans.","Founded in 1890, it experienced a boom due to the meatpacking industry."]},"villarrica-cities-v2":{"i":"/poi-images/villarrica-cities-v2.webp","s":"The city at the foot of the Ybytyruzú Mountains is often called the 'Wandering City' due to its turbulent history.","f":["Has been moved seven times since its founding in 1570.","Center of Paraguayan academic and musical culture."]},"santa-rita-cities-v2":{"i":"/poi-images/santa-rita-cities-v2.webp","s":"As an agricultural center strongly influenced by Brazilian settlers, the city is considered one of the richest in the country.","f":["Founded in the year 1973.","Hosts the Expo Santa Rita, a massive agricultural fair."]},"asuncion-cities-v2":{"i":"/poi-images/asuncion-cities-v2.webp","s":"Founded in 1537, the capital of Paraguay is the most important economic and cultural center of the country on the banks of the Paraguay River.","f":["The historical center is home to the Palacio de los López.","It is one of the oldest Spanish settlements in South America."]},"san-pedro-ycuamandiyu-cities-v2":{"i":"/poi-images/san-pedro-ycuamandiyu-cities-v2.webp","s":"The capital of the San Pedro department, founded in 1786, is surrounded by traditional agricultural estates.","f":["Plays a central role in yerba mate production.","Houses a remarkable cathedral from the colonial era."]},"caacupe-cities-v2":{"i":"/poi-images/caacupe-cities-v2.webp","s":"This spiritual erica.","f":["Founded in 1957 as Puerto Flor de Lis.","Located in the immediate vicinity of the massive Itaipu Dam."]},"aregua-cities-v2":{"i":"/poi-images/aregua-cities-v2.webp","s":"The picturesque city on the shores of Lake Ypacaraí is known nationwide for its pottery and strawberry cultivation.","f":["The Strawberry Festival takes place here every year in August.","Preserves charming colonial-style architectural houses from the 19th century."]},"pilar-cities-v2":{"i":"/poi-images/pilar-cities-v2.webp","s":"A quiet port city on the Paraguay River, valued for its cotton textile industry and historical buildings.","f":["Founded in 1779 by Pedro Melo de Portugal.","The city is home to the country's most important textile mill, Manufactura de Pilar."]},"pedro-juan-caballero-cities-v2":{"i":"/poi-images/pedro-juan-caballero-cities-v2.webp","s":"This border city shares a street with the Brazilian city of Ponta Porã and is a major commercial center.","f":["Founded in 1899 and named after an independence hero.","The economy is heavily based on cross-border tourism."]},"salto-del-guaira-cities-v2":{"i":"/poi-images/salto-del-guaira-cities-v2.webp","s":"Once home to spectacular waterfalls, the city is now a booming shopping destination on the Brazilian border.","f":["The famous waterfalls were flooded by the Itaipu Dam in 1982.","One of the fastest growing cities in Paraguay."]},"villa-hayes-cities-v2":{"i":"/poi-images/villa-hayes-cities-v2.webp","s":"The gateway to the Chaco region, named in honor of US President Rutherford B.","f":["Home to a historical museum and old colonial buildings.","Important steel production center in the country."]},"fuerte-olimpo-cities-v2":{"i":"/poi-images/fuerte-olimpo-cities-v2.webp","s":"This remote city in Alto Paraguay is idyllically situated on the Paraguay River and once protected the northern border.","f":["Founded in 1792 as Fuerte Borbón.","You can visit a cathedral built on a hill here."]},"filadelfia-cities-v2":{"i":"/poi-images/filadelfia-cities-v2.webp","s":"In the heart of the Gran Chaco, this city was founded in the 1930s by Mennonite immigrants from Russia.","f":["German is still widely spoken here due to its Mennonite roots.","The most important center of dairy and meat production in the Chaco."]},"luque-cities-v2":{"i":"/poi-images/luque-cities-v2.webp","s":"Famous for the production of filigree jewelry from gold and silver as well as handmade string instruments.","f":["The Silvio Pettirossi International Airport is located within the city.","It was briefly the capital of Paraguay in 1868 during the War of the Triple Alliance."]},"capiata-cities-v2":{"i":"/poi-images/capiata-cities-v2.webp","s":"One of the most populous cities in the metropolitan region, characterized by dense settlement and historical churches.","f":["The 18th-century Church of Our Lady of Candelaria is a highlight.","Originally created in 1640 as a Franciscan mission."]},"lambare-cities-v2":{"i":"/poi-images/lambare-cities-v2.webp","s":"Located directly south of the capital, the city offers the Cerro Lambaré, the top of which provides a magnificent view.","f":["Was officially elevated to an independent municipality in 1962.","Named after the legendary indigenous cacique Lambaré."]},"fernando-de-la-mora-cities-v2":{"i":"/poi-images/fernando-de-la-mora-cities-v2.webp","s":"A bustling commercial and residential city, named after one of the founding fathers of Paraguayan independence.","f":["Formerly known as Zevala-cué.","Was formally separated from San Lorenzo in 1939 and made into its own city."]},"limpio-cities-v2":{"i":"/poi-images/limpio-cities-v2.webp","s":"One of the oldest cities in the country, traditionally characterized by its karanday weaving for hats.","f":["Originally founded under the name San José de los Campos Limpios de Tapuá.","Plays a major role in handicraft tourism."]},"nemby-cities-v2":{"i":"/poi-images/nemby-cities-v2.webp","s":"A rapidly growing municipality southeast of the capital, where agriculture is gradually giving way to industry.","f":["Features the Cerro Ñemby, an old quarry that now serves as a recreation area.","Founded on August 2, 1899."]},"itaugua-cities-v2":{"i":"/poi-images/itaugua-cities-v2.webp","s":"Internationally known as the home of ñandutí, the characteristic spiderweb-like embroidery.","f":["The annual Ñandutí Festival attracts thousands of visitors.","It was founded in 1728 by Martín de Barúa."]},"mariano-roque-alonso-cities-v2":{"i":"/poi-images/mariano-roque-alonso-cities-v2.webp","s":"The city is best known as the location for the large annual international agricultural and industrial fair.","f":["The Puente Remanso bridge connects the city with the Chaco region.","Founded in 1945 from parts of San Lorenzo and Limpio."]},"villa-elisa-cities-v2":{"i":"/poi-images/villa-elisa-cities-v2.webp","s":"A quiet urban enclave in the metropolitan area shaped by Danish immigration in the late 19th century.","f":["Founded in 1899 by Scandinavian settlers.","An important industrial center, partly due to the state oil company Petropar."]},"ypane-cities-v2":{"i":"/poi-images/ypane-cities-v2.webp","s":"Known as the 'Historical City' because ancient battles and historical events took place here.","f":["The name means 'flowing water' in Guaraní.","The town preserves many monuments from the War of the Triple Alliance."]},"villeta-cities-v2":{"i":"/poi-images/villeta-cities-v2.webp","s":"As an industrial powerhouse on the Paraguay River, the city has significant port and cement facilities.","f":["Founded in 1714 by Juan Gregorio Bazán de Pedraza.","Has a port through which much of Paraguayan soy is exported."]},"guarambare-cities-v2":{"i":"/poi-images/guarambare-cities-v2.webp","s":"Surrounded by sugarcane plantations, this city is historically famous for its sugar factories.","f":["Founded in 1538 by the conqueror Domingo Martínez de Irala.","The patron saint of the city is the Virgin of the Nativity."]},"ypacarai-cities-v2":{"i":"/poi-images/ypacarai-cities-v2.webp","s":"The birthplace of the legendary song 'Recuerdos de Ypacaraí' attracts many musicians and tourists because of its great lake.","f":["The important Ypacaraí Lake Festival is held here.","The local train station was historically a key station on the Carlos Antonio López railway."]},"presidente-franco-cities-v2":{"i":"/poi-images/presidente-franco-cities-v2.webp","s":"Located at the confluence of the Paraná and Iguazú rivers, it is home to the stunning Saltos del Monday waterfalls.","f":["Founded in 1929 and named after Manuel Franco.","Important for tourism in the tri-border region."]},"minga-guazu-cities-v2":{"i":"/poi-images/minga-guazu-cities-v2.webp","s":"Founded in the 1950s through a cooperative system, this agriculturally thriving city is known for its industry.","f":["The name means 'Great community work' in Guaraní.","Home to the Guaraní International Airport."]},"hernandarias-cities-v2":{"i":"/poi-images/hernandarias-cities-v2.webp","s":"Proudly called the 'Latin American Capital of Energy' since much of the Itaipu Dam is located here.","f":["The oldest city in the department, formerly called Tacurupucu.","The Itaipu Reservoir is used here for sports and recreational purposes."]},"coronel-bogado-cities-v2":{"i":"/poi-images/coronel-bogado-cities-v2.webp","s":"The self-proclaimed capital of chipa, Paraguay's famous corn and cheese bread, attracting visitors with its traditional bakery goods.","f":["A special festival for chipa bread is held here every year.","Originally founded under the name Paraje Ka'i Puente."]},"san-estanislao-cities-v2":{"i":"/poi-images/san-estanislao-cities-v2.webp","s":"Colloquially known as Santaní, this historical Jesuit reduction preserves its valuable architecture to this day.","f":["Founded by the Jesuits in 1749.","During the war, Mariscal López used a local Jesuit house as his headquarters."]},"horqueta-cities-v2":{"i":"/poi-images/horqueta-cities-v2.webp","s":"Located at a crossroads of historical routes, the city derives its name from the Spanish word for a 'fork in the road'.","f":["Founded in the year 1793.","It is a well-known center for the cultivation and harvesting of watermelons in Paraguay."]},"capitan-bado-cities-v2":{"i":"/poi-images/capitan-bado-cities-v2.webp","s":"Surrounded by deep forests and the Amambay Mountains, the city borders directly on Coronel Sapucaia in Brazil.","f":["Named after a famous commander of the War of the Triple Alliance.","Originally founded under the name Ñu Verá."]},"curuguaty-cities-v2":{"i":"/poi-images/curuguaty-cities-v2.webp","s":"Nestled amidst lush vegetation, this historical site served as the last capital during López's retreat.","f":["Founded in 1712 as Villa de San Isidro Labrador de los Reyes Católicos de Curuguaty.","The region is rich in timber resources and yerba mate."]},"eusebio-ayala-cities-v2":{"i":"/poi-images/eusebio-ayala-cities-v2.webp","s":"Nationally revered for baking chipa, especially the famous 'chipa barrero', which attracts visitors from all over the region.","f":["It was renamed in honor of former President Eusebio Ayala.","The original name was San Roque de Barrero Grande."]},"piribebuy-cities-v2":{"i":"/poi-images/piribebuy-cities-v2.webp","s":"A municipality crisscrossed by hills and streams, known for its strong resistance in the great war of 1869.","f":["Houses a historical museum preserving war artifacts.","Every year they celebrate the Festival of the Sweet Poncho (Festival del Poncho Para'i) here."]},"independencia-cities-v2":{"i":"/poi-images/independencia-cities-v2.webp","s":"Strongly influenced by German and Swiss immigrants, this place is known for its vineyards and Bavarian flair in the Ybytyruzú.","f":["A local Oktoberfest is often celebrated here.","Founded in 1919 by immigrants from the Black Forest and Baden."]},"carapegua-cities-v2":{"i":"/poi-images/carapegua-cities-v2.webp","s":"As the textile capital of Paraguay, the city supplies the country with hammocks, ponchos, and hand-woven fabrics.","f":["The artisans mostly weave their goods from domestic cotton.","It was founded in 1725 by Martín de Barúa."]},"san-ignacio-guazu-cities-v2":{"i":"/poi-images/san-ignacio-guazu-cities-v2.webp","s":"As the oldest Jesuit reduction in Paraguay, the city today offers valuable insights into the Baroque art of that era.","f":["Founded in 1609 by Fathers Marcial de Lorenzana and Francisco de San Martín.","Houses an outstanding museum of indigenous-Baroque carvings."]},"loma-plata-cities-v2":{"i":"/poi-images/loma-plata-cities-v2.webp","s":"As the center of the Menno Mennonite colony, the settlement distinguishes itself with modern dairy farming in the dry Chaco.","f":["Founded in 1927, it was the first Mennonite settlement in the Paraguayan Chaco.","Offers historical tours that illustrate the life of the pioneers."]},"mariscal-estigarribia-cities-v2":{"i":"/poi-images/mariscal-estigarribia-cities-v2.webp","s":"Located deep in the inhospitable territory of the Chaco, the city was a central defense point during the Chaco War.","f":["Has one of the longest and most modern runways in Paraguay.","Today it serves as an important regional center for indigenous cultures."]},"j-augusto-saldivar-cities-v2":{"i":"/poi-images/j-augusto-saldivar-cities-v2.webp","s":"Originally known as Posta Leiva, this city is today an important center of vegetable production.","f":["Founded in 1985 as an independent district.","Supplies the capital Asunción with fresh agricultural products daily."]},"san-alberto-cities-v2":{"i":"/poi-images/san-alberto-cities-v2.webp","s":"As one of the most important agricultural cities in the region, it is also often referred to as the Paraguayan capital of soybeans.","f":["The population largely consists of immigrants of Brazilian origin.","The Agrofest takes place here every year."]},"doctor-juan-leon-mallorquin-cities-v2":{"i":"/poi-images/doctor-juan-leon-mallorquin-cities-v2.webp","s":"Located along the important Route 2, this city is named after a Paraguayan politician and lawyer.","f":["Founded in the year 1958.","The local economy is mainly supported by small and medium-sized agricultural enterprises."]},"cambyreta-cities-v2":{"i":"/poi-images/cambyreta-cities-v2.webp","s":"As a neighboring city of Encarnación, Cambyretá is popular for its beautiful riverbanks and quiet residential neighborhoods.","f":["The name means 'Land of Milk' in Guaraní.","Was officially recognized as a municipality on April 23, 1946."]},"san-pedro-del-parana-cities-v2":{"i":"/poi-images/san-pedro-del-parana-cities-v2.webp","s":"One of the oldest cities in Itapúa, characterized by rolling hills, expansive lands, and traditional equestrian sports.","f":["Founded in 1789 by the Spanish governor Joaquín Alós y Brú.","Numerous tributaries of the Tebicuary River originate here."]},"tomas-romero-pereira-cities-v2":{"i":"/poi-images/tomas-romero-pereira-cities-v2.webp","s":"Popularly known as Maria Auxiliadora, this city is famous for its intensive carrot cultivation.","f":["The municipality was founded on September 22, 1983.","Every year the great national carrot festival is celebrated here."]},"hohenau-cities-v2":{"i":"/poi-images/hohenau-cities-v2.webp","s":"A place strongly influenced by German immigrants, forming part of the United Colonies in the south of the country.","f":["Founded in 1900 by settlers who came predominantly from southern Brazil.","Often referred to as the 'Mother of the Colonies' in the region."]},"capitan-miranda-cities-v2":{"i":"/poi-images/capitan-miranda-cities-v2.webp","s":"A multicultural municipality near Encarnación, known for its exceptionally productive horticulture.","f":["It was co-founded by Russian, Ukrainian, and Polish immigrants.","Proudly calls itself the horticultural capital of Paraguay."]},"obligado-cities-v2":{"i":"/poi-images/obligado-cities-v2.webp","s":"As the industrial capital of the region, Obligado is an important pillar of yerba mate production.","f":["Part of the United Colonies, founded in 1912.","Houses the headquarters of the Cooperativa Colonias Unidas, a giant agricultural enterprise."]},"bella-vista-cities-v2":{"i":"/poi-images/bella-vista-cities-v2.webp","s":"This picturesque center of the mate tea industry impresses with its large plantations and quiet atmosphere.","f":["Officially known as the 'National Capital of Yerba Mate'.","Founded in 1918 by German pioneers."]},"caaguazu-cities-v2":{"i":"/poi-images/caaguazu-cities-v2.webp","s":"Formerly famous for its massive forests and timber industry, it is now the 'Capital of Wood' in the country.","f":["Founded in the year 1844.","Many of the local artisans make high-quality traditional pieces of furniture."]},"j-eulogio-estigarribia-cities-v2":{"i":"/poi-images/j-eulogio-estigarribia-cities-v2.webp","s":"Colloquially often referred to as Campo 9, the city is the heart of Paraguay's modern dairy industry.","f":["Was strongly promoted by Mennonite emigrants.","Has the largest concentration of dairy processing plants in the country."]},"repatriacion-cities-v2":{"i":"/poi-images/repatriacion-cities-v2.webp","s":"This agricultural community was originally created to facilitate the return of Paraguayan emigrants.","f":["Officially founded in 1963 under President Stroessner.","Economically supported by the cultivation of cassava, corn, and cotton."]},"san-jose-de-los-arroyos-cities-v2":{"i":"/poi-images/san-jose-de-los-arroyos-cities-v2.webp","s":"Nestled between streams and fields, this quiet town is rich in folklore and traditional music.","f":["The city is especially known for its delicious Sopa Paraguaya.","Founded in 1780 under the name San José de los Dos Arroyos."]},"capiibary-cities-v2":{"i":"/poi-images/capiibary-cities-v2.webp","s":"Surrounded by extensive pastures and farms, this place plays an important role in the San Pedro department.","f":["The name is derived from the Guaraní word for capybara.","Was recognized as a separate district in 1993."]},"chore-cities-v2":{"i":"/poi-images/chore-cities-v2.webp","s":"An agrarian center that has grown in recent years through diversification in agriculture.","f":["Particularly known for the cultivation of sesame and tobacco.","Founded in 1961."]},"santa-rosa-del-aguaray-cities-v2":{"i":"/poi-images/santa-rosa-del-aguaray-cities-v2.webp","s":"The fastest-growing city in the department, increasingly offering access to ecotourism, including the nearby Laguna Blanca.","f":["Received the status of its own city in 2002.","Laguna Blanca is a crystal-clear lake resting on a bed of fine sand."]},"yby-yau-cities-v2":{"i":"/poi-images/yby-yau-cities-v2.webp","s":"As a crucial junction between the northern departments and Brazil, wholesale and retail trade dominate here.","f":["Founded in the year 1984.","The name means 'Dark Earth' or 'Earth of the Beetle' in Guaraní."]},"vallemi-cities-v2":{"i":"/poi-images/vallemi-cities-v2.webp","s":"Located directly on the Paraguay River, this remote place is best known for its huge cement factory and mystical caves.","f":["The state cement plant Industria Nacional del Cemento is based here.","The caves in the area attract cavers."]},"bella-vista-norte-cities-v2":{"i":"/poi-images/bella-vista-norte-cities-v2.webp","s":"Located on the Apa River, which forms the natural border with Brazil, the city lives from forestry and border culture.","f":["Founded by the Jesuits in 1851.","Connected to the Brazilian city of Bela Vista by an international bridge."]},"katuete-cities-v2":{"i":"/poi-images/katuete-cities-v2.webp","s":"This modern agricultural powerhouse owes its prosperity to highly productive soy and wheat fields.","f":["The name means 'Certainly' or 'Positively' in Guaraní.","Was recognized as its own municipality in 1994."]},"puerto-de-asuncion-economic-v2":{"i":"/poi-images/puerto-de-asuncion-economic-v2.webp","s":"The most important river port in Paraguay, serving as a central hub for international trade.","f":["Located on the Paraguay River.","Important export point."]},"puerto-villeta-economic-v2":{"s":"An important industrial port south of Asunción, specialized in bulk cargo and agricultural exports.","f":["Specialized in agricultural products.","Relieves the port of Asunción."]},"puerto-san-antonio-economic-v2":{"s":"A private port complex in San Antonio, crucial for the shipment of grain and soybeans.","f":["Important for soy export.","Privately operated."]},"puerto-de-encarnacion-economic-v2":{"i":"/poi-images/puerto-de-encarnacion-economic-v2.webp","s":"A port on the Paraná River in the south of the country, important for trade with Argentina.","f":["Located on the Paraná River.","Borders Argentina."]},"puerto-de-pilar-economic-v2":{"i":"/poi-images/puerto-de-pilar-economic-v2.webp","s":"A deep-water port on the Paraguay River, navigable for larger ships almost all year round.","f":["Deep-water port.","Ensures export during low water periods."]},"puerto-de-concepcion-economic-v2":{"s":"An important river port in northern Paraguay, often used for the export of cement and agricultural products.","f":["Important for the northern region.","Transshipment point for cement."]},"puerto-fenix-economic-v2":{"i":"/poi-images/puerto-fenix-economic-v2.webp","s":"A modern, private cargo port in Mariano Roque Alonso, handling a large part of Asunción's container traffic.","f":["In Mariano Roque Alonso.","Modern container terminal."]},"puerto-caacupemi-economic-v2":{"i":"/poi-images/puerto-caacupemi-economic-v2.webp","s":"One of the leading private ports in Asunción, specialized in loading and unloading containers and vehicles.","f":["Private container port.","Important for vehicle imports."]},"terport-villeta-economic-v2":{"i":"/poi-images/terport-villeta-economic-v2.webp","s":"An ultra-modern port terminal in Villeta, featuring cutting-edge technology for efficient cargo handling on the Paraguay River.","f":["Ultra-modern terminal.","Efficient cargo handling."]},"itaipu-dam-industry-economic-v2":{"i":"/poi-images/itaipu-dam-industry-economic-v2.webp","s":"One of the largest hydroelectric plants in the world, operated by Paraguay and Brazil, providing much of Paraguay's energy.","f":["Binational project.","Enormous power production."]},"yacyreta-dam-industry-economic-v2":{"i":"/poi-images/yacyreta-dam-industry-economic-v2.webp","s":"A large binational hydroelectric plant on the Paraná River, managed jointly by Paraguay and Argentina.","f":["Located on the Paraná River.","Cooperation with Argentina."]},"acaray-power-plant-industry-economic-v2":{"i":"/poi-images/acaray-power-plant-industry-economic-v2.webp","s":"The only fully Paraguayan-owned hydroelectric plant, contributing to the country's energy supply and providing export power.","f":["National power plant.","Also produces for export."]},"acepar-steel-plant-economic-v2":{"s":"An important steel plant in Villa Hayes, playing a central role in Paraguay's heavy industry.","f":["In Villa Hayes.","Center of heavy industry."]},"inc-vallemi-industry-economic-v2":{"s":"The largest cement plant in the country (INC) in northern Paraguay, based on the region's limestone deposits.","f":["Largest cement factory.","Uses local limestone deposits."]},"villeta-industrial-park-economic-v2":{"i":"/poi-images/villeta-industrial-park-economic-v2.webp","s":"An extensive industrial area near Villeta, hosting numerous manufacturing and processing facilities.","f":["Near Villeta port.","Important production center."]},"hernandarias-industrial-zone-economic-v2":{"i":"/poi-images/hernandarias-industrial-zone-economic-v2.webp","s":"A growing industrial hub near the Itaipu Dam, benefiting from cheap power supply.","f":["Benefits from Itaipu power.","Fast-growing industrial area."]},"cde-maquila-zone-economic-v2":{"i":"/poi-images/cde-maquila-zone-economic-v2.webp","s":"Industrial area in Ciudad del Este benefiting from Paraguay's maquila law, producing mainly for export to Brazil.","f":["Production for export.","Part of the maquila system."]},"guarani-industrial-park-economic-v2":{"i":"/poi-images/guarani-industrial-park-economic-v2.webp","s":"A strategically located industrial park in Minga Guazú, attracting logistics and manufacturing companies.","f":["In Minga Guazú.","Focus on logistics and production."]},"panambi-industrial-park-economic-v2":{"i":"/poi-images/panambi-industrial-park-economic-v2.webp","s":"A modern complex in Villeta, bringing together local and international industrial companies to create synergies.","f":["Promotes corporate synergies.","Modern industrial site."]},"cervepar-brewery-economic-v2":{"i":"/poi-images/cervepar-brewery-economic-v2.webp","s":"One of Paraguay's largest and most important breweries, located in Ypané, with a long tradition in beverage production.","f":["Largest brewery in the country.","Located in Ypané."]},"frigorifico-concepcion-economic-v2":{"i":"/poi-images/frigorifico-concepcion-economic-v2.webp","s":"One of Paraguay's largest meat processing companies, playing a key role in beef exports.","f":["Important for beef export.","Large processing capacity."]},"frigorifico-neuland-economic-v2":{"i":"/poi-images/frigorifico-neuland-economic-v2.webp","s":"A significant meat processing plant in Mariano Roque Alonso, operated by the Neuland Mennonite colony.","f":["Part of the Neuland colony.","High quality standards."]},"frigorifico-guarani-economic-v2":{"i":"/poi-images/frigorifico-guarani-economic-v2.webp","s":"A leading player in the Paraguayan meat industry, based in Fernando de la Mora.","f":["Leader in the meat industry.","Produces for domestic and export markets."]},"azucarera-paraguaya-economic-v2":{"i":"/poi-images/azucarera-paraguaya-economic-v2.webp","s":"One of the oldest and largest sugar mills in the country in Tebicuary, known for producing organic sugar.","f":["Produces organic sugar.","Historical sugar mill."]},"petropar-villa-elisa-economic-v2":{"i":"/poi-images/petropar-villa-elisa-economic-v2.webp","s":"The state-owned oil refinery in Villa Elisa, playing a strategic role in Paraguay's fuel supply.","f":["State refinery.","Important for fuel supply."]},"inpasa-san-pedro-economic-v2":{"i":"/poi-images/inpasa-san-pedro-economic-v2.webp","s":"A huge plant producing bioethanol from corn, contributing to the promotion of renewable energies in the country.","f":["Produces ethanol from corn.","Promotes renewable energy."]},"adm-paraguay-villeta-economic-v2":{"i":"/poi-images/adm-paraguay-villeta-economic-v2.webp","s":"A large Archer Daniels Midland facility in Villeta for processing and exporting soybeans and other oilseeds.","f":["Processes soybeans.","Multinational company."]},"cargill-paraguay-minga-guazu-economic-v2":{"i":"/poi-images/cargill-paraguay-minga-guazu-economic-v2.webp","s":"An important Cargill processing center in Minga Guazú, playing a key role in the country's agribusiness.","f":["Agribusiness center.","Located in Minga Guazú."]},"bunge-paraguay-san-antonio-economic-v2":{"s":"A major Bunge facility in San Antonio, focusing on trading and processing agricultural commodities.","f":["Focus on agricultural commodities.","Located in San Antonio."]},"ldc-villeta-economic-v2":{"s":"A Louis Dreyfus Company facility in Villeta, facilitating the export of Paraguayan agricultural products to global markets.","f":["Global agricultural merchant.","Location in Villeta."]},"santisima-trinidad-parana-history-v2":{"i":"/poi-images/santisima-trinidad-parana-history-v2.webp","s":"This impressive ruin was once one of the largest Jesuit missions in South America.","f":["Founded in the year 1706.","UNESCO World Heritage since 1993."]},"jesus-tavarangue-history-v2":{"i":"/poi-images/jesus-tavarangue-history-v2.webp","s":"An unfinished but architecturally unique Jesuit mission in Paraguay.","f":["Founded in 1685.","Shows Moorish architectural influences."]},"panteon-nacional-heroes-history-v2":{"i":"/poi-images/panteon-nacional-heroes-history-v2.webp","s":"A sacred site in Asunción where Paraguay's great historical figures rest.","f":["Construction began in 1863.","It was only completed in 1936."]},"casa-independencia-history-v2":{"i":"/poi-images/casa-independencia-history-v2.webp","s":"This colonial building was the secret meeting place for planning Paraguay's independence.","f":["Built in the year 1772.","Important site of the 1811 revolution."]},"palacio-lopez-history-v2":{"i":"/poi-images/palacio-lopez-history-v2.webp","s":"The official seat of the government and the President of the Republic of Paraguay.","f":["Construction began in 1857.","Bombarded in the Triple Alliance War."]},"ruinas-humaita-history-v2":{"i":"/poi-images/ruinas-humaita-history-v2.webp","s":"Remains of a massive fortress destroyed during the War of the Triple Alliance.","f":["Known as the 'Sevastopol of South America'.","Once the strongest river fortress."]},"fortin-boqueron-history-v2":{"i":"/poi-images/fortin-boqueron-history-v2.webp","s":"Site of the first major battle of the Chaco War between Bolivia and Paraguay.","f":["Battle took place in 1932.","Paraguayan troops won."]},"cabildo-asuncion-history-v2":{"s":"The former government house now serves as a major cultural center of the republic.","f":["Built in 1537.","Was the centerpiece of colonial power."]},"catedral-metropolitana-asuncion-history-v2":{"i":"/poi-images/catedral-metropolitana-asuncion-history-v2.webp","s":"The country's most important Catholic church with an impressive neoclassical design.","f":["Completed in the 19th century.","Features an ornate silver altar."]},"iglesia-san-buenaventura-yaguaron-history-v2":{"i":"/poi-images/iglesia-san-buenaventura-yaguaron-history-v2.webp","s":"One of the most magnificent Franciscan churches in South America, famous for its wood carvings.","f":["Built between 1755 and 1772.","Does not have an exterior steeple."]},"campamento-cerro-leon-history-v2":{"i":"/poi-images/campamento-cerro-leon-history-v2.webp","s":"Former military camp where Francisco Solano López trained troops for the Republic of Paraguay.","f":["Established let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
