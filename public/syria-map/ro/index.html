t în 1999.","Are o capacitate de 630 de megawați."]},"baath-dam-economic-v2":{"i":"/poi-images/baath-dam-economic-v2.webp","s":"Un baraj de reglare pe Eufrat, sub Barajul Tabqa, utilizat pentru generarea de energie și controlul debitului de apă.","f":["Generează 81 de megawați de energie electrică.","Lucrările de construcție s-au încheiat în 1986."]},"omar-oil-field-economic-v2":{"i":"/poi-images/omar-oil-field-economic-v2.webp","s":"Cel mai mare și mai productiv câmp petrolier din Siria, situat în guvernoratul Deir ez-Zor, aproape de granița cu Irakul.","f":["A fost descoperit în anii 1980.","Are o importanță strategică pentru economie."]},"conoco-gas-plant-economic-v2":{"i":"/poi-images/conoco-gas-plant-economic-v2.webp","s":"Una dintre cele mai mari uzine de procesare a gazelor din Siria, situată în estul țării, care pregătește gaze naturale pentru generarea de energie.","f":["Procesează gazele din câmpurile petroliere înconjurătoare.","Situată în guvernoratul Deir ez-Zor."]},"shaer-gas-field-economic-v2":{"i":"/poi-images/shaer-gas-field-economic-v2.webp","s":"Un câmp important de gaze naturale în deșertul sirian, lângă Palmira, crucial pentru aprovizionarea cu energie a vestului Siriei.","f":["Este una dintre cele mai mari rezerve de gaze din țară.","Aprovizionează centralele electrice din Homs și Damasc."]},"khunayfis-phosphate-mine-economic-v2":{"i":"/poi-images/khunayfis-phosphate-mine-economic-v2.webp","s":"Una dintre cele mai importante mine din Siria pentru extracția fosfatului, care este un export principal al economiei siriene.","f":["Situată la sud-vest de Palmira.","Produce fosfat brut pentru îngrășăminte."]},"al-sharqiyeh-phosphate-mine-economic-v2":{"i":"/poi-images/al-sharqiyeh-phosphate-mine-economic-v2.webp","s":"O vastă zonă de extracție a rocii fosfatice în deșertul central sirian, strâns legată de rețeaua feroviară.","f":["Printre cele mai mari mine de fosfat din Orientul Mijlociu.","Modernizată prin investiții rusești."]},"adra-industrial-city-economic-v2":{"i":"/poi-images/adra-industrial-city-economic-v2.webp","s":"Un complex industrial uriaș la nord-est de Damasc, care găzduiește mii de fabrici și ateliere din diverse sectoare.","f":["Una dintre cele mai mari zone industriale din Siria.","Axată pe textile, produse chimice și alimente."]},"sheikh-najjar-industrial-city-economic-v2":{"i":"/poi-images/sheikh-najjar-industrial-city-economic-v2.webp","s":"Inima industrială a orașului Alep și unul dintre cele mai importante centre economice ale Siriei, cunoscut pentru producția sa textilă și farmaceutică.","f":["Include mii de unități de producție.","Motor al economiei siriene de export înainte de război."]},"hassia-industrial-city-economic-v2":{"i":"/poi-images/hassia-industrial-city-economic-v2.webp","s":"O zonă industrială situată strategic la sud de Homs, specializată în industria grea și asamblarea auto.","f":["Fondată pentru a promova descentralizarea economică.","Găzduiește facilități de prelucrare a metalelor."]},"al-thaim-oil-field-economic-v2":{"i":"/poi-images/al-thaim-oil-field-economic-v2.webp","s":"Un câmp petrolier important la sud de Deir ez-Zor, care aduce o contribuție semnificativă la producția de petrol sirian.","f":["Câmpul este activ încă din anii 1980.","Situat într-un mediu deșertic."]},"jbissa-gas-field-economic-v2":{"i":"/poi-images/jbissa-gas-field-economic-v2.webp","s":"Unul dintre cele mai vechi și mai mari câmpuri de gaze naturale din Siria, în guvernoratul Al-Hasakah, care include și o uzină proprie de procesare a gazelor.","f":["Produce în principal gaze naturale dulci.","Aprovizionează rețeaua națională de conducte."]},"suwaydiya-oil-field-economic-v2":{"i":"/poi-images/suwaydiya-oil-field-economic-v2.webp","s":"Un câmp petrolier uriaș în extremitatea nord-estică a Siriei, unul dintre cele mai vechi câmpuri în funcțiune din țară.","f":["Descoperit la sfârșitul anilor 1950.","Produce țiței greu."]},"rumeilan-oil-field-economic-v2":{"i":"/poi-images/rumeilan-oil-field-economic-v2.webp","s":"Un complex extins de câmpuri petroliere în regiunea Al-Hasakah, format din sute de sonde active.","f":["Include peste 1.300 de sonde de petrol.","Cel mai important centru petrolier din regiunea Jazira."]},"zara-power-plant-economic-v2":{"i":"/poi-images/zara-power-plant-economic-v2.webp","s":"O centrală termică majoră în provincia Hama, alimentată cu gaze naturale, care contribuie important la aprovizionarea națională cu energie electrică.","f":["Construită cu sprijin internațional.","Situată strategic în centrul Siriei."]},"sy-krak-des-chevaliers-history-v2":{"i":"/poi-images/sy-krak-des-chevaliers-history-v2.webp","s":"Unul dintre cele mai bine conservate castele ale cruciaților din lume.","f":["A fost extins considerabil în secolul al XII-lea.","A căzut în mâinile sultanului mameluc Baibars în 1271."]},"sy-aleppo-citadel-history-v2":{"i":"/poi-images/sy-aleppo-citadel-history-v2.webp","s":"Un palat fortificat masiv în centrul uneia dintre cele mai vechi orașe locuite continuu din lume.","f":["Se află pe un deal artificial înalt de 50 de metri.","A fost folosită de ayyubizi, mameluci și otomani."]},"sy-umayyad-mosque-history-v2":{"i":"/poi-images/sy-umayyad-mosque-history-v2.webp","s":"Construită în secolul al VIII-lea, această moschee din Damasc se bazează pe fundațiile unui templu roman.","f":["Construită sub califul al-Walid I.","Mozaicurile aurii prezintă peisaje paradisiace."]},"sy-apamea-history-v2":{"i":"/poi-images/sy-apamea-history-v2.webp","s":"Odată o metropolă antică înfloritoare, cunoscută pentru Marea sa Colonadă lungă de aproape doi kilometri.","f":["Strada principală este mărginită de sute de coloane.","A fost fondată de Seleucus I Nicator."]},"sy-bosra-amphitheatre-history-v2":{"i":"/poi-images/sy-bosra-amphitheatre-history-v2.webp","s":"Un amfiteatru excepțional de bine conservat din secolul al II-lea, construit din bazalt negru.","f":["Poate găzdui aproximativ 15.000 de spectatori.","Acustica sa este excelentă până în ziua de azi."]},"sy-ebla-history-v2":{"i":"/poi-images/sy-ebla-history-v2.webp","s":"Rămășițele unei civilizații antice, faimoasă pentru descoperirea a mii de tăblițe cuneiforme.","f":["Tăblițele de la Ebla au fost descoperite în 1974.","A fost un regat sirian major în mileniul III î.Hr."]},"sy-ugarit-history-v2":{"i":"/poi-images/sy-ugarit-history-v2.webp","s":"Acest oraș-port din Epoca Bronzului este locul unde a fost descoperit cel mai vechi alfabet cunoscut din lume.","f":["Alfabetul ugaritic are 30 de semne cuneiforme.","A fost distrus de popoarele mării în secolul al XII-lea î.Hr."]},"sy-saladin-castle-history-v2":{"i":"/poi-images/sy-saladin-castle-history-v2.webp","s":"O fortăreață montană bizantină și mai târziu cruciată, săpată adânc într-o fisură naturală de stâncă.","f":["Un șanț adânc de 28 de metri a fost tăiat în stâncă.","Un ac de stâncă distinctiv de 18 metri înălțime stă în mijlocul șanțului."]},"sy-mari-history-v2":{"i":"/poi-images/sy-mari-history-v2.webp","s":"Un fost oraș mesopotamian pe fluviul Eufrat, care odinioară controla comerțul profitabil dintre Sumer și Levant.","f":["A fost distrus de Hammurabi în secolul al XVIII-lea î.Hr.","Palatul avea peste 300 de camere."]},"sy-amrit-history-v2":{"i":"/poi-images/sy-amrit-history-v2.webp","s":"Un sit antic fenician de excavații lângă coastă, care prezintă un templu unic sculptat în stâncă, înconjurat de un bazin cu apă.","f":["Unul dintre puținele exemple de arhitectură feniciană intactă.","Include rămășițele unui stadion antic."]},"sy-margat-history-v2":{"i":"/poi-images/sy-margat-history-v2.webp","s":"O fortăreață din bazalt negru a Cavalerilor Ospitalieri, care se află pe un vulcan stins și privește spre Marea Mediterană.","f":["A fost capturat de Sultanul Qalawun în 1285.","S-a considerat mult timp inexpugnabil datorită rezervelor sale enorme."]},"sy-resafa-history-v2":{"i":"/poi-images/sy-resafa-history-v2.webp","s":"Un zid de oraș bizantin din gips fin în mijlocul deșertului sirian.","f":["Avea cisterne subterane uriașe pentru alimentarea cu apă.","De asemenea, cunoscut sub numele de Sergiopolis în epoca bizantină."]},"sy-qasr-al-hayr-al-sharqi-history-v2":{"i":"/poi-images/sy-qasr-al-hayr-al-sharqi-history-v2.webp","s":"Două castele ale deșertului umayyade care erau inițial moșii agricole și caravanseraiuri.","f":["Construit în anul 728 de califul Hisham.","A servit ca avanpost pe rutele caravanelor."]},"sy-serjilla-history-v2":{"i":"/poi-images/sy-serjilla-history-v2.webp","s":"Cea mai bine conservată dintre așa-numitele Orașe Moarte din Siria.","f":["Are o baie romană intactă și prese de măsline.","A fost abandonat în secolul al VII-lea din motive necunoscute."]},"sy-al-raqqah-wall-history-v2":{"i":"/poi-images/sy-al-raqqah-wall-history-v2.webp","s":"Părți mari din zidul istoric al orașului și masiva Bab Baghdad (Poarta Bagdadului).","f":["Califul al-Mansur a ordonat construcția în 772.","Zidul era alcătuit din cărămizi arse."]},"sy-temple-of-jupiter-history-v2":{"i":"/poi-images/sy-temple-of-jupiter-history-v2.webp","s":"Rămășițele unui templu roman gigantic care domina odată centrul Damascului.","f":["Construcția a început sub împăratul Augustus.","Mai târziu, o bazilică creștină a fost construită în ruinele sale."]},"sy-damascus-citadel-history-v2":{"i":"/poi-images/sy-damascus-citadel-history-v2.webp","s":"O citadelă complet plană, construită nu pe un deal, ci la același nivel cu restul orașului vechi.","f":["A fost începută de conducătorul selgiuc Atsiz bin Uwaq în 1076.","Doar una dintre cele 14 porți originale s-a păstrat complet."]},"sy-dura-europos-history-v2":{"i":"/poi-images/sy-dura-europos-history-v2.webp","s":"Un oraș de graniță multicultural pe Eufrat, pentru care au luptat persanii și romanii.","f":["Este numit 'Pompeiul deșertului' datorită stării sale de conservare.","A fost cucerit de sasanizi în jurul anului 256 și apoi abandonat."]},"sy-hama-norias-history-v2":{"i":"/poi-images/sy-hama-norias-history-v2.webp","s":"Roți uriașe de apă din lemn pe râul Orontes, ale căror origini datează din Imperiul Bizantin.","f":["Din cele peste 30 de roți odinioară, 17 s-au păstrat.","Cea mai mare roată, al-Mohammediyeh, are un diametru de 21 de metri."]},"azem-palace-landmarks-v2":{"i":"/poi-images/azem-palace-landmarks-v2.webp","s":"Palatul Azem din orașul vechi al Damascului a fost construit în 1749 ca reședință a guvernatorului otoman și este o capodoperă a arhitecturii islamice.","f":["A fost construit din pietre albe și negre alternate (Ablaq).","Astăzi găzduiește Muzeul de Artă și Tradiții Populare."]},"national-museum-damascus-landmarks-v2":{"i":"/poi-images/national-museum-damascus-landmarks-v2.webp","s":"Cel mai important muzeu arheologic din Siria, care prezintă mii de ani de istorie, de la preistorie până în epoca islamică.","f":["Fațada provine de la castelul deșertic omeyad Qasr al-Hayr al-Gharbi.","Găzduiește alfabetul de la Ugarit, unul dintre cele mai vechi din lume."]},"tekkiye-mosque-landmarks-v2":{"i":"/poi-images/tekkiye-mosque-landmarks-v2.webp","s":"Un complex impresionant de moschei otomane din Damasc, proiectat de faimosul arhitect Mimar Sinan în secolul al XVI-lea.","f":["Complexul a fost construit din ordinul sultanului Soliman Magnificul.","A servit cândva ca adăpost pentru pelerinii aflați în drum spre Mecca."]},"khan-asad-pasha-landmarks-v2":{"i":"/poi-images/khan-asad-pasha-landmarks-v2.webp","s":"Cel mai mare caravanserai din orașul vechi al Damascului, faimos pentru cele nouă cupole spectaculoase și fațada din piatră cu dungi.","f":["A fost comandat în 1751 de As'ad Pasha al-Azem.","Clădirea este un exemplu excelent al arhitecturii din perioada otomană târzie."]},"sayyidah-zaynab-mosque-landmarks-v2":{"i":"/poi-images/sayyidah-zaynab-mosque-landmarks-v2.webp","s":"Un important sanctuar șiit lângă Damasc, care găzduiește mormântul lui Zaynab, nepoata profetului Mahomed.","f":["Cupola sa aurie și minaretele decorate cu faianță sunt o capodoperă arhitecturală.","Este destinația a milioane de pelerini în fiecare an."]},"sayyidah-ruqayya-mosque-landmarks-v2":{"i":"/poi-images/sayyidah-ruqayya-mosque-landmarks-v2.webp","s":"O moschee magnifică din Damasc care adăpostește mormântul fiicei imamului Hussein și este cunoscută pentru mozaicurile sale elaborate din oglinzi.","f":["Moscheea a fost construită în 1985 în stil arhitectural iranian.","Interiorul său este aproape complet acoperit cu oglinzi strălucitoare."]},"church-saint-simeon-stylites-landmarks-v2":{"i":"/poi-images/church-saint-simeon-stylites-landmarks-v2.webp","s":"Ruinele uneia dintre cele mai vechi biserici creștine care au supraviețuit în lume, construită pe locul unde a trăit Sfântul Simeon Stâlpnicul.","f":["Sfântul Simeon Stâlpnicul a petrecut 37 de ani pe un stâlp în acest loc.","Bazilica în formă de cruce datează din secolul al V-lea."]},"great-mosque-aleppo-landmarks-v2":{"i":"/poi-images/great-mosque-aleppo-landmarks-v2.webp","s":"Una dintre cele mai importante structuri islamice din Alep, situată adânc în inima vechilor souk-uri și considerată o bijuterie arhitecturală.","f":["A fost fondată în secolul al VIII-lea de către omeyazi.","Minaretul istoric selgiucizi din secolul al XI-lea a fost distrus în 2013."]},"monastery-saint-thecla-landmarks-v2":{"i":"/poi-images/monastery-saint-thecla-landmarks-v2.webp","s":"O mănăstire greco-ortodoxă în orașul montan pitoresc Maaloula, unde încă se vorbește un dialect al arameicii antice.","f":["Mănăstirea este construită în jurul unei peșteri în care Sfânta Tecla s-a refugiat.","Pelerinii vin să bea apă din izvorul sfânt."]},"saidnaya-monastery-landmarks-v2":{"i":"/poi-images/saidnaya-monastery-landmarks-v2.webp","s":"Un sanctuar de pelerinaj creștin maiestuos situat pe un munte, care, conform tradiției, a fost fondat de împăratul bizantin Iustinian I.","f":["Este cel mai important centru de pelerinaj pentru creștinii din Orientul Mijlociu după Ierusalim.","Mănăstirea adăpostește o icoană a Fecioarei Maria, atribuită Sfântului Luca."]},"qalat-jabar-landmarks-v2":{"i":"/poi-images/qalat-jabar-landmarks-v2.webp","s":"O ruină de castel impresionantă care se află astăzi maiestuos pe o insulă din Lacul Assad, înconjurată de ziduri masive de cărămidă.","f":["Înainte de construirea barajului Tabqa, castelul se afla pe o stâncă lângă Eufrat.","Minaretul impresionant din interior datează din secolul al XII-lea."]},"masyaf-castle-landmarks-v2":{"i":"/poi-images/masyaf-castle-landmarks-v2.webp","s":"O fortăreață istorică în munții de coastă, care a servit drept cartier general pentru legendarul ordin al Asasinilor în secolul al XII-lea.","f":["Castelul a fost apărat cu succes împotriva unui asediu al sultanului Saladin.","Este cunoscut la nivel mondial datorită seriei de jocuri video \"Assassin's Creed\"."]},"cathedral-of-tartus-landmarks-v2":{"i":"/poi-images/cathedral-of-tartus-landmarks-v2.webp","s":"Un exemplu remarcabil de arhitectură romanică a cruciaților, care adăpostește astăzi Muzeul Național din Tartus.","f":["A fost construită în secolul al XII-lea de către Cavalerii Templieri.","Biserica a fost transformată ulterior într-o moschee, apoi într-un muzeu."]},"arwad-citadel-landmarks-v2":{"i":"/poi-images/arwad-citadel-landmarks-v2.webp","s":"O fortăreață masivă pe o insulă în largul coastei siriene, care a fost ultimul bastion al cruciaților în Orientul Mijlociu înainte de căderea lor.","f":["Arwad este singura insulă locuită din apele siriene.","Fortăreața a fost folosită ca închisoare chiar și în secolul al XX-lea."]},"hejaz-railway-station-landmarks-v2":{"i":"/poi-images/hejaz-railway-station-landmarks-v2.webp","s":"Gara istorică din Damasc, faimoasă pentru tavanul său bogat decorat și vitraliile impresionante.","f":["A fost finalizată în 1917 în stil neo-islamic.","Calea ferată Hejaz avea scopul de a conecta Damascul cu locurile sfinte din Medina."]},"qasr-ibn-wardan-landmarks-v2":{"i":"/poi-images/qasr-ibn-wardan-landmarks-v2.webp","s":"Un complex de clădiri bizantine din secolul al VI-lea la marginea deșertului, format dintr-un palat, o biserică și o cazarmă.","f":["A fost construit de împăratul Iustinian I ca parte a liniei sale de apărare.","Stilul arhitectural unic, cu cărămizi de lut și bazalt, este puternic influențat de Constantinopol."]},"bab-sharqi-landmarks-v2":{"i":"/poi-images/bab-sharqi-landmarks-v2.webp","s":"Una dintre vechile porți ale orașului Damasc și singura care și-a păstrat aspectul original roman cu trei arcade.","f":["Poarta marchează capătul estic al \"Străzii Drepte\" menționate în Biblie.","Numele tradus literal înseamnă \"Poarta de Est\"."]},"mausoleum-of-saladin-landmarks-v2":{"i":"/poi-images/mausoleum-of-saladin-landmarks-v2.webp","s":"Locul de odihnă al faimosului sultan ayyubid Saladin, situat într-o mică grădină lângă Moscheea Omeyad.","f":["Mormântul adăpostește două sarcofage: unul din lemn și unul din marmură.","Sarcofagul de marmură a fost un cadou din partea împăratului german Wilhelm al II-lea."]},"deir-mar-musa-landmarks-v2":{"i":"/poi-images/deir-mar-musa-landmarks-v2.webp","s":"O mănăstire siriaco-catolică construită sus pe versanții abrupți ai unui defileu deșertic lângă Nabk.","f":["Mănăstirea este faimoasă pentru frescele sale prețioase din secolele al XI-lea și al XII-lea.","A fost revitalizată ca un loc pentru dialogul interreligios."]},"bab-al-faraj-clock-tower-landmarks-v2":{"i":"/poi-images/bab-al-faraj-clock-tower-landmarks-v2.webp","s":"Un punct de reper proeminent în centrul orașului Alep, construit la sfârșitul secolului al XIX-lea de către guvernatorul otoman.","f":["Arhitectura combină influențele otomane și europene.","Turnul a servit drept punct de orientare pentru populație cu privire la orele de rugăciune."]},"al-thawra-nature-reserve-life-v2":{"i":"/poi-images/al-thawra-nature-reserve-life-v2.webp","s":"O arie protejată importantă pe malul Lacului Assad, care găzduiește numeroase specii de păsări și o floră bogată.","f":["Situată pe malul lacului artificial Assad.","Un loc important de odihnă pentru păsările migratoare."]},"tishreen-park-life-v2":{"i":"/poi-images/tishreen-park-life-v2.webp","s":"Unul dintre cele mai mari parcuri publice din Damasc, oferind o oază verde în inima capitalei aglomerate.","f":["Unul dintre cele mai extinse parcuri din Damasc.","Un loc de întâlnire popular pentru familii."]},"al-shouh-and-al-arz-reserve-life-v2":{"i":"/poi-images/al-shouh-and-al-arz-reserve-life-v2.webp","s":"O zonă forestieră protejată în Munții de Coastă sirieni, cunoscută pentru populațiile sale vechi de cedru și brad.","f":["Găzduiește bradul cilicic aflat pe cale de dispariție.","Protejează unele dintre ultimele păduri de cedru din Siria."]},"ghab-plain-life-v2":{"i":"/poi-images/ghab-plain-life-v2.webp","s":"O regiune agricolă foarte fertilă, creată prin drenarea mlaștinilor de-a lungul râului Orontes.","f":["Anterior a fost o zonă mlăștinoasă extinsă.","A fost drenată la mijlocul secolului al XX-lea."]},"sabkhat-al-jabbul-life-v2":{"i":"/poi-images/sabkhat-al-jabbul-life-v2.webp","s":"O zonă umedă importantă și un lac sărat la sud-est de Alep, care servește drept zonă de iernare pentru flamingo.","f":["Unul dintre cele mai mari lacuri sărate naturale din Siria.","Găzduiește mii de flamingo roz în timpul iernii."]},"fronloq-forest-life-v2":{"i":"/poi-images/fronloq-forest-life-v2.webp","s":"O zonă forestieră pitorească aproape de granița cu Turcia, dominată de populații de stejar și pin.","f":["Cunoscută pentru pădurile sale dense de pini.","Oferă refugii importante pentru animalele sălbatice."]},"aleppo-public-park-life-v2":{"i":"/poi-images/aleppo-public-park-life-v2.webp","s":"Un spațiu verde istoric în Alep, care oferă locuitorilor un loc liniștit de relaxare departe de viața urbană.","f":["Cel mai mare parc public din Alep.","Are fântâni arteziene magnifice."]},"happy-land-park-life-v2":{"i":"/poi-images/happy-land-park-life-v2.webp","s":"Un parc de distracții popular lângă Damasc, care oferă familiilor o varietate de atracții și carusele.","f":["Situat const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});

const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
