header{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:#0a0a1f;border-bottom:1px solid #ffffff14;position:relative;z-index:5}

header .langs{display:flex;gap:.25rem}
.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.drag{cursor:grabbing}
.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}
.region:hover{fill:#2d3a78}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#000;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#60a5fa}
.poi.g-sight circle{fill:#fbbf24}
.poi.g-nature circle{fill:#22c55e}
.poi.g-history circle{fill:#c084fc}
.poi.g-industry circle{fill:#fb923c}
.poi.g-other circle{fill:#9ca3af}
.poi.dim{opacity:.18}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7;fill:#fff;opacity:1}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:#0d1230;border-top:1px solid #ffffff20;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -10px 40px #00000080}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a{display:flex;align-items:center;gap:.55rem;padding:.55rem .55rem;border-radius:8px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:active{background:#ffffff14}
.popup .list a .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.popup .list a .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup .list a .g{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}

.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}

.zoom button:active{background:#1a2240}

ntrum der lokalen Landwirtschaft."]},"quneitra-cities-v2":{"i":"/poi-images/quneitra-cities-v2.webp","s":"Quneitra war die Hauptstadt des gleichnamigen Gouvernements, die während des Jom-Kippur-Krieges weitgehend zerstört und nie vollständig wiederaufgebaut wurde.","f":["Liegt in den Golanhöhen.","Dient heute oft als Denkmal."]},"baniyas-refinery-economic-v2":{"i":"/poi-images/baniyas-refinery-economic-v2.webp","s":"Eine der größten Erdölraffinerien Syriens an der Mittelmeerküste, die für die Energieversorgung des Landes von zentraler Bedeutung ist.","f":["Wurde 1964 in Betrieb genommen.","Wichtiger Knotenpunkt für Rohölexporte."]},"homs-refinery-economic-v2":{"i":"/poi-images/homs-refinery-economic-v2.webp","s":"Die älteste Raffinerie Syriens, die im Zentrum des Landes liegt und hauptsächlich für den inländischen Kraftstoffbedarf produziert.","f":["1959 erbaut und mehrfach erweitert.","Versorgt die zentralen und südlichen Provinzen."]},"port-of-latakia-economic-v2":{"i":"/poi-images/port-of-latakia-economic-v2.webp","s":"Der größte und wichtigste Seehafen Syriens am Mittelmeer, der den Hauptteil des internationalen Handels des Landes abwickelt.","f":["Besitzt ein großes Containerterminal.","Wichtiges Tor für Importgüter."]},"port-of-tartus-economic-v2":{"i":"/poi-images/port-of-tartus-economic-v2.webp","s":"Der zweitgrößte syrische Hafen, der neben Handelsgütern auch eine strategisch wichtige russische Marinebasis beherbergt.","f":["Wichtig für den Export von Phosphat.","Beherbergt militärische und zivile Anlagen."]},"tabqa-dam-hydroelectric-plant-economic-v2":{"i":"/poi-images/tabqa-dam-hydroelectric-plant-economic-v2.webp","s":"Der größte Staudamm Syriens am Euphrat, der den Assad-See staut und einen erheblichen Teil der elektrischen Energie des Landes erzeugt.","f":["Baubeginn war 1968, Fertigstellung 1973.","Verfügt über acht Turbinen."]},"tishrin-dam-hydroelectric-plant-economic-v2":{"i":"/poi-images/tishrin-dam-hydroelectric-plant-economic-v2.webp","s":"Ein wichtiger Staudamm und Wasserkraftwerk am Euphrat, das sich nördlich der Tabqa-Talsperre in der Nähe von Manbidsch befindet.","f":["Wurde 1999 fertiggestellt.","Besitzt eine Kapazität von 630 Megawatt."]},"baath-dam-economic-v2":{"i":"/poi-images/baath-dam-economic-v2.webp","s":"Eine Regulierungstalsperre am Euphrat unterhalb des Tabqa-Staudamms, die zur Stromerzeugung und zur Kontrolle des Wasserflusses dient.","f":["Erzeugt 81 Megawatt Strom.","Die Bauarbeiten endeten 1986."]},"omar-oil-field-economic-v2":{"i":"/poi-images/omar-oil-field-economic-v2.webp","s":"Das größte und produktivste Ölfeld Syriens, gelegen im Gouvernement Deir ez-Zor in der Nähe der irakischen Grenze.","f":["Wurde in den 1980er Jahren entdeckt.","Hat eine strategische Bedeutung für die Wirtschaft."]},"conoco-gas-plant-economic-v2":{"i":"/poi-images/conoco-gas-plant-economic-v2.webp","s":"Eine der größten Gasverarbeitungsanlagen Syriens, die im Osten des Landes liegt und Erdgas für die Stromerzeugung aufbereitet.","f":["Verarbeitet Gas aus den umliegenden Ölfeldern.","Im Gouvernement Deir ez-Zor gelegen."]},"shaer-gas-field-economic-v2":{"i":"/poi-images/shaer-gas-field-economic-v2.webp","s":"Ein bedeutendes Erdgasfeld in der syrischen Wüste nahe Palmyra, das entscheidend für die Energieversorgung Westsyriens ist.","f":["Gehört zu den größten Gasreserven des Landes.","Versorgt die Kraftwerke in Homs und Damaskus."]},"khunayfis-phosphate-mine-economic-v2":{"i":"/poi-images/khunayfis-phosphate-mine-economic-v2.webp","s":"Eine der wichtigsten Minen Syriens zur Förderung von Phosphat, das ein Hauptexportgut der syrischen Wirtschaft darstellt.","f":["Befindet sich südwestlich von Palmyra.","Produziert Rohphosphat für Düngemittel."]},"al-sharqiyeh-phosphate-mine-economic-v2":{"i":"/poi-images/al-sharqiyeh-phosphate-mine-economic-v2.webp","s":"Ein riesiges Abbaugebiet für Phosphatgestein in der zentralen syrischen Wüste, eng angebunden an das Eisenbahnnetz.","f":["Zählt zu den größten Phosphatminen im Nahen Osten.","Wurde durch russische Investitionen modernisiert."]},"adra-industrial-city-economic-v2":{"i":"/poi-images/adra-industrial-city-economic-v2.webp","s":"Ein riesiger Industriekomplex nordöstlich von Damaskus, der Tausende von Fabriken und Werkstätten aus verschiedenen Sektoren beherbergt.","f":["Eine der größten Industriezonen in Syrien.","Schwerpunkt auf Textilien, Chemie und Lebensmittel."]},"sheikh-najjar-industrial-city-economic-v2":{"i":"/poi-images/sheikh-najjar-industrial-city-economic-v2.webp","s":"Das industrielle Herz von Aleppo und eines der wichtigsten Wirtschaftszentren Syriens, bekannt für seine Textil- und Pharmaproduktion.","f":["Umfasst Tausende von Produktionsstätten.","Vor dem Krieg Motor der syrischen Exportwirtschaft."]},"hassia-industrial-city-economic-v2":{"i":"/poi-images/hassia-industrial-city-economic-v2.webp","s":"Eine strategisch günstig gelegene Industriezone südlich von Homs, die auf Schwerindustrie und Automobilmontage spezialisiert ist.","f":["Gegründet um die wirtschaftliche Dezentralisierung zu fördern.","Beherbergt Anlagen für Metallverarbeitung."]},"al-thaim-oil-field-economic-v2":{"i":"/poi-images/al-thaim-oil-field-economic-v2.webp","s":"Ein bedeutendes Ölfeld südlich von Deir ez-Zor, das einen wichtigen Beitrag zur syrischen Ölproduktion leistet.","f":["Das Feld ist seit den 1980er Jahren aktiv.","Befindet sich in einer wüstenartigen Umgebung."]},"jbissa-gas-field-economic-v2":{"i":"/poi-images/jbissa-gas-field-economic-v2.webp","s":"Eines der ältesten und größten Erdgasfelder Syriens im Gouvernement Al-Hasakah, das auch eine eigene Gasverarbeitungsanlage umfasst.","f":["Produziert hauptsächlich süßes Erdgas.","Versorgt das nationale Pipelinenetz."]},"suwaydiya-oil-field-economic-v2":{"i":"/poi-images/suwaydiya-oil-field-economic-v2.webp","s":"Ein riesiges Ölfeld im äußersten Nordosten Syriens, das zu den ältesten in Betrieb befindlichen Feldern des Landes gehört.","f":["Wurde in den späten 1950er Jahren entdeckt.","Produziert schweres Rohöl."]},"rumeilan-oil-field-economic-v2":{"i":"/poi-images/rumeilan-oil-field-economic-v2.webp","s":"Ein ausgedehnter Ölfeldkomplex in der Region Al-Hasakah, der aus Hunderten von aktiven Bohrlöchern besteht.","f":["Umfasst über 1.300 Ölquellen.","Ist das wichtigste Ölzentrum in der Jazira-Region."]},"zara-power-plant-economic-v2":{"i":"/poi-images/zara-power-plant-economic-v2.webp","s":"Ein bedeutendes thermisches Kraftwerk in der Provinz Hama, das mit Erdgas betrieben wird und einen wichtigen Teil zur nationalen Stromversorgung beiträgt.","f":["Erbaut mit internationaler Unterstützung.","Liegt strategisch günstig in Mittelsyrien."]},"sy-krak-des-chevaliers-history-v2":{"i":"/poi-images/sy-krak-des-chevaliers-history-v2.webp","s":"Eine der am besten erhaltenen Kreuzritterburgen der Welt.","f":["Wurde im 12. Jahrhundert stark ausgebaut.","Fiel 1271 an den Mamluken-Sultan Baibars."]},"sy-aleppo-citadel-history-v2":{"i":"/poi-images/sy-aleppo-citadel-history-v2.webp","s":"Ein massiver befestigter Palast im Zentrum einer der ältesten ununterbrochen bewohnten Städte der Welt.","f":["Steht auf einem 50 Meter hohen künstlichen Hügel.","Wurde von Ayyubiden, Mamluken und Osmanen genutzt."]},"sy-umayyad-mosque-history-v2":{"i":"/poi-images/sy-umayyad-mosque-history-v2.webp","s":"Diese im 8.","f":["Erbaut unter Kalif al-Walid I.","Die goldenen Mosaike zeigen paradiesische Landschaften."]},"sy-apamea-history-v2":{"i":"/poi-images/sy-apamea-history-v2.webp","s":"Einst eine florierende antike Metropole, bekannt für ihre fast zwei Kilometer lange Große Kolonnade.","f":["Die Hauptstraße ist von Hunderten Säulen gesäumt.","Wurde von Seleukos I. Nikator gegründet."]},"sy-bosra-amphitheatre-history-v2":{"i":"/poi-images/sy-bosra-amphitheatre-history-v2.webp","s":"Ein außergewöhnlich gut erhaltenes Amphitheater aus dem 2.","f":["Bietet Platz für etwa 15.000 Zuschauer.","Die Akustik ist bis heute hervorragend."]},"sy-ebla-history-v2":{"i":"/poi-images/sy-ebla-history-v2.webp","s":"Die Überreste einer antiken Zivilisation, berühmt für die Entdeckung tausender Keilschrifttafeln.","f":["Die Ebla-Tafeln wurden 1974 entdeckt.","War ein bedeutendes syrisches Reich im 3. Jahrtausend v. Chr."]},"sy-ugarit-history-v2":{"i":"/poi-images/sy-ugarit-history-v2.webp","s":"Diese Hafenstadt aus der Bronzezeit ist der Fundort des ältesten bekannten Alphabets der Welt.","f":["Das ugaritische Alphabet hat 30 Keilschriftzeichen.","Wurde im 12. Jahrhundert v. Chr. durch die Seevölker zerstört."]},"sy-saladin-castle-history-v2":{"i":"/poi-images/sy-saladin-castle-history-v2.webp","s":"Eine byzantinische und später kreuzritterliche Bergfestung, die tief in einen natürlichen Felsspalt gehauen ist.","f":["Ein 28 Meter tiefer Graben wurde in den Fels gehauen.","Es steht ein markanter, 18 Meter hoher Felsnadel in der Mitte des Grabens."]},"sy-mari-history-v2":{"i":"/poi-images/sy-mari-history-v2.webp","s":"Eine ehemalige mesopotamische Stadt am Euphrat, die einst den lukrativen Handel zwischen Sumer und der Levante kontrollierte.","f":["Wurde im 18. Jahrhundert v. Chr. von Hammurabi zerstört.","Der Palast hatte über 300 Räume."]},"sy-amrit-history-v2":{"i":"/poi-images/sy-amrit-history-v2.webp","s":"Eine antike phönizische Ausgrabungsstätte nahe der Küste, die einen einzigartigen, in den Fels gehauenen Tempel aufweist, der von einem Wasserbecken umgeben war.","f":["Eines der wenigen Beispiele unversehrter phönizischer Architektur.","Beinhaltet Überreste eines antiken Stadions."]},"sy-margat-history-v2":{"i":"/poi-images/sy-margat-history-v2.webp","s":"Eine schwarze Basaltfestung der Johanniter, die auf einem erloschenen Vulkan ruht und das Mittelmeer überblickt.","f":["Wurde 1285 von Sultan Qalawun eingenommen.","Galt aufgrund ihrer enormen Vorräte lange als uneinnehmbar."]},"sy-resafa-history-v2":{"i":"/poi-images/sy-resafa-history-v2.webp","s":"Eine byzantinische Stadtmauer aus feinem Gipsstein inmitten der syrischen Wüste.","f":["Hatte riesige unterirdische Zisternen zur Wasserversorgung.","Auch bekannt als Sergiopolis in byzantinischer Zeit."]},"sy-qasr-al-hayr-al-sharqi-history-v2":{"i":"/poi-images/sy-qasr-al-hayr-al-sharqi-history-v2.webp","s":"Zwei umayyadische Wüstenschlösser, die ursprünglich landwirtschaftliche Güter und Karawansereien waren.","f":["Erbaut im Jahr 728 vom Kalifen Hisham.","Diente als Vorposten an den Karawanenrouten."]},"sy-serjilla-history-v2":{"i":"/poi-images/sy-serjilla-history-v2.webp","s":"Die am besten erhaltene der sogenannten Toten Städte Syriens.","f":["Besitzt ein intaktes römisches Badhaus und Olivenpressen.","Wurde im 7. Jahrhundert aus unbekannten Gründen verlassen."]},"sy-al-raqqah-wall-history-v2":{"i":"/poi-images/sy-al-raqqah-wall-history-v2.webp","s":"Große Teile der historischen Stadtmauer und das mächtige Bab Baghdad (Bagdad-Tor).","f":["Kalif al-Mansur befahl den Bau 772.","Die Mauer bestand aus gebrannten Ziegeln."]},"sy-temple-of-jupiter-history-v2":{"i":"/poi-images/sy-temple-of-jupiter-history-v2.webp","s":"Überreste eines gigantischen römischen Tempels, der einst das Zentrum von Damaskus dominierte.","f":["Der Bau begann unter Kaiser Augustus.","Später wurde eine christliche Basilika in seine Ruinen gebaut."]},"sy-damascus-citadel-history-v2":{"i":"/poi-images/sy-damascus-citadel-history-v2.webp","s":"Eine völlig ebenerdige Zitadelle, die nicht auf einem Hügel, sondern in der gleichen Höhe wie die restliche Altstadt erbaut wurde.","f":["Wurde 1076 vom seldschukischen Herrscher Atsiz bin Uwaq begonnen.","Nur eines der ursprünglichen 14 Tore ist vollständig erhalten."]},"sy-dura-europos-history-v2":{"i":"/poi-images/sy-dura-europos-history-v2.webp","s":"Eine multikulturelle Grenzstadt am Euphrat, die von Persern und Römern umkämpft war.","f":["Wird wegen ihres Erhaltungsgrades als 'Pompeji der Wüste' bezeichnet.","Wurde um 256 von den Sassaniden erobert und verlassen."]},"sy-hama-norias-history-v2":{"i":"/poi-images/sy-hama-norias-history-v2.webp","s":"Riesige hölzerne Wasserräder am Fluss Orontes, deren Ursprünge auf das byzantinische Reich zurückgehen.","f":["Von einst über 30 Rädern sind noch 17 erhalten.","Das größte Rad, al-Mohammediyeh, hat 21 Meter Durchmesser."]},"azem-palace-landmarks-v2":{"i":"/poi-images/azem-palace-landmarks-v2.webp","s":"Der Azem-Palast in der Altstadt von Damaskus wurde 1749 als Residenz des osmanischen Gouverneurs erbaut und ist ein Meisterwerk der islamischen Architektur.","f":["Wurde aus abwechselnd schwarzen und weißen Steinen (Ablaq) errichtet.","Beherbergt heute das Museum für Kunst und Volkstraditionen."]},"national-museum-damascus-landmarks-v2":{"i":"/poi-images/national-museum-damascus-landmarks-v2.webp","s":"Das wichtigste archäologische Museum Syriens, das Jahrtausende alter Geschichte von der Urzeit bis zur islamischen Epoche präsentiert.","f":["Die Fassade stammt vom umayyadischen Wüstenschloss Qasr al-Hayr al-Gharbi.","Es beherbergt das Alphabet von Ugarit, eines der ältesten der Welt."]},"tekkiye-mosque-landmarks-v2":{"i":"/poi-images/tekkiye-mosque-landmarks-v2.webp","s":"Ein beeindruckender osmanischer Moscheekomplex in Damaskus, der vom berühmten Architekten Mimar Sinan im 16.","f":["Der Komplex wurde im Auftrag von Sultan Süleyman dem Prächtigen erbaut.","Er diente einst als Herberge für Pilger auf dem Weg nach Mekka."]},"khan-asad-pasha-landmarks-v2":{"i":"/poi-images/khan-asad-pasha-landmarks-v2.webp","s":"Die größte Karawanserei in der Altstadt von Damaskus, berühmt für ihre spektakulären neun Kuppeln und die gestreifte Steinfassade.","f":["Er wurde 1751 von As'ad Pascha al-Azem in Auftrag gegeben.","Das Gebäude ist ein Paradebeispiel für die Architektur der späten Osmanenzeit."]},"sayyidah-zaynab-mosque-landmarks-v2":{"i":"/poi-images/sayyidah-zaynab-mosque-landmarks-v2.webp","s":"Ein bedeutendes schiitisches Heiligtum bei Damaskus, das das Grab von Zainab, der Enkelin des Propheten Mohammed, beherbergt.","f":["Die goldene Kuppel und die mit Fliesen verzierten Minarette sind ein architektonisches Highlight.","Sie ist das Ziel von Millionen von Pilgern jedes Jahr."]},"sayyidah-ruqayya-mosque-landmarks-v2":{"i":"/poi-images/sayyidah-ruqayya-mosque-landmarks-v2.webp","s":"Eine prächtige Moschee in Damaskus, die das Grab der Tochter von Imam Hussein birgt und für ihre aufwendigen Spiegelmosaike bekannt ist.","f":["Die Moschee wurde 1985 im iranischen Baustil errichtet.","Ihr Inneres ist fast vollständig mit glitzernden Spiegeln bedeckt."]},"church-saint-simeon-stylites-landmarks-v2":{"i":"/poi-images/church-saint-simeon-stylites-landmarks-v2.webp","s":"Die Überreste einer der ältesten noch erhaltenen christlichen Kirchen der Welt, erbaut an der Stelle, an der der Säulenheilige Simeon lebte.","f":["Simeon der Säulenheilige verbrachte 37 Jahre auf einer Säule an diesem Ort.","Die kreuzförmige Basilika stammt aus dem 5. Jahrhundert."]},"great-mosque-aleppo-landmarks-v2":{"i":"/poi-images/great-mosque-aleppo-landmarks-v2.webp","s":"Eines der bedeutendsten islamischen Bauwerke in Aleppo, das tief im Herzen der alten Souks liegt und als architektonisches Juwel gilt.","f":["Sie wurde im 8. Jahrhundert von den Umayyaden gegründet.","Das historische seldschukische Minarett aus dem 11. Jahrhundert wurde 2013 zerstört."]},"monastery-saint-thecla-landmarks-v2":{"i":"/poi-images/monastery-saint-thecla-landmarks-v2.webp","s":"Ein griechisch-orthodoxes Kloster in der malerischen Bergstadt Maaloula, wo bis heute ein Dialekt des antiken Aramäisch gesprochen wird.","f":["Das Kloster ist um eine Höhle herum gebaut, in der die Heilige Thekla Zuflucht suchte.","Pilger kommen, um das Wasser der heiligen Quelle zu trinken."]},"saidnaya-monastery-landmarks-v2":{"i":"/poi-images/saidnaya-monastery-landmarks-v2.webp","s":"Eine majestätische christliche Pilgerstätte auf einem Berg, die der Überlieferung nach vom byzantinischen Kaiser Justinian I.","f":["Es ist das wichtigste Pilgerzentrum für Christen im Nahen Osten nach Jerusalem.","Das Kloster beherbergt eine Ikone der Jungfrau Maria, die dem Heiligen Lukas zugeschrieben wird."]},"qalat-jabar-landmarks-v2":{"i":"/poi-images/qalat-jabar-landmarks-v2.webp","s":"Eine beeindruckende Burgruine, die heute majestätisch auf einer Insel im Assad-See liegt und von massiven Backsteinmauern umgeben ist.","f":["Vor dem Bau des Tabqa-Staudamms stand die Burg auf einer Klippe am Euphrat.","Das auffällige Minarett im Inneren stammt aus dem 12. Jahrhundert."]},"masyaf-castle-landmarks-v2":{"i":"/poi-images/masyaf-castle-landmarks-v2.webp","s":"Eine historische Festung im Küstengebirge, die im 12.","f":["Die Burg wurde erfolgreich gegen eine Belagerung durch Sultan Saladin verteidigt.","Sie ist weltweit durch die Videospielreihe \"Assassin's Creed\" bekannt."]},"cathedral-of-tartus-landmarks-v2":{"i":"/poi-images/cathedral-of-tartus-landmarks-v2.webp","s":"Ein hervorragendes Beispiel für die romanische Architektur der Kreuzfahrer, das heute das Nationalmuseum von Tartus beherbergt.","f":["Sie wurde im 12. Jahrhundert von den Tempelrittern erbaut.","Die Kirche wurde später in eine Moschee und dann in ein Museum umgewandelt."]},"arwad-citadel-landmarks-v2":{"i":"/poi-images/arwad-citadel-landmarks-v2.webp","s":"Eine massive Inselfestung vor der syrischen Küste, die die letzte Bastion der Kreuzfahrer im Nahen Osten vor ihrem Fall war.","f":["Arwad ist die einzige bewohnte Insel in syrischen Gewässern.","Die Festung wurde noch im 20. Jahrhundert als Gefängnis genutzt."]},"hejaz-railway-station-landmarks-v2":{"i":"/poi-images/hejaz-railway-station-landmarks-v2.webp","s":"Der historische Endbahnhof in Damaskus, berühmt für seine reich verzierte Decke und beeindruckenden Buntglasfenster.","f":["Er wurde 1917 im neo-islamischen Stil fertiggestellt.","Die Hedschasbahn sollte Damaskus mit den heiligen Stätten in Medina verbinden."]},"qasr-ibn-wardan-landmarks-v2":{"i":"/poi-images/qasr-ibn-wardan-landmarks-v2.webp","s":"Ein byzantinischer Gebäudekomplex aus dem 6.","f":["Es wurde von Kaiser Justinian I. als Teil seiner Verteidigungslinie erbaut.","Der einzigartige Baustil aus Lehmziegeln und Basalt ist stark von Konstantinopel beeinflusst."]},"bab-sharqi-landmarks-v2":{"i":"/poi-images/bab-sharqi-landmarks-v2.webp","s":"Eines der alten Stadttore von Damaskus und das einzige, das noch sein ursprüngliches römisches Aussehen mit drei Bögen bewahrt hat.","f":["Das Tor markiert das östliche Ende der biblischen \"Geraden Straße\".","Der Name bedeutet wörtlich übersetzt \"Östliches Tor\"."]},"mausoleum-of-saladin-landmarks-v2":{"i":"/poi-images/mausoleum-of-saladin-landmarks-v2.webp","s":"Die letzte Ruhestätte des berühmten Ayyubiden-Sultans Saladin, gelegen in einem kleinen Garten neben der Umayyaden-Moschee.","f":["Das Grab beherbergt zwei Sarkophage: einen aus Holz und einen aus Marmor.","Der Marmorsarkophag war ein Geschenk des deutschen Kaisers Wilhelm II."]},"deir-mar-musa-landmarks-v2":{"i":"/poi-images/deir-mar-musa-landmarks-v2.webp","s":"Ein syrisch-katholisches Kloster, das hoch oben an den steilen Hängen einer Wüstenschlucht nahe Nabk erbaut wurde.","f":["Das Kloster ist berühmt für seine wertvollen Fresken aus dem 11. und 12. Jahrhundert.","Es wurde als Ort des interreligiösen Dialogs wiederbelebt."]},"bab-al-faraj-clock-tower-landmarks-v2":{"i":"/poi-images/bab-al-faraj-clock-tower-landmarks-v2.webp","s":"Ein prominentes Wahrzeichen im Zentrum von Aleppo, das Ende des 19.","f":["Die Architektur kombiniert osmanische und europäische Einflüsse.","Der Turm diente der Bevölkerung als Orientierungspunkt für die Gebetszeiten."]},"al-thawra-nature-reserve-life-v2":{"i":"/poi-images/al-thawra-nature-reserve-life-v2.webp","s":"Ein bedeutendes Schutzgebiet am Ufer des Assad-Sees, das zahlreiche Vogelarten und eine reiche Flora beheimatet.","f":["Liegt am künstlichen Assad-See.","Wichtiger Rastplatz für Zugvögel."]},"tishreen-park-life-v2":{"i":"/poi-images/tishreen-park-life-v2.webp","s":"Einer der größten öffentlichen Parks in Damaskus, der eine grüne Oase cotton-fields-life-v2.webp","s":"Die weitläufigen landwirtschaftlichen Flächen in Nordostsyrien, die traditionell das Herz der syrischen Baumwollproduktion bilden.","f":["Syrien war einst einer der Top-Baumwollexporteure.","Die Dschazira-Region ist der Korn- und Baumwollspeicher des Landes."]},"ghouta-oasis-life-v2":{"i":"/poi-images/ghouta-oasis-life-v2.webp","s":"Ein historisch reiches Landwirtschaftsgebiet rund um Damaskus, das die Stadt seit Jahrtausenden mit Obst und Gemüse versorgt.","f":["Wird vom Fluss Barada bewässert.","Berühmt für ihre Aprikosen- und Olivenbäume."]},"lattakia-citrus-orchards-life-v2":{"i":"/poi-images/lattakia-citrus-orchards-life-v2.webp","s":"Die fruchtbaren Ebenen entlang der Mittelmeerküste sind für den Anbau von Orangen, Zitronen und Mandarinen bekannt.","f":["Produzieren einen Großteil der syrischen Zitrusfrüchte.","Profitieren vom milden mediterranen Klima."]},"tartus-olive-groves-life-v2":{"i":"/poi-images/tartus-olive-groves-life-v2.webp","s":"Die Hügel und Ebenen im Gouvernement Tartus sind mit jahrhundertealten Olivenbäumen bedeckt, die hochwertiges Öl liefern.","f":["Syrien ist historisch einer der größten Olivenölproduzenten.","Einige Bäume sind Hunderte von Jahren alt."]},"al-adawi-zoo-life-v2":{"i":"/poi-images/al-adawi-zoo-life-v2.webp","s":"Ein städtischer Zoo in Damaskus, der ein beliebtes Ausflugsziel für Schulklassen und Familien mit Kindern ist.","f":["Beherbergt einheimische und exotische Tiere.","Bietet Bildungsangebote für Kinder."]},"abu-qubays-protected-area-life-v2":{"i":"/poi-images/abu-qubays-protected-area-life-v2.webp","s":"Ein Bergreservat im Küstengebirge, das alte Wälder, Wasserfälle und eine reiche Artenvielfalt umfasst.","f":["Schützt dichte Eichen- und Kiefernwälder.","Heimat von Wildschweinen und verschiedenen Greifvögeln."]},"al-sabil-park-life-v2":{"i":"/poi-images/al-sabil-park-life-v2.webp","s":"Einer der ältesten und bekanntesten Parks in Aleppo, der für seine großen Wasserbecken und schattigen A ontes fließt durch Westsyrien und ist bekannt für seine historischen Wasserräder in der Stadt Hama.","f":["Fließt nach Norden","Versorgt die Region Hama"]},"khabur-river-nature-v2":{"i":"/poi-images/khabur-river-nature-v2.webp","s":"Der Chabur ist der größte Nebenfluss des Euphrat in Syrien und prägt die fruchtbare Region Al-Dschasira.","f":["Größter Nebenfluss des Euphrat","Zentrum alter Kulturen"]},"lake-assad-nature-v2":{"i":"/poi-images/lake-assad-nature-v2.webp","s":"Der Assad-See ist der größte Stausee Syriens, der durch den Bau der Tabqa-Talsperre am Euphrat entstand.","f":["Größter See des Landes","Wichtig für die Stromerzeugung"]},"lake-qattinah-nature-v2":{"i":"/poi-images/lake-qattinah-nature-v2.webp","s":"Der Qattinah-See ist ein historischer See südwestlich von Homs, dessen Staudamm teilweise aus der Antike stammt.","f":["Antiker Staudamm","Liegt am Orontes"]},"mount-hermon-syria-nature-v2":{"i":"/poi-images/mount-hermon-syria-nature-v2.webp","s":"Der Hermon-Berg ist der höchste Punkt Syriens und bildet eine markante natürliche Grenze im Südwesten des Landes.","f":["Höchster Punkt Syriens","Im Winter schneebedeckt"]},"jabal-al-druze-nature-v2":{"i":"/poi-images/jabal-al-druze-nature-v2.webp","s":"Das vulkanische Bergland Dschebel ad-Durus erhebt sich majestätisch in der südsyrischen Region As-Suwaida.","f":["Vulkanischen Ursprungs","Heimat der Drusen"]},"anti-lebanon-mountains-syria-nature-v2":{"i":"/poi-images/anti-lebanon-mountains-syria-nature-v2.webp","s":"Der Anti-Libanon ist ein schroffer Gebirgszug, der eine natürliche Barriere zwischen Syrien und dem Libanon bildet.","f":["Grenzgebirge zum Libanon","Verläuft von Nord nach Süd"]},"syrian-coastal-mountains-nature-v2":{"i":"/poi-images/syrian-coastal-mountains-nature-v2.webp","s":"Die dicht bewaldeten Ansarija-Berge verlaufen parallel zur Mittelmeerküste und fangen reichlich Niederschlag auf.","f":["Grünste Region Syriens","Parallel zur Küste"]},"jabal-al-bishri-nature-v2":{"i":"/poi-images/jabal-a nd Tannen"]},"afrin-river-nature-v2":{"i":"/poi-images/afrin-river-nature-v2.webp","s":"Der Fluss Afrin durchfließt den von Olivenhainen geprägten Nordwesten Syriens, bevor er in die Türkei zurückkehrt.","f":["Fließt durch die Region Afrin","Nebenfluss des Orontes"]},"al-sinn-river-nature-v2":{"i":"/poi-images/al-sinn-river-nature-v2.webp","s":"Der kurze, aber wasserreiche Al-Sinn-Fluss mündet in das Mittelmeer und ist entscheidend für die Küstenbewässerung.","f":["Fließt ins Mittelmeer","Nur wenige Kilometer lang"]},"tigris-river-syria-nature-v2":{"i":"/poi-images/tigris-river-syria-nature-v2.webp","s":"Der Tigris berührt Syrien nur an einem kurzen Grenzabschnitt im äußersten Nordosten und bildet die Grenze zum Irak.","f":["Bildet einen Teil der Grenze","Fließt ins Zweistromland"]},"jabal-abd-al-aziz-relief-v2":{"i":"/poi-images/jabal-abd-al-aziz-relief-v2.webp","s":"Der Dschebel Abd al-Aziz ist ein markanter Gebirgszug in der Al-Hasakah-Region, der als Naturschutzgebiet dient und bedrohte Tierarten schützt.","f":["Erreicht Höhen von bis zu 920 Metern","Ausgewiesenes Naturschutzgebiet"]},"jabal-al-akra-relief-v2":{"i":"/poi-images/jabal-al-akra-relief-v2.webp","s":"Der Dschebel al-Akra, auch bekannt als Berg Casius, ist ein steiler Kalksteinberg nahe der türkischen Grenze, der steil ins Mittelmeer abfällt.","f":["Höhe von 1.709 Metern","In der Antike als heiliger Berg verehrt"]},"al-ghab-plain-relief-v2":{"i":"/poi-images/al-ghab-plain-relief-v2.webp","s":"Die Al-Ghab-Ebene ist ein fruchtbares Grabenbruch-Tal am Fluss Orontes, das in der Mitte des 20.","f":["Ursprünglich ein großes Sumpfgebiet","Über 80 Kilometer lang"]},"kurd-dagh-relief-v2":{"i":"/poi-images/kurd-dagh-relief-v2.webp","s":"Der Kurd Dagh ist ein bergiges Hochland im Nordwesten Syriens, das durch seine dichten Olivenhaine und reiche kulturelle Geschichte geprägt ist.","f":["Bekannt für den Olivenanbau","Teil des Taurusgebirges"]},"jabal-samaan-relief-v2":{"i":"/poi-images/jabal-samaan-relief-v2.webp","s":"Der Dschebel Samaan ist ein Kalksteinmassiv, das für die Ruinen des Simeonsklosters und die umliegenden berühmten Toten Städte bekannt ist.","f":["Höchster Punkt erreicht über 800 Meter","Heimat byzantinischer Ruinenstätten"]},"hauran-plateau-relief-v2":{"i":"/poi-images/hauran-plateau-relief-v2.webp","s":"Das Hauran-Plateau im Süden Syriens ist eine vulkanische Hochebene, die für ihre fruchtbare rote Erde und historische Bedeutung bekannt ist.","f":["Vulkanischen Ursprungs","Ehemalige römische Provinz"]},"al-safa-relief-v2":{"i":"/poi-images/al-safa-relief-v2.webp","s":"Al-Safa ist ein zerklüftetes vulkanisches Lavafeld südöstlich von Damaskus, das durch seine schwarze, mondähnliche Landschaft besticht.","f":["Gilt als unwegsames Gelände","Besteht aus erstarrten Lavaströmen"]},"al-lajat-relief-v2":{"i":"/poi-images/al-lajat-relief-v2.webp","s":"Al-Ladscha, auch als Lejah bekannt, ist ein stark zerklüftetes Basaltplateau, das in der Antike als Zufluchtsort für Banditen und Rebellen diente.","f":["Schwer zugängliches Gebiet","Historisch als Trachonitis bekannt"]},"jabal-abu-rujmayn-relief-v2":{"i":"/poi-images/jabal-abu-rujmayn-relief-v2.webp","s":"Der Dschebel Abu Rudschmain ist eine langgestreckte Bergkette inmitten der syrischen Wüste, die wichtige archäologische Stätten birgt.","f":["Nördlich von Palmyra gelegen","Wüstengebirge"]},"jabal-al-bilas-relief-v2":{"i":"/poi-images/jabal-al-bilas-relief-v2.webp","s":"Der Dschebel al-Balaas ist ein trockenes Bergland im zentralen Syrien, das von nomadischen Stämmen für die Weidewirtschaft genutzt wird.","f":["Zentral in Syrien gelegen","Klima ist arid bis semi-arid"]},"rouj-valley-relief-v2":{"i":"/poi-images/rouj-valley-relief-v2.webp","s":"Die Roudsch-Ebene ist eine fruchtbare geologische Senke in der Provinz Idlib, die intensiv landwirtschaftlich genutzt wird.","f":["Westlich der Stadt Idlib","Sehr fruchtbare Böden"]},"qalamoun-mountains-relief-v2":{"i":"/poi-images/qalamoun-mountains-relief-v2.webp","s":"Die Qalamun-Berge sind der nordöstliche Ausläufer des Anti-Libanon-Gebirges und eine strategisch wichtige Gebirgsregion in Syrien.","f":["Höchste Erhebung über 2.000 Meter","Verbindet Damaskus mit Zentralsyrien"]},"syrian-coast-relief-v2":{"i":"/poi-images/syrian-coast-relief-v2.webp","s":"Die syrische Mittelmeerküste ist ein schmaler, fruchtbarer Streifen, der durch ein mildes Klima und reiche Landwirtschaft geprägt ist.","f":["Etwa 180 Kilometer lang","Mildes mediterranes Klima"]},"jabal-al-nabi-yunis-relief-v2":{"i":"/poi-images/jabal-al-nabi-yunis-relief-v2.webp","s":"Der Dschebel al-Nabi Yunis ist mit über 1.500 Metern der höchste Gipfel der syrischen Küstengebirgskette und bietet weite Ausblicke.","f":["Höchster Punkt der Ansarija-Berge","Höhe von 1.562 Metern"]},"orontes-valley-relief-v2":{"i":"/poi-images/orontes-valley-relief-v2.webp","s":"Das Orontes-Tal durchschneidet den Westen Syriens und bildet seit Jahrtausenden eine wichtige landwirtschaftliche und kulturelle Lebensader.","f":["Wichtiges Bewässerungsgebiet","Reichtum an archäologischen Stätten"]},"wadi-barada-relief-v2":{"i":"/poi-images/wadi-barada-relief-v2.webp","s":"Das Wadi Barada ist ein malerisches Gebirgstal, durch das der Fluss Barada fließt, um die Hauptstadt Damaskus mit Wasser zu versorgen.","f":["Wichtigste Wasserquelle für Damaskus","Liegt im Anti-Libanon-Gebirge"]},"jabal-al-shumariyah-relief-v2":{"i":"/poi-images/jabal-al-shumariyah-relief-v2.webp","s":"Der Dschebel al-Schumarija ist ein Gebirgszug im Gouvernement Homs, der den Übergang von fruchtbaren Ebenen zur Wüste markiert.","f":["Östlich von Homs gelegen","Trockenes Klima"]},"jabal-al-shaar-relief-v2":{"i":"/poi-images/jabal-al-shaar-relief-v2.webp","s":"Der Dschebel al-Schaar ist eine bergige Region im zentralsyrischen Wüstengebiet, die für ihre Erdgas- und Ölvorkommen bekannt ist.","f":["Wichtige Gasfelder","Strategische Bedeutung"]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
