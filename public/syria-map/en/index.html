ural rock fissure.","f":["A 28-meter deep ditch was cut into the solid rock.","A distinctive 18-meter-high rock needle stands in the middle of the ditch."]},"sy-mari-history-v2":{"i":"/poi-images/sy-mari-history-v2.webp","s":"A former Mesopotamian city on the Euphrates River that once controlled the lucrative trade between Sumer and the Levant.","f":["Was destroyed by Hammurabi in the 18th century BC.","The palace had over 300 rooms."]},"sy-amrit-history-v2":{"i":"/poi-images/sy-amrit-history-v2.webp","s":"An ancient Phoenician excavation site near the coast, featuring a unique rock-cut temple that was surrounded by a pool of water.","f":["One of the few examples of intact Phoenician architecture.","Includes the remains of an ancient stadium."]},"sy-margat-history-v2":{"i":"/poi-images/sy-margat-history-v2.webp","s":"A black basalt fortress of the Knights Hospitaller resting on an extinct volcano overlooking the Mediterranean Sea.","f":["Was captured by Sultan Qalawun in 1285.","Was long considered impregnable due to its enormous supplies."]},"sy-resafa-history-v2":{"i":"/poi-images/sy-resafa-history-v2.webp","s":"A Byzantine city wall made of fine gypsum stone in the middle of the Syrian desert.","f":["Had huge underground cisterns for water supply.","Also known as Sergiopolis in Byzantine times."]},"sy-qasr-al-hayr-al-sharqi-history-v2":{"i":"/poi-images/sy-qasr-al-hayr-al-sharqi-history-v2.webp","s":"Two Umayyad desert castles that were originally agricultural estates and caravanserais.","f":["Built in 728 by Caliph Hisham.","Served as an outpost along the caravan routes."]},"sy-serjilla-history-v2":{"i":"/poi-images/sy-serjilla-history-v2.webp","s":"The best-preserved of Syria's so-called Dead Cities.","f":["Features an intact Roman bathhouse and olive presses.","Was abandoned in the 7th century for unknown reasons."]},"sy-al-raqqah-wall-history-v2":{"i":"/poi-images/sy-al-raqqah-wall-history-v2.webp","s":"Large parts of the historical city wall and the massive nt Islamic structures in Aleppo, situated deep in the heart of the ancient souks and considered an architectural jewel.","f":["It was founded in the 8th century by the Umayyads.","The historic 11th-century Seljuk minaret was destroyed in 2013."]},"monastery-saint-thecla-landmarks-v2":{"i":"/poi-images/monastery-saint-thecla-landmarks-v2.webp","s":"A Greek Orthodox monastery in the picturesque mountain town of Maaloula, where a dialect of ancient Aramaic is still spoken today.","f":["The monastery is built around a cave where Saint Thecla sought refuge.","Pilgrims come to drink water from the holy spring."]},"saidnaya-monastery-landmarks-v2":{"i":"/poi-images/saidnaya-monastery-landmarks-v2.webp","s":"A majestic Christian pilgrimage site atop a mountain, traditionally believed to have been founded by the Byzantine Emperor Justinian I.","f":["It is the most important pilgrimage center for Christians in the Middle East after Jerusalem.","The monastery houses an icon of the Virgin Mary attributed to Saint Luke."]},"qalat-jabar-landmarks-v2":{"i":"/poi-images/qalat-jabar-landmarks-v2.webp","s":"An impressive ruined castle that now sits majestically on an island in Lake Assad, surrounded by massive brick walls.","f":["Before the construction of the Tabqa Dam, the castle stood on a cliff by the Euphrates.","The striking minaret inside dates back to the 12th century."]},"masyaf-castle-landmarks-v2":{"i":"/poi-images/masyaf-castle-landmarks-v2.webp","s":"A historic fortress in the coastal mountains that served as the headquarters of the legendary Order of Assassins in the 12th century.","f":["The castle was successfully defended against a siege by Sultan Saladin.","It is known worldwide through the \"Assassin's Creed\" video game series."]},"cathedral-of-tartus-landmarks-v2":{"i":"/poi-images/cathedral-of-tartus-landmarks-v2.webp","s":"An outstanding example of Crusader Romanesque architecture, which today houses the National Museum of Tartus.","f":["It was built in the 12th century by the Knights Templar.","The church was later converted into a mosque, and then into a museum."]},"arwad-citadel-landmarks-v2":{"i":"/poi-images/arwad-citadel-landmarks-v2.webp","s":"A massive island fortress off the Syrian coast that was the last bastion of the Crusaders in the Middle East before their fall.","f":["Arwad is the only inhabited island in Syrian waters.","The fortress was used as a prison well into the 20th century."]},"hejaz-railway-station-landmarks-v2":{"i":"/poi-images/hejaz-railway-station-landmarks-v2.webp","s":"The historic terminal station in Damascus, famous for its richly decorated ceiling and impressive stained-glass windows.","f":["It was completed in 1917 in a neo-Islamic style.","The Hejaz Railway was intended to connect Damascus with the holy sites in Medina."]},"qasr-ibn-wardan-landmarks-v2":{"i":"/poi-images/qasr-ibn-wardan-landmarks-v2.webp","s":"A 6th-century Byzantine building complex on the edge of the desert, consisting of a palace, a church, and a barracks.","f":["It was built by Emperor Justinian I as part of his defensive line.","The unique architectural style of mud bricks and basalt is heavily influenced by Constantinople."]},"bab-sharqi-landmarks-v2":{"i":"/poi-images/bab-sharqi-landmarks-v2.webp","s":"One of the ancient city gates of Damascus and the only one that still retains its original Roman appearance with three arches.","f":["The gate marks the eastern end of the biblical \"Straight Street\".","The name literally translates to \"Eastern Gate\"."]},"mausoleum-of-saladin-landmarks-v2":{"i":"/poi-images/mausoleum-of-saladin-landmarks-v2.webp","s":"The final resting place of the famous Ayyubid Sultan Saladin, located in a small garden next to the Umayyad Mosque.","f":["The tomb houses two sarcophagi: one made of wood and one of marble.","The marble sarcophagus was a gift from the German Emperor Wilhelm II."]},"deir-mar-musa-landmarks-v2":{"i":"/poi-images/deir-mar-musa-landmarks-v2.webp","s":"A Syriac Catholic "Produces a highly prized durum wheat."]},"al-riyadeh-park-life-v2":{"i":"/poi-images/al-riyadeh-park-life-v2.webp","s":"An urban park in the coastal city of Latakia, offering recreation and leisure activities near the sea.","f":["Located in the city center of Latakia.","A popular place for family gatherings."]},"euphrates-river-syria-nature-v2":{"i":"/poi-images/euphrates-river-syria-nature-v2.webp","s":"The Euphrates is the longest and most important river in Syria, flowing as a lifeline through the desert.","f":["Flows from Turkey into Syria","Crucial for agriculture"]},"orontes-river-nature-v2":{"i":"/poi-images/orontes-river-nature-v2.webp","s":"The Orontes River flows through western Syria and is famous for its historical water wheels in the city of Hama.","f":["Flows northwards","Supplies the Hama region"]},"khabur-river-nature-v2":{"i":"/poi-images/khabur-river-nature-v2.webp","s":"The Khabur is the largest tributary of the Euphrates in Syria, shaping the fertile Al-Jazira region.","f":["Largest tributary of the Euphrates","Center of ancient cultures"]},"lake-assad-nature-v2":{"i":"/poi-images/lake-assad-nature-v2.webp","s":"Lake Assad is Syria's largest reservoir, created by the construction of the Tabqa Dam on the Euphrates.","f":["Largest lake in the country","Important for power generation"]},"lake-qattinah-nature-v2":{"i":"/poi-images/lake-qattinah-nature-v2.webp","s":"Lake Qattinah is a historical lake southwest of Homs, featuring a dam that partly dates back to antiquity.","f":["Ancient dam origins","Located on the Orontes River"]},"mount-hermon-syria-nature-v2":{"i":"/poi-images/mount-hermon-syria-nature-v2.webp","s":"Mount Hermon is the highest point in Syria, forming a striking natural border in the southwestern part of the country.","f":["Highest point in Syria","Snow-capped in winter"]},"jabal-al-druze-nature-v2":{"i":"/poi-images/jabal-al-druze-nature-v2.webp","s":"The volcanic mountainous region of Jabal al-Druze rises majestically in the southern Syrian region of As-Suwayda.","f":["Volcanic origin","Home to the Druze community"]},"anti-lebanon-mountains-syria-nature-v2":{"i":"/poi-images/anti-lebanon-mountains-syria-nature-v2.webp","s":"The Anti-Lebanon Mountains are a rugged mountain range forming a natural barrier between Syria and Lebanon.","f":["Border mountains with Lebanon","Runs north to south"]},"syrian-coastal-mountains-nature-v2":{"i":"/poi-images/syrian-coastal-mountains-nature-v2.webp","s":"The heavily forested Syrian Coastal Mountain Range runs parallel to the Mediterranean coast and receives abundant rainfall.","f":["Greenest region in Syria","Parallel to the coast"]},"jabal-al-bishri-nature-v2":{"i":"/poi-images/jabal-al-bishri-nature-v2.webp","s":"Jabal al-Bishri is an extensive highland in the Syrian desert, historically traversed by nomadic tribes.","f":["Located in the Syrian Desert","Historical nomadic land"]},"barada-river-nature-v2":{"i":"/poi-images/barada-river-nature-v2.webp","s":"The Barada is the main river of Damascus, creating the famous Ghouta oasis that sustains the city.","f":["Flows through Damascus","Feeds the Ghouta oasis"]},"jabal-zawiya-nature-v2":{"i":"/poi-images/jabal-zawiya-nature-v2.webp","s":"Jabal Zawiya is a limestone massif in the Idlib province, renowned for its ancient dead cities.","f":["Part of the Belus Massif","Home to many ruins"]},"balikh-river-nature-v2":{"i":"/poi-images/balikh-river-nature-v2.webp","s":"The Balikh is a tributary of the Euphrates that joins the main river near Raqqa and was densely populated in antiquity.","f":["Tributary of the Euphrates","Joins near Raqqa"]},"lake-muzairib-nature-v2":{"i":"/poi-images/lake-muzairib-nature-v2.webp","s":"Lake Muzairib is an important freshwater lake in southern Syria, fed by numerous natural springs.","f":["Located in the Daraa region","Popular excursion destination"]},"jabal-qasioun-nature-v2":{"i":"/poi-images/jabal-qasioun-nature-v2.webp","s":"Mount Qasioun rises directly above Damascus, offering n antiquity"]},"al-ghab-plain-relief-v2":{"i":"/poi-images/al-ghab-plain-relief-v2.webp","s":"The Al-Ghab Plain is a fertile rift valley on the Orontes River that was drained in the mid-20th century to reclaim agricultural land.","f":["Originally a large swamp area","Over 80 kilometers long"]},"kurd-dagh-relief-v2":{"i":"/poi-images/kurd-dagh-relief-v2.webp","s":"Kurd Dagh is a mountainous highland in northwestern Syria, characterized by its dense olive groves and rich cultural history.","f":["Known for olive cultivation","Part of the Taurus Mountains"]},"jabal-samaan-relief-v2":{"i":"/poi-images/jabal-samaan-relief-v2.webp","s":"Mount Simeon is a limestone massif known for the ruins of the Church of Saint Simeon Stylites and the surrounding famous Dead Cities.","f":["Highest point reaches over 800 meters","Home to Byzantine ruins"]},"hauran-plateau-relief-v2":{"i":"/poi-images/hauran-plateau-relief-v2.webp","s":"The Hauran Plateau in southern Syria is a volcanic plateau known for its fertile red soil and historical significance.","f":["Of volcanic origin","Former Roman province"]},"al-safa-relief-v2":{"i":"/poi-images/al-safa-relief-v2.webp","s":"Al-Safa is a rugged volcanic lava field southeast of Damascus, striking for its black, moon-like landscape.","f":["Considered rugged terrain","Consists of solidified lava flows"]},"al-lajat-relief-v2":{"i":"/poi-images/al-lajat-relief-v2.webp","s":"Al-Lajat, also known as Lejah, is a highly rugged basalt plateau that served as a refuge for bandits and rebels in antiquity.","f":["Difficult to access area","Historically known as Trachonitis"]},"jabal-abu-rujmayn-relief-v2":{"i":"/poi-images/jabal-abu-rujmayn-relief-v2.webp","s":"Jabal Abu Rujmayn is an elongated mountain range in the middle of the Syrian Desert, harboring important archaeological sites.","f":["Located north of Palmyra","Desert mountain range"]},"jabal-al-bilas-relief-v2":{"i":"/poi-images/jabal-al-bilas-relief-v2.webp","s":"Jabal al-Bilas is an arid mountainous region in central Syria, used by nomadic tribes for grazing.","f":["Located centrally in Syria","Climate is arid to semi-arid"]},"rouj-valley-relief-v2":{"i":"/poi-images/rouj-valley-relief-v2.webp","s":"The Rouj Basin is a fertile geological depression in the Idlib province that is intensively used for agriculture.","f":["West of the city of Idlib","Very fertile soils"]},"qalamoun-mountains-relief-v2":{"i":"/poi-images/qalamoun-mountains-relief-v2.webp","s":"The Qalamoun Mountains are the northeastern extension of the Anti-Lebanon mountain range and a strategically important mountainous region in Syria.","f":["Highest elevation over 2,000 meters","Connects Damascus with central Syria"]},"syrian-coast-relief-v2":{"i":"/poi-images/syrian-coast-relief-v2.webp","s":"The Syrian Mediterranean coast is a narrow, fertile strip characterized by a mild climate and rich agriculture.","f":["About 180 kilometers long","Mild Mediterranean climate"]},"jabal-al-nabi-yunis-relief-v2":{"i":"/poi-images/jabal-al-nabi-yunis-relief-v2.webp","s":"At over 1,500 meters, Mount Nabi Yunis is the highest peak of the Syrian coastal mountain range and offers sweeping views.","f":["Highest point of the Ansariyah Mountains","Elevation of 1,562 meters"]},"orontes-valley-relief-v2":{"i":"/poi-images/orontes-valley-relief-v2.webp","s":"The Orontes Valley cuts through western Syria and has formed an essential agricultural and cultural lifeline for millennia.","f":["Important irrigation area","Rich in archaeological sites"]},"wadi-barada-relief-v2":{"i":"/poi-images/wadi-barada-relief-v2.webp","s":"Wadi Barada is a picturesque mountain valley through which the Barada River flows to supply water to the capital, Damascus.","f":["Most important water source for Damascus","Located in the Anti-Lebanon Mountains"]},"jabal-al-shumariyah-relief-v2":{"i":"/poi-images/jabal-al-shumariyah-relief-v2.webp","s":"Jabal al-Shumariyah is a mountain range in the Homs Governorate that marks the transition from fertile plains to the desert.","f":["Located east of Homs","Arid climate"]},"jabal-al-shaar-relief-v2":{"i":"/poi-images/jabal-al-shaar-relief-v2.webp","s":"Jabal al-Shaar is a mountainous region in the central Syrian desert area, known for its natural gas and oil reserves.","f":["Important gas fields","Strategic importance"]}};

function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
