.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}

.burst-line{stroke:rgba(120,185,255,.4);stroke-width:1.1;stroke-linecap:round;animation:burstFade .25s ease-out}
.burst-core{fill:#cdeeff;filter:drop-shadow(0 0 5px #7fd0ff)}
.burst-dots{position:absolute;inset:0}

const POI_CARD={"sadiqabad-cities-v2":{"i":"/poi-images/sadiqabad-cities-v2.webp","s":"Sadiqabad egy város a Rahim Yar Khan kerületben, Pandzsáb tartományban.","f":["Műtrágyaiparáról ismert.","Fontos közlekedési csomópont, amely összeköti Pandzsábot Szindh tartománnyal."]},"mirpur-khas-cities-v2":{"i":"/poi-images/mirpur-khas-cities-v2.webp","s":"Mirpur Khas egy város Szindh tartományban, a 'mangók városaként' ismert.","f":["Híres az éves mangófesztiváljáról.","Jelentős mezőgazdasági központ, különösen a mangó és a cukornád termesztésében."]},"kamoke-cities-v2":{"i":"/poi-images/kamoke-cities-v2.webp","s":"Kamoke egy város a Gujranwala kerületben, Pandzsábban, amely rizstermesztéséről ismert.","f":["Pakisztán egyik legnagyobb rizs piaca.","A történelmi Grand Trunk Road mentén fekszik."]},"hafizabad-cities-v2":{"i":"/poi-images/hafizabad-cities-v2.webp","s":"Hafizabad egy város Pandzsáb tartományban, és a rizstermelés másik fontos központja.","f":["Kiváló minőségű basmati rizséről ismert.","A város hosszú története a mogul kor előtti időkre nyúlik vissza."]},"kohat-cities-v2":{"i":"/poi-images/kohat-cities-v2.webp","s":"Kohat egy város Khyber Pakhtunkhwa tartományban, stratégiai fekvéséről és guava termesztéséről ismert.","f":["Fontos katonai és légierő-bázis.","A Kohat-alagút köti össze a déli kerületeket Pesavarral."]},"jhelum-city-cities-v2":{"i":"/poi-images/jhelum-city-cities-v2.webp","s":"Jhelum városa a Jhelum folyó partján fekszik Pandzsábban, és nagy kivándorló közösségéről ismert.","f":["A város számos lakosa külföldön él és dolgozik.","Az ősi Rohtas-erőd közelében található."]},"sahiwal-cities-v2":{"i":"/poi-images/sahiwal-cities-v2.webp","s":"Sahiwal egy város Pandzsábban, amely Sahiwal szarvasmarha-fajtájáról és pamutiparáról ismert.","f":["Harappa régészeti lelőhelye közelében található.","Korábban Montgomery néven volt ismert."]},"khanewal-cities-v2":{"i":"/poi-images/khanewal-cities-v2.webp","s":"Khanewal egy város Pandzsáb tartományban és fontos vasúti csomópont.","f":["A Khanewal körüli föld a gyapottermesztéséről ismert.","A város összeköti Multánt Lahore-ral és Faisalabaddal."]},"gojra-cities-v2":{"i":"/poi-images/gojra-cities-v2.webp","s":"Gojra egy város a Toba Tek Singh kerületben, Pandzsábban, és a gabona- és cukornádtermesztés központja.","f":["Számos híres pakisztáni hokijátékos szülőhelye.","A várost a brit gyarmatosítás idején alapították."]},"mandi-bahauddin-cities-v2":{"i":"/poi-images/mandi-bahauddin-cities-v2.webp","s":"Mandi Bahauddin egy város Pandzsáb tartományban, termékeny talajáról és mezőgazdasági termeléséről ismert.","f":["Fontos rizs-, búza- és cukornádtermelő.","A város viszonylag új, a 20. század elején fejlesztették ki."]},"muridke-cities-v2":{"i":"/poi-images/muridke-cities-v2.webp","s":"Muridke egy város Lahore közelében, Pandzsábban, amely gyorsan növekvő ipari és kereskedelmi központ.","f":["A rizsföldolgozás fontos központja.","A stratégiai Grand Trunk Road mentén fekszik."]},"tando-adam-cities-v2":{"i":"/poi-images/tando-adam-cities-v2.webp","s":"Tando Adam egy város Szindh tartományban, a textil- és cukoripar fontos központja.","f":["Erőműveiről és villamosenergia-termeléséről ismert.","Fontos kereskedelmi központ a mezőgazdasági termékek számára."]},"tando-allahyar-cities-v2":{"i":"/poi-images/tando-allahyar-cities-v2.webp","s":"Tando Allahyar egy város Szindhben, mangó- és cukornádtermesztéséről ismert.","f":["Híres a 'Sindhri' nevű mangófajtáról.","A várost a 18. században a Talpur-dinasztia alapította."]},"chiniot-cities-v2":{"i":"/poi-images/chiniot-cities-v2.webp","s":"Chiniot egy város Pandzsábban, amely kiváló minőségű fabútor-gyártásáról ismert.","f":["A Chiniotból származó bútorok világszerte ismertek.","A város gazdag történelemmel és építészettel rendelkezik, beleértve az Omar Hayat Mahal-t."]},"khuzdar-cities-v2":{"i":"/poi-images/khuzdar-cities-v2.webp","s":"Khuzdar egy város Beludzsisztánban, amely fontos megállóhely a Quettából Karacsiba vezető úton.","f":["Beludzsisztán tartomány második legnagyobb városa Quetta után.","Száraz és hegyvidéki táj veszi körül."]},"vehari-cities-v2":{"i":"/poi-images/vehari-cities-v2.webp","s":"Vehari egy város Pandzsábban és egy fontos gyapottermesztő terület központja.","f":["A 'gyapot városaként' ismert.","A város gazdasága nagymértékben a mezőgazdaságtól függ."]},"daska-cities-v2":{"i":"/poi-images/daska-cities-v2.webp","s":"Daska egy ipari város a Sialkot kerületben, amely mezőgazdasági gépek gyártásáról ismert.","f":["A mezőgazdasági eszközök gyártásának fontos központja.","A városban növekvő sebészeti műszeripar található."]},"mansehra-cities-v2":{"i":"/poi-images/mansehra-cities-v2.webp","s":"Mansehra egy város Khyber Pakhtunkhwa tartományban, amely kapuként szolgál az északi területekhez, mint például a Kaghan-völgy.","f":["Híres Ashoka sziklaediktumairól, ősi feliratokról.","Fontos turisztikai csomópont a Karakorum országúton."]},"toba-tek-singh-cities-v2":{"i":"/poi-images/toba-tek-singh-cities-v2.webp","s":"Toba Tek Singh egy város Pandzsábban, amelyet Saadat Hasan Manto híres novellája tett halhatatlanná.","f":["Egy szikh vallási vezetőről, Tek Singhről nevezték el.","Fontos mezőgazdasági központ, amely baromfiiparáról ismert."]},"shikarpur-cities-v2":{"i":"/poi-images/shikarpur-cities-v2.webp","s":"Shikarpur egy történelmi város Szindhben, amely egykor kereskedelméről és pénzügyeiről volt ismert.","f":["Híres savanyúságairól és más hagyományos ételeiről.","A városnak fallal körülvett óvárosa volt hét kapuval."]},"jacobabad-cities-v2":{"i":"/poi-images/jacobabad-cities-v2.webp","s":"Jacobabad egy város Szindhben, amely a világ egyik legforróbb helyeként ismert.","f":["A nyári hőmérséklet meghaladhatja az 50 Celsius-fokot.","Fontos vasúti csomópont és kereskedelmi központ."]},"khairpur-cities-v2":{"i":"/poi-images/khairpur-cities-v2.webp","s":"Khairpur az egykori Khairpur hercegi állam fővárosa volt Szindhben, és datolyatermesztéséről ismert.","f":["Pakisztán egyik legnagyobb datolyatermelője.","Itt található a Faiz Mahal, egy lenyűgöző palota."]},"burewala-cities-v2":{"i":"/poi-images/burewala-cities-v2.webp","s":"Burewala egy város a Vehari kerületben, Pandzsábban, és fontos mezőgazdasági központ.","f":["Pamut- és gabonapiacairól ismert.","A régió egyik leggyorsabban növekvő városa."]},"pakpattan-cities-v2":{"i":"/poi-images/pakpattan-cities-v2.webp","s":"Pakpattan egy ősi város Pandzsábban, amely Baba Farid szúfi szent szentélyének otthonaként ismert.","f":["Fontos zarándokhely a muszlimok számára Dél-Ázsiában.","A név jelentése 'Szent komp'. "]},"charsadda-cities-v2":{"i":"/poi-images/charsadda-cities-v2.webp","s":"Charsadda egy város Khyber Pakhtunkhwa tartományban, Gandhara ősi fővárosának, Pushkalavatinak a közelében található.","f":["A terület gazdag régészeti lelőhelyekben.","Cukor- és bőriparáról ismert."]},"wazirabad-cities-v2":{"i":"/poi-images/wazirabad-cities-v2.webp","s":"Wazirabad egy ipari város Pandzsábban, evőeszköz- és késgyártásáról ismert.","f":["Az 'evőeszközök városaként' ismert.","A Chenab folyó partján fekszik."]},"nowshera-cities-v2":{"i":"/poi-images/nowshera-cities-v2.webp","s":"Nowshera egy város a Kabul folyó mentén Khyber Pakhtunkhwa tartományban, és fontos ipari és kommunikációs csomópont.","f":["A várost a mogul korban alapították.","Itt található a híres Kund Park."]},"mingora-cities-v2":{"i":"/poi-images/mingora-cities-v2.webp","s":"Mingora a Swat-völgy legnagyobb városa Khyber Pakhtunkhwa tartományban, egy olyan területen, amely természeti szépségéről és régészeti lelőhelyeiről ismert.","f":["Fontos kereskedelmi központ a Swat régió számára.","A közelben buddhista sztúpák és kolostorok maradványai találhatók."]},"turbat-cities-v2":{"i":"/poi-images/turbat-cities-v2.webp","s":"Turbat egy város Dél-Beludzsisztánban és a Makran régió növekvő gazdasági központja.","f":["Datolyatermesztéséről ismert.","A közelben található az új Gwadar nemzetközi repülőtér."]},"gwadar-cities-v2":{"i":"/poi-images/gwadar-citie function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));

  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;

function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}

  const q=norm(sIn.value.trim());

    });
    const txt=c.querySelector('text');

  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
