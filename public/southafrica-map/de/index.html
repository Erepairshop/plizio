.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}

.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}
.region:hover{fill:#2d3a78}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#000;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#60a5fa}
.poi.g-sight circle{fill:#fbbf24}
.poi.g-nature circle{fill:#22c55e}
.poi.g-history circle{fill:#c084fc}
.poi.g-industry circle{fill:#fb923c}
.poi.g-other circle{fill:#9ca3af}
.poi.dim{opacity:.18}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7;fill:#fff;opacity:1}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}

.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}

.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}

.search.has-q .search-results.has-hits{display:block}

.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}

.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}

.poi.in-cluster{display:none}

#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}

.popup{position:absolute;bottom:0;left:0;right:0;background:#0d1230;border-top:1px solid #ffffff20;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -10px 40px #00000080}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}

.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}

","s":"Früher als Umtata bekannt, war es die Hauptstadt der Transkei und ist tief verbunden mit der Geschichte Nelson Mandelas.","f":["Beherbergt das Nelson Mandela Museum.","Zentrale Stadt für das Volk der Xhosa."]},"southafrica-makhanda-cities-v2":{"i":"/poi-images/southafrica-makhanda-cities-v2.webp","s":"Die zuvor als Grahamstown bekannte Stadt ist berühmt für ihre Bildungseinrichtungen und das jährliche Kunstfestival.","f":["Ausrichter des National Arts Festivals.","Heimat der Rhodes University."]},"southafrica-kariega-cities-v2":{"i":"/poi-images/southafrica-kariega-cities-v2.webp","s":"Früher Uitenhage genannt, ist diese Industriestadt stark in der Produktion von Autos und Reifen involviert.","f":["Standort des größten Volkswagen-Werks in Afrika.","2021 offiziell in Kariega umbenannt."]},"southafrica-graaff-reinet-cities-v2":{"i":"/poi-images/southafrica-graaff-reinet-cities-v2.webp","s":"Die viertälteste Stadt des Landes, umschlossen von einer Schleife des Sundays Rivers, voller kapholländischer Architektur.","f":["Beherbergt mehr Nationaldenkmäler als jede andere Stadt in Südafrika.","Liegt nahe dem Camdeboo-Nationalpark."]},"southafrica-queenstown-cities-v2":{"i":"/poi-images/southafrica-queenstown-cities-v2.webp","s":"Eine von Bergen umgebene Stadt, die historisch als strategischer Außenposten konzipiert wurde.","f":["Früher als Queenstown bekannt.","Das Zentrum ist sechseckig angelegt für bessere Verteidigung."]},"southafrica-aliwal-north-cities-v2":{"i":"/poi-images/southafrica-aliwal-north-cities-v2.webp","s":"Die Stadt am Oranje-Fluss ist vor allem für ihre heißen Mineralquellen bekannt, die viele Besucher anziehen.","f":["Benannt zu Ehren der Schlacht von Aliwal in Indien.","Die heißen Quellen erreichen 34°C."]},"southafrica-middelburg-cities-v2":{"i":"/poi-images/southafrica-middelburg-cities-v2.webp","s":"Ein starkes industrielles und landwirtschaftliches Zentrum, berühmt für die Produktion von rostfreiem Stahl und Kohle.","f":["Zentrum der Stahlindustrie von Mpumalanga.","Gegründet im Jahr 1864."]},"southafrica-witbank-cities-v2":{"i":"/poi-images/southafrica-witbank-cities-v2.webp","s":"Früher Witbank genannt, ist dies das Herzstück der Kohleförderregion und versorgt zahlreiche Kraftwerke.","f":["Der Name bedeutet 'Ort der Kohle'.","Winston Churchill versteckte sich hier während des Burenkriegs."]},"southafrica-secunda-cities-v2":{"i":"/poi-images/southafrica-secunda-cities-v2.webp","s":"Die zweite speziell errichtete Industriestadt von Sasol, die Benzin und andere Kraftstoffe aus Kohle produziert.","f":["Die Ölraffinerie hier gehört zu den größten der Welt.","Besitzt eines der höchsten Gebäude der Provinz."]},"southafrica-standerton-cities-v2":{"i":"/poi-images/southafrica-standerton-cities-v2.webp","s":"Eine große landwirtschaftliche Stadt am Vaal-Fluss, spezialisiert auf Milchwirtschaft, Mais- und Geflügelzucht.","f":["Gegründet auf der Farm von Kommandant A.H. Stander im Jahr 1876.","Beherbergt den Grootdraai-Staudamm."]},"southafrica-ermelo-cities-v2":{"i":"/poi-images/southafrica-ermelo-cities-v2.webp","s":"Das Tor zum Grasland von Mpumalanga ist ein Zentrum für den Abbau von Anthrazitkohle und die Wollproduktion.","f":["Benannt nach der niederländischen Stadt Ermelo.","Während des Burenkrieges komplett zerstört und danach neu aufgebaut."]},"southafrica-tzaneen-cities-v2":{"i":"/poi-images/southafrica-tzaneen-cities-v2.webp","s":"Die zweitgrößte Stadt in Limpopo liegt in einer üppig grünen, fruchtbaren Region, die tropische Früchte produziert.","f":["Gilt als eines der saubersten Städte in Südafrika.","Hauptanbaugebiet für Avocados, Mangos und Tee."]},"southafrica-mokopane-cities-v2":{"i":"/poi-images/southafrica-mokopane-cities-v2.webp","s":"Früher Potgietersrus genannt, ist die Stadt umgeben von einem der reichsten landwirtschaftlichen Gebiete des Landes.","f":["Heimat von Makapansgat, einer bedeutenden prähistorischen Fundstätte.","Wichtiges Zentrum des Platinbergbaus."]},"southafrica-thohoyandou-cities-v2":{"i":"/poi-images/southafrica-thohoyandou-cities-v2.webp","s":"Die ehemalige Hauptstadt des Venda-Homelands ist heute das kulturelle und kommerzielle Zentrum der Region Vhembe.","f":["Der Name bedeutet 'Kopf des Elefanten'.","Sitz der Universität von Venda."]},"southafrica-phalaborwa-cities-v2":{"i":"/poi-images/southafrica-phalaborwa-cities-v2.webp","s":"Bekannt als 'Die Stadt der zwei Sommer', liegt sie direkt am zentralen Eingangstor des Krüger-Nationalparks.","f":["Heimat der breitesten künstlichen Grube Afrikas durch Kupferabbau.","Temperaturen im Winter fallen selten tief."]},"port-of-durban-economic-v2":{"i":"/poi-images/port-of-durban-economic-v2.webp","s":"Der verkehrsreichste Hafen Südafrikas und einer der größten in Afrika, der als wichtiger Knotenpunkt für Container und Stückgut dient.","f":["Bewältigt über 60 % des südafrikanischen Containerverkehrs.","Strategisch günstig an der Ostküste gelegen, verbindet es Handelsrouten nach Asien."]},"port-of-richards-bay-economic-v2":{"i":"/poi-images/port-of-richards-bay-economic-v2.webp","s":"Ein Tiefseehafen, der vor allem für den Export von Kohle und anderen trockenen Massengütern bekannt ist.","f":["Beherbergt das größte Kohleexportterminal der Welt.","In den 1970er Jahren speziell für den Umschlag von Massengutexporten gebaut."]},"port-of-cape-town-economic-v2":{"i":"/poi-images/port-of-cape-town-economic-v2.webp","s":"Ein bedeutender Seehafen an einer der verkehrsreichsten Handelsrouten der Welt, bekannt für den Export von Frischprodukten.","f":["Dient als wichtigste Exportanlage für südafrikanisches Obst und Wein.","Außerdem ein wichtiges Zentrum für Schiffsreparatur und -wartung in der Region."]},"port-of-gqeberha-economic-v2":{"i":"/poi-images/port-of-gqeberha-economic-v2.webp","s":"Früher als Hafen von Port Elizabeth bekannt, ist er eine wichtige Anlage für die Automobil-Exportindustrie.","f":["Wird stark von der lokalen Automobilherstellungsbranche genutzt.","Verfügt über spezielle Autoterminal-Anlagen."]},"port-of-saldanha-economic-v2":{"i":"/poi-images/port-of-saldanha-economic-v2.webp","s":"Der größte und tiefste natürliche Hafen der südlichen Hemisphäre, spezialisiert auf den Export von Eisenerz.","f":["Über eine 861 km lange Bahnstrecke mit der Eisenerzmine Sishen verbunden.","Schlägt jährlich Millionen Tonnen Eisenerz um."]},"port-of-east-london-economic-v2":{"i":"/poi-images/port-of-east-london-economic-v2.webp","s":"Südafrikas einziger verbliebener Flusshafen, der an der Mündung des Buffalo River liegt.","f":["Dient in erster Linie der lokalen Automobil- und Landwirtschaftsindustrie.","Verfügt über einen speziellen Getreidesilo-Aufbau."]},"port-of-ngqura-economic-v2":{"i":"/poi-images/port-of-ngqura-economic-v2.webp","s":"Ein Tiefseehafen in der Nähe der Coega Industrial Development Zone, der für Schiffe der neuen Generation ausgelegt ist.","f":["Einer der neuesten Häfen Südafrikas, der 2009 eröffnet wurde.","Fungiert als wichtiger Umschlagplatz für die afrikanische Region."]},"mponeng-gold-mine-economic-v2":{"i":"/poi-images/mponeng-gold-mine-economic-v2.webp","s":"Das tiefste Goldbergwerk der Welt, das mehr als 4 Kilometer unter die Erdoberfläche reicht.","f":["Die Temperaturen am Boden können ohne Kühlung bis zu 60 °C erreichen.","Bergleute brauchen über eine Stunde, um von der Oberfläche zum Abbauort zu gelangen."]},"south-deep-gold-mine-economic-v2":{"i":"/poi-images/south-deep-gold-mine-economic-v2.webp","s":"Eines der nach Reserven größten Goldbergwerke weltweit, in dem hochmechanisierte Abbautechniken zum Einsatz kommen.","f":["Wird voraussichtlich noch weit über das Jahr 2080 hinaus in Betrieb sein.","Betrieben von Gold Fields Limited."]},"cullinan-diamond-mine-economic-v2":{"i":"/poi-images/cullinan-diamond-mine-economic-v2.webp","s":"Berühmt für die Förderung des Cullinan-Diamanten, des größten jemals gefundenen Rohdiamanten in Edelsteinqualität.","f":["Der Cullinan-Diamant wog bei seiner Entdeckung im Jahr 1905 3.106 Karat.","Produziert weiterhin erhebliche Mengen seltener blauer Diamanten."]},"venetia-diamond-mine-economic-v2":{"i":"/poi-images/venetia-diamond-mine-economic-v2.webp","s":"Der größte Diamantenproduzent in Südafrika, der sich derzeit vom Tagebau auf den Untertagebau umstellt.","f":["Macht über 40 % der jährlichen Diamantenproduktion Südafrikas aus.","Das Untertageprojekt wird die Lebensdauer der Mine bis 2046 verlängern."]},"finsch-diamond-mine-economic-v2":{"i":"/poi-images/finsch-diamond-mine-economic-v2.webp","s":"Eines der bedeutendsten untertägigen Diamantenbergwerke Südafrikas, bekannt für moderne Blockbau-Abbaumethoden.","f":["Ursprünglich in den 1960er Jahren als Tagebau entwickelt.","Nutzt ein automatisiertes Erztransportsystem."]},"sishen-iron-ore-mine-economic-v2":{"i":"/poi-images/sishen-iron-ore-mine-economic-v2.webp","s":"Einer der größten Eisenerz-Tagebaue der Welt, der hochwertiges Eisenerz fördert.","f":["Die Mine erstreckt sich über eine Länge von 14 Kilometern.","Das Erz wird auf einer massiven, speziell dafür gebauten Bahnstrecke zum Hafen von Saldanha transportiert."]},"palabora-copper-mine-economic-v2":{"i":"/poi-images/palabora-copper-mine-economic-v2.webp","s":"Südafrikas wichtigster Produzent von raffiniertem Kupfer, ursprünglich berühmt für das breiteste von Menschen gemachte Loch Afrikas.","f":["Arbeitet nahe der Grenze zum Kruger-Nationalpark.","Produziert auch Nebenprodukte wie Magnetit und Vermiculit."]},"grootegeluk-coal-mine-economic-v2":{"i":"/poi-images/grootegeluk-coal-mine-economic-v2.webp","s":"Der größte Kohletagebau in Südafrika, der nahegelegene Kraftwerke mit Brennstoff versorgt.","f":["Verfügt über den weltgrößten Kohleaufbereitungskomplex.","Stellt die primäre Kohleversorgung für die riesigen Kraftwerke Medupi und Matimba sicher."]},"kusile-power-station-economic-v2":{"i":"/poi-images/kusile-power-station-economic-v2.webp","s":"Ein riesiges Kohlekraftwerk, das sich im Bau befindet und eines der größten der Welt werden soll.","f":["Es ist das erste Kraftwerk in Südafrika, das eine Rauchgasentschwefelungsanlage installiert.","Wird nach Fertigstellung eine Kapazität von 4.800 Megawatt haben."]},"medupi-power-station-economic-v2":{"i":"/poi-images/medupi-power-station-economic-v2.webp","s":"Ein großes, trockengekühltes Kohlekraftwerk, das einen erheblichen Beitrag zum nationalen Stromnetz leistet.","f":["Nach installierter Kapazität das viertgrößte Kohlekraftwerk der Welt.","Nutzt aufgrund von Wasserknappheit in der Region direkte Trockenkühlsysteme."]},"kendal-power-station-economic-v2":{"i":"/poi-images/kendal-power-station-economic-v2.webp","s":"Eines von Eskoms Grundlast-Kohlekraftwerken und das weltweit größte indirekt trockengekühlte Kraftwerk.","f":["Kann 4.116 Megawatt Strom erzeugen.","Seine massiven Kühltürme sind ein markantes Wahrzeichen in Mpumalanga."]},"sasol-secunda-economic-v2":{"i":"/poi-images/sasol-secunda-economic-v2.webp","s":"Eine riesige Anlage für synthetische Kraftstoffe, die flüssige Kraftstoffe und Chemikalien aus Kohle herstellt.","f":["Die größte punktuelle Treibhausgasemissionsquelle der Erde.","Nutzt das ursprünglich in Deutschland entwickelte Fischer-Tropsch-Verfahren."]},"sasol-sasolburg-economic-v2":{"i":"/poi-images/sasol-sasolburg-economic-v2.webp","s":"Die ursprüngliche Sasol-Anlage, die für die Chemie- und Polymerproduktion von Kohle auf Erdgas umgestellt wurde.","f":["1950 gegründet, um Südafrikas Abhängigkeit von importiertem Öl zu verringern.","Konzentriert sich heute stark auf hochwertige chemische Produkte."]},"bmw-rosslyn-plant-economic-v2":{"i":"/poi-images/bmw-rosslyn-plant-economic-v2.webp","s":"Die erste BMW-Produktionsstätte außerhalb Deutschlands, die Fahrzeuge für den lokalen und den Exportmarkt produziert.","f":["Seit 1968 in Betrieb, hat es über eine Million Fahrzeuge produziert.","Investiert derzeit stark in die Produktion von Plug-in-Hybrid-Elektrofahrzeugen."]},"vw-kariega-plant-economic-v2":{"i":"/poi-images/vw-kariega-plant-economic-v2.webp","s":"Das größte Autowerk Afrikas, das das beliebte Polo-Modell für den internationalen Vertrieb produziert.","f":["Zuvor in Uitenhage (jetzt Kariega) angesiedelt.","Ein Eckpfeiler der verarbeitenden Wirtschaft im Ostkap."]},"ford-silverton-plant-economic-v2":{"i":"/poi-images/ford-silverton-plant-economic-v2.webp","s":"Ein hochmodernes Automobilmontagewerk, spezialisiert auf die Produktion des Ford Ranger.","f":["Exportiert Pickup-Trucks in über 100 Märkte weltweit.","Wurde kürzlich einem massiven Modernisierungs- und Erweiterungsprojekt unterzogen."]},"toyota-prospecton-plant-economic-v2":{"i":"/poi-images/toyota-prospecton-plant-economic-v2.webp","s":"Toyotas riesiges Montagewerk, in dem der Hilux, der Fortuner und andere Modelle für Afrika und Europa hergestellt werden.","f":["Erlitt während der Überschwemmungen in KwaZulu-Natal 2022 erhebliche Schäden, erholte sich aber vollständig.","Eines der Automobilwerke mit dem höchsten Produktionsvolumen auf dem Kontinent."]},"mercedes-east-london-plant-economic-v2":{"i":"/poi-images/mercedes-east-london-plant-economic-v2.webp","s":"Ein erstklassiges Automobilwerk, das für die Produktion der Mercedes-Benz C-Klasse verantwortlich ist.","f":["Zählte in Bezug auf die Qualität durchweg zu den weltbesten Mercedes-Benz-Werken.","Bietet in der Region Ostkap eine beträchtliche Anzahl von Arbeitsplätzen."]},"koeberg-nuclear-power-station-economic-v2":{"i":"/poi-images/koeberg-nuclear-power-station-economic-v2.webp","s":"Das einzige kommerzielle Kernkraftwerk in Afrika, das einen Großteil des Stroms für das Westkap liefert.","f":["Liegt an der Atlantikküste und nutzt Meerwasser zur Kühlung.","Verfügt über zwei Druckwasserreaktoren."]},"anglo-american-platinum-rustenburg-economic-v2":{"i":"/poi-images/anglo-american-platinum-rustenburg-economic-v2.webp","s":"Als Teil des Bushveld-Komplexes leistet diese Anlage einen wesentlichen Beitrag zur weltweiten Versorgung mit Platingruppenmetallen.","f":["Platin ist für Katalysatoren in der Automobilindustrie unverzichtbar.","Der Bushveld-Komplex birgt den Großteil der weltweit bekannten Platinreserven."]},"impala-platinum-mine-economic-v2":{"i":"/poi-images/impala-platinum-mine-economic-v2.webp","s":"Einer der weltweit führenden Betriebe für Platingruppenmetalle in der Nähe von Rustenburg.","f":["Verfügt über einen massiven untertägigen Fußabdruck mit mehreren Schachtsystemen.","Beschäftigt Zehntausende von Arbeitern in der Region."]},"foskor-phalaborwa-economic-v2":{"i":"/poi-images/foskor-phalaborwa-economic-v2.webp","s":"Ein bedeutender Produzent von Rohphosphat und Phosphorsäure, die für landwirtschaftliche Düngemittel unerlässlich sind.","f":["Exportiert hochwertige Phosphorsäure weltweit.","Arbeitet mit den benachbarten Kupferbergbaubetrieben zusammen."]},"modikwa-platinum-mine-economic-v2":{"i":"/poi-images/modikwa-platinum-mine-economic-v2.webp","s":"Eine unabhängig geführte Platinmine am östlichen Rand des Bushveld-Komplexes.","f":["Betrieben als Joint Venture zwischen African Rainbow Minerals und Anglo American Platinum.","Konzentriert sich auf die breit angelegte wirtschaftliche Stärkung der schwarzen Bevölkerung."]},"cradle-of-humankind-history-v2":{"i":"/poi-images/cradle-of-humankind-history-v2.webp","s":"Die Wiege der Menschheit ist ein Weltkulturerbegebiet, das einige der ältesten hominiden Fossilien der Welt beherbergt.","f":["Es umfasst eine Fläche von etwa 470 Quadratkilometern.","Hier wurde der berühmte 'Mrs. Ples'-Schädel gefunden."]},"castle-of-good-hope-history-v2":{"i":"/poi-images/castle-of-good-hope-history-v2.webp","s":"Die Burg der Guten Hoffnung ist eine Bastionsfestung in Kapstadt und das älteste noch existierende Kolonialgebäude in Südafrika.","f":["Es wurde zwischen 1666 und 1679 von der Niederländischen Ostindien-Kompanie erbaut.","Das Bauwerk hat einen fünfeckigen Grundriss."]},"mapungubwe-history-v2":{"i":"/poi-images/mapungubwe-history-v2.webp","s":"Mapungubwe war eine präkoloniale städtische Siedlung und ein afrikanisches Königreich, das südlich des Flusses Limpopo florierte.","f":["Das Königreich existierte von etwa 1075 bis 1220.","Das berühmte Goldene Nashorn von Mapungubwe wurde hier entdeckt."]},"voortrekker-monument-history-v2":{"i":"/poi-images/voortrekker-monument-history-v2.webp","s":"Das Voortrekker-Monument ist ein massives Granitbauwerk in Pretoria zum Gedenken an die burischen Pioniere, die die Kapkolonie verließen.","f":["Das Monument ist 40 Meter hoch.","Es wurde 1949 eingeweiht."]},"blood-river-heritage-site-history-v2":{"i":"/poi-images/blood-river-heritage-site-history-v2.webp","s":"Die Gedenkstätte am Blood River erinnert an die historische Schlacht von 1838 zwischen den Voortrekkern und dem Zulu-Königreich.","f":["Die Anlage besteht aus 64 lebensgroßen Bronzewagen.","Die Schlacht fand am 16. Dezember 1838 statt."]},"isandlwana-battlefield-history-v2":{"i":"/poi-images/isandlwana-battlefield-history-v2.webp","s":"Das Isandlwana-Schlachtfeld war der Schauplatz der ersten großen Begegnung im Zulukrieg, wo die britische Armee 1879 eine entscheidende Niederlage erlitt.","f":["Die Schlacht fand am 22. Januar 1879 statt.","Über 20.000 Zulu-Krieger überraschten die britischen Truppen."]},"rorkes-drift-history-v2":{"i":"/poi-images/rorkes-drift-history-v2.webp","s":"Rorke's Drift war der Schauplatz einer berühmten Verteidigungsschlacht im Jahr 1879, bei der eine kleine britische Garnison einen massiven Zulu-Angriff abwehrte.","f":["Etwa 150 britische Soldaten verteidigten die Station gegen 3.000 bis 4.000 Zulu-Krieger.","Für diese Schlacht wurden 11 Victoria-Kreuze verliehen."]},"nelson-mandela-capture-site-history-v2":{"i":"/poi-images/nelson-mandela-capture-site-history-v2.webp","s":"Diese Gedenkstätte markiert den genauen Ort, an dem Nelson Mandela 1962 von der Apartheid-Polizei festgenommen wurde.","f":["Die Festnahme führte zu Mandelas 27-jähriger Haftstrafe.","Die Skulptur vor Ort besteht aus 50 lasergeschnittenen Stahlsäulen."]},"district-six-museum-history-v2":{"i":"/poi-images/district-six-museum-history-v2.webp","s":"District Six war ein ehemals lebhaftes, multikulturelles Viertel in Kapstadt, das während der Apartheid zwangsgeräumt und zerstört wurde.","f":["Über 60.000 Menschen wurden in den 1970er Jahren von hier vertrieben.","Das Gebiet blieb jahrzehntelang weitgehend unbebaut."]},"apartheid-museum-history-v2":{"i":"/poi-images/apartheid-museum-history-v2.webp","s":"Der Komplex veranschaulicht die Geschichte Südafrikas im 20.","f":["Das Museum wurde 2001 eröffnet.","Besucher erhalten am Eingang zufällig Eintrittskarten als 'Weiß' oder 'Nicht-Weiß'."]},"groot-constantia-history-v2":{"i":"/poi-images/groot-constantia-history-v2.webp","s":"Groot Constantia ist das älteste noch existierende Weingut in Südafrika mit einer Geschichte, die bis ins 17.","f":["Das Gut wurde 1685 von Simon van der Stel gegründet.","Napoleon Bonaparte trank regelmäßig Constantia-Wein in seinem Exil."]},"thulamela-ruins-history-v2":{"i":"/poi-images/thulamela-ruins-history-v2.webp","s":"Die Thulamela-Ruinen sind eine steinerne archäologische Stätte, die mit der späten Eisenzeit und der simbabwischen Kultur in Verbindung gebracht wird.","f":["Die Stätte war von 1200 bis 1600 n. Chr. bewohnt.","Es wurden Artefakte aus Gold und Glasperlen gefunden."]},"blombos-cave-history-v2":{"i":"/poi-images/blombos-cave-history-v2.webp","s":"Die Blombos-Höhle ist eine wichtige archäologische Stätte mit Artefakten der frühen modernen Menschen (Homo sapiens) aus der Mittelsteinzeit.","f":["Die Funde deuten auf fortgeschrittenes menschliches Verhalten vor 70.000 Jahren hin.","Hier wurden einige der frühesten bekannten Schmuckstücke gefunden."]},"kimberley-mine-history-v2":{"i":"/poi-images/kimberley-mine-history-v2.webp","s":"Das Big Hole in Kimberley ist ein massiver offener Tagebau und ein Überbleibsel des historischen Diamantenrauschs in Südafrika.","f":["Es ist eines der größten von Hand gegrabenen Löcher der Welt.","Aus der Mine wurden fast 3 Tonnen Diamanten gewonnen."]},"sterkfontein-caves-history-v2":{"i":"/poi-images/sterkfontein-caves-history-v2.webp","s":"Die Sterkfontein-Höhlen, Teil der Wiege der Menschheit, sind weltweit bekannt für ihre reichen Fossilienfunde, insbesondere von frühen Hominiden.","f":["Über ein Drittel der frühen Hominiden-Fossilien stammen von hier.","Das fast vollständige Skelett 'Little Foot' wurde hier entdeckt."]},"kaditshwene-ruins-history-v2":{"i":"/poi-images/kaditshwene-ruins-history-v2.webp","s":"Kaditshwene war eine bedeutende eisenzeitliche Stadt und die Hauptstadt der Bahurutshe-Nation, bevor sie im frühen 19.","f":["In den 1820er Jahren hatte die Stadt schätzungsweise 16.000 bis 20.000 Einwohner.","Die Stätte enthält umfangreiche Überreste von Steinmauern."]},"pilgrims-rest-history-v2":{"i":"/poi-images/pilgrims-rest-history-v2.webp","s":"Pilgrim's Rest ist ein historisches Städtchen, das nach der Entdeckung von Gold im Jahr 1873 entstand und heute fast unverändert aussieht.","f":["Die gesamte Stadt wurde 1986 zum Nationaldenkmal erklärt.","Sie war das Zentrum des zweiten Goldrausches in Transvaal."]},"pinnacle-point-caves-history-v2":{"i":"/poi-images/pinnacle-point-caves-history-v2.webp","s":"Pinnacle Point ist ein archäologisches Gebiet an der Südküste, das einige der frühesten Beweise für modernes menschliches Verhalten liefert.","f":["Funde zeigen, dass Menschen hier vor 164.000 Jahren Meeresressourcen nutzten.","Die Höhlen lieferten frühe Beweise für die Wärmebehandlung von Gestein."]},"makapansgat-history-v2":{"i":"/poi-images/makapansgat-history-v2.webp","s":"Das Makapansgat ist ein bedeutendes paläontologisches Tal, das eine extrem lange Aufzeichnung menschlicher Besiedlung über Millionen von Jahren aufweist.","f":["Es ist Teil der erweiterten Wiege der Menschheit.","Die Höhlen waren auch Schauplatz einer historischen Belagerung im Jahr 1854."]},"hector-pieterson-memorial-history-v2":{"i":"/poi-images/hector-pieterson-memorial-history-v2.webp","s":"Das Mahnmal ehrt den jungen Schüler Hector Pieterson und die Studenten, die während des Aufstands in Soweto 1976 ums Leben kamen.","f":["Hector Pieterson wurde im Alter von 12 Jahren von der Polizei erschossen.","Das ikonische Foto seines Todes wurde zum Symbol des Anti-Apartheid-Kampfes."]},"taung-heritage-site-history-v2":{"i":"/poi-images/taung-heritage-site-history-v2.webp","s":"Die Stätte von Taung ist der Ort, an dem 1924 der fossile Schädel des berühmten 'Taung-Kindes' gefunden wurde, ein früher Beweis für Homininen in Afrika.","f":["Das Taung-Kind ist ein Fossil der Art Australopithecus africanus.","Die Entdeckung veränderte das Verständnis der menschlichen Evolution."]},"majuba-hill-history-v2":{"i":"/poi-images/majuba-hill-history-v2.webp","s":"Majuba Hill war der Schauplatz der letzten und entscheidenden Schlacht des Ersten Burenkrieges im Jahr 1881, die mit einem Sieg der Buren endete.","f":["Die britischen Truppen erlitten schwere Verluste, einschließlich ihres Kommandeurs George Pomeroy Colley.","Die Niederlage führte zum Friedensvertrag von Pretoria."]},"spion-kop-battlefield-history-v2":{"i":"/poi-images/spion-kop-battlefield-history-v2.webp","s":"Spion Kop war der Ort einer blutigen Schlacht während des Zweiten Burenkrieges im Jahr 1900, bei der britische Truppen vergeblich versuchten, die belagerte Stadt Ladysmith zu befreien.","f":["Die Schlacht dauerte zwei Tage und endete mit einem britischen Rückzug.","Zu den Anwesenden gehörten Winston Churchill und Mahatma Gandhi."]},"constitution-hill-history-v2":{"i":"/poi-images/constitution-hill-history-v2.webp","s":"Constitution Hill in Johannesburg ist ein ehemaliger Gefängniskomplex, der heute Sitz des Verfassungsgerichts von Südafrika ist.","f":["Sowohl Nelson Mandela als auch Mahatma Gandhi waren hier inhaftiert.","Das Old Fort Prison wurde 1892 erbaut."]},"klasies-river-caves-history-v2":{"i":"/poi-images/klasies-river-caves-history-v2.webp","s":"Die Klasies-River-Höhlen an der Ostküste enthalten Beweise dafür, dass moderne Menschen hier vor etwa 125.000 Jahren dauerhaft lebten.","f":["Es ist eine der ältesten bekannten Stätten anatomisch moderner Menschen.","Die Funde umfassen frühe Beweise für den Verzehr von Schalentieren."]},"wonderwerk-cave-history-v2":{"i":"/poi-images/wonderwerk-cave-history-v2.webp","s":"Die Wonderwerk-Höhle ist eine archäologische Stätte in den Kuruman Hills mit Beweisen für menschliche Besiedlung, die 2 Millionen Jahre zurückreichen.","f":["Sie ist fast 140 Meter tief in den Hügel gegraben.","Sie enthält die ältesten bekannten Beweise für kontrolliertes Feuer."]},"matjes-river-rock-shelter-history-v2":{"i":"/poi-images/matjes-river-rock-shelter-history-v2.webp","s":"Das Matjes-River-Felsdach ist ein riesiger Überhang nahe der Küste, der Tausende von Gräbern und archäologischen Schätzen der Khoisan enthält.","f":["Die Schichtablagerungen sind bis zu 10 Meter dick.","Der Ort wurde seit über 12.000 Jahren von Jägern und Sammlern genutzt."]},"union-buildings-history-v2":{"i":"/poi-images/union-buildings-history-v2.webp","s":"Die Union Buildings bilden den offiziellen Regierungssitz Südafrikas und sind ein ikonisches Wahrzeichen in Pretoria, das von Sir Herbert Baker entworfen wurde.","f":["Sie wurden 1913 aus hellem Sandstein fertiggestellt.","Nelson Mandela legte hier 1994 seinen Amtseid als Präsident ab."]},"church-square-pretoria-history-v2":{"i":"/poi-images/church-square-pretoria-history-v2.webp","s":"Der Church Square ist das historische Zentrum der Stadt Pretoria, umgeben von bedeutenden architektonischen Gebäuden aus dem späten 19.","f":["In der Mitte steht eine Bronzestatue von Paul Kruger.","Die erste Kirche des Platzes wurde 1856 erbaut."]},"fnb-stadium-landmarks-v2":{"i":"/poi-images/fnb-stadium-landmarks-v2.webp","s":"Das größte Stadion Afrikas und Austragungsort des Finales der Fußball-Weltmeisterschaft 2010.","f":["Wird aufgrund seiner Form oft als 'Calabash' (Flaschenkürbis) bezeichnet.","Bietet Platz für über 94.000 Zuschauer."]},"ponte-city-landmarks-v2":{"i":"/poi-images/ponte-city-landmarks-v2.webp","s":"Ein zylindrischer Wolkenkratzer in Johannesburg und das höchste Wohngebäude Afrikas.","f":["Wurde 1975 erbaut und ist 173 Meter hoch.","Besitzt einen hohlen inneren Kern, der als 'Core' bekannt ist."]},"moses-mabhida-stadium-landmarks-v2":{"i":"/poi-images/moses-mabhida-stadium-landmarks-v2.webp","s":"Ein Mehrzweckstadion in Durban, bekannt für seinen markanten Bogen, der über das Spielfeld spannt.","f":["Besucher können mit einer Seilbahn auf die Spitze des Bogens fahren.","Wurde für die Fußball-Weltmeisterschaft 2010 erbaut."]},"cape-town-stadium-landmarks-v2":{"i":"/poi-images/cape-town-stadium-landmarks-v2.webp","s":"Ein ikonisches Sportstadion in Green Point mit atemberaubendem Blick auf den Tafelberg und das Meer.","f":["Es war Austragungsort mehrerer Spiele während der WM 2010.","Das Dach besteht aus teflonbeschichtetem Glasfasergewebe."]},"carlton-centre-landmarks-v2":{"i":"/poi-images/carlton-centre-landmarks-v2.webp","s":"Ein Wolkenkratzer und Einkaufszentrum, das jahrzehntelang das höchste Gebäude in Afrika war.","f":["Wurde 1973 fertiggestellt und ist 223 Meter hoch.","Verlor den Titel des höchsten Gebäudes 2019 an The Leonardo."]},"nelson-mandela-bridge-landmarks-v2":{"i":"/poi-images/nelson-mandela-bridge-landmarks-v2.webp","s":"Eine markante Schrägseilbrücke, die das Geschäftsviertel von Johannesburg mit dem Stadtteil Braamfontein verbindet.","f":["Sie wurde 2003 von Nelson Mandela selbst eröffnet.","Die Brücke überspannt über 40 Eisenbahnschienen."]},"zeitz-mocaa-landmarks-v2":{"i":"/poi-images/zeitz-mocaa-landmarks-v2.webp","s":"Das größte Museum für zeitgenössische afrikanische Kunst der Welt, untergebracht in einem umgebauten Getreidesilo.","f":["Die Architektur von Thomas Heatherwick schnitt die Galerien aus den röhrenförmigen Silos heraus.","Eröffnet 2017 an der V&A Waterfront in Kapstadt."]},"rhodes-memorial-landmarks-v2":{"i":"/poi-images/rhodes-memorial-landmarks-v2.webp","s":"Ein Denkmal für Cecil John Rhodes am Hang des Devil's Peak in Kapstadt.","f":["Entworfen im antiken griechischen Stil von Sir Herbert Baker.","Bietet einen weiten Blick über die nördlichen Vororte von Kapstadt."]},"hillbrow-tower-landmarks-v2":{"i":"/poi-images/hillbrow-tower-landmarks-v2.webp","s":"Ein hoher Telekommunikationsturm, der die Skyline von Johannesburg dominiert.","f":["Er ist 269 Meter hoch und das höchste Bauwerk Afrikas.","Bis 1981 beherbergte er ein Drehrestaurant an der Spitze."]},"the-leonardo-landmarks-v2":{"i":"/poi-images/the-leonardo-landmarks-v2.webp","s":"Ein luxuriöser Mehrzweck-Wolkenkratzer in Sandton, Johannesburg.","f":["Wurde 2019 fertiggestellt und übertraf das Carlton Centre als höchstes Gebäude Südafrikas.","Es ist 234 Meter hoch und beherbergt Wohnungen, Büros und ein Hotel."]},"bloukrans-bridge-landmarks-v2":{"i":"/poi-images/bloukrans-bridge-landmarks-v2.webp","s":"Eine Bogenbrücke an der Garden Route, weltberühmt für kommerzielles Bungee-Jumping.","f":["Mit 216 Metern Höhe ist es einer der höchsten kommerziellen Bungee-Sprünge der Welt.","Die Brücke wurde 1984 fertiggestellt."]},"taalmonument-landmarks-v2":{"i":"/poi-images/taalmonument-landmarks-v2.webp","s":"Ein Denkmal in Paarl, das der Entstehung und Entwicklung der Sprache Afrikaans gewidmet ist.","f":["Es wurde 1975 eingeweiht, 100 Jahre nach der Gründung einer Bewegung zur Anerkennung von Afrikaans.","Das Design symbolisiert die verschiedenen Einflüsse auf die Sprache."]},"juma-masjid-mosque-landmarks-v2":{"i":"/poi-images/juma-masjid-mosque-landmarks-v2.webp","s":"Eine der größten Moscheen auf der südlichen Hemisphäre, gelegen im Zentrum von Durban.","f":["Die Moschee kann bis zu 6.000 Gläubige aufnehmen.","Sie verfügt über eine markante Architektur mit mehreren goldenen Kuppeln."]},"nizamiye-mosque-landmarks-v2":{"i":"/poi-images/nizamiye-mosque-landmarks-v2.webp","s":"Die größte Moschee auf der südlichen Hemisphäre, mit klassischer osmanischer Architektur in Midrand.","f":["Das Gebäude ist der berühmten Selimiye-Moschee in der Türkei nachempfunden.","Der Komplex umfasst auch eine Klinik, eine Schule und einen Basar."]},"pretoria-city-hall-landmarks-v2":{"i":"/poi-images/pretoria-city-hall-landmarks-v2.webp","s":"Ein monumentales historisches Gebäude in Pretoria mit einer großen Uhr und 32 Glocken.","f":["Es wurde 1935 erbaut und ist für seine große Halle berühmt.","Auf dem Vorplatz stehen Statuen von Andries Pretorius und Marthinus Wessel Pretorius."]},"cape-town-city-hall-landmarks-v2":{"i":"/poi-images/cape-town-city-hall-landmarks-v2.webp","s":"Ein großes edwardianisches Gebäude im Zentrum von Kapstadt am Grand Parade.","f":["Von dessen Balkon hielt Nelson Mandela 1990 seine erste Rede nach der Freilassung.","Die Turmuhr ist eine Nachbildung von Big Ben."]},"nelson-mandela-bay-stadium-landmarks-v2":{"i":"/poi-images/nelson-mandela-bay-stadium-landmarks-v2.webp","s":"Ein Mehrzweckstadion in Gqeberha (Port Elizabeth) mit einem markanten Dachdesign.","f":["Das Dach sieht aus wie Sonnenblumenblätter und bietet Schutz vor starkem Wind.","Es wurde für die Fußball-Weltmeisterschaft 2010 gebaut."]},"sentech-tower-landmarks-v2":{"i":"/poi-images/sentech-tower-landmarks-v2.webp","s":"Ein 237 Meter hoher Fernseh- und Funkturm in Johannesburg.","f":["Vor dem Bau des Hillbrow Towers war es das höchste Bauwerk der Stadt.","Seit den 1980er Jahren ist die Aussichtsplattform für die Öffentlichkeit geschlossen."]},"11-diagonal-street-landmarks-v2":{"i":"/poi-images/11-diagonal-street-landmarks-v2.webp","s":"Ein markanter Wolkenkratzer in Johannesburg, der wie ein Diamant geformt ist.","f":["Die Glasfassade reflektiert das umgebende Geschäftsviertel.","Entworfen vom bekannten Architekten Helmut Jahn."]},"alice-lane-towers-landmarks-v2":{"i":"/poi-images/alice-lane-towers-landmarks-v2.webp","s":"Moderne, geschwungene Zwillingstürme, die zu einer Ikone des Geschäftsviertels von Sandton geworden sind.","f":["Sollten ursprünglich wie tanzende Figuren aussehen.","Beherbergen vor allem Anwaltskanzleien und Finanzinstitute."]},"88-on-field-landmarks-v2":{"i":"/poi-images/88-on-field-landmarks-v2.webp","s":"Ein bedeutender Wolkenkratzer in Durban, der das Zentrum der Stadt dominiert.","f":["Das Gebäude ist 146 Meter hoch und wurde 1985 fertiggestellt.","Es zeichnet sich durch seine reflektierende Glasfassade aus."]},"green-point-lighthouse-landmarks-v2":{"i":"/poi-images/green-point-lighthouse-landmarks-v2.webp","s":"Der älteste funktionierende Leuchtturm in Südafrika, erkennbar an seinen markanten roten und weißen Streifen.","f":["Er wurde 1824 erbaut und hat unzählige Schiffe in die Tafelbucht geleitet.","Heute beherbergt der Leuchtturm auch ein kleines Museum."]},"cape-columbine-lighthouse-landmarks-v2":{"i":"/poi-images/cape-columbine-lighthouse-landmarks-v2.webp","s":"Ein historischer Leuchtturm in Paternoster, der oft als einer der letzten bemannten Leuchttürme Südafrikas bezeichnet wird.","f":["Erbaut 1936 auf einem felsigen Ausläufer.","Sein Licht ist aus einer Entfernung von 32 Seemeilen sichtbar."]},"durban-city-hall-landmarks-v2":{"i":"/poi-images/durban-city-hall-landmarks-v2.webp","s":"Ein prächtiges Gebäude im Edwardianischen Barockstil, das dem Rathaus in Belfast, Nordirland, sehr ähnlich ist.","f":["Es wurde 1910 erbaut und beherbergt eine Kunstgalerie sowie eine Bibliothek.","Das Gebäude verfügt über eine fast 48 Meter hohe zentrale Kuppel."]},"the-pearls-of-umhlanga-landmarks-v2":{"i":"/poi-images/the-pearls-of-umhlanga-landmarks-v2.webp","s":"Ein markanter, luxuriöser Apartmentkomplex in Umhlanga an der Küste von KwaZulu-Natal.","f":["Der Komplex besteht aus mehreren Hochhaustürmen.","Der höchste Turm, Pearl Sky, ist eines der höchsten Gebäude der Region."]},"cape-point-lighthouse-landmarks-v2":{"i":"/poi-images/cape-point-lighthouse-landmarks-v2.webp","s":"Ein Leuchtturm am Cape Point, der Schiffe um die gefährliche Südwestspitze Afrikas navigiert.","f":["Der alte Leuchtturm stand zu hoch und wurde oft von Nebel verdeckt.","Der neue Leuchtturm aus dem Jahr 1914 steht viel niedriger an den Klippen."]},"owl-house-landmarks-v2":{"i":"/poi-images/owl-house-landmarks-v2.webp","s":"Ein faszinierendes Haus und Skulpturengarten, geschaffen von der Außenseiter-Künstlerin Helen Martins in Nieu-Bethesda.","f":["Der Innenhof ist mit über 300 Skulpturen von Eulen, Kamelen und anderen Figuren gefüllt.","Helen Martins verbrachte Jahrzehnte damit, ihr Zuhause mit Glasstücken und Zement zu dekorieren."]},"paul-kruger-statue-landmarks-v2":{"i":"/poi-images/paul-kruger-statue-landmarks-v2.webp","s":"Eine markante Bronzestatue von Paul Kruger, einem ehemaligen Präsidenten der Südafrikanischen Republik, auf dem Church Square in Pretoria.","f":["Die Skulptur wurde von Anton van Wouw entworfen.","Kruger ist zusammen mit vier bewaffneten burischen Kämpfern abgebildet."]},"port-elizabeth-city-hall-landmarks-v2":{"i":"/poi-images/port-elizabeth-city-hall-landmarks-v2.webp","s":"Ein historisches Regierungsgebäude mit einem großen Uhrenturm im Zentrum von Gqeberha (Port Elizabeth).","f":["Das Gebäude wurde zwischen 1858 und 1862 erbaut.","Es erlitt 1977 einen schweren Brand, wurde aber originalgetreu restauriert."]},"kruger-national-park-life-v2":{"i":"/poi-images/kruger-national-park-life-v2.webp","s":"Eines der größten Wildschutzgebiete Afrikas, bekannt für die 'Big Five'.","f":["Heimat der Big Five.","Größter Park Südafrikas."]},"addo-elephant-park-life-v2":{"i":"/poi-images/addo-elephant-park-life-v2.webp","s":"Schutzgebiet, berühmt für seine riesigen Elefantenherden.","f":["Über 600 Elefanten.","Liegt bei Port Elizabeth."]},"table-mountain-kids-life-v2":{"i":"/poi-images/table-mountain-kids-life-v2.webp","s":"Die Seilbahn bringt Familien sicher auf den Gipfel des berühmten Tafelbergs.","f":["Drehbare Kabinen.","Spektakulärer Blick auf Kapstadt."]},"stellenbosch-winelands-life-v2":{"i":"/poi-images/stellenbosch-winelands-life-v2.webp","s":"Eine der wichtigsten landwirtschaftlic const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
