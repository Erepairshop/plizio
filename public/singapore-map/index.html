.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.drag{cursor:grabbing}
.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}
.region:hover{fill:#2d3a78}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#000;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#60a5fa}
.poi.g-sight circle{fill:#fbbf24}
.poi.g-nature circle{fill:#22c55e}
.poi.g-history circle{fill:#c084fc}
.poi.g-industry circle{fill:#fb923c}
.poi.g-other circle{fill:#9ca3af}
.poi.dim{opacity:.18}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7;fill:#fff;opacity:1}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}

.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:#0d1230;border-top:1px solid #ffffff20;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -10px 40px #00000080}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a{display:flex;align-items:center;gap:.55rem;padding:.55rem .55rem;border-radius:8px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:active{background:#ffffff14}
.popup .list a .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.popup .list a .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup .list a .g{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.popup .list .nl{padding:.6rem;color:#ffffff70;font-size:.85rem;font-style:italic}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}

v2.webp","s":"Viszonylag új lakónegyed az északkeleti részen, gyorsan növekvő népességgel és modern szolgáltatásokkal.","f":["A Sengkang név kínaiul 'virágzó kikötőt' jelent.","A Sengkang Riverside Park egy fontos zöld rekreációs terület."]},"choa-chu-kang-cities-v2":{"i":"/poi-images/choa-chu-kang-cities-v2.webp","s":"Szingapúr északnyugati részén fekvő lakónegyed, amely egykor vidéki terület volt, és modern várossá fejlődött.","f":["A Choa Chu Kang Park a közösség központi találkozóhelye.","A külterületeken még mindig találhatók farmok."]},"bukit-merah-cities-v2":{"i":"/poi-images/bukit-merah-cities-v2.webp","s":"Fejlett lakónegyed, amelyben állami és magánlakások, parkok és kereskedelmi épületek egyaránt megtalálhatók.","f":["A név malájul 'Vörös-hegyet' jelent.","A Mount Faber Parkból panorámás kilátás nyílik a városra."]},"geylang-cities-v2":{"i":"/poi-images/geylang-cities-v2.webp","s":"Élénk negyed, amely gazdag gasztronómiai életéről, megőrzött üzletházairól és nyüzsgő éjszakai életéről ismert.","f":["A Geylang Serai Piac a maláj kultúra és konyha központja.","Híres a durian standjairól a szezonban."]},"kallang-cities-v2":{"i":"/poi-images/kallang-cities-v2.webp","s":"Sport- és szórakoztató központ, amely a Singapore Sports Hub-nak ad otthont és a Kallang folyó mellett fekszik.","f":["Itt található a Nemzeti Stadion.","A Kallang folyó Szingapúr leghosszabb folyója."]},"bishan-cities-v2":{"i":"/poi-images/bishan-cities-v2.webp","s":"Központi fekvésű lakónegyed, amely jól megtervezett állami lakásairól és a Bishan-Ang Mo Kio Parkról ismert.","f":["Az egyik legdrágább állami lakóövezet.","Itt található a Raffles Institution, Szingapúr egyik legjobb iskolája."]},"ang-mo-kio-cities-v2":{"i":"/poi-images/ang-mo-kio-cities-v2.webp","s":"Szingapúr egyik legrégebbi és legfejlettebb lakónegyede, amely egy jól bevált közösséget kínál.","f":["A név hokkien nyelven 'vörös hajú hidat' jelent.","Az AMK Hub a fő bevásárlóközpont."]},"bukit-batok-cities-v2":{"i":"/poi-images/bukit-batok-cities-v2.webp","s":"Nyugati lakónegyed, amely festői kőbányáiról ismert, amelyeket parkokká és tavakká alakítottak át.","f":["A név malájul 'köhögő-hegyet' jelent.","A Little Guilin egy népszerű park, amely egy kínai gránitsziklára emlékeztet."]},"yishun-cities-v2":{"i":"/poi-images/yishun-cities-v2.webp","s":"Fejlett lakónegyed Szingapúr északi részén, amely a Lower Seletar Reservoir Park köré épült.","f":["Korábban Nee Soon néven volt ismert.","A Northpoint City az északi rész legnagyobb bevásárlóközpontja."]},"pasir-ris-cities-v2":{"i":"/poi-images/pasir-ris-cities-v2.webp","s":"Keleti tengerparti lakóváros, amely strandparkjairól, rekreációs létesítményeiről és üdülőbungalóiról ismert.","f":["A név malájul 'parti csavart' jelent.","A Pasir Ris Park egy fő vonzereje."]},"clementi-cities-v2":{"i":"/poi-images/clementi-cities-v2.webp","s":"Nyugati lakó- és oktatási város, a Szingapúri Nemzeti Egyetem közelében.","f":["Sir Cecil Clementi Smithről nevezték el.","A Clementi Mall a központi kiskereskedelmi csomópont."]},"toa-payoh-cities-v2":{"i":"/poi-images/toa-payoh-cities-v2.webp","s":"A második szatellitváros Szingapúrban, egy érett település erős közösségi érzéssel.","f":["A név hokkien nyelven 'nagy mocsarat' jelent.","Itt található a Lakás- és Fejlesztési Hivatal (HDB) székhelye."]},"marine-parade-cities-v2":{"i":"/poi-images/marine-parade-cities-v2.webp","s":"Jómódú lakónegyed a keleti parton, amely teljes egészében feltöltött földre épült.","f":["Festői kilátást nyújt a tengerre.","A Parkway Parade egy fontos bevásárlóközpont."]},"orchard-road-cities-v2":{"i":"/poi-images/orchard-road-cities-v2.webp","s":"Szingapúr legfontosabb bevásárlónegyede, amelyet luxus bevásárlóközpontok, áruházak és felső kategóriás szállodák szegélyeznek.","f":["Több mint 2 kilométer hosszú.","Valaha gyümölcsösök és ültetvények területe volt."]},"chinatown-cities-v2":{"i":"/poi-images/chinatown-cities-v2.webp","s":"Történelmi negyed, amely régi templomok, hagyományos üzletházak és modern bárok és éttermek keverékét mutatja be.","f":["Itt található a Buddha Foga Ereklye Templom.","A Chinatown Street Market népszerű ajándéktárgy-vásárlóhely."]},"little-india-cities-v2":{"i":"/poi-images/little-india-cities-v2.webp","s":"Élénk etnikai negyed, amely az indiai kultúra látványosságainak, hangjainak és illatainak robbanásszerű élményét nyújtja.","f":["A Mustafa Centre egy 24 órás bevásárlóközpont.","A Sri Veeramakaliamman templom egy fontos hindu templom."]},"kampong-glam-cities-v2":{"i":"/poi-images/kampong-glam-cities-v2.webp","s":"Szingapúr történelmi maláj negyede, amely divatos butikjairól, menő kávézóiról és a Szultán-mecsetről ismert.","f":["A Haji Lane híres független üzleteiről és falfestményeiről.","A szultán egykori palotája ma a Maláj Örökség Központja."]},"bukit-timah-cities-v2":{"i":"/poi-images/bukit-timah-cities-v2.webp","s":"Elsőrangú lakónegyed, amely buja zöldterületeiről, tekintélyes iskoláiról és a Bukit Timah természetvédelmi területről ismert.","f":["Itt található Szingapúr legmagasabb hegye, a Bukit Timah.","Magas a társasházak és a kertes házak aránya."]},"serangoon-cities-v2":{"i":"/poi-images/serangoon-cities-v2.webp","s":"Fejlett lakónegyed állami és magánlakások keverékével, amelyet a NEX bevásárlóközpont szolgál ki.","f":["A Serangoon Gardens egy jól ismert magántulajdonú lakónegyed.","A Chomp Chomp Food Centre híres a helyi utcai ételekről."]},"downtown-core-cities-v2":{"i":"/poi-images/downtown-core-cities-v2.webp","s":"Szingapúr gazdasági szíve, amely a központi üzleti negyedet és a Marina Bay környékét foglalja magában.","f":["Számos felhőkarcolónak és pénzügyi intézménynek ad otthont.","A Marina Bay Sands egy ikonikus nevezetesség."]},"sembawang-cities-v2":{"i":"/poi-images/sembawang-cities-v2.webp","s":"Északi tengerparti város, amely parkjáról, természetes strandjairól és a brit haditengerészeti bázisként betöltött történelméről ismert.","f":["A Sembawang Parkban található az egyik utolsó megmaradt természetes strand.","Itt találhatók Szingapúr fő szigetének egyetlen hőforrásai."]},"jurong-island-petrochemical-hub-economic-v2":{"i":"/poi-images/jurong-island-petrochemical-hub-economic-v2.webp","s":"Egy mesterségesen létrehozott ipari terület, amely Szingapúr vegyipari és energiaiparának központja.","f":["Több mint 100 globális vegyipari vállalatnak ad otthont.","Hét kisebb sziget összevonásával jött létre."]},"port-of-singapore-economic-v2":{"i":"/poi-images/port-of-singapore-economic-v2.webp","s":"A világ egyik legforgalmasabb kikötője, amely hatékonyságáról és összeköttetéseiről ismert, és kulcsfontosságú szerepet játszik a globális tengeri kereskedelemben.","f":["Több mint 600 kikötővel áll összeköttetésben 123 országban.","A világ második legnagyobb konténerkikötője a forgalom alapján."]},"marina-bay-financial-centre-economic-v2":{"i":"/poi-images/marina-bay-financial-centre-economic-v2.webp","s":"Egy presztízsértékű üzleti negyed, amely multinacionális bankoknak, pénzügyi intézményeknek és nagyvállalatoknak ad otthont.","f":["Három irodatoronyból és két lakótoronyból áll.","Szingapúr 'új' pénzügyi központjának tekintik."]},"changi-business-park-economic-v2":{"i":"/poi-images/changi-business-park-economic-v2.webp","s":"Egy nagy üzleti központ, amely technológiai vállalatoknak, kutatási és fejlesztési részlegeknek, valamint pénzügyi szolgáltatóknak ad otthont.","f":["A Changi repülőtér közelében található.","Ismert az IT- és logisztikai vállalatok magas koncentrációjáról."]},"singapore-exchange-sgx-economic-v2":{"i":"/poi-images/singapore-exchange-sgx-economic-v2.webp","s":"Ázsia vezető nemzetközi, több eszközosztályt kezelő tőzsdéje, amely részvény-, kötvény- és származtatott termékek kereskedelmét kínálja.","f":["1999-ben alapították két tőzsde egyesülésével.","Hozzáférés biztosít a legfontosabb ázsiai gazdaságokhoz."]},"keppel-shipyard-economic-v2":{"i":"/poi-images/keppel-shipyard-economic-v2.webp","s":"A világ egyik vezető hajógyára a hajójavítás, -átalakítás és -átépítés területén, amely megbízhatóságáról és gyors szolgáltatásairól ismert.","f":["A Keppel Corporation, egy szingapúri konglomerátum része.","FPSO és FSRU átalakításokra szakosodott."]},"one-north-business-park-economic-v2":{"i":"/poi-images/one-north-business-park-economic-v2.webp","s":"Egy pezsgő kutatási és üzleti központ, amely olyan kulcsfontosságú iparágakra összpontosít, mint a biomedicina, az infokommunikációs technológia és a média.","f":["Tematikus klaszterekre oszlik, mint például a Biopolis és a Fusionopolis.","'Munka-élet-játék-tanulás' környezet megteremtésére tervezték."]},"singapore-freeport-economic-v2":{"i":"/poi-images/singapore-freeport-economic-v2.webp","s":"Egy magas biztonságú tároló létesítmény értékes javak, például műalkotások, nemesfémek és bor számára, amely adózási előnyöket kínál.","f":["A Changi repülőtér közelében található a könnyű logisztika érdekében.","A világ egyik legbiztonságosabb helyének tartják értéktárgyak tárolására."]},"seletar-aerospace-park-economic-v2":{"i":"/poi-images/seletar-aerospace-park-economic-v2.webp","s":"Egy integrált repülőgépipari központ, amely repülőgép-karbantartásnak, -javításnak és -nagyjavításnak (MRO), valamint kutatásnak és fejlesztésnek ad otthont.","f":["Olyan vezető repülőgépipari vállalatoknak ad otthont, mint a Rolls-Royce és az Airbus.","A Seletar repülőtér támogatja."]},"pasir-panjang-terminal-economic-v2":{"i":"/poi-images/pasir-panjang-terminal-economic-v2.webp","s":"Egy fejlett konténerterminál a szingapúri kikötőn belül, amely automatizált technológiáiról és nagy hatékonyságáról ismert.","f":["Távirányítású híddarukat és automatizált irányítású járműveket használ.","Része a kikötői áteresztőképesség növelésére irányuló stratégiának."]},"micron-semiconductor-fab-economic-v2":{"i":"/poi-images/micron-semiconductor-fab-economic-v2.webp","s":"Szingapúr egyik legnagyobb és legfejlettebb félvezetőgyára, amely memóriachipeket gyárt a globális piacra.","f":["Fontos szereplő a globális elektronikai ellátási láncban.","NAND és DRAM memóriákat gyárt."]},"google-data-center-jurong-west-economic-v2":{"i":"/poi-images/google-data-center-jurong-west-economic-v2.webp","s":"A Google egyik délkelet-ázsiai adatközpontja, amely a régió digitális szolgáltatásait működteti, és a globális felhőinfrastruktúra fontos része.","f":["Támogatja a Google Keresőt, a Gmailt és a YouTube-ot.","Az energiahatékonyságra és a fenntarthatóságra összpontosít."]},"raffles-place-economic-v2":{"i":"/poi-images/raffles-place-economic-v2.webp","s":"Szingapúr pénzügyi negyedének történelmi szíve, számos banknak, biztosítótársaságnak és ügyvédi irodának ad otthont.","f":["Szingapúr alapítójáról, Sir Stamford Rafflesről nevezték el.","Magas felhőkarcolók jellemzik."]},"sg-thian-hock-keng-temple-history-v2":{"i":"/poi-images/sg-thian-hock-keng-temple-history-v2.webp","s":"Szingapúr egyik legrégebbi és legfontosabb hokkien temploma, amelyet Mazunak, a tenger istennőjének szenteltek.","f":["1842-ben épült egyetlen szög felhasználása nélkül.","Szingapúr nemzeti emlékműve."]},"sg-bukit-brown-cemetery-history-v2":{"i":"/poi-images/sg-bukit-brown-cemetery-history-v2.webp","s":"Nagy, történelmi kínai temető, ahol Szingapúr számos kiemelkedő úttörőjének sírja található.","f":["1922-től 1973-ig volt nyitva a temetkezések számára.","A történelem és a kultúra gazdag tárháza."]},"sg-the-cenotaph-history-v2":{"i":"/poi-images/sg-the-cenotaph-history-v2.webp","s":"Egy háborús emlékmű az Esplanade Parkban, amelyet azoknak a szingapúri férfiaknak szenteltek, akik az első és második világháborúban vesztették életüket.","f":["1922-ben leplezték le.","Denis Santry tervezte."]},"sg-tanjong-pagar-railway-station-history-v2":{"i":"/poi-images/sg-tanjong-pagar-railway-station-history-v2.webp","s":"Egy lenyűgöző art deco építészeti stílusú egykori vasútállomás, amely egykor a maláj vasúthálózat déli végállomása volt.","f":["1932-ben nyílt meg és 2011-ben zárt be.","Nemzeti emlékmű."]},"sg-istana-kampong-glam-history-v2":{"i":"/poi-images/sg-istana-kampong-glam-history-v2.webp","s":"A szingapúri maláj királyok egykori szultáni palotája.","f":["Eredetileg 1819-ben fából épült, 1843-ban kőből építették újjá.","Nemzeti emlékmű."]},"sg-alexandra-hospital-wwii-history-v2":{"i":"/poi-images/sg-alexandra-hospital-wwii-history-v2.webp","s":"Egy második világháborús mészárlás helyszíne, ahol japán katonák a brit katonai kórház pácienseit és személyzetét ölték meg.","f":["A mészárlás 1942. február 14-én történt.","Több mint 200 embert öltek meg."]},"sg-adam-park-battlefield-history-v2":{"i":"/poi-images/sg-adam-park-battlefield-history-v2.webp","s":"Egy lakónegyed, amely a szingapúri csata utolsó napjaiban heves harcok helyszíne volt.","f":["A harcok 1942 februárjában zajlottak.","A területet a Cambridgeshire ezred védte."]},"sg-yuch-hai-ching-temple-history-v2":{"i":"/poi-images/sg-yuch-hai-ching-temple-history-v2.webp","s":"Szingapúr egyik legrégebbi Teochew temploma, más néven 'A nyugodt tenger temploma'.","f":["1826-ban alapították.","2014-ben UNESCO Ázsia-Csendes-óceáni Örökség Díjat kapott."]},"sg-german-girl-shrine-history-v2":{"i":"/poi-images/sg-german-girl-shrine-history-v2.webp","s":"Egy szentély Pulau Ubin szigetén, amelyet egy német kávéültetvény-tulajdonos lányának szenteltek, aki állítólag az első világháború alatt egy kőbányába zuhant, miközben brit katonák elől menekült.","f":["Az eredeti szentélyt 1914-ben építették.","A lottójátékosok kedvelt helye, ahol szerencseszámokért imádkoznak."]},"sg-masjid-hajjah-fatimah-history-v2":{"i":"/poi-images/sg-masjid-hajjah-fatimah-history-v2.webp","s":"Egy 1846-ban épült mecset, amely egyedülálló, ferde minaretjéről ismert, amely a portsmouthi Spinnaker-toronyra emlékeztet.","f":["Egy gazdag maláj üzletasszonyról nevezték el.","Európai, maláj és kínai építészeti stílusok keveréke."]},"sg-hong-san-see-temple-history-v2":{"i":"/poi-images/sg-hong-san-see-temple-history-v2.webp","s":"Egy 1913-ban elkészült kínai templom, ame let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}

let dr=false,dx=0,dy=0;

svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});

svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');

function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}

// Chip toggle: hide POIs of disabled group

// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
