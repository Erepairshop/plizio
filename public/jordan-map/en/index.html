2.webp","s":"Al-Husn is one of the most traditional towns in the north.","f":["One of Jordan's oldest Byzantine churches stands here.","The soil is red and highly fertile."]},"kufranja-cities-v2":{"i":"/poi-images/kufranja-cities-v2.webp","s":"Kufranja is one of the green pearls of the Ajloun Mountains.","f":["The Wadi Kufranja feeds the local dam.","Irrigated agriculture has a long tradition here."]},"fuheis-cities-v2":{"i":"/poi-images/fuheis-cities-v2.webp","s":"Fuheis is a picturesque town northwest of Amman, inhabited almost exclusively by Jordanian Christians.","f":["The Fuheis Festival celebrates culture and art annually.","There are traditional stone houses in the old town."]},"ash-shunah-ash-shamaliyah-cities-v2":{"i":"/poi-images/ash-shunah-ash-shamaliyah-cities-v2.webp","s":"Ash-Shunah ash-Shamaliyah is located in the fertile Jordan Valley.","f":["It is located very close to the border with Israel.","Citrus fruits and bananas are grown on a massive scale."]},"al-mazar-al-janubi-cities-v2":{"i":"/poi-images/al-mazar-al-janubi-cities-v2.webp","s":"Al-Mazar al-Janubi is a significant pilgrimage site south of Karak.","f":["The historic Battle of Mu'tah took place here.","The tombs of several companions of Muhammad are located here."]},"deir-abi-saeed-cities-v2":{"i":"/poi-images/deir-abi-saeed-cities-v2.webp","s":"Deir Abi Saeed is the central settlement of the Kourah district.","f":["The town is situated in a highly scenic mountainous area.","Historically, Byzantine monasteries existed here."]},"al-muwaqqar-cities-v2":{"i":"/poi-images/al-muwaqqar-cities-v2.webp","s":"Al-Muwaqqar was a magnificent desert palace in early Islamic times.","f":["It served as an Umayyad palace.","Water was stored in massive cisterns."]},"mahis-cities-v2":{"i":"/poi-images/mahis-cities-v2.webp","s":"Mahis is situated on the hills above the Jordan Valley.","f":["The shrine of Al-Khidr is located here.","The town is known for its fig and pomegranate trees."]},"al-hashimiyah-cities-v2":{"i":"/poi-images/al-hashimiyah-cities-v2.webp","s":"Al-Hashimiyah is an emerging city in the Zarqa region.","f":["The Hashemite University is located nearby.","The Hussein Thermal Power Plant supplies the grid."]},"busaira-cities-v2":{"i":"/poi-images/busaira-cities-v2.webp","s":"Busaira sits atop a mountain ridge and looks back on a long history.","f":["Archaeologists have uncovered Iron Age fortress walls.","The modern city is located in the Tafilah Governorate."]},"al-mashareq-cities-v2":{"i":"/poi-images/al-mashareq-cities-v2.webp","s":"Al-Mashareq is a predominantly agricultural settlement in northern Jordan.","f":["Citrus fruits are the main product of the region.","The climate allows for near year-round harvesting."]},"azraq-cities-v2":{"i":"/poi-images/azraq-cities-v2.webp","s":"Azraq is an oasis town deep in the eastern desert of Jordan.","f":["The Azraq Wetland Reserve is a significant nature conservation area.","T. E. Lawrence used the local castle as a base."]},"aqaba-container-terminal-economic-v2":{"i":"/poi-images/aqaba-container-terminal-economic-v2.webp","s":"One of the most important ports on the Red Sea, connecting Jordan to global trade.","f":["Important hub for regional trade.","Considered the logistical gateway to the Levant."]},"arab-potash-company-economic-v2":{"i":"/poi-images/arab-potash-company-economic-v2.webp","s":"A major mining company on the Dead Sea that extracts minerals and exports them worldwide.","f":["Among the largest producers of potassium chloride.","Uses the evaporation of the Dead Sea for extraction."]},"zarqa-petroleum-refinery-economic-v2":{"i":"/poi-images/zarqa-petroleum-refinery-economic-v2.webp","s":"Jordan's only oil refinery, playing a strategic role in the country's energy supply.","f":["Historically covered most of Jordan's fuel needs.","Processes crude oil into gasoline, diesel, and kerosene."]},"eshidiya-phosphate-mine-economic-v2":{"i":"/poi-images/eshidiya-phosphate-mine-economic-v2.webp","s":"Jordan's largest phosphate mine in the Ma'an Governorate, providing large quantities of raw materials for fertilizers.","f":["Important for Jordan's agricultural exports.","Employs thousands of workers in the region."]},"al-hassan-industrial-estate-economic-v2":{"i":"/poi-images/al-hassan-industrial-estate-economic-v2.webp","s":"One of the most important industrial zones in northern Jordan, attracting companies from various sectors.","f":["Focuses on the textile and apparel industry.","The country's first Qualified Industrial Zone (QIZ)."]},"mafraq-development-area-economic-v2":{"i":"/poi-images/mafraq-development-area-economic-v2.webp","s":"A special economic zone designed as a logistics and industrial center to promote investments.","f":["Capitalizes on its proximity to Syria and Iraq.","Focuses on transportation and light industry."]},"tafilah-wind-farm-economic-v2":{"i":"/poi-images/tafilah-wind-farm-economic-v2.webp","s":"The first commercial wind energy project in the Middle East, producing clean energy for the Jordanian grid.","f":["Has a capacity of 117 megawatts.","Significantly reduces the country's CO2 emissions."]},"shams-maan-solar-plant-economic-v2":{"i":"/poi-images/shams-maan-solar-plant-economic-v2.webp","s":"One of the largest photovoltaic plants in the region, helping to reduce Jordan's energy dependence.","f":["Produces about one percent of Jordan's total energy.","Uses millions of solar panels."]},"king-hussein-airport-economic-v2":{"i":"/poi-images/king-hussein-airport-economic-v2.webp","s":"The airport in Aqaba, serving as an important center for tourism and air cargo in the south.","f":["Has a free trade zone for air cargo.","Important for the Aqaba Special Economic Zone."]},"queen-alia-airport-economic-v2":{"i":"/poi-images/queen-alia-airport-economic-v2.webp","s":"Jordan's main gateway for international passengers and a central hub for global trade.","f":["Manages the majority of Jordanian air cargo.","Has been awarded multiple times for its modern design."]},"sahab-industrial-estate-economic-v2":{"i":"/poi-images/sahab-industrial-estate-economic-v2.webp","s":"One of the oldest and largest industrial areas in Jordan, housing hundreds of manufacturing facilities.","f":["Known for food, chemical, and plastics production.","Provides jobs for tens of thousands of people."]},"aqaba-special-economic-zone-economic-v2":{"i":"/poi-images/aqaba-special-economic-zone-economic-v2.webp","s":"A duty-free zone that attracts investors with low taxes and simplified regulations on the Red Sea.","f":["Promotes tourism, industry, and logistics.","Spans almost the entire urban area of Aqaba."]},"attarat-oil-shale-power-plant-economic-v2":{"i":"/poi-images/attarat-oil-shale-power-plant-economic-v2.webp","s":"A major energy project that uses local oil shale deposits to generate electricity.","f":["Contributes to the diversification of energy sources.","One of the largest investment projects in the country."]},"samra-electric-power-plant-economic-v2":{"i":"/poi-images/samra-electric-power-plant-economic-v2.webp","s":"A modern gas turbine power plant that plays a key role in meeting Jordan's electricity demand.","f":["Uses natural gas as its primary fuel.","Has been expanded several times to increase capacity."]},"risha-gas-field-economic-v2":{"i":"/poi-images/risha-gas-field-economic-v2.webp","s":"Jordan's only producing natural gas field, located in the eastern desert near the Iraqi border.","f":["Operated by the National Petroleum Company.","Supplies gas directly to a nearby power plant."]},"al-hasa-phosphate-mine-economic-v2":{"i":"/poi-images/al-hasa-phosphate-mine-economic-v2.webp","s":"A major mining site in central-south Jordan, contributing heavily to the economy of the Tafilah region.","f":["Considered one of the oldest phosphate mines in the country.","Continuously modernized to increase efficiency."]},"jifco-fertilizer-plant-economic-v2":{"i":"/poi-images/jifco-fertilizer-plant-economic-v2.webp","s":"A joint venture that produces phosphoric acid from local phosphate ores for export to India.","f":["Example of successful international economic cooperation.","Strategically located near the Eshidiya mine."]},"aqaba-new-port-economic-v2":{"i":"/poi-images/aqaba-new-port-economic-v2.webp","s":"A state-of-the-art port facility built to expand Jordan's maritime capacities.","f":["Replaced the old main port in the city center.","Includes specialized terminals for various goods."]},"baynouna-solar-power-project-economic-v2":{"i":"/poi-images/baynouna-solar-power-project-economic-v2.webp","s":"The largest solar energy project in Jordan, located east of Amman, contributing significantly to the green transition.","f":["Generates enough electricity to power thousands of homes.","Was financed by an international consortium."]},"zarqa-free-zone-economic-v2":{"i":"/poi-images/zarqa-free-zone-economic-v2.webp","s":"A major logistics center for regional trade, especially for the import and export of vehicles.","f":["One of the largest car markets in the Middle East.","Offers tax incentives for domestic and foreign investors."]},"petra-history-v2":{"i":"/poi-images/petra-history-v2.webp","s":"The ancient rock city carved from pink sandstone by the Nabataeans is one of the New Seven Wonders of the World.","f":["Founded around 312 BC as the capital of the Nabataeans.","Famous for its advanced water management systems."]},"jerash-history-v2":{"i":"/poi-images/jerash-history-v2.webp","s":"One of the best-preserved Roman provincial towns in the world, often called the Pompeii of the East.","f":["It was a member of the Decapolis league of cities.","The oval Forum is unique in Roman architecture."]},"amman-citadel-history-v2":{"i":"/poi-images/amman-citadel-history-v2.webp","s":"The historic hill of Jabal al-Qal'a features ruins from the Roman, Byzantine, and Umayyad periods.","f":["The Temple of Hercules is the most striking Roman structure here.","The Umayyad Palace dates back to the 8th century."]},"roman-theater-amman-history-v2":{"i":"/poi-images/roman-theater-amman-history-v2.webp","s":"A monumental 2nd-century amphitheater cut deep into the hillside, capable of seating 6,000 spectators.","f":["Built during the reign of Antoninus Pius.","Its north-facing orientation kept spectators out of the direct sun."]},"ajloun-castle-history-v2":{"i":"/poi-images/ajloun-castle-history-v2.webp","s":"A 12th-century Islamic fortress built by Saladin's nephew to protect the region against the Crusaders.","f":["Guarded important trade and pilgrimage routes.","Controlled the iron ore mines of Ajloun."]},"kerak-castle-history-v2":{"i":"/poi-images/kerak-castle-history-v2.webp","s":"A massive Crusader castle dominating the skyline, featuring a fascinating blend of European, Byzantine, and Arab architecture.","f":["Built in the 1140s by Pagan the Butler.","Played a crucial role during the Crusades."]},"mount-nebo-history-v2":{"i":"/poi-images/mount-nebo-history-v2.webp","s":"An elevated ridge where Moses is said to have viewed the Promised Land, now an important pilgrimage destination.","f":["Offers views of the Jordan Valley and the Dead Sea.","Houses the remains of a Byzantine church."]},"madaba-map-history-v2":{"i":"/poi-images/madaba-map-history-v2.webp","s":"A 6th-century floor mosaic in St.","f":["Originally contained over two million tesserae.","Shows details like fish in the Jordan River and boats on the Dead Sea."]},"quseir-amra-history-v2":{"i":"/poi-images/quseir-amra-history-v2.webp","s":"One of the most famous desert castles in Jordan, renowned for its unique early Islamic frescoes and well-preserved bathhouse.","f":["Constructed in the early 8th century.","Frescoes depict hunting scenes and zodiac constellations."]},"shobak-castle-history-v2":{"i":"/poi-images/shobak-castle-history-v2.webp","s":"A Crusader castle situated on a conical mountain, offering a dramatic and rugged appearance.","f":["Built by Baldwin I of Jerusalem in 1115.","Originally named Montreal or Mons Regalis."]},"umm-qais-history-v2":{"i":"/poi-images/umm-qais-history-v2.webp","s":"The ruins of the ancient city of Gadara, offering breathtaking views over the Sea of Galilee and the Golan Heights.","f":["Famous as the site of the biblical miracle of the Gadarene swine.","Features a striking amphitheater built from black basalt."]},"pella-history-v2":{"i":"/poi-images/pella-history-v2.webp","s":"One of the most ancient sites in the Jordan Valley, with excavations showing over 6,000 years of continuous settlement.","f":["Was a member of the Roman Decapolis.","Served as a refuge for early Christians during the Jewish-Roman wars."]},"qasr-kharana-history-v2":{"i":"/poi-images/qasr-kharana-history-v2.webp","s":"One of the best-preserved desert castles in Jordan, notable for its imposing, fortress-like appearance and massive stone construction.","f":["Likely built before 710 AD.","Despite arrow slits, it was not designed for military use."]},"qasr-azraq-history-v2":{"i":"/poi-images/qasr-azraq-history-v2.webp","s":"A desert castle built from black basalt, famously used by T.E.","f":["Its origins date back to the Roman period.","The fort is strategically located near the Azraq Oasis."]},"machaerus-history-v2":{"i":"/poi-images/machaerus-history-v2.webp","s":"The ruins of a Herodian palace on a steep hilltop, famous as the site where John the Baptist was imprisoned and beheaded.","f":["Originally built by the Hasmonean king Alexander Jannaeus.","Destroyed and subsequently rebuilt by Herod the Great."]},"al-maghtas-history-v2":{"i":"/poi-images/al-maghtas-history-v2.webp","s":"The historical baptismal site on the Jordan River, widely recognized as the authentic location where Jesus was baptized by John the Baptist.","f":["It is a designated UNESCO World Heritage site.","Archaeological finds include Byzantine monasteries and baptism pools."]},"umm-ar-rasas-history-v2":{"i":"/poi-images/umm-ar-rasas-history-v2.webp","s":"An archaeological site containing Roman, Byzantine, and early Islamic ruins, renowned for its remarkably preserved mosaic floors.","f":["It is recognized as a UNESCO World Heritage site.","The mosaic in the Church of St. Stephen perfectly depicts major regional cities."]},"aqaba-fort-history-v2":{"i":"/poi-images/aqaba-fort-history-v2.webp","s":"A Mamluk-era coastal fortress that was the site of a major victory during the Arab Revolt of 1917.","f":["Originally built in the 16th century by Mamluk Sultan Qansuh al-Ghuri.","Captured by forces led by T.E. Lawrence in a surprise landward attack."]},"temple-of-hercules-amman-history-v2":{"i":"/poi-images/temple-of-hercules-amman-history-v2.webp","s":"The monumental remains of a Roman temple, whose colossal pillars stand majestically over the old city of Amman.","f":["Constructed during the reign of Roman Emperor Marcus Aurelius.","Fragments of a colossal marble hand were discovered at the site."]},"yarmouk-battlefield-history-v2":{"i":"/poi-images/yarmouk-battlefield-history-v2.webp","s":"The site of the decisive Battle of Yarmouk in 636 AD, which signaled the end of Byzantine rule in Syria and opened the region to Islamic expansion.","f":["The Muslim army defeated a much larger Byzantine force.","The steep gorges of the river played a crucial tactical role in the victory."]},"al-khazneh-landmarks-v2":{"i":"/poi-images/al-khazneh-landmarks-v2.webp","s":"The famous Treasury is the most iconic monument of Petra.","f":["The facade is 40 meters high.","It originally served as a royal tomb."]},"ad-deir-landmarks-v2":{"i":"/poi-images/ad-deir-landmarks-v2.webp","s":"The Monastery is one of the largest monuments in Petra and requires climbing over 800 steps.","f":["The width is nearly 50 meters.","It was built in the early 2nd century."]},"the-siq-landmarks-v2":{"i":"/poi-images/the-siq-landmarks-v2.webp","s":"The narrow canyon is the dramatic main entrance to the ancient city of Petra.","f":["The gorge is about 1.2 kilometers long.","The rock walls are up to 80 meters high."]},"royal-tombs-petra-landmarks-v2":{"i":"/poi-images/royal-tombs-petra-landmarks-v2.webp","s":"This imposing row of tombs is carved into the rock face of Jabal al-Khubtha.","f":["They overlook the main valley of Petra.","The Urn Tomb has a large courtyard."]},"great-temple-petra-landmarks-v2":{"i":"/poi-images/great-temple-petra-landmarks-v2.webp","s":"This vast monumental complex is located in the center of Petra.","f":["The area covers about 7000 square meters.","It features a small theater inside."]},"little-petra-landmarks-v2":{"i":"/poi-images/little-petra-landmarks-v2.webp","s":"This remote site north of Petra once served as a suburb for passing merchants.","f":["The name Siq al-Barid means 'Cold Canyon'.","There are rare Nabataean ceiling paintings."]},"nymphaeum-amman-landmarks-v2":{"i":"/poi-images/nymphaeum-amman-landmarks-v2.webp","s":"A monumental Roman public fountain located in downtown Amman.","f":["It was built in 191 AD.","The complex was two stories high."]},"umayyad-palace-amman-landmarks-v2":{"i":"/poi-images/umayyad-palace-amman-landmarks-v2.webp","s":"This ruin complex on the Citadel hill dates from the 8th century.","f":["The complex was the seat of the provincial governor.","The current dome was added by Spanish archaeologists."]},"king-abdullah-mosque-amman-landmarks-v2":{"i":"/poi-images/king-abdullah-mosque-amman-landmarks-v2.webp","s":"A distinctive landmark of Amman, known for its magnificent blue mosaic dome.","f":["It was built between 1982 and 1989.","The dome has a diameter of 35 meters."]},"abu-darwish-mosque-landmarks-v2":{"i":"/poi-images/abu-darwish-mosque-landmarks-v2.webp","s":"This mosque rises on Jabal al-Ashrafiyeh and stands out with its characteristic pattern of alternating black and white stones.","f":["The mosque was built in 1961.","The stones come from different regions of Jordan."]},"qasr-al-abd-landmarks-v2":{"i":"/poi-images/qasr-al-abd-landmarks-v2.webp","s":"A Hellenistic palace near Iraq al-Amir, built from huge stone blocks.","f":["The structure dates from the 2nd century BC.","The name means 'Castle of the Slave'."]},"oval-plaza-jerash-landmarks-v2":{"i":"/poi-images/oval-plaza-jerash-landmarks-v2.webp","s":"This asymmetrical plaza, surrounded by majestic Ionic columns, served as a connecting element between the main street and the Temple of Zeus in Jerash.","f":["It measures an impressive 90 by 80 meters.","It is lined with 56 Ionic columns."]},"arch-of-hadrian-jerash-landmarks-v2":{"i":"/poi-images/arch-of-hadrian-jerash-landmarks-v2.webp","s":"This massive triumphal arch was erected in honor of the visit of the Roman Emperor Hadrian in 129 AD at the southern entrance of Jerash.","f":["The gate is nearly 21 meters high.","It has three arched passageways."]},"temple-of-artemis-jerash-landmarks-v2":{"i":"/poi-images/temple-of-artemis-jerash-landmarks-v2.webp","s":"The Temple of Artemis dominates from one of the highest points in Jerash.","f":["Eleven of the 12 Corinthian columns still stand.","The columns sway slightly in the wind."]},"south-theater-jerash-landmarks-v2":{"i":"/poi-images/south-theater-jerash-landmarks-v2.webp","s":"The largest theater in the ancient city of Jerash impresses with its exceptional acoustics.","f":["It could accommodate over 3000 spectators.","The theater was built in the late 1st century."]},"qasr-al-mushatta-landmarks-v2":{"i":"/poi-images/qasr-al-mushatta-landmarks-v2.webp","s":"The ruin of the largest Umayyad desert castle in Jordan.","f":["Construction began around 744 but was never finished.","It is located very close to Queen Alia International Airport."]},"qasr-tuba-landmarks-v2":{"i":"/poi-images/qasr-tuba-landmarks-v2.webp","s":"This remote desert castle from the Umayyad period consists of an unusual combination of baked bricks and stone.","f":["It is located about 100 kilometers from Amman.","The building consists of two identical symmetrical halves."]},"lots-cave-landmarks-v2":{"i":"/poi-images/lots-cave-landmarks-v2.webp","s":"A cave in the steep mountains near the Dead Sea where the biblical Lot and his daughters are said to have taken refuge after the destruction of Sodom.","f":["The site was not discovered archaeologically until 1991.","Visitors must climb hundreds of steps."]},"jabal-haroun-landmarks-v2":{"i":"/poi-images/jabal-haroun-landmarks-v2.webp","s":"This mountain is the highest peak in the Petra area.","f":["The mountain is about 1350 meters high.","The ascent requires a hike of several hours."]},"rujm-al-malfouf-landmarks-v2":{"i":"/poi-images/rujm-al-malfouf-landmarks-v2.webp","s":"A round megalithic watchtower in Amman, probably built during the Kingdom of Ammon.","f":["It was probably built around the 13th century BC.","The name translates to 'Rolled pile of stones'."]},"royal-botanic-garden-jordan-life-v2":{"i":"/poi-images/royal-botanic-garden-jordan-life-v2.webp","s":"The Royal Botanic Garden of Jordan protects native flora while offering stunning views of the King Talal Dam.","f":["Overlooks the King Talal Dam.","Focuses on native flora conservation."]},"amman-national-park-life-v2":{"i":"/poi-images/amman-national-park-life-v2.webp","s":"This expansive park in southern Amman is a popular destination for picnics and family outings.","f":["Popular picnic spot for locals.","Features dense pine forests."]},"al-hussein-public-parks-life-v2":{"i":"/poi-images/al-hussein-public-parks-life-v2.webp","s":"One of Amman's largest public parks, boasting beautifully landscaped gardens and major cultural institutions.","f":["One of Amman's largest parks.","Houses the Children's Museum."]},"jordan-valley-citrus-farms-life-v2":{"i":"/poi-images/jordan-valley-citrus-farms-life-v2.webp","s":"The Jordan Valley is the country's agricultural heartland where citrus fruits thrive exceptionally well.","f":["The Jordan Valley is Jordan's agricultural core.","Lemons and oranges thrive here."]},"aqaba-bird-observatory-life-v2":{"i":"/poi-images/aqaba-bird-observatory-life-v2.webp","s":"A vital stopover for migratory birds on their journey between Europe and Africa.","f":["Crucial stopover for migratory birds.","Attracts over 300 bird species annually."]},"childrens-museum-jordan-life-v2":{"i":"/poi-images/childrens-museum-jordan-life-v2.webp","s":"An interactive museum that introduces children to science, technology, and art in a playful manner.","f":["Opened in 2007 by Queen Rania.","Offers over 150 interactive exhibits."]},"ghamadan-park-life-v2":{"i":"/poi-images/ghamadan-park-life-v2.webp","s":"Also known as the King of Bahrain Kingdom Forest, this park offers extensive wooded areas near Amman.","f":["Includes an expansive forested area.","Features a small zoo and equestrian facilities."]},"ajloun-olive-groves-life-v2":{"i":"/poi-images/ajloun-olive-groves-life-v2.webp","s":"The hilly landscape of Ajloun is famous for its ancient olive trees and the production of high-quality olive oil.","f":["Ajloun is famous for high-quality olive oil.","Some olive trees are centuries old."]},"al-mawa-wildlife-life-v2":{"i":"/poi-images/al-mawa-wildlife-life-v2.webp","s":"This sanctuary in the forests of Jerash provides a safe and natural home for rescued exotic animals, such as lions and bears from conflict zones.","f":["First wildlife rescue center in the region.","Provides a safe haven for exotic animals."]},"king-abdullah-park-irbid-life-v2":{"i":"/poi-images/king-abdullah-park-irbid-life-v2.webp","s":"A large and vibrant park in northern Jordan.","f":["A major recreational area in northern Jordan.","Features extensive walking paths."]},"prince-hashem-bird-garden-life-v2":{"i":"/poi-images/prince-hashem-bird-garden-life-v2.webp","s":"A cozy, shaded park in the heart of Amman that houses a variety of bird species and playgrounds.","f":["A small zoo and park in Amman.","Home to various bird species."]},"haya-cultural-center-life-v2":{"i":"/poi-images/haya-cultural-center-life-v2.webp","s":"The Haya Cultural Center in Amman is a pioneer of childhood education in Jordan.","f":["Established in 1976.","Jordan's first children's cultural center."]},"sharhabil-bin-hassneh-ecopark-life-v2":{"i":"/poi-images/sharhabil-bin-hassneh-ecopark-life-v2.webp","s":"This eco-park in northern Jordan was established to rehabilitate local habitats.","f":["Established in 2004 for nature rehabilitation.","Focuses on eco-tourism and environmental education."]},"ghor-al-safi-tomato-farms-life-v2":{"i":"/poi-images/ghor-al-safi-tomato-farms-life-v2.webp","s":"The southern Jordan Valley is ideal for vegetable cultivation due to its warm winter climate.","f":["Ideal for winter agriculture.","Known as Jordan's 'tomato basket'."]},"aqaba-marine-park-life-v2":{"i":"/poi-images/aqaba-marine-park-life-v2.webp","s":"This marine protected area on the Red Sea conserves Jordan's colorful coral reefs.","f":["Protects the coral reefs along Jordan's coast.","Home to over 120 species of hard corals."]},"amman-waves-aqua-park-life-v2":{"i":"/poi-images/amman-waves-aqua-park-life-v2.webp","s":"One of the largest water parks in Jordan, offering families a refreshing escape.","f":["One of the largest water parks in the country.","Features wave pools and water slides."]},"wild-jordan-center-life-v2":{"i":"/poi-images/wild-jordan-center-life-v2.webp","s":"Operated by the national conservation society, this center in Amman promotes eco-tourism.","f":["Managed by the Royal Society for the Conservation of Nature.","Promotes eco-tourism in Jordan."]},"jordan-valley-date-palms-life-v2":{"i":"/poi-images/jordan-valley-date-palms-life-v2.webp","s":"Jordan is globally renowned for its premium Medjool dates.","f":["Jordan is renowned for its premium Medjool dates.","The Jordan Valley's climate is perfect for date cultivation."]},"al-azraq-desert-agriculture-life-v2":{"i":"/poi-images/al-azraq-desert-agriculture-life-v2.webp","s":"Located in the eastern desert, this area utilizes underground aquifers to transform the arid landscape into green farmlands producing olives and pomegranates.","f" ve is only 22 square kilometers in size."]},"ajloun-forest-nature-v2":{"i":"/poi-images/ajloun-forest-nature-v2.webp","s":"A dense forest area of evergreen oaks that provides an important refuge for deer, wild boars, and rare bird species.","f":["Lies at an altitude of up to 1100 meters.","Is a remnant of Jordan's original forests."]},"dibbeen-forest-nature-v2":{"i":"/poi-images/dibbeen-forest-nature-v2.webp","s":"This hilly reserve protects the last remaining stands of the rare Aleppo pine in the region.","f":["Was designated as a protected area in 2004.","Is home to rare orchid species."]},"jordan-river-nature-v2":{"i":"/poi-images/jordan-river-nature-v2.webp","s":"This historically and religiously significant river forms the natural border between Jordan and the Palestinian territories.","f":["Flows into the Dead Sea in the south.","Its total length is about 251 kilometers."]},"yarmouk-river-nature-v2":{"i":"/poi-images/yarmouk-river-nature-v2.webp","s":"The largest tributary of the Jordan River carves deep into the landscape and separates Jordan from Syria.","f":["Originates in the Hauran region in Syria.","Was the site of the historical Battle of Yarmouk."]},"zarqa-river-nature-v2":{"i":"/poi-images/zarqa-river-nature-v2.webp","s":"An important river system in northern Jordan that flows through steep valleys and feeds the King Talal Dam.","f":["Is mentioned in the Bible as the river Jabbok.","Its water is used intensively for agriculture."]},"jabal-umm-ad-dami-nature-v2":{"i":"/poi-images/jabal-umm-ad-dami-nature-v2.webp","s":"At over 1800 meters, this is the highest mountain in Jordan, located in the extreme south near the Saudi border.","f":["Reaches an altitude of 1854 meters.","On clear days, the Red Sea can be seen from here."]},"jabal-ram-nature-v2":{"i":"/poi-images/jabal-ram-nature-v2.webp","s":"A massive sandstone mountain in Wadi Rum that was long mistakenly believed to be the country's highest peak.","f":["Its striking cliffs attract many climbers.", e gorge is known for its characteristic hanging rock.","The water level varies greatly depending on the season."]},"wadi-araba-relief-v2":{"i":"/poi-images/wadi-araba-relief-v2.webp","s":"An arid valley connecting the Dead Sea to the Gulf of Aqaba.","f":["Separates Jordan from Israel","Part of the Great Rift Valley"]},"moab-plateau-relief-v2":{"i":"/poi-images/moab-plateau-relief-v2.webp","s":"A historic high plateau east of the Dead Sea, known for its deep gorges.","f":["Elevation up to 1000 meters","Biblical Moabite region"]},"edom-gebirge-relief-v2":{"i":"/poi-images/edom-gebirge-relief-v2.webp","s":"A rugged mountain range in southern Jordan, captivating with its red sandstone formations.","f":["Peaks over 1600 meters","Home to the Nabataean city of Petra"]},"schwarze-wueste-relief-v2":{"i":"/poi-images/schwarze-wueste-relief-v2.webp","s":"A barren desert landscape in the northeast, covered with dark basalt rock of volcanic origin.","f":["Extensive basalt fields","Extends into Saudi Arabia"]},"badiya-wueste-relief-v2":{"i":"/poi-images/badiya-wueste-relief-v2.webp","s":"Jordan's vast eastern desert makes up a large part of the country's landmass and is home to Bedouins.","f":["Makes up approx. 75% of Jordan","Sand and gravel desert"]},"belqa-plateau-relief-v2":{"i":"/poi-images/belqa-plateau-relief-v2.webp","s":"A fertile plateau in central Jordan, known for its agriculture and temperate climate.","f":["Center of historical Gilead","Mild Mediterranean climate"]},"schara-gebirge-relief-v2":{"i":"/poi-images/schara-gebirge-relief-v2.webp","s":"A striking mountain massif near Petra, characterized by deep valleys and steep cliffs.","f":["Located south of the Dead Sea","Steep drops to the Jordan Rift Valley"]},"adschlun-gebirge-relief-v2":{"i":"/poi-images/adschlun-gebirge-relief-v2.webp","s":"A densely forested and green mountain region in the north, forming a stark contrast to the desert.","f":["Greenest region of Jordan","Forests of Aleppo pines and oaks"]},"dscha const svg=document.getElementById('svg'),stage=document.getElementById('stage');

let s=1,tx=0,ty=0;

function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});

const pop=document.getElementById('popup');

const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));

  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}

// Cluster "burst": fan the POIs out around the cluster center as glow dots

const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};

function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
