":"/poi-images/kufranja-cities-v2.webp","s":"Kufrandzsa az Adzslún-hegység egyik zöld gyöngyszeme.","f":["A Vadi Kufrandzsa táplálja a helyi gátat.","Az öntözéses földművelésnek nagy hagyománya van itt."]},"fuheis-cities-v2":{"i":"/poi-images/fuheis-cities-v2.webp","s":"Fuheisz egy festői település Ammántól északnyugatra, amelyet szinte kizárólag jordániai keresztények laknak.","f":["A Fuheisz Fesztivál évente ünnepli a kultúrát és művészetet.","Az óvárosban hagyományos kőházak találhatók."]},"ash-shunah-ash-shamaliyah-cities-v2":{"i":"/poi-images/ash-shunah-ash-shamaliyah-cities-v2.webp","s":"Es-Suna es-Samalijja a termékeny Jordán-völgyben fekszik.","f":["Nagyon közel fekszik az izraeli határhoz.","Nagy mennyiségben termesztenek citrusféléket és banánt."]},"al-mazar-al-janubi-cities-v2":{"i":"/poi-images/al-mazar-al-janubi-cities-v2.webp","s":"Al-Mazar al-Dzsanubi jelentős zarándokhely Karaktól délre.","f":["Itt zajlott a történelmi mu'tahi csata.","Mohamed próféta több társának sírja is itt található."]},"deir-abi-saeed-cities-v2":{"i":"/poi-images/deir-abi-saeed-cities-v2.webp","s":"Dejr Abi Szaíd a Kourah körzet központja.","f":["A település festői hegyvidéki környezetben fekszik.","Történelmileg bizánci kolostorok álltak itt."]},"al-muwaqqar-cities-v2":{"i":"/poi-images/al-muwaqqar-cities-v2.webp","s":"Al-Muvakkar a korai iszlám időkben egy pompás sivatagi palota volt.","f":["Az Omajjádok palotája volt.","A vizet hatalmas ciszternákban tárolták."]},"mahis-cities-v2":{"i":"/poi-images/mahis-cities-v2.webp","s":"Mahisz a Jordán-völgye fölötti dombokon fekszik.","f":["Itt található Al-Khidr szentélye.","A település füge- és gránátalmafáiról ismert."]},"al-hashimiyah-cities-v2":{"i":"/poi-images/al-hashimiyah-cities-v2.webp","s":"Al-Hasimijja egy feltörekvő város a Zarka régióban.","f":["A Hasemita Egyetem a közelben található.","A Husszein hőerőmű jelentős energiát szolgáltat a hálózatnak."]},"busaira-cities-v2":{"i":"/poi-images/busaira-cities-v2.webp","s":"Buszajra egy hegygerincen magasodik, és hosszú történelemre tekint vissza.","f":["Régészek vaskori erődfalakat tártak fel.","A modern város Tafila tartományban fekszik."]},"al-mashareq-cities-v2":{"i":"/poi-images/al-mashareq-cities-v2.webp","s":"Al-Masarik egy mezőgazdasági jellegű település Észak-Jordániában.","f":["A citrusfélék jelentik a régió fő termékét.","Az éghajlat szinte egész éves betakarítást tesz lehetővé."]},"azraq-cities-v2":{"i":"/poi-images/azraq-cities-v2.webp","s":"Azrak egy oázisváros Jordánia keleti sivatagjának mélyén.","f":["Az Azrak vizes élőhely fontos természetvédelmi terület.","Arábiai Lawrence az itteni kastélyt használta bázisként."]},"aqaba-container-terminal-economic-v2":{"i":"/poi-images/aqaba-container-terminal-economic-v2.webp","s":"A Vörös-tenger egyik legfontosabb kikötője, amely összeköti Jordániát a globális kereskedelemmel.","f":["Fontos kereskedelmi csomópont a régióban.","A levantei térség logisztikai kapujának számít."]},"arab-potash-company-economic-v2":{"i":"/poi-images/arab-potash-company-economic-v2.webp","s":"Jelentős bányászati vállalat a Holt-tengernél, amely ásványi anyagokat termel ki és exportál világszerte.","f":["A legnagyobb kálium-klorid-gyártók közé tartozik.","A Holt-tenger párolgását hasznosítja a kitermeléshez."]},"zarqa-petroleum-refinery-economic-v2":{"i":"/poi-images/zarqa-petroleum-refinery-economic-v2.webp","s":"Jordánia egyetlen olajfinomítója, amely stratégiai szerepet játszik az ország energiaellátásában.","f":["Történelmileg a jordán üzemanyagigény nagy részét fedezte.","Nyersolajat dolgoz fel benzinné, gázolajjá és kerozinná."]},"eshidiya-phosphate-mine-economic-v2":{"i":"/poi-images/eshidiya-phosphate-mine-economic-v2.webp","s":"Jordánia legnagyobb foszfátbányája Ma'án kormányzóságban, amely nagy mennyiségű nyersanyagot biztosít a műtrágyagyártáshoz.","f":["Fontos a jordán agrárexport szempontjából.","Több ezer munkavállalót foglalkoztat a régióban."]},"al-hassan-industrial-estate-economic-v2":{"i":"/poi-images/al-hassan-industrial-estate-economic-v2.webp","s":"Jordánia északi részének egyik legfontosabb ipari övezete, amely különböző ágazatok vállalatait vonzza.","f":["Főleg a textil- és ruhaiparra összpontosít.","Az ország első minősített ipari zónája (QIZ)."]},"mafraq-development-area-economic-v2":{"i":"/poi-images/mafraq-development-area-economic-v2.webp","s":"Különleges gazdasági övezet, amelyet logisztikai és ipari központként hoztak létre a beruházások ösztönzésére.","f":["Kihasználja Szíria és Irak közelségét.","A közlekedésre és a könnyűiparra koncentrál."]},"tafilah-wind-farm-economic-v2":{"i":"/poi-images/tafilah-wind-farm-economic-v2.webp","s":"A Közel-Kelet első kereskedelmi szélerőmű-projektje, amely tiszta energiát termel a jordán hálózat számára.","f":["Kapacitása 117 megawatt.","Jelentősen csökkenti az ország szén-dioxid-kibocsátását."]},"shams-maan-solar-plant-economic-v2":{"i":"/poi-images/shams-maan-solar-plant-economic-v2.webp","s":"A régió egyik legnagyobb fotovoltaikus erőműve, amely hozzájárul Jordánia energiafüggőségének csökkentéséhez.","f":["Jordánia teljes energiájának mintegy egy százalékát termeli.","Több millió napelemet használ."]},"king-hussein-airport-economic-v2":{"i":"/poi-images/king-hussein-airport-economic-v2.webp","s":"Az akabai repülőtér, amely a turizmus és a légi árufuvarozás fontos központja délen.","f":["Légi árufuvarozási szabadkereskedelmi övezettel rendelkezik.","Fontos az Akabai Különleges Gazdasági Övezet számára."]},"queen-alia-airport-economic-v2":{"i":"/poi-images/queen-alia-airport-economic-v2.webp","s":"Jordánia legfontosabb kapuja a nemzetközi utasok számára és a globális kereskedelem központi csomópontja.","f":["A jordán légi árufuvarozás nagy részét kezeli.","Többször díjazták modern kialakításáért."]},"sahab-industrial-estate-economic-v2":{"i":"/poi-images/sahab-industrial-estate-economic-v2.webp","s":"Jordánia egyik legrégebbi és legnagyobb ipari területe, amely több száz termelőüzemnek ad otthont.","f":["Az élelmiszer-, vegy- és műanyagiparáról ismert.","Több tízezer embernek biztosít munkát."]},"aqaba-special-economic-zone-economic-v2":{"i":"/poi-images/aqaba-special-economic-zone-economic-v2.webp","s":"Vámmentes övezet, amely alacsony adókkal és egyszerűsített szabályozásokkal vonzza a befektetőket a Vörös-tengernél.","f":["Támogatja a turizmust, az ipart és a logisztikát.","Majdnem a teljes akabai városi területre kiterjed."]},"attarat-oil-shale-power-plant-economic-v2":{"i":"/poi-images/attarat-oil-shale-power-plant-economic-v2.webp","s":"Jelentős energiaprojekt, amely a helyi olajpala-készleteket használja fel villamosenergia-termelésre.","f":["Hozzájárul az energiaforrások diverzifikálásához.","Az ország egyik legnagyobb beruházási projektje."]},"samra-electric-power-plant-economic-v2":{"i":"/poi-images/samra-electric-power-plant-economic-v2.webp","s":"Modern gázturbinás erőmű, amely kulcsszerepet játszik a jordániai villamosenergia-szükséglet fedezésében.","f":["Földgázt használ elsődleges tüzelőanyagként.","Többször bővítették a kapacitás növelése érdekében."]},"risha-gas-field-economic-v2":{"i":"/poi-images/risha-gas-field-economic-v2.webp","s":"Jordánia egyetlen termelő földgázmezője a keleti sivatagban, az iraki határ közelében.","f":["A Nemzeti Kőolajtársaság üzemelteti.","Közvetlenül egy közeli erőművet lát el gázzal."]},"al-hasa-phosphate-mine-economic-v2":{"i":"/poi-images/al-hasa-phosphate-mine-economic-v2.webp","s":"Jelentős bányászati telephely Közép-Dél-Jordániában, amely erősen hozzájárul Tafila régió gazdaságához.","f":["Az ország egyik legrégebbi foszfátbányája.","Folyamatosan modernizálják a hatékonyság növelése érdekében."]},"jifco-fertilizer-plant-economic-v2":{"i":"/poi-images/jifco-fertilizer-plant-economic-v2.webp","s":"Egy vegyesvállalat, amely foszforsavat állít elő helyi foszfátércekből indiai exportra.","f":["A sikeres nemzetközi gazdasági együttműködés példája.","Stratégiailag az Esidija bánya közelében helyezkedik el."]},"aqaba-new-port-economic-v2":{"i":"/poi-images/aqaba-new-port-economic-v2.webp","s":"Korszerű kikötői létesítmény, amely Jordánia tengeri kapacitásának bővítésére épült.","f":["Felváltotta a régi belvárosi fő kikötőt.","Speciális terminálokkal rendelkezik a különböző áruk számára."]},"baynouna-solar-power-project-economic-v2":{"i":"/poi-images/baynouna-solar-power-project-economic-v2.webp","s":"A legnagyobb napenergia-projekt Jordániában, Ammántól keletre, amely jelentősen hozzájárul a zöld átálláshoz.","f":["Elegendő áramot termel több ezer háztartás ellátásához.","Egy nemzetközi konzorcium finanszírozta."]},"zarqa-free-zone-economic-v2":{"i":"/poi-images/zarqa-free-zone-economic-v2.webp","s":"Jelentős logisztikai központ a regionális kereskedelem számára, különösen a járművek importja és exportja terén.","f":["A Közel-Kelet egyik legnagyobb autópiaca.","Adókedvezményeket kínál a hazai és külföldi befektetőknek."]},"petra-history-v2":{"i":"/poi-images/petra-history-v2.webp","s":"A nabateusok által a rózsaszín homokkőből kivájt ősi sziklaváros a világ hét új csodájának egyike.","f":["I. e. 312 körül alapították a nabateusok fővárosaként.","Híres a fejlett vízgazdálkodási rendszeréről."]},"jerash-history-v2":{"i":"/poi-images/jerash-history-v2.webp","s":"A világ egyik legjobb állapotban fennmaradt római kori provinciális városa, a Kelet Pompejijeként is ismert.","f":["A Dekapolisz nevű városszövetség tagja volt.","Az ovális Fórum egyedülálló a római építészetben."]},"amman-citadel-history-v2":{"i":"/poi-images/amman-citadel-history-v2.webp","s":"A Jabal al-Qal'a történelmi dombja római, bizánci és Omajjád kori romokat rejt, páratlan kilátással a városra.","f":["A Herkules-templom a legjellegzetesebb római építménye.","Az Omajjád palota a 8. századból származik."]},"roman-theater-amman-history-v2":{"i":"/poi-images/roman-theater-amman-history-v2.webp","s":"A 2.","f":["Antoninus Pius római császár uralkodása alatt épült.","Északi tájolása megvédte a nézőket a tűző naptól."]},"ajloun-castle-history-v2":{"i":"/poi-images/ajloun-castle-history-v2.webp","s":"Szaladin unokaöccse által a 12.","f":["Fontos kereskedelmi és zarándokútvonalakat őrzött.","Ellenőrizte a helyi vasércbányákat."]},"kerak-castle-history-v2":{"i":"/poi-images/kerak-castle-history-v2.webp","s":"A városképet uraló hatalmas keresztes lovagvár, amely az európai, bizánci és arab építészet lenyűgöző keverékét mutatja be.","f":["Pagan, a pohárnok építtette az 1140-es években.","Központi szerepet játszott a keresztes hadjáratok során."]},"mount-nebo-history-v2":{"i":"/poi-images/mount-nebo-history-v2.webp","s":"Egy magaslat, ahonnan a hagyomány szerint Mózes meglátta az Ígéret földjét; ma fontos zarándokhely.","f":["Pazar kilátást nyújt a Jordán-völgyre és a Holt-tengerre.","Egy bizánci templom romjai találhatók a hegytetőn."]},"madaba-map-history-v2":{"i":"/poi-images/madaba-map-history-v2.webp","s":"Egy 6.","f":["Eredetileg több mint kétmillió mozaikkockából állt.","Részletesen ábrázolja a Jordán folyó halait és a Holt-tenger hajóit."]},"quseir-amra-history-v2":{"i":"/poi-images/quseir-amra-history-v2.webp","s":"Jordánia egyik legismertebb sivatagi kastélya, amely egyedülálló korai iszlám freskóiról és kiválóan megőrzött fürdőházáról híres.","f":["A 8. század elején épült.","A freskók vadászjeleneteket és csillagképeket ábrázolnak."]},"shobak-castle-history-v2":{"i":"/poi-images/shobak-castle-history-v2.webp","s":"Egy kúpos hegyen épült keresztes lovagvár, amely drámai és zord elhelyezkedése miatt lenyűgöző látványt nyújt.","f":["I. Balduin jeruzsálemi király építtette 1115-ben.","Eredeti neve Montreal vagy Mons Regalis volt."]},"umm-qais-history-v2":{"i":"/poi-images/umm-qais-history-v2.webp","s":"Az ókori Gadara város romjai, ahonnan lélegzetelállító kilátás nyílik a Galileai-tengerre és a Golán-fennsíkra.","f":["A gadarai sertéskondáról szóló bibliai csoda helyszíneként ismert.","Látványos, fekete bazaltból épült amfiteátruma van."]},"pella-history-v2":{"i":"/poi-images/pella-history-v2.webp","s":"A Jordán-völgy egyik legrégebbi települése, ahol az ásatások több mint 6000 éves folyamatos lakottságot bizonyítanak.","f":["A római Dekapolisz tagja volt.","A zsidó háború alatt a korai keresztények menedékhelye volt."]},"qasr-kharana-history-v2":{"i":"/poi-images/qasr-kharana-history-v2.webp","s":"Jordánia egyik legjobban megőrzött sivatagi kastélya, amely zord, erődítményszerű megjelenésével hívja fel magára a figyelmet.","f":["Valószínűleg i. sz. 710 előtt épült.","Lőrései ellenére sosem volt katonai funkciója."]},"qasr-azraq-history-v2":{"i":"/poi-images/qasr-azraq-history-v2.webp","s":"Egy fekete bazaltból épült sivatagi kastély, amelyet Arábiai Lawrence főhadiszállásként használt az arab felkelés idején.","f":["Gyökerei a római korig nyúlnak vissza.","Az erőd az azraki oázis közelében fekszik."]},"machaerus-history-v2":{"i":"/poi-images/machaerus-history-v2.webp","s":"Egy heródesi palota romjai egy meredek hegytetőn, amely arról hírhedt, hogy itt fejezték le Keresztelő Jánost.","f":["Eredetileg Alexander Janneusz hasmoneus király építette.","Megsemmisült, majd Nagy Heródes újjáépíttette."]},"al-maghtas-history-v2":{"i":"/poi-images/al-maghtas-history-v2.webp","s":"A történelmi keresztelőhely a Jordán folyónál, amelyet Jézus megkeresztelkedésének hiteles helyszíneként tartanak számon.","f":["Az UNESCO Világörökség része.","A régészeti leletek között bizánci kolostorok és keresztelőmedencék találhatók."]},"umm-ar-rasas-history-v2":{"i":"/poi-images/umm-ar-rasas-history-v2.webp","s":"Egy régészeti park, amely római, bizánci és korai iszlám korból származó emlékeket, valamint lenyűgöző mozaikpadlókat rejt.","f":["Az UNESCO Világörökség része.","A Szent István-templom mozaikja a régió fontos városait ábrázolja."]},"aqaba-fort-history-v2":{"i":"/poi-images/aqaba-fort-history-v2.webp","s":"Mamlúk kori part menti erődítmény, amely az 1917-es arab felkelés egyik legfontosabb győzelmének helyszíne volt.","f":["Eredetileg Kanszúh al-Gúri mamlúk szultán építtette a 16. században.","Arábiai Lawrence egy meglepetésszerű szárazföldi támadással foglalta el."]},"temple-of-hercules-amman-history-v2":{"i":"/poi-images/temple-of-hercules-amman-history-v2.webp","s":"Egy római templom monumentális romjai, melynek óriási oszlopai fenségesen magasodnak Ammán óvárosa fölé.","f":["Marcus Aurelius római császár uralkodása alatt épült.","Egy óriási, márványból faragott kéz töredékeit találták meg a helyszínen."]},"yarmouk-battlefield-history-v2":{"i":"/poi-images/yarmouk-battlefield-history-v2.webp","s":"A 636-os sorsdöntő jarmúki csata helyszíne, amely a bizánci uralom végét jelentette Szíriában, és megnyitotta az utat az iszlám terjeszkedés előtt.","f":["A muszlim sereg egy sokkal nagyobb létszámú bizánci haderőt győzött le.","A folyó meredek szurdokai kulcsfontosságú taktikai szerepet játszottak."]},"al-khazneh-landmarks-v2":{"i":"/poi-images/al-khazneh-landmarks-v2.webp","s":"A híres Kincstár Petra legikonikusabb műemléke.","f":["A homlokzat 40 méter magas.","Eredetileg királyi sírként szolgált."]},"ad-deir-landmarks-v2":{"i":"/poi-images/ad-deir-landmarks-v2.webp","s":"A Kolostor Petra egyik legnagyobb műemléke, amelyhez több mint 800 lépcsőfok megmászása szükséges.","f":["A szélessége közel 50 méter.","A 2. század elején épült."]},"the-siq-landmarks-v2":{"i":"/poi-images/the-siq-landmarks-v2.webp","s":"A szűk kanyon Petra drámai főbejárata.","f":["A szurdok mintegy 1,2 kilométer hosszú.","A sziklafalak akár 80 méter magasak is lehetnek."]},"royal-tombs-petra-landmarks-v2":{"i":"/poi-images/royal-tombs-petra-landmarks-v2.webp","s":"Ez az impozáns sírsor a Jabal al-Khubtha sziklafalába van vájva.","f":["Petra fő völgyére néznek.","Az Urnasírnak nagy előudvara van."]},"great-temple-petra-landmarks-v2":{"i":"/poi-images/great-temple-petra-landmarks-v2.webp","s":"Ez a kiterjedt monumentális komplexum Petra központjában található.","f":["A terület mintegy 7000 négyzetmétert ölel fel.","Egy kis színház is található a belsejében."]},"little-petra-landmarks-v2":{"i":"/poi-images/little-petra-landmarks-v2.webp","s":"Ez az elszigetelt helyszín Petrától északra egykor az átutazó kereskedők külvárosaként szolgált.","f":["A Siq al-Barid név azt jelenti: 'Hideg szurdok'.","Ritka nabateus mennyezetfestmények láthatók itt."]},"nymphaeum-amman-landmarks-v2":{"i":"/poi-images/nymphaeum-amman-landmarks-v2.webp","s":"Egy monumentális ókori római közútikút Ammán belvárosában.","f":["Kr. u. 191-ben épült.","A komplexum kétszintes volt."]},"umayyad-palace-amman-landmarks-v2":{"i":"/poi-images/umayyad-palace-amman-landmarks-v2.webp","s":"Ez a Citadella-hegyen lévő romkomplexum a 8.","f":["A komplexum a tartományi kormányzó székhelye volt.","A jelenlegi kupolát spanyol régészek adták hozzá."]},"king-abdullah-mosque-amman-landmarks-v2":{"i":"/poi-images/king-abdullah-mosque-amman-landmarks-v2.webp","s":"Ammán egyik jellegzetes nevezetessége, amely pompás kék mozaikkupolájáról ismert.","f":["1982 és 1989 között épült.","A kupola átmérője 35 méter."]},"abu-darwish-mosque-landmarks-v2":{"i":"/poi-images/abu-darwish-mosque-landmarks-v2.webp","s":"Ez a mecset a Jabal al-Ashrafiyeh hegyen magasodik, és a fekete és fehér kövek váltakozó, jellegzetes mintázatával tűnik ki.","f":["A mecset 1961-ben épült.","A kövek Jordánia különböző régióiból származnak."]},"qasr-al-abd-landmarks-v2":{"i":"/poi-images/qasr-al-abd-landmarks-v2.webp","s":"Egy hellenisztikus palota Iraq al-Amir közelében, amelyet hatalmas kőtömbökből építettek.","f":["Az építmény az i.e. 2. századból származik.","A név jelentése 'A rabszolga kastélya'."]},"oval-plaza-jerash-landmarks-v2":{"i":"/poi-images/oval-plaza-jerash-landmarks-v2.webp","s":"Ez a fenséges ión oszlopokkal körülvett, aszimmetrikus tér összekötő elemként szolgált a főutca és a Zeusz-templom között Dzserasban.","f":["Lenyűgöző 90-szer 80 méteres méretű.","56 ión oszlop szegélyezi."]},"arch-of-hadrian-jerash-landmarks-v2":{"i":"/poi-images/arch-of-hadrian-jerash-landmarks-v2.webp","s":"Ezt a hatalmas diadalívet Hadrianus római császár Kr.","f":["A kapu majdnem 21 méter magas.","Három íves átjáróval rendelkezik."]},"temple-of-artemis-jerash-landmarks-v2":{"i":"/poi-images/temple-of-artemis-jerash-landmarks-v2.webp","s":"Az Artemisz-templom Dzseras egyik legmagasabb pontján magasodik.","f":["A 12 korinthoszi oszlopból tizenegy még ma is áll.","Az oszlopok enyhén kilengenek a szélben."]},"south-theater-jerash-landmarks-v2":{"i":"/poi-images/south-theater-jerash-landmarks-v2.webp","s":"Dzseras ókori városának legnagyobb színháza lenyűgöz kivételes akusztikájával.","f":["Több mint 3000 néző befogadására volt alkalmas.","A színház az 1. század végén épült."]},"qasr-al-mushatta-landmarks-v2":{"i":"/poi-images/qasr-al-mushatta-landmarks-v2.webp","s":"Jordánia legnagyobb omajád sivatagi kastélyának romja.","f":["Az építkezés 744 körül kezdődött, de soha nem fejeződött be.","Nagyon közel van a Queen Alia nemzetközi repülőtérhez."]},"qasr-tuba-landmarks-v2":{"i":"/poi-images/qasr-tuba-landmarks-v2.webp","s":"Ez az elszigetelt omajád-kori sivatagi kastély égetett téglák és kövek szokatlan kombinációjából épült.","f":["Körülbelül 100 kilométerre fekszik Ammántól.","Az épület két azonos szimmetrikus félből áll."]},"lots-cave-landmarks-v2":{"i":"/poi-images/lots-cave-landmarks-v2.webp","s":"Egy barlang a Holt-tenger közeli meredek hegyekben, ahol a bibliai Lót és lányai a hagyomány szerint Szodoma pusztulása után menedéket kerestek.","f":["A helyszínt régészetileg csak 1991-ben fedezték fel.","A látogatóknak több száz lépcsőfokot kell megmászniuk."]},"jabal-haroun-landmarks-v2":{"i":"/poi-images/jabal-haroun-landmarks-v2.webp","s":"Ez a hegy a Petra területének legmagasabb csúcsa.","f":["A hegy mintegy 1350 méter magas.","A megmászásához több órás túra szükséges."]},"rujm-al-malfouf-landmarks-v2":{"i":"/poi-images/rujm-al-malfouf-landmarks-v2.webp","s":"Egy kerek megalitikus őrtorony Ammánban, amelyet valószínűleg az Ammoni Királyság idején emeltek.","f": svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
