.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}

.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}

.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#000;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#60a5fa}
.poi.g-sight circle{fill:#fbbf24}
.poi.g-nature circle{fill:#22c55e}
.poi.g-history circle{fill:#c084fc}
.poi.g-industry circle{fill:#fb923c}
.poi.g-other circle{fill:#9ca3af}
.poi.dim{opacity:.18}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7;fill:#fff;opacity:1}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}

.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}

.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}

.search.has-q .search-results.has-hits{display:block}

.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}

.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}

.poi.in-cluster{display:none}

#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}

.popup{position:absolute;bottom:0;left:0;right:0;background:#0d1230;border-top:1px solid #ffffff20;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -10px 40px #00000080}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}

.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}

.popup .list a:active{background:#ffffff14}

.zoom button:active{background:#1a2240}

i":"/poi-images/mount-nemrut-landmarks-v2.webp","s":"A significant mountain in southeastern Turkey, featuring a monumental sanctuary from the Hellenistic period at its summit.","f":["Known for the giant stone heads of ancient gods.","The tomb sanctuary was built by King Antiochus I Theos."]},"goreme-national-park-landmarks-v2":{"i":"/poi-images/goreme-national-park-landmarks-v2.webp","s":"A spectacular landscape in Cappadocia, shaped by erosion and famous for its unique fairy chimneys.","f":["Full of ancient cave churches carved into the soft rock.","A world hub for hot air ballooning."]},"sumela-monastery-landmarks-v2":{"i":"/poi-images/sumela-monastery-landmarks-v2.webp","s":"A Greek Orthodox monastery dramatically built into a steep cliff in the Black Sea region.","f":["Founded in the year 386 AD.","Located at an altitude of 1,200 meters."]},"galata-tower-landmarks-v2":{"i":"/poi-images/galata-tower-landmarks-v2.webp","s":"A historic stone tower in the Beyoğlu district, offering sweeping panoramic views of Istanbul's Golden Horn.","f":["Was built by the Genoese in 1348.","Previously served as a fire watchtower."]},"mount-ararat-landmarks-v2":{"i":"/poi-images/mount-ararat-landmarks-v2.webp","s":"A snow-capped, dormant volcano in the far east of Turkey, closely associated with the biblical story of Noah's Ark.","f":["Turkey's highest mountain at 5,137 meters.","Has two peaks: Greater and Lesser Ararat."]},"grand-bazaar-landmarks-v2":{"i":"/poi-images/grand-bazaar-landmarks-v2.webp","s":"One of the largest and oldest covered markets in the world, located in the heart of Istanbul's old city.","f":["Comprises 61 covered streets and over 4,000 shops.","Attracts up to 400,000 visitors daily."]},"basilica-cistern-landmarks-v2":{"i":"/poi-images/basilica-cistern-landmarks-v2.webp","s":"A massive subterranean water reservoir from the Byzantine era, known for its atmospheric lighting and Medusa heads.","f":["Built in the 6th century under Emperor Justinian I.","Supported by 336 marble columns."]},"aspendos-theater-landmarks-v2":{"i":"/poi-images/aspendos-theater-landmarks-v2.webp","s":"One of the best-preserved ancient Roman theaters in the world, still used for performances today.","f":["Could once hold up to 12,000 spectators.","Known for its superb acoustics."]},"bosphorus-bridge-landmarks-v2":{"i":"/poi-images/bosphorus-bridge-landmarks-v2.webp","s":"An iconic suspension bridge that connects the European and Asian parts of Istanbul.","f":["Was opened in 1973.","Is over 1,500 meters long."]},"maidens-tower-landmarks-v2":{"i":"/poi-images/maidens-tower-landmarks-v2.webp","s":"An elegant tower on a small island in the Bosphorus, boasting a long history of legends and myths.","f":["Once served as a lighthouse and customs station.","Known as Kız Kulesi in Turkish."]},"bodrum-castle-landmarks-v2":{"i":"/poi-images/bodrum-castle-landmarks-v2.webp","s":"A massive fortress built by the Knights Hospitaller in the 15th century, now housing the Museum of Underwater Archaeology.","f":["Built using stones from the Mausoleum at Halicarnassus.","Features four main towers: the English, French, German, and Italian towers."]},"dolmabahce-palace-landmarks-v2":{"i":"/poi-images/dolmabahce-palace-landmarks-v2.webp","s":"An opulent palace on the shores of the Bosphorus, which replaced Topkapı Palace as the main residence of the Ottoman sultans.","f":["The interior is decorated with tons of gold and crystal.","Features the world's largest Bohemian crystal chandelier."]},"gulhane-park-life-v2":{"i":"/poi-images/gulhane-park-life-v2.webp","s":"A historical urban park in Istanbul that was once part of the Topkapı Palace gardens, now offering a green oasis.","f":["Oldest park in Istanbul.","Located next to Topkapı Palace."]},"dilek-peninsula-life-v2":{"i":"/poi-images/dilek-peninsula-life-v2.webp","s":"A biodiverse national park on the Aegean coast with pristine beaches, dense forests, and free-roaming wild boars.","f":["Located in Aydın Province.","Home to Anatolian leopards."]},"cukurova-plain-life-v2":{"i":"/poi-images/cukurova-plain-life-v2.webp","s":"A vast, fertile plain in southern Turkey, historically known as Cilicia, serving as a major agricultural center.","f":["One of the main cotton growing areas.","Irrigated by the Seyhan and Ceyhan rivers."]},"isfanbul-themepark-life-v2":{"i":"/poi-images/isfanbul-themepark-life-v2.webp","s":"A large amusement park in Istanbul offering roller coasters, shopping centers, and entertainment for the whole family.","f":["Formerly known as Vialand.","Features one of Turkey's fastest roller coasters."]},"rize-tea-plantations-life-v2":{"i":"/poi-images/rize-tea-plantations-life-v2.webp","s":"The steep, green hills of the Black Sea region are the heart of Turkish tea production and offer picturesque landscapes.","f":["Produces the majority of Turkish tea.","The humid climate is ideal for tea cultivation."]},"kuscenneti-nationalpark-life-v2":{"i":"/poi-images/kuscenneti-nationalpark-life-v2.webp","s":"This bird paradise on Lake Manyas is an important resting point for millions of migratory birds travelling between Europe and Africa.","f":["Literally means bird paradise.","Protects over 250 bird species."]},"bursa-peach-orchards-life-v2":{"i":"/poi-images/bursa-peach-orchards-life-v2.webp","s":"The region around Bursa is famous for its vast orchards, where some of the juiciest and sweetest peaches in the country grow.","f":["Bursa is the center of Turkish peach cultivation.","The mild climate favors the growth of the fruit."]},"emirgan-park-life-v2":{"i":"/poi-images/emirgan-park-life-v2.webp","s":"A historical park on the Bosphorus, world-famous especially for its annual tulip festival in spring.","f":["One of the largest public parks in Istanbul.","Houses three historical wooden pavilions."]},"antalya-aquarium-life-v2":{"i":"/poi-images/antalya-aquarium-life-v2.webp","s":"One of the largest aquariums in the world, delighting visitors with a massive underwater tunnel and themed areas like Snow World.","f":["The tunnel is 131 meters long.","Features an exhibition of tropical reptiles."]},"giresun-hazelnut-life-v2":{"i":"/poi-images/giresun-hazelnut-life-v2.webp","s":"The province of Giresun is the center of global hazelnut production, whose plantations cover the steep slopes down to the Black Sea.","f":["Turkey is the largest hazelnut producer in the world.","Hazelnuts are an important export commodity."]},"igneada-floodplain-life-v2":{"i":"/poi-images/igneada-floodplain-life-v2.webp","s":"A rare flooded forest ecosystem on the Bulgarian border that is home to an incredible variety of flora and fauna.","f":["One of the few remaining intact floodplain forests in Europe.","Includes swamps, lakes, and sand dunes."]},"yildiz-park-life-v2":{"i":"/poi-images/yildiz-park-life-v2.webp","s":"Once the royal hunting grounds of the Ottoman sultans, this huge park now offers picturesque walkways and old pavilions.","f":["Located in the Beşiktaş district of Istanbul.","Home to the famous Yıldız Porcelain Factory."]},"faruk-yalcin-zoo-life-v2":{"i":"/poi-images/faruk-yalcin-zoo-life-v2.webp","s":"A vast zoological garden near Istanbul dedicated to animal welfare and education about endangered species.","f":["Houses over 250 different animal species.","Has a large botanical garden."]},"aydin-fig-orchards-life-v2":{"i":"/poi-images/aydin-fig-orchards-life-v2.webp","s":"The sun-drenched Aydın region is known worldwide for cultivating the best figs, which are dried here in large quantities.","f":["The Aydın fig has a protected designation of origin.","Drying is done traditionally in the sun."]},"soguksu-nationalpark-life-v2":{"i":"/poi-images/soguksu-nationalpark-life-v2.webp","s":"A picturesque national park near Ankara known for its dense pine forests and healing thermal springs.","f":["Popular recreation area for the capital.","Home to the rare cinereous vulture."]},"iztuzu-beach-life-v2":{"i":"/poi-images/iztuzu-beach-life-v2.webp","s":"A pristine strip of sandy beach forming a natural barrier between the fresh water delta of the Dalyan river and the Mediterranean.","f":["Important nesting site for the loggerhead sea turtle.","Closed to visitors at night to protect the nests."]},"miniaturk-life-v2":{"i":"/poi-images/miniaturk-life-v2.webp","s":"An impressive miniature park in Istanbul featuring detailed replicas of the most famous buildings from Turkey and Ottoman history.","f":["Features models on a scale of 1:25.","Includes over 130 architectural masterpieces."]},"malatya-apricots-life-v2":{"i":"/poi-images/malatya-apricots-life-v2.webp","s":"The fertile soils and sunny climate of this eastern Anatolian province make it the world center for the cultivation of sweet apricots.","f":["Produces the majority of dried apricots worldwide.","The fruits are gently dried on family farms."]},"sarikamis-forest-life-v2":{"i":"/poi-images/sarikamis-forest-life-v2.webp","s":"A high-altitude national park in Eastern Anatolia famous for its deep snow cover in winter and its extensive, dense pine forests.","f":["The forest consists mainly of Scots pines.","Important habitat for brown bears and wolves."]},"karagol-sahara-life-v2":{"i":"/poi-images/karagol-sahara-life-v2.webp","s":"A bifurcated national park in the northeastern Artvin region, consisting of an idyllic glacial lake and a vast plateau.","f":["Karagöl is a picturesque lake surrounded by forests.","The Sahara plateau is known for traditional festivals."]},"turkey-lake-tuz-nature-v2":{"i":"/poi-images/turkey-lake-tuz-nature-v2.webp","s":"Lake Tuz is the second largest lake in Turkey and one of the largest hypersaline lakes in the world.","f":["Located in Central Anatolia.","The name means Salt Lake."]},"turkey-lake-egirdir-nature-v2":{"i":"/poi-images/turkey-lake-egirdir-nature-v2.webp","s":"Lake Eğirdir is a freshwater lake in the Turkish Lakes Region, surrounded by picturesque mountains.","f":["The fourth largest lake in Turkey.","Has two small islands."]},"turkey-kizilir nd deep valleys.","f":["The highest peak is Kızılkaya (3767 m).","Attracts climbers and trekkers from all over the world."]},"turkey-mount-hasan-nature-v2":{"i":"/poi-images/turkey-mount-hasan-nature-v2.webp","s":"Mount Hasan is a dormant twin-peaked volcano whose silhouette dominates the landscape of Aksaray and Niğde.","f":["Its highest point is at 3268 meters.","A prehistoric supplier of obsidian."]},"turkey-kaz-daglari-nature-v2":{"i":"/poi-images/turkey-kaz-daglari-nature-v2.webp","s":"Kaz Dağları National Park, known as the ancient Mount Ida, is a lushly forested region with rich mythology.","f":["The setting of many Greek myths.","Offers one of the highest oxygen levels in the world."]},"turkey-buyuk-menderes-nature-v2":{"i":"/poi-images/turkey-buyuk-menderes-nature-v2.webp","s":"The Büyük Menderes is a major river in western Anatolia, famous for its winding curves, known as meanders.","f":["Empties into the Aegean Sea.","About 548 kilometers long."]},"turkey-lake-salda-nature-v2":{"i":"/poi-images/turkey-lake-salda-nature-v2.webp","s":"Lake Salda is a mid-size crater lake, often referred to as the Turkish Maldives due to its turquoise waters and white sand.","f":["At 196 meters, one of the deepest lakes in Turkey.","Rich in fine, white hydromagnesite sand."]},"tr-taurus-mountains-relief-v2":{"i":"/poi-images/tr-taurus-mountains-relief-v2.webp","s":"This impressive mountain range separates the Mediterranean coast from the Anatolian plateau and shapes the region's climate.","f":["Reaches elevations of over 3700 meters.","An important source for rivers like the Euphrates."]},"tr-pontic-mountains-relief-v2":{"i":"/poi-images/tr-pontic-mountains-relief-v2.webp","s":"An extensive mountain range along the Black Sea coast covered with dense forests.","f":["Highest peak is Kaçkar Dağı.","Intercepts the moist winds from the Black Sea."]},"tr-mount-erciyes-relief-v2":{"i":"/poi-images/tr-mount-erciyes-relief-v2.webp","s":"A massive stratovolcano whose ancient eruptions formed the tuff landscape of Cappadocia.","f":["With 3917 meters, the highest mountain in Central Anatolia.","Today a popular winter sports center."]},"tr-ihlara-valley-relief-v2":{"i":"/poi-images/tr-ihlara-valley-relief-v2.webp","s":"A deep gorge carved by a river that acts as a green oasis amidst the dry Cappadocian landscape.","f":["The gorge is 16 kilometers long and up to 100 meters deep.","Formed by the cooling of lava flows."]},"tr-munzur-valley-relief-v2":{"i":"/poi-images/tr-munzur-valley-relief-v2.webp","s":"A protected natural paradise in Eastern Anatolia, famous for its bubbling springs, waterfalls, and endemic plants.","f":["Declared a national park in 1971.","Habitat for rare animal species such as the wild goat."]},"tr-butterfly-valley-relief-v2":{"i":"/poi-images/tr-butterfly-valley-relief-v2.webp","s":"A hard-to-reach, picturesque gorge on the Mediterranean coast known for its diversity of butterfly species.","f":["Houses over 100 different butterfly species.","Accessible only by boat or steep hiking trails."]},"tr-anatolian-plateau-relief-v2":{"i":"/poi-images/tr-anatolian-plateau-relief-v2.webp","s":"The dry heartland of Turkey, consisting of vast steppes, salt lakes, and barren landscapes.","f":["Lies on average 800 to 1200 meters above sea level.","Continental climate with hot summers and cold winters."]},"tr-nur-mountains-relief-v2":{"i":"/poi-images/tr-nur-mountains-relief-v2.webp","s":"A historically and geographically significant mountain range that runs parallel to the Mediterranean coast in Hatay Province.","f":["Also known as the Amanos Mountains.","Formed a natural barrier in antiquity."]},"tr-karapinar-desert-relief-v2":{"i":"/poi-images/tr-karapinar-desert-relief-v2.webp","s":"The only true desert region in Turkey, characterized by sand dunes and extreme aridity in the heart of Central Anatolia.","f":["Notorious for strong wind erosion in the 1950s.","An afforestation project partially saved the region."]},"tr-turquoise-coast-relief-v2":{"i":"/poi-images/tr-turquoise-coast-relief-v2.webp","s":"A spectacular stretch of coastline on the Mediterranean, famous for its crystal-clear turquoise waters and hidden bays.","f":["Stretches for hundreds of kilometers.","A hotspot for Blue Cruise tourism."]},"tr-lycian-coast-relief-v2":{"i":"/poi-images/tr-lycian-coast-relief-v2.webp","s":"A wildly romantic part of the Mediterranean coast, characterized by rocky peninsulas, deep gorges, and ancient ruins.","f":["Home to the famous Lycian Way, a long-distance hiking trail.","Steeply dropping rocky coasts dominate the landscape."]},"tr-aegean-coast-relief-v2":{"i":"/poi-images/tr-aegean-coast-relief-v2.webp","s":"The rugged west coast of Turkey with countless bays, islands, and fertile valleys reaching inland.","f":["The milder climate allows for the cultivation of olives and figs.","The coastline is greatly extended by deep indentations."]},"tr-black-sea-coast-relief-v2":{"i":"/poi-images/tr-black-sea-coast-relief-v2.webp","s":"A lush green, humid, and steeply sloping coastal region where the Pontic Mountains meet the stormy sea directly.","f":["The wettest region of Turkey with year-round rainfall.","Sandy beaches are rare here, the coast is mostly rocky."]},"tr-koprulu-canyon-relief-v2":{"i":"/poi-images/tr-koprulu-canyon-relief-v2.webp","s":"An impressive canyon in the Taurus Mountains through which a wild river flows with ice-cold, emerald green water.","f":["A popular destination for whitewater rafting.","The steep rock walls rise up to 100 meters high."]},"tr-cilo-sat-mountains-relief-v2":{"i":"/poi-images/tr-cilo-sat-mountains-relief-v2.webp","s":"An extremely rugged and glaciated mountain range in the far southeast of Turkey, near the borders with Iraq and Iran.","f":["Houses the highest Ice Age glaciers in Turkey.","The highest peak, Uludoruk, reaches 4136 meters."]},"tr-erzurum-kars-plateau-relief-v2":{"i":"/poi-images/tr-erzurum-kars-plateau-relief-v2.webp","s":"A high and harsh plateau in northeastern Turkey famous for its icy and long winters.","f":["Lies at an average altitude of almost 2000 meters.","Often called the Siberia of Turkey due to its cold."]},"tr-harran-plain-relief-v2":{"i":"/poi-images/tr-harran-plain-relief-v2.webp","s":"A vast, fertile plain in southeastern Anatolia that historically ranks among the oldest settlement areas of mankind.","f":["Part of the historical Fertile Crescent.","Today heavily irrigated by the Southeastern Anatolia Project."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
