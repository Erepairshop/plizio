vices","Features modern retail spaces on the ground floor"]},"samoa-togitogiga-agriculture-area-economic-v2":{"i":"/poi-images/samoa-togitogiga-agriculture-area-economic-v2.webp","s":"Togitogiga is a major region for commercial fruit and vegetable farming on Upolu's south coast.","f":["Known for extensive commercial taro plantations","Site of government livestock development projects"]},"samoa-falealili-cocoa-plantations-economic-v2":{"i":"/poi-images/samoa-falealili-cocoa-plantations-economic-v2.webp","s":"The Falealili region is historically and currently a center for cocoa production in Samoa.","f":["Samoan cocoa is regarded for its high quality","Crucial for boutique chocolate industries overseas"]},"samoa-vaiaata-prison-farm-economic-v2":{"i":"/poi-images/samoa-vaiaata-prison-farm-economic-v2.webp","s":"Vaiaata on Savai'i is a large agricultural facility cultivated by inmates.","f":["Largest producer of taro on the island of Savai'i","Focuses on rehabilitation through agricultural labor"]},"samoa-manono-island-fishing-hub-economic-v2":{"i":"/poi-images/samoa-manono-island-fishing-hub-economic-v2.webp","s":"Manono Island is a hub for traditional and small-scale commercial fishing.","f":["The island has no cars or motor vehicles","Fishing is the primary income source for residents"]},"samoa-maritime-academy-training-economic-v2":{"i":"/poi-images/samoa-maritime-academy-training-economic-v2.webp","s":"The Maritime Academy trains professionals for the international shipping industry.","f":["Part of the National University of Samoa","Offers certifications to international standards"]},"samoa-tui-samoa-cable-landing-economic-v2":{"i":"/poi-images/samoa-tui-samoa-cable-landing-economic-v2.webp","s":"This station is the landing point for the Tui-Samoa submarine cable.","f":["Operational since the year 2018","Connects Samoa to Fiji and Wallis & Futuna"]},"samoa-vaitele-industrial-park-economic-v2":{"i":"/poi-images/samoa-vaitele-industrial-park-economic-v2.webp","s":"The Vaitele Industrial Park offers subsidized spaces for small and medium industrial enterprises.","f":["Managed by the Samoa Trust Estates Corporation","Site for furniture making and textile production"]},"samoa-pulemelei-mound-history-v2":{"i":"/poi-images/samoa-pulemelei-mound-history-v2.webp","s":"The largest ancient structure in Polynesia is a massive stone platform on Savai'i.","f":["The base measures approximately 65 by 60 meters.","The platform reaches a height of 12 meters."]},"samoa-villa-vailima-history-v2":{"i":"/poi-images/samoa-villa-vailima-history-v2.webp","s":"The former residence of Robert Louis Stevenson now functions as a museum.","f":["Stevenson moved into the house in 1890.","The building was faithfully restored after a fire."]},"samoa-mulinuu-royal-tombs-history-v2":{"i":"/poi-images/samoa-mulinuu-royal-tombs-history-v2.webp","s":"The Mulinu'u Peninsula is the traditional burial ground for Samoa's paramount chiefs.","f":["The tombs of the Malietoa dynasty are located here.","The site is the historical center of Samoan power."]},"samoa-apia-clock-tower-history-v2":{"i":"/poi-images/samoa-apia-clock-tower-history-v2.webp","s":"The prominent clock tower in central Apia serves as a memorial for those who fell in the World Wars.","f":["The tower was erected in memory of Samoan soldiers.","It is located at the intersection of the main streets."]},"samoa-sapapalii-monument-history-v2":{"i":"/poi-images/samoa-sapapalii-monument-history-v2.webp","s":"This monument marks the spot where missionary John Williams landed in 1830.","f":["John Williams arrived on the ship 'Messenger of Peace'.","Chief Malietoa Vai'inupo received him here."]},"samoa-german-courthouse-history-v2":{"i":"/poi-images/samoa-german-courthouse-history-v2.webp","s":"This historical building in Apia dates back to the period of German colonial rule.","f":["The building was completed around 1902.","It is one of the few surviving examples of German colonial architecture."]},"samoa-falemauga-caves-history-v2":{"i":"/poi-images/samoa-falemauga-caves-history-v2.webp","s":"These lava tubes served as a place of refuge for the local population during times of war.","f":["Ancient stone platforms were found inside the caves.","They are located in the interior of Upolu island."]},"samoa-malua-theological-college-history-v2":{"i":"/poi-images/samoa-malua-theological-college-history-v2.webp","s":"Malua is one of the oldest theological educational institutions in the Pacific.","f":["The college was founded in 1844.","It houses a significant archive of missionary history."]},"samoa-mount-vaea-rls-tomb-history-v2":{"i":"/poi-images/samoa-mount-vaea-rls-tomb-history-v2.webp","s":"On the summit of Mount Vaea lies the final resting place of the famous writer.","f":["Stevenson died in 1894.","His famous requiem is engraved on his tombstone."]},"samoa-piula-cave-pool-history-v2":{"i":"/poi-images/samoa-piula-cave-pool-history-v2.webp","s":"This natural freshwater pool beneath a historic Methodist church was formed from a lava tube.","f":["The Piula Theological College opened here in 1905.","Two caves are connected by an underwater tunnel."]},"samoa-moso-footprint-history-v2":{"i":"/poi-images/samoa-moso-footprint-history-v2.webp","s":"A depression in the lava rock near Falealupo, which according to legend is the footprint of the giant Moso.","f":["The footprint is about 2 meters long.","Moso is said to have made one step from Fiji to Samoa."]},"samoa-german-monument-mulinuu-history-v2":{"i":"/poi-images/samoa-german-monument-mulinuu-history-v2.webp","s":"This monument commemorates the German rule over Samoa from 1900 to 1914.","f":["It marks the site of the flag raising in 1900.","Samoa was the only German colony without a military occupation."]},"samoa-vaimoso-mau-headquarters-history-v2":{"i":"/poi-images/samoa-vaimoso-mau-headquarters-history-v2.webp","s":"Vaimoso was the center of the Mau movement, which fought non-violently against the New Zealand administration.","f":["The Mau movement demanded 'Samoa mo Samoa' (Samoa for Samoans).","The 'Black Saturday' incident occurred here in 1929."]},"samoa-apolima-island-forts-history-v2":{"i":"/poi-images/samoa-apolima-island-forts-history-v2.webp","s":"The small volcanic island of Apolima served historically as a natural fortress.","f":["Apolima was a strategic retreat in tribal wars.","The island is enclosed by steep cliffs."]},"samoa-manono-star-mound-history-v2":{"i":"/poi-images/samoa-manono-star-mound-history-v2.webp","s":"On Manono Island, there are several star mounds (Tia Seu) used for pigeon catching.","f":["The mounds typically have 8 to 12 points.","Pigeon catching was a sport of the Samoan nobility."]},"samoa-vailele-battlefield-history-v2":{"i":"/poi-images/samoa-vailele-battlefield-history-v2.webp","s":"Vailele was the site of fierce fighting during the First Samoan Civil War.","f":["The battle took place in 1889.","German troops suffered a heavy defeat here."]},"samoa-luatuanuu-hillfort-history-v2":{"i":"/poi-images/samoa-luatuanuu-hillfort-history-v2.webp","s":"This ancient fortification on Upolu consists of terraces and ditches.","f":["It is one of the best-preserved hilltop forts in Samoa.","The complex provided protection against invasions from the sea."]},"samoa-falealupo-old-church-history-v2":{"i":"/poi-images/samoa-falealupo-old-church-history-v2.webp","s":"The ruins of the Catholic church in Falealupo bear witness to the destructive power of past cyclones.","f":["The church was heavily damaged by cyclones Ofa and Val.","The massive coral stone walls still stand today."]},"samoa-fangaloa-ancient-village-history-v2":{"i":"/poi-images/samoa-fangaloa-ancient-village-history-v2.webp","s":"The isolated Fangaloa Bay houses remains of centuries-old settlements.","f":["Lapita pottery shards were found in the region.","The area is known for its steep mountains and deep valleys."]},"samoa-lotofaga-archaeological-site-history-v2":{"i":"/poi-images/samoa-lotofaga-archaeological-site-history-v2.webp","s":"Near the south coast of Upolu, significant pre-colonial structures were discovered in Lotofaga.","f":["Some of Upolu's oldest settlement traces were found here.","The finds date back to approximately 1000 BC."]},"samoa-asau-historic-port-history-v2":{"i":"/poi-images/samoa-asau-historic-port-history-v2.webp","s":"Asau was an important export port for the Samoan timber industry during the colonial era.","f":["In the 1960s, it was a center of the modern economy.","The harbor entrance was deepened by coral blasting."]},"samoa-malietoa-tombs-history-v2":{"i":"/poi-images/samoa-malietoa-tombs-history-v2.webp","s":"These tombs belong to the rulers of the Malietoa dynasty, one of the four paramount chiefly lines in Samoa.","f":["Malietoa Tanumafili II was interred here in 2007.","The dynasty has played a leading political role for centuries."]},"samoa-german-monument-samoa-history-v2":{"i":"/poi-images/samoa-german-monument-samoa-history-v2.webp","s":"The monument stands for the era of German Samoa and the founding of the colony.","f":["Wilhelm Solf was the first German governor.","The German era is often seen as a phase of economic boom."]},"samoa-mataafa-tombs-history-v2":{"i":"/poi-images/samoa-mataafa-tombs-history-v2.webp","s":"The final resting place of the Mata'afa line is also located in Mulinu'u.","f":["Mata'afa Iosefo was a significant rival of the Malietoa.","He was temporarily sent into exile by the Germans."]},"samoa-lepa-ancient-village-history-v2":{"i":"/poi-images/samoa-lepa-ancient-village-history-v2.webp","s":"Lepa is a historic village on Upolu's south coast with remnants of ancient stone walls.","f":["The village survived several devastating tsunamis.","There are traditional meeting houses (Fale) located there."]},"samoa-siumu-ancient-wells-history-v2":{"i":"/poi-images/samoa-siumu-ancient-wells-history-v2.webp","s":"In the Siumu region, old stone-built wells can be found that secured the water supply for previous generations.","f":["Some wells are up to 10 meters deep.","They were often dug near the coast to extract groundwater."]},"samoa-taga-blowholes-history-v2":{"i":"/poi-images/samoa-taga-blowholes-history-v2.webp","s":"These natural sea fountains near Taga are closely linked to Samoan creation myths.","f":["Water is forced upward through lava tubes.","Fountains can reach a height of over 30 meters."]},"samoa-aopo-lava-tube-refuge-history-v2":{"i":"/poi-images/samoa-aopo-lava-tube-refuge-history-v2.webp","s":"The village of Aopo is located near extensive lava caves that served historically as defensive positions.","f":["The lava tubes were formed during the Matavanu eruptions.","They provided shelter from enemy attacks and cyclones."]},"samoa-samata-ancient-settlement-history-v2":{"i":"/poi-images/samoa-samata-ancient-settlement-history-v2.webp","s":"Samata is an archaeological site on the southwest coast of Savai'i.","f":["The terraces served for the cultivation of taro and other crops.","Remains of ancient chiefly houses were discovered."]},"samoa-neiafu-archaeological-mound-history-v2":{"i":"/poi-images/samoa-neiafu-archaeological-mound-history-v2.webp","s":"Near Neiafu in western Savai'i lies a significant stone platform from pre-colonial times.","f":["The platform is constructed from local basalt stones.","Neiafu is often mentioned in oral traditions."]},"samoa-papa-ancient-village-history-v2":{"i":"/poi-images/samoa-papa-ancient-village-history-v2.webp","s":"Papa is known for its historical foundations of traditional houses and sacred sites.","f":["The name 'Papa' refers to the flat stone slabs of the region.","Remnants of noble burial sites were found here."]},"samoa-vaisala-historic-mission-history-v2":{"i":"/poi-images/samoa-vaisala-historic-mission-history-v2.webp","s":"Vaisala was one of the early sites for Christian missionaries in northwest Savai'i.","f":["The mission was founded in the mid-19th century.","There is a small museum of local history there."]},"samoa-sataua-ancient-mounds-history-v2":{"i":"/poi-images/samoa-sataua-ancient-mounds-history-v2.webp","s":"Sataua is home to several artificial earth mounds used historically for ceremonies and as residences for the elite.","f":["Some mounds are faced with stone.","The Sataua region is rich in legends about ancestors."]},"samoa-vailoa-star-mound-history-v2":{"i":"/poi-images/samoa-vailoa-star-mound-history-v2.webp","s":"This star mound near Vailoa is an example of Samoa's complex stone architecture.","f":["The star shape is unique to Samoan culture.","High-ranking chiefs competed in pigeon catching."]},"samoa-letolo-plantation-mound-history-v2":{"i":"/poi-images/samoa-letolo-plantation-mound-history-v2.webp","s":"On the grounds of the Letolo plantation, there are numerous archaeological structures, including large star mounds.","f":["The area includes one of the largest mound fields in Samoa.","The plantation is currently used for agricultural purposes."]},"samoa-puapua-historic-mission-history-v2":{"i":"/poi-images/samoa-puapua-historic-mission-history-v2.webp","s":"Pu'apu'a was a significant outpost of the London Missionary Society on Savai'i.","f":["The village's first school was founded by missionaries.","The church in Pu'apu'a is a prominent building on the coast."]},"samoa-sasina-mound-history-v2":{"i":"/poi-images/samoa-sasina-mound-history-v2.webp","s":"Near Sasina, there are remains of ceremonial stone platforms.","f":["The mound is surrounded by dense tropical forest.","Sasina was a strategically important site for local chiefly power."]},"samoa-falelima-historic-site-history-v2":{"i":"/poi-images/samoa-falelima-historic-site-history-v2.webp","s":"Falelima on the west coast of Savai'i possesses significant ruins from the pre-colonial era.","f":["Remains of large communal houses were found.","Falelima translates to 'house of five'."]},"samoa-tufutafoe-ruins-history-v2":{"i":"/poi-images/samoa-tufutafoe-ruins-history-v2.webp","s":"The ruins near Tufutafoe include ancient stone walls and platforms.","f":["The site is closely linked to beliefs in the afterlife.","The stone walls likely served to demarcate sacred spaces."]},"samoa-malua-church-ruins-history-v2":{"i":"/poi-images/samoa-malua-church-ruins-history-v2.webp","s":"Remnants of the original mission church in Malua, built in the 19th century.","f":["The church was built from local coral limestone.","It was once the largest building in the region."]},"samoa-apia-old-wharf-history-v2":{"i":"/poi-images/samoa-apia-old-wharf-history-v2.webp","s":"The historic wharf in Apia was the most important hub for trade in Samoa during the 19th century.","f":["The first German and British merchants landed here.","The wharf was heavily damaged during the 1889 cyclone."]},"samoa-mulinuu-german-monument-history-v2":{"i":"/poi-images/samoa-mulinuu-german-monument-history-v2.webp","s":"This specific monument marks the spot where the German imperial flag was officially raised in 1900.","f":["The ceremony ended the tripartite rule over Samoa.","It is located near the Supreme Court."]},"samoa-tamasese-tomb-history-v2":{"i":"/poi-images/samoa-tamasese-tomb-history-v2.webp","s":"The tomb for Tupua Tamasese Lealofi III, the leader of the Mau movement.","f":["He was shot during 'Black Saturday' in 1929.","His final words urged for peace."]},"samoa-malua-memorial-church-history-v2":{"i":"/poi-images/samoa-malua-memorial-church-history-v2.webp","s":"This imposing church in Malua commemorates the missionaries who brought Christianity to Samoa.","f":["The church can accommodate over 1000 worshippers.","The construction costs were covered by donations from Samoan congregations."]},"samoa-mulinuu-observatory-history-v2":{"i":"/poi-images/samoa-mulinuu-observatory-history-v2.webp","s":"Founded in 1902 by German scientists, this was one of the most important geophysics research stations in the Pacific.","f":["It was originally operated by the University of Göttingen.","The observatory is located at the tip of the Mulinu'u Peninsula."]},"samoa-falemauga-caves-refuge-history-v2":{"i":"/poi-images/samoa-falemauga-caves-refuge-history-v2.webp","s":"These caves provided protection from warring tribes for centuries.","f":["Archaeological excavations found ancient stone tools there.","The caves are part of a complex lava tube system."]},"samoa-lepa-historical-well-history-v2":{"i":"/poi-images/samoa-lepa-historical-well-history-v2.webp","s":"An old coral-stone well in Lepa that was once the village's only source of fresh water.","f":["The well is over 100 years old.","It was dug by hand into the volcanic rock."]},"samoa-vailele-plantation-history-v2":{"i":"/poi-images/samoa-vailele-plantation-history-v2.webp","s":"Vailele was one of the largest German copra plantations in the Pacific.","f":["The plantation was operated by the DHPG.","Thousands of tons of copra were shipped to Europe."]},"samoa-apia-old-post-office-history-v2":{"i":"/poi-images/samoa-apia-old-post-office-history-v2.webp","s":"A significant building from the early colonial period that ensured Samoa's communication links with the world.","f":["The building also served as a telegraph station.","It is located near the waterfront."]},"samoa-malua-historic-library-history-v2":{"i":"/poi-images/samoa-malua-historic-library-history-v2.webp","s":"The library houses rare documents on missionary history and 19th-century Samoan culture.","f":["It contains the first Bibles printed in Samoa.","The collection includes diaries of early missionaries."]},"samoa-salelologa-historic-pier-history-v2":{"i":"/poi-images/samoa-salelologa-historic-pier-history-v2.webp","s":"This pier was the main link between the islands of Upolu and Savai'i for generations.","f":["Salelologa is the economic gateway to Savai'i.","The original pier was built of solid stone and wood."]},"samoa-lufilufi-ancient-well-history-v2":{"i":"/poi-images/samoa-lufilufi-ancient-well-history-v2.webp","s":"A historic stone-lined well in Lufilufi, closely associated with the Tuia'ana title.","f":["Lufilufi is a center of Samoan tradition.","The well is regarded as 'sacred'."]},"samoa-maota-o-solosolo-history-v2":{"i":"/poi-images/samoa-maota-o-solosolo-history-v2.webp","s":"The Solosolo meeting ground is a historically significant site for political deliberations on Upolu.","f":["Solosolo is known for its oratorical culture.","The square is surrounded by large traditional houses (Fale Tele)."]},"samoa-falealupo-canopy-history-v2":{"i":"/poi-images/samoa-falealupo-canopy-history-v2.webp","s":"This walkway was built to protect the rainforest from logging.","f":["It was financed with the help of international donations.","The Falealupo village community manages the project."]},"samoa-malua-mission-press-history-v2":{"i":"/poi-images/samoa-malua-mission-press-history-v2.webp","s":"Malua was the site of the first significant printing press in Samoa.","f":["The press began operation in the mid-19th century.","It contributed decisively to the spread of the written language."]},"samoa-apia-town-hall-history-v2":{"i":"/poi-images/samoa-apia-town-hall-history-v2.webp","s":"The old town hall served as the civic center of Apia during the period of New Zealand administration.","f":["The building was constructed in the early 20th century.","Important community meetings were held here."]},"samoa-malua-theological-college-gates-history-v2":{"i":"/poi-images/samoa-malua-theological-college-gates-history-v2.webp","s":"The historic entrance gates of Malua Theological College are a landmark of the region.","f":["The gates are elaborately decorated with Christian symbols.","They mark the boundary between the village and the campus."]},"samoa-asau-ancient-star-mound-history-v2":{"i":"/poi-images/samoa-asau-ancient-star-mound-history-v2.webp","s":"A large star mound near Asau that points to the site's significance in antiquity.","f":["The mound is located on a hill overlooking the bay.","Asau was historically a gathering point for fleets from S   const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);

function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}

function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
</html>
