.lang.on{background:#3b82f6;color:#fff}

#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;background-image:radial-gradient(1.2px 1.2px at 12% 22%,#ffffff70,transparent),radial-gradient(1px 1px at 28% 68%,#ffffff55,transparent),radial-gradient(1.4px 1.4px at 47% 38%,#cfe4ff66,transparent),radial-gradient(1px 1px at 63% 18%,#ffffff50,transparent),radial-gradient(1.3px 1.3px at 78% 72%,#ffffff66,transparent),radial-gradient(1px 1px at 88% 33%,#cfe4ff55,transparent),radial-gradient(1px 1px at 38% 88%,#ffffff44,transparent),radial-gradient(1.2px 1.2px at 92% 58%,#ffffff55,transparent);background-repeat:no-repeat}
#svg{width:100%;height:100%;display:block;cursor:grab;position:relative;z-index:1}
#svg.drag{cursor:grabbing}
.region{fill:#161e3a;stroke:#6f9bf0;stroke-width:1.1;stroke-opacity:.7;transition:fill .15s}
.region:hover{fill:#28356e}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#0a0f20;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#7cc0ff;filter:drop-shadow(0 0 2.4px #4aa6ff)}
.poi.g-sight circle{fill:#fcd34d;filter:drop-shadow(0 0 2.4px #f5b528)}
.poi.g-nature circle{fill:#4ade80;filter:drop-shadow(0 0 2.4px #22c55e)}
.poi.g-history circle{fill:#d0a6ff;filter:drop-shadow(0 0 2.4px #b266ff)}
.poi.g-industry circle{fill:#ffb066;filter:drop-shadow(0 0 2.4px #fb923c)}
.poi.g-other circle{fill:#b8c0cc;filter:drop-shadow(0 0 2px #9ca3af)}
.poi.dim{opacity:.16}
.poi.dim circle{filter:none}
.poi,.cluster{transition:opacity .2s}
#svg.dim-pois .poi,#svg.dim-pois .cluster{opacity:.1!important}
#svg.dim-pois .poi circle{filter:none}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7.5;fill:#fff;opacity:1;filter:drop-shadow(0 0 6px #cfeaff) drop-shadow(0 0 11px #7fd0ff)}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:rgba(11,19,35,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(120,180,255,.3);border-radius:18px 18px 0 0;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -12px 44px rgba(0,0,0,.6)}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a,.popup .list .nl{display:flex;align-items:center;gap:.6rem;padding:.4rem .45rem;border-radius:10px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:hover,.popup .list a:active{background:rgba(120,180,255,.12)}
.popup .list .lthumb{width:42px;height:42px;border-radius:9px;flex-shrink:0;background:#1a2740 center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.popup .list .lthumb .dot{width:9px;height:9px;border-radius:50%}
.popup .list .lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.popup .list .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.popup .list .g{font-size:.64rem;color:#9fc4ff;text-transform:uppercase;letter-spacing:.04em}
.popup .list .lgo{color:#7fb0ff;font-size:1.2rem;font-weight:700;flex-shrink:0;padding-right:.3rem}
.popup .list .nl{color:#ffffffb0;font-style:normal}
.mapcard{position:fixed;z-index:20;width:max-content;min-width:150px;max-width:230px;background:rgba(11,19,35,.82);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);border:1px solid rgba(120,180,255,.34);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.62),0 0 0 1px rgba(120,180,255,.08);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-100%) translateY(-15px) scale(.95);transform-origin:bottom center;transition:opacity .16s,transform .16s}
.mapcard.open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-100%) translateY(-15px) scale(1)}
.mapcard--below{transform:translate(-50%,0) translateY(15px) scale(.95);transform-origin:top center}
.mapcard--below.open{transform:translate(-50%,0) translateY(15px) scale(1)}
.mapcard::after{content:"";position:absolute;left:var(--ax,50%);top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(11,19,35,.82)}
.mapcard--below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:rgba(11,19,35,.82)}
.mapcard .mc-img{width:100%;aspect-ratio:16/9;background:#1a2740 center/cover no-repeat;display:none;border-radius:13px 13px 0 0}
.mapcard .mc-img.has{display:block}
.mapcard .mc-body{padding:9px 11px 11px}
.mapcard .mc-type{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#7fb0ff;font-weight:700}
.mapcard .mc-name{font-size:.95rem;font-weight:800;color:#eef4ff;margin:1px 0 5px;line-height:1.2}
.mapcard .mc-desc{font-size:.76rem;color:#cfe0ff;line-height:1.4;margin:0 0 9px;display:none}
.mapcard .mc-desc.show{display:block}
.mapcard .mc-more{display:inline-block;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;text-decoration:none;font-weight:700;font-size:.78rem;padding:.42rem .75rem;border-radius:8px}
.mapcard .mc-x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:.95rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.burst{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}
.burst.open{display:block}
.burst-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst-line{stroke:rgba(120,185,255,.4);stroke-width:1.1;stroke-linecap:round;animation:burstFade .25s ease-out}
.burst-core{fill:#cdeeff;filter:drop-shadow(0 0 5px #7fd0ff)}
.burst-dots{position:absolute;inset:0}
.burst-dot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;animation:burstPop .22s ease-out}
.burst-dot .bd{width:15px;height:15px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(8,16,34,.6),0 0 10px currentColor;transition:transform .12s}
.burst-dot:hover .bd,.burst-dot:focus-visible .bd{transform:scale(1.3)}
.burst-dot .bl{font-size:.72rem;font-weight:700;color:#eef4ff;background:rgba(8,14,28,.82);border:1px solid rgba(120,180,255,.25);padding:1.5px 6px;border-radius:7px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
@keyframes burstPop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes burstFade{from{opacity:0}to{opacity:1}}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}
</style>

":"/poi-images/city-pieta-extra.webp","s":"Pietà, an der Nordostküste Maltas gelegen, ist eine Stadt, die oft im Schatten ihrer berühmten Nachbarin Valletta liegt, aber einen ganz eigenen, authentischen Charme besitzt."},"city-hamrun-extra":{"i":"/poi-images/city-hamrun-extra.webp","s":"Ħamrun ist eine der größten und geschäftigsten Städte im Inner Harbour District von Malta."},"city-marsa-extra":{"i":"/poi-images/city-marsa-extra.webp","s":"Marsa liegt am inneren Ende des Grand Harbour und ist ein wichtiges Industriezentrum mit einem Kraftwerk und einer Pferderennbahn.","f":["Der Name bedeutet 'Hafen' oder 'Ankerplatz'.","Heimat des Royal Malta Golf Club."]},"city-floriana-extra":{"i":"/poi-images/city-floriana-extra.webp","s":"Floriana ist eine befestigte Stadt und ein Vorort von Valletta, bekannt für ihre großen Plätze, Gärten und historischen Magazine.","f":["Nach dem italienischen Militäringenieur Pietro Paolo Florani benannt.","Beherbergt viele Regierungsgebäude."]},"city-kalkara-extra":{"i":"/poi-images/city-kalkara-extra.webp","s":"Kalkara ist ein malerisches Dorf am Grand Harbour, Heimat des Esplora Science Centre und des Fort Ricasoli.","f":["Der Name bedeutet 'Kalkofen'.","Der Kalkara Creek bietet einen sicheren Ankerplatz für Boote."]},"city-vittoriosa-birgu-extra":{"i":"/poi-images/city-vittoriosa-birgu-extra.webp","s":"Birgu, auch Vittoriosa genannt, ist eine der drei Städte, bekannt für ihre entscheidende Rolle während der Großen Belagerung von 1565.","f":["Vor Valletta die Hauptstadt Maltas.","Heimat des Inquisitorenpalastes."]},"city-senglea-isla-extra":{"i":"/poi-images/city-senglea-isla-extra.webp","s":"Senglea, auch bekannt als L-Isla, ist eine der berühmten Drei Städte und eine befestigte Stadt, die majestätisch in den Grand Harbour hineinragt."},"city-cospicua-bormla-extra":{"i":"/poi-images/city-cospicua-bormla-extra.webp","s":"Cospicua, oder Bormla, ist die größte der drei Städte und bekannt für ihre beeindruckenden Docks und Befestigungsanlagen.","f":["Heimat der historischen Santa Margherita und Cottonera Lines.","Wurde während des Zweiten Weltkriegs schwer bombardiert."]},"city-fgura-extra":{"i":"/poi-images/city-fgura-extra.webp","s":"Fgura ist eine relativ moderne Stadt, die sich nach dem Zweiten Weltkrieg schnell zu einem der wichtigsten Wohn- und Gewerbegebiete entwickelt hat.","f":["Bekannt für seine moderne Pfarrkirche.","Der Name könnte von 'Figur' abgeleitet sein, möglicherweise in Bezug auf eine Statue."]},"city-paola-extra":{"i":"/poi-images/city-paola-extra.webp","s":"Paola ist ein wichtiges Handelszentrum im Süden Maltas, berühmt für das prähistorische Hypogäum von Ħal Saflieni.","f":["Nach Großmeister Antoine de Paule benannt.","Das Hypogäum ist ein UNESCO-Weltkulturerbe."]},"city-tarxien-extra":{"i":"/poi-images/city-tarxien-extra.webp","s":"Tarxien ist bekannt für seine megalithischen Tempel, einen weiteren wichtigen prähistorischen Komplex, der zum UNESCO-Weltkulturerbe gehört.","f":["Die Tempel stammen aus der Zeit um 3150 v. Chr.","Der Komplex besteht aus drei separaten Tempelstrukturen."]},"city-luqa-extra":{"i":"/poi-images/city-luqa-extra.webp","s":"Luqa ist vor allem für den internationalen Flughafen Malta bekannt, das Haupttor des Landes zur Welt.","f":["Der Name bedeutet 'Pappel' auf Aramäisch.","Die Pfarrkirche ist dem Heiligen Andreas gewidmet."]},"city-gudja-extra":{"i":"/poi-images/city-gudja-extra.webp","s":"Gudja ist ein ruhiges Dorf in der Nähe des Flughafens, bekannt für seine drei Kirchen und das einzigartige Palazzo Bettina.","f":["Eine der ältesten Pfarreien Maltas.","Die Pfarrkirche Mariä Himmelfahrt ist die wichtigste."]},"city-ghaxaq-extra":{"i":"/poi-images/city-ghaxaq-extra.webp","s":"Għaxaq ist ein kleines, traditionelles Dorf im Süden Maltas, bekannt für sein lebhaftes Dorffest.","f":["Der Name bedeutet 'Freude' oder 'Vergnügen'.","Die Festa di Santa Marija ist eine der größten in Malta."]},"city-santa-lucija-extra":{"i":"/poi-images/city-santa-lucija-extra.webp","s":"Santa Luċija ist eine der modernsten Städte Maltas, die in den 1960er Jahren entworfen wurde und für ihren chinesischen Garten der Stille bekannt ist.","f":["Benannt nach einer Kapelle aus dem 16. Jahrhundert.","Der Garten war ein Geschenk der chinesischen Regierung."]},"city-marsaskala-extra":{"i":"/poi-images/city-marsaskala-extra.webp","s":"Marsaskala ist eine Küstenstadt, die um eine lange, malerische Bucht herum gebaut wurde und bei Einheimischen für ihre Restaurants am Meer beliebt ist.","f":["Der maltesische Name Wied il-Għajn bedeutet 'Tal der Quelle'.","Heimat des St. Thomas Tower, einer großen Wignacourt-Festung."]},"city-marsaxlokk-extra":{"i":"/poi-images/city-marsaxlokk-extra.webp","s":"Marsaxlokk ist ein traditionelles Fischerdorf, berühmt für seinen großen Sonntagsmarkt und die farbenfrohen 'Luzzu'-Boote.","f":["Der Name bedeutet 'Südosthafen'.","Die Luzzu-Boote sind mit dem Auge des Osiris bemalt, um sie vor dem Bösen zu schützen."]},"city-birzebbuga-extra":{"i":"/poi-images/city-birzebbuga-extra.webp","s":"Birżebbuġa ist eine Küstenstadt im Süden, die für ihren Sandstrand, Pretty Bay, und die Nähe zum Malta Freeport bekannt ist.","f":["Der Name bedeutet 'Brunnen der Oliven'.","In der Nähe liegt Għar Dalam, eine prähistorische Höhle."]},"city-zabbar-extra":{"i":"/poi-images/city-zabbar-extra.webp","s":"Żabbar, das den Ehrentitel Città Hompesch trägt, ist eine der größten Städte im Südosten Maltas mit einer reichen Geschichte und einer starken lokalen Identität."},"city-xghajra-extra":{"i":"/poi-images/city-xghajra-extra.webp","s":"Xgħajra ist eine kleine Küstenstadt, die für ihre lange Promenade, ihre Felsküste und die gut erhaltenen britischen Befestigungsanlagen bekannt ist.","f":["Der Name ist möglicherweise mit einem offenen, unfruchtbaren Land verbunden.","Bietet einen weiten Blick auf das offene Meer."]},"city-zejtun-extra":{"i":"/poi-images/city-zejtun-extra.webp","s":"Żejtun, das den Titel Città Beland trägt, ist eine der ältesten Städte Maltas und liegt im Südosten der Insel."},"city-qrendi-extra":{"i":"/poi-images/city-qrendi-extra.webp","s":"Qrendi ist ein ruhiges und malerisches Dorf im Süden Maltas, das eine tiefe historische und natürliche Bedeutung hat."},"city-mqabba-extra":{"i":"/poi-images/city-mqabba-extra.webp","s":"Mqabba ist bekannt für seine Steinbrüche, aus denen der hochwertige globigerine Kalkstein gewonnen wird, sowie für seine frühchristlichen Katakomben.","f":["Wichtiger Lieferant von Baumaterialien in Malta.","Die Katakomben von Ta' Mintna sind eine wichtige archäologische Stätte."]},"city-kirkop-extra":{"i":"/poi-images/city-kirkop-extra.webp","s":"Kirkop ist ein kleines Dorf in der Nähe des Flughafens, bekannt für seine Menhire und andere kleinere archäologische Überreste.","f":["Der Name ist möglicherweise eine Korruption von 'Kerkop' (ein Familienname).","Heimat einer großen STMicroelectronics-Anlage."]},"city-safi-extra":{"i":"/poi-images/city-safi-extra.webp","s":"Safi ist ein kleines, beschauliches Dorf im Süden Maltas, das sich seinen authentischen, ländlichen Charakter bewahrt hat."},"city-zurrieq-extra":{"i":"/poi-images/city-zurrieq-extra.webp","s":"Żurrieq ist eine der ältesten Städte Maltas, bekannt für die Blaue Grotte, die Xarolla-Windmühle und ihre Katakomben.","f":["Der Name könnte von 'zoroq', dem arabischen Wort für 'blau', abgeleitet sein.","Die Pfarrkirche ist der Heiligen Katharina von Alexandria gewidmet."]},"city-siggiewi-extra":{"i":"/poi-images/city-siggiewi-extra.webp","s":"Siġġiewi ist eine ländliche Stadt, die für ihre weiten Felder, Bauernhöfe und die Nähe zu den Buskett-Gärten und den Dingli-Klippen bekannt ist.","f":["Erhielt den Titel 'Città Ferdinand' von Großmeister Ferdinand von Hompesch.","Die Pfarrkirche ist dem Heiligen Nikolaus gewidmet."]},"city-zebbug-malta-extra":{"i":"/poi-images/city-zebbug-malta-extra.webp","s":"Żebbuġ, auch als Città Rohan bekannt, ist eine der ältesten Städte Maltas, bekannt für ihre großartige Pfarrkirche und ihre Feste.","f":["Der Name bedeutet 'Oliven'.","Drei separate Dorffeste werden gefeiert."]},"city-qormi-extra":{"i":"/poi-images/city-qormi-extra.webp","s":"Qormi, auch bekannt unter seinem Ehrentitel Città Pinto, ist eine der größten und historisch reichsten Städte Maltas."},"city-rabat-malta-extra":{"i":"/poi-images/city-rabat-malta-extra.webp","s":"Rabat, dessen Name aus dem Arabischen für 'Vorort' stammt, ist eine geschichtsträchtige Stadt, die untrennbar mit ihrer berühmten Nachbarin, der befestigten Stadt Mdina, verbunden ist."},"city-dingli-extra":{"i":"/poi-images/city-dingli-extra.webp","s":"Dingli liegt am höchsten Punkt Maltas und ist berühmt für seine dramatischen Klippen, die einen atemberaubenden Blick auf das Mittelmeer bieten.","f":["Die Dingli-Klippen erheben sich etwa 253 Meter über dem Meeresspiegel.","Heimat der kleinen, abgelegenen St. Maria Magdalena Kapelle."]},"city-attard-extra":{"i":"/poi-images/city-attard-extra.webp","s":"Attard, Teil der 'Drei Dörfer' zusammen mit Balzan und Lija, ist bekannt für seine Villen, Gärten und den Präsidentenpalast San Anton.","f":["Der Name bedeutet möglicherweise 'Blüten'.","Der San Anton Palast ist die offizielle Residenz des Präsidenten von Malta."]},"city-balzan-extra":{"i":"/poi-images/city-balzan-extra.webp","s":"Balzan ist ein charmantes und malerisches Dorf, eines der 'Drei Dörfer', das für seine ruhigen Gassen und eleganten Stadthäuser bekannt ist.","f":["Die Pfarrkirche ist der Verkündigung gewidmet.","Ursprünglich eine kleine Ansammlung von Bauernhöfen."]},"city-lija-extra":{"i":"/poi-images/city-lija-extra.webp","s":"Lija, das letzte der 'Drei Dörfer', ist bekannt für seine Feuerwerkstradition, Zitrusgärten und den markanten Belvedere Tower.","f":["Das jährliche Fest der Verklärung ist berühmt für sein Feuerwerk.","Heimat mehrerer großer Villen maltesischer Adliger."]},"city-iklin-extra":{"i":"/poi-images/city-iklin-extra.webp","s":"Iklin ist eine relativ neue Ortschaft, die sich aus einem ländlichen Gebiet zu einer modernen Wohnstadt entwickelt hat, die an Lija und Birkirkara grenzt.","f":["Der Name könnte vom Kraut Rosmarin (klin) abgeleitet sein.","Eine megalithische Stätte wurde in den 1960er Jahren entdeckt, aber später zerstört."]},"city-mosta-extra":{"i":"/poi-images/city-mosta-extra.webp","s":"Mosta ist berühmt für seine Rotunde, allgemein bekannt als Mosta-Dom, die eine der größten ungestützten Kuppeln der Welt besitzt.","f":["Während des Zweiten Weltkriegs fiel eine Bombe durch die Kuppel, explodierte aber nicht.","Die Kirche ist Mariä Himmelfahrt gewidmet."]},"city-naxxar-extra":{"i":"/poi-images/city-naxxar-extra.webp","s":"Naxxar ist eine große Stadt im zentral-nördlichen Malta, bekannt für den opulenten Palazzo Parisio und seine Gärten.","f":["Die Legende besagt, dass die Menschen von Naxxar die ersten waren, die dem Heiligen Paulus halfen.","Der Name könnte von 'nassar' (bekehren) abgeleitet sein."]},"city-gharghur-extra":{"i":"/poi-images/city-gharghur-extra.webp","s":"Għargħur ist eines der kleinsten und ältesten Dörfer Maltas und liegt auf einem Hügel mit Blick auf die Küste.","f":["Bekannt als 'Top of the World' Aussichtspunkt.","Behält einen Großteil seines ursprünglichen Dorfkerns."]},"city-mellieha-extra":{"i":"/poi-images/city-mellieha-extra.webp","s":"Mellieħa ist ein großes Dorf im Norden, das für Maltas größten Sandstrand, Mellieħa Bay (Għadira Bay), bekannt ist.","f":["Das Heiligtum Unserer Lieben Frau von Mellieħa ist ein nationales Heiligtum.","Heimat von Popeye Village, dem Filmset des Films von 1980."]},"city-st-pauls-bay-extra":{"i":"/poi-images/city-st-pauls-bay-extra.webp","s":"St.","f":["Eine der größten Ortschaften in der nördlichen Region.","Beherbergt das Malta National Aquarium."]},"city-bugibba-extra":{"i":"/poi-images/city-bugibba-extra.webp","s":"Buġibba ist eine lebhafte Küstenstadt im Nordosten Maltas und bildet zusammen mit Qawra und St."},"city-qawra-extra":{"i":"/poi-images/city-qawra-extra.webp","s":"Qawra ist ein Ferienort neben Buġibba, der für seine Hotels, das Malta National Aquarium und den Salina Nature Park bekannt ist.","f":["Der Qawra Tower ist ein historischer Wachturm.","Beliebt für Wassersport und Tauchen."]},"city-mgarr-malta-extra":{"i":"/poi-images/city-mgarr-malta-extra.webp","s":"Mġarr ist ein ländliches Dorf im Nordwesten Maltas, umgeben von Ackerland und bekannt für die prähistorischen Tempel Ta' Ħaġrat und Skorba.","f":["Bekannt für die Produktion von Erdbeeren.","Jährliches Erdbeerfest (Festa Frawli)."]},"city-victoria-rabat-gozo-extra":{"i":"/poi-images/city-victoria-rabat-gozo-extra.webp","s":"Victoria, auch als Rabat bekannt, ist die Hauptstadt von Gozo, deren Herzstück die alte befestigte Zitadelle (Cittadella) ist.","f":["Benannt nach der britischen Königin Victoria im Jahr 1887.","Die Zitadelle bietet einen 360-Grad-Panoramablick auf Gozo."]},"city-xewkija-extra":{"i":"/poi-images/city-xewkija-extra.webp","s":"Xewkija ist eines der ältesten Dörfer auf Gozo, das von der riesigen Kuppel seiner Rotundenkirche dominiert wird, die dem Heiligen Johannes dem Täufer gewidmet ist.","f":["Die Kuppel ist eine der größten in Europa.","Der Name leitet sich vom arabischen Wort für 'Dornen' ab."]},"city-nadur-extra":{"i":"/poi-images/city-nadur-extra.webp","s":"Nadur liegt auf einem Plateau im Osten Gozos und ist bekannt für seinen lebhaften Karneval, seinen maritimen Einfluss und die Ta' Kenuna Tower.","f":["Der Name bedeutet 'Aussichtspunkt'.","Der Nadur-Karneval ist sowohl makaber als auch satirisch."]},"city-ghajnsielem-extra":{"i":"/poi-images/city-ghajnsielem-extra.webp","s":"Għajnsielem ist das erste Dorf, das Besucher auf Gozo sehen, da es den Hafen von Mġarr überblickt, den Ankunftspunkt der Fähre von Malta.","f":["Der Name bedeutet 'Friedliche Quelle'.","Heimat des Fort Chambray, einer großen Festung."]},"city-qala-extra":{"i":"/poi-images/city-qala-extra.webp","s":"Qala, das östlichste Dorf der Insel Gozo, ist ein Ort von ruhiger Schönheit und atemberaubenden Ausblicken."},"city-gharb-extra":{"i":"/poi-images/city-gharb-extra.webp","s":"Għarb ist ein traditionelles Dorf im Westen Gozos, bekannt für seine malerische Pfarrkirche, das Folkloremuseum und das Heiligtum Ta' Pinu.","f":["Der Name bedeutet 'Westen'.","Die Basilika Mariä Heimsuchung ist ein barockes Juwel."]},"city-san-lawrenz-extra":{"i":"/poi-images/city-san-lawrenz-extra.webp","s":"San Lawrenz ist ein idyllisches Dorf an der Westküste von Gozo, das für seine Ruhe, seinen traditionellen Charme und seine spektakuläre natürliche Umgebung bekannt ist."},"city-xlendi-extra":{"i":"/poi-images/city-xlendi-extra.webp","s":"Xlendi, eingebettet in eine malerische, fjordähnliche Bucht an der Südwestküste von Gozo, ist ein charmantes ehemaliges Fischerdorf, das sich zu einem beliebten Ferienort entwickelt hat."},"city-munxar-extra":{"i":"/poi-images/city-munxar-extra.webp","s":"Munxar, eines der kleinsten Dörfer auf Gozo, bietet einen authentischen Einblick in das ländliche maltesische Leben, fernab der geschäftigen Küstenorte."},"city-sannat-extra":{"i":"/poi-images/city-sannat-extra.webp","s":"Sannat ist ein ruhiges und traditionelles Dorf im Süden der Insel Gozo."},"city-fontana-extra":{"i":"/poi-images/city-fontana-extra.webp","s":"Fontana, auch bekannt als 'Triq tal-Għajn' (Quellenstraße), ist ein kleines Dorf in der Nähe von Victoria, das für seine immer fließenden Quellen bekannt ist.","f":["Die Einheimischen nutzten die Arkaden-Unterstände, um ihre Wäsche zu waschen.","Die Pfarrkirche ist dem Heiligsten Herzen Jesu gewidmet."]},"city-kercem-extra":{"i":"/poi-images/city-kercem-extra.webp","s":"Kerċem ist ein Dorf westlich von Victoria, das in der malerischen Lunzjata-Schlucht liegt und für seine ländliche Umgebung bekannt ist.","f":["Der Ortsteil Santa Luċija ist bekannt für seine ruhige Atmosphäre.","Das jährliche Fest des Heiligen Gregors ist eine wichtige traditionelle Veranstaltung."]},"city-xaghra-extra":{"i":"/poi-images/city-xaghra-extra.webp","s":"Xagħra ist ein großes Dorf auf Gozo, bekannt für die zum UNESCO-Weltkulturerbe gehörenden Ġgantija-Tempel, die Calypso-Höhle und die Ramla Bay.","f":["Die Ġgantija-Tempel gehören zu den ältesten freistehenden Bauwerken der Welt.","Die Ramla Bay ist bekannt für ihren einzigartigen rötlich-goldenen Sand."]},"city-zebbug-gozo-extra":{"i":"/poi-images/city-zebbug-gozo-extra.webp","s":"Żebbuġ liegt auf einem Hügel im Norden Gozos und ist bekannt für seine atemberaubende Aussicht, seine Onyx-Vorkommen und die malerische Küste.","f":["Der Name bedeutet 'wilder Olivenbaum'.","Die Küste umfasst die Salzpfannen von Xwejni."]},"city-ghasri-extra":{"i":"/poi-images/city-ghasri-extra.webp","s":"Għasri ist das kleinste Dorf auf Gozo, bekannt für das abgeschiedene, fjordähnliche Wied il-Għasri und den Leuchtturm von Giordan.","f":["Wied il-Għasri ist ein beliebter Ort zum Tauchen.","Der Giordan-Leuchtturm bietet spektakuläre Ausblicke."]},"city-marsalforn-extra":{"i":"/poi-images/city-marsalforn-extra.webp","s":"Marsalforn ist der beliebteste Ferienort auf Gozo, bekannt für seine lebhafte Promenade, Restaurants und Salzpfannen.","f":["Einst ein wichtiger Hafen auf Gozo.","Die Salzpfannen entlang der Küste werden noch heute genutzt."]},"city-mtarfa-extra":{"i":"/poi-images/city-mtarfa-extra.webp","s":"Mtarfa ist eine kleine Stadt mit Blick auf Mdina, bekannt für ihre Vergangenheit als britische Militärkaserne und ihren markanten Glockenturm.","f":["Das Royal Naval Hospital ist ein großes, denkmalgeschütztes Gebäude.","Der Glockenturm wurde 1895 erbaut."]},"animal-habitat-ghadira-nature-reserve-extra":{"i":"/poi-images/animal-habitat-ghadira-nature-reserve-extra.webp","s":"Ein wichtiges Vogelschutzgebiet und Feuchtgebiet, besonders während der Vogelzugzeiten.","f":["Größtes verbliebenes Feuchtgebiet auf dem maltesischen Archipel","Offizielles Naturschutzgebiet seit dem Jahr 1980"]},"animal-habitat-simar-nature-reserve-extra":{"i":"/poi-images/animal-habitat-simar-nature-reserve-extra.webp","s":"Ein weiteres wichtiges Feuchtgebiet in der Nähe von Xemxija, das Vögeln und anderen Wildtieren einen Lebensraum bietet.","f":["Die Restaurierung des Feuchtgebiets begann im Jahr 1992.","Das Gebiet wurde 1996 offiziell als Ramsar-Gebiet ausgewiesen."]},"animal-habitat-buskett-gardens-extra":{"i":"/poi-images/animal-habitat-buskett-gardens-extra.webp","s":"Eines der wenigen Waldgebiete Maltas, Heimat vieler Vogelarten und Insekten.","f":["Ehemals Jagdrevier der Johanniter-Ritter","Beherbergt den Palast von Verdala am Rand"]},"animal-habitat-filfla-island-extra":{"i":"/poi-images/animal-habitat-filfla-island-extra.webp","s":"Eine kleine, unbewohnte Insel, die ein wichtiges Schutzgebiet für Seevögel ist, insbesondere für den Mittelmeer-Sturmtaucher.","f":["Die Insel wurde über 100 Jahre lang als Ziel für Bombenabwürfe genutzt.","Sie erhielt 1988 vollen Schutz durch das Filfla Nature Reserve Gesetz."]},"animal-habitat-ta-cenc-cliffs-gozo-extra":{"i":"/poi-images/animal-habitat-ta-cenc-cliffs-gozo-extra.webp","s":"Diese Klippen auf Gozo sind ein wichtiger Nistplatz für Kolonien von Seevögeln.","f":["Höchste Klippen auf der Insel Gozo","Hauptnistplatz für den Mittelmeer-Sturmtaucher"]},"animal-habitat-dwejra-bay-gozo-extra":{"i":"/poi-images/animal-habitat-dwejra-bay-gozo-extra.webp","s":"Ein marines Schutzgebiet, das für seine reiche Unterwasserwelt und Biodiversität bekannt ist.","f":["Standort des berühmten, eingestürzten Azure Window","Fungus Rock war für Heilpflanzen der Ritter bekannt"]},"animal-habitat-l-rdum-tal-madonna-extra":{"i":"/poi-images/animal-habitat-l-rdum-tal-madonna-extra.webp","s":"Ein Schutzgebiet, das für seine Kolonie von Mittelmeer-Sturmtauchern bekannt ist.","f":["Nistplatz für über 500 Sturmtaucher-Paare","Unterliegt strengen Schutzmaßnahmen gegen Ratten"]},"animal-habitat-salina-nature-park-extra":{"i":"/poi-images/animal-habitat-salina-nature-park-extra.webp","s":"Restaurierte Salzpfannen, die nun als Feuchtgebiet für Vögel dienen.","f":["Einst von den Johanniter-Rittern angelegt","Wurde kürzlich umfangreich ökologisch saniert"]},"animal-habitat-st-pauls-islands-extra":{"i":"/poi-images/animal-habitat-st-pauls-islands-extra.webp","s":"Zwei kleine Inseln, die ein Zufluchtsort für Wildtiere sind, einschließlich der endemischen maltesischen Mauereidechse.","f":["Die Statue des Heiligen Paulus ist 4 Meter hoch.","Die Inseln wurden einst vom britischen Militär zur Überwachung genutzt."]},"animal-habitat-comino-bird-sanctuary-extra":{"i":"/poi-images/animal-habitat-comino-bird-sanctuary-extra.webp","s":"Die gesamte Insel Comino ist ein Vogelschutzgebiet und ein wichtiger Rastplatz für Zugvögel.","f":["Comino ist nach dem Kreuzkümmel benannt, der dort einst wild wuchs.","Die Insel hat eine dauerhafte Bevölkerung von nur wenigen Personen."]},"animal-habitat-malta-falconry-centre-extra":{"i":"/poi-images/animal-habitat-malta-falconry-centre-extra.webp","s":"Ein Zentrum, das sich der Erhaltung und Zucht von Greifvögeln widmet.","f":["Bietet tägliche Flugvorführungen für Besucher","Beherbergt Falken, Eulen und sogar Adler"]},"animal-habitat-tal-maghluq-marsaxlokk-extra":{"i":"/poi-images/animal-habitat-tal-maghluq-marsaxlokk-extra.webp","s":"Ein salziges Sumpfgebiet, das für seine spezialisierte Flora und Fauna bekannt ist.","f":["Überlebensort für den Mittelmeer-Killifisch","Liegt direkt neben dem Fischerhafen von Marsaxlokk"]},"animal-habitat-wied-ghollieqa-nature-reserve-extra":{"i":"/poi-images/animal-habitat-wied-ghollieqa-nature-reserve-extra.webp","s":"Ein kleines, aber wichtiges Tal-Ökosystem in der Nähe der Universität von Malta.","f":["Beherbergt eine große Anzahl maltesischer Igel","Wird von Nature Trust Malta ehrenamtlich gepflegt"]},"animal-habitat-l-ahrax-tal-mellieha-extra":{"i":"/poi-images/animal-habitat-l-ahrax-tal-mellieha-extra.webp","s":"Ein Waldgebiet, das Lebensraum für verschiedene Arten bietet und bei Campern beliebt ist.","f":["Das Plateau beherbergt eine der größten Bru -cellars-extra.webp","s":"Einer der ältesten Weinhersteller Maltas, der Kellerführungen und Weinproben anbietet.","f":["Gegründet im Jahr 1919 von Anthony Cassar.","Die Kellerei befindet sich in historischen Gebäuden in Paola."]},"agriculture-meridiana-wine-estate-extra":{"i":"/poi-images/agriculture-meridiana-wine-estate-extra.webp","s":"Ein modernes Weingut in Ta' Qali, bekannt für seine Qualitätsweine aus internationalen Rebsorten.","f":["Trockensteinmauern teilen die Felder in kleine Parzellen.","Wein, Oliven und Zitrusfrüchte sind klassische Erträge."]},"agriculture-ta-mena-estate-gozo-extra":{"i":"/poi-images/agriculture-ta-mena-estate-gozo-extra.webp","s":"Ein Agrotourismus-Gut auf Gozo, das Wein, Olivenöl und andere lokale Produkte herstellt.","f":["Trockensteinmauern teilen die Felder in kleine Parzellen.","Wein, Oliven und Zitrusfrüchte sind klassische Erträge."]},"agriculture-tal-massar-winery-gozo-extra":{"i":"/poi-images/agriculture-tal-massar-winery-gozo-extra.webp","s":"Ein Boutique-Weingut auf Gozo, das sich auf die Herstellung von Weinen aus lokalen Rebsorten spezialisiert hat.","f":["Trockensteinmauern teilen die Felder in kleine Parzellen.","Wein, Oliven und Zitrusfrüchte sind klassische Erträge."]},"agriculture-vincent-eco-farm-extra":{"i":"/poi-images/agriculture-vincent-eco-farm-extra.webp","s":"Eine der größten Bio-Farmen in Malta, die eine Vielzahl von Gemüse und Obst anbaut.","f":["Trockensteinmauern teilen die Felder in kleine Parzellen.","Wein, Oliven und Zitrusfrüchte sind klassische Erträge."]},"agriculture-ta-qali-farmers-market-extra":{"i":"/poi-images/agriculture-ta-qali-farmers-market-extra.webp","s":"Ein Markt, auf dem lokale Bauern ihre frischen Produkte direkt an die Verbraucher verkaufen.","f":["Markttage sind Dienstag und Samstag","Verkauf erfolgt direkt durch den Erzeuger"]},"agriculture-gozo-cottage-products-extra":{"i":"/poi-images/agriculture-gozo-cottage-products-extra.webp","s":"Ein Geschäft, das traditionelle gozitanische Produkte wie Käse (Ġbejna), Honig und Marmeladen verkauft.","f":["Trockensteinmauern teilen die Felder in kleine Parzellen.","Wein, Oliven und Zitrusfrüchte sind klassische Erträge."]},"agriculture-magro-food-village-gozo-extra":{"i":"/poi-images/agriculture-magro-food-village-gozo-extra.webp","s":"Ein Zentrum für die Verarbeitung von Lebensmitteln, das auch Führungen und Verkostungen von lokalen Produkten anbietet.","f":["Es befindet sich in Xewkija und ist der Hauptsitz der Magro Brothers.","Besucher können die Herstellung von Käse und Kunserva beobachten."]},"agriculture-sun-ripe-farms-extra":{"i":"/poi-images/agriculture-sun-ripe-farms-extra.webp","s":"Ein landwirtschaftlicher Betrieb, der für seine Erdbeeren und anderes Obst bekannt ist.","f":["Produziert preisgekröntes Olivenöl extra vergine","Verwendet traditionelle Methoden der Sonnentrocknung"]},"agriculture-frescos-olive-grove-extra":{"i":"/poi-images/agriculture-frescos-olive-grove-extra.webp","s":"Ein Olivenhain, der hochwertiges, extra natives Olivenöl herstellt.","f":["Der Hain umfasst hunderte Bäume der einheimischen Sorte Bidni.","Das Öl wird durch Kaltpressung unmittelbar nach der Ernte gewonnen."]},"agriculture-mgarr-strawberry-fields-extra":{"i":"/poi-images/agriculture-mgarr-strawberry-fields-extra.webp","s":"Die Gegend um Mgarr ist berühmt für ihre Erdbeerfarmen, besonders während des jährlichen Erdbeerfestes.","f":["Die Hauptsaison für maltesische Erdbeeren ist im April.","Das Festival 'Festa Frawli' zieht jährlich tausende Besucher nach Mgarr."]},"agriculture-bahrija-farms-extra":{"i":"/poi-images/agriculture-bahrija-farms-extra.webp","s":"Eine ländliche Gegend mit vielen kleinen Bauernhöfen, die traditionelle Landwirtschaft betreiben.","f":["Die Region Bahrija ist eines der fruchtbarsten Gebiete der Insel.","Hier werden vor allem Tomaten, Melonen und Zitrusfrüchte angebaut."]},"agriculture-emmanuel-delicata-winemaker-extra":{"i":"/poi-images/agriculture-emmanuel-delicata-winemaker-extra.webp","s":"Ein weiterer führender Weinhersteller Maltas mit einer langen Geschichte, der Weinfeste veranstaltet.","f":["Das Weingut befindet sich in der vierten Generation im Familienbesitz.","Delicata hat über 100 internationale Weinpreise gewonnen."]},"agriculture-farmer-s-deli-bistro-extra":{"i":"/poi-images/agriculture-farmer-s-deli-bistro-extra.webp","s":"Ein Restaurant und Geschäft, das sich auf die Verwendung lokaler und biologischer Produkte konzentriert.","f":["Das Bistro verwendet zu 100% biologisch zertifizierte Zutaten.","Es befindet sich auf dem Gelände einer historischen Villa in Malta."]},"agriculture-gozo-artisan-network-extra":{"i":"/poi-images/agriculture-gozo-artisan-network-extra.webp","s":"Eine Initiative, die lokale Handwerker und Lebensmittelproduzenten auf Gozo fördert.","f":["Das Netzwerk umfasst Käsehersteller, Weber und Imker.","Ziel ist die Vermarktung traditioneller Produkte ohne Zwischenhändler."]},"agriculture-sammy-s-strawberry-farm-extra":{"i":"/poi-images/agriculture-sammy-s-strawberry-farm-extra.webp","s":"Eine bekannte Farm in Mgarr, auf der Besucher ihre eigenen Erdbeeren pflücken können.","f":["Saisonaler Betrieb von Februar bis Mai","Liegt in der landwirtschaftlichen Zone von Mġarr"]},"agriculture-citrus-groves-of-san-anton-extra":{"i":"/poi-images/agriculture-citrus-groves-of-san-anton-extra.webp","s":"Die Gärten des San Anton Palace sind berühmt für ihre alten Zitrusbäume.","f":["Die Haine gehören zum Palastgarten des maltesischen Präsidenten.","Einige Orangenbäume stammen noch aus der Zeit der Johanniter."]},"agriculture-xwejni-salt-pans-gozo-extra":{"i":"/poi-images/agriculture-xwejni-salt-pans-gozo-extra.webp","s":"Traditionelle Salzpfannen, in denen seit Jahrhunderten Meersalz von Hand geerntet wird.","f":["In den Kalkstein gehauene Becken an der Küste","Salzernte findet während der Sommermonate statt"]},"agriculture-melita-honey-extra":{"i":"/poi-images/agriculture-melita-honey-extra.webp","s":"Produzenten von maltesischem Honig, der für seinen einzigartigen Geschmack bekannt ist, der von der lokalen Flora herrührt.","f":["Der Honig wird oft aus Thymian, Johannisbrot und Wildblumen gewonnen.","Die Produktion erfolgt nach strengen traditionellen Methoden."]},"agriculture-lord- chambray-brewery-gozo-extra":{"i":"/poi-images/agriculture-lord- chambray-brewery-gozo-extra.webp","s":"Die erste Handwerksbrauerei auf Gozo, die eine Reihe von Bieren mit lokalen Einflüssen herstellt.","f":["Lord Chambray wurde 2014 als erste Craft-Brauerei Maltas gegründet.","Die Brauerei befindet sich im Industriegebiet von Xewkija auf Gozo."]},"agriculture-kunserva-factory-gozo-extra":{"i":"/poi-images/agriculture-kunserva-factory-gozo-extra.webp","s":"Ein Hauptproduzent von 'Kunserva', einer traditionellen maltesischen Tomatenpaste.","f":["Kunserva ist ein traditionelles maltesisches Tomatenmark mit Zucker.","Die Fabrik wird von der bekannten Magro-Familie betrieben."]},"agriculture-olive-oil-tasting-malta-extra":{"i":"/poi-images/agriculture-olive-oil-tasting-malta-extra.webp","s":"Mehrere Farmen bieten Verkostungen ihres lokal produzierten Olivenöls an.","f":["Die Sorte 'Bidni' ist eine endemische Olive, die nur auf Malta wächst.","Verkostungen finden oft direkt in den Olivenhainen statt."]},"agriculture-rural-herita-ge-trail-dingli-extra":{"i":"/poi-images/agriculture-rural-herita-ge-trail-dingli-extra.webp","s":"Ein Wanderweg, der an traditionellen Bauernhöfen und landwirtschaftlichen Landschaften vorbeiführt.","f":["Der Pfad bietet Panoramablicke aus 250 Metern Höhe über dem Meer.","Er verbindet historische Kapellen mit traditionellen Bauernhöfen."]},"agriculture-the-vegetable-patch-extra":{"i":"/poi-images/agriculture-the-vegetable-patch-extra.webp","s":"Ein Bauernhof, der sich auf den Anbau von einer Vielzahl von Gemüse spezialisiert hat.","f":["Fokus auf pestizidfreien Anbau von Nutzpflanzen","Liefert wöchentliche Gemüsekisten an Abonnenten"]},"agriculture-fig-trees-in-xaghra-gozo-extra":{"i":"/poi-images/agriculture-fig-trees-in-xaghra-gozo-extra.webp","s":"Die Gegend um Xaghra ist bekannt für ihre Feigenbäume und die Produktion von Feigenprodukten.","f":["Xaghra gilt als eines der fruchtbarsten Gebiete auf der Insel Gozo.","Es werden sowohl grüne als auch violette Feigensorten angebaut."]},"agriculture-caper-bushes-of-gozo-extra":{"i":"/poi-images/agriculture-caper-bushes-of-gozo-extra.webp","s":"Gozo ist bekannt für seine wild wachsenden Kapernsträucher, deren Knospen geerntet und konserviert werden.","f":["Kapernsträucher wachsen oft direkt aus historischen Trockenmauern.","Die Blütenknospen werden im Frühsommer mühsam von Hand geerntet."]},"agriculture-bee-keeping-experience-extra":{"i":"/poi-images/agriculture-bee-keeping-experience-extra.webp","s":"Mehrere Imker bieten Führungen an, bei denen Besucher mehr über die Honigproduktion erfahren können.","f":["Malta wurde von den Griechen Melite genannt, was Honig bedeutet.","Die maltesische Biene ist eine einzigartige, endemische Unterart."]},"agriculture-bacchus-winery-extra":{"i":"/poi-images/agriculture-bacchus-winery-extra.webp","s":"Ein Restaurant und Veranstaltungsort in Mdina mit einem historischen Weinkeller.","f":["Das Weingut verwendet ausschließlich lokal angebaute Traubensorten.","Die Kelleranlagen befinden sich teilweise in historischen Gewölben."]},"agriculture-potato-farms-qrendi-extra":{"i":"/poi-images/agriculture-potato-farms-qrendi-extra.webp","s":"Die Region um Qrendi ist einer der Hauptproduzenten von Kartoffeln in Malta, die auch exportiert werden.","f":["Qrendi-Kartoffeln werden oft zweimal im Jahr geerntet.","Die Ernte erfolgt meist noch traditionell in Handarbeit."]},"agriculture-mgarr-local-council-farmers-market-extra":{"i":"/poi-images/agriculture-mgarr-local-council-farmers-market-extra.webp","s":"Ein kleinerer, lokaler Markt, der frische landwirtschaftliche Produkte aus der Region anbietet.","f":["Der Markt findet regelmäßig auf dem Hauptplatz von Mgarr statt.","Hier werden saisonale Spezialitäten wie Erdbeeren und Melonen verkauft."]},"industry-playmobil-factory-extra":{"i":"/poi-images/industry-playmobil-factory-extra.webp","s":"Eine der größten Produktionsstätten für Playmobil-Spielzeug weltweit.","f":["Produktion von Millionen Figuren pro Jahr auf Malta.","Verfügt über einen eigenen 'FunPark' für Besucher."]},"industry-farsons-brewery-extra":{"i":"/poi-images/industry-farsons-brewery-extra.webp","s":"Der größte Getränkehersteller Maltas, Produzent von Cisk Lager und Kinnie.","f":["Gründung des Unternehmens Simonds Farsons Cisk im Jahr 1928.","Das Art-déco-Hauptgebäude gilt als architektonisches Erbe."]},"industry-malta-freeport-extra":{"i":"/poi-images/industry-malta-freeport-extra.webp","s":"Einer der wichtigsten Transshipment-Hubs im Mittelmeer.","f":["Umschlagkapazität von über 3 Millionen Containern pro Jahr.","Kann die größten Containerschiffe der Welt (Ultra Large) abfertigen."]},"industry-rinella-film-studios-extra":{"i":"/poi-images/industry-rinella-film-studios-extra.webp","s":"Ein Filmstudio mit Wassertanks, das für viele internationale Filmproduktionen genutzt wird.","f":["Standort der größten Wassertanks für Filmdrehs weltweit.","Drehort für Klassiker wie 'Gladiator' und 'Troja'."]},"industry-bulebel-industrial-estate-extra":{"i":"/poi-images/industry-bulebel-industrial-estate-extra.webp","s":"Eines der größten Industriegebiete in Malta, Heimat vieler Fabriken und Unternehmen.","f":["Günstig gelegen zwischen Valletta und Marsaxlokk","Bietet Arbeitsplätze für Tausende von Menschen"]},"industry-hal-far-industrial-estate-extra":{"i":"/poi-images/industry-hal-far-industrial-estate-extra.webp","s":"Ein weiteres großes Industriegebiet in der Nähe des Flughafens.","f":["Ehemals Standort eines Militärflugplatzes der Royal Air Force.","Beherbergt große Pharmaunternehmen wie Actavis und Medichem."]},"industry-mosta-technopark-extra":{"i":"/poi-images/industry-mosta-technopark-extra.webp","s":"Ein Industriepark, der sich auf Technologie- und Wissensunternehmen konzentriert.","f":["Fokus auf Elektronikmontage und Medizintechnik.","Architektonisch ansprechend gestaltete Industriegebäude."]},"industry-lufthansa-technik-malta-extra":{"i":"/poi-images/industry-lufthansa-technik-malta-extra.webp","s":"Ein wichtiger Standort für die Wartung, Reparatur und Überholung von Flugzeugen.","f":["Verfügt über sechs Hangars für die gleichzeitige Wartung.","Spezialisiert auf C-Checks und große Flugzeugüberholungen."]},"industry-xewkija-industrial-estate-gozo-extra":{"i":"/poi-images/industry-xewkija-industrial-estate-gozo-extra.webp","s":"Das wichtigste Industriegebiet auf der Insel Gozo.","f":["Einziges größeres Industriegebiet auf der Insel Gozo.","Fokus auf Lebensmittelverarbeitung und Textilherstellung."]},"industry-delimara-power-station-extra":{"i":"/poi-images/industry-delimara-power-station-extra.webp","s":"Das Hauptkraftwerk Maltas, das einen Großteil des Stroms der Insel erzeugt.","f":["Inbetriebnahme der ersten Phase im Jahr 1992.","Umstellung auf Flüssigerdgas (LNG) zur Emissionsreduzierung."]},"industry-water-services-corporation-pembroke-extra":{"i":"/poi-images/industry-water-services-corporation-pembroke-extra.webp","s":"Eine große Umkehrosmoseanlage, die Meerwasser in Trinkwasser umwandelt.","f":["Produziert einen Großteil des maltesischen Leitungswassers.","Nutzt modernste Filtermembranen für die Entsalzung."]},"industry-malta-shipyards-site-extra":{"i":"/poi-images/industry-malta-shipyards-site-extra.webp","s":"Die historischen Werften im Grand Harbour, die heute für Schiffsreparaturen genutzt werden.","f":["Verfügt über einige der größten Trockendocks im Mittelmeer.","Ehemals strategische Werft der britischen Royal Navy."]},"industry-smartcity-malta-extra":{"i":"/poi-images/industry-smartcity-malta-extra.webp","s":"Ein Technologiepark, der als Zentrum für IKT- und Medienunternehmen konzipiert ist.","f":["Inspiriert vom Konzept der SmartCity Dubai.","Beherbergt eine spektakuläre Lagune mit Wasserspielen."]},"industry-kirkop-industrial-area-extra":{"i":"/poi-images/industry-kirkop-industrial-area-extra.webp","s":"Ein Industriegebiet, in dem sich die Fabrik von STMicroelectronics befindet.","f":["Standort der riesigen STMicroelectronics-Fabrik.","Spezialisierung auf die Montage von Mikrochips."]},"industry-stmicroelectronics-malta-ltd-extra":{"i":"/poi-images/industry-stmicroelectronics-malta-ltd-extra.webp","s":"Ein wichtiger Hersteller von Halbleitern und ein bedeutender Exporteur für Malta.","f":["Produktion von Chips für Smartphones und Autos.","Rund um die Uhr laufende Fertigung in Reinräumen."]},"industry-quarrying-industry-siggiewi-extra":{"i":"/poi-images/industry-quarrying-industry-siggiewi-extra.webp","s":"Die Gegend um Siggiewi und Qrendi ist das Zentrum der maltesischen Steinbruchindustrie für Kalkstein.","f":["Abbau von weichem Kalkstein für Fassaden und Gebäude.","Prägt die Landschaft durch terrassenförmige Gruben."]},"industry-malta-dairy-products-extra":{"i":"/poi-images/industry-malta-dairy-products-extra.webp","s":"Der Hauptproduzent von Milch und Milchprodukten in Malta, bekannt für die Marke Benna.","f":["Verarbeitung von 100% frischer maltesischer Kuhmilch.","Produktion des traditionellen maltesischen Gbejna-Käses."]},"industry-foster-clark-products-ltd-extra":{"i":"/poi-images/industry-foster-clark-products-ltd-extra.webp","s":"Ein Lebensmittel- und Getränkeunternehmen, das eine breite Palette von Produkten für den Export herstellt.","f":["Export von über 90% der Produktion in den Nahen Osten und Afrika.","Sitz im San Gwann Industriegebiet mit modernen Labors."]},"industry-toly-products-extra":{"i":"/poi-images/industry-toly-products-extra.webp","s":"Ein führender Hersteller von Luxusverpackungen für die Kosmetikindustrie.","f":["Produktion von Verpackungen für Marken wie Chanel und Dior.","Standort eines hochmodernen Innovationszentrums in Malta."]},"industry-actavis-factory-extra":{"i":"/poi-images/industry-actavis-factory-extra.webp","s":"Ein großes Pharmaunternehmen, das generische Arzneimittel herstellt.","f":["Spezialisiert auf feste orale Darreichungsformen","Exportiert in über 60 Länder weltweit"]},"industry-methode-electronics-malta-ltd-extra":{"i":"/poi-images/industry-methode-electronics-malta-ltd-extra.webp","s":"Ein Hersteller von elektronischen Komponenten, hauptsächlich für die Automobilindustrie.","f":["Spezialisiert auf Sensoren und Schalter für Premiumfahrzeuge.","Standort im Mriehel Industriegebiet mit moderner Fertigung."]},"industry-gaming-industry-hub-sliema-st-julians-extra":{"i":"/poi-images/industry-gaming-industry-hub-sliema-st-julians-extra.webp","s":"Das Gebiet ist ein Zentrum für die Online-Gaming-Industrie, eine wichtige Säule der maltesischen Wirtschaft.","f":["Malta war 2004 das erste EU-Land mit iGaming-Gesetzen.","Der Sektor trägt rund 12 bis 13 Prozent zum maltesischen BIP bei."]},"industry-construction-industry-cranes-extra":{"i":"/poi-images/industry-construction-industry-cranes-extra.webp","s":"Die Skyline ist von Baukränen geprägt, was die boomende Bauindustrie auf der Insel widerspiegelt.","f":["Einsatz von Hochleistungs-Turmdrehkranen in Stadtgebieten.","Strenge Sicherheitsvorschriften aufgrund starker Winde."]},"industry-go-p-l-c-head-office-extra":{"i":"/poi-images/industry-go-p-l-c-head-office-extra.webp","s":"Der Hauptsitz des führenden Telekommunikationsanbieters in Malta.","f":["Größter Anbieter von Quad-Play-Diensten auf den Inseln.","Betreibt ein umfangreiches Glasfasernetz in ganz Malta."]},"industry-dedomenico-group-extra":{"i":"/poi-images/industry-dedomenico-group-extra.webp","s":"Ein diversifiziertes Unternehmen, das in den Bereichen Elektronik, Hotelgewerbe und Immobilien tätig ist.","f":["Gründung als Familienbetrieb vor mehreren Jahrzehnten.","Eigentümer von bedeutenden Lagerkomplexen in Marsa."]},"industry-maltapost-head-office-extra":{"i":"/poi-images/industry-maltapost-head-office-extra.webp","s":"Das zentrale Sortierzentrum und der Hauptsitz des nationalen Postdienstes.","f":["Zentrale Sortieranlage für alle Briefe und Pakete der Insel.","Betrieb eines eigenen Postmuseums in der Nähe."]},"industry-medserv-plc-base-extra":{"i":"/poi-images/industry-medserv-plc-base-extra.webp","s":"Ein Unternehmen, das Logistik- und Ingenieurdienstleistungen für die Offshore-Öl- und Gasindustrie anbietet.","f":["Medserv wurde 1974 gegründet, um die Öl- und Gasindustrie zu unterstützen.","Das Unternehmen ist seit 2006 an der Malta Stock Exchange gelistet."]},"industry-concrete-batching-plants-extra":{"i":"/poi-images/industry-concrete-batching-plants-extra.webp","s":"Mehrere Anlagen auf der ganzen Insel produzieren Beton für die Bauindustrie.","f":["Produktion von verschiedenen Betonfestigkeitsklassen.","Einsatz von computergesteuerten Mischprozessen."]},"industry-printing-presses-extra":{"i":"/poi-images/industry-printing-presses-extra.webp","s":"Malta hat eine etablierte Druckindustrie, die Bücher, Zeitungen und Verpackungen herstellt.","f":["Die erste Druckpresse wurde 1642 in Malta eingeführt.","Progress Press wurde 1921 als Teil der Allied Group gegründet."]},"industry-maghtab-waste-management-complex-extra":{"i":"/poi-images/industry-maghtab-waste-management-complex-extra.webp","s":"Die wichtigste Abfallentsorgungsanlage Maltas, die derzeit saniert wird.","f":["Verwandlung einer ehemaligen Deponie in einen Ökopark.","Betrieb einer modernen Anlage zur mechanisch-biologischen Behandlung."]},"port-grand-harbour-valletta-extra":{"i":"/poi-images/port-grand-harbour-valletta-extra.webp","s":"Maltas wichtigster Hafen, ein natürlicher Tiefwasserhafen, der von Kreuzfahrtschiffen und für Fracht genutzt wird.","f":["Der Hafen wurde bereits von den Phöniziern vor über 3.000 Jahren genutzt.","Das Becken hat eine Fläche von etwa 2 Quadratkilometern."]},"port-marsamxett-harbour-extra":{"i":"/poi-images/port-marsamxett-harbour-extra.webp","s":"Der zweite große Naturhafen, der hauptsächlich von Yachten und Freizeitbooten genutzt wird.","f":["Er beherbergt die Insel Manoel in seiner Mitte.","Fähren verbinden hier Valletta mit Sliema."]},"port-malta-freeport-birzebbuga-extra":{"i":"/poi-images/port-malta-freeport-birzebbuga-extra.webp","s":"Ein wichtiger Container-Umschlaghafen im Mittelmeer.","f":["Gegründet wurde der Freihafen im Jahr 1988.","Er verfügt über zwei große Containerterminals."]},"port-mgarr-harbour-gozo-extra":{"i":"/poi-images/port-mgarr-harbour-gozo-extra.webp","s":"Der Haupthafen von Gozo, der die Insel mit Malta durch eine Fährverbindung verbindet.","f":["Über dem Hafen thront die Lourdes-Kirche.","Das Fort Chambray liegt auf den Klippen darüber."]},"port-cirkewwa-ferry-terminal-extra":{"i":"/poi-images/port-cirkewwa-ferry-terminal-extra.webp","s":"Das Fährterminal am nördlichsten Punkt Maltas für Verbindungen nach Gozo.","f":["Der Hafen liegt am Cirkewwa Point.","Die Überfahrt nach Mgarr dauert etwa 25 Minuten."]},"port-valletta-waterfront-extra":{"i":"/poi-images/port-valletta-waterfront-extra.webp","s":"Der Kreuzfahrtterminal und ein Bereich mit Restaurants und Geschäften in historischen Lagerhäusern.","f":["Besteht aus 19 historischen Barock-Lagerhäusern.","Erbaut im Jahr 1752 unter Großmeister Manuel Pinto."]},"port-msida-marina-extra":{"i":"/poi-images/port-msida-marina-extra.webp","s":"Ein großer Jachthafen im Marsamxett Harbour für Freizeitboote.","f":["Der Hafen bietet über 200 Ganzjahres-Liegeplätze.","Die markante Msida-Kirche liegt direkt am Wasser."]},"port-portomaso-marina-st-julians-extra":{"i":"/poi-images/port-portomaso-marina-st-julians-extra.webp","s":"Ein luxuriöser Jachthafen als Teil des Portomaso-Komplexes.","f":["Der Hafen hat drei miteinander verbundene Becken.","Er wurde mit dem 'Award of Excellence' ausgezeichnet."]},"port-manoel-island-yacht-marina-extra":{"i":"/poi-images/port-manoel-island-yacht-marina-extra.webp","s":"Ein großer Jachthafen und Werft auf Manoel Island.","f":["Der Hafen liegt direkt neben dem historischen Fort Manoel.","Es kön const svg=document.getElementById('svg'),stage=document.getElementById('stage');

function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;

svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});

function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
