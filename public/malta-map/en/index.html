d fountains in Malta."]},"industry-kirkop-industrial-area-extra":{"i":"/poi-images/industry-kirkop-industrial-area-extra.webp","s":"An industrial area hosting the STMicroelectronics factory.","f":["Main base for STMicroelectronics, a global tech giant.","Focuses on high-volume semiconductor assembly and testing."]},"industry-stmicroelectronics-malta-ltd-extra":{"i":"/poi-images/industry-stmicroelectronics-malta-ltd-extra.webp","s":"A major manufacturer of semiconductors and a significant exporter for Malta.","f":["Key player in the global supply chain for electronics.","Operates high-precision robotic assembly lines 24/7."]},"industry-quarrying-industry-siggiewi-extra":{"i":"/poi-images/industry-quarrying-industry-siggiewi-extra.webp","s":"The area around Siggiewi and Qrendi is the center of Malta's limestone quarrying industry.","f":["Produces the soft honey-colored stone seen in Valletta.","Quarries are often repurposed as parks or industrial sites."]},"industry-malta-dairy-products-extra":{"i":"/poi-images/industry-malta-dairy-products-extra.webp","s":"The main producer of milk and dairy products in Malta, known for the Benna brand.","f":["Exclusively uses milk from local Maltese dairy farms.","Known for its unique variety of flavored milk drinks."]},"industry-foster-clark-products-ltd-extra":{"i":"/poi-images/industry-foster-clark-products-ltd-extra.webp","s":"A food and beverage company that produces a wide range of products for export.","f":["Export-oriented company focusing on emerging markets.","Produces wide ranges of jellies, custards, and juices."]},"industry-toly-products-extra":{"i":"/poi-images/industry-toly-products-extra.webp","s":"A leading manufacturer of luxury packaging for the cosmetics industry.","f":["Supplies high-end brands like Estée Lauder and L'Oréal.","Recently opened a massive new factory in Zejtun."]},"industry-actavis-factory-extra":{"i":"/poi-images/industry-actavis-factory-extra.webp","s":"A large pharmaceutical company that manufactures generic medicines.","f":["Operates under Teva Pharmaceutical Industries","Features state-of-the-art automated packaging lines"]},"industry-methode-electronics-malta-ltd-extra":{"i":"/poi-images/industry-methode-electronics-malta-ltd-extra.webp","s":"A manufacturer of electronic components, mainly for the automotive industry.","f":["Designs and manufactures sophisticated interior switches.","One of Malta's largest private sector industrial employers."]},"industry-gaming-industry-hub-sliema-st-julians-extra":{"i":"/poi-images/industry-gaming-industry-hub-sliema-st-julians-extra.webp","s":"The area is a hub for the online gaming industry, a major pillar of the Maltese economy.","f":["Malta was the first EU state to regulate remote gaming in 2004.","The sector contributes approximately 12-13% to Malta's GDP."]},"industry-construction-industry-cranes-extra":{"i":"/poi-images/industry-construction-industry-cranes-extra.webp","s":"The skyline is dominated by construction cranes, reflecting the booming construction industry on the island.","f":["High concentration of luffing jib cranes in narrow streets.","Cranes are essential for constructing luxury high-rise towers."]},"industry-go-p-l-c-head-office-extra":{"i":"/poi-images/industry-go-p-l-c-head-office-extra.webp","s":"The head office of the leading telecommunications provider in Malta.","f":["First Maltese operator to offer nationwide 5G coverage.","Manages critical submarine fiber optic links to Italy."]},"industry-dedomenico-group-extra":{"i":"/poi-images/industry-dedomenico-group-extra.webp","s":"A diversified company involved in electronics, hospitality, and real estate.","f":["Operates as a diversified conglomerate in the local market.","Focuses on high-quality commercial property development."]},"industry-maltapost-head-office-extra":{"i":"/poi-images/industry-maltapost-head-office-extra.webp","s":"The central sorting hub and head office for the national postal service.","f":["Manages the collection and delivery for all postcodes.","Operates a dedicated fleet of electric delivery vehicles."]},"industry-medserv-plc-base-extra":{"i":"/poi-images/industry-medserv-plc-base-extra.webp","s":"A company providing logistics and engineering services to the offshore oil and gas industry.","f":["Medserv was founded in 1974 to support the oil and gas industry.","The company has been listed on the Malta Stock Exchange since 2006."]},"industry-concrete-batching-plants-extra":{"i":"/poi-images/industry-concrete-batching-plants-extra.webp","s":"Several plants across the island produce concrete for the construction industry.","f":["Supplies ready-mix concrete to major construction sites.","Operates high-capacity twin-shaft mixers for efficiency."]},"industry-printing-presses-extra":{"i":"/poi-images/industry-printing-presses-extra.webp","s":"Malta has an established printing industry, producing books, newspapers and packaging.","f":["The first printing press was introduced to Malta in 1642.","Progress Press was established in 1921 as part of the Allied Group."]},"industry-maghtab-waste-management-complex-extra":{"i":"/poi-images/industry-maghtab-waste-management-complex-extra.webp","s":"Malta's main waste management facility, currently undergoing rehabilitation.","f":["Features a Mechanical Biological Treatment (MBT) plant.","Aims to convert non-recyclable waste into energy."]},"port-grand-harbour-valletta-extra":{"i":"/poi-images/port-grand-harbour-valletta-extra.webp","s":"Malta's main port, a natural deep-water harbour used by cruise liners and for cargo.","f":["The harbor was utilized by the Phoenicians over 3,000 years ago.","The total area of the harbor basin is approximately 2 square kilometers."]},"port-marsamxett-harbour-extra":{"i":"/poi-images/port-marsamxett-harbour-extra.webp","s":"The second major natural harbour, mainly used by yachts and leisure craft.","f":["The harbour contains the small Manoel Island.","A regular ferry crosses between Valletta and Sliema."]},"port-malta-freeport-birzebbuga-extra":{"i":"/poi-images/port-malta-freeport-birzebbuga-extra.webp","s":"A major container transshipment port in the Mediterranean.","f":["It is the first freeport in the Mediterranean.","The facility handles over 3 million TEUs annually."]},"port-mgarr-harbour-gozo-extra":{"i":"/poi-images/port-mgarr-harbour-gozo-extra.webp","s":"Gozo's main harbour, connecting the island to Malta via a ferry service.","f":["The harbour is overlooked by Fort Chambray.","It is the arrival point for the main car ferry."]},"port-cirkewwa-ferry-terminal-extra":{"i":"/poi-images/port-cirkewwa-ferry-terminal-extra.webp","s":"The ferry terminal on the northernmost point of Malta for services to Gozo.","f":["It is the main gateway for traffic to Gozo.","The ferry service operates 24 hours a day."]},"port-valletta-waterfront-extra":{"i":"/poi-images/port-valletta-waterfront-extra.webp","s":"The cruise liner terminal and an area of restaurants and shops in historic warehouses.","f":["Features 19 historic warehouses with iconic colored doors.","Built in 1752 during the reign of Grand Master Pinto."]},"port-msida-marina-extra":{"i":"/poi-images/port-msida-marina-extra.webp","s":"A large marina in Marsamxett Harbour for leisure boats.","f":["The marina accommodates up to 230 yachts.","It is famous for being sheltered from the Gregale wind."]},"port-portomaso-marina-st-julians-extra":{"i":"/poi-images/port-portomaso-marina-st-julians-extra.webp","s":"A luxury marina as part of the Portomaso complex.","f":["It consists of three interconnected basins.","The Hilton Malta hotel overlooks the marina."]},"port-manoel-island-yacht-marina-extra":{"i":"/poi-images/port-manoel-island-yacht-marina-extra.webp","s":"A large yacht marina and yard on Manoel Island.","f":["It offers berths for over 200 vessels.","The marina is adjacent to the 18th-century fort."]},"port-marsaxlokk-harbour-fishing-village-extra":{"i":"/poi-images/port-marsaxlokk-harbour-fishing-village-extra.webp","s":"Famous for its colourful fishing boats called 'Luzzu'.","f":["Traditional boats feature the Eye of Osiris.","It is the second largest natural harbour in Malta."]},"port-sliema-ferry-service-extra":{"i":"/poi-images/port-sliema-ferry-service-extra.webp","s":"A passenger ferry service connecting Sliema to Valletta.","f":["The ferry runs approximately every half hour.","A single trip takes around 10 to 12 minutes."]},"port-three-cities-ferry-service-extra":{"i":"/poi-images/port-three-cities-ferry-service-extra.webp","s":"A ferry service connecting Valletta to the Three Cities (Birgu, Senglea).","f":["The ferry docks at Cospicua (Bormla).","It passes right by the massive Fort St. Angelo."]},"port-bugibba-jetty-for-boat-trips-extra":{"i":"/poi-images/port-bugibba-jetty-for-boat-trips-extra.webp","s":"A major departure point for tourist boats to Comino and Gozo.","f":["Numerous excursion boats and ferries depart from here daily.","The jetty is in the heart of the St. Paul's Bay tourist area."]},"port-st-thomas-bay-extra":{"i":"/poi-images/port-st-thomas-bay-extra.webp","s":"A bay in Marsaskala used by small fishing and leisure boats.","f":["It is a top spot for local windsurfers.","The bay is named after a chapel that stood nearby."]},"port-xlendi-bay-gozo-extra":{"i":"/poi-images/port-xlendi-bay-gozo-extra.webp","s":"A picturesque inlet used by small boats and a popular spot for diving.","f":["The Xlendi Tower dates back to 1650.","A scenic stone staircase leads up the cliffs."]},"port-wied-iz-zurrieq-boat-trips-to-blue-grotto-extra":{"i":"/poi-images/port-wied-iz-zurrieq-boat-trips-to-blue-grotto-extra.webp","s":"A small harbour from where boats depart to the famous Blue Grotto.","f":["Small boats carry up to 8 passengers each.","The tour visits a complex of seven sea caves."]},"port-ghadira-bay-boat-rentals-extra":{"i":"/poi-images/port-ghadira-bay-boat-rentals-extra.webp","s":"Various watercraft are available for rent at the popular Mellieha beach.","f":["Mellieha Bay is another name for this location.","Speedboats can be rented for half or full days."]},"port-dwejra-inland-sea-boat-trips-gozo-extra":{"i":"/poi-images/port-dwejra-inland-sea-boat-trips-gozo-extra.webp","s":"Small boats pass through a tunnel in the cliff from the Inland Sea to the open sea.","f":["The natural rock tunnel is approximately 80 meters in length.","Fungus Rock (Il-Ġebla tal-Ġeneral) stands 60 meters above sea level."]},"port-blue-lagoon-ferry-point-comino-extra":{"i":"/poi-images/port-blue-lagoon-ferry-point-comino-extra.webp","s":"The main drop-off point for ferries and tourist boats bringing visitors to the Blue Lagoon.","f":["Comino covers a total land area of just 3.5 square kilometers.","St. Mary’s Tower was completed by the Knights in 1618."]},"port-kalanka-bay-extra":{"i":"/poi-images/port-kalanka-bay-extra.webp","s":"A secluded bay used by locals and small boats.","f":["It is located at the tip of Delimara Point.","The bay is characterized by flat limestone rocks."]},"port-spinola-bay-st-julians-extra":{"i":"/poi-images/port-spinola-bay-st-julians-extra.webp","s":"A picturesque bay with traditional fishing boats alongside modern restaurants.","f":["The 'Love' monument is located on the quay.","It is one of the last fishing hubs in the area."]},"port-hay-wharf-floriana-extra":{"i":"/poi-images/port-hay-wharf-floriana-extra.webp","s":"The base for the Maritime Squadron of the Armed Forces of Malta.","f":["The base is operated by the Armed Forces of Malta.","It is located within the Marsamxett Harbour."]},"port-kalkara-marina-extra":{"i":"/poi-images/port-kalkara-marina-extra.webp","s":"A marina located in Kalkara Creek within the Grand Harbour.","f":["The marina can accommodate yachts up to 30 meters.","It is overlooked by the historic Fort Ricasoli."]},"port-san-giljan-waterpolo-club-extra":{"i":"/poi-images/port-san-giljan-waterpolo-club-extra.webp","s":"A waterpolo club with a seawater pool and mooring facilities.","f":["The club was established in 1949.","It is one of Malta's top-tier water polo teams."]},"port-anchor-bay-extra":{"i":"/poi-images/port-anchor-bay-extra.webp","s":"The bay where Popeye Village is located, also used as an anchorage.","f":["The bay is located on the northwest coast near Mellieha.","The film set was built for the 1980 musical production."]},"port-marsalforn-bay-gozo-extra":{"i":"/poi-images/port-marsalforn-bay-gozo-extra.webp","s":"A popular resort town with a small harbour for fishing boats.","f":["It is a popular hub for scuba diving centers.","The waterfront promenade is closed to traffic in summer."]},"port-ta-xbiex-marina-extra":{"i":"/poi-images/port-ta-xbiex-marina-extra.webp","s":"One of the largest marinas in Malta, with many foreign embassies nearby.","f":["Home to the Royal Malta Yacht Club.","Many embassies are located in the seafront villas."]},"port-st-georges-bay-boat-charters-extra":{"i":"/poi-images/port-st-georges-bay-boat-charters-extra.webp","s":"Several boat rental and charter companies operate from this bay in St.","f":["Boats can be hired for events and parties.","It is located in the heart of the nightlife district."]},"port-hondoq-ir-rummien-gozo-extra":{"i":"/poi-images/port-hondoq-ir-rummien-gozo-extra.webp","s":"A small bay with a jetty formerly used for transporting stone blocks.","f":["The bay faces the island of Comino.","It features a small white sand and pebble beach."]},"port-lascaris-wharf-valletta-extra":{"i":"/poi-images/port-lascaris-wharf-valletta-extra.webp","s":"A part of the Grand Harbour, near the Upper Barrakka Gardens.","f":["Named after Grand Master Lascaris.","The Barrakka Lift connects the wharf to the city center."]},"landscape-dingli-cliffs-extra":{"i":"/poi-images/landscape-dingli-cliffs-extra.webp","s":"The highest point in Malta, offering breathtaking views of the open sea.","f":["Named after the architect Tommaso Dingli or the village nearby.","Features the 17th-century chapel of St. Mary Magdalene."]},"landscape-blue-grotto-extra":{"i":"/poi-images/landscape-blue-grotto-extra.webp","s":"A complex of seven sea caves famous for the brilliant blue water.","f":["The main arch stands approximately 30 meters tall.","Unique water colors are caused by light reflecting off white sand."]},"landscape-ghajn-tuffieha-bay-extra":{"i":"/poi-images/landscape-ghajn-tuffieha-bay-extra.webp","s":"A beautiful sandy beach surrounded by clay slopes and cliffs.","f":["Access requires descending (and ascending) over 200 steps.","Overlooked by a coastal watchtower built in 1637."]},"landscape-golden-bay-extra":{"i":"/poi-images/landscape-golden-bay-extra.webp","s":"One of Malta's most popular sandy beaches.","f":["One of the few large sandy beaches on the main island.","Equipped with diverse water sports and dining options."]},"landscape-ramla-bay-gozo-extra":{"i":"/poi-images/landscape-ramla-bay-gozo-extra.webp","s":"A large beach on Gozo, famous for its unique reddish sand.","f":["Known as 'Ramla l-Ħamra' which means 'Red Sands'.","Features a prominent white statue of Mary built in 1881."]},"landscape-dwejra-bay-and-fungus-rock-gozo-extra":{"i":"/poi-images/landscape-dwejra-bay-and-fungus-rock-gozo-extra.webp","s":"A dramatic coastal formation featuring the Inland Sea and Fungus Rock.","f":["Fungus Rock was strictly protected by the Knights of Malta.","Named after a rare parasitic plant valued for medicinal properties."]},"landscape-blue-lagoon-comino-extra":{"i":"/poi-images/landscape-blue-lagoon-comino-extra.webp","s":"Famous for its crystal clear, turquoise water.","f":["Situated between the islands of Comino and Cominotto.","The shallow water is perfect for swimming and snorkeling."]},"landscape-st-peters-pool-extra":{"i":"/poi-images/landscape-st-peters-pool-extra.webp","s":"A natural rock pool popular with cliff divers.","f":["Flat limestone surfaces provide natural sunbathing spots.","A top location for cliff jumping and snorkeling."]},"landscape-wied-il-ghasri-gozo-extra":{"i":"/poi-images/landscape-wied-il-ghasri-gozo-extra.webp","s":"A secluded inlet cut like a fjord between high cliffs.","f":["The sea inlet stretches approximately 300 meters into the valley.","Traditional salt pans are located on the cliffs near the entrance."]},"landscape-tal-mixta-cave-gozo-extra":{"i":"/poi-images/landscape-tal-mixta-cave-gozo-extra.webp","s":"A cave overlooking Ramla Bay, providing a famous photo spot.","f":["The cave is privately owned but open to respectful visitors.","Historically used by farmers as a shelter for livestock."]},"landscape-buskett-gardens-woodland-extra":{"i":"/poi-images/landscape-buskett-gardens-woodland-extra.webp","s":"One of Malta's few woodland areas, originally planted as a hunting ground by the Knights.","f":["Buskett was originally planted by the Knights in the 16th century.","Verdala Palace was completed in 1586 as a hunting lodge."]},"landscape-chadwick-lakes-freshwater-extra":{"i":"/poi-images/landscape-chadwick-lakes-freshwater-extra.webp","s":"A man-made system of dams that forms a freshwater habitat during the rainy season.","f":["The dams were designed in the 1890s by engineer Sir Osbert Chadwick.","It is the only significant freshwater ecosystem on the island of Malta."]},"landscape-ghar-lapsi-cove-extra":{"i":"/poi-images/landscape-ghar-lapsi-cove-extra.webp","s":"A small rocky inlet popular with divers and snorkelers.","f":["Features a shallow, cave-like pool with rocky surrounds.","Located just 1 km away from the Mnajdra Neolithic temples."]},"landscape-sanap-cliffs-gozo-extra":{"i":"/poi-images/landscape-sanap-cliffs-gozo-extra.webp","s":"Spectacular cliffs on the south coast of Gozo with a coastal walking path.","f":["Features a recently paved walkway for safe viewing.","One of the best places in Gozo to enjoy the sunset."]},"landscape-wied-il-mielah-window-gozo-extra":{"i":"/poi-images/landscape-wied-il-mielah-window-gozo-extra.webp","s":"A natural rock arch on the coast, similar to the collapsed Azure Window.","f":["The arch is composed of durable Lower Coralline Limestone.","It is accessible via a path leading from the village of Għasri."]},"landscape-coral-lagoon-malta-extra":{"i":"/poi-images/landscape-coral-lagoon-malta-extra.webp","s":"A large sea cave with a collapsed roof, forming a hidden lagoon.","f":["Located at the far northern tip of Malta near Dragonara Point.","Popular destination for kayakers and stand-up paddleboarders."]},"landscape-il-maqluba-sinkhole-extra":{"i":"/poi-images/landscape-il-maqluba-sinkhole-extra.webp","s":"A giant sinkhole formed by the collapse of a cave, now a wooded micro-habitat.","f":["Formed by a sudden ground collapse in November 1343.","The sinkhole has a depth of approximately 15 meters."]},"landscape-ghajn-barrani-cliffs-gozo-extra":{"i":"/poi-images/landscape-ghajn-barrani-cliffs-gozo-extra.webp","s":"Remote and untouched clay cliffs between Ramla and Marsalforn.","f":["Accessible only by foot via coastal walking trails.","Home to several freshwater springs used for local farming."]},"landscape-mtahleb-valley-extra":{"i":"/poi-images/landscape-mtahleb-valley-extra.webp","s":"A fertile valley that slopes down to the sea, home to one of Malta's few streams.","f":["Mtaħleb is famous for its perennial natural freshwater springs.","The area served as a filming location for scenes in 'Game of Thrones'."]},"landscape-fomm-ir-rih-bay-extra":{"i":"/poi-images/landscape-fomm-ir-rih-bay-extra.webp","s":"A secluded and hard-to-reach bay with dramatic cliffs and clear water.","f":["The name literally translates to 'Mouth of the Wind'.","Accessible via a narrow, steep path from the Baħrija area."]},"landscape-qammieh-point-extra":{"i":"/poi-images/landscape-qammieh-point-extra.webp","s":"A rocky headland with great views towards Ghadira Bay and Gozo.","f":["Remote location with no commercial development nearby.","Provides clear views of the South Comino Channel."]},"landscape-cominotto-island-extra":{"i":"/poi-images/landscape-cominotto-island-extra.webp","s":"A small uninhabited island opposite the Blue Lagoon.","f":["Covers a total land area of only 0.25 square kilometers.","Located just 100 meters away from the shores of Comino."]},"landscape-mistra-bay-extra":{"i":"/poi-images/landscape-mistra-bay-extra.webp","s":"A sheltered bay near St.","f":["Situated at the end of a long valley near St. Paul's Bay.","Punic tombs and ancient apiaries can be found nearby."]},"landscape-selmunett-island-st-pauls-islands-extra":{"i":"/poi-images/landscape-selmunett-island-st-pauls-islands-extra.webp","s":"The larger of the two St.","f":["Tradition claims Apostle Paul was shipwrecked here in 60 AD.","The islands are uninhabited today but were once farmed."]},"landscape-b Ghar-hasan-cave-extra":{"i":"/poi-images/landscape-b Ghar-hasan-cave-extra.webp","s":"A large sea cave on the cliffs near Birzebbuga with a legend about a Saracen pirate.","f":["The cave is named after a legendary 12th-century Saracen named Hasan.","It is located on the southern cliffs of Malta near Birżebbuġa."]},"landscape-bahrija-plateau-extra":{"i":"/poi-images/landscape-bahrija-plateau-extra.webp","s":"A rural plateau with beautiful views and walking trails.","f":["Site of a significant Bronze Age village settlement.","Provides views of Fomm ir-Riħ Bay and the island of Filfla."]},"landscape-lunzjata-valley-fountain-gozo-extra":{"i":"/poi-images/landscape-lunzjata-valley-fountain-gozo-extra.webp","s":"A lush valley fed by a natural spring, keeping it green year-round.","f":["The valley was once the hunting ground of the Grand Masters.","Features an ancient stone aqueduct still standing today."]},"landscape-victoria-lines-fault-extra":{"i":"/poi-images/landscape-victoria-lines-fault-extra.webp","s":"A natural geological fault along which a line of fortifications was built in the 19th century.","f":["The fault spans 12 kilometers across the entire width of Malta.","It was used by the British in the 1890s to build a defensive wall."]},"landscape-mgarr-ix-xini-valley-gozo-extra":{"i":"/poi-images/landscape-mgarr-ix-xini-valley-gozo-extra.webp","s":"A steep-sided valley leading to a secluded bay, used as a filming location for the movie 'By the Sea'.","f":["The valley leads to a beautiful bay that was once a hideout for galleys.","A 1661 watchtower built by the Knights still guards the entrance."]},"landscape-marfa-ridge-extra":{"i":"/poi-images/landscape-marfa-ridge-extra.webp","s":"A ridge at the north-western end of Malta, overlooking Comino and Gozo.","f":["Site of the 17th-century St. Agatha's Tower (Red Tower).","Key area for biodiversity and bird watching in Malta."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
