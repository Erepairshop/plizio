ered in decorative sea shells.","f":["A work of folk art created by the owner","Features intricate patterns and religious symbols"]},"poi-mt-ghaxaq-church":{"i":"/poi-images/poi-mt-ghaxaq-church.webp","s":"An impressive baroque parish church dedicated to the Assumption of Mary.","f":["Dominates the town square","Features exquisite sculpture work"]},"poi-mt-zejtun-parish":{"i":"/poi-images/poi-mt-zejtun-parish.webp","s":"A masterpiece of baroque architecture in the south of Malta.","f":["Designed by the architect of Mdina Cathedral","Magnificent dome and twin towers"]},"poi-mt-st-gregory":{"i":"/poi-images/poi-mt-st-gregory.webp","s":"The ancient parish church of Żejtun, full of history.","f":["Known for secret passages discovered in its walls","Final point of the historic St. Gregory's pilgrimage"]},"poi-mt-fgura-monument":{"i":"/poi-images/poi-mt-fgura-monument.webp","s":"A modern landmark in the center of the town.","f":["Focal point for the local community","Located on the main thoroughfare"]},"poi-mt-fgura-church":{"i":"/poi-images/poi-mt-fgura-church.webp","s":"A uniquely designed modern church in Fgura.","f":["Features a striking tent-like concrete roof","One of the largest parishes by population"]},"poi-mt-tarxien":{"i":"/poi-images/poi-mt-tarxien.webp","s":"Neolithic archaeological site.","f":["UNESCO World Heritage site","Renowned for complex stone carvings"]},"poi-mt-kordin":{"i":"/poi-images/poi-mt-kordin.webp","s":"A lesser-known but important megalithic temple complex.","f":["Located on the Corradino heights","Features a unique stone trough"]},"poi-mt-garden-serenity":{"i":"/poi-images/poi-mt-garden-serenity.webp","s":"A beautiful and traditional Chinese garden.","f":["Built with authentic materials from China","Features symbols representing birth, life, and death"]},"poi-mt-st-lucija-church":{"i":"/poi-images/poi-mt-st-lucija-church.webp","s":"The parish church at the heart of the Santa Luċija residential estate.","f":["Modern architecture from the 20th century","Central meeting point for residents"]},"poi-mt-bir-miftuh":{"i":"/poi-images/poi-mt-bir-miftuh.webp","s":"A remarkably well-preserved medieval chapel.","f":["Features rare 15th-century frescoes","Was once a main parish church"]},"poi-mt-palazzo-bettina":{"i":"/poi-images/poi-mt-palazzo-bettina.webp","s":"A historical palace with a storied past.","f":["Reputedly hosted Napoleon Bonaparte","Impressive architectural detail"]},"poi-mt-hypogeum":{"i":"/poi-images/poi-mt-hypogeum.webp","s":"Underground prehistoric temple.","f":["UNESCO World Heritage site","Tickets must be booked months in advance"]},"poi-mt-paola-parish":{"i":"/poi-images/poi-mt-paola-parish.webp","s":"One of the largest and most prominent churches on the islands.","f":["The largest parish church in Malta","Features twin monumental towers"]},"poi-mt-manoel-island":{"i":"/poi-images/poi-mt-manoel-island.webp","s":"A small island in Marsamxett Harbour.","f":["Home to the 18th-century Fort Manoel","Site of a historic quarantine hospital (Lazzaretto)"]},"poi-mt-gzira-promenade":{"i":"/poi-images/poi-mt-gzira-promenade.webp","s":"A bustling waterfront with views of Manoel Island and Valletta.","f":["Lined with international restaurants","Popular spot for sunset views"]},"poi-mt-argotti":{"i":"/poi-images/poi-mt-argotti.webp","s":"Malta's primary botanical gardens, with a long history.","f":["Founded as a medicinal garden in 1774","Houses a vast collection of local and exotic plants"]},"poi-mt-st-publius":{"i":"/poi-images/poi-mt-st-publius.webp","s":"One of the most impressive parish churches, located just outside Valletta.","f":["Dominates the huge Floriana Granaries square","Beautiful interior decorated with silver and gold"]},"poi-mt-embassies":{"i":"/poi-images/poi-mt-embassies.webp","s":"An upscale residential area home to many foreign diplomatic missions.","f":["Features grand 20th-century villas","One of the most prestigious addresses in Malta"]},"poi-mt-gardjola":{"i":"/poi-images/poi-mt-g ce.webp","s":"One of the few surviving palaces of its kind in the world.","f":["Now houses the National Museum of Ethnography","Includes original interrogation rooms and cells"]},"city-valletta-extra":{"i":"/poi-images/city-valletta-extra.webp","s":"Valletta, the magnificent capital of Malta, is a living open-air museum and a UNESCO World Heritage site."},"city-sliema-extra":{"i":"/poi-images/city-sliema-extra.webp","s":"Sliema, once an elegant Victorian seaside resort, has evolved into one of Malta's most dynamic and cosmopolitan hubs."},"city-st-julians-extra":{"i":"/poi-images/city-st-julians-extra.webp","s":"St."},"city-gzira-extra":{"i":"/poi-images/city-gzira-extra.webp","s":"Gżira, meaning 'island' in Maltese, is a town located between Sliema and Msida, overlooking Manoel Island.","f":["Manoel Island is connected to Gżira by a bridge.","An important yacht marina location."]},"city-msida-extra":{"i":"/poi-images/city-msida-extra.webp","s":"Msida is a harbour town close to Valletta, known for its large marina and the University of Malta.","f":["The name is derived from an Arabic word for 'a fisherman's dwelling'.","The parish church is dedicated to St. Joseph."]},"city-ta-xbiex-extra":{"i":"/poi-images/city-ta-xbiex-extra.webp","s":"Ta' Xbiex is a small town known for hosting many foreign embassies, its marinas, and its scenic seafront.","f":["The name means 'nets', reflecting its fishing past.","Hosts the embassies of Egypt, Greece, Ireland, Spain, and others."]},"city-swieqi-extra":{"i":"/poi-images/city-swieqi-extra.webp","s":"Swieqi is a modern and predominantly residential town in the northeast of Malta."},"city-pembroke-extra":{"i":"/poi-images/city-pembroke-extra.webp","s":"Pembroke is one of Malta's youngest towns, stretching along the northeastern coast between St."},"city-san-gwann-extra":{"i":"/poi-images/city-san-gwann-extra.webp","s":"San Ġwann, strategically located in the heart of Malta, is a predominantly modern town that has evolved from a small rural community into a bustling residential and commercial hub."},"city-pieta-extra":{"i":"/poi-images/city-pieta-extra.webp","s":"Pietà, nestled on Malta's northeastern coast between the fortifications of Floriana and the bustling town of Msida, offers a unique and authentic Maltese experience away from the main tourist hubs."},"city-hamrun-extra":{"i":"/poi-images/city-hamrun-extra.webp","s":"Ħamrun is one of the largest and busiest towns in Malta's Inner Harbour Region."},"city-marsa-extra":{"i":"/poi-images/city-marsa-extra.webp","s":"Situated at the inner end of the Grand Harbour, Marsa is a key industrial hub, featuring a power station and a horse racing track.","f":["The name means 'harbour' or 'anchorage'.","Home to the Royal Malta Golf Club."]},"city-floriana-extra":{"i":"/poi-images/city-floriana-extra.webp","s":"Floriana is a fortified town and suburb of Valletta, known for its large squares, gardens, and historical granaries.","f":["Named after the Italian military engineer Pietro Paolo Florani.","Hosts many government buildings."]},"city-kalkara-extra":{"i":"/poi-images/city-kalkara-extra.webp","s":"Kalkara is a picturesque village along the Grand Harbour, home to the Esplora Science Centre and Fort Ricasoli.","f":["The name means 'lime kiln'.","Kalkara Creek provides a safe anchorage for boats."]},"city-vittoriosa-birgu-extra":{"i":"/poi-images/city-vittoriosa-birgu-extra.webp","s":"Birgu, also called Vittoriosa, is one of the Three Cities, renowned for its vital role during the Great Siege of 1565.","f":["Was the capital of Malta before Valletta.","Home to the Inquisitor's Palace."]},"city-senglea-isla-extra":{"i":"/poi-images/city-senglea-isla-extra.webp","s":"Senglea, also known as L-Isla, is one of the famed Three Cities, a fortified city that juts majestically into the Grand Harbour."},"city-cospicua-bormla-extra":{"i":"/poi-images/city-cospicua-bormla-extra.webp","s":"Cospicua, or Bormla, is the largest of the Three Cities, known for its impressive docks and fortifications.","f":["Home to the historic Santa Margherita and Cottonera Lines.","Was heavily bombed during World War II."]},"city-fgura-extra":{"i":"/poi-images/city-fgura-extra.webp","s":"Fgura is a relatively modern town that grew rapidly after World War II to become one of the main residential and commercial areas.","f":["Known for its modern parish church.","The name might derive from 'figure', possibly referring to a statue."]},"city-paola-extra":{"i":"/poi-images/city-paola-extra.webp","s":"Paola is a major commercial hub in the south of Malta, famous for the prehistoric Ħal Saflieni Hypogeum.","f":["Named after Grand Master Antoine de Paule.","The Hypogeum is a UNESCO World Heritage site."]},"city-tarxien-extra":{"i":"/poi-images/city-tarxien-extra.webp","s":"Tarxien is famous for its megalithic temples, another key prehistoric complex and a UNESCO World Heritage site.","f":["The temples date back to approximately 3150 BC.","The complex consists of three separate temple structures."]},"city-luqa-extra":{"i":"/poi-images/city-luqa-extra.webp","s":"Luqa is best known for hosting the Malta International Airport, the country's main gateway to the world.","f":["The name means 'poplar' in Aramaic.","The parish church is dedicated to St. Andrew."]},"city-gudja-extra":{"i":"/poi-images/city-gudja-extra.webp","s":"Gudja is a quiet village close to the airport, known for its three churches and the unique Palazzo Bettina.","f":["One of the oldest parishes in Malta.","The Parish Church of the Assumption of the Virgin Mary is the main one."]},"city-ghaxaq-extra":{"i":"/poi-images/city-ghaxaq-extra.webp","s":"Għaxaq is a small, traditional village in the south of Malta, known for its lively village feast.","f":["The name means 'delight' or 'pleasure'.","The feast of Santa Marija is one of the biggest in Malta."]},"city-santa-lucija-extra":{"i":"/poi-images/city-santa-lucija-extra.webp","s":"Santa Luċija is one of the more modern towns in Malta, designed in the 1960s, and known for its Chinese Garden of Serenity.","f":["Named after a 16th-century chapel.","The garden was a gift from the Chinese government."]},"city-marsaskala-extra":{"i":"/poi-images/city-marsaskala-extra.webp","s":"Marsaskala is a seaside town built around a long, picturesque bay, popular with locals for its waterfront restaurants.","f":["The Maltese name Wied il-Għajn means 'Valley of the Spring'.","Home to St. Thomas Tower, a large Wignacourt fortification."]},"city-marsaxlokk-extra":{"i":"/poi-images/city-marsaxlokk-extra.webp","s":"Marsaxlokk is a traditional fishing village, famous for its large Sunday market and colourful 'Luzzu' boats.","f":["The name means 'south-east harbour'.","The Luzzu boats are painted with the Eye of Osiris to ward off evil."]},"city-birzebbuga-extra":{"i":"/poi-images/city-birzebbuga-extra.webp","s":"Birżebbuġa is a southern seaside town, known for its sandy beach, Pretty Bay, and its proximity to the Malta Freeport.","f":["The name means 'well of olives'.","Għar Dalam, a prehistoric cave, is located nearby."]},"city-zabbar-extra":{"i":"/poi-images/city-zabbar-extra.webp","s":"Żabbar, holding the honorary title of Città Hompesch, is one of the largest towns in the southeast of Malta, with a rich history and a strong local identity."},"city-xghajra-extra":{"i":"/poi-images/city-xghajra-extra.webp","s":"Xgħajra is a small coastal town known for its long promenade, rocky coast, and well-preserved British-era fortifications.","f":["The name is possibly related to an open, barren land.","Offers wide views of the open sea."]},"city-zejtun-extra":{"i":"/poi-images/city-zejtun-extra.webp","s":"Żejtun, holding the title of Città Beland, is one of Malta's oldest towns, located in the southeast of the island."},"city-qrendi-extra":{"i":"/poi-images/city-qrendi-extra.webp","s":"Qrendi is a quiet and picturesque village in the south of Malta, steeped in profound historical and natural significance."},"city-mqabba-extra":{"i":"/poi-images/city-mqabba-extra.webp","s":"Mqabba is renowned for its stone quarries, which extract the high-quality globigerina limestone, and for its paleo-Christian catacombs.","f":["An important supplier of building materials in Malta.","The Catacombs of Ta' Mintna are a key archaeological site."]},"city-kirkop-extra":{"i":"/poi-images/city-kirkop-extra.webp","s":"Kirkop is a small village near the airport, known for its menhir and other minor archaeological remains.","f":["The name is possibly a corruption of 'Kerkop' (a family name).","Home to a large STMicroelectronics plant."]},"city-safi-extra":{"i":"/poi-images/city-safi-extra.webp","s":"Safi is a small, tranquil village in southern Malta that has steadfastly retained its authentic, rural character."},"city-zurrieq-extra":{"i":"/poi-images/city-zurrieq-extra.webp","s":"Żurrieq is one of the oldest towns in Malta, known for the Blue Grotto, the Xarolla Windmill, and its catacombs.","f":["The name might derive from 'zoroq', the Arabic word for 'blue'.","The parish church is dedicated to St. Catherine of Alexandria."]},"city-siggiewi-extra":{"i":"/poi-images/city-siggiewi-extra.webp","s":"Siġġiewi is a rural town known for its vast fields, farmhouses, and proximity to Buskett Gardens and Dingli Cliffs.","f":["Awarded the title 'Città Ferdinand' by Grand Master Ferdinand von Hompesch.","The parish church is dedicated to St. Nicholas."]},"city-zebbug-malta-extra":{"i":"/poi-images/city-zebbug-malta-extra.webp","s":"Żebbuġ, also known as Città Rohan, is one of the oldest towns in Malta, known for its grand parish church and its feasts.","f":["The name means 'olives'.","Three separate village feasts are celebrated."]},"city-qormi-extra":{"i":"/poi-images/city-qormi-extra.webp","s":"Qormi, also known by its honorific title Città Pinto, is one of Malta's largest and most historically rich inland cities."},"city-rabat-malta-extra":{"i":"/poi-images/city-rabat-malta-extra.webp","s":"Rabat, deriving its name from the Arabic word for 'suburb,' is a town steeped in history, intrinsically linked to its famous neighbour, the fortified city of Mdina."},"city-dingli-extra":{"i":"/poi-images/city-dingli-extra.webp","s":"Dingli is located at Malta's highest point and is famous for its dramatic cliffs, offering breathtaking views of the Mediterranean Sea.","f":["The Dingli Cliffs rise to about 253 metres above sea level.","Home to the small, remote St. Mary Magdalene Chapel."]},"city-attard-extra":{"i":"/poi-images/city-attard-extra.webp","s":"Attard, part of the 'Three Villages' along with Balzan and Lija, is known for its villas, gardens, and the San Anton Presidential Palace.","f":["The name possibly means 'blossoms'.","San Anton Palace is the official residence of the President of Malta."]},"city-balzan-extra":{"i":"/poi-images/city-balzan-extra.webp","s":"Balzan is a charming and picturesque village, one of the 'Three Villages', known for its quiet alleys and elegant townhouses.","f":["The parish church is dedicated to the Annunciation.","Originally a small collection of farmhouses."]},"city-lija-extra":{"i":"/poi-images/city-lija-extra.webp","s":"Lija, the last of the 'Three Villages', is renowned for its fireworks tradition, citrus groves, and the distinctive Belvedere Tower.","f":["The annual feast of the Transfiguration is famous for its fireworks.","Home to several large villas of Maltese nobility."]},"city-iklin-extra":{"i":"/poi-images/city-iklin-extra.webp","s":"Iklin is a relatively new locality that developed from a rural area into a modern residential town, bordering Lija and Birkirkara.","f":["The name might derive from the herb rosemary (klin).","A megalithic site was discovered in the 1960s but later destroyed."]},"city-mosta-extra":{"i":"/poi-images/city-mosta-extra.webp","s":"Mosta is famous for its Rotunda, commonly known as the Mosta Dome, which has one of the largest unsupported domes in the world.","f":["During WWII, a bomb fell through the dome but failed to explode.","The church is dedicated to the Assumption of Mary."]},"city-naxxar-extra":{"i":"/poi-images/city-naxxar-extra.webp","s":"Naxxar is a large town in central-northern Malta, known for the opulent Palazzo Parisio and its gardens.","f":["Legend says the people of Naxxar were the first to help St. Paul.","The name might derive from 'nassar' (to convert)."]},"city-gharghur-extra":{"i":"/poi-images/city-gharghur-extra.webp","s":"Għargħur is one of Malta's smallest and oldest villages, situated on a hilltop with views of the coast.","f":["Known for the 'Top of the World' viewpoint.","Retains much of its original village core."]},"city-mellieha-extra":{"i":"/poi-images/city-mellieha-extra.webp","s":"Mellieħa is a large northern village, renowned for Malta's largest sandy beach, Mellieħa Bay (Għadira Bay).","f":["The Sanctuary of Our Lady of Mellieħa is a national shrine.","Home to Popeye Village, the film set of the 1980 movie."]},"city-st-pauls-bay-extra":{"i":"/poi-images/city-st-pauls-bay-extra.webp","s":"St.","f":["One of the largest localities in the Northern Region.","Hosts the Malta National Aquarium."]},"city-bugibba-extra":{"i":"/poi-images/city-bugibba-extra.webp","s":"Buġibba is a bustling coastal town in the northeast of Malta, forming one of the island's largest and most popular tourist resorts along with its neighbours, Qawra and St."},"city-qawra-extra":{"i":"/poi-images/city-qawra-extra.webp","s":"Qawra is a resort town adjacent to Buġibba, known for its hotels, the Malta National Aquarium, and the Salina Nature Park.","f":["The Qawra Tower is a historic watchtower.","Popular for watersports and diving."]},"city-mgarr-malta-extra":{"i":"/poi-images/city-mgarr-malta-extra.webp","s":"Mġarr is a rural village in northwestern Malta, surrounded by farmland and known for the Ta' Ħaġrat and Skorba prehistoric temples.","f":["Known for its production of strawberries.","Hosts an annual strawberry festival (Festa Frawli)."]},"city-victoria-rabat-gozo-extra":{"i":"/poi-images/city-victoria-rabat-gozo-extra.webp","s":"Victoria, also known as Rabat, is the capital city of Gozo, with the ancient fortified Citadel (Cittadella) at its heart.","f":["Named after the British Queen Victoria in 1887.","The Citadel offers 360-degree panoramic views of Gozo."]},"city-xewkija-extra":{"i":"/poi-images/city-xewkija-extra.webp","s":"Xewkija is one of Gozo's oldest villages, dominated by the massive dome of its Rotunda church, dedicated to St.","f":["Its dome is one of the largest in Europe.","The name derives from the Arabic word for 'thorns'."]},"city-nadur-extra":{"i":"/poi-images/city-nadur-extra.webp","s":"Situated on a plateau in eastern Gozo, Nadur is famous for its vibrant carnival, its maritime influence, and the Ta' Kenuna Tower.","f":["The name means 'lookout'.","The Nadur carnival is both macabre and satirical."]},"city-ghajnsielem-extra":{"i":"/poi-images/city-ghajnsielem-extra.webp","s":"Għajnsielem is the first village seen by visitors to Gozo as it overlooks Mġarr Harbour, the arrival point of the ferry from Malta.","f":["The name means 'Peaceful Spring'.","Home to Fort Chambray, a large fortification."]},"city-qala-extra":{"i":"/poi-images/city-qala-extra.webp","s":"Qala, the easternmost village on the island of Gozo, is a destination of tranquil beauty and breathtaking views."},"city-gharb-extra":{"i":"/poi-images/city-gharb-extra.webp","s":"Għarb is a traditional village in western Gozo, known for its picturesque parish church, folklore museum, and the Ta' Pinu Sanctuary.","f":["The name means 'West'.","The Basilica of the Visitation is a baroque gem."]},"city-san-lawrenz-extra":{"i":"/poi-images/city-san-lawrenz-extra.webp","s":"San Lawrenz is an idyllic village on the west coast of Gozo, renowned for its tranquillity, traditional charm, and spectacular natural surroundings."},"city-xlendi-extra":{"i":"/poi-images/city-xlendi-extra.webp","s":"Xlendi, nestled in a picturesque, fjord-like bay on the southwest coast of Gozo, is a charming former fishing village that has evolved into a popular resort."},"city-munxar-extra":{"i":"/poi-images/city-munxar-extra.webp","s":"Munxar, one of Gozo's smallest villages, offers an authentic glimpse into rural Maltese life, far from the bustling coastal resorts."},"city-sannat-extra":{"i":"/poi-images/city-sannat-extra.webp","s":"Sannat is a quiet and traditional village in the south of the island of Gozo."},"city-fontana-extra":{"i":"/poi-images/city-fontana-extra.webp","s":"Fontana, also known as 'Triq tal-Għajn' (Spring Street), is a small village near Victoria, known for its ever-flowing springs.","f":["Locals used the arched shelters to wash their laundry.","The parish church is dedicated to the Sacred Heart of Jesus."]},"city-kercem-extra":{"i":"/poi-images/city-kercem-extra.webp","s":"Kerċem is a village to the west of Victoria, situated in the picturesque Lunzjata Valley, and known for its rural environment.","f":["The hamlet of Santa Luċija is known for its tranquil atmosphere.","The annual feast of St. Gregory is an important traditional event."]},"city-xaghra-extra":{"i":"/poi-images/city-xaghra-extra.webp","s":"Xagħra is a large village in Gozo, famous for the UNESCO-listed Ġgantija Temples, Calypso's Cave, and Ramla Bay.","f":["The Ġgantija temples are among the world's oldest free-standing structures.","Ramla Bay is known for its unique reddish-golden sand."]},"city-zebbug-gozo-extra":{"i":"/poi-images/city-zebbug-gozo-extra.webp","s":"Żebbuġ, perched on a hill in northern Gozo, is renowned for its stunning views, its onyx deposits, and its scenic coastline.","f":["The name means 'wild olive tree'.","The coastline includes the Xwejni Salt Pans."]},"city-ghasri-extra":{"i":"/poi-images/city-ghasri-extra.webp","s":"Għasri is the smallest village in Gozo, known for the secluded, fjord-like Wied il-Għasri and the Giordan Lighthouse.","f":["Wied il-Għasri is a popular spot for diving.","The Giordan Lighthouse offers spectacular views."]},"city-marsalforn-extra":{"i":"/poi-images/city-marsalforn-extra.webp","s":"Marsalforn is the most popular resort in Gozo, known for its vibrant promenade, restaurants, and salt pans.","f":["Once an important port in Gozo.","The salt pans along the coast are still in use today."]},"city-mtarfa-extra":{"i":"/poi-images/city-mtarfa-extra.webp","s":"Mtarfa is a small town overlooking Mdina, known for its past as a British military barracks and its distinctive clock tower.","f":["The Royal Naval Hospital is a large, listed building.","The clock tower was built in 1895."]},"animal-habitat-ghadira-nature-reserve-extra":{"i":"/poi-images/animal-habitat-ghadira-nature-reserve-extra.webp","s":"An important bird sanctuary and wetland, especially during bird migration seasons.","f":["The largest remaining wetland area in the Maltese Islands","Established as an official nature reserve in the year 1980"]},"animal-habitat-simar-nature-reserve-extra":{"i":"/poi-images/animal-habitat-simar-nature-reserve-extra.webp","s":"Another important wetland area near Xemxija, providing a habitat for birds and other wildlife.","f":["Restoration work began in 1992 to recreate the wetland environment.","It was officially designated as a Ramsar site in 1996."]},"animal-habitat-buskett-gardens-extra":{"i":"/poi-images/animal-habitat-buskett-gardens-extra.webp","s":"One of Malta's few woodland areas, home to many bird species and insects.","f":["Planted by the Knights of St. John for hunting","A primary hotspot for birdwatching in the islands"]},"animal-habitat-filfla-island-extra":{"i":"/poi-images/animal-habitat-filfla-island-extra.webp","s":"A small, uninhabited islet that is an important seabird reserve, especially for the Yelkouan shearwater.","f":["The island was a target for bombing practice for over 100 years.","It was granted full protection under the Filfla Nature Reserve Act of 1988."]},"animal-habitat-ta-cenc-cliffs-gozo-extra":{"i":"/poi-images/animal-habitat-ta-cenc-cliffs-gozo-extra.webp","s":"These cliffs on Gozo are a major nesting site for colonies of seabirds.","f":["The cliffs consist of Lower Coralline Limestone","Home to the endemic Maltese Rock-Centaury flower"]},"animal-habitat-dwejra-bay-gozo-extra":{"i":"/poi-images/animal-habitat-dwejra-bay-gozo-extra.webp","s":"A marine protected area known for its rich underwater life and biodiversity.","f":["Home to the unique 'General's Root' parasitic plant","The Inland Sea is connected by a natural tunnel"]},"animal-habitat-l-rdum-tal-madonna-extra":{"i":"/poi-images/animal-habitat-l-rdum-tal-madonna-extra.webp","s":"A protected area known for its colony of Yelkouan shearwaters.","f":["The cliffs rise over 50 meters above sea level","Essential site for the Yelkouan Shearwater species"]},"animal-habitat-salina-nature-park-extra":{"i":"/poi-images/animal-habitat-salina-nature-park-extra.webp","s":"Restored salt pans that now serve as a wetland habitat for birds.","f":["Features salt pans originally dug by the Knights","A popular spot for observing wintering herons"]},"animal-habitat-st-pauls-islands-extra":{"i":"/poi-images/animal-habitat-st-pauls-islands-extra.webp","s":"Two small islands that are a haven for wildlife, including the endemic Maltese wall lizard.","f":["The statue of St. Paul is 4 meters high and stands on an 8-meter pedestal.","The islands were once used by the British military for defensive surveillance."]},"animal-habitat-comino-bird-sanctuary-extra":{"i":"/poi-images/animal-habitat-comino-bird-sanctuary-extra.webp","s":"The entire island of Comino is a bird sanctuary and an important stopover for migratory birds.","f":["Comino is named after the cumin seed (\"kemmuna\"), which once grew wild there.","The island has a permanent population of only a few individuals."]},"animal-habitat-malta-falconry-centre-extra":{"i":"/poi-images/animal-habitat-malta-falconry-centre-extra.webp","s":"A center dedicated to the conservation and breeding of birds of prey.","f":["Features species like the Peregrine Falcon","Educational displays focus on local ecosystem roles"]},"animal-habitat-tal-maghluq-marsaxlokk-extra":{"i":"/poi-images/animal-habitat-tal-maghluq-marsaxlokk-extra.webp","s":"A saline marshland known for its specialized flora and fauna.","f":["Designated as a Special Area of Conservation","Supports salt-tolerant species like Sea Rushes"]},"animal-habitat-wied-ghollieqa-nature-reserve-extra":{"i":"/poi-images/animal-habitat-wied-ghollieqa-nature-reserve-extra.webp","s":"A small but important valley ecosystem located near the University of Malta.","f":["A primary habitat for the Algerian Hedgehog","Managed by Nature Trust (Malta) since the 1990s"]},"animal-habitat-l-ahrax-tal-mellieha-extra":{"i":"/poi-images/animal-habitat-l-ahrax-tal-mellieha-extra.webp","s":"A woodland area that provides a habitat for various species and is popular with campers.","f":["The plateau hosts one of the largest breeding colonies of shearwaters in Malta.","The Coral Lagoon is a natural sinkhole with a diameter of roughly 15 meters."]},"animal-habitat-petting-farm-ta-qali-extra":{"i":"/poi-images/animal-habitat-petting-farm-ta-qali-extra.webp","s":"A place where children can experience farm animals up close.","f":["Features a small stable for miniature ponies","Provides informational boards about each animal"]},"animal-habitat-dreams-of-horses-farm-gozo-extra":{"i":"/poi-images/animal-habitat-dreams-of-horses-farm-gozo-extra.webp","s":"A rescue farm for horses and other animals, offering therapeutic activities.","f":["Located in a quiet valley outside Xagħra village","Features sensory gardens for therapeutic use"]},"animal-habitat-lunzjata-valley-gozo-extra":{"i":"/poi-images/animal-habitat-lunzjata-valley-gozo-extra.webp","s":"A lush, green valley on Gozo that hosts rich flora and fauna, including freshwater crabs.","f":["Lunzjata is one of the few valleys in Malta with a consistent year-round water supply.","The chapel at the valley's entrance is dedicated to the Annunciation."]},"animal-habitat-marine-park-bahar-ic-caghaq-extra":{"i":"/poi-images/animal-habitat-marine-park-bahar-ic-caghaq-extra.webp","s":"A park featuring dolphins, sea lions, and other marine animals, offering educational shows.","f":["The park is home to a resident group of Bottlenose Dolphins.","The South American Sea Lions at the park are noted for their high agility."]},"animal-habitat-foresta-2000-extra":{"i":"/poi-images/animal-habitat-foresta-2000-extra.webp","s":"A reforestation project that is recreating a Mediterranean woodland, providing habitat for wildlife.","f":["More than 20,000 indigenous trees and shrubs have been planted to date.","The reforestation project officially commenced in 1995."]},"animal-habitat-wied-tal-luq-extra":{"i":"/poi-images/animal-habitat-wied-tal-luq-extra.webp","s":"A valley near Buskett known for its rich biodiversity.","f":["Features the rare Painted Frog (Discoglossus pictus)","The valley contains several natural spring outlets"]},"animal-habitat-il-maqluba-extra":{"i":"/poi-images/animal-habitat-il-maqluba-extra.webp","s":"A large sinkhole that has created a unique micro-habitat with a variety of trees and plants.","f":["The sinkhole was formed, according to historical accounts, in November 1343.","Il-Maqluba covers an overall area of approximately 6,000 square meters."]},"animal-habitat-wied-il-qlejgha-chadwick-lakes-extra":{"i":"/poi-images/animal-habitat-wied-il-qlejgha-chadwick-lakes-extra.webp","s":"A series of dams that collect water during the rainy season, forming an important freshwater habitat.","f":["The dam system was constructed in the 1890s during the British colonial period.","The project was led by Sir Osbert Chadwick, a prominent British hydraulic engineer."]},"animal-habitat-is-simar-bird-sanctuary-extra":{"i":"/poi-images/animal-habitat-is-simar-bird-sanctuary-extra.webp","s":"A protected area attracting a variety of birds, especially during migration seasons.","f":["Established in the 1990s through habitat creation","Home to the Mediterranean Killifish in its pools"]},"animal-habitat-ballut-ta-marsaxlokk-extra":{"i":"/poi-images/animal-habitat-ballut-ta-marsaxlokk-extra.webp","s":"A salt marsh area important for the conservation of killifish.","f":["Named after the Holm Oak trees found in the area","Supports a unique population of brackish water flora"]},"animal-habitat-bird-park-malta-extra":{"i":"/poi-images/animal-habitat-bird-park-malta-extra.webp","s":"A park housing a variety of birds from around the world, as well as other animals.","f":["Bird Park Malta is home to over 200 different species of animals.","The park is located in Salina, close to the historic Burmarrad valley."]},"animal-habitat-tal-had-dingli-extra":{"i":"/poi-images/animal-habitat-tal-had-dingli-extra.webp","s":"A cliff area serving as a habitat for endemic plants and insects.","f":["Home to the largest population of Maltese Wall Lizards","Features diverse garigue and maquis vegetation"]},"animal-habitat-ramla-l-hamra-gozo-extra":{"i":"/poi-images/animal-habitat-ramla-l-hamra-gozo-extra.webp","s":"The sandy beach and dunes are a nesting site for the Loggerhead Turtle.","f":["The red color comes from high volcanic ash content","Home to the rare sea daffodil and sand lily"]},"animal-habitat-ghajn-barrani-gozo-extra":{"i":"/poi-images/animal-habitat-ghajn-barrani-gozo-extra.webp","s":"A remote cliff area important for local flora and fauna.","f":["Named after the 'Stranger's Spring' found there","Key habitat for the endemic Maltese Rock-Centaury"]},"animal-habitat-ta-kole-donkey-sanctuary-extra":{"i":"/poi-images/animal-habitat-ta-kole-donkey-sanctuary-extra.webp","s":"A sanctuary that cares for abandoned and mistreated donkeys.","f":["Focuses on providing a peaceful retirement for donkeys","Donkeys played a vital role in Maltese milling history"]},"animal-habitat-xrobb-l-ghagin-nature-park-extra":{"i":"/poi-images/animal-habitat-xrobb-l-ghagin-nature-park-extra.webp","s":"A coastal park focused on sustainability and nature conservation.","f":["Features a rehabilitation centre for injured wildlife","Located on a peninsula with panoramic sea views"]},"kid-landmark-popeye-village-fun-park-extra":{"i":"/poi-images/kid-landmark-popeye-village-fun-park-extra.webp","s":"The original film set of the 1980 Popeye movie, now a theme park for families.","f":["Built as a film set in 1979","Located at Anchor Bay"]},"kid-landmark-malta-national-aquarium-extra":{"i":"/poi-images/kid-landmark-malta-national-aquarium-extra.webp","s":"A modern aquarium featuring fish from the Mediterranean and tropical waters.","f":["Building is shaped like a starfish","Features a walk-through shark tunnel"]},"kid-landmark-esplora-interactive-science-centre-extra":{"i":"/poi-images/kid-landmark-esplora-interactive-science-centre-extra.webp","s":"An interactive science center where children can learn through experiments.","f":["Houses over 200 interactive exhibits","Features a state-of-the-art 4K planetarium"]},"kid-landmark-splash-and-fun-water-park-extra":{"i":"/poi-images/kid-landmark-splash-and-fun-water-park-extra.webp","s":"Malta's largest water park, with slides, a wave pool, and a dinosaur park.","f":["Features a massive wave pool","Home to the island's longest lazy river"]},"kid-landmark-bugibba-water-park-extra":{"i":"/poi-images/kid-landmark-bugibba-water-park-extra.webp","s":"A smaller, free water park on the Bugibba promenade, ideal for younger children.","f":["Entry is free for all visitors","Suitable for children under 12 years"]},"kid-landmark-playmobil-funpark-extra":{"i":"/poi-images/kid-landmark-playmobil-funpark-extra.webp","s":"An indoor and outdoor play area with Playmobil themed worlds, located near the factory.","f":["Second largest Playmobil park globally","Located right next to the factory"]},"kid-landmark-birdpark-malta-for-kids-extra":{"i":"/poi-images/kid-landmark-birdpark-malta-for-kids-extra.webp","s":"A park where children can see and feed birds and other animals.","f":["Home to flamingos and pelicans","Features over 200 animal species"]},"kid-landmark-lws-animal-park-extra":{"i":"/poi-images/kid-landmark-lws-animal-park-extra.webp","s":"A small animal park with a variety of animals, including tigers and monkeys.","f":["Located in Marsaskala","Houses goats, ponies, and rabbits"]},"kid-landmark-limestone-heritage-park-gardens-extra":{"i":"/poi-images/kid-landmark-limestone-heritage-park-gardens-extra.webp","s":"An experiential museum about the history of Maltese limestone, with a small animal park.","f":["Located in a former stone quarry","Offers hands-on stone carving workshops"]},"kid-landmark-bowling-at-eden-superbowl-extra":{"i":"/poi-images/kid-landmark-bowling-at-eden-superbowl-extra.webp","s":"A large bowling alley offering fun for the whole family.","f":["Features 20 computerized bowling lanes","Fully air-conditioned indoor facility"]},"kid-landmark-the-fun-park-at-tigne-point-extra":{"i":"/poi-images/kid-landmark-the-fun-park-at-tigne-point-extra.webp","s":"An indoor playground located in The Point shopping mall.","f":["Located adjacent to The Point shopping complex.","Features designated zones for toddlers and older children."]},"kid-landmark-gozo-3d-cinema-citadel-extra":{"i":"/poi-images/kid-landmark-gozo-3d-cinema-citadel-extra.webp","s":"A cinema in the Gozo Citadel showing a 3D film about the island's history.","f":["Located within the ancient Citadel","Specializes in Gozo documentaries"]},"kid-landmark-villa-rundle-gardens-gozo-extra":{"i":"/poi-images/kid-landmark-villa-rundle-gardens-gozo-extra.webp","s":"A public garden in Victoria with a playground and many birds in aviaries.","f":["First opened to the public in 1915 by the British.","Named after General Sir Leslie Rundle, a former governor."]},"kid-landmark-bouncy-castles-ghadira-bay-extra":{"i":"/poi-images/kid-landmark-bouncy-castles-ghadira-bay-extra.webp","s":"Inflatable water parks set up in Mellieha Bay during the summer.","f":["Located in Malta's largest sandy bay","Operates from June to September"]},"kid-landmark-san-anton-gardens-swans-extra":{"i":"/poi-images/kid-landmark-san-anton-gardens-swans-extra.webp","s":"Beautiful gardens known for their swans and ducks in the ponds.","f":["Surrounds the Presidential Palace","Home to peacocks and turtles"]},"kid-landmark-dreams-of-horses-farm-for-kids-gozo-extra":{"i":"/poi-images/kid-landmark-dreams-of-horses-farm-for-kids-gozo-extra.webp","s":"A rescue farm where children can interact with horses and other animals.","f":["Specializes in therapeutic horse riding","Sanctuary for rescued farm animals"]},"kid-landmark-family-park-marsaskala-extra":{"i":"/poi-images/kid-landmark-family-park-marsaskala-extra.webp","s":"A large park with playgrounds, a skate park, and an area for farm animals.","f":["Largest family park in Southern Malta","Features a small animal petting farm"]},"kid-landmark-the-toy-museum-valletta-extra":{"i":"/poi-images/kid-landmark-the-toy-museum-valletta-extra.webp","s":"A small museum with a collection of old toys, from the 1950s to the 1970s.","f":["Founded by Vincent Brown in 1998 to share his collection.","Set across three floors of a traditional Valletta townhouse."]},"kid-landmark-lasermaxx-bay-street-extra":{"i":"/poi-images/kid-landmark-lasermaxx-bay-street-extra.webp","s":"A laser tag arena in the Bay Street Shopping Complex.","f":["Indoor laser tag facility","Located in the Bay Street complex"]},"kid-landmark-rolling-geeks-tour-extra":{"i":"/poi-images/kid-landmark-rolling-geeks-tour-extra.webp","s":"A self-driving tour in small electric cars around the Three Cities.","f":["Electric buggies fit up to 4 people","GPS-programmed audio guide included"]},"kid-landmark-malta-5d-valletta-extra":{"i":"/poi-images/kid-landmark-malta-5d-valletta-extra.webp","s":"A 5D cinema experience showcasing the history and culture of Malta.","f":["Uses 3D visuals and moving seats","Features scent and water spray effects"]},"kid-landmark-duck-village-g i":"/poi-images/agriculture-ta-qali-farmers-market-extra.webp","s":"A market where local farmers sell their fresh produce directly to consumers.","f":["Open from early morning until mid-afternoon","Promotes the reduction of food miles in Malta"]},"agriculture-gozo-cottage-products-extra":{"i":"/poi-images/agriculture-gozo-cottage-products-extra.webp","s":"A shop selling traditional Gozitan products like cheese (Ġbejna), honey, and jams.","f":["Dry-stone walls divide the land into small plots.","Vines, olives and citrus fruit are classic crops."]},"agriculture-magro-food-village-gozo-extra":{"i":"/poi-images/agriculture-magro-food-village-gozo-extra.webp","s":"A food processing center that also offers tours and tastings of local products.","f":["Located in Xewkija, it serves as the headquarters for Magro Brothers.","Visitors can witness the making of traditional cheese and tomato paste."]},"agriculture-sun-ripe-farms-extra":{"i":"/poi-images/agriculture-sun-ripe-farms-extra.webp","s":"An agricultural holding known for its strawberries and other fruits.","f":["Operates as a sustainable agribusiness model","Known for high-quality 'Kunserva' tomato paste"]},"agriculture-frescos-olive-grove-extra":{"i":"/poi-images/agriculture-frescos-olive-grove-extra.webp","s":"An olive grove producing high-quality extra virgin olive oil.","f":["The grove contains hundreds of trees, including the native Bidni variety.","The oil is extracted via cold pressing immediately after harvesting."]},"agriculture-mgarr-strawberry-fields-extra":{"i":"/poi-images/agriculture-mgarr-strawberry-fields-extra.webp","s":"The area around Mgarr is famous for its strawberry farms, especially during the annual strawberry festival.","f":["The peak season for Maltese strawberries occurs in April.","The 'Festa Frawli' festival draws thousands of visitors to Mgarr annually."]},"agriculture-bahrija-farms-extra":{"i":"/poi-images/agriculture-bahrija-farms-extra.webp","s":"A rural area with many small farms practicing traditional agriculture.","f":["The Bahrija region is considered one of the most fertile on the island.","Major crops grown here include tomatoes, melons, and citrus fruits."]},"agriculture-emmanuel-delicata-winemaker-extra":{"i":"/poi-images/agriculture-emmanuel-delicata-winemaker-extra.webp","s":"Another of Malta's leading winemakers with a long history, hosting wine festivals.","f":["The winery has been family-run for four consecutive generations.","Delicata wines have won over 100 international awards to date."]},"agriculture-farmer-s-deli-bistro-extra":{"i":"/poi-images/agriculture-farmer-s-deli-bistro-extra.webp","s":"A restaurant and shop focusing on using local and organic produce.","f":["The bistro uses 100% certified organic ingredients in its dishes.","It is situated within the grounds of a historical Maltese villa."]},"agriculture-gozo-artisan-network-extra":{"i":"/poi-images/agriculture-gozo-artisan-network-extra.webp","s":"An initiative promoting local artisans and food producers on Gozo.","f":["The network includes cheesemakers, weavers, and local beekeepers.","It aims to market traditional products directly to consumers."]},"agriculture-sammy-s-strawberry-farm-extra":{"i":"/poi-images/agriculture-sammy-s-strawberry-farm-extra.webp","s":"A well-known farm in Mgarr where visitors can pick their own strawberries.","f":["Focuses on organic and traditional farming methods","The farm is a key participant in the Festa Frawli"]},"agriculture-citrus-groves-of-san-anton-extra":{"i":"/poi-images/agriculture-citrus-groves-of-san-anton-extra.webp","s":"The gardens of San Anton Palace are famous for their old citrus trees.","f":["The groves are part of the Maltese President's official residence.","Some orange trees date back to the era of the Knights of St. John."]},"agriculture-xwejni-salt-pans-gozo-extra":{"i":"/poi-images/agriculture-xwejni-salt-pans-gozo-extra.webp","s":"Traditional salt pans where sea salt has been harvested by hand for centuries.","f":["Features a distinctive checkerboard pattern on rocks","Harvesting season lasts from May to September"]},"agriculture-melita-honey-extra":{"i":"/poi-images/agriculture-melita-honey-extra.webp","s":"Producers of Maltese honey, known for its unique flavour derived from the local flora.","f":["The honey is sourced from wild thyme, carob, and spring wildflowers.","Production follows strict traditional and artisanal methods."]},"agriculture-lord- chambray-brewery-gozo-extra":{"i":"/poi-images/agriculture-lord- chambray-brewery-gozo-extra.webp","s":"The first craft brewery on Gozo, producing a range of beers with local influences.","f":["Lord Chambray was established in 2014 as the first craft brewery in Malta.","The production facility is based in the Xewkija Industrial Estate on Gozo."]},"agriculture-kunserva-factory-gozo-extra":{"i":"/poi-images/agriculture-kunserva-factory-gozo-extra.webp","s":"A major producer of 'Kunserva', a traditional Maltese tomato paste.","f":["Kunserva is a traditional, slightly sweetened Maltese tomato paste.","The factory is operated by the well-known Magro family business."]},"agriculture-olive-oil-tasting-malta-extra":{"i":"/poi-images/agriculture-olive-oil-tasting-malta-extra.webp","s":"Several farms offer tasting sessions of their locally produced olive oil.","f":["The 'Bidni' variety is an endemic olive grown only on the Maltese islands.","Tastings are frequently conducted directly within the olive groves."]},"agriculture-rural-herita-ge-trail-dingli-extra":{"i":"/poi-images/agriculture-rural-herita-ge-trail-dingli-extra.webp","s":"A walking trail that passes by traditional farms and agricultural landscapes.","f":["The trail offers panoramic views from 250 meters above sea level.","It connects historical chapels with traditional working farms."]},"agriculture-the-vegetable-patch-extra":{"i":"/poi-images/agriculture-the-vegetable-patch-extra.webp","s":"A farm specializing in the cultivation of a variety of vegetables.","f":["Encourages sustainable soil management practices","Known for vibrant heirloom tomato varieties"]},"agriculture-fig-trees-in-xaghra-gozo-extra":{"i":"/poi-images/agriculture-fig-trees-in-xaghra-gozo-extra.webp","s":"The area around Xaghra is known for its fig trees and production of fig products.","f":["Xaghra is one of the most productive agricultural villages in Gozo.","Both green and purple fig varieties are cultivated in the area."]},"agriculture-caper-bushes-of-gozo-extra":{"i":"/poi-images/agriculture-caper-bushes-of-gozo-extra.webp","s":"Gozo is known for its wild-growing caper bushes, whose buds are harvested and preserved.","f":["Caper bushes often grow directly from gaps in ancient dry-stone walls.","The flower buds are meticulously harvested by hand in early summer."]},"agriculture-bee-keeping-experience-extra":{"i":"/poi-images/agriculture-bee-keeping-experience-extra.webp","s":"Several beekeepers offer tours where visitors can learn about honey production.","f":["Ancient Greeks named Malta Melite, which translates to honey.","The Maltese honey bee is a unique endemic subspecies found only here."]},"agriculture-bacchus-winery-extra":{"i":"/poi-images/agriculture-bacchus-winery-extra.webp","s":"A restaurant and venue in Mdina with a historic wine cellar.","f":["The winery uses only grapes grown locally on the Maltese islands.","Storage facilities include traditional vaulted cellars for aging."]},"agriculture-potato-farms-qrendi-extra":{"i":"/poi-images/agriculture-potato-farms-qrendi-extra.webp","s":"The region around Qrendi is a major producer of potatoes in Malta, which are also exported.","f":["Qrendi potatoes are often harvested twice within a single year.","Harvesting is still largely done by hand using traditional methods."]},"agriculture-mgarr-local-council-farmers-market-extra":{"i":"/poi-images/agriculture-mgarr-local-council-farmers-market-extra.webp","s":"A smaller, local market offering fresh agricultural produce from the region.","f":["The market is held periodically in the main square of Mgarr village.","It features seasonal specialties like local strawberries and melons."]},"industry-playmobil-factory-extra":{"i":"/poi-images/industry-playmobil-factory-extra.webp","s":"One of the largest production facilities for Playmobil toys in the world.","f":["The factory produces over 100 million figures annually.","Malta is the exclusive manufacturing home for all figures."]},"industry-farsons-brewery-extra":{"i":"/poi-images/industry-farsons-brewery-extra.webp","s":"Malta's largest beverage producer, the maker of Cisk lager and Kinnie.","f":["Home to the world-famous Cisk beer, first brewed in 1929.","The brewery features a state-of-the-art bottling plant."]},"industry-malta-freeport-extra":{"i":"/poi-images/industry-malta-freeport-extra.webp","s":"One of the most important transshipment hubs in the Mediterranean.","f":["Handles transshipment for major global shipping lines.","Features deep-water berths accessible to mega-ships."]},"industry-rinella-film-studios-extra":{"i":"/poi-images/industry-rinella-film-studios-extra.webp","s":"A film studio with water tanks, used for many international film productions.","f":["Features the largest infinity-edge water tank in Europe.","Has hosted productions for James Bond and Game of Thrones."]},"industry-bulebel-industrial-estate-extra":{"i":"/poi-images/industry-bulebel-industrial-estate-extra.webp","s":"One of the largest industrial estates in Malta, home to many factories and businesses.","f":["Home to various high-tech manufacturing plants","Features a mix of international and local firms"]},"industry-hal-far-industrial-estate-extra":{"i":"/poi-images/industry-hal-far-industrial-estate-extra.webp","s":"Another large industrial estate located near the airport.","f":["Home to global leaders in generic pharmaceutical production.","Located on the site of a former WWII airfield."]},"industry-mosta-technopark-extra":{"i":"/poi-images/industry-mosta-technopark-extra.webp","s":"An indus
