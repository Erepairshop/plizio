*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#060614;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:#0a0a1f;border-bottom:1px solid #ffffff14;position:relative;z-index:5}
header a.back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#ffffff14;color:#fff;text-decoration:none;font-weight:700}
header a.back:active{background:#ffffff28}
header h1{margin:0;font-size:1rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .langs{display:flex;gap:.25rem}
.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;background-image:radial-gradient(1.2px 1.2px at 12% 22%,#ffffff70,transparent),radial-gradient(1px 1px at 28% 68%,#ffffff55,transparent),radial-gradient(1.4px 1.4px at 47% 38%,#cfe4ff66,transparent),radial-gradient(1px 1px at 63% 18%,#ffffff50,transparent),radial-gradient(1.3px 1.3px at 78% 72%,#ffffff66,transparent),radial-gradient(1px 1px at 88% 33%,#cfe4ff55,transparent),radial-gradient(1px 1px at 38% 88%,#ffffff44,transparent),radial-gradient(1.2px 1.2px at 92% 58%,#ffffff55,transparent);background-repeat:no-repeat}
#svg{width:100%;height:100%;display:block;cursor:grab;position:relative;z-index:1}
#svg.drag{cursor:grabbing}
.region{fill:#161e3a;stroke:#6f9bf0;stroke-width:1.1;stroke-opacity:.7;transition:fill .15s}
.region:hover{fill:#28356e}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#0a0f20;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#7cc0ff;filter:drop-shadow(0 0 2.4px #4aa6ff)}
.poi.g-sight circle{fill:#fcd34d;filter:drop-shadow(0 0 2.4px #f5b528)}
.poi.g-nature circle{fill:#4ade80;filter:drop-shadow(0 0 2.4px #22c55e)}
.poi.g-history circle{fill:#d0a6ff;filter:drop-shadow(0 0 2.4px #b266ff)}
.poi.g-industry circle{fill:#ffb066;filter:drop-shadow(0 0 2.4px #fb923c)}
.poi.g-other circle{fill:#b8c0cc;filter:drop-shadow(0 0 2px #9ca3af)}
.poi.dim{opacity:.16}
.poi.dim circle{filter:none}
.poi,.cluster{transition:opacity .2s}
#svg.dim-pois .poi,#svg.dim-pois .cluster{opacity:.1!important}
#svg.dim-pois .poi circle{filter:none}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7.5;fill:#fff;opacity:1;filter:drop-shadow(0 0 6px #cfeaff) drop-shadow(0 0 11px #7fd0ff)}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:rgba(11,19,35,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(120,180,255,.3);border-radius:18px 18px 0 0;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -12px 44px rgba(0,0,0,.6)}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a,.popup .list .nl{display:flex;align-items:center;gap:.6rem;padding:.4rem .45rem;border-radius:10px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:hover,.popup .list a:active{background:rgba(120,180,255,.12)}
.popup .list .lthumb{width:42px;height:42px;border-radius:9px;flex-shrink:0;background:#1a2740 center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.popup .list .lthumb .dot{width:9px;height:9px;border-radius:50%}
.popup .list .lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.popup .list .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.popup .list .g{font-size:.64rem;color:#9fc4ff;text-transform:uppercase;letter-spacing:.04em}
.popup .list .lgo{color:#7fb0ff;font-size:1.2rem;font-weight:700;flex-shrink:0;padding-right:.3rem}
.popup .list .nl{color:#ffffffb0;font-style:normal}
.mapcard{position:fixed;z-index:20;width:max-content;min-width:150px;max-width:230px;background:rgba(11,19,35,.82);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);border:1px solid rgba(120,180,255,.34);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.62),0 0 0 1px rgba(120,180,255,.08);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-100%) translateY(-15px) scale(.95);transform-origin:bottom center;transition:opacity .16s,transform .16s}
.mapcard.open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-100%) translateY(-15px) scale(1)}
.mapcard--below{transform:translate(-50%,0) translateY(15px) scale(.95);transform-origin:top center}
.mapcard--below.open{transform:translate(-50%,0) translateY(15px) scale(1)}
.mapcard::after{content:"";position:absolute;left:var(--ax,50%);top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(11,19,35,.82)}
.mapcard--below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:rgba(11,19,35,.82)}
.mapcard .mc-img{width:100%;aspect-ratio:16/9;background:#1a2740 center/cover no-repeat;display:none;border-radius:13px 13px 0 0}
.mapcard .mc-img.has{display:block}
.mapcard .mc-body{padding:9px 11px 11px}
.mapcard .mc-type{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#7fb0ff;font-weight:700}
.mapcard .mc-name{font-size:.95rem;font-weight:800;color:#eef4ff;margin:1px 0 5px;line-height:1.2}
.mapcard .mc-desc{font-size:.76rem;color:#cfe0ff;line-height:1.4;margin:0 0 9px;display:none}
.mapcard .mc-desc.show{display:block}
.mapcard .mc-more{display:inline-block;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;text-decoration:none;font-weight:700;font-size:.78rem;padding:.42rem .75rem;border-radius:8px}
.mapcard .mc-x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:.95rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.burst{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}
.burst.open{display:block}
.burst-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst-line{stroke:rgba(120,185,255,.4);stroke-width:1.1;stroke-linecap:round;animation:burstFade .25s ease-out}
.burst-core{fill:#cdeeff;filter:drop-shadow(0 0 5px #7fd0ff)}
.burst-dots{position:absolute;inset:0}
.burst-dot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;animation:burstPop .22s ease-out}
.burst-dot .bd{width:15px;height:15px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(8,16,34,.6),0 0 10px currentColor;transition:transform .12s}
.burst-dot:hover .bd,.burst-dot:focus-visible .bd{transform:scale(1.3)}
.burst-dot .bl{font-size:.72rem;font-weight:700;color:#eef4ff;background:rgba(8,14,28,.82);border:1px solid rgba(120,180,255,.25);padding:1.5px 6px;border-radius:7px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
@keyframes burstPop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes burstFade{from{opacity:0}to{opacity:1}}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}
</style>

:"Żejtun, amely a Città Beland címet viseli, Málta egyik legrégebbi városa, a sziget délkeleti részén található."},"city-qrendi-extra":{"i":"/poi-images/city-qrendi-extra.webp","s":"Qrendi egy csendes és festői falu Málta déli részén, amely mély történelmi és természeti jelentőséggel bír."},"city-mqabba-extra":{"i":"/poi-images/city-mqabba-extra.webp","s":"Mqabba a kőbányáiról ismert, ahonnan a jó minőségű globigerin mészkövet bányásszák, valamint a korai keresztény katakombáiról.","f":["Fontos építőanyag-beszállító Máltán.","A Ta' Mintna katakombák fontos régészeti lelőhelyek."]},"city-kirkop-extra":{"i":"/poi-images/city-kirkop-extra.webp","s":"Kirkop egy kis falu a repülőtér közelében, amely menhirjeiről és más kisebb régészeti maradványairól ismert.","f":["A neve valószínűleg a 'Kerkop' (családnév) eltorzulása.","Itt található egy nagy STMicroelectronics üzem."]},"city-safi-extra":{"i":"/poi-images/city-safi-extra.webp","s":"Safi egy kicsi, csendes falu Málta déli részén, amely megőrizte autentikus, vidéki jellegét."},"city-zurrieq-extra":{"i":"/poi-images/city-zurrieq-extra.webp","s":"Żurrieq Málta egyik legrégebbi városa, amely a Kék Barlangról, a Xarolla szélmalomról és katakombáiról ismert.","f":["A neve a 'zoroq' szóból származhat, ami arabul 'kéket' jelent.","A plébániatemplomot Alexandriai Szent Katalinnak szentelték."]},"city-siggiewi-extra":{"i":"/poi-images/city-siggiewi-extra.webp","s":"Siġġiewi egy vidéki város, amely széles mezőiről, farmjairól, valamint a Buskett-kertek és a Dingli-sziklák közelségéről ismert.","f":["A 'Città Ferdinand' címet Ferdinand von Hompesch nagymestertől kapta.","A plébániatemplomot Szent Miklósnak szentelték."]},"city-zebbug-malta-extra":{"i":"/poi-images/city-zebbug-malta-extra.webp","s":"Żebbuġ, más néven Città Rohan, Málta egyik legrégebbi városa, amely pompás plébániatemplomáról és ünnepeiről ismert.","f":["A neve 'olajbogyót' jelent.","Három különálló falusi ünnepet tartanak."]},"city-qormi-extra":{"i":"/poi-images/city-qormi-extra.webp","s":"Qormi, vagy ahogyan tiszteletbeli nevén, Città Pinto-ként is ismerik, Málta egyik legnagyobb és történelmileg legjelentősebb városa."},"city-rabat-malta-extra":{"i":"/poi-images/city-rabat-malta-extra.webp","s":"Rabat, amelynek neve az arab „külváros” szóból ered, egy történelemmel átitatott város, amely elválaszthatatlanul kapcsolódik híres szomszédjához, a fallal körülvett Mdinához."},"city-dingli-extra":{"i":"/poi-images/city-dingli-extra.webp","s":"Dingli Málta legmagasabb pontján fekszik, és drámai szikláiról híres, ahonnan lenyűgöző kilátás nyílik a Földközi-tengerre.","f":["A Dingli-sziklák körülbelül 253 méterrel emelkednek a tengerszint fölé.","Itt található a kis, félreeső Szent Mária Magdolna kápolna."]},"city-attard-extra":{"i":"/poi-images/city-attard-extra.webp","s":"Attard, a 'Három Falu' egyike Balzan és Lija mellett, villáiról, kertjeiről és a San Anton elnöki palotáról ismert.","f":["A neve valószínűleg 'virágokat' jelent.","A San Anton palota Málta elnökének hivatalos rezidenciája."]},"city-balzan-extra":{"i":"/poi-images/city-balzan-extra.webp","s":"Balzan egy bájos és festői falu, egyike a 'Három Falunak', amely csendes sikátorairól és elegáns városi házairól ismert.","f":["A plébániatemplomot Angyali Üdvözletnek szentelték.","Eredetileg egy kis tanyacsoport volt."]},"city-lija-extra":{"i":"/poi-images/city-lija-extra.webp","s":"Lija, a 'Három Falu' utolsó tagja, tűzijáték-hagyományairól, citruskertjeiről és jellegzetes Belvedere-tornyáról ismert.","f":["Az évenkénti Színeváltozás ünnepe híres a tűzijátékáról.","Számos máltai nemesi család nagy villájának ad otthont."]},"city-iklin-extra":{"i":"/poi-images/city-iklin-extra.webp","s":"Iklin egy viszonylag új település, amely egy vidéki területről fejlődött modern lakóvárossá, Lija és Birkirkara szomszédságában.","f":["A neve a rozmaring (klin) gyógynövény nevéből származhat.","Az 1960-as években egy megalitikus lelőhelyet fedeztek fel, de később elpusztították."]},"city-mosta-extra":{"i":"/poi-images/city-mosta-extra.webp","s":"Mosta a rotundájáról híres, amelyet általában Mosta-dómnak neveznek, és amely a világ egyik legnagyobb alátámasztatlan kupolájával rendelkezik.","f":["A második világháború alatt egy bomba átesett a kupolán, de nem robbant fel.","A templomot Nagyboldogasszonynak szentelték."]},"city-naxxar-extra":{"i":"/poi-images/city-naxxar-extra.webp","s":"Naxxar egy nagyváros Málta közép-északi részén, amely a pazar Palazzo Parisio-ról és kertjeiről ismert.","f":["A legenda szerint a naxxariak voltak az elsők, akik segítettek Szent Pálnak.","A név a 'nassar' (megtérít) szóból származhat."]},"city-gharghur-extra":{"i":"/poi-images/city-gharghur-extra.webp","s":"Għargħur Málta egyik legkisebb és legrégebbi faluja, amely egy dombon fekszik, kilátással a tengerpartra.","f":["A 'Világ Teteje' kilátópontjáról ismert.","Megőrizte eredeti faluközpontjának nagy részét."]},"city-mellieha-extra":{"i":"/poi-images/city-mellieha-extra.webp","s":"Mellieħa egy nagy falu az északi részen, amely Málta legnagyobb homokos strandjáról, a Mellieħa-öbölről (Għadira-öböl) ismert.","f":["A Mellieħai Miasszonyunk kegyhely nemzeti szentély.","Itt található a Popeye Falu, az 1980-as film forgatási helyszíne."]},"city-st-pauls-bay-extra":{"i":"/poi-images/city-st-pauls-bay-extra.webp","s":"St.","f":["Az északi régió egyik legnagyobb települése.","Itt található a Máltai Nemzeti Akvárium."]},"city-bugibba-extra":{"i":"/poi-images/city-bugibba-extra.webp","s":"Buġibba egy élénk tengerparti város Málta északkeleti részén, amely Qawrával és St."},"city-qawra-extra":{"i":"/poi-images/city-qawra-extra.webp","s":"Qawra egy üdülőhely Buġibba mellett, amely szállodáiról, a Máltai Nemzeti Akváriumról és a Salina Természeti Parkról ismert.","f":["A Qawra-torony egy történelmi őrtorony.","Népszerű a vízi sportok és a búvárkodás kedvelői körében."]},"city-mgarr-malta-extra":{"i":"/poi-images/city-mgarr-malta-extra.webp","s":"Mġarr egy vidéki falu Málta északnyugati részén, mezőgazdasági területekkel körülvéve, és a Ta' Ħaġrat és Skorba őskori templomairól ismert.","f":["Az epertermesztéséről ismert.","Évenkénti eper fesztivál (Festa Frawli)."]},"city-victoria-rabat-gozo-extra":{"i":"/poi-images/city-victoria-rabat-gozo-extra.webp","s":"Victoria, más néven Rabat, Gozo fővárosa, amelynek központja az ősi erődített Citadella.","f":["Viktória brit királynőről nevezték el 1887-ben.","A Citadellából 360 fokos panoráma nyílik Gozóra."]},"city-xewkija-extra":{"i":"/poi-images/city-xewkija-extra.webp","s":"Xewkija Gozo egyik legrégebbi faluja, amelyet a hatalmas kupolájú, Keresztelő Szent Jánosnak szentelt rotundatemploma ural.","f":["A kupolája az egyik legnagyobb Európában.","A neve az arab 'tövis' szóból származik."]},"city-nadur-extra":{"i":"/poi-images/city-nadur-extra.webp","s":"Nadur Gozo keleti részén, egy fennsíkon fekszik, és élénk karneváljáról, tengerészeti hatásáról és a Ta' Kenuna-toronyról ismert.","f":["A neve 'kilátópontot' jelent.","A naduri karnevál egyszerre hátborzongató és szatirikus."]},"city-ghajnsielem-extra":{"i":"/poi-images/city-ghajnsielem-extra.webp","s":"Għajnsielem az első falu, amelyet a látogatók Gozón meglátnak, mivel a Mġarr kikötőre néz, amely a Máltáról érkező komp érkezési pontja.","f":["A neve 'Békés Forrást' jelent.","Itt található a Fort Chambray, egy nagy erőd."]},"city-qala-extra":{"i":"/poi-images/city-qala-extra.webp","s":"Qala, Gozo szigetének legkeletibb falva, egy békés és festői település, amely tökéletes menedéket nyújt a nyugalomra vágyóknak."},"city-gharb-extra":{"i":"/poi-images/city-gharb-extra.webp","s":"Għarb egy hagyományos falu Gozo nyugati részén, amely festői plébániatemplomáról, folklórmúzeumáról és a Ta' Pinu kegyhelyről ismert.","f":["A neve 'nyugatot' jelent.","A Sarlós Boldogasszony-bazilika egy barokk ékszer."]},"city-san-lawrenz-extra":{"i":"/poi-images/city-san-lawrenz-extra.webp","s":"San Lawrenz egy idilli falu Gozo nyugati partján, amely nyugalmáról, hagyományos varázsáról és látványos természeti környezetéről ismert."},"city-xlendi-extra":{"i":"/poi-images/city-xlendi-extra.webp","s":"Xlendi, ez a festői, fjordszerű öbölben fekvő egykori halászfalu Gozo délnyugati partján, mára egy közkedvelt üdülőhellyé vált."},"city-munxar-extra":{"i":"/poi-images/city-munxar-extra.webp","s":"Munxar, Gozo egyik legkisebb és legcsendesebb faluja, a sziget déli részén fekszik, és tökéletes menedéket nyújt a nyüzsgő tengerparti üdülőhelyek elől."},"city-sannat-extra":{"i":"/poi-images/city-sannat-extra.webp","s":"Sannat egy csendes és hagyományőrző falu Gozo szigetének déli részén."},"city-fontana-extra":{"i":"/poi-images/city-fontana-extra.webp","s":"Fontana, más néven 'Triq tal-Għajn' (Forrás útja), egy kis falu Victoria közelében, amely folyamatosan folyó forrásairól ismert.","f":["A helyiek az árkádos menedékhelyeket használták ruháik mosására.","A plébániatemplomot Jézus Szent Szívének szentelték."]},"city-kercem-extra":{"i":"/poi-images/city-kercem-extra.webp","s":"Kerċem egy falu Victoriától nyugatra, a festői Lunzjata-völgyben, amely vidéki környezetéről ismert.","f":["A Santa Luċija nevű része csendes hangulatáról ismert.","Az éves Szent Gergely-ünnep fontos hagyományos esemény."]},"city-xaghra-extra":{"i":"/poi-images/city-xaghra-extra.webp","s":"Xagħra egy nagy falu Gozón, amely az UNESCO Világörökség részét képező Ġgantija templomokról, a Kalüpszó-barlangról és a Ramla-öbölről ismert.","f":["A Ġgantija templomok a világ legrégebbi szabadon álló építményei közé tartoznak.","A Ramla-öböl egyedülálló vöröses-arany homokjáról ismert."]},"city-zebbug-gozo-extra":{"i":"/poi-images/city-zebbug-gozo-extra.webp","s":"Żebbuġ Gozo északi részén, egy dombon fekszik, és lenyűgöző kilátásáról, ónix lelőhelyeiről és festői tengerpartjáról ismert.","f":["A neve 'vad olajfát' jelent.","A tengerpartja magában foglalja a Xwejni sólepárlókat."]},"city-ghasri-extra":{"i":"/poi-images/city-ghasri-extra.webp","s":"Għasri Gozo legkisebb faluja, amely a félreeső, fjordszerű Wied il-Għasriról és a Giordan-világítótoronyról ismert.","f":["A Wied il-Għasri népszerű búvárhely.","A Giordan-világítótoronyból lenyűgöző kilátás nyílik."]},"city-marsalforn-extra":{"i":"/poi-images/city-marsalforn-extra.webp","s":"Marsalforn a legnépszerűbb üdülőhely Gozón, amely élénk sétányáról, éttermeiről és sólepárlóiról ismert.","f":["Egykor fontos kikötő volt Gozón.","A part menti sólepárlókat ma is használják."]},"city-mtarfa-extra":{"i":"/poi-images/city-mtarfa-extra.webp","s":"Mtarfa egy kisváros, amely Mdinára néz, és egykori brit katonai laktanyájáról és jellegzetes óratornyáról ismert.","f":["A Királyi Haditengerészeti Kórház egy nagy, műemlék jellegű épület.","Az óratornyot 1895-ben építették."]},"animal-habitat-ghadira-nature-reserve-extra":{"i":"/poi-images/animal-habitat-ghadira-nature-reserve-extra.webp","s":"Fontos madárvédelmi terület és vizes élőhely, különösen a madárvonulási időszakban.","f":["A máltai szigetvilág legnagyobb fennmaradt vizes élőhelye","1980 óta áll hivatalos természetvédelmi oltalom alatt"]},"animal-habitat-simar-nature-reserve-extra":{"i":"/poi-images/animal-habitat-simar-nature-reserve-extra.webp","s":"Egy másik fontos vizes élőhely Xemxija közelében, amely madaraknak és más vadon élő állatoknak ad otthont.","f":["A vizes élőhely helyreállítási munkálatai 1992-ben kezdődtek.","A területet 1996-ban nyilvánították hivatalosan Ramsari helyszínné."]},"animal-habitat-buskett-gardens-extra":{"i":"/poi-images/animal-habitat-buskett-gardens-extra.webp","s":"Málta kevés erdős területeinek egyike, számos madárfaj és rovar otthona.","f":["A lovagrend tagjai ültették a fákat vadászat céljából","Szeptemberben itt figyelhető meg a legtöbb darázsölyv"]},"animal-habitat-filfla-island-extra":{"i":"/poi-images/animal-habitat-filfla-island-extra.webp","s":"Egy kicsi, lakatlan sziget, amely fontos tengeri madárvédelmi terület, különösen a mediterrán vészmadár számára.","f":["A szigetet több mint 100 éven át használták bombázási gyakorlatok célpontjaként.","Teljes védelmet az 1988-as Filfla Természetvédelmi Törvény alapján kapott."]},"animal-habitat-ta-cenc-cliffs-gozo-extra":{"i":"/poi-images/animal-habitat-ta-cenc-cliffs-gozo-extra.webp","s":"Ezek a sziklák Gozón fontos fészkelőhelyet jelentenek a tengeri madárkolóniák számára.","f":["A sziklák magassága eléri a 130 métert","Itt él a ritka máltai kék kövirigó is"]},"animal-habitat-dwejra-bay-gozo-extra":{"i":"/poi-images/animal-habitat-dwejra-bay-gozo-extra.webp","s":"Tengeri védett terület, amely gazdag tengeri élővilágáról és biológiai sokféleségéről ismert.","f":["Itt található a Belső-tenger nevű sós vizű tó","A Fungus Rockon nő a ritka máltai gomba"]},"animal-habitat-l-rdum-tal-madonna-extra":{"i":"/poi-images/animal-habitat-l-rdum-tal-madonna-extra.webp","s":"Védett terület, amely a mediterrán vészmadár kolóniájáról ismert.","f":["A madarak éjszaka térnek vissza a sziklaüregekbe","Fontos terület a máltai örökzöld tölgyek számára"]},"animal-habitat-salina-nature-park-extra":{"i":"/poi-images/animal-habitat-salina-nature-park-extra.webp","s":"Felújított sólepárlók, amelyek ma vizes élőhelyként szolgálnak a madarak számára.","f":["A parkban őshonos máltai fákat ültettek vissza","A sós medencék vonzzák a gázlómadarakat"]},"animal-habitat-st-pauls-islands-extra":{"i":"/poi-images/animal-habitat-st-pauls-islands-extra.webp","s":"Két kis sziget, amelyek menedéket nyújtanak a vadon élő állatoknak, köztük az endemikus máltai faligyíknak.","f":["Szent Pál szobra 4 méter magas, és egy 8 méteres talapzaton áll.","A szigeteket egykor a brit hadsereg használta védelmi megfigyelésre."]},"animal-habitat-comino-bird-sanctuary-extra":{"i":"/poi-images/animal-habitat-comino-bird-sanctuary-extra.webp","s":"Comino egész szigete madárrezervátum és fontos pihenőhely a vonuló madarak számára.","f":["Comino a köményről (kemmuna) kapta a nevét, amely egykor vadon nőtt itt.","A sziget állandó lakossága mindössze néhány főből áll."]},"animal-habita vándormadarak számára."]},"agriculture-vincent-eco-farm-extra":{"i":"/poi-images/agriculture-vincent-eco-farm-extra.webp","s":"Málta egyik legnagyobb biofarmja, amely sokféle zöldséget és gyümölcsöt termeszt.","f":["Málta természeti értékei különösen érzékenyek a turizmus hatásaira.","A Ghadira-rezervátum fontos állomás a vándormadarak számára."]},"agriculture-ta-qali-farmers-market-extra":{"i":"/poi-images/agriculture-ta-qali-farmers-market-extra.webp","s":"Piac, ahol a helyi gazdák közvetlenül a fogyasztóknak árulják friss termékeiket.","f":["A piac kedden és szombaton tart nyitva","Csak Máltán termesztett áruk kerülhetnek eladásra"]},"agriculture-gozo-cottage-products-extra":{"i":"/poi-images/agriculture-gozo-cottage-products-extra.webp","s":"Hagyományos gozói termékeket, például sajtot (Ġbejna), mézet és lekvárokat árusító üzlet.","f":["Málta természeti értékei különösen érzékenyek a turizmus hatásaira.","A Ghadira-rezervátum fontos állomás a vándormadarak számára."]},"agriculture-magro-food-village-gozo-extra":{"i":"/poi-images/agriculture-magro-food-village-gozo-extra.webp","s":"Élelmiszer-feldolgozó központ, amely helyi termékekből tartott túrákat és kóstolókat is kínál.","f":["A központ Xewkijában található, és ez a Magro Brothers székhelye.","A látogatók megtekinthetik a sajt és a paradicsomkonzerv készítését."]},"agriculture-sun-ripe-farms-extra":{"i":"/poi-images/agriculture-sun-ripe-farms-extra.webp","s":"Eper- és egyéb gyümölcstermesztéséről ismert mezőgazdasági üzem.","f":["Saját présházzal rendelkeznek az olívaolajhoz","A farm a máltai gasztronómiai örökséget őrzi"]},"agriculture-frescos-olive-grove-extra":{"i":"/poi-images/agriculture-frescos-olive-grove-extra.webp","s":"Kiváló minőségű extra szűz olívaolajat előállító olajfaliget.","f":["A liget több száz fát foglal magában, köztük az őshonos Bidni fajtát.","Az olajat hideg sajtolással nyerik ki közvetlenül a szüret után."]},"agriculture-mgarr-strawberry-fields-extra":{"i":"/poi-images/agriculture-mgarr-strawberry-fields-extra.webp","s":"Mgarr környéke híres eperfarmjairól, különösen az éves eperfesztivál idején.","f":["A máltai eper főszezonja áprilisra és május elejére esik.","A 'Festa Frawli' fesztivál évente több ezer látogatót vonz a faluba."]},"agriculture-bahrija-farms-extra":{"i":"/poi-images/agriculture-bahrija-farms-extra.webp","s":"Vidéki terület sok kis gazdasággal, ahol hagyományos gazdálkodást folytatnak.","f":["A bahrijai régió a sziget egyik legtermékenyebb mezőgazdasági területe.","Főként paradicsomot, dinnyét és citrusféléket termesztenek itt."]},"agriculture-emmanuel-delicata-winemaker-extra":{"i":"/poi-images/agriculture-emmanuel-delicata-winemaker-extra.webp","s":"Málta másik vezető, nagy múltú bortermelője, amely borfesztiválokat is rendez.","f":["A borászat már a negyedik generáció óta a család tulajdonában van.","A Delicata borok több mint 100 nemzetközi díjat nyertek eddig."]},"agriculture-farmer-s-deli-bistro-extra":{"i":"/poi-images/agriculture-farmer-s-deli-bistro-extra.webp","s":"Étterem és üzlet, amely a helyi és biotermékek felhasználására összpontosít.","f":["A bisztró 100%-ban minősített bio alapanyagokat használ.","Az étterem egy történelmi máltai villa területén található."]},"agriculture-gozo-artisan-network-extra":{"i":"/poi-images/agriculture-gozo-artisan-network-extra.webp","s":"Kezdeményezés, amely a helyi kézműveseket és élelmiszer-termelőket népszerűsíti Gozón.","f":["A hálózat sajttermelőket, szövőket és méhészeket is magában foglal.","Céljuk a hagyományos termékek közvetlen, közvetítő nélküli értékesítése."]},"agriculture-sammy-s-strawberry-farm-extra":{"i":"/poi-images/agriculture-sammy-s-strawberry-farm-extra.webp","s":"Ismert farm Mgarrban, ahol a látogatók maguk szedhetik az epret.","f":["A szezon általában februártól májusig tart","Mġarr környéki termékeny völgyben fekszik"]},"agriculture-citrus-groves-of-san-anton-extra":{"i":"/poi-images/agriculture-citrus-groves-of-san-anton-extra.webp","s":"A San Anton-palota kertjei híresek öreg citrusfáikról.","f":["A ligetek a máltai elnöki palota kertjének részét képezik.","Néhány narancsfa még a Szent János-lovagrend idejéből származik."]},"agriculture-xwejni-salt-pans-gozo-extra":{"i":"/poi-images/agriculture-xwejni-salt-pans-gozo-extra.webp","s":"Hagyományos sólepárlók, ahol évszázadok óta kézzel gyűjtik a tengeri sót.","f":["A római kor óta használják ezeket a medencéket","A só természetes párolgással jön létre a napon"]},"agriculture-melita-honey-extra":{"i":"/poi-images/agriculture-melita-honey-extra.webp","s":"A helyi flórától egyedi ízű máltai méz termelői.","f":["A mézet főként kakukkfűből, jánoskenyérfából és vadvirágokból nyerik.","A termelés szigorú, hagyományos módszerek betartásával folyik."]},"agriculture-lord- chambray-brewery-gozo-extra":{"i":"/poi-images/agriculture-lord- chambray-brewery-gozo-extra.webp","s":"Az első kézműves sörfőzde Gozón, amely helyi hatásokkal rendelkező söröket készít.","f":["A Lord Chambray 2014-ben nyílt meg Málta első kézműves sörfőzdéjeként.","Az üzem a Gozo szigetén található Xewkija ipari negyedében működik."]},"agriculture-kunserva-factory-gozo-extra":{"i":"/poi-images/agriculture-kunserva-factory-gozo-extra.webp","s":"A 'Kunserva', egy hagyományos máltai paradicsompüré egyik fő gyártója.","f":["A Kunserva egy hagyományos, cukrozott máltai paradicsompüré.","A gyárat a széles körben ismert Magro család üzemelteti."]},"agriculture-olive-oil-tasting-malta-extra":{"i":"/poi-images/agriculture-olive-oil-tasting-malta-extra.webp","s":"Több gazdaság is kínál kóstolót a helyben termelt olívaolajból.","f":["A 'Bidni' fajta egy őshonos olajbogyó, amely csak Máltán terem.","A kóstolókat gyakran közvetlenül az olajfaligetekben tartják."]},"agriculture-rural-herita-ge-trail-dingli-extra":{"i":"/poi-images/agriculture-rural-herita-ge-trail-dingli-extra.webp","s":"Túraútvonal, amely hagyományos gazdaságok és mezőgazdasági tájak mellett vezet el.","f":["Az ösvény 250 méteres magasságból kínál panorámát a tengerre.","A tanösvény történelmi kápolnákat köt össze régi gazdaságokkal."]},"agriculture-the-vegetable-patch-extra":{"i":"/poi-images/agriculture-the-vegetable-patch-extra.webp","s":"Különféle zöldségek termesztésére szakosodott gazdaság.","f":["Kizárólag természetes trágyázást alkalmaznak","A terményeket a rendelés napján szedik le"]},"agriculture-fig-trees-in-xaghra-gozo-extra":{"i":"/poi-images/agriculture-fig-trees-in-xaghra-gozo-extra.webp","s":"Xaghra környéke fügefáiról és fügetermékeiről ismert.","f":["Xaghra Gozo szigetének egyik legtermékenyebb mezőgazdasági területe.","Mind zöld, mind lila fügefajtákat termesztenek a kertekben."]},"agriculture-caper-bushes-of-gozo-extra":{"i":"/poi-images/agriculture-caper-bushes-of-gozo-extra.webp","s":"Gozo híres vadon növő kapribokrjairól, amelyek bimbóit leszedik és tartósítják.","f":["A kapribokrok gyakran közvetlenül a szárazon rakott kőfalakból nőnek.","A virágbimbókat a kora nyári időszakban, kézzel gyűjtik be."]},"agriculture-bee-keeping-experience-extra":{"i":"/poi-images/agriculture-bee-keeping-experience-extra.webp","s":"Több méhész is kínál túrákat, ahol a látogatók többet tudhatnak meg a méztermelésről.","f":["Máltát az ókori görögök Melitének nevezték, ami mézet jelent.","A máltai méh egy egyedülálló, őshonos alfaj a szigeteken."]},"agriculture-bacchus-winery-extra":{"i":"/poi-images/agriculture-bacchus-winery-extra.webp","s":"Étterem és rendezvényhelyszín Mdinában, történelmi borpincével.","f":["A borászat kizárólag helyben termett szőlőfajtákat dolgoz fel.","A pincerendszer egy része történelmi boltozatok alatt található."]},"agriculture-potato-farms-qrendi-extra":{"i":"/poi-images/agriculture-potato-farms-qrendi-extra.webp","s":"Qrendi környéke Málta egyik fő burgonyatermelője, amelyet exportálnak is.","f":["A qrendi burgonyát gyakran évente kétszer is betakarítják.","A szüretelés nagy részét még ma is hagyományosan, kézzel végzik."]},"agriculture-mgarr-local-council-farmers-market-extra":{"i":"/poi-images/agriculture-mgarr-local-council-farmers-market-extra.webp","s":"Kisebb, helyi piac, amely a régióból származó friss mezőgazdasági termékeket kínál.","f":["A piacot rendszeresen Mgarr főterén rendezik meg a helyi tanács alatt.","Szezonális különlegességeket, például epret és dinnyét árulnak itt."]},"industry-playmobil-factory-extra":{"i":"/poi-images/industry-playmobil-factory-extra.webp","s":"A világ egyik legnagyobb Playmobil játékgyártó üzeme.","f":["Minden egyes Playmobil figura Máltán látja meg a napvilágot.","Az üzem több mint 1000 helyi lakosnak ad munkát."]},"industry-farsons-brewery-extra":{"i":"/poi-images/industry-farsons-brewery-extra.webp","s":"Málta legnagyobb italgyártója, a Cisk Lager és a Kinnie gyártója.","f":["Az üzem látogatóközpontja bemutatja a sörfőzés történetét.","A Brewhouse épülete díjnyertes építészeti felújításon esett át."]},"industry-malta-freeport-extra":{"i":"/poi-images/industry-malta-freeport-extra.webp","s":"A Földközi-tenger egyik legfontosabb átrakodó központja.","f":["1988-ban alapították az ország első szabadkikötőjeként.","A terminálok teljes hossza meghaladja a 2 kilométert."]},"industry-rinella-film-studios-extra":{"i":"/poi-images/industry-rinella-film-studios-extra.webp","s":"Víztartályokkal rendelkező filmstúdió, amelyet számos nemzetközi filmprodukcióhoz használnak.","f":["Itt forgatták a 'Gladiátor' és a 'Trója' egyes jeleneteit.","A legnagyobb tartály a tengerpart szélén fekszik."]},"industry-bulebel-industrial-estate-extra":{"i":"/poi-images/industry-bulebel-industrial-estate-extra.webp","s":"Málta egyik legnagyobb ipari parkja, számos gyárnak és vállalatnak ad otthont.","f":["Az ipari park az 1970-es években indult fejlődésnek","Területe folyamatosan bővül az új beruházásokkal"]},"industry-hal-far-industrial-estate-extra":{"i":"/poi-images/industry-hal-far-industrial-estate-extra.webp","s":"Egy másik nagy ipari park a repülőtér közelében.","f":["A terület korábban brit katonai repülőtérként szolgált.","Itt található Málta egyik legnagyobb szabadkötő kikötője."]},"industry-mosta-technopark-extra":{"i":"/poi-images/industry-mosta-technopark-extra.webp","s":"Technológiai és tudásalapú vállalatokra összpontosító ipari park.","f":["Az 1990-es években alapították a technológiai fejlődésért.","Szigorú környezetvédelmi előírások vonatkoznak az üzemekre."]},"industry-lufthansa-technik-malta-extra":{"i":"/poi-images/industry-lufthansa-technik-malta-extra.webp","s":"Fontos repülőgép-karbantartó, -javító és -felújító központ.","f":["A bázison akár Airbus A380-as óriásgépeket is tudnak fogadni.","2002-ben alapították a helyi karbantartó központot."]},"industry-xewkija-industrial-estate-gozo-extra":{"i":"/poi-images/industry-xewkija-industrial-estate-gozo-extra.webp","s":"Gozo szigetének legfontosabb ipari parkja.","f":["Itt található Gozo legnagyobb élelmiszeripari feldolgozója.","Számos helyi startup és kisvállalkozás telephelye."]},"industry-delimara-power-station-extra":{"i":"/poi-images/industry-delimara-power-station-extra.webp","s":"Málta fő erőműve, amely a sziget villamos energiájának nagy részét termeli.","f":["1992-ben kezdték meg a működését a területen.","Jelentős átalakításon esett át a földgáz-alapú termelésre."]},"industry-water-services-corporation-pembroke-extra":{"i":"/poi-images/industry-water-services-corporation-pembroke-extra.webp","s":"Nagy fordított ozmózis üzem, amely a tengervizet ivóvízzé alakítja.","f":["Napi több tízezer köbméter édesvizet állítanak elő.","A máltai vízellátás több mint fele tengervízből származik."]},"industry-malta-shipyards-site-extra":{"i":"/poi-images/industry-malta-shipyards-site-extra.webp","s":"A Grand Harbour történelmi hajógyárai, amelyeket ma hajójavításra használnak.","f":["A 6-os számú dokk akár 300 méteres hajókat is befogad.","A lovagi rend idején is folyt már itt gályaépítés."]},"industry-smartcity-malta-extra":{"i":"/poi-images/industry-smartcity-malta-extra.webp","s":"Technológiai park, amelyet IKT- és médiavállalatok központjának terveztek.","f":["A terület saját sétánnyal és éttermekkel rendelkezik.","Célja a külföldi technológiai befektetések vonzása."]},"industry-kirkop-industrial-area-extra":{"i":"/poi-images/industry-kirkop-industrial-area-extra.webp","s":"Ipari terület, ahol az STMicroelectronics gyára található.","f":["Itt működik a sziget egyik legnagyobb exportőre.","A gyárak precíziós robottechnológiát alkalmaznak."]},"industry-stmicroelectronics-malta-ltd-extra":{"i":"/poi-images/industry-stmicroelectronics-malta-ltd-extra.webp","s":"Jelentős félvezetőgyártó és Málta egyik legfontosabb exportőre.","f":["A gyár naponta több millió mikrochipet bocsát ki.","Szoros kapcsolatban állnak a máltai egyetemmel."]},"industry-quarrying-industry-siggiewi-extra":{"i":"/poi-images/industry-quarrying-industry-siggiewi-extra.webp","s":"Siggiewi és Qrendi környéke a máltai mészkőfejtő ipar központja.","f":["A 'Frankal-kő' a sziget legfontosabb természetes kincse.","Sajátos gépekkel vágják a követ szabályos tömbökre."]},"industry-malta-dairy-products-extra":{"i":"/poi-images/industry-malta-dairy-products-extra.webp","s":"Málta fő tej- és tejtermékgyártója, a Benna márkanévről ismert.","f":["Naponta frissen szállítják a tejet az üzletekbe.","Szövetkezeti alapon működnek a helyi tejtermelőkkel."]},"industry-foster-clark-products-ltd-extra":{"i":"/poi-images/industry-foster-clark-products-ltd-extra.webp","s":"Élelmiszer- és italgyártó vállalat, amely exportra szánt termékek széles skáláját gyártja.","f":["Termékeik több mint 80 országban érhetőek el világszerte.","A San Gwann-i ipari parkban található hatalmas gyáruk."]},"industry-toly-products-extra":{"i":"/poi-images/industry-toly-products-extra.webp","s":"A kozmetikai ipar számára készült luxuscsomagolások vezető gyártója.","f":["A világ legnagyobb sminkmárkáinak szállítanak be.","Máltai gyárukban több százan dolgoznak a gyártósorokon."]},"industry-actavis-factory-extra":{"i":"/poi-images/industry-actavis-factory-extra.webp","s":"Generikus gyógyszereket gyártó nagy gyógyszeripari vállalat.","f":["Több milliárd tablettát gyártanak itt évente","A gyár Bulebel ipari parkjában található"]},"industry-methode-electronics-malta-ltd-extra":{"i":"/poi-images/industry-methode-electronics-malta-ltd-extra.webp","s":"Elektronikai alkatrészek gyártója, elsősorban az autóipar számára.","f":["Több mint 1000 embert foglalkoztatnak a szigeten.","Az üzemben intelligens világítási rendszereket is fejlesztenek."]},"industry-gaming-industry-hub-sliema-st-julians-extra":{"i":"/poi-images/industry-gaming-industry-hub-sliema-st-julians-extra.webp","s":"A terület az online szerencsejáték-ipar központja, amely a máltai gazdaság fontos pillére.","f":["Málta 2004-ben elsőként vezetett be iGaming szabályozást az EU-ban.","A szektor a máltai GDP körülbelül 12-13 százalékát adja."]},"industry-construction-industry-cranes-extra":{"i":"/poi-images/industry-construction-industry-cranes-extra.webp","s":"A látképet építési daruk uralják, ami a szigeten virágzó építőipart tükrözi.","f":["A toronydaruk teherbírása gyakran eléri a 10-12 tonnát.","Különleges alapozást igényelnek a mészköves talajon."]},"industry-go-p-l-c-head-office-extra":{"i":"/poi-images/industry-go-p-l-c-head-office-extra.webp","s":"Málta vezető távközlési szolgáltatójának székháza.","f":["Málta elsőszámú internetszolgáltatója és tévétársasága.","Kiemelt figyelmet fordítanak a kiberbiztonsági központjukra."]},"industry-dedomenico-group-extra":{"i":"/poi-images/industry-dedomenico-group-extra.webp","s":"Változatos profilú vállalat, amely az elektronika, a vendéglátás és az ingatlanpiac területén tevékenykedik.","f":["Kiterjedt ingatlanportfólióval rendelkeznek a szigeteken.","Aktív szereplők a máltai kereskedelmi logisztikai piacon."]},"industry-maltapost-head-office-extra":{"i":"/poi-images/industry-maltapost-head-office-extra.webp","s":"A nemzeti postai szolgáltató központi válogató központja és székháza.","f":["Modern csomagautomata-hálózatot irányítanak innen.","A cég részvényeit a máltai tőzsdén jegyzik."]},"industry-medserv-plc-base-extra":{"i":"/poi-images/industry-medserv-plc-base-extra.webp","s":"Logisztikai és mérnöki szolgáltatásokat nyújtó vállalat a tengeri olaj- és gázipar számára.","f":["A Medservet 1974-ben alapították az olaj- és gázipar kiszolgálására.","A vállalatot 2006-ban vezették be a Máltai Értéktőzsdére."]},"industry-concrete-batching-plants-extra":{"i":"/poi-images/industry-concrete-batching-plants-extra.webp","s":"A sziget több pontján található üzemek betont gyártanak az építőipar számára.","f":["Számítógéppel vezérelt adagolási technológiát alkalmaznak.","A nap 24 órájában képesek kiszolgálni a lakossági igényeket."]},"industry-printing-presses-extra":{"i":"/poi-images/industry-printing-presses-extra.webp","s":"Máltán jól bejáratott nyomdaipar működik, amely könyveket, újságokat és csomagolóanyagokat gyárt.","f":["Az első nyomdagép 1642-ben érkezett meg Máltára.","A Progress Press-t 1921-ben alapították az Allied Group részeként."]},"industry-maghtab-waste-management-complex-extra":{"i":"/poi-images/industry-maghtab-waste-management-complex-extra.webp","s":"Málta legfontosabb, jelenleg rehabilitáció alatt álló hulladékkezelő létesítménye.","f":["Itt található a sziget legmagasabb mesterséges dombja.","Folyamatosan fejlesztik az újrahasznosítási arányokat."]},"port-grand-harbour-valletta-extra":{"i":"/poi-images/port-grand-harbour-valletta-extra.webp","s":"Málta legfontosabb kikötője, egy természetes mélyvízi kikötő, amelyet tengerjáró hajók és teherforgalom használnak.","f":["A kikötőt már a föníciaiak is használták több mint 3000 évvel ezelőtt.","A kikötő medencéjének területe körülbelül 2 négyzetkilométer."]},"port-marsamxett-harbour-extra":{"i":"/poi-images/port-marsamxett-harbour-extra.webp","s":"A második nagy természetes kikötő, amelyet főként jachtok és szabadidős hajók használnak.","f":["Ebben az öbölben található a Manoel-sziget.","Rendszeres kompjárat közlekedik Sliema és Valletta között."]},"port-malta-freeport-birzebbuga-extra":{"i":"/poi-images/port-malta-freeport-birzebbuga-extra.webp","s":"Fontos konténerátrakó kikötő a Földközi-tengeren.","f":["Málta legnagyobb munkaadóinak egyike.","Évente több millió konténert mozgatnak meg itt."]},"port-mgarr-harbour-gozo-extra":{"i":"/poi-images/port-mgarr-harbour-gozo-extra.webp","s":"Gozo fő kikötője, amely kompjárattal köti össze a szigetet Máltával.","f":["A kikötő felett a lourdes-i kápolna látható.","Innen indulnak a buszok a sziget minden pontjára."]},"port-cirkewwa-ferry-terminal-extra":{"i":"/poi-images/port-cirkewwa-ferry-terminal-extra.webp","s":"A kompterminál Málta legészakibb pontján a Gozóra tartó járatokhoz.","f":["A kikötő a Marfa-félsziget csúcsán található.","A Gozo Channel Company üzemelteti a járatokat."]},"port-valletta-waterfront-extra":{"i":"/poi-images/port-valletta-waterfront-extra.webp","s":"A tengerjáró hajó terminál és egy éttermekkel és üzletekkel teli terület történelmi raktárépületekben.","f":["19 darab barokk stílusú történelmi raktárépületből áll.","1752-ben épült Pinto nagymester megrendelésére."]},"port-msida-marina-extra":{"i":"/poi-images/port-msida-marina-extra.webp","s":"Nagy jachtkikötő a Marsamxett kikötőben szabadidős hajók számára.","f":["A kikötő közvetlenül az msidai plébániatemplom mellett van.","Több mint 200 hajó befogadására alkalmas."]},"port-portomaso-marina-st-julians-extra":{"i":"/poi-images/port-portomaso-marina-st-julians-extra.webp","s":"Luxus jachtkikötő a Portomaso komplexum részeként.","f":["A kikötő három különálló medencéből áll.","Itt található a 98 méter magas Portomaso Business Tower."]},"port-manoel-island-yacht-marina-extra":{"i":"/poi-images/port-manoel-island-yacht-marina-extra.webp","s":"Nagy jachtkikötő és hajógyár a Manoel-szigeten.","f":["A kikötőt a Gzira felőli hídon lehet megközelíteni.","Gyakran láthatók itt luxus superjachtok is."]},"port-marsaxlokk-harbour-fishing-village-extra":{"i":"/poi-images/port-marsaxlokk-harbour-fishing-village-extra.webp","s":"Híres a 'Luzzu'-nak nevezett színes halászhajóiról.","f":["A csónakok orrán az Ozirisz-szem látható védelemként.","Ez Málta második legnagyobb természetes kikötője."]},"port-sliema-ferry-service-extra":{"i":"/poi-images/port-sliema-ferry-service-extra.webp","s":"Személyszállító kompjárat, amely Sliemát Vallettával köti össze.","f":["A menetidő mindössze 10-15 percet vesz igénybe.","A kompkikötő a Sliema Ferries városrészben van."]},"port-three-cities-ferry-service-extra":{"i":"/poi-images/port-three-cities-ferry-service-extra.webp","s":"Kompjárat, amely Vallettát a Három Várossal (Birgu, Senglea) köti össze.","f":["A hajók Cospicua (Bormla) kikötőjébe érkeznek.","Útközben elhaladnak a Fort St. Angelo mellett."]},"port-bugibba-jetty-for-boat-trips-extra":{"i":"/poi-images/port-bugibba-jetty-for-boat-trips-extra.webp","s":"Fontos indulási pont a Cominóra és Gozóra tartó turistahajók számára.","f":["Naponta számos kirándulóhajó és komp indul innen.","A móló a Szent Pál-öböl turisztikai régiójának központjában van."]},"port-st-thomas-bay-extra":{"i":"/poi-images/port-st-thomas-bay-extra.webp","s":"Öböl Marsaskalában, amelyet kis halász- és szabadidős hajók használnak.","f":["Az öböl sekély vize miatt a családok kedvence.","Kedvelt helyszín a windszörfösök számára."]},"port-xlendi-bay-gozo-extra":{"i":"/poi-images/port-xlendi-bay-gozo-extra.webp","s":"Festői öböl, amelyet kis csónakok használnak, és népszerű búvárhely.","f":["Az öböl bejáratánál egy 1650-es őrtorony áll.","A part menti sétány a sziklákba van vésve."]},"port-wied-iz-zurrieq-boat-trips-to-blue-grotto-extra":{"i":"/poi-images/port-wied-iz-zurrieq-boat-trips-to-blue-grotto-extra.webp","s":"Kis kikötő, ahonnan hajók indulnak a híres Kék Barlanghoz.","f":["A csónakok egy szűk, természetes csatornán indulnak.","A környék népszerű sziklamászó helyszín is."]},"port-ghadira-bay-boat-rentals-extra":{"i":"/poi-images/port-ghadira-bay-boat-rentals-extra.webp","s":"Mellieha népszerű strandján különféle vízi járművek bérelhetők.","f":["Az öböl vize itt sekély és általában nyugodt.","Jet-ski bérlésére is van lehetőség a parton."]},"port-dwejra-inland-sea-boat-trips-gozo-extra":{"i":"/poi-images/port-dwejra-inland-sea-boat-trips-gozo-extra.webp","s":"Kis csónakok egy sziklaalagúton keresztül hajóznak ki a beltengerről a nyílt tengerre.","f":["A sziklaalagút körülbelül 80 méter hosszú.","A Gombaszikla (Il-Ġebla tal-Ġeneral) 60 méter magas."]},"port-blue-lagoon-ferry-point-comino-extra":{"i":"/poi-images/port-blue-lagoon-ferry-point-comino-extra.webp","s":"A kompok és turistahajók fő kikötőhelye, amelyek a Kék Lagúnába hozzák a látogatókat.","f":["Comino területe mindössze 3,5 négyzetkilométer.","A Szent Mária-torony 1618-ban készült el."]},"port-kalanka-bay-extra":{"i":"/poi-images/port-kalanka-bay-extra.webp","s":"Elzárt öböl, amelyet a helyiek és a kis csónakok használnak.","f":["A Delimara-fok csúcsánál helyezkedik el.","A víz mélysége miatt kedvelt ugróhely."]},"port-spinola-bay-st-julians-extra":{"i":"/poi-images/port-spinola-bay-st-julians-extra.webp","s":"Festői öböl hagyományos halászhajókkal a modern éttermek mellett.","f":["Az öböl partján áll a híres 'Love' szobor.","A vízben sokszor látni úszkáló kacsákat."]},"port-hay-wharf-floriana-extra":{"i":"/poi-images/port-hay-wharf-floriana-extra.webp","s":"A Máltai Fegyveres Erők Tengerészeti Századának bázisa.","f":["A máltai hadsereg tengeri egységeinek központja.","A kikötő a Marsamxett-öböl partján fekszik."]},"port-kalkara-marina-extra":{"i":"/poi-images/port-kalkara-marina-extra.webp","s":"Jachtkikötő a Kalkara-patakban a Nagy Kikötőben.","f":["A kikötő mellett található a Villa Bighi épülete.","Közvetlen kilátás nyílik a Birgu-félszigetre."]},"port-san-giljan-waterpolo-club-extra":{"i":"/poi-images/port-san-giljan-waterpolo-club-extra.webp","s":"Vízilabda klub tengervizes medencével és kikötőhelyekkel.","f":["A klubot 1949-ben alapították a helyiek.","A vízilabdázók szabadtéri medencében edzenek."]},"port-anchor-bay-extra":{"i":"/poi-images/port-anchor-bay-extra.webp","s":"Az öböl, ahol a Popeye Falu található, horgonyzóhelyként is használatos.","f":["Az öböl Málta északnyugati partján, Mellieha közelében fekszik.","A díszletfalu az 1980-as Popeye-musical forgatására készült."]},"port-marsalforn-bay-gozo-extra":{"i":"/poi-images/port-marsalforn-bay-gozo-extra.webp","s":"Népszerű üdülőhely kis halászhajó-kikötővel.","f":["A falu neve a 'marsa' (kikötő) szóból ered.","Télen a tenger gyakran átcsap a gáton."]},"port-ta-xbiex-marina-extra":{"i":"/poi-images/port-ta-xbiex-marina-extra.webp","s":"Málta egyik legnagyobb jachtkikötője, a közelben számos külföldi nagykövetséggel.","f":["Ez a Királyi Máltai Jachtklub (RMYC) otthona.","A kikötőből páratlan kilátás nyílik Vallettára."]},"port-st-georges-bay-boat-charters-extra":{"i":"/poi-images/port-st-georges-bay-boat-charters-extra.webp","s":"A St.","f":["Az öböl Málta bulinegyede, Paceville mellett van.","A charter járatok gyakran egész naposak."]},"port-hondoq-ir-rummien-gozo-extra":{"i":"/poi-images/port-hondoq-ir-rummien-gozo-extra.webp","s":"Kis öböl egy mólóval, amelyet régen kőtömbök szállítására használtak.","f":["A név jelentése 'Gránátalmák árka' máltaiul.","Innen nyílik a legszebb kilátás Cominóra."]},"port-lascaris-wharf-valletta-extra":{"i":"/poi-images/port-lascaris-wharf-valletta-extra.webp","s":"A Nagy Kikötő része, a Felső Barrakka Kertek közelében.","f":["A Lascaris-háborús termek a közelben találhatók.","Itt áll meg a Sliemába tartó kompjárat is."]},"landscape-dingli-cliffs-extra":{"i":"/poi-images/landscape-dingli-cliffs-extra.webp","s":"Málta legmagasabb pontja, ahonnan lélegzetelállító kilátás nyílik a nyílt tengerre.","f":["A nevét Tommaso Dingli híres építészről kapta.","A szikla szélén egy apró, 17. századi Szent Mária-kápolna áll."]},"landscape-blue-grotto-extra":{"i":"/poi-images/landscape-blue-grotto-extra.webp","s":"Hét tengeri barlangból álló komplexum, amely a ragyogó kék vízről ismert.","f":["A barlang fő sziklakapuja több mint 30 méter magas.","A víz a délelőtti órákban mutatja a legszebb kék árnyalatait."]},"landscape-ghajn-tuffieha-bay-extra":{"i":"/poi-images/landscape-ghajn-tuffieha-bay-extra.webp","s":"Gyönyörű homokos strand, agyagos lejtőkkel és sziklákkal körülvéve.","f":["Több mint 200 lépcsőfok vezet le a parkolótól a tengerpartra.","Egy 17. századi lovagi őrtorony magasodik az öböl felett."]},"landscape-golden-bay-extra":{"i":"/poi-images/landscape-golden-bay-extra.webp","s":"Málta egyik legnépszerűbb homokos strandja.","f":["A sziget kevés nagy kiterjedésű homokos strandjának egyike.","Számos vízisport-lehetőséget kínál, például jet-skit is."]},"landscape-ramla-bay-gozo-extra":{"i":"/poi-images/landscape-ramla-bay-gozo-extra.webp","s":"Nagy strand Gozón, híres egyedülálló vöröses homokjáról.","f":["Máltai neve, a 'Ramla l-Ħamra' vörös homokot jelent.","A strand közepén egy fehér Szűz Mária-szobor áll."]},"landscape-dwejra-bay-and-fungus-rock-gozo-extra":{"i":"/poi-images/landscape-dwejra-bay-and-fungus-rock-gozo-extra.webp","s":"Drámai tengerparti képződmény a Beltengerrel és a Gomba-sziklával.","f":["A Gomba-sziklát egykor a máltai lovagrend katonái őrizték.","Egy ritka élősködő növényről kapta a nevét, amit gyógyszernek hittek."]},"landscape-blue-lagoon-comino-extra":{"i":"/poi-images/landscape-blue-lagoon-comino-extra.webp","s":"Híres a kristálytiszta, türkizkék vizéről.","f":["Comino és a parányi Cominotto-sziget között helyezkedik el.","A víz sekély, így kiválóan alkalmas úszásra és sznorkelezésre."]},"landscape-st-peters-pool-extra":{"i":"/poi-images/landscape-st-peters-pool-extra.webp","s":"Természetes sziklamedence, amely népszerű a sziklaugrók körében.","f":["A lapos sziklák kiválóak a napozáshoz.","A helyiek körében rendkívül népszerű a sziklaugrás miatt."]},"landscape-wied-il-ghasri-gozo-extra":{"i":"/poi-images/landscape-wied-il-ghasri-gozo-extra.webp","s":"Elzárt öböl, amely fjordként vágódik be a magas sziklák közé.","f" ,"Sok turista átúszik ide Comino partjaitól a sekély vízen."]},"landscape-mistra-bay-extra":{"i":"/poi-images/landscape-mistra-bay-extra.webp","s":"Védett öböl a Szent Pál-öböl közelében.","f":["A Xemxija melletti mély völgy végén található.","A közelben ókori pun sírok maradványai láthatók."]},"landscape-selmunett-island-st-pauls-islands-extra":{"i":"/poi-images/landscape-selmunett-island-st-pauls-islands-extra.webp","s":"A két Szent Pál-sziget közül a nagyobbik, ahol a hagyomány szerint Pál apostol hajótörést szenvedett.","f":["A hagyomány szerint Pál apostol i.sz. 60-ban itt szenvedett hajótörést.","A szigetek ma lakatlanok, de egykor mezőgazdasági művelés alatt álltak."]},"landscape-b Ghar-hasan-cave-extra":{"i":"/poi-images/landscape-b Ghar-hasan-cave-extra.webp","s":"Nagy tengeri barlang a sziklákon Birzebbuga közelében, egy szaracén kalóz legendájával.","f":["A barlang egy legendás 12. századi szaracénról, Hasanról kapta a nevét.","Málta déli szikláin található, Birżebbuġa közelében."]},"landscape-bahrija-plateau-extra":{"i":"/poi-images/landscape-bahrija-plateau-extra.webp","s":"Vidéki fennsík gyönyörű kilátással és túraútvonalakkal.","f":["Bronzkori települések nyomait találták meg a területen.","Lenyűgöző kilátás nyílik innen a távoli Filfla-szigetre."]},"landscape-lunzjata-valley-fountain-gozo-extra":{"i":"/poi-images/landscape-lunzjata-valley-fountain-gozo-extra.webp","s":"Buján völgy, amelyet természetes forrás táplál, és egész évben zöld.","f":["A völgy egykor a máltai lovagrend privát vadászterülete volt.","Egy történelmi vízvezetékrendszer is áthalad a területen."]},"landscape-victoria-lines-fault-extra":{"i":"/poi-images/landscape-victoria-lines-fault-extra.webp","s":"Természetes geológiai törésvonal, amely mentén a 19.","f":["A vetődés 12 kilométer hosszan szeli át Málta teljes szélességét.","A britek az 1890-es években védőfal építésére használták."]},"landscape-mgarr-ix-xini-valley-gozo-extra":{"i":"/poi-images/landscape-mgarr-ix-xini-valley-gozo-extra.webp","s":"Meredek völgy, amely egy elzárt öbölhöz vezet, amely a 'By the Sea' című film forgatási helyszíne volt.","f":["A völgy egy gyönyörű öbölhöz vezet, amely egykor gályák rejtekhelye volt.","A lovagok által 1661-ben épített őrtorony még mindig őrzi a bejáratot."]},"landscape-marfa-ridge-extra":{"i":"/poi-images/landscape-marfa-ridge-extra.webp","s":"Hegylánc Málta északnyugati végén, kilátással Cominóra és Gozóra.","f":["Itt található a jellegzetes Vörös Torony (Szent Ágota-torony).","Fontos pihenőhely a költöző madarak számára."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
</html>
