*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#060614;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:#0a0a1f;border-bottom:1px solid #ffffff14;position:relative;z-index:5}
header a.back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#ffffff14;color:#fff;text-decoration:none;font-weight:700}
header a.back:active{background:#ffffff28}
header h1{margin:0;font-size:1rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .langs{display:flex;gap:.25rem}
.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.drag{cursor:grabbing}
.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}
.region:hover{fill:#2d3a78}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#000;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#60a5fa}
.poi.g-sight circle{fill:#fbbf24}
.poi.g-nature circle{fill:#22c55e}
.poi.g-history circle{fill:#c084fc}
.poi.g-industry circle{fill:#fb923c}
.poi.g-other circle{fill:#9ca3af}
.poi.dim{opacity:.18}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7;fill:#fff;opacity:1}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:#0d1230;border-top:1px solid #ffffff20;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -10px 40px #00000080}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a{display:flex;align-items:center;gap:.55rem;padding:.55rem .55rem;border-radius:8px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:active{background:#ffffff14}
.popup .list a .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.popup .list a .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup .list a .g{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.popup .list .nl{padding:.6rem;color:#ffffff70;font-size:.85rem;font-style:italic}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}
</style>

mt-garden-serenity":{"i":"/poi-images/poi-mt-garden-serenity.webp","s":"O grădină chinezească autentică.","f":["Cadou din partea Chinei","Pagode și iazuri"]},"poi-mt-st-lucija-church":{"i":"/poi-images/poi-mt-st-lucija-church.webp","s":"Biserica parohială a tinerei comunități.","f":["Design modern","Dedicată Sfintei Lucia"]},"poi-mt-bir-miftuh":{"i":"/poi-images/poi-mt-bir-miftuh.webp","s":"O capelă medievală care a supraviețuit timpului.","f":["Conține fresce rare din secolul XV","Fostă biserică parohială pentru mai multe sate"]},"poi-mt-palazzo-bettina":{"i":"/poi-images/poi-mt-palazzo-bettina.webp","s":"Un palat istoric cu legături cu Napoleon.","f":["Se spune că l-a găzduit pe Napoleon","Frumoasă arhitectură barocă"]},"poi-mt-hypogeum":{"i":"/poi-images/poi-mt-hypogeum.webp","s":"Structură subterană preistorică.","f":["Patrimoniu UNESCO","Număr strict limitat de vizitatori"]},"poi-mt-paola-parish":{"i":"/poi-images/poi-mt-paola-parish.webp","s":"Una dintre cele mai mari biserici din Malta.","f":["Două turnuri clopotniță masive","Poziție dominantă peste Marele Port"]},"poi-mt-manoel-island":{"i":"/poi-images/poi-mt-manoel-island.webp","s":"O mică insulă între Valletta și Sliema.","f":["Găzduiește Fortul Manoel","Loc popular pentru bărci"]},"poi-mt-gzira-promenade":{"i":"/poi-images/poi-mt-gzira-promenade.webp","s":"O faleză plină de viață în portul Marsamxett.","f":["Multe cafenele și iahturi","Conectează Sliema cu Msida"]},"poi-mt-argotti":{"i":"/poi-images/poi-mt-argotti.webp","s":"Cea mai importantă grădină botanică din Malta.","f":["Fondată în secolul XVIII","Vedere spre golful Marsamxett"]},"poi-mt-st-publius":{"i":"/poi-images/poi-mt-st-publius.webp","s":"Una dintre cele mai superbe biserici din Malta, lângă porțile Vallettei.","f":["Faimoasă pentru sărbătoarea de primăvară","Grav avariată în Al Doilea Război Mondial"]},"poi-mt-embassies":{"i":"/poi-images/poi-mt-embassies.webp","s":"Un cartier elegant cu multe ambasade străine.","f":["Vile somptuoase","Cea mai mare densitate de ambasade"]},"poi-mt-gardjola":{"i":"/poi-images/poi-mt-gardjola.webp","s":"O mică grădină în vârful peninsulei Senglea.","f":["Turn de veghe celebru cu ochi și ureche","Vedere panoramică spre Valletta"]},"poi-mt-isla-basilica":{"i":"/poi-images/poi-mt-isla-basilica.webp","s":"Cea mai importantă biserică din Isla.","f":["Găzduiește statuia Sf. Bambinu","Distrusă în război și reconstruită"]},"poi-mt-cospicua-church":{"i":"/poi-images/poi-mt-cospicua-church.webp","s":"O biserică barocă mare care a supraviețuit războiului.","f":["Găzduiește obiecte de argint valoroase","Construită în secolul XVII"]},"poi-mt-st-helen-gate":{"i":"/poi-images/poi-mt-st-helen-gate.webp","s":"O poartă barocă superbă a orașului.","f":["Parte din liniile Santa Margherita","Construită în 1736"]},"poi-mt-villa-guardamangia":{"i":"/poi-images/poi-mt-villa-guardamangia.webp","s":"O vilă istorică unde a locuit regina Elisabeta a II-a.","f":["Reședința reginei între 1949 și 1951","În curs de restaurare"]},"poi-mt-pieta-marina":{"i":"/poi-images/poi-mt-pieta-marina.webp","s":"O marină pitorească în portul Marsamxett.","f":["Sute de iahturi","Faleză frumoasă"]},"poi-mt-msida-church":{"i":"/poi-images/poi-mt-msida-church.webp","s":"O biserică distinctivă la capătul portului.","f":["Dedicată Sf. Iosif","Foarte frumoasă la flux"]},"poi-mt-university":{"i":"/poi-images/poi-mt-university.webp","s":"Cea mai înaltă instituție de învățământ din Malta.","f":["Fondată în 1592","Campusul în Msida (Tal-Qroqq)"]},"poi-mt-fortstangelo":{"i":"/poi-images/poi-mt-fortstangelo.webp","s":"O mare fortăreață în Birgu.","f":["Inima asediului din 1565","Deținut parțial de Ordinul de Malta"]},"poi-mt-inquisitor-palace":{"i":"/poi-images/poi-mt-inquisitor-palace.webp","s":"Unul dintre puținele palate ale inchiziției care au supraviețuit.","f":["Găzduiește muzeul de etnografie","Include celule de închisoare"]},"city-valletta-extra":{"i":"/poi-images/city-valletta-extra.webp","s":"Valletta, capitala magnifică a Maltei, este un muzeu vibrant în aer liber și un sit al Patrimoniului Mondial UNESCO."},"city-sliema-extra":{"i":"/poi-images/city-sliema-extra.webp","s":"Sliema, odinioară o stațiune balneară victoriană elegantă, a devenit unul dintre cele mai dinamice și cosmopolite centre ale Maltei."},"city-st-julians-extra":{"i":"/poi-images/city-st-julians-extra.webp","s":"St."},"city-gzira-extra":{"i":"/poi-images/city-gzira-extra.webp","s":"Gżira, însemnând 'insulă' în malteză, este un oraș situat între Sliema și Msida, cu vedere la Insula Manoel.","f":["Insula Manoel este conectată de Gżira printr-un pod.","O locație importantă pentru porturi de agrement."]},"city-msida-extra":{"i":"/poi-images/city-msida-extra.webp","s":"Msida este un oraș-port aproape de Valletta, cunoscut pentru portul său mare de agrement și pentru Universitatea din Malta.","f":["Numele derivă dintr-un cuvânt arab care înseamnă 'locuința unui pescar'.","Biserica parohială este dedicată Sfântului Iosif."]},"city-ta-xbiex-extra":{"i":"/poi-images/city-ta-xbiex-extra.webp","s":"Ta' Xbiex este un mic oraș cunoscut pentru numeroasele ambasade străine, porturi de agrement și faleza sa pitorească.","f":["Numele înseamnă 'plase', reflectând trecutul său pescăresc.","Găzduiește ambasadele Egiptului, Greciei, Irlandei, Spaniei și altele."]},"city-swieqi-extra":{"i":"/poi-images/city-swieqi-extra.webp","s":"Swieqi este un oraș modern și predominant rezidențial în nord-estul Maltei."},"city-pembroke-extra":{"i":"/poi-images/city-pembroke-extra.webp","s":"Pembroke este unul dintre cele mai tinere orașe din Malta, întinzându-se de-a lungul coastei de nord-est, între St."},"city-san-gwann-extra":{"i":"/poi-images/city-san-gwann-extra.webp","s":"San Ġwann, situat strategic în inima Maltei, este un oraș predominant modern, care a evoluat de la o mică comunitate rurală la un cartier rezidențial și comercial aglomerat."},"city-pieta-extra":{"i":"/poi-images/city-pieta-extra.webp","s":"Pietà, situat pe coasta de nord-est a Maltei, este un oraș care îmbină farmecul unui port liniștit cu proximitatea agitației urbane din Valletta și Msida."},"city-hamrun-extra":{"i":"/poi-images/city-hamrun-extra.webp","s":"Ħamrun este unul dintre cele mai mari și mai aglomerate orașe din districtul Inner Harbour al Maltei."},"city-marsa-extra":{"i":"/poi-images/city-marsa-extra.webp","s":"Situat în capătul interior al Marelui Port, Marsa este un important centru industrial, cu o centrală electrică și un hipodrom.","f":["Numele înseamnă 'port' sau 'ancoraj'.","Găzduiește Clubul Regal de Golf din Malta."]},"city-floriana-extra":{"i":"/poi-images/city-floriana-extra.webp","s":"Floriana este un oraș fortificat și o suburbie a Vallettei, cunoscut pentru piețele sale mari, grădini și magaziile istorice.","f":["Numit după inginerul militar italian Pietro Paolo Florani.","Găzduiește multe clădiri guvernamentale."]},"city-kalkara-extra":{"i":"/poi-images/city-kalkara-extra.webp","s":"Kalkara este un sat pitoresc de-a lungul Marelui Port, care găzduiește Centrul de Științe Esplora și Fortul Ricasoli.","f":["Numele înseamnă 'cuptor de var'.","Pârâul Kalkara oferă un ancoraj sigur pentru bărci."]},"city-vittoriosa-birgu-extra":{"i":"/poi-images/city-vittoriosa-birgu-extra.webp","s":"Birgu, numit și Vittoriosa, este unul dintre Cele Trei Orașe, renumit pentru rolul său vital în timpul Marelui Asediu din 1565.","f":["A fost capitala Maltei înainte de Valletta.","Găzduiește Palatul Inchizitorului."]},"city-senglea-isla-extra":{"i":"/poi-images/city-senglea-isla-extra.webp","s":"Senglea, cunoscută și sub numele de L-Isla, este unul dintre faimoasele Trei Orașe, un oraș fortificat care pătrunde maiestuos în Marele Port."},"city-cospicua-bormla-extra":{"i":"/poi-images/city-cospicua-bormla-extra.webp","s":"Cospicua, sau Bormla, este cel mai mare dintre Cele Trei Orașe, cunoscut pentru docurile și fortificațiile sale impresionante.","f":["Găzduiește liniile istorice Santa Margherita și Cottonera.","A fost puternic bombardat în timpul celui de-al Doilea Război Mondial."]},"city-fgura-extra":{"i":"/poi-images/city-fgura-extra.webp","s":"Fgura este un oraș relativ modern care a crescut rapid după Al Doilea Război Mondial pentru a deveni una dintre principalele zone rezidențiale și comerciale.","f":["Cunoscut pentru biserica sa parohială modernă.","Numele ar putea deriva din 'figură', posibil referindu-se la o statuie."]},"city-paola-extra":{"i":"/poi-images/city-paola-extra.webp","s":"Paola este un centru comercial important în sudul Maltei, renumit pentru Hipogeul din Ħal Saflieni, un sanctuar subteran preistoric.","f":["Numit după Marele Maestru Antoine de Paule.","Hipogeul este un sit al Patrimoniului Mondial UNESCO."]},"city-tarxien-extra":{"i":"/poi-images/city-tarxien-extra.webp","s":"Tarxien este renumit pentru templele sale megalitice, un alt complex preistoric important inclus în Patrimoniul Mondial UNESCO.","f":["Templele datează din aproximativ 3150 î.Hr.","Complexul este format din trei structuri de temple separate."]},"city-luqa-extra":{"i":"/poi-images/city-luqa-extra.webp","s":"Luqa este cel mai bine cunoscut pentru găzduirea Aeroportului Internațional Malta, principala poartă de acces a țării către lume.","f":["Numele înseamnă 'plop' în aramaică.","Biserica parohială este dedicată Sfântului Andrei."]},"city-gudja-extra":{"i":"/poi-images/city-gudja-extra.webp","s":"Gudja este un sat liniștit, aproape de aeroport, cunoscut pentru cele trei biserici ale sale și pentru unicul Palat Bettina.","f":["Una dintre cele mai vechi parohii din Malta.","Biserica parohială a Adormirii Maicii Domnului este cea principală."]},"city-ghaxaq-extra":{"i":"/poi-images/city-ghaxaq-extra.webp","s":"Għaxaq este un mic sat tradițional din sudul Maltei, cunoscut pentru festa sa de sat plină de viață.","f":["Numele înseamnă 'bucurie' sau 'plăcere'.","Festa di Santa Marija este una dintre cele mai mari din Malta."]},"city-santa-lucija-extra":{"i":"/poi-images/city-santa-lucija-extra.webp","s":"Santa Luċija este unul dintre cele mai moderne orașe din Malta, proiectat în anii 1960 și cunoscut pentru Grădina Chineză a Seninătății.","f":["Numit după o capelă din secolul al XVI-lea.","Grădina a fost un dar de la guvernul chinez."]},"city-marsaskala-extra":{"i":"/poi-images/city-marsaskala-extra.webp","s":"Marsaskala este un oraș de coastă construit în jurul unui golf lung și pitoresc, popular printre localnici pentru restaurantele sale de la malul mării.","f":["Numele maltez Wied il-Għajn înseamnă 'Valea Izvorului'.","Găzduiește Turnul Sf. Toma, o mare fortificație Wignacourt."]},"city-marsaxlokk-extra":{"i":"/poi-images/city-marsaxlokk-extra.webp","s":"Marsaxlokk este un sat pescăresc tradițional, renumit pentru marea sa piață de duminică și pentru bărcile colorate 'Luzzu'.","f":["Numele înseamnă 'portul de sud-est'.","Bărcile Luzzu sunt pictate cu Ochiul lui Osiris pentru a le proteja de rău."]},"city-birzebbuga-extra":{"i":"/poi-images/city-birzebbuga-extra.webp","s":"Birżebbuġa este un oraș de coastă din sud, cunoscut pentru plaja sa de nisip, Pretty Bay, și pentru proximitatea față de Portul Liber Malta.","f":["Numele înseamnă 'fântâna măslinilor'.","Għar Dalam, o peșteră preistorică, se află în apropiere."]},"city-zabbar-extra":{"i":"/poi-images/city-zabbar-extra.webp","s":"Żabbar, purtând titlul onorific de Città Hompesch, este unul dintre cele mai mari orașe din sud-estul Maltei, cu o istorie bogată și o identitate locală puternică."},"city-xghajra-extra":{"i":"/poi-images/city-xghajra-extra.webp","s":"Xgħajra este un mic oraș de coastă cunoscut pentru promenada sa lungă, coasta stâncoasă și fortificațiile britanice bine conservate.","f":["Numele este posibil legat de un teren deschis, sterp.","Oferă vederi ample ale mării deschise."]},"city-zejtun-extra":{"i":"/poi-images/city-zejtun-extra.webp","s":"Żejtun, purtând titlul de Città Beland, este unul dintre cele mai vechi orașe din Malta, situat în sud-estul insulei."},"city-qrendi-extra":{"i":"/poi-images/city-qrendi-extra.webp","s":"Qrendi este un sat liniștit și pitoresc din sudul Maltei, încărcat de o profundă semnificație istorică și naturală."},"city-mqabba-extra":{"i":"/poi-images/city-mqabba-extra.webp","s":"Mqabba este renumit pentru carierele sale de piatră, care extrag calcarul globigerina de înaltă calitate, și pentru catacombele sale paleocreștine.","f":["Un furnizor important de materiale de construcție în Malta.","Catacombele Ta' Mintna sunt un sit arheologic important."]},"city-kirkop-extra":{"i":"/poi-images/city-kirkop-extra.webp","s":"Kirkop este un mic sat de lângă aeroport, cunoscut pentru menhirul său și alte vestigii arheologice minore.","f":["Numele este posibil o corupere a lui 'Kerkop' (un nume de familie).","Găzduiește o mare fabrică STMicroelectronics."]},"city-safi-extra":{"i":"/poi-images/city-safi-extra.webp","s":"Safi este un sat mic și liniștit din sudul Maltei, care și-a păstrat caracterul rural autentic."},"city-zurrieq-extra":{"i":"/poi-images/city-zurrieq-extra.webp","s":"Żurrieq este unul dintre cele mai vechi orașe din Malta, cunoscut pentru Grota Albastră, moara de vânt Xarolla și catacombele sale.","f":["Numele ar putea deriva din 'zoroq', cuvântul arab pentru 'albastru'.","Biserica parohială este dedicată Sfintei Ecaterina din Alexandria."]},"city-siggiewi-extra":{"i":"/poi-images/city-siggiewi-extra.webp","s":"Siġġiewi este un oraș rural cunoscut pentru câmpurile sale vaste, ferme și proximitatea față de Grădinile Buskett și Stâncile Dingli.","f":["A primit titlul 'Città Ferdinand' de la Marele Maestru Ferdinand von Hompesch.","Biserica parohială este dedicată Sfântului Nicolae."]},"city-zebbug-malta-extra":{"i":"/poi-images/city-zebbug-malta-extra.webp","s":"Żebbuġ, cunoscut și sub numele de Città Rohan, este unul dintre cele mai vechi orașe din Malta, renumit pentru biserica sa parohială grandioasă și pentru festivitățile sale.","f":["Numele înseamnă 'măsline'.","Se sărbătoresc trei festivaluri de sat separate."]},"city-qormi-extra":{"i":"/poi-images/city-qormi-extra.webp","s":"Qormi, cunoscut și sub titlul onorific de Città Pinto, este unul dintre cele mai mari și mai bogate orașe din punct de vedere istoric din Malta."},"city-rabat-malta-extra":{"i":"/poi-images/city-rabat-malta-extra.webp","s":"Rabat, al cărui nume provine din cuvântul arab pentru „suburbie”, este un oraș încărcat de istorie, legat indestructibil de vecinul său celebru, orașul fortificat Mdina."},"city-dingli-extra":{"i":"/poi-images/city-dingli-extra.webp","s":"Dingli este situat în cel mai înalt punct al Maltei și este renumit pentru stâncile sale dramatice, care oferă vederi uluitoare la Marea Mediterană.","f":["Stâncile Dingli se ridică la aproximativ 253 de metri deasupra nivelului mării.","Găzduiește mica și izolată Capelă Sf. Maria Magdalena."]},"city-attard-extra":{"i":"/poi-images/city-attard-extra.webp","s":"Attard, parte a 'Celor Trei Sate' împreună cu Balzan și Lija, este cunoscut pentru vilele, grădinile și Palatul prezidențial San Anton.","f":["Numele ar putea însemna 'flori'.","Palatul San Anton este reședința oficială a Președintelui Maltei."]},"city-balzan-extra":{"i":"/poi-images/city-balzan-extra.webp","s":"Balzan este un sat fermecător și pitoresc, unul dintre 'Cele Trei Sate', cunoscut pentru aleile sale liniștite și casele elegante.","f":["Biserica parohială este dedicată Bunei Vestiri.","Inițial un mic grup de ferme."]},"city-lija-extra":{"i":"/poi-images/city-lija-extra.webp","s":"Lija, ultimul dintre 'Cele Trei Sate', este renumit pentru tradiția sa de focuri de artificii, grădinile de citrice și distinctivul Turn Belvedere.","f":["Sărbătoarea anuală a Schimbării la Față este renumit pentru focurile de artificii.","Găzduiește mai multe vile mari aparținând nobilimii malteze."]},"city-iklin-extra":{"i":"/poi-images/city-iklin-extra.webp","s":"Iklin este o localitate relativ nouă care s-a dezvoltat dintr-o zonă rurală într-un oraș rezidențial modern, învecinat cu Lija și Birkirkara.","f":["Numele ar putea deriva de la planta rozmarin (klin).","Un sit megalitic a fost descoperit în anii 1960, dar ulterior distrus."]},"city-mosta-extra":{"i":"/poi-images/city-mosta-extra.webp","s":"Mosta este renumit pentru Rotunda sa, cunoscută în mod obișnuit ca Domul din Mosta, care are una dintre cele mai mari cupole ne-susținute din lume.","f":["În timpul celui de-al Doilea Război Mondial, o bombă a căzut prin cupolă, dar nu a explodat.","Biserica este dedicată Adormirii Maicii Domnului."]},"city-naxxar-extra":{"i":"/poi-images/city-naxxar-extra.webp","s":"Naxxar este un oraș mare în centrul-nordul Maltei, cunoscut pentru opulentul Palat Parisio și grădinile sale.","f":["Legenda spune că locuitorii din Naxxar au fost primii care l-au ajutat pe Sfântul Pavel.","Numele ar putea deriva din 'nassar' (a converti)."]},"city-gharghur-extra":{"i":"/poi-images/city-gharghur-extra.webp","s":"Għargħur este unul dintre cele mai mici și mai vechi sate din Malta, situat pe un deal cu vedere la coastă.","f":["Cunoscut pentru punctul de belvedere 'Top of the World'.","Își păstrează în mare parte nucleul original al satului."]},"city-mellieha-extra":{"i":"/poi-images/city-mellieha-extra.webp","s":"Mellieħa este un sat mare în nord, renumit pentru cea mai mare plajă de nisip din Malta, Golful Mellieħa (Golful Għadira).","f":["Sanctuarul Maicii Domnului din Mellieħa este un altar național.","Găzduiește Popeye Village, platoul de filmare al filmului din 1980."]},"city-st-pauls-bay-extra":{"i":"/poi-images/city-st-pauls-bay-extra.webp","s":"St.","f":["Una dintre cele mai mari localități din Regiunea de Nord.","Găzduiește Acvariul Național din Malta."]},"city-bugibba-extra":{"i":"/poi-images/city-bugibba-extra.webp","s":"Buġibba este un oraș de coastă vibrant din nord-estul Maltei și, împreună cu Qawra și St."},"city-qawra-extra":{"i":"/poi-images/city-qawra-extra.webp","s":"Qawra este o stațiune adiacentă Buġibba, cunoscută pentru hotelurile sale, Acvariul Național din Malta și Parcul Natural Salina.","f":["Turnul Qawra este un turn de veghe istoric.","Popular pentru sporturi nautice și scufundări."]},"city-mgarr-malta-extra":{"i":"/poi-images/city-mgarr-malta-extra.webp","s":"Mġarr este un sat rural în nord-vestul Maltei, înconjurat de terenuri agricole și cunoscut pentru templele preistorice Ta' Ħaġrat și Skorba.","f":["Renumit pentru producția sa de căpșuni.","Găzduiește un festival anual al căpșunilor (Festa Frawli)."]},"city-victoria-rabat-gozo-extra":{"i":"/poi-images/city-victoria-rabat-gozo-extra.webp","s":"Victoria, cunoscută și sub numele de Rabat, este capitala insulei Gozo, cu vechea sa cetate fortificată (Cittadella) în centru.","f":["Numit după regina britanică Victoria în 1887.","Cetatea oferă vederi panoramice de 360 de grade asupra Gozo."]},"city-xewkija-extra":{"i":"/poi-images/city-xewkija-extra.webp","s":"Xewkija este unul dintre cele mai vechi sate de pe Gozo, dominat de cupola masivă a bisericii sale rotonde, dedicată Sfântului Ioan Botezătorul.","f":["Cupola sa este una dintre cele mai mari din Europa.","Numele derivă din cuvântul arab pentru 'spini'."]},"city-nadur-extra":{"i":"/poi-images/city-nadur-extra.webp","s":"Situat pe un platou în estul Gozo, Nadur este renumit pentru carnavalul său plin de viață, influența sa maritimă și Turnul Ta' Kenuna.","f":["Numele înseamnă 'punct de observație'.","Carnavalul din Nadur este atât macabru, cât și satiric."]},"city-ghajnsielem-extra":{"i":"/poi-images/city-ghajnsielem-extra.webp","s":"Għajnsielem este primul sat pe care îl văd vizitatorii pe Gozo, deoarece are vedere la portul Mġarr, punctul de sosire al feribotului din Malta.","f":["Numele înseamnă 'Izvor Pașnic'.","Găzduiește Fort Chambray, o fortăreață mare."]},"city-qala-extra":{"i":"/poi-images/city-qala-extra.webp","s":"Qala, cel mai estic sat de pe insula Gozo, este un loc de o frumusețe senină și priveliști uluitoare."},"city-gharb-extra":{"i":"/poi-images/city-gharb-extra.webp","s":"Għarb este un sat tradițional în vestul Gozo, cunoscut pentru biserica sa parohială pitorească, muzeul de folclor și Sanctuarul Ta' Pinu.","f":["Numele înseamnă 'vest'.","Bazilica Vizitării este o bijuterie barocă."]},"city-san-lawrenz-extra":{"i":"/poi-images/city-san-lawrenz-extra.webp","s":"San Lawrenz este un sat idilic pe coasta de vest a insulei Gozo, renumit pentru liniștea, farmecul tradițional și mediul natural spectaculos."},"city-xlendi-extra":{"i":"/poi-images/city-xlendi-extra.webp","s":"Xlendi, amplasat într-un golf pitoresc, asemănător unui fiord, pe coasta de sud-vest a insulei Gozo, este un fermecător fost sat pescăresc, transformat într-o stațiune populară."},"city-munxar-extra":{"i":"/poi-images/city-munxar-extra.webp","s":"Munxar, unul dintre cele mai mici sate din Gozo, oferă o fereastră autentică către viața rurală malteză, departe de agitația stațiunilor de pe coastă."},"city-sannat-extra":{"i":"/poi-images/city-sannat-extra.webp","s":"Sannat este un sat liniștit și tradițional în sudul insulei Gozo."},"city-fontana-extra":{"i":"/poi-images/city-fontana-extra.webp","s":"Fontana, cunoscută și sub numele de 'Triq tal-Għajn' (Strada Izvorului), este un mic sat de lângă Victoria, renumit pentru izvoarele sale care curg mereu.","f":["Localnicii foloseau adăposturile cu arcade pentru a-și spăla rufele.","Biserica parohială este dedicată Preasfintei Inimi a lui Iisus."]},"city-kercem-extra":{"i":"/poi-images/city-kercem-extra.webp","s":"Kerċem este un sat la vest de Victoria, situat în pitoreasca Vale Lunzjata, cunoscut pentru peisajul său rural.","f":["Cătunul Santa Luċija este cunoscut pentru atmosfera sa liniștită.","Sărbătoarea anuală a Sfântului Grigore este un eveniment tradițional important."]},"city-xaghra-extra":{"i":"/poi-images/city-xaghra-extra.webp","s":"Xagħra este un sat mare de pe Gozo, renumit pentru templele Ġgantija, sit al Patrimoniului Mondial UNESCO, Peștera Calypso și Golful Ramla.","f":["Templele Ġgantija sunt printre cele mai vechi structuri de sine stătătoare din lume.","Golful Ramla este cunoscut pentru nisipul său unic roșiatic-auriu."]},"city-zebbug-gozo-extra":{"i":"/poi-images/city-zebbug-gozo-extra.webp","s":"Situat pe un deal în nordul Gozo, Żebbuġ este renumit pentru priveliștile sale uimitoare, zăcămintele de onix și coasta pitorească.","f":["Numele înseamnă 'măslin sălbatic'.","Coasta include salinele Xwejni."]},"city-ghasri-extra":{"i":"/poi-images/city-ghasri-extra.webp","s":"Għasri este cel mai mic sat de pe Gozo, cunoscut pentru Wied il-Għasri, un golf izolat asemănător unui fiord, și pentru Farul Giordan.","f":["Wied il-Għasri este un loc popular pentru scufundări.","Farul Giordan oferă priveliști spectaculoase."]},"city-marsalforn-extra":{"i":"/poi-images/city-marsalforn-extra.webp","s":"Marsalforn este cea mai populară stațiune de pe Gozo, cunoscută pentru promenada sa plină de viață, restaurante și saline.","f":["Odată un port important pe Gozo.","Salinele de-a lungul coastei sunt încă în uz astăzi."]},"city-mtarfa-extra":{"i":"/poi-images/city-mtarfa-extra.webp","s":"Mtarfa este un mic oraș cu vedere la Mdina, cunoscut pentru trecutul său ca barăci militare britanice și pentru turnul său cu ceas distinctiv.","f":["Spitalul Marinei Regale este o clădire mare, protejată.","Turnul cu ceas a fost construit în 1895."]},"animal-habitat-ghadira-nature-reserve-extra":{"i":"/poi-images/animal-habitat-ghadira-nature-reserve-extra.webp","s":"O importantă rezervație de păsări și zonă umedă, în special în timpul sezoanelor de migrație a păsărilor.","f":["Cea mai mare zonă umedă rămasă în arhipelagul maltez","Declarată oficial rezervație naturală în anul 1980"]},"animal-habitat-simar-nature-reserve-extra":{"i":"/poi-images/animal-habitat-simar-nature-reserve-extra.webp","s":"O altă zonă umedă importantă lângă Xemxija, care oferă habitat pentru păsări și alte animale sălbatice.","f":["Lucrările de restaurare a zonei umede au început în anul 1992.","Situl a fost desemnat oficial ca zonă Ramsar în anul 1996."]},"animal-habitat-buskett-gardens-extra":{"i":"/poi-images/animal-habitat-buskett-gardens-extra.webp","s":"Una dintre puținele zone împădurite din Malta, casă pentru multe specii de păsări și insecte.","f":["Găzduiește anual festivalul folcloric L-Imnarja","Include livezi de portocali și lămâi vechi"]},"animal-habitat-filfla-island-extra":{"i":"/poi-images/animal-habitat-filfla-island-extra.webp","s":"O insulă mică, nelocuită, care este o importantă arie protejată pentru păsările marine, în special pentru furtunarul mediteranean.","f":["Insula a fost o țintă pentru exerciții de bombardament timp de peste 100 de ani.","A primit protecție deplină prin Legea Rezervației Naturale Filfla din 1988."]},"animal-habitat-ta-cenc-cliffs-gozo-extra":{"i":"/poi-images/animal-habitat-ta-cenc-cliffs-gozo-extra.webp","s":"Aceste stânci de pe Gozo sunt un loc important de cuibărit pentru coloniile de păsări marine.","f":["Peste 1000 de perechi de pufini cuibăresc aici","Zona include monumente megalitice importante"]},"animal-habitat-dwejra-bay-gozo-extra":{"i":"/poi-images/animal-habitat-dwejra-bay-gozo-extra.webp","s":"O arie marină protejată, cunoscută pentru viața sa marină bogată și biodiversitate.","f":["Include faimoasa gaură de scufundări Blue Hole","Turnul Dwejra a fost construit în 1652 de cavaleri"]},"animal-habitat-l-rdum-tal-madonna-extra":{"i":"/poi-images/animal-habitat-l-rdum-tal-madonna-extra.webp","s":"O arie protejată cunoscută pentru colonia sa de furtunari mediteraneeni.","f":["Sunt implementate măsuri de control al dăunătorilor","Vârful stâncii oferă priveliști spre insula Gozo"]},"animal-habitat-salina-nature-park-extra":{"i":"/poi-images/animal-habitat-salina-nature-park-extra.webp","s":"Saline restaurate care acum servesc drept zonă umedă pentru păsări.","f":["Salinele au fost construite în secolul al XVI-lea","Include zone de picnic și locuri de joacă"]},"animal-habitat-st-pauls-islands-extra":{"i":"/poi-images/animal-habitat-st-pauls-islands-extra.webp","s":"Două insule mici care sunt un refugiu pentru animale sălbatice, inclusiv șopârla de ziduri malteză endemică.","f":["Statuia Sfântului Paul are 4 metri înălțime pe un piedestal de 8 metri.","Insulele au fost folosite de armata britanică pentru supraveghere defensivă."]},"animal-habitat-comino-bird-sanctuary-extra":{"i":"/poi-images/animal-habitat-comino-bird-sanctuary-extra.webp","s":"Întreaga insulă Comino este un sanctuar pentru păsări și un important loc de popas pentru păsările migratoare.","f":["Comino este numită după semințele de chimion care creșteau sălbatic acolo.","Insula are o populație permanentă de doar câteva persoane."]},"animal-habitat-malta-falconry-centre-extra":{"i":"/poi-images/animal-habitat-malta-falconry-centre-extra.webp","s":"Un centru dedicat conservării și reproducerii păsărilor de pradă.","f":["Găzduiește specii de bufnițe nocturne fascinante","Programele includ dresajul etic al păsărilor"]},"animal-habitat-tal-maghluq-marsaxlokk-extra":{"i":"/poi-images/animal-habitat-tal-maghluq-marsaxlokk-extra.webp","s":"O mlaștină salmastră cunoscută pentru flora și fauna sa specializată.","f":["Speciile de pești includ rarisimul Aphanius fasciatus","Rezervația este afectată de urbanizarea din jur"]},"animal-habitat-wied-ghollieqa-nature-reserve-extra":{"i":"/poi-images/animal-habitat-wied-ghollieqa-nature-reserve-extra.webp","s":"Un ecosistem de vale mic, dar important, aproape de Universitatea din Malta.","f":["Adăpostește numeroase specii de lilieci în peșteri","Vegetația include măslini sălbatici și roșcovi"]},"animal-habitat-l-ahrax-tal-mellieha-extra":{"i":"/poi-images/animal-habitat-l-ahrax-tal-mellieha-extra.webp","s":"O zonă împădurită care oferă habitat pentru diverse specii și este populară printre camperi.","f":["Platoul găzduiește una dintre cele mai mari colonii de furtunari din Malta.","Coral Lagoon este o peșteră prăbușită cu un diametru de aproximativ 15 metri."]},"animal-habitat-petting-farm-ta-qali-extra":{"i":"/poi-images/animal -s-strawberry-farm-extra.webp","s":"O fermă cunoscută în Mgarr, unde vizitatorii își pot culege propriile căpșuni.","f":["Sezonul de recoltare începe de obicei în februarie","Ferma promovează metode de agricultură sustenabilă"]},"agriculture-citrus-groves-of-san-anton-extra":{"i":"/poi-images/agriculture-citrus-groves-of-san-anton-extra.webp","s":"Grădinile Palatului San Anton sunt renumite pentru citricele lor vechi.","f":["Livezile fac parte din grădinile palatului prezidențial maltez.","Unii portocali datează din perioada Cavalerilor Sfântului Ioan."]},"agriculture-xwejni-salt-pans-gozo-extra":{"i":"/poi-images/agriculture-xwejni-salt-pans-gozo-extra.webp","s":"Saline tradiționale unde sarea de mare este recoltată manual de secole.","f":["Sarea este colectată cu perii și lopeți din lemn","Evaporarea apei durează câteva săptămâni vara"]},"agriculture-melita-honey-extra":{"i":"/poi-images/agriculture-melita-honey-extra.webp","s":"Producători de miere malteză, cunoscută pentru aroma sa unică derivată din flora locală.","f":["Mierea este extrasă din flori de cimbru, roșcov și flori sălbatice.","Producția urmează metode tradiționale riguros controlate."]},"agriculture-lord- chambray-brewery-gozo-extra":{"i":"/poi-images/agriculture-lord- chambray-brewery-gozo-extra.webp","s":"Prima fabrică de bere artizanală de pe Gozo, care produce o gamă de beri cu influențe locale.","f":["Berăria a fost deschisă în 2014, fiind pionierul segmentului craft în Malta.","Unitatea de producție este localizată în zona industrială Xewkija din Gozo."]},"agriculture-kunserva-factory-gozo-extra":{"i":"/poi-images/agriculture-kunserva-factory-gozo-extra.webp","s":"Un producător important de 'Kunserva', o pastă de tomate tradițională malteză.","f":["Kunserva este o pastă de tomate tradițională, ușor îndulcită.","Fabrica este operată de cunoscuta familie de antreprenori Magro."]},"agriculture-olive-oil-tasting-malta-extra":{"i":"/poi-images/agriculture-olive-oil-tasting-malta-extra.webp","s":"Mai multe ferme oferă degustări ale uleiului lor de măsline produs local.","f":["Soiul 'Bidni' este o măslină endemică, cultivată doar în Malta.","Degustările sunt organizate adesea chiar în mijlocul livezilor."]},"agriculture-rural-herita-ge-trail-dingli-extra":{"i":"/poi-images/agriculture-rural-herita-ge-trail-dingli-extra.webp","s":"Un traseu de drumeție care trece pe lângă ferme tradiționale și peisaje agricole.","f":["Traseul oferă panorame de la o înălțime de 250 de metri deasupra mării.","Conectează capele istorice cu ferme tradiționale încă funcționale."]},"agriculture-the-vegetable-patch-extra":{"i":"/poi-images/agriculture-the-vegetable-patch-extra.webp","s":"O fermă specializată în cultivarea unei varietăți de legume.","f":["Ferma folosește metode de irigare prin picurare","Produce o varietate mare de salate și ierburi"]},"agriculture-fig-trees-in-xaghra-gozo-extra":{"i":"/poi-images/agriculture-fig-trees-in-xaghra-gozo-extra.webp","s":"Zona din jurul Xaghra este cunoscută pentru smochinii săi și producția de produse din smochine.","f":["Xaghra este considerată una dintre cele mai fertile zone din Gozo.","Sunt cultivate atât soiuri de smochine verzi, cât și violete."]},"agriculture-caper-bushes-of-gozo-extra":{"i":"/poi-images/agriculture-caper-bushes-of-gozo-extra.webp","s":"Gozo este renumit pentru arbuștii săi de capere care cresc sălbatic, ai căror muguri sunt recoltați și conservați.","f":["Arbuștii cresc adesea direct din crăpăturile zidurilor vechi de piatră.","Mugurii florali sunt recoltați manual în timpul verii timpurii."]},"agriculture-bee-keeping-experience-extra":{"i":"/poi-images/agriculture-bee-keeping-experience-extra.webp","s":"Mai mulți apicultori oferă tururi unde vizitatorii pot învăța despre producția de miere.","f":["Grecii antici au numit Malta Melite, ceea ce înseamnă miere.","Albina malteză este o subspecie endemică și unică a arhipelagului."]},"agriculture-bacchus-winery-extra":{"i":"/poi-images/agriculture-bacchus-winery-extra.webp","s":"Un restaurant și loc de evenimente în Mdina, cu o cramă istorică.","f":["Crama utilizează exclusiv soiuri de struguri cultivate local.","Facilitățile de depozitare includ pivnițe istorice boltite."]},"agriculture-potato-farms-qrendi-extra":{"i":"/poi-images/agriculture-potato-farms-qrendi-extra.webp","s":"Regiunea din jurul Qrendi este unul dintre principalii producători de cartofi din Malta, care sunt și exportați.","f":["Cartofii din Qrendi sunt recoltați adesea de două ori pe an.","Culesul se realizează în mare parte manual, prin metode tradiționale."]},"agriculture-mgarr-local-council-farmers-market-extra":{"i":"/poi-images/agriculture-mgarr-local-council-farmers-market-extra.webp","s":"O piață locală mai mică, care oferă produse agricole proaspete din regiune.","f":["Piața este organizată periodic în piața centrală din satul Mgarr.","Se vând specialități de sezon, cum ar fi căpșunile și pepenii."]},"industry-playmobil-factory-extra":{"i":"/poi-images/industry-playmobil-factory-extra.webp","s":"Una dintre cele mai mari unități de producție pentru jucăriile Playmobil la nivel mondial.","f":["Procesul de fabricație este complet automatizat.","Găzduiește un magazin și un spațiu de joacă tematic."]},"industry-farsons-brewery-extra":{"i":"/poi-images/industry-farsons-brewery-extra.webp","s":"Cel mai mare producător de băuturi din Malta, producătorul Cisk Lager și Kinnie.","f":["Utilizează rețete tradiționale adaptate gusturilor moderne.","Clădirea istorică este un exemplu de arhitectură industrială."]},"industry-malta-freeport-extra":{"i":"/poi-images/industry-malta-freeport-extra.webp","s":"Unul dintre cele mai importante hub-uri de transbordare din Mediterana.","f":["Capabil să proceseze nave cargo cu mii de containere.","Dotat cu terminale specializate pentru petrol și gaze."]},"industry-rinella-film-studios-extra":{"i":"/poi-images/industry-rinella-film-studios-extra.webp","s":"Un studio de film cu rezervoare de apă, folosit pentru multe producții cinema const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
