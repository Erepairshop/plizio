*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#060614;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:#0a0a1f;border-bottom:1px solid #ffffff14;position:relative;z-index:5}
header a.back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#ffffff14;color:#fff;text-decoration:none;font-weight:700}
header a.back:active{background:#ffffff28}
header h1{margin:0;font-size:1rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .langs{display:flex;gap:.25rem}
.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;background-image:radial-gradient(1.2px 1.2px at 12% 22%,#ffffff70,transparent),radial-gradient(1px 1px at 28% 68%,#ffffff55,transparent),radial-gradient(1.4px 1.4px at 47% 38%,#cfe4ff66,transparent),radial-gradient(1px 1px at 63% 18%,#ffffff50,transparent),radial-gradient(1.3px 1.3px at 78% 72%,#ffffff66,transparent),radial-gradient(1px 1px at 88% 33%,#cfe4ff55,transparent),radial-gradient(1px 1px at 38% 88%,#ffffff44,transparent),radial-gradient(1.2px 1.2px at 92% 58%,#ffffff55,transparent);background-repeat:no-repeat}
#svg{width:100%;height:100%;display:block;cursor:grab;position:relative;z-index:1}
#svg.drag{cursor:grabbing}
.region{fill:#161e3a;stroke:#6f9bf0;stroke-width:1.1;stroke-opacity:.7;transition:fill .15s}
.region:hover{fill:#28356e}
/* Island maps: the single island shape is decorative — don't let it grab taps
   (no sticky hover-highlight on touch, POI markers stay easy to tap). Pan still
   works via the svg background. */
#gR.noint .region{pointer-events:none}
#gR.noint .region:hover{fill:#161e3a}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#0a0f20;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#7cc0ff;filter:drop-shadow(0 0 2.4px #4aa6ff)}
.poi.g-sight circle{fill:#fcd34d;filter:drop-shadow(0 0 2.4px #f5b528)}
.poi.g-nature circle{fill:#4ade80;filter:drop-shadow(0 0 2.4px #22c55e)}
.poi.g-history circle{fill:#d0a6ff;filter:drop-shadow(0 0 2.4px #b266ff)}
.poi.g-industry circle{fill:#ffb066;filter:drop-shadow(0 0 2.4px #fb923c)}
.poi.g-other circle{fill:#b8c0cc;filter:drop-shadow(0 0 2px #9ca3af)}
.poi.dim{opacity:.16;pointer-events:none}
.poi.dim circle{filter:none}
.poi,.cluster{transition:opacity .2s}
#svg.dim-pois .poi,#svg.dim-pois .cluster{opacity:.1!important}
#svg.dim-pois .poi circle{filter:none}
.poi.match{pointer-events:auto}
.poi.match circle{stroke:#fff;stroke-width:2;filter:drop-shadow(0 0 4px #fff)}
.poi:hover circle,.poi.active circle{r:7.5;fill:#fff;opacity:1;filter:drop-shadow(0 0 6px #cfeaff) drop-shadow(0 0 11px #7fd0ff)}
.poi-metro{cursor:pointer}
.poi-metro .pm-halo{fill:#ffd54a;opacity:.18;animation:pmpulse 2.2s ease-in-out infinite}
.poi-metro .pm-ring{fill:none;stroke:#ffd54a;stroke-width:1.6;opacity:.85}
.poi-metro .pm-dot{fill:#fff;filter:drop-shadow(0 0 5px #ffd54a)}
.poi-metro .pm-label{fill:#fff;font-size:11px;font-weight:800;paint-order:stroke;stroke:#06061b;stroke-width:3.2px;stroke-linejoin:round;letter-spacing:.2px}
.poi-metro:hover .pm-ring,.poi-metro:focus .pm-ring{stroke-width:2.4;opacity:1}
.poi-metro:hover .pm-label{fill:#ffe98a}
@keyframes pmpulse{0%,100%{opacity:.16;transform:scale(1)}50%{opacity:.34;transform:scale(1.18)}}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:rgba(11,19,35,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(120,180,255,.3);border-radius:18px 18px 0 0;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -12px 44px rgba(0,0,0,.6)}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a,.popup .list .nl{display:flex;align-items:center;gap:.6rem;padding:.4rem .45rem;border-radius:10px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:hover,.popup .list a:active{background:rgba(120,180,255,.12)}
.popup .list .lthumb{width:42px;height:42px;border-radius:9px;flex-shrink:0;background:#1a2740 center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.popup .list .lthumb .dot{width:9px;height:9px;border-radius:50%}
.popup .list .lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.popup .list .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.popup .list .g{font-size:.64rem;color:#9fc4ff;text-transform:uppercase;letter-spacing:.04em}
.popup .list .lgo{color:#7fb0ff;font-size:1.2rem;font-weight:700;flex-shrink:0;padding-right:.3rem}
.popup .list .nl{color:#ffffffb0;font-style:normal}
.mapcard{position:fixed;z-index:20;width:max-content;min-width:150px;max-width:230px;background:rgba(11,19,35,.82);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);border:1px solid rgba(120,180,255,.34);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.62),0 0 0 1px rgba(120,180,255,.08);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-100%) translateY(-15px) scale(.95);transform-origin:bottom center;transition:opacity .16s,transform .16s}
.mapcard.open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-100%) translateY(-15px) scale(1)}
.mapcard--below{transform:translate(-50%,0) translateY(15px) scale(.95);transform-origin:top center}
.mapcard--below.open{transform:translate(-50%,0) translateY(15px) scale(1)}
.mapcard::after{content:"";position:absolute;left:var(--ax,50%);top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(11,19,35,.82)}
.mapcard--below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:rgba(11,19,35,.82)}
.mapcard .mc-img{width:100%;aspect-ratio:16/9;background:#1a2740 center/cover no-repeat;display:none;border-radius:13px 13px 0 0}
.mapcard .mc-img.has{display:block}
.mapcard .mc-body{padding:9px 11px 11px}
.mapcard .mc-type{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#7fb0ff;font-weight:700}
.mapcard .mc-name{font-size:.95rem;font-weight:800;color:#eef4ff;margin:1px 0 5px;line-height:1.2}
.mapcard .mc-desc{font-size:.76rem;color:#cfe0ff;line-height:1.4;margin:0 0 9px;display:none}
.mapcard .mc-desc.show{display:block}
.mapcard .mc-more{display:inline-block;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;text-decoration:none;font-weight:700;font-size:.78rem;padding:.42rem .75rem;border-radius:8px}
.mapcard .mc-x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:.95rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.burst{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}
.burst.open{display:block}
.burst-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst-line{stroke:rgba(120,185,255,.4);stroke-width:1.1;stroke-linecap:round;animation:burstFade .25s ease-out}
.burst-core{fill:#cdeeff;filter:drop-shadow(0 0 5px #7fd0ff)}
.burst-dots{position:absolute;inset:0}
.burst-dot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;animation:burstPop .22s ease-out}
.burst-dot .bd{width:15px;height:15px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(8,16,34,.6),0 0 10px currentColor;transition:transform .12s}
.burst-dot:hover .bd,.burst-dot:focus-visible .bd{transform:scale(1.3)}
.burst-dot .bl{font-size:.72rem;font-weight:700;color:#eef4ff;background:rgba(8,14,28,.82);border:1px solid rgba(120,180,255,.25);padding:1.5px 6px;border-radius:7px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
@keyframes burstPop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes burstFade{from{opacity:0}to{opacity:1}}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}
</style>

e."]},"yogyakarta-cities-v2":{"i":"/poi-images/yogyakarta-cities-v2.webp","s":"Yogyakarta a Yogyakarta különleges régió fővárosa, a klasszikus jávai művészet és kultúra központja.","f":["A Kraton, a yogyakartai szultán palotájának otthona.","Kapuja a Borobudur és Prambanan UNESCO Világörökségi helyszíneknek."]},"pontianak-cities-v2":{"i":"/poi-images/pontianak-cities-v2.webp","s":"Pontianak Nyugat-Kalimantan fővárosa, és pontosan az Egyenlítőn fekszik.","f":["Egyike a világ azon kevés városának, amely az Egyenlítőre épült.","Az Egyenlítő-emlékmű jelöli a pontos vonalat."]},"banjarmasin-cities-v2":{"i":"/poi-images/banjarmasin-cities-v2.webp","s":"Banjarmasin Dél-Kalimantan fővárosa, más néven az 'ezer folyó városa'.","f":["A Lok Baintan és a Muara Kuin úszó piacai fő látványosságok.","A város élete a Martapura és a Barito folyók körül forog."]},"balikpapan-cities-v2":{"i":"/poi-images/balikpapan-cities-v2.webp","s":"Balikpapan egy kikötőváros Kelet-Kalimantanban, az indonéz olaj- és gázipar központja.","f":["Fontos helyszín a kőolaj-finomítók és a kapcsolódó iparágak számára.","Indonézia egyik legtisztább és legjobban irányított repülőtere."]},"pekanbaru-cities-v2":{"i":"/poi-images/pekanbaru-cities-v2.webp","s":"Pekanbaru Riau tartomány fővárosa Szumátrán.","f":["Indonézia egyik legnagyobb pálmaolaj- és cellulóztermelője.","A neve 'Új piac'-ot jelent."]},"manado-cities-v2":{"i":"/poi-images/manado-cities-v2.webp","s":"Manado Észak-Celebesz fővárosa, lenyűgöző búvár- és sznorkelezési helyeiről, különösen a Bunaken Nemzeti Parkról ismert.","f":["A Bunaken egy világhírű tengeri védett terület, nagy fajgazdagsággal.","A minahasák a domináns etnikai csoport."]},"kuta-cities-v2":{"i":"/poi-images/kuta-cities-v2.webp","s":"Kuta egy híres üdülőhely Bali déli részén, hosszú homokos strandjáról, szörfözési lehetőségeiről és nyüzsgő éjszakai életéről ismert.","f":["Egykor csendes halászfalu volt, ma nyüzsgő turisztikai célpont.","A Kuta strand ideális kezdő szörfösök számára."]},"bogor-cities-v2":{"i":"/poi-images/bogor-cities-v2.webp","s":"Bogor egy város Nyugat-Jáván, ismert botanikus kertjéről és az elnöki palotáról.","f":["A Bogori Botanikus Kert a világ egyik legrégebbi és legnagyobbika.","A bogori elnöki palota (Istana Bogor) parkjában több száz pettyes szarvas él."]},"jayapura-cities-v2":{"i":"/poi-images/jayapura-cities-v2.webp","s":"Jayapura Papua tartomány fővárosa Indonézia keleti részén.","f":["Szanszkritul 'a győzelem városa'-t jelenti.","Korábban Hollandia néven volt ismert a holland gyarmati időkben."]},"padang-cities-v2":{"i":"/poi-images/padang-cities-v2.webp","s":"Padang Nyugat-Szumátra fővárosa, híres a minangkabau konyháról, különösen a rendangról.","f":["A rendangot gyakran a világ legjobb ételének választották.","A minangkabau építészet jellegzetes íves tetőivel kiemelkedő."]},"solo-surakarta-cities-v2":{"i":"/poi-images/solo-surakarta-cities-v2.webp","s":"Surakarta, közismert nevén Solo, egy város Közép-Jáván, Yogyakarta testvérkirályi városa.","f":["Két királyi palotának ad otthont: a Kraton Surakartának és a Mangkunegarannak.","A Klewer piac Indonézia egyik legnagyobb textilpiaca."]},"batam-cities-v2":{"i":"/poi-images/batam-cities-v2.webp","s":"Batam egy sziget és város a Riau-szigetek tartományban, Szingapúr közelében.","f":["Csak egy rövid kompútra van Szingapúrtól, ami népszerű turisztikai célponttá teszi.","Elektronikai gyártásáról és hajógyárairól ismert."]},"ambon-cities-v2":{"i":"/poi-images/ambon-cities-v2.webp","s":"Ambon Maluku tartomány fővárosa, történelmileg a Fűszer-szigetek néven ismert.","f":["Egykor a szegfűszeg és a szerecsendió termesztésének világközpontja volt.","A Siwa Lima Múzeum a Maluku-szigetek kultúráját és történelmét mutatja be."]},"cirebon-cities-v2":{"i":"/poi-images/cirebon-cities-v2.webp","s":"Cirebon egy kikötőváros Nyugat-Jáva északi partján.","f":["Híres batikolt mintáiról, kínai és királyi hatásokkal.","Három királyi palota otthona: Keraton Kasepuhan, Kanoman és Kacirebonan."]},"malang-cities-v2":{"i":"/poi-images/malang-cities-v2.webp","s":"Malang Kelet-Jáva második legnagyobb városa, hűvös éghajlatáról, gyarmati építészetéről és a Bromo-Tengger-Semeru Nemzeti Park kapujaként ismert.","f":["Számos egyetemmel rendelkező város, ami fiatalos hangulatot kölcsönöz neki.","A Jodipan színes falu népszerű fotóhelyszín."]},"samarinda-cities-v2":{"i":"/poi-images/samarinda-cities-v2.webp","s":"Samarinda Kelet-Kalimantan fővárosa, a Mahakam folyó partján fekszik.","f":["A Mahakam folyó fontos közlekedési és kereskedelmi útvonal.","Híres hagyományos szarong textíliájáról."]},"kupang-cities-v2":{"i":"/poi-images/kupang-cities-v2.webp","s":"Kupang Kelet-Nusa Tenggara fővárosa, Timor szigetének nyugati csücskén található.","f":["Kapuja Rote és Sabu szigeteinek, melyek hagyományos kultúrájukról ismertek.","A Kupang-öböl gyönyörű naplementéiről ismert."]},"tasikmalaya-cities-v2":{"i":"/poi-images/tasikmalaya-cities-v2.webp","s":"Tasikmalaya egy város Nyugat-Jáván, iszlám örökségéről és kézművességéről, különösen a szőtt szőnyegekről és a batikról ismert.","f":["Az iszlám bentlakásos iskolák (Pesantren) központja Indonéziában.","Híres a salakról (kígyógyümölcs)."]},"mataram-cities-v2":{"i":"/poi-images/mataram-cities-v2.webp","s":"Mataram Nyugat-Nusa Tenggara fővárosa Lombok szigetén.","f":["Ampenannal és Cakranegarával egy városi agglomerációt alkot.","A Mayura vízi palota fontos történelmi helyszín."]},"bengkulu-cities-v2":{"i":"/poi-images/bengkulu-cities-v2.webp","s":"Bengkulu az azonos nevű tartomány fővárosa Szumátra nyugati partján.","f":["A Fort Marlborough egy jól megőrzött brit erőd.","A Rafflesia arnoldii, a világ legnagyobb virágának otthona."]},"ternate-cities-v2":{"i":"/poi-images/ternate-cities-v2.webp","s":"Ternate egy sziget és város Észak-Maluku tartományban, a fűszerkereskedelem történelmi központja.","f":["Egykor hatalmas szultánság volt, amely a szegfűszeg-kereskedelmet irányította.","Több történelmi erőd, mint például a Fort Tolukko, szétszórva található a szigeten."]},"palu-cities-v2":{"i":"/poi-images/palu-cities-v2.webp","s":"Palu Közép-Celebesz fővárosa, egy hosszú, keskeny öbölben fekszik.","f":["A Palu-Koro törésvonalon fekszik, ami földrengésveszélyessé teszi.","A négyíves Jembatan Palu IV híd egy nevezetesség volt, mielőtt összeomlott."]},"kendari-cities-v2":{"i":"/poi-images/kendari-cities-v2.webp","s":"Kendari Délkelet-Celebesz fővárosa, a Kendari-öbölben fekszik.","f":["A Kendari-öböl híd a város új nevezetessége.","Kapuja a Wakatobi Nemzeti Parknak, a világ egyik legjobb búvárhelyének."]},"gorontalo-cities-v2":{"i":"/poi-images/gorontalo-cities-v2.webp","s":"Gorontalo az azonos nevű tartomány fővárosa Celebesz szigetén.","f":["Erős iszlám jellege miatt 'Medina verandájának' is nevezik.","A Tomini-öböl a tengeri biodiverzitás fontos helyszíne, beleértve a cetcápákat is."]},"tanjung-priok-port-economic-v2":{"i":"/poi-images/tanjung-priok-port-economic-v2.webp","s":"Indonézia legforgalmasabb és legfejlettebb tengeri kikötője, amely az ország teljes áruforgalmának több mint 50%-át bonyolítja.","f":["Indonézia nemzetközi kereskedelmének fő kapuja.","Észak-Jakartában található."]},"grasberg-mine-economic-v2":{"i":"/poi-images/grasberg-mine-economic-v2.webp","s":"A világ legnagyobb aranybányája és második legnagyobb rézbányája, amely Pápua tartományban, Nyugat-Új-Guineában található.","f":["Több ezer munkavállalót foglalkoztat.","Jelentősen hozzájárul Indonézia GDP-jéhez."]},"bekasi-industrial-estate-economic-v2":{"i":"/poi-images/bekasi-industrial-estate-economic-v2.webp","s":"Délkelet-Ázsia egyik legnagyobb ipari parkja, amely számos multinacionális gyártó vállalatnak ad otthont.","f":["Az autóiparra, elektronikára és fogyasztási cikkekre összpontosít.","Jakartától keletre található."]},"paiton-power-station-economic-v2":{"i":"/poi-images/paiton-power-station-economic-v2.webp","s":"Egy hatalmas széntüzelésű erőműkomplexum Kelet-Jáván, amely jelentős részét biztosítja Jáva és Bali villamosenergia-ellátásának.","f":["Indonézia egyik legnagyobb áramtermelője.","Kelet-Jáva északi partján fekszik."]},"batam-free-trade-zone-economic-v2":{"i":"/poi-images/batam-free-trade-zone-economic-v2.webp","s":"Stratégiai helyzetű sziget Szingapúr közelében, amelyet ipari, kereskedelmi és átrakodási központtá fejlesztettek.","f":["A Sijori (Szingapúr-Johor-Riau) növekedési háromszög része.","Adókedvezményei miatt vonzó a külföldi befektetők számára."]},"kaltim-prima-coal-mine-economic-v2":{"i":"/poi-images/kaltim-prima-coal-mine-economic-v2.webp","s":"A világ egyik legnagyobb külszíni szénbányája, amely Sangattában, Kelet-Kalimantan tartományban található.","f":["Magas minőségű energetikai szenet termel.","Jelentős exportőr a globális szénpiacokon."]},"surabaya-port-tanjung-perak-economic-v2":{"i":"/poi-images/surabaya-port-tanjung-perak-economic-v2.webp","s":"Indonézia második legforgalmasabb kikötője, amely Kelet-Indonézia fő kapujaként szolgál.","f":["Összeköti Jávát a keleti szigetekkel, mint Kalimantan, Sulawesi és Pápua.","A belföldi kereskedelem kulcsfontosságú csomópontja."]},"cilegon-industrial-zone-economic-v2":{"i":"/poi-images/cilegon-industrial-zone-economic-v2.webp","s":"Indonézia 'acélközpontjaként' ismert, otthont ad nagy acél- és vegyipari üzemeknek.","f":["Délkelet-Ázsia legnagyobb acélgyártójának, a Krakatau Steelnek a székhelye.","Jelentős petrolkémiai termelő."]},"tanggguh-lng-plant-economic-v2":{"i":"/poi-images/tanggguh-lng-plant-economic-v2.webp","s":"Egy hatalmas cseppfolyósított földgáz (LNG) üzem a Bintuni-öbölben, Nyugat-Pápuán, amely LNG-t exportál az ázsiai piacokra.","f":["A BP üzemelteti.","A Vorwiegend és Wiriagar mezők hatalmas gázkészleteit aknázza ki."]},"makassar-port-economic-v2":{"i":"/poi-images/makassar-port-economic-v2.webp","s":"Sulawesi szigetének legnagyobb kikötője és Kelet-Indonézia kulcsfontosságú kereskedelmi csomópontja.","f":["Összeköti Sulawesit más nagy szigetekkel.","A mezőgazdasági termékek, például a kakaó és tle-landmarks-v2.webp","s":"A Yogyakartai Szultánság egykori királyi kertje.","f":["A 18. század közepén épült.","A királyi család pihenőhelye, műhelye és meditációs területe volt."]},"ragunan-zoo-life-v2":{"i":"/poi-images/ragunan-zoo-life-v2.webp","s":"Egy 140 hektáros állatkert Dél-Jakartában, amely számos állatnak és a Schmutzer Főemlősközpontnak ad otthont.","f":["1864-ben alapították, a világ egyik legrégebbi állatkertje.","Több mint 270 állatfajnak ad otthont."]},"taman-mini-indonesia-indah-life-v2":{"i":"/poi-images/taman-mini-indonesia-indah-life-v2.webp","s":"Kulturális park Kelet-Jakartában, amely Indonézia sokszínűségét mutatja be miniatűr formában, minden tartománynak külön pavilonnal és különféle múzeumokkal.","f":["Jelentése 'Gyönyörű Indonézia Miniatűr Park'.","IMAX mozival és felvonóval rendelkezik."]},"bali-bird-park-life-v2":{"i":"/poi-images/bali-bird-park-life-v2.webp","s":"Turisztikai park Balin, amely közel 1000 madárnak ad otthont 250 különböző fajból egy buja, trópusi környezetben.","f":["Az indonéz madárfajok megőrzésére összpontosít.","Napi madárbemutatókat és etetéseket kínál."]},"jatiluwih-rice-fields-agriculture-v2":{"i":"/poi-images/jatiluwih-rice-fields-agriculture-v2.webp","s":"Hatalmas rizsteraszok Balin, amelyek bemutatják a hagyományos 'Subak' öntözőrendszert, amely az UNESCO Világörökség része.","f":["Több mint 600 hektáron terül el.","A név jelentése 'igazán csodálatos'."]},"gayo-coffee-plantations-agriculture-v2":{"i":"/poi-images/gayo-coffee-plantations-agriculture-v2.webp","s":"Az Acehi Gayo-fennsík világhírű a kiváló minőségű arabica kávéjáról, amelyet helyi szövetkezetek termesztenek.","f":["A kávé alacsony savasságáról és testes ízéről ismert.","Az ültetvények a Laut Tawar-tó körül helyezkednek el."]},"bogor-botanical-gardens-life-v2":{"i":"/poi-images/bogor-botanical-gardens-life-v2.webp","s":"Hatalmas trópusi botanikus kert Bogor központjában, amely több ezer növényfajnak ad otthont.","f":["1817-ben alapították a hollandok.","Területe 87 hektár."]},"cibodas-botanical-gardens-life-v2":{"i":"/poi-images/cibodas-botanical-gardens-life-v2.webp","s":"Botanikus kert a Gede-hegy közelében, amely a szubtrópusi és hegyvidéki növényvilágra specializálódott.","f":["1852-ben alapították a Bogori Botanikus Kert ágaként.","Nagy kininfa- és páfránygyűjteménynek ad otthont."]},"monkey-forest-ubud-life-v2":{"i":"/poi-images/monkey-forest-ubud-life-v2.webp","s":"Természetvédelmi terület és hindu templomkomplexum Ubudban, Balin, amelyet több száz hosszúfarkú makákó lakik.","f":["Hivatalos neve Padangtegal Mandala Wisata Wanara Wana.","A majmokat szentnek tartják."]},"tangkoko-nature-reserve-life-v2":{"i":"/poi-images/tangkoko-nature-reserve-life-v2.webp","s":"Természetvédelmi terület Észak-Celebeszen, amely a koboldmakik, a világ legkisebb főemlőseinek magas koncentrációjáról ismert.","f":["A celebeszi makákó otthona.","Lehetőséget nyújt az éjszakai életmódot folytató koboldmakik megfigyelésére szürkületkor."]},"sea-world-ancol-life-v2":{"i":"/poi-images/sea-world-ancol-life-v2.webp","s":"Nagy tengeri akvárium a jakartai Ancol Dreamland komplexumban, amely Indonézia és a világ minden tájáról származó tengeri élőlényeket mutat be.","f":["Hosszú víz alatti alagúttal rendelkezik.","Nagy cápaakváriumnak ad otthont."]},"bukit-lawang-orangutan-life-v2":{"i":"/poi-images/bukit-lawang-orangutan-life-v2.webp","s":"Falu a Gunung Leuser Nemzeti Park szélén, amely orángután-rehabilitációs központjáról és dzsungeltúráiról ismert.","f":["Árva vagy fogságban tartott orángutánok vadonba való visszaengedésére alapították.","A látogatók megfigyelhetik a félig vad orángutánok etetését."]},"alas-kedaton-monkey-forest-life-v2":{"i":"/poi-images/alas-kedaton-monkey-forest-life-v2.webp","s":"Kis erdő és templomkomplexum Balin, amelyet több száz majom és egy repülőkutya-kolónia lakik.","f":["A majmokat a templom őreinek tartják.","Ubuddal ellentétben ezek a majmok kevésbé szoktak hozzá az emberekhez."]},"bandung-tea-plantations-agriculture-v2":{"i":"/poi-images/bandung-tea-plantations-agriculture-v2.webp","s":"A Bandung körüli hűvös fennsíkokat hatalmas teaültetvények borítják, festői tájat és friss levegőt kínálva.","f":["Ciwidey környéke különösen híres a teaültetvényeiről.","Sok ültetvényt a holland gyarmati időszakban hoztak létre."]},"lombok-pearl-farms-agriculture-v2":{"i":"/poi-images/lombok-pearl-farms-agriculture-v2.webp","s":"A Lombok és Sumbawa körüli part menti vizek a legkiválóbb minőségű déltengeri gyöngyök tenyésztéséről ismertek.","f":["Indonézia a világ egyik legnagyobb déltengeri gyöngytermelője.","A látogatók meglátogathatják a gyöngyfarmokat, hogy megismerjék a folyamatot."]},"waterbom-bali-life-v2":{"i":"/poi-images/waterbom-bali-life-v2.webp","s":"Világszínvonalú vízi park Kutában, Balin, amely izgalmas vízicsúszdák és látnivalók sokaságát kínálja minden korosztály számára.","f":["Többször elnyerte Ázsia legjobb vízi parkja címet.","Egy 3,8 hektáros trópusi parkban található."]},"munduk-clove-plantations-agriculture-v2":{"i":"/poi-images/munduk-clove-plantations-agriculture-v2.webp","s":"Az észak-balinéz Munduk hegyi falut szegfűszeget, kávét és más fűszereket termesztő ültetvények veszik körül, amelyek illatos aromát kölcsönöznek a levegőnek.","f":["A szegfűszeg az eredeti fűszerkereskedelem része volt.","Az ültetvényeket gyakran vízesések és túraútvonalak tarkítják."]},"lembang-floating-market-life-v2":{"i":"/poi-images/lembang-floating-market-life-v2.webp","s":"Mesterséges turisztikai látványosság Bandung közelében, ahol az árusok csónakokból árulnak hagyományos ételeket és rágcsálnivalókat egy tavon.","f":["Számos szundanéz ételt kínál.","Ötvözi az étkezést, a vásárlást és a pihenést."]},"bali-butterfly-park-life-v2":{"i":"/poi-images/bali-butterfly-park-life-v2.webp","s":"Kicsi, de varázslatos park, amely több száz pillangónak ad otthont Indonézia minden tájáról.","f":["Ázsia egyik legnagyobb lepkeparkja.","Lehetőséget nyújt a pillangók közeli megtekintésére."]},"west-bali-national-park-wildlife-v2":{"i":"/poi-images/west-bali-national-park-wildlife-v2.webp","s":"Védett terület Bali nyugati csücskén, amely számos élőhelyet foglal magában, beleértve a szavannát, a mangroveerdőket és a hegyvidéki erdőket.","f":["A kritikusan veszélyeztetett baliseregély utolsó menedéke.","A parkban található Menjangan-sziget népszerű búvár- és sznorkelezőhely."]},"trans-studio-bandung-life-v2":{"i":"/poi-images/trans-studio-bandung-life-v2.webp","s":"A világ egyik legnagyobb fedett vidámparkja, amely számos attrakciót és show-műsort kínál.","f":["Egy nagyobb komplexum része, amely bevásárlóközpontot és szállodákat is magában foglal.","A TransTV és Trans7 műsorain alapuló attrakciókkal rendelkezik."]},"bromo-tengger-semeru-national-park-nature-v2":{"i":"/poi-images/bromo-tengger-semeru-national-park-nature-v2.webp","s":"Lenyűgöző nemzeti park Kelet-Jáván, amely egy hatalmas homoksivatagot, valamint a Bromo és Semeru aktív vulkánokat foglalja magában.","f":["Magában foglalja a 'Homok-tengert', egy ősi vulkán kalderáját.","A Semeru-hegy Jáva legmagasabb csúcsa."]},"ujung-kulon-national-park-nature-v2":{"i":"/poi-images/ujung-kulon-national-park-nature-v2.webp","s":"UNESCO Világörökségi helyszín Jáva nyugati csücskén, a kritikusan veszélyeztetett jávai orrszarvú utolsó menedéke.","f":["Védi a jávai orrszarvúk világ legnagyobb populációját.","Magában foglalja a Krakatau vulkanikus szigetcsoportot."]},"kerinci-seblat-national-park-nature-v2":{"i":"/poi-images/kerinci-seblat-national-park-nature-v2.webp","s":"Szumátra legnagyobb nemzeti parkja, a Kerinci-hegy otthona, és hihetetlenül változatos növény- és állatvilággal rendelkezik.","f":["Védi a kritikusan veszélyeztetett szumátrai tigrist.","A Kerinci-hegy Indonézia legmagasabb vulkánja."]},"lorentz-national-park-nature-v2":{"i":"/poi-images/lorentz-national-park-nature-v2.webp","s":"Délkelet-Ázsia legnagyobb nemzeti parkja Pápua tartományban, amely egy folyamatos, érintetlen keresztmetszetet kínál a hófödte csúcsoktól a trópusi tengeri környezetig.","f":["UNESCO Világörökségi helyszín.","Itt található a Puncak Jaya, Óceánia legmagasabb csúcsa."]},"mount-rinjani-nature-v2":{"i":"/poi-images/mount-rinjani-nature-v2.webp","s":"Aktív vulkán Lombok szigetén, Indonézia második legmagasabb vulkánja.","f":["A csúcs 3726 méter magas.","A Segara Anak-tó 2000 méteres magasságban található."]},"puncak-jaya-carstensz-pyramid-nature-v2":{"i":"/poi-images/puncak-jaya-carstensz-pyramid-nature-v2.webp","s":"Indonézia és Óceánia legmagasabb csúcsa, a Hét Csúcs egyike.","f":["Eléri a 4884 méteres magasságot.","A Lorentz Nemzeti Parkban található."]},"mount-semeru-nature-v2":{"i":"/poi-images/mount-semeru-nature-v2.webp","s":"Jáva szigetének legmagasabb vulkánja, más néven Mahameru (A Nagy Hegy).","f":["Csúcsa 3676 méter magas.","Rendszeresen kitör, 20-30 percenként hamufelhőket lövell ki."]},"tanjung-puting-national-park-nature-v2":{"i":"/poi-images/tanjung-puting-national-park-nature-v2.webp","s":"Nemzeti park Közép-Kalimantanban, világhírű az orángutánvédelmi programjairól és a lehetőségről, hogy természetes élőhelyükön láthassuk őket.","f":["A Camp Leakey egy híres orángutánkutató központ.","A látogatók általában Klotok hajókkal fedezik fel a parkot a folyón."]},"lake-sentani-nature-v2":{"i":"/poi-images/lake-sentani-nature-v2.webp","s":"Nagy, gyönyörű tó Jayapura közelében, Pápua tartományban, szigeteiről, cölöpházairól és gazdag kultúrájáról ismert.","f":["22 szigete van.","Évente megrendezett Sentani-tó Fesztivál ünnepli a helyi kultúrát."]},"kapuas-river-nature-v2":{"i":"/poi-images/kapuas-river-nature-v2.webp","s":"Indonézia leghosszabb folyója, amely Nyugat-Kalimantan tartományon folyik keresztül.","f":["Körülbelül 1143 kilométer hosszú.","Átfolyik Pontianak városán, amely az Egyenlítőn fekszik."]},"mahakam-river-nature-v2":{"i":"/poi-images/mahakam-river-nature-v2.webp","s":"Indonézia második leghosszabb folyója Kelet-Kalimantanban.","f":["Körülbelül 980 kilométer hosszú.","Egy kritikusan veszélyeztetett iravádi delfin populációnak ad otthont."]},"bunaken-national-marine-park-nature-v2":{"i":"/poi-images/bunaken-national-marine-park-nature-v2.webp","s":"Világhírű tengeri park Manado közelében, Észak-Celebeszen, amely rendkívüli korall- és halfaj-gazdagságáról ismert.","f":["A Korall-háromszög szívében található.","Több mint 390 korallfajnak ad otthont."]},"wakatobi-national-park-nature-v2":{"i":"/poi-images/wakatobi-national-park-nature-v2.webp","s":"Tengeri nemzeti park Délkelet-Celebeszen, amelyet a világ egyik leginkább fajgazdag tengeri helyszínének tartanak.","f":["A név a négy fő sziget nevének betűszava: Wangi-wangi, Kaledupa, Tomia és Binongko.","UNESCO Bioszféra-rezervátum."]},"baluran-national-park-nature-v2":{"i":"/poi-images/baluran-national-park-nature-v2.webp","s":"Nemzeti park Kelet-Jáván, amelyet széles szavannája miatt gyakran 'Afrika kis darabjának Jáván' neveznek.","f":["A Bekol szavanna a fő látványosság.","Olyan vadon élő állatoknak ad otthont, mint a banteng (vadtulok), a vízibivaly és a páva."]},"way-kambas-national-park-nature-v2":{"i":"/poi-images/way-kambas-national-park-nature-v2.webp","s":"Nemzeti park Lampungban, Szumátrán, amely a szumátrai elefánt védelmének szenteli magát.","f":["Indonézia egyik legrégebbi nemzeti parkja.","Védi a szumátrai tigriseket és a szumátrai orrszarvúkat is."]},"danau-maninjau-nature-v2":{"i":"/poi-images/danau-maninjau-nature-v2.webp","s":"Nagy krátertó Nyugat-Szumátrán, amely festői szépségéről és a hozzá levezető 44 hajtűkanyarról (Kelok 44) ismert.","f":["A tó egy vulkáni kalderában fekszik.","Fontos helyszín a helyi akvakultúra számára."]},"gunung-gede-pangarango-national-park-nature-v2":{"i":"/poi-images/gunung-gede-pangarango-national-park-nature-v2.webp","s":"Népszerű nemzeti park Nyugat-Jáván, amely a Gunung Gede és a Gunung Pangrango ikervulkánokat foglalja magában.","f":["Indonézia egyik legrégebbi védett területe.","A kritikusan veszélyeztetett jávai gibbon otthona."]},"sentarum-lake-national-park-nature-v2":{"i":"/poi-images/sentarum-lake-national-park-nature-v2.webp","s":"Egyedülálló vizes élőhely, amely szezonális tavakból és mocsárerdőkből áll Nyugat-Kalimantanban, és hatalmas halgazdagságáról ismert.","f":["Körülbelül 20 szezonális tóból áll.","Az esős évszakban a Kapuas-folyó árasztja el."]},"karimunjawa-national-park-nature-v2":{"i":"/poi-images/karimunjawa-national-park-nature-v2.webp","s":"27 szigetből álló szigetcsoport a Jáva-tengerben, érintetlen fehér homokos strandjairól, tiszta vizéről és korallzátonyairól ismert.","f":["Népszerű célpont a sznorkelezéshez, búvárkodáshoz és szigettúrákhoz.","Védi a mangroveerdőket és a tengerifű-réteket."]},"merapi-volcano-nature-v2":{"i":"/poi-images/merapi-volcano-nature-v2.webp","s":"Indonézia egyik legaktívabb és legveszélyesebb vulkánja, Közép-Jáva és Yogyakarta között található.","f":["Néhány évente rendszeresen kitör.","A vulkanológusok szorosan figyelemmel kísérik."]},"barisan-mountains-relief-v2":{"i":"/poi-images/barisan-mountains-relief-v2.webp","s":"Egy vulkanikus hegylánc, amely Szumátra szigetének egész nyugati oldalán végighúzódik.","f":["Majdnem 1700 km hosszan húzódik.","Számos aktív vulkánnak ad otthont, köztük a Kerincinek."]},"sudirman-range-relief-v2":{"i":"/poi-images/sudirman-range-relief-v2.webp","s":"Hegylánc Pápua tartományban, Indonéziában, amely az ország legmagasabb pontjának, a Puncak Jayának ad otthont.","f":["A Maoke-hegység része.","A világ kevés egyenlítői gleccserének egyike itt található."]},"dieng-plateau-relief-v2":{"i":"/poi-images/dieng-plateau-relief-v2.webp","s":"Egy mocsaras fennsík, amely egy őskori vulkán kalderáját alkotja, ismert ősi hindu templomairól és vulkáni tavairól.","f":["Körülbelül 2000 méteres magasságban fekszik.","A neve 'az istenek lakhelyét' jelenti."]},"kerinci-valley-relief-v2":{"i":"/poi-images/kerinci-valley-relief-v2.webp","s":"Termékeny völgy, amelyet a Kerinci Seblat Nemzeti Park vesz körül, a Kerinci- function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}

// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,

const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Search-only entries (POIs on a sub-map): match by name, navigate to the sub-map.
  const extraHits=[];
  for(const e of SEARCH_EXTRA){if(e.s.includes(q)&&extraHits.length<20)extraHits.push(e)}
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0&&extraHits.length===0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];

        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0&&extraHits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  const exRow=e=>'<a data-extra="1" href="'+e.u+'"><span class="dot" style="background:#ffd54a"></span><span class="nm">'+e.n.replace(/[<>]/g,'')+'</span><span class="gr">›</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('')+extraHits.map(exRow).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const ax=e.target.closest('a[data-extra]');
  if(ax)return; // sub-map link: let the browser navigate
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
