oare."]},"male-commercial-harbour-economic-v2":{"i":"/poi-images/male-commercial-harbour-economic-v2.webp","s":"Portul principal al Maldivelor, care gestionează majoritatea importurilor și exporturilor țării.","f":["Cea mai importantă poartă pentru mărfurile internaționale.","Operat de Maldives Ports Limited."]},"mifco-felivaru-economic-v2":{"i":"/poi-images/mifco-felivaru-economic-v2.webp","s":"Una dintre cele mai mari fabrici de stat pentru procesarea și conservarea peștelui, având un rol cheie în economia locală.","f":["Produce conserve de ton pentru export.","Înființată în anii 1970."]},"hulhumale-power-station-economic-v2":{"i":"/poi-images/hulhumale-power-station-economic-v2.webp","s":"O centrală electrică modernă care furnizează energie insulei artificiale în creștere rapidă Hulhumalé și zonelor înconjurătoare.","f":["Extinsă cu noi generatoare diesel.","Parte a rețelei regiunii Greater Malé."]},"thilafushi-industrial-zone-economic-v2":{"i":"/poi-images/thilafushi-industrial-zone-economic-v2.webp","s":"O insulă artificială care servește ca centru de gestionare a deșeurilor și industrial, având depozite și unități de producție.","f":["Inițial a fost creată ca o groapă de gunoi.","Găzduiește ambalarea cimentului și construcția de bărci."]},"kooddoo-fish-processing-economic-v2":{"i":"/poi-images/kooddoo-fish-processing-economic-v2.webp","s":"Un complex important de procesare și depozitare frigorifică a peștelui în sudul Maldivelor, pentru a sprijini pescuitul local.","f":["Dispune de o capacitate masivă de congelare.","Asigură veniturile pescarilor din sud."]},"stelco-male-power-plant-economic-v2":{"i":"/poi-images/stelco-male-power-plant-economic-v2.webp","s":"Centrala principală pe motorină a Companiei Electrice de Stat, care furnizează electricitate vitală capitalei Malé.","f":["Cel mai mare producător de energie din capitală.","Folosește generatoare diesel mari."]},"maldives-inflight-catering-economic-v2":{"i":"/poi-images/maldives-inflight-catering-economic-v2.webp","s":"O companie ultramodernă de catering pe insula aeroportului Hulhulé, care furnizează mese companiilor aeriene internaționale.","f":["Produce mii de mese zilnic.","Situată direct pe aeroportul internațional."]},"maandhoo-fisheries-complex-economic-v2":{"i":"/poi-images/maandhoo-fisheries-complex-economic-v2.webp","s":"O mare unitate de procesare a peștelui din atolul Laamu, responsabilă de procesarea tonului din regiune.","f":["Operat de Horizon Fisheries.","Produce și făină de pește."]},"gan-airport-port-economic-v2":{"i":"/poi-images/gan-airport-port-economic-v2.webp","s":"Un port regional important în Atolul Addu, deservind aeroportul internațional Gan și comerțul sudic.","f":["Situat în cel mai sudic atol.","Important pentru logistica stațiunilor din sud."]},"addu-city-fisheries-economic-v2":{"i":"/poi-images/addu-city-fisheries-economic-v2.webp","s":"Un centru important pentru procesarea peștelui și depozitarea la rece în Atolul Addu pentru a consolida industria pescuitului din sud.","f":["Crește valoarea adăugată a capturilor locale.","Creează locuri de muncă importante în sud."]},"sto-trade-center-male-economic-v2":{"i":"/poi-images/sto-trade-center-male-economic-v2.webp","s":"Sediul Organizației Comerciale de Stat, un punct central pentru comerțul cu alimente, materiale de construcții și combustibil.","f":["Controlează o mare parte a importurilor.","Include cel mai mare supermarket din țară."]},"hulhumale-yacht-marina-economic-v2":{"i":"/poi-images/hulhumale-yacht-marina-economic-v2.webp","s":"Un port modern de iahturi pe insula artificială Hulhumalé, care găzduiește bărci de safari și iahturi internaționale, promovând turismul de lux.","f":["Oferă dane pentru peste 300 de bărci.","Dispune de facilități de întreținere pentru iahturi."]},"horizon-fisheries-processing-economic-v2":{"i":"/poi-images/horizon-fisheries-processing-economic-v2.webp","s":"Una dintre cele mai avansate fabrici private de procesare a peștelui din Maldive, specializată în tonul prins în mod sustenabil.","f":["Exportă în Europa și Asia.","Promovează pescuitul certificat MSC."]},"male-fish-market-economic-v2":{"i":"/poi-images/male-fish-market-economic-v2.webp","s":"Inima comercială vibrantă a comerțului local cu pește, unde pescarii își vând captura zilnică direct angrosiștilor și retailerilor.","f":["Centru comercial pentru tonul cu aripioare galbene.","Sute de tranzacții în fiecare zi."]},"dhiffushi-solar-power-economic-v2":{"i":"/poi-images/dhiffushi-solar-power-economic-v2.webp","s":"O instalație solară avangardistă care ajută la reducerea dependenței insulei de combustibilul diesel importat pentru generarea de electricitate.","f":["Primul proiect pilot de energie regenerabilă pe insule.","Reduce semnificativ emisiile de carbon."]},"kadhdhoo-regional-port-economic-v2":{"i":"/poi-images/kadhdhoo-regional-port-economic-v2.webp","s":"Un port regional important din Atolul Laamu, care susține traficul de mărfuri și zona economică locală din regiunea central-sudică a Maldivelor.","f":["Conectează atolii cu capitala.","Punct de transfer pentru produsele agricole."]},"fenaka-thinadhoo-power-economic-v2":{"i":"/poi-images/fenaka-thinadhoo-power-economic-v2.webp","s":"Principala centrală electrică pentru atolul Gaafu Dhaalu, operată de compania publică de utilități FENAKA, care stimulează dezvoltarea economică.","f":["Recent modernizată cu noi generatoare.","Furnizează energie pentru peste zece mii de locuitori."]},"ensis-fisheries-processing-economic-v2":{"i":"/poi-images/ensis-fisheries-processing-economic-v2.webp","s":"O fabrică de procesare mare și ultramodernă din Hulhumalé, care ambalează și procesează ton proaspăt pentru piețele internaționale.","f":["Unul dintre cei mai mari exportatori de pește din țară.","Are propria flotă de vehicule frigorifice."]},"kulhudhuffushi-regional-port-economic-v2":{"i":"/poi-images/kulhudhuffushi-regional-port-economic-v2.webp","s":"Cel mai important port maritim din nordul Maldivelor, acționând ca centru primar de distribuție pentru atolii din nord.","f":["Reduce costurile de transport pentru nord.","Capacitatea sa este extinsă continuu."]},"thilafushi-boat-building-economic-v2":{"i":"/poi-images/thilafushi-boat-building-economic-v2.webp","s":"O zonă industrială semnificativă pe insula Thilafushi, specializată în construcția de bărci tradiționale Dhoni și nave moderne din fibră de sticlă.","f":["Combină meșteșugul tradițional cu materialele moderne.","Cel mai important angajator din industria construcțiilor navale."]},"mv-hukuru-miskiy-history-v2":{"i":"/poi-images/mv-hukuru-miskiy-history-v2.webp","s":"Construită în 1658, această moschee din Malé este realizată din pietre de coral fin sculptate.","f":["Moscheea a fost finalizată în 1658 sub conducerea Sultanului Ibrahim Iskandar I.","Pereții sunt construiți din blocuri masive de coral, frumos ornamentate."]},"mv-utheemu-ganduvaru-history-v2":{"i":"/poi-images/mv-utheemu-ganduvaru-history-v2.webp","s":"Acest palat istoric a fost reședința sultanului Muhammad Thakurufaanu, considerat eroul național al Maldivelor.","f":["Palatul este un exemplu remarcabil al arhitecturii tradiționale din lemn a Maldivelor.","Sultanul Thakurufaanu a eliberat Maldivele de portughezi în 1573."]},"mv-medhu-ziyaaraiy-history-v2":{"i":"/poi-images/mv-medhu-ziyaaraiy-history-v2.webp","s":"Medhu Ziyaaraiy este mormântul savantului marocan Abu al-Barakat Yusuf al-Barbari, care ar fi adus islamul în Maldive în anul 1153.","f":["Mormântul a fost reamenajat în forma sa actuală în secolul al XVII-lea.","Al-Barbari este considerat sfântul național al Maldivelor."]},"mv-victory-monument-history-v2":{"i":"/poi-images/mv-victory-monument-history-v2.webp","s":"Monumentul Victoriei din Malé comemorează victoria trupelor guvernamentale maldiviene asupra unui grup de mercenari în timpul tentativei de lovitură de stat din 1988.","f":["Monumentul comemorează ziua de 3 noiembrie 1988, când lovitura de stat a fost zădărnicită.","Centrul monumentului este un inel, care simbolizează unitatea."]},"mv-muleeaage-history-v2":{"i":"/poi-images/mv-muleeaage-history-v2.webp","s":"Mulee'aage a fost construit la începutul secolului al XX-lea ca palat pentru sultan, înainte ca țara să devină republică.","f":["Clădirea a fost proiectată de un arhitect din Sri Lanka în stil colonial.","A fost folosită mult timp ca sediu al puterii executive din Maldive."]},"mv-isdhoo-buddhist-ruins-history-v2":{"i":"/poi-images/mv-isdhoo-buddhist-ruins-history-v2.webp","s":"Pe insula Isdhoo se găsesc rămășițele unor antice stupe budiste din perioada pre-islamică a Maldivelor.","f":["Stupele se numără printre cele mai vechi structuri cunoscute din Maldive.","Au fost construite din calcar de coral local."]},"mv-kuruhinna-thariagandu-history-v2":{"i":"/poi-images/mv-kuruhinna-thariagandu-history-v2.webp","s":"Acest sit arheologic de pe insula Kashidhoo include rămășițele excavate ale unei mari mănăstiri budiste.","f":["Excavările au început la sfârșitul anilor 1990.","Cercetătorii au găsit fundațiile a peste 60 de clădiri."]},"mv-darumavanta-rasgefaanu-mosque-history-v2":{"i":"/poi-images/mv-darumavanta-rasgefaanu-mosque-history-v2.webp","s":"Această moschee este printre cele mai vechi din Malé și poartă numele unui conducător important din istoria timpurie a Maldivelor.","f":["Moscheea poartă numele primului conducător care a adoptat islamul.","Data exactă a construcției este necunoscută, dar a fost restaurată de mai multe ori."]},"mv-eid-miskiy-history-v2":{"i":"/poi-images/mv-eid-miskiy-history-v2.webp","s":"Moscheea istorică de sărbători Eid Miskiy din Malé a fost, timp de secole, locul central pentru rugăciunile islamice majore în zilele de sărbătoare.","f":["Aici se aduna comunitatea pentru rugăciunea de Eid după Ramadan.","Sculpturile prezintă motive florale, deoarece în islam imaginile ființelor vii sunt interzise."]},"mv-kalhuvakaru-miskiy-history-v2":{"i":"/poi-images/mv-kalhuvakaru-miskiy-history-v2.webp","s":"Cunoscută și sub numele de 'Moscheea Călătoare', această clădire istorică a fost construită din abanos sculptat artistic și pietre de coral.","f":["Este singura moschee din lemn cunoscută care poate fi demontată și transportată.","Podeaua a fost acoperită tradițional cu nisip alb."]},"mv-thoddoo-buddhist-ruins-history-v2":{"i":"/poi-images/mv-thoddoo-buddhist-ruins-history-v2.webp","s":"Pe insula Thoddoo din atolul Alif Alif au fost descoperite artefacte antice și ruinele unui templu budist.","f":["În timpul săpăturilor din 1958, aici a fost găsită o statuie a lui Buddha aproape intactă.","Statuia este una dintre cele mai valoroase piese expuse la Muzeul Național."]},"mv-raf-base-gan-history-v2":{"i":"/poi-images/mv-raf-base-gan-history-v2.webp","s":"Insula strategică Gan a fost o bază militară secretă a Royal Air Force în timpul celui de-al Doilea Război Mondial și al Războiului Rece.","f":["Baza militară a funcționat din 1941 până în 1976.","Britanicii au construit primul aeroport mare din regiune."]},"mv-fenfushi-mosque-history-v2":{"i":"/poi-images/mv-fenfushi-mosque-history-v2.webp","s":"Moscheea istorică de pe insula Fenfushi este cunoscută pentru sculpturile în coral excepțional de detaliate și lucrările din lemn lăcuit.","f":["Moscheea impresionează prin tavanele sale din lemn de tec de înaltă calitate.","A fost construită la sfârșitul secolului al XVII-lea."]},"mv-landhoo-ruins-history-v2":{"i":"/poi-images/mv-landhoo-ruins-history-v2.webp","s":"Pe insula Landhoo se găsesc rămășițele unui mare deal sub formă de piramidă, identificat ca o stupă din era budistă.","f":["Dealul se ridică vizibil deasupra peisajului plat al insulei.","Este considerat una dintre cele mai mari descoperiri budiste din atolul nordic."]},"mv-nilandhoo-aasaari-miskiy-history-v2":{"i":"/poi-images/mv-nilandhoo-aasaari-miskiy-history-v2.webp","s":"Aasaari Miskiy de pe insula Nilandhoo este a doua cea mai veche moschee din Maldive, construită probabil în secolul al XII-lea.","f":["Pereții ei sunt formați din blocuri function openBurst(clEl){
  closePopup();

  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});

  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));

  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));

function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}

// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0

const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
