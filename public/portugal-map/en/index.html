e.","f":["Porto is the city that gave Portugal its name (from the Roman name Portus Cale).","The historic center of Porto and the Ribeira district have been UNESCO World Heritage sites since 1996."]},"historical-monsanto":{"i":"/poi-images/historical-monsanto.webp","s":"Monsanto is a unique village where houses have been spectacularly built into and around gigantic granite boulders.","f":["Houses are squeezed between, on, and under giant boulders.","A medieval castle sits atop the village."]},"historical-sortelha":{"i":"/poi-images/historical-sortelha.webp","s":"The medieval fortress city of Sortelha is one of Portugal's best-preserved historical villages.","f":["The walls and keep are largely intact.","Part of the Historical Villages of Portugal program."]},"historical-almendres":{"i":"/poi-images/historical-almendres.webp","s":"The largest megalithic monument on the Iberian Peninsula, consisting of over 90 granite menhirs.","f":["Consists of over 90 granite menhirs.","Thousands of years older than Stonehenge."]},"historical-flordarosa":{"i":"/poi-images/historical-flordarosa.webp","s":"An outstanding example of the military and religious architecture of the Portuguese Middle Ages.","f":["Built by the Order of the Knights of Hospitaller.","Combines monastic, palatial, and military architecture."]},"historical-briteiros":{"i":"/poi-images/historical-briteiros.webp","s":"One of the most important Iron Age settlements in Portugal, with hundreds of round stone huts.","f":["Shows the remains of over 150 round stone huts.","Was inhabited from around 300 BC to 300 AD."]},"historical-lanhoso":{"i":"/poi-images/historical-lanhoso.webp","s":"One of the oldest castles in Portugal, majestically situated on a huge granite monolith.","f":["One of the oldest castles in Portugal.","Offers a 360-degree view of the surrounding area."]},"historical-troia":{"i":"/poi-images/historical-troia.webp","s":"Ancient center for industrial fish processing in the Roman Empire.","f":["Produced garum, a fermented fish sauce exported throughout the empire.","The site includes workshops, houses, baths, and a cemetery."]},"historical-lamego":{"i":"/poi-images/historical-lamego.webp","s":"A Baroque sanctuary with a magnificent staircase and panoramic views over the Douro Valley.","f":["The staircase is adorned with statues, fountains, and azulejos.","The annual pilgrimage takes place in early September."]},"historical-arraiolos":{"i":"/poi-images/historical-arraiolos.webp","s":"One of the few fortresses in the world with an almost perfect circular floor plan.","f":["Built in the early 14th century.","The interior of the walls is now largely a ruin."]},"historical-coa":{"i":"/poi-images/historical-coa.webp","s":"Largest known outdoor gallery of Paleolithic rock art worldwide.","f":["Thousands of engravings of horses, aurochs, and other animals.","The art dates back 25,000 to 10,000 years."]},"historical-paiva":{"i":"/poi-images/historical-paiva.webp","s":"An award-winning hiking trail that runs along the steep cliffs of the Paiva River.","f":["Located in the Arouca Geopark, a UNESCO Geopark.","Includes the '516 Arouca', one of the world's longest pedestrian suspension bridges."]},"animal-habitat-berlengas-archipelago-extra":{"i":"/poi-images/animal-habitat-berlengas-archipelago-extra.webp","s":"The Berlengas Archipelago, a small group of islands off the coast of Peniche, is a rugged and pristine natural paradise and a UNESCO Biosphere Reserve."},"kid-landmark-krazy-world-zoo-extra":{"i":"/poi-images/kid-landmark-krazy-world-zoo-extra.webp","s":"Krazy World Zoo in Algoz, in the heart of the Algarve, is an interactive animal and amusement park that promises a diverse day out for the whole family."},"nature-arrabida-natural-park-extra":{"i":"/poi-images/nature-arrabida-natural-park-extra.webp","s":"A protected area where the blue hues of the sea contrast with the white tones of the limestone cliffs and the green of the vegetation, creating a unique landscape.","f": d of nature, history, and royal heritage."},"kid-landmark-dino-parque-lourinha-extra":{"i":"/poi-images/kid-landmark-dino-parque-lourinha-extra.webp","s":"Dino Parque in Lourinhã is Portugal's largest open-air theme park and an absolute must-visit for anyone fascinated by dinosaurs."},"city-coimbra":{"i":"/geo-images/portugal/city-coimbra.webp","s":"Coimbra was once the capital of Portugal and is home to one of the oldest universities in the world.","f":["The University of Coimbra was founded in 1290.","The Biblioteca Joanina is a magnificent Baroque library."]},"city-braga":{"i":"/geo-images/portugal/city-braga.webp","s":"Braga is one of the oldest cities in Portugal and is considered the country's religious center.","f":["Braga was founded by the Romans over 2,000 years ago.","The Braga Cathedral is the oldest in the country."]},"city-faro":{"i":"/geo-images/portugal/city-faro.webp","s":"Faro is the capital of the Algarve and serves as the gateway to southern Portugal.","f":["Faro has a well-preserved Moorish city wall.","The Faro Cathedral dates back to the 13th century."]},"city-setubal":{"i":"/geo-images/portugal/city-setubal.webp","s":"Setubal is a lively port city on the Sado estuary and a gateway to the Arrabida coast.","f":["The city lies south of Lisbon.","The Sado estuary is known for its dolphin population."]},"city-evora":{"i":"/geo-images/portugal/city-evora.webp","s":"Évora, a museum-city in the heart of the Alentejo region, is one of Portugal's most beautifully preserved historic gems.","f":["Évora's historic center has been a UNESCO World Heritage site since 1986.","The Roman Temple of Évora is one of the best-preserved Roman monuments on the Iberian Peninsula."]},"city-aveiro":{"i":"/geo-images/portugal/city-aveiro.webp","s":"Aveiro is Portugal's famous lagoon city and is often marketed as the country's Venice.","f":["The city sits beside a lagoon.","Moliceiro boats are its best-known photo subject."]},"city-viseu":{"i":"/geo-images/portugal/city-v lentejo.","The city is known for textiles."]},"city-castelo-branco":{"i":"/geo-images/portugal/city-castelo-branco.webp","s":"Castelo Branco is a central city in eastern Portugal with a clear inland character.","f":["The city lies in Beira Baixa.","Gardens are part of its profile."]},"city-vila-real":{"i":"/geo-images/portugal/city-vila-real.webp","s":"Vila Real sits in northern Portugal between the Douro and the mountains.","f":["Vila Real sits between the Douro and the mountains.","The city is a good base for inland travel."]},"city-covilha":{"i":"/geo-images/portugal/city-covilha.webp","s":"Covilha is a mountain city on the edge of Serra da Estrela with a strong textile history.","f":["Covilha sits on the edge of Serra da Estrela.","The city has a strong textile history."]},"land-sao-francisco-church-porto":{"i":"/geo-images/portugal/land-sao-francisco-church-porto.webp","s":"The Church of São Francisco in Porto is famous for its richly gilded Baroque interior.","f":["The interior is heavily gilded.","The church sits in Porto's old town."]},"land-santa-luzia-sanctuary":{"i":"/geo-images/portugal/land-santa-luzia-sanctuary.webp","s":"The Santa Luzia Sanctuary sits above Viana do Castelo and is an iconic viewpoint.","f":["The view over the city and sea is famous.","The site belongs to Viana do Castelo."]},"hist-milreu-ruins":{"i":"/geo-images/portugal/hist-milreu-ruins.webp","s":"The Roman ruins of Milreu are near Faro and show the ancient history of the Algarve.","f":["The site sits near Faro.","Milreu shows Roman Algarve history."]},"hist-elvas-fortifications":{"i":"/geo-images/portugal/hist-elvas-fortifications.webp","s":"The Elvas fortifications are among Portugal's most impressive military structures.","f":["Elvas was a border defense point.","The ensemble is protected by UNESCO."]},"agri-vinho-verde-minho":{"i":"/geo-images/portugal/agri-vinho-verde-minho.webp","s":"The Vinho Verde region in northern Portugal is an important wine-growing area with fresh, light wines.","f":["Vinho Verde is a northern Portugal classic.","The wines are light and fresh."]},"agri-dao-vineyards":{"i":"/geo-images/portugal/agri-dao-vineyards.webp","s":"The Dão vineyards are among central Portugal's most respected wine landscapes.","f":["Dão is a premium wine region.","The soils are often granite-based."]},"agri-alentejo-olive-groves":{"i":"/geo-images/portugal/agri-alentejo-olive-groves.webp","s":"The olive groves of Alentejo define the wide plains of the south.","f":["Olive oil is a key product of Alentejo.","The landscape is wide and sunny."]},"industry-sines-petrochemical-complex":{"i":"/geo-images/portugal/industry-sines-petrochemical-complex.webp","s":"The Sines industrial complex is one of Portugal's most important energy sites.","f":["Sines is an energy site.","The port matters for industry."]},"industry-barcelos-ceramics":{"i":"/geo-images/portugal/industry-barcelos-ceramics.webp","s":"Barcelos ceramics represent a strong craft and production culture in northern Portugal.","f":["Ceramics are part of the city's identity.","Barcelos is known for the rooster."]},"kid-zoomarine-algarve":{"i":"/geo-images/portugal/kid-zoomarine-algarve.webp","s":"Zoomarine Algarve is a large family leisure and animal park on the southern coast.","f":["Shows and animals are central here.","The park sits in the Algarve."]},"kid-zoo-santo-inacio":{"i":"/geo-images/portugal/kid-zoo-santo-inacio.webp","s":"Zoo Santo Inacio is one of the best family attractions in the Porto area.","f":["The zoo sits near Porto.","It is designed for families."]},"kid-badoca-safari-park":{"i":"/geo-images/portugal/kid-badoca-safari-park.webp","s":"Badoca Safari Park near Setubal is a popular destination for families with children.","f":["The park sits near Setubal.","The concept feels safari-like."]},"cult-belem-tower":{"i":"/geo-images/portugal/belem-tower.webp","s":"The Belém Tower (Torre de Belém), an iconic symbol of Portugal's Age of Discovery, is a stunning limestone fortification that stands proudly on the northern bank of the Tagus River in Lisbon.","f":["The Belém Tower was built between 1514 and 1520 and is a prime example of the Portuguese Manueline style.","It was originally located on a small island in the middle of the Tagus River, but the river's course shifted a"]},"cult-sintra":{"i":"/geo-images/portugal/sintra.webp","s":"Sintra, a fairytale town nestled in the lush, mist-covered hills of the Serra de Sintra, is a place of extraordinary beauty and historical significance.","f":["Sintra was the first center of European Romantic architecture and has been a UNESCO World Heritage site since ","The Pena Palace was built on the ruins of a 16th-century monastery by King Ferdinand II."]},"cult-jeronimos":{"i":"/geo-images/portugal/cult-jeronimos.webp","s":"The Jerónimos Monastery in Lisbon is an outstanding example of Manueline architecture.","f":["Construction of the monastery began in 1501.","Vasco da Gama is buried here."]},"cult-batalha":{"i":"/geo-images/portugal/cult-batalha.webp","s":"The Batalha Monastery is a masterpiece of Portuguese Gothic and Manueline style.","f":["The official name is Monastery of Santa Maria da Vitória.","Construction lasted over 150 years."]},"cult-guimaraes":{"i":"/geo-images/portugal/cult-guimaraes.webp","s":"The historic old town of Guimarães is known as the 'cradle of the nation' of Portugal.","f":["The first king of Portugal, Afonso Henriques, was born here.","The center is part of the UNESCO World Heritage."]},"cult-pena":{"i":"/geo-images/portugal/cult-pena.webp","s":"The Pena Palace in Sintra is one of the finest examples of 19th-century Romanticism.","f":["The palace was built on the ruins of a monastery.","It was commissioned by King Ferdinand II."]},"cult-alcobaca":{"i":"/geo-images/portugal/cult-alcobaca.webp","s":"The Alcobaça Monastery is a UNESCO-listed Cistercian monastery and one of Portugal's most important medieval monuments.","f":["It was founded in the 12th century.","The church i f Portugal's most famous ancient monuments.","f":["The monument stands in the center of Evora.","It dates from Roman times."]},"hist-mafra-national-palace":{"i":"/geo-images/portugal/hist-mafra-national-palace.webp","s":"Mafra National Palace is a monumental Baroque complex near Lisbon.","f":["Construction began in the 18th century.","The complex includes a palace and basilica."]},"hist-conimbriga-ruins":{"i":"/geo-images/portugal/hist-conimbriga-ruins.webp","s":"Conimbriga is Portugal's best-known Roman archaeological site.","f":["It lies near Coimbra.","The mosaics are especially well preserved."]},"hist-almourol-castle":{"i":"/geo-images/portugal/hist-almourol-castle.webp","s":"Almourol Castle stands on an island in the Tagus River and is one of Portugal's most photogenic castles.","f":["The castle sits on a river island.","It was an important Templar fortress."]},"hist-silves-castle":{"i":"/geo-images/portugal/hist-silves-castle.webp","s":"Silves Castle is the most important Moorish fortress in the Algarve.","f":["The castle is a symbol of Algarve history.","Its walls are made of red sandstone."]},"land-maat-lisbon":{"i":"/geo-images/portugal/land-maat-lisbon.webp","s":"MAAT is one of Lisbon's most modern landmarks and combines art, architecture, and technology.","f":["MAAT sits on the riverfront.","It combines museum and architecture."]},"land-oceanario-lisboa":{"i":"/geo-images/portugal/land-oceanario-lisboa.webp","s":"Lisbon Oceanarium is one of Europe's largest aquariums and a top family attraction.","f":["It is one of Europe's largest aquariums.","The main exhibition is very famous."]},"land-padrao-descobrimentos":{"i":"/geo-images/portugal/land-padrao-descobrimentos.webp","s":"The Monument to the Discoveries is one of Lisbon's most iconic monuments on the Tagus waterfront.","f":["It stands right on the riverfront.","The monument was built in the 20th century."]},"land-casa-musica":{"i":"/geo-images/portugal/land-casa-musica.webp","s":"Casa da Musica is one of Porto's most modern landmarks and a symbol of contemporary architecture.","f":["The building was designed for Porto 2001.","It is a symbol of modern architecture."]},"land-bom-jesus-do-monte":{"i":"/geo-images/portugal/land-bom-jesus-do-monte.webp","s":"Bom Jesus do Monte is Braga's most famous sanctuary and a magnificent Baroque ensemble.","f":["The staircase is the most famous element.","The sanctuary sits above Braga."]},"land-dom-luis-bridge":{"i":"/geo-images/portugal/land-dom-luis-bridge.webp","s":"The Dom Luis I Bridge is Porto's most famous bridge and an instantly recognizable city symbol.","f":["The bridge opened in the 19th century.","It connects Porto with Gaia."]},"land-university-coimbra":{"i":"/geo-images/portugal/land-university-coimbra.webp","s":"The University of Coimbra is one of Portugal's oldest and most prestigious educational landmarks.","f":["It is part of the UNESCO World Heritage.","The university was founded in the 13th century."]},"land-sao-bento-station":{"i":"/geo-images/portugal/land-sao-bento-station.webp","s":"Sao Bento Station in Porto is famous for its huge azulejo panels.","f":["The hall is covered in azulejos.","The station is in central Porto."]},"port-sines":{"i":"/geo-images/portugal/port-sines.webp","s":"The Port of Sines is Portugal's most important deep-water port and a central logistics hub.","f":["Sines is a deep-water port.","The port is important for containers."]},"port-leixoes":{"i":"/geo-images/portugal/port-leixoes.webp","s":"The Port of Leixoes is the most important seaport in the Porto area and a driver of trade and industry.","f":["The port lies north of Porto.","It supports trade in the north."]},"port-setubal":{"i":"/geo-images/portugal/port-setubal.webp","s":"The Port of Setubal is closely tied to fishing, trade, and industry in the Sado area.","f":["The port sits on the Sado estuary.","Fishing remains an important sector."]},"agri-douro-vineyards":{"i":"/geo-images/portugal/agri-douro-vineyards.webp","s":"The Douro vineyards are among Portugal's best-known agricultural landscapes and define the look of the north.","f":["The area has UNESCO recognition.","Port wine is produced here."]},"agri-coruche-cork-oaks":{"i":"/geo-images/portugal/agri-coruche-cork-oaks.webp","s":"Coruche is a center of Portugal's cork industry and the cork oak landscape in Alentejo.","f":["Coruche is a cork center.","Cork oaks define the landscape."]},"industry-autoeuropa-palmela":{"i":"/geo-images/portugal/industry-autoeuropa-palmela.webp","s":"Autoeuropa in Palmela is one of Portugal's best-known industrial projects and a symbol of modern manufacturing.","f":["The site is in Palmela.","Car production is the main focus."]},"hist-convent-christ-tomar":{"i":"/geo-images/portugal/hist-convent-christ-tomar.webp","s":"The Convent of Christ in Tomar is one of Portugal's most important historic monuments.","f":["The site was a Templar center.","The complex is part of UNESCO World Heritage."]},"hist-peniche-fortress":{"i":"/geo-images/portugal/hist-peniche-fortress.webp","s":"Peniche Fortress guards the rocky peninsula on Portugal's west coast.","f":["The fortress sits on the Atlantic.","It was an important military point."]},"hist-national-tile-museum":{"i":"/geo-images/portugal/hist-national-tile-museum.webp","s":"The National Tile Museum in Lisbon is dedicated to Portuguese tile art.","f":["Azulejos are a central symbol of Portugal.","The museum is in a former convent."]},"land-sao-jorge-castle":{"i":"/geo-images/portugal/land-sao-jorge-castle.webp","s":"São Jorge Castle overlooks Lisbon's historic center.","f":["The castle is a symbol of Lisbon.","It sits on one of the highest hills."]},"nat-douro-valley":{"i":"/geo-images/portugal/douro-valley.webp","s":"The Douro Valley is a stunning region in Northern Portugal, famous for being the oldest demarcated wine region in the world.","f":["The Alto Douro Wine Region is a UNESCO World Heritage site.","The river flows from Spain to Porto."]},"nat-serra-estrela":{"i":"/geo-images/portugal/nat-serra-estrela.webp","s":"Serra da Estrela is the highest mountain range in mainland Portugal.","f":["The highest point is Torre, at 1,993 meters.","The region is famous for its sheep cheese (Queijo Serra da Estrela)."]},"nat-ria-formosa":{"i":"/geo-images/portugal/nat-ria-formosa.webp","s":"The Ria Formosa in the Algarve is a vast system of lagoons and islands.","f":["It was elected one of the Seven Natural Wonders of Portugal.","The area extends along 60 kilometers of coastline."]},"nat-benagil":{"i":"/geo-images/portugal/nat-benagil.webp","s":"The Benagil Cave is a spectacular sea cave on the Algarve coast, famous for its circular ceiling opening.","f":["The hole in the ceiling is called the 'eye'.","Inside the cave is a small sandy beach."]},"nat-sintra-cascais":{"i":"/geo-images/portugal/nat-sintra-cascais.webp","s":"The Sintra-Cascais Natural Park extends from the forested mountains of Sintra to the rugged Atlantic coast.","f":["Cabo da Roca is part of the park.","The region has a unique microclimate."]},"nat-peneda-geres":{"i":"/geo-images/portugal/nat-peneda-geres.webp","s":"Peneda-Gerês National Park is Portugal's only national park.","f":["It is Portugal's only national park.","The park is in the north of the country."]},"nat-douro-river":{"i":"/geo-images/portugal/nat-douro-river.webp","s":"The Douro is one of the great rivers of the Iberian Peninsula and a defining feature of northern Portugal.","f":["The river reaches the Atlantic at Porto.","The Douro defines the northern wine region."]},"nat-tejo-river":{"i":"/geo-images/portugal/nat-tejo-river.webp","s":"The Tagus is the longest river on the Iberian Peninsula and defines life around Lisbon.","f":["Lisbon sits on the Tagus estuary.","The river is historically central to Portugal."]},"nat-berlengas-island":{"i":"/geo-images/portugal/nat-berlengas-island.webp","s":"The Berlengas are a small island group off Portugal's west coast and a protected natural paradise.","f":["The islands lie off Peniche.","There are protected marine habitats."]},"mount-serra-do-caramulo":{"i":"/geo-images/portugal/mount-serra-do-caramulo.webp","s":"The Serra do Caramulo is a distinctive mountain range in central northern Portugal.","f":["The range sits in central northern Portugal.","Hiking is popular here."]},"mount-serra-de-montejunto":{"i":"/geo-images/portugal/mount-serra-de-montejunto.webp","s":"The Serra de Montejunto is a small but distinctive mountain range north of Lisbon.","f":["The range lies north of Lisbon.","It gives broad views over coast and inland."]},"lake-lagoa-de-albufeira":{"i":"/geo-images/portugal/lake-lagoa-de-albufeira.webp","s":"Lagoa de Albufeira is a coastal lagoon south of Lisbon with calm water and natural areas.","f":["The lagoon sits south of Lisbon.","Birdwatching is popular here."]},"river-rio-minho":{"i":"/geo-images/portugal/river-rio-minho.webp","s":"The Minho River forms much of Portugal's northern border.","f":["The river marks the northern border.","It links Portugal and Spain."]},"river-rio-mondego":{"i":"/geo-images/portugal/river-rio-mondego.webp","s":"The Mondego River is the longest river that starts and ends entirely in Portugal.","f":["The Mondego is closely linked to Coimbra.","The river defines central Portugal."]},"island-ilha-da-culatra":{"i":"/geo-images/portugal/island-ilha-da-culatra.webp","s":"Ilha da Culatra is one of the calm islands of the Ria Formosa in the Algarve.","f":["The island sits in the Ria Formosa.","Visitors get there only by boat."]},"forest-mata-nacional-de-leiria":{"i":"/geo-images/portugal/forest-mata-nacional-de-leiria.webp","s":"The Leiria National Forest is one of Portugal's best-known coastal forests.","f":["The forest zone protects dunes.","Leiria is the main reference point."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
