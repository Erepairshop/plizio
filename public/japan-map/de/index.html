const POI_CARD={"kawasaki-cities-v2":{"i":"/poi-images/kawasaki-cities-v2.webp","s":"Kawasaki liegt zwischen Tokio und Yokohama und ist eine der am dichtesten besiedelten Industriestädte Japans.","f":["Teil der Metropolregion Tokio.","Wichtiger Hafen und Industriestandort in der Bucht von Tokio."]},"saitama-cities-v2":{"i":"/poi-images/saitama-cities-v2.webp","s":"Saitama ist die Hauptstadt der gleichnamigen Präfektur und ein wichtiger Verkehrsknotenpunkt nördlich von Tokio.","f":["Gegründet 2001 durch den Zusammenschluss mehrerer Städte.","Omiya ist ein wichtiger Shinkansen-Halt."]},"chiba-cities-v2":{"i":"/poi-images/chiba-cities-v2.webp","s":"Chiba liegt an der Ostseite der Bucht von Tokio und ist berühmt für das Messezentrum Makuhari Messe.","f":["Ein Großteil der Küste besteht aus künstlichem Land.","Die Einschienenbahn hat eine Länge von über 15 Kilometern."]},"kitakyushu-cities-v2":{"i":"/poi-images/kitakyushu-cities-v2.webp","s":"Kitakyushu ist die nördlichste Stadt auf der Insel Kyushu und war historisch ein wichtiges Zentrum der Stahlindustrie.","f":["Verbindet Kyushu mit der Hauptinsel Honshu über die Kanmon-Brücke.","Die Kokura-Burg ist ein Symbol der Stadt."]},"niigata-cities-v2":{"i":"/poi-images/niigata-cities-v2.webp","s":"Niigata ist die größte Hafenstadt an der Küste des Japanischen Meeres in der Region Chubu.","f":["Der Shinano-Fluss mündet hier ins Meer.","Im Winter verzeichnet die Region starken Schneefall."]},"kumamoto-cities-v2":{"i":"/poi-images/kumamoto-cities-v2.webp","s":"Kumamoto ist eine historische Festungsstadt auf Kyushu, deren schwarze Burg zu den eindrucksvollsten Japans zählt.","f":["Die Burg Kumamoto wurde 1607 fertiggestellt.","2016 erlebte die Stadt schwere Erdbeben."]},"okayama-cities-v2":{"i":"/poi-images/okayama-cities-v2.webp","s":"Okayama wird wegen seines milden Klimas oft als das 'Land des Sonnenscheins' bezeichnet.","f":["Okayama ist der Schauplatz des Märchens von Momotaro.","Die Region ist berühmt für ihre weißen Pfirsiche."]},"kagoshima-cities-v2":{"i":"/poi-images/kagoshima-cities-v2.webp","s":"Aufgrund des warmen Klimas und der Lage an einer weiten Bucht wird Kagoshima oft als das 'Neapel des Ostens' bezeichnet.","f":["War das Zentrum der Satsuma-Domäne in der Edo-Zeit.","Bekannt für heiße Sandbäder im nahegelegenen Ibusuki."]},"himeji-cities-v2":{"i":"/poi-images/himeji-cities-v2.webp","s":"Himeji in der Präfektur Hyogo ist vor allem für seine strahlend weiße Burg Himeji bekannt, die zum UNESCO-Weltkulturerbe gehört.","f":["Die Burg überstand Bombenangriffe und Erdbeben unbeschadet.","Der Kokoen-Garten grenzt direkt an die Burganlage."]},"matsuyama-cities-v2":{"i":"/poi-images/matsuyama-cities-v2.webp","s":"Matsuyama ist die größte Stadt auf der Insel Shikoku und berühmt für das Dogo Onsen, eines der ältesten Thermalbäder Japans.","f":["Dogo Onsen inspirierte das Badehaus im Film 'Chihiros Reise ins Zauberland'.","Die Stadt ist ein Zentrum des Haiku-Dichters Masaoka Shiki."]},"utsunomiya-cities-v2":{"i":"/poi-images/utsunomiya-cities-v2.webp","s":"Utsunomiya liegt in der Präfektur Tochigi und gilt in ganz Japan als die Stadt der Gyoza.","f":["Verzeichnet den höchsten Pro-Kopf-Verbrauch von Gyoza im Land.","Liegt auf der Route zum Nikko-Nationalpark."]},"oita-cities-v2":{"i":"/poi-images/oita-cities-v2.webp","s":"Oita ist eine Küstenstadt auf Kyushu und das Tor zu den berühmten Thermalquellen von Beppu und Yufuin.","f":["Bekannt für die Produktion von Kabosu-Zitrusfrüchten.","Historisch wichtig für den Handel mit Portugal im 16. Jahrhundert."]},"nagasaki-cities-v2":{"i":"/poi-images/nagasaki-cities-v2.webp","s":"Nagasaki hat eine einzigartige Geschichte, da es während der Isolation Japans der einzige für den Westen geöffnete Hafen war.","f":["Die künstliche Insel Dejima war der Handelsposten der Niederländer.","Glover Garden zeigt Residenzen westlicher Kaufleute aus dem 19. Jahrhundert."]},"kanazawa-cities-v2":{"i":"/poi-images/kanazawa-cities-v2.webp","s":"Kanazawa in der Prä ka-Berg überragt, auf dem die Burg Gifu thront, von der aus Oda Nobunaga einst seine Feldzüge plante.","f":["Hat eine lange Tradition in der Herstellung von Papierlaternen und Schirmen.","Die Kormoranfischerei am Nagara-Fluss wird seit 1300 Jahren praktiziert."]},"fukui-cities-v2":{"i":"/poi-images/fukui-cities-v2.webp","s":"Fukui an der Westküste ist historisch bedeutsam durch die Ausgrabungsstätte des Asakura-Clans aus der Sengoku-Zeit.","f":["Die Tojinbo-Klippen an der Küste bestehen aus seltenen Basaltsäulen.","Über 80% der japanischen Brillengestelle werden in der Präfektur hergestellt."]},"aomori-cities-v2":{"i":"/poi-images/aomori-cities-v2.webp","s":"Aomori liegt an der nördlichsten Spitze von Honshu und ist das kulturelle Zentrum der Tohoku-Region.","f":["War der Haupt-Fährhafen nach Hokkaido vor dem Bau des Seikan-Tunnels.","Gehört zu den Städten mit dem stärksten Schneefall der Welt."]},"akita-cities-v2":{"i":"/poi-images/akita-cities-v2.webp","s":"Akita an der Westküste von Tohoku ist eingebettet in eine Landschaft aus Reisfeldern und bewaldeten Bergen.","f":["Die Region produziert erstklassigen Sake dank exzellentem Reis und Wasser.","Die Akita-Hunderasse stammt aus der Bergregion dieser Präfektur."]},"morioka-cities-v2":{"i":"/poi-images/morioka-cities-v2.webp","s":"Morioka liegt in einem weiten Tal, das vom vulkanischen Berg Iwate überragt wird.","f":["Wanko Soba ist ein berühmtes Nudel-Wettessen in Morioka.","Der Kitakami-Fluss durchquert das Stadtzentrum."]},"yamagata-cities-v2":{"i":"/poi-images/yamagata-cities-v2.webp","s":"Umgeben von majestätischen Bergen ist Yamagata eine Basis für Naturliebhaber und Onsen-Besucher.","f":["Das Yamagata-Hanagasa-Matsuri zieht im August über eine Million Besucher an.","Die Präfektur ist der größte Kirschenproduzent Japans."]},"fukushima-cities-v2":{"i":"/poi-images/fukushima-cities-v2.webp","s":"Die Hauptstadt der gleichnamigen Präfektur ist umgeben von tiefen Wäldern und heißen Quellen wie dem Iizaka Onsen.","f" oi-images/yoshino-ruins-history-v2.webp","s":"Eine große und komplexe archäologische Stätte, die eine Siedlung aus der Yayoi-Zeit (ca.","f":["Eine der größten und wichtigsten Stätten der Yayoi-Zeit in Japan.","Umfasst Wachtürme, Grubenhäuser und Grabhügel."]},"sekigahara-battlefield-history-v2":{"i":"/poi-images/sekigahara-battlefield-history-v2.webp","s":"Der Ort der entscheidenden Schlacht von 1600, die den Weg für die Errichtung des Tokugawa-Shogunats ebnete.","f":["Gilt als die größte und wichtigste Schlacht in der japanischen Feudalgeschichte.","Tokugawa Ieyasus Sieg führte zu über 250 Jahren Frieden."]},"dejimia-island-history-v2":{"i":"/poi-images/dejimia-island-history-v2.webp","s":"Eine künstliche Insel in Nagasaki, die während der japanischen Isolationszeit (1641-1853) als einziger Handelsposten für die Niederländer diente.","f":["Ursprünglich für portugiesische Händler gebaut.","War über 200 Jahre lang das Zentrum des japanisch-niederländischen Handels."]},"sannai-maruyama-history-v2":{"i":"/poi-images/sannai-maruyama-history-v2.webp","s":"Eine der größten und am besten erhaltenen prähistorischen Jōmon-Siedlungen (ca.","f":["War von ca. 3900 bis 2300 v. Chr. bewohnt.","Die Entdeckung im Jahr 1992 veränderte das Verständnis der Jōmon-Kultur."]},"peace-monument-okinawa-history-v2":{"i":"/poi-images/peace-monument-okinawa-history-v2.webp","s":"Ein Denkmal im Süden der Insel Okinawa, das an die Schlacht von Okinawa im Jahr 1945 erinnert.","f":["Der Grundstein des Friedens enthält die Namen aller, die in der Schlacht gestorben sind, unabhängig von ihrer ","Das Friedensdenkmal-Museum Okinawa dokumentiert die Geschichte der Schlacht."]},"takeda-castle-ruins-history-v2":{"i":"/poi-images/takeda-castle-ruins-history-v2.webp","s":"Bekannt als das 'Machu Picchu Japans', sind diese Ruinen auf einem Berggipfel berühmt für das Phänomen des 'Wolkenmeers' (unkai), das die Burg an Herbstmorgen wie schwebend erscheinen lässt.","f":["Die Burg wurde ursprünglich im 15. Jahrhundert erbaut.","Die Steinmauern sind alles, was von der ursprünglichen Struktur übrig geblieben ist."]},"ichijodani-asakura-ruins-history-v2":{"i":"/poi-images/ichijodani-asakura-ruins-history-v2.webp","s":"Die Ruinen einer ganzen Burgstadt aus der Sengoku-Zeit, die vom Asakura-Clan regiert wurde.","f":["Gibt einen einzigartigen Einblick in das Leben während der Zeit der Streitenden Reiche.","Die Stätte umfasst Samurai-Residenzen, Tempel, Kaufmannshäuser und Handwerkerquartiere."]},"hara-castle-ruins-history-v2":{"i":"/poi-images/hara-castle-ruins-history-v2.webp","s":"Der Ort des letzten Gefechts der Shimabara-Rebellion (1637-1638), einem Aufstand von meist katholischen Bauern.","f":["Die Rebellion war einer der Hauptgründe für Japans Politik der nationalen Isolation.","Die Stätte ist Teil des UNESCO-Weltkulturerbes 'Verborgene christliche Stätten in der Region Nagasaki'."]},"sugawara-no-michizane-tomb-history-v2":{"i":"/poi-images/sugawara-no-michizane-tomb-history-v2.webp","s":"Ein bedeutender Shintō-Schrein, der über dem Grab von Sugawara no Michizane erbaut wurde, einem Gelehrten und Politiker der Heian-Zeit, der posthum als Tenjin, der Gott der Gelehrsamkeit, verehrt w...","f":["Der wichtigste von über 12.000 Tenmangū-Schreinen in Japan.","Studenten beten hier für Erfolg bei Prüfungen."]},"izumo-taisha-shrine-history-v2":{"i":"/poi-images/izumo-taisha-shrine-history-v2.webp","s":"Einer der ältesten und wichtigsten Shintō-Schreine in Japan.","f":["Das genaue Gründungsdatum ist unbekannt, aber es wird in den ältesten Chroniken Japans erwähnt.","Die Haupthalle (Honden) ist mit 24 Metern die höchste in Japan."]},"azuchi-castle-ruins-history-v2":{"i":"/poi-images/azuchi-castle-ruins-history-v2.webp","s":"Die Ruinen der Burg von Oda Nobunaga, einem der großen Reichseiniger Japans.","f":["Eine der ersten Burgen in Japan mit einem hohen zentralen Bergfried (Tenshu).","Sollte Nobunagas Macht und Reichtum demonstrieren."]},"gassho-zukuri-villages-history-v2":{"i":"/poi-images/gassho-zukuri-villages-history-v2.webp","s":"Diese Dörfer sind berühmt für ihre traditionellen Gasshō-Zukuri-Bauernhäuser, deren steile Strohdächer wie zum Gebet gefaltete Hände aussehen.","f":["UNESCO-Weltkulturerbe.","Einige der Häuser sind über 250 Jahre alt."]},"hiraizumi-temples-history-v2":{"i":"/poi-images/hiraizumi-temples-history-v2.webp","s":"Ein Ensemble von Stätten aus dem 11.","f":["UNESCO-Weltkulturerbe.","Der Chūson-ji-Tempel mit seiner goldenen Halle (Konjikidō) ist das berühmteste Bauwerk."]},"sugimoto-residence-history-v2":{"i":"/poi-images/sugimoto-residence-history-v2.webp","s":"Ein großes, gut erhaltenes Kaufmannshaus (machiya) aus der Edo-Zeit in Kyoto.","f":["Erbaut im Jahr 1743 und als Wichtiges Kulturgut Japans ausgewiesen.","Das Haus verfügt über mehrere Innenhöfe und Lagerräume (kura)."]},"tombs-of-mozufuruichi-history-v2":{"i":"/poi-images/tombs-of-mozufuruichi-history-v2.webp","s":"Eine Gruppe von Megalithgräbern oder Kofun (Tumuli), die für die herrschende Elite im 4.","f":["UNESCO-Weltkulturerbe.","Umfasst das Daisen Kofun, das als das Grab von Kaiser Nintoku gilt und eines der größten Gräber der Welt ist."]},"adachi-museum-garden-history-v2":{"i":"/poi-images/adachi-museum-garden-history-v2.webp","s":"Obwohl es modern ist, ist der Garten des Museums berühmt dafür, über ein Jahrzehnt lang als der beste japanische Garten des Landes ausgezeichnet worden zu sein.","f":["Gegründet 1970 von Adachi Zenko.","Der Garten kann nur von innerhalb des Museumsgebäudes betrachtet werden."]},"tsumago-juku-post-town-history-v2":{"i":"/poi-images/tsumago-juku-post-town-history-v2.webp","s":"Eine gut erhaltene Poststation an der alten Nakasendō-Handelsroute, die Edo (Tokio) mit Kyoto verband.","f":["Eine der ersten Städte in Japan, die ihre historische Bausubstanz unter Schutz stellte.","Stromkabel und Telefonmasten sind versteckt, um die historische Ansicht zu erhalten."]},"iwami-ginzan-silver-mine-history-v2":{"i":"/poi-images/iwami-ginzan-silver-mine-history-v2.webp","s":"Eine große Silbermine, die vom 16.","f":["UNESCO-Weltkulturerbe.","Die Stätte umfasst die Minenschächte, Festungsruinen, Schreine und die umliegende Stadt Ōmori."]},"kakunodate-samurai-district-history-v2":{"i":"/poi-images/kakunodate-samurai-district-history-v2.webp","s":"Eine ehemalige Burgstadt, die für ihr gut erhaltenes Samurai-Viertel bekannt ist.","f":["Das Viertel ist eines der besten Beispiele für Samurai-Architektur in Japan.","Viele der Samurai-Häuser sind für die Öffentlichkeit zugänglich."]},"imperial-palace-tokyo-landmarks-v2":{"i":"/poi-images/imperial-palace-tokyo-landmarks-v2.webp","s":"Die Hauptresidenz des Kaisers von Japan.","f":["Der innere Bereich des Palastes ist für die Öffentlichkeit nur an zwei Tagen im Jahr zugänglich.","Die Ostgärten sind regelmäßig für die Öffentlichkeit zugänglich."]},"hakone-open-air-museum-landmarks-v2":{"i":"/poi-images/hakone-open-air-museum-landmarks-v2.webp","s":"Japans erstes Freilichtmuseum, das eine harmonische Balance zwischen Natur und Kunst schafft und Skulpturen in einer malerischen Umgebung mit Blick auf die Berge von Hakone präsentiert.","f":["Beherbergt über 100 Werke von Henry Moore, Rodin und anderen.","Der Picasso-Pavillon zeigt eine große Sammlung seiner Werke."]},"nachi-falls-landmarks-v2":{"i":"/poi-images/nachi-falls-landmarks-v2.webp","s":"Einer der bekanntesten Wasserfälle Japans mit einer Höhe von 133 Metern.","f":["Japans höchster ununterbrochener Wasserfall.","Wird oft zusammen mit der dreistöckigen Pagode des Seiganto-ji-Tempels fotografiert."]},"un-chastel-en-le-ciel-landmarks-v2":{"i":"/poi-images/un-chastel-en-le-ciel-landmarks-v2.webp","s":"Diese Bergspitzenruinen sind als 'Machu Picchu Japans' bekannt und berühmt für das 'Meer aus Wolken' (unkai), das sie an Herbstmorgen umgibt und sie wie schwebend erscheinen lässt.","f":["Die Burg wurde im 15. Jahrhundert erbaut, aber im 17. Jahrhundert aufgegeben.","Die Steinmauern sind alles, was übrig geblieben ist."]},"tokyo-metropolitan-gov-bldg-landmarks-v2":{"i":"/poi-images/tokyo-metropolitan-gov-bldg-landmarks-v2.webp","s":"Ein hoch aufragender Komplex in Shinjuku, der als Rathaus von Tokio dient.","f":["Entworfen von dem Architekten Kenzo Tange.","Das Design soll einem Computerchip ähneln."]},"rainbow-bridge-tokyo-landmarks-v2":{"i":"/poi-images/rainbow-bridge-tokyo-landmarks-v2.webp","s":"Eine massive Hängebrücke, die die Bucht von Tokio überquert und das Shibaura-Pier mit der künstlichen Insel Odaiba verbindet.","f":["Die offizielle Bezeichnung lautet 'Tokyo Port Connector Bridge'.","Die Brücke trägt zwei Verkehrsebenen, eine Autobahn und eine Bahnlinie."]},"gundam-factory-yokohama-landmarks-v2":{"i":"/poi-images/gundam-factory-yokohama-landmarks-v2.webp","s":"Eine zeitlich begrenzte Attraktion mit einem riesigen, beweglichen Gundam-Roboter in Lebensgröße.","f":["Geschaffen zur Feier des 40-jährigen Jubiläums des Gundam-Franchise.","Besucher können von Aussichtsplattformen in verschiedenen Höhen aus zusehen."]},"usuki-stone-buddhas-landmarks-v2":{"i":"/poi-images/usuki-stone-buddhas-landmarks-v2.webp","s":"Eine Sammlung von Dutzenden von Steinbuddhas aus der Heian- und Kamakura-Zeit, die in weichen Vulkangesteinsklippen gehauen wurden.","f":["Die größte Konzentration von Steinbuddhas in Japan.","Der genaue Ursprung und die Schöpfer sind unbekannt."]},"tottori-sand-dunes-landmarks-v2":{"i":"/poi-images/tottori-sand-dunes-landmarks-v2.webp","s":"Ein einzigartiges geologisches Merkmal, diese großen Sanddünen erstrecken sich entlang der Küste des Japanischen Meeres und schaffen eine wüstenähnliche Landschaft.","f":["Teil des San'in-Kaigan-Geoparks.","Die Dünen sind über 16 Kilometer lang und bis zu 2 Kilometer breit."]},"ise-grand-shrine-landmarks-v2":{"i":"/poi-images/ise-grand-shrine-landmarks-v2.webp","s":"Der heiligste Shinto-Schrein Japans, gewidmet der Sonnengöttin Amaterasu.","f":["Die Schreingebäude werden alle 20 Jahre im Rahmen einer Tradition namens Shikinen Sengu neu gebaut.","Nur der Kaiser und bestimmte Priester dürfen das Innerste betreten."]},"lake-ashinoko-landmarks-v2":{"i":"/poi-images/lake-ashinoko-landmarks-v2.webp","s":"Ein malerischer Kratersee in Hakone, der an klaren Tagen einen atemberaubenden Blick auf den Berg Fuji bietet.","f":["Entstand vor etwa 3.000 Jahren durch einen Vulkanausbruch.","Das rote Torii-Tor des Hakone-Schreins scheint im Wasser zu 'schwimmen'."]},"teamlab-borderless-landmarks-v2":{"i":"/poi-images/teamlab-borderless-landmarks-v2.webp","s":"Ein bahnbrechendes digitales Kunstmuseum, in dem Kunstwerke sich frei bewegen, miteinander interagieren und neue Werke schaffen.","f":["Es gibt keine Karte oder festgelegten Weg durch das Museum.","Die Kunstwerke werden in Echtzeit von Computerprogrammen gerendert."]},"kurashiki-bikan-historical-quarter-landmarks-v2":{"i":"/poi-images/kurashiki-bikan-historical-quarter-landmarks-v2.webp","s":"Ein wunderschön erhaltenes Kaufmannsviertel aus der Edo-Zeit entlang eines malerischen Kanals.","f":["Der Kanal ist gesäumt von Trauerweiden und Stegbrücken.","Bootsfahrten auf dem Kanal sind eine beliebte Aktivität."]},"naoshima-art-island-landmarks-v2":{"i":"/poi-images/naoshima-art-island-landmarks-v2.webp","s":"Eine kleine Insel im Seto-Binnenmeer, die für ihre modernen Kunstmuseen, Architektur und Skulpturen im Freien bekannt ist.","f":["Das Benesse-Haus ist ein Museum, das in ein Hotel integriert ist.","Das Chichu-Kunstmuseum zeigt Werke von Claude Monet, Walter De Maria und James Turrell."]},"magome-juku-post-town-landmarks-v2":{"i":"/poi-images/magome-juku-post-town-landmarks-v2.webp","s":"Eine wunderschön restaurierte Poststation im Kiso-Tal, die die Nakasendo-Route bediente.","f":["Der Wanderweg zwischen Magome und Tsumago ist ein beliebter Abschnitt des alten Nakasendo.","Die Hauptstraße ist für den Autoverkehr gesperrt."]},"mount-koya-landmarks-v2":{"i":"/poi-images/mount-koya-landmarks-v2.webp","s":"Das Zentrum des Shingon-Buddhismus, einer wichtigen buddhistischen Sekte.","f":["Gegründet im 9. Jahrhundert von Kobo Daishi, dem Gründer des Shingon-Buddhismus.","Der Okunoin-Friedhof ist der größte in Japan und der Standort von Kobo Daishis Mausoleum."]},"onomichi-temple-walk-landmarks-v2":{"i":"/poi-images/onomichi-temple-walk-landmarks-v2.webp","s":"Ein Wanderweg, der sich durch die Hügel von Onomichi schlängelt und etwa 25 Tempel miteinander verbindet.","f":["Der Weg ist etwa 2,5 Kilometer lang.","Der Senko-ji-Tempel auf halber Höhe des Hügels ist einer der berühmtesten."]},"beppu-hells-landmarks-v2":{"i":"/poi-images/beppu-hells-landmarks-v2.webp","s":"Eine Reihe von spektakulären heißen Quellen zum Betrachten, nicht zum Baden.","f":["Es gibt sieben 'Höllen', die man besichtigen kann.","Umi Jigoku (Meereshölle) ist ein wunderschöner kobaltblauer Teich."]},"takachiho-gorge-landmarks-v2":{"i":"/poi-images/takachiho-gorge-landmarks-v2.webp","s":"Eine beeindruckende Schlucht, die vom Gokase-Fluss geformt wurde, mit steilen vulkanischen Basaltwänden.","f":["Der Manai-Wasserfall stürzt in die Schlucht und trägt zu ihrer Schönheit bei.","Takachiho ist ein Ort von großer Bedeutung in der japanischen Mythologie."]},"mori-art-museum-landmarks-v2":{"i":"/poi-images/mori-art-museum-landmarks-v2.webp","s":"Ein Museum für zeitgenössische Kunst auf den obersten Etagen des Roppongi Hills Mori Tower.","f":["Befindet sich im 53. Stock und bietet einen atemberaubenden Blick auf die Stadt.","Konzentriert sich auf Kunst aus Asien und dem Pazifikraum."]},"ueno-park-and-zoo-life-v2":{"i":"/poi-images/ueno-park-and-zoo-life-v2.webp","s":"Ein großer öffentlicher Park in Tokio, der mehrere Museen, einen Schrein und den ältesten Zoo Japans beherbergt.","f":["Gegründet im Jahr 1873.","Der Ueno Zoo ist berühmt für seine Riesenpandas."]},"yoyogi-park-life-v2":{"i":"/poi-images/yoyogi-park-life-v2.webp","s":"Einer der größten Parks Tokios, bekannt für seine weiten Rasenflächen, Teiche und bewaldeten Gebiete.","f":["Standort des ehemaligen olympischen Dorfes für die Olympischen Spiele 1964 in Tokio.","Angrenzend an den Meiji-Schrein."]},"shinjuku-gyoen-national-garden-life-v2":{"i":"/poi-images/shinjuku-gyoen-national-garden-life-v2.webp","s":"Ein großer Park in Shinjuku mit drei verschiedenen Gartenstilen: einem traditionellen japanischen Landschaftsgarten, einem formellen französischen Garten und einem englischen Landschaftsgarten.","f":["War ursprünglich eine kaiserliche Residenz.","Einer der besten Orte in Tokio, um Kirschblüten zu sehen."]},"fuji-q-highland-life-v2":{"i":"/poi-images/fuji-q-highland-life-v2.webp","s":"Ein Vergnügungspark am Fuße des Berges Fuji, bekannt für seine rekordverdächtigen Achterbahnen und atemberaubenden Ausblicke.","f":["Beherbergt einige der steilsten und schnellsten Achterbahnen der Welt.","Das 'Super Scary Labyrinth of Fear' ist eines der größten Spukhäuser Japans."]},"ghibli-museum-mitaka-life-v2":{"i":"/poi-images/ghibli-museum-mitaka-life-v2.webp","s":"Ein skurriles Museum, das der Arbeit des Animationsstudios Studio Ghibli gewidmet ist.","f":["Entworfen vom Regisseur Hayao Miyazaki selbst.","Der Slogan des Museums lautet 'Verirren wir uns gemeinsam'."]},"niseko-united-agriculture-life-v2":{"i":"/poi-images/niseko-united-agriculture-life-v2.webp","s":"Die Region um Niseko ist nicht nur für ihren Pulverschnee bekannt, sondern auch für ihre Landwirtschaft.","f":["Der vulkanische Boden ist reich an Mineralien.","Viele Restaurants in Niseko verwenden lokale Produkte."]},"kushiro-shitsugen-wildlife-v2":{"i":"/poi-images/kushiro-shitsugen-wildlife-v2.webp","s":"Japans größtes Feuchtgebiet, ein wichtiger Lebensraum für viele Pflanzen- und Tierarten.","f":["Ausgewiesen als Nationalpark und Ramsar-Gebiet.","Die Mandschurenkraniche waren einst vom Aussterben bedroht."]},"jigokudani-monkey-park-life-v2":{"i":"/poi-images/jigokudani-monkey-park-life-v2.webp","s":"Berühmt für seine Japanmakaken, auch bekannt als Schneeaffen, die im Winter in den heißen Quellen (Onsen) baden.","f":["'Jigokudani' bedeutet 'Höllental' wegen des Dampfes und des kochenden Wassers.","Die Affen leben frei in den umliegenden Wäldern."]},"furano-flower-fields-agriculture-v2":{"i":"/poi-images/furano-flower-fields-agriculture-v2.webp","s":"Furano in Hokkaido ist berühmt für seine weitläufigen Lavendelfelder, die im Sommer blühen.","f":["Die Lavendelblüte erreicht ihren Höhepunkt normalerweise im Juli.","Die Farm Tomita ist einer der bekanntesten Orte, um die Blumen zu sehen."]},"tokyo-disneyland-disneysea-life-v2":{"i":"/poi-images/tokyo-disneyland-disneysea-life-v2.webp","s":"Zwei Themenparks in Chiba, die ein magisches Erlebnis für Besucher jeden Alters bieten.","f":["Der erste Disney-Park, der außerhalb der Vereinigten Staaten gebaut wurde.","Tokyo DisneySea gilt oft als einer der besten Themenparks der Welt."]},"hokkaido-dairy-farms-agriculture-v2":{"i":"/poi-images/hokkaido-dairy-farms-agriculture-v2.webp","s":"Hokkaido ist das Herz der japanischen Milchindustrie und produziert über die Hälfte der gesamten Milch des Landes.","f":["Bekannt für hochwertige Milch, Butter, Käse und Eiscreme.","Viele Farmen bieten Touren, Butterherstellungs-Workshops und Verkostungen an."]},"shiretoko-national-park-wildlife-v2":{"i":"/poi-images/shiretoko-national-park-wildlife-v2.webp","s":"Einer der entlegensten und unberührtesten Parks Japans.","f":["UNESCO-Weltnaturerbe.","Eine der dichtesten Braunbärenpopulationen der Welt."]},"kerama-shoto-national-park-wildlife-v2":{"i":"/poi-images/kerama-shoto-national-park-wildlife-v2.webp","s":"Eine Gruppe von Inseln vor der Küste Okinawas, bekannt für ihr außergewöhnlich klares Wasser, das als 'Kerama Blue' bekannt ist.","f":["Das Wasser hat eine Sichtweite von 30-40 Metern.","Lebensraum für eine Vielzahl von Korallenriffen und tropischen Fischen."]},"sanrio-puroland-life-v2":{"i":"/poi-images/sanrio-puroland-life-v2.webp","s":"Ein Indoor-Themenpark, der den Charakteren von Sanrio wie Hello Kitty, My Melody und Gudetama gewidmet ist.","f": const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=6;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry","other"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
