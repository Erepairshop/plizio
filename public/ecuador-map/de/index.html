rico-guayaquil-landmarks-v2":{"i":"/poi-images/parque-historico-guayaquil-landmarks-v2.webp","s":"Ein Themenpark, der historische Architektur, die traditionelle Lebensweise und die einheimische Tierwelt der Küstenregion vereint.","f":["Erstreckt sich über 8 Hektar Land.","Beinhaltet originale koloniale Holzhäuser, die vor dem Abriss gerettet wurden."]},"edificio-the-point-landmarks-v2":{"i":"/poi-images/edificio-the-point-landmarks-v2.webp","s":"Ein ikonischer, spiralförmiger Wolkenkratzer am Ufer des Guayas, der das Symbol des modernen Guayaquil darstellt.","f":["Ist mit 137 Metern das höchste Gebäude in Ecuador.","Wurde 2013 fertiggestellt."]},"basilica-de-la-virgen-del-quinche-landmarks-v2":{"i":"/poi-images/basilica-de-la-virgen-del-quinche-landmarks-v2.webp","s":"Ein monumentales katholisches Heiligtum, in dem die wundersame Holzstatue der Schutzpatronin Ecuadors verehrt wird.","f":["Die Basilika wurde zwischen 1913 und 1928 erbaut.","Die verehrte Holzfigur stammt aus dem 16. Jahrhundert."]},"estadio-olimpico-atahualpa-landmarks-v2":{"i":"/poi-images/estadio-olimpico-atahualpa-landmarks-v2.webp","s":"Das traditionsreiche Sportstadion im Herzen von Quito, das historische Triumphe der ecuadorianischen Fußballnationalmannschaft erlebte.","f":["Wurde 1951 eingeweiht.","Bietet Platz für etwa 35.000 Zuschauer."]},"estadio-george-capwell-landmarks-v2":{"i":"/poi-images/estadio-george-capwell-landmarks-v2.webp","s":"Die Heimat des Fußballclubs Emelec, bekannt für seine steilen Tribünen im englischen Stil und seine elektrisierende Atmosphäre.","f":["Das ursprüngliche Stadion wurde 1945 eröffnet.","Zuletzt wurde es 2017 grundlegend modernisiert."]},"cajas-nationalpark-life-v2":{"i":"/poi-images/cajas-nationalpark-life-v2.webp","s":"Ein Hochland-Nationalpark mit über 200 Seen und vielen endemischen Vogelarten.","f":["Liegt auf über 3000 Metern Höhe.","Heimat des Andenkondors."]},"sangay-nationalpark-life-v2":{"i":"/poi-images/sangay-nationalpark-life-v2.webp","s":"Ein UNE ,"s":"Traditionelle Kaffeeplantagen in der Bergregion von El Oro, berühmt für einige der besten Arabica-Bohnen Südamerikas.","f":["Der Kaffee wird oft noch handgepflückt.","Zaruma ist eine bedeutende Kaffeestadt in Ecuador."]},"kakaoplantage-arriba-life-v2":{"i":"/poi-images/kakaoplantage-arriba-life-v2.webp","s":"Eine Plantage, die den weltberühmten 'Nacional'-Kakao anbaut, der für sein außergewöhnliches blumiges Aroma geschätzt wird.","f":["Die Sorte 'Fino de Aroma' wird hier kultiviert.","Ecuador ist der weltgrößte Exporteur dieser Kakaosorte."]},"mariposario-mindo-life-v2":{"i":"/poi-images/mariposario-mindo-life-v2.webp","s":"Ein interaktiver Garten im Nebelwald, in dem Besucher Hunderte von farbenprächtigen Schmetterlingen in allen Lebensstadien beobachten können.","f":["Besonders viele Morpho-Falter sind zu sehen.","Kinder können Puppen und Raupen aus der Nähe betrachten."]},"darwin-station-life-v2":{"i":"/poi-images/darwin-station-life-v2.webp","s":"Eine biologische Forschungsstation auf den Galápagos-Inseln, die sich dem Schutz und der Aufzucht der Riesenschildkröten widmet.","f":["Das ehemalige Zuhause von 'Lonesome George'.","Wissenschaftliches Zentrum des Archipels."]},"schildkroetenzentrum-colorado-life-v2":{"i":"/poi-images/schildkroetenzentrum-colorado-life-v2.webp","s":"Ein Zucht- und Schutzgebiet auf der Insel San Cristóbal zur Erhaltung der bedrohten Galápagos-Riesenschildkröten.","f":["Schützt die endemische Population der Insel.","Verfügt über Wanderwege in natürlicher Umgebung."]},"fauna-reservat-chimborazo-life-v2":{"i":"/poi-images/fauna-reservat-chimborazo-life-v2.webp","s":"Ein Schutzgebiet am höchsten Berg Ecuadors, das speziell für den Schutz von Vicuñas, Alpakas und Lamas eingerichtet wurde.","f":["Vicuñas wurden hier in den 1980er Jahren erfolgreich wiederangesiedelt.","Die Landschaft ist karg und beeindruckend."]},"cayapas-mataje-mangroven-life-v2":{"i":"/poi-images/cayapas-mataje-mangroven-life-v2.webp","s":"Ein riesiges Mangrovengebie kane"]},"tungurahua-nature-v2":{"i":"/poi-images/tungurahua-nature-v2.webp","s":"Der Tungurahua ist ein hochaktiver Vulkan über der Stadt Baños, bekannt für seine häufigen Ascheausbrüche und Lavaströme.","f":["Höhe: 5.023 Meter","Name bedeutet 'Feuerschlund'"]},"pichincha-nature-v2":{"i":"/poi-images/pichincha-nature-v2.webp","s":"Der Pichincha ist ein aktiver Stratovulkan, der sich direkt über der Hauptstadt Quito erhebt und aus mehreren Gipfeln besteht.","f":["Höhe: 4.784 Meter (Rucu)","Überragt Quito"]},"quilotoa-nature-v2":{"i":"/poi-images/quilotoa-nature-v2.webp","s":"Quilotoa ist eine wassergefüllte Caldera und der westlichste Vulkan der ecuadorianischen Anden, berühmt für sein smaragdgrünes Wasser.","f":["Durchmesser: 3 Kilometer","Smaragdgrüne Farbe"]},"cuicocha-nature-v2":{"i":"/poi-images/cuicocha-nature-v2.webp","s":"Cuicocha ist ein beeindruckender Kratersee am Fuße des Cotacachi-Vulkans, in dessen Mitte sich zwei kleine Inseln erheben.","f":["Name bedeutet 'Meerschweinchensee'","Zwei bewaldete Inseln"]},"san-pablo-lake-nature-v2":{"i":"/poi-images/san-pablo-lake-nature-v2.webp","s":"Der San-Pablo-See ist Ecuadors größter See und liegt am Fuße des majestätischen Imbabura-Vulkans in der Nähe von Otavalo.","f":["Größter See Ecuadors","Am Fuß des Imbabura"]},"yahuarcocha-nature-v2":{"i":"/poi-images/yahuarcocha-nature-v2.webp","s":"Yahuarcocha ist ein historisch bedeutender See, umgeben von Legenden einer großen Schlacht, und verfügt heute über eine berühmte Autorennstrecke.","f":["Bedeutet 'Blutsee'","Inka-Schlachtort"]},"napo-river-nature-v2":{"i":"/poi-images/napo-river-nature-v2.webp","s":"Der Rio Napo ist einer der wichtigsten Nebenflüsse des Amazonas in Ecuador und eine wichtige Lebensader für den Regenwald.","f":["Amazonas-Nebenfluss","Länge: 1.075 km"]},"pastaza-river-nature-v2":{"i":"/poi-images/pastaza-river-nature-v2.webp","s":"Der Rio Pastaza fließt von den ecuadorianischen Anden bis ins Amazonasbecken und ist für seine tiefen Schluchten und Wa la-forest-nature-v2.webp","s":"Dieser Park schützt den einzigartigen tropischen Trockenwald an Ecuadors Küste sowie atemberaubende Strände und küstennahe Meeresökosysteme.","f":["Tropischer Trockenwald","Schützt Los Frailes Strand"]},"llanganates-forest-nature-v2":{"i":"/poi-images/llanganates-forest-nature-v2.webp","s":"Die geheimnisvollen Anden-Páramos und Nebelwälder der Llanganates sind berühmt für die Legende des verlorenen Inka-Goldes von Atahualpa.","f":["Legende vom Inka-Gold","Sehr schwer zugänglich"]},"isabela-island-nature-v2":{"i":"/poi-images/isabela-island-nature-v2.webp","s":"Isabela ist die größte Insel der Galapagos-Inseln, geformt von sechs Vulkanen, und Heimat zahlreicher Riesenschildkröten und Meerechsen.","f":["Größte Galapagos-Insel","Besteht aus 6 Vulkanen"]},"santa-cruz-island-nature-v2":{"i":"/poi-images/santa-cruz-island-nature-v2.webp","s":"Santa Cruz ist das touristische Zentrum von Galapagos, bekannt für die Charles-Darwin-Forschungsstation und das grüne Hochland.","f":["Tourismuszentrum","Charles-Darwin-Station"]},"san-cristobal-island-nature-v2":{"i":"/poi-images/san-cristobal-island-nature-v2.webp","s":"San Cristóbal ist die östlichste der Galapagos-Inseln und beheimatet die Provinzhauptstadt Puerto Baquerizo Moreno sowie reiche Seelöwenkolonien.","f":["Östlichste Insel","Provinzhauptstadt"]},"fernandina-island-nature-v2":{"i":"/poi-images/fernandina-island-nature-v2.webp","s":"Fernandina ist die jüngste und aktivste Vulkaninsel der Galapagos-Gruppe, mit riesigen Lavafeldern und völlig unberührter Natur.","f":["Jüngste Galapagos-Insel","Sehr aktiver Vulkan"]},"santiago-island-nature-v2":{"i":"/poi-images/santiago-island-nature-v2.webp","s":"Die Insel Santiago besticht durch dramatische schwarze Lavaküsten, an denen Pelzrobben, Seelöwen und unzählige Klippenkrabben leben.","f":["Schwarzer Vulkansand","Pelzrobben-Kolonien"]},"floreana-island-nature-v2":{"i":"/poi-images/floreana-island-nature-v2.webp","s":"Floreana hat eine faszinierende Geschichte voller Piraten und Walfänger und beheimatet heute rosa Flamingos an der Punta Cormorant.","f":["Berühmtes Post Office Bay","Eine der ältesten Inseln"]},"gulf-of-guayaquil-nature-v2":{"i":"/poi-images/gulf-of-guayaquil-nature-v2.webp","s":"Der riesige Golf von Guayaquil ist die größte Wasserfläche an der pazifischen Küste Südamerikas und Heimat ausgedehnter Mangrovenwälder.","f":["Größter Golf im Pazifik","Umfangreiche Mangroven"]},"ecuador-reventador-relief-v2":{"i":"/poi-images/ecuador-reventador-relief-v2.webp","s":"Ein hochaktiver Stratovulkan in den östlichen Anden, der häufig Asche und Lava ausstößt.","f":["Die Höhe beträgt 3562 Meter.","Er liegt abgelegen in einem dichten Regenwaldgebiet."]},"ecuador-carihuairazo-relief-v2":{"i":"/poi-images/ecuador-carihuairazo-relief-v2.webp","s":"Eine stark erodierte vulkanische Caldera in unmittelbarer Nähe des mächtigen Chimborazo.","f":["Der höchste Punkt liegt auf 5018 Metern.","Die meisten seiner einstigen Gletscher sind verschwunden."]},"ecuador-sincholagua-relief-v2":{"i":"/poi-images/ecuador-sincholagua-relief-v2.webp","s":"Ein inaktiver Vulkan südöstlich von Quito mit einem markanten, felsigen und steilen Gipfel.","f":["Die Gipfelhöhe erreicht 4893 Meter.","Der Vulkan hat seine permanenten Gletscher verloren."]},"ecuador-corazon-relief-v2":{"i":"/poi-images/ecuador-corazon-relief-v2.webp","s":"Ein ruhender Vulkan, der seinen Namen von seinem herzförmigen Profil bei Betrachtung aus dem Westen hat.","f":["Die maximale Höhe beträgt 4790 Meter.","Das spanische Wort Corazón bedeutet Herz."]},"ecuador-ruminahui-relief-v2":{"i":"/poi-images/ecuador-ruminahui-relief-v2.webp","s":"Ein stark erodierter, ruhender Stratovulkan, der sich majestätisch im Cotopaxi-Nationalpark erhebt.","f":["Der Vulkan erreicht eine Höhe von 4712 Metern.","Er ist nach einem berühmten Inka-Krieger benannt."]},"ecuador-imbabura-relief-v2":{"i":"/poi-images/ecuador-imbabura-relief-v2.webp","s":"Ein ruhender Stratovulkan, der majestätisc   // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
