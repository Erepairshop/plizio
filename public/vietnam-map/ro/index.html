iva."]},"hoa-lu-ancient-capital-history-v2":{"i":"/poi-images/hoa-lu-ancient-capital-history-v2.webp","s":"Capitala Vietnamului în secolele X și XI, astăzi un sit cu temple și pagode antice.","f":["Capitala dinastiilor Dinh și Le timpurii.","Înconjurată de stânci de calcar."]},"khe-sanh-combat-base-history-v2":{"i":"/poi-images/khe-sanh-combat-base-history-v2.webp","s":"Locul unui asediu lung și sângeros în timpul Războiului din Vietnam, care a implicat pușcașii marini americani și trupele sud-vietnameze împotriva Armatei Nord-Vietnameze.","f":["Asediul a durat 77 de zile în 1968.","Parte a Ofensivei Tet."]},"vinh-moc-tunnels-history-v2":{"i":"/poi-images/vinh-moc-tunnels-history-v2.webp","s":"Un complex de tuneluri construit pentru a adăposti un întreg sat în timpul bombardamentelor din Războiul din Vietnam.","f":["Proiectat pentru viața civilă, spre deosebire de Củ Chi.","Avea bucătării, fântâni și spații de locuit."]},"con-dao-prison-history-v2":{"i":"/poi-images/con-dao-prison-history-v2.webp","s":"O închisoare de notorietate folosită de francezi și mai târziu de sud-vietnamezi și americani pentru a încarcera prizonieri politici.","f":["Renumită pentru inumanele 'cuști de tigru'.","Mulți lideri vietnamezi importanți au fost închiși aici."]},"po-nagar-cham-towers-history-v2":{"i":"/poi-images/po-nagar-cham-towers-history-v2.webp","s":"Un complex de temple antice construit de poporul Cham și dedicat zeiței Yan Po Nagar.","f":["Datează din secolul al VIII-lea.","Situat pe un deal cu vedere la râul Cái."]},"long-tan-cross-history-v2":{"i":"/poi-images/long-tan-cross-history-v2.webp","s":"Un memorial care comemorează Bătălia de la Long Tan, una dintre cele mai cunoscute ciocniri care au implicat trupele australiene în Războiul din Vietnam.","f":["Ridicată în memoria victimelor australiene și vietnameze.","Bătălia a avut loc în 1966."]},"thang-long-imperial-citadel-history-v2":{"i":"/poi-images/thang-long-imperial-citadel-history-v2.webp","s":"Centrul politic al Vietn  Mondial UNESCO.","Renumit pentru festivalurile sale cu felinare."]},"phong-nha-ke-bang-park-landmarks-v2":{"i":"/poi-images/phong-nha-ke-bang-park-landmarks-v2.webp","s":"Un parc național și sit al Patrimoniului Mondial UNESCO, renumit pentru sutele sale de sisteme de peșteri, inclusiv cea mai mare peșteră din lume.","f":["Găzduiește peștera Sơn Đoòng, cea mai mare din lume.","Conține cele mai vechi formațiuni carstice din Asia."]},"japanese-covered-bridge-landmarks-v2":{"i":"/poi-images/japanese-covered-bridge-landmarks-v2.webp","s":"Un pod iconic în Hội An, construit de comunitatea japoneză la începutul secolului al XVII-lea.","f":["Prezintă un mic templu în interiorul podului.","Leagă cartierul japonez de cel chinezesc."]},"thien-mu-pagoda-landmarks-v2":{"i":"/poi-images/thien-mu-pagoda-landmarks-v2.webp","s":"O pagodă istorică pe malurile Râului Parfumului din Huế, al cărei turn cu șapte etaje este un simbol neoficial al orașului.","f":["Cea mai înaltă pagodă din Vietnam.","Construită în 1601."]},"one-pillar-pagoda-landmarks-v2":{"i":"/poi-images/one-pillar-pagoda-landmarks-v2.webp","s":"O pagodă budistă istorică din Hanoi, așezată pe un singur stâlp de piatră în mijlocul unui iaz cu lotuși.","f":["Construită de împăratul Lý Thái Tông în secolul al XI-lea.","Proiectată să semene cu o floare de lotus."]},"fansipan-mountain-landmarks-v2":{"i":"/poi-images/fansipan-mountain-landmarks-v2.webp","s":"Cel mai înalt munte din Indochina, cunoscut ca 'Acoperișul Indochinei'.","f":["Altitudine de 3.143 de metri.","Parte a lanțului montan Hoàng Liên Sơn."]},"nui-ba-den-landmarks-v2":{"i":"/poi-images/nui-ba-den-landmarks-v2.webp","s":"Un vulcan stins în provincia Tây Ninh, un loc sacru cu temple și pagode pe versanții săi.","f":["Cel mai înalt munte din sud-estul Vietnamului.","Important loc de pelerinaj."]},"ban-gioc-detian-falls-landmarks-v2":{"i":"/poi-images/ban-gioc-detian-falls-landmarks-v2.webp","s":"O pereche de cascade pe râul Quây Sơn care traversează granița int Hanoi.","f":["Corpul îmbălsămat al lui Ho Chi Minh este păstrat aici.","Cod vestimentar strict și reguli de comportament."]},"cat-ba-island-landmarks-v2":{"i":"/poi-images/cat-ba-island-landmarks-v2.webp","s":"Cea mai mare insulă din Golful Ha Long, cunoscută pentru frumusețea sa accidentată și sălbatică.","f":["Acasă pentru langurul Cát Bà, specie pe cale de dispariție.","Oferă trasee de drumeții, plaje și peșteri."]},"notre-dame-cathedral-saigon-landmarks-v2":{"i":"/poi-images/notre-dame-cathedral-saigon-landmarks-v2.webp","s":"O catedrală în centrul orașului Ho Și Min, construită de coloniștii francezi între 1863 și 1880.","f":["Toate materialele de construcție au fost importate din Franța.","Două turnuri clopotniță cu o înălțime de 58 de metri."]},"saigon-central-post-office-landmarks-v2":{"i":"/poi-images/saigon-central-post-office-landmarks-v2.webp","s":"Un oficiu poștal în centrul orașului Ho Și Min, construit la sfârșitul secolului al XIX-lea și renumit pentru arhitectura sa colonială franceză.","f":["Proiectat de Alfred Foulhoux, adesea atribuit în mod eronat lui Gustave Eiffel.","Prezintă tavane boltite și cabine telefonice vechi."]},"mekong-delta-landmarks-v2":{"i":"/poi-images/mekong-delta-landmarks-v2.webp","s":"O regiune vastă în sud-vestul Vietnamului, unde râul Mekong se varsă în mare.","f":["Cunoscut ca 'Bolul de orez' al Vietnamului.","Renumit pentru piețele plutitoare precum Cái Răng și Phong Điền."]},"cuc-phuong-turtle-center-life-v2":{"i":"/poi-images/cuc-phuong-turtle-center-life-v2.webp","s":"Un centru de frunte pentru salvarea și conservarea țestoaselor din Vietnam, situat în Parcul Național Cúc Phương.","f":["Protejează peste 20 de specii de țestoase.","Multe animale au fost salvate din comerțul ilegal."]},"dalat-flower-gardens-life-v2":{"i":"/poi-images/dalat-flower-gardens-life-v2.webp","s":"Un parc extins în Đà Lạt, care prezintă o varietate impresionantă de flori și plante native și exotice.","f":["Înființată în 1966.","Include peste 300 de specii diferite de flori."]},"tra-que-vegetable-village-life-v2":{"i":"/poi-images/tra-que-vegetable-village-life-v2.webp","s":"Un sat lângă Hội An, renumit pentru cultivarea organică a ierburilor și legumelor, folosind metode tradiționale și îngrășăminte naturale.","f":["Fermierii folosesc alge din râul din apropiere ca îngrășământ.","Vizitatorii pot participa la activități agricole."]},"suoi-tien-theme-park-life-v2":{"i":"/poi-images/suoi-tien-theme-park-life-v2.webp","s":"Un mare parc de distracții în Ho Și Min, al cărui peisaj și atracții se concentrează pe istoria și mitologia vietnameză.","f":["Cunoscut ca 'Parcul de distracții Buddha'.","Are un parc acvatic și o grădină cu dinozauri."]},"thu-le-park-hanoi-zoo-life-v2":{"i":"/poi-images/thu-le-park-hanoi-zoo-life-v2.webp","s":"Un parc mare și o grădină zoologică în centrul orașului Hanoi, cu un lac mare, locuri de joacă și o varietate de animale.","f":["Înconjoară un lac mare cu insule.","Găzduiește sute de specii de animale."]},"mekong-delta-fruit-orchards-life-v2":{"i":"/poi-images/mekong-delta-fruit-orchards-life-v2.webp","s":"Regiunea fertilă a Deltei Mekongului este renumită pentru livezile sale vaste unde se cultivă o varietate de fructe tropicale.","f":["Renumită pentru durian, rambutan, mangostan și fructul dragonului.","Vizitatorii pot culege fructe proaspete direct din copaci."]},"vinpearl-land-nha-trang-life-v2":{"i":"/poi-images/vinpearl-land-nha-trang-life-v2.webp","s":"Un parc de distracții și acvatic masiv pe insula Hòn Tre, conectat la Nha Trang printr-o telecabină peste mare.","f":["Dispune de montagne russe, un parc acvatic și un acvariu.","Plimbarea cu telecabina oferă vederi spectaculoase."]},"bear-sanctuary-ninh-binh-life-v2":{"i":"/poi-images/bear-sanctuary-ninh-binh-life-v2.webp","s":"Un sanctuar al organizației Four Paws care salvează urșii afectați de industria bilei de urs și de comerțul ilegal cu animale sălbatice.","f":["Oferă un adăpost adecvat speciei pentru urși.","Se concentrează pe reabilitare și îngrijire."]},"ho-tay-water-park-life-v2":{"i":"/poi-images/ho-tay-water-park-life-v2.webp","s":"Un mare parc acvatic pe malul Lacului de Vest din Hanoi, oferind o evadare răcoroasă de căldura verii din oraș.","f":["Diverse tobogane de apă și piscine.","Piscină cu valuri și 'lazy river'."]},"tao-dan-park-life-v2":{"i":"/poi-images/tao-dan-park-life-v2.webp","s":"O oază de verdeață în centrul orașului Ho Și Min, cunoscută pentru copacii săi umbroși și ca loc unde localnicii fac exerciții fizice dimineața și își adună păsările cântătoare.","f":["Peste 10 hectare în dimensiune.","Popular pentru Tai Chi și exerciții de grup."]},"moc-chau-tea-plantations-life-v2":{"i":"/poi-images/moc-chau-tea-plantations-life-v2.webp","s":"Platoul Mộc Châu este renumit pentru dealurile sale nesfârșite, acoperite cu plantații de ceai de un verde vibrant.","f":["Una dintre cele mai mari regiuni de cultivare a ceaiului din Vietnam.","Dealurile de ceai în formă de inimă sunt un loc popular pentru fotografii."]},"epizootic-disease-research-center-life-v2":{"i":"/poi-images/epizootic-disease-research-center-life-v2.webp","s":"Un centru specializat dedicat cercetării și controlului bolilor epizootice, jucând un rol vital în sănătatea publică și agricultură.","f":["Efectuează cercetări privind boli precum gripa aviară.","Colaborează cu organizații internaționale."]},"dam-sen-water-park-life-v2":{"i":"/poi-images/dam-sen-water-park-life-v2.webp","s":"Un parc acvatic popular în Ho Și Min, cu o varietate de tobogane, piscine și atracții pentru toate vârstele.","f":["Parte a Parcului Cultural Đầm Sen.","Oferă tobogane palpitante precum 'Kamikaze'."]},"hanoi-botanical-garden-life-v2":{"i":"/poi-images/hanoi-botanical-garden-life-v2.webp","s":"Un spațiu verde liniștit lângă Mausoleul Ho Chi Minh, care găzduiește o colecție de copaci și plante rare.","f":["Creat de francezi la sfârșitul secolului al XIX-lea.","Adesea numit 'Parcul Bach Thao'."]},"buon-ma-thuot-coffee-plantations-life-v2":{"i":"/poi-images/buon-ma-thuot-coffee-plantations-life-v2.webp","s":"Buôn Ma Thuột este considerată 'capitala cafelei' din Vietnam, înconjurată de plantații vaste care produc celebrele boabe Robusta ale țării.","f":["Vietnam este al doilea cel mai mare producător de cafea din lume.","Zonele Muntoase Centrale sunt principala regiune de cultivare."]},"vinwonders-phu-quoc-life-v2":{"i":"/poi-images/vinwonders-phu-quoc-life-v2.webp","s":"Cel mai mare parc tematic din Vietnam, parte a super-complexului Phu Quoc United Center, cu sute de activități interioare și exterioare.","f":["Șase zone inspirate de diferite civilizații.","Are un parc acvatic masiv."]},"monkey-island-cat-ba-life-v2":{"i":"/poi-images/monkey-island-cat-ba-life-v2.webp","s":"O mică insulă în Golful Lan Ha, renumită pentru populația sa numeroasă de macaci care se plimbă liber pe insulă.","f":["Numele oficial este Insula Cát Dứa.","O oprire populară în tururile cu barca din Golful Lan Ha."]},"gia-dinh-park-life-v2":{"i":"/poi-images/gia-dinh-park-life-v2.webp","s":"Unul dintre cele mai mari parcuri publice din Ho Și Min, oferind un spațiu verde amplu pentru recreere și exerciții fizice.","f":["Situat lângă Aeroportul Tân Sơn Nhất.","Peluze extinse și copaci umbroși."]},"thai-nguyen-tea-hills-life-v2":{"i":"/poi-images/thai-nguyen-tea-hills-life-v2.webp","s":"Thái Nguyên este cea mai renumită regiune de ceai din Vietnam, faimoasă pentru producția de ceai verde de înaltă calitate, prețuit în întreaga țară.","f":["Considerată leagănul ceaiului vietnamez.","Ceaiul Tân Cương este cel mai faimos brand."]},"saigon-zoo-and-botanical-gardens-life-v2":{"i":"/poi-images/saigon-zoo-and-botanical-gardens-life-v2.webp","s":"Una dintre cele mai vechi grădini zoologice din lume, fondată în 1865, care găzduiește o colecție mare de animale și plante în inima orașului Ho Și Min.","f":["Găzduiește peste 100 de specii de mamifere, reptile și păsări.","Include și un muzeu de istorie."]},"ba-be-national-park-nature-v2":{"i":"/poi-images/ba-be-national-park-nature-v2.webp","s":"Un parc național în provincia Bắc Kạn, renumit pentru Lacul Ba Bể, unul dintre cele mai mari lacuri naturale de apă dulce din Vietnam, înconjurat de munți de calcar și păduri.","f":["Include Lacul Ba Bể.","Acasă pentru multe grupuri etnice minoritare."]},"cuc-phuong-national-park-nature-v2":{"i":"/poi-images/cuc-phuong-national-park-nature-v2.webp","s":"Cel mai vechi parc național din Vietnam, situat în provincia Ninh Bình.","f":["Înființat în 1962.","Găzduiește Centrul de Salvare a Primatelor pe cale de dispariție."]},"cat-tien-national-park-nature-v2":{"i":"/poi-images/cat-tien-national-park-nature-v2.webp","s":"O pădure tropicală de șes extinsă în sudul Vietnamului, recunoscută ca rezervație a biosferei de către UNESCO, protejând o biodiversitate imensă.","f":["Protejează una dintre cele mai mari zone de pădure tropicală de șes.","Acasă pentru crocodili, giboni și multe specii de păsări."]},"hoan-kiem-lake-nature-v2":{"i":"/poi-images/hoan-kiem-lake-nature-v2.webp","s":"Un lac istoric în inima orașului Hanoi, cunoscut sub numele de 'Lacul Sabiei Întoarse', un loc popular pentru localnici și turiști.","f":["Templul Ngoc Son este situat pe o insulă în lac.","Podul roșu Huc duce la templu."]},"red-river-nature-v2":{"i":"/poi-images/red-river-nature-v2.webp","s":"Un râu major care curge din China în Vietnam, trecând prin Hanoi înainte de a se vărsa în Golful Tonkin.","f":["Aduce aluviuni roșii fertile.","Cale navigabilă importantă pentru transport."]},"perfume-river-nature-v2":{"i":"/poi-images/perfume-river-nature-v2.webp","s":"Un râu care traversează orașul Huế, numit după florile parfumate care cad în apă de la livezile din amonte în toamnă.","f":["Curge pe lângă Cetatea Imperială și multe morminte regale.","Pagoda Thiên Mụ se află pe malurile sale."]},"ba-vi-national-park-nature-v2":{"i":"/poi-images/ba-vi-national-park-nature-v2.webp","s":"Un lanț montan la vest de Hanoi, protejat ca parc național.","f":["Trei vârfuri: Vua, Tản Viên și Ngọc Hoa.","Ruine coloniale franceze, inclusiv o biserică."]},"pu-luong-nature-reserve-nature-v2":{"i":"/poi-images/pu-luong-nature-reserve-nature-v2.webp","s":"O rezervație naturală uimitoare, cunoscută pentru terasele sale de orez, satele etnice și frumusețea sa neatinsă.","f":["'Pù Luông' înseamnă 'cel mai înalt vârf' în limba Thai.","Acasă pentru grupurile etnice Thai și Muong."]},"bach-ma-national-park-nature-v2":{"i":"/poi-images/bach-ma-national-park-nature-v2.webp","s":"Un parc național în centrul Vietnamului, care se întinde de la coastă până la Munții Annamite.","f":["Vârf la 1.450 de metri cu vederi panoramice.","Precipitații ridicate, ducând la o vegetație luxuriantă."]},"dong-van-karst-plateau-geopark-nature-v2":{"i":"/poi-images/dong-van-karst-plateau-geopark-nature-v2.webp","s":"Un Geoparc Global UNESCO în provincia Hà Giang, renumit pentru peisajul său carstic dramatic, canioanele adânci și cultura grupurilor etnice locale.","f":["80% din suprafață este acoperită de calcar.","Pasul Ma Pi Leng oferă vederi spectaculoase."]},"nho-que-river-nature-v2":{"i":"/poi-images/nho-que-river-nature-v2.webp","s":"Un râu care curge prin cel mai adânc canion din Asia de Sud-Est, Canionul Tu Sản, sub Pasul Ma Pi Leng din provincia Hà Giang.","f":["Apă de culoare turcoaz.","Curge din China în Vietnam."]},"tam-dao-national-park-nature-v2":{"i":"/poi-images/tam-dao-national-park-nature-v2.webp","s":"Un lanț montan care se întinde pe trei provincii, cunoscut pentru pădurile sale bogate în specii, cascade și climatul răcoros.","f":["Înființat pentru a proteja o zonă mare de pădure.","Găzduiește un centru de salvare a urșilor."]},"yok-don-national-park-nature-v2":{"i":"/poi-images/yok-don-national-park-nature-v2.webp","s":"Cel mai mare parc național din Vietnam, constând în principal din pădure uscată de dipterocarpacee.","f":["Singurul parc din Vietnam care protejează acest tip de pădure.","Acasă pentru elefanți, gauri, bantengi și leoparzi."]},"con-dao-national-park-nature-v2":{"i":"/poi-images/con-dao-national-park-nature-v2.webp","s":"Un parc național care cuprinde un arhipelag de 16 insule în largul coastei de sud a Vietnamului.","f":["Situl important de cuibărit pentru țestoasele verzi și Hawksbill.","Include plaje virgine și recife de corali."]},"phu-quoc-national-park-nature-v2":{"i":"/poi-images/phu-quoc-national-park-nature-v2.webp","s":"Acoperă mai mult de jumătate din insula Phú Quốc, protejând o bogată diversitate de floră și faună, de la jungle dese la habitate de coastă virgine.","f":["Parte a Rezervației Biosferei Kien Giang.","Găzduiește specii unice de plante și animale sălbatice."]},"thac-ba-lake-nature-v2":{"i":"/poi-images/thac-ba-lake-nature-v2.webp","s":"Unul dintre cele mai mari lacuri artificiale din Vietnam, creat prin construcția centralei hidroelectrice Thác Bà.","f":["Creat în anii 1970.","Producător important de energie hidroelectrică."]},"son-tra-peninsula-nature-v2":{"i":"/poi-images/son-tra-peninsula-nature-v2.webp","s":"O peninsulă muntoasă în Da Nang, adesea numită 'Muntele Maimuțelor'.","f":["Acasă pentru langurul douc cu picioare roșii, pe cale de dispariție critică.","Pagoda Linh Ung cu statuia Doamnei Buddha este situată aici."]},"ta-dung-lake-nature-v2":{"i":"/poi-images/ta-dung-lake-nature-v2.webp","s":"Un lac de acumulare vast în Zonele Muntoase Centrale, supranumit 'Golful Ha Long al Zonelor Muntoase Centrale' datorită numeroaselor sale insulițe.","f":["Creat de un proiect hidroelectric.","Peste 36 de insule și insulițe."]},"can-gio-mangrove-forest-nature-v2":{"i":"/poi-images/can-gio-mangrove-forest-nature-v2.webp","s":"O rezervație a biosferei UNESCO la periferia orașului Ho Și Min.","f":["Cunoscut ca 'plămânul verde' al orașului Ho Și Min.","Protejează orașul de furtuni."]},"langbiang-mountain-relief-v2":{"i":"/poi-images/langbiang-mountain-relief-v2.webp","s":"Un munte proeminent lângă Đà Lạt, format din două vârfuri, jucând un rol important în cultura etniei locale Koho.","f":["Cel mai înalt vârf are 2.167 de metri.","Oferă vederi panoramice ale orașului Đà Lạt și ale Platoului Central."]},"moc-chau-plateau-relief-v2":{"i":"/poi-images/moc-chau-plateau-relief-v2.webp","s":"Un platou vast și fertil în provincia Sơn La, renumit pentru plantațiile sale imense de ceai, fermele de lapte și livezile înfloritoare.","f":["Situat la o altitudine medie de 1.050 de metri.","Cel mai mare centru de cultivare a ceaiului și producție de lapte din Vietnam."]},"mu-cang-chai-terraces-valley-v2":{"i":"/poi-images/mu-cang-chai-terraces-valley-v2.webp","s":"O vale uimitoare în provincia Yên Bái, faimoasă pentru terasele sale de orez care se întind pe versanți ca niște valuri aurii sau verzi.","f":["Create de etnia Hmong de-a lungul secolelor.","Recunoscute ca sit de patrimoniu național."]},"an-namite-range-mountain-v2":{"i":"/poi-images/an-namite-range-mountain-v2.webp","s":"Un lanț muntos major care se întinde de-a lungul graniței dintre Vietnam și Laos, formând o barieră biogeografică importantă.","f":["Cunoscut și sub numele de Munții Trường Sơn.","Habitat pentru multe specii endemice, cum ar fi Saola."]},"da-lat-plateau-relief-v2":{"i":"/poi-images/da-lat-plateau-relief-v2.webp","s":"Un platou în Zonele Muntoase Centrale pe care se află orașul Đà Lạt, cunoscut sub numele de \"Orașul Primăverii Eterne\" datorită climei sale răcoroase.","f":["Zonă importantă pentru cultivarea florilor, legumelor și cafelei.","Arhitectura colonială franceză caracterizează orașul."]},"my-khe-beach-coast-v2":{"i":"/poi-images/my-khe-beach-coast-v2.webp","s":"O plajă lungă și lată cu nisip în Da Nang, folosită ca loc de odihnă de trupele americane în timpul Războiului din Vietnam și acum o destinație turistică populară.","f":["Numită una dintre cele mai atractive plaje de pe planetă de revista Forbes.","Valuri blânde și apă caldă pe tot parcursul anului."]},"pu-chi-leng-mountain-relief-v2":{"i":"/poi-images/pu-chi-leng-mountain-relief-v2.webp","s":"Un vârf înalt în lanțul Hoàng Liên Sơn, considerat una dintre cele mai dificile și satisfăcătoare drumeții din Vietnam.","f":["Printre primele 10 cele mai înalte vârfuri din Vietnam.","Oferă păduri virgine și o floră diversă."]},"mai-chau-valley-relief-v2":{"i":"/poi-images/mai-chau-valley-relief-v2.webp","s":"O vale idilică înconjurată de munți, cunoscută pentru orezăriile sale, casele tradiționale pe piloni și cultura etniei Thai Albe.","f":["Destinație populară pentru ecoturism și cazare la localnici.","Ideal pentru ciclism și drumeții."]},"bach-dang-river-mouth-coast-v2":{"i":"/poi-images/bach-dang-river-mouth-coast-v2.webp","s":"Un estuar semnificativ din punct de vedere istoric, unde au avut loc trei bătălii decisive în istoria vietnameză, folosind pari de lemn pentru a distruge flotele inamice.","f":["Bătălii în anii 938, 981 și 1288.","Utilizarea strategică a mareelor și a parilor."]},"ta-xua-mountain-relief-v2":{"i":"/poi-images/ta-xua-mountain-relief-v2.webp","s":"Un lanț muntos la granița provinciilor Sơn La și Yên Bái, faimos pentru fenomenul \"mării de nori\" care umple văile.","f":["Destinație populară pentru \"vânătorii de nori\".","Vârful principal are 2.865 de metri."]},"mu-ne-dunes-coast-v2":{"i":"/poi-images/mu-ne-dunes-coast-v2.webp","s":"O porțiune de coastă unică, renumită pentru dunele sale de nisip roșu și alb, creând un peisaj asemănător deșertului.","f":["Două tipuri de dune: Dunele Roșii și Dunele Albe.","Dunele Albe sunt mai mari și mai impresionante."]},"van-phong-bay-coast-v2":{"i":"/poi-images/van-phong-bay-coast-v2.webp","s":"Un golf mare și adânc în provincia Khánh Hòa, cunoscut pentru frumusețea sa virgină, plajele lungi cu nisip și potențialul său ca port de adâncime.","f":["Considerat unul dintre cele mai frumoase golfuri din Vietnam.","Relativ neatins de turismul de masă."]},"hon-kho-island-coast-v2":{"i":"/poi-images/hon-kho-island-coast-v2.webp","s":"O insulă mică lângă Quy Nhơn, cunoscută pentru coasta sa stâncoasă, recifele de corali și o potecă subacvatică ce apare la reflux.","f":["'Hòn Khô' înseamnă 'Insula Uscată'.","Poteca subacvatică leagă insula de continent."]},"co-to-island-coast-v2":{"i":"/poi-images/co-to-island-coast-v2.webp","s":"Un arhipelag în provincia Quảng Ninh, cunoscut pentru plajele sale virgine, stâncile stâncoase și apele albastre limpezi.","f":["Mai puțin turistic decât Golful Ha Long din apropiere.","Hồng Vàn și Vàn Chảy sunt cele mai faimoase plaje."]},"phu-yen-coastline-relief-v2":{"i":"/poi-images/phu-yen-coastline-relief-v2.webp","s":"O coastă pitorească și diversă, cu formațiuni geologice unice precum Gành Đá Đĩa, plaje lungi cu nisip și golfuri liniștite.","f":["Include Golful Vũng Rô și Golful Xuân Đài.","Gành Đá Đĩa este un reper național."]},"ninh-thuan-coastline-desert-v2":{"i":"/poi-images/ninh-thuan-coastline-desert-v2.webp","s":"Cea mai aridă regiune de coastă a Vietnamului, prezentând un peisaj unic de dune de nisip, capuri stâncoase și podgorii, asemănător unui semideșert.","f":["Centrul viticulturii și cultivării strugurilor din Vietnam.","Include Golful Vĩnh Hy și Parcul Național Núi Chúa."]},"quang-binh-coast-v2":{"i":"/poi-images/quang-binh-coast-v2.webp","s":"O coastă lungă cu plaje frumoase, virgine, cu nisip și sate pescărești, servind drept poartă de acces către Parcul Național Phong Nha-Kẻ Bàng.","f":["Plaja Nhật Lệ este una dintre cele mai renumite.","Plaja Đá Nhảy (stâncile dansatoare) are formațiuni stâncoase unice."]},"deo-ngang-pass-mountain-v2":{"i":"/poi-images/deo-ngang-pass-mountain-v2.webp","s":"O trecătoare montană istorică ce separă provinciile Hà Tĩnh și Quảng Bình, adesea menționată în literatura și istoria vietnameză.","f":["Granița istorică dintre regatele Champa și Đại Việt.","Înseamnă 'Pasul Orizontal'."]},"ba-na-hills-mountain-v2":{"i":"/poi-images/ba-na-hills-mountain-v2.webp","s":"O stațiune montană la vest de Da Nang, fondată ca stațiune colonială franceză și acum renumită pentru telecabinele sale, satul francez recreat și Podul de Aur.","f":["Situat la o altitudine de aproape 1.500 de metri.","Deține mai multe recorduri mondiale pentru sistemul său de telecabine."]},"muong-hoa-valley-relief-v2":{"i":"/poi-images/muong-hoa-valley-relief-v2.webp","s":"O vale pitorească lângă Sa Pa, cunoscută pentru terasele sale de orez, râul șerpuitor Mường Hoa și gravurile antice pe piatră.","f":["Acasă pentru mai multe grupuri etnice minoritare precum H'Mông, Dao și Giáy.","Gravurile pe piatră sunt un sit de patrimoniu național."]},"vn-hanoi":{"i":"/poi-images/vn-hanoi.webp","s":"Capitala Vietnamului, cu o istorie de peste o mie de ani și moștenire colonială franceză.","f":["Fondat în 1010 sub numele de Thang Long","Peste 8 milioane de locuitori în zona metropolitană"]},"vn-hochiminh":{"i":"/poi-images/vn-hochiminh.webp","s":"Cel mai mare oraș al Vietnamului și centrul său economic, cunoscut anterior ca Saigon.","f":["Cel mai mare oraș din Vietnam, cu peste 9 milioane de locuitori","S-a numit Saigon până în 1976"]},"vn-danang":{"i":"/poi-images/vn-danang.webp","s":"Important oraș portuar pe coasta centrală, cu plaje moderne și poduri spectaculoase.","f":["Al treilea oraș ca mărime din Vietnam","Podul Dragonului scuipă foc și apă"]},"vn-haiphong":{"i":"/poi-images/vn-haiphong.webp","s":"Cel mai important port din nordul Vietnamului și a treia aglomerare urbană ca mărime.","f":["Cel mai important port maritim din nordul Vietnamului","Aproximativ 2 milioane de locuitori"]},"vn-hue":{"i":"/poi-images/vn-hue.webp","s":"Fosta capitală imperială a dinastiei Nguyen și sit UNESCO al Patrimoniului Mondial.","f":["Sit UNESCO din 1993","Capitala imperială între 1802 și 1945"]},"vn-nhatrang":{"i":"/poi-images/vn-nhatrang.webp","s":"Stațiune de coastă populară la Marea Chinei de Sud, cu plaje și zone de scufundări.","f":["Plaja orașului are 6 km lungime","19 insule cu recife în larg"]},"vn-cantho":{"i":"/poi-images/vn-cantho.webp","s":"Cel mai mare oraș din Delta Mekongului, cunoscut pentru piețele sale plutitoare.","f":["Cel mai mare oraș din Delta Mekongului","Piața plutitoare Cai Rang"]},"vn-vungtau":{"i":"/poi-images/vn-vungtau.webp","s":"Oraș de coastă și un centru important al industriei petroliere vietnameze.","f":["Statuia lui Hristos de 32 m înălțime","Centrul industriei petroliere offshore"]},"vn-dalat":{"i":"/poi-images/vn-dalat.webp","s":"Oraș montan din podișul central, cu climă răcoroasă și moștenire franceză.","f":["Situat la 1.500 m altitudine","Supranumit 'orașul primăverii eterne'"]},"vn-halong":{"i":"/poi-images/vn-halong.webp","s":"Capitala provinciei Quang Ninh, situată la marginea celebrului Golf Halong.","f":["Poarta către Golful Halong (UNESCO)","Cea mai mare roată panoramică din Vietnam"]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
