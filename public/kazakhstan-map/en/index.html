const POI_CARD={"astana-cities-v2":{"i":"/poi-images/astana-cities-v2.webp","s":"The windy capital impresses with bold, futuristic architecture rising straight out of the vast Asian steppe.","f":["Was temporarily called Nur-Sultan.","Famous for the Bayterek Tower."]},"almaty-cities-v2":{"i":"/poi-images/almaty-cities-v2.webp","s":"Nestled at the foothills of the snow-capped Trans-Ili Alatau mountains, this green metropolis is the cultural heart of Kazakhstan.","f":["Largest city in the country.","Was the capital until 1997."]},"shymkent-cities-v2":{"i":"/poi-images/shymkent-cities-v2.webp","s":"As a vibrant commercial hub in the sunny south, the city blends ancient Silk Road history with modern growth.","f":["Third largest city in Kazakhstan.","Important agricultural center."]},"karaganda-cities-v2":{"i":"/poi-images/karaganda-cities-v2.webp","s":"Born from industrial coal mining, monumental Soviet architecture and wide avenues still characterize the cityscape.","f":["Center of coal mining.","Known for the Karlag Museum."]},"aktobe-cities-v2":{"i":"/poi-images/aktobe-cities-v2.webp","s":"As the gateway to western Kazakhstan, this industrial city is growing rapidly on the banks of the Ilek River.","f":["Important center for oil and gas.","Founded as a Russian fortress in 1869."]},"taraz-cities-v2":{"i":"/poi-images/taraz-cities-v2.webp","s":"With over 2,000 years of history, this ancient oasis still breathes the spirit of wandering caravans.","f":["One of the oldest cities in the country.","Important hub on the Silk Road."]},"pavlodar-cities-v2":{"i":"/poi-images/pavlodar-cities-v2.webp","s":"Situated on the banks of the mighty Irtysh River, the city is an industrial heavyweight with a bustling waterfront promenade.","f":["Center for aluminum production.","Has a large river promenade."]},"oskemen-cities-v2":{"i":"/poi-images/oskemen-cities-v2.webp","s":"Enclosed in the wild Altai Mountains, the city thrives on metallurgy and the wild nature of the east.","f":["Also known as Ust-Kamenogorsk.","Center of non-ferrous metallurgy."]},"semey-cities-v2":{"i":"/poi-images/semey-cities-v2.webp","s":"Despite its tragic history due to Soviet nuclear tests, the city is an important cultural center on the banks of the Irtysh.","f":["Known as Semipalatinsk.","Close to the former nuclear test site."]},"atyrau-cities-v2":{"i":"/poi-images/atyrau-cities-v2.webp","s":"Two thousand kilometers from the capital, the Ural River officially divides this rich oil city into a European and an Asian part.","f":["The center of the Kazakh oil industry.","Located on the border between Europe and Asia."]},"kostanay-cities-v2":{"i":"/poi-images/kostanay-cities-v2.webp","s":"Surrounded by endless wheat fields, the city is the agricultural granary of the north and preserves much of its old architecture.","f":["Important center for grain cultivation.","Located on the Tobol River."]},"kyzylorda-cities-v2":{"i":"/poi-images/kyzylorda-cities-v2.webp","s":"Located on the banks of the Syr Darya River, it is a center of rice cultivation and a major gateway to the Baikonur Cosmodrome.","f":["Center of rice production in Kazakhstan.","Former capital of the Kazakh ASSR."]},"oral-cities-v2":{"i":"/poi-images/oral-cities-v2.webp","s":"As a historic stronghold of the Cossacks, the city's architecture reflects a strong 18th-century Russian influence.","f":["Also known as Uralsk.","Geographically located in Europe."]},"petropavl-cities-v2":{"i":"/poi-images/petropavl-cities-v2.webp","s":"With harsh winters and strong historical ties to the Trans-Siberian Railway, this northern fortress city secures the region.","f":["Founded as a military fortress.","The northernmost city in Kazakhstan."]},"aktau-cities-v2":{"i":"/poi-images/aktau-cities-v2.webp","s":"Built in the middle of an inhospitable desert, this young city looks directly onto the endless waters of the Caspian Sea.","f":["The country's only seaport.","Has a large desalination plant for drinking water."]},"temirtau-cities-v2":{"i":"/poi-images/temirtau-cities-v2.webp","s":"Huge steelworks dominate the skyline of this city, where the echo of Soviet industrialization reverberates in every building.","f":["Important center of the steel industry.","Means 'Iron Mountain' in Kazakh."]},"turkistan-cities-v2":{"i":"/poi-images/turkistan-cities-v2.webp","s":"As a spiritual center with magnificent mausoleums, this holy city breathes the Islamic mysticism of the ancient Sufi masters.","f":["Home to the Mausoleum of Khoja Ahmed Yasawi.","Important pilgrimage site in Central Asia."]},"kokshetau-cities-v2":{"i":"/poi-images/kokshetau-cities-v2.webp","s":"Surrounded by picturesque lakes and wooded hills, this quiet place is often considered the green lung of Northern Kazakhstan.","f":["Center of the Akmola region.","Known for the nearby Burabay National Park."]},"taldykorgan-cities-v2":{"i":"/poi-images/taldykorgan-cities-v2.webp","s":"In the fertile valley of the Karatal River, this city grows at the intersection of mountains and endless steppe.","f":["Capital of the Zhetysu region.","Its name means 'Willow Hill'."]},"ekibastuz-cities-v2":{"i":"/poi-images/ekibastuz-cities-v2.webp","s":"Known for its gigantic open-pit mine, this city's monstrous coal power plants supply much of the country with electricity.","f":["Home to the world's largest open-pit coal mine.","The Ekibastuz-Kokshetau power line has the highest transmission voltage."]},"rudny-cities-v2":{"i":"/poi-images/rudny-cities-v2.webp","s":"Built as a classic monotown around gigantic iron ore mines, this place steadily attracts miners to the vast plains.","f":["Founded in 1957.","One of the largest iron ore mining areas in Kazakhstan."]},"zhanaozen-cities-v2":{"i":"/poi-images/zhanaozen-cities-v2.webp","s":"In the middle of the harsh Mangyshlak Peninsula, gas and oil extraction pulses here, economically driving the region.","f":["Important oil and gas center.","Founded in 1968 for the development of oil fields."]},"jezkazgan-cities-v2":{"i":"/poi-images/jezkazgan-cities-v2.webp","s":"Deep in the heart of the Kazakh steppe, this mining town manages rich copper deposits under the endless sun.","f":["Center of copper mining.","The city was often the landing site for Soyuz capsules."]},"balkhash-cities-v2":{"i":"/poi-images/balkhash-cities-v2.webp","s":"Squeezed between a barren desert and one of the largest lakes in Asia, the city thrives on fishing and its massive copper smelters.","f":["Located on the northern shore of Lake Balkhash.","One of the most important industrial cities in the region."]},"satpayev-cities-v2":{"i":"/poi-images/satpayev-cities-v2.webp","s":"Named after a famous geologist, the extraction of rare metals here drives the relentless expansion of the mines.","f":["Named after Kanysh Satpayev.","Part of the Jezkazgan copper basin."]},"kaskelen-cities-v2":{"i":"/poi-images/kaskelen-cities-v2.webp","s":"As a rapidly growing satellite city of Almaty, this suburb benefits from the mild climate and nearby apple orchards.","f":["Administrative center of the Karasay district.","Located near the border with Kyrgyzstan."]},"ridder-cities-v2":{"i":"/poi-images/ridder-cities-v2.webp","s":"Hidden in the dense forests of the Altai Mountains, this place was once one of the most remote mining camps of the Russian Empire.","f":["Was called Leninogorsk during the Soviet era.","Significant for zinc and lead production."]},"stepnogorsk-cities-v2":{"i":"/poi-images/stepnogorsk-cities-v2.webp","s":"Once a secret, closed city of the Soviet Union, the town is now trying to reinvent itself in an open market economy.","f":["Was not on maps until 1991.","Center for uranium and gold processing."]},"aksu-cities-v2":{"i":"/poi-images/aksu-cities-v2.webp","s":"With huge smoking chimneys, the city prides itself on having one of the world's largest ferroalloy plants.","f":["Has a huge thermal power plant.","Former name was Yermak."]},"konayev-cities-v2":{"i":"/poi-images/konayev-cities-v2.webp","s":"As a glittering metropolis for gamblers and vacationers, the city is growing on the sandy beaches of the artificial Kapchagay reservoir.","f":["Formerly known as Kapchagay.","The gambling center of Kazakhstan."]},"tengiz-oil-field-economic-v2":{"i":"/poi-images/tengiz-oil-field-economic-v2.webp","s":"Tengiz is one of the largest and deepest producing oil fields in the world, located in the wetlands along the northeastern coast of the Caspian Sea.","f":["Discovered in 1979.","The oil column is incredibly thick, measuring about 1.6 kilometers."]},"kashagan-oil-field-economic-v2":{"i":"/poi-images/kashagan-oil-field-economic-v2.webp","s":"A massive offshore oil field in the Caspian Sea, known for its extremely harsh operating conditions including shallow water, sea ice, and high hydrogen sulfide content.","f":["Considered one of the largest oil discoveries in recent decades.","Production began in 2013 after significant delays."]},"karachaganak-field-economic-v2":{"i":"/poi-images/karachaganak-field-economic-v2.webp","s":"One of the largest gas and condensate fields globally, located in northwestern Kazakhstan, generating a significant portion of the national export revenue.","f":["Covers an area of over 280 square kilometers.","Provides raw materials for petrochemical plants in neighboring Russia."]},"port-of-aktau-economic-v2":{"i":"/poi-images/port-of-aktau-economic-v2.webp","s":"The largest international seaport in Kazakhstan on the Caspian Sea, a major gateway for the transportation of dry cargo, oil, and grain between Asia and Europe.","f":["Ice-free and navigable year-round.","A central hub of the Trans-Caspian International Transport Route."]},"port-of-kuryk-economic-v2":{"i":"/poi-images/port-of-kuryk-economic-v2.webp","s":"A modern ferry and cargo port on the Caspian Sea, expanding export capacities and facilitating ferry traffic to Azerbaijan and Iran.","f":["A key project for the development of the New Silk Road.","The auto ferry complex was commissioned in 2018."]},"bogatyr-coal-mine-economic-v2":{"i":"/poi-images/bogatyr-coal-mine-economic-v2.webp","s":"One of the largest open-pit coal mines in the world, located near Ekibastuz, extracting huge amounts of coal for domestic power plants and export.","f":["Holds the Guinness World Record as the largest open-pit coal mine by production volume.","The scale of the mine is so large it can be seen from space."]},"khorgos-gateway-economic-v2":{"i":"/poi-images/khorgos-gateway-economic-v2.webp","s":"A massive dry port and special economic zone on the border with China, where trains undergo cargo transshipment due to the different railway track gauges.","f":["Often referred to as the most crucial hub of the Eurasian land bridge.","This is where the Chinese standard gauge meets the Kazakh broad gauge."]},"temirtau-steel-plant-economic-v2":{"i":"/poi-images/temirtau-steel-plant-economic-v2.webp","s":"One of the largest metallurgical plants in Central Asia, whose blast furnaces form the economic backbone of the city of Temirtau, also known as the Magnitogorsk of Kazakhstan.","f":["The first President of Kazakhstan, Nursultan Nazarbayev, once worked here as a steelworker.","The plant produces millions of tons of steel annually."]},"ust-kamenogorsk-titanium-magnesium-plant-economic-v2":{"i":"/poi-images/ust-kamenogorsk-titanium-magnesium-plant-economic-v2.webp","s":"A highly specialized industrial plant in eastern Kazakhstan producing aerospace-grade titanium metal.","f":["Supplies major global aircraft manufacturers.","It is one of the few fully integrated titanium plants in the world."]},"zhezkazgan-copper-mine-economic-v2":{"i":"/poi-images/zhezkazgan-copper-mine-economic-v2.webp","s":"One of the historical centers of copper mining and smelting in the steppe region, featuring deep underground shafts and a long industrial history.","f":["Copper deposits here have been mined since antiquity.","The modern city of Zhezkazgan was founded for the miners."]},"balkhash-copper-smelter-economic-v2":{"i":"/poi-images/balkhash-copper-smelter-economic-v2.webp","s":"A monumental metallurgical complex on the shores of Lake Balkhash, whose tall chimney dominates the skyline of the surrounding industrial city.","f":["The complex processes ore from the Kounrad mine.","Has a long history as a symbol of Soviet industrialization."]},"pavlodar-oil-refinery-economic-v2":{"i":"/poi-images/pavlodar-oil-refinery-economic-v2.webp","s":"One of the largest refineries in Kazakhstan, strategically located in the north, traditionally processing West Siberian crude oil into a variety of fuels.","f":["Built in 1978 using advanced technology of the time.","Produces high-octane gasoline and aviation fuel."]},"atyrau-oil-refinery-economic-v2":{"i":"/poi-images/atyrau-oil-refinery-economic-v2.webp","s":"The oldest refinery in Kazakhstan near the Caspian oil capital, which, after extensive modernization, now delivers more environmentally friendly petrochemical products.","f":["Founded in the year 1945.","Processes crude oil directly from the Tengiz field."]},"shymkent-oil-refinery-economic-v2":{"i":"/poi-images/shymkent-oil-refinery-economic-v2.webp","s":"The newest of the three major national refineries, located in the densely populated south, and a crucial element in securing national energy sovereignty.","f":["It was commissioned in 1985.","Covers the majority of the fuel needs in the southern regions."]},"ekibastuz-gres-1-power-station-economic-v2":{"i":"/poi-images/ekibastuz-gres-1-power-station-economic-v2.webp","s":"One of the largest coal-fired power stations in the world, drawing energy from the nearby Bogatyr mine and generating a substantial portion of the electricity in Kazakhstan.","f":["Has an installed capacity of 4,000 megawatts.","The massive chimneys dominate the flat steppe landscape."]},"ekibastuz-gres-2-power-station-economic-v2":{"i":"/poi-images/ekibastuz-gres-2-power-station-economic-v2.webp","s":"A neighboring major power station, world-famous for its gigantic chimney, which is considered the tallest globally.","f":["The chimney is an incredible 419.7 meters high.","Despite its scale, only two of the originally planned eight blocks were completed."]},"aktobe-ferroalloy-plant-economic-v2":{"i":"/poi-images/aktobe-ferroalloy-plant-economic-v2.webp","s":"A state-of-the-art metallurgical plant in the west of the country, producing a wide range of high-quality chromium, manganese, and silicon alloys for global export.","f":["One of the oldest plants in the region, recently heavily modernized.","The smelting furnaces there are among the most innovative in the industry."]},"sokolov-sarbai-iron-ore-plant-economic-v2":{"i":"/poi-images/sokolov-sarbai-iron-ore-plant-economic-v2.webp","s":"A massive industrial complex in the city of Rudny, representing a central pillar of Kazakh iron ore mining and processing.","f":["The company extracts ore from several giant open-pit mines.","The facility produces millions of tons of iron ore pellets and concentrates."]},"inkai-uranium-mine-economic-v2":{"i":"/poi-images/inkai-uranium-mine-economic-v2.webp","s":"One of the most advanced uranium mining facilities globally, located in southern Kazakhstan, utilizing more environmentally friendly in-situ recovery techniques.","f":["Kazakhstan is the largest uranium producer globally, and Inkai is a key contributor.","Operated as a joint venture with international partners."]},"bozshakol-copper-mine-economic-v2":{"i":"/poi-images/bozshakol-copper-mine-economic-v2.webp","s":"A state-of-the-art open-pit copper mining project, which is one of the largest industrial developments of the 21st century in Kazakhstan.","f":["The ore is processed in a massive, largely automated concentrator.","The life of the mine is estimated to be over 40 years."]},"kz-aisha-bibi-mausoleum-history-v2":{"i":"/poi-images/kz-aisha-bibi-mausoleum-history-v2.webp","s":"This architectural jewel impresses with its elaborate and detailed terracotta ornaments.","f":["Built in the 11th or 12th century.","Unique terracotta facade design."]},"kz-jochi-khan-mausoleum-history-v2":{"i":"/poi-images/kz-jochi-khan-mausoleum-history-v2.webp","s":"In the endless expanse of the central steppe, this historical building marks the beginning of the Golden Horde.","f":["Resting place of the eldest son of Genghis Khan.","Dates back to the 13th century."]},"kz-alzhir-memorial-history-v2":{"i":"/poi-images/kz-alzhir-memorial-history-v2.webp","s":"This grim testament to the Stalin era commemorates the suffering of the innocently imprisoned women.","f":["Soviet labor camp for women.","Part of the Gulag system from 1937 to 1953."]},"kz-issyk-kurgan-history-v2":{"i":"/poi-images/kz-issyk-kurgan-history-v2.webp","s":"One of the most important archaeological treasures in Central Asia was unearthed in this ancient burial mound.","f":["Discovery site of the Golden Man in 1969.","Burial mound belonging to the ancient Saka culture."]},"kz-beket-ata-history-v2":{"i":"/poi-images/kz-beket-ata-history-v2.webp","s":"Hidden deep in the unforgiving desert, this underground sanctuary offers a cool oasis of peace and contemplation.","f":["Carved directly into the massive limestone rock.","Named after a revered Sufi scholar."]},"kz-sauran-ruins-history-v2":{"i":"/poi-images/kz-sauran-ruins-history-v2.webp","s":"Surrounded by vast, arid plains, the well-preserved mud-brick walls of this once impregnable fortress stand proud.","f":["It was a medieval fortress city.","The city walls are partially well preserved."]},"kz-arystan-bab-history-v2":{"i":"/poi-images/kz-arystan-bab-history-v2.webp","s":"It is a tradition for pilgrims to visit this holy place first before moving on to Turkistan.","f":["Resting place of the spiritual teacher of Yasawi.","Originally built in the 14th century."]},"kz-akyrtas-palace-history-v2":{"i":"/poi-images/kz-akyrtas-palace-history-v2.webp","s":"The massive, unfinished red stone blocks continue to puzzle archaeologists to this day.","f":["A mysterious red stone structure.","Was never completely finished."]},"kz-saraichik-ruins-history-v2":{"i":"/poi-images/kz-saraichik-ruins-history-v2.webp","s":"Where today only scattered stones lie, a wealthy Islamic metropolis once stood.","f":["Former capital of the Nogai Horde.","Destroyed by Cossacks in the 16th century."]},"kz-shakpak-ata-history-v2":{"i":"/poi-images/kz-shakpak-ata-history-v2.webp","s":"The mosque carved into the dazzling white rock is a surreal sight in the barren landscape.","f":["Carved directly into a white chalk cliff.","Cross-shaped floor plan, similar to a temple."]},"kz-babadzha-khatun-history-v2":{"i":"/poi-images/kz-babadzha-khatun-history-v2.webp","s":"The simple yet elegantly shaped roof of this tomb makes it a special feature of Central Asian architecture.","f":["Distinguished by its ribbed tent-shaped roof.","Located near the Aisha Bibi Mausoleum."]},"kz-anyrakay-battlefield-history-v2":{"i":"/poi-images/kz-anyrakay-battlefield-history-v2.webp","s":"On this vast plain, the united Kazakh tribes fought for their survival and freedom.","f":["Site of the decisive battle in 1729.","Victory of the Kazakhs over the powerful Dzungars."]},"kz-karlag-memorial-history-v2":{"i":"/poi-images/kz-karlag-memorial-history-v2.webp","s":"In the middle of the harsh steppe, the former headquarters of the prison camp stands as a silent accuser.","f":["One of the largest Gulag camps in the USSR.","Operated continuously from 1931 to 1959."]},"kz-karabura-mausoleum-history-v2":{"i":"/poi-images/kz-karabura-mausoleum-history-v2.webp","s":"According to legend, Karabura possessed the gift of healing incurable diseases.","f":["Dedicated to a revered healer and saint.","Famous for many miraculous healings."]},"kz-sisem-ata-history-v2":{"i":"/poi-images/kz-sisem-ata-history-v2.webp","s":"This impressive necropolis resembles a stone forest of elaborately decorated grave steles.","f":["One of the largest ancient cities of the dead in the country.","Richly decorated stone tombs of the nomads."]},"kz-sygnak-ruins-history-v2":{"i":"/poi-images/kz-sygnak-ruins-history-v2.webp","s":"Once, this powerful city minted its own coins and traded with the whole known world.","f":["Capital of the Kipchaks in the 12th century.","Important minting center of the Silk Road."]},"kz-abai-shakarim-history-v2":{"i":"/poi-images/kz-abai-shakarim-history-v2.webp","s":"The brilliant white towers of this monument rise like lighthouses of the intellect into the steppe sky.","f":["Memorial to the national poet Abai Qunanbaiuli.","Built on the picturesque Mount Zhidebai."]},"bayterek-tower-landmarks-v2":{"i":"/poi-images/bayterek-tower-landmarks-v2.webp","s":"A futuristic observation tower in Astana that represents the mythical tree of life and the magic bird Samruk.","f":["It is 97 meters tall, symbolizing the year 1997.","The top sphere contains a handprint of the first president."]},"khan-shatyr-landmarks-v2":{"i":"/poi-images/khan-shatyr-landmarks-v2.webp","s":"A massive, transparent tent that houses a large shopping and entertainment center in the heart of the capital.","f":["It was designed by British architect Norman Foster.","It even features an artificial beach with sand from the Maldives."]},"khoja-ahmed-yasawi-landmarks-v2":{"i":"/poi-images/khoja-ahmed-yasawi-landmarks-v2.webp","s":"An unfinished architectural masterpiece from the Timurid era, considered one of the most important pilgrimage sites in Central Asia.","f":["It was commissioned by Timur (Tamerlane) in 1389.","The building was declared a UNESCO World Heritage Site in 2003."]},"medeu-rink-landmarks-v2":{"i":"/poi-images/medeu-rink-landmarks-v2.webp","s":"A high-altitude outdoor speed skating and bandy rink located deep in the mountains of the Trans-Ili Alatau near Almaty.","f":["The rink is situated at an elevation of nearly 1700 meters above sea level.","Countless speed skating world records have been broken here."]},"ascension-cathedral-landmarks-v2":{"i":"/poi-images/ascension-cathedral-landmarks-v2.webp","s":"A colorful Russian Orthodox wooden church in Almaty's Panfilov Park, built almost entirely without nails.","f":["It was completed in 1907 and survived a massive earthquake in 1911.","At over 50 meters, it is one of the tallest wooden buildings in the world."]},"kok-tobe-landmarks-v2":{"i":"/poi-images/kok-tobe-landmarks-v2.webp","s":"A prominent mountain on the edge of Almaty featuring an amusement park, a cable car, and an iconic Beatles monument.","f":["The summit can be reached by a cable car that was modernized in 2006.","The huge television tower on the mountain is visible from all over the city."]},"palace-of-peace-landmarks-v2":{"i":"/poi-images/palace-of-peace-landmarks-v2.webp","s":"A spectacular glass pyramid in Astana designed to host global religious congresses and cultural exchange.","f":["The pyramid is exactly 62 meters high and sits on a 15-meter base.","It was designed by the renowned British architect Norman Foster."]},"hazret-sultan-mosque-landmarks-v2":{"i":"/poi-images/hazret-sultan-mosque-landmarks-v2.webp","s":"The largest mosque in Central Asia, impressing visitors with classical Islamic elements and traditional Kazakh ornaments.","f":["It can accommodate up to 10,000 worshippers at the same time.","The mosque features a massive 51-meter main dome and four minarets."]},"independence-monument-almaty-landmarks-v2":{"i":"/poi-images/independence-monument-almaty-landmarks-v2.webp","s":"A massive obelisk in Almaty's Republic Square, topped by the figure of the Golden Man on a winged snow leopard.","f":["The obelisk is 28 meters tall.","It was inaugurated in 1996 to celebrate the fifth anniversary of independence."]},"tamgaly-petroglyphs-landmarks-v2":{"i":"/poi-images/tamgaly-petroglyphs-landmarks-v2.webp","s":"A significant archaeological site featuring thousands of ancient rock carvings depicting pagan rituals, hunting scenes, and sun deities.","f":["Most of the carvings date back to the Bronze Age.","The site was inscribed on the UNESCO World Heritage list in 2004."]},"arystan-bab-landmarks-v2":{"i":"/poi-images/arystan-bab-landmarks-v2.webp","s":"A revered pilgrimage site and tomb of a Sufi mystic who, according to legend, was the teacher of Khoja Ahmed Yasawi.","f":["The original building dates back to the 12th century but has been rebuilt several times.","Pilgrims often visit this mausoleum first before traveling on to Turkistan."]},"national-museum-kazakhstan-landmarks-v2":{"i":"/poi-images/national-museum-kazakhstan-landmarks-v2.webp","s":"A vast and modern museum complex showcasing the rich history, culture, and art of the Kazakh nation from ancient times to the present.","f":["It is the largest museum in all of Central Asia.","Highlights include the Hall of Gold featuring artifacts from Scythian nomads."]},"shymbulak-resort-landmarks-v2":{"i":"/poi-images/shymbulak-resort-landmarks-v2.webp","s":"A premier winter sports resort near Almaty, known for its mild climate, sunny days, and large amounts of fresh snow.","f":["The ski resort is located at an altitude of 2200 meters.","It hosted events for the 2011 Asian Winter Games."]},"aisha-bibi-landmarks-v2":{"i":"/poi-images/aisha-bibi-landmarks-v2.webp","s":"A delicate masterpiece of Karakhanid architecture from the 12th century, decorated with beautiful terracotta tiles.","f":["Legend says it was built for a young bride who was bitten by a snake.","The building is decorated with over 60 different patterns of terracotta."]},"beket-ata-landmarks-v2":{"i":"/poi-images/beket-ata-landmarks-v2.webp","s":"A mystical cave mosque carved deep into the white limestone cliffs of the arid Mangystau peninsula.","f":["It was founded in the 18th century by the Sufi scholar Beket-Ata.","The site attracts numerous pilgrims year-round seeking healing and blessings."]},"astana-opera-landmarks-v2":{"i":"/poi-images/astana-opera-landmarks-v2.webp","s":"A magnificent theater building that combines classical European architecture with national Kazakh motifs and offers outstanding acoustics.","f":["The building was opened in 2013 on the initiative of the Kazakh president.","The main hall can seat over 1,200 spectators."]},"otrar-ruins-landmarks-v2":{"i":"/poi-images/otrar-ruins-landmarks-v2.webp","s":"The archaeological remains of a once-thriving oasis city on the Silk Road that was destroyed by the Mongols in the 13th century.","f":["Otrar was the birthplace of the famous philosopher Al-Farabi.","Excavations have uncovered bathhouses, mosques, and extensive fortifications."]},"alzhir-memorial-landmarks-v2":{"i":"/poi-images/alzhir-memorial-landmarks-v2.webp","s":"A somber memorial center built on the site of a former Soviet gulag for the wives of supposed traitors to the motherland.","f":["ALZHIR was the largest Soviet women's camp of its kind.","The museum complex features the Arch of Sorrow."]},"kazakh-eli-monument-landmarks-v2":{"i":"/poi-images/kazakh-eli-monument-landmarks-v2.webp","s":"A gleaming white marble pillar in Astana representing the sovereignty, strength, and future vision of the Kazakh nation.","f":["The monument is 91 meters high, commemorating the year of independence, 1991.","Atop the pillar sits the mythical golden bird Samruk."]},"central-mosque-almaty-landmarks-v2":{"i":"/poi-images/central-mosque-almaty-landmarks-v2.webp","s":"An elegant white marble house of worship whose blue domes make it one of the most striking spiritual landmarks of the former capital.","f":["It was built in 1999 on the site of an older wooden mosque.","The main prayer hall can accommodate up to 7,000 worshippers."]},"aksu-zhabagly-life-v2":{"i":"/poi-images/aksu-zhabagly-life-v2.webp","s":"The oldest nature reserve in Central Asia protects rare snow leopards and pristine flora.","f":["Founded in 1926.","Protects the Tian Shan brown bear."]},"altyn-emel-life-v2":{"i":"/poi-images/altyn-emel-life-v2.webp","s":"Famous for the Singing Dunes, this park preserves rare ungulates like the onager and goitered gazelle.","f":["Famous for the Singing Dunes.","Home to rare Kulan wild asses."]},"korgalzhyn-life-v2":{"i":"/poi-images/korgalzhyn-life-v2.webp","s":"This vast wetland is a critical crossroads for migratory birds and home to rare pink flamingos.","f":["UNESCO World Heritage site.","Northernmost flamingo habitat."]},"naurzum-life-v2":{"i":"/poi-images/naurzum-life-v2.webp","s":"Provides a safe haven for numerous waterfowl in the picturesque lakes and pine forests of the steppe.","f":["Part of the Saryarka UNESCO site.","Important resting place for birds."]},"burabay-life-v2":{"i":"/poi-images/burabay-life-v2.webp","s":"Often called the Pearl of Kazakhstan, this park combines crystal-clear lakes, dense forests, and striking rocks.","f":["Known as the Kazakh Switzerland.","Home to Mount Kokshetau."]},"bayanaul-life-v2":{"i":"/poi-images/bayanaul-life-v2.webp","s":"The country's oldest national park protects a rocky oasis with sacred caves and rare plants.","f":["Kazakhstan's first national park.","Established in 1985."]},"ile-alatau-life-v2":{"i":"/poi-images/ile-alatau-life-v2.webp","s":"Bordering Almaty, this alpine park provides habitat for snow leopards and wild apple trees.","f":["Directly borders the city of Almaty.","Home to the Sievers apple."]},"karkaraly-life-v2":{"i":"/poi-images/karkaraly-life-v2.webp","s":"A green mountainous island amid the arid steppe, attracting visitors with rich flora and historic sites.","f":["Green oasis in the central steppe.","Famous for Lake Shaitankol."]},"katon-karagay-life-v2":{"i":"/poi-images/katon-karagay-life-v2.webp","s":"The country's largest national park in the Altai Mountains protects pristine taiga and endangered species.","f":["Largest national park in Kazakhstan.","Borders Russia and China."]},"sayram-ugam-life-v2":{"i":"/poi-images/sayram-ugam-life-v2.webp","s":"This mountain park in the western Tian Shan impresses with deep gorges, juniper forests, and endemic tulips.","f":["Located in the western Tian Shan.","High botanical biodiversity."]},"zhongar-alatau-life-v2":{"i":"/poi-images/zhongar-alatau-life-v2.webp","s":"Developed to protect genetically pure wild apple forests, it is a paradise for botanists and nature lovers.","f":["Protects the Sievers wild apple.","Established in 2010."]},"tarbagatai-life-v2":{"i":"/poi-images/tarbagatai-life-v2.webp","s":"One of the youngest parks, preserving the flora of the southern Altai slopes and rare steppe plants.","f":["Established in 2018.","Safeguards wild fruit trees."]},"ili-delta-life-v2":{"i":"/poi-images/ili-delta-life-v2.webp","s":"This huge inland delta on Lake Balkhash provides a refuge for pelicans and the rare Bukhara deer.","f":["Forms wetlands on Lake Balkhash.","Crucial for nesting pelicans."]},"markakol-life-v2":{"i":"/poi-images/markakol-life-v2.webp","s":"The crystal-clear mountain lake and its shores protect endemic fish and a rich alpine fauna.","f":["Centered around Lake Markakol.","Home to the endemic Uskuch fish."]},"karatau-life-v2":{"i":"/poi-images/karatau-life-v2.webp","s":"The rugged Karatau Mountains host many endemic plants and the endangered Karatau wild sheep.","f":["Established in 2004.","Known for endemic flora."]},"almaty-zoo-life-v2":{"i":"/poi-images/almaty-zoo-life-v2.webp","s":"This historic zoo at the foot of the mountains offers families a chance to see Central Asian predators up close.","f":["Founded in 1937.","One of the oldest in Kazakhstan."]},"ailand-astana-life-v2":{"i":"/poi-images/ailand-astana-life-v2.webp","s":"A family hotspot with an indoor aquarium far from any ocean, fascinating with sharks and colorful coral reefs.","f":["More than 3000 kilometers from the ocean.","Holds a Guinness record for isolation."]},"kostanay-wheat-life-v2":{"i":"/poi-images/kostanay-wheat-life-v2.webp","s":"These endless, golden fields are the breadbasket of Kazakhstan, providing food for millions of people.","f":["Major grain-producing region.","Result of the Virgin Lands campaign."]},"turkistan-cotton-life-v2":{"i":"/poi-images/turkistan-cotton-life-v2.webp","s":"Grown in the warm south, this white gold is an important economic engine of regional agriculture.","f":["Known commonly as white gold.","Requires intensive irrigation."]},"shymkent-dendropark-life-v2":{"i":"/poi-images/shymkent-dendropark-life-v2.webp","s":"An expansive green arboretum where locals seek recreation among exotic trees and tranquil lakes.","f":["Covers over 120 hectares.","Founded in the year 1979."]},"charyn-national-park-nature-v2":{"i":"/poi-images/charyn-national-park-nature-v2.webp","s":"The national park is famous for its deep, red-colored canyons shaped over millions of years.","f":["The canyon reaches depths of up to 300 meters.","The sedimentary rocks are about 12 million years old."]},"lake-balkhash-nature-v2":{"i":"/poi-images/lake-balkhash-nature-v2.webp","s":"This enormous lake is a natural wonder, with its western half being freshwater and its eastern half saline.","f":["It is over 600 kilometers long.","The Ili River feeds the freshwater section."]},"ile-alatau-national-park-nature-v2":{"i":"/poi-images/ile-alatau-national-park-nature-v2.webp","s":"A picturesque park in the Trans-Ili Alatau mountains, framing the city of Almaty to the south.","f":["It was established in 1996.","The highest peak is nearly 5000 meters high."]},"altyn-emel-national-park-nature-v2":{"i":"/poi-images/altyn-emel-national-park-nature-v2.webp","s":"This huge park is famous for the Singing Dune, which produces a deep, organ-like sound in the wind.","f":["The Singing Dune is 150 meters high.","The park covers an area of 4600 square kilometers."]},"lake-kaindy-nature-v2":{"i":"/poi-images/lake-kaindy-nature-v2.webp","s":"A surreal natural wonder created by an earthquake in 1911.","f":["The lake is located at an altitude of nearly 2000 meters.","The water is extremely cold even in summer."]},"kolsai-lakes-nature-v2":{"i":"/poi-images/kolsai-lakes-nature-v2.webp","s":"A system of three deep blue mountain lakes strung like pearls in a forested gorge.","f":["There are three lakes at different altitudes.","The highest lake is located at 2850 meters."]},"burabay-national-park-nature-v2":{"i":"/poi-images/burabay-national-park-nature-v2.webp","s":"This green oasis in the middle of the northern Kazakh steppe is defined by pine forests and crystal-clear lakes.","f":["It is often referred to as the Kazakh Switzerland.","The park contains 14 major lakes."]},"irtysh-river-nature-v2":{"i":"/poi-images/irtysh-river-nature-v2.webp","s":"One of the longest rivers in Asia, flowing from the Altai Mountains through Kazakhstan towards Siberia.","f":["The total length is over 4200 kilometers.","It is the most important tributary of the Ob River."]},"ural-river-nature-v2":{"i":"/poi-images/ural-river-nature-v2.webp","s":"This historic river forms the traditional boundary between Europe and Asia.","f":["It is approximately 2428 kilometers long.","It originates in the southern Ural Mountains."]},"syr-darya-nature-v2":{"i":"/poi-images/syr-darya-nature-v2.webp","s":"One of the two main rivers of Central Asia, historically known as the Jaxartes.","f":["The length of the river is 2212 kilometers.","It is vital for the irrigation of cotton fields."]},"mount-belukha-nature-v2":{"i":"/poi-images/mount-belukha-nature-v2.webp","s":"The highest peak of the Altai Mountains is located right on the border between Kazakhstan and Russia.","f":["The peak reaches an altitude of 4506 meters.","The mountain is considered sacred by shamans."]},"khan-tengri-nature-v2":{"i":"/poi-images/khan-tengri-nature-v2.webp","s":"This majestic, pyramid-shaped mountain is one of the highest peaks of the Tien Shan.","f":["The height including the ice cap is 7010 meters.","The name means Ruler of the Sky."]},"aksu-zhabagly-nature-v2":{"i":"/poi-images/aksu-zhabagly-nature-v2.webp","s":"The oldest nature reserve in Kazakhstan encompasses stunning gorges and alpine landscapes in the western Tien Shan.","f":["The reserve was established as early as 1926.","It protects rare birds of prey and snow leopards."]},"karkaraly-national-park-nature-v2":{"i":"/poi-images/karkaraly-national-park-nature-v2.webp","s":"A densely forested mountain massif that rises dramatically from the dry Kazakh steppe.","f":["Known for the rare flora and fauna of the region.","Lake Shaitankol, known as the lake of the devil, is located on a mountain."]},"lake-zaysan-nature-v2":{"i":"/poi-images/lake-zaysan-nature-v2.webp","s":"An ancient freshwater lake in eastern Kazakhstan, often considered one of the oldest lakes in the world.","f":["Some geologists estimate its age to be over 65 million years.","The lake is extremely rich in fish."]},"bayanaul-national-park-nature-v2":{"i":"/poi-images/bayanaul-national-park-nature-v2.webp","s":"The first national park of Kazakhstan is a fascinating oasis of pine forests, bizarre rock formations, and clear lakes amidst the vast steppe.","f":["The park was established in 1985 as the first in the country.","The Kempirtas rock looks like an old woman face."]},"lake-alakol-nature-v2":{"i":"/poi-images/lake-alakol-nature-v2.webp","s":"A unique endorheic lake whose name means multicolored lake, as the water changes color depending on the weather.","f":["The lake is salty and rich in hydrogen sulfide.","Soviet cosmonauts often rested on its shores."]},"ili-river-nature-v2":{"i":"/poi-images/ili-river-nature-v2.webp","s":"This mighty river originates in the mountains of Xinjiang and flows through southeastern Kazakhstan before emptying into Lake Balkhash.","f":["It is the most important tributary of Lake Balkhash.","Ancient petroglyphs by Buddhist monks are found on its banks."]},"naurzum-nature-reserve-nature-v2":{"i":"/poi-images/naurzum-nature-reserve-nature-v2.webp","s":"A significant wetland and steppe area in northern Kazakhstan that serves as a crucial resting place for millions of migratory birds.","f":["It is part of the Saryarka UNESCO Heritage site.","The reserve protects rare pine forests in the st 2":{"i":"/poi-images/muyunkum-desert-relief-v2.webp","s":"Muyunkum is a sand desert in southern Kazakhstan characterized by extreme temperatures.","f":["Bounded by the Chu River to the north.","Hosts adapted desert flora and fauna."]},"saryarka-steppe-relief-v2":{"i":"/poi-images/saryarka-steppe-relief-v2.webp","s":"Saryarka, also known as the Kazakh Uplands, is a large, gently rolling highland in central Kazakhstan.","f":["Part of the UNESCO World Heritage Site.","Rich in minerals and natural resources."]},"mangyshlak-peninsula-relief-v2":{"i":"/poi-images/mangyshlak-peninsula-relief-v2.webp","s":"The Mangyshlak Peninsula is a rugged plateau by the Caspian Sea with unique geological formations.","f":["Rich in oil and natural gas reserves.","Known for its desert-like landscapes."]},"turgay-trough-relief-v2":{"i":"/poi-images/turgay-trough-relief-v2.webp","s":"The Turgay Trough is a broad valley in Kazakhstan connecting the West Siberian Plain with the Aral depression.","f":["Important migration corridor for birds.","Flowed through by the Turgay River."]},"aral-sea-coast-kz-relief-v2":{"i":"/poi-images/aral-sea-coast-kz-relief-v2.webp","s":"The Aral Sea coast in Kazakhstan bears witness to one of the greatest environmental disasters, but also to efforts to restore the northern part.","f":["The North Aral Sea is slowly stabilizing.","Formerly one of the four largest lakes in the world."]},"dzungarian-alatau-relief-v2":{"i":"/poi-images/dzungarian-alatau-relief-v2.webp","s":"The Dzungarian Alatau is a mountain system on the border between Kazakhstan and China, known for its diverse flora.","f":["Highest point is Pik Semyonov-Tian-Shansky.","An important habitat for the snow leopard."]},"karkaraly-mountains-relief-v2":{"i":"/poi-images/karkaraly-mountains-relief-v2.webp","s":"The Karkaraly Mountains are a densely forested mountain massif in the middle of the Kazakh steppe.","f":["Part of the Karkaraly National Park.","Famous for picturesque lakes and pine forests."]},"tarbagatai-mountains-relief-v2":{"i":"/poi-images/tarbagatai-mountains-relief-v2.webp","s":"The Tarbagatai Mountains are a mountain range forming the border between Kazakhstan and China's Xinjiang region.","f":["The name means Place of marmots.","Highest mountain is Tastau at nearly 3000 meters."]},"altai-mountains-kz-relief-v2":{"i":"/poi-images/altai-mountains-kz-relief-v2.webp","s":"The Kazakh part of the Altai Mountains is known for its pristine landscapes and rich biodiversity.","f":["UNESCO World Heritage Site.","Home to numerous rare animal species."]},"ili-valley-relief-v2":{"i":"/poi-images/ili-valley-relief-v2.webp","s":"The Ili Valley is a fertile region along the Ili River that played an historically important role on the Silk Road.","f":["An important agricultural center.","Features ancient petroglyphs and monuments."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
