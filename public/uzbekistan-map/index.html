*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#060614;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:#0a0a1f;border-bottom:1px solid #ffffff14;position:relative;z-index:5}
header a.back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#ffffff14;color:#fff;text-decoration:none;font-weight:700}
header a.back:active{background:#ffffff28}
header h1{margin:0;font-size:1rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .langs{display:flex;gap:.25rem}
.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.drag{cursor:grabbing}
.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}
.region:hover{fill:#2d3a78}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#000;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#60a5fa}
.poi.g-sight circle{fill:#fbbf24}
.poi.g-nature circle{fill:#22c55e}
.poi.g-history circle{fill:#c084fc}
.poi.g-industry circle{fill:#fb923c}
.poi.g-other circle{fill:#9ca3af}
.poi.dim{opacity:.18}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7;fill:#fff;opacity:1}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:#0d1230;border-top:1px solid #ffffff20;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -10px 40px #00000080}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a{display:flex;align-items:center;gap:.55rem;padding:.55rem .55rem;border-radius:8px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:active{background:#ffffff14}
.popup .list a .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.popup .list a .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup .list a .g{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.popup .list .nl{padding:.6rem;color:#ffffff70;font-size:.85rem;font-style:italic}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}
</style>

const POI_CARD={"kyzylkum-desert-relief-v2":{"i":"/poi-images/kyzylkum-desert-relief-v2.webp","s":"Hatalmas homoksivatag, amely Közép-Ázsián húzódik keresztül, és vöröses dűnéiről, valamint szélsőséges hőmérsékletéről ismert.","f":["Mintegy 300 000 négyzetkilométert fed le.","A neve azt jelenti, hogy \"Vörös homok\"."]},"aralkum-desert-relief-v2":{"i":"/poi-images/aralkum-desert-relief-v2.webp","s":"A Föld egyik legfiatalabb sivataga, amely az egykori Aral-tó kiszáradt medrén jött létre.","f":["Több mint 38 000 négyzetkilométeres területet fed le.","A talaj rendkívül sós."]},"tashkent-cities-v2":{"i":"/poi-images/tashkent-cities-v2.webp","s":"Üzbegisztán fővárosa, az ország gazdasági és kulturális központja.","f":["Az 1966-os nagy földrengés után szinte teljesen újjá kellett építeni.","A taskenti metró 1977-ben nyílt meg, elsőként Közép-Ázsiában."]},"samarkand-cities-v2":{"i":"/poi-images/samarkand-cities-v2.webp","s":"Közép-Ázsia egyik legrégebben lakott városa, a Selyemút lenyűgöző építészetéről ismert.","f":["2001 óta az UNESCO Világörökség része.","A Regiszlán tér három lenyűgöző medreszéje a város legismertebb jelképe."]},"bukhara-cities-v2":{"i":"/poi-images/bukhara-cities-v2.webp","s":"Történelmi város a Selyemúton számtalan mecsettel és medreszével.","f":["A történelmi központ több mint 140 fennmaradt építészeti műemléket rejt.","Az 1127-ben épült Kalon-minaret túlélte a mongol inváziót."]},"namangan-cities-v2":{"i":"/poi-images/namangan-cities-v2.webp","s":"Fontos ipari város a Fergana-völgyben, textil- és élelmiszeriparáról ismert.","f":["Több mint 600 000 lakosával Üzbegisztán harmadik legnagyobb városa.","A 17. században alapították egy nagy sóstó közelében."]},"andijan-cities-v2":{"i":"/poi-images/andijan-cities-v2.webp","s":"A Fergana-völgy egyik legrégebbi városa, Babur uralkodó szülőhelyeként ismert.","f":["Az 1902-es földrengés szinte teljesen elpusztította, majd újjáépítették.","Az ország egyik legfontosabb pamut- és selyemtermelője."]},"fergana-cities-v2":{"i":"/poi-images/fergana-cities-v2.webp","s":"Modern város a termékeny Fergana-völgy déli részén, a 19.","f":["1876-ban alapította Szoboljev orosz tábornok \"Új-Margilán\" néven.","Széles, fákkal szegélyezett sugárútjairól és orosz építészetéről ismert."]},"nukus-cities-v2":{"i":"/poi-images/nukus-cities-v2.webp","s":"A Karakalpaksztán Autonóm Köztársaság fővárosa, a Szavickij Múzeumról ismert.","f":["A Szavickij Múzeum a világ második legnagyobb orosz avantgárd művészeti gyűjteményét őrzi.","Három különböző sivatag veszi körül: a Karakum, a Kizil-kum és az Ustyurt."]},"karshi-cities-v2":{"i":"/poi-images/karshi-cities-v2.webp","s":"Jelentős központ Dél-Üzbegisztánban, hosszú történelemmel és modern földgáziparral.","f":["2006-ban hivatalosan is megünnepelte fennállásának 2700. évfordulóját.","Egykor az Indiába és Afganisztánba tartó karavánutak csomópontjában épült."]},"kokand-cities-v2":{"i":"/poi-images/kokand-cities-v2.webp","s":"A Kokandi Kánság egykori fővárosa, gazdag történelmi palotákban és medreszékben.","f":["A 18. és 19. században egy hatalmas kánság fővárosa volt.","Hudojar kán impozáns palotája több mint 100 pompásan díszített szobával büszkélkedhet."]},"margilan-cities-v2":{"i":"/poi-images/margilan-cities-v2.webp","s":"A közép-ázsiai selyemgyártás hagyományos központja évszázados kézművességgel.","f":["Ókor óta a híres Khan-Atlas (selyemszövet) gyártásáról ismert.","A Yodgorlik selyemgyár ma is a régi, hagyományos módszerekkel termel."]},"navoiy-cities-v2":{"i":"/poi-images/navoiy-cities-v2.webp","s":"Modern iparváros a sivatagban, amelyet a nagy költőről, Aliser Navoiról neveztek el.","f":["1958-ban alapították, ezáltal Üzbegisztán egyik legfiatalabb városa.","A 15. századi nagy költő és államférfi, Aliser Navoi nevét viseli."]},"jizzakh-cities-v2":{"i":"/poi-images/jizzakh-cities-v2.webp","s":"Stratégiai elhelyezkedésű város Taskent és Szamarkand között, egy fontos szállítási útvonalon.","f":["A 10. században alapították fontos karavánpihenőként.","Egykor erődítményként szolgált a nomád törzsek támadásainak visszaverésére."]},"urgench-cities-v2":{"i":"/poi-images/urgench-cities-v2.webp","s":"Horezm tartomány közigazgatási központja és a Hívába irányuló utazások kiindulópontja.","f":["Az urgencsi repülőtér a legfontosabb átszállópont a Hívába tartó turisták számára.","A 17. században alapították az elpusztult Konya-Urgencs város menekült lakói."]},"termez-cities-v2":{"i":"/poi-images/termez-cities-v2.webp","s":"Üzbegisztán legdélebbi városa az afgán határon, gazdag buddhista örökséggel.","f":["Olyan ősi buddhista helyszínek találhatók itt, mint Kara Tepe és Fajaz Tepe.","A 9. században épült Al-Hakim at-Tirmidhi mecset fontos zarándokhely."]},"chirchiq-cities-v2":{"i":"/poi-images/chirchiq-cities-v2.webp","s":"Jelentős ipari város Taskent közelében, az azonos nevű folyó völgyében.","f":["Az 1930-as években épült fel a Csircsik folyón épített vízerőművek kivitelezésekor.","Erősen fejlett vegyiparral és gépiparral rendelkezik."]},"angren-cities-v2":{"i":"/poi-images/angren-cities-v2.webp","s":"A szénbányászat és az energiaipar központja Taskent tartományban.","f":["A várost 1946-ban alapították a nagy szénkészletek felfedezése után.","Egy közeli erőmű látja el energiával Taskent tartomány nagy részét."]},"olmaliq-cities-v2":{"i":"/poi-images/olmaliq-cities-v2.webp","s":"Ismert bányászváros nagy réz- és cinkkészletekkel a Kurama-hegység lábánál.","f":["Olmaliq az üzbegisztáni réz- és cinkkohászat legfontosabb központja.","A város fejlődése az 1950-es években indult meg jelentősen a szovjet tervek alapján."]},"bekabad-cities-v2":{"i":"/poi-images/bekabad-cities-v2.webp","s":"A Szir-darja folyó partján fekvő város, amely acéliparáról ismert.","f":["A bekabadi metallurgiai kombinát termeli az ország szinte teljes acélmennyiségét.","A város 1964-ig a Begovat nevet viselte."]},"shahrisabz-cities-v2":{"i":"/poi-images/shahrisabz-cities-v2.webp","s":"Timur történelmi szülővárosa jelentős építészeti romokkal.","f":["Az Ak-Szaraj palota romjai Timur 14. századi építészeti hatalmáról tanúskodnak.","A város neve perzsa nyelven \"zöld várost\" jelent."]},"guliston-cities-v2":{"i":"/poi-images/guliston-cities-v2.webp","s":"Szirdarja tartomány fővárosa és fontos mezőgazdasági központ.","f":["A város 1961-ig a Mirszacsul nevet viselte.","Az Orosz Birodalom idején gyapottermesztő településként alapították."]},"denov-cities-v2":{"i":"/poi-images/denov-cities-v2.webp","s":"Kereskedelmi központ Dél-Üzbegisztánban virágzó mezőgazdasággal és bortermeléssel.","f":["A városban található a 16. századi történelmi Szaid Atalik medresze.","Denau egy fontos mezőgazdasági központ, amely híres szőlőültetvényeiről és gyümölcsöseiről."]},"zarafshan-cities-v2":{"i":"/poi-images/zarafshan-cities-v2.webp","s":"A Kizil-kum sivatagban fekvő város, az üzbég aranybányászat központja.","f":["1965-ben épült a zord Kizil-kum sivatagban az aranyleletek miatt.","A közeli Muruntau bá bánya a világ legnagyobb külszíni aranybányája."]},"kattakurgan-cities-v2":{"i":"/poi-images/kattakurgan-cities-v2.webp","s":"Szamarkand régió egyik legrégebbi központja, ahol egy nagy víztározó is található.","f":["A városban található Üzbegisztán második legnagyobb víztározója, a Kattakurgon-víztározó.","A 17. században a buharai emírek erődítették meg."]},"asaka-cities-v2":{"i":"/poi-images/asaka-cities-v2.webp","s":"A Fergana-völgyben fekvő város, amely elsősorban hatalmas autógyáráról ismert.","f":["A város az UzAuto Motors által működtetett üzbég autóipar központja.","A szovjet korszakban a Leninszk nevet viselte."]},"khiva-cities-v2":{"i":"/poi-images/khiva-cities-v2.webp","s":"Lenyűgöző oázisváros, amelynek óvárosa egy élő szabadtéri múzeum.","f":["Icsan-Kala, Híva fallal körülvett óvárosa volt az első üzbég UNESCO Világörökségi helyszín.","A Kalta-Minor minaret az iszlám világ legmagasabbjának épült, de befejezetlen maradt."]},"yangiyul-cities-v2":{"i":"/poi-images/yangiyul-cities-v2.webp","s":"Taskent gyorsan növekvő elővárosa jelentős élelmiszeriparral.","f":["A város neve üzbég nyelven szó szerint \"Új utat\" jelent.","Gyorsan fejlődött a nagy élelmiszeripari feldolgozóüzemek betelepülésének köszönhetően."]},"chust-cities-v2":{"i":"/poi-images/chust-cities-v2.webp","s":"Hagyományos kézművességéről, különösen a kések és fejfedők készítéséről ismert.","f":["Csuszt országszerte híres a hagyományos fekete üzbég sapkák (doppi) készítéséről.","A csuszti mesterek legendás kézzel kovácsolt késeket (picsok) készítenek."]},"khodjeyli-cities-v2":{"i":"/poi-images/khodjeyli-cities-v2.webp","s":"Fontos történelmi város Nukus közelében ősi nekropoliszokkal.","f":["A város közelében fekszik a Mizdakhan ősi nekropolisz, a mauzóleumok lenyűgöző komplexuma.","A város neve nagyjából \"A zarándokok helyét\" jelenti."]},"turtkul-cities-v2":{"i":"/poi-images/turtkul-cities-v2.webp","s":"Karakalpaksztán egykori fővárosa az Amu-darja partján.","f":["1873-ban alapították orosz helyőrségi városként, Petroaleksandrovszk néven.","1932-ig a Karakalpak Autonóm Szovjetköztársaság első fővárosa volt."]},"kungrad-cities-v2":{"i":"/poi-images/kungrad-cities-v2.webp","s":"Fontos közlekedési csomópont Karakalpaksztán északi részén az Aral-tó felé.","f":["Kungrad az Ustyurt-fennsíkon fekszik, a kiszáradt Aral-tó határán.","Történelmileg jelentős bástya volt a Kaszpi-tenger felé vezető úton."]},"muruntau-gold-mine-economic-v2":{"i":"/poi-images/muruntau-gold-mine-economic-v2.webp","s":"A világ egyik legnagyobb külszíni aranybányája a Kizil-kum sivatagban.","f":["A világ egyik legmélyebb külszíni bányája.","Évente több millió uncia aranyat termel."]},"navoi-mining-metallurgical-economic-v2":{"i":"/poi-images/navoi-mining-metallurgical-economic-v2.webp","s":"Jelentős ipari komplexum Üzbegisztánban, amely arany és urán bányászatára és feldolgozására szakosodott.","f":["Az 1950-es évek végén alapították.","Üzbegisztán gazdaságának döntő motorja."]},"almalyk-mining-metallurgical-economic-v2":{"i":"/poi-images/almalyk-mining-metallurgical-economic-v2.webp","s":"Üzbegisztán legnagyobb rézkohászati központja, amely cinket, ólmot és nemesfémeket is termel.","f":["Több hatalmas bányából származó ércet dolgoz fel.","Az üzbég színesfémipar központi eleme."]},"uzauto-motors-asaka-economic-v2":{"i":"/poi-images/uzauto-motors-asaka-economic-v2.webp","s":"Nagy autógyár a Fergana-völgyben, amely hazai és nemzetközi piacra gyárt járműveket.","f":["1996-ban nyílt meg egy vegyesvállalat révén.","Évente több százezer járművet gyárt."]},"bukhara-oil-refinery-economic-v2":{"i":"/poi-images/bukhara-oil-refinery-economic-v2.webp","s":"Az ország egyik legfontosabb olajfinomítója, amely kiváló minőségű üzemanyagokat és kenőanyagokat állít elő.","f":["Kapacitása eléri az évi több millió tonnát.","Az üzbég üzemanyag-ellátás egyik fontos pillére."]},"fergana-oil-refinery-economic-v2":{"i":"/poi-images/fergana-oil-refinery-economic-v2.webp","s":"Történelmileg jelentős petrolkémiai üzem a Fergana-völgyben, amely kőolaj feldolgozására szakosodott.","f":["A régió egyik legrégebbi ipari létesítménye.","A helyi olajforrások feldolgozására összpontosít."]},"mubarek-gas-processing-economic-v2":{"i":"/poi-images/mubarek-gas-processing-economic-v2.webp","s":"Közép-Ázsia egyik legnagyobb gázfeldolgozó üzeme, amely a földgáz tisztításáért felelős.","f":["Hatékonyan távolítja el a ként a kitermelt földgázból.","Tiszta gázzal látja el a hazai vezetékrendszert."]},"shurtan-gas-chemical-economic-v2":{"i":"/poi-images/shurtan-gas-chemical-economic-v2.webp","s":"Modern ipari komplexum, amely a földgázt műanyagokká és más értékes vegyipari termékekké dolgozza fel.","f":["2001-ben helyezték hivatalosan üzembe.","Jelentősen hozzájárul a polimer termékek exportjához."]},"talimarjan-power-plant-economic-v2":{"i":"/poi-images/talimarjan-power-plant-economic-v2.webp","s":"Jelentős hőerőmű Üzbegisztán déli részén, amely kulcsszerepet játszik az energiaellátásban.","f":["Korszerű gáz- és gőzturbinákon alapul.","Többször bővítették a villamosenergia-termelés növelése érdekében."]},"syrdarya-power-plant-economic-v2":{"i":"/poi-images/syrdarya-power-plant-economic-v2.webp","s":"Közép-Ázsia legnagyobb erőműve, amely az Üzbegisztánban elfogyasztott áram nagy részét termeli.","f":["Beépített kapacitása meghaladja a 3000 megawattot.","Az üzbég villamosenergia-hálózat nélkülözhetetlen központja."]},"angren-coal-mine-economic-v2":{"i":"/poi-images/angren-coal-mine-economic-v2.webp","s":"Üzbegisztán legnagyobb szénbányája, amely fontos tüzelőanyag-forrás a helyi hőerőművek számára.","f":["A barnaszén kitermelése nagyrészt külszíni fejtéssel történik.","Közvetlenül látja el a szomszédos erőműveket."]},"bekabad-steel-plant-economic-v2":{"i":"/poi-images/bekabad-steel-plant-economic-v2.webp","s":"Üzbegisztán egyetlen integrált acélműve, amely acélhulladékot és nyersvasat dolgoz fel építőipari és ipari acéllá.","f":["Már a második világháború alatt megalapították.","Fedezi a nemzeti betonacél-szükséglet nagy részét."]},"tashkent-metallurgical-plant-economic-v2":{"i":"/poi-images/tashkent-metallurgical-plant-economic-v2.webp","s":"Korszerű üzem hidegen hengerelt acéllemezek gyártására, amely fontos a helyi építőipar számára.","f":["A modern üzbég iparosítás egyik presztízsprojektje.","Csökkenti az importált lemezektől való függőséget."]},"maxam-chirchiq-chemical-economic-v2":{"i":"/poi-images/maxam-chirchiq-chemical-economic-v2.webp","s":"Ásványi műtrágyák és más vegyipari termékek vezető gyártója Üzbegisztánban.","f":["Fontos a kiterjedt üzbég mezőgazdaság számára.","A műtrágya mellett ipari vegyszereket is gyárt."]},"termez-river-port-economic-v2":{"i":"/poi-images/termez-river-port-economic-v2.webp","s":"Üzbegisztán egyetlen jelentős folyami kikötője az Amu-darján, amely nagy jelentőséggel bír a déli irányú kereskedelemben.","f":["Főszerepet játszik a humanitárius szállításokban.","Stratégiailag kedvező helyen, a határfolyón fekszik."]},"navoi-free-economic-zone-economic-v2":{"i":"/poi-images/navoi-free- ater-landmarks-v2.webp","s":"A nemzeti opera és balettszínház Alisir Navoi költőről kapta a nevét, és lenyűgöző klasszikus építészettel büszkélkedhet.","f":["Alekszej Scsusev tervezte az épületet.","Japán hadifoglyok is részt vettek az építésében."]},"monument-of-courage-landmarks-v2":{"i":"/poi-images/monument-of-courage-landmarks-v2.webp","s":"Ez az emlékmű az 1966-os pusztító földrengésnek és a várost újjáépítő bátor lakosoknak állít emléket.","f":["Az emlékművön lévő óra 5:23-at mutat.","A kőben lévő repedés magát a rengést szimbolizálja."]},"kukeldash-madrasah-landmarks-v2":{"i":"/poi-images/kukeldash-madrasah-landmarks-v2.webp","s":"Egy 16.","f":["Körülbelül 1570-ben épült.","Egykor karavánszerájként is funkcionált."]},"sitorai-mokhi-khosa-landmarks-v2":{"i":"/poi-images/sitorai-mokhi-khosa-landmarks-v2.webp","s":"Buhara utolsó emírjének nyári palotája, amely lenyűgöző módon ötvözi a keleti és az orosz építészeti stílusokat.","f":["1912 és 1918 között épült.","A neve azt jelenti: \"A holdhoz hasonló csillag\"."]},"lyab-i-hauz-landmarks-v2":{"i":"/poi-images/lyab-i-hauz-landmarks-v2.webp","s":"Buhara egyik legfestőibb tere, amelyet egy történelmi medence köré építettek, ősi medreszék ölelésében.","f":["A 17. században épült.","A medence régen ivóvízzel látta el a várost."]},"bolo-hauz-mosque-landmarks-v2":{"i":"/poi-images/bolo-hauz-mosque-landmarks-v2.webp","s":"Látványos mecset a Buharai bárka várával szemben, amely gyönyörűen faragott faoszlopos tornácáról híres.","f":["1712-ben készült el.","20 faragott faoszloppal rendelkezik."]},"magok-i-attari-landmarks-v2":{"i":"/poi-images/magok-i-attari-landmarks-v2.webp","s":"Buhara egyik legrégebbi fennmaradt mecsete, amely a talajszint alatt helyezkedik el, és iszlám előtti hatásokat mutat.","f":["A legrégebbi része a 9. századból származik.","Egy zoroasztriánus templom romjaira épült."]},"siyob-bazaar-landmarks-v2":{"i":"/poi-images/siyob-bazaar-landmarks-v2.webp","s":"Szamarkand legnagyobb és legrégebbi piaca, am s/uz-jeyran-ecocenter-life-v2.webp","s":"Különleges természetvédelmi terület ritka sivatagi állatok, különösen a golyvás gazella tenyésztésére és megőrzésére.","f":["Buharától 40 kilométerre fekszik.","1977-ben alapították."]},"uz-arnasay-bird-sanctuary-life-v2":{"i":"/poi-images/uz-arnasay-bird-sanctuary-life-v2.webp","s":"Jelentős vizes élőhely, amely számos vándormadár fontos pihenőhelye a közép-ázsiai vonulásuk során.","f":["Az Aydar-Arnaszáj tórendszer része.","Flamingókat és pelikánokat vonz."]},"uz-samarkand-mulberry-plantations-life-v2":{"i":"/poi-images/uz-samarkand-mulberry-plantations-life-v2.webp","s":"Hatalmas ültetvények, ahol eperfákat termesztenek, amelyek levelei a régió híres selyemtermelésének alapját képezik.","f":["A selyemhernyók kizárólag ezeket a leveleket eszik.","A selyemhagyomány évezredekre nyúlik vissza."]},"uz-tashkentland-life-v2":{"i":"/poi-images/uz-tashkentland-life-v2.webp","s":"Üzbegisztán egyik legismertebb vidámparkja hullámvasutakkal, vízi csúszdákkal és családi attrakciókkal.","f":["Gyakran üzbég Disneylandnek nevezik.","Közvetlenül a tévétorony mellett található."]},"uz-magic-city-park-life-v2":{"i":"/poi-images/uz-magic-city-park-life-v2.webp","s":"Vadonatúj, gigantikus családi park Taskentben, amely világhírű nevezetességek másolataival és modern attrakciókkal várja a látogatókat.","f":["2021-ben nyitotta meg kapuit.","Tartalmazza a Tower Bridge másolatát."]},"uz-central-park-samarkand-life-v2":{"i":"/poi-images/uz-central-park-samarkand-life-v2.webp","s":"A történelmi város szívének zöld tüdeje, ahol a helyiek árnyas fák alatt és szökőkutak mellett pihenhetnek.","f":["Elválasztja a régi és az új várost.","Évszázados fák szegélyezik."]},"uz-amir-timur-square-life-v2":{"i":"/poi-images/uz-amir-timur-square-life-v2.webp","s":"Csillag alakú park és tér Taskent központjában, amely a hódító híres lovas szobrát veszi körül.","f":["Az utcák csillag alakban sugároznak szét.","A szobor egy Marx-emlékművet váltott fel."]},"uz-khorezm-melon-fields-life-v2":{"i":"/poi-images/uz-khorezm-melon-fields-life-v2.webp","s":"Az ország északnyugati részén fekvő mezőgazdasági területek, amelyek Közép-Ázsia legédesebb és legaromásabb görögdinnyéiről híresek.","f":["A Gurvak dinnye a legismertebb fajta.","Horezmben évente rendeznek dinnyefesztivált."]},"uz-surkhandarya-pomegranates-life-v2":{"i":"/poi-images/uz-surkhandarya-pomegranates-life-v2.webp","s":"Üzbegisztán legmelegebb régiója hatalmas gyümölcsösöknek ad otthont, amelyek kiváló minőségű, lédús gránátalmákat teremnek.","f":["A Dashnabad fajta különösen híres.","A gránátalma itt a gazdagság szimbóluma."]},"uz-namangan-flower-park-life-v2":{"i":"/poi-images/uz-namangan-flower-park-life-v2.webp","s":"Látványos park a Fergana-völgyben, amely minden tavasszal virágok millióit mutatja be egy híres fesztivál keretében.","f":["A virágfesztivált 1961 óta rendezik meg.","Több mint 10 millió virágot ültetnek el."]},"uz-ashgabat-park-life-v2":{"i":"/poi-images/uz-ashgabat-park-life-v2.webp","s":"Szupermodern pihenőpark Taskentben, amely Üzbegisztán és Türkmenisztán barátságának szimbólumaként épült.","f":["2018-ban nyitotta meg kapuit.","Egy nagy amfiteátrumot is magában foglal."]},"uz-zangiota-vineyards-life-v2":{"i":"/poi-images/uz-zangiota-vineyards-life-v2.webp","s":"Festői borvidék a Taskent régióban, amely friss fogyasztásra és mazsolának való szőlőt termeszt.","f":["A csemegeszőlő itt különösen kedvelt.","A tőkék egy része hagyományos pergolákon nő."]},"uz-japanese-garden-tashkent-life-v2":{"i":"/poi-images/uz-japanese-garden-tashkent-life-v2.webp","s":"Békés menedék hagyományos tájépítészettel, koi-tavakkal és egy igazi teaceremónia házzal.","f":["Esküvői fotózások kedvelt helyszíne.","Japánnal együttműködve tervezték."]},"uz-bukhara-deer-center-life-v2":{"i":"/poi-images/uz-bukhara-deer-center-life-v2.webp","s":"Kritikus fontosságú létesítmény az endemikus buharai szarvas megmentésére, amely szorosan kötődik a folyami oázisok ökoszisztémájához.","f":["A buharai szarvas majdnem kihalt.","A tenyésztés a tugaj-erdőkben zajlik."]},"uz-rishton-apricots-life-v2":{"i":"/poi-images/uz-rishton-apricots-life-v2.webp","s":"Festői gyümölcsösök a Fergana-völgyben, amelyek kivételesen édes sárgabarackjukról híresek, amit gyakran aszalnak.","f":["A tavaszi virágzás igazi turistalátványosság.","Az aszalt sárgabarackot itt 'kuraga'-nak hívják."]},"aral-sea-nature-v2":{"i":"/poi-images/aral-sea-nature-v2.webp","s":"Egykor a világ egyik legnagyobb tava, amely az öntözési projektek miatt súlyosan kiszáradt.","f":["Korábban a Föld negyedik legnagyobb beltengereként tartották számon.","Kiszáradása az egyik legnagyobb környezeti katasztrófa."]},"aydar-lake-nature-v2":{"i":"/poi-images/aydar-lake-nature-v2.webp","s":"Mesterséges tó a Kizil-kum sivatagban, amely az árvizek elterelésével jött létre.","f":["Más tavakkal együtt alkotja az Arnasay-tórendszert.","Fontos terület a vándormadarak és a halászat számára."]},"charvak-reservoir-nature-v2":{"i":"/poi-images/charvak-reservoir-nature-v2.webp","s":"Népszerű üdülőövezet Taskent közelében, amelyet a Csatkal-folyón lévő gát hozott létre.","f":["1970-ben töltötték fel a gát megépítése után.","Strandokat és vízi sportolási lehetőségeket kínál a turistáknak."]},"sarykamysh-lake-nature-v2":{"i":"/poi-images/sarykamysh-lake-nature-v2.webp","s":"Sós tó Türkmenisztán határán, amelyet főként a lefolyó öntözővizek táplálnak.","f":["Neve a türk nyelveken 'sárga nádat' jelent.","Az Aral-tó zsugorodása után jelentősen megnőtt a mérete."]},"tudakul-lake-nature-v2":{"i":"/poi-images/tudakul-lake-nature-v2.webp","s":"Oázistó a sivatagban Buhara közelében, amely gazdag madárvilágáról és üdülőhelyként ismert.","f":["A tó vize enyhén sós.","Fontos pihenőhely a vándorló madarak számára."]},"zarafshan-river-nature-v2":{"i":"/poi-images/zarafshan-river-nature-v2.webp","s":"Jelentős folyó, amely Szamarkandot és Buharát szeli át, és e történelmi oázisvárosok éltető eleme.","f":["Neve perzsául 'aranyhintőt' jelen const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};

  const pd=document.getElementById('pdesc');

  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}

// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
