const POI_CARD={"kabul-cities-v2":{"i":"/poi-images/kabul-cities-v2.webp","s":"Kabul is the capital and most populous city of Afghanistan.","f":["Kabul is situated at an elevation of around 1,790 meters.","The Gardens of Babur are among the city's most famous historical attractions."]},"kandahar-cities-v2":{"i":"/poi-images/kandahar-cities-v2.webp","s":"Kandahar is the second-largest city in Afghanistan and a major economic hub in the south.","f":["The city is famous for its agricultural wealth, particularly pomegranates and grapes.","The Shrine of the Cloak houses a garment believed to have belonged to the Prophet Muhammad."]},"herat-cities-v2":{"i":"/poi-images/herat-cities-v2.webp","s":"Located in western Afghanistan on the Hari Rud river, Herat is known for its impressive Persian architecture.","f":["The Friday Mosque of Herat is a masterpiece of Islamic architecture.","The Citadel of Herat originally dates back to the time of Alexander the Great."]},"mazar-i-sharif-cities-v2":{"i":"/poi-images/mazar-i-sharif-cities-v2.webp","s":"Mazar-i-Sharif is the fourth-largest city in Afghanistan and a major trade center near the Uzbek border.","f":["The Blue Mosque is the landmark and spiritual center of the city.","The city traditionally celebrates the Nowruz festival each year with tens of thousands of visitors."]},"kunduz-cities-v2":{"i":"/poi-images/kunduz-cities-v2.webp","s":"Kunduz is the center of the eponymous province in northern Afghanistan and a significant transport hub.","f":["The region around Kunduz is famous for its melon and cotton cultivation.","The city is strategically located near the border with Tajikistan."]},"jalalabad-cities-v2":{"i":"/poi-images/jalalabad-cities-v2.webp","s":"Jalalabad is the capital of Nangarhar Province in eastern Afghanistan.","f":["The Kabul River flows right through the city, supplying water to its gardens.","King Amanullah Khan and his family are buried in the city's mausoleum."]},"taloqan-cities-v2":{"i":"/poi-images/taloqan-cities-v2.webp","s":"Taloqan is the capital of Takhar Province in northeastern Afghanistan.","f":["Marco Polo described the area around Taloqan in 1275 during his journey to China.","The city's economy is primarily based on agriculture and trade."]},"puli-khumri-cities-v2":{"i":"/poi-images/puli-khumri-cities-v2.webp","s":"Puli Khumri is an industrial city in Baghlan Province.","f":["A major hydroelectric power plant in the city was built with Soviet assistance.","Puli Khumri connects the capital city of Kabul with northern Afghanistan."]},"charikar-cities-v2":{"i":"/poi-images/charikar-cities-v2.webp","s":"Charikar is the capital of Parwan Province and lies on the edge of the Shomali Plain.","f":["The city is located directly on the important connecting road to the Salang Pass.","Charikar is famous for its sweet grapes, which are prized throughout Afghanistan."]},"lashkargah-cities-v2":{"i":"/poi-images/lashkargah-cities-v2.webp","s":"Lashkargah is the capital of Helmand Province in southern Afghanistan.","f":["The modern city was planned in the 1950s with American assistance.","In ancient times, the region was a winter retreat for kings."]},"sheberghan-cities-v2":{"s":"Sheberghan is the capital of Jowzjan Province in northern Afghanistan.","f":["The famous Bactrian gold treasure was discovered near the city in 1978.","The majority of the population consists of Uzbeks and Turkmens."]},"ghazni-cities-v2":{"i":"/poi-images/ghazni-cities-v2.webp","s":"Ghazni is a historically significant city in central Afghanistan, located on the strategic road between Kabul and Kandahar.","f":["The two minarets of Ghazni are the most famous remains of the ancient empire.","The city was named the Asian capital of Islamic culture in 2013."]},"khost-cities-v2":{"s":"Khost is a city in eastern Afghanistan, near the Pakistani border.","f":["The city hosts the first international university in southeastern Afghanistan.","A large Friday Mosque dominates the center of Khost."]},"sar-e-pol-cities-v2":{"s":"Sar-e Pol is the capital of the eponymous province in the north of the country.","f":["The region has untapped oil reserves in the nearby mountains.","Numerous ethnic groups such as Uzbeks, Tajiks, and Hazaras live together here."]},"chaghcharan-cities-v2":{"i":"/poi-images/chaghcharan-cities-v2.webp","s":"Chaghcharan, also known as Firozkoh, is the capital of Ghor Province in the central highlands of Afghanistan.","f":["Winters in the city are extremely long and snowy.","The Hari Rud river flows directly through the city center."]},"mihtarlam-cities-v2":{"i":"/poi-images/mihtarlam-cities-v2.webp","s":"Mihtarlam is the capital of Laghman Province and is idylically situated in the irrigated valleys of eastern Afghanistan.","f":["According to local belief, the tomb of Lamech, father of Noah, is located in the city.","The area benefits from the water resources of the Alisheng and Alingar rivers."]},"farah-cities-v2":{"i":"/poi-images/farah-cities-v2.webp","s":"Farah is an oasis-like city in western Afghanistan, near the Iranian border.","f":["The ruins of the Citadel of Farah are a significant historical attraction.","Historically, Farah was a stopping point between Herat and Kandahar."]},"puli-alam-cities-v2":{"s":"Puli Alam is the provincial capital of Logar.","f":["A major copper mining project is located nearby at Mes Aynak.","The local economy is dominated by agriculture."]},"aybak-cities-v2":{"i":"/poi-images/aybak-cities-v2.webp","s":"Aybak is the capital of Samangan Province in northern Afghanistan.","f":["The Buddhist cave monastery of Takht-e Rostam is located near the city.","The region is known for its almonds and pistachios."]},"asadabad-cities-v2":{"i":"/poi-images/asadabad-cities-v2.webp","s":"Asadabad is the provincial capital of Kunar and is located at the confluence of the Pech and Kunar rivers.","f":["The surrounding mountains are covered by dense cedar and pine forests.","Asadabad has a close cultural connection to neighboring Pakistan."]},"faizabad-cities-v2":{"i":"/poi-images/faizabad-cities-v2.webp","s":"Faizabad is the most important city in the northeastern province of Badakhshan, situated on the Kokcha River.","f":["The city is a traditional trading hub for lapis lazuli.","The name of the city translates to 'City of Divine Blessing'."]},"qala-e-naw-cities-v2":{"i":"/poi-images/qala-e-naw-cities-v2.webp","s":"Qala e Naw is the capital of Badghis Province in northwestern Afghanistan.","f":["Pistachio forests are an important source of income for the region around Qala e Naw.","The city's architecture consists of flat mud houses and narrow alleys."]},"mahmud-e-raqi-cities-v2":{"i":"/poi-images/mahmud-e-raqi-cities-v2.webp","s":"Mahmud-e-Raqi is a small city in Kapisa Province, north of Kabul.","f":["The city is located not far from the ancient capital of Bagram.","The river valley provides the city with abundant irrigation water."]},"zaranj-cities-v2":{"i":"/poi-images/zaranj-cities-v2.webp","s":"Zaranj is located on the border with Iran and is the provincial capital of Nimruz.","f":["The city frequently suffers from water shortages and drought.","A major new road system connects Zaranj to the port of Chabahar."]},"tarinkot-cities-v2":{"i":"/poi-images/tarinkot-cities-v2.webp","s":"Tarinkot is the capital of the central Afghan province of Uruzgan.","f":["Until 2004, there were almost no paved roads in Tarinkot.","The economy relies on subsistence agriculture."]},"maymana-cities-v2":{"i":"/poi-images/maymana-cities-v2.webp","s":"Maymana is the largest city in Faryab Province in northwestern Afghanistan.","f":["The city's bazaar is known for high-quality Karakul pelts.","Maymana has a university founded in 2004."]},"gardez-cities-v2":{"i":"/poi-images/gardez-cities-v2.webp","s":"Gardez is the center of Paktia Province in the east of the country.","f":["A large fortress, the Bala Hissar, towers over Gardez.","The city is located high in the mountains at over 2,300 meters."]},"maidan-shar-cities-v2":{"i":"/poi-images/maidan-shar-cities-v2.webp","s":"Maidan Shar is the capital of Wardak Province and is located just about 40 kilometers from Kabul.","f":["Wardak Province is known for its excellent apples.","Its proximity to the capital makes it a popular residential area for commuters."]},"qalat-cities-v2":{"i":"/poi-images/qalat-cities-v2.webp","s":"Qalat is the capital of Zabul Province in southern Afghanistan.","f":["The city is dominated by a fortress said to have been built by Alexander the Great.","The dry desert climate shapes life in Qalat."]},"bamyan-cities-v2":{"i":"/poi-images/bamyan-cities-v2.webp","s":"Located centrally in Afghanistan, Bamyan is known for its impressive history and cultural landscape.","f":["Bamyan is world-famous for the giant Buddha statues that were destroyed in 2001.","The nearby Band-e-Amir National Park was Afghanistan's first national park."]},"mes-aynak-mine-economic-v2":{"i":"/poi-images/mes-aynak-mine-economic-v2.webp","s":"Mes Aynak is one of the world's largest untapped copper deposits, located in Logar Province.","f":["The deposit is estimated at hundreds of millions of tons of ore.","It also hosts a significant archaeological site."]},"hajigak-mine-economic-v2":{"i":"/poi-images/hajigak-mine-economic-v2.webp","s":"The Hajigak mine in Bamyan Province is the largest iron ore deposit in Afghanistan and the region.","f":["The deposit contains an estimated nearly 2 billion tons of iron ore.","It is located at an altitude of over 3,000 meters."]},"sher-khan-bandar-economic-v2":{"i":"/poi-images/sher-khan-bandar-economic-v2.webp","s":"Sher Khan Bandar is a major dry port and border crossing between Afghanistan and Tajikistan on the Amu Darya river.","f":["Named after Sher Khan Nashir, an Afghan leader.","The bridge across the river opened in 2007."]},"hairatan-port-economic-v2":{"i":"/poi-images/hairatan-port-economic-v2.webp","s":"Hairatan is a central border port in Balkh Province and the main trade route to Uzbekistan.","f":["Connected to Uzbekistan by the Friendship Bridge.","Features a major railway connection to Mazar-i-Sharif."]},"islam-qala-hub-economic-v2":{"i":"/poi-images/islam-qala-hub-economic-v2.webp","s":"Islam Qala in Herat Province is the largest and most important border crossing for trade between Afghanistan and Iran.","f":["Much of Afghan imports from Iran pass through here.","Customs revenues are crucial for the state."]},"spin-boldak-hub-economic-v2":{"i":"/poi-images/spin-boldak-hub-economic-v2.webp","s":"Spin Boldak is a major trade hub in southern Afghanistan, connecting the Kandahar region with Pakistan.","f":["Located directly opposite the Pakistani city of Chaman.","Important for the export of agricultural products."]},"torkham-hub-economic-v2":{"i":"/poi-images/torkham-hub-economic-v2.webp","s":"Torkham is the busiest border crossing between Afghanistan and Pakistan, passing through the historic Khyber Pass.","f":["Connects the city of Jalalabad with Peshawar in Pakistan.","A lifeline for Afghan transit trade."]},"kajaki-hydro-economic-v2":{"i":"/poi-images/kajaki-hydro-economic-v2.webp","s":"The Kajaki Hydroelectric Plant on the Helmand River provides crucial electricity for southern Afghanistan.","f":["Originally built in the 1950s.","Capacity was gradually increased through several turbine upgrades."]},"naghlou-hydro-economic-v2":{"i":"/poi-images/naghlou-hydro-economic-v2.webp","s":"The Naghlu Dam is Afghanistan's largest hydropower plant, providing electricity primarily to the capital, Kabul.","f":["Built with Soviet assistance in the 1960s.","The installed capacity is about 100 megawatts."]},"salma-dam-economic-v2":{"i":"/poi-images/salma-dam-economic-v2.webp","s":"The Salma Hydropower Plant, also known as the Afghan-India Friendship Dam, produces energy on the Hari Rud river.","f":["The project was completed in 2016 with Indian financial assistance.","In addition to power, it also provides irrigation for the region."]},"aqina-port-economic-v2":{"i":"/poi-images/aqina-port-economic-v2.webp","s":"Aqina is an emerging dry port on the border with Turkmenistan and part of the Lapis Lazuli corridor.","f":["It features a railway connection to Turkmenistan.","It boosts trade in the northern provinces."]},"torghundi-port-economic-v2":{"i":"/poi-images/torghundi-port-economic-v2.webp","s":"Torghundi is the second major border crossing with Turkmenistan and important for trade in the northwest.","f":["Railway facilities were modernized by the Turkmen side.","Facilitates the import of energy and fuel."]},"sheberghan-gas-economic-v2":{"i":"/poi-images/sheberghan-gas-economic-v2.webp","s":"The gas fields around Sheberghan are the center of natural gas production in Afghanistan.","f":["Some fields were discovered in the 1960s by Soviet experts.","The gas supplies local power plants, among other things."]},"amu-darya-oil-economic-v2":{"i":"/poi-images/amu-darya-oil-economic-v2.webp","s":"The Amu Darya basin hosts the country's most important commercially viable oil reserves.","f":["The area is being developed in collaboration with international companies.","It includes several active production wells."]},"jangalak-complex-economic-v2":{"i":"/poi-images/jangalak-complex-economic-v2.webp","s":"The Jangalak Industrial Complex in Kabul was once the largest industrial production center in Afghanistan.","f":["At its peak, it produced agricultural equipment and vehicles.","The facilities were heavily damaged during conflicts."]},"baghlan-sugar-economic-v2":{"i":"/poi-images/baghlan-sugar-economic-v2.webp","s":"The Baghlan sugar factory was historically important for processing the regional sugar beet crop.","f":["It was founded in 1940.","Its reactivation was part of economic development plans."]},"ghori-cement-economic-v2":{"i":"/poi-images/ghori-cement-economic-v2.webp","s":"The Ghori Cement Factory in Puli Khumri is one of the few producing cement plants in Afghanistan.","f":["Consists of two main production lines.","It provides building materials for national infrastructure projects."]},"jabal-siraj-cement-economic-v2":{"i":"/poi-images/jabal-siraj-cement-economic-v2.webp","s":"The plant in Jabal al-Siraj was Afghanistan's first cement factory and holds historical significance.","f":["Construction began in the 1950s.","After a long pause, operations were partially resumed."]},"bagrami-park-economic-v2":{"i":"/poi-images/bagrami-park-economic-v2.webp","s":"The Bagrami Industrial Park in Kabul houses a variety of manufacturing plants and factories.","f":["Provides infrastructure for light industry and textiles.","Intended to attract private investment to the capital."]},"herat-industrial-economic-v2":{"i":"/poi-images/herat-industrial-economic-v2.webp","s":"The Herat Industrial Park is one of the country's most active economic centers, characterized by strong trade links.","f":["Focuses on food processing, plastics, and building materials.","Benefits from its proximity to Iran."]},"buddhas-bamiyan-history-v2":{"i":"/poi-images/buddhas-bamiyan-history-v2.webp","s":"The Buddhas of Bamiyan were two monumental statues carved into a cliff face in the 6th century and destroyed in 2001.","f":["The largest statue was 55 meters tall.","They were part of a UNESCO World Heritage site."]},"minaret-of-jam-history-v2":{"i":"/poi-images/minaret-of-jam-history-v2.webp","s":"The Minaret of Jam is a 65-meter-tall brick tower from the 12th century, known for its intricate decorations.","f":["Built around 1190 under the Ghurid dynasty.","Located in a remote river valley."]},"citadel-herat-history-v2":{"i":"/poi-images/citadel-herat-history-v2.webp","s":"The Citadel of Herat, also known as Qala Ikhtyaruddin, is an ancient fortress with origins dating back to Alexander the Great.","f":["Founded in the 4th century BC.","Served as a residence for many Afghan rulers."]},"bala-hissar-kabul-history-v2":{"i":"/poi-images/bala-hissar-kabul-history-v2.webp","s":"Bala Hissar is an ancient fortress in Kabul that was an important military and political center of Afghanistan for centuries.","f":["The fortress dates back to the 5th century.","Was a battleground in the First and Second Anglo-Afghan Wars."]},"shrine-of-hazrat-ali-history-v2":{"i":"/poi-images/shrine-of-hazrat-ali-history-v2.webp","s":"The Shrine of Hazrat Ali in Mazar-i-Sharif is a magnificent Islamic shrine decorated with intricate blue tiles.","f":["The current building dates back to the 15th century.","Is visited by many pilgrims."]},"darul-aman-palace-history-v2":{"i":"/poi-images/darul-aman-palace-history-v2.webp","s":"Darul Aman Palace was built in the 1920s by King Amanullah Khan, symbolizing the modernization of Afghanistan before being destroyed and later restored.","f":["European neoclassical style.","Suffered severe damage during the civil war."]},"mausoleum-mirwais-hotak-history-v2":{"i":"/poi-images/mausoleum-mirwais-hotak-history-v2.webp","s":"The mausoleum in Kandahar honors Mirwais Hotak, an Afghan tribal leader who overthrew Persian rule in the early 18th century.","f":["Considered a national hero of Afghanistan.","The tomb is crowned with a blue dome."]},"bagh-e-babur-history-v2":{"i":"/poi-images/bagh-e-babur-history-v2.webp","s":"Bagh-e Babur in Kabul is a historic park and the final resting place of the first Mughal emperor, Babur.","f":["Laid out in the 16th century.","An outstanding example of Mughal architecture."]},"qala-i-jangi-history-v2":{"i":"/poi-images/qala-i-jangi-history-v2.webp","s":"An expansive 19th-century fortress located near Mazar-i-Sharif, known for its massive mud-brick walls and strategic significance.","f":["Built by the Afghan army in 1889","Site of a major uprising in 2001"]},"minarets-of-ghazni-history-v2":{"i":"/poi-images/minarets-of-ghazni-history-v2.webp","s":"The Minarets of Ghazni are two towering, star-shaped turrets from the 12th century, decorated with terracotta reliefs.","f":["Originally over 40 meters tall.","Testaments of Ghaznavid art."]},"bost-fort-history-v2":{"i":"/poi-images/bost-fort-history-v2.webp","s":"Bost Fort is an ancient ruin in Lashkargah.","f":["Was greatly expanded in the 12th century.","A symbol of Helmand Province."]},"taq-e-zafar-history-v2":{"i":"/poi-images/taq-e-zafar-history-v2.webp","s":"Taq-e Zafar is a victory arch in Paghman near Kabul, built in 1919 to celebrate Afghan independence.","f":["Commemorates the Third Anglo-Afghan War.","Made of white marble."]},"shahr-e-gholghola-history-v2":{"i":"/poi-images/shahr-e-gholghola-history-v2.webp","s":"Shahr-e Gholghola, the \"City of Screams\", is a ruined city in Bamyan that was destroyed by Genghis Khan in the 13th century.","f":["Once a thriving settlement.","Offers a view of the Bamyan Valley."]},"musalla-complex-history-v2":{"i":"/poi-images/musalla-complex-history-v2.webp","s":"The Musalla Complex in Herat is a collection of 15th-century Islamic architecture consisting of minarets and mausoleums.","f":["Founded by Queen Gawhar Shad.","Many parts were destroyed in the late 19th century."]},"khwaja-abu-nasr-parsa-history-v2":{"i":"/poi-images/khwaja-abu-nasr-parsa-history-v2.webp","s":"The shrine in the center of Balkh is a masterpiece of Timurid architecture and honors a well-known Sufi scholar.","f":["Built in the late 15th century.","Features a distinctive ribbed dome."]},"mausoleum-ahmad-shah-durrani-history-v2":{"i":"/poi-images/mausoleum-ahmad-shah-durrani-history-v2.webp","s":"This octagonal structure in Kandahar is the tomb of Ahmad Shah Durrani, the founder of the modern state of Afghanistan.","f":["Considered the most important historical building in the city.","The dome is intricately painted inside."]},"shahr-e-zuhak-history-v2":{"i":"/poi-images/shahr-e-zuhak-history-v2.webp","s":"Shahr-e Zuhak, also known as the \"Red City\", is an ancient ruined fortress that rises steeply above the confluence of two rivers.","f":["Named after the reddish earth.","Was also destroyed by Mongol troops."]},"takht-e-rustam-history-v2":{"i":"/poi-images/takht-e-rustam-history-v2.webp","s":"Takht-e Rustam is an extraordinary Buddhist stupa complex in Samangan Province, carved entirely out of solid rock.","f":["Reminiscent of the architecture of Petra.","Served as a retreat for Buddhist monks."]},"shrine-khwaja-abd-allah-history-v2":{"i":"/poi-images/shrine-khwaja-abd-allah-history-v2.webp","s":"The Gazar-Gah Shrine houses the tomb of the revered Sufi mystic Khwaja Abd Allah Ansari and is a center of Islamic spirituality.","f":["The mausoleum was built in 1425.","The complex is decorated with fine tile mosaics."]},"tepe-sardar-history-v2":{"i":"/poi-images/tepe-sardar-history-v2.webp","s":"Tepe Sardar is a major archaeological site near Ghazni that contains the remains of a large Buddhist monastery.","f":["Flourished between the 3rd and 8th centuries.","Giant clay Buddhas were unearthed here."]},"qargha-reservoir-landmarks-v2":{"i":"/poi-images/qargha-reservoir-landmarks-v2.webp","s":"The Qargha Reservoir near Kabul is a popular destination for families.","f":["Located near Kabul.","Used for irrigation."]},"national-museum-afghanistan-landmarks-v2":{"i":"/poi-images/national-museum-afghanistan-landmarks-v2.webp","s":"This museum in Kabul once housed one of the most significant antiquities collections in Central Asia.","f":["Founded in 1919.","Exhibits ancient coins."]},"band-e-amir-park-landmarks-v2":{"i":"/poi-images/band-e-amir-park-landmarks-v2.webp","s":"Band-e-Amir is Afghanistan's first national park, famous for its deep blue lakes.","f":["First national park.","Six deep blue lakes."]},"bagh-e-bala-palace-landmarks-v2":{"i":"/poi-images/bagh-e-bala-palace-landmarks-v2.webp","s":"A historic palace in Kabul, built at the end of the 19th century.","f":["Built around 1893.","Featured a large pool."]},"salang-pass-landmarks-v2":{"i":"/poi-images/salang-pass-landmarks-v2.webp","s":"The Salang Pass is one of the most important mountain routes in the Hindu Kush.","f":["Over 3,800 meters high.","Connects north and south."]},"wazir-akbar-khan-mosque-landmarks-v2":{"i":"/poi-images/wazir-akbar-khan-mosque-landmarks-v2.webp","s":"A prominent mosque in the upscale Wazir Akbar Khan district of Kabul, serving as a significant religious center in the capital.","f":["Named after a 19th-century Afghan prince","Located in Kabul's diplomatic enclave"]},"abdul-rahman-mosque-landmarks-v2":{"i":"/poi-images/abdul-rahman-mosque-landmarks-v2.webp","s":"Also known as the Grand Mosque of Kabul, it is one of the largest Islamic places of worship in the country.","f":["Opened in 2012.","Holds 10,000 worshippers."]},"id-gah-mosque-landmarks-v2":{"i":"/poi-images/id-gah-mosque-landmarks-v2.webp","s":"One of the oldest and largest historic mosques in Kabul.","f":["Built around 1893.","Venue for Eid prayers."]},"pul-e-khishti-mosque-landmarks-v2":{"i":"/poi-images/pul-e-khishti-mosque-landmarks-v2.webp","s":"With its striking blue dome, this mosque in the bustling center of Kabul cannot be missed.","f":["Features a blue dome.","Located near the bazaar."]},"shah-do-shamshira-landmarks-v2":{"i":"/poi-images/shah-do-shamshira-landmarks-v2.webp","s":"This two-story mosque in Kabul stands out for its European-inspired architecture.","f":["European style.","Located on the Kabul River."]},"tv-hill-landmarks-v2":{"i":"/poi-images/tv-hill-landmarks-v2.webp","s":"A prominent mountain in the middle of Kabul, covered with numerous antenna masts.","f":["Dominates the skyline.","Many transmission masts."]},"chihil-sutun-palace-landmarks-v2":{"i":"/poi-images/chihil-sutun-palace-landmarks-v2.webp","s":"The 'Palace of Forty Pillars' is located in a vast park in southern Kabul.","f":["Translates to '40 Pillars'.","Recently restored."]},"tajbeg-palace-landmarks-v2":{"i":"/poi-images/tajbeg-palace-landmarks-v2.webp","s":"A monumental palace on a hill in Kabul that served as a royal residence.","f":["Situated on a hill.","Also called 'Queen's Palace'."]},"arg-presidential-palace-landmarks-v2":{"i":"/poi-images/arg-presidential-palace-landmarks-v2.webp","s":"The historic presidential palace complex in Kabul, which has served as the official residence and workplace of Afghan heads of state.","f":["Built during the reign of Abdur Rahman Khan","Constructed in the late 19th century"]},"kabul-zoo-landmarks-v2":{"i":"/poi-images/kabul-zoo-landmarks-v2.webp","s":"The country's only zoo offers locals a rare opportunity to see domestic and exotic animals.","f":["Opened in 1967.","Located on the Kabul River."]},"khost-great-mosque-landmarks-v2":{"i":"/poi-images/khost-great-mosque-landmarks-v2.webp","s":"This impressive Islamic structure is the religious center of Khost.","f":["In the center of Khost.","Very large dome."]},"minaret-of-chakari-landmarks-v2":{"i":"/poi-images/minaret-of-chakari-landmarks-v2.webp","s":"An ancient Buddhist monument standing on a mountain ridge outside Kabul.","f":["Ancient Buddhist pillar.","Served as a waymark."]},"omar-mine-museum-landmarks-v2":{"i":"/poi-images/omar-mine-museum-landmarks-v2.webp","s":"This unique museum in Kabul educates the public about the dangers of landmines.","f":["Displays defused mines.","Promotes awareness."]},"paghman-gardens-landmarks-v2":{"i":"/poi-images/paghman-gardens-landmarks-v2.webp","s":"A traditional recreation spot in the Paghman Valley near Kabul.","f":["Popular holiday destination.","Built under Amanullah Khan."]},"darunta-dam-landmarks-v2":{"i":"/poi-images/darunta-dam-landmarks-v2.webp","s":"This hydroelectric dam on the Kabul River near Jalalabad not only provides energy but also creates a picturesque reservoir.","f":["Located on the Kabul River.","Built by Soviet engineers."]},"af-bagh-e-babur-life-v2":{"i":"/poi-images/af-bagh-e-babur-life-v2.webp","s":"A historic park in Kabul that houses the tomb of the first Mughal emperor Babur and features terraced gardens.","f":["Established in the early 16th century.","Built across 15 terraces."]},"af-kol-e-hashmat-khan-life-v2":{"i":"/poi-images/af-kol-e-hashmat-khan-life-v2.w -v2":{"i":"/poi-images/af-habibullah-zazi-park-life-v2.webp","s":"A massive leisure complex on the hills in eastern Kabul, offering green spaces alongside spectacular amusement rides.","f":["One of the largest parks in the country.","Offers a sweeping view over the city."]},"af-shahr-e-naw-park-life-v2":{"i":"/poi-images/af-shahr-e-naw-park-life-v2.webp","s":"A central city park in the eponymous business district of Kabul, serving as a green meeting point for residents.","f":["Located in the heart of modern Kabul.","Popular with students and families."]},"af-melonen-balkh-life-v2":{"i":"/poi-images/af-melonen-balkh-life-v2.webp","s":"The fertile plains of Balkh produce a huge variety of sweet and juicy melons during the hot summers.","f":["Afghanistan has dozens of melon varieties.","Melons are a traditional summer meal."]},"af-baumwoll-kundus-life-v2":{"i":"/poi-images/af-baumwoll-kundus-life-v2.webp","s":"The white gold of northern Afghanistan is grown in vast fields in Kunduz province and is a cornerstone of the local economy.","f":["Kunduz is the center of cotton production.","Processed in local factories."]},"af-zitrus-dschalalabad-life-v2":{"i":"/poi-images/af-zitrus-dschalalabad-life-v2.webp","s":"Thanks to the warmer, almost subtropical climate in the east of the country, lemons, oranges, and other citrus fruits thrive here.","f":["Jalalabad is the winter capital.","Known for its sweet oranges."]},"af-kartoffeln-bamiyan-life-v2":{"i":"/poi-images/af-kartoffeln-bamiyan-life-v2.webp","s":"In the cool and high-altitude valleys of Bamyan, potatoes are grown, representing the region's most important agricultural product.","f":["Bamyan produces over half of Afghan potatoes.","The cool climate is ideal for tubers."]},"af-ab-i-istada-life-v2":{"i":"/poi-images/af-ab-i-istada-life-v2.webp","s":"A shallow, saline lake in Ghazni province that attracts thousands of waterbirds and offers a fascinating natural backdrop.","f":["The lake can shrink significantly in summer." const svg=document.getElementById('svg'),stage=document.getElementById('stage');

const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;

let pD=0,pS=1;

const pop=document.getElementById('popup');

const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');

}

// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
