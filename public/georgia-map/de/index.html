const POI_CARD={"ge-tbilisi-cities-v2":{"i":"/poi-images/ge-tbilisi-cities-v2.webp","s":"Tiflis ist die Hauptstadt und größte Stadt Georgiens, malerisch am Ufer der Kura gelegen.","f":["Gegründet im 5. Jahrhundert von Wachtang Gorgassali.","Berühmt für die historischen Schwefelbäder in Abanotubani."]},"ge-batumi-cities-v2":{"i":"/poi-images/ge-batumi-cities-v2.webp","s":"Batumi ist die zweitgrößte Stadt Georgiens und ein beliebter Badeort an der Schwarzmeerküste.","f":["Der Batumi Boulevard wurde im Jahr 1881 angelegt.","Der Botanische Garten von Batumi ist einer der größten der Welt."]},"ge-kutaisi-cities-v2":{"i":"/poi-images/ge-kutaisi-cities-v2.webp","s":"Kutaissi ist die drittgrößte Stadt in Georgien und das Zentrum der Region Imeretien.","f":["War die Hauptstadt des alten Königreichs Kolchis.","Die Bagrati-Kathedrale wurde im 11. Jahrhundert erbaut."]},"ge-rustavi-cities-v2":{"i":"/poi-images/ge-rustavi-cities-v2.webp","s":"Rustawi ist eine bedeutende Industriestadt im Südosten Georgiens am Fluss Kura.","f":["Gegründet im Jahr 1948 als Zentrum für die Metallurgie.","Die Burg von Rustawi stammt aus dem 4. Jahrhundert."]},"ge-gori-cities-v2":{"i":"/poi-images/ge-gori-cities-v2.webp","s":"Gori ist eine Stadt im Zentrum Georgiens, die vor allem als Geburtsort von Josef Stalin bekannt ist.","f":["Das Stalin-Museum zieht jährlich viele Besucher an.","Über der Stadt thront die historische Festung Gorisziche."]},"ge-zugdidi-cities-v2":{"i":"/poi-images/ge-zugdidi-cities-v2.webp","s":"Sugdidi ist die historische Hauptstadt der Region Mingrelien im Westen Georgiens.","f":["Der Dadiani-Palast beherbergt ein wichtiges historisches Museum.","Sugdidi liegt nur wenige Kilometer von Abchasien entfernt."]},"ge-poti-cities-v2":{"i":"/poi-images/ge-poti-cities-v2.webp","s":"Poti ist eine bedeutende Hafenstadt am Schwarzen Meer und ein wirtschaftlicher Knotenpunkt Georgiens.","f":["Verfügt über den größten Seehafen des Landes.","Die Kathedrale von Poti ist eine Nachbildung der Hagia Sophia."]},"ge-sokhumi-cities-v2":{"i":"/poi-images/ge-sokhumi-cities-v2.webp","s":"Sochumi ist die Hauptstadt der abtrünnigen Region Abchasien und war einst ein blühender Kurort am Schwarzen Meer.","f":["Der botanische Garten von Sochumi wurde 1840 gegründet.","Viele der historischen Kurhotels stehen heute leer."]},"ge-khashuri-cities-v2":{"i":"/poi-images/ge-khashuri-cities-v2.webp","s":"Chaschuri ist eine wichtige Verkehrsachse im zentralen Georgien, wo sich Eisenbahn- und Straßennetze kreuzen.","f":["Wurde 1872 mit dem Bau der Eisenbahnlinie bedeutend.","Das historische Surami-Schloss liegt in der Nähe der Stadt."]},"ge-samtredia-cities-v2":{"i":"/poi-images/ge-samtredia-cities-v2.webp","s":"Samtredia ist eine lebhafte Stadt in der Imeretien-Ebene, bekannt für ihre Bedeutung als Eisenbahnknotenpunkt.","f":["Erhielt im Jahr 1921 offiziell das Stadtrecht.","Der Fluss Rioni fließt unweit des Stadtzentrums vorbei."]},"ge-senaki-cities-v2":{"i":"/poi-images/ge-senaki-cities-v2.webp","s":"Senaki ist eine bedeutende Stadt in der Region Mingrelien und ein wichtiger militärischer Stützpunkt.","f":["Zwischen 1933 und 1989 hieß die Stadt Micha Zchakaia.","Das Senaki-Theater wurde im neoklassizistischen Stil erbaut."]},"ge-zestafoni-cities-v2":{"i":"/poi-images/ge-zestafoni-cities-v2.webp","s":"Sestaponi ist eine Industriestadt in Imeretien, deren Wirtschaft eng mit der Verarbeitung von Manganerz verbunden ist.","f":["Das hiesige Ferrolegierungswerk ist das größte des Landes.","Sestaponi ist auch für seine hervorragenden Weinbaugebiete bekannt."]},"ge-marneuli-cities-v2":{"i":"/poi-images/ge-marneuli-cities-v2.webp","s":"Marneuli ist das administrative Zentrum einer multikulturellen Region in Niederkartlien, mit einer mehrheitlich aserbaidschanischen Bevölkerung.","f":["Die Stadt ist ein Zentrum des landwirtschaftlichen Handels.","In Marneuli wird jedes Jahr das Nourus-Fest groß gefeiert."]},"ge-telavi-cities-v2":{"i":"/poi-images/ge-telavi-cities-v2.webp","s":"Telawi ist das historische und administrative Zentrum der Weinbauregion Kachetien.","f":["Die Festung Batonis Ziche war die Residenz kachetischer Könige.","Ein 900 Jahre alter Platanenbaum steht im Zentrum von Telawi."]},"ge-akhaltsikhe-cities-v2":{"i":"/poi-images/ge-akhaltsikhe-cities-v2.webp","s":"Achalziche ist eine multikulturelle Stadt im Süden Georgiens, geprägt von georgischen, armenischen und osmanischen Einflüssen.","f":["Die restaurierte Rabati-Festung ist ein riesiger historischer Komplex.","Die Stadt war über 200 Jahre unter osmanischer Herrschaft."]},"ge-kobuleti-cities-v2":{"i":"/poi-images/ge-kobuleti-cities-v2.webp","s":"Kobuleti ist ein beliebter Badeort in Adscharien mit einem kilometerlangen Kiesstrand.","f":["Die Küstenpromenade gehört zu den längsten im Kaukasus.","In der Sowjetzeit war Kobuleti ein renommierter Kurort."]},"ge-ozurgeti-cities-v2":{"i":"/poi-images/ge-ozurgeti-cities-v2.webp","s":"Osurgeti ist das Zentrum der Region Gurien und liegt umgeben von malerischen Teeplantagen und Haselnusshainen.","f":["Gurien war einst das Zentrum des georgischen Teeanbaus.","Das historische Dramentheater dominiert das Stadtzentrum."]},"ge-tskhaltubo-cities-v2":{"i":"/poi-images/ge-tskhaltubo-cities-v2.webp","s":"Zqaltubo ist ein ehemals weltberühmter Kurort, der für seine radonhaltigen Mineralquellen geschätzt wird.","f":["Stalin selbst besuchte regelmäßig die Bäder in Zqaltubo.","Viele Sanatorien werden heute schrittweise restauriert."]},"ge-kaspi-cities-v2":{"i":"/poi-images/ge-kaspi-cities-v2.webp","s":"Kaspi ist eine historische Kleinstadt in der Region Innerkartlien, die eine wichtige Rolle bei der Herstellung von Zement spielt.","f":["Das Zementwerk in Kaspi ist eines der größten Georgiens.","Nahe Kaspi liegt die alte Höhlenstadt Uplisziche."]},"ge-tkibuli-cities-v2":{"i":"/poi-images/ge-tkibuli-cities-v2.webp","s":"Tqibuli ist eine Bergbaustadt im Westen Georgiens, umgeben von dichten Wäldern und steilen Bergen.","f":["Die Kohleförderung begann hier in der Mitte des 19. Jahrhunderts.","Die Architektur im Zentrum erinnert stark an die Sowjetzeit."]},"ge-chiatura-cities-v2":{"i":"/poi-images/ge-chiatura-cities-v2.webp","s":"Tschiatura ist eine einzigartige Bergstadt, die berühmt für ihr ausgedehntes Netzwerk an sowjetischen Seilbahnen ist.","f":["Wurde als Zentrum der Manganindustrie gegründet.","Einige der historischen Seilbahnen wurden kürzlich modernisiert."]},"ge-sagarejo-cities-v2":{"i":"/poi-images/ge-sagarejo-cities-v2.webp","s":"Sagaredscho ist das Eingangstor zur Weinregion Kachetien und eine Stadt mit landwirtschaftlicher Prägung.","f":["Das Kloster Dawit Garedscha liegt südlich der Stadt.","Weinbau ist die Haupteinnahmequelle der lokalen Bevölkerung."]},"ge-gardabani-cities-v2":{"i":"/poi-images/ge-gardabani-cities-v2.webp","s":"Gardabani ist eine Industriestadt nahe der aserbaidschanischen Grenze, in der ein wichtiges Wärmekraftwerk betrieben wird.","f":["Das Kraftwerk Gardabani versorgt große Teile Georgiens mit Strom.","In der Gegend gibt es historische Höhlensiedlungen."]},"ge-borjomi-cities-v2":{"i":"/poi-images/ge-borjomi-cities-v2.webp","s":"Bordschomi ist ein malerischer Kurort, der weltweit für sein salziges und heilendes Mineralwasser bekannt ist.","f":["Das Wasser von Bordschomi wird in über 40 Länder exportiert.","Die Romanow-Zarendynastie verbrachte hier gerne ihre Sommer."]},"ge-tqvarcheli-cities-v2":{"i":"/poi-images/ge-tqvarcheli-cities-v2.webp","s":"Tqwartscheli ist eine von Bergen umschlossene Stadt in Abchasien, die für ihren Kohlebergbau bekannt war.","f":["Die Architektur zeichnet sich durch klassizistische stalinistische Gebäude aus.","Die Stadt wurde 1942 offiziell gegründet."]},"ge-khoni-cities-v2":{"i":"/poi-images/ge-khoni-cities-v2.webp","s":"Choni ist eine Kleinstadt im westgeorgischen Tiefland, die sich durch ihre traditionelle Seidenproduktion und landwirtschaftliche Erzeugnisse auszeichnet.","f":["Nahe Choni liegt der berühmte Okatse-Canyon.","Die Kirche im Stadtzentrum hat eine reiche historische Bedeutung."]},"ge-bolnisi-cities-v2":{"i":"/poi-images/ge-bolnisi-cities-v2.webp","s":"Bolnissi ist eine Stadt in Niederkartlien, die von deutschen Siedlern im 19.","f":["Die Sioni-Kirche von Bolnissi stammt aus dem 5. Jahrhundert.","Das lokale Museum beleuchtet die deutsch-georgische Geschichte."]},"ge-akhalkalaki-cities-v2":{"i":"/poi-images/ge-akhalkalaki-cities-v2.webp","s":"Achalkalaki liegt im Javakheti-Plateau nahe der armenischen Grenze und hat eine überwiegend armenische Bevölkerung.","f":["Die Festung von Achalkalaki stammt aus dem 11. Jahrhundert.","Die Region ist bekannt für ihre hervorragenden Kartoffeln."]},"ge-gurjaani-cities-v2":{"s":"Gurdschaani ist ein lebhaftes Weinbauzentrum in der Region Kachetien, umgeben von endlosen Weinbergen.","f":["Die Kvelatsminda-Kirche ist einzigartig mit ihren zwei Kuppeln.","In der Stadt werden berühmte georgische Weinsorten produziert."]},"ge-mtskheta-cities-v2":{"i":"/poi-images/ge-mtskheta-cities-v2.webp","s":"Mzcheta ist eine der ältesten Städte Georgiens und die ehemalige Hauptstadt des iberischen Königreichs.","f":["Die Swetizchoweli-Kathedrale ist UNESCO-Weltkulturerbe.","Das Dschwari-Kloster thront majestätisch über der Stadt."]},"batumi-sea-port-economic-v2":{"i":"/poi-images/batumi-sea-port-economic-v2.webp","s":"Der Seehafen Batumi ist einer der wichtigsten Häfen Georgiens am Schwarzen Meer und dient als zentraler Knotenpunkt für den Transit von Öl und Fracht.","f":["Wichtiger Transitpunkt für kaspisches Öl.","Einer der ältesten Häfen der Region."]},"poti-sea-port-economic-v2":{"i":"/poi-images/poti-sea-port-economic-v2.webp","s":"Der Seehafen Poti ist ein wichtiger Verkehrsknotenpunkt und der größte Hafen Georgiens für Container- und Massenguttransporte.","f":["Spielt eine Schlüsselrolle im eurasischen Transportkorridor TRACECA.","Haupttor für den georgischen Seehandel."]},"chiatura-manganese-mine-economic-v2":{"i":"/poi-images/chiatura-manganese-mine-economic-v2.webp","s":"Das Manganbergwerk Tschiatura ist eine der weltweit größten Lagerstätten für Manganerz und seit über einem Jahrhundert in Betrieb.","f":["Die Stadt ist bekannt für ihr Netzwerk alter Seilbahnen.","Liefert Rohstoffe für die georgische Schwerindustrie."]},"rustavi-metallurgical-plant-economic-v2":{"i":"/poi-images/rustavi-metallurgical-plant-economic-v2.webp","s":"Das Metallurgische Werk in Rustawi ist das größte Zentrum der Schwerindustrie in Georgien, spezialisiert auf Stahl- und Eisenproduktion.","f":["Die Stadt Rustawi wurde rund um dieses Werk aufgebaut.","Ein bedeutender Exporteur von Stahlprodukten in der Region."]},"zestafoni-ferroalloy-plant-economic-v2":{"i":"/poi-images/zestafoni-ferroalloy-plant-economic-v2.webp","s":"Das Werk in Sestaponi verarbeitet Manganerz aus Tschiatura und ist einer der größten Produzenten von Silikomangan auf der Welt.","f":["Silikomangan ist ein wichtiger Bestandteil der Stahlproduktion.","Das Werk ist ein Hauptarbeitgeber in der Region Imeretien."]},"kulevi-oil-terminal-economic-v2":{"i":"/poi-images/kulevi-oil-terminal-economic-v2.webp","s":"Der Ölterminal Kulewi ist eine bedeutende Anlage für die Verladung von kaspischem Erdöl auf Tankschiffe im Schwarzen Meer.","f":["Der Terminal wurde im Jahr 2008 eröffnet.","Verfügt über moderne Lagertanks mit großer Kapazität."]},"supsa-sea-terminal-economic-v2":{"i":"/poi-images/supsa-sea-terminal-economic-v2.webp","s":"Der Terminal Supsa ist der Endpunkt der Baku-Supsa-Ölpipeline, wo Erdöl aus Aserbaidschan in Schiffe verladen wird.","f":["Die Anlage nutzt Offshore-Boje-Systeme zur Verladung.","Spielt eine wichtige Rolle in der kaukasischen Energieinfrastruktur."]},"tkibuli-coal-mine-economic-v2":{"i":"/poi-images/tkibuli-coal-mine-economic-v2.webp","s":"Tqibuli ist das Zentrum des georgischen Kohlebergbaus, wo Steinkohle hauptsächlich für den Inlandsbedarf abgebaut wird.","f":["Der Kohleabbau begann hier in der Mitte des 19. Jahrhunderts.","Bietet Kohle für lokale Zement- und Wärmekraftwerke."]},"madneuli-mine-economic-v2":{"i":"/poi-images/madneuli-mine-economic-v2.webp","s":"Die Madneuli-Mine in der Nähe von Kasreti ist die wichtigste Quelle für Kupfer und Gold in Georgien und wird im Tagebau betrieben.","f":["Die gewonnenen Metalle sind wichtige georgische Exportgüter.","Der Tagebau hat die Landschaft stark verändert."]},"poti-fiz-economic-v2":{"i":"/poi-images/poti-fiz-economic-v2.webp","s":"Die Freie Industriezone Poti bietet Steuervergünstigungen und zieht internationale Unternehmen im produzierenden Gewerbe an.","f":["Die erste freie Industriezone, die im Kaukasus gegründet wurde.","Direkt an den Seehafen und das Eisenbahnnetz angebunden."]},"kutaisi-fiz-economic-v2":{"i":"/poi-images/kutaisi-fiz-economic-v2.webp","s":"Diese Industriezone in Kutaissi fördert lokale und ausländische Investitionen in Technologie, Textilien und Haushaltsgeräte.","f":["Errichtet auf dem Gelände eines ehemaligen Automobilwerks.","Beheimatet Unternehmen aus verschiedenen Branchen."]},"zhinvali-hpp-economic-v2":{"i":"/poi-images/zhinvali-hpp-economic-v2.webp","s":"Der Schinwali-Staudamm staut den Aragwi-Fluss und produziert saubere Wasserkraftenergie für die georgische Hauptstadt Tiflis.","f":["Der Stausee versorgt Tiflis zudem mit Trinkwasser.","Die Anlage wurde in den 1980er Jahren fertiggestellt."]},"gardabani-tpp-economic-v2":{"i":"/poi-images/gardabani-tpp-economic-v2.webp","s":"Das kombinierte Gas- und Dampfturbinenkraftwerk in Gardabani stellt die Energiesicherheit Georgiens, insbesondere im Winter, sicher.","f":["Es ist eines der modernsten Kraftwerke der Region.","Reduziert die Abhängigkeit von importiertem Strom."]},"larsi-border-crossing-economic-v2":{"i":"/poi-images/larsi-border-crossing-economic-v2.webp","s":"Der Grenzübergang Larsi in der Darialschlucht ist der wichtigste Landweg für den Handel zwischen Georgien und Russland.","f":["Der einzige offiziell geöffnete Grenzübergang zu Russland.","Oft durch starken Schneefall im Winter blockiert."]},"sarpi-border-crossing-economic-v2":{"i":"/poi-images/sarpi-border-crossing-economic-v2.webp","s":"Sarpi ist ein stark frequentierter Grenzübergang an der Schwarzmeerküste und spielt eine zentrale Rolle im Handel mit der Türkei.","f":["Das georgische Zollgebäude hat eine einzigartige, moderne Architektur.","Einer der verkehrsreichsten Knotenpunkte des Landes."]},"lilo-city-market-economic-v2":{"i":"/poi-images/lilo-city-market-economic-v2.webp","s":"Der Lilo-Markt am Stadtrand von Tiflis ist der größte Groß- und Einzelhandelsmarkt in Transkaukasien für Konsumgüter.","f":["Hier kaufen Händler aus dem gesamten Kaukasus ein.","Ein bedeutender Motor für den informellen und formellen Handel."]},"borjomi-bottling-plant-economic-v2":{"i":"/poi-images/borjomi-bottling-plant-economic-v2.webp","s":"In den Fabriken von Bordschomi wird das berühmte vulkanische Mineralwasser abgefüllt und in dutzende Länder weltweit exportiert.","f":["Bordschomi-Wasser ist einer der wichtigsten Exportartikel Georgiens.","Die industrielle Abfüllung begann bereits im Jahr 1890."]},"batumi-oil-terminal-economic-v2":{"i":"/poi-images/batumi-oil-terminal-economic-v2.webp","s":"Der Ölterminal in Batumi verarbeitet und lagert Erdölprodukte aus Zentralasien und dem Kaukasus für den internationalen Seetransport.","f":["Die Anlage verfügt über direkte Eisenbahnverbindungen.","Ein historisches Zentrum der globalen Ölindustrie seit Ende des 19. Jahrhunderts."]},"kaspi-cement-plant-economic-v2":{"i":"/poi-images/kaspi-cement-plant-economic-v2.webp","s":"Das Zementwerk in Kaspi ist ein Pfeiler der georgischen Baustoffindustrie und versorgt wichtige Infrastrukturprojekte des Landes.","f":["Die Kalksteinvorkommen der Region bieten ideale Rohstoffe.","Moderne Filteranlagen reduzieren heute die Emissionen."]},"samgori-oil-field-economic-v2":{"i":"/poi-images/samgori-oil-field-economic-v2.webp","s":"Das Ölfeld Samgori nahe Tiflis ist die größte inländische Quelle für die Erdölförderung in Georgien.","f":["Die Entdeckung des Feldes im 20. Jahrhundert verringerte die Energieimporte.","Die Fördermengen sind heute geringer als in der Vergangenheit."]},"ge-narikala-history-v2":{"i":"/poi-images/ge-narikala-history-v2.webp","s":"Narikala ist eine antike Festung, die über der Hauptstadt Tiflis thront und die Stadt seit dem 4.","f":["Gegründet im 4. Jahrhundert als persische Zitadelle.","Ein Erdbeben zerstörte große Teile der Anlage im Jahr 1827."]},"ge-svetitskhoveli-history-v2":{"i":"/poi-images/ge-svetitskhoveli-history-v2.webp","s":"Die majestätische Swetizchoweli-Kathedrale in Mzcheta ist ein Meisterwerk der frühmittelalterlichen georgischen Architektur und ein UNESCO-Welterbe.","f":["Erbaut im 11. Jahrhundert unter dem Architekten Arsukisdze.","Traditionelle Krönungs- und Grabstätte der georgischen Könige."]},"ge-uplistsikhe-history-v2":{"i":"/poi-images/ge-uplistsikhe-history-v2.webp","s":"Uplisziche ist eine beeindruckende, in Fels gehauene antike Höhlenstadt in Ostgeorgien.","f":["Zählt zu den ältesten städtischen Siedlungen in Georgien.","Mischung aus heidnischer und christlicher Höhlenarchitektur."]},"ge-vardzia-history-v2":{"i":"/poi-images/ge-vardzia-history-v2.webp","s":"Die Höhlenstadt Wardsia ist ein spektakuläres Klosterkomplex, das im 12.","f":["Ursprünglich besaß die Stadt bis zu dreizehn Stockwerke.","1283 riss ein Erdbeben die Außenwand ab und legte das Kloster frei."]},"ge-gelati-history-v2":{"i":"/poi-images/ge-gelati-history-v2.webp","s":"Das Kloster Gelati nahe Kutaissi war eines der ersten kulturellen und geistigen Zentren Georgiens.","f":["UNESCO-Welterbe mit hervorragenden Mosaiken und Fresken.","König David der Erbauer liegt im Eingangstor des Klosters begraben."]},"ge-bagrati-history-v2":{"i":"/poi-images/ge-bagrati-history-v2.webp","s":"Die Bagrati-Kathedrale in Kutaissi thront majestätisch auf dem Ukimerioni-Hügel.","f":["Benannt nach König Bagrat III., dem ersten König des vereinten Georgiens.","1692 durch osmanische Truppen schwer beschädigt und im 20. Jahrhundert restauriert."]},"ge-gergeti-history-v2":{"i":"/poi-images/ge-gergeti-history-v2.webp","s":"Die Gergetier Dreifaltigkeitskirche liegt atemberaubend auf über 2.100 Metern Höhe vor dem massiven Berg Kasbek.","f":["Während Invasionszeiten wurden hier wertvolle Reliquien aus Mzcheta versteckt.","Erreichbar über eine steile Bergstraße oder eine malerische Wanderung."]},"ge-dadiani-history-v2":{"i":"/poi-images/ge-dadiani-history-v2.webp","s":"Der Dadiani-Palast in Sugdidi war die Residenz der adeligen Familie Dadiani, die das historische Mingrelien beherrschte.","f":["Der botanische Garten des Palastes wurde im 19. Jahrhundert angelegt.","Eine Nachfahrin der Familie heiratete Napoleons Neffen, was europäische Reliquien nach Georgien brachte."]},"ge-mutso-history-v2":{"i":"/poi-images/ge-mutso-history-v2.webp","s":"Die faszinierenden Ruinen von Muzo kleben förmlich an einem steilen Felsgrat in der abgelegenen Bergregion Chewsuretien.","f":["Gilt als eines der eindrucksvollsten Architekturdenkmäler des mittelalterlichen Georgiens.","Wurde im Rahmen eines umfangreichen Projekts kürzlich restauriert."]},"ge-gremi-history-v2":{"i":"/poi-images/ge-gremi-history-v2.webp","s":"Gremi war im 16.","f":["Wurde 1565 von König Lewan von Kachetien erbaut.","Die Stadt wurde 1615 von den Truppen des Schah Abbas I. dem Erdboden gleichgemacht."]},"ge-jvari-history-v2":{"i":"/poi-images/ge-jvari-history-v2.webp","s":"Das Dschwari-Kloster aus dem 6.","f":["Der Name Dschwari bedeutet auf Georgisch wörtlich 'Kreuz'.","Gehört zusammen mit Mzcheta zum UNESCO-Weltkulturerbe."]},"ge-rabati-history-v2":{"i":"/poi-images/ge-rabati-history-v2.webp","s":"Die Festung Rabati in Achalziche ist ein beeindruckender multikultureller Komplex.","f":["Gegründet im 9. Jahrhundert unter dem Namen Lomisa.","Wurde 2012 umfassend und aufwendig restauriert."]},"ge-khertvisi-history-v2":{"i":"/poi-images/ge-khertvisi-history-v2.webp","s":"Die Festung Chertwissi, eine der ältesten Festungen Georgiens, liegt dramatisch an der Mündung zweier tiefer Flussschluchten.","f":["Erbaut auf einer strategisch perfekten, felsigen Landzunge im 2. Jahrhundert v. Chr.","Der Legende nach soll Alexander der Große den Ort belagert haben."]},"ge-david-gareja-history-v2":{"i":"/poi-images/ge-david-gareja-history-v2.webp","s":"Das Felsenkloster Dawit Garedscha liegt in einer halbwüstenartigen Landschaft an der Grenze zu Aserbaidschan.","f":["Der Komplex besteht aus hunderten von Höhlen, Kapellen und Wohnräumen.","Es war über Jahrhunderte ein blühendes Zentrum klösterlichen Lebens."]},"ge-gonio-history-v2":{"i":"/poi-images/ge-gonio-history-v2.webp","s":"Die Festung Gonio an der Schwarzmeerküste ist eine der ältesten erhaltenen römischen Befestigungsanlagen im Kaukasus.","f":["Wurde erstmals von Plinius dem Älteren im 1. Jahrhundert erwähnt.","Der Apostel Matthias soll angeblich innerhalb der Festungsmauern begraben sein."]},"ge-shatili-history-v2":{"i":"/poi-images/ge-shatili-history-v2.webp","s":"Das geheimnisvolle Festungsdorf Schatili im tiefen Kaukasus-Gebirge ist ein Labyrinth aus eng verbundenen Wohntürmen.","f":["Entstand zwischen dem 7. und dem 13. Jahrhundert in extremer Isolation.","Gehört zu den herausragendsten Beispielen georgischer Volksarchitektur."]},"ge-ananuri-history-v2":{"i":"/poi-images/ge-ananuri-history-v2.webp","s":"Die wehrhafte Festung Ananuri thront malerisch über dem Zhinwali-Stausee.","f":["Der Komplex umfasst zwei Kirchen mit feinen Steinmetzarbeiten an den Fassaden.","Trotz vieler Zerstörungen sind die Zinnen und Wehrtürme exzellent erhalten."]},"ge-didgori-history-v2":{"i":"/poi-images/ge-didgori-history-v2.webp","s":"Das Didgori-Denkmal markiert das historische Schlachtfeld, auf dem König David der Erbauer im Jahr 1121 einen unerwarteten und überwältigenden Sieg über das riesige seldschukische Heer errang.","f":["Dieser Sieg läutete das Goldene Zeitalter Georgiens ein.","Jedes Jahr am 12. August wird der Tag der Schlacht als Nationalfeiertag gefeiert."]},"ge-kartlis-deda-history-v2":{"i":"/poi-images/ge-kartlis-deda-history-v2.webp","s":"Die monumentale Statue 'Kartlis Deda' wacht seit 1958 über Tiflis.","f":["Das aus Aluminium gefertigte Monument ist 20 Meter hoch.","Errichtet zur Feier des 1.500-jährigen Bestehens von Tiflis."]},"ge-alaverdi-history-v2":{"i":"/poi-images/ge-alaverdi-history-v2.webp","s":"Die imposante Alawerdi-Kathedrale im Herzen des fruchtbaren Alasani-Tals war bis ins 21.","f":["Die Kathedrale aus dem 11. Jahrhundert erreicht eine Höhe von über 50 Metern.","Das Kloster produziert Wein in traditionellen Amphoren (Qvevri), eine Technik mit UNESCO-Status."]},"bridge-of-peace-landmarks-v2":{"i":"/poi-images/bridge-of-peace-landmarks-v2.webp","s":"Die Friedensbrücke in Tiflis ist eine markante, bogenförmige Fußgängerbrücke aus Glas und Stahl über den Fluss Kura, die die Altstadt mit dem Rike-Park verbindet.","f":["Wurde vom Architekten Michele De Lucchi entworfen.","Die Brücke ist 150 Meter lang und wurde 2010 eröffnet."]},"abanotubani-landmarks-v2":{"i":"/poi-images/abanotubani-landmarks-v2.webp","s":"Das historische Bäderviertel Abanotubani in Tiflis ist berühmt für seine traditionellen, kuppelförmigen Badehäuser, die von natürlichen heißen Schwefelquellen gespeist werden.","f":["Die Bäder werden von heißen Schwefelquellen gespeist.","Berühmte Besucher waren Alexander Puschkin und Alexandre Dumas."]},"chronicle-of-georgia-landmarks-v2":{"i":"/poi-images/chronicle-of-georgia-landmarks-v2.webp","s":"Das gewaltige Monument Chronik von Georgien thront auf einem Hügel nahe dem Tiflisser Meer und zeigt auf riesigen Säulen Szenen aus der georgischen Geschichte und Religion.","f":["Das Monument wurde 1985 vom Künstler Surab Zereteli geschaffen.","Die beeindruckenden Säulen sind über 30 Meter hoch."]},"gabriadze-theater-landmarks-v2":{"i":"/poi-images/gabriadze-theater-landmarks-v2.webp","s":"Das malerische Marionettentheater von Rezo Gabriadze in der Altstadt von Tiflis ist berühmt für seinen schiefen Uhrturm, aus dem zu jeder vollen Stunde ein Engel erscheint.","f":["Das Theater wurde 1981 von Rezo Gabriadze gegründet.","Der markante schiefe Uhrturm wurde 2010 hinzugefügt."]},"tbilisi-tv-tower-landmarks-v2":{"i":"/poi-images/tbilisi-tv-tower-landmarks-v2.webp","s":"Der Tiflisser Fernsehturm auf dem Berg Mtazminda ist ein Wahrzeichen der Stadt und nachts durch seine farbenfrohe Beleuchtung von fast überall in der Hauptstadt sichtbar.","f":["Der Turm erreicht eine Höhe von 274 Metern.","Er wurde 1972 anstelle eines älteren Sendeturms errichtet."]},"ali-and-nino-statue-landmarks-v2":{"i":"/poi-images/ali-and-nino-statue-landmarks-v2.webp","s":"Die kinetische Skulptur von Ali und Nino in Batumi symbolisiert eine tragische Liebesgeschichte.","f":["Die kinetische Skulptur ist 8 Meter hoch.","Sie wurde von der Künstlerin Tamara Kvesitadze entworfen."]},"alphabet-tower-landmarks-v2":{"i":"/poi-images/alphabet-tower-landmarks-v2.webp","s":"Der 130 Meter hohe Alphabet-Turm in Batumi feiert die Einzigartigkeit der georgischen Schrift.","f":["Der Turm ist 130 Meter hoch und wurde 2011 fertiggestellt.","Er feiert das georgische Alphabet mit seinen 33 Buchstaben."]},"batumi-botanical-garden-landmarks-v2":{"i":"/poi-images/batumi-botanical-garden-landmarks-v2.webp","s":"Der am Grünen Kap gelegene Botanische Garten von Batumi ist einer der größten und artenreichsten der Welt.","f":["Der Garten wurde 1912 offiziell eröffnet.","Er erstreckt sich über eine Fläche von 108 Hektar."]},"batumi-boulevard-landmarks-v2":{"i":"/poi-images/batumi-boulevard-landmarks-v2.webp","s":"Der historische Batumi Boulevard erstreckt sich über mehrere Kilometer entlang der Küste und lockt mit Palmen, tanzenden Springbrunnen und zahlreichen Cafés.","f":["Die Anlage des Boulevards begann im Jahr 1881.","Die Promenade erstreckt sich über eine Länge von etwa 7 Kilometern."]},"katskhi-pillar-landmarks-v2":{"i":"/poi-images/katskhi-pillar-landmarks-v2.webp","s":"Die Katschi-Säule ist ein 40 Meter hoher natürlicher Kalksteinmonolith in Imeretien.","f":["Der Kalksteinmonolith ist etwa 40 Meter hoch.","Die kleine Kirche auf dem Gipfel stammt aus dem 9. oder 10. Jahrhundert."]},"prometheus-cave-landmarks-v2":{"i":"/poi-images/prometheus-cave-landmarks-v2.webp","s":"Die Prometheus-Höhle nahe Kutaissi ist eines der faszinierendsten Naturwunder Georgiens.","f":["Die Tropfsteinhöhle wurde 1984 von Höhlenforschern entdeckt.","Für Besucher ist ein 1,4 Kilometer langer Weg ausgebaut."]},"martvili-canyon-landmarks-v2":{"i":"/poi-images/martvili-canyon-landmarks-v2.webp","s":"Die Martwili-Schlucht besticht durch ihr smaragdgrünes Wasser und beeindruckende Wasserfälle.","f":["Die Schlucht ist bis zu 40 Meter tief.","Besucher können mit Booten einen Teil des Flusses befahren."]},"okatse-canyon-landmarks-v2":{"i":"/poi-images/okatse-canyon-landmarks-v2.webp","s":"Die Okatse-Schlucht bietet ein unvergessliches Erlebnis dank eines spektakulären Hängepfads, der hoch über dem Boden an der Klippenwand befestigt ist und unglaubliche Ausblicke bietet.","f":["Der hängende Fußgängerweg ist 780 Meter lang.","Die Schlucht selbst ist an einigen Stellen über 50 Meter tief."]},"sataplia-cave-landmarks-v2":{"i":"/poi-images/sataplia-cave-landmarks-v2.webp","s":"Das Sataplia-Naturschutzgebiet ist berühmt für seine gut erhaltenen Dinosaurierspuren und eine wunderschöne Karsthöhle.","f":["Das Reservat wurde 1935 zum Schutz der Höhle gegründet.","Es schützt versteinerte Dinosaurierspuren."]},"svaneti-towers-mestia-landmarks-v2":{"i":"/poi-images/svaneti-towers-mestia-landmarks-v2.webp","s":"Die mittelalterlichen Wehrtürme in der Gebirgsregion Swanetien prägen das unverwechselbare Landschaftsbild von Mestia.","f":["Die meisten Türme wurden zwischen dem 9. und 12. Jahrhundert erbaut.","Die Region gehört seit 1996 zum UNESCO-Welterbe."]},"enguri-dam-landmarks-v2":{"i":"/poi-images/enguri-dam-landmarks-v2.webp","s":"Die Enguri-Staumauer ist mit 271,5 Metern eine der höchsten Bogenstaumauern der Welt.","f":["Die Bogenstaumauer erreicht eine Höhe von 271,5 Metern.","Ihre Konstruktion wurde 1987 vollständig abgeschlossen."]},"dashbashi-canyon-landmarks-v2":{"i":"/poi-images/dashbashi-canyon-landmarks-v2.webp","s":"Die malerische Daschbaschi-Schlucht zieht Besucher mit ihren zahlreichen kaskadenartigen Wasserfällen an.","f":["Die gläserne Diamantbrücke ist 240 Meter lang.","Die Brücke wurde im Jahr 2022 für die Öffentlichkeit freigegeben."]},"sighnaghi-city-wall-landmarks-v2":{"i":"/poi-images/sighnaghi-city-wall-landmarks-v2.webp","s":"Die beeindruckende Stadtmauer von Sighnaghi erstreckt sich über vier Kilometer um die malerische Stadt.","f":["Die Festungsmauer hat eine Gesamtlänge von 4,5 Kilometern.","Sie ist mit 28 Wachtürmen ausgestattet."]},"makhuntseti-waterfall-landmarks-v2":{"i":"/poi-images/makhuntseti-waterfall-landmarks-v2.webp","s":"Der Machunzeti-Wasserfall in der Region Adscharien ist ein beliebtes Ausflugsziel.","f":["Das Wasser stürzt aus einer Höhe von 33,5 Metern herab.","Ganz in der Nähe befindet sich die historische Königin-Tamar-Brücke."]},"gveleti-waterfall-landmarks-v2":{"i":"/poi-images/gveleti-waterfall-landmarks-v2.webp","s":"Versteckt in der rauen Berglandschaft von Stepantsminda liegt der Gweleti-Wasserfall.","f":["Der Name Gweleti bedeutet übersetzt Ort der Schlangen.","Es gibt zwei Hauptwasserfälle in diesem Gebiet."]},"ge-mtirala-national-park-life-v2":{"i":"/poi-images/ge-mtirala-national-park-life-v2.webp","s":"Dieser Nationalpark in Adscharien verdankt seinen Namen dem regenreichen Mikroklima.","f":["Der Name bedeutet weinend.","Hohe jährliche Niederschlagsmenge."]},"ge-vashlovani-national-park-life-v2":{"i":"/poi-images/ge-vashlovani-national-park-life-v2.webp","s":"Der Nationalpark im Osten Georgiens bietet eine savannenartige Landschaft mit bizarren Felsformationen und Schlammvulkanen.","f":["Bekannt für Halbwüstenlandschaften.","Beherbergt Leoparden und Streifenhyänen."]},"ge-lagodekhi-reserve-life-v2":{"i":"/poi-images/ge-lagodekhi-reserve-life-v2.webp","s":"Eines der ältesten Naturschutzgebiete des Kaukasus besticht durch urwaldartige Wälder und spektakuläre Wasserfälle.","f":["Gegründet im Jahr 1912.","Grenzt an Aserbaidschan und Russland."]},"ge-tusheti-national-park-life-v2":{"i":"/poi-images/ge-tusheti-national-park-life-v2.webp","s":"Die entlegene Bergregion Tuschetien ist nur in den Sommermonaten erreichbar und bewahrt eine unberührte Naturkulisse.","f":["Liegt auf über 2000 Metern Höhe.","Zugang über den gefährlichen Abano-Pass."]},"ge-kolkheti-national-park-life-v2":{"i":"/poi-images/ge-kolkheti-national-park-life-v2.webp","s":"Die weitläufigen Feuchtgebiete und Sumpfwälder an der Schwarzmeerküste sind ein globales Refugium für Zugvögel.","f":["Wichtiges Überwinterungsgebiet für Vögel.","Umfasst den Paliastomi-See."]},"ge-javakheti-reserve-life-v2":{"i":"/poi-images/ge-javakheti-reserve-life-v2.webp","s":"Die vulkanische Hochebene im Süden Georgiens zeichnet sich durch zahlreiche Seen und eine raue, baumlose Landschaft aus.","f":["Liegt auf einem vulkanischen Plateau.","Heimat vieler endemischer Vogelarten."]},"ge-kintrishi-reserve-life-v2":{"i":"/poi-images/ge-kintrishi-reserve-life-v2.webp","s":"Versteckt in den Bergen von Adscharien, schützt dieses Reservat unberührte Reliktwälder und tiefe Flusstäler.","f":["Sehr feuchtes subtropisches Klima.","Beherbergt seltene kaukasische Salamander."]},"ge-algeti-national-park-life-v2":{"i":"/poi-images/ge-algeti-national-park-life-v2.webp","s":"Das Gebiet im bewaldeten Tal des Flusses Algeti bietet eine reizvolle Kombination aus Natur und historischen Monumenten.","f":["Schützt dichte Fichten- und Tannenwälder.","Reich an archäologischen Fundstätten."]},"ge-machakhela-national-park-life-v2":{"i":"/poi-images/ge-machakhela-national-park-life-v2.webp","s":"Dieses naturnahe Gebiet nahe der türkischen Grenze bewahrt einzigartige Bergwälder und traditionelle Kulturlandschaften.","f":["Grenzt direkt an die Türkei.","Bekannt für alte Festungsruinen."]},"ge-tbilisi-botanical-garden-life-v2":{"i":"/poi-images/ge-tbilisi-botanical-garden-life-v2.webp","s":"Eingebettet in eine tiefe Schlucht hinter der Narikala-Festung, ist diese grüne Oase seit Jahrhunderten ein Rückzugsort.","f":["Gegründet im Jahr 1845.","Einst ein königlicher Palastgarten."]},"ge-rike-park-life-v2":{"i":"/poi-images/ge-rike-park-life-v2.webp","s":"Dieser moderne Stadtpark am Ufer des Kura-Flusses in Tiflis besticht durch sein futuristisches Design.","f":["Futuristische Konzerthalle im Park.","Startpunkt der Seilbahn zur Narikala-Festung."]},"ge-vake-park-life-v2":{"i":"/poi-images/ge-vake-park-life-v2.webp","s":"Als größter öffentlicher Park in Tiflis ist der Vake-Park ein beliebtes Erholungsziel mit breiten Alleen, Springbrunnen und Gedenkstätten.","f":["Eröffnet im Jahr 1946.","Riesige Statue des Sieges im Zweiten Weltkrieg."]},"ge-mtatsminda-park-life-v2":{"i":"/poi-images/ge-mtatsminda-park-life-v2.webp","s":"Hoch über Tiflis gelegen, bietet dieser historische Vergnügungspark Fahrgeschäfte für alle Altersgruppen und einen spektakulären Panoramablick.","f":["Gegründet in den 1930er Jahren.","Riesenrad am Rand der Klippe."]},"ge-mushtaidi-park-life-v2":{"i":"/poi-images/ge-mushtaidi-park-life-v2.webp","s":"Einer der ältesten Parks in Tiflis wurde von einem persischen Prinzen angelegt und beheimatet jahrhundertealte Bäume sowie eine historische Kindereisenbahn.","f":["Gegründet in den 1830er Jahren.","Benannt nach Mir Fatah Agha."]},"ge-tsitsinatela-life-v2":{"i":"/poi-images/ge-tsitsinatela-life-v2.webp","s":"Dieser leuchtende Vergnügungspark nahe der Schwarzmeerküste erwacht besonders nach Sonnenuntergang zum Leben.","f":["Der Name bedeutet Glühwürmchen.","Öffnet in den Sommermonaten abends."]},"ge-kakheti-vineyards-life-v2":{"i":"/poi-images/ge-kakheti-vineyards-life-v2.webp","s":"Die endlosen Weinberge im Alasani-Tal bilden das landwirtschaftliche Herzstück der georgischen Weinproduktion.","f":["Georgien gilt als Wiege des Weins.","Qvevri-Methode ist UNESCO-Kulturerbe."]},"ge-imereti-tea-plantations-life-v2":{"i":"/poi-images/ge-imereti-tea-plantations-life-v2.webp","s":"Die sanften Hügel von Imeretien und Gurien waren einst das Zentrum der sowjetischen Teeproduktion.","f":["Teeanbau begann im 19. Jahrhundert.","Das Klima ist ideal für Teesträucher."]},"ge-guria-citrus-orchards-life-v2":{"i":"/poi-images/ge-guria-citrus-orchards-life-v2.webp","s":"Das milde subtropische Klima der Region Gurien am Schwarzen Meer bietet perfekte Bedingungen für den Anbau von Mandarinen und Orangen, deren Duft im Spätherbst die Luft erfüllt.","f":["Hauptanbaugebiet für georgische Mandarinen.","Erntezeit beginnt im November."]},"ge-racha-vineyards-life-v2":{"i":"/poi-images/ge-racha-vineyards-life-v2.webp","s":"Die kühle und bergige Region Ratscha ist berühmt für ihre einzigartigen Rebsorten, insbesondere für den halbsüßen Rotwein Chwantschkara, der auf winzigen Bergparzellen angebaut wird.","f":["Heimat des berühmten Chwantschkara-Weins.","Sehr begrenzte Anbaufläche in Bergregionen."]},"ge-batumi-dolphinarium-life-v2":{"i":"/poi-images/ge-batumi-dolphinarium-life-v2.webp","s":"Eingebettet in den weitläufigen 6.-Mai-Park in Batumi, bietet dieses beliebte Delfinarium unterhaltsame und lehrreiche Shows, die besonders bei Familien mit Kindern sehr gefragt sind.","f":["Ursprünglich 1975 eröffnet.","Nach Modernisierung 2011 wiedereröffnet."]},"shkhara-nature-v2":{"i":"/poi-images/shkhara-nature-v2.webp","s":"Der Schchara ist mit 5.201 Metern der höchste Berg in Georgien und Teil der zentralen Kaukasus-Hauptkette.","f":["Der höchste Punkt Georgiens und der dritthöchste im Kaukasus.","Erstbesteigung im Jahr 1888 durch ein britisch-schweizerisches Team."]},"kazbek-nature-v2":{"i":"/poi-images/kazbek-nature-v2.webp","s":"Der Kasbek ist ein ruhender Stratovulkan und mit über 5.000 Metern einer der markantesten Gipfel des Kaukasus.","f":["Erreicht eine Höhe von 5.054 Metern über dem Meeresspiegel.","Sein georgischer Name 'Mqkinwari' bedeutet Eisberg oder Gletscher."]},"ushba-nature-v2":{"i":"/poi-images/ushba-nature-v2.webp","s":"Der Uschba wird oft als das Matterhorn des Kaukasus bezeichnet und zeichnet sich durch seinen markanten Doppelgipfel aus.","f":["Der Südgipfel ist mit 4.710 Metern etwas höher als der Nordgipfel.","Der Name bedeutet in der svanischen Sprache 'Schrecklicher Berg'."]},"lake-ritsa-nature-v2":{"i":"/poi-images/lake-ritsa-nature-v2.webp","s":"Der Riza-See ist ein tiefblauer Bergsee im nordwestlichen Kaukasus, eingebettet in ein tiefes, bewaldetes Tal in Abchasien.","f":["Der See erreicht eine maximale Tiefe von 116 Metern.","Josef Stalin ließ an seinem Ufer eine Sommerresidenz (Datscha) erbauen."]},"paravani-lake-nature-v2":{"i":"/poi-images/paravani-lake-nature-v2.webp","s":"Der Parawani-See ist der flächenmäßig größte See Georgiens und liegt auf einem vulkanischen Plateau im Süden des Landes.","f":["Liegt auf einer Höhe von über 2.073 Metern über dem Meeresspiegel.","Seine maximale Tiefe beträgt nur etwas mehr als 3 Meter."]},"paliastomi-lake-nature-v2":{"i":"/poi-images/paliastomi-lake-nature-v2.webp","s":"Der Paliastomi-See liegt nahe der Schwarzmeerküste und ist ein bedeutendes Feuchtgebiet im Kolchis-Nationalpark.","f":["Ursprünglich ein Süßwassersee, wurde er 1924 mit dem Meer verbunden.","Das Gebiet gehört zur geschützten Kolchis-Feuchtgebietszone."]},"rioni-river-nature-v2":{"i":"/poi-images/rioni-river-nature-v2.webp","s":"Der Rioni ist der Hauptfluss Westgeorgiens und entspringt an den Gletschern des Großen Kaukasus.","f":["Die antiken Griechen leiteten von seinem Namen 'Phasis' den Begriff für den Fasan ab.","Der Rioni ist mit 327 Kilometern der längste vollständig in Georgien verlaufende Fluss."]},"enguri-river-nature-v2":{"i":"/poi-images/enguri-river-nature-v2.webp","s":"Der Enguri ist ein wilder und reißender Fluss, der durch die zerklüfteten Schluchten von Swanetien fließt, bevor er ins Schwarze Meer mündet.","f":["Die Enguri-Bogenstaumauer ist mit 271,5 Metern eine der höchsten der Welt.","Der Fluss bildet streckenweise die Grenze zur abtrünnigen Region Abchasien."]},"borjomi-kharagauli-national-park-nature-v2":{"i":"/poi-images/borjomi-kharagauli-national-park-nature-v2.webp","s":"Dieser weitläufige Nationalpark im Kleinen Kaukasus ist eines der größten Schutzgebiete Europas und besticht durch unberührte Nadel- und Laubwälder.","f":["Der Park umfasst mehr als 85.000 Hektar reine Naturfläche.","Er wurde 1995 mit Unterstützung des WWF als erster Nationalpark im Kaukasus gegründet."]},"tusheti-national-park-nature-v2":{"i":"/poi-images/tusheti-national-park-nature-v2.webp","s":"Versteckt an den nördlichen Hängen des Großen Kaukasus ist der Nationalpark Tuschetien ein Ort von rauer Schönheit und tief verwurzelten alpinen Traditionen.","f":["Der Abano-Pass, der Hauptzugang, liegt auf 2.850 Metern Höhe.","Das Gebiet wurde in die Liste der potenziellen UNESCO-Welterbestätten aufgenommen."]},"vashlovani-national-park-nature-v2":{"i":"/poi-images/vashlovani-national-park-nature-v2.webp","s":"Der Nationalpark Waschlowani im äußersten Osten Georgiens bietet eine außergewöhnliche Halbwüstenlandschaft mit bizarren Felsformationen und Schlammvulkanen.","f":["Der Name Waschlowani bedeutet wörtlich 'Apfelgarten'.","Das Gebiet ist bekannt für seine Vorkommen der seltenen Kaukasusotter."]},"mtirala-national-park-nature-v2":{"i":"/poi-images/mtirala-national-park-nature-v2.webp","s":"Der Nationalpark Mtirala nahe der Schwarzmeerküste ist die feuchteste Region Georgiens und besticht durch dichte, fast undurchdringliche Regenwälder aus Kastanien und Buchen.","f":["Der Name Mtirala bedeutet auf Georgisch 'Die Weinende', bezogen auf den vielen Regen.","Im Park fallen jährlich bis zu 4.500 Millimeter Niederschlag."]},"lagodekhi-protected-areas-nature-v2":{"i":"/poi-images/lagodekhi-protected-areas-nature-v2.webp","s":"Lagodechi ist das älteste Naturschutzgebiet in Georgien, gelegen an der Ostflanke des Kaukasus.","f":["Es wurde bereits 1912 vom russischen Botaniker Ludwik Młokosiewicz gegründet.","Der Schwarzfelsen-See auf 3.000 Metern ist ein beliebtes Wanderziel."]},"aragvi-river-nature-v2":{"i":"/poi-images/aragvi-river-nature-v2.webp","s":"Der Aragwi schlängelt sich durch die atemberaubende Landschaft der Region Mzcheta-Mtianeti und formt dabei tiefe Täler.","f":["Der Aragwi speist den riesigen Zhinwali-Stausee, der Tiflis mit Trinkwasser versorgt.","Entlang seines Tals verläuft die historische Georgische Heerstraße."]},"tetnuldi-nature-v2":{"i":"/poi-images/tetnuldi-nature-v2.webp","s":"Der Tetnuldi ist ein majestätischer, pyramidenförmiger Gipfel in der Region Swanetien.","f":["Der Berg erreicht eine beeindruckende Höhe von 4.858 Metern.","An seinen Hängen wurde ein modernes Skigebiet eröffnet."]},"kintrishi-nature-v2":{"i":"/poi-images/kintrishi-nature-v2.webp","s":"Das Naturschutzgebiet Kintrischi verbirgt sich in einer malerischen Flussschlucht in der Bergregion Adscharien.","f":["Ein Großteil des Gebiets besteht aus reinen Primärwäldern.","Das Reservat beherbergt viele endemische Pflanzenarten des Kolchis-Gebiets."]},"abudelauri-lakes-nature-v2":{"i":"/poi-images/abudelauri-lakes-nature-v2.webp","s":"Die Abudelauri-Seen sind eine Gruppe spektakulärer hochalpiner Bergseen in Chewsuretien, die sich am Fuße des majestätischen Tschauchi-Massivs befinden.","f":["Der weiße See verdankt seine Farbe feinem Gletscherstaub.","Die Seen sind von Juni bis September eisfrei und für Wanderer zugänglich."]},"kolkheti-national-park-nature-v2":{"i":"/poi-images/kolkheti-national-park-nature-v2.webp","s":"Der Kolchis-Nationalpark erstreckt sich entlang der Schwarzmeerküste und bewahrt die einzigartigen Sumpflandschaften und Auwälder des antiken Kolchis.","f":["Große Teile des Parks sind als Ramsar-Feuchtgebiete international anerkannt.","Die dichten Moorwälder gelten als Relikte aus der Eiszeit."]},"laila-relief-v2":{"i":"/poi-images/laila-relief-v2.webp","s":"Der Laila ist mit rund 4.000 Metern der höchste Gipfel ","s":"Das Lichi-Gebirge verbindet den Großen mit dem Kleinen Kaukasus und teilt Georgien klimatisch und geografisch in eine östliche und eine westliche Hälfte.","f":["Verbindet zwei große Gebirgssysteme.","Wichtige klimatische Scheidelinie."]},"trialeti-range-relief-v2":{"i":"/poi-images/trialeti-range-relief-v2.webp","s":"Das Trialeti-Gebirge ist ein langgestreckter vulkanischer Gebirgszug im Kleinen Kaukasus.","f":["Höchster Punkt ist der Berg Schawiklde.","Reich an geothermischen Quellen."]},"javakheti-plateau-relief-v2":{"i":"/poi-images/javakheti-plateau-relief-v2.webp","s":"Das ausgedehnte, vulkanische Dschawachetien-Plateau in Südgeorgien ist bekannt für sein kühles, raues Klima.","f":["Höhenlage meist über 2.000 Meter.","Beherbergt zahlreiche wichtige Feuchtgebiete."]},"iori-plateau-relief-v2":{"i":"/poi-images/iori-plateau-relief-v2.webp","s":"Die Iori-Hochebene im Südosten Georgiens erstreckt sich als weite Steppen- und Halbwüstenlandschaft zwischen den Flüssen Kura und Alazani.","f":["Geprägt von Trockenheit und Steppenklima.","Wichtiger Lebensraum für Raubvögel."]},"udabno-desert-relief-v2":{"i":"/poi-images/udabno-desert-relief-v2.webp","s":"Die Udabno-Wüste umgibt das historische Höhlenkloster David Garedscha.","f":["Der Name bedeutet auf Georgisch wörtlich 'Wüste'.","Die Region ist reich an Mineralien."]},"pankisi-gorge-relief-v2":{"i":"/poi-images/pankisi-gorge-relief-v2.webp","s":"Das Pankissi-Tal ist ein von dichtem Wald gesäumtes Gebirgstal im Nordosten Georgiens, das vom Fluss Alasani durchschnitten wird.","f":["Etwa 10 Kilometer lang.","Heimat einer einzigartigen kaukasischen Kultur."]},"kodori-gorge-relief-v2":{"i":"/poi-images/kodori-gorge-relief-v2.webp","s":"Die spektakuläre Kodori-Schlucht in Abchasien ist ein tief eingeschnittenes Flusstal, das sich durch extrem raues Terrain windet.","f":["Eines der unzugänglichsten Täler der Region.","Die Wälder bieten Lebensraum für Bären und Wölfe."]},"truso-valley-relief-v2":{"i":"/poi-images/truso-valley-relief-v2.webp","s":"Das Trusso-Tal nahe der russischen Grenze ist berühmt für seine farbenfrohen Mineralquellen, verlassenen mittelalterlichen Türme und die raue, fast baumlose Bergkulisse.","f":["Reich an kohlensäurehaltigen Mineralquellen.","Befindet sich auf über 2.000 Metern Höhe."]},"sno-valley-relief-v2":{"i":"/poi-images/sno-valley-relief-v2.webp","s":"Das Sno-Tal ist ein idyllisches alpines Becken, das von majestätischen schneebedeckten Gipfeln umgeben ist.","f":["Beliebter Ausgangspunkt für Bergwanderungen.","Zweigt von der Georgischen Heerstraße ab."]},"darial-gorge-relief-v2":{"i":"/poi-images/darial-gorge-relief-v2.webp","s":"Die Darialschlucht ist ein legendärer Engpass, in dem der Fluss Terek die massive Barriere des Kaukasus durchbricht.","f":["Historisch als die 'Tore der Alanen' bekannt.","Wichtiger Grenzübergang nach Russland."]},"borjomi-gorge-relief-v2":{"i":"/poi-images/borjomi-gorge-relief-v2.webp","s":"Die Bordschomi-Schlucht ist ein tief eingeschnittenes Flusstal der Kura, berühmt für ihre dichten Nadelwälder und die natürlichen Heilquellen.","f":["Heimat des berühmten Bordschomi-Mineralwassers.","Geprägt durch ein besonderes, heilendes Mikroklima."]},"adjara-coast-relief-v2":{"i":"/poi-images/adjara-coast-relief-v2.webp","s":"Die adscharische Schwarzmeerküste erstreckt sich im Südwesten Georgiens und vereint feuchte subtropische Vegetation mit malerischen Kieselstränden.","f":["Subtropisches Klima mit milden Wintern.","Die Strände bestehen überwiegend aus Kieseln."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).

document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
</html>
