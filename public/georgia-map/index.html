*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#060614;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:#0a0a1f;border-bottom:1px solid #ffffff14;position:relative;z-index:5}
header a.back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#ffffff14;color:#fff;text-decoration:none;font-weight:700}

header h1{margin:0;font-size:1rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .langs{display:flex;gap:.25rem}
.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;background-image:radial-gradient(1.2px 1.2px at 12% 22%,#ffffff70,transparent),radial-gradient(1px 1px at 28% 68%,#ffffff55,transparent),radial-gradient(1.4px 1.4px at 47% 38%,#cfe4ff66,transparent),radial-gradient(1px 1px at 63% 18%,#ffffff50,transparent),radial-gradient(1.3px 1.3px at 78% 72%,#ffffff66,transparent),radial-gradient(1px 1px at 88% 33%,#cfe4ff55,transparent),radial-gradient(1px 1px at 38% 88%,#ffffff44,transparent),radial-gradient(1.2px 1.2px at 92% 58%,#ffffff55,transparent);background-repeat:no-repeat}
#svg{width:100%;height:100%;display:block;cursor:grab;position:relative;z-index:1}
#svg.drag{cursor:grabbing}
.region{fill:#161e3a;stroke:#6f9bf0;stroke-width:1.1;stroke-opacity:.7;transition:fill .15s}
.region:hover{fill:#28356e}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#0a0f20;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#7cc0ff;filter:drop-shadow(0 0 2.4px #4aa6ff)}
.poi.g-sight circle{fill:#fcd34d;filter:drop-shadow(0 0 2.4px #f5b528)}
.poi.g-nature circle{fill:#4ade80;filter:drop-shadow(0 0 2.4px #22c55e)}
.poi.g-history circle{fill:#d0a6ff;filter:drop-shadow(0 0 2.4px #b266ff)}
.poi.g-industry circle{fill:#ffb066;filter:drop-shadow(0 0 2.4px #fb923c)}
.poi.g-other circle{fill:#b8c0cc;filter:drop-shadow(0 0 2px #9ca3af)}
.poi.dim{opacity:.16}
.poi.dim circle{filter:none}
.poi,.cluster{transition:opacity .2s}
#svg.dim-pois .poi,#svg.dim-pois .cluster{opacity:.1!important}
#svg.dim-pois .poi circle{filter:none}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7.5;fill:#fff;opacity:1;filter:drop-shadow(0 0 6px #cfeaff) drop-shadow(0 0 11px #7fd0ff)}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:rgba(11,19,35,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(120,180,255,.3);border-radius:18px 18px 0 0;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -12px 44px rgba(0,0,0,.6)}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a,.popup .list .nl{display:flex;align-items:center;gap:.6rem;padding:.4rem .45rem;border-radius:10px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:hover,.popup .list a:active{background:rgba(120,180,255,.12)}
.popup .list .lthumb{width:42px;height:42px;border-radius:9px;flex-shrink:0;background:#1a2740 center/cover no-repeat;display:flex;align-items:center;justify-content:center}
.popup .list .lthumb .dot{width:9px;height:9px;border-radius:50%}
.popup .list .lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.popup .list .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.popup .list .g{font-size:.64rem;color:#9fc4ff;text-transform:uppercase;letter-spacing:.04em}
.popup .list .lgo{color:#7fb0ff;font-size:1.2rem;font-weight:700;flex-shrink:0;padding-right:.3rem}
.popup .list .nl{color:#ffffffb0;font-style:normal}
.mapcard{position:fixed;z-index:20;width:max-content;min-width:150px;max-width:230px;background:rgba(11,19,35,.82);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);border:1px solid rgba(120,180,255,.34);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.62),0 0 0 1px rgba(120,180,255,.08);opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-100%) translateY(-15px) scale(.95);transform-origin:bottom center;transition:opacity .16s,transform .16s}
.mapcard.open{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-100%) translateY(-15px) scale(1)}
.mapcard--below{transform:translate(-50%,0) translateY(15px) scale(.95);transform-origin:top center}
.mapcard--below.open{transform:translate(-50%,0) translateY(15px) scale(1)}
.mapcard::after{content:"";position:absolute;left:var(--ax,50%);top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(11,19,35,.82)}
.mapcard--below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:rgba(11,19,35,.82)}
.mapcard .mc-img{width:100%;aspect-ratio:16/9;background:#1a2740 center/cover no-repeat;display:none;border-radius:13px 13px 0 0}
.mapcard .mc-img.has{display:block}
.mapcard .mc-body{padding:9px 11px 11px}
.mapcard .mc-type{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#7fb0ff;font-weight:700}
.mapcard .mc-name{font-size:.95rem;font-weight:800;color:#eef4ff;margin:1px 0 5px;line-height:1.2}
.mapcard .mc-desc{font-size:.76rem;color:#cfe0ff;line-height:1.4;margin:0 0 9px;display:none}
.mapcard .mc-desc.show{display:block}
.mapcard .mc-more{display:inline-block;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;text-decoration:none;font-weight:700;font-size:.78rem;padding:.42rem .75rem;border-radius:8px}
.mapcard .mc-x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:.95rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.burst{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}
.burst.open{display:block}
.burst-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.burst-line{stroke:rgba(120,185,255,.4);stroke-width:1.1;stroke-linecap:round;animation:burstFade .25s ease-out}
.burst-core{fill:#cdeeff;filter:drop-shadow(0 0 5px #7fd0ff)}
.burst-dots{position:absolute;inset:0}
.burst-dot{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;animation:burstPop .22s ease-out}
.burst-dot .bd{width:15px;height:15px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px rgba(8,16,34,.6),0 0 10px currentColor;transition:transform .12s}
.burst-dot:hover .bd,.burst-dot:focus-visible .bd{transform:scale(1.3)}
.burst-dot .bl{font-size:.72rem;font-weight:700;color:#eef4ff;background:rgba(8,14,28,.82);border:1px solid rgba(120,180,255,.25);padding:1.5px 6px;border-radius:7px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
@keyframes burstPop{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes burstFade{from{opacity:0}to{opacity:1}}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}
</style>

a, amely egykor virágzó üdülőhely volt a Fekete-tengernél.","f":["A szuhumi botanikus kertet 1840-ben alapították.","Sok történelmi gyógyszálló ma már üresen áll."]},"ge-khashuri-cities-v2":{"i":"/poi-images/ge-khashuri-cities-v2.webp","s":"Hasuri egy fontos közlekedési csomópont Közép-Grúziában, ahol a vasúti és úthálózatok találkoznak.","f":["Jelentősége 1872-ben nőtt meg a vasútépítés révén.","A történelmi Szurami vár a város közelében található."]},"ge-samtredia-cities-v2":{"i":"/poi-images/ge-samtredia-cities-v2.webp","s":"Szamtredia egy nyüzsgő város az Imereti-síkságon, amely vasúti csomópontként betöltött szerepéről ismert.","f":["1921-ben kapott hivatalosan városi rangot.","A Rioni folyó a városközpont közelében folyik."]},"ge-senaki-cities-v2":{"i":"/poi-images/ge-senaki-cities-v2.webp","s":"Szenaki egy jelentős város Megrelia régióban, és fontos katonai bázis.","f":["1933 és 1989 között a várost Miha Chakajának hívták.","A szenaki színház neoklasszikus stílusban épült."]},"ge-zestafoni-cities-v2":{"i":"/poi-images/ge-zestafoni-cities-v2.webp","s":"Zesztafoni egy iparváros Imeretiben, amelynek gazdasága szorosan összefonódik a mangánérc feldolgozásával.","f":["Az itteni vasötvözet-üzem a legnagyobb az országban.","Zesztafoni kiváló szőlőtermesztő vidékeiről is ismert."]},"ge-marneuli-cities-v2":{"i":"/poi-images/ge-marneuli-cities-v2.webp","s":"Marneuli Alsó-Kartli multikulturális régiójának központja, ahol a lakosság többsége azerbajdzsáni.","f":["A város a mezőgazdasági kereskedelem egyik központja.","Marneuliban minden évben nagy ünnepséget tartanak Novruzkor."]},"ge-telavi-cities-v2":{"i":"/poi-images/ge-telavi-cities-v2.webp","s":"Telavi a Kaheti borvidék történelmi és közigazgatási központja.","f":["A Batoniszi Cihé erőd a kaheti királyok rezidenciája volt.","Egy 900 éves platánfa áll Telavi központjában."]},"ge-akhaltsikhe-cities-v2":{"i":"/poi-images/ge-akhaltsikhe-cities-v2.webp","s":"Ahalcihe egy multikulturális város Dél-Grúziában, amelyet grúz, gazdasági jellegű város.","f":["A David Garedzsa kolostor a várostól délre található.","A szőlőtermesztés a helyi lakosság fő bevételi forrása."]},"ge-gardabani-cities-v2":{"i":"/poi-images/ge-gardabani-cities-v2.webp","s":"Gardabani egy iparváros az azeri határ közelében, ahol egy fontos hőerőmű üzemel.","f":["A gardabani erőmű Grúzia nagy részét látja el árammal.","A környéken történelmi barlangtelepülések találhatók."]},"ge-borjomi-cities-v2":{"i":"/poi-images/ge-borjomi-cities-v2.webp","s":"Borzsomi festői gyógyüdülőhely, amely világszerte ismert sós, gyógyhatású ásványvizéről.","f":["A borzsomi vizet több mint 40 országba exportálják.","A Romanov cári dinasztia szívesen töltötte itt a nyarait."]},"ge-tqvarcheli-cities-v2":{"i":"/poi-images/ge-tqvarcheli-cities-v2.webp","s":"Tkvarcseli egy hegyekkel körülvett város Abháziában, amely szénbányászatáról volt ismert.","f":["Az építészetet klasszicista sztálinista épületek jellemzik.","A várost 1942-ben alapították hivatalosan."]},"ge-khoni-cities-v2":{"i":"/poi-images/ge-khoni-cities-v2.webp","s":"Honi egy kisváros a nyugat-grúz alföldön, amely hagyományos selyemgyártásáról és mezőgazdasági termékeiről ismert.","f":["Honi közelében található a híres Okace-kanyon.","A városközpontban lévő templom gazdag történelmi jelentőséggel bír."]},"ge-bolnisi-cities-v2":{"i":"/poi-images/ge-bolnisi-cities-v2.webp","s":"Bolniszi egy város Alsó-Kartliban, amelyet német telepesek alapítottak a 19.","f":["A bolniszi Sioni-templom az 5. századból származik.","A helyi múzeum a német-grúz történelmet mutatja be."]},"ge-akhalkalaki-cities-v2":{"i":"/poi-images/ge-akhalkalaki-cities-v2.webp","s":"Ahalkalaki a Dzsavaheti-fennsíkon található az örmény határ közelében, és túlnyomórészt örmény lakossággal rendelkezik.","f":["Az ahalkalaki erőd a 11. századból származik.","A régió kiváló burgonyájáról híres."]},"ge-gurjaani-cities-v2":{"s":"Gurdzsaani egy nyüzsgő borászati központ a Kaheti régióban, végtelen szőlőültetvényekkel körülvéve.","f":["A Kvelacminda-templom egyedülálló a maga két kupolájával.","A városban híres grúz borfajtákat állítanak elő."]},"ge-mtskheta-cities-v2":{"i":"/poi-images/ge-mtskheta-cities-v2.webp","s":"Mcheta Grúzia egyik legrégebbi városa és az Ibériai Királyság egykori fővárosa.","f":["A Szveticshoveli-székesegyház UNESCO világörökségi helyszín.","A Dzsvari-kolostor fenségesen magasodik a város fölé."]},"batumi-sea-port-economic-v2":{"i":"/poi-images/batumi-sea-port-economic-v2.webp","s":"A Batumi Tengeri Kikötő Grúzia egyik legfontosabb fekete-tengeri kikötője, amely az olaj- és teherforgalom központi csomópontja.","f":["Fontos tranzitpont a kaszpi-tengeri olaj számára.","A régió egyik legrégebbi kikötője."]},"poti-sea-port-economic-v2":{"i":"/poi-images/poti-sea-port-economic-v2.webp","s":"A Poti Tengeri Kikötő fontos közlekedési csomópont és Grúzia legnagyobb kikötője a konténer- és ömlesztettáru-szállítás terén.","f":["Kulcsszerepet játszik a TRACECA eurázsiai közlekedési folyosóban.","A grúz tengeri kereskedelem fő kapuja."]},"chiatura-manganese-mine-economic-v2":{"i":"/poi-images/chiatura-manganese-mine-economic-v2.webp","s":"A Chiatura Mangánbánya a világ egyik legnagyobb mangánérc-lelőhelye, amely több mint egy évszázada üzemel.","f":["A város ismert a régi drótkötélpályák hálózatáról.","Nyersanyagot biztosít a grúz nehézipar számára."]},"rustavi-metallurgical-plant-economic-v2":{"i":"/poi-images/rustavi-metallurgical-plant-economic-v2.webp","s":"A rusztavi kohászati üzem Grúzia legnagyobb nehézipari központja, amely acél- és vastermelésre specializálódott.","f":["Rusztavi városát ezen üzem köré építették.","Jelentős acélipari termékeket exportál a régióban."]},"zestafoni-ferroalloy-plant-economic-v2":{"i":"/poi-images/zestafoni-ferroalloy-plant-economic-v2.webp","s":"A zesztafoni üzem a chiaturai mangánércet dolgozza fel, és a világ egyik legnagyobb szilikomangán-termelője.","f":["A szilikomangán az acélgyártás fontos összetevője.","Az üzem az Imeréti régió egyik fő .webp","s":"A Zsinvali-gát felduzzasztja az Aragvi folyót, és tiszta vízenergiát termel Grúzia fővárosa, Tbiliszi számára.","f":["A víztározó ivóvízzel is ellátja Tbiliszit.","A létesítmény az 1980-as években készült el."]},"gardabani-tpp-economic-v2":{"i":"/poi-images/gardabani-tpp-economic-v2.webp","s":"A gardabani kombinált ciklusú gázturbinás erőmű biztosítja Grúzia energiabiztonságát, különösen télen.","f":["Ez a régió egyik legmodernebb erőműve.","Csökkenti az importált villamos energiától való függőséget."]},"larsi-border-crossing-economic-v2":{"i":"/poi-images/larsi-border-crossing-economic-v2.webp","s":"A Darial-szurdokban található Larsi határátkelőhely a Grúzia és Oroszország közötti kereskedelem legfontosabb szárazföldi útvonala.","f":["Az egyetlen hivatalosan nyitva tartó határátkelő Oroszország felé.","Télen gyakran elzárja a heves havazás."]},"sarpi-border-crossing-economic-v2":{"i":"/poi-images/sarpi-border-crossing-economic-v2.webp","s":"Sarpi egy forgalmas határátkelő a Fekete-tenger partján, és központi szerepet játszik a Törökországgal folytatott kereskedelemben.","f":["A grúz vámépület egyedi, modern építészettel rendelkezik.","Az ország egyik legforgalmasabb csomópontja."]},"lilo-city-market-economic-v2":{"i":"/poi-images/lilo-city-market-economic-v2.webp","s":"A Tbiliszi szélén található Lilo Piac Transzkaukázia legnagyobb nagy- és kiskereskedelmi piaca a fogyasztási cikkek terén.","f":["Itt az egész Kaukázusból érkező kereskedők vásárolnak.","Az informális és formális kereskedelem jelentős mozgatórugója."]},"borjomi-bottling-plant-economic-v2":{"i":"/poi-images/borjomi-bottling-plant-economic-v2.webp","s":"A borzsomi gyárakban a híres vulkáni ásványvizet palackozzák, és a világ több tucat országába exportálják.","f":["A Borjomi víz Grúzia egyik legfontosabb exportcikke.","Az ipari palackozás már 1890-ben elkezdődött."]},"batumi-oil-terminal-economic-v2":{"i":"/poi-images/batumi-oil-terminal-economic-v2.webp","s":"A batumi olajterminál közép-ázsiai és kaukázusi kőolajtermékeket dolgoz fel és tárol a nemzetközi tengeri szállítás számára.","f":["A létesítmény közvetlen vasúti kapcsolatokkal rendelkezik.","A globális olajipar történelmi központja a 19. század vége óta."]},"kaspi-cement-plant-economic-v2":{"i":"/poi-images/kaspi-cement-plant-economic-v2.webp","s":"A kaszpi cementgyár a grúz építőanyag-ipar egyik alappillére, amely az ország fontos infrastrukturális projektjeit látja el.","f":["A régió mészkőlelőhelyei ideális nyersanyagot biztosítanak.","A modern szűrőberendezések ma már csökkentik a károsanyag-kibocsátást."]},"samgori-oil-field-economic-v2":{"i":"/poi-images/samgori-oil-field-economic-v2.webp","s":"A Tbiliszi közelében található Szamgori olajmező a kőolaj-kitermelés legnagyobb hazai forrása Grúziában.","f":["A mező 20. századi felfedezése csökkentette az energiaimportot.","A kitermelés mértéke ma alacsonyabb, mint a múltban."]},"ge-narikala-history-v2":{"i":"/poi-images/ge-narikala-history-v2.webp","s":"A Narikala egy ősi erőd, amely a főváros, Tbiliszi fölé magasodik, és a 4.","f":["A 4. században alapították perzsa fellegvárként.","Egy 1827-es földrengés a komplexum nagy részét elpusztította."]},"ge-svetitskhoveli-history-v2":{"i":"/poi-images/ge-svetitskhoveli-history-v2.webp","s":"A fenséges mcchetai Szvetickhoveli-székesegyház a kora középkori grúz építészet remekműve és UNESCO világörökség.","f":["A 11. században épült Arszukiszdze építész irányításával.","A grúz királyok hagyományos koronázási és temetkezési helye."]},"ge-uplistsikhe-history-v2":{"i":"/poi-images/ge-uplistsikhe-history-v2.webp","s":"Uplisziche egy lenyűgöző, sziklába vájt ókori barlangváros Kelet-Grúziában.","f":["Grúzia egyik legrégebbi városi települése.","A pogány és a keresztény barlangépítészet keveréke."]},"ge-vardzia-history-v2":{"i":"/poi-images/ge-vardzia-history-v2.webp","s":"A Vardzia barlangváros egy látványos kolostorkomplexum, amelyet a 12.","f":["Eredetileg a város akár tizenhárom emeletből is állt.","1283-ban egy földrengés leszakította a külső falat, feltárva a kolostort."]},"ge-gelati-history-v2":{"i":"/poi-images/ge-gelati-history-v2.webp","s":"A Kutaiszi közelében található Gelati kolostor Grúzia egyik első kulturális és szellemi központja volt.","f":["UNESCO világörökség, kiváló mozaikokkal és freskókkal.","Építő Dávid király a kolostor bejárati kapujában van eltemetve."]},"ge-bagrati-history-v2":{"i":"/poi-images/ge-bagrati-history-v2.webp","s":"A kutaiszi Bagrati-székesegyház fenségesen magasodik az Ukimerioni-dombon.","f":["III. Bagrat királyról, az egyesített Grúzia első királyáról nevezték el.","1692-ben az oszmán csapatok súlyosan megrongálták, a 20. században restaurálták."]},"ge-gergeti-history-v2":{"i":"/poi-images/ge-gergeti-history-v2.webp","s":"A Gergeti Szentháromság-templom lélegzetelállító környezetben, több mint 2100 méteres magasságban fekszik a hatalmas Kazbek-hegy előtt.","f":["Az inváziók idején itt rejtették el az értékes mcchetai ereklyéket.","Meredek hegyi úton vagy egy festői túrával közelíthető meg."]},"ge-dadiani-history-v2":{"i":"/poi-images/ge-dadiani-history-v2.webp","s":"A zugdidi Dadiani-palota a Mingréliát uraló Dadiani nemesi család rezidenciája volt.","f":["A palota botanikus kertjét a 19. században hozták létre.","A család egy leszármazottja Napóleon unokaöccséhez ment feleségül, ami európai ereklyéket hozott Grúziába."]},"ge-mutso-history-v2":{"i":"/poi-images/ge-mutso-history-v2.webp","s":"Mucu lenyűgöző romjai szinte rátapadnak egy meredek sziklagerincre az elszigetelt Hevszureti hegyvidéken.","f":["A középkori Grúzia egyik leglenyűgözőbb építészeti műemlékeként tartják számon.","A közelmúltban egy átfogó projekt keretében restaurálták."]},"ge-gremi-history-v2":{"i":"/poi-images/ge-gremi-history-v2.webp","s":"Gremi a 16.","f":["1565-ben építtette Levan kaheti király.","A várost 1615-ben I. Abbász sah csapatai a földdel tették egyenlővé."]},"ge-jvari-history-v2":{"i":"/poi-images/ge-jvari-history-v2.webp","s":"A 6.","f":["A Dzsvari név grúz nyelven szó szerint 'keresztet' jelent.","Mcchetával együtt az UNESCO világörökség része."]},"ge-rabati-history-v2":{"i":"/poi-images/ge-rabati-history-v2.webp","s":"Az ahalcihei Rabati erőd egy lenyűgöző multikulturális komplexum.","f":["A 9. században alapították Lomisza néven.","2012-ben átfogó és nagyszabású restauráción esett át."]},"ge-khertvisi-history-v2":{"i":"/poi-images/ge-khertvisi-history-v2.webp","s":"A Hertviszi erőd, Grúzia egyik legrégebbi erődítménye, drámai módon két mély folyószurdok találkozásánál fekszik.","f":["Egy stratégiailag tökéletes, sziklás földnyelven épült a Kr. e. 2. században.","A legenda szerint Nagy Sándor is ostromolta a helyet."]},"ge-david-gareja-history-v2":{"i":"/poi-images/ge-david-gareja-history-v2.webp","s":"A Dávid Garedzsa sziklakolostor egy félsivatagos tájon fekszik, az azerbajdzsáni határ közelében.","f":["A komplexum több száz barlangból, kápolnából és lakóhelyiségből áll.","Évszázadokon át a szerzetesi élet virágzó központja volt."]},"ge-gonio-history-v2":{"i":"/poi-images/ge-gonio-history-v2.webp","s":"A fekete-tengeri partvidéken fekvő Gonio erőd a Kaukázus egyik legrégebbi fennmaradt római erődítménye.","f":["Idősebb Plinius említette először az 1. században.","A hagyomány szerint Mátyás apostol az erőd falain belül van eltemetve."]},"ge-shatili-history-v2":{"i":"/poi-images/ge-shatili-history-v2.webp","s":"A titokzatos Satili erődített falu a mély Kaukázus hegységben szorosan összekapcsolódó lakótornyok labirintusa.","f":["A 7. és a 13. század között alakult ki, rendkívüli elszigeteltségben.","A grúz népi építészet egyik legkiemelkedőbb példája."]},"ge-ananuri-history-v2":{"i":"/poi-images/ge-ananuri-history-v2.webp","s":"A jól védhető Ananuri erőd festőien magasodik a Zsinvali-víztározó felett.","f":["A komplexum két templomot is magában foglal, finom kőfaragásokkal a homlokzatokon.","Számos pusztítás ellenére a pártázatok és a védőtornyok kiválóan fennmaradtak."]},"ge-didgori-history-v2":{"i":"/poi-images/ge-didgori-history-v2.webp","s":"A Didgori emlékmű azt a történelmi csatateret jelzi, ahol Építő Dávid király 1121-ben váratlan és elsöprő győzelmet aratott a hatalmas szeldzsuk sereg felett.","f":["Ez a győzelem harangozta be Grúzia aranykorát.","Minden évben augusztus 12-én nemzeti ünnepként ünneplik a csata évfordulóját."]},"ge-kartlis-deda-history-v2":{"i":"/poi-images/ge-kartlis-deda-history-v2.webp","s":"A monumentális 'Kartlisz Deda' szobor 1958 óta őrködik Tbiliszi felett.","f":["Az alumíniumból készült emlékmű 20 méter magas.","Tbiliszi alapításának 1500. évfordulója alkalmából állították fel."]},"ge-alaverdi-history-v2":{"i":"/poi-images/ge-alaverdi-history-v2.webp","s":"Az Alazani-völgy szívében található lenyűgöző Alaverdi-székesegyház a 21.","f":["A 11. századi székesegyház magassága meghaladja az 50 métert.","A kolostor hagyományos amfórákban (kvevri) termel bort, amely technika UNESCO státusszal rendelkezik."]},"bridge-of-peace-landmarks-v2":{"i":"/poi-images/bridge-of-peace-landmarks-v2.webp","s":"A Tbilisziben található Béke hídja egy jellegzetes, üvegből és acélból készült, ív alakú gyalogoshíd a Kura folyó felett, amely az óvárost köti össze a Rike parkkal.","f":["Michele De Lucchi építész tervezte.","A híd 150 méter hosszú és 2010-ben adták át."]},"abanotubani-landmarks-v2":{"i":"/poi-images/abanotubani-landmarks-v2.webp","s":"Tbiliszi történelmi fürdőnegyede, az Abanotubani, híres hagyományos, kupolás fürdőházairól, amelyeket természetes, forró kénes források táplálnak.","f":["A fürdőket forró kénes források táplálják.","Híres látogatói közé tartozott Alekszandr Puskin és id. Alexandre Dumas."]},"chronicle-of-georgia-landmarks-v2":{"i":"/poi-images/chronicle-of-georgia-landmarks-v2.webp","s":"A Grúzia krónikája hatalmas emlékműve a Tbiliszi-tenger közelében, egy dombon magasodik, és óriási oszlopokon ábrázol jeleneteket a grúz történelemből és vallásból.","f":["Az emlékművet 1985-ben Zurab Cereteli művész alkotta.","A lenyűgöző oszlopok több mint 30 méter magasak."]},"gabriadze-theater-landmarks-v2":{"i":"/poi-images/gabriadze-theater-landmarks-v2.webp","s":"Rezo Gabriadze festői bábszínháza Tbiliszi óvárosában híres ferde óratornyáról, amelyből minden egész órában egy angyal jelenik meg.","f":["A színházat 1981-ben alapította Rezo Gabriadze.","A jellegzetes ferde óratornyot 2010-ben adták hozzá."]},"tbilisi-tv-tower-landmarks-v2":{"i":"/poi-images/tbilisi-tv-tower-landmarks-v2.webp","s":"A Tbiliszi TV-torony a Mtacminda hegyen a város egyik jelképe, amely éjszaka színes kivilágításának köszönhetően a főváros szinte minden pontjáról látható.","f":["A torony eléri a 274 méteres magasságot.","1972-ben épült egy régebbi adótorony helyén."]},"ali-and-nino-statue-landmarks-v2":{"i":"/poi-images/ali-and-nino-statue-landmarks-v2.webp","s":"Az Ali és Nino kinetikus szobor Batumiban egy tragikus szerelmi történetet szimbolizál.","f":["A kinetikus szobor 8 méter magas.","Tamara Kvesitadze művésznő tervezte."]},"alphabet-tower-landmarks-v2":{"i":"/poi-images/alphabet-tower-landmarks-v2.webp","s":"A 130 méter magas Ábécé-torony Batumiban a grúz írás egyediségét ünnepli.","f":["A torony 130 méter magas és 2011-ben készült el.","A grúz ábécét és annak 33 betűjét ünnepli."]},"batumi-botanical-garden-landmarks-v2":{"i":"/poi-images/batumi-botanical-garden-landmarks-v2.webp","s":"A Zöld-foknál található Batumi Botanikus Kert a világ egyik legnagyobb és fajokban leggazdagabb kertje.","f":["A kertet hivatalosan 1912-ben nyitották meg.","Több mint 108 hektáros területen fekszik."]},"batumi-boulevard-landmarks-v2":{"i":"/poi-images/batumi-boulevard-landmarks-v2.webp","s":"A történelmi Batumi körút több kilométer hosszan nyúlik el a part mentén, és pálmafákkal, táncoló szökőkutakkal, valamint számos kávézóval vonzza a látogatókat.","f":["A körút kialakítása 1881-ben kezdődött.","A sétány körülbelül 7 kilométer hosszan húzódik."]},"katskhi-pillar-landmarks-v2":{"i":"/poi-images/katskhi-pillar-landmarks-v2.webp", fejezték be teljesen."]},"dashbashi-canyon-landmarks-v2":{"i":"/poi-images/dashbashi-canyon-landmarks-v2.webp","s":"A festői Dasbasi-kanyon számos lépcsőzetes vízesésével vonzza a látogatókat.","f":["Az üvegből készült Gyémánt-híd 240 méter hosszú.","A hidat 2022-ben nyitották meg a nagyközönség számára."]},"sighnaghi-city-wall-landmarks-v2":{"i":"/poi-images/sighnaghi-city-wall-landmarks-v2.webp","s":"Szignagi lenyűgöző városfala több mint négy kilométer hosszan öleli körül a festői várost.","f":["Az erődítmény fala összesen 4,5 kilométer hosszú.","Összesen 28 őrtoronnyal van felszerelve."]},"makhuntseti-waterfall-landmarks-v2":{"i":"/poi-images/makhuntseti-waterfall-landmarks-v2.webp","s":"Az Adzsaria régióban található Mahunceti-vízesés népszerű kirándulóhely.","f":["A víz 33,5 méter magasságból zúdul le.","A közelben található a történelmi Tamar királynő hídja."]},"gveleti-waterfall-landmarks-v2":{"i":"/poi-images/gveleti-waterfall-landmarks-v2.webp","s":"Sztyepancminda zord hegyvidéki táján bújik meg a Gveleti-vízesés.","f":["A Gveleti név jelentése kígyók helye.","A területen két fő vízesés található."]},"ge-mtirala-national-park-life-v2":{"i":"/poi-images/ge-mtirala-national-park-life-v2.webp","s":"Ez az adzsáriai nemzeti park a nevét az esős mikroklímájáról kapta.","f":["A neve azt jelenti: síró.","Magas az éves csapadékmennyiség."]},"ge-vashlovani-national-park-life-v2":{"i":"/poi-images/ge-vashlovani-national-park-life-v2.webp","s":"Kelet-Grúzia nemzeti parkja szavannaszerű tájat, bizarr sziklaalakzatokat és iszapvulkánokat kínál.","f":["Félsivatagi tájairól ismert.","Leopárdok és csíkos hiénák menedéke."]},"ge-lagodekhi-reserve-life-v2":{"i":"/poi-images/ge-lagodekhi-reserve-life-v2.webp","s":"A Kaukázus egyik legrégebbi természetvédelmi területe, mely őserdeivel és látványos vízeséseivel hódít.","f":["1912-ben alapították.","Azerbajdzsánnal és Oroszországgal határos."]},"ge-tusheti-national-park-life-v2":{"i":"/poi-images/ge-tusheti-national-park-life-v2.webp","s":"A távoli Tuséti hegyvidék csak a nyári hónapokban közelíthető meg, és érintetlen természeti környezetet őriz.","f":["Több mint 2000 méteres magasságban fekszik.","A veszélyes Abano-hágón át közelíthető meg."]},"ge-kolkheti-national-park-life-v2":{"i":"/poi-images/ge-kolkheti-national-park-life-v2.webp","s":"A Fekete-tenger partján fekvő kiterjedt vizes élőhelyek és mocsárerdők a vándormadarak globális menedékhelyei.","f":["Fontos telelőhely a madarak számára.","Magában foglalja a Paliasztomi-tavat."]},"ge-javakheti-reserve-life-v2":{"i":"/poi-images/ge-javakheti-reserve-life-v2.webp","s":"Dél-Grúzia vulkanikus fennsíkját számos tó és zord, fátlan táj jellemzi.","f":["Vulkanikus fennsíkon fekszik.","Számos endemikus madárfaj otthona."]},"ge-kintrishi-reserve-life-v2":{"i":"/poi-images/ge-kintrishi-reserve-life-v2.webp","s":"Az adzsáriai hegyekben megbújó rezervátum érintetlen reliktum erdőket és mély folyóvölgyeket véd.","f":["Nagyon nedves szubtrópusi éghajlat.","Ritka kaukázusi szalamandrák élőhelye."]},"ge-algeti-national-park-life-v2":{"i":"/poi-images/ge-algeti-national-park-life-v2.webp","s":"Az Algeti folyó erdős völgyében fekvő terület a természet és a történelmi műemlékek varázslatos kombinációját kínálja.","f":["Sűrű luc- és jegenyefenyő erdőket véd.","Régészeti lelőhelyekben gazdag."]},"ge-machakhela-national-park-life-v2":{"i":"/poi-images/ge-machakhela-national-park-life-v2.webp","s":"Ez a török határ közelében fekvő, természethez közeli terület egyedülálló hegyi erdőket és hagyományos kultúrtájakat őriz.","f":["Közvetlenül Törökországgal határos.","Régi erődromokról ismert."]},"ge-tbilisi-botanical-garden-life-v2":{"i":"/poi-images/ge-tbilisi-botanical-garden-life-v2.webp","s":"A Narikala erőd mögötti mély szurdokban megbúvó zöld oázis évszázadok óta menedéket nyújt.","f":["1845-ben alapították.","Egykor királyi palotakert volt."]},"ge-rike-park-life-v2":{"i":"/poi-images/ge-rike-park-life-v2.webp","s":"Ez a modern városi park a Kura folyó partján, Tbilisziben, futurisztikus dizájnjával hódít.","f":["Futurisztikus koncertterem a parkban.","A Narikala erődhöz vezető felvonó kiindulópontja."]},"ge-vake-park-life-v2":{"i":"/poi-images/ge-vake-park-life-v2.webp","s":"Tbiliszi legnagyobb közparkjaként a Vake Park népszerű pihenőhely, széles sétányokkal, szökőkutakkal és emlékművekkel.","f":["1946-ban nyitották meg.","Hatalmas második világháborús győzelmi szobor."]},"ge-mtatsminda-park-life-v2":{"i":"/poi-images/ge-mtatsminda-park-life-v2.webp","s":"A Tbiliszi felett magasan fekvő történelmi vidámpark minden korosztály számára kínál attrakciókat és lenyűgöző panorámát.","f":["Az 1930-as években alapították.","Óriáskerék a szikla szélén."]},"ge-mushtaidi-park-life-v2":{"i":"/poi-images/ge-mushtaidi-park-life-v2.webp","s":"Tbiliszi egyik legrégebbi parkját egy perzsa herceg alapította, évszázados fáknak és egy történelmi gyermekvasútnak ad otthont.","f":["Az 1830-as években alapították.","Mir Fatah Agha után nevezték el."]},"ge-tsitsinatela-life-v2":{"i":"/poi-images/ge-tsitsinatela-life-v2.webp","s":"Ez a ragyogó vidámpark a Fekete-tenger partjának közelében különösen naplemente után kel életre.","f":["A neve szentjánosbogarat jelent.","A nyári hónapokban esténként nyit."]},"ge-kakheti-vineyards-life-v2":{"i":"/poi-images/ge-kakheti-vineyards-life-v2.webp","s":"Az Alazani-völgy végtelen szőlőültetvényei a grúz bortermelés mezőgazdasági központját alkotják.","f":["Grúziát a bor bölcsőjének tartják.","A kvevri módszer UNESCO kulturális örökség."]},"ge-imereti-tea-plantations-life-v2":{"i":"/poi-images/ge-imereti-tea-plantations-life-v2.webp","s":"Imeréti és Gúria lankás dombjai egykor a szovjet teatermelés központjai voltak.","f":["A teatermelés a 19. században kezdődött.","Az éghajlat ideális a teacserjék számára."]},"ge-guria-citrus-orchards-life-v2":{"i":"/poi-images/ge-guria-citrus-orchards-life-v2.webp","s":"A Fekete-tenger melletti Gúria régió enyhe szubtrópusi klímája tökéletes feltételeket biztosít a mandarin és a narancs termesztéséhez, melyek illata késő ősszel betölti a levegőt.","f":["A grúz mandarinok fő termőterülete.","A betakarítási szezon novemberben kezdődik."]},"ge-racha-vineyards-life-v2":{"i":"/poi-images/ge-racha-vineyards-life-v2.webp","s":"A hűvös és hegyvidéki Racsa régió híres egyedülálló szőlőfajtáiról, különösen az apró hegyi parcellákon termesztett Khvanchkara félédes vörösborról.","f":["A híres Khvanchkara bor hazája.","Nagyon korlátozott termőterület a hegyvidéki régiókban."]},"ge-batumi-dolphinarium-life-v2":{"i":"/poi-images/ge-batumi-dolphinarium-life-v2.webp","s":"A batumi kiterjedt Május 6.","f":["Eredetileg 1975-ben nyílt meg.","Modernizálás után 2011-ben nyitott újra."]},"shkhara-nature-v2":{"i":"/poi-images/shkhara-nature-v2.webp","s":"A Shkhara (Skhara) Grúzia legmagasabb hegye, mely 5201 méteres magasságával a Nagy-Kaukázus központi láncához tartozik.","f":["Grúzia legmagasabb, a Kaukázus harmadik legmagasabb csúcsa.","Elsőként egy brit-svájci csapat mászta meg 1888-ban."]},"kazbek-nature-v2":{"i":"/poi-images/kazbek-nature-v2.webp","s":"A Kazbek egy alvó rétegvulkán, mely 5000 métert meghaladó magasságával a Kaukázus egyik legmeghatározóbb csúcsa.","f":["Tengerszint feletti magassága 5054 méter.","Grúz neve ('Mkinvari') jéghegyet vagy gleccsert jelent."]},"ushba-nature-v2":{"i":"/poi-images/ushba-nature-v2.webp","s":"Az Usbát gyakran a Kaukázus Matterhornjának nevezik, mely kiemelkedő ikercsúcsáról híres.","f":["A 4710 méteres déli csúcs valamivel magasabb az északinál.","Neve szván nyelven 'Rettenetes hegyet' jelent."]},"lake-ritsa-nature-v2":{"i":"/poi-images/lake-ritsa-nature-v2.webp","s":"A Rica-tó egy mélykék hegyi tó az északnyugati Kaukázusban, egy mély, erdős völgyben fekszik Abháziában.","f":["A tó maximális mélysége eléri a 116 métert.","Sztálin a partján építtetett egy nyári rezidenciát (dácsát)."]},"paravani-lake-nature-v2":{"i":"/poi-images/paravani-lake-nature-v2.webp","s":"A Paravani-tó területét tekintve Grúzia legnagyobb tava, amely az ország déli részén, egy vulkanikus fennsíkon található.","f":["Több mint 2073 méteres tengerszint feletti magasságban fekszik.","Maximális mélysége csupán valamivel több mint 3 méter."]},"paliastomi-lake-nature-v2":{"i":"/poi-images/paliastomi-lake-nature-v2.webp","s":"A Fekete-tenger partjához közel fekvő Paliasztomi-tó a Kolkhida Nemzeti Park egyik legfontosabb vizes élőhelye.","f":["Eredetileg édesvizű tó volt, 1924-ben kapcsolták össze a tengerrel.","A terület a védett Kolkhidai vizes élőhelyekhez tartozik."]},"rioni-river-nature-v2":{"i":"/poi-images/rioni-river-nature-v2.webp","s":"A Rioni Nyugat-Grúzia fő folyója, amely a Nagy-Kaukázus gleccsereiből ered.","f":["Az ókori görögök az ő 'Phaszisz' nevéről nevezték el a fácánt.","A Rioni a maga 327 kilométerével a leghosszabb, teljes egészében Grúziában folyó folyó."]},"enguri-river-nature-v2":{"i":"/poi-images/enguri-river-nature-v2.webp","s":"Az Enguri egy vad és sebes folyó, amely Szvanéti zord szurdokain keresztül halad, mielőtt a Fekete-tengerbe ömlene.","f":["A 271,5 méter magas Enguri-gát a világ egyik legmagasabb ívgátja.","A folyó helyenként természetes határt képez a szakadár Abházia felé."]},"borjomi-kharagauli-national-park-nature-v2":{"i":"/poi-images/borjomi-kharagauli-national-park-nature-v2.webp","s":"A Kis-Kaukázusban található kiterjedt nemzeti park Európa egyik legnagyobb védett területe, érintetlen tűlevelű- és lombhullató erdeivel hódít.","f":["A park több mint 85 000 hektárnyi tiszta természeti területet foglal magába.","1995-ben, a WWF támogatásával alapították a Kaukázus első nemzeti parkjaként."]},"tusheti-national-park-nature-v2":{"i":"/poi-images/tusheti-national-park-nature-v2.webp","s":"A Nagy-Kaukázus északi lejtőin megbúvó Tuséti Nemzeti Park a zord szépség és a mélyen gyökerező alpesi hagyományok helyszíne.","f":["A fő útvonalat jelentő Abano-hágó 2850 méter magasan fekszik.","A terület felkerült az UNESCO lehetséges világörökségi helyszíneinek listájára."]},"vashlovani-national-park-nature-v2":{"i":"/poi-images/vashlovani-national-park-nature-v2.webp","s":"Grúzia legkeletibb részén a Vaslovani Nemzeti Park különleges félsivatagi tájat kínál, bizarr sziklaalakzatokkal és iszapvulkánokkal.","f":["A Vaslovani név szó szerinti jelentése: 'Almáskert'.","A terület híres a ritka kaukázusi vipera előfordulásáról."]},"mtirala-national-park-nature-v2":{"i":"/poi-images/mtirala-national-park-nature-v2.webp","s":"A Fekete-tenger partjához közeli Mtirala Nemzeti Park Grúzia legcsapadékosabb régiója, amely sűrű, szinte áthatolhatatlan gesztenye- és bükkerdeivel nyűgöz le.","f":["A Mtirala név grúzul 'Sírót' jelent, ami a rengeteg esőre utal.","A parkban évente akár 4500 milliméter csapadék is hullhat."]},"lagodekhi-protected-areas-nature-v2":{"i":"/poi-images/lagodekhi-protected-areas-nature-v2.webp","s":"A Lagodehi Grúzia legrégebbi természetvédelmi területe, a Kaukázus keleti oldalán.","f":["Már 1912-ben megalapította Ludwik Młokosiewicz orosz botanikus.","A 3000 méter magasan fekvő Fekete-szikla-tó népszerű túracélpont."]},"aragvi-river-nature-v2":{"i":"/poi-images/aragvi-river-nature-v2.webp","s":"Az Aragvi a Mcheta-Mtianeti régió lélegzetelállító tájain kanyarog, mély völgyeket formálva.","f":["Az Aragvi táplálja a hatalmas Zsinvali-víztározót, amely Tbiliszi ivóvizét biztosítja.","Völgye mentén halad a történelmi Grúz hadiút."]},"tetnuldi-nature-v2":{"i":"/poi-images/tetnuldi-nature-v2.webp","s":"A Tetnuldi egy fenséges, piramis alakú csúcs Szvanéti régiójában.","f":["A hegy lenyűgöző, 4858 méteres magasságot ér el.","Lejtőin egy modern síközpont is megnyílt."]},"kintrishi-nature-v2":{"i":"/poi-images/kintrishi-nature-v2.webp","s":"A Kintrisi természetvédelmi terület egy festői folyószurdokban bújik meg az adzsariai hegyvidéken.","f":["A terület nagy része érintetlen őserdőkből áll.","A rezervátum számos kolkhidai endemikus növényfajnak ad otthont."]},"abudelauri-lakes-nature-v2":{"i":"/poi-images/abudelauri-lakes-nature-v2.webp","s":"Az Abudelauri-tavak egy látványos magashegyi tócsoport Hevszurétiben, a fenséges Csauhi-masszívum lábánál.","f":["A fehér tó a finom gleccserpornak köszönheti színét.","A tavak júniustól szeptemberig jégmentesek és a túrázók számára látogathatók."]},"kolkheti-national-park-nature-v2":{"i":"/poi-images/kolkheti-national-park-nature-v2.webp","s":"A Kolkhida Nemzeti Park a Fekete-tenger partján húzódik, megőrizve az ókori Kolkhida egyedülálló mocsaras tájait és ártéri erdeit.","f":["A park nagy része nemzetközileg elismert Ramsari vizes élőhely.","A sűrű láperdők a jégkorszakból fennmaradt reliktumnak számítanak."]},"laila-relief-v2":{"i":"/poi-images/laila-relief-v2.webp","s":"A Laila a mintegy 4000 méteres magasságával a Szvanéti-hegység legmagasabb csúcsa.","f":["A Szvanéti-hegylánc legmagasabb csúcsa.","Népszerű célpont a kihívást kereső hegymászók körében."]},"diklosmta-relief-v2":{"i":"/poi-images/diklosmta-relief-v2.webp","s":"A Dikloszmta hatalmasan emelkedik Grúzia és Oroszország határán.","f":["Magassága eléri a 4285 métert.","A dagesztáni határon fekszik."]},"tebulosmta-relief-v2":{"i":"/poi-images/tebulosmta-relief-v2.webp","s":"A Tebuloszmta a Kelet-Kaukázus legmagasabb hegye, amely a távoli Tuséti régiót uralja.","f":["4492 méterével a régió legmagasabb hegye.","Lejtőit alpesi rétek veszik körül."]},"shota-rustaveli-peak-relief-v2":{"i":"/poi-images/shota-rustaveli-peak-relief-v2.webp","s":"A híres grúz nemzeti költőről elnevezett hegy a Közép-Kaukázus láncában fekszik.","f":["Több mint 4800 méter magas.","A 12. századi költőről kapta a nevét."]},"ailama-relief-v2":{"i":"/poi-images/ailama-relief-v2.webp","s":"Az Ailama egy jellegzetes, piramis alakú hegy a Nagy-Kaukázusban.","f":["Magassága 4547 méter.","Kihívást jelentő alpinista célpontnak számít."]},"khvamli-massif-relief-v2":{"i":"/poi-images/khvamli-massif-relief-v2.webp","s":"A Hvamli-masszívum egy impozáns mészkőfennsík, amely fenségesen magasodik a Lecshumi régió fölé.","f":["Eléri a 2002 méteres magasságot.","Jelentős szerepet játszik a grúz mitológiában."]},"didgori-mountain-relief-v2":{"i":"/poi-images/didgori-mountain-relief-v2.webp","s":"A Didgori kevésbé magasságáról, mint inkább hatalmas történelmi jelentőségéről ismert.","f":["1647 méter magas.","A híres didgori csata helyszíne."]},"mtatsminda-relief-v2":{"i":"/poi-images/mtatsminda-relief-v2.webp","s":"A szent Mtacminda hegy uralja a főváros, Tbiliszi látképét.","f":["715 méterrel emelkedik a tengerszint fölé.","Itt található a grúz írók panteonja."]},"likhi-range-relief-v2":{"i":"/poi-images/likhi-range-relief-v2.webp","s":"A Lihi-hegység összeköti a Nagy- és a Kis-Kaukázust, és Grúziát éghajlatilag, valamint földrajzilag egy keleti és egy nyugati félre osztja.","f":["Két nagy hegységrendszert köt össze.","Fontos éghajlatválasztó vonal."]},"trialeti-range-relief-v2":{"i":"/poi-images/trialeti-range-relief-v2.webp","s":"A Trialeti-hegység egy hosszan elnyúló vulkanikus hegyvonulat a Kis-Kaukázusban.","f":["Legmagasabb pontja a Saviklde hegy.","Geotermikus forrásokban gazdag."]},"javakheti-plateau-relief-v2":{"i":"/poi-images/javakheti-plateau-relief-v2.webp","s":"A dél-grúziai kiterjedt vulkanikus Dzsavaheti-fennsík hűvös, zord éghajlatáról ismert.","f":["Magassága többnyire meghaladja a 2000 métert.","Számos fontos vizes élőhelynek ad otthont."]},"iori-plateau-relief-v2":{"i":"/poi-images/iori-plateau-relief-v2.webp","s":"A délkelet-grúziai Iori-fennsík hatalmas sztyepp- és félsivatagi tájként terül el a Kura és az Alazani folyók között.","f":["Szárazság és sztyeppei éghajlat jellemzi.","A ragadozó madarak fontos élőhelye."]},"udabno-desert-relief-v2":{"i":"/poi-images/udabno-desert-relief-v2.webp","s":"Az Udabno-sivatag a történelmi David Garedzsa barlangkolostort veszi körül.","f":["A név grúzul szó szerint sivatagot jelent.","A régió gazdag ásványi anyagokban."]},"pankisi-gorge-relief-v2":{"i":"/poi-images/pankisi-gorge-relief-v2.webp","s":"A Pankiszi-szurdok egy sűrű erdőkkel szegély const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
