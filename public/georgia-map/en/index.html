.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}

.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}

.poi.g-nature circle{fill:#22c55e}

.poi.g-industry circle{fill:#fb923c}

.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}

.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}

.poi.reveal{display:initial}

.cluster circle{transition:r .12s}

.poi.in-cluster{display:none}

.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}

.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}

.popup .single{display:none}.popup .list{display:none}

humi-cities-v2.webp","s":"Sokhumi is the capital of the breakaway region of Abkhazia and was once a thriving resort on the Black Sea.","f":["The Sokhumi Botanical Garden was founded in 1840.","Many of the historical spa hotels stand empty today."]},"ge-khashuri-cities-v2":{"i":"/poi-images/ge-khashuri-cities-v2.webp","s":"Khashuri is an important transport hub in central Georgia where railway and road networks intersect.","f":["Became significant in 1872 with the construction of the railway.","The historical Surami Castle is located near the city."]},"ge-samtredia-cities-v2":{"i":"/poi-images/ge-samtredia-cities-v2.webp","s":"Samtredia is a bustling city in the Imereti plain, known for its importance as a railway hub.","f":["Officially received city rights in the year 1921.","The Rioni River flows not far from the city center."]},"ge-senaki-cities-v2":{"i":"/poi-images/ge-senaki-cities-v2.webp","s":"Senaki is a significant city in the Mingrelia region and an important military base.","f":["Between 1933 and 1989, the city was named Mikha Tskhakaya.","The Senaki Theater was built in a neoclassical style."]},"ge-zestafoni-cities-v2":{"i":"/poi-images/ge-zestafoni-cities-v2.webp","s":"Zestafoni is an industrial city in Imereti, whose economy is closely linked to the processing of manganese ore.","f":["The local ferroalloy plant is the largest in the country.","Zestafoni is also known for its excellent wine-growing regions."]},"ge-marneuli-cities-v2":{"i":"/poi-images/ge-marneuli-cities-v2.webp","s":"Marneuli is the administrative center of a multicultural region in Kvemo Kartli, with a predominantly Azerbaijani population.","f":["The city is a center of agricultural trade.","The Novruz festival is celebrated prominently in Marneuli every year."]},"ge-telavi-cities-v2":{"i":"/poi-images/ge-telavi-cities-v2.webp","s":"Telavi is the historical and administrative center of the Kakheti wine region.","f":["The Batonis Tsikhe fortress was the residence of Kakhetian kings.","A 900-year-old plane tree stands in the center of Telavi."]},"ge-akhaltsikhe-cities-v2":{"i":"/poi-images/ge-akhaltsikhe-cities-v2.webp","s":"Akhaltsikhe is a multicultural city in southern Georgia, shaped by Georgian, Armenian, and Ottoman influences.","f":["The restored Rabati Castle is a massive historical complex.","The city was under Ottoman rule for over 200 years."]},"ge-kobuleti-cities-v2":{"i":"/poi-images/ge-kobuleti-cities-v2.webp","s":"Kobuleti is a popular seaside resort in Adjara with a kilometers-long pebble beach.","f":["The coastal promenade is one of the longest in the Caucasus.","During the Soviet era, Kobuleti was a renowned spa resort."]},"ge-ozurgeti-cities-v2":{"i":"/poi-images/ge-ozurgeti-cities-v2.webp","s":"Ozurgeti is the center of the Guria region, surrounded by picturesque tea plantations and hazelnut groves.","f":["Guria was once the center of Georgian tea cultivation.","The historical drama theater dominates the city center."]},"ge-tskhaltubo-cities-v2":{"i":"/poi-images/ge-tskhaltubo-cities-v2.webp","s":"Tskhaltubo is a formerly world-famous spa town, valued for its radon-infused mineral springs.","f":["Stalin himself regularly visited the baths in Tskhaltubo.","Many sanatoriums are gradually being restored today."]},"ge-kaspi-cities-v2":{"i":"/poi-images/ge-kaspi-cities-v2.webp","s":"Kaspi is a historical small town in the Shida Kartli region, playing an important role in cement production.","f":["The cement plant in Kaspi is one of the largest in Georgia.","The ancient cave city of Uplistsikhe is located near Kaspi."]},"ge-tkibuli-cities-v2":{"i":"/poi-images/ge-tkibuli-cities-v2.webp","s":"Tkibuli is a mining town in western Georgia, surrounded by dense forests and steep mountains.","f":["Coal mining began here in the mid-19th century.","The architecture in the center strongly resembles the Soviet era."]},"ge-chiatura-cities-v2":{"i":"/poi-images/ge-chiatura-cities-v2.webp","s":"Chiatura is a unique mountain town famous for its extensive network of Soviet cable cars.","f":["It was founded as a center for the manganese industry.","Some of the historical cable cars were recently modernized."]},"ge-sagarejo-cities-v2":{"i":"/poi-images/ge-sagarejo-cities-v2.webp","s":"Sagarejo is the gateway to the Kakheti wine region and a city with an agricultural character.","f":["The David Gareja monastery is located south of the city.","Viticulture is the main source of income for the local population."]},"ge-gardabani-cities-v2":{"i":"/poi-images/ge-gardabani-cities-v2.webp","s":"Gardabani is an industrial city near the Azerbaijani border, operating an important thermal power plant.","f":["The Gardabani power plant supplies electricity to large parts of Georgia.","There are historical cave settlements in the area."]},"ge-borjomi-cities-v2":{"i":"/poi-images/ge-borjomi-cities-v2.webp","s":"Borjomi is a picturesque resort town globally renowned for its salty, healing mineral water.","f":["Borjomi water is exported to over 40 countries.","The Romanov tsarist dynasty loved spending their summers here."]},"ge-tqvarcheli-cities-v2":{"i":"/poi-images/ge-tqvarcheli-cities-v2.webp","s":"Tqvarcheli is a mountain-enclosed town in Abkhazia, known for its coal mining.","f":["The architecture is characterized by neoclassical Stalinist buildings.","The town was officially founded in 1942."]},"ge-khoni-cities-v2":{"i":"/poi-images/ge-khoni-cities-v2.webp","s":"Khoni is a small town in the western Georgian lowlands, distinguished by its traditional silk production and agricultural products.","f":["Near Khoni lies the famous Okatse Canyon.","The church in the city center has a rich historical significance."]},"ge-bolnisi-cities-v2":{"i":"/poi-images/ge-bolnisi-cities-v2.webp","s":"Bolnisi is a town in Kvemo Kartli, founded by German settlers in the 19th century as Katharinenfeld.","f":["The Bolnisi Sioni church dates back to the 5th century.","The local museum highlights German-Georgian history."]},"ge-akhalkalaki-cities-v2":{"i":"/poi-images/ge-akhalkalaki-cities-v2.webp","s":"Akhalkalaki is located on the Javakheti Plateau near the Armenian border and has a predominantly Armenian population.","f":["The fortress of Akhalkalaki dates back to the 11th century.","The region is known for its excellent potatoes."]},"ge-gurjaani-cities-v2":{"s":"Gurjaani is a lively winemaking center in the Kakheti region, surrounded by endless vineyards.","f":["The Kvelatsminda church is unique with its two domes.","Famous Georgian wine varieties are produced in the city."]},"ge-mtskheta-cities-v2":{"i":"/poi-images/ge-mtskheta-cities-v2.webp","s":"Mtskheta is one of the oldest cities in Georgia and the former capital of the Iberian kingdom.","f":["The Svetitskhoveli Cathedral is a UNESCO World Heritage Site.","The Jvari Monastery towers majestically over the city."]},"batumi-sea-port-economic-v2":{"i":"/poi-images/batumi-sea-port-economic-v2.webp","s":"Batumi Sea Port is one of Georgia's most important Black Sea ports, serving as a central hub for the transit of oil and cargo.","f":["Major transit point for Caspian oil.","One of the oldest ports in the region."]},"poti-sea-port-economic-v2":{"i":"/poi-images/poti-sea-port-economic-v2.webp","s":"Poti Sea Port is a major transport hub and Georgia's largest port for container and bulk cargo handling.","f":["Plays a key role in the TRACECA Eurasian transport corridor.","Main gateway for Georgian maritime trade."]},"chiatura-manganese-mine-economic-v2":{"i":"/poi-images/chiatura-manganese-mine-economic-v2.webp","s":"Chiatura Manganese Mine is one of the world's largest manganese ore deposits, operating for over a century.","f":["The town is known for its network of old cable cars.","Supplies raw materials for Georgian heavy industry."]},"rustavi-metallurgical-plant-economic-v2":{"i":"/poi-images/rustavi-metallurgical-plant-economic-v2.webp","s":"The Rustavi Metallurgical Plant is Georgia's largest heavy industry center, specializing in steel and iron production.","f":["The city of Rustavi was built around this plant.","A major exporter of steel products in the region."]},"zestafoni-ferroalloy-plant-economic-v2":{"i":"/poi-images/zestafoni-ferroalloy-plant-economic-v2.webp","s":"The Zestafoni plant processes manganese ore from Chiatura and is one of the world's largest producers of silicomanganese.","f":["Silicomanganese is a crucial component in steel production.","The plant is a major employer in the Imereti region."]},"kulevi-oil-terminal-economic-v2":{"i":"/poi-images/kulevi-oil-terminal-economic-v2.webp","s":"The Kulevi Oil Terminal is a major facility for loading Caspian petroleum onto tankers in the Black Sea.","f":["The terminal was opened in the year 2008.","Features modern high-capacity storage tanks."]},"supsa-sea-terminal-economic-v2":{"i":"/poi-images/supsa-sea-terminal-economic-v2.webp","s":"The Supsa Terminal is the endpoint of the Baku-Supsa oil pipeline, where petroleum from Azerbaijan is loaded onto ships.","f":["The facility uses offshore buoy systems for loading.","Plays an important role in Caucasian energy infrastructure."]},"tkibuli-coal-mine-economic-v2":{"i":"/poi-images/tkibuli-coal-mine-economic-v2.webp","s":"Tkibuli is the center of Georgian coal mining, extracting hard coal primarily for domestic needs.","f":["Coal mining began here in the mid-19th century.","Provides coal for local cement and thermal power plants."]},"madneuli-mine-economic-v2":{"i":"/poi-images/madneuli-mine-economic-v2.webp","s":"The Madneuli mine near Kazreti is Georgia's most important source of copper and gold, operated as an open-pit mine.","f":["The extracted metals are important Georgian export goods.","The open-pit operation has significantly altered the landscape."]},"poti-fiz-economic-v2":{"i":"/poi-images/poti-fiz-economic-v2.webp","s":"The Poti Free Industrial Zone offers tax incentives and attracts international manufacturing companies.","f":["The first free industrial zone established in the Caucasus.","Directly connected to the seaport and railway network."]},"kutaisi-fiz-economic-v2":{"i":"/poi-images/kutaisi-fiz-economic-v2.webp","s":"This industrial zone in Kutaisi promotes local and foreign investments in technology, textiles, and household appliances.","f":["Built on the site of a former automobile factory.","Hosts companies from various industrial sectors."]},"zhinvali-hpp-economic-v2":{"i":"/poi-images/zhinvali-hpp-economic-v2.webp","s":"The Zhinvali Dam impounds the Aragvi River, producing clean hydroelectric power for the Georgian capital, Tbilisi.","f":["The reservoir also supplies Tbilisi with drinking water.","The facility was completed in the 1980s."]},"gardabani-tpp-economic-v2":{"i":"/poi-images/gardabani-tpp-economic-v2.webp","s":"The combined cycle gas turbine power plant in Gardabani ensures Georgia's energy security, especially during winter.","f":["It is one of the most modern power plants in the region.","Reduces dependence on imported electricity."]},"larsi-border-crossing-economic-v2":{"i":"/poi-images/larsi-border-crossing-economic-v2.webp","s":"The Larsi border crossing in the Darial Gorge is the most important land route for trade between Georgia and Russia.","f":["The only officially open border crossing to Russia.","Often blocked by heavy snowfall in winter."]},"sarpi-border-crossing-economic-v2":{"i":"/poi-images/sarpi-border-crossing-economic-v2.webp","s":"Sarpi is a busy border crossing on the Black Sea coast and plays a central role in trade with Turkey.","f":["The Georgian customs building features unique, modern architecture.","One of the busiest transport hubs in the country."]},"lilo-city-market-economic-v2":{"i":"/poi-images/lilo-city-market-economic-v2.webp","s":"Lilo Market on the outskirts of Tbilisi is the largest wholesale and retail market in Transcaucasia for consumer goods.","f":["Merchants from all over the Caucasus shop here.","A major driver for both informal and formal trade."]},"borjomi-bottling-plant-economic-v2":{"i":"/poi-images/borjomi-bottling-plant-economic-v2.webp","s":"The factories in Borjomi bottle the famous volcanic mineral water, exporting it to dozens of countries worldwide.","f":["Borjomi water is one of Georgia's most important export items.","Industrial bottling began as early as the year 1890."]},"batumi-oil-terminal-economic-v2":{"i":"/poi-images/batumi-oil-terminal-economic-v2.webp","s":"The oil terminal in Batumi processes and stores petroleum products from Central Asia and the Caucasus for international maritime transport.","f":["The facility has direct railway connections.","A historical center of the global oil industry since the late 19th century."]},"kaspi-cement-plant-economic-v2":{"i":"/poi-images/kaspi-cement-plant-economic-v2.webp","s":"The cement plant in Kaspi is a pillar of the Georgian building materials industry, supplying major infrastructure projects in the country.","f":["The region's limestone deposits provide ideal raw materials.","Modern filtration systems now reduce emissions."]},"samgori-oil-field-economic-v2":{"i":"/poi-images/samgori-oil-field-economic-v2.webp","s":"The Samgori oil field near Tbilisi is the largest domestic source of petroleum extraction in Georgia.","f":["The discovery of the field in the 20th century reduced energy imports.","Extraction volumes are lower today than in the past."]},"ge-narikala-history-v2":{"i":"/poi-images/ge-narikala-history-v2.webp","s":"Narikala is an ancient fortress towering over the capital Tbilisi, protecting the city since the 4th century.","f":["Founded in the 4th century as a Persian citadel.","An earthquake destroyed large parts of the complex in 1827."]},"ge-svetitskhoveli-history-v2":{"i":"/poi-images/ge-svetitskhoveli-history-v2.webp","s":"The majestic Svetitskhoveli Cathedral in Mtskheta is a masterpiece of early medieval Georgian architecture and a UNESCO World Heritage site.","f":["Built in the 11th century under the architect Arsukisdze.","Traditional coronation and burial site of the Georgian kings."]},"ge-uplistsikhe-history-v2":{"i":"/poi-images/ge-uplistsikhe-history-v2.webp","s":"Uplistsikhe is an impressive ancient cave city carved into rock in eastern Georgia.","f":["One of the oldest urban settlements in Georgia.","A mixture of pagan and Christian cave architecture."]},"ge-vardzia-history-v2":{"i":"/poi-images/ge-vardzia-history-v2.webp","s":"The cave city of Vardzia is a spectacular monastery complex carved into the steep wall of Mount Erusheti in the 12th century.","f":["Originally, the city had up to thirteen storeys.","In 1283, an earthquake tore off the outer wall and exposed the monastery."]},"ge-gelati-history-v2":{"i":"/poi-images/ge-gelati-history-v2.webp","s":"Gelati Monastery near Kutaisi was one of Georgia's first cultural and spiritual centers.","f":["UNESCO World Heritage site with outstanding mosaics and frescoes.","King David the Builder is buried in the entrance gate of the monastery."]},"ge-bagrati-history-v2":{"i":"/poi-images/ge-bagrati-history-v2.webp","s":"Bagrati Cathedral in Kutaisi majestically crowns the Ukimerioni Hill.","f":["Named after King Bagrat III, the first king of united Georgia.","Severely damaged by Ottoman troops in 1692 and restored in the 20th century."]},"ge-gergeti-history-v2":{"i":"/poi-images/ge-gergeti-history-v2.webp","s":"Gergeti Trinity Church is breathtakingly situated at over 2,100 meters above sea level in front of the massive Mount Kazbek.","f":["During times of invasion, valuable relics from Mtskheta were hidden here.","Accessible via a steep mountain road or a picturesque hike."]},"ge-dadiani-history-v2":{"i":"/poi-images/ge-dadiani-history-v2.webp","s":"The Dadiani Palace in Zugdidi was the residence of the noble Dadiani family, who ruled historic Samegrelo.","f":["The botanical garden of the palace was created in the 19th century.","A descendant of the family married Napoleon's nephew, bringing European relics to Georgia."]},"ge-mutso-history-v2":{"i":"/poi-images/ge-mutso-history-v2.webp","s":"The fascinating ruins of Mutso seem to cling to a steep rocky ridge in the remote mountain region of Khevsureti.","f":["Considered one of the most impressive architectural monuments of medieval Georgia.","It was recently restored as part of a comprehensive project."]},"ge-gremi-history-v2":{"i":"/poi-images/ge-gremi-history-v2.webp","s":"Gremi was the flourishing capital of the Kingdom of Kakheti in the 16th century.","f":["Built in 1565 by King Levan of Kakheti.","The city was razed to the ground by the troops of Shah Abbas I in 1615."]},"ge-jvari-history-v2":{"i":"/poi-images/ge-jvari-history-v2.webp","s":"The 6th-century Jvari Monastery rises on a rocky cliff at the confluence of the Kura and Aragvi rivers.","f":["The name Jvari literally means 'cross' in Georgian.","It is a UNESCO World Heritage site together with Mtskheta."]},"ge-rabati-history-v2":{"i":"/poi-images/ge-rabati-history-v2.webp","s":"Rabati Castle in Akhaltsikhe is an impressive multicultural complex.","f":["Founded in the 9th century under the name Lomisa.","It underwent a comprehensive and elaborate restoration in 2012."]},"ge-khertvisi-history-v2":{"i":"/poi-images/ge-khertvisi-history-v2.webp","s":"Khertvisi Fortress, one of the oldest fortresses in Georgia, sits dramatically at the confluence of two deep river gorges.","f":["Built on a strategically perfect rocky promontory in the 2nd century BC.","According to legend, Alexander the Great besieged the site."]},"ge-david-gareja-history-v2":{"i":"/poi-images/ge-david-gareja-history-v2.webp","s":"The David Gareja rock monastery is located in a semi-desert landscape on the border with Azerbaijan.","f":["The complex consists of hundreds of caves, chapels, and living quarters.","It was a flourishing center of monastic life for centuries."]},"ge-gonio-history-v2":{"i":"/poi-images/ge-gonio-history-v2.webp","s":"Gonio Fortress on the Black Sea coast is one of the oldest preserved Roman fortifications in the Caucasus.","f":["First mentioned by Pliny the Elder in the 1st century.","According to tradition, the Apostle Matthias is buried within the fortress walls."]},"ge-shatili-history-v2":{"i":"/poi-images/ge-shatili-history-v2.webp","s":"The mysterious fortified village of Shatili in the deep Caucasus Mountains is a labyrinth of closely connected residential towers.","f":["It originated between the 7th and 13th centuries in extreme isolation.","It is one of the most outstanding examples of Georgian vernacular architecture."]},"ge-ananuri-history-v2":{"i":"/poi-images/ge-ananuri-history-v2.webp","s":"The heavily fortified Ananuri Fortress sits picturesquely above the Zhinvali Reservoir.","f":["The complex includes two churches with fine stone carvings on the facades.","Despite many destructions, the battlements and defensive towers are excellently preserved."]},"ge-didgori-history-v2":{"i":"/poi-images/ge-didgori-history-v2.webp","s":"The Didgori Monument marks the historic battlefield where King David the Builder won an unexpected and overwhelming victory over the massive Seljuk army in 1121.","f":["This victory heralded the Golden Age of Georgia.","Every year on August 12, the day of the battle is celebrated as a national holiday."]},"ge-kartlis-deda-history-v2":{"i":"/poi-images/ge-kartlis-deda-history-v2.webp","s":"The monumental statue 'Kartlis Deda' has watched over Tbilisi since 1958.","f":["The monument, made of aluminum, is 20 meters high.","Erected to celebrate the 1,500th anniversary of Tbilisi."]},"ge-alaverdi-history-v2":{"i":"/poi-images/ge-alaverdi-history-v2.webp","s":"The impressive Alaverdi Cathedral in the heart of the fertile Alazani Valley was the tallest church building in Georgia until the 21st century.","f":["The 11th-century cathedral reaches a height of over 50 meters.","The monastery produces wine in traditional amphorae (Qvevri), a technique with UNESCO status."]},"bridge-of-peace-landmarks-v2":{"i":"/poi-images/bridge-of-peace-landmarks-v2.webp","s":"The Bridge of Peace in Tbilisi is a striking, bow-shaped pedestrian bridge made of glass and steel over the Kura River, connecting the old town with Rike Park.","f":["Designed by the architect Michele De Lucchi.","The bridge is 150 meters long and opened in 2010."]},"abanotubani-landmarks-v2":{"i":"/poi-images/abanotubani-landmarks-v2.webp","s":"The historic bath district of Abanotubani in Tbilisi is famous for its traditional, dome-shaped bathhouses fed by natural hot sulphur springs.","f":["The baths are fed by hot sulphur springs.","Famous visitors included Alexander Pushkin and Alexandre Dumas."]},"chronicle-of-georgia-landmarks-v2":{"i":"/poi-images/chronicle-of-georgia-landmarks-v2.webp","s":"The massive monument Chronicle of Georgia sits atop a hill near the Tbilisi Sea, depicting scenes from Georgian history and religion on giant pillars.","f":["The monument was created in 1985 by artist Zurab Tsereteli.","The impressive pillars are over 30 meters high."]},"gabriadze-theater-landmarks-v2":{"i":"/poi-images/gabriadze-theater-landmarks-v2.webp","s":"The picturesque marionette theater of Rezo Gabriadze in the old town of Tbilisi is famous for its leaning clock tower, from which an angel appears every hour.","f":["The theater was founded in 1981 by Rezo Gabriadze.","The distinctive leaning clock tower was added in 2010."]},"tbilisi-tv-tower-landmarks-v2":{"i":"/poi-images/tbilisi-tv-tower-landmarks-v2.webp","s":"The Tbilisi TV Broadcasting Tower on Mount Mtatsminda is a landmark of the city, visible from almost everywhere in the capital at night due to its colorful illumination.","f":["The tower reaches a height of 274 meters.","It was built in 1972 replacing an older transmission tower."]},"ali-and-nino-statue-landmarks-v2":{"i":"/poi-images/ali-and-nino-statue-landmarks-v2.webp","s":"The kinetic sculpture of Ali and Nino in Batumi symbolizes a tragic love story.","f":["The kinetic sculpture is 8 meters high.","It was designed by artist Tamara Kvesitadze."]},"alphabet-tower-landmarks-v2":{"i":"/poi-images/alphabet-tower-landmarks-v2.webp","s":"The 130-meter-high Alphabet Tower in Batumi celebrates the uniqueness of the Georgian script.","f":["The tower is 130 meters high and was completed in 2011.","It celebrates the Georgian alphabet with its 33 letters."]},"batumi-botanical-garden-landmarks-v2":{"i":"/poi-images/batumi-botanical-garden-landmarks-v2.webp","s":"Located at the Green Cape, the Batumi Botanical Garden is one of the largest and most diverse in the world.","f":["The garden was officially opened in 1912.","It covers an area of 108 hectares."]},"batumi-boulevard-landmarks-v2":{"i":"/poi-images/batumi-boulevard-landmarks-v2.webp","s":"The historic Batumi Boulevard stretches for several kilometers along the coast, attracting visitors with palm trees, dancing fountains, and numerous cafes.","f":["The construction of the boulevard began in 1881.","The promenade stretches for a length of about 7 kilometers."]},"katskhi-pillar-landmarks-v2":{"i":"/poi-images/katskhi-pillar-landmarks-v2.webp","s":"The Katskhi Pillar is a 40-meter-high natural limestone monolith in Imereti.","f":["The limestone monolith is about 40 meters high.","The small church on the top dates back to the 9th or 10th century."]},"prometheus-cave-landmarks-v2":{"i":"/poi-images/prometheus-cave-landmarks-v2.webp","s":"The Prometheus Cave near Kutaisi is one of Georgia's most fascinating natural wonders.","f":["The cave was discovered by speleologists in 1984.","A 1.4-kilometer trail is prepared for visitors."]},"martvili-canyon-landmarks-v2":{"i":"/poi-images/martvili-canyon-landmarks-v2.webp","s":"The Martvili Canyon impresses with its emerald green water and stunning waterfalls.","f":["The canyon is up to 40 meters deep.","Visitors can navigate part of the river using boats."]},"okatse-canyon-landmarks-v2":{"i":"/poi-images/okatse-canyon-landmarks-v2.webp","s":"The Okatse Canyon offers an unforgettable experience thanks to a spectacular suspended walkway attached to the cliff wall high above the ground, providing incredible views.","f":["The suspended pedestrian walkway is 780 meters long.","The canyon itself is over 50 meters deep in some places."]},"sataplia-cave-landmarks-v2":{"i":"/poi-images/sataplia-cave-landmarks-v2.webp","s":"The Sataplia Nature Reserve is famous for its well-preserved dinosaur footprints and a beautiful karst cave.","f":["The reserve was founded in 1935 to protect the cave.","It protects fossilized dinosaur footprints."]},"svaneti-towers-mestia-landmarks-v2":{"i":"/poi-images/svaneti-towers-mestia-landmarks-v2.webp","s":"The medieval defensive towers in the mountainous region of Svaneti shape the unmistakable landscape of Mestia.","f":["Most of the towers were built between the 9th and 12th centuries.","The region has been a UNESCO World Heritage site since 1996."]},"enguri-dam-landmarks-v2":{"i":"/poi-images/enguri-dam-landmarks-v2.webp","s":"At 271.5 meters, the Enguri Dam is one of the highest arch dams in the world.","f":["The arch dam reaches a height of 271.5 meters.","Its construction was fully completed in 1987."]},"dashbashi-canyon-landmarks-v2":{"i":"/poi-images/dashbashi-canyon-landmarks-v2.webp","s":"The picturesque Dashbashi Canyon attracts visitors with its numerous cascading waterfalls.","f":["The glass Diamond Bridge is 240 meters long.","The bridge was opened to the public in the year 2022."]},"sighnaghi-city-wall-landmarks-v2":{"i":"/poi-images/sighnaghi-city-wall-landmarks-v2.webp","s":"The impressive city wall of Sighnaghi stretches for over four kilometers around the picturesque town.","f":["The fortress wall has a total length of 4.5 kilometers.","It is equipped with 28 watchtowers."]},"makhuntseti-waterfall-landmarks-v2":{"i":"/poi-images/makhuntseti-waterfall-landmarks-v2.webp","s":"The Makhuntseti Waterfall in the Adjara region is a popular excursion destination.","f":["The water plunges from a height of 33.5 meters.","The historic Queen Tamar Bridge is located nearby."]},"gveleti-waterfall-landmarks-v2":{"i":"/poi-images/gveleti-waterfall-landmarks-v2.webp","s":"Hidden in the rugged mountainous landscape of Stepantsminda lies the Gveleti Waterfall.","f":["The name Gveleti translates to Place of snakes.","There are two main waterfalls in this area."]},"ge-mtirala-national-park-life-v2":{"i":"/poi-images/ge-mtirala-national-park-life-v2.webp","s":"This national park in Adjara owes its name to the rainy microclimate.","f":["The name translates to crying.","High annual rainfall."]},"ge-vashlovani-national-park-life-v2":{"i":"/poi-images/ge-vashlovani-national-park-life-v2.webp","s":"The national park in eastern Georgia offers a savanna-like landscape with bizarre rock formations and mud volcanoes.","f":["Known for semi-desert landscapes.","Home to leopards and striped hyenas."]},"ge-lagodekhi-reserve-life-v2":{"i":"/poi-images/ge-lagodekhi-reserve-life-v2.webp","s":"One of the oldest nature reserves in the Caucasus captivates with its primeval forests and spectacular waterfalls.","f":["Founded in the year 1912.","Borders Azerbaijan and Russia."]},"ge-tusheti-national-park-life-v2":{"i":"/poi-images/ge-tusheti-national-park-life-v2.webp","s":"The remote mountainous region of Tusheti is only accessible in the summer months and preserves a pristine natural setting.","f":["Located at an altitude of over 2000 meters.","Accessed via the dangerous Abano Pass."]},"ge-kolkheti-national-park-life-v2":{"i":"/poi-images/ge-kolkheti-national-park-life-v2.webp","s":"The vast wetlands and swamp forests on the Black Sea coast are a global refuge for migratory birds.","f":["Important wintering area for birds.","Includes Lake Paliastomi."]},"ge-javakheti-reserve-life-v2":{"i":"/poi-images/ge-javakheti-reserve-life-v2.webp","s":"The volcanic plateau in southern Georgia is characterized by numerous lakes and a harsh, treeless landscape.","f":["Located on a volcanic plateau.","Home to many endemic bird species."]},"ge-kintrishi-reserve-life-v2":{"i":"/poi-images/ge-kintrishi-reserve-life-v2.webp","s":"Hidden in the mountains of Adjara, this reserve protects pristine relict forests and deep river valleys.","f":["Very humid subtropical climate.","Home to rare Caucasian salamanders."]},"ge-algeti-national-park-life-v2":{"i":"/poi-images/ge-algeti-national-park-life-v2.webp","s":"The area in the forested valley of the Algeti River offers a charming combination of nature and historical monuments.","f":["Protects dense spruce and fir forests.","Rich in archaeological sites."]},"ge-machakhela-national-park-life-v2":{"i":"/poi-images/ge-machakhela-national-park-life-v2.webp","s":"This near-natural area near the Turkish border preserves unique mountain forests and traditional cultural landscapes.","f":["Borders directly on Turkey.","Known for old fortress ruins."]},"ge-tbilisi-botanical-garden-life-v2":{"i":"/poi-images/ge-tbilisi-botanical-garden-life-v2.webp","s":"Nestled in a deep gorge behind the Narikala Fortress, this green oasis has been a retreat for centuries.","f":["Founded in the year 1845.","Once a royal palace garden."]},"ge-rike-park-life-v2":{"i":"/poi-images/ge-rike-park-life-v2.webp","s":"This modern city park on the banks of the Kura River in Tbilisi impresses with its futuristic design.","f":["Futuristic concert hall located in the park.","Starting point of the cable car to Narikala Fortress."]},"ge-vake-park-life-v2":{"i":"/poi-images/ge-vake-park-life-v2.webp","s":"As the largest public park in Tbilisi, Vake Park is a popular recreation destination with wide avenues, fountains, and memorials.","f":["Opened in the year 1946.","Huge statue of Victory in World War II."]},"ge-mtatsminda-park-life-v2":{"i":"/poi-images/ge-mtatsminda-park-life-v2.webp","s":"Perched high above Tbilisi, this historic amusement park offers rides for all ages and spectacular panoramic views.","f":["Founded in the 1930s.","Ferris wheel on the edge of the cliff."]},"ge-mushtaidi-park-life-v2":{"i":"/poi-images/ge-mushtaidi-park-life-v2.webp","s":"One of the oldest parks in Tbilisi was established by a Persian prince and is home to centuries-old trees and a historic children's railway.","f":["Founded in the 1830s.","Named after Mir Fatah Agha."]},"ge-tsitsinatela-life-v2":{"i":"/poi-images/ge-tsitsinatela-life-v2.webp","s":"This glowing amusement park near the Black Sea coast comes to life especially after sunset.","f":["The name means firefly.","Opens in the evenings during summer months."]},"ge-kakheti-vineyards-life-v2":{"i":"/poi-images/ge-kakheti-vineyards-life-v2.webp","s":"The endless vineyards in the Alazani Valley form the agricultural heart of Georgian wine production.","f":["Georgia is considered the cradle of wine.","Qvevri method is UNESCO cultural heritage."]},"ge-imereti-tea-plantations-life-v2":{"i":"/poi-images/ge-imereti-tea-plantations-life-v2.webp","s":"The rolling hills of Imereti and Guria were once the center of Soviet tea production.","f":["Tea cultivation began in the 19th century.","The climate is ideal for tea bushes."]},"ge-guria-citrus-orchards-life-v2":{"i":"/poi-images/ge-guria-citrus-orchards-life-v2.webp","s":"The mild subtropical climate of the Guria region on the Black Sea offers perfect conditions for growing tangerines and oranges, whose scent fills the air in late autumn.","f":["Main growing area for Georgian tangerines.","Harvest season begins in November."]},"ge-racha-vineyards-life-v2":{"i":"/poi-images/ge-racha-vineyards-life-v2.webp","s":"The cool and mountainous Racha region is famous for its unique grape varieties, particularly the semi-sweet red wine Khvanchkara grown on tiny mountain plots.","f":["Home to the famous Khvanchkara wine.","Very limited cultivation area in mountainous regions."]},"ge-batumi-dolphinarium-life-v2":{"i":"/poi-images/ge-batumi-dolphinarium-life-v2.webp","s":"Nestled in the vast 6 May Park in Batumi, this popular dolphinarium offers entertaining and educational shows that are highly sought after, especially by families with children.","f":["Originally opened in the year 1975.","Reopened after modernization in 2011."]},"shkhara-nature-v2":{"i":"/poi-images/shkhara-nature-v2.webp","s":"Mount Shkhara is the highest peak in Georgia at 5,201 meters, located in the central part of the Greater Caucasus mountain range.","f":["The highest point in Georgia and third highest in the Caucasus.","First successfully summited in 1888 by a British-Swiss team."]},"kazbek-nature-v2":{"i":"/poi-images/kazbek-nature-v2.webp","s":"Mount Kazbek is a dormant stratovolcano and, at over 5,000 meters, one of the most prominent peaks in the Caucasus.","f":["Reaches an elevation of 5,054 meters above sea level.","Its Georgian name 'Mkinvari' translates to ice mountain or glacier."]},"ushba-nature-v2":{"i":"/poi-images/ushba-nature-v2.webp","s":"Mount Ushba is often referred to as the Matterhorn of the Caucasus, distinguished by its prominent double summit.","f":["The south summit is slightly higher at 4,710 meters than the north summit.","Its name translates to 'Terrible Mountain' in the Svan language."]},"lake-ritsa-nature-v2":{"i":"/poi-images/lake-ritsa-nature-v2.webp","s":"Lake Ritsa is a deep blue mountain lake in the northwestern Caucasus, nestled in a deep, forested valley in Abkhazia.","f":["The lake reaches a maximum depth of 116 meters.","Joseph Stalin had a summer residence (dacha) built on its shores."]},"paravani-lake-nature-v2":{"i":"/poi-images/paravani-lake-nature-v2.webp","s":"Paravani Lake is the largest lake in Georgia by surface area, located on a volcanic plateau in the south of the country.","f":["Located at an elevation of over 2,073 meters above sea level.","Its maximum depth is only slightly over 3 meters."]},"paliastomi-lake-nature-v2":{"i":"/poi-images/paliastomi-lake-nature-v2.webp","s":"Paliastomi Lake is located near the Black Sea coast and is a significant wetland area within the Kolkheti National Park.","f":["Originally a freshwater lake, it was connected to the sea in 1924.","The area belongs to the protected Kolkheti wetlands zone."]},"rioni-river-nature-v2":{"i":"/poi-images/rioni-river-nature-v2.webp","s":"The Rioni is the main river of western Georgia, originating from the glaciers of the Greater Caucasus.","f":["The ancient Greeks derived the word for pheasant from its historical name 'Phasis'.","At 327 kilometers, the Rioni is the longest river flowing entirely within Georgia."]},"enguri-river-nature-v2":{"i":"/poi-images/enguri-river-nature-v2.webp","s":"The Enguri is a wild and fast-flowing river that runs through the rugged gorges of Svaneti before emptying into the Black Sea.","f":["The Enguri arch dam is one of the highest in the world at 271.5 meters.","The river partially forms the boundary with the breakaway region of Abkhazia."]},"borjomi-kharagauli-national-park-nature-v2":{"i":"/poi-images/borjomi-kharagauli-national-park-nature-v2.webp","s":"This vast national park in the Lesser Caucasus is one of the largest protected areas in Europe, captivating with its pristine coniferous and deciduous forests.","f":["The park covers more than 85,000 hectares of pure natural area.","It was established in 1995 with the support of the WWF as the first national park in the Caucasus."]},"tusheti-national-park-nature-v2":{"i":"/poi-images/tusheti-national-park-nature-v2.webp","s":"Hidden on the northern slopes of the Greater Caucasus, Tusheti National Park is a place of rugged beauty and deep-rooted alpine traditions.","f":["The Abano Pass, the main access route, is situated at an elevation of 2,850 meters.","The area has been added to the tentative list of UNESCO World Heritage sites."]},"vashlovani-national-park-nature-v2":{"i":"/poi-images/vashlovani-national-park-nature-v2.webp","s":"Vashlovani National Park in the far east of Georgia offers an extraordinary semi-desert landscape with bizarre rock formations and mud volcanoes.","f":["The name Vashlovani literally translates to 'Apple Garden'.","The area is known for hosting the rare Caucasian viper."]},"mtirala-national-park-nature-v2":{"i":"/poi-images/mtirala-national-park-nature-v2.webp","s":"Mtirala National Park near the Black Sea coast is the wettest region in Georgia, captivating visitors with its dense, almost impenetrable rain forests of chestnut and beech trees.","f":["The name Mtirala means 'The Weeping One' in Georgian, referring to the heavy rainfall.","The park receives up to 4,500 millimeters of precipitation annually."]},"lagodekhi-protected-areas-nature-v2":{"i":"/poi-images/lagodekhi-protected-areas-nature-v2.webp","s":"Lagodekhi is the oldest nature reserve in Georgia, located on the eastern flank of the Caucasus.","f":["It was founded back in 1912 by the Russian botanist Ludwik Młokosiewicz.","The Black Rock Lake at an elevation of 3,000 meters is a popular hiking destination."]},"aragvi-river-nature-v2":{"i":"/poi-images/aragvi-river-nature-v2.webp","s":"The Aragvi meanders through the breathtaking landscape of the Mtskheta-Mtianeti region, carving deep valleys along its course.","f":["The Aragvi feeds the massive Zhinwali Reservoir, which provides drinking water for Tbilisi.","The historic Georgian Military Highway runs along its valley."]},"tetnuldi-nature-v2":{"i":"/poi-images/tetnuldi-nature-v2.webp","s":"Mount Tetnuldi is a majestic, pyramid-shaped peak in the Svaneti region.","f":["The mountain reaches an impressive elevation of 4,858 meters.","A modern ski resort has been opened on its slopes."]},"kintrishi-nature-v2":{"i":"/poi-images/kintrishi-nature-v2.webp","s":"The Kintrishi Strict Nature Reserve is hidden away in a picturesque river gorge within the mountainous region of Adjara.","f":["A large portion of the area consists of pure primary forests.","The reserve hosts many endemic plant species of the Kolkheti region."]},"abudelauri-lakes-nature-v2":{"i":"/poi-images/abudelauri-lakes-nature-v2.webp","s":"The Abudelauri Lakes are a group of spectacular high alpine mountain lakes in Khevsureti, situated at the foot of the majestic Chaukhi Massif.","f":["The white lake owes its color to fine glacial dust.","The lakes are ice-free and accessible to hikers from June to September."]},"kolkheti-national-park-nature-v2":{"i":"/poi-images/kolkheti-national-park-nature-v2.webp","s":"Kolkheti National Park stretches along the Black Sea coast, preserving the unique marshlands and floodplain forests of ancient Colchis.","f":["Large parts of the park are internationally recognized as Ramsar wetland sites.","The dense bog forests are considered relics from the Ice Age."]},"laila-relief-v2":{"i":"/poi-images/laila-relief-v2.webp","s":"At around 4,000 meters, Laila is the highest peak of the Svaneti Range.","f":["Highest peak of the Svaneti Range.","A popular destination for experienced mountaineers."]},"diklosmta-relief-v2":{"i":"/poi-images/diklosmta-relief-v2.webp","s":"Mount Diklosmta rises powerfully on the border between Georgia and Russia.","f":["Reaches an elevation of 4,285 meters.","Located on the border with Dagestan."]},"tebulosmta-relief-v2":{"i":"/poi-images/tebulosmta-relief-v2.webp","s":"Mount Tebulosmta is the highest mountain in the Eastern Caucasus, dominating the remote Tusheti region.","f":["At 4,492 meters, it is the highest mountain in the region.","The slopes are surrounded by alpine meadows."]},"shota-rustaveli-peak-relief-v2":{"i":"/poi-images/shota-rustaveli-peak-relief-v2.webp","s":"Named after the famous Georgian national poet, this mountain is located in the central Caucasus range.","f":["Over 4,800 meters high.","Named after the 12th-century poet."]},"ailama-relief-v2":{"i":"/poi-images/ailama-relief-v2.webp","s":"Ailama is a prominent pyramid-shaped mountain in the Greater Caucasus.","f":["The elevation is 4,547 meters.","Considered a challenging alpine destination."]},"khvamli-massif-relief-v2":{"i":"/poi-images/khvamli-massif-relief-v2.webp","s":"The Khvamli Massif is an imposing limestone plateau that rises majestically above the Lechkhumi region.","f":["Reaches a height of 2,002 meters.","Significant in Georgian mythology."]},"didgori-mountain-relief-v2":{"i":"/poi-images/didgori-mountain-relief-v2.webp","s":"Didgori is known less for its height than for its immense historical significance.","f":["1,647 meters high.","Site of the famous Battle of Didgori."]},"mtatsminda-relief-v2":{"i":"/poi-images/mtatsminda-relief-v2.webp","s":"The Holy Mountain Mtatsminda dominates the skyline of the capital, Tbilisi.","f":["Rises 715 meters above sea level.","Houses the Pantheon of Georgian writers."]},"likhi-range-relief-v2":{"i":"/poi-images/likhi-range-relief-v2.webp","s":"The Likhi Range connects the Greater and Lesser Caucasus, dividing Georgia climatically and geographically into eastern and western halves.","f":["Connects two major mountain systems.","An important climatic divide."]},"trialeti-range-relief-v2":{"i":"/poi-images/trialeti-range-relief-v2.webp","s":"The Trialeti Range is an elongated volcanic mountain range in the Lesser Caucasus.","f":["Highest point is Mount Shaviklde.","Rich in geothermal springs."]},"javakheti-plateau-relief-v2":{"i":"/poi-images/javakheti-plateau-relief-v2.webp","s":"The vast, volcanic Javakheti Plateau in southern Georgia is known for its cool, harsh climate.","f":["Elevation mostly over 2,000 meters.","Hosts numerous important wetlands."]},"iori-plateau-relief-v2":{"i":"/poi-images/iori-plateau-relief-v2.webp","s":"The Iori Plateau in southeastern Georgia stretches as a vast steppe and semi-desert landscape between the Kura and Alazani rivers.","f":["Characterized by aridity and steppe climate.","An important habitat for birds of prey."]},"udabno-desert-relief-v2":{"i":"/poi-images/udabno-desert-relief-v2.webp","s":"The Udabno Desert surrounds the historic David Gareja cave monastery.","f":["The name literally means 'desert' in Georgian.","The region is rich in minerals."]},"pankisi-gorge-relief-v2":{"i":"/poi-images/pankisi-gorge-relief-v2.webp","s":"The Pankisi Gorge is a densely forested mountain valley in northeastern Georgia, intersected by the Alazani River.","f":["About 10 kilometers long.","Home to a unique Caucasian culture."]},"kodori-gorge-relief-v2":{"i":"/poi-images/kodori-gorge-relief-v2.webp","s":"The spectacular Kodori Gorge in Abkhazia is a deeply carved river valley winding through extremely rugged terrain.","f":["One of the region's most inaccessible valleys.","The forests provide habitat for bears and wolves."]},"truso-valley-relief-v2":{"i":"/poi-images/truso-valley-relief-v2.webp","s":"The Truso Valley near the Russian border is famous for its colorful mineral springs, abandoned medieval towers, and rugged, nearly treeless mountain scenery.","f":["Rich in carbonated mineral springs.","Located at an altitude of over 2,000 meters."]},"sno-valley-relief-v2":{"i":"/poi-images/sno-valley-relief-v2.webp","s":"The Sno Valley is an idyllic alpine basin surrounded by majestic snow-capped peaks.","f":["A popular starting point for mountain hikes.","Branches off from the Georgian Military Highway."]},"darial-gorge-relief-v2":{"i":"/poi-images/darial-gorge-relief-v2.webp","s":"The Darial Gorge is a legendary bottleneck where the Terek River breaks through the massive barrier of the Caucasus.","f":["Historically known as the 'Gates of the Alans'.","An important border crossing into Russia."]},"borjomi-gorge-relief-v2":{"i":"/poi-images/borjomi-gorge-relief-v2.webp","s":"The Borjomi Gorge is a deeply carved river valley of the Kura, famous for its dense coniferous forests and natural healing springs.","f":["Home of the famous Borjomi mineral water.","Characterized by a special, healing microclimate."]},"adjara-coast-relief-v2":{"i":"/poi-images/adjara-coast-relief-v2.webp","s":"The Adjara Black Sea Coast stretches across southwestern Georgia, combining humid subtropical vegetation with picturesque pebble beaches.","f":["Subtropical climate with mild winters.","The beaches are predominantly pebbly."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
