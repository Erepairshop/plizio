const POI_CARD={"ge-tbilisi-cities-v2":{"i":"/poi-images/ge-tbilisi-cities-v2.webp","s":"Tbilisi este capitala și cel mai mare oraș al Georgiei, situat pitoresc pe malurile râului Kura.","f":["Fondat în secolul al V-lea de regele Vakhtang Gorgasali.","Renumit pentru băile istorice de sulf din Abanotubani."]},"ge-batumi-cities-v2":{"i":"/poi-images/ge-batumi-cities-v2.webp","s":"Batumi este al doilea oraș ca mărime din Georgia și o stațiune populară pe litoralul Mării Negre.","f":["Bulevardul Batumi a fost creat în anul 1881.","Grădina Botanică din Batumi este una dintre cele mai mari din lume."]},"ge-kutaisi-cities-v2":{"i":"/poi-images/ge-kutaisi-cities-v2.webp","s":"Kutaisi este al treilea oraș ca mărime din Georgia și centrul regiunii Imereti.","f":["A fost capitala vechiului regat Colchis.","Catedrala Bagrati a fost construită în secolul al XI-lea."]},"ge-rustavi-cities-v2":{"i":"/poi-images/ge-rustavi-cities-v2.webp","s":"Rustavi este un important oraș industrial în sud-estul Georgiei, pe râul Kura.","f":["Fondat în anul 1948 ca un centru pentru metalurgie.","Castelul Rustavi datează din secolul al IV-lea."]},"ge-gori-cities-v2":{"i":"/poi-images/ge-gori-cities-v2.webp","s":"Gori este un oraș în centrul Georgiei, cunoscut mai ales ca locul de naștere al lui Iosif Stalin.","f":["Muzeul Stalin atrage anual mulți vizitatori.","Deasupra orașului se înalță fortăreața istorică Goristsikhe."]},"ge-zugdidi-cities-v2":{"i":"/poi-images/ge-zugdidi-cities-v2.webp","s":"Zugdidi este capitala istorică a regiunii Mingrelia din vestul Georgiei.","f":["Palatul Dadiani găzduiește un important muzeu istoric.","Zugdidi se află la doar câțiva kilometri de Abhazia."]},"ge-poti-cities-v2":{"i":"/poi-images/ge-poti-cities-v2.webp","s":"Poti este un important oraș portuar la Marea Neagră și un centru economic al Georgiei.","f":["Are cel mai mare port maritim din țară.","Catedrala din Poti este o replică a Hagia Sofia."]},"ge-sokhumi-cities-v2":{"i":"/poi-images/ge-sokhumi-cities-v2.webp","s":"Suhumi este capitala regiunii separatiste Abhazia și a fost odată o stațiune înfloritoare la Marea Neagră.","f":["Grădina Botanică din Suhumi a fost fondată în 1840.","Multe dintre hotelurile istorice balneare sunt acum goale."]},"ge-khashuri-cities-v2":{"i":"/poi-images/ge-khashuri-cities-v2.webp","s":"Khashuri este un important nod de transport în centrul Georgiei, unde se intersectează rețelele feroviare și rutiere.","f":["A devenit important în 1872, odată cu construcția căii ferate.","Castelul istoric Surami este situat în apropierea orașului."]},"ge-samtredia-cities-v2":{"i":"/poi-images/ge-samtredia-cities-v2.webp","s":"Samtredia este un oraș plin de viață în câmpia Imereti, cunoscut pentru importanța sa ca nod feroviar.","f":["A primit oficial statutul de oraș în anul 1921.","Râul Rioni curge nu departe de centrul orașului."]},"ge-senaki-cities-v2":{"i":"/poi-images/ge-senaki-cities-v2.webp","s":"Senaki este un oraș important în regiunea Mingrelia și o bază militară esențială.","f":["Între 1933 și 1989, orașul s-a numit Mikha Tskhakaya.","Teatrul Senaki a fost construit în stil neoclasic."]},"ge-zestafoni-cities-v2":{"i":"/poi-images/ge-zestafoni-cities-v2.webp","s":"Zestafoni este un oraș industrial în Imereti, a cărui economie este strâns legată de prelucrarea minereului de mangan.","f":["Uzina locală de feroaliaje este cea mai mare din țară.","Zestafoni este cunoscut și pentru regiunile sale viticole excelente."]},"ge-marneuli-cities-v2":{"i":"/poi-images/ge-marneuli-cities-v2.webp","s":"Marneuli este centrul administrativ al unei regiuni multiculturale din Kvemo Kartli, având o populație majoritar azeră.","f":["Orașul este un centru al comerțului agricol.","În Marneuli se sărbătorește an de an cu fast festivalul Novruz."]},"ge-telavi-cities-v2":{"i":"/poi-images/ge-telavi-cities-v2.webp","s":"Telavi este centrul istoric și administrativ al regiunii viticole Kakheti.","f":["Fortăreața Batonis Tsikhe a fost reședința regilor din Kakheti.","Un platan vechi de 900 de ani se află în centrul orașului Telavi."]},"ge-akhaltsikhe-cities-v2":{"i":"/poi-images/ge-akhaltsikhe-cities-v2.webp","s":"Akhaltsikhe este un oraș multicultural din sudul Georgiei, modelat de influențe georgiene, armene și otomane.","f":["Fortăreața restaurată Rabati este un complex istoric uriaș.","Orașul a fost sub dominație otomană timp de peste 200 de ani."]},"ge-kobuleti-cities-v2":{"i":"/poi-images/ge-kobuleti-cities-v2.webp","s":"Kobuleti este o stațiune populară în Adjara, cu o plajă de pietriș lungă de câțiva kilometri.","f":["Promenada de coastă este una dintre cele mai lungi din Caucaz.","În perioada sovietică, Kobuleti era o renumită stațiune balneară."]},"ge-ozurgeti-cities-v2":{"i":"/poi-images/ge-ozurgeti-cities-v2.webp","s":"Ozurgeti este centrul regiunii Guria și este înconjurat de plantații pitorești de ceai și livezi de alun.","f":["Guria a fost cândva centrul cultivării ceaiului georgian.","Teatrul dramatic istoric domină centrul orașului."]},"ge-tskhaltubo-cities-v2":{"i":"/poi-images/ge-tskhaltubo-cities-v2.webp","s":"Tskhaltubo este o fostă stațiune balneară de renume mondial, apreciată pentru izvoarele sale minerale cu radon.","f":["Stalin însuși vizita regulat băile din Tskhaltubo.","Multe sanatorii sunt restaurate treptat astăzi."]},"ge-kaspi-cities-v2":{"i":"/poi-images/ge-kaspi-cities-v2.webp","s":"Kaspi este un mic oraș istoric în regiunea Shida Kartli, cu un rol important în producția de ciment.","f":["Fabrica de ciment din Kaspi este una dintre cele mai mari din Georgia.","În apropiere de Kaspi se află vechiul oraș rupestru Uplistsikhe."]},"ge-tkibuli-cities-v2":{"i":"/poi-images/ge-tkibuli-cities-v2.webp","s":"Tkibuli este un oraș minier în vestul Georgiei, înconjurat de păduri dense și munți abrupți.","f":["Extracția cărbunelui a început aici la mijlocul secolului al XIX-lea.","Arhitectura din centru amintește puternic de perioada sovietică."]},"ge-chiatura-cities-v2":{"i":"/poi-images/ge-chiatura-cities-v2.webp","s":"Chiatura este un oraș montan unic, renumit pentru rețeaua sa extinsă de telecabine sovietice.","f":["A fost fondat ca centru al industriei manganului.","Unele dintre telecabinele istorice au fost modernizate recent."]},"ge-sagarejo-cities-v2":{"i":"/poi-images/ge-sagarejo-cities-v2.webp","s":"Sagarejo este poarta de intrare în regiunea viticolă Kakheti și un oraș cu caracter agricol.","f":["Mănăstirea David Gareja se află la sud de oraș.","Viticultura este principala sursă de venit a populației locale."]},"ge-gardabani-cities-v2":{"i":"/poi-images/ge-gardabani-cities-v2.webp","s":"Gardabani este un oraș industrial aproape de granița cu Azerbaidjanul, unde funcționează o importantă centrală termică.","f":["Centrala de la Gardabani furnizează energie pentru o mare parte din Georgia.","Există așezări rupestre istorice în zonă."]},"ge-borjomi-cities-v2":{"i":"/poi-images/ge-borjomi-cities-v2.webp","s":"Borjomi este o stațiune pitorească recunoscută la nivel mondial pentru apa sa minerală sărată și vindecătoare.","f":["Apa din Borjomi este exportată în peste 40 de țări.","Dinastia țaristă Romanov adora să își petreacă verile aici."]},"ge-tqvarcheli-cities-v2":{"i":"/poi-images/ge-tqvarcheli-cities-v2.webp","s":"Tkvarcheli este un oraș înconjurat de munți din Abhazia, cunoscut pentru extracția cărbunelui.","f":["Arhitectura se caracterizează prin clădiri staliniste neoclasice.","Orașul a fost fondat oficial în 1942."]},"ge-khoni-cities-v2":{"i":"/poi-images/ge-khoni-cities-v2.webp","s":"Khoni este un mic oraș din câmpiile vest-georgiene, distins prin producția tradițională de mătase și produse agricole.","f":["În apropiere de Khoni se află celebrul canion Okatse.","Biserica din centrul orașului are o bogată semnificație istorică."]},"ge-bolnisi-cities-v2":{"i":"/poi-images/ge-bolnisi-cities-v2.webp","s":"Bolnisi este un oraș din Kvemo Kartli, fondat de coloniști germani în secolul al XIX-lea sub numele de Katharinenfeld.","f":["Biserica Sioni din Bolnisi datează din secolul al V-lea.","Muzeul local evidențiază istoria germano-georgiană."]},"ge-akhalkalaki-cities-v2":{"i":"/poi-images/ge-akhalkalaki-cities-v2.webp","s":"Akhalkalaki este situat pe platoul Javakheti, aproape de granița cu Armenia, având o populație majoritar armeană.","f":["Fortăreața Akhalkalaki datează din secolul al XI-lea.","Regiunea este cunoscută pentru cartofii săi excelenți."]},"ge-gurjaani-cities-v2":{"s":"Gurjaani este un centru viticol plin de viață în regiunea Kakheti, înconjurat de podgorii nesfârșite.","f":["Biserica Kvelatsminda este unică prin cele două domuri ale sale.","În oraș se produc soiuri celebre de vin georgian."]},"ge-mtskheta-cities-v2":{"i":"/poi-images/ge-mtskheta-cities-v2.webp","s":"Mtskheta este unul dintre cele mai vechi orașe din Georgia și fosta capitală a regatului iberic.","f":["Catedrala Svetitskhoveli este în Patrimoniul Mondial UNESCO.","Mănăstirea Jvari tronează maiestuos deasupra orașului."]},"batumi-sea-port-economic-v2":{"i":"/poi-images/batumi-sea-port-economic-v2.webp","s":"Portul Maritim Batumi este unul dintre cele mai importante porturi ale Georgiei la Marea Neagră, servind ca nod central pentru tranzitul de petrol și mărfuri.","f":["Punct important de tranzit pentru petrolul caspic.","Unul dintre cele mai vechi porturi din regiune."]},"poti-sea-port-economic-v2":{"i":"/poi-images/poti-sea-port-economic-v2.webp","s":"Portul Maritim Poti este un nod de transport crucial și cel mai mare port din Georgia pentru containere și mărfuri în vrac.","f":["Joacă un rol cheie în coridorul de transport eurasiatic TRACECA.","Poarta principală pentru comerțul maritim georgian."]},"chiatura-manganese-mine-economic-v2":{"i":"/poi-images/chiatura-manganese-mine-economic-v2.webp","s":"Mina de mangan Chiatura este unul dintre cele mai mari zăcăminte de minereu de mangan din lume, funcționând de peste un secol.","f":["Orașul este cunoscut pentru rețeaua sa de telecabine vechi.","Furnizează materii prime pentru industria grea georgiană."]},"rustavi-metallurgical-plant-economic-v2":{"i":"/poi-images/rustavi-metallurgical-plant-economic-v2.webp","s":"Uzina metalurgică din Rustavi este cel mai mare centru al industriei grele din Georgia, specializat în producția de oțel și fier.","f":["Orașul Rustavi a fost construit în jurul acestei uzine.","Un exportator major de produse din oțel în regiune."]},"zestafoni-ferroalloy-plant-economic-v2":{"i":"/poi-images/zestafoni-ferroalloy-plant-economic-v2.webp","s":"Uzina din Zestafoni procesează minereul de mangan din Chiatura și este unul dintre cei mai mari producători de silicomangan din lume.","f":["Silicomanganul este o componentă crucială în producția de oțel.","Uzina este un angajator major în regiunea Imereti."]},"kulevi-oil-terminal-economic-v2":{"i":"/poi-images/kulevi-oil-terminal-economic-v2.webp","s":"Terminalul petrolier Kulevi este o facilitate majoră pentru încărcarea petrolului caspic pe tancuri petroliere în Marea Neagră.","f":["Terminalul a fost deschis în anul 2008.","Dispune de rezervoare moderne de stocare cu capacitate mare."]},"supsa-sea-terminal-economic-v2":{"i":"/poi-images/supsa-sea-terminal-economic-v2.webp","s":"Terminalul Supsa este punctul final al conductei de petrol Baku-Supsa, unde petrolul din Azerbaidjan este încărcat pe nave.","f":["Facilitatea utilizează sisteme de geamanduri offshore pentru încărcare.","Joacă un rol important în infrastructura energetică caucaziană."]},"tkibuli-coal-mine-economic-v2":{"i":"/poi-images/tkibuli-coal-mine-economic-v2.webp","s":"Tkibuli este centrul mineritului de cărbune din Georgia, unde se extrage cărbune în principal pentru nevoile interne.","f":["Extracția cărbunelui a început aici la mijlocul secolului al XIX-lea.","Furnizează cărbune pentru centralele termice și fabricile de ciment locale."]},"madneuli-mine-economic-v2":{"i":"/poi-images/madneuli-mine-economic-v2.webp","s":"Mina Madneuli din apropiere de Kazreti este cea mai importantă sursă de cupru și aur din Georgia, fiind exploatată la suprafață.","f":["Metalele extrase sunt importante bunuri de export georgiene.","Mineritul la suprafață a modificat semnificativ peisajul."]},"poti-fiz-economic-v2":{"i":"/poi-images/poti-fiz-economic-v2.webp","s":"Zona Industrială Liberă Poti oferă facilități fiscale și atrage companii internaționale din industria prelucrătoare.","f":["Prima zonă industrială liberă înființată în Caucaz.","Conectată direct la portul maritim și rețeaua feroviară."]},"kutaisi-fiz-economic-v2":{"i":"/poi-images/kutaisi-fiz-economic-v2.webp","s":"Această zonă industrială din Kutaisi promovează investițiile locale și străine în tehnologie, textile și electrocasnice.","f":["Construită pe locul unei foste fabrici de automobile.","Găzduiește companii din diverse sectoare industriale."]},"zhinvali-hpp-economic-v2":{"i":"/poi-images/zhinvali-hpp-economic-v2.webp","s":"Barajul Zhinvali blochează râul Aragvi și produce energie hidroelectrică curată pentru capitala georgiană Tbilisi.","f":["Rezervorul alimentează de asemenea Tbilisi cu apă potabilă.","Facilitatea a fost finalizată în anii 1980."]},"gardabani-tpp-economic-v2":{"i":"/poi-images/gardabani-tpp-economic-v2.webp","s":"Centrala termoelectrică cu ciclu combinat din Gardabani asigură securitatea energetică a Georgiei, în special iarna.","f":["Este una dintre cele mai moderne centrale din regiune.","Reduce dependența de energia electrică importată."]},"larsi-border-crossing-economic-v2":{"i":"/poi-images/larsi-border-crossing-economic-v2.webp","s":"Punctul de trecere a frontierei Larsi din defileul Darial este cea mai importantă rută terestră pentru comerțul dintre Georgia și Rusia.","f":["Singurul punct de trecere a frontierei deschis oficial către Rusia.","Adesea blocat de ninsori abundente iarna."]},"sarpi-border-crossing-economic-v2":{"i":"/poi-images/sarpi-border-crossing-economic-v2.webp","s":"Sarpi este un punct de frontieră aglomerat pe coasta Mării Negre și joacă un rol central în comerțul cu Turcia.","f":["Clădirea vămii georgiene are o arhitectură unică, modernă.","Unul dintre cele mai aglomerate noduri din țară."]},"lilo-city-market-economic-v2":{"i":"/poi-images/lilo-city-market-economic-v2.webp","s":"Piața Lilo de la periferia orașului Tbilisi este cea mai mare piață en-gros și cu amănuntul din Transcaucazia pentru bunuri de larg consum.","f":["Comercianții din întregul Caucaz își fac cumpărăturile aici.","Un motor major pentru comerțul informal și formal."]},"borjomi-bottling-plant-economic-v2":{"i":"/poi-images/borjomi-bottling-plant-economic-v2.webp","s":"În fabricile din Borjomi se îmbuteliază faimoasa apă minerală vulcanică, care este exportată în zeci de țări din întreaga lume.","f":["Apa Borjomi este unul dintre cele mai importante articole de export ale Georgiei.","Îmbutelierea industrială a început încă din anul 1890."]},"batumi-oil-terminal-economic-v2":{"i":"/poi-images/batumi-oil-terminal-economic-v2.webp","s":"Terminalul petrolier din Batumi procesează și depozitează produse petroliere din Asia Centrală și Caucaz pentru transportul maritim internațional.","f":["Facilitatea dispune de conexiuni feroviare directe.","Un centru istoric al industriei petroliere globale de la sfârșitul secolului al XIX-lea."]},"kaspi-cement-plant-economic-v2":{"i":"/poi-images/kaspi-cement-plant-economic-v2.webp","s":"Fabrica de ciment din Kaspi este un pilon al industriei georgiene a materialelor de construcții, aprovizionând proiecte majore de infrastructură.","f":["Zăcămintele de calcar din regiune oferă materii prime ideale.","Sistemele moderne de filtrare reduc astăzi emisiile."]},"samgori-oil-field-economic-v2":{"i":"/poi-images/samgori-oil-field-economic-v2.webp","s":"Câmpul petrolier Samgori de lângă Tbilisi este cea mai mare sursă internă de extracție a petrolului din Georgia.","f":["Descoperirea câmpului în secolul al XX-lea a redus importurile de energie.","Volumele de extracție sunt astăzi mai mici decât în trecut."]},"ge-narikala-history-v2":{"i":"/poi-images/ge-narikala-history-v2.webp","s":"Narikala este o cetate antică care tronează deasupra capitalei Tbilisi, protejând orașul încă din secolul al IV-lea.","f":["Fondată în secolul al IV-lea ca o citadelă persană.","Un cutremur a distrus o mare parte din complex în 1827."]},"ge-svetitskhoveli-history-v2":{"i":"/poi-images/ge-svetitskhoveli-history-v2.webp","s":"Catedrala maiestuoasă Svetitskhoveli din Mțheta este o capodoperă a arhitecturii georgiene din Evul Mediu timpuriu și patrimoniu UNESCO.","f":["Construită în secolul al XI-lea sub conducerea arhitectului Arsukisdze.","Locul tradițional de încoronare și înmormântare al regilor georgieni."]},"ge-uplistsikhe-history-v2":{"i":"/poi-images/ge-uplistsikhe-history-v2.webp","s":"Uplistsikhe este un oraș rupestru antic impresionant săpat în stâncă în estul Georgiei.","f":["Una dintre cele mai vechi așezări urbane din Georgia.","Un amestec de arhitectură rupestră păgână și creștină."]},"ge-vardzia-history-v2":{"i":"/poi-images/ge-vardzia-history-v2.webp","s":"Orașul rupestru Vardzia este un complex monahal spectaculos sculptat în secolul al XII-lea în peretele abrupt al muntelui Erusheti.","f":["Inițial, orașul avea până la treisprezece etaje.","În 1283, un cutremur a dărâmat peretele exterior și a dezvăluit mănăstirea."]},"ge-gelati-history-v2":{"i":"/poi-images/ge-gelati-history-v2.webp","s":"Mănăstirea Gelati de lângă Kutaisi a fost unul dintre primele centre culturale și spirituale ale Georgiei.","f":["Patrimoniu UNESCO cu mozaicuri și fresce remarcabile.","Regele David Ziditorul este înmormântat în poarta mănăstirii."]},"ge-bagrati-history-v2":{"i":"/poi-images/ge-bagrati-history-v2.webp","s":"Catedrala Bagrati din Kutaisi tronează maiestuos pe dealul Ukimerioni.","f":["Numită după Regele Bagrat al III-lea, primul rege al Georgiei unite.","Grav avariată de trupele otomane în 1692 și restaurată în secolul al XX-lea."]},"ge-gergeti-history-v2":{"i":"/poi-images/ge-gergeti-history-v2.webp","s":"Biserica Sfintei Treimi din Gergeti este situată într-un cadru uluitor la peste 2.100 de metri altitudine, în fața masivului munte Kazbek.","f":["În timpul invaziilor, aici au fost ascunse relicve prețioase din Mțheta.","Accesibilă printr-un drum montan abrupt sau o drumeție pitorească."]},"ge-dadiani-history-v2":{"i":"/poi-images/ge-dadiani-history-v2.webp","s":"Palatul Dadiani din Zugdidi a fost reședința familiei nobiliare Dadiani, care a condus Mingrelia istorică.","f":["Grădina botanică a palatului a fost creată în secolul al XIX-lea.","Un descendent al familiei s-a căsătorit cu nepotul lui Napoleon, aducând relicve europene în Georgia."]},"ge-mutso-history-v2":{"i":"/poi-images/ge-mutso-history-v2.webp","s":"Ruinele fascinante de la Mutso par a se lipi de o creastă stâncoasă abruptă în regiunea montană îndepărtată Hevsureti.","f":["Considerat unul dintre cele mai impresionante monumente de arhitectură din Georgia medievală.","A fost restaurat recent în cadrul unui proiect amplu."]},"ge-gremi-history-v2":{"i":"/poi-images/ge-gremi-history-v2.webp","s":"Gremi a fost capitala înfloritoare a Regatului Kaheti în secolul al XVI-lea.","f":["Construită în 1565 de Regele Levan al Kahetiului.","Orașul a fost ras de pe fața pământului de trupele lui Șah Abbas I în 1615."]},"ge-jvari-history-v2":{"i":"/poi-images/ge-jvari-history-v2.webp","s":"Mănăstirea Jvari din secolul al VI-lea se înalță pe o stâncă la confluența râurilor Kura și Aragvi.","f":["Numele Jvari înseamnă literal 'cruce' în georgiană.","Face parte din Patrimoniul Mondial UNESCO împreună cu Mțheta."]},"ge-rabati-history-v2":{"i":"/poi-images/ge-rabati-history-v2.webp","s":"Cetatea Rabati din Akhaltsikhe este un complex multicultural impresionant.","f":["Fondată în secolul al IX-lea sub numele de Lomisa.","A fost restaurată complet și elaborat în 2012."]},"ge-khertvisi-history-v2":{"i":"/poi-images/ge-khertvisi-history-v2.webp","s":"Cetatea Khertvisi, una dintre cele mai vechi cetăți din Georgia, este situată dramatic la confluența a două chei adânci de râuri.","f":["Construită pe un promontoriu stâncos, perfect din punct de vedere strategic, în secolul al II-lea î.Hr.","Conform legendei, Alexandru cel Mare ar fi asediat locul."]},"ge-david-gareja-history-v2":{"i":"/poi-images/ge-david-gareja-history-v2.webp","s":"Mănăstirea rupestră David Gareja este situată într-un peisaj semideșertic, la granița cu Azerbaidjanul.","f":["Complexul este format din sute de peșteri, capele și spații de locuit.","A fost un centru înfloritor al vieții monahale timp de secole."]},"ge-gonio-history-v2":{"i":"/poi-images/ge-gonio-history-v2.webp","s":"Cetatea Gonio de pe coasta Mării Negre este una dintre cele mai vechi fortificații romane păstrate din Caucaz.","f":["A fost menționată pentru prima dată de Plinius cel Bătrân în secolul I.","Tradiția spune că apostolul Matia ar fi înmormântat în interiorul zidurilor cetății."]},"ge-shatili-history-v2":{"i":"/poi-images/ge-shatili-history-v2.webp","s":"Misteriosul sat fortificat Shatili, din adâncurile Munților Caucaz, este un labirint de turnuri rezidențiale strâns conectate.","f":["A fost construit între secolele al VII-lea și al XIII-lea, într-o izolare extremă.","Reprezintă unul dintre cele mai remarcabile exemple de arhitectură populară georgiană."]},"ge-ananuri-history-v2":{"i":"/poi-images/ge-ananuri-history-v2.webp","s":"Cetatea fortificată Ananuri tronează pitoresc deasupra lacului de acumulare Zhinvali.","f":["Complexul include două biserici cu sculpturi fine în piatră pe fațade.","În ciuda multor distrugeri, crenelurile și turnurile de apărare sunt excelent conservate."]},"ge-didgori-history-v2":{"i":"/poi-images/ge-didgori-history-v2.webp","s":"Monumentul Didgori marchează câmpul de luptă istoric pe care Regele David Ziditorul a obținut o victorie neașteptată și covârșitoare asupra uriașei armate selgiucide în 1121.","f":["Această victorie a inaugurat Epoca de Aur a Georgiei.","În fiecare an, pe 12 august, ziua bătăliei este sărbătorită ca sărbătoare națională."]},"ge-kartlis-deda-history-v2":{"i":"/poi-images/ge-kartlis-deda-history-v2.webp","s":"Statuia monumentală 'Kartlis Deda' veghează asupra capitalei Tbilisi din 1958.","f":["Monumentul din aluminiu are 20 de metri înălțime.","A fost ridicat pentru a sărbători a 1.500-a aniversare a orașului Tbilisi."]},"ge-alaverdi-history-v2":{"i":"/poi-images/ge-alaverdi-history-v2.webp","s":"Impresionanta Catedrală Alaverdi, situată în inima văii fertile Alazani, a fost cea mai înaltă biserică din Georgia până în secolul al XXI-lea.","f":["Catedrala din secolul al XI-lea atinge o înălțime de peste 50 de metri.","Mănăstirea produce vin în amfore tradiționale (Qvevri), o tehnică cu statut UNESCO."]},"bridge-of-peace-landmarks-v2":{"i":"/poi-images/bridge-of-peace-landmarks-v2.webp","s":"Podul Păcii din Tbilisi este o punte pietonală curbată, realizată din sticlă și oțel, care traversează râul Kura și leagă orașul vechi de Parcul Rike.","f":["A fost proiectat de arhitectul Michele De Lucchi.","Podul are o lungime de 150 de metri și a fost deschis în 2010."]},"abanotubani-landmarks-v2":{"i":"/poi-images/abanotubani-landmarks-v2.webp","s":"Cartierul istoric de băi Abanotubani din Tbilisi este renumit pentru băile sale tradiționale cu cupolă, alimentate de izvoare naturale fierbinți de sulf.","f":["Băile sunt alimentate de izvoare fierbinți cu sulf.","Printre vizitatorii celebri s-au numărat Alexandr Pușkin și Alexandre Dumas."]},"chronicle-of-georgia-landmarks-v2":{"i":"/poi-images/chronicle-of-georgia-landmarks-v2.webp","s":"Monumentul masiv Cronica Georgiei domină un deal de lângă Marea Tbilisi și prezintă pe coloane uriașe scene din istoria și religia georgiană.","f":["Monumentul a fost creat în 1985 de artistul Zurab Tsereteli.","Coloanele impresionante au peste 30 de metri înălțime."]},"gabriadze-theater-landmarks-v2":{"i":"/poi-images/gabriadze-theater-landmarks-v2.webp","s":"Teatrul pitoresc de marionete al lui Rezo Gabriadze din centrul vechi al orașului Tbilisi este faimos pentru turnul său înclinat cu ceas, de unde apare un înger la fiecare oră fixă.","f":["Teatrul a fost fondat în 1981 de Rezo Gabriadze.","Turnul înclinat cu ceas a fost adăugat în 2010."]},"tbilisi-tv-tower-landmarks-v2":{"i":"/poi-images/tbilisi-tv-tower-landmarks-v2.webp","s":"Turnul de televiziune din Tbilisi de pe Muntele Mtatsminda este un simbol al orașului, vizibil de aproape oriunde din capitală noaptea datorită iluminării sale colorate.","f":["Turnul atinge o înălțime de 274 de metri.","A fost construit în 1972 în locul unui vechi turn de transmisie."]},"ali-and-nino-statue-landmarks-v2":{"i":"/poi-images/ali-and-nino-statue-landmarks-v2.webp","s":"Sculptura cinetică a lui Ali și Nino din Batumi simbolizează o poveste de dragoste tragică.","f":["Sculptura cinetică are o înălțime de 8 metri.","A fost proiectată de artista Tamara Kvesitadze."]},"alphabet-tower-landmarks-v2":{"i":"/poi-images/alphabet-tower-landmarks-v2.webp","s":"Turnul Alfabetului de 130 de metri din Batumi celebrează unicitatea scrierii georgiene.","f":["Turnul are o înălțime de 130 de metri și a fost finalizat în 2011.","Celebrează alfabetul georgian și cele 33 de litere ale sale."]},"batumi-botanical-garden-landmarks-v2":{"i":"/poi-images/batumi-botanical-garden-landmarks-v2.webp","s":"Grădina Botanică din Batumi, situată pe Capul Verde, este una dintre cele mai mari și mai diverse din lume.","f":["Grădina a fost deschisă oficial în 1912.","Se întinde pe o suprafață de 108 hectare."]},"batumi-boulevard-landmarks-v2":{"i":"/poi-images/batumi-boulevard-landmarks-v2.webp","s":"Bulevardul istoric Batumi se întinde pe câțiva kilometri de-a lungul coastei și atrage cu palmieri, fântâni dansatoare și numeroase cafenele.","f":["Construcția bulevardului a început în anul 1881.","Promenada se întinde pe o lungime de aproximativ 7 kilometri."]},"katskhi-pillar-landmarks-v2":{"i":"/poi-images/katskhi-pillar-landmarks-v2.webp","s":"Stâlpul Katskhi este un monolit natural de calcar de 40 de metri înălțime în Imereti.","f":["Monolitul de calcar are o înălțime de aproximativ 40 de metri.","Mica biserică din vârf datează din secolul al IX-lea sau al X-lea."]},"prometheus-cave-landmarks-v2":{"i":"/poi-images/prometheus-cave-landmarks-v2.webp","s":"Peștera Prometeu de lângă Kutaisi este una dintre cele mai fascinante minuni naturale ale Georgiei.","f":["Peștera a fost descoperită de speologi în 1984.","Pentru vizitatori este amenajat un traseu de 1,4 kilometri."]},"martvili-canyon-landmarks-v2":{"i":"/poi-images/martvili-canyon-landmarks-v2.webp","s":"Canionul Martvili impresionează prin apa sa verde smarald și cascadele impresionante.","f":["Defileul are o adâncime de până la 40 de metri.","Vizitatorii pot naviga pe o parte a râului cu bărcile."]},"okatse-canyon-landmarks-v2":{"i":"/poi-images/okatse-canyon-landmarks-v2.webp","s":"Canionul Okatse oferă o experiență de neuitat datorită unei pasarele suspendate spectaculoase, fixate pe peretele stâncii la mare înălțime, oferind priveliști incredibile.","f":["Pasarela pietonală suspendată are o lungime de 780 de metri.","Defileul în sine are în unele locuri peste 50 de metri adâncime."]},"sataplia-cave-landmarks-v2":{"i":"/poi-images/sataplia-cave-landmarks-v2.webp","s":"Rezervația Naturală Sataplia este renumită pentru urmele de dinozauri bine conservate și pentru o frumoasă peșteră carstică.","f":["Rezervația a fost fondată în 1935 pentru a proteja peștera.","Protejează urme pietrificate de dinozauri."]},"svaneti-towers-mestia-landmarks-v2":{"i":"/poi-images/svaneti-towers-mestia-landmarks-v2.webp","s":"Turnurile medievale de apărare din regiunea muntoasă Svaneti domină peisajul inconfundabil din Mestia.","f":["Majoritatea turnurilor au fost construite între secolele al IX-lea și al XII-lea.","Regiunea face parte din Patrimoniul Mondial UNESCO din 1996."]},"enguri-dam-landmarks-v2":{"i":"/poi-images/enguri-dam-landmarks-v2.webp","s":"Barajul Enguri este, la 271,5 metri, unul dintre cele mai înalte baraje în arc din lume.","f":["Barajul în arc atinge o înălțime de 271,5 metri.","Construcția sa a fost complet finalizată în 1987."]},"dashbashi-canyon-landmarks-v2":{"i":"/poi-images/dashbashi-canyon-landmarks-v2.webp","s":"Pitorescul Canion Dashbashi atrage vizitatorii cu numeroasele sale cascade.","f":["Podul de Diamant din sticlă are o lungime de 240 de metri.","Podul a fost deschis publicului în anul 2022."]},"sighnaghi-city-wall-landmarks-v2":{"i":"/poi-images/sighnaghi-city-wall-landmarks-v2.webp","s":"Impresionantul zid al orașului Sighnaghi se întinde pe mai mult de patru kilometri în jurul orașului pitoresc.","f":["Zidul cetății are o lungime totală de 4,5 kilometri.","Este echipat cu 28 de turnuri de veghe."]},"makhuntseti-waterfall-landmarks-v2":{"i":"/poi-images/makhuntseti-waterfall-landmarks-v2.webp","s":"Cascada Makhuntseti din regiunea Adjara este o destinație populară pentru excursii.","f":["Apa cade de la o înălțime de 33,5 metri.","În apropiere se află podul istoric al Reginei Tamar."]},"gveleti-waterfall-landmarks-v2":{"i":"/poi-images/gveleti-waterfall-landmarks-v2.webp","s":"Ascunsă în peisajul montan aspru din Stepantsminda, se află cascada Gveleti.","f":["Numele Gveleti se traduce prin Locul șerpilor.","Există două cascade principale în această zonă."]},"ge-mtirala-national-park-life-v2":{"i":"/poi-images/ge-mtirala-national-park-life-v2.webp","s":"Acest parc național din Adjara își datorează numele microclimatului ploios.","f":["Numele înseamnă plângând.","Precipitații anuale ridicate."]},"ge-vashlovani-national-park-life-v2":{"i":"/poi-images/ge-vashlovani-national-park-life-v2.webp","s":"Parcul național din estul Georgiei oferă un peisaj de savană cu formațiuni stâncoase bizare și vulcani noroioși.","f":["Cunoscut pentru peisajele de semideșert.","Găzduiește leoparzi și hiene dungate."]},"ge-lagodekhi-reserve-life-v2":{"i":"/poi-images/ge-lagodekhi-reserve-life-v2.webp","s":"Una dintre cele mai vechi arii protejate din Caucaz fascinează cu pădurile sale virgine și cascadele spectaculoase.","f":["Fondată în anul 1912.","Se învecinează cu Azerbaidjan și Rusia."]},"ge-tusheti-national-park-life-v2":{"i":"/poi-images/ge-tusheti-national-park-life-v2.webp","s":"Regiunea montană izolată Tușeti este accesibilă doar în lunile de vară și păstrează un cadru natural neatins.","f":["Situat la peste 2000 de metri altitudine.","Accesibil prin periculosul pas Abano."]},"ge-kolkheti-national-park-life-v2":{"i":"/poi-images/ge-kolkheti-national-park-life-v2.webp","s":"Zonele umede întinse și pădurile mlăștinoase de pe coasta Mării Negre sunt un refugiu global pentru păsările migratoare.","f":["Zonă importantă de iernare pentru păsări.","Include Lacul Paliastomi."]},"ge-javakheti-reserve-life-v2":{"i":"/poi-images/ge-javakheti-reserve-life-v2.webp","s":"Platoul vulcanic din sudul Georgiei este caracterizat de numeroase lacuri și un peisaj aspru, fără copaci.","f":["Situat pe un platou vulcanic.","Găzduiește multe specii de păsări endemice."]},"ge-kintrishi-reserve-life-v2":{"i":"/poi-images/ge-kintrishi-reserve-life-v2.webp","s":"Ascunsă în munții din Adjara, această rezervație protejează păduri relicve virgine și văi adânci de râuri.","f":["Climat subtropical foarte umed.","Găzduiește salamandre caucaziene rare."]},"ge-algeti-national-park-life-v2":{"i":"/poi-images/ge-algeti-national-park-life-v2.webp","s":"Zona din valea împădurită a râului Algeti oferă o combinație încântătoare de natură și monumente istorice.","f":["Protejează pădurile dense de molid și brad.","Bogată în situri arheologice."]},"ge-machakhela-national-park-life-v2":{"i":"/poi-images/ge-machakhela-national-park-life-v2.webp","s":"Această zonă naturală din apropierea graniței cu Turcia păstrează păduri montane unice și peisaje culturale tradiționale.","f":["Se învecinează direct cu Turcia.","Cunoscut pentru ruinele vechilor cetăți."]},"ge-tbilisi-botanical-garden-life-v2":{"i":"/poi-images/ge-tbilisi-botanical-garden-life-v2.webp","s":"Amplasată într-un defileu adânc în spatele cetății Narikala, această oază verde a fost un refugiu de secole.","f":["Fondată în anul 1845.","Cândva o grădină a palatului regal."]},"ge-rike-park-life-v2":{"i":"/poi-images/ge-rike-park-life-v2.webp","s":"Acest parc urban modern de pe malul râului Kura din Tbilisi impresionează prin designul său futurist.","f":["Sală de concerte futuristă în parc.","Punct de plecare al telecabinei spre cetatea Narikala."]},"ge-vake-park-life-v2":{"i":"/poi-images/ge-vake-park-life-v2.webp","s":"Fiind cel mai mare parc public din Tbilisi, Parcul Vake este o destinație populară de recreere, cu alei largi, fântâni și memoriale.","f":["Deschis în anul 1946.","Statuie uriașă a Victoriei din al Doilea Război Mondial."]},"ge-mtatsminda-park-life-v2":{"i":"/poi-images/ge-mtatsminda-park-life-v2.webp","s":"Situat sus deasupra orașului Tbilisi, acest parc istoric de distracții oferă atracții pentru toate vârstele și vederi panoramice spectaculoase.","f":["Fondat în anii 1930.","Roată panoramică la marginea stâncii."]},"ge-mushtaidi-park-life-v2":{"i":"/poi-images/ge-mushtaidi-park-life-v2.webp","s":"Unul dintre cele mai vechi parcuri din Tbilisi a fost înființat de un prinț persan și găzduiește copaci seculari, precum și o cale ferată istorică pentru copii.","f":["Fondat în anii 1830.","Numit după Mir Fatah Agha."]},"ge-tsitsinatela-life-v2":{"i":"/poi-images/ge-tsitsinatela-life-v2.webp","s":"Acest parc de distracții luminos din apropierea coastei Mării Negre prinde viață în special după apus.","f":["Numele înseamnă licurici.","Se deschide seara în lunile de vară."]},"ge-kakheti-vineyards-life-v2":{"i":"/poi-images/ge-kakheti-vineyards-life-v2.webp","s":"Podgoriile nesfârșite din Valea Alazani formează inima agricolă a producției de vin georgian.","f":["Georgia este considerată leagănul vinului.","Metoda Qvevri este patrimoniu cultural UNESCO."]},"ge-imereti-tea-plantations-life-v2":{"i":"/poi-images/ge-imereti-tea-plantations-life-v2.webp","s":"Dealurile blânde din Imereti și Guria au fost cândva centrul producției sovietice de ceai.","f":["Cultivarea ceaiului a început în secolul al XIX-lea.","Clima este ideală pentru tufele de ceai."]},"ge-guria-citrus-orchards-life-v2":{"i":"/poi-images/ge-guria-citrus-orchards-life-v2.webp","s":"Clima subtropicală blândă din regiunea Guria, pe coasta Mării Negre, oferă condiții perfecte pentru cultivarea mandarinelor și portocalelor, al căror parfum umple aerul toamna târziu.","f":["Principala zonă de cultivare pentru mandarinele georgiene.","Sezonul de recoltare începe în noiembrie."]},"ge-racha-vineyards-life-v2":{"i":"/poi-images/ge-racha-vineyards-life-v2.webp","s":"Regiunea răcoroasă și muntoasă Racha este renumită pentru soiurile sale unice de struguri, în special pentru vinul roșu demidulce Khvanchkara cultivat pe parcele montane minuscule.","f":["Patria faimosului vin Khvanchkara.","Suprafață de cultivare foarte limitată în regiunile montane."]},"ge-batumi-dolphinarium-life-v2":{"i":"/poi-images/ge-batumi-dolphinarium-life-v2.webp","s":"Amplasat în vastul Parc 6 Mai din Batumi, acest popular delfinariu oferă spectacole distractive și educative, care sunt la mare căutare în special de familiile cu copii.","f":["Deschis inițial în anul 1975.","Redeschis după modernizare în 2011."]},"shkhara-nature-v2":{"i":"/poi-images/shkhara-nature-v2.webp","s":"Șhara este cel mai înalt munte din Georgia, cu o altitudine de 5.201 metri, situat în lanțul central al Caucazului Mare.","f":["Cel mai înalt punct din Georgia și al treilea din Caucaz.","Prima ascensiune a avut loc în 1888 de către o echipă britanico-elvețiană."]},"kazbek-nature-v2":{"i":"/poi-images/kazbek-nature-v2.webp","s":"Kazbek este un stratovulcan adormit și, cu o altitudine de peste 5.000 de metri, este unul dintre cele mai proeminente vârfuri din Caucaz.","f":["Atinge o altitudine de 5.054 metri deasupra nivelului mării.","Numele său georgian 'Mkinvari' înseamnă munte de gheață sau ghețar."]},"ushba-nature-v2":{"i":"/poi-images/ushba-nature-v2.webp","s":"Ușba este adesea denumit Matterhornul Caucazului și se distinge prin dublul său vârf proeminent.","f":["Vârful sudic, la 4.710 metri, este puțin mai înalt decât cel nordic.","Numele înseamnă 'Muntele teribil' în limba svană."]},"lake-ritsa-nature-v2":{"i":"/poi-images/lake-ritsa-nature-v2.webp","s":"Lacul Rița este un lac montan de un albastru profund în nord-vestul Caucazului, amplasat într-o vale adâncă și împădurită din Abhazia.","f":["Lacul atinge o adâncime maximă de 116 metri.","Iosif Stalin a construit o reședință de vară (dacea) pe malul său."]},"paravani-lake-nature-v2":{"i":"/poi-images/paravani-lake-nature-v2.webp","s":"Lacul Paravani este cel mai mare lac din Georgia ca suprafață și se află pe un platou vulcanic în sudul țării.","f":["Este situat la o altitudine de peste 2.073 de metri deasupra nivelului mării.","Adâncimea sa maximă este puțin peste 3 metri."]},"paliastomi-lake-nature-v2":{"i":"/poi-images/paliastomi-lake-nature-v2.webp","s":"Lacul Paliastomi este situat în apropierea coastei Mării Negre și reprezintă o zonă umedă importantă în Parcul Național Colchis.","f":["Inițial un lac cu apă dulce, a fost conectat la mare în 1924.","Zona aparține zonei protejate a zonelor umede Colchis."]},"rioni-river-nature-v2":{"i":"/poi-images/rioni-river-nature-v2.webp","s":"Rioni este râul principal din vestul Georgiei și izvorăște din ghețarii Caucazului Mare.","f":["Grecii antici au derivat denumirea fazanului de la numele său 'Phasis'.","Cu 327 de kilometri, Rioni este cel mai lung râu care curge în întregime în Georgia."]},"enguri-river-nature-v2":{"i":"/poi-images/enguri-river-nature-v2.webp","s":"Enguri este un râu sălbatic și rapid care curge prin defileurile stâncoase din Svaneti înainte de a se vărsa în Marea Neagră.","f":["Barajul în arc Enguri este unul dintre cele mai înalte din lume, având 271,5 metri.","Pe alocuri, râul formează granița cu regiunea separatistă Abhazia."]},"borjomi-kharagauli-national-park-nature-v2":{"i":"/poi-images/borjomi-kharagauli-national-park-nature-v2.webp","s":"Acest vast parc național din Caucazul Mic este una dintre cele mai mari zone protejate din Europa și captivează cu pădurile sale virgine de conifere și foioase.","f":["Parcul acoperă peste 85.000 de hectare de suprafață naturală pură.","A fost înființat în 1995, cu sprijinul WWF, fiind primul parc național din Caucaz."]},"tusheti-national-park-nature-v2":{"i":"/poi-images/tusheti-national-park-nature-v2.webp","s":"Ascuns pe pantele nordice ale Caucazului Mare, Parcul Național Tușeti este un loc de o frumusețe aspră și tradiții alpine adânc înrădăcinate.","f":["Pasul Abano, principala cale de acces, se află la o altitudine de 2.850 de metri.","Zona a fost inclusă pe lista potențialelor situri ale Patrimoniului Mondial UNESCO."]},"vashlovani-national-park-nature-v2":{"i":"/poi-images/vashlovani-national-park-nature-v2.webp","s":"Parcul Național Vashlovani din extremitatea estică a Georgiei oferă un peisaj semi-deșertic extraordinar, cu formațiuni stâncoase bizare și vulcani noroioși.","f":["Numele Vashlovani se traduce literal prin 'Grădina de meri'.","Zona este cunoscută pentru prezența viperei rare de Caucaz."]},"mtirala-national-park-nature-v2":{"i":"/poi-images/mtirala-national-park-nature-v2.webp","s":"Parcul Național Mtirala, aflat în apropierea coastei Mării Negre, este cea mai umedă regiune din Georgia și captivează cu pădurile sale dense, aproape impenetrabile, de castani și fagi.","f":["Numele Mtirala înseamnă 'Cea care plânge' în georgiană, o referire la ploile abundente.","Parcul primește anual precipitații de până la 4.500 de milimetri."]},"lagodekhi-protected-areas-nature-v2":{"i":"/poi-images/lagodekhi-protected-areas-nature-v2.webp","s":"Lagodekhi este cea mai veche rezervație naturală din Georgia, situată pe versantul estic al Caucazului.","f":["A fost fondată încă din 1912 de către botanistul rus Ludwik Młokosiewicz.","Lacul Black Rock, la 3.000 de metri altitudine, este o destinație populară pentru drumeții."]},"aragvi-river-nature-v2":{"i":"/poi-images/aragvi-river-nature-v2.webp","s":"Aragvi șerpuiește prin peisajul uluitor al regiunii Mtskheta-Mtianeti, formând văi adânci.","f":["Aragvi alimentează uriașul lac de acumulare Zhinvali, care furnizează apă potabilă pentru Tbilisi.","Militara Șosea Georgiană istorică trece de-a lungul văii sale."]},"tetnuldi-nature-v2":{"i":"/poi-images/tetnuldi-nature-v2.webp","s":"Tetnuldi este un vârf maiestuos, în formă de piramidă, în regiunea Svaneti.","f":["Muntele atinge o altitudine impresionantă de 4.858 de metri.","Pe versanții săi a fost deschisă o stațiune modernă de schi."]},"kintrishi-nature-v2":{"i":"/poi-images/kintrishi-nature-v2.webp","s":"Rezervația naturală Kintrishi este ascunsă într-un defileu pitoresc de râu în regiunea muntoasă Adjara.","f":["O mare parte din zonă constă din păduri primare pure.","Rezervația adăpostește multe specii de plante endemice ale regiunii Colchis."]},"abudelauri-lakes-nature-v2":{"i":"/poi-images/abudelauri-lakes-nature-v2.webp","s":"Lacurile Abudelauri sunt un grup de lacuri alpine spectaculoase din Khevsureti, situate la poalele maiestuosului masiv Chaukhi.","f":["Lacul alb își datorează culoarea prafului fin de ghețar.","Lacurile sunt fără gheață și accesibile drumeților din iunie până în septembrie."]},"kolkheti-national-park-nature-v2":{"i":"/poi-images/kolkheti-national-park-nature-v2.webp","s":"Parcul Național Colchis se întinde de-a lungul coastei Mării Negre și păstrează peisajele mlăștinoase unice și pădurile inundabile din anticul Colchis.","f":["Mari părți ale parcului sunt recunoscute internațional ca zone umede Ramsar.","Pădurile dense de mlaștină sunt considerate relicve din epoca glaciară."]},"laila-relief-v2":{"i":"/poi-images/laila-relief-v2.webp","s":"Laila este cel mai înalt vârf din lanțul muntos Svaneti, având o altitudine de aproximativ 4.000 de metri.","f":["Cel mai înalt vârf din lanțul Svaneti.","O destinație populară pentru alpiniștii experimentați."]},"diklosmta-relief-v2":{"i":"/poi-images/diklosmta-relief-v2.webp","s":"Muntele Diklosmta se înalță impunător la granița dintre Georgia și Rusia.","f":["Atinge o altitudine de 4.285 de metri.","Situat la granița cu Daghestan."]},"tebulosmta-relief-v2":{"i":"/poi-images/tebulosmta-relief-v2.webp","s":"Muntele Tebulosmta este cel mai înalt munte din Caucazul de Est și domină regiunea izolată Tușeti.","f":["Cu 4.492 de metri, este cel mai înalt munte din regiune.","Pantele sunt înconjurate de pajiști alpine."]},"shota-rustaveli-peak-relief-v2":{"i":"/poi-images/shota-rustaveli-peak-relief-v2.webp","s":"Acest munte, numit după celebrul poet național georgian, este situat în lanțul central al Caucazului.","f":["Are peste 4.800 de metri înălțime.","Numit după poetul din secolul al XII-lea."]},"ailama-relief-v2":{"i":"/poi-images/ailama-relief-v2.webp","s":"Ailama este un munte proeminent în formă de piramidă în Caucazul Mare.","f":["Altitudinea este de 4.547 de metri.","Considerată o destinație alpină provocatoare."]},"khvamli-massif-relief-v2":{"i":"/poi-images/khvamli-massif-relief-v2.webp","s":"Masivul Khvamli este un platou impresionant de calcar care se înalță maiestuos deasupra regiunii Lechkhumi.","f":["Atinge o altitudine de 2.002 metri.","Important în mitologia georgiană."]},"didgori-mountain-relief-v2":{"i":"/poi-images/didgori-mountain-relief-v2.webp","s":"Didgori este cunoscut mai puțin pentru înălțimea sa, cât pentru imensa sa importanță istorică.","f":["Are o înălțime de 1.647 de metri.","Locul faimoasei bătălii de la Didgori."]},"mtatsminda-relief-v2":{"i":"/poi-images/mtatsminda-relief-v2.webp","s":"Muntele Sfânt Mtatsminda domină orizontul capitalei Tbilisi.","f":["Se ridică la 715 metri deasupra nivelului mării.","Găzduiește Panteonul scriitorilor georgieni."]},"likhi-range-relief-v2":{"i":"/poi-images/likhi-range-relief-v2.webp","s":"Lanțul Muntos Likhi leagă Caucazul Mare de Caucazul Mic și împarte Georgia climatic și geografic într-o jumătate estică și una vestică.","f":["Conectează două mari sisteme montane.","O importantă linie de demarcație climatică."]},"trialeti-range-relief-v2":{"i":"/poi-images/trialeti-range-relief-v2.webp","s":"Lanțul Muntos Trialeti este un lanț muntos vulcanic alungit din Caucazul Mic.","f":["Cel mai înalt punct este muntele Shaviklde.","Bogat în izvoare geotermale."]},"javakheti-plateau-relief-v2":{"i":"/poi-images/javakheti-plateau-relief-v2.webp","s":"Vastul platou vulcanic Javakheti din sudul Georgiei este cunoscut pentru clima sa rece și aspră.","f":["Altitudinea este în general de peste 2.000 de metri.","Găzduiește numeroase zone umede importante."]},"iori-plateau-relief-v2":{"i":"/poi-images/iori-plateau-relief-v2.webp","s":"Podișul Iori din sud-estul Georgiei se întinde ca un vast peisaj de stepă și semi-deșert între râurile Kura și Alazani.","f":["Caracterizat de secetă și climă de stepă.","Un habitat important pentru păsările de pradă."]},"udabno-desert-relief-v2":{"i":"/poi-images/udabno-desert-relief-v2.webp","s":"Deșertul Udabno înconjoară mănăstirea istorică rupestră David Gareja.","f":["Numele înseamnă literal 'deșert' în georgiană.","Regiunea este bogată în minerale."]},"pankisi-gorge-relief-v2":{"i":"/poi-images/pankisi-gorge-relief-v2.webp","s":"Valea Pankisi este o vale muntoasă mărginită de păduri dense în nord-estul Georgiei, străbătută de râul Alazani.","f":["Are aproximativ 10 kilometri lungime.","Găzduiește o cultură caucaziană unică."]},"kodori-gorge-relief-v2":{"i":"/poi-images/kodori-gorge-relief-v2.webp","s":"Spectaculosul defileu Kodori din Abhazia este o vale fluvială adânc sculptată care șerpuiește printr-un teren extrem de accidentat.","f":["Una dintre cele mai inaccesibile văi din regiune.","Pădurile oferă habitat urșilor și lupilor."]},"truso-valley-relief-v2":{"i":"/poi-images/truso-valley-relief-v2.webp","s":"Valea Truso, situată lângă granița cu Rusia, este renumită pentru izvoarele sale minerale colorate, turnurile medievale abandonate și peisajul montan aspru, aproape fără copaci.","f":["Bogată în izvoare minerale carbogazoase.","Situată la o altitudine de peste 2.000 de metri."]},"sno-valley-relief-v2":{"i":"/poi-images/sno-valley-relief-v2.webp","s":"Valea Sno este un bazin alpin idilic înconjurat de vârfuri înzăpezite maiestuoase.","f":["Un punct de plecare popular pentru drumeții montane.","Se ramifică de pe Drumul Militar Georgian."]},"darial-gorge-relief-v2":{"i":"/poi-images/darial-gorge-relief-v2.webp","s":"Defileul Darial este o trecătoare legendară în care râul Terek străpunge bariera masivă a Caucazului.","f":["Cunoscut istoric sub numele de 'Porțile Alanilor'.","O trecere importantă a frontierei spre Rusia."]},"borjomi-gorge-relief-v2":{"i":"/poi-images/borjomi-gorge-relief-v2.webp","s":"Defileul Borjomi este o vale adâncă a râului Kura, renumită pentru pădurile sale dense de conifere și izvoarele naturale de vindecare.","f":["Casa celebrei ape minerale Borjomi.","Caracterizată printr-un microclimat special, vindecător."]},"adjara-coast-relief-v2":{"i":"/poi-images/adjara-coast-relief-v2.webp","s":"Coasta Mării Negre din Adjara se întinde în sud-vestul Georgiei și combină vegetația umedă subtropicală cu plajele pitorești cu pietriș.","f":["Climă subtropicală cu ierni blânde.","Plajele sunt formate predominant din pietriș."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
