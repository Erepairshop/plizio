*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#060614;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
header{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:#0a0a1f;border-bottom:1px solid #ffffff14;position:relative;z-index:5}
header a.back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#ffffff14;color:#fff;text-decoration:none;font-weight:700}
header a.back:active{background:#ffffff28}
header h1{margin:0;font-size:1rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .langs{display:flex;gap:.25rem}
.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.drag{cursor:grabbing}
.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}
.region:hover{fill:#2d3a78}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#000;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#60a5fa}
.poi.g-sight circle{fill:#fbbf24}
.poi.g-nature circle{fill:#22c55e}
.poi.g-history circle{fill:#c084fc}
.poi.g-industry circle{fill:#fb923c}
.poi.g-other circle{fill:#9ca3af}
.poi.dim{opacity:.18}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7;fill:#fff;opacity:1}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:#0d1230;border-top:1px solid #ffffff20;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -10px 40px #00000080}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a{display:flex;align-items:center;gap:.55rem;padding:.55rem .55rem;border-radius:8px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:active{background:#ffffff14}
.popup .list a .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.popup .list a .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup .list a .g{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.popup .list .nl{padding:.6rem;color:#ffffff70;font-size:.85rem;font-style:italic}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}
</style>

998 óta egy 2,8 km hosszú drótkötélpályán érhető el Kurintarból.","1302 méteres magasságban található."]},"np-tal-barahi-temple-landmarks-v2":{"i":"/poi-images/np-tal-barahi-temple-landmarks-v2.webp","s":"Egy kétszintes pagoda-templom a Phewa-tó egyik apró szigetén, Pokharában, amelyet Adzsima védőistennőnek szenteltek.","f":["Kizárólag fa csónakokkal közelíthető meg.","Szombatonként gyakran tartanak itt hindu esküvői szertartásokat."]},"np-bindhyabasini-temple-landmarks-v2":{"i":"/poi-images/np-bindhyabasini-temple-landmarks-v2.webp","s":"Pokhara legrégebbi temploma a városközpont egyik kis dombján áll, és Bhagvati istennőnek van szentelve Durga formájában.","f":["Feltehetően az 1760-as években építtette Khadag Bum Malla király.","Panorámás kilátást nyújt Pokhara városára."]},"np-davis-falls-landmarks-v2":{"i":"/poi-images/np-davis-falls-landmarks-v2.webp","s":"Egy vízesés Pokharában, ahol a víz egy föld alatti alagútba zuhan, amely 500 méter hosszú és 30 méter mélyen nyúlik a föld alá.","f":["Egy Davi nevű svájci nőről kapta a nevét, aki 1961-ben itt fulladt meg.","A helyi nepáli neve Patale Chhango (Alvilági-vízesés)."]},"np-gupteshwor-mahadev-cave-landmarks-v2":{"i":"/poi-images/np-gupteshwor-mahadev-cave-landmarks-v2.webp","s":"Egy mély, nedves mészkőbarlang Pokharában, közvetlenül a Davis-vízeséssel szemben, amely egy nagy, Shiva-lingam alakú sztalagmitot rejt.","f":["Nepál egyik leghosszabb barlangjaként tartják számon.","A barlang alsó részét gyakran elárasztja a Davis-vízesés vize."]},"np-international-mountain-museum-landmarks-v2":{"i":"/poi-images/np-international-mountain-museum-landmarks-v2.webp","s":"Egy pokharai múzeum, amely a hegymászás történetének, a Himalája népeinek, valamint a régió növény- és állatvilágának van szentelve.","f":["2004-ben nyitották meg hivatalosan.","Történelmi himalájai expedíciók eredeti felszereléseit őrzi."]},"np-sarangkot-viewpoint-landmarks-v2":{"i":"/poi-images/np-sarangkot-viewpoint-landmarks-v2.webp","s":"Pokharától ny i-images/np-pathibhara-devi-temple-landmarks-v2.webp","s":"Nepál egyik legjelentősebb hindu temploma, amely a Pathibhara-hegyen trónol, Taplejung régióban.","f":["3794 méteres magasságban található.","A zarándokok gyakran állatáldozatokat, valamint aranyat és ezüstöt ajánlanak fel az istennőnek."]},"np-bajrayogini-temple-landmarks-v2":{"i":"/poi-images/np-bajrayogini-temple-landmarks-v2.webp","s":"Egy tantrikus templom az ősi Sankhu város közelében egy dombon, amelyet a hasonló nevű buddhista istennőnek szenteltek.","f":["Eredetileg Pratap Malla király építtette a 17. században.","A fő istenséget a hinduk és a buddhisták egyaránt tisztelik."]},"np-guhyeshwari-temple-landmarks-v2":{"i":"/poi-images/np-guhyeshwari-temple-landmarks-v2.webp","s":"Egy nagy tiszteletnek örvendő templom Katmanduban, Pashupatinath közelében, amelyet Parvati hindu istennőnek szenteltek.","f":["Dél-Ázsia egyik elismert Shakti Pithája.","Kizárólag hinduk léphetnek be a belső udvarra."]},"central-zoo-life-v2":{"i":"/poi-images/central-zoo-life-v2.webp","s":"Nepál egyetlen történelmi állatkertje Jawalakhelben található, ahol a családok testközelből figyelhetik meg a bengáli tigriseket, az indiai orrszarvúkat és számos madárfajt.","f":["1932-ben alapították.","Lalitpurban található."]},"kathmandu-fun-park-life-v2":{"i":"/poi-images/kathmandu-fun-park-life-v2.webp","s":"A főváros szívében található színes vidámpark óriáskerékkel, dodzsemmel és klasszikus körhintákkal vonz naponta több száz nevető gyermeket.","f":["A Bhrikuti Mandap mellett található.","Klasszikus vidámparki játékok."]},"ilam-tea-gardens-life-v2":{"i":"/poi-images/ilam-tea-gardens-life-v2.webp","s":"Ilam lágyan hullámzó, smaragdzöld dombjai a nepáli teatermelés központját jelentik, ahol a híres hegyvidéki teát gondosan szüretelik.","f":["Nepál legnagyobb teatermelő régiója.","Hagyományos teakészítési eljárások."]},"godawari-botanical-garden-life-v2":{"i":"/poi-images/godawari-botanical-garden-life-v2.webp","s":"Ez a csendes menedékhely a Phulchowki-hegy lábánál Nepál gazdag növényvilágának élő laboratóriuma, és a városiak kedvelt piknikezőhelye.","f":["1962-ben nyitották meg.","Több mint 500 növényfaj."]},"lumbini-crane-sanctuary-life-v2":{"i":"/poi-images/lumbini-crane-sanctuary-life-v2.webp","s":"Buddha szülőhelye körül a természetvédők megőrizték ezt a vizes élőhelyet, amely létfontosságú menedéket nyújt a fenséges, veszélyeztetett antigonédarvaknak.","f":["A veszélyeztetett antigonédarut védi.","A Lumbini mesterterv része."]},"phulchowki-bird-watching-area-life-v2":{"i":"/poi-images/phulchowki-bird-watching-area-life-v2.webp","s":"A Katmandu-völgy körüli legmagasabb domb egy erdős paradicsom, ahol ornitológusok kutatnak a legritkább himalájai madarak után.","f":["A Katmandu-völgy legmagasabb pontja (2782 m).","Több mint 300 madárfaj otthona."]},"parsa-national-park-life-v2":{"i":"/poi-images/parsa-national-park-life-v2.webp","s":"A Siwalik-hegységben elterülő hatalmas rezervátum egykor királyi vadászterület volt, ma pedig az ázsiai vadon élő elefántok növekvő populációjának védett menedéke.","f":["1984-ben alapították vadvédelmi területként.","2017-ben nemzeti parkká nyilvánították."]},"banke-national-park-life-v2":{"i":"/poi-images/banke-national-park-life-v2.webp","s":"Nepál Terai régiójának legfiatalabb nemzeti parkjaként ezt a területet kifejezetten a veszélyeztetett bengáli tigris védett élőhelyeinek kiterjesztéseként hozták létre.","f":["2010-ben alapították.","Fontos tigris-folyosó."]},"khaptad-national-park-life-v2":{"i":"/poi-images/khaptad-national-park-life-v2.webp","s":"Ez a távoli, spirituális csodavilág Nepál távol-nyugati részén hatalmas, zöld mocsárvidékeket, sűrű fenyveseket és szent meditációs helyeket ötvöz.","f":["A Khaptad Baba Asram otthona.","Ritka gyógynövények nőnek itt."]},"api-nampa-conservation-area-life-v2":{"i":"/poi-images/api-nampa-conservation-area-life-v2.webp","s":"Az ország legészaknyugatibb részén található védett terület egy érintetlen ökoszisztéma, ahol ritka hópárducok vadásznak és nomádok legeltetik jakjaikat.","f":["Az Api és a Nampa hegyekről nevezték el.","Hópárduc élőhely."]},"manaslu-conservation-area-life-v2":{"i":"/poi-images/manaslu-conservation-area-life-v2.webp","s":"A világ nyolcadik legmagasabb hegye körül terül el az a védett régió, amelyet a veszélyeztetett pézsmaszarvasok és kékjuh nyájak laknak extrém magasságokban.","f":["1663 négyzetkilométeres területet fed le.","33 emlősfajnak ad otthont."]},"gaurishankar-conservation-area-life-v2":{"i":"/poi-images/gaurishankar-conservation-area-life-v2.webp","s":"Ez a zord védett terület létfontosságú ökológiai folyosóként szolgál a Langtang és Sagarmatha nemzeti parkok között, ahol vörös macskamedvék barangolnak a sűrű bambuszerdőkben.","f":["Összeköti a Langtang és a Sagarmatha parkokat.","Gazdag vörös macskamedve-populációban."]},"krishnasar-conservation-area-life-v2":{"i":"/poi-images/krishnasar-conservation-area-life-v2.webp","s":"Egy kis, de fontos védett terület a Terai régióban, amelyet kifejezetten azért hoztak létre, hogy megmentsék a korábban a kihalás szélén álló indiai antilopot.","f":["Fő fókusza az indiai antilop (Blackbuck).","Sikeres populáció-helyreállítási program."]},"dhorpatan-hunting-reserve-life-v2":{"i":"/poi-images/dhorpatan-hunting-reserve-life-v2.webp","s":"Nepál egyetlen vadászrezervátumaként itt szigorúan felügyelik és szabályozzák a kékjuhok és a himalájai tahr populációját az alpesi legelők ökológiai egyensúlyának fenntartása érdekében.","f":["Az egyetlen vadászrezervátum Nepálban.","Szigorú kvóták a kékjuhok vadászatára."]},"mustang-apple-orchards-life-v2":{"i":"/poi-images/mustang-apple-orchards-life-v2.webp","s":"A száraz, szélfútta Mustang régióban, különösen Marphában a gazdák nagy magasságban termesztenek lédús almát, amely egyedi, ropogós ízéről híres.","f":["A központja Marpha falu.","Híres az almaborról és a szárított almáról."]},"gulmi-coffee-plantations-life-v2":{"i":"/poi-images/gulmi-coffee-plantations-life-v2.webp","s":"A Gulmi kerület meredek, teraszos lejtőin, árnyékot adó fák alatt termesztik a kiváló minőségű arabica kávét, amely megalapozta Nepál hírnevét a különleges kávék terén.","f":["A nepáli kávé úttörő régiója.","Kizárólag organikus termesztés."]},"whoopee-land-amusement-park-life-v2":{"i":"/poi-images/whoopee-land-amusement-park-life-v2.webp","s":"Katmandu egyik legizgalmasabb modern vízi- és vidámparkja, amely tökéletes felfrissülést és izgalmakat kínál a családoknak sebes csúszdáival.","f":["A völgy legnagyobb modern víziparkja.","Életnagyságú dinoszaurusz-replikák."]},"kulekhani-fish-farms-life-v2":{"i":"/poi-images/kulekhani-fish-farms-life-v2.webp","s":"A Kulekhani mesterséges víztározó körül virágzó akvakultúra-ipar alakult ki, amely friss hallal látja el a Katmandu-völgyet.","f":["Nepál legnagyobb víztározója (Indra Sarobar).","A kereskedelmi pisztrángtenyésztésről ismert."]},"ostrich-nepal-farm-life-v2":{"i":"/poi-images/ostrich-nepal-farm-life-v2.webp","s":"Ez az úttörő farm a Rupandehi kerületben hozta el a kereskedelmi strucctenyésztést Nepálba, és ma lenyűgöző agroturisztikai célpont a családok számára.","f":["Az első kereskedelmi struccfarm Nepálban.","A Rupandehi kerületi Gangoliyában található."]},"chitlang-organic-village-life-v2":{"i":"/poi-images/chitlang-organic-village-life-v2.webp","s":"A Katmanduhoz közeli zöld dombok között megbúvó békés falu kecskesajtgyártásáról, bio olajbogyóiról és fenntartható gazdálkodási módszereiről ismert.","f":["Nepál első kecskesajtgyártó üzeme.","Az olajbogyó-termesztés úttörője Nepálban."]},"sagarmatha-national-park-nature-v2":{"i":"/poi-images/sagarmatha-national-park-nature-v2.webp","s":"Himalájai természetvédelmi terület, amelyet a Mount Everest ural, és az UNESCO világörökség része.","f":["1976-ban alapították.","A ritka hópárduc élőhelye."]},"chitwan-national-park-nature-v2":{"i":"/poi-images/chitwan-national-park-nature-v2.webp","s":"Nepál legrégebbi nemzeti parkja, amely biológiai sokféleségéről és s ,"shey-phoksundo-national-park-nature-v2":{"i":"/poi-images/shey-phoksundo-national-park-nature-v2.webp","s":"Transzhimalájai nemzeti park Északnyugat-Nepálban, látványos hegyvidéki tájakkal.","f":["Itt található a mélykék Phoksundo-tó.","Az egyetlen nemzeti park a Dolpa régióban."]},"koshi-tappu-wildlife-reserve-nature-v2":{"i":"/poi-images/koshi-tappu-wildlife-reserve-nature-v2.webp","s":"Fontos vizes élőhely a Sapta Koshi folyó mentén, amely változatos madárvilágáról ismert.","f":["1987 óta fontos Ramsari terület.","A vadon élő vízibivalyok utolsó menedéke Nepálban."]},"karnali-river-nature-v2":{"i":"/poi-images/karnali-river-nature-v2.webp","s":"Nepál leghosszabb folyója, amely Tibetben ered és Indiába áramlik.","f":["Körülbelül 507 kilométer hosszú Nepálban.","Népszerű a vadvízi evezős expedíciók körében."]},"kali-gandaki-river-nature-v2":{"i":"/poi-images/kali-gandaki-river-nature-v2.webp","s":"Hatalmas himalájai folyó, amely a világ legmélyebb szurdokáról ismert.","f":["A Dhaulagiri és az Annapurna között folyik.","Ismert a Shaligram nevű fekete ammonitesz kövületekről."]},"kanchenjunga-nature-v2":{"i":"/poi-images/kanchenjunga-nature-v2.webp","s":"A világ harmadik legmagasabb hegye, Nepál és az indiai Szikkim állam határán.","f":["Magassága 8586 méter.","A neve azt jelenti: 'A nagy hó öt kincsesháza'."]},"makalu-nature-v2":{"i":"/poi-images/makalu-nature-v2.webp","s":"A világ ötödik legmagasabb hegye, jellegzetes négyoldalú piramis alakú csúccsal.","f":["8485 méter magas.","Mindössze 19 kilométerre délkeletre fekszik a Mount Everesttől."]},"dhaulagiri-nature-v2":{"i":"/poi-images/dhaulagiri-nature-v2.webp","s":"Hatalmas hegymasszívum és a Föld hetedik legmagasabb hegye.","f":["Legmagasabb csúcsa 8167 méter.","1960-ban mászták meg először."]},"shivapuri-nagarjun-national-park-nature-v2":{"i":"/poi-images/shivapuri-nagarjun-national-park-nature-v2.webp","s":"A fővároshoz, Katmanduhoz legközelebb eső, sűrű erdőkkel borított nemzeti park.","f":["Fontos vízforrásként szolgál Katmandu számára.","Népszerű célpont egynapos túrázásokhoz."]},"shuklaphanta-national-park-nature-v2":{"i":"/poi-images/shuklaphanta-national-park-nature-v2.webp","s":"Természetvédelmi terület Nepál legdélnyugatibb részén, kiterjedt füves pusztákkal.","f":["Itt él Nepál legnagyobb mocsári szarvas populációja.","2017-ben kapott nemzeti parki státuszt."]},"sun-kosi-river-nature-v2":{"i":"/poi-images/sun-kosi-river-nature-v2.webp","s":"Jelentős folyó, amely a Himalája lábánál folyik, és a zúgóiról híres.","f":["A neve azt jelenti: 'Arany folyó'.","A világ egyik legjobb vadvízi evezős folyója."]},"nepal-lhotse-relief-v2":{"i":"/poi-images/nepal-lhotse-relief-v2.webp","s":"A Lhoce a világ negyedik legmagasabb hegye, amely a Mount Everest közvetlen szomszédságában található.","f":["Magassága eléri a 8516 métert.","A csúcsot a Déli-nyereg köti össze az Everesttel."]},"nepal-cho-oyu-relief-v2":{"i":"/poi-images/nepal-cho-oyu-relief-v2.webp","s":"A Cso-Oju a Föld hatodik legmagasabb hegye, és a legkönnyebben megmászható nyolcezresként tartják számon.","f":["Neve tibeti nyelven türkizkék istennőt jelent.","Magassága 8188 méter."]},"nepal-manaslu-relief-v2":{"i":"/poi-images/nepal-manaslu-relief-v2.webp","s":"A Manaszlu a világ nyolcadik legmagasabb hegye, amelyet meredek, gleccserekkel borított lejtők jellemeznek.","f":["Magassága 8163 méter.","Elsőként egy japán csapat mászta meg 1956-ban."]},"nepal-annapurna-i-relief-v2":{"i":"/poi-images/nepal-annapurna-i-relief-v2.webp","s":"Az Annapurna I Nepál harmadik és a világ tizedik legmagasabb hegye, amely veszélyességéről hírhedt.","f":["8091 méterével ez volt az első megmászott nyolcezres.","Maurice Herzog mászta meg először 1950-ben."]},"nepal-machapuchare-relief-v2":{"i":"/poi-images/nepal-machapuchare-relief-v2.webp","s":"A Macsapucsaré egy szent hegy az Annapurna-masszívumban, amely halfarok formájáról híres.","f":["A hegy le van zárva a hegymászók elől.","Magassága eléri a 6993 métert."]},"nepal-ama-dablam-relief-v2":{"i":"/poi-images/nepal-ama-dablam-relief-v2.webp","s":"Az Ama Dablam egy jellegzetes hegy a Khumbu-régióban, amelyet gyakran a Himalája Matterhornjának neveznek.","f":["A főcsúcs 6812 méter magas.","A technikás hegymászók népszerű célpontja."]},"nepal-pumori-relief-v2":{"i":"/poi-images/nepal-pumori-relief-v2.webp","s":"A Pumori egy piramis alakú hegy a Mount Everesttől nyugatra, amelyet gyakran csodálnak meg az Everest-túrázók.","f":["Neve hajadon lányt jelent.","A hegy magassága 7161 méter."]},"nepal-nuptse-relief-v2":{"i":"/poi-images/nepal-nuptse-relief-v2.webp","s":"A Nupce egy látványos hegygerinc a Khumbu-régióban, amely a Lhoce és az Everest hegyekkel patkót alkot.","f":["A főcsúcs eléri a 7861 métert.","A hegynek meredek, sziklás déli fala van."]},"nepal-gyachung-kang-relief-v2":{"i":"/poi-images/nepal-gyachung-kang-relief-v2.webp","s":"A Gyachung Kang a világ legmagasabb hegye, amely nem tartozik a nyolcezresek közé.","f":["A Mahalangur Himal hegyvonulatban fekszik a tibeti határon.","Magassága 7952 méter."]},"nepal-langtang-lirung-relief-v2":{"i":"/poi-images/nepal-langtang-lirung-relief-v2.webp","s":"A Langtang Lirung a Langtang-Himal legmagasabb csúcsa, amely a Katmandu-völgytől északra található.","f":["A csúcs magassága 7227 méter.","A hegy hatalmas jéglavináiról ismert."]},"nepal-himalchuli-relief-v2":{"i":"/poi-images/nepal-himalchuli-relief-v2.webp","s":"A Himalchuli egy hatalmas hegy a Mansiri Himalban, amely látványosan magasodik a Marsyangdi-völgy fölé.","f":["A hegy 7893 méter magas.","Három jellegzetes főcsúcsa van."]},"nepal-kathmandu-valley-relief-v2":{"i":"/poi-images/nepal-kathmandu-valley-relief-v2.webp","s":"A Katmandu-völgy Nepál történelmi, kulturális és politikai központja, amelyet zöldellő dombok vesznek körül.","f":["Az átlagos magasság 1400 méter.","Hét UNESCO világörökségi helyszínnek ad otthont."]},"nepal-pokhara-valley-relief-v2":{"i":"/poi-images/nepal-pokhara-valley-relief-v2.webp","s":"A Pokhara-völgy egy festői régió Közép-Nepálban, amely híres nyugodt tavairól és barlangjairól.","f":["A Phewa-tó a völgy legnagyobb tava.","Ez az Annapurna-túrák kiindulópontja."]},"nepal-khumbu-valley-relief-v2":{"i":"/poi-images/nepal-khumbu-valley-relief-v2.webp","s":"A Khumbu-völgy a serpák hazája és a világ legmagasabb hegyeihez vezető útvonal.","f":["A völgy Északkelet-Nepálban található.","Itt terül el a Sagarmatha Nemzeti Park."]},"nepal-langtang-valley-relief-v2":{"i":"/poi-images/nepal-langtang-valley-relief-v2.webp","s":"A Langtang-völgy egy gyönyörű gleccservölgy a Himalájában, amely alpesi növény- és állatvilágáról ismert.","f":["Gyakran a gleccserek völgyének is nevezik.","A túraútvonal legmagasabb pontja meghaladja a 4900 métert."]},"nepal-tsum-valley-relief-v2":{"i":"/poi-images/nepal-tsum-valley-relief-v2.webp","s":"A Tsum-völgy egy elszigetelt himalájai völgy, amely mélyen gyökerező tibeti buddhista örökségéről ismert.","f":["A Tsum név az élénk jelentésű tibeti szóból ered.","A régiót csak 2008-ban nyitották meg a túrázók előtt."]},"nepal-manang-valley-relief-v2":{"i":"/poi-images/nepal-manang-valley-relief-v2.webp","s":"A Manang-völgy az Annapurna esőárnyékában fekszik, és száraz, sivatagszerű tájat kínál.","f":["Fontos megálló az Annapurna-körúton.","A helyi kultúra erős tibeti hatást mutat."]},"nepal-kali-gandaki-valley-relief-v2":{"i":"/poi-images/nepal-kali-gandaki-valley-relief-v2.webp","s":"A Kali Gandaki-völgy a világ egyik legmélyebb szurdokát képezi a Dhaulagiri és az Annapurna hegyek között.","f":["A szintkülönbség több mint 5500 méter.","A völgy ősi kereskedelmi útvonal volt Tibet felé."]},"nepal-gokyo-valley-relief-v2":{"i":"/poi-images/nepal-gokyo-valley-relief-v2.webp","s":"A Gokyo-völgy egy látványos hegyvidéki régió azúrkék tavakkal és a hatalmas Ngozumpa-gleccserrel.","f":["A legmagasabban fekvő tó 4990 méteren található.","Alternatív túraútvonalat kínál az Everest-alaptábor felé."]},"nepal-mustang-plateau-relief-v2":{"i":"/poi-images/nepal-mustang-plateau-relief-v2.webp","s":"A Mustang-fennsík egy száraz, magasan fekvő régió, amely ősi tibeti kultúrájáról és barlangjairól ismert.","f":["A régió fővárosa Lo Manthang.","Ez a világ egyik legjobb állapotban fennmaradt tibeti enklávéja."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=6;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","industry","other"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
