.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}

.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}

.poi.hidden{display:none !important}
.poi.reveal{display:initial}

.cluster{cursor:pointer}
.cluster circle{transition:r .12s}

.popup{position:absolute;bottom:0;left:0;right:0;background:rgba(11,19,35,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(120,180,255,.3);border-radius:18px 18px 0 0;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -12px 44px rgba(0,0,0,.6)}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}

.burst-line{stroke:rgba(120,185,255,.4);stroke-width:1.1;stroke-linecap:round;animation:burstFade .25s ease-out}
.burst-core{fill:#cdeeff;filter:drop-shadow(0 0 5px #7fd0ff)}

Industrie der Region unterstützt.","f":["Gegründet im Jahr 1972.","Fördert die lokale Teeproduktion und Verarbeitung."]},"trishuli-hydropower-economic-v2":{"i":"/poi-images/trishuli-hydropower-economic-v2.webp","s":"Eines der ältesten Wasserkraftprojekte Nepals am Trishuli-Fluss, das zur frühen Elektrifizierung des Landes beitrug.","f":["Ging 1967 in Betrieb.","Erbaut in Zusammenarbeit mit Indien."]},"bhairahawa-sez-economic-v2":{"i":"/poi-images/bhairahawa-sez-economic-v2.webp","s":"Die erste Sonderwirtschaftszone Nepals, die eingerichtet wurde, um ausländische Investitionen anzuziehen und Exporte zu fördern.","f":["Wurde 2014 eingeweiht.","Bietet Unternehmen Steuererleichterungen und Vergünstigungen."]},"np-swayambhunath-history-v2":{"i":"/poi-images/np-swayambhunath-history-v2.webp","s":"Ein alter religiöser Komplex auf einem Hügel im Kathmandu-Tal, oft als Affentempel bezeichnet.","f":["Vor etwa 2.000 Jahren gegründet.","Die Stupa hat Buddhas Augen auf allen vier Seiten gemalt."]},"np-boudhanath-history-v2":{"i":"/poi-images/np-boudhanath-history-v2.webp","s":"Eine der größten kugelförmigen Stupas in Nepal, die das Mandala repräsentiert und als Zentrum des tibetischen Buddhismus dient.","f":["Es wurde 1979 zum UNESCO-Weltkulturerbe erklärt.","Das massive Mandala macht es zu einer der größten Stupas der Welt."]},"np-pashupatinath-history-v2":{"i":"/poi-images/np-pashupatinath-history-v2.webp","s":"Ein berühmter und heiliger Hindu-Tempelkomplex am Ufer des Flusses Bagmati.","f":["Dem Gott Shiva gewidmet, im 5. Jahrhundert erbaut.","Nur Hindus dürfen den Haupthof des Tempels betreten."]},"np-kathmandu-durbar-history-v2":{"i":"/poi-images/np-kathmandu-durbar-history-v2.webp","s":"Der historische Platz vor dem alten Königspalast des ehemaligen Königreichs Kathmandu.","f":["Der Platz ist von spektakulärer Newari-Architektur umgeben.","Er erlitt beim Erdbeben 2015 schwere Schäden."]},"np-patan-durbar-history-v2":{"i":"/poi-images/np-patan-durbar-history-v2.webp","s":"Dieser Platz ist ein Wunder der Newa-Architektur und das Zentrum der alten Stadt Lalitpur.","f":["Berühmt für den 1637 erbauten Krishna Mandir.","Der Platz ist mit roten Ziegeln gepflastert."]},"np-bhaktapur-durbar-history-v2":{"i":"/poi-images/np-bhaktapur-durbar-history-v2.webp","s":"Der königliche Palast des alten Königreichs Bhaktapur in einer Stadt, die als Freilichtmuseum bekannt ist.","f":["Zu den Highlights gehört der Palast der 55 Fenster.","Das Goldene Tor ist ein Meisterwerk der Repoussé-Kunst."]},"np-changunarayan-history-v2":{"i":"/poi-images/np-changunarayan-history-v2.webp","s":"Er gilt als der älteste Tempel in Nepal und steht auf einem hohen Hügel mit herrlichem Blick.","f":["Der Tempel stammt aus dem 4. Jahrhundert.","Er weist einige der feinsten traditionellen nepalesischen Holzschnitzereien auf."]},"np-lumbini-history-v2":{"i":"/poi-images/np-lumbini-history-v2.webp","s":"Ein buddhistischer Wallfahrtsort, an dem Königin Mahamayadevi Siddhartha Gautama gebar.","f":["Buddha wurde hier um 563 v. Chr. geboren.","Die Ashoka-Säule wurde 249 v. Chr. von Kaiser Ashoka errichtet."]},"np-nyatapola-history-v2":{"i":"/poi-images/np-nyatapola-history-v2.webp","s":"Eine bemerkenswerte fünfstöckige Pagode in Bhaktapur, die den Höhepunkt der nepalesischen Tempelarchitektur darstellt.","f":["Erbaut 1702 von König Bhupatindra Malla.","Es überstand sowohl die schweren Erdbeben von 1934 als auch von 2015."]},"np-dharahara-history-v2":{"i":"/poi-images/np-dharahara-history-v2.webp","s":"Ein historischer neunstöckiger Turm im Zentrum von Kathmandu, der ursprünglich für militärische Zwecke erbaut wurde.","f":["Vom Premierminister Bhimsen Thapa im Jahr 1832 in Auftrag gegeben.","Es stürzte beim Erdbeben 2015 ein, wurde aber wieder aufgebaut."]},"np-nuwakot-durbar-history-v2":{"i":"/poi-images/np-nuwakot-durbar-history-v2.webp","s":"Eine herausragende historische Festung, die eine Schlüsselrolle bei der Einigung Nepals unter König Prithvi Narayan Shah spielte.","f":["Der Hauptpalast ist ein siebenstöckiges Ziegelgebäude.","Es diente während des Einigungsfeldzugs als Hauptstadt."]},"np-gorkha-durbar-history-v2":{"i":"/poi-images/np-gorkha-durbar-history-v2.webp","s":"Ein alter Palast- und Tempelkomplex auf einem Hügel, das angestammte Zuhause der Shah-Dynastie.","f":["Geburtsort von König Prithvi Narayan Shah.","Es überblickt das weite Trisuli-Tal."]},"np-janaki-mandir-history-v2":{"i":"/poi-images/np-janaki-mandir-history-v2.webp","s":"Ein optisch beeindruckender Hindu-Tempel in Janakpur, der der Göttin Sita gewidmet ist und sich durch eine ausgeprägte Rajput-Architektur auszeichnet.","f":["Erbaut 1910 von Königin Brisabhanu Kunwari aus Tikamgarh.","Es wird oft als Nau Lakha Mandir (Neun-Lakh-Tempel) bezeichnet."]},"np-muktinath-history-v2":{"i":"/poi-images/np-muktinath-history-v2.webp","s":"Ein heiliger Wallfahrtsort für Hindus und Buddhisten auf großer Höhe im Distrikt Mustang.","f":["Der Tempel liegt auf einer Höhe von 3.710 Metern.","Er verfügt über 108 steinerne Wasserspeier, die in Form von Kuhköpfen geschnitzt sind."]},"np-tansen-durbar-history-v2":{"i":"/poi-images/np-tansen-durbar-history-v2.webp","s":"Ein historischer Palast im Distrikt Palpa, der das große Erbe der Sen-Dynastie vor der Einigung Nepals widerspiegelt.","f":["Erbaut 1927 von Pratap Shamsher Jang Bahadur Rana.","Der Durbar wurde 2006 während des maoistischen Konflikts schwer beschädigt, später aber restauriert."]},"np-ranighat-history-v2":{"i":"/poi-images/np-ranighat-history-v2.webp","s":"Oft als das Taj Mahal von Nepal bezeichnet, liegt dieser neoklassizistische Palast am Ufer des Flusses Kali Gandaki.","f":["1893 von Khadga Shamsher JBR im Gedenken an seine geliebte Frau erbaut.","Es befindet sich in einer Schlucht umgeben von dichten Wäldern."]},"np-namobuddha-history-v2":{"i":"/poi-images/np-namobuddha-history-v2.webp","s":"Einer der wichtigsten buddhistischen Wallfahrtsorte, an dem der Legende nach ein Prinz seinen Körper einer hungernden Tigerin opferte.","f":["Die Stätte umfasst eine alte Stupa und ein markantes Kloster.","Sie liegt friedlich auf einem Hügel östlich des Kathmandu-Tals."]},"np-kirtipur-history-v2":{"i":"/poi-images/np-kirtipur-history-v2.webp","s":"Eine alte Newar-Gemeinde, die für ihren erbitterten Widerstand gegen die Gorkha-Invasion im 18.","f":["Die Stadt liegt auf einem steilen, felsigen Hügel.","Sie bewahrt ihre traditionelle Kultur, Backsteinhäuser und mittelalterliche Atmosphäre."]},"np-sindhuligadhi-history-v2":{"i":"/poi-images/np-sindhuligadhi-history-v2.webp","s":"Eine historische Festung und ein Schlachtfeld, auf dem Gorkhali-Streitkräfte 1767 die Truppen der Britischen Ostindien-Kompanie besiegten.","f":["Der Sieg verhinderte das Vorrücken britischer Truppen in das Kathmandu-Tal.","Die Ruinen der Festung stehen noch heute auf einer Höhe von 1.417 Metern."]},"np-kakrebihar-history-v2":{"i":"/poi-images/np-kakrebihar-history-v2.webp","s":"Antike Ruinen eines hindu-buddhistischen Tempelkomplexes aus dem 12.","f":["Die Ruinen weisen eine einzigartige Mischung aus hinduistischen und buddhistischen Architekturstilen auf.","Die Stätte befindet sich in einem geschützten Waldgebiet."]},"np-everest-base-camp-landmarks-v2":{"i":"/poi-images/np-everest-base-camp-landmarks-v2.webp","s":"Das südliche Basislager des Mount Everest liegt auf einer Höhe von 5.364 Metern und dient Bergsteigern als Akklimatisierungsstation.","f":["Liegt im Sagarmatha-Nationalpark.","Erfordert normalerweise eine 8- bis 10-tägige Wanderung von Lukla aus."]},"np-shanti-stupa-pokhara-landmarks-v2":{"i":"/poi-images/np-shanti-stupa-pokhara-landmarks-v2.webp","s":"Dieses buddhistische Monument auf dem Anadu-Hügel oberhalb des Phewa-Sees wurde von japanischen Mönchen der Nipponzan-Myōhōji-Gemeinschaft erbaut.","f":["Wurde am 30. Oktober 1999 eingeweiht.","Steht auf einer Höhe von 1100 Metern."]},"np-kopan-monastery-landmarks-v2":{"i":"/poi-images/np-kopan-monastery-landmarks-v2.webp","s":"Ein tibetisch-buddhistisches Kloster am Rande von Kathmandu, das 1969 von den Lamas Thubten Yeshe und Thubten Zopa Rinpoche gegründet wurde.","f":["Gehört zur Stiftung zur Erhaltung der Mahayana-Tradition (FPMT).","Beherbergt mehr als 300 Mönche."]},"np-tengboche-monastery-landmarks-v2":{"i":"/poi-images/np-tengboche-monastery-landmarks-v2.webp","s":"Das größte Gompa in der Khumbu-Region von Nepal wurde 1916 von Lama Gulu erbaut und nach Bränden in den Jahren 1934 und 1989 rekonstruiert.","f":["Liegt auf 3867 Metern Höhe am Sagarmatha-Trek.","Bietet direkten Blick auf Ama Dablam."]},"np-dakshinkali-temple-landmarks-v2":{"i":"/poi-images/np-dakshinkali-temple-landmarks-v2.webp","s":"Dieser Hindu-Tempel südlich von Kathmandu ist der Göttin Kali geweiht und bekannt für die rituellen Tieropfer, die dienstags und samstags stattfinden.","f":["Der Name bedeutet wörtlich 'Die Kali des Südens'.","Es werden hauptsächlich unkastrierte männliche Ziegen und Hähne geopfert."]},"np-manakamana-temple-landmarks-v2":{"i":"/poi-images/np-manakamana-temple-landmarks-v2.webp","s":"Ein hinduistischer Tempel im Distrikt Gorkha, der der Göttin Bhagwati gewidmet ist.","f":["Ist seit 1998 durch eine 2,8 km lange Seilbahn von Kurintar aus erreichbar.","Liegt auf einer Höhe von 1302 Metern."]},"np-tal-barahi-temple-landmarks-v2":{"i":"/poi-images/np-tal-barahi-temple-landmarks-v2.webp","s":"Ein zweistöckiger Pagodentempel auf einer kleinen Insel im Phewa-See in Pokhara, der der Schutzgöttin Ajima gewidmet ist.","f":["Nur mit Holzbooten zu erreichen.","Oft finden hier samstags hinduistische Hochzeitszeremonien statt."]},"np-bindhyabasini-temple-landmarks-v2":{"i":"/poi-images/np-bindhyabasini-temple-landmarks-v2.webp","s":"Der älteste Tempel in Pokhara steht auf einem kleinen Hügel im Stadtzentrum und ist der Göttin Bhagwati in ihrer Form als Durga gewidmet.","f":["Wurde vermutlich in den 1760er Jahren von König Khadag Bum Malla erbaut.","Bietet einen Panoramablick auf die Stadt Pokhara."]},"np-davis-falls-landmarks-v2":{"i":"/poi-images/np-davis-falls-landmarks-v2.webp","s":"Ein Wasserfall in Pokhara, bei dem das Wasser in einen unterirdischen Tunnel stürzt, der 500 Meter lang und 30 Meter tief in die Erde reicht.","f":["Benannt nach einer Schweizerin namens Davi, die hier 1961 ertrank.","Der lokale nepalesische Name ist Patale Chhango (Unterwelt-Wasserfall)."]},"np-gupteshwor-mahadev-cave-landmarks-v2":{"i":"/poi-images/np-gupteshwor-mahadev-cave-landmarks-v2.webp","s":"Eine tiefe, feuchte Kalksteinhöhle in Pokhara, die direkt gegenüber den Davis-Fällen liegt und einen großen Stalakmiten in Form eines Shiva-Lingams enthält.","f":["Gilt als eine der längsten Höhlen in Nepal.","Der untere Teil der Höhle ist oft durch das Wasser der Davis-Fälle überflutet."]},"np-international-mountain-museum-landmarks-v2":{"i":"/poi-images/np-international-mountain-museum-landmarks-v2.webp","s":"Ein Museum in Pokhara, das sich der Geschichte des Bergsteigens, den Völkern des Himalayas und der Flora und Fauna der Region widmet.","f":["Wurde im Jahr 2004 offiziell eröffnet.","Es beherbergt Originalausrüstung von historischen Himalaya-Expeditionen."]},"np-sarangkot-viewpoint-landmarks-v2":{"i":"/poi-images/np-sarangkot-viewpoint-landmarks-v2.webp","s":"Ein berühmter Hügelkamm westlich von Pokhara, der für seine atemberaubenden Sonnenaufgänge über dem Annapurna-Massiv und dem Machapuchare bekannt ist.","f":["Erreicht eine Höhe von 1592 Metern.","Ist einer der beliebtesten Startplätze für Paragliding in Nepal."]},"np-garden-of-dreams-landmarks-v2":{"i":"/poi-images/np-garden-of-dreams-landmarks-v2.webp","s":"Ein neoklassizistischer historischer Garten in Kathmandu, der in den 1920er Jahren von Feldmarschall Kaiser Shamsher Rana erbaut wurde.","f":["Wurde zwischen 2000 und 2007 mit österreichischer Hilfe restauriert.","Umfasst Pavillons, Springbrunnen und eine europäisch inspirierte Architektur."]},"np-narayanhiti-palace-museum-landmarks-v2":{"i":"/poi-images/np-narayanhiti-palace-museum-landmarks-v2.webp","s":"Der ehemalige königliche Palast im Zentrum von Kathmandu, der bis 2008 der Wohnsitz und Arbeitsplatz des Monarchen von Nepal war.","f":["Ort des tragischen königlichen Massakers von 2001.","Wurde 2009 als öffentliches Museum eröffnet."]},"np-budhanilkantha-temple-landmarks-v2":{"i":"/poi-images/np-budhanilkantha-temple-landmarks-v2.webp","s":"Ein hinduistischer Freilufttempel am Fuße des Shivapuri-Hügels, der für eine große, aus einem einzigen Basaltblock gehauene Statue des schlafenden Vishnu bekannt ist.","f":["Die Statue ist fünf Meter lang und ruht in einem 13 Meter langen Becken.","Monarchen war es historisch verboten, diese Gottheit zu sehen."]},"np-asan-tole-landmarks-v2":{"i":"/poi-images/np-asan-tole-landmarks-v2.webp","s":"Ein traditioneller Marktplatz im Herzen von Kathmandu, an dem sich sechs Straßen kreuzen und der seit Jahrhunderten ein wichtiges Handelszentrum ist.","f":["Beherbergt den dreistöckigen Annapurna-Tempel.","War historisch ein Rastplatz auf der Indien-Tibet-Handelsroute."]},"np-halesi-mahadev-cave-landmarks-v2":{"i":"/poi-images/np-halesi-mahadev-cave-landmarks-v2.webp","s":"Ein bedeutender Pilgerort im Osten Nepals für Hindus, Buddhisten und Kirat.","f":["Liegt im Distrikt Khotang auf einer Höhe von 1436 Metern.","Der Legende nach versteckte sich Lord Shiva hier vor dem Dämon Bhasmasur."]},"np-pathibhara-devi-temple-landmarks-v2":{"i":"/poi-images/np-pathibhara-devi-temple-landmarks-v2.webp","s":"Einer der bedeutendsten hinduistischen Tempel Nepals, der auf dem Pathibhara-Hügel in der Taplejung-Region thront.","f":["Befindet sich auf einer Höhe von 3794 Metern.","Pilger bringen der Göttin oft Tieropfer sowie Gold und Silber dar."]},"np-bajrayogini-temple-landmarks-v2":{"i":"/poi-images/np-bajrayogini-temple-landmarks-v2.webp","s":"Ein tantrischer Tempel auf einem Hügel nahe der alten Stadt Sankhu, der der gleichnamigen buddhistischen Göttin gewidmet ist.","f":["Wurde ursprünglich im 17. Jahrhundert von König Pratap Malla erbaut.","Die Hauptgottheit wird von Hindus und Buddhisten gleichermaßen verehrt."]},"np-guhyeshwari-temple-landmarks-v2":{"i":"/poi-images/np-guhyeshwari-temple-landmarks-v2.webp","s":"Ein hoch verehrter Tempel in Kathmandu in der Nähe von Pashupatinath, der der hinduistischen Göttin Parvati gewidmet ist.","f":["Es ist eines der anerkannten Shakti Pithas in Südasien.","Nur Hindus ist der Zutritt zum inneren Hof gestattet."]},"central-zoo-life-v2":{"i":"/poi-images/central-zoo-life-v2.webp","s":"Dieser einzige historische Zoo Nepals liegt in Jawalakhel und bietet Familien die Möglichkeit, bengalische Tiger, Panzernashörner und unzählige Vogelarten hautnah zu erleben.","f":["Gegründet 1932.","Befindet sich in Lalitpur."]},"kathmandu-fun-park-life-v2":{"i":"/poi-images/kathmandu-fun-park-life-v2.webp","s":"Ein bunter Freizeitpark im Herzen der Hauptstadt, der mit Riesenrädern, Autoscootern und klassischen Karussells täglich hunderte lachende Kinder anzieht.","f":["Zentral am Bhrikuti Mandap gelegen.","Klassische Fahrgeschäfte."]},"ilam-tea-gardens-life-v2":{"i":"/poi-images/ilam-tea-gardens-life-v2.webp","s":"Die sanft geschwungenen, smaragdgrünen Hügel von Ilam sind das Herzstück der nepalesischen Teeproduktion, wo der berühmte Hochlandtee mit Sorgfalt geerntet wird.","f":["Größte Tee-Region Nepals.","Orthodoxer Tee-Anbau."]},"godawari-botanical-garden-life-v2":{"i":"/poi-images/godawari-botanical-garden-life-v2.webp","s":"Dieser ruhige Rückzugsort am Fuße des Phulchowki-Hügels ist ein lebendiges Laboratorium für Nepals reiche Flora und ein beliebtes Picknickziel für Stadtbewohner.","f":["Eröffnet im Jahr 1962.","Über 500 Pflanzenarten."]},"lumbini-crane-sanctuary-life-v2":{"i":"/poi-images/lumbini-crane-sanctuary-life-v2.webp","s":"Rund um den Geburtsort Buddhas haben Naturschützer dieses Feuchtgebiet erhalten, das eine wichtige Zuflucht für die majestätischen, gefährdeten Saruskraniche bietet.","f":["Schützt den bedrohten Saruskranich.","Integriert in das Lumbini Masterplan-Gebiet."]},"phulchowki-bird-watching-area-life-v2":{"i":"/poi-images/phulchowki-bird-watching-area-life-v2.webp","s":"Der höchste Hügel rund um das Kathmandu-Tal ist ein bewaldetes Paradies, durch das Ornithologen streifen, um einige der seltensten Himalaya-Vögel zu sichten.","f":["Höchster Punkt im Kathmandu-Tal (2.782 m).","Zuhause für über 300 Vogelarten."]},"parsa-national-park-life-v2":{"i":"/poi-images/parsa-national-park-life-v2.webp","s":"Dieses weitläufige Reservat in den Siwalik-Hügeln war einst ein königliches Jagdrevier und ist heute ein geschützter Zufluchtsort für eine wachsende Population von asiatischen Wildfanten.","f":["Gegründet 1984 als Wildreservat.","2017 zum Nationalpark erhoben."]},"banke-national-park-life-v2":{"i":"/poi-images/banke-national-park-life-v2.webp","s":"Als jüngster Nationalpark in der Terai-Region Nepals wurde dieses Gebiet speziell als Erweiterung der Schutzgebiete für den gefährdeten Königstiger eingerichtet.","f":["Gegründet im Jahr 2010.","Wichtiger Tiger-Korridor."]},"khaptad-national-park-life-v2":{"i":"/poi-images/khaptad-national-park-life-v2.webp","s":"Dieses abgelegene, spirituelle Wunderland in Fernwestnepal vereint weite, grüne Moorlandschaften, dichte Kiefernwälder und heilige Meditationsstätten.","f":["Heimat des Khaptad Baba Ashrams.","Seltene Heilpflanzen wachsen hier."]},"api-nampa-conservation-area-life-v2":{"i":"/poi-images/api-nampa-conservation-area-life-v2.webp","s":"Das Schutzgebiet im äußersten Nordwesten des Landes ist ein unberührtes Ökosystem, in dem seltene Schneeleoparden jagen und Nomaden ihre Yaks weiden lassen.","f":["Benannt nach den Bergen Api und Nampa.","Schneeleoparden-Lebensraum."]},"manaslu-conservation-area-life-v2":{"i":"/poi-images/manaslu-conservation-area-life-v2.webp","s":"Um den achthöchsten Berg der Welt herum liegt eine geschützte Region, die vom bedrohten Moschustier und Blauschafrudeln auf extremen Höhen bewohnt wird.","f":["Bedeckt ein Gebiet von 1.663 km².","Heimat von 33 Säugetierarten."]},"gaurishankar-conservation-area-life-v2":{"i":"/poi-images/gaurishankar-conservation-area-life-v2.webp","s":"Dieses zerklüftete Schutzgebiet dient als lebenswichtiger ökologischer Korridor zwischen den Nationalparks Langtang und Sagarmatha, in dem Rote Pandas durch dichte Bambuswälder streifen.","f":["Verbindet Langtang und Sagarmatha.","Reich an Roten Pandas."]},"krishnasar-conservation-area-life-v2":{"i":"/poi-images/krishnasar-conservation-area-life-v2.webp","s":"Ein kleines, aber wichtiges Schutzgebiet im Terai, das speziell dafür eingerichtet wurde, die ehemals vom Aussterben bedrohte Hirschziegenantilope vor der Ausrottung zu bewahren.","f":["Fokus auf die Hirschziegenantilope (Blackbuck).","Erfolgreiches Erholungsprogramm der Population."]},"dhorpatan-hunting-reserve-life-v2":{"i":"/poi-images/dhorpatan-hunting-reserve-life-v2.webp","s":"Als Nepals einziges Jagdreservat wird hier die Population des Blauschaafs und des Himalaya-Tahr streng überwacht und reguliert, um das ökologische Gleichgewicht in den alpinen Weiden zu erhalten.","f":["Das einzige Jagdreservat in Nepal.","Strikte Quoten für die Jagd auf Blauschafe."]},"mustang-apple-orchards-life-v2":{"i":"/poi-images/mustang-apple-orchards-life-v2.webp","s":"In der trockenen, windgepeitschten Region von Mustang, insbesondere in Marpha, bauen Landwirte in großen Höhen saftige Äpfel an, die für ihren einzigartigen, knackigen Geschmack berühmt sind.","f":["Zentrum ist das Dorf Marpha.","Berühmt für Apfelwein und getrocknete Äpfel."]},"gulmi-coffee-plantations-life-v2":{"i":"/poi-images/gulmi-coffee-plantations-life-v2.webp","s":"An den steilen, terrassierten Hängen des Gulmi-Distrikts wird hochwertiger Arabica-Kaffee unter schattigen Bäumen angebaut, der Nepals Reputation für Spezialitätenkaffee begründet hat.","f":["Pionierregion für nepalesischen Kaffee.","Ausschließlich biologischer Anbau."]},"whoopee-land-amusement-park-life-v2":{"i":"/poi-images/whoopee-land-amusement-park-life-v2.webp","s":"Einer const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE);if(typeof closeMapcard==='function')closeMapcard();if(typeof closeBurst==='function')closeBurst()}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}

const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
