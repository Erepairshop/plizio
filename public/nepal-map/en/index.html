.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.drag{cursor:grabbing}
.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}
.region:hover{fill:#2d3a78}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#000;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#60a5fa}
.poi.g-sight circle{fill:#fbbf24}
.poi.g-nature circle{fill:#22c55e}
.poi.g-history circle{fill:#c084fc}
.poi.g-industry circle{fill:#fb923c}
.poi.g-other circle{fill:#9ca3af}
.poi.dim{opacity:.18}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7;fill:#fff;opacity:1}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}

.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:#0d1230;border-top:1px solid #ffffff20;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -10px 40px #00000080}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a{display:flex;align-items:center;gap:.55rem;padding:.55rem .55rem;border-radius:8px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:active{background:#ffffff14}
.popup .list a .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.popup .list a .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.zoom button:active{background:#1a2240}

-border-crossing-economic-v2":{"i":"/poi-images/nepalgunj-industrial-estate-economic-v2.webp","s":"Currently the most important international trade border crossing between Nepal and the People's Republic of China.","f":["Built in 1973.","Focuses on agricultural processing."]},"chobhar-dry-port-economic-v2":{"i":"/poi-images/chobhar-dry-port-economic-v2.webp","s":"A modern logistics facility in Kathmandu, designed to facilitate international trade in the capital region.","f":["Opened in 2022.","Built with financial support from the World Bank."]},"pokhara-industrial-estate-economic-v2":{"i":"/poi-images/pokhara-industrial-estate-economic-v2.webp","s":"An industrial area focused on light industry and local crafts in one of Nepal's most important tourist cities.","f":["Established in 1974.","Promotes local production of souvenirs and textiles."]},"balaju-industrial-district-economic-v2":{"i":"/poi-images/middle-marsyangdi-hydropower-economic-v2.webp","s":"The first officially established industrial area in Nepal, located in the northwest of Kathmandu, important for urban supply.","f":["Capacity of 70 megawatts.","Supported by the German government."]},"kulekhani-reservoir-economic-v2":{"i":"/poi-images/chilime-hydropower-economic-v2.webp","s":"Nepal's largest reservoir, built specifically for peak-load power generation during the dry season.","f":["Capacity of 22.1 MW.","Entirely designed by Nepalese engineers."]},"dharan-industrial-estate-economic-v2":{"i":"/poi-images/dharan-industrial-estate-economic-v2.webp","s":"A growing industrial center in eastern Nepal, supporting the region's agro-based and manufacturing industries.","f":["Established in 1972.","Promotes local tea production and processing."]},"trishuli-hydropower-economic-v2":{"i":"/poi-images/trishuli-hydropower-economic-v2.webp","s":"One of the oldest hydropower projects in Nepal on the Trishuli River, contributing to the country's early electrification.","f":["Commissioned in 1967.","Built in collaboration with India."]},"bhairahawa-sez-economic-v2":{"i":"/poi-images/bhairahawa-sez-economic-v2.webp","s":"Nepal's first Special Economic Zone, established to attract foreign investment and promote exports.","f":["Was inaugurated in 2014.","Offers tax breaks and benefits to companies."]},"np-swayambhunath-history-v2":{"i":"/poi-images/np-swayambhunath-history-v2.webp","s":"An ancient religious complex atop a hill in the Kathmandu Valley, often called the Monkey Temple.","f":["Founded roughly 2,000 years ago.","The stupa has Buddha's eyes painted on all four sides."]},"np-boudhanath-history-v2":{"i":"/poi-images/np-boudhanath-history-v2.webp","s":"One of the largest spherical stupas in Nepal, representing the mandala and serving as a center of Tibetan Buddhism.","f":["It became a UNESCO World Heritage Site in 1979.","The massive mandala makes it one of the largest stupas in the world."]},"np-pashupatinath-history-v2":{"i":"/poi-images/np-pashupatinath-history-v2.webp","s":"A famous and sacred Hindu temple complex located on the banks of the Bagmati River.","f":["Dedicated to Lord Shiva, built in the 5th century.","Only Hindus are allowed into the main temple courtyard."]},"np-kathmandu-durbar-history-v2":{"i":"/poi-images/np-kathmandu-durbar-history-v2.webp","s":"The historic plaza in front of the old royal palace of the former Kathmandu Kingdom.","f":["The square is surrounded by spectacular Newari architecture.","It suffered heavy damage during the 2015 earthquake."]},"np-patan-durbar-history-v2":{"i":"/poi-images/np-patan-durbar-history-v2.webp","s":"A marvel of Newa architecture, this square is the center of the ancient city of Lalitpur.","f":["Famous for the Krishna Mandir built in 1637.","The square floor is tiled with red bricks."]},"np-bhaktapur-durbar-history-v2":{"i":"/poi-images/np-bhaktapur-durbar-history-v2.webp","s":"The royal palace of the old Bhaktapur Kingdom, located in a city known as an open-air museum.","f":["Highlights include the 55 Window Palace.","The Golden Gate is a masterpiece of repoussé art."]},"np-changunarayan-history-v2":{"i":"/poi-images/np-changunarayan-history-v2.webp","s":"Considered the oldest temple in Nepal, it stands on a high hilltop with majestic views.","f":["The temple dates back to the 4th century.","It features some of the finest traditional Nepali woodcarvings."]},"np-lumbini-history-v2":{"i":"/poi-images/np-lumbini-history-v2.webp","s":"A Buddhist pilgrimage site where Queen Mahamayadevi gave birth to Siddhartha Gautama.","f":["Buddha was born here around 563 BCE.","The Ashoka Pillar was erected by Emperor Ashoka in 249 BCE."]},"np-nyatapola-history-v2":{"i":"/poi-images/np-nyatapola-history-v2.webp","s":"A remarkable five-tiered pagoda in Bhaktapur, representing the pinnacle of Nepali temple architecture.","f":["Built in 1702 by King Bhupatindra Malla.","It survived both the 1934 and 2015 massive earthquakes."]},"np-dharahara-history-v2":{"i":"/poi-images/np-dharahara-history-v2.webp","s":"A historic nine-story tower in the center of Kathmandu, originally built for military purposes.","f":["Commissioned by Prime Minister Bhimsen Thapa in 1832.","It collapsed during the 2015 earthquake but has been rebuilt."]},"np-nuwakot-durbar-history-v2":{"i":"/poi-images/np-nuwakot-durbar-history-v2.webp","s":"A prominent historic fortress that played a key role in the unification of Nepal under King Prithvi Narayan Shah.","f":["The main palace is a seven-story brick structure.","It served as the capital during the unification campaign."]},"np-gorkha-durbar-history-v2":{"i":"/poi-images/np-gorkha-durbar-history-v2.webp","s":"An ancient palace and temple complex on a hilltop, the ancestral home of the Shah dynasty.","f":["Birthplace of King Prithvi Narayan Shah.","It overlooks the expansive Trisuli Valley."]},"np-janaki-mandir-history-v2":{"i":"/poi-images/np-janaki-mandir-history-v2.webp","s":"A visually striking Hindu temple in Janakpur, dedicated to Goddess Sita, featuring distinct Rajput architecture.","f":["Constructed in 1910 by Queen Brisabhanu Kunwari of Tikamgarh.","It is often referred to as the Nau Lakha Mandir (Nine Lakh Temple)."]},"np-muktinath-history-v2":{"i":"/poi-images/np-muktinath-history-v2.webp","s":"A sacred pilgrimage site for both Hindus and Buddhists, situated at a high altitude in the Mustang district.","f":["The temple sits at an elevation of 3,710 meters.","It features 108 stone waterspouts carved in the shape of cow heads."]},"np-tansen-durbar-history-v2":{"i":"/poi-images/np-tansen-durbar-history-v2.webp","s":"A historical palace in the Palpa district reflecting the grand legacy of the Sen dynasty before Nepal's unification.","f":["Built in 1927 by Pratap Shamsher Jang Bahadur Rana.","The durbar was severely damaged in 2006 during the Maoist conflict but later restored."]},"np-ranighat-history-v2":{"i":"/poi-images/np-ranighat-history-v2.webp","s":"Often referred to as the Taj Mahal of Nepal, this neoclassical palace rests on the banks of the Kali Gandaki River.","f":["Constructed in 1893 by Khadga Shamsher JBR in memory of his beloved wife.","It is located in a gorge surrounded by dense forests."]},"np-namobuddha-history-v2":{"i":"/poi-images/np-namobuddha-history-v2.webp","s":"One of the most important Buddhist pilgrimage sites where, according to legend, a prince offered his body to a starving tigress.","f":["The site includes an ancient stupa and a prominent monastery.","It is situated peacefully on a hill east of the Kathmandu Valley."]},"np-kirtipur-history-v2":{"i":"/poi-images/np-kirtipur-history-v2.webp","s":"An ancient Newar township known for its fierce resistance against the Gorkha invasion in the 18th century.","f":["The town is situated on a steep rocky hill.","It retains its traditional culture, brick houses, and medieval atmosphere."]},"np-sindhuligadhi-history-v2":{"i":"/poi-images/np-sindhuligadhi-history-v2.webp","s":"A historic fort and battlefield where Gorkhali forces defeated the troops of the British East India Company in 1767.","f":["The victory prevented British forces from advancing to the Kathmandu Valley.","The ruins of the fort still stand at an altitude of 1,417 meters."]},"np-kakrebihar-history-v2":{"i":"/poi-images/np-kakrebihar-history-v2.webp","s":"Ancient ruins of a 12th-century Hindu-Buddhist temple complex in the shape of a lotus seed.","f":["The ruins exhibit a unique blend of Hindu and Buddhist architectural styles.","The site is located within a protected forest area."]},"np-everest-base-camp-landmarks-v2":{"i":"/poi-images/np-everest-base-camp-landmarks-v2.webp","s":"The south base camp of Mount Everest is situated at an altitude of 5,364 meters and serves as an acclimatization station for mountaineers.","f":["Located within the Sagarmatha National Park.","Usually requires an 8- to 10-day trek starting from Lukla."]},"np-shanti-stupa-pokhara-landmarks-v2":{"i":"/poi-images/np-shanti-stupa-pokhara-landmarks-v2.webp","s":"This Buddhist monument on Anadu Hill above Phewa Lake was built by Japanese monks from the Nipponzan-Myōhōji community.","f":["It was inaugurated on October 30, 1999.","Stands at an elevation of 1100 meters."]},"np-kopan-monastery-landmarks-v2":{"i":"/poi-images/np-kopan-monastery-landmarks-v2.webp","s":"A Tibetan Buddhist monastery on the outskirts of Kathmandu, founded in 1969 by Lamas Thubten Yeshe and Thubten Zopa Rinpoche.","f":["Belongs to the Foundation for the Preservation of the Mahayana Tradition (FPMT).","Houses more than 300 monks."]},"np-tengboche-monastery-landmarks-v2":{"i":"/poi-images/np-tengboche-monastery-landmarks-v2.webp","s":"The largest gompa in the Khumbu region of Nepal was built in 1916 by Lama Gulu and reconstructed after fires in 1934 and 1989.","f":["Located at 3867 meters altitude on the Sagarmatha trek.","Offers a direct view of the Ama Dablam peak."]},"np-dakshinkali-temple-landmarks-v2":{"i":"/poi-images/np-dakshinkali-temple-landmarks-v2.webp","s":"This Hindu temple south of Kathmandu is dedicated to the goddess Kali and is known for the ritual animal sacrifices that take place on Tuesdays and Saturdays.","f":["The name literally means 'The Kali of the South'.","Mainly uncastrated male goats and roosters are sacrificed."]},"np-manakamana-temple-landmarks-v2":{"i":"/poi-images/np-manakamana-temple-landmarks-v2.webp","s":"A Hindu temple in the Gorkha District dedicated to the goddess Bhagwati.","f":["Has been accessible since 1998 via a 2.8 km cable car from Kurintar.","Located at an altitude of 1302 meters."]},"np-tal-barahi-temple-landmarks-v2":{"i":"/poi-images/np-tal-barahi-temple-landmarks-v2.webp","s":"A two-story pagoda temple on a small island in Phewa Lake in Pokhara, dedicated to the protector goddess Ajima.","f":["Can only be reached by wooden boats.","Hindu wedding ceremonies are often held here on Saturdays."]},"np-bindhyabasini-temple-landmarks-v2":{"i":"/poi-images/np-bindhyabasini-temple-landmarks-v2.webp","s":"The oldest temple in Pokhara stands on a small hill in the city center and is dedicated to the goddess Bhagwati in her form as Durga.","f":["Believed to have been built in the 1760s by King Khadag Bum Malla.","Offers a panoramic view of the city of Pokhara."]},"np-davis-falls-landmarks-v2":{"i":"/poi-images/np-davis-falls-landmarks-v2.webp","s":"A waterfall in Pokhara where the water plunges into an underground tunnel that is 500 meters long and reaches 30 meters deep into the earth.","f":["Named after a Swiss woman named Davi who drowned here in 1961.","The local Nepali name is Patale Chhango (Underworld Waterfall)."]},"np-gupteshwor-mahadev-cave-landmarks-v2":{"i":"/poi-images/np-gupteshwor-mahadev-cave-landmarks-v2.webp","s":"A deep, damp limestone cave in Pokhara, located right across from Davis Falls, containing a large stalagmite in the shape of a Shiva Lingam.","f":["Considered one of the longest caves in Nepal.","The lower part of the cave is often flooded by the waters of Davis Falls."]},"np-international-mountain-museum-landmarks-v2":{"i":"/poi-images/np-international-mountain-museum-landmarks-v2.webp","s":"A museum in Pokhara dedicated to the history of mountaineering, the peoples of the Himalayas, and the flora and fauna of the region.","f":["Officially opened in 2004.","It houses original gear from historical Himalayan expeditions."]},"np-sarangkot-viewpoint-landmarks-v2":{"i":"/poi-images/np-sarangkot-viewpoint-landmarks-v2.webp","s":"A famous ridge west of Pokhara, known for its breathtaking sunrises over the Annapurna Massif and Machapuchare.","f":["Reaches an altitude of 1592 meters.","Is one of the most popular starting points for paragliding in Nepal."]},"np-garden-of-dreams-landmarks-v2":{"i":"/poi-images/np-garden-of-dreams-landmarks-v2.webp","s":"A neoclassical historical garden in Kathmandu, built in the 1920s by Field Marshal Kaiser Shamsher Rana.","f":["Was restored between 2000 and 2007 with Austrian assistance.","Includes pavilions, fountains, and European-inspired architecture."]},"np-narayanhiti-palace-museum-landmarks-v2":{"i":"/poi-images/np-narayanhiti-palace-museum-landmarks-v2.webp","s":"The former royal palace in the center of Kathmandu, which was the residence and workplace of the monarch of Nepal until 2008.","f":["Site of the tragic royal massacre of 2001.","Opened as a public museum in 2009."]},"np-budhanilkantha-temple-landmarks-v2":{"i":"/poi-images/np-budhanilkantha-temple-landmarks-v2.webp","s":"An open-air Hindu temple at the foot of the Shivapuri Hill, known for a large statue of the sleeping Vishnu carved from a single block of basalt.","f":["The statue is five meters long and rests in a 13-meter pool.","Monarchs were historically forbidden from viewing this deity."]},"np-asan-tole-landmarks-v2":{"i":"/poi-images/np-asan-tole-landmarks-v2.webp","s":"A traditional market square in the heart of Kathmandu, where six streets intersect, serving as an important trading center for centuries.","f":["Houses the three-story Annapurna Temple.","Historically a resting place on the India-Tibet trade route."]},"np-halesi-mahadev-cave-landmarks-v2":{"i":"/poi-images/np-halesi-mahadev-cave-landmarks-v2.webp","s":"A significant pilgrimage site in eastern Nepal for Hindus, Buddhists, and Kirat.","f":["Located in the Khotang District at an altitude of 1436 meters.","Legend says Lord Shiva hid here from the demon Bhasmasur."]},"np-pathibhara-devi-temple-landmarks-v2":{"i":"/poi-images/np-pathibhara-devi-temple-landmarks-v2.webp","s":"One of the most significant Hindu temples in Nepal, perched on the Pathibhara Hill in the Taplejung region.","f":["Located at an altitude of 3794 meters.","Pilgrims often offer animal sacrifices as well as gold and silver to the goddess."]},"np-bajrayogini-temple-landmarks-v2":{"i":"/poi-images/np-bajrayogini-temple-landmarks-v2.webp","s":"A tantric temple on a hill near the ancient town of Sankhu, dedicated to the Buddhist goddess of the same name.","f":["Originally built in the 17th century by King Pratap Malla.","The main deity is revered by both Hindus and Buddhists."]},"np-guhyeshwari-temple-landmarks-v2":{"i":"/poi-images/np-guhyeshwari-temple-landmarks-v2.webp","s":"A highly revered temple in Kathmandu near Pashupatinath, dedicated to the Hindu goddess Parvati.","f":["It is one of the recognized Shakti Pithas in South Asia.","Only Hindus are permitted entry into the inner courtyard."]},"central-zoo-life-v2":{"i":"/poi-images/central-zoo-life-v2.webp","s":"This sole historic zoo of Nepal is located in Jawalakhel, offering families the chance to see Bengal tigers, Indian rhinoceroses, and countless bird species up close.","f":["Founded in 1932.","Located in Lalitpur."]},"kathmandu-fun-park-life-v2":{"i":"/poi-images/kathmandu-fun-park-life-v2.webp","s":"A colorful amusement park in the heart of the capital, attracting hundreds of laughing children daily with Ferris wheels, bumper cars, and classic carousels.","f":["Centrally located at Bhrikuti Mandap.","Classic amusement rides."]},"ilam-tea-gardens-life-v2":{"i":"/poi-images/ilam-tea-gardens-life-v2.webp","s":"The gently rolling, emerald-green hills of Ilam are the heart of Nepal's tea production, where the famous high-altitude tea is carefully harvested.","f":["Nepal's largest tea-producing region.","Orthodox tea cultivation."]},"godawari-botanical-garden-life-v2":{"i":"/poi-images/godawari-botanical-garden-life-v2.webp","s":"This quiet retreat at the foot of Phulchowki hill is a living laboratory for Nepal's rich flora and a popular picnic destination for city dwellers.","f":["Opened in 1962.","Over 500 plant species."]},"lumbini-crane-sanctuary-life-v2":{"i":"/poi-images/lumbini-crane-sanctuary-life-v2.webp","s":"Around the birthplace of Buddha, conservationists have preserved this wetland, providing a vital refuge for the majestic, endangered Sarus cranes.","f":["Protects the endangered Sarus crane.","Integrated into the Lumbini Masterplan area."]},"phulchowki-bird-watching-area-life-v2":{"i":"/poi-images/phulchowki-bird-watching-area-life-v2.webp","s":"The highest hill around the Kathmandu Valley is a forested paradise roamed by ornithologists to spot some of the rarest Himalayan birds.","f":["Highest point in the Kathmandu Valley (2,782 m).","Home to over 300 bird species."]},"parsa-national-park-life-v2":{"i":"/poi-images/parsa-national-park-life-v2.webp","s":"This vast reserve in the Siwalik Hills was once a royal hunting ground and is today a protected refuge for a growing population of Asian wild elephants.","f":["Established in 1984 as a wildlife reserve.","Upgraded to a national park in 2017."]},"banke-national-park-life-v2":{"i":"/poi-images/banke-national-park-life-v2.webp","s":"As the newest national park in Nepal's Terai region, this area was specifically established as an extension of the protected habitats for the endangered Bengal tiger.","f":["Established in 2010.","Important tiger corridor."]},"khaptad-national-park-life-v2":{"i":"/poi-images/khaptad-national-park-life-v2.webp","s":"This re const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=6;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;

// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","industry","other"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
