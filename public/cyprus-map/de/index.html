.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.drag{cursor:grabbing}
.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}
.region:hover{fill:#2d3a78}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#000;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#60a5fa}
.poi.g-sight circle{fill:#fbbf24}
.poi.g-nature circle{fill:#22c55e}
.poi.g-history circle{fill:#c084fc}
.poi.g-industry circle{fill:#fb923c}
.poi.g-other circle{fill:#9ca3af}
.poi.dim{opacity:.18}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7;fill:#fff;opacity:1}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:#0d1230;border-top:1px solid #ffffff20;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -10px 40px #00000080}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a{display:flex;align-items:center;gap:.55rem;padding:.55rem .55rem;border-radius:8px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:active{background:#ffffff14}
.popup .list a .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.popup .list a .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup .list a .g{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}

.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}

.zoom button:active{background:#1a2240}

ndruckenden mittelalterlichen Ruinen.","f":["Die Stadtmauer ist etwa 3 Kilometer lang und fast vollständig erhalten.","Die Lala-Mustafa-Pascha-Moschee war ursprünglich eine gotische Kathedrale."]},"cy-ayianapa":{"i":"/poi-images/cy-ayianapa.webp","s":"Bekannt für seine Sandstrände, das mittelalterliche Kloster und ein lebhaftes Nachtleben.","f":["Der Nissi Beach gilt als einer der schönsten Strände in ganz Europa.","Das mittelalterliche Kloster im Stadtzentrum wurde um das Jahr 1500 erbaut."]},"cy-kourion":{"i":"/poi-images/cy-kourion.webp","s":"Eine der beeindruckendsten archäologischen Stätten Zyperns mit einem römischen Theater.","f":["Antikes römisches Theater","Mosaike im Haus des Eustolios"]},"cy-tombs-kings":{"i":"/poi-images/cy-tombs-kings.webp","s":"Große Nekropole aus hellenistischer und römischer Zeit in der Nähe von Paphos.","f":["UNESCO Weltkulturerbe","Hellenistische Architektur"]},"cy-kolossi":{"i":"/poi-images/cy-kolossi.webp","s":"Ehemalige Kreuzritterburg in der Nähe von Limassol.","f":["Erbaut im 13. Jahrhundert","Sitz der Johanniter-Ritter"]},"cy-hala-sultan":{"i":"/poi-images/cy-hala-sultan.webp","s":"Bedeutende islamische Pilgerstätte am Salzsee von Larnaca.","f":["Baujahr im Jahr 1816","Grabstätte von Umm Haram"]},"cy-kykkos":{"i":"/poi-images/cy-kykkos.webp","s":"Das reichste und bekannteste Kloster Zyperns im Troodos-Gebirge.","f":["Gründung im 11. Jahrhundert","Marienikone des Lukas"]},"cy-salamis":{"i":"/poi-images/cy-salamis.webp","s":"Umfangreiche antike Ruinenstadt an der Ostküste Zyperns.","f":["Ehemalige Hauptstadt Zyperns","Großes römisches Theater"]},"cy-choirokoitia":{"i":"/poi-images/cy-choirokoitia.webp","s":"Eine der wichtigsten prähistorischen Stätten im östlichen Mittelmeerraum (UNESCO).","f":["Die Siedlung wurde im Jahr 1934 von Porphyrios Dikaios entdeckt.","Die runden Häuser haben einen Außendurchmesser von 2,3 bis 9,2 Metern."]},"cy-st-lazarus":{"i":"/poi-images/cy-st-lazarus.webp","s":"Historische byzantinische Kirche im Zentrum von Larnaca.","f":["Bau im späten 9. Jahrhundert","Grab von Lazarus von Bethanien"]},"cy-mount-olympus":{"i":"/poi-images/cy-mount-olympus.webp","s":"Der höchste Punkt Zyperns im Troodos-Gebirge (1.952 m).","f":["Höhe von 1951 Metern","Teil des Troodos-Gebirges"]},"cy-cape-greco":{"i":"/poi-images/cy-cape-greco.webp","s":"Ein atemberaubender Nationalpark mit Meereshöhlen und klarem blauen Wasser.","f":["Der Park erstreckt sich über eine Fläche von fast 400 Hektar.","Hier befindet sich die berühmte 'Liebesbrücke', ein natürlicher Steinbogen."]},"cy-akamas":{"i":"/poi-images/cy-akamas.webp","s":"Ein Naturschutzgebiet im Westen mit unberührter Landschaft und großer Artenvielfalt.","f":["Das Gebiet umfasst eine Fläche von etwa 230 Quadratkilometern.","Hier nisten gefährdete Meeresschildkröten an abgelegenen Stränden."]},"cy-salt-lake":{"i":"/poi-images/cy-salt-lake.webp","s":"Ein komplexes Netzwerk von Salzseen, bekannt als Überwinterungsplatz für Flamingos.","f":["Zweitgrößter Salzsee der Insel","Überwinterungsort für Flamingos"]},"cy-aphrodite-rock":{"i":"/poi-images/cy-aphrodite-rock.webp","s":"Eine markante Felsformation im Meer, der legendäre Geburtsort der Göttin Aphrodite.","f":["Der Ort wird lokal auch Petra tou Romiou (Fels des Griechen) genannt.","Die markante Felsformation liegt an der Küstenstraße zwischen Paphos und Limassol."]},"cy-avakas-gorge":{"i":"/poi-images/cy-avakas-gorge.webp","s":"Eine tiefe, steile Schlucht auf der Akamas-Halbinsel, beliebt bei Wanderern.","f":["Die Schlucht wurde über Jahrtausende durch einen Bachlauf geformt.","Der Wanderweg durch die Schlucht ist etwa 3 Kilometer lang."]},"cy-nissi-beach":{"i":"/poi-images/cy-nissi-beach.webp","s":"Einer der berühmtesten weißen Sandstrände in Ayia Napa.","f":["500 Meter Sandstrand","Kleine begehbare Insel"]},"cy-limassol-carnival":{"i":"/poi-images/cy-limassol-carnival.webp","s":"Ein jährliches zehntägiges Festival, das älteste und beliebteste in Zypern.","f":["Elf Tage lange Feierlichkeiten","Große Parade am Sonntag"]},"cy-paphos-aphrodite":{"i":"/poi-images/cy-paphos-aphrodite.webp","s":"Ein internationales Opernfestival, das jeden Sommer in Paphos stattfindet.","f":["Open-Air Opernfestival","Vor der Burg von Paphos"]},"cy-kataklysmos":{"i":"/poi-images/cy-kataklysmos.webp","s":"Das Fest der Sintflut, besonders groß in Larnaca mit Aktivitäten am Wasser gefeiert.","f":["50 Tage nach orthodoxem Ostern","Feier der biblischen Flut"]},"cy-wine-festival":{"i":"/poi-images/cy-wine-festival.webp","s":"Ein beliebtes Festival in Limassol zur Feier der zypriotischen Weintradition.","f":["Ende August bis September","Im Stadtgarten von Limassol"]},"cy-othello-castle":{"i":"/poi-images/cy-othello-castle.webp","s":"Eine Burg in Famagusta, die nach Shakespeares berühmtem Stück benannt wurde.","f":["In Famagusta gelegen","Benannt nach Shakespeares Othello"]},"cy-blue-lagoon":{"i":"/poi-images/cy-blue-lagoon.webp","s":"Ein beliebtes Badeziel mit kristallklarem Wasser auf der Akamas-Halbinsel.","f":["Das Wasser ist so klar, dass man den Meeresboden bis in große Tiefe sieht.","Die Lagune ist am besten mit Ausflugsbooten vom Hafen Latchi erreichbar."]},"CY-001-zenobia":{"i":"/poi-images/CY-001-zenobia.webp","s":"Einer der besten Tauchplätze der Welt, ein gesunkenes Fährschiff vor der Küste von Larnaca.","f":["Die Zenobia sank 1980 auf ihrer Jungfernfahrt.","Das Wrack liegt in einer Tiefe von 16 bis 42 Metern."]},"CY-001-larnaca-fort":{"i":"/poi-images/CY-001-larnaca-fort.webp","s":"Eine mittelalterliche Festung am südlichen Ende der Finikoudes-Promenade.","f":["Ursprünglich im 14. Jahrhundert erbaut.","Diente während der britischen Herrschaft als Gefängnis."]},"CY-002-varosha":{"i":"/poi-images/CY-002-varosha.webp","s":"Ein einst blühendes Tourismusviertel von Famagusta, das seit 1974 verlassen ist.","f":["Vor 1974 war es eines der beliebtesten Urlaubsziele der Welt.","Es blieb jahrzehntelang für die Öffentlichkeit gesperrt."]},"CY-002-fig-tree-bay":{"i":"/poi-images/CY-002-fig-tree-bay.webp","s":"Ein beliebter Sandstrand in Protaras, bekannt für sein kristallklares Wasser.","f":["Benannt nach einem einzelnen Feigenbaum, der dort seit dem 17. Jahrhundert stehen soll.","Wird oft als einer der besten Strände Europas gewählt."]},"CY-003-cyprus-museum":{"i":"/poi-images/CY-003-cyprus-museum.webp","s":"Das älteste und größte archäologische Museum Zyperns in Nicosia.","f":["Beherbergt Funde von der Jungsteinzeit bis zur byzantinischen Zeit.","Gegründet wurde es im Jahr 1882."]},"CY-003-ledra-street":{"i":"/poi-images/CY-003-ledra-street.webp","s":"Die Haupteinkaufsstraße in der Altstadt von Nicosia.","f":["Bekannt für den Grenzübergang zwischen dem griechischen und türkischen Teil.","Benannt nach dem antiken Stadtkönigreich Ledra."]},"CY-004-amathus":{"i":"/poi-images/CY-004-amathus.webp","s":"Eine der bedeutendsten antiken Stadtkönigreiche Zyperns an der Küste von Limassol.","f":["Es war ein Zentrum der Verehrung der Göttin Aphrodite.","Die Ausgrabungsstätte umfasst eine Akropolis und eine Basilika."]},"CY-004-sanctuary-apollo":{"i":"/poi-images/CY-004-sanctuary-apollo.webp","s":"Ein bedeutendes antikes Heiligtum, das Apollon als Gott der Wälder gewidmet war.","f":["Liegt westlich der antiken Stadt Kourion.","War eines der wichtigsten religiösen Zentren Zyperns."]},"CY-005-paphos-castle":{"i":"/poi-images/CY-005-paphos-castle.webp","s":"Eine am Hafen von Paphos gelegene mittelalterliche Festung.","f":["Ursprünglich als byzantinische Festung zum Schutz des Hafens erbaut.","Es wurde von den Lusignans und später von den Osmanen umgebaut."]},"CY-005-adonis-baths":{"i":"/poi-images/CY-005-adonis-baths.webp","s":"Ein malerischer Wasserfall und natürliches Schwimmbecken in der Nähe von Paphos.","f":["Der Legende nach trafen sich hier Adonis und Aphrodite.","Unter dem Wasserfall befindet sich eine tiefe Lagune."]},"animal-habitat-limassol-zoo-extra":{"i":"/poi-images/animal-habitat-limassol-zoo-extra.webp","s":"Ein moderner Zoo mit Schwerpunkt auf Naturschutz und Bildung, der eine Vielzahl von Tieren beherbergt.","f":["Zoo Limassol liegt auf Zypern und ist gut mit dem Auto erreichbar.","Die Anlage zeigt sowohl heimische als auch eingefuehrte Tierarten."]},"animal-habitat-pafos-zoo-extra":{"i":"/poi-images/animal-habitat-pafos-zoo-extra.webp","s":"Der größte lizenzierte Zoo Zyperns mit einer der bedeutendsten Vogel- und Giftschlangensammlungen Europas.","f":["Zoo Paphos liegt auf Zypern und ist gut mit dem Auto erreichbar.","Die Anlage zeigt sowohl heimische als auch eingefuehrte Tierarten."]},"animal-habitat-camel-park-mazotos-extra":{"i":"/poi-images/animal-habitat-camel-park-mazotos-extra.webp","s":"Ein einzigartiger Park, in dem Besucher auf Kamelen reiten und mit verschiedenen anderen Tieren interagieren können.","f":["Kamelpark Mazotos liegt auf Zypern und ist gut mit dem Auto erreichbar.","Die Anlage zeigt sowohl heimische als auch eingefuehrte Tierarten."]},"animal-habitat-golden-donkeys-farm-extra":{"i":"/poi-images/animal-habitat-golden-donkeys-farm-extra.webp","s":"Diese Farm auf der Karpas-Halbinsel widmet sich dem Schutz des Zypern-Esels.","f":["Auf der Farm leben mehr als 200 geschützte zypriotische Esel.","Ein 1500 Jahre alter Olivenbaum steht im Zentrum des Geländes."]},"animal-habitat-cyprus-donkey-sanctuary-extra":{"i":"/poi-images/animal-habitat-cyprus-donkey-sanctuary-extra.webp","s":"Ein Schutzgebiet in der Nähe von Limassol, das alten und unerwünschten Eseln Pflege und Unterkunft bietet.","f":["Eselreservat Zypern liegt auf Zypern und ist gut mit dem Auto erreichbar.","Die Anlage zeigt sowohl heimische als auch eingefuehrte Tierarten."]},"animal-habitat-akrotiri-marsh-extra":{"i":"/poi-images/animal-habitat-akrotiri-marsh-extra.webp","s":"Ein wichtiges Feuchtgebiet zur Vogelbeobachtung, insbesondere für Zugvögel wie Flamingos und Kraniche.","f":["Akrotiri-Sumpf liegt auf Zypern und ist gut mit dem Auto erreichbar.","Die Anlage zeigt sowohl heimische als auch eingefuehrte Tierart dwerk sind zentrale Saeulen des Standortes."]},"industry-helios-solar-power-plant-extra":{"i":"/poi-images/industry-helios-solar-power-plant-extra.webp","s":"Repräsentiert den wachsenden Sektor der erneuerbaren Energien auf Zypern, einer von vielen großen Solarparks.","f":["Solarkraftwerk Helios steht fuer die wirtschaftliche Vielfalt Zyperns jenseits des Tourismus.","Verarbeitung, Logistik und Handwerk sind zentrale Saeulen des Standortes."]},"industry-lafasia-quarries-extra":{"i":"/poi-images/industry-lafasia-quarries-extra.webp","s":"Große Kalksteinbrüche, die den Rohstoff für das Zementwerk Vassiliko liefern.","f":["Hier wird hauptsächlich Kalkstein für die Zementherstellung abgebaut.","Die Steinbrüche liegen in unmittelbarer Nähe zum Hafen Vassilikos."]},"industry-pervolia-desalination-plant-extra":{"i":"/poi-images/industry-pervolia-desalination-plant-extra.webp","s":"Eine kleinere Entsalzungseinheit, die zur Wassersicherheit der Region Larnaca beiträgt.","f":["Entsalzungsanlage Pervolia steht fuer die wirtschaftliche Vielfalt Zyperns jenseits des Tourismus.","Verarbeitung, Logistik und Handwerk sind zentrale Saeulen des Standortes."]},"industry-synergas-lpg-terminal-extra":{"i":"/poi-images/industry-synergas-lpg-terminal-extra.webp","s":"Ein wichtiges Terminal in Larnaca für den Import und die Lagerung von Flüssiggas (LPG).","f":["Synergas LPG-Terminal steht fuer die wirtschaftliche Vielfalt Zyperns jenseits des Tourismus.","Verarbeitung, Logistik und Handwerk sind zentrale Saeulen des Standortes."]},"industry-asgata-industrial-area-extra":{"i":"/poi-images/industry-asgata-industrial-area-extra.webp","s":"Ein Gebiet mit Schwerpunkt auf Bergbau- und Steinbruchtätigkeiten aufgrund seiner geologischen Zusammensetzung.","f":["Industriegebiet Asgata steht fuer die wirtschaftliche Vielfalt Zyperns jenseits des Tourismus.","Verarbeitung, Logistik und Handwerk sind zentrale Saeulen des Standortes."]},"industry-petrolina-larnaca-depot-extra":{"i":"/poi-images/industry-petrolina-larnaca-depot-extra.webp","s":"Eine der wichtigsten Erdöllagerstätten auf Zypern in der Nähe des Hafengebiets von Larnaca.","f":["Petrolina Larnaca Depot steht fuer die wirtschaftliche Vielfalt Zyperns jenseits des Tourismus.","Verarbeitung, Logistik und Handwerk sind zentrale Saeulen des Standortes."]},"industry-aphrodite-hills-wastewater-treatment-extra":{"i":"/poi-images/industry-aphrodite-hills-wastewater-treatment-extra.webp","s":"Eine moderne Kläranlage, die Wasser für die Bewässerung des Golfplatzes und der Gärten des Resorts recycelt.","f":["Kläranlage Aphrodite Hills steht fuer die wirtschaftliche Vielfalt Zyperns jenseits des Tourismus.","Verarbeitung, Logistik und Handwerk sind zentrale Saeulen des Standortes."]},"industry-tersefanou-solar-park-extra":{"i":"/poi-images/industry-tersefanou-solar-park-extra.webp","s":"Ein weiterer bedeutender Beitrag zu den Zielen Zyperns im Bereich der erneuerbaren Energien im Bezirk Larnaca.","f":["Solarpark Tersefanou steht fuer die wirtschaftliche Vielfalt Zyperns jenseits des Tourismus.","Verarbeitung, Logistik und Handwerk sind zentrale Saeulen des Standortes."]},"industry-kivides-poultry-extra":{"i":"/poi-images/industry-kivides-poultry-extra.webp","s":"Repräsentiert die groß angelegte Geflügelzuchtindustrie, ein wichtiger Teil der zypriotischen Agrarwirtschaft.","f":["Geflügelproduktion Kivides steht fuer die wirtschaftliche Vielfalt Zyperns jenseits des Tourismus.","Verarbeitung, Logistik und Handwerk sind zentrale Saeulen des Standortes."]},"port-limassol-port-extra":{"i":"/poi-images/port-limassol-port-extra.webp","s":"Der Haupthafen Zyperns, ein wichtiger Knotenpunkt für Fracht- und Kreuzfahrtschiffe im östlichen Mittelmeer.","f":["Hafen von Limassol ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-larnaca-port-extra":{"i":"/poi-images/port-larnaca-port-extra.webp","s":"Der zweitgrößte Hafen Zyperns, der sowohl dem Handels- als auch dem Passagierverkehr dient.","f":["Hafen von Larnaca ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-paphos-harbour-extra":{"i":"/poi-images/port-paphos-harbour-extra.webp","s":"Ein malerischer Hafen, der hauptsächlich von Fischerbooten und für Freizeitkreuzfahrten genutzt wird, überragt von der Burg von Paphos.","f":["Hafen von Paphos ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-limassol-marina-extra":{"i":"/poi-images/port-limassol-marina-extra.webp","s":"Ein exklusiver Superyachthafen mit Luxusresidenzen, Restaurants und Geschäften.","f":["Die Anlage bietet 650 Liegeplätze für Yachten bis zu 110 Metern Länge.","Luxuriöse Villen verfügen über private Anlegeplätze direkt vor der Tür."]},"port-larnaca-marina-extra":{"i":"/poi-images/port-larnaca-marina-extra.webp","s":"Ein großer Yachthafen für private Yachten, der sich neben dem Haupthafen von Larnaca befindet.","f":["Die Marina bietet Platz für rund 450 Yachten unterschiedlicher Größe.","Sie befindet sich am südlichen Ende der berühmten Phinikoudes-Promenade."]},"port-latsi-port-extra":{"i":"/poi-images/port-latsi-port-extra.webp","s":"Ein charmanter Fischerei- und Yachthafen, Ausgangspunkt für Bootsfahrten zur Akamas-Halbinsel und zur Blauen Lagune.","f":["Hafen von Latsi ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-zygi-fishing-shelter-extra":{"i":"/poi-images/port-zygi-fishing-shelter-extra.webp","s":"Ein moderner Fischereihafen und eine Marina, berühmt für seine frischen Fischtavernen.","f":["Der Hafen wurde vor kurzem erweitert und bietet nun auch Plätze für Yachten.","Zygi ist berühmt für seine hohe Dichte an spezialisierten Fisch-Tavernen."]},"port-ayia-napa-harbour-extra":{"i":"/poi-images/port-ayia-napa-harbour-extra.webp","s":"Ein belebter Hafen voller Fischerboote, Piraten-Themen-Kreuzfahrtschiffe und Restaurants am Wasser.","f":["Hafen von Ayia Napa ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-larnaca-international-airport-glafcos-clerides-extra":{"i":"/poi-images/port-larnaca-international-airport-glafcos-clerides-extra.webp","s":"Das wichtigste internationale Tor Zyperns am Rande von Larnaca.","f":["Der Flughafen wurde nach dem ehemaligen Präsidenten Glafcos Clerides benannt.","Ein neues Terminalgebäude wurde im November 2009 in Betrieb genommen."]},"port-paphos-international-airport-pfo-extra":{"i":"/poi-images/port-paphos-international-airport-pfo-extra.webp","s":"Der zweitgrößte Flughafen des Landes, der Touristen für Paphos und Limassol bedient.","f":["Der Flughafen wurde im Jahr 2008 umfassend modernisiert und erweitert.","Er ist ein wichtiger Stützpunkt für mehrere europäische Billigflieger."]},"port-ercan-international-airport-ecn-extra":{"i":"/poi-images/port-ercan-international-airport-ecn-extra.webp","s":"Der wichtigste zivile Flughafen Nordzyperns in der Nähe von Nikosia.","f":["Ein neues, modernes Terminalgebäude wurde im Jahr 2023 eröffnet.","Die Landebahn hat eine Länge von rund 3.000 Metern."]},"port-pomos-fishing-shelter-extra":{"i":"/poi-images/port-pomos-fishing-shelter-extra.webp","s":"Ein kleiner, malerischer Fischereihafen in einem abgelegenen und schönen Teil des Bezirks Paphos.","f":["Der Hafen liegt am Fuße der steilen Ausläufer des Troodos-Gebirges.","Er ist einer der kleinsten offiziellen Fischereihäfen der Insel."]},"port-famagusta-port-extra":{"i":"/poi-images/port-famagusta-port-extra.webp","s":"Der Haupthafen Nordzyperns, historisch einer der wichtigsten Häfen der Levante.","f":["Der Hafen bietet Liegeplätze für Schiffe mit bis zu 10 Metern Tiefgang.","Er liegt direkt neben der mittelalterlichen Altstadt von Famagusta."]},"port-agia-triada-fishing-shelter-extra":{"i":"/poi-images/port-agia-triada-fishing-shelter-extra.webp","s":"Ein kleiner Fischereihafen in der Nähe von Protaras mit einer charmanten Kapelle mit Blick auf das Meer.","f":["Der Hafen wird von einer kleinen, weiß-blauen Kapelle bewacht.","Er bietet Schutz für die Boote vor dem offenen Meer."]},"port-pernera-harbour-extra":{"i":"/poi-images/port-pernera-harbour-extra.webp","s":"Ein kleiner Hafen im Ferienort Pernera, der von einheimischen Fischern und für touristische Bootsfahrten genutzt wird.","f":["Hafen von Pernera ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-st-raphael-marina-limassol-extra":{"i":"/poi-images/port-st-raphael-marina-limassol-extra.webp","s":"Ein privater Yachthafen, der Teil eines Luxushotels ist und Dienstleistungen für Yachten und einen mit der Blauen Flagge ausgezeichneten Strand bietet.","f":["St. Raphael Marina ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-liopetri-river-fishing-shelter-extra":{"i":"/poi-images/port-liopetri-river-fishing-shelter-extra.webp","s":"Der Liopetri-Fluss (Potamos tou Liopetriou) ist ein malerischer natürlicher Fischerhafen an der Südostküste Zyperns.","f":["Fischereihafen am Fluss Liopetri ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-nicosia-central-bus-station-extra":{"i":"/poi-images/port-nicosia-central-bus-station-extra.webp","s":"Der Hauptknotenpunkt für den Überland- und Stadtbusverkehr in Nikosia, ein wichtiger Knotenpunkt des öffentlichen Verkehrs.","f":["Zentraler Busbahnhof am Solomou-Platz ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-limassol-old-port-bus-station-extra":{"i":"/poi-images/port-limassol-old-port-bus-station-extra.webp","s":"Der Hauptbahnhof des öffentlichen Verkehrsnetzes von Limassol, in der Nähe des Alten Hafens und der Marina.","f":["Zentraler Busbahnhof EMEL (Alter Hafen) ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-paphos-karavella-bus-station-extra":{"i":"/poi-images/port-paphos-karavella-bus-station-extra.webp","s":"Der Hauptbusbahnhof im oberen Teil der Stadt Paphos, der ländliche und überregionale Routen verbindet.","f":["Busbahnhof Karavella ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-larnaca-central-bus-station-extra":{"i":"/poi-images/port-larnaca-central-bus-station-extra.webp","s":"Der Hauptknotenpunkt für lokale und überregionale Busse in Larnaca, an der Finikoudes-Promenade gelegen.","f":["Zentraler Busbahnhof Larnaca ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-ayia-napa-central-bus-station-extra":{"i":"/poi-images/port-ayia-napa-central-bus-station-extra.webp","s":"Ein wichtiger Busbahnhof für Touristen, der Ayia Napa mit anderen Ferienorten und Städten verbindet.","f":["Zentraler Busbahnhof Ayia Napa ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-ormidhia-fishing-shelter-extra":{"i":"/poi-images/port-ormidhia-fishing-shelter-extra.webp","s":"Ein kleiner lokaler Fischereihafen in der souveränen Basiszone Dhekelia.","f":["Der Hafen liegt in einer kleinen Bucht innerhalb der Dhekelia-Zone.","Er dient als Basis für etwa 30 bis 40 kleine traditionelle Fischerboote."]},"port-agios-georgios-peyias-harbour-extra":{"i":"/poi-images/port-agios-georgios-peyias-harbour-extra.webp","s":"Ein kleiner und sehr malerischer Fischereihafen mit einigen Fischtavernen und einer antiken Basilika in der Nähe.","f":["Hafen von Agios Georgios Pegeias ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-paralimni-marina-extra":{"i":"/poi-images/port-paralimni-marina-extra.webp","s":"Eine moderne Marina-Entwicklung, die für die Unterbringung von Yachten konzipiert ist und Wohn- und Gewerbeeinrichtungen bietet.","f":["Marina von Paralimni ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-nicosia-international-airport-abandoned-extra":{"i":"/poi-images/port-nicosia-international-airport-abandoned-extra.webp","s":"Der ehemalige Hauptflughafen Zyperns, heute stillgelegt und in der UN-Pufferzone gelegen.","f":["Internationaler Flughafen Nikosia (verlassen) ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-dps-dp-world-limassol-extra":{"i":"/poi-images/port-dps-dp-world-limassol-extra.webp","s":"Der wichtigste Mehrzweck- und Kreuzfahrtterminalbetreiber im Hafen von Limassol.","f":["Eröffnung des neuen Passagierterminals im Jahr 2017.","Verfügt über eine Kailänge von insgesamt 800 Metern."]},"port-eurogate-container-terminal-limassol-extra":{"i":"/poi-images/port-eurogate-container-terminal-limassol-extra.webp","s":"Der primäre Containerterminal im Hafen von Limassol, der den Großteil des Containerverkehrs Zyperns abwickelt.","f":["Eurogate Container Terminal Limassol ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"port-old-limassol-port-extra":{"i":"/poi-images/port-old-limassol-port-extra.webp","s":"Heute ein lebhaftes Freizeitziel mit Restaurants, Cafés und Geschäften, dient es als Schutzhafen für Fischerboote.","f":["Alter Hafen von Limassol ist ein wichtiger maritimer Knotenpunkt auf Zypern.","Schifffahrt, Fischerei und Tourismus treffen hier zusammen."]},"landscape-troodos-mountains-extra":{"i":"/poi-images/landscape-troodos-mountains-extra.webp","s":"Die größte Gebirgskette Zyperns, Heimat des Olymps, byzantinischer Klöster und malerischer Dörfer.","f":["Troodos-Gebirge ist eines der const svg=document.getElementById('svg'),stage=document.getElementById('stage');

const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;

svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});

let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');

  el.classList.add('active');

  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}

  const c=POI_CARD[id]||{};

  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');

  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}

// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();

document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
