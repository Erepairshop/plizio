.poi-metro .pm-ring{fill:none;stroke:#ffd54a;stroke-width:1.6;opacity:.85}
.poi-metro .pm-dot{fill:#fff;filter:drop-shadow(0 0 5px #ffd54a)}

.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}

.burst-line{stroke:rgba(120,185,255,.4);stroke-width:1.1;stroke-linecap:round;animation:burstFade .25s ease-out}
.burst-core{fill:#cdeeff;filter:drop-shadow(0 0 5px #7fd0ff)}
.burst-dots{position:absolute;inset:0}

.zoom button:active{background:#1a2240}

tei"]},"cy-famagusta":{"i":"/poi-images/cy-famagusta.webp","s":"Oraș-port istoric pe coasta de est, cu ruine medievale impresionante.","f":["Zidurile orașului au o lungime de 3 km și sunt aproape intacte.","Moscheea Lala Mustafa Pașa a fost inițial o catedrală gotică."]},"cy-ayianapa":{"i":"/poi-images/cy-ayianapa.webp","s":"Cunoscută pentru plajele sale de nisip, mănăstirea medievală și viața de noapte vibrantă.","f":["Plaja Nissi este considerată una dintre cele mai frumoase din Europa.","Mănăstirea medievală din centrul orașului a fost construită în jurul anului 1500."]},"cy-kourion":{"i":"/poi-images/cy-kourion.webp","s":"Unul dintre cele mai impresionante situri arheologice din Cipru, cu un teatru roman.","f":["Teatru antic greco-roman","Mozaicurile din Casa Eustolios"]},"cy-tombs-kings":{"i":"/poi-images/cy-tombs-kings.webp","s":"O mare necropolă din perioada elenistică și romană în apropiere de Paphos.","f":["Patrimoniu Mondial UNESCO","Datate din perioada elenistică"]},"cy-kolossi":{"i":"/poi-images/cy-kolossi.webp","s":"O fostă fortăreață a cruciaților în apropiere de Limassol.","f":["Construit în secolul al XIII-lea","Sediu al Cavalerilor Ioaniți"]},"cy-hala-sultan":{"i":"/poi-images/cy-hala-sultan.webp","s":"Un important loc de pelerinaj islamic pe malul Lacului Sărat din Larnaca.","f":["Construită în anul 1816","Mormântul lui Umm Haram"]},"cy-kykkos":{"i":"/poi-images/cy-kykkos.webp","s":"Cea mai bogată și cunoscută mănăstire din Cipru, situată în munții Troodos.","f":["Fondată în secolul al XI-lea","Icoana Maicii Domnului de Sf. Luca"]},"cy-salamis":{"i":"/poi-images/cy-salamis.webp","s":"Un oraș antic extins pe coasta de est a Ciprului.","f":["Fosta capitală a Ciprului","Teatru roman impunător"]},"cy-choirokoitia":{"i":"/poi-images/cy-choirokoitia.webp","s":"Unul dintre cele mai importante situri preistorice din estul Mării Mediterane (UNESCO).","f":["Așezarea a fost descoperită în 1934 de Porphyrios Dikaios.","Casele rotunde au un diametru exterior între 2,3 și 9,2 metri."]},"cy-st-lazarus":{"i":"/poi-images/cy-st-lazarus.webp","s":"O biserică istorică bizantină în centrul orașului Larnaca.","f":["Construită în secolul al IX-lea","Mormântul Sfântului Lazăr"]},"cy-mount-olympus":{"i":"/poi-images/cy-mount-olympus.webp","s":"Cel mai înalt punct din Cipru, situat în munții Troodos (1.952 m).","f":["Altitudine de 1951 metri","Parte din munții Troodos"]},"cy-cape-greco":{"i":"/poi-images/cy-cape-greco.webp","s":"Un parc național uimitor, cu peșteri marine și ape de un albastru limpede.","f":["Parcul național se întinde pe o suprafață de aproape 400 de hectare.","Aici se află celebrul 'Pod al Îndrăgostiților', un arc de piatră natural."]},"cy-akamas":{"i":"/poi-images/cy-akamas.webp","s":"O rezervație naturală în vest, cu un peisaj neatins și o mare diversitate de specii.","f":["Zona acoperă o suprafață de aproximativ 230 de kilometri pătrați.","Țestoasele marine protejate cuibăresc pe plajele izolate de aici."]},"cy-salt-lake":{"i":"/poi-images/cy-salt-lake.webp","s":"O rețea complexă de lacuri sărate, cunoscută ca loc de iernat pentru flamingi.","f":["Al doilea lac sărat ca mărime","Loc de iernare pentru flamingo"]},"cy-aphrodite-rock":{"i":"/poi-images/cy-aphrodite-rock.webp","s":"O formațiune stâncoasă impresionantă în mare, locul legendar de naștere al zeiței Afrodita.","f":["Locul este cunoscut local și sub numele de Petra tou Romiou.","Formațiunea este situată pe drumul de coastă între Paphos și Limassol."]},"cy-avakas-gorge":{"i":"/poi-images/cy-avakas-gorge.webp","s":"Un defileu adânc și abrupt pe Peninsula Akamas, popular printre drumeți.","f":["Defileul a fost sculptat de un pârâu pe parcursul a mii de ani.","Traseul de drumeție prin chei are o lungime de aproximativ 3 kilometri."]},"cy-nissi-beach":{"i":"/poi-images/cy-nissi-beach.webp","s":"Una dintre cele mai faimoase plaje cu nisip alb din Ayia Napa.","f":["500 de metri de nisip fin","Insulă accesibilă la pas"]},"cy-limassol-carnival":{"i":"/poi-images/cy-limassol-carnival.webp","s":"Un festival anual de zece zile, cel mai vechi și mai popular din Cipru.","f":["Sărbătoare de unsprezece zile","Marea paradă de duminică"]},"cy-paphos-aphrodite":{"i":"/poi-images/cy-paphos-aphrodite.webp","s":"Un festival internațional de operă care are loc în fiecare vară în Paphos.","f":["Festival de operă în aer liber","În fața castelului din Paphos"]},"cy-kataklysmos":{"i":"/poi-images/cy-kataklysmos.webp","s":"Sărbătoarea Potopului, celebrată în special în Larnaca cu activități pe apă.","f":["Cunoscut ca Sărbătoarea Potopului","Are loc după Paștele ortodox"]},"cy-wine-festival":{"i":"/poi-images/cy-wine-festival.webp","s":"Un festival popular în Limassol pentru celebrarea tradiției vinului cipriot.","f":["Sfârșitul lunii august","În grădina publică Limassol"]},"cy-othello-castle":{"i":"/poi-images/cy-othello-castle.webp","s":"Un castel din Famagusta, numit după faimoasa piesă a lui Shakespeare.","f":["Situat în portul Famagusta","Legat de piesa lui Shakespeare"]},"cy-blue-lagoon":{"i":"/poi-images/cy-blue-lagoon.webp","s":"O destinație populară pentru înot, cu apă cristalină, pe Peninsula Akamas.","f":["Apa este atât de limpede încât fundul mării este vizibil la mari adâncimi.","Laguna este accesibilă cel mai ușor cu barca din portul Latchi."]},"CY-001-zenobia":{"i":"/poi-images/CY-001-zenobia.webp","s":"Unul dintre cele mai bune locuri de scufundări din lume, un feribot scufundat în largul coastei Larnaca.","f":["Zenobia s-a scufundat în 1980 în timpul călătoriei sale inaugurale.","Epava se află la o adâncime cuprinsă între 16 și 42 de metri."]},"CY-001-larnaca-fort":{"i":"/poi-images/CY-001-larnaca-fort.webp","s":"O cetate medievală la capătul sudic al promenadei Finikoudes.","f":["Construită inițial în secolul al XIV-lea.","A servit ca închisoare în timpul stăpânirii britanice."]},"CY-002-varosha":{"i":"/poi-images/CY-002-varosha.webp","s":"Un cartier turistic odinioară înfloritor din Famagusta, abandonat din 1974.","f":["Înainte de 1974, a fost una dintre cele mai populare destinații de vacanță din lume.","A rămas închis publicului timp de decenii."]},"CY-002-fig-tree-bay":{"i":"/poi-images/CY-002-fig-tree-bay.webp","s":"O plajă populară cu nisip în Protaras, cunoscută pentru apele sale cristaline.","f":["Numită după un singur smochin care ar fi stat acolo încă din secolul al XVII-lea.","Este adesea votată printre cele mai bune plaje din Europa."]},"CY-003-cyprus-museum":{"i":"/poi-images/CY-003-cyprus-museum.webp","s":"Cel mai vechi și mai mare muzeu arheologic din Cipru, în Nicosia.","f":["Găzduiește descoperiri din epoca neolitică până în perioada bizantină.","A fost fondat în 1882."]},"CY-003-ledra-street":{"i":"/poi-images/CY-003-ledra-street.webp","s":"Principala stradă comercială din orașul vechi al Nicosiei.","f":["Cunoscută pentru punctul de trecere a frontierei între partea greacă și cea turcă.","Numită după regatul antic Ledra."]},"CY-004-amathus":{"i":"/poi-images/CY-004-amathus.webp","s":"Unul dintre cele mai importante regate antice din Cipru, pe coasta Limassolului.","f":["A fost un centru de cult al zeiței Afrodita.","Situl arheologic include o acropolă și o basilică."]},"CY-004-sanctuary-apollo":{"i":"/poi-images/CY-004-sanctuary-apollo.webp","s":"Un important sanctuar antic dedicat lui Apollo ca zeu al pădurilor.","f":["Situat la vest de orașul antic Kourion.","A fost unul dintre cele mai importante centre religioase din Cipru."]},"CY-005-paphos-castle":{"i":"/poi-images/CY-005-paphos-castle.webp","s":"O fortăreață medievală situată în portul Paphos.","f":["Construit inițial ca o fortăreață bizantină pentru a proteja portul.","A fost reconstruit de familia Lusignan și ulterior de otomani."]},"CY-005-adonis-baths":{"i":"/poi-images/CY-005-adonis-baths.webp","s":"O cascadă pitorească și o piscină naturală lângă Paphos.","f":["Conform legendei, Adonis și Afrodita s-au întâlnit aici.","Sub cascadă se află o lagună adâncă."]},"animal-habitat-limassol-zoo-extra":{"i":"/poi-i function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';

    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}

  });

    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });

  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];

    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Search-only entries (POIs on a sub-map): match by name, navigate to the sub-map.
  const extraHits=[];

  // Compute by examining current cluster visibility (already set in Phase 2 above).

    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.

        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0&&extraHits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  const exRow=e=>'<a data-extra="1" href="'+e.u+'"><span class="dot" style="background:#ffd54a"></span><span class="nm">'+e.n.replace(/[<>]/g,'')+'</span><span class="gr">›</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('')+extraHits.map(exRow).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const ax=e.target.closest('a[data-extra]');
  if(ax)return; // sub-map link: let the browser navigate
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
