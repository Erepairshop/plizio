 primei adunări naționale maghiare."]},"city-bicske-extra":{"i":"/poi-images/city-bicske-extra.webp","s":"Bicske este un oraș în bazinul Zsámbék, cunoscut pentru castelul și observatorul său.","f":["Castel Batthyány important.","Primul observator astronomic din Ungaria."]},"geo-velencei-hegyseg-extra":{"i":"/poi-images/geo-velencei-hegyseg-extra.webp","s":"Un lanț muntos format din granit la nord de lacul Velence, cunoscut pentru pietrele sale mișcătoare.","f":["Format în principal din granit.","Faimos pentru pietrele mișcătoare."]},"geschichte-pazmand-vizimalom-extra":{"i":"/poi-images/geschichte-pazmand-vizimalom-extra.webp","s":"O moară de apă istorică restaurată într-un cadru pitoresc.","f":["Moară de apă funcțională.","Monument industrial."]},"geschichte-taci-gorsium-extra":{"i":"/poi-images/geschichte-taci-gorsium-extra.webp","s":"Un sit arheologic roman important lângă Tác.","f":["Fost oraș roman.","Cel mai mare parc arheologic din Ungaria."]},"city-csorna-extra":{"i":"/poi-images/city-csorna-extra.webp","s":"Csorna este centrul regiunii Rábaköz, cunoscut pentru abația sa premonstratensă.","f":["Sediul abației premonstratense.","Centrul regiunii Rábaköz."]},"geschichte-eszterhazy-kastely-extra":{"i":"/poi-images/geschichte-eszterhazy-kastely-extra.webp","s":"Palatul Eszterházy din Fertőd este unul dintre cele mai mari și mai magnifice palate baroce din Ungaria, adesea numit \"Versailles-ul maghiar\".","f":["A fost construit în secolul al XVIII-lea de prințul Nikolaus I Joseph Esterházy.","Celebrul compozitor Joseph Haydn a trăit și a lucrat aici timp de aproape trei decenii."]},"geo-nagyerdo-extra":{"i":"/poi-images/geo-nagyerdo-extra.webp","s":"Nagyerdő este o pădure urbană în Debrecen și a fost prima rezervație naturală din Ungaria.","f":["Prima rezervație naturală din Ungaria (1939).","Stejari centenari."]},"geschichte-debreceni-reformatus-nagytemplom-extra":{"i":"/poi-images/geschichte-debreceni-reformatus-nagytemplom-extra.webp","s":"Simbolul orașului Debrecen și cea mai mare biserică reformată din Ungaria.","f":["Cea mai mare biserică reformată din țară.","Locul Declarației de Independență din 1849."]},"geschichte-hortobagyi-kilenclyuku-hid-extra":{"i":"/poi-images/geschichte-hortobagyi-kilenclyuku-hid-extra.webp","s":"Cel mai lung pod de piatră din Ungaria și simbolul regiunii Hortobágy.","f":["Cel mai lung pod de piatră din Ungaria (167 m).","Construit în secolul al XIX-lea."]},"city-fuzesabony-extra":{"i":"/poi-images/city-fuzesabony-extra.webp","s":"Un nod feroviar important în nordul Ungariei, cu o istorie arheologică bogată.","f":["Descoperiri importante din epoca bronzului.","Nod feroviar strategic."]},"geschichte-egri-bazilika-extra":{"i":"/poi-images/geschichte-egri-bazilika-extra.webp","s":"Bazilica din Eger, cunoscută oficial drept Catedrala Sfântul Ioan Apostolul și Evanghelistul, este o capodoperă monumentală a neoclasicismului maghiar și a doua cea mai mare biserică din țară."},"geo-tisza-to-extra":{"i":"/poi-images/geo-tisza-to-extra.webp","s":"Al doilea cel mai mare lac din Ungaria, un luciu de apă artificial cu floră și faună bogată.","f":["Lac creat artificial.","Al doilea cel mai mare lac din Ungaria."]},"geschichte-szolnoki-muvesztelep-extra":{"i":"/poi-images/geschichte-szolnoki-muvesztelep-extra.webp","s":"Cea mai veche colonie de artiști din Ungaria, situată la confluența râurilor Tisa și Zagyva.","f":["Fondată în anul 1902.","Cea mai veche colonie de artiști din țară."]},"geschichte-tiszaderzs-romtemplom-extra":{"i":"/poi-images/geschichte-tiszaderzs-romtemplom-extra.webp","s":"O ruină de biserică medievală din secolul al XIII-lea lângă lacul Tisa.","f":["Construită în secolul al XIII-lea.","Stil romanic."]},"city-dorog-extra":{"i":"/poi-images/city-dorog-extra.webp","s":"Dorog este un oraș minier tradițional în munții Pilis.","f":["Centru minier istoric.","Situat la poalele munților Pilis."]},"city-orosz lany-extra":{"i":"/poi-images/city-orosz lany-extra.webp","s":"Oroszlány este cunoscut pentru trecutul său minier și Schitul Camaldulenz din apropiere.","f":["Fost oraș minier.","În apropiere se află schitul Majk."]},"geo-gerecse-extra":{"i":"/poi-images/geo-gerecse-extra.webp","s":"Un lanț muntos în nordul Transdanubiei, cunoscut pentru marmura sa roșie.","f":["Cunoscut pentru marmura roșie.","Cel mai înalt vârf: Nagy-Gerecse (633 m)."]},"geschichte-turul-emlekmu-extra":{"i":"/poi-images/geschichte-turul-emlekmu-extra.webp","s":"Cea mai mare statuie de pasăre din Europa Centrală, situată pe muntele Kő deasupra orașului Tatabánya.","f":["Cea mai mare statuie de pasăre din Europa Centrală.","Anvergura aripilor de 15 metri."]},"geschichte-tatai-var-extra":{"i":"/poi-images/geschichte-tatai-var-extra.webp","s":"O cetate de apă frumoasă pe malul lacului Öreg din Tata.","f":["Fostă reședință regală.","Situată pe malul lacului Öreg."]},"city-paszto-extra":{"i":"/poi-images/city-paszto-extra.webp","s":"Un orășel istoric la poalele munților Cserhát și Mátra.","f":["Fostă abație cisterciană.","Deține o școală gotică."]},"geo-karanc-extra":{"i":"/poi-images/geo-karanc-extra.webp","s":"Karancs, adesea numit „Olimpul Palócilor”, este un munte proeminent la granița dintre Ungaria și Slovacia, în județul Nógrád."},"geschichte-somoskoi-var-extra":{"i":"/poi-images/geschichte-somoskoi-var-extra.webp","s":"Castelul din Somoskő, așezat maiestuos pe un con de bazalt de origine vulcanică la granița dintre Ungaria și Slovacia, este o bijuterie istorică unică."},"geschichte-szandavari-varrom-extra":{"i":"/poi-images/geschichte-szandavari-varrom-extra.webp","s":"Ruinele cetății Szanda, cocoțate pe vârful de 529 de metri al dealului Szanda, sunt o destinație plină de satisfacții pentru drumeți și pasionații de istorie."},"city-rackeve-extra":{"i":"/poi-images/city-rackeve-extra.webp","s":"Un oraș fermecător pe brațul Csepel al Dunării, cunoscut pentru castelul Savoyai.","f":["Castel baroc Savoyai.","Singura biserică sârbă gotică din Ungaria."]},"city-nagymaros-extra":{"i":"/poi-images/city-nagymaros-extra.webp","s":"Un oraș pitoresc în Cotul Dunării, vis-à-vis de cetatea Visegrád.","f":["Cea mai bună vedere spre cetatea Visegrád.","Situat în Cotul Dunării."]},"geo-duna-kanyar-extra":{"i":"/poi-images/geo-duna-kanyar-extra.webp","s":"Una dintre cele mai spectaculoase porțiuni ale Dunării, unde fluviul își schimbă cursul spre sud.","f":["Cot spectaculos al fluviului.","Bogat în orașe istorice."]},"geschichte-vac-dom-extra":{"i":"/poi-images/geschichte-vac-dom-extra.webp","s":"Catedrala din Vác este o construcție monumentală în stil baroc târziu și clasicist.","f":["Capodoperă a clasicismului.","Statui de József Bechert."]},"geo-zselic-extra":{"i":"/poi-images/geo-zselic-extra.webp","s":"La sud de Kaposvár se întinde Zselic, o regiune deluroasă blândă, care se numără printre cele mai puțin populate și mai bogate în păduri zone din Ungaria."},"geschichte-szantodpuszta-extra":{"i":"/poi-images/geschichte-szantodpuszta-extra.webp","s":"Szántódpuszta, pe malul sudic al lacului Balaton, este un muzeu în aer liber unic, care oferă o perspectivă autentică asupra vieții unei moșii maghiare (puszta) în secolele al XVIII-lea și al XIX-lea."},"geschichte-somogyvar-extra":{"i":"/poi-images/geschichte-somogyvar-extra.webp","s":"Ruinele de la Somogyvár, situate pe dealul Kupavár, sunt unul dintre cele mai importante situri istorice din Ungaria din perioada dinastiei Árpád."},"city-ujfeherto-extra":{"i":"/poi-images/city-ujfeherto-extra.webp","s":"Újfehértó este un oraș la sud de Nyíregyháza, cunoscut pentru cultivarea fructelor.","f":["Faimos pentru mere și vișine.","Situat în regiunea Nyírség."]},"city-tamasi-extra":{"i":"/poi-images/city-tamasi-extra.webp","s":"Tamási este un oraș din Transdanubia, cunoscut pentru băile sale termale și parcul de vânătoare.","f":["Băi termale populare.","Parcul de vânătoare Gyulaj în apropiere."]},"geo-siocsatorna-extra":{"i":"/poi-images/geo-siocsatorna-extra.webp","s":"Canalul Sió este o cale navigabilă artificială în Transdanubia, care leagă Lacul Balaton de Dunăre."},"historical-graboc-extra":{"i":"/poi-images/historical-graboc-extra.webp","s":"Mănăstirea sârbă-ortodoxă Grábóc este ascunsă într-o vale pitorească a dealurilor Szekszárd din comitatul Tolna."},"landmark-ozora-extra":{"i":"/poi-images/landmark-ozora-extra.webp","s":"Castelul din Ozora este o bijuterie remarcabilă a arhitecturii renascentiste din Ungaria, situată în inima județului Tolna."},"city-vasvar-extra":{"i":"/poi-images/city-vasvar-extra.webp","s":"Vasvár este un orășel cu o istorie bogată, fostul centru al județului Vas.","f":["Locul păcii din 1664.","Veche mănăstire dominicană."]},"city-janoshaza-extra":{"i":"/poi-images/city-janoshaza-extra.webp","s":"Jánosháza este un orășel în partea de est a județului Vas.","f":["Castelul Erdődy-Choron.","Nod de transport."]},"geo-pinka-extra":{"i":"/poi-images/geo-pinka-extra.webp","s":"Pinka este un râu pitoresc care izvorăște din Joglland, în Stiria, Austria, și traversează un peisaj deluros fermecător pe drumul său prin sudul Burgenlandului și vestul Ungariei, înainte de a se v..."},"historical-sitke-extra":{"i":"/poi-images/historical-sitke-extra.webp","s":"Capela calvarului din Sitke este o capelă romantică situată pe un deal.","f":["Stil neogotic.","Cunoscută pentru festivaluri rock."]},"landmark-pityerszer-extra":{"i":"/poi-images/landmark-pityerszer-extra.webp","s":"Pityerszer este un muzeu al satului în Őrség, care prezintă arhitectura tradițională.","f":["Muzeu în aer liber.","Așezare tradițională de tip 'szer'."]},"city-ajka-extra":{"i":"/poi-images/city-ajka-extra.webp","s":"Ajka este un oraș industrial în munții Bakony, cunoscut pentru fabricarea sticlei și minerit.","f":["Fabrică de cristal faimoasă.","Muzeul Mineritului."]},"city-berhida-extra":{"i":"/poi-images/city-berhida-extra.webp","s":"Berhida este un orășel situat în apropiere de Balaton.","f":["Biserică gotică târzie.","Pe râul Séd."]},"geo-csobanc-extra":{"i":"/poi-images/geo-csobanc-extra.webp","s":"Csobánc este unul dintre dealurile martor caracteristice ale bazinului Tapolca.","f":["Deal martor de origine vulcanică.","Ruine de cetate pe vârf."]},"historical-csesznek-extra":{"i":"/poi-images/historical-csesznek-extra.webp","s":"Cetatea Csesznek este o fortificație medievală impresionantă în munții Bakony.","f":["Situată pe o stâncă.","Rădăcini medievale."]},"landmark-osku-extra":{"i":"/poi-images/landmark-osku-extra.webp","s":"Biserica rotundă din Öskü este o clădire medievală unică cu acoperiș în formă de ciupercă.","f":["Rotundă medievală.","Acoperiș în formă de ciupercă."]},"city-letenye-extra":{"i":"/poi-images/city-letenye-extra.webp","s":"Letenye este un oraș de frontieră cu Croația, cunoscut pentru vechiul său parc al castelului.","f":["La granița cu Croația.","Parcul castelului cu un platan uriaș."]},"city-zalalovo-extra":{"i":"/poi-images/city-zalalovo-extra.webp","s":"Zalalövő este un oraș pe râul Zala, construit pe ruine romane.","f":["Așezarea romană Salla.","Poarta către Őrség."]},"geo-kisbalaton-extra":{"i":"/poi-images/geo-kisbalaton-extra.webp","s":"Micul Balaton este o zonă umedă uriașă și o rezervație naturală la capătul vestic al Balatonului.","f":["Paradisul păsărilor.","Sistem de filtrare natural."]},"historical-egervar-extra":{"i":"/poi-images/historical-egervar-extra.webp","s":"Castelul din Egervár este o fortificație în stil gotic târziu și renaștere.","f":["Fostă cetate de frontieră.","Castel baroc cu turnuri de colț."]},"landmark-gocsej-falumuzeum-extra":{"i":"/poi-images/landmark-gocsej-falumuzeum-extra.webp","s":"Muzeul Satului din Göcsej (Göcseji Falumúzeum) din Zalaegerszeg este primul de acest fel din Ungaria și o fereastră fascinantă către trecutul regiunii Zala."},"mountain-janos-hegy-extra":{"i":"/poi-images/mountain-janos-hegy-extra.webp","s":"Muntele János (János-hegy), cu o altitudine de 528 de metri, este cel mai înalt punct din Budapesta și o parte esențială a Munților Buda."},"mountain-harmashatar-hegy-extra":{"i":"/poi-images/mountain-harmashatar-hegy-extra.webp","s":"Muntele Hármashatár (Muntele celor Trei Hotare) este un vârf de 495 de metri în Munții Buda și o destinație de excursie extrem de populară pentru locuitorii Budapestei."},"mountain-sas-hegy-extra":{"i":"/poi-images/mountain-sas-hegy-extra.webp","s":"Muntele Vulturului (Sas-hegy) este o bijuterie naturală unică în inima Budei."},"lake-naplas-to-extra":{"i":"/poi-images/lake-naplas-to-extra.webp","s":"Lacul Naplás, situat la granița dintre districtele XVI și XVII ale Budapestei, este cel mai mare lac al orașului și o valoroasă rezervație naturală."},"river-soroksari-duna-extra":{"i":"/poi-images/river-soroksari-duna-extra.webp","s":"Brațul Soroksár al Dunării, cunoscut și sub numele de Dunărea de la Ráckeve, este un braț lateral liniștit de 58 de kilometri al Dunării, care se întinde la sud de Budapesta."},"mountain-zengo-extra":{"i":"/poi-images/mountain-zengo-extra.webp","s":"Cel mai înalt vârf al munților Mecsek din sudul Ungariei.","f":["Înălțime: 682 metri.","Locația unui turn de observație modern."]},"mountain-tubes-extra":{"i":"/poi-images/mountain-tubes-extra.webp","s":"Un vârf proeminent în munții Mecsek, deasupra orașului Pécs.","f":["Înălțime: 611 metri.","Deține turnul de observație János."]},"mountain-jakab-hegy-extra":{"i":"/poi-images/mountain-jakab-hegy-extra.webp","s":"Un deal cu semnificație istorică lângă Pécs, cu metereze preistorice.","f":["Format din gresie roșie.","Ruine ale unei mănăstiri pauline."]},"river-fekete-viz-extra":{"i":"/poi-images/river-fekete-viz-extra.webp","s":"Un râu mic în Câmpia Baranya, un colector de apă important.","f":["Se varsă în Dráva.","Definește peisajul mlaștinos din Ormánság."]},"lake-orfui-to-extra":{"i":"/poi-images/lake-orfui-to-extra.webp","s":"Un sistem de lacuri artificiale în Mecsek, un centru popular de recreere.","f":["Format din patru lacuri individuale.","Locul festivalului de muzică 'Fishing on Orfű'."]},"lake-kunfeher-to-extra":{"i":"/poi-images/lake-kunfeher-to-extra.webp","s":"Lacul Kunfehér, adesea denumit simplu „Fehér-tó” (Lacul Alb), este o zonă de agrement populară în apropierea comunei Kunfehértó din județul Bács-Kiskun."},"lake-szelidi-to-extra":{"i":"/poi-images/lake-szelidi-to-extra.webp","s":"Lacul Szelid (Szelidi-tó) este un fenomen natural unic și una dintre cele mai populare destinații de vacanță din Marea Câmpie Ungară."},"lake-kolon-to-extra":{"i":"/poi-images/lake-kolon-to-extra.webp","s":"Lacul Kolon de lângă Izsák este una dintre cele mai valoroase bijuterii ale Parcului Național Kiskunság și o zonă umedă Ramsar recunoscută la nivel internațional."},"forest-bugaci-puszta-extra":{"i":"/poi-images/forest-bugaci-puszta-extra.webp","s":"Pusta din Bugac este unul dintre cele mai cunoscute și pitorești peisaje din Ungaria și o zonă centrală a Parcului Național Kiskunság."},"river-csatorna-duna-tisza-extra":{"i":"/poi-images/river-csatorna-duna-tisza-extra.webp","s":"Canalul Dunăre-Tisa reprezintă un proiect de inginerie hidrotehnică ambițios, dar neterminat, din secolele XVIII-XIX, fiind astăzi o relicvă fascinantă a istoriei managementului apelor din Câmpia P..."},"river-harmas-koros-extra":{"i":"/poi-images/river-harmas-koros-extra.webp","s":"Râul Crișul Triplu (Hármas-Körös) este unul dintre cele mai caracteristice râuri ale Marii Câmpii Ungare."},"river-sebes-koros-extra":{"i":"/poi-images/river-sebes-koros-extra.webp","s":"Crișul Repede (în maghiară: Sebes-Körös) este un râu care simbolizează legătura strânsă dintre România și Ungaria."},"lake-biharugrai-tavak-extra":{"i":"/poi-images/lake-biharugrai-tavak-extra.webp","s":"Lacurile din Biharugra sunt un adevărat paradis pentru ornitologi și iubitorii de natură."},"forest-malyvadi-erdo-extra":{"i":"/poi-images/forest-malyvadi-erdo-extra.webp","s":"Una dintre cele mai mari zone forestiere compacte din Câmpia Ungară.","f":["Format în principal din stejari.","Vânat bogat."]},"river-kettos-koros-extra":{"i":"/poi-images/river-kettos-koros-extra.webp","s":"Râul Crișul Dublu (Kettős-Körös) este un râu important în comitatul Békés, format prin confluența Crișului Negru (Fekete-Körös) și Crișului Alb (Fehér-Körös) lângă orașul Gyula."},"mountain-istallos-ko-extra":{"i":"/poi-images/mountain-istallos-ko-extra.webp","s":"Unul dintre cele mai înalte vârfuri ale munților Bükk.","f":["Înălțime: 959 metri.","Faimos pentru peștera sa preistorică."]},"river-sajo-extra":{"i":"/poi-images/river-sajo-extra.webp","s":"Un râu important din nordul Ungariei, care se varsă în Tisa.","f":["Vine din Slovacia.","Istorie industrială importantă."]},"river-hernad-extra":{"i":"/poi-images/river-hernad-extra.webp","s":"Un râu sălbatic în nord-est, preferat de canotiști.","f":["Râu de frontieră pe anumite porțiuni.","Pereți de loess abrupți."]},"lake-lazberci-viztarozo-extra":{"i":"/poi-images/lake-lazberci-viztarozo-extra.webp","s":"Un lac de acumulare pitoresc în munții Bükk, zonă de protecție a apei potabile.","f":["Scăldatul este interzis.","Zonă de drumeție superbă."]},"river-bodrog-extra":{"i":"/poi-images/river-bodrog-extra.webp","s":"Un râu în regiunea viticolă Tokaj, cunoscut pentru curentul său lent.","f":["Se varsă în Tisa la Tokaj.","Ideal pentru canotiști începători."]},"lake-feher-to-szeged-extra":{"i":"/poi-images/lake-feher-to-szeged-extra.webp","s":"Cel mai mare lac alcalin din Ungaria, un paradis pentru ornitologi.","f":["Loc important de odihnă pentru cocori.","Parte a parcului național."]},"river-maros-torkolat-extra":{"i":"/poi-images/river-maros-torkolat-extra.webp","s":"Locul unde Mureșul se varsă în Tisa la Szeged.","f":["Zonă populară de excursie.","Păduri de luncă."]},"lake-csaj-to-extra":{"i":"/poi-images/lake-csaj-to-extra.webp","s":"Lacul Csaj, parte a Parcului Național Kiskunság, este o bijuterie ascunsă pentru iubitorii de natură și ornitologi."},"river-tisza-martely-extra":{"i":"/poi-images/river-tisza-martely-extra.webp","s":"Un braț mort pitoresc al Tisei, cu un trecut artistic bogat.","f":["Subiect preferat al pictorilor.","Rezervație naturală."]},"forest-pusztaszeri-erdo-extra":{"i":"/poi-images/forest-pusztaszeri-erdo-extra.webp","s":"Rezervația Peisagistică Pusztaszer, adesea numită Pădurea Pusztaszer, este un mozaic de habitate diverse care înconjoară Parcul Național Memorial Ópusztaszer."},"river-sarviz-extra":{"i":"/poi-images/river-sarviz-extra.webp","s":"Sárvíz este un râu cu importanță istorică și geografică în Transdanubia, al cărui nume, însemnând „apă mlăștinoasă”, descrie perfect natura sa de odinioară."},"river-gaja-patak-extra":{"i":"/poi-images/river-gaja-patak-extra.webp","s":"Pârâul Gaja este cel mai important curs de apă din partea estică a Munților Bakony, o adevărată arteră vitală pentru regiune."},"forest-alcsuti-arboretum-extra":{"i":"/poi-images/forest-alcsuti-arboretum-extra.webp","s":"Una dintre cele mai vechi grădini peisagistice din Ungaria, fondată de arhiducele Iosif.","f":["Faimos pentru sărbătoarea ghiocelului.","Deține o ruină de castel."]},"mountain-veres-hegy-extra":{"i":"/poi-images/mountain-veres-hegy-extra.webp","s":"Un vârf din munții Vértes cu o vedere frumoasă.","f":["Roci de dolomită.","Vegetație carstică tipică."]},"lake-pazmandi-to-extra":{"i":"/poi-images/lake-pazmandi-to-extra.webp","s":"Un lac mic și liniștit la poalele munților Velence.","f":["Loc preferat de pescari.","Situat lângă moara de apă."]},"forest-hansag-extra":{"i":"/poi-images/forest-hansag-extra.webp","s":"Hanság este un peisaj fascinant și unic în vestul Ungariei, parte a Parcului Național Fertő-Hanság."},"river-rabca-extra":{"i":"/poi-images/river-rabca-extra.webp","s":"Un râu care drenează Hanságul și se varsă în Dunărea de la Moson la Győr.","f":["Traversează terenuri agricole fertile.","Rol important în protecția împotriva inundațiilor."]},"river-marcal-extra":{"i":"/poi-images/river-marcal-extra.webp","s":"Un afluent de dreapta al râului Rába, care vine dinspre Bakony și Kemenesalja.","f":["Reabilitat după o catastrofă ecologică.","Curs lent."]},"river-repce-extra":{"i":"/poi-images/river-repce-extra.webp","s":"Un râu mic în vest, care continuă ulterior sub numele de Rábca.","f":["Definește regiunea Rábaköz.","Șerpuiește prin pajiști umede."]},"forest-szigetkoz-erdo-extra":{"i":"/poi-images/forest-szigetkoz-erdo-extra.webp","s":"Păduri de luncă unice în regiunea Szigetköz.","f":["Bogat în sălcii și plopi.","Loc ideal pentru excursii cu barca prin pădure."]},"river-berettyo-extra":{"i":"/poi-images/river-berettyo-extra.webp","s":"Râul Berettyó, care izvorăște în România sub numele de Barcău și curge liniștit prin Câmpia de Est a Ungariei, este o bijuterie naturală tăcută."},"lake-vekeri-to-extra":{"i":"/poi-images/lake-vekeri-to-extra.webp","s":"Lacul Vekeri, situat la sud de Debrecen, este una dintre cele mai populare destinații de recreere din regiune și un loc de întâlnire vibrant pentru familii, prieteni și iubitori de natură."},"forest-erdo-pusztak-extra":{"i":"/poi-images/forest-erdo-pusztak-extra.webp","s":"O centură de păduri și lacuri care înconjoară orașul Debrecen la est.","f":["Format din stejari și salcâmi.","Bogat în trasee de drumeție."]},"river-hortobagy-folyo-extra":{"i":"/poi-images/river-hortobagy-folyo-extra.webp","s":"Râul Hortobágy este linia vitală a parcului național cu același nume și modelează peisajul unic al pustei într-un mod subtil, dar decisiv."},"lake-fancsika-to-extra":{"i":"/poi-images/lake-fancsika-to-extra.webp","s":"Lacurile Fancsika, situate la est de Debrecen, reprezintă un refugiu liniștit pentru localnici și un pont excelent pentru vizitatorii care doresc să scape de agitația urbană."},"mountain-galyateto-extra":{"i":"/poi-images/mountain-galyateto-extra.webp","s":"Al doilea cel mai înalt vârf din Mátra, o celebră stațiune climaterică.","f":["Înălțime: 964 metri.","Deține un turn de observație renovat spectaculos."]},"mountain-sar-hegy-extra":{"i":"/poi-images/mountain-sar-hegy-extra.webp","s":"Muntele Sár-hegy (Muntele de Nămol), situat la poalele Munților Mátra, lângă Gyöngyös, este o rezervație naturală de importanță națională și un paradis pentru botaniști și entomologi."},"river-tarna-extra":{"i":"/poi-images/river-tarna-extra.webp","s":"Tarna este un râu blând care definește peisajul din partea de vest a județului Heves."},"river-eger-patak-extra":{"i":"/poi-images/river-eger-patak-extra.webp","s":"Un pârâu care traversează orașul baroc Eger.","f":["Traversează valea pitorească Eger.","Important pentru alimentarea cu apă a orașului."]},"forest-matrai-tazvedelmi-extra":{"i":"/poi-images/forest-matrai-tazvedelmi-extra.webp","s":"Pădurile Munților Mátra formează una dintre cele mai mari suprafețe forestiere continue din Ungaria și reprezintă inima uneia dintre cele mai populare zone de vacanță și drumeții din țară."},"river-zagyva-szolnok-extra":{"i":"/poi-images/river-zagyva-szolnok-extra.webp","s":"Un afluent important al Tisei, care se varsă la Szolnok.","f":["Cunoscut pentru locurile de pescuit.","Definește regiunea Jászság."]},"river-hortobagy-berettyo-extra":{"i":"/poi-images/river-hortobagy-berettyo-extra.webp","s":"Râul care conectează puszta Hortobágy cu Barcăul.","f":["Canal important de drenaj.","Bogat în stufărișuri."]},"lake-nagykunsagi-viztarozo-extra":{"i":"/poi-images/lake-nagykunsagi-viztarozo-extra.webp","s":"Un rezervor imens pentru asigurarea irigațiilor în Câmpia Ungară.","f":["Luciu de apă artificial.","Important pentru agricultură."]},"river-tisza-szajol-extra":{"i":"/poi-images/river-tisza-szajol-extra.webp","s":"O porțiune frumoasă a Tisei în apropiere de Szolnok.","f":["Punct important de trecere feroviară.","Peisaj de luncă frumos."]},"forest-tiszakurei-arboretum-extra":{"i":"/poi-images/forest-tiszakurei-arboretum-extra.webp","s":"Un parc frumos pe malul Tisei, cu specii de arbori rare.","f":["Fostă grădină a castelului.","Cipruși de mlaștină superbi."]},"lake-bokodi-to-extra":{"i":"/poi-images/lake-bokodi-to-extra.webp","s":"Faimos pentru \"satul plutitor\" format din căsuțe de pescari.","f":["Lac de răcire al unei centrale.","Apa nu îngheață niciodată."]},"river-altal-er-extra":{"i":"/poi-images/river-altal-er-extra.webp","s":"Un curs de apă important care traversează Tata și alimentează lacul Öreg.","f":["Definește peisajul urban din Tata.","Rol important în protecția naturii."]},"mountain-pilis-tető-extra":{"i":"/poi-images/mountain-pilis-tető-extra.webp","s":"Cel mai înalt punct al munților Pilis.","f":["Înălțime: 756 metri.","Deține un nou turn de observație."]},"forest-gerecse-erdo-extra":{"i":"/poi-images/forest-gerecse-erdo-extra.webp","s":"Păduri vaste în munții calcaroși Gerecse.","f":["Cunoscut pentru păsări de pradă rare.","Bogat în peșteri."]},"mountain-vertes-kozma-extra":{"i":"/poi-images/mountain-vertes-kozma-extra.webp","s":"Peisaj deluros în nordul munților Vértes.","f":["Caracterizat prin forme carstice.","Păduri de fag tipice."]},"river-ipoly-szakas-extra":{"i":"/poi-images/river-ipoly-szakas-extra.webp","s":"Un râu de frontieră între Ungaria și Slovacia, cu multe coturi.","f":["Stare foarte naturală.","Loc preferat pentru excursii cu caiacul."]},"mountain-medves-fennsik-extra":{"i":"/poi-images/mountain-medves-fennsik-extra.webp","s":"Cel mai mare podiș de bazalt din Europa Centrală la granița de stat.","f":["Origine vulcanică.","Caracterizat prin câmpii vaste înierbate."]},"river-galga-forras-extra":{"i":"/poi-images/river-galga-forras-extra.webp","s":"Un râu care izvorăște în Cserhát și definește regiunea Galgamente.","f":["Definește etnografia locală.","Curs de apă lent."]},"forest-cserhat-erdo-extra":{"i":"/poi-images/forest-cserhat-erdo-extra.webp","s":"Păduri liniștite printre dealurile Cserhát, departe de turismul de masă.","f":["Bogat în păduri de stejar.","Multe sate ascunse în apropiere."]},"mountain-szandavar-hegy-extra":{"i":"/poi-images/mountain-szandavar-hegy-extra.webp","s":"Un vârf distinctiv cu o ruină de cetate medievală în vârf.","f":["Con de andezit vulcanic.","Oferă o vedere de 360 de grade."]},"mountain-visegradi-hegyseg-extra":{"i":"/poi-images/mountain-visegradi-hegyseg-extra.webp","s":"Munți de origine vulcanică de-a lungul Cotului Dunării.","f":["Deține defilee spectaculoase.","Trasee de drumeție excelente."]},"mountain-dobogoko-extra":{"i":"/poi-images/mountain-dobogoko-extra.webp","s":"Un loc sacru și un punct de observație popular în Pilis.","f":["Cel mai înalt punct al munților Visegrád (700 m).","Leagănul drumețiilor maghiare."]},"forest-godolloi-arboretum-extra":{"i":"/poi-images/forest-godolloi-arboretum-extra.webp","s":"Un parc vast cu o colecție de conifere rare.","f":["Fondat în anul 1902.","Peste 150 de specii de arbori se găsesc aici."]},"lake-garancsi-to-extra":{"i":"/poi-images/lake-garancsi-to-extra.webp","s":"Un lac mic și idilic în bazinul Zsámbék.","f":["Cunoscut ca loc de filmare pentru filme maghiare.","Vegetație de mal frumoasă."]},"mountain-naszaly-extra":{"i":"/poi-images/mountain-naszaly-extra.webp","s":"Un munte calcaros distinctiv la nord de Vác, pe malul Dunării.","f":["Înălțime: 652 metri.","Conține numeroase peșteri."]},"river-kapos-extra":{"i":"/poi-images/river-kapos-extra.webp","s":"Un râu important din sudul Transdanubiei, care traversează și Kaposvár.","f":["Colectează apele dealurilor Somogy.","Se varsă în Sió."]},"lake-deseda-to-extra":{"i":"/poi-images/lake-deseda-to-extra.webp","s":"Lacul Deseda, situat la nord de Kaposvár, este cel mai lung lac artificial din Ungaria, cu o lungime de opt kilometri."},"forest-boronka-melleki-extra":{"i":"/poi-images/forest-boronka-melleki-extra.webp","s":"O zonă forestieră și umedă protejată în interiorul Somogy.","f":["Parte a rezervației biosferei UNESCO.","Loc de cuibărit important pentru vulturul codalb."]},"river-koppany-extra":{"i":"/poi-images/river-koppany-extra.webp","s":"Un râu mic care definește zona de frontieră între Somogy și Tolna.","f":["Se varsă în Kapos.","Traversează o vale pitorească."]},"lake-balatonszentgyorgy-extra":{"i":"/poi-images/lake-balatonszentgyorgy-extra.webp","s":"Balatonszentgyörgy este situat strategic la capătul de sud-vest al Lacului Balaton, acolo unde lacul se întâlnește cu vasta întindere de stuf a Micului Balaton (Kis-Balaton)."},"mountain-szekszardi-dombsag-extra":{"i":"/poi-images/mountain-szekszardi-dombsag-extra.webp","s":"Dealurile Szekszárd reprezintă una dintre cele mai istorice și pline de caracter regiuni viticole din Ungaria, întinzându-se lin în jurul orașului Szekszárd, în sudul țării."},"lake-pacsmagi-tavak-extra":{"i":"/poi-images/lake-pacsmagi-tavak-extra.webp","s":"Lacurile Pacsmag, un sistem de iazuri piscicole artificiale situate lângă Dombóvár, în județul Tolna, reprezintă un adevărat paradis pentru ornitologi și iubitorii de natură."},"forest-gemenci-erdo-extra":{"i":"/poi-images/forest-gemenci-erdo-extra.webp","s":"Pădurea Gemenc, situată la sud de Szekszárd, este cea mai mare zonă forestieră de luncă inundabilă din Ungaria și una dintre cele mai importante din întreaga Europă."},"river-kapos-torkolat-extra":{"i":"/poi-images/river-kapos-torkolat-extra.webp","s":"Vărsarea râului Kapos în canalul Sió, lângă Simontornya, este un punct semnificativ din punct de vedere geografic și ecologic în peisajul acvatic al Ungariei."},"mountain-tolnai-hegyhat-extra":{"i":"/poi-images/mountain-tolnai-hegyhat-extra.webp","s":"Creasta Tolna, în maghiară Tolnai-Hegyhát, formează coloana vertebrală lin ondulată a județului Tolna și oferă un peisaj de o frumusețe liniștită și discretă."},"river-raba-extra":{"i":"/poi-images/river-raba-extra.webp","s":"Cel mai sălbatic râu din vestul Ungariei, preferat de canotiști.","f":["Izvorăște în Austria.","Caracterizat prin multe vârtejuri periculoase."]},"mountain-koszegi-hegyseg-extra":{"i":"/poi-images/mountain-koszegi-hegyseg-extra.webp","s":"Munți la granița cu Austria, cunoscuți pentru climatul alpin.","f":["Cel mai înalt punct din Transdanubia (Írott-kő).","Bogat în izvoare."]},"forest-orsegi-erdo-extra":{"i":"/poi-images/forest-orsegi-erdo-extra.webp","s":"Pădurea Őrség, inima parcului național cu același nume, este un peisaj cultural fermecător și unic în extremitatea vestică a Ungariei, la granița cu Slovenia și Austria."},"river-gyongyos-patak-extra":{"i":"/poi-images/river-gyongyos-patak-extra.webp","s":"Pârâu care traversează și Kőszeg și Szombathely.","f":["Istoric a acționat mori.","Se varsă în Rába."]},"mountain-irott-ko-extra":{"i":"/poi-images/mountain-irott-ko-extra.webp","s":"Cel mai înalt punct din Transdanubia chiar pe frontieră.","f":["Înălțime: 884 metri.","Turnul de observație este divizat de graniță."]},"mountain-somlo-extra":{"i":"/poi-images/mountain-somlo-extra.webp","s":"Deal martor izolat, renumit pentru vinurile sale albe excelente.","f":["Deține o ruină de cetate.","Cea mai mică regiune viticolă din Ungaria."]},"mountain-szent-gyorgy-hegy-extra":{"i":"/poi-images/mountain-szent-gyorgy-hegy-extra.webp","s":"Faimos pentru coloanele sale uriașe de bazalt, \"orgile de bazalt\".","f":["Loc excelent de producție a vinului.","Deține o capelă construită în anii 1760."]},"lake-tapolca-tavasbarlang-extra":{"i":"/poi-images/lake-tapolca-tavasbarlang-extra.webp","s":"Un sistem unic de lacuri subterane, care poate fi explorat cu barca.","f":["Peșteră carstică.","Microclimat curativ."]},"river-cuha-patak-extra":{"i":"/poi-images/river-cuha-patak-extra.webp","s":"Un pârâu sălbatic în Bakony, cu o linie ferată spectaculoasă alături.","f":["Traversează numeroase vaduri.","De-a lungul unei linii ferate candidate UNESCO."]},"mountain-kab-hegy-extra":{"i":"/poi-images/mountain-kab-hegy-extra.webp","s":"Cel mai înalt punct din Bakony de Sud, cu un turn TV.","f":["Înălțime: 599 metri.","Origine vulcanică."]},"river-mura-extra":{"i":"/poi-images/river-mura-extra.webp","s":"Un râu de frontieră între Ungaria și Croația, cu natură virgină.","f":["Se varsă în Dráva.","În trecut se spăla aur aici."]},"river-zala-folyo-extra":{"i":"/poi-images/river-zala-folyo-extra.webp","s":"Râul Zala, situat în vestul Ungariei, joacă un rol ecologic vital pentru Lacul Balaton."},"river-kerka-extra":{"i":"/poi-images/river-kerka-extra.webp","s":"Kerka este un râu blând și pitoresc care izvorăște din zona de frontieră slovenă și curge prin regiunile maghiare Őrség și Göcsej înainte de a se vărsa în Mura."},"forest-gocseji-erdo-extra":{"i":"/poi-images/forest-gocseji-erdo-extra.webp","s":"Göcsej nu este o singură localitate, ci un peisaj etnografic unic în județul Zala din vestul Ungariei."},"lake-zalacsanyi-to-extra":{"i":"/poi-images/lake-zalacsanyi-to-extra.webp","s":"Lacul Zalacsány (Zalacsányi-tó), amplasat în peisajul deluros și blând din Zala, este o oază de liniște și un paradis pentru pescari."},"historical-aquincum-museum-extra":{"i":"/poi-images/historical-aquincum-museum-extra.webp","s":"Muzeul Aquincum din Óbuda este un parc arheologic extins care readuce la viață viața civilă din capitala provinciei romane Pannonia Inferior."},"historical-vasarcsarnok-extra":{"i":"/poi-images/historical-vasarcsarnok-extra.webp","s":"Hala Centrală a Pieței, sau Nagy Vásárcsarnok, situată la capătul din Pesta al Podului Libertății, este cea mai mare și cea mai faimoasă piață interioară din Budapesta."},"historical-operahaz-extra":{"i":"/poi-images/historical-operahaz-extra.webp","s":"Opera de Stat Maghiară, situată pe magnificul Bulevard Andrássy, este una dintre bijuteriile arhitecturale ale Budapestei și o casă de operă de prim rang în Europa."},"animal-habitat-allatkert-bp-extra":{"i":"/poi-images/animal-habitat-allatkert-bp-extra.webp","s":"Grădina Zoologică și Botanică din Budapesta, situată în inima Parcului Városliget, este una dintre cele mai vechi instituții de acest fel din lume, deschisă în 1866."},"port-csepel-kikoto-extra":{"i":"/poi-images/port-csepel-kikoto-extra.webp","s":"Portul Liber Csepel, cunoscut oficial ca Portul Liber și Centrul Logistic Budapesta (BFHL), este cel mai mare și mai important port interior al Ungariei."},"historical-siklosi-var-extra":{"i":"/poi-images/historical-siklosi-var-extra.webp","s":"Castelul Siklós este una dintre cele mai bine conservate și impresionante fortărețe medievale din Ungaria."},"historical-mohacsi-emlekhely-extra":{"i":"/poi-images/historical-mohacsi-emlekhely-extra.webp","s":"Parc memorial dedicat bătăliei din 1526, care a decis soarta Ungariei pentru secole.","f":["Peste 1700 de statui din lemn.","Locul înfrângerii tragice."]},"historical-pecsi-szekesegyhaz-extra":{"i":"/poi-images/historical-pecsi-szekesegyhaz-extra.webp","s":"Bazilica Sf.","f":["Fundații romanice.","Fresce superbe în interior."]},"animal-habitat-pecsi-allatkert-extra":{"i":"/poi-images/animal-habitat-pecsi-allatkert-extra.webp","s":"O grădină zoologică pitorească pe versantul munților Mecsek, cu un acvariu mare.","f":["Fondată în 1960.","O priveliște minunată asupra orașului."]},"historical-kalocsai-szekesegyhaz-extra":{"i":"/poi-images/historical-kalocsai-szekesegyhaz-extra.webp","s":"O clădire barocă impunătoare, sediul uneia dintre cele mai vechi arhiepiscopii din Ungaria.","f":["Orgă celebră.","Palatul Arhiepiscopal se află alături."]},"historical-kecskemeti-varoshaza-extra":{"i":"/poi-images/historical-kecskemeti-varoshaza-extra.webp","s":"Un exemplu remarcabil al secesiunii maghiare, proiectat de Ödön Lechner.","f":["Joc de clopote la prânz.","Fațadă decorată cu ceramică Zsolnay."]},"historical-kecskemeti-nagytemplom-extra":{"i":"/poi-images/historical-kecskemeti-nagytemplom-extra.webp","s":"Cea mai mare biserică barocă târzie din Câmpia Maghiară, dedicată Sfântului Nicolae.","f":["Turn de 73 de metri înălțime.","Construită în secolul al XVIII-lea."]},"animal-habitat-kecskemeti-vadaskert-extra":{"i":"/poi-images/animal-habitat-kecskemeti-vadaskert-extra.webp","s":"O grădină zoologică primitoare, care se concentrează pe fauna locală și proiecte de salvare.","f":["Ideal pentru familii.","Rase de animale domestice maghiare."]},"industry-mercedes-kecskemet-extra":{"i":"/poi-images/industry-mercedes-kecskemet-extra.webp","s":"Una dintre cele mai moderne fabrici auto din Europa, unde se produc mașini compacte premium.","f":["Deschisă în 2012.","Mii de angajați."]},"historical-gyulai-var-extra":{"i":"/poi-images/historical-gyulai-var-extra.webp","s":"Singura cetate gotică din cărămidă rămasă intactă în Bazinul Carpatic.","f":["Vechime de peste 600 de ani.","Teatru de vară în curte."]},"historical-szarvasi-szarazmalom-extra":{"i":"/poi-images/historical-szarvasi-szarazmalom-extra.webp","s":"Moara uscată din Szarvas este un monument industrial remarcabil și o fereastră către trecutul agricol al Marii Câmpii Ungare."},"historical-gyulai-almasy-kastely-extra":{"i":"/poi-images/historical-gyulai-almasy-kastely-extra.webp","s":"Un castel baroc superb cu o expoziție interactivă despre viața nobiliară.","f":["Renovat recent.","Lângă Băile Cetății."]},"animal-habitat-korosvolgyi-allatpark-extra":{"i":"/poi-images/animal-habitat-korosvolgyi-allatpark-extra.webp","s":"Un parc de animale în Szarvas care prezintă fauna originală a Bazinului Carpatic.","f":["Zimbri și lupi.","Cadru natural superb."]},"industry-csabai-kolbaszgyar-extra":{"i":"/poi-images/industry-csabai-kolbaszgyar-extra.webp","s":"Fabrica de cârnați din Békéscsaba nu este o singură clădire, ci inima vibrantă a unei tradiții culinare care a făcut orașul faimos în întreaga lume."},"historical-boldogkoi-var-extra":{"i":"/poi-images/historical-boldogkoi-var-extra.webp","s":"Castelul Boldogkő tronează maiestuos pe o creastă stâncoasă abruptă a Munților Zemplén, oferind una dintre cele mai spectaculoase priveliști din nordul Ungariei."},"historical-fuzeri-var-extra":{"i":"/poi-images/historical-fuzeri-var-extra.webp","s":"Castelul Füzér este unul dintre cele mai vechi și mai dramatice castele din Ungaria."},"historical-diosgyori-var-extra":{"i":"/poi-images/historical-diosgyori-var-extra.webp","s":"Castelul Diósgyőr, situat la marginea orașului Miskolc, este una dintre cele mai frumos restaurate cetăți medievale din Ungaria."},"animal-habitat-miskolci-allatkert-e comitatul Mezőkovácsháza District","cca. 5.251 loc."]},"totkomlos-extra":{"i":"/poi-images/totkomlos-extra.webp","s":"Tótkomlós este o localitate maghiară din comitatul Orosháza District, cu aproximativ 5.146 de locuitori.","f":["comitatul Orosháza District","cca. 5.146 loc."]},"kaba-extra":{"i":"/poi-images/kaba-extra.webp","s":"Kaba este o localitate maghiară din comitatul Püspökladány District, cu aproximativ 5.144 de locuitori.","f":["comitatul Püspökladány District","cca. 5.144 loc."]},"tat-extra":{"i":"/poi-images/tat-extra.webp","s":"Tát este o localitate maghiară din comitatul Esztergom District, cu aproximativ 5.116 de locuitori.","f":["comitatul Esztergom District","cca. 5.116 loc."]},"monorierdoe-extra":{"i":"/poi-images/monorierdoe-extra.webp","s":"Monorierdő este o localitate maghiară din comitatul Monor, cu aproximativ 5.107 de locuitori.","f":["comitatul Monor","cca. 5.107 loc."]},"helvecia-extra":{"i":"/poi-images/helvecia-extra.webp","s":"Helvécia este o localitate maghiară din comitatul Kecskemét District, cu aproximativ 5.070 de locuitori.","f":["comitatul Kecskemét District","cca. 5.070 loc."]},"nyekladhaza-extra":{"i":"/poi-images/nyekladhaza-extra.webp","s":"Nyékládháza este o localitate maghiară din comitatul Miskolc District, cu aproximativ 5.009 de locuitori.","f":["comitatul Miskolc District","cca. 5.009 loc."]},"abaliget":{"i":"/poi-images/abaliget.webp","s":"Abaliget este o localitate pitorească situată în județul Baranya, la poalele nordice ale Munților Mecsek, fiind renumită în special pentru peștera sa cu stalactite și climatul său curativ.","f":["Peștera Abaliget a fost declarată peșteră curativă în anul 1960.","Temperatura medie în interiorul peșterii este de aproximativ 12 grade Celsius tot anul."]},"aszofo":{"i":"/poi-images/aszofo.webp","s":"Aszófő este o localitate pitorească situată pe malul nordic al lacului Balaton, considerată poarta de intrare către peninsula Tihany.","f":["Poziție: Poarta peninsulei Tihany","Specialitate: Vinuri albe (Olaszrizling)"]},"badacsonytomaj":{"i":"/poi-images/badacsonytomaj.webp","s":"Badacsonytomaj este centrul vital al regiunii viticole Badacsony, situat la poalele celui mai spectaculos munte vulcanic de pe malul nordic al lacului Balaton.","f":["Arhitectură: Singura biserică de bazalt din Europa","Munte: Badacsony (438 m altitudine)"]},"bakonybel":{"i":"/poi-images/bakonybel.webp","s":"Bakonybél este o bijuterie ascunsă în inima munților Bakony, fiind unul dintre cele mai importante centre spirituale și turistice din vestul Ungariei.","f":["Anul fondării: 1018","Monument: Abația Benedictină Sf. Mauriciu"]},"bakonynana":{"i":"/poi-images/bakonynana.webp","s":"Bakonynána este un sat pitoresc din regiunea de est a munților Bakony, renumit pentru fenomenele sale geologice spectaculoase.","f":["Atracție: Cascada Római-fürdő","Geologie: Coloane de bazalt hexagonale"]},"bakonyszentlaszlo":{"i":"/poi-images/bakonyszentlaszlo.webp","s":"Bakonyszentlászló este poarta de intrare către spectaculoasa vale Cuha, fiind una dintre cele mai importante localități turistice din munții Bakony.","f":["Punct de interes: Valea pârâului Cuha","Inginerie: Calea ferată istorică cu tuneluri"]},"balatonakali":{"i":"/poi-images/balatonakali.webp","s":"Balatonakali este o așezare pitorească situată pe malul nordic al lacului Balaton, renumită pentru tradițiile sale viticole profunde și pentru peisajul cultural conservat cu grijă.","f":["Menționat pentru prima dată în documente în anul 1243.","Satul deține numeroase case de presat struguri monument istoric."]},"balatonederics":{"i":"/poi-images/balatonederics.webp","s":"Balatonederics este o comună situată la limita vestică a malului nordic al lacului Balaton, la poalele munților Keszthely.","f":["Peștera Csodabogyós are o lungime explorată de peste 6 km.","Muzeul Africa include un mic parc zoologic cu specii africane."]},"balatonfenyves":{"i":"/poi-images/balatonfenyves.webp","s":"Balatonfenyves este una dintre cele mai apreciate stațiuni de pe malul sudic al lacului Balaton, fiind cunoscută pentru atmosfera sa liniștită și spațiile verzi generoase care se întind de-a lungul...","f":["A devenit comună independentă în anul 1958.","Ecartamentul căii ferate înguste este de 760 mm."]},"balf":{"i":"/poi-images/balf.webp","s":"Balf este un cartier istoric al orașului Sopron, situat pe malul vestic al lacului Fertő, celebru încă din epoca romană pentru izvoarele sale minerale curative.","f":["Apa minerală de Balf are un miros specific din cauza sulfului.","Biserica Sf. Wolfgang este înconjurată de un zid de apărare medieval."]},"battonya":{"i":"/poi-images/battonya.webp","s":"Battonya este un oraș situat în extremitatea sud-estică a Ungariei, în județul Békés, fiind recunoscut ca un model de conviețuire multietnică și multiconfesională la granița cu România.","f":["Battonya găzduiește o importantă comunitate istorică de români din Ungaria.","Orașul are patru biserici monumentale aparținând unor confesiuni diferite."]},"berekfurdo":{"i":"/poi-images/berekfurdo.webp","s":"Berekfürdő este o oază de liniște și sănătate situată în inima Marii Câmpii Ungare, fiind supranumită pe bună dreptate „Marea de lângă Hortobágy”.","f":["Compoziția apei: Apa termală cu iod și brom","Anul descoperirii: 1928, de Ferenc Pávai-Vajna"]},"bogacs":{"i":"/poi-images/bogacs.webp","s":"Bogács este o stațiune balneară de renume situată în regiunea Bükkalja, la poalele sudice ale Munților Bükk din nordul Ungariei.","f":["Apa termală din Bogács are un conținut ridicat de sulf și iese la suprafață la 76°C.","Pivnițele de vin sunt săpate într-o rocă vulcanică moale numită tuf de riolit."]},"boldva":{"i":"/poi-images/boldva.webp","s":"Boldva este o localitate de o importanță istorică și culturală excepțională în Ungaria, situată în valea râului Bódva, în județul Borsod-Abaúj-Zemplén.","f":["Boldva este locul unde a fost scris primul text coerent în limba maghiară (aprox. 1192).","Biserica reformată păstrează fundațiile și zidurile abației benedictine din secolul XII."]},"buzsak":{"i":"/poi-images/buzsak.webp","s":"Buzsák este un sat pitoresc din județul Somogy, situat la sud de lacul Balaton, renumit la nivel național pentru conservarea excepțională a artei populare și a tradițiilor secuiești și dalmate.","f":["Satul este celebru pentru cele trei stiluri de broderie locală.","Capela Albă de pe dealul viilor datează din anul 1733."]},"cak":{"i":"/poi-images/cak.webp","s":"Cák este o mică așezare situată la poalele Munților Kőszeg, în județul Vas, renumită pentru arhitectura sa populară autentică și peisajele naturale pitorești.","f":["Altitudine: 260 m","Monumente: 8 pivnițe cu acoperiș de paie"]},"csempeszkopacs":{"i":"/poi-images/csempeszkopacs.webp","s":"Csempeszkopács este un mic sat idilic din județul Vas, renumit pentru găzduirea unuia dintre cele mai bine conservate monumente romanice din vestul Ungariei.","f":["Biserica Sfântul Mihail datează din jurul anului 1250.","Construcția este realizată din cărămidă nearsă, specifică zonei."]},"cserkeszolo":{"i":"/poi-images/cserkeszolo.webp","s":"Cserkeszőlő este o stațiune balneară modernă situată în regiunea Tiszazug, între râurile Tisa și Criș.","f":["Temperatura apei: 82 grade Celsius la sursă","Adâncimea forajului: 2300 metri"]},"csopak":{"i":"/poi-images/csopak.webp","s":"Csopak este o localitate de prestigiu situată pe malul nordic al lacului Balaton, fiind inima regiunii viticole Balatonfüred-Csopak.","f":["Centrul regiunii viticole Balatonfüred-Csopak.","Solul este format din gresie roșie permiară rară."]},"decs":{"i":"/poi-images/decs.webp","s":"Decs este „capitala” regiunii Sárköz din județul Tolna, fiind recunoscută ca unul dintre cele mai importante centre ale artei populare maghiare.","f":["Capitala neoficială a regiunii etnografice Sárköz.","Arta populară din Sárköz este inclusă în patrimoniul UNESCO."]},"demjen":{"i":"/poi-images/demjen.webp","s":"Demjén este o destinație balneară modernă situată în nordul Ungariei, în apropiere de orașul Eger, județul Heves.","f":["Complexul Cascade este inspirat de lumea din filmul Avatar.","Apa termală de aici este recomandată pentru afecțiuni reumatice și osteoporoză."]},"domos":{"i":"/poi-images/domos.webp","s":"Dömös este o localitate idilică situată pe malul drept al Cotului Dunării, la poalele munților Visegrád, fiind considerată una dintre cele mai spectaculoase porți de intrare în inima naturii maghiare.","f":["Defileul Rám este parcurs anual de peste 60.000 de turiști.","Cripta romanică are coloane cu capiteluri sculptate originale."]},"dregelypalank":{"i":"/poi-images/dregelypalank.webp","s":"Drégelypalánk este o localitate de o importanță istorică crucială situată în județul Nógrád, în apropierea graniței cu Slovacia, pe valea râului Ipoly.","f":["Cetatea a fost construită inițial de arhiepiscopul de Esztergom.","Numele 'Palánk' provine de la fortificațiile de lemn turcești."]},"egerszalok":{"i":"/poi-images/egerszalok.webp","s":"Egerszalók este un sat pitoresc situat în județul Heves, la poalele munților Bükk, fiind renumit pe plan internațional pentru fenomenul său geologic spectaculos: Colina de Sare.","f":["Temperatura apei termale: 65-68 grade Celsius","Suprafața colinei de sare: 1200 metri pătrați"]},"feldebro":{"i":"/poi-images/feldebro.webp","s":"Feldebrő este un sat liniștit situat în valea râului Tarna, fiind o destinație de o importanță istorică și religioasă remarcabilă pentru Ungaria.","f":["Vârsta bisericii inferioare: secolul al XI-lea","Structura criptei: divizată în 5 nave"]},"fertoboz":{"i":"/poi-images/fertoboz.webp","s":"Fertőboz este o mică localitate pitorească situată pe malul sudic al lacului Fertő, făcând parte din peisajul cultural protejat de UNESCO.","f":["Gloriette a fost construită în stil neoclasic cu o cupolă distinctivă.","Calea ferată cu ecartament îngust a fost inaugurată în 1970 ca muzeu."]},"fertorakos":{"i":"/poi-images/fertorakos.webp","s":"Fertőrákos este o localitate de o importanță istorică și culturală excepțională, situată la granița cu Austria, pe malul lacului Fertő.","f":["Cariera de piatră a fost folosită la construcția Operei din Viena.","Teatrul în peșteră găzduiește festivaluri de operă și operetă vara."]},"fuzer":{"i":"/poi-images/fuzer.webp","s":"Füzér este unul dintre cele mai pitorești sate din Ungaria, situat în inima Munților Zemplén, chiar la granița cu Slovacia.","f":["Cetatea Füzér este construită pe un con vulcanic de riolit la 552 metri altitudine.","Sfânta Coroană a fost ascunsă aici după bătălia de la Mohács din 1526."]},"hegymagas":{"i":"/poi-images/hegymagas.webp","s":"Hegymagas este un sat mic și idilic situat în bazinul Káli, la poalele sud-vestice ale muntelui Szent György.","f":["Satul se află la poalele muntelui Szent György (415 m).","Orgiile de bazalt s-au format acum aproximativ 3-4 milioane de ani."]},"igal":{"i":"/poi-images/igal.webp","s":"Igal este o mică localitate balneară situată în inima județului Somogy, fiind una dintre cele mai importante destinații de turism curativ din sud-vestul Ungariei.","f":["Apa termală are o temperatură de 81 °C la izvor.","Igal a primit statutul de oraș în anul 2010."]},"ipolytarnoc":{"i":"/poi-images/ipolytarnoc.webp","s":"Ipolytarnóc este un mic sat din județul Nógrád, situat la granița de nord a Ungariei, renumit la nivel global sub numele de 'Pompeii maghiar'.","f":["Situl face parte din Rețeaua Globală de Geoparcuri UNESCO.","Trunchiul de conifer pietrificat are un diametru de peste 2 metri."]},"jak":{"i":"/poi-images/jak.webp","s":"Ják este o localitate emblematică din vestul Ungariei, faimoasă pentru biserica sa abațială, considerată cea mai frumoasă realizare a stilului romanic din țară.","f":["Sfințire: anul 1256","Stil arhitectural: Romanic târziu"]},"josvafo":{"i":"/poi-images/josvafo.webp","s":"Jósvafő este o localitate de un pitoresc aparte, situată în inima Parcului Național Aggtelek din nordul Ungariei, o zonă inclusă în patrimoniul mondial UNESCO.","f":["Jósvafő este sediul administrativ al Parcului Național Aggtelek.","Peștera Baradla are o lungime totală de peste 25 de kilometri, trecând și în Slovacia."]},"kapolcs":{"i":"/poi-images/kapolcs.webp","s":"Kapolcs este un sat cultural vibrant situat în valea pârâului Eger, la granița dintre munții Bakony și regiunea muntoasă Balaton.","f":["Gazda principală a festivalului Valea Artelor începând cu 1989.","Pârâul Eger a alimentat istoric o rețea densă de mori de apă."]},"kazar":{"i":"/poi-images/kazar.webp","s":"Kazár este o bijuterie ascunsă a județului Nógrád, situată într-o vale liniștită a munților Cserhát, fiind un centru vital al culturii populare Palóc.","f":["Formațiunile de tuf riolitic sunt de culoare albă strălucitoare.","Satul are o casă memorială dedicată portului popular Palóc."]},"kehidakustany":{"i":"/poi-images/kehidakustany.webp","s":"Kehidakustány este o stațiune balneară și un centru istoric important situat în valea râului Zala, formată prin unirea a două sate străvechi.","f":["Apa termală din Kehida este certificată ca apă medicinală din anul 1988.","Conacul Deák a fost construit de familia Hertelendy în stil baroc."]},"koveskal":{"i":"/poi-images/koveskal.webp","s":"Köveskál este inima gastronomică și culturală a bazinului Káli, o zonă supranumită adesea 'Toscana maghiară' datorită dealurilor sale line și a peisajului viticol spectaculos.","f":["Sat sub protecție monumentală cu arhitectură nobiliară rurală.","Situat în centrul geologic al bazinului Káli."]},"lasztonya":{"i":"/poi-images/lasztonya.webp","s":"Lasztonya este o localitate mică situată în inima dealurilor Zala, reprezentând un refugiu ideal pentru cei care caută liniștea absolută și comuniunea cu natura.","f":["Lasztonya este una dintre cele mai mici localități din Ungaria după populație.","Rezervația forestieră Zalaerdődi Tölgyes protejează stejarii pedunculați seculari."]},"lebeny":{"i":"/poi-images/lebeny.webp","s":"Lébény este o localitate de o valoare istorică inestimabilă situată în vestul Ungariei, faimoasă pentru biserica sa abațială Sfântul Iacob.","f":["Biserica din Lébény a supraviețuit invaziei mongole din 1241.","Portalul nordic prezintă motive vegetale și geometrice complexe."]},"lovasbereny":{"i":"/poi-images/lovasbereny.webp","s":"Lovasberény este o localitate istorică situată în județul Fejér, la poalele Munților Velence, cunoscută în special pentru moștenirea sa aristocratică.","f":["Castelul Cziráky are o fațadă cu opt coloane în stil doric.","Cimitirul evreiesc este declarat monument istoric protejat."]},"mad":{"i":"/poi-images/mad.webp","s":"Mád este una dintre cele mai importante și rafinate localități din regiunea viticolă Tokaj, inclusă în patrimoniul mondial UNESCO.","f":["Sinagoga din Mád a fost construită în 1795 de comunitatea locală de negustori de vinuri.","Regiunea este renumită pentru solul format din tuf vulcanic și zeolit."]},"magyarpolany":{"i":"/poi-images/magyarpolany.webp","s":"Magyarpolány este un sat de o frumusețe rară situat pe pantele sud-vestice ale munților Bakony, deținător al prestigiosului premiu Europa Nostra pentru conservarea patrimoniului arhitectural.","f":["Premiat cu Europa Nostra în 1993 pentru conservare.","Strada Petőfi conține aproape 100 de case monument istoric."]},"matrafured":{"i":"/poi-images/matrafured.webp","s":"Mátrafüred este o stațiune balneară încântătoare situată pe versantul sudic al munților Mátra, administrativ făcând parte din orașul Gyöngyös.","f":["Altitudine medie: 350-400 metri","Transport special: Calea ferată forestieră Mátra"]},"matrahaza":{"i":"/poi-images/matrahaza.webp","s":"Mátraháza este o stațiune climaterică de înaltă altitudine situată în inima munților Mátra, la aproximativ 715 metri deasupra nivelului mării.","f":["Altitudinea stațiunii: 715 metri","Clădire simbolică: Grand Hotel Mátra (1930)"]},"matraszentimre":{"i":"/poi-images/matraszentimre.webp","s":"Mátraszentimre este localitatea situată la cea mai mare altitudine din Ungaria, centrul satului aflându-se la aproximativ 810 metri deasupra mării în partea de vest a munților Mátra.","f":["Altitudinea centrului satului: 810 metri","Înălțimea vârfului Galyatető: 964 metri"]},"matraverebely":{"i":"/poi-images/matraverebely.webp","s":"Mátraverebély este o așezare istorică situată la poalele munților Mátra, în județul Nógrád, fiind unul dintre cele mai importante centre de pelerinaj din Europa Centrală.","f":["Bazilica de la Szentkút a primit rangul de 'Basilica Minor' în 1970.","Chiliile rupestre au fost locuite de călugări până în secolul al XVIII-lea."]},"nagyborzsony":{"i":"/poi-images/nagyborzsony.webp","s":"Nagybörzsöny este un sat pitoresc situat la poalele vestice ale munților Börzsöny, în județul Pest, fiind considerat unul dintre cele mai bine conservate situri istorice rurale din Ungaria.","f":["Biserica Sfântul Ștefan păstrează fresce fragmentare din secolul al XIV-lea.","Satul se află într-o zonă montană la granița județului Pest."]},"nagycenk":{"i":"/poi-images/nagycenk.webp","s":"Nagycenk este o localitate de o importanță simbolică majoră pentru națiunea maghiară, fiind reședința contelui István Széchenyi, supranumit 'cel mai mare maghiar'.","f":["Castelul a fost reconstruit în stil neoclasic în anii 1830.","Aleea de tei este considerată una dintre cele mai frumoase din Europa."]},"nagyvazsony":{"i":"/poi-images/nagyvazsony.webp","s":"Nagyvázsony este o așezare istorică de o importanță majoră situată la intersecția Munților Bakony cu regiunea muntoasă Balaton.","f":["Turnul castelului are o înălțime de 28 de metri și ziduri foarte groase.","Pál Kinizsi a primit domeniul în dar de la regele Matia în 1472."]},"ocs":{"i":"/poi-images/ocs.webp","s":"Öcs este o așezare mică și liniștită situată la granița dintre Munții Bakony și regiunea deluroasă a Balatonului, în județul Veszprém.","f":["Localitatea este situată la o altitudine de aproximativ 280 de metri.","Lacul Öcsi este una dintre puținele mlaștini de turbă din regiune."]},"orfu":{"i":"/poi-images/orfu.webp","s":"Orfű este un sat de vacanță emblematic situat în inima Munților Mecsek, în apropiere de orașul Pécs, fiind una dintre cele mai populare destinații de agrement din sudul Ungariei.","f":["Sistemul de lacuri Orfű cuprinde o suprafață totală de apă de peste 100 de hectare.","Muzeul Morilor include o moară de apă funcțională și o moară antrenată de cai."]},"paloznak":{"i":"/poi-images/paloznak.webp","s":"Paloznak este unul dintre cele mai fermecătoare și bine conservate sate de pe malul nordic al lacului Balaton, situat la poalele sudice ale munților Bakony.","f":["Câștigător al premiului european pentru reînnoire rurală.","Biserica locală datează din secolul al XI-lea (epoca Árpád)."]},"pankasz":{"i":"/poi-images/pankasz.webp","s":"Pankasz este un sat tradițional situat în inima regiunii Őrség, cunoscut pentru conservarea admirabilă a patrimoniului său cultural și arhitectural.","f":["Anul construcției clopotniței: 1755","Materiale: Lemn de stejar, paie de secară"]},"paradsasvar":{"i":"/poi-images/paradsasvar.webp","s":"Parádsasvár este o localitate de o eleganță aristocratică rară, situată în valea nordică a munților Mátra.","f":["Arhitectul castelului: Miklós Ybl","Edificiu central: Castelul Károlyi (Hotel)"]},"pilisszentkereszt":{"i":"/poi-images/pilisszentkereszt.webp","s":"Pilisszentkereszt este o localitate montană pitorească situată în județul Pest, în inima munților Pilis, renumită pentru atmosfera sa liniștită și peisajele naturale de excepție.","f":["Dobogókő oferă vizibilitate până la munții Tatra în zilele senine.","Mănăstirea cisterciană a fost distrusă în timpul invaziei mongole din 1241."]},"poroszlo":{"i":"/poi-images/poroszlo.webp","s":"Poroszló este o localitate pitorească situată pe malul drept al Lacului Tisa, în județul Heves, reprezentând un punct strategic pentru explorarea biodiversității din estul Ungariei.","f":["Ecocentrul a fost inaugurat în aprilie 2012.","Localitatea este situată la 120 km de Budapesta."]},"regec":{"i":"/poi-images/regec.webp","s":"Regéc este un sat mic, dar plin de istorie, situat în inima Munților Zemplén din nord-estul Ungariei.","f":["Cetatea Regéc a fost construită în jurul anului 1300, pe un vârf vulcanic.","Francisc al II-lea Rákóczi a fost crescut aici de mama sa, Ilona Zrínyi."]},"revfulop":{"i":"/poi-images/revfulop.webp","s":"Révfülöp este o stațiune istorică și un important nod de transport situat pe malul nordic al lacului Balaton.","f":["Punct de plecare pentru traversarea înot a lacului Balaton.","Portul oferă curse regulate de feribot spre Balatonboglár."]},"rudabanya":{"i":"/poi-images/rudabanya.webp","s":"Rudabánya este un oraș din nordul Ungariei, celebru la nivel mondial pentru importanța sa geologică și paleontologică excepțională.","f":["Lacul Rudabánya are o lungime de 300 de metri și o lățime medie de 80 de metri.","Fosila Rudapithecus este considerată una dintre cele mai complete din lume."]},"salfold":{"i":"/poi-images/salfold.webp","s":"Salföld este o localitate pitorească situată în bazinul Káli din regiunea Transdanubia, fiind renumită pentru conservarea patrimoniului arhitectural rural maghiar.","f":["Prima mențiune documentară a satului datează din anul 1307 sub numele Salsfölde.","Altitudinea medie a localității este de aproximativ 155 de metri deasupra mării."]},"sarrod":{"i":"/poi-images/sarrod.webp","s":"Sarród este o localitate pitorească situată pe malul estic al lacului Fertő, fiind considerată 'poarta către regiunea Hanság'.","f":["Clădirea Kócsagvár are o formă ce imită aripile unei păsări.","Lacul Fertő este al patrulea ca mărime din Europa Centrală."]},"somlovasarhely":{"i":"/poi-images/somlovasarhely.webp","s":"Somlóvásárhely este o așezare istorică situată la baza muntelui Somló, cel mai mic district viticol din Ungaria, renumit pentru solul său bazaltic și vinurile albe vulcanice.","f":["Muntele Somló are o înălțime de 432 de metri și este un vulcan stins.","Prima atestare documentară a localității a avut loc în anul 1011."]},"szalafo":{"i":"/poi-images/szalafo.webp","s":"Szalafő este considerat cel mai arhaic și autentic sat din regiunea Őrség, situat la granița triplă dintre Ungaria, Slovenia și Austria.","f":["Structură: 7 cătune (szerek)","Monument: Muzeul în aer liber Pityerszer"]},"szentbekkalla":{"i":"/poi-images/szentbekkalla.webp","s":"Szentbékkálla este un sat idilic situat în inima bazinului Káli, renumit pentru fenomenele sale geologice unice și arhitectura rurală tradițională.","f":["Marea de Piatră este protejată ca monument natural național.","Localitatea a fost menționată documentar pentru prima dată în secolul al XIII-lea."]},"szilvasvarad":{"i":"/poi-images/szilvasvarad.webp","s":"Szilvásvárad este o destinație turistică legendară situată la poarta de vest a Parcului Național Bükk, fiind renumită pentru frumusețea naturală a Văii Szalajka și pentru herghelia sa de cai lipițani.","f":["Herghelia Lipițan: Centru național din 1952","Tren forestier: Traseu de 4,5 km în vale"]},"tarcal":{"i":"/poi-images/tarcal.webp","s":"Tarcal este o localitate emblematică din regiunea viticolă Tokaj-Hegyalja, situată în județul Borsod-Abaúj-Zemplén, la poalele sudice ale muntelui Tokaj.","f":["Statuia lui Isus Binecuvântătorul este cea mai mare de acest tip din Ungaria.","Conacul Andrássy a fost construit inițial în stil baroc rural."]},"tarnaszentmaria":{"i":"/poi-images/tarnaszentmaria.webp","s":"Tarnaszentmária este un sat mic și liniștit din județul Heves, situat în pitoreasca vale a râului Tarna, dar care ascunde o comoară arhitecturală de o valoare inestimabilă.","f":["Record: Cea mai mică biserică medievală din țară","Vechime: Secolul X-XI (peste 1000 de ani)"]},"tolcsva":{"i":"/poi-images/tolcsva.webp","s":"Tolcsva este un sat pitoresc din regiunea Tokaj-Hegyalja, renumit pentru concentrația sa neobișnuită de palate și conace nobiliare.","f":["Tolcsva are cea mai mare densitate de conace pe cap de locuitor din regiune.","Castelul Waldbott a aparținut unei familii de bancheri celebre."]},"vacratot":{"i":"/poi-images/vacratot.webp","s":"Vácrátót este o localitate încântătoare situată în județul Pest, la nord de Budapesta, fiind celebră pe plan internațional pentru găzduirea Grădinii Botanice Naționale a Ungariei.","f":["Grădina dispune de sere tropicale cu nuferi uriași (Victoria amazonica).","Colecția de arțari este una dintre cele mai variate din Europa."]},"velem":{"i":"/poi-images/velem.webp","s":"Velem este un sat montan încântător situat în Munții Kőszeg, la granița cu Austria, renumit pentru aerul său curat cu proprietăți curative și istoria sa milenară.","f":["Altitudinea maximă: Muntele Szent Vid (568 m)","Fapt istoric: Locul unde a fost ascunsă Coroana Sfântă"]},"vertesszolos":{"i":"/poi-images/vertesszolos.webp","s":"Vértesszőlős este o comună situată în județul Komárom-Esztergom, la poalele munților Gerecse, celebră pe plan mondial pentru situl arheologic paleolitic descoperit aici.","f":["Situl arheologic este inclus pe lista indicativă UNESCO.","Numele 'Samu' vine de la ziua Sfântului Samuel, data descoperirii."]},"zalavar":{"i":"/poi-images/zalavar.webp","s":"Zalavár este o localitate cu o rezonanță istorică și ecologică profundă, situată la marginea rezervației naturale Kis-Balaton din vestul Ungariei.","f":["Zalavár a fost menționată în izvoarele carolingiene ca Mosapurc.","Bazilica Sf. Adrian a fost sfințită în jurul anului 850 d.Hr."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
