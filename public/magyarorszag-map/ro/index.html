header .langs{display:flex;gap:.25rem}
.lang{font-size:.7rem;font-weight:700;padding:.25rem .45rem;border-radius:6px;color:#ffffffb0;text-decoration:none;background:#ffffff10}
.lang.on{background:#3b82f6;color:#fff}
#stage{position:absolute;inset:101px 0 0 0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#0e1233 0%,#060614 70%)}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg.drag{cursor:grabbing}
.region{fill:#1a2240;stroke:#7aa8ff;stroke-width:1.1;stroke-opacity:.75;transition:fill .15s}
.region:hover{fill:#2d3a78}
.label{fill:#ffffff70;font-size:11px;font-weight:600;pointer-events:none;text-anchor:middle}
.poi{cursor:pointer}
.poi circle{fill:#9ca3af;stroke:#000;stroke-width:.5;transition:r .12s,opacity .12s}
.poi.g-city circle{fill:#60a5fa}
.poi.g-sight circle{fill:#fbbf24}
.poi.g-nature circle{fill:#22c55e}
.poi.g-history circle{fill:#c084fc}
.poi.g-industry circle{fill:#fb923c}
.poi.g-other circle{fill:#9ca3af}
.poi.dim{opacity:.18}
.poi.match circle{stroke:#fff;stroke-width:1.4}
.poi:hover circle,.poi.active circle{r:7;fill:#fff;opacity:1}
.controls{position:absolute;top:53px;left:0;right:0;z-index:4;padding:.4rem .55rem;display:flex;gap:.3rem;align-items:center;background:linear-gradient(180deg,#060614 0%,#06061400 100%)}
.chips{display:flex;gap:.25rem;flex-shrink:0}
.chip{flex-shrink:0;width:30px;height:30px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;user-select:none;padding:0;opacity:.45;transition:opacity .12s,background .12s,border-color .12s}
.chip.on{opacity:1}
.chip.on.g-city{background:#60a5fa22;border-color:#60a5fa70}
.chip.on.g-sight{background:#fbbf2422;border-color:#fbbf2470}
.chip.on.g-nature{background:#22c55e22;border-color:#22c55e70}
.chip.on.g-history{background:#c084fc22;border-color:#c084fc70}
.chip.on.g-industry{background:#fb923c22;border-color:#fb923c70}
.chip.on.g-other{background:#9ca3af22;border-color:#9ca3af70}
.chip svg{display:block}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;padding:.15rem .5rem .15rem .6rem;height:30px}
.search input{flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:.82rem;padding:.25rem 0;min-width:0;font-family:inherit}
.search input::placeholder{color:#ffffff70}
.search-results{position:absolute;top:34px;left:0;right:0;background:#0d1230;border:1px solid #ffffff20;border-radius:8px;max-height:280px;overflow-y:auto;display:none;z-index:10;box-shadow:0 4px 16px #00000060}
.search.has-q .search-results.has-hits{display:block}
.search-results a{display:flex;align-items:center;gap:.4rem;padding:.45rem .55rem;color:#fff;text-decoration:none;font-size:.8rem;border-bottom:1px solid #ffffff10;cursor:pointer}
.search-results a:last-child{border-bottom:none}
.search-results a:hover,.search-results a.active{background:#1a2055}
.search-results .dot{width:8px;height:8px;border-radius:50%;flex:none}
.search-results .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-results .gr{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em}
.search-results .smore{display:flex;align-items:center;justify-content:center;width:100%;padding:.45rem;background:#1a2055;color:#fff;border:none;border-top:1px solid #ffffff10;cursor:pointer;font-size:.75rem;font-weight:600}
.search-results .smore:hover{background:#252b6a}
.search-results .srest a{background:#0a0e23}
.search button{background:transparent;border:none;color:#ffffff80;font-size:1rem;cursor:pointer;padding:0 .15rem;display:none;line-height:1}
.search.has-q button{display:block}
.poi.hidden{display:none !important}
.poi.reveal{display:initial}
.cluster.hidden{display:none !important}
.cluster{cursor:pointer}
.cluster circle{transition:r .12s}
.cluster:hover circle{r:14}
/* At default zoom: clusters visible, in-cluster POIs hidden */
.poi.in-cluster{display:none}
/* At higher zoom: clusters hide, in-cluster POIs become visible */
#svg.expand .cluster{display:none}
#svg.expand .poi.in-cluster{display:initial}
.hint{position:absolute;top:102px;left:50%;transform:translateX(-50%);background:#000000a0;backdrop-filter:blur(8px);padding:.4rem .8rem;border-radius:999px;font-size:.75rem;color:#ffffffc0;pointer-events:none;z-index:3;animation:fadeOut 4s 2s forwards}
@keyframes fadeOut{to{opacity:0}}
.popup{position:absolute;bottom:0;left:0;right:0;background:#0d1230;border-top:1px solid #ffffff20;padding:1rem 1.2rem 1.4rem;transform:translateY(100%);transition:transform .25s;z-index:10;box-shadow:0 -10px 40px #00000080}
.popup.open{transform:translateY(0)}
.popup .x{position:absolute;top:.5rem;right:.7rem;width:32px;height:32px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:1.1rem;cursor:pointer;z-index:2}
.popup h2{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.popup .type{font-size:.7rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.popup p{margin:0 0 .8rem;font-size:.85rem;line-height:1.45;color:#ffffffc8}
.popup a.more{display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;font-weight:700;padding:.55rem 1rem;border-radius:8px;font-size:.85rem}
.popup .pcard{margin:-1rem -1rem .75rem;border-radius:12px 12px 0 0;overflow:hidden;display:none}
.popup .pcard.has-img{display:block;aspect-ratio:16/9;background-color:#1a2055;background-position:center;background-size:cover;background-repeat:no-repeat}
.popup .pdesc{margin:.5rem 0 .75rem;color:#ffffffc0;font-size:.88rem;line-height:1.4;display:none}
.popup .pdesc.show{display:block}
.popup .pfacts{margin:.2rem 0 .85rem;padding:0;list-style:none;display:none}
.popup .pfacts.show{display:block}
.popup .pfacts li{position:relative;padding:.2rem 0 .2rem 1rem;color:#ffffff95;font-size:.8rem;line-height:1.35}
.popup .pfacts li::before{content:"•";position:absolute;left:.15rem;color:#3b82f6;font-weight:700}
.popup .single{display:none}.popup .list{display:none}
.popup.mode-single .single{display:block}
.popup.mode-list .list{display:block;max-height:60vh;overflow-y:auto;margin-right:-.5rem;padding-right:.5rem}
.popup .list .lh{font-size:.75rem;color:#ffffff80;margin:0 0 .5rem;text-transform:uppercase;letter-spacing:.05em}
.popup .list a{display:flex;align-items:center;gap:.55rem;padding:.55rem .55rem;border-radius:8px;text-decoration:none;color:#fff;font-size:.88rem;border-bottom:1px solid #ffffff10}
.popup .list a:active{background:#ffffff14}
.popup .list a .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.popup .list a .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popup .list a .g{font-size:.65rem;color:#ffffff70;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
.popup .list .nl{padding:.6rem;color:#ffffff70;font-size:.85rem;font-style:italic}
.zoom{position:absolute;right:.7rem;bottom:.7rem;display:flex;flex-direction:column;gap:.35rem;z-index:4}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid #ffffff20;background:#0d1230;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.zoom button:active{background:#1a2240}

maghiar, cunoscută și sub numele de Országház, este unul dintre cele mai faimoase simboluri ale Budapestei și o capodoperă a arhitecturii neogotice.","f":["Clădirea are 691 de camere și o lungime totală de 268 de metri.","Pentru decorarea interioară s-au folosit aproximativ 40 de kilograme de aur de 24 de carate."]},"hosok-tere":{"i":"/poi-images/hosok-tere.webp","s":"Piața Eroilor este una dintre cele mai importante și vizitate piețe din Budapesta, formând finalul monumental al Bulevardului Andrássy.","f":["Monumentul Mileniului a fost proiectat de arhitectul Albert Schickedanz.","Coloana centrală are o înălțime de 36 de metri și poartă statuia Arhanghelului Gabriel."]},"dunapart":{"i":"/geo-images/hungary/dunapart.webp","s":"Malul Dunării din Budapesta este unul dintre cele mai spectaculoase peisaje urbane din lume și face parte din patrimoniul mondial UNESCO.","f":["Malul Dunării din Budapesta face parte din patrimoniul mondial UNESCO din 1987.","Memorialul 'Pantofi pe malul Dunării' constă în 60 de perechi de pantofi din fier."]},"margitsziget":{"i":"/poi-images/margitsziget.webp","s":"Insula Margareta este o oază verde în mijlocul Dunării, în inima Budapestei, servind drept cea mai importantă zonă de recreere a orașului.","f":["Insula are o lungime de 2,8 kilometri și o lățime maximă de 500 de metri.","Fântâna muzicală este una dintre cele mai mari de acest tip din Europa."]},"varosliget":{"i":"/geo-images/hungary/varosliget.webp","s":"Parcul Orașului (Városliget) este unul dintre primele parcuri publice din lume, oferind o gamă diversă de activități recreative în inima Budapestei.","f":["Parcul Orașului a devenit unul dintre primele parcuri publice din lume la începutul secolului al XIX-lea.","Castelul Vajdahunyad a fost construit inițial din lemn și carton pentru festivitățile mileniului din 1896."]},"andrassy-ut":{"i":"/geo-images/hungary/andrassy-ut.webp","s":"Bulevardul Andrássy este cea mai elegantă arteră din Budapesta, fiind inclusă în patrimoniul mondial UNESCO din anul 2002.","f":["Bulevardul a fost inaugurat în 1876 și numit după prim-ministrul Gyula Andrássy.","Opera de Stat Maghiară este una dintre cele mai impresionante clădiri de pe bulevard."]},"nyugati-palyaudvar":{"i":"/poi-images/nyugati-palyaudvar.webp","s":"Gara de Vest (Nyugati pályaudvar) este una dintre cele mai impresionante realizări arhitecturale din Budapesta și un monument remarcabil al istoriei feroviare.","f":["Gara a fost construită pe locul primei stații de cale ferată maghiare din 1846.","Structura de fier a fost prefabricată la Paris și asamblată la Budapesta."]},"lanchid":{"i":"/geo-images/hungary/lanchid.webp","s":"Podul cu Lanțuri Széchenyi este cel mai vechi și cel mai cunoscut pod peste Dunăre din Budapesta, fiind un simbol al capitalei maghiare.","f":["Podul a fost numit după omul de stat maghiar István Széchenyi.","Proiectat de William Tierney Clark, construcția a fost coordonată de Adam Clark."]},"pecs":{"i":"/geo-images/hungary/pecs.webp","s":"Pécs, situat în sud-vestul Ungariei, la poalele munților Mecsek, este un oraș cu o istorie de peste 2000 de ani.","f":["Al cincilea oraș ca mărime din Ungaria și reședința județului Baranya.","Universitatea din Pécs a fost fondată în 1367, fiind prima din Ungaria."]},"siklos":{"i":"/geo-images/hungary/siklos.webp","s":"Oraș în sudul Ungariei, faimos pentru castelul său bine conservat.","f":["Castelul Siklós a fost construit în secolul al XIII-lea.","Situat în apropierea regiunii viticole Villány."]},"mohacs":{"i":"/geo-images/hungary/mohacs.webp","s":"Oraș pe Dunăre, cunoscut pentru Bătălia de la Mohács și festivalul Busójárás.","f":["Locul Bătăliei de la Mohács din 1526.","Busójárás este patrimoniu cultural UNESCO."]},"villany":{"i":"/poi-images/villany.webp","s":"Centrul uneia dintre cele mai faimoase regiuni de vin roșu din Ungaria.","f":["Cunoscut pentru vinurile roșii corpolente.","Destinație populară pentru turismul viticol."]},"kecskemet":{"i":"/geo-images/hungary/kecskemet.webp","s":"Kecskemét, situat în inima Marii Câmpii Maghiare, este renumit pentru arhitectura sa Art Nouveau magnifică și livezile sale.","f":["Al optulea oraș ca mărime din Ungaria și reședința județului Bács-Kiskun.","Faimos pentru rachiul de caise de Kecskemét (Barackpálinka)."]},"kalocsa":{"i":"/geo-images/hungary/kalocsa.webp","s":"Unul dintre cele mai vechi orașe din Ungaria, faimos pentru boia și arta populară.","f":["Centrul cultivării boielei maghiare.","Sediul unei arhiepiscopii."]},"kiskunmajsa":{"i":"/geo-images/hungary/kiskunmajsa.webp","s":"Mic oraș în Marea Câmpie, cunoscut pentru baia sa termală.","f":["Destinație populară pentru turiștii de spa.","Situat în regiunea Kiskunság."]},"bekescsaba":{"i":"/geo-images/hungary/bekescsaba.webp","s":"Békéscsaba, situat în sud-estul Ungariei, este renumit în întreaga lume pentru tradițiile sale culinare, în special pentru cârnatul Csabai.","f":["Reședința județului Békés.","Casa cârnatului Csabai, un produs de tip 'Hungarikum'."]},"gyula":{"i":"/geo-images/hungary/gyula.webp","s":"Oraș balnear istoric aproape de granița cu România.","f":["Cunoscut pentru Baia Cetății.","Cetatea Gyula este singura cetate de cărămidă intactă din Europa Centrală."]},"szarvas":{"i":"/geo-images/hungary/szarvas.webp","s":"Oraș pe râul Körös, cunoscut pentru arboretul său.","f":["Arboretul Szarvas este cel mai mare din Ungaria.","Aici se află centrul geografic al Ungariei istorice."]},"miskolc":{"i":"/geo-images/hungary/miskolc.webp","s":"Miskolc, al patrulea oraș ca mărime din Ungaria, este situat în nord-estul țării, la marginea estică a munților Bükk.","f":["Al patrulea oraș ca mărime din Ungaria și reședința județului Borsod-Abaúj-Zemplén.","Baia în peșteră din Miskolctapolca este unică în Europa."]},"szerencs":{"i":"/poi-images/szerencs.webp","s":"'Poarta către Tokaj', cunoscut pentru fabrica sa de ciocolată.","f":["Are un castel din perioada Renașterii.","Producție tradițională de zahăr și ciocolată."]},"tokaj":{"i":"/geo-images/hungary/tokaj.webp","s":"Centrul regiunii viticole istorice Tokaj, faimos pentru vinurile dulci.","f":["Regiunea viticolă este în Patrimoniul Mondial UNESCO.","Casa vinului Tokaji Aszú."]},"aggtelek":{"i":"/poi-images/aggtelek.webp","s":"Parc național, faimos pentru sistemul său extins de peșteri cu stalactite.","f":["Peștera Baradla este parte a Patrimoniului Mondial UNESCO.","Se extinde peste granița cu Slovacia."]},"szeged":{"i":"/geo-images/hungary/szeged.webp","s":"Seghedin, cunoscut ca 'orașul soarelui', este situat în sudul Ungariei, la confluența râurilor Mureș și Tisa.","f":["Al treilea oraș ca mărime din Ungaria și reședința județului Csongrád-Csanád.","Universitatea din Seghedin este una dintre cele mai bune instituții de cercetare."]},"hodmezovasarhely":{"i":"/geo-images/hungary/hodmezovasarhely.webp","s":"Oraș în sudul Ungariei cu o bogată tradiție agricolă.","f":["Al doilea oraș ca mărime din Ungaria după suprafață.","Cunoscut pentru olăritul său."]},"mako":{"i":"/geo-images/hungary/mako.webp","s":"Oraș aproape de granița cu România, faimos pentru ceapa sa.","f":["Ceapa de Makó este un produs agricol protejat.","Baia termală Hagymatikum a fost proiectată de Imre Makovecz."]},"szekesfehervar":{"i":"/geo-images/hungary/szekesfehervar.webp","s":"Székesfehérvár, unul dintre cele mai vechi orașe din Ungaria, a fost locul de încoronare și de înmormântare al regilor maghiari în Evul Mediu.","f":["Fostă capitală a Ungariei în Evul Mediu.","Aici au fost încoronați 37 de regi maghiari și 15 au fost înmormântați."]},"dunaujvaros":{"i":"/poi-images/dunaujvaros.webp","s":"Oraș industrial pe Dunăre, construit în anii 1950.","f":["Se numea anterior Sztálinváros (Orașul lui Stalin).","Centrul industriei siderurgice maghiare."]},"gardony":{"i":"/geo-images/hungary/gardony.webp","s":"Oraș pe malul Lacului Velence, o destinație populară de vacanță.","f":["Locul de naștere al scriitorului Géza Gárdonyi.","Popular pentru sporturi nautice."]},"gyor":{"i":"/geo-images/hungary/gyor.webp","s":"Győr, 'orașul râurilor', este situat în nord-vestul Ungariei, la confluența râurilor Rába, Rábca și Dunărea.","f":["Al șaselea oraș ca mărime din Ungaria și reședința județului Győr-Moson-Sopron.","Centru important al industriei auto datorită fabricii Audi."]},"sopron":{"i":"/geo-images/hungary/sopron.webp","s":"Sopron, 'cel mai fidel oraș' al Ungariei, este situat în extremitatea vestică a țării, la granița cu Austria.","f":["A primit titlul de 'Civitas Fidelissima' după referendumul din 1921.","Centrul istoric este unul dintre cele mai bine conservate din Europa Centrală."]},"pannonhalma":{"i":"/geo-images/hungary/pannonhalma.webp","s":"Abație benedictină istorică pe un deal, unul dintre cele mai vechi monumente din Ungaria.","f":["Fondată în anul 996.","Parte a Patrimoniului Mondial UNESCO."]},"debrecen":{"i":"/geo-images/hungary/debrecen.webp","s":"Debrețin este al doilea cel mai mare oraș din Ungaria și centrul economic și cultural al Marii Câmpii Maghiare.","f":["Populație: aprox. 200.000 de locuitori (2024).","Universitatea din Debrețin a fost fondată în 1538, fiind una dintre cele mai vechi."]},"hortobagy":{"i":"/geo-images/hungary/hortobagy.webp","s":"Cel mai mare parc național din Ungaria, protejând peisajul tradițional Puszta.","f":["Patrimoniu Mondial UNESCO.","Cunoscut pentru Podul cu Nouă Arcuri și cultura pastorală tradițională."]},"hajduszoboszlo":{"i":"/poi-images/hajduszoboszlo.webp","s":"Faimoasă stațiune balneară cu cel mai mare complex de băi din Europa.","f":["Apa termală a fost descoperită în 1925.","Destinație populară pentru turismul de sănătate."]},"eger":{"i":"/geo-images/hungary/eger.webp","s":"Eger, unul dintre cele mai frumoase orașe baroce din Ungaria, este situat în nord-estul țării, la poalele munților Bükk.","f":["Reședința județului Heves și un centru religios important.","Castelul Eger este un simbol al rezistenței maghiare împotriva turcilor."]},"gyongyos":{"i":"/geo-images/hungary/gyongyos.webp","s":"Oraș la poalele m i":"/geo-images/hungary/salgotarjan.webp","s":"Oraș într-o vale înconjurată de munți, fost oraș minier.","f":["În apropiere se află ruinele castelelor Salgó și Somoskő.","Are un muzeu minier subteran."]},"balassagyarmat":{"i":"/geo-images/hungary/balassagyarmat.webp","s":"Oraș de graniță cu Slovacia, cunoscut ca 'cel mai curajos oraș'.","f":["A respins trupele cehoslovace în 1919.","Fostul sediu al comitatului Nógrád."]},"holloko":{"i":"/geo-images/hungary/holloko.webp","s":"Un sat tradițional Palóc, conservat ca un muzeu viu.","f":["Primul sat din lume care a devenit Patrimoniu Mondial UNESCO.","Dominat de ruinele unui castel din secolul al XIII-lea."]},"szentendre":{"i":"/geo-images/hungary/szentendre.webp","s":"Szentendre, un oraș pitoresc pe malul Dunării, la nord de Budapesta, este cunoscut pentru colonia sa vibrantă de artiști și atmosfera sa mediteraneană.","f":["Cunoscut ca 'orașul artelor', având o colonie de artiști importantă.","Modelat de influențe sârbe și dalmate în secolul al XVII-lea."]},"godollo":{"i":"/geo-images/hungary/godollo.webp","s":"Oraș lângă Budapesta, faimos pentru palatul său regal.","f":["Palatul Gödöllő a fost reședința de vară a Împărătesei Sisi.","Sediul Universității Szent István."]},"vac":{"i":"/geo-images/hungary/vac.webp","s":"Oraș istoric la Cotul Dunării cu arhitectură barocă.","f":["Are singurul arc de triumf din Ungaria.","Sediul unei episcopii catolice."]},"visegrad":{"i":"/geo-images/hungary/visegrad.webp","s":"Mic oraș la Cotul Dunării, faimos pentru cetatea sa medievală.","f":["Fostă reședință regală.","A dat numele Grupului de la Visegrád (V4)."]},"kaposvar":{"i":"/geo-images/hungary/kaposvar.webp","s":"Kaposvár, 'orașul florilor și al pictorilor', este situat în sud-vestul Ungariei, în regiunea deluroasă Somogy.","f":["Reședința județului Somogy.","Faimos pentru Teatrul Csiky Gergely, unul dintre cele mai frumoase din Ungaria."]},"siofok":{"i":"/geo-images/hungary/siofok.webp","s":"'Capitala Lacului Balaton', cunoscută ,"s":"Stațiune balneară populară cu o faimoasă baie termală și un castel renascentist.","f":["Castelul Nádasdy este un important monument istoric.","Apa termală este excelentă pentru afecțiuni reumatice."]},"veszprem-city":{"i":"/geo-images/hungary/veszprem-city.webp","s":"Veszprém, 'orașul reginelor', este situat pe dealurile pitorești ale pădurii Bakony, în apropierea lacului Balaton.","f":["Reședința județului Veszprém și unul dintre cele mai vechi orașe din Ungaria.","Locul tradițional de încoronare a reginelor maghiare."]},"balatonfured":{"i":"/geo-images/hungary/balatonfured.webp","s":"Cea mai veche stațiune de pe Lacul Balaton, cunoscută pentru izvoarele sale vindecătoare.","f":["Centrul navigației pe Lacul Balaton.","Găzduiește anual Balul Anna."]},"tihany":{"i":"/geo-images/hungary/tihany.webp","s":"Peninsulă în Lacul Balaton, faimoasă pentru abația benedictină și câmpurile de lavandă.","f":["Actul de fondare al abației (1055) conține cele mai vechi cuvinte maghiare.","Oferă o vedere uluitoare asupra lacului."]},"zalaegerszeg":{"i":"/geo-images/hungary/zalaegerszeg.webp","s":"Zalaegerszeg, situat în vestul Ungariei pe malul râului Zala, este un oraș verde înconjurat de dealurile domoale ale regiunii Zala.","f":["Reședința județului Zala.","Muzeul Satului Göcsej prezintă peste 40 de clădiri istorice."]},"nagykanizsa":{"i":"/geo-images/hungary/nagykanizsa.webp","s":"Important nod de transport în sud-vestul Ungariei.","f":["A fost istoric un important oraș fortăreață.","Cunoscut pentru parcurile și spațiile sale verzi."]},"keszthely":{"i":"/geo-images/hungary/keszthely.webp","s":"Cel mai mare oraș de pe Lacul Balaton, cunoscut pentru Castelul Festetics.","f":["Castelul Festetics este unul dintre cele mai mari din Ungaria.","Casa Georgikon, primul colegiu agricol din Europa."]},"harkany":{"i":"/poi-images/harkany.webp","s":"Faimos oraș balnear în sudul Ungariei, cunoscut pentru apa sa termală sulfuroasă.","f":["Apa este deosebit de bună pentru afecțiuni articulare.","Una dintre cele mai importante băi curative din Ungaria."]},"szigetvar":{"i":"/poi-images/szigetvar.webp","s":"Oraș istoric, cunoscut pentru apărarea eroică a cetății sale împotriva otomanilor.","f":["Locul asediului din 1566.","Aici a murit sultanul Soliman Magnificul."]},"baja":{"i":"/geo-images/hungary/baja.webp","s":"Oraș pe Dunăre, faimos pentru ciorba de pește și festivalul anual al ciorbei de pește.","f":["Situat la confluența Dunării cu Sugovica.","Centru cultural important al regiunii."]},"kiskunfelegyhaza":{"i":"/poi-images/kiskunfelegyhaza.webp","s":"Oraș în Marea Câmpie cu o arhitectură Art Nouveau impresionantă.","f":["Primăria este o capodoperă a stilului Art Nouveau maghiar.","Orașul natal al scriitorului Ferenc Móra."]},"bugac":{"i":"/poi-images/bugac.webp","s":"Parte a Parcului Național Kiskunság, cunoscut pentru peisajul său tradițional de puszta.","f":["Găzduiește Kurultáj, o întâlnire a popoarelor turcice.","Casa vitelor sure maghiare."]},"oroshaza":{"i":"/poi-images/oroshaza.webp","s":"Oraș în sud-estul Ungariei, cunoscut pentru băile curative și de ștrand Gyopárosfürdő.","f":["Adesea numit 'Perla Câmpii'.","Centru important al industriei sticlei."]},"mezohegyes":{"i":"/poi-images/mezohegyes.webp","s":"Oraș cunoscut pentru herghelia sa de stat și bogata tradiție în creșterea cailor.","f":["Fondat în 1784 de împăratul Iosif al II-lea.","Arhitectura orașului este unică în Ungaria."]},"sarospatak":{"i":"/poi-images/sarospatak.webp","s":"Oraș istoric pe râul Bodrog, cunoscut pentru castelul său renascentist și colegiu.","f":["Adesea numit 'Atena de pe Bodrog'.","Castelul Rákóczi este un monument important."]},"lillafured":{"i":"/poi-images/lillafured.webp","s":"Stațiune pitorească în munții Bükk, cunoscută pentru hotelul său castel și cascadă.","f":["Aici se află cea mai înaltă cascadă din Ungaria.","Lacul Hámori oferă posibilități de plimbare cu barca."]},"opusztaszer":{"i":"/poi-images/opusztaszer.webp","s":"Parcul Memorial Istoric Național, locul primei adunări naționale maghiare.","f":["Găzduiește pictura panoramică Feszty.","Un simbol important al identității maghiare."]},"csongrad-city":{"i":"/poi-images/csongrad-city.webp","s":"Oraș la confluența râurilor Körös și Tisa, cunoscut pentru orașul vechi și plaja de nisip.","f":["Cartierul 'Belváros' păstrează arhitectura tradițională.","Loc popular pentru pasionații de sporturi nautice."]},"mor":{"i":"/poi-images/mor.webp","s":"Oraș în munții Vértes, centrul unei faimoase regiuni de vin alb.","f":["Cunoscut pentru soiul de struguri 'Ezerjó'.","Găzduiește anual Zilele Vinului din Mór."]},"martonvasar":{"i":"/poi-images/martonvasar.webp","s":"Oraș cunoscut pentru castelul neogotic Brunszvik și legătura sa cu Beethoven.","f":["Beethoven a fost adesea oaspete la castel.","Găzduiește un muzeu memorial Beethoven."]},"mosonmagyarovar":{"i":"/poi-images/mosonmagyarovar.webp","s":"Oraș lângă granița cu Austria și Slovacia, cunoscut pentru baia sa termală.","f":["Centru important pentru turismul stomatologic.","Are o universitate agricolă importantă."]},"fertod":{"i":"/geo-images/hungary/fertod.webp","s":"Oraș cunoscut pentru Castelul Esterházy, 'Versailles-ul maghiar'.","f":["Joseph Haydn a trăit și a lucrat aici mulți ani.","Castelul este o capodoperă a stilului rococo."]},"hajduboszormeny":{"i":"/poi-images/hajduboszormeny.webp","s":"Cel mai mare dintre orașele Hajdú, cu o structură urbană circulară unică.","f":["Păstrează tradițiile haiducilor (Hajdú).","Centru agricol important."]},"berettyoujfalu":{"i":"/poi-images/berettyoujfalu.webp","s":"Oraș în estul Ungariei, centrul regiunii Bihar.","f":["Cunoscut pentru baia sa termală.","Nod de transport important lângă graniță."]},"parad":{"i":"/geo-images/hungary/parad.webp","s":"Stațiune în munții Mátra, cunoscută pentru izvoarele sale curative și muzeul trăsurilor.","f":["Apa sulfuroasă de Parád este cunoscută în toată țara.","Găzduiește clădirea Cifra-istálló."]},"belapatfalva":{"i":"/poi-images/belapatfalva.webp","s":"Oraș la poalele munților Bükk, faimos pentru abația sa cisterciană medievală.","f":["Biserica abației este una dintre cele mai bine conservate biserici romanice din Ungaria.","Punct de plecare popular pentru drumeții."]},"mezotur":{"i":"/poi-images/mezotur.webp","s":"Oraș în câmpie, cunoscut pentru tradiția sa seculară în olărit.","f":["Ceramica de Mezőtúr este un Hungarikum.","Găzduiește anual festivaluri de olărit."]},"tiszafured":{"i":"/poi-images/tiszafured.webp","s":"'Capitala Lacului Tisa', un centru pentru ecoturism și sporturi nautice.","f":["Poarta către Parcul Național Hortobágy.","Cunoscut pentru băile sale termale."]},"komarom":{"i":"/poi-images/komarom.webp","s":"Oraș de graniță pe Dunăre, cunoscut pentru sistemul său imens de fortificații.","f":["Sistemul de fortificații este cel mai mare de acest tip din Europa Centrală.","Împărțit într-o parte maghiară și una slovacă."]},"babolna":{"i":"/poi-images/babolna.webp","s":"Oraș faimos pentru herghelia sa istorică și creșterea cailor.","f":["Fondat în anul 1789.","Casa cailor Shagya Arab."]},"szecseny":{"i":"/poi-images/szecseny.webp","s":"Oraș istoric în nordul Ungariei, cunoscut pentru castelul baroc Forgách.","f":["Locul adunării naționale maghiare din 1705.","Are un turn de foc înclinat."]},"tar":{"i":"/poi-images/tar.webp","s":"Sat la poalele munților Mátra, cunoscut pentru stupa sa budistă.","f":["Stupa a fost ridicată în memoria lui Alexander Csoma de Kőrös.","Un loc de liniște și meditație."]},"erd":{"i":"/poi-images/erd.webp","s":"Oraș mare în aglomerația Budapestei, cunoscut pentru minaretul său otoman.","f":["Minaretul este unul dintre cele doar trei rămase în Ungaria.","Centru de transport important."]},"cegled":{"i":"/poi-images/cegled.webp","s":"Oraș în câmpie, cunoscut pentru baia sa termală și legătura cu Lajos Kossuth.","f":["Găzduiește cel mai mare muzeu Kossuth din țară.","Cunoscut pentru biserica sa reformată."]},"balatonlelle":{"i":"/poi-images/balatonlelle.webp","s":"Stațiune populară pe malul sudic al Lacului Balaton, cu plajă de nisip.","f":["Cunoscut pentru producția de vin.","Găzduiește multe festivaluri în timpul verii."]},"fonyod":{"i":"/poi-images/fonyod.webp","s":"Oraș pe malul sudic al Lacului Balaton, cunoscut pentru punctele sale de belvedere și port.","f":["Oferă cea mai frumoasă vedere asupra munților Badacsony.","Are cel mai lung debarcader de pe Lacul Balaton."]},"tiszadada":{"i":"/poi-images/tiszadada.webp","s":"Sat pe râul Tisa, cunoscut pentru Castelul Andrássy.","f":["Locație pitorească pe malul râului.","Loc de relaxare și natură."]},"dombovar":{"i":"/poi-images/dombovar.webp","s":"Oraș în Transdanubia de Sud, cunoscut pentru baia curativă Gunaras.","f":["Nod feroviar important.","Apa curativă este bogată în fluor."]},"dunafoldvar":{"i":"/poi-images/dunafoldvar.webp","s":"Oraș pe Dunăre, cunoscut pentru cetatea și podul său.","f":["Cetatea oferă o vedere largă asupra Dunării.","Cunoscut pentru băile sale termale."]},"buk":{"i":"/poi-images/buk.webp","s":"Una dintre cele mai cunoscute stațiuni balneare din Ungaria, cu o baie termală imensă.","f":["Apa termală a fost descoperită în timpul forajelor petroliere.","Popular printre oaspeții internaționali."]},"oriszentpeter":{"i":"/poi-images/oriszentpeter.webp","s":"Centrul regiunii Őrség, cunoscut pentru arhitectura tradițională și natură.","f":["Format din mai multe cătune dispersate (szer).","Faimos pentru uleiul de semințe de dovleac."]},"papa":{"i":"/poi-images/papa.webp","s":"Oraș istoric cu arhitectură barocă și o faimoasă baie termală.","f":["Sediul Castelului Esterházy.","Centru important al bisericii reformate."]},"badacsony":{"i":"/poi-images/badacsony.webp","s":"Munte vulcanic la Lacul Balaton, faimos pentru vinurile sale și formațiunile de bazalt.","f":["Cunoscut pentru soiul de struguri 'Kéknyelű'.","Oferă trasee de drumeție cu vedere panoramică."]},"heviz":{"i":"/poi-images/heviz.webp","s":"Stațiune balneară renumită în întreaga lume, cu cel mai mare lac termal activ biologic din lume.","f":["Temperatura apei nu scade sub 24°C nici iarna.","Cunoscut pentru împachetările cu nămol."]},"zalakaros":{"i":"/poi-images/zalakaros.webp","s":"Oraș balnear popular în sud-vestul Ungariei, cu o baie de aventură modernă.","f":["Apa termală a fost descoperită în 1962.","Una dintre cele mai vizitate băi din Ungaria."]},"balaton-to":{"i":"/geo-images/hungary/balaton-to.webp","s":"Lacul Balaton este cel mai mare lac din Europa Centrală și cea mai importantă destinație de vacanță din Ungaria.","f":["Datorită dimensiunii sale mari, este adesea numit 'Marea Ungariei'.","Cunoscut pentru apa sa puțin adâncă și plăcut de caldă în timpul verii."]},"tisza-folyo":{"i":"/geo-images/hungary/tisza-folyo.webp","s":"Tisa este al doilea cel mai lung râu din Ungaria și modelează peisajul Marii Câmpii Maghiare.","f":["Faimos pentru 'înflorirea Tisei', roirea spectaculoasă a efemeridelor.","O zonă importantă pentru turismul nautic și pescuitul din țară."]},"duna-folyo":{"i":"/geo-images/hungary/duna-folyo.webp","s":"Dunărea este cea mai importantă cale navigabilă a Ungariei, conectând țara cu Marea Neagră.","f":["Curge direct prin inima capitalei maghiare, Budapesta.","Servește ca graniță naturală între mai multe state europene."]},"kekes-teto":{"i":"/geo-images/hungary/kekes-teto.webp","s":"Cu o înălțime de 1014 metri, Kékes este cel mai înalt vârf din Ungaria și o destinație populară.","f":["Turnul de televiziune de pe vârf servește și ca platformă de observație.","O stațiune de schi populară iarna, cu cele mai lungi pârtii din țară."]},"baradla-barlang-poi":{"i":"/geo-images/hungary/baradla-barlang.webp","s":"Peștera Baradla este cel mai mare sistem de peșteri cu stalactite din Ungaria și parte a patrimoniului UNESCO.","f":["Cunoscută pentru sălile sale uriașe și acustica excepțională în timpul concertelor.","O parte a sistemului de peșteri se extinde până în Slovacia vecină."]},"bukki-nemzeti-park-poi":{"i":"/geo-images/hungary/bukki-nemzeti-park.webp","s":"Parcul Național Bükk protejează flora și fauna diversă a celor mai împădurite muntoase din Ungaria.","f":["Găzduiește numeroase peșteri în care au fost găsite urme ale oamenilor preistorici.","Un paradis pentru drumeți, cu o rețea densă de trasee marcate."]},"ferto-to-poi":{"i":"/geo-images/hungary/ferto-to.webp","s":"Lacul Fertő este un lac de stepă transfrontalier și o rezervație unică a biosferei.","f":["Lacul este aproape în întregime înconjurat de o zonă densă de stuf.","Loc important de odihnă pentru zeci de mii de păsări migratoare."]},"velencei-to-poi":{"i":"/geo-images/hungary/velencei-to.webp","s":"Lacul Velence este unul dintre cele mai calde lacuri din Europa și o destinație populară.","f":["Oferă condiții excelente pentru navigație, canotaj și windsurfing.","Cunoscut pentru insulele sale plutitoare și fauna piscicolă bogată."]},"szalajka-volgy-poi":{"i":"/geo-images/hungary/szalajka-volgy.webp","s":"Valea Szalajka este o destinație idilică în munții Bükk, faimoasă pentru cascadele sale.","f":["Cascada Fátyol în trepte este una dintre cele mai cunoscute minuni naturale.","O cale ferată îngustă transportă vizitatorii adânc în valea pitorească."]},"borzsony-hegyseg":{"i":"/geo-images/hungary/borzsony.webp","s":"Munții Börzsöny reprezintă o zonă vulcanică stinsă pe Dunăre, cu o natură aproape neatinsă.","f":["De pe vârful Csóványos se poate admira o vedere superbă până la Tatra Înaltă.","Munții sunt aproape integral acoperiți de păduri dese de foioase."]},"villanyi-borvidek-poi":{"i":"/geo-images/hungary/villanyi-borvidek.webp","s":"Villány este cea mai prestigioasă regiune de vin roșu din Ungaria, faimoasă pentru cupajele Bordeaux.","f":["Clima submediteraneană permite cultivarea unor soiuri de struguri pretențioase.","Numeroase crame și vinoteci invită la degustări în întreaga regiune."]},"gemenci-erdo-poi":{"i":"/geo-images/hungary/gemenci-erdo.webp","s":"Pădurea Gemenc este cea mai mare zonă de luncă continuă din Europa Centrală, de-a lungul Dunării.","f":["Faimoasă pentru efectivul său de cerbi comuni și porci mistreți.","Regiunea este un loc important de cuibărit pentru barza neagră protejată."]},"egri-var-poi":{"i":"/geo-images/hungary/egri-var.webp","s":"Cetatea din Eger este un simbol național al rezistenței maghiare împotriva otomanilor.","f":["În 1552, o trupă mică a apărat cetatea împotriva unei armate uriașe.","Cazamatele și sistemul subteran sunt deschise pentru vizitatori."]},"visegradi-fellegvar-poi":{"i":"/geo-images/hungary/visegrad.webp","s":"Cetatea din Visegrád domină maiestuos Cotul Dunării, oferind vederi panoramice uluitoare.","f":["A servit în Evul Mediu ca loc de păstrare a însemnelor coroanei maghiare.","Cetatea este o dovadă importantă a epocii strălucite a regilor Anjou."]},"szigetvari-var-poi":{"i":"/geo-images/hungary/szigetvari-var.webp","s":"Cetatea din Szigetvár este faimoasă pentru asediul eroic și moartea sultanului Soliman.","f":["Miklós Zrínyi și-a sacrificat viața apărând cetatea în anul 1566.","Parcul Prieteniei Maghiaro-Turce comemorează evenimentele istorice."]},"sarvari-var-poi":{"i":"/geo-images/hungary/sarvari-var.webp","s":"Cetatea Nádasdy este unul dintre cele mai bine conservate ansambluri renascentiste din vestul Ungariei.","f":["Faimoasă pentru frescele magnifice de pe tavanul sălii de festivități baroce.","Locul important unde a fost publicată prima carte tipărită în limba maghiară."]},"diosgyori-var-poi":{"i":"/geo-images/hungary/diosgyori-var.webp","s":"Cetatea Diósgyőr de lângă Miskolc a fost o reședință preferată a reginelor maghiare în Evul Mediu.","f":["Cetatea gotică caracteristică cu patru turnuri a fost reconstruită substanțial.","Găzduiește regulat jocuri cavalerești și festivaluri medievale."]},"esztergomi-bazilika-poi":{"i":"/geo-images/hungary/esztergomi-bazilika.webp","s":"Bazilica din Esztergom este cea mai mare biserică din Ungaria și centrul spiritual al țării.","f":["Pictura altarului este cea mai mare pictură pe pânză din lume realizată de un singur artist.","Capela Bakócz din interior este o capodoperă a Renașterii maghiare."]},"szentendrei-skanzen-poi":{"i":"/geo-images/hungary/szentendrei-skanzen.webp","s":"Skanzen din Szentendre prezintă arhitectura rurală și modul de viață din întreaga Ungarie.","f":["Peste 300 de clădiri din diverse regiuni au fost reconstruite fidel aici.","Atelierele interactive readuc la viață meșteșugurile vechi pentru vizitatori."]},"sumegi-var-poi":{"i":"/geo-images/hungary/sumegi-var.webp","s":"Cetatea Sümeg este una dintre cele mai impunătoare și mai bine conservate fortificații din țară.","f":["Construită în secolul al XIII-lea, cetatea oferă o vedere largă asupra regiunii Balaton.","Cunoscută pentru jocurile cavalerești spectaculoase și cinele istorice."]},"fuzeri-var-poi":{"i":"/geo-images/hungary/fuzeri-var.webp","s":"Cetatea Füzér este o fortificație restaurată spectaculos, situată pe o stâncă vulcanică abruptă.","f":["A fost una dintre primele cetăți din Ungaria construite după invazia tătară.","După bătălia de la Mohács, coroana maghiară a fost ascunsă aici timp de un an."]},"boldogkoi-var-poi":{"i":"/geo-images/hungary/boldogkoi-var.webp","s":"Cetatea Boldogkő domină o creastă stâncoasă îngustă, fiind o bijuterie a munților Zemplén.","f":["Galeria de lemn de pe Stânca Leului oferă un motiv fotografic unic.","În cetate poate fi vizitată una dintre cele mai mari expoziții de soldăței de plumb."]},"szepmuveszeti-muzeum-poi":{"i":"/geo-images/hungary/szepmuveszeti-muzeum.webp","s":"Muzeul de Arte Frumoase din Piața Eroilor găzduiește o colecție de artă de renume mondial.","f":["Deține una dintre cele mai importante colecții de artă spaniolă din afara Spaniei.","Clădirea magnifică în stil neoclasic a fost inaugurată în anul 1906."]},"nemzeti-muzeum-poi":{"i":"/geo-images/hungary/nemzeti-muzeum.webp","s":"Muzeul Național Maghiar păstrează cele mai importante comori ale istoriei și culturii maghiare.","f":["Clădirea a jucat un rol central în izbucnirea revoluției din 15 martie 1848.","Găzduiește prețioasa mantie de încoronare maghiară din secolul al XI-lea."]},"aquaworld-budapest":{"i":"/geo-images/hungary/aquaworld-budapest.webp","s":"Aquaworld Budapesta este unul dintre cele mai mari parcuri tematice acvatice acoperite din Europa.","f":["Clădirea impresionantă cu cupolă amintește de templul Angkor Wat.","Oferă 17 tobogane diferite și numeroase bazine interioare și exterioare pentru familii."]},"fovarosi-allatkert":{"i":"/geo-images/hungary/fovarosi-allatkert.webp","s":"Grădina zoologică din inima Budapestei este una dintre cele mai vechi din lume.","f":["Cunoscută pentru casele de animale valoroase în stil Art Nouveau și design oriental.","Cu peste un milion de vizitatori anual, este printre cele mai populare destinații din țară."]},"gellert-hegy-poi":{"i":"/geo-images/hungary/gellert-hegy.webp","s":"Dealul Gellért oferă cea mai faimoasă panoramă asupra Budapestei și face parte din patrimoniul UNESCO.","f":["Pe vârf se află Citadela și Statuia Libertății, vizibilă de la mare distanță.","Dealul este numit după Sfântul Gellért, care a suferit aici moarte martirică."]},"normafa-poi":{"i":"/geo-images/hungary/normafa.webp","s":"Normafa este cea mai populară zonă de recreere pentru budapestani în pitoreștii munți Buda.","f":["Cunoscută pentru vederile superbe și stația căii ferate istorice a copiilor.","Un loc ideal pentru plimbări, picnic și, în timpul iernii, pentru săniuș."]},"vajdahunyad-vara-poi":{"i":"/geo-images/hungary/vajdahunyad-vara.webp","s":"Castelul Vajdahunyad din Parcul Orașului îmbină cele mai importante stiluri arhitecturale maghiare.","f":["Construit inițial din lemn pentru festivitățile mileniului din 1896 și ulterior din piatră.","Găzduiește astăzi cel mai mare muzeu al agriculturii din Europa Centrală."]},"matyas-templom-poi":{"i":"/geo-images/hungary/matyas-templom.webp","s":"Biserica Mátyás din cartierul cetății este una dintre cele mai splendide și istorice biserici din țară.","f":["A servit timp de secole c ică pe Dunăre cu o faună bogată.","f":["Faimoasă pentru cerbi.","Are o cale ferată cu ecartament îngust."]},"debreceni-allatkert":{"i":"/geo-images/hungary/debrecen.webp","s":"Prima grădină zoologică provincială din Ungaria, în Pădurea Mare.","f":["Conectată cu un parc de distracții.","Specializată în păsări exotice."]},"nyiregyhazi-allatkert":{"i":"/geo-images/hungary/nyiregyhaza-zoo.webp","s":"Parc zoologic premiat cu habitate naturale și oceanariu.","f":["Considerată una dintre cele mai bune din Europa.","Găzduiește rari tigri albi."]},"tropicarium-budapest":{"i":"/geo-images/hungary/tropicarium.webp","s":"'Grădina zoologică cu rechini' din Budapesta cu un tunel de sticlă.","f":["Oferă o experiență de junglă tropicală.","Se pot vedea hrăniri de rechini."]},"miskolctapolca-barlangfurdo":{"i":"/geo-images/hungary/barlangfurdo.webp","s":"Baie termală unică într-o peșteră naturală.","f":["Temperatură plăcută de 30 de grade.","Efect curativ al aerului din peșteră."]},"mohacsi-busojaras-poi":{"i":"/geo-images/hungary/mohacs.webp","s":"Locul faimosului ritual de alungare a iernii cu măști.","f":["Patrimoniu cultural UNESCO.","Are loc anual în februarie."]},"zsolnay-negyed":{"i":"/geo-images/hungary/zsolnay-negyed.webp","s":"Zonă industrială restaurată superb cu artă din porțelan.","f":["Casa ceramicii de tip eozină.","Găzduiește muzee și ateliere."]},"szegedi-dom":{"i":"/geo-images/hungary/szeged.webp","s":"Catedrală neoromanică monumentală în Piața Domului.","f":["Construită după marea inundație.","Are una dintre cele mai mari orgi."]},"pannonhalmi-leveltar":{"i":"/geo-images/hungary/pannonhalma.webp","s":"Arhivă importantă cu cel mai vechi document scris maghiar.","f":["Parte a abației benedictine.","Păstrează documentul de fondare din Tihany."]},"magyar-nemzeti-galeria-poi":{"i":"/geo-images/hungary/nemzeti-galeria.webp","s":"Cea mai mare colecție de artă maghiară în Castelul Buda.","f":["Prezintă artă din Evul Mediu.","Se află în fostul Palat Regal."]},"corvin-negye os pentru agricultură și Arany János.","f":["Arany János a predat aici la liceu.","Faimos pentru târgurile din Nagykőrös."]},"marcali":{"i":"/poi-images/marcali.webp","s":"Oraș mic la sud de Lacul Balaton, cu o baie termală modernă.","f":["Centrul economic al bazinului Marcali.","Destinație populară pentru vânătoare și ecoturism."]},"barcs":{"i":"/poi-images/barcs.webp","s":"Oraș de graniță pe râul Drava, poarta către Parcul Național Dunăre-Drava.","f":["Cunoscut pentru plaja liberă de pe Drava.","Port fluvial și punct de trecere a frontierei important."]},"celldomolk":{"i":"/poi-images/celldomolk.webp","s":"Oraș la poalele muntelui Ság, cunoscut pentru locul de pelerinaj Kemenesalja.","f":["Muntele Ság este un vulcan stins.","Găzduiește muzeul Parcului Vulcanic Kemenes."]},"kormend":{"i":"/poi-images/kormend.webp","s":"Oraș pe râul Rába, faimos pentru Castelul Batthyány-Strattmann.","f":["Castelul găzduiește un muzeu al pantofilor.","Înconjurat de un parc magnific al castelului."]},"jaki-templom":{"i":"/poi-images/jaki-templom.webp","s":"Capodoperă a arhitecturii romanice din Ungaria cu celebrul său portal.","f":["Construită în secolul al XIII-lea ca biserică a abației benedictine.","Portalul este bogat decorat cu sculpturi."]},"edelenyi-kastely":{"i":"/poi-images/edelenyi-kastely.webp","s":"Unul dintre cele mai mari și mai splendide castele baroce din Ungaria.","f":["Cunoscut pentru picturile sale murale unice în stil rococo.","Construit pe o insulă a râului Bódva."]},"csakvari-kastely":{"i":"/poi-images/csakvari-kastely.webp","s":"Castelul clasicist al familiei Esterházy la poalele munților Vértes.","f":["Odată un centru cultural important.","Înconjurat de un imens parc englezesc."]},"nadasdy-kastely":{"i":"/poi-images/nadasdy-kastely.webp","s":"Castel neogotic unic în stil Tudor în Nádasdladány.","f":["Cunoscut pentru splendida sală a strămoșilor.","Unul dintre cele mai romantice castele din Ungaria."]},"deg-kastely":{"i":"/poi-images/deg-kastely.webp","s":"Unul dintre cele mai importante castele clasiciste cu cel mai mare parc englezesc.","f":["Cunoscut pentru 'Casa Olandeză' din parc.","Un centru important al masoneriei maghiare."]},"tiszadob-kastely":{"i":"/poi-images/tiszadob-kastely.webp","s":"Castel istoric de basm pe malul Tisei, cu un labirint.","f":["Arhitectura sa este inspirată de castelele franceze.","Are un faimos labirint de cimișir."]},"fuzerradvany-kastely":{"i":"/poi-images/fuzerradvany-kastely.webp","s":"Castel splendid în stil eclectic cu un imens parc peisagistic.","f":["Cunoscut pentru interiorul său în stil renascentist italian.","Parcul găzduiește platani seculari."]},"szabadkigyos-kastely":{"i":"/poi-images/szabadkigyos-kastely.webp","s":"Capodoperă a lui Miklós Ybl în stil eclectic și neorenascentist.","f":["Are 365 de ferestre, 52 de camere și 4 intrări.","Înconjurat de un parc superb al castelului."]},"zsambek-romtemplom":{"i":"/poi-images/zsambek-romtemplom.webp","s":"Ruinele impresionante ale unei bazilici în stil romanic târziu și gotic.","f":["A fost distrusă de un cutremur în anul 1763.","Un simbol al arhitecturii maghiare medievale."]},"szentendre-varazshegy":{"i":"/poi-images/szentendre-varazshegy.webp","s":"Un parc de basm ascuns și o potecă de aventură în Szentendre.","f":["Instalații unice din materiale naturale.","Ideal pentru familii cu copii mici."]},"balatonalmadi-strand":{"i":"/poi-images/balatonalmadi-strand.webp","s":"Plajă bine întreținută pe malul de nord-est al Lacului Balaton.","f":["Zone largi cu iarbă și copaci umbroși.","Oferă o vedere frumoasă asupra lacului."]},"keszthely-strand":{"i":"/poi-images/keszthely-strand.webp","s":"Plajă istorică cu clădirea iconică Szigetfürdő.","f":["Baia insulară a fost construită în secolul al XIX-lea.","Oferă diverse oportunități de sport și agrement."]},"siofok-strand":{"i":"/poi-images/siofok-strand.webp","s":"Cea mai mare și mai animată plajă de pe malul sudic.","f":["Găzduiește Plázs Siófok, un centru pentru concerte.","Faimoasă pentru roata sa panoramică."]},"gyor-gyerekvonat":{"i":"/poi-images/gyor-gyerekvonat.webp","s":"Trenuleț de parc, un favorit al familiilor din Győr.","f":["Circulă printr-o zonă verde pitorească.","Un program popular de weekend."]},"budakeszi-vadaspark":{"i":"/poi-images/budakeszi-vadaspark.webp","s":"Parc de animale sălbatice lângă Budapesta cu specii native.","f":["Oferă parcuri de aventură și grădină zoologică.","Situat în frumoșii munți Buda."]},"veszpremi-allatkert":{"i":"/poi-images/veszpremi-allatkert.webp","s":"Una dintre cele mai frumoase grădini zoologice din Ungaria cu parc de dinozauri.","f":["Parcul de dinozauri prezintă modele în mărime naturală.","Cunoscut pentru elefanți și rinoceri."]},"szegedi-vadaspark":{"i":"/poi-images/szegedi-vadaspark.webp","s":"Parc zoologic întins, concentrat pe protecția speciilor rare.","f":["Cea mai mare grădină zoologică din Ungaria ca suprafață.","Specializată pe fauna sud-americană."]},"tihany-levendulamezo":{"i":"/poi-images/tihany-levendulamezo.webp","s":"Câmpuri superbe de lavandă care colorează peninsula în violet în iunie.","f":["Casa Casei Lavandei, un centru pentru vizitatori.","Un simbol al peninsulei Tihany."]},"megyer-hegyi-tengerszem":{"i":"/poi-images/megyer-hegyi-tengerszem.webp","s":"Lac montan impresionant în locul unei foste cariere de pietre de moară.","f":["Votat cea mai frumoasă minune naturală a Ungariei în 2011.","Are pereți de stâncă spectaculoși, înalți de 70 de metri."]},"city-obuda-extra":{"i":"/poi-images/city-obuda-extra.webp","s":"Óbuda este una dintre cele mai vechi părți ale Budapestei, cunoscută pentru ruinele sale romane și străzile fermecătoare cu piatră cubică.","f":["Casa orașului antic roman Aquincum.","Deține două amfiteatre romane."]},"city-ujpest-extra":{"i":"/poi-images/city-ujpest-extra.webp","s":"Újpest este un sector vibrant din nordul Budapestei, cunoscut pentru istoria sa industrială și clubul său de fotbal.","f":["Fondat în anul 1840.","Cunoscut pentru clubul de fotbal Újpest FC."]},"geschichte-citadella-extra":{"i":"/poi-images/geschichte-citadella-extra.webp","s":"Citadela, o fortăreață impunătoare pe vârful Dealului Gellért, tronează maiestuos deasupra Budapestei și oferă, fără îndoială, cea mai cuprinzătoare panoramă a orașului."},"city-szentlorinc-extra":{"i":"/poi-images/city-szentlorinc-extra.webp","s":"Szentlőrinc este un orășel fermecător lângă Pécs.","f":["Gazda Zilelor Fermierilor din Szentlőrinc.","Nod feroviar important."]},"geo-mecsek-extra":{"i":"/poi-images/geo-mecsek-extra.webp","s":"Mecsek este un lanț muntos de înălțime medie din sudul Ungariei, cunoscut pentru pădurile și peșterile sale.","f":["Cel mai înalt punct este Zengő (682 m).","Găzduiește peștera Abaliget."]},"geschichte-pecsvaradi-var-extra":{"i":"/poi-images/geschichte-pecsvaradi-var-extra.webp","s":"O cetate medievală și fostă abație benedictină la poalele munților Mecsek.","f":["Fondată în jurul anului 998.","Fostă abație benedictină."]},"geschichte-mecseknadasdi-templom-extra":{"i":"/poi-images/geschichte-mecseknadasdi-templom-extra.webp","s":"O biserică mică, bine conservată, din epoca Arpadiană în Mecseknádasd.","f":["Construită în secolul al XIII-lea.","Stil romanic."]},"city-kiskunhalas-extra":{"i":"/poi-images/city-kiskunhalas-extra.webp","s":"Kiskunhalas este faimos în întreaga lume pentru dantela sa lucrată manual.","f":["Patria dantelei din Halas.","Deține un muzeu al dantelei."]},"city-lajosmizse-extra":{"i":"/poi-images/city-lajosmizse-extra.webp","s":"Lajosmizse este cunoscut pentru ospitalitatea sa și csárda-urile tradiționale maghiare.","f":["Centru al turismului ecvestru.","Faimos pentru spectacolele de călărie."]},"geo-kiskunsagi-nemzeti-park-extra":{"i":"/poi-images/geo-kiskunsagi-nemzeti-park-extra.webp","s":"Un parc național care protejează peisajul unic de puszta dintre Dunăre și Tisa.","f":["Fondat în 1975.","Constă din 9 zone separate."]},"geschichte-cifrapalota-extra":{"i":"/poi-images/geschichte-cifrapalota-extra.webp","s":"O clădire m
