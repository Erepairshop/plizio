alatonfured":{"i":"/geo-images/hungary/balatonfured.webp","s":"Der älteste Kurort am Plattensee, bekannt für seine Heilquellen.","f":["Zentrum des Segelsports am Plattensee.","Veranstaltet jährlich den Anna-Ball."]},"tihany":{"i":"/geo-images/hungary/tihany.webp","s":"Halbinsel im Plattensee, berühmt für ihre Benediktinerabtei und Lavendelfelder.","f":["Die Gründungsurkunde der Abtei (1055) enthält die ältesten ungarischen Wörter.","Bietet einen atemberaubenden Blick auf den See."]},"zalaegerszeg":{"i":"/geo-images/hungary/zalaegerszeg.webp","s":"Zalaegerszeg, im Westen Ungarns am Ufer der Zala gelegen, ist eine grüne Stadt, die von den sanften Hügeln der Region Zala umgeben ist.","f":["Sitz des Komitats Zala.","Das Göcsej-Freilichtmuseum zeigt über 40 historische Gebäude."]},"nagykanizsa":{"i":"/geo-images/hungary/nagykanizsa.webp","s":"Wichtiger Verkehrsknotenpunkt im Südwesten Ungarns.","f":["War historisch eine wichtige Festungsstadt.","Bekannt für ihre Parks und Grünflächen."]},"keszthely":{"i":"/geo-images/hungary/keszthely.webp","s":"Die größte Stadt am Plattensee, bekannt für das Schloss Festetics.","f":["Das Schloss Festetics ist eines der größten in Ungarn.","Heimat des Georgikon, der ersten landwirtschaftlichen Hochschule Europas."]},"harkany":{"i":"/poi-images/harkany.webp","s":"Berühmte Kurstadt im Süden Ungarns, bekannt für ihr schwefelhaltiges Thermalwasser.","f":["Das Wasser ist besonders gut für Gelenkbeschwerden.","Eines der bedeutendsten Heilbäder Ungarns."]},"szigetvar":{"i":"/poi-images/szigetvar.webp","s":"Historische Stadt, bekannt für die heldenhafte Verteidigung ihrer Burg gegen die Osmanen.","f":["Schauplatz der Belagerung von 1566.","Hier starb Sultan Süleyman der Prächtige."]},"baja":{"i":"/geo-images/hungary/baja.webp","s":"Stadt an der Donau, berühmt für ihre Fischsuppe und das jährliche Fischsuppen-Festival.","f":["Liegt am Zusammenfluss von Donau und Sugovica.","Wichtiges kulturelles Zentrum der Region."]},"kiskunfelegyhaza":{"i":"/po s/tiszafured.webp","s":"Die 'Hauptstadt des Theiß-Sees', ein Zentrum für Ökotourismus und Wassersport.","f":["Tor zum Nationalpark Hortobágy.","Bekannt für seine Thermalbäder."]},"komarom":{"i":"/poi-images/komarom.webp","s":"Grenzstadt an der Donau, bekannt für ihr riesiges Festungssystem.","f":["Das Festungssystem ist das größte seiner Art in Mitteleuropa.","Geteilt in einen ungarischen und einen slowakischen Teil."]},"babolna":{"i":"/poi-images/babolna.webp","s":"Stadt berühmt für ihr historisches Gestüt und die Pferdezucht.","f":["Gegründet im Jahr 1789.","Heimat der Shagya-Araber-Pferde."]},"szecseny":{"i":"/poi-images/szecseny.webp","s":"Historische Stadt in Nordungarn, bekannt für das Barockschloss Forgách.","f":["Ort der ungarischen Nationalversammlung von 1705.","Hat einen schiefen Feuerturm."]},"tar":{"i":"/poi-images/tar.webp","s":"Dorf am Fuße der Mátra, bekannt für seinen buddhistischen Stupa.","f":["Der Stupa wurde zum Gedenken an Alexander Csoma de Kőrös errichtet.","Ein Ort der Ruhe und Meditation."]},"erd":{"i":"/poi-images/erd.webp","s":"Große Stadt in der Agglomeration von Budapest, bekannt für ihr osmanisches Minarett.","f":["Das Minarett ist eines von nur drei erhaltenen in Ungarn.","Wichtiges Verkehrszentrum."]},"cegled":{"i":"/poi-images/cegled.webp","s":"Stadt in der Tiefebene, bekannt für ihr Thermalbad und die Verbindung zu Lajos Kossuth.","f":["Beherbergt das größte Kossuth-Museum des Landes.","Bekannt für seine reformierte Kirche."]},"balatonlelle":{"i":"/poi-images/balatonlelle.webp","s":"Beliebter Ferienort am Südufer des Plattensees mit Sandstrand.","f":["Bekannt für seine Weinproduktion.","Veranstaltet im Sommer viele Festivals."]},"fonyod":{"i":"/poi-images/fonyod.webp","s":"Stadt am Südufer des Plattensees, bekannt für ihre Aussichtspunkte und den Hafen.","f":["Bietet den schönsten Blick auf das Badacsony-Gebirge.","Hat den längsten Pier am Plattensee."]},"tiszadada":{"i":"/poi-images/tiszadada.webp","s":"Dorf an der Theiß, bekannt für das Schloss Andrássy.","f":["Malerische Lage am Fluss.","Ort der Entspannung und Natur."]},"dombovar":{"i":"/poi-images/dombovar.webp","s":"Stadt in Südtransdanubien, bekannt für das Gunaras-Heilbad.","f":["Wichtiger Eisenbahnknotenpunkt.","Das Heilwasser ist reich an Fluorid."]},"dunafoldvar":{"i":"/poi-images/dunafoldvar.webp","s":"Stadt an der Donau, bekannt für ihre Burg und die Brücke.","f":["Die Burg bietet einen weiten Blick über die Donau.","Bekannt für seine Thermalbäder."]},"buk":{"i":"/poi-images/buk.webp","s":"Einer der bekanntesten Kurorte Ungarns mit einem riesigen Thermalbad.","f":["Das Thermalwasser wurde bei Ölbohrungen entdeckt.","Beliebt bei internationalen Gästen."]},"oriszentpeter":{"i":"/poi-images/oriszentpeter.webp","s":"Das Zentrum der Region Őrség, bekannt für seine traditionelle Architektur und Natur.","f":["Besteht aus mehreren verstreuten Ortsteilen (Szer).","Bekannt für Kürbiskernöl."]},"papa":{"i":"/poi-images/papa.webp","s":"Historische Stadt mit barocker Architektur und einem berühmten Thermalbad.","f":["Sitz des Schlosses Esterházy.","Wichtiges Zentrum der reformierten Kirche."]},"badacsony":{"i":"/poi-images/badacsony.webp","s":"Vulkanberg am Plattensee, berühmt für seine Weine und Basaltformationen.","f":["Bekannt für die Rebsorte 'Kéknyelű'.","Bietet Wanderwege mit Panoramablick."]},"heviz":{"i":"/poi-images/heviz.webp","s":"Weltberühmter Kurort mit dem größten biologisch aktiven Thermalsee der Welt.","f":["Die Wassertemperatur sinkt auch im Winter nicht unter 24°C.","Bekannt für seine Schlammpackungen."]},"zalakaros":{"i":"/poi-images/zalakaros.webp","s":"Beliebte Kurstadt im Südwesten Ungarns mit einem modernen Erlebnisbad.","f":["Das Thermalwasser wurde 1962 entdeckt.","Eines der meistbesuchten Bäder Ungarns."]},"balaton-to":{"i":"/geo-images/hungary/balaton-to.webp","s":"Der Balaton ist der größte See Mitteleuropas und das bedeutendste Urlaubsziel für Sommerurlauber in Ungarn.","f":["Wird aufgrund seiner Größe oft als das 'Ungarische Meer' bezeichnet.","Bekannt für sein flaches, im Sommer angenehm warmes Wasser."]},"tisza-folyo":{"i":"/geo-images/hungary/tisza-folyo.webp","s":"Die Theiß ist der zweitlängste Fluss Ungarns und prägt maßgeblich die Landschaft der Großen Tiefebene.","f":["Berühmt für die 'Theißblüte', das spektakuläre Massenschlüpfen von Eintagsfliegen.","Ein wichtiges Gebiet für den Wassertourismus und den Fischfang im Land."]},"duna-folyo":{"i":"/geo-images/hungary/duna-folyo.webp","s":"Die Donau ist die wichtigste Wasserstraße Ungarns und verbindet das Land mit dem Schwarzen Meer.","f":["Fließt direkt durch das Herz der ungarischen Hauptstadt Budapest.","Dient als natürliche Grenze zwischen mehreren europäischen Staaten."]},"kekes-teto":{"i":"/geo-images/hungary/kekes-teto.webp","s":"Mit 1014 Metern ist der Kékes der höchste Gipfel Ungarns und ein beliebtes Ziel für Wanderer.","f":["Der markante Fernsehturm auf dem Gipfel dient auch als Aussichtsplattform.","Ein beliebtes Skigebiet im Winter mit den längsten Pisten des Landes."]},"baradla-barlang-poi":{"i":"/geo-images/hungary/baradla-barlang.webp","s":"Die Baradla-Höhle ist das größte Tropfsteinhöhlensystem Ungarns und gehört zum UNESCO-Welterbe.","f":["Bekannt für ihre riesigen Säle und die außergewöhnliche Akustik bei Konzerten.","Ein Teil des Höhlensystems erstreckt sich bis in die benachbarte Slowakei."]},"bukki-nemzeti-park-poi":{"i":"/geo-images/hungary/bukki-nemzeti-park.webp","s":"Der Nationalpark Bükk schützt die vielfältige Flora und Fauna des waldreichsten Gebirges Ungarns.","f":["Beherbergt zahlreiche Höhlen, in denen Spuren prähistorischer Menschen gefunden wurden.","Ein Paradies für Wanderer mit einem dichten Netz an markierten Wanderwegen."]},"ferto-to-poi":{"i":"/geo-images/hungary/ferto-to.webp","s":"Der Fertő-tó ist ein grenzüberschreitender Steppensee und ein einzigartiges Biosphärenreservat.","f":["Der See ist fast vollständig von einem dichten Schilfgürtel umgeben.","Wichtiger Rastplatz für Zehntausende von Zugvögeln auf ihrer Reise."]},"velencei-to-poi":{"i":"/geo-images/hungary/velencei-to.webp","s":"Der Velencer See ist einer der wärmsten Seen Europas und ein beliebtes Ziel für Wassersportler.","f":["Bietet hervorragende Bedingungen zum Segeln, Rudern und Windsurfen.","Bekannt für seine schwimmenden Inseln und die reiche Fischfauna."]},"szalajka-volgy-poi":{"i":"/geo-images/hungary/szalajka-volgy.webp","s":"Das Szalajka-Tal ist ein idyllisches Ausflugsziel im Bükk-Gebirge, berühmt für seine Wasserfälle.","f":["Der stufenförmige Schleierwasserfall ist eines der bekanntesten Naturwunder Ungarns.","Eine Schmalspurbahn bringt Besucher tief in das malerische Tal hinein."]},"borzsony-hegyseg":{"i":"/geo-images/hungary/borzsony.webp","s":"Das Börzsöny-Gebirge ist ein erloschenes Vulkangebiet an der Donau mit fast unberührter Natur.","f":["Vom Gipfel des Csóványos genießt man eine herrliche Aussicht bis zur Hohen Tatra.","Das Gebirge ist fast vollständig von dichten Laubwäldern bedeckt."]},"villanyi-borvidek-poi":{"i":"/geo-images/hungary/villanyi-borvidek.webp","s":"Villány ist Ungarns prestigeträchtigste Rotweinregion und bekannt für erstklassige Bordeaux-Blends.","f":["Das submediterrane Klima ermöglicht den Anbau anspruchsvoller Rebsorten.","Zahlreiche Weinkeller und Vinotheken laden zu Verkostungen in der Region ein."]},"gemenci-erdo-poi":{"i":"/geo-images/hungary/gemenci-erdo.webp","s":"Der Gemencer Wald ist das größte zusammenhängende Auwaldgebiet Mitteleuropas entlang der Donau.","f":["Berühmt für seinen Bestand an prachtvollen Gímszarvas-Hirschen und Wildschweinen.","Die Region ist ein wichtiges Brutgebiet für geschützte Schwarzstörche."]},"egri-var-poi":{"i":"/geo-images/hungary/egri-var.webp","s":"Die Burg von Eger ist ein nationales Symbol für den ungarischen Widerstand gegen die Osmanen.","f":["Im Jahr 1552 verteidigte eine kleine Truppe die Burg gegen ein riesiges Heer.","Die Kasematten und das unterirdische System sind für Besucher zugänglich."]},"visegradi-fellegvar-poi":{"i":"/geo-images/hungary/visegrad.webp","s":"Die Fellegvár in Visegrád thront majestätisch über dem Donauknie und bietet atemberaubende Blicke.","f":["Diente im Mittelalter als Aufbewahrungsort der heiligen ungarischen Krönungsinsignien.","Die Burg ist ein wichtiges Zeugnis der glanzvollen Čra der Anjou-Könige."]},"szigetvari-var-poi":{"i":"/geo-images/hungary/szigetvari-var.webp","s":"Die Burg von Szigetvár ist berühmt für die heldenhafte Belagerung und den Tod Sultan Süleymans.","f":["Miklós Zrínyi opferte sein Leben bei der Verteidigung der Festung im Jahr 1566.","Der Park der ungarisch-türkischen Freundschaft erinnert an die historischen Ereignisse."]},"sarvari-var-poi":{"i":"/geo-images/hungary/sarvari-var.webp","s":"Die Burg Nádasdy ist eine der am besten erhaltenen Renaissance-Anlagen im Westen Ungarns.","f":["Berühmt für die prunkvollen Deckenfresken im barocken Festsaal der Burganlage.","Wichtiger Ort, an dem das erste gedruckte ungarische Buch veröffentlicht wurde."]},"diosgyori-var-poi":{"i":"/geo-images/hungary/diosgyori-var.webp","s":"Die Burg Diósgyőr bei Miskolc war im Mittelalter eine bevorzugte Residenz ungarischer Königinnen.","f":["Die charakteristische vierürmige gotische Burg wurde umfassend rekonstruiert.","Regelmäßig finden hier Ritterspiele und mittelalterliche Festivals statt."]},"esztergomi-bazilika-poi":{"i":"/geo-images/hungary/esztergomi-bazilika.webp","s":"Die Basilika von Esztergom ist die größte Kirche Ungarns und das geistliche Zentrum des Landes.","f":["Das Altarbild ist das weltweit größte auf Leinwand gemalte Bild eines einzigen Künstlers.","Die Bakócz-Kapelle im Inneren ist ein Meisterwerk der ungarischen Renaissance."]},"szentendrei-skanzen-poi":{"i":"/geo-images/hungary/szentendrei-skanzen.webp","s":"Das Skanzen in Szentendre präsentiert die ländliche Architektur und Lebensweise aus ganz Ungarn.","f":["Über 300 Gebäude aus verschiedenen Regionen wurden hier originalgetreu wieder aufgebaut.","Interaktive Werkstätten lassen alte Handwerkskünste für Besucher wieder lebendig werden."]},"sumegi-var-poi":{"i":"/geo-images/hungary/sumegi-var.webp","s":"Die Burg Sümeg zählt zu den imposantesten und am besten erhaltenen Festungsanlagen des Landes.","f":["Die im 13. Jahrhundert errichtete Burg bietet einen weiten Blick über die Balaton-Region.","Bekannt für seine spektakulären Ritterspiele und historischen Abendveranstaltungen."]},"fuzeri-var-poi":{"i":"/geo-images/hungary/fuzeri-var.webp","s":"Die Burg Füzér ist eine spektakulär restaurierte Festung auf einem steilen vulkanischen Felsen.","f":["Sie war eine der ersten Burgen in Ungarn, die nach dem Tatarensturm erbaut wurde.","Nach der Schlacht bei Mohács wurde hier ein Jahr lang die ungarische Krone versteckt."]},"boldogkoi-var-poi":{"i":"/geo-images/hungary/boldogkoi-var.webp","s":"Die Burg Boldogkő thront auf einem schmalen Felsgrat und ist ein Juwel des Zemplén-Gebirges.","f":["Der hölzerne Wehrgang auf dem Löwenfelsen bietet ein einzigartiges Fotomotiv.","In der Burg kann man eine der größten Zinnfiguren-Ausstellungen des Landes besichtigen."]},"szepmuveszeti-muzeum-poi":{"i":"/geo-images/hungary/szepmuveszeti-muzeum.webp","s":"Das Museum der Bildenden Künste am Heldenplatz beherbergt eine weltberühmte Kunstsammlung.","f":["Besitzt eine der bedeutendsten Sammlungen spanischer Kunst außerhalb Spaniens.","Das prachtvolle Gebäude im neoklassizistischen Stil wurde im Jahr 1906 eröffnet."]},"nemzeti-muzeum-poi":{"i":"/geo-images/hungary/nemzeti-muzeum.webp","s":"Das Nationalmuseum bewahrt die wichtigsten Schätze der ungarischen Geschichte und Kultur auf.","f":["Das Gebäude spielte eine zentrale Rolle beim Ausbruch der Revolution am 15. März 1848.","Beherbergt den wertvollen ungarischen Krönungsmantel aus dem 11. Jahrhundert."]},"aquaworld-budapest":{"i":"/geo-images/hungary/aquaworld-budapest.webp","s":"Aquaworld Budapest ist einer der größten überdachten Wasser-Themenparks in ganz Europa.","f":["Der beeindruckende Kupp t eine ungarische Stadt im Komitat Dabas District mit rund 5.330 Einwohnern.","f":["Komitat Dabas District","ca. 5.330 Einw."]},"balatonboglar-extra":{"i":"/poi-images/balatonboglar-extra.webp","s":"Balatonboglár ist eine ungarische Stadt im Komitat Fonyód District mit rund 5.298 Einwohnern.","f":["Komitat Fonyód District","ca. 5.298 Einw."]},"nagyhalasz-extra":{"i":"/poi-images/nagyhalasz-extra.webp","s":"Nagyhalász ist eine ungarische Stadt im Komitat Ibrány District mit rund 5.270 Einwohnern.","f":["Komitat Ibrány District","ca. 5.270 Einw."]},"mezoekovacshaza-extra":{"i":"/poi-images/mezoekovacshaza-extra.webp","s":"Mezőkovácsháza ist eine ungarische Stadt im Komitat Mezőkovácsháza District mit rund 5.251 Einwohnern.","f":["Komitat Mezőkovácsháza District","ca. 5.251 Einw."]},"totkomlos-extra":{"i":"/poi-images/totkomlos-extra.webp","s":"Tótkomlós ist eine ungarische Stadt im Komitat Orosháza District mit rund 5.146 Einwohnern.","f":["Komitat Orosháza District","ca. 5.146 Einw."]},"kaba-extra":{"i":"/poi-images/kaba-extra.webp","s":"Kaba ist eine ungarische Stadt im Komitat Püspökladány District mit rund 5.144 Einwohnern.","f":["Komitat Püspökladány District","ca. 5.144 Einw."]},"tat-extra":{"i":"/poi-images/tat-extra.webp","s":"Tát ist eine ungarische Stadt im Komitat Esztergom District mit rund 5.116 Einwohnern.","f":["Komitat Esztergom District","ca. 5.116 Einw."]},"monorierdoe-extra":{"i":"/poi-images/monorierdoe-extra.webp","s":"Monorierdő ist eine ungarische Stadt im Komitat Monor mit rund 5.107 Einwohnern.","f":["Komitat Monor","ca. 5.107 Einw."]},"helvecia-extra":{"i":"/poi-images/helvecia-extra.webp","s":"Helvécia ist eine ungarische Stadt im Komitat Kecskemét District mit rund 5.070 Einwohnern.","f":["Komitat Kecskemét District","ca. 5.070 Einw."]},"nyekladhaza-extra":{"i":"/poi-images/nyekladhaza-extra.webp","s":"Nyékládháza ist eine ungarische Stadt im Komitat Miskolc District mit rund 5.009 Einwohnern.","f":["Komitat Miskolc District","ca. 5.009 Einw."]},"abaliget":{"s":"Abaliget ist eine charmante Gemeinde im Komitat Baranya, eingebettet in die malerische Landschaft des Mecsek-Gebirges im Süden Ungarns.","f":["Die Abaligeti-Höhle hat eine konstante Jahrestemperatur von 12 Grad Celsius.","Das Fledermausmuseum ist das einzige seiner Art in ganz Ungarn."]},"aszofo":{"s":"Aszófő ist ein charmantes Dorf am Nordufer des Plattensees, am westlichen Tor zur Tihany-Halbinsel gelegen.","f":["Lage: Westliches Tor zur Tihany-Halbinsel","Hauptwein: Olaszrizling (Welschriesling)"]},"badacsonytomaj":{"s":"Badacsonytomaj ist das Herz der berühmten Weinregion Badacsony am Nordufer des Plattensees.","f":["Bauwerk: Einzige Basaltkirche Europas","Wahrzeichen: Tafelberg Badacsony (438 m)"]},"bakonybel":{"s":"Bakonybél liegt im Herzen des Hohen Bakony-Gebirges und ist einer der spirituellsten und naturnahsten Orte Ungarns.","f":["Gründung: 1018 durch König Stephan I.","Wahrzeichen: Benediktinerabtei Bakonybél"]},"bakonynana":{"s":"Bakonynána ist ein ruhiges Dorf im östlichen Bakony, das vor allem für seine spektakulären Naturwunder bekannt ist.","f":["Naturwunder: Római-fürdő Wasserfall","Geologie: Sechseckige Basaltorgeln"]},"bakonyszentlaszlo":{"s":"Bakonyszentlászló ist das Tor zum malerischen Cuha-Tal und eines der wichtigsten touristischen Zentren im nördlichen Bakony.","f":["Highlight: Cuha-Tal Schlucht","Technik: Historische Eisenbahnstrecke (Viadukte)"]},"balatonakali":{"s":"Balatonakali ist ein malerisches Weindorf am Nordufer des Plattensees, das für seine authentische Atmosphäre und seine hervorragenden Weißweine bekannt ist.","f":["Erste urkundliche Erwähnung im Jahr 1243.","Bekannt für den Anbau der Rebsorte Welschriesling."]},"balatonederics":{"s":"Balatonederics ist eine charmante Gemeinde am westlichen Ende des Nordufers des Plattensees, wo die Ausläufer des Keszthely-Gebirges auf das Wasser treffen.","f":["Die Csodabogyós-Höhle ist über 6 Kilometer lang.","Das Afrika-Museum beherbergt lebende Kamele und Zebras."]},"balatonfenyves":{"s":"Balatonfenyves ist einer der beliebtesten Urlaubsorte am Südufer des Plattensees und zeichnet sich durch seine ruhige, familienfreundliche Atmosphäre und seine weitläufigen Grünflächen aus.","f":["Gegründet als eigenständige Gemeinde im Jahr 1958.","Die Schmalspurbahn hat eine Spurweite von 760 mm."]},"balf":{"s":"Balf, ein malerischer Stadtteil von Sopron, liegt am westlichen Ufer des Neusiedler Sees und ist seit der Römerzeit für seine heilkräftigen Quellen bekannt.","f":["Die Römer nannten den Ort vermutlich 'Balneum'.","Das Schwefelwasser von Balf ist seit dem 17. Jahrhundert berühmt."]},"battonya":{"s":"Battonya ist eine historisch bedeutsame Kleinstadt im Südosten Ungarns, direkt an der rumänischen Grenze gelegen.","f":["In Battonya leben seit Jahrhunderten Ungarn, Serben und Rumänen zusammen.","Die Stadt beherbergt Kirchen von vier verschiedenen christlichen Konfessionen."]},"berekfurdo":{"s":"Berekfürdő ist eine friedliche Wellness-Oase im Herzen der ungarischen Tiefebene (Alföld), oft als das 'Meer des Hortobágy' bezeichnet.","f":["Wassertyp: Jod- und bromhaltiges Heilwasser","Entdecker: Ferenc Pávai-Vajna (1928)"]},"bogacs":{"s":"Bogács ist einer der beliebtesten Ferienorte in der Region Bükkalja, am südlichen Rand des Bükk-Gebirges.","f":["Das schwefelhaltige Heilwasser von Bogács sprudelt mit einer Temperatur von 76 Grad Celsius aus der Erde.","Die Weinkeller sind direkt in das weiche Gestein (Riolittufa) gehauen."]},"boldva":{"s":"Boldva ist eine historisch bedeutende Gemeinde im Nordosten Ungarns, gelegen im Tal des Flusses Bódva.","f":["In Boldva wurde die 'Leichenrede', der älteste ungarische Sprachtext, gefunden.","Das Benediktinerkloster wurde um 1175 erbaut."]},"buzsak":{"s":"Buzsák ist ein malerisches Dorf im Komitat Somogy, südlich des Plattensees, das weit über die Landesgrenzen hinaus für seine lebendige Volkskunst und Traditionen bekannt ist.","f":["Berühmt für drei verschiedene Stickereistile.","Die Weiße Kapelle auf dem Weinberg wurde 1733 erbaut."]},"cak":{"s":"Cák, am Fuße des Kőszeg-Gebirges gelegen, ist eine der charmantesten Siedlungen in Westungarn, bekannt für seine außergewöhnlich gut erhaltene Volksarchitektur.","f":["Höhe: 250-280 m ü. Adria","Baudenkmal: 8 historische Weinkeller"]},"csempeszkopacs":{"s":"Csempeszkopács ist ein kleines, idyllisches Dorf im Komitat Vas, das für eines der besterhaltenen romanischen Baudenkmäler Westungarns bekannt ist.","f":["Die St.-Michael-Kirche wurde um 1250 erbaut.","Das Gebäude besteht aus romanischem Backsteinmauerwerk."]},"cserkeszolo":{"s":"Cserkeszőlő ist ein dynamisch wachsender Kurort im Süden der Region Jászkunság, gelegen in einer sonnenreichen Gegend zwischen den Flüssen Theiß und Körös.","f":["Wassertemperatur: 82 Grad Celsius (Quelle)","Tiefe der Quelle: 2300 Meter"]},"csopak":{"s":"Csopak ist eine der elegantesten Gemeinden am Nordufer des Plattensees und das unangefochtene Zentrum der Weinregion Balatonfüred-Csopak.","f":["Zentrum der Weinregion Balatonfüred-Csopak.","Der Boden besteht aus 250 Millionen Jahre altem roten Sandstein."]},"decs":{"s":"Decs ist die Hauptstadt der Sárköz-Region im Komitat Tolna und gilt als eines der wichtigsten Zentren der ungarischen Volkskunst.","f":["Inoffizielle Hauptstadt der Sárköz-Region.","Die Trachten gehören zum UNESCO-Weltkulturerbe."]},"demjen":{"s":"Demjén ist ein aufstrebendes Wellness-Zentrum im Norden Ungarns, nur wenige Kilometer von der historischen Stadt Eger entfernt.","f":["Das Cascade-Höhlenbad erstreckt sich über 1.500 Quadratmeter Wasserfläche.","Das Thermalwasser tritt mit einer Temperatur von 68 Grad aus der Erde."]},"domos":{"s":"Dömös ist ein malerisches Dorf am rechten Ufer des Donauknies, eingebettet in die dichten Wälder des Visegráder Gebirges.","f":["Die Propstei wurde 1107 von Prinz Álmos gegründet.","Die Rám-Schlucht hat einen Höhenunterschied von 112 Metern."]},"dregelypalank":{"s":"Drégelypalánk ist ein historisch bedeutsames Dorf im Komitat Nógrád, nahe der slowakischen Grenze im Tal des Ipoly.","f":["Die Burg Drégely wurde im 13. Jahrhundert erbaut.","Der Belagerungskampf fand vom 6. bis 9. Juli 1552 statt."]},"egerszalok":{"s":"Egerszalók ist ein faszinierendes Dorf im Nordosten Ungarns, eingebettet in das malerische Tal des Laskó-Baches am Fuße des Bükk-Gebirges.","f":["Heilwassertemperatur: 65-68 Grad Celsius","Fläche der Salzhügel-Formation: 1200 m²"]},"feldebro":{"s":"Feldebrő ist ein bescheidenes, aber historisch überaus bedeutendes Dorf im Tal des Flusses Tarna am westlichen Rand des Bükk-Gebirges.","f":["Alter der Unterkirche: ca. 1000 Jahre","Anzahl der Schiffe in der Krypta: 5 Schiffe"]},"fertoboz":{"s":"Fertőboz ist eine charmante kleine Gemeinde am südlichen Ufer des Neusiedler Sees, die als Teil der UNESCO-Welterbelandschaft Fertő-Neusiedler See eine besondere Bedeutung genießt.","f":["Die Gloriette wurde zu Ehren des Besuchs von Erzherzog Joseph erbaut.","Der Ort liegt am Rand des Nationalparks Fertő-Hanság."]},"fertorakos":{"s":"Fertőrákos ist eine der faszinierendsten Siedlungen am ungarischen Ufer des Neusiedler Sees und blickt auf eine jahrtausendealte Geschichte zurück.","f":["Der Steinbruch wurde 2001 Teil des UNESCO-Welterbes.","Das Höhlentheater bietet Platz für etwa 750 Zuschauer."]},"fuzer":{"s":"Füzér ist eines der malerischsten Dörfer Ungarns, gelegen im äußersten Nordosten an der Grenze zu der Slowakei, im Zemplén-Gebirge.","f":["Die Burg Füzér wurde auf einem 552 Meter hohen vulkanischen Kegel errichtet.","Im Jahr 1526 wurde die Heilige Krone Ungarns hier für fast ein Jahr versteckt."]},"hegymagas":{"s":"Hegymagas ist eine kleine, bezaubernde Gemeinde im Herzen des Káli-Beckens, am Fuße des majestätischen Szent György-Berges.","f":["Liegt am Fuße des 415 m hohen Szent György-Berges.","Die Basaltorgeln sind bis zu 30 Meter hohe Steinsäulen."]},"igal":{"s":"Igal ist eine charmante Kleinstadt im Herzen von Somogy, die vor allem für ihr Heilbad von europäischem Rang bekannt ist.","f":["Das Heilwasser tritt mit 81 °C aus der Erde aus.","Igal erhielt im Jahr 2010 den Status einer Stadt."]},"ipolytarnoc":{"s":"Ipolytarnóc ist ein kleines Dorf im Norden Ungarns, das als 'ungarisches Pompeji' Weltruhm erlangt hat.","f":["Vulkanausbruch vor ca. 20 Millionen Jahren.","Entdeckung der ersten Funde im Jahr 1836."]},"jak":{"s":"Ják ist weltweit bekannt für seine monumentale Abteikirche, die als das bedeutendste Meisterwerk der romanischen Architektur in Ungarn gilt.","f":["Einweihung: 1256 durch Bischof Amadeus","Stil: Spätromanik mit Zierelementen"]},"josvafo":{"s":"Jósvafő ist ein malerisches Dorf im Norden Ungarns, gelegen im Herzen des Aggtelek-Nationalparks, der zum UNESCO-Welterbe gehört.","f":["Jósvafő liegt am Treffpunkt der Bäche Jósva, Kecső und Tohonya.","Die Baradla-Höhle ist Teil des UNESCO-Welterbes Aggteleker Karst."]},"kapolcs":{"s":"Kapolcs ist ein lebendiges Kulturdorf im Eger-Tal, eingebettet in die sanften Hügel des Balaton-Oberlandes.","f":["Zentrum des ersten 'Tal der Künste' Festivals (1989).","Einst trieb der Eger-Bach fast 100 Wassermühlen im Tal an."]},"kazar":{"s":"Kazár ist ein malerisches Dorf im Komitat Nógrád, das für seine reiche Volkskultur und eine einzigartige geologische Formation bekannt ist.","f":["Die Rhyolith-Tuff-Formation ist etwa 20 Millionen Jahre alt.","Die Tracht von Kazár besteht aus bis zu 10 Schichten Röcken."]},"kehidakustany":{"s":"Kehidakustány ist eine bedeutende Kur- und Kulturgemeinde im Komitat Zala, gelegen im malerischen Tal des Flusses Zala.","f":["Die Thermalquelle von Kehida liefert Wasser mit einer Temperatur von 43°C.","Ferenc Deák lebte hier von 1803 bis 1854 auf seinem Familiengut."]},"koveskal":{"s":"Köveskál ist das gastronomische und kulturelle Herz des Káli-Beckens, einer Region, die oft als die 'Ungarische Toskana' bezeichnet wird.","f":["Einst ein Dorf des Kleinadels (Curialisten).","Gehört zum Nationalpark Balaton-Oberland."]},"lasztonya":{"s":"Lasztonya ist eine der kleinsten und ruhigsten Gemeinden im Komitat Zala, gelegen in den tiefen Wäldern des Göcsej-Hügellandes.","f":["Lasztonya gehört zu den zehn bevölkerungsärmsten Dörfern Ungarns.","Das Dorf liegt auf einer Höhe von ca. 210 Metern im Letenye-Hügelland."]},"lebeny":{"s":"Lébény ist eine geschichtsträchtige Gemeinde in der Kleinen Ungarischen Tiefebene, auf halbem Weg zwischen Győr und Mosonmagyaróvár.","f":["Die St.-Jakobs-Kirche wurde zwischen 1202 und 1208 erbaut.","Die Mauern der Basilika sind stellenweise über 2 Meter dick."]},"lovasbereny":{"s":"Lovasberény liegt im Herzen des Fejér-Komitats, am südlichen Rand des Velence-Gebirges.","f":["Das Cziráky-Schloss erhielt seine klassizistische Form um 1804.","Der jüdische Friedhof beherbergt Grabsteine aus dem 18. Jahrhundert."]},"mad":{"s":"Mád ist eine der bedeutendsten Weinbaugemeinden in der Region Tokaj-Hegyalja, die zum UNESCO-Welterbe gehört.","f":["Die Synagoge von Mád wurde 1795 erbaut und 2004 umfassend restauriert.","Mád liegt am Zemplén-Gebirge auf vulkanischem Boden (Rhyolith-Tuff)."]},"magyarpolany":{"s":"Magyarpolány ist ein preisgekröntes Kulturerbe-Dorf am Rande des Bakony-Gebirges, das für seine außergewöhnlich gut erhaltene Volksarchitektur bekannt ist.","f":["Träger des Europa-Nostra-Preises seit 1993.","Fast 100 denkmalgeschützte Häuser in der Petőfi-Straße."]},"matrafured":{"s":"Mátrafüred ist ein charmanter Kurort am südlichen Hang des Mátra-Gebirges und ein integraler Bestandteil der Stadt Gyöngyös.","f":["Durchschnittliche Höhe: 350-400 Meter","Bahnverbindung: Mátra-Waldbahn nach Gyöngyös"]},"matrahaza":{"s":"Mátraháza ist ein hochgelegener Luftkurort im Mátra-Gebirge, gelegen auf einer Höhe von etwa 715 Metern über dem Meeresspiegel.","f":["Höhenlage: 712-715 Meter","Zentrales Gebäude: Grand Hotel Mátra (1930)"]},"matraszentimre":{"s":"Mátraszentimre ist das höchstgelegene Dorf Ungarns und liegt auf einer beeindruckenden Höhe von etwa 810 Metern im westlichen Teil des Mátra-Gebirges.","f":["Höchster Punkt des Dorfes: 815 Meter","Galyatető Gipfelhöhe: 964 Meter"]},"matraverebely":{"s":"Mátraverebély ist eine traditionsreiche Gemeinde im Komitat Nógrád, am nordwestlichen Rand des Mátra-Gebirges.","f":["Szentkút wurde 2006 zum nationalen Heiligtum erklärt.","Die Basilika wurde 1763 im Barockstil vollendet."]},"nagyborzsony":{"s":"Nagybörzsöny ist eine versteckte Perle am westlichen Rand des Börzsöny-Gebirges im Komitat Pest.","f":["Die St. Stephans-Kirche wurde um 1250 erbaut.","Nagybörzsöny hat nur etwa 700 Einwohner."]},"nagycenk":{"s":"Nagycenk ist untrennbar mit dem Namen des Grafen István Széchenyi, dem 'größten Ungarn', verbunden.","f":["Das Schloss beherbergt das größte Széchenyi-Gedenkmuseum Ungarns.","Die Lindenallee besteht aus über 400 Bäumen und wurde um 1750 gepflanzt."]},"nagyvazsony":{"s":"Nagyvázsony ist einer der geschichtsträchtigsten Orte im Balaton-Oberland, strategisch günstig in einem Tal zwischen dem See und dem Bakony-Gebirge gelegen.","f":["Der Donjon der Burg ist 28 Meter hoch.","Pál Kinizsi erhielt die Burg im Jahr 1472."]},"ocs":{"s":"Öcs ist ein verstecktes Juwel am westlichen Rand des Bakony-Waldes, gelegen in einem malerischen Tal des Balaton-Oberlandes.","f":["Öcs liegt in einem Talkessel auf ca. 280 Metern Höhe.","Die Gemeinde wurde erstmals im 13. Jahrhundert erwähnt."]},"orfu":{"s":"Orfű ist ein wahres Juwel im Mecsek-Gebirge, unweit der Stadt Pécs gelegen.","f":["Das Orfűer Seensystem besteht aus vier verschiedenen künstlichen Seen.","Der Pécsi-See ist der größte See im System mit einer Fläche von 72 Hektar."]},"paloznak":{"s":"Paloznak ist eine der charmantesten und am besten erhaltenen Gemeinden am Nordufer des Plattensees, am Fuße des Bakony-Gebirges.","f":["Mehrfacher Gewinner von Preisen zur Dorferneuerung.","Die Kirche hat Fundamente aus dem 11. Jahrhundert."]},"pankasz":{"s":"Pankasz ist ein malerisches Dorf in der Region Őrség, im Südwesten Ungarns, das vor allem für sein herausragendes Beispiel der volkstümlichen Architektur bekannt ist: den hölzernen Glockenturm (Fah...","f":["Baujahr Glockenturm: 1755","Material: Eichenholz und Stroh"]},"paradsasvar":{"s":"Parádsasvár ist ein Juwel im Herzen des Mátra-Gebirges, bekannt für seine aristokratische Vergangenheit und seine lange Tradition der Glasherstellung.","f":["Schlossarchitekt: Miklós Ybl","Hauptgebäude: Károlyi-Schloss (Neorenaissance)"]},"pilisszentkereszt":{"s":"Pilisszentkereszt ist ein bezauberndes Bergdorf im Herzen des Pilis-Gebirges, unweit von Budapest.","f":["Dobogókő ist mit 700 m der höchste Punkt des Visegráder Gebirges.","Das Zisterzienserkloster wurde 1184 gegründet."]},"poroszlo":{"s":"Poroszló liegt am rechten Ufer des Theiß-Sees im Komitat Heves und gilt als das wichtigste Zentrum für Ökotourismus in der nördlichen Tiefebene Ungarns.","f":["Beherbergt ein 735.000 Liter fassendes Süßwasser-Aquarium.","Erste urkundliche Erwähnung im Jahr 1209."]},"regec":{"s":"Regéc ist ein winziges, aber historisch bedeutendes Dorf im Herzen des Zemplén-Gebirges in Nordungarn.","f":["Die Burg Regéc liegt auf einer Höhe von 639 Metern über dem Meeresspiegel.","Franz II. Rákóczi lebte hier zwischen seinem 1. und 5. Lebensjahr."]},"revfulop":{"s":"Révfülöp ist ein traditionsreicher Bade- und Ferienort am Nordufer des Plattensees, der für seinen wichtigen Fährhafen und seine lebendige Atmosphäre bekannt ist.","f":["Wichtiger Fährhafen nach Balatonboglár.","Startpunkt des jährlichen Balaton-Durchschwimmens (5,2 km)."]},"rudabanya":{"s":"Rudabánya ist eine Kleinstadt im Norden Ungarns, die für ihre außergewöhnliche geologische und paläontologische Bedeutung weltberühmt ist.","f":["Der Rudabánya-See ist mit 60 Metern der tiefste See Ungarns.","Der Rudapithecus hungaricus ist etwa 10 Millionen Jahre alt."]},"salfold":{"s":"Salföld ist ein außergewöhnliches Architekturjuwel im Herzen des Káli-Beckens, das zum Nationalpark Balaton-Oberland gehört.","f":["Salföld wurde erstmals im Jahr 1307 urkundlich unter dem Namen Salsfölde erwähnt.","Der Ort liegt auf einer durchschnittlichen Höhe von 155 Metern über dem Meeresspiegel."]},"sarrod":{"s":"Sarród ist eine idyllische Gemeinde am südöstlichen Rand des Neusiedler Sees und gilt als das 'Tor zum Hanság'.","f":["Kócsagvár ist das größte Schilfdachgebäude Mitteleuropas.","Sarród liegt im Zentrum des UNESCO-Welterbes Fertő-Neusiedler See."]},"somlovasarhely":{"s":"Somlóvásárhely liegt am Fuße des majestätischen Somló-Berges, des kleinsten, aber charakteristischsten Weinbaugebiets Ungarns.","f":["Der Somló-Berg ist 432 Meter hoch und der kleinste Weinbezirk Ungarns.","Die Gemeinde wurde erstmals im Jahr 1011 in einer Urkunde erwähnt."]},"szalafo":{"s":"Szalafő gilt als das archaischste und am besten erhaltene Dorf in der ungarischen Region Őrség.","f":["Siedlungsform: 7 Weiler (Szerek)","Attraktion: Pityerszer Freilichtmuseum"]},"szentbekkalla":{"s":"Szentbékkálla ist eines der stimmungsvollsten Dörfer im Káli-Becken, eingebettet in die sanften Hügel des Balaton-Oberlandes.","f":["Das Steinmeer von Szentbékkálla ist Teil des Bakony-Balaton Geoparks.","Die Gemeinde wurde erstmals im Jahr 1273 urkundlich erwähnt."]},"szilvasvarad":{"s":"Szilvásvárad ist eines der bekanntesten und beliebtesten Touristenziele Ungarns, am westlichen Tor zum Bükk-Nationalpark gelegen.","f":["Lipizzaner-Zucht: Seit 1952 in Szilvásvárad","Szalajka-Tal Waldbahn: 4,5 km Länge"]},"tarcal":{"s":"Tarcal ist ein Juwel der Weinregion Tokaj-Hegyalja im Nordosten Ungarns, gelegen am südlichen Fuße des Berges Nagy-Kopasz.","f":["Die Christusstatue ist 8,5 Meter hoch und wiegt 50 Tonnen.","Tarcal war im 16. Jahrhundert Schauplatz von sechs wichtigen Synoden."]},"tarnaszentmaria":{"s":"Tarnaszentmária ist eines der kleinsten und friedlichsten Dörfer im Komitat Heves, doch es birgt einen architektonischen Schatz von unschätzbarem Wert.","f":["Status: Kleinste mittelalterliche Kirche Ungarns","Alter: Über 1000 Jahre (10.-11. Jh.)"]},"tolcsva":{"s":"Tolcsva ist eine der stimmungsvollsten Gemeinden der Weinregion Tokaj-Hegyalja und liegt im Tal des Tolcsva-Bachs.","f":["Tolcsva beherbergt fünf verschiedene Schlösser und Kurien.","Das Waldbott-Schloss wurde im Renaissance- und Barockstil erbaut."]},"vacratot":{"s":"Vácrátót ist eine charmante Gemeinde im Komitat Pest, etwa 30 Kilometer nördlich von Budapest.","f":["Der Botanische Garten erstreckt sich über 27 Hektar.","Gegründet wurde der Park in den 1870er Jahren von Graf Sándor Vigyázó."]},"velem":{"s":"Velem ist ein idyllisches Bergdorf im Kőszeg-Gebirge, das für sein gesundes Klima und seine reiche Geschichte bekannt ist.","f":["Höchster Punkt: Szent-Vid-Berg (568 m)","Besonderheit: Luftkurort für Atemwege"]},"vertesszolos":{"s":"Vértesszőlős ist eine weltweit bekannte Gemeinde im Komitat Komárom-Esztergom, am Fuße des Gerecse-Gebirges.","f":["Samu lebte vor etwa 350.000 Jahren.","Die Fundstelle wurde beim Abbau von Süßwasserkalk entdeckt."]},"zalavar":{"s":"Zalavár ist ein Ort von herausragender historischer und ökologischer Bedeutung im Südwesten Ungarns, gelegen am Ufer des Kis-Balaton (Kleiner Plattensee).","f":["Zalavár war im 9. Jahrhundert unter dem Namen Mosaburg bekannt.","Die St.-Adrian-Basilika war einst eines der größten Gotteshäuser Zentraleuropas."]}};
const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=6;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry","other"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
