arat.","Fondat în 1927 pentru producția de ciment."]},"armenia-masis-cities-v2":{"i":"/poi-images/armenia-masis-cities-v2.webp","s":"Masis este un important nod feroviar și centru industrial situat în provincia agricolă Ararat.","f":["Un nod important pentru transportul regional.","Situat în apropierea malului stâng al râului Hrazdan."]},"armenia-ashtarak-cities-v2":{"i":"/poi-images/armenia-ashtarak-cities-v2.webp","s":"Aștarak este un oraș antic care se întinde pe defileul râului Kasagh, bogat în poduri medievale și biserici vechi.","f":["Capitala provinciei Aragațotn.","Cunoscut pentru Karmravor și alte biserici antice."]},"armenia-sevan-cities-v2":{"i":"/poi-images/armenia-sevan-cities-v2.webp","s":"Sevan este o stațiune populară pe malul Lacului Sevan, cel mai mare corp de apă din Armenia.","f":["Găzduiește mănăstirea Sevanavank pe o peninsulă.","O destinație majoră pentru turismul de vară."]},"armenia-artik-cities-v2":{"i":"/poi-images/armenia-artik-cities-v2.webp","s":"Artik este recunoscut pe scară largă pentru carierele sale extinse de piatră de tuf, care au furnizat materiale de construcție în toată țara.","f":["Un centru major pentru extracția tufului roz.","Situat pe versanții Muntelui Aragaț."]},"armenia-dilijan-cities-v2":{"i":"/poi-images/armenia-dilijan-cities-v2.webp","s":"Adesea numită 'Elveția Armeană', Dilijan este un oraș stațiune înconjurat de păduri dense și parcuri naționale.","f":["Găzduiește United World College Dilijan.","Faimos pentru izvoarele sale de apă minerală."]},"armenia-sisian-cities-v2":{"i":"/poi-images/armenia-sisian-cities-v2.webp","s":"Sisian este un oraș istoric situat pe râul Vorotan, înconjurat de monumente megalitice antice și cascade.","f":["Aproape de vechiul observator Zorats Karer.","Faimos pentru Cascada Shaki din apropiere."]},"armenia-alaverdi-cities-v2":{"i":"/poi-images/armenia-alaverdi-cities-v2.webp","s":"Alaverdi este un oraș din defileul râului Debed, cunoscut istoric pentru operațiunile sale vaste de minerit 2.webp","s":"Mețamor este un oraș modern construit pentru a găzdui muncitorii singurei centrale nucleare din Armenia.","f":["Găzduiește Centrala Nucleară Armeană.","Prezintă un sit arheologic important din epoca bronzului."]},"armenia-tashir-cities-v2":{"i":"/poi-images/armenia-tashir-cities-v2.webp","s":"Tașir este un oraș din provincia Lori cunoscut pentru produsele lactate și clima alpină răcoroasă.","f":["Cunoscut anterior ca Kalinino.","Faimos pentru producerea brânzei de înaltă calitate Lori."]},"armenia-vayk-cities-v2":{"i":"/poi-images/armenia-vayk-cities-v2.webp","s":"Vaik este un mic oraș din sudul Armeniei, amplasat într-o vale și înconjurat de teren muntos accidentat.","f":["Un punct de tranzit major pe drumul spre Iran.","Redenumit din Azizbekov în 1990."]},"zangezur-copper-molybdenum-combine-economic-v2":{"i":"/poi-images/zangezur-copper-molybdenum-combine-economic-v2.webp","s":"Combinatul de Cupru și Molibden Zangezur este cea mai mare companie minieră din Armenia, situată în orașul Kajaran.","f":["Cea mai mare companie minieră din Armenia.","Situată în orașul Kajaran."]},"metsamor-nuclear-power-plant-economic-v2":{"i":"/poi-images/metsamor-nuclear-power-plant-economic-v2.webp","s":"Centrala Nucleară Metsamor este singura de acest fel din Caucazul de Sud și furnizează o parte semnificativă din electricitatea Armeniei.","f":["Singura centrală nucleară din Caucazul de Sud.","Furnizează o mare parte din energia Armeniei."]},"sevan-hrazdan-cascade-economic-v2":{"i":"/poi-images/sevan-hrazdan-cascade-economic-v2.webp","s":"Cascada Sevan-Hrazdan este un complex de hidrocentrale pe râul Hrazdan, care utilizează apa din Lacul Sevan.","f":["Complex de hidrocentrale pe râul Hrazdan.","Utilizează apa din Lacul Sevan."]},"yerevan-thermal-power-plant-economic-v2":{"i":"/poi-images/yerevan-thermal-power-plant-economic-v2.webp","s":"Centrala Termoelectrică Erevan este o mare centrală pe gaz din capitala Armeniei.","f":["Mare centrală pe gaz în capitală.","Modernizată cu o nouă unitate combinată în 2010."]},"hrazdan-thermal-power-plant-economic-v2":{"i":"/poi-images/hrazdan-thermal-power-plant-economic-v2.webp","s":"Centrala Termoelectrică Hrazdan este una dintre cele mai mari centrale din Armenia și utilizează în principal gaze naturale ca combustibil.","f":["Una dintre cele mai mari centrale electrice din țară.","Situată în provincia Kotayk."]},"amulsar-gold-mine-economic-v2":{"i":"/poi-images/amulsar-gold-mine-economic-v2.webp","s":"Mina de aur Amulsar este un mare proiect de extracție a aurului în provincia Vayots Dzor.","f":["Mare depozit de aur în provincia Vayots Dzor.","Dezvoltat de Lydian International."]},"sotk-gold-mine-economic-v2":{"i":"/poi-images/sotk-gold-mine-economic-v2.webp","s":"Mina de aur Sotk, situată în provincia Gegharkunik, este una dintre cele mai importante mine de aur din Armenia.","f":["Situată în provincia Gegharkunik, aproape de graniță.","Una dintre cele mai importante mine de aur din Armenia."]},"alaverdi-copper-smelter-economic-v2":{"i":"/poi-images/alaverdi-copper-smelter-economic-v2.webp","s":"Topitoria de cupru Alaverdi din provincia Lori este o uzină metalurgică istorică, cu origini care datează din secolul al XVIII-lea.","f":["Uzină metalurgică istorică în provincia Lori.","Operațiunile datează din secolul al XVIII-lea."]},"ararat-cement-factory-economic-v2":{"i":"/poi-images/ararat-cement-factory-economic-v2.webp","s":"Fabrica de Ciment Ararat este o mare unitate de producție care furnizează materiale de construcții pentru piața internă și pentru export.","f":["Unitate de producție de ciment la scară largă în provincia Ararat.","Furnizează materiale de construcții pentru piețele interne și de export."]},"yerevan-brandy-company-economic-v2":{"i":"/poi-images/yerevan-brandy-company-economic-v2.webp","s":"Fabrica de Coniac Erevan este celebrul producător al coniacului armean ArArAt și a fost fondată în 1887.","f":["Producător celebru de coniac armean, în special marca ArArAt.","Fondată în 1887 de Nerses Tairyan."]},"agarak-copper-molybdenum-mine-economic-v2":{"i":"/poi-images/agarak-copper-molybdenum-mine-economic-v2.webp","s":"Combinatul de Cupru și Molibden Agarak este situat în provincia Syunik, aproape de granița cu Iranul.","f":["Situat în provincia Syunik, aproape de granița cu Iranul.","Extrage și procesează minereuri de cupru și molibden."]},"hrazdan-cement-factory-economic-v2":{"i":"/poi-images/hrazdan-cement-factory-economic-v2.webp","s":"Fabrica de Ciment Hrazdan din provincia Kotayk a fost înființată în anii 1970 pentru a răspunde nevoilor tot mai mari de construcții.","f":["Un alt producător major de ciment, situat în Hrazdan.","Înființată în 1970 pentru a răspunde nevoilor crescânde de construcții."]},"zvartnots-cargo-terminal-economic-v2":{"i":"/poi-images/zvartnots-cargo-terminal-economic-v2.webp","s":"Terminalul Cargo al Aeroportului Internațional Zvartnots este principalul hub de transport aerian al Armeniei.","f":["Principalul hub de transport aerian pentru Armenia.","Gestionează importul și exportul internațional de mărfuri."]},"meghri-free-economic-zone-economic-v2":{"i":"/poi-images/meghri-free-economic-zone-economic-v2.webp","s":"Zona Economică Liberă Meghri, la granița cu Iranul, a fost înființată pentru a promova comerțul și cooperarea economică.","f":["Situată la granița cu Iranul.","Înființată pentru a stimula comerțul și cooperarea cu țările vecine."]},"shirak-airport-cargo-center-economic-v2":{"i":"/poi-images/shirak-airport-cargo-center-economic-v2.webp","s":"Centrul Cargo al Aeroportului Shirak din Gyumri servește ca al doilea hub de transport aerian al Armeniei.","f":["Facilitate secundară de transport aerian situată în Gyumri.","Deservește regiunile nordice ale Armeniei."]},"grand-tobacco-factory-economic-v2":{"i":"/poi-images/grand-tobacco-factory-economic-v2.webp","s":"Fabrica Grand Tobacco din Erevan este unul dintre cei mai mari producători de tutun din Caucaz.","f":["Una dintre cele mai mari companii producătoare de tutun din Caucaz.","Produce țigări atât pentru consumul intern, cât și pentru export."]},"spayka-greenhouse-complex-economic-v2":{"i":"/poi-images/spayka-greenhouse-complex-economic-v2.webp","s":"Complexul de sere Spayka din Valea Ararat este o instalație agricolă uriașă de înaltă tehnologie.","f":["Facilitate agricolă masivă de înaltă tehnologie în valea Ararat.","Specializată în cultivarea roșiilor și castraveților."]},"jermuk-mineral-water-factory-economic-v2":{"i":"/poi-images/jermuk-mineral-water-factory-economic-v2.webp","s":"Fabrica de Apă Minerală Jermuk îmbuteliază faimoasa apă minerală naturală din izvoarele din Jermuk.","f":["Îmbuteliază faimoasa apă minerală din izvoarele Jermuk.","Marca este recunoscută pe scară largă în Europa de Est și nu numai."]},"vorotan-cascade-economic-v2":{"i":"/poi-images/vorotan-cascade-economic-v2.webp","s":"Cascada Vorotan este un complex de trei hidrocentrale pe râul Vorotan, în provincia Syunik.","f":["Un complex de trei hidrocentrale pe râul Vorotan.","Include centralele Spandaryan, Shamb și Tatev."]},"nairit-chemical-plant-economic-v2":{"i":"/poi-images/nairit-chemical-plant-economic-v2.webp","s":"Uzina Chimică Nairit din Erevan a fost cândva un gigant al industriei chimice sovietice, producând cauciuc cloroprenic.","f":["Cândva un gigant al industriei chimice sovietice situat în Erevan.","Specializată în producția de cauciuc cloroprenic."]},"garni-temple-history-v2":{"i":"/poi-images/garni-temple-history-v2.webp","s":"Un templu elenistic clasic din Armenia, dedicat zeului soarelui Mithras.","f":["Construit în secolul I d.Hr.","Singura clădire greco-romană păstrată din Armenia."]},"geghard-monastery-history-v2":{"i":"/poi-images/geghard-monastery-history-v2.webp","s":"O mănăstire medievală săpată parțial în muntele adiacent, parte a Patrimoniului Mondial UNESCO.","f":["Fondată în secolul al IV-lea de Grigore Iluminătorul.","Numită după sulița care l-a rănit pe Iisus la cruce."]},"zvartnots-cathedral-history-v2":{"i":"/poi-images/zvartnots-cathedral-history-v2.webp","s":"Ruinele unei catedrale armene circulare din secolul al VII-lea, distrusă de un cutremur.","f":["Construită între anii 643 și 652.","Face parte din Patrimoniul Mondial UNESCO din 2000."]},"khor-virap-history-v2":{"i":"/poi-images/khor-virap-history-v2.webp","s":"Un loc de pelerinaj important cu vedere la Muntele Ararat, unde Grigore Iluminătorul a fost ținut prizonier.","f":["Grigore Iluminătorul a fost închis aici timp de 13 ani.","Este situat la doar câțiva kilometri de granița turcă închisă."]},"noravank-history-v2":{"i":"/poi-images/noravank-history-v2.webp","s":"O mănăstire din secolul al XIII-lea aflată într-un defileu îngust, faimoasă pentru stâncile sale roșiatice.","f":["Proiectată de faimosul arhitect Momik.","Biserica principală este Surb Astvatsatsin, o clădire cu două etaje."]},"tatev-monastery-history-v2":{"i":"/poi-images/tatev-monastery-history-v2.webp","s":"O mănăstire fortificată situată pe un mare platou de bazalt, care a fost un important centru intelectual în Evul Mediu.","f":["Fondată în secolul al IX-lea.","Telecabina Wings of Tatev duce spre mănăstire."]},"erebuni-fortress-history-v2":{"i":"/poi-images/erebuni-fortress-history-v2.webp","s":"Un oraș fortificat urartian, considerat predecesorul orașului modern Erevan.","f":["Construită în 782 î.Hr. de regele Argishti I.","Numele Erebuni a evoluat ulterior în Erevan."]},"sardarapat-memorial-history-v2":{"i":"/poi-images/sardarapat-memorial-history-v2.webp","s":"Un memorial dedicat Bătăliei de la Sardarapat din 1918, care a salvat națiunea armeană.","f":["Inaugurat în 1968 pentru a marca a 50-a aniversare a bătăliei.","Include și un muzeu de etnografie."]},"tsitsernakaberd-history-v2":{"i":"/poi-images/tsitsernakaberd-history-v2.webp","s":"Memorialul oficial al Armeniei dedicat victimelor genocidului armean din 1915.","f":["Obeliscul înalt de 44 de metri simbolizează renașterea națională.","O flacără eternă arde în centrul celor 12 stâlpi."]},"mother-armenia-history-v2":{"i":"/poi-images/mother-armenia-history-v2.webp","s":"O statuie monumentală în Erevan care simbolizează pacea prin putere.","f":["A înlocuit o statuie monumentală a lui Stalin în 1967.","Piedestalul adăpostește un muzeu militar."]},"haghpat-monastery-history-v2":{"i":"/poi-images/haghpat-monastery-history-v2.webp","s":"Un complex monahal medieval în nordul Armeniei, construit în secolul al X-lea.","f":["A fost fondată de regina Khosrovanuysh.","Face parte din Patrimoniul Mondial UNESCO din 1996."]},"sanahin-monastery-history-v2":{"i":"/poi-images/sanahin-monastery-history-v2.webp","s":"Un important centru religios și cultural din Armenia medievală, situat lângă Haghpat.","f":["Numele înseamnă »aceasta este mai veche decât cealaltă«.","Faimoasă pentru școala de caligrafi și biblioteca sa medievală."]},"amberd-fortress-history-v2":{"i":"/poi-images/amberd-fortress-history-v2.webp","s":"O cetate ruinată din secolul al VII-lea, situată la 2.300 de metri altitudine pe versantul muntelui Aragats.","f":["Numele se traduce prin »Cetatea din nori«.","A fost cucerită de turcii selgiucizi în secolul al XI-lea."]},"smbataberd-fortress-history-v2":{"i":"/poi-images/smbataberd-fortress-history-v2.webp","s":"O impresionantă fortăreață medievală în provincia Vayots Dzor, situată pe o creastă înaltă.","f":["Construită în secolul al X-lea de dinastia Orbelian.","Zidurile sale masive au rămas mult timp de necucerit."]},"karahunj-history-v2":{"i":"/poi-images/karahunj-history-v2.webp","s":"Un sit arheologic preistoric, numit adesea »Stonehenge-ul armenesc«.","f":["Este compus din peste 200 de pietre masive de bazalt.","Multe pietre au găuri misterioase în partea superioară."]},"oshakan-church-history-v2":{"i":"/poi-images/oshakan-church-history-v2.webp","s":"O biserică construită deasupra mormântului lui Mesrop Maștoț, inventatorul alfabetului armean.","f":["Inventatorul alfabetului armean este înmormântat aici.","Alfabetul armean a fost creat în anul 405."]},"akhtala-monastery-history-v2":{"i":"/poi-images/akhtala-monastery-history-v2.webp","s":"O mănăstire fortificată din secolul al X-lea, cunoscută pentru frescele sale medievale bine conservate.","f":["Frescele combină stilurile artistice bizantin și armean.","A fost construită de prinții dinastiei Bagratid."]},"dashtadem-fortress-history-v2":{"i":"/poi-images/dashtadem-fortress-history-v2.webp","s":"O vastă cetate medievală, extinsă continuu din secolul al X-lea până în secolul al XIX-lea.","f":["Este formată din două ziduri masive de apărare.","A servit la protejarea granițelor vestice ale Armeniei."]},"aruchavank-history-v2":{"i":"/poi-images/aruchavank-history-v2.webp","s":"Rămășițele uneia dintre cele mai mari biserici din Armenia, din secolul al VII-lea, cu un fost dom imens.","f":["Domul enorm s-a prăbușit într-un cutremur.","Făcea parte dintr-un mare complex palatinal."]},"odzun-church-history-v2":{"i":"/poi-images/odzun-church-history-v2.webp","s":"O importantă bazilică armeană din secolul al VI-lea, înconjurată de o arcadă largă.","f":["Una dintre cele mai vechi și mari bazilici păstrate din Armenia.","Pe teren se află un monument funerar unic."]},"armenia-khor-virap-landmarks-v2":{"i":"/poi-images/armenia-khor-virap-landmarks-v2.webp","s":"O mănăstire în câmpia Ararat, renumită pentru priveliștile sale uimitoare către muntele Ararat.","f":["Grigorie Luminătorul a fost întemnițat aici timp de 13 ani.","Unul dintre cele mai vizitate locuri de pelerinaj din Armenia."]},"armenia-sevanavank-landmarks-v2":{"i":"/poi-images/armenia-sevanavank-landmarks-v2.webp","s":"Un complex monahal pe o peninsulă de pe malul de nord-vest al lacului Sevan, cu vederi pitorești.","f":["Fondat în secolul al IX-lea de prințesa Mariam.","Construit inițial pe o insulă."]},"armenia-echmiadzin-cathedral-landmarks-v2":{"i":"/poi-images/armenia-echmiadzin-cathedral-landmarks-v2.webp","s":"Biserica mamă a Bisericii Apostolice Armene și centrul creștinătății armene.","f":["Considerată prima catedrală construită de stat din lume.","Construită inițial în secolul al IV-lea."]},"armenia-noravank-landmarks-v2":{"i":"/poi-images/armenia-noravank-landmarks-v2.webp","s":"O mănăstire într-un defileu îngust de pe râul Amaghu, renumită pentru stâncile sale roșiatice de calcar.","f":["Fondată în anul 1205.","Biserica cu două etaje Surb Astvatsatsin este o capodoperă."]},"armenia-cascade-complex-landmarks-v2":{"i":"/poi-images/armenia-cascade-complex-landmarks-v2.webp","s":"O scară uriașă din calcar care leagă centrul orașului Erevan de cartierul Monument.","f":["Construcția a început în anii 1970.","Găzduiește Centrul de Arte Cafesjian."]},"armenia-republic-square-landmarks-v2":{"i":"/poi-images/armenia-republic-square-landmarks-v2.webp","s":"Piața centrală a orașului Erevan, renumită pentru clădirile sale impresionante din tuf vulcanic roz și fântânile cântătoare.","f":["Proiectată de Alexander Tamanian în 1924.","Considerată cel mai important ansamblu arhitectural al orașului."]},"armenia-matenadaran-landmarks-v2":{"i":"/poi-images/armenia-matenadaran-landmarks-v2.webp","s":"Un muzeu și depozit de manuscrise antice care găzduiește una dintre cele mai mari colecții de documente medievale din lume.","f":["Păstrează peste 17.000 de manuscrise antice.","Numit după Mesrop Maștoț, creatorul alfabetului armean."]},"armenia-zorats-karer-landmarks-v2":{"i":"/poi-images/armenia-zorats-karer-landmarks-v2.webp","s":"Un monument arheologic preistoric, adesea numit Stonehenge-ul armean, format din sute de pietre mari așezate vertical.","f":["Multe pietre au mici găuri care sugerează un scop astronomic.","Vârsta este estimată la aproximativ 7500 de ani."]},"armenia-symphony-of-stones-landmarks-v2":{"i":"/poi-images/armenia-symphony-of-stones-landmarks-v2.webp","s":"Un monument natural impresionant în defileul Garni, format din coloane de bazalt hexagonale simetrice care seamănă cu o orgă gigantică.","f":["S-a format prin răcirea lentă a lavei.","Face parte din rețeaua de geoparcuri UNESCO."]},"armenia-akhtala-fortress-landmarks-v2":{"i":"/poi-images/armenia-akhtala-fortress-landmarks-v2.webp","s":"O mănăstire fortificată din secolul al X-lea care a jucat un rol crucial în protejarea regiunilor de nord-vest.","f":["Renumită pentru frescele sale extrem de bine conservate.","Construită de dinastia armeană Kiurikian."]},"armenia-alphabet-monument-landmarks-v2":{"i":"/poi-images/armenia-alphabet-monument-landmarks-v2.webp","s":"Un monument arhitectural pe versantul muntelui Aragaț, format din 39 de litere armene uriașe sculptate în tuf vulcanic.","f":["Construit în 2005 pentru a sărbători a 1600-a aniversare a alfabetului armean.","Alfabetul a fost creat în anul 405 d.Hr."]},"armenia-vernissage-landmarks-v2":{"i":"/poi-images/armenia-vernissage-landmarks-v2.webp","s":"O mare piață în aer liber în centrul Erevanului, cunoscută pentru vânzarea de opere de artă și covoare tradiționale armenești.","f":["A început în anii 1980 ca un loc de întâlnire pentru artiști.","Oferă totul, de la bijuterii la sculpturi în lemn."]},"armenia-botanical-garden-yerevan-life-v2":{"i":"/poi-images/armenia-botanical-garden-yerevan-life-v2.webp","s":"Grădina Botanică din Erevan este un parc extins care găzduiește o mare varietate de specii de plante caucaziene și internaționale.","f":["A fost fondată în 1935.","Acoperă o suprafață de 80 de hectare."]},"armenia-yerevan-zoo-life-v2":{"i":"/poi-images/armenia-yerevan-zoo-life-v2.webp","s":"Grădina zoologică din capitală oferă familiilor ocazia de a observa îndeaproape peste două mii de animale de pe diverse continente.","f":["A fost deschisă în 1940.","Găzduiește aproximativ 274 de specii de animale."]},"armenia-english-park-yerevan-life-v2":{"i":"/poi-images/armenia-english-park-yerevan-life-v2.webp","s":"Unul dintre cele mai vechi parcuri din Erevan, creat în secolul al XIX-lea, atrăgând vizitatori cu monumentele sale clasice.","f":["Amenajat în 1860.","Folosit des ca fundal pentru fotografii de nuntă."]},"armenia-lovers-park-yerevan-life-v2":{"i":"/poi-images/armenia-lovers-park-yerevan-life-v2.webp","s":"O grădină japoneză frumos amenajată în centrul Erevanului, servind ca punct de întâlnire romantic pentru cupluri.","f":["Datează din secolul al XVIII-lea.","Renovat în stil japonez în 2008."]},"armenia-tumanyan-park-life-v2":{"i":"/poi-images/armenia-tumanyan-park-life-v2.webp","s":"Un parc urban extins numit după celebrul poet armean Hovhannes Tumanyan, ideal pentru plimbări și recreere.","f":["Situat în defileul Hrazdan.","A fost deschis în 1970."]},"armenia-victory-park-life-v2":{"i":"/poi-images/armenia-victory-park-life-v2.webp","s":"Un mare parc de distracții pe un deal, oferind pe lângă atracții și o priveliște uluitoare asupra Erevanului.","f":["Găzduiește statuia Mama Armenia.","Comemorează victoria sovietică din al Doilea Război Mondial."]},"armenia-ijevan-dendropark-life-v2":{"i":"/poi-images/armenia-ijevan-dendropark-life-v2.webp","s":"Un arboret pitoresc în regiunea Tavush, cunoscut pentru colecția sa de conifere rare și aleile liniștite pentru plimbări.","f":["A fost fondat în 1962.","Găzduiește peste 650 de specii de plante."]},"armenia-stepanavan-dendropark-life-v2":{"i":"/poi-images/armenia-stepanavan-dendropark-life-v2.webp","s":"Cea mai mare grădină botanică din Armenia, situată adânc în regiunea împădurită Lori, oferind o atmosferă pașnică.","f":["Acoperă 35 de hectare de pădure.","A fost fondat în 1931 de biologul polonez Edmon Leonowicz."]},"armenia-erebuni-state-reserve-life-v2":{"i":"/poi-images/armenia-erebuni-state-reserve-life-v2.webp","s":"O zonă protejată pentru conservarea speciilor rare de grâu sălbatic și a florei endemice din regiunea Caucazului.","f":["Se întinde pe 120 de hectare.","Protejează grâul sălbatic Triticum urartu."]},"armenia-sev-lich-sanctuary-life-v2":{"i":"/poi-images/armenia-sev-lich-sanctuary-life-v2.webp","s":"Un lac de crater protejat în munții vulcanici din Syunik, care servește ca sursă de apă potabilă și habitat pentru păsări de apă.","f":["Situat la o altitudine de peste 2600 de metri.","Apa este aproape rece ca gheața."]},"armenia-goris-state-sanctuary-life-v2":{"i":"/poi-images/armenia-goris-state-sanctuary-life-v2.webp","s":"O zonă cu defileuri adânci și peșteri, dedicată protejării leopardului caucazian pe cale de dispariție și a altor animale mari.","f":["Cunoscut pentru formațiunile sale stâncoase unice.","Găzduiește urși bruni și râși."]},"armenia-zangezur-sanctuary-life-v2":{"i":"/poi-images/armenia-zangezur-sanctuary-life-v2.webp","s":"O zonă montană accidentată în sudul Armeniei, care servește ca habitat crucial pentru caprele bezoar pe cale de dispariție.","f":["Fondată în 2009.","Se învecinează direct cu zona Parcului Național Arevik."]},"armenia-ararat-valley-vineyards-life-v2":{"i":"/poi-images/armenia-ararat-valley-vineyards-life-v2.webp","s":"Versanții însoriți de la poalele Muntelui Ararat produc unii dintre cei mai buni struguri pentru producția de vin din Caucaz.","f":["Una dintre cele mai vechi regiuni viticole din lume.","Beneficiază de solul vulcanic."]},"armenia-areni-wine-region-life-v2":{"i":"/poi-images/armenia-areni-wine-region-life-v2.webp","s":"Regiunea muntoasă Areni este faimoasă la nivel mondial pentru soiurile sale antice de struguri și vinificația tradițională armeană în vase de lut.","f":["Peștera Areni-1 prezintă o vinificație veche de 6000 de ani.","Cunoscută pentru vinul Areni Noir."]},"armenia-armavir-apricot-orchards-life-v2":{"i":"/poi-images/armenia-armavir-apricot-orchards-life-v2.webp","s":"Vaste plantații din vestul Armeniei cultivă legendara caisă armeană, adânc înrădăcinată în cultura națională.","f":["Caisa se numește științific Prunus armeniaca.","Armenia exportă tone de caise proaspete."]},"armenia-vayots-dzor-pomegranate-orchards-life-v2":{"i":"/poi-images/armenia-vayots-dzor-pomegranate-orchards-life-v2.webp","s":"Condițiile calde și uscate din Vayots Dzor sunt ideale pentru cultivarea rodiilor, simbolul vieții în Armenia.","f" k-nature-v2.webp","s":"Parcul Național Dilijan este renumit pentru pădurile sale dese, lacurile și biodiversitatea bogată.","f":["Înființat în anul 2002.","Acoperă o suprafață de 240 km²."]},"khosrov-forest-nature-v2":{"i":"/poi-images/khosrov-forest-nature-v2.webp","s":"Rezervația de stat Pădurea Khosrov este una dintre cele mai vechi arii naturale protejate din lume.","f":["Înființată în secolul al IV-lea.","Protejează leoparzi caucazieni rari."]},"shikahogh-reserve-nature-v2":{"i":"/poi-images/shikahogh-reserve-nature-v2.webp","s":"Rezervația Shikahogh protejează păduri dese de stejar și carpen în sudul Armeniei.","f":["Situată în provincia Syunik.","Habitat pentru urși și lupi."]},"mount-kaputjugh-nature-v2":{"i":"/poi-images/mount-kaputjugh-nature-v2.webp","s":"Muntele Kaputjugh este al doilea cel mai înalt munte din Armenia, formând granița cu Nahicevan.","f":["Înălțime de 3.905 metri.","Face parte din Munții Zangezur."]},"hrazdan-river-nature-v2":{"i":"/poi-images/hrazdan-river-nature-v2.webp","s":"Râul Hrazdan este un râu important din Armenia, care izvorăște din Lacul Sevan și traversează Erevanul.","f":["Lungime de 141 de kilometri.","Se varsă în râul Aras."]},"aras-river-nature-v2":{"i":"/poi-images/aras-river-nature-v2.webp","s":"Râul Aras marchează granița de sud a Armeniei și joacă un rol important în istoria regiunii.","f":["Lungime totală de peste 1.000 km.","Se varsă în Marea Caspică."]},"lake-arpi-nature-v2":{"i":"/poi-images/lake-arpi-nature-v2.webp","s":"Lacul Arpi este situat în nord-vestul Armeniei și reprezintă centrul parcului național omonim.","f":["La o altitudine de 2.025 metri.","Loc important de popas pentru păsările migratoare."]},"arevik-national-park-nature-v2":{"i":"/poi-images/arevik-national-park-nature-v2.webp","s":"Parcul Național Arevik din extremitatea sudică a Armeniei protejează specii rare de animale și peisaje montane.","f":["Înființat în 2009.","Suprafață de peste 344 km²."]},"mount-azhdahak-nature-v2":{"i":"/poi-images/mount-azhdahak-nature-v2.webp","s":"Muntele Azhdahak este cel mai înalt punct al Munților Geghama, având un lac de crater pe vârf.","f":["Înălțime de 3.597 metri.","Renumit pentru petroglife antice."]},"vorotan-river-nature-v2":{"i":"/poi-images/vorotan-river-nature-v2.webp","s":"Râul Vorotan sapă un defileu adânc în sudul Armeniei, renumit pentru frumusețea sa peisagistică.","f":["Lungime de 178 de kilometri.","Curge prin provincia Syunik."]},"lake-kari-nature-v2":{"i":"/poi-images/lake-kari-nature-v2.webp","s":"Lacul Kari este un lac alpin situat la poalele Muntelui Aragaț, format în mare parte din apă de topire.","f":["Situat la 3.185 metri altitudine.","Este alimentat de zăpadă."]},"kasagh-river-nature-v2":{"i":"/poi-images/kasagh-river-nature-v2.webp","s":"Râul Kasagh curge prin vestul Armeniei și a creat un defileu adânc de-a lungul căruia se află multe mănăstiri.","f":["Lungime de 89 de kilometri.","Taie prin rocă vulcanică."]},"lake-akna-nature-v2":{"i":"/poi-images/lake-akna-nature-v2.webp","s":"Lacul Akna este un lac de crater pitoresc din Munții Geghama, înconjurat de pajiști alpine.","f":["La o altitudine de 3.030 metri.","Suprafață de doar 0,8 km²."]},"debed-river-nature-v2":{"i":"/poi-images/debed-river-nature-v2.webp","s":"Râul Debed curge prin defileuri adânci și împădurite în nordul Armeniei, îndreptându-se spre Georgia.","f":["Lungime de 176 de kilometri.","Parte a bazinului Kura."]},"lake-parz-nature-v2":{"i":"/poi-images/lake-parz-nature-v2.webp","s":"Lacul Parz este un mic lac de pădure în Parcul Național Dilijan, renumit pentru apele sale cristaline.","f":["Numele înseamnă „lac clar”.","Destinație populară pentru drumeții."]},"mount-khustup-nature-v2":{"i":"/poi-images/mount-khustup-nature-v2.webp","s":"Muntele Khustup este un munte proeminent în sudul Armeniei, cu versanți acoperiți de păduri dese și pajiști alpine.","f":["Înălțime de 3.201 metri.","Loc sacru în cultura armeană."]},"sevan-national-park-nature-v2":{"i":"/poi-images/sevan-national // Drag uses a MOVE THRESHOLD: pointerdown only ARMS panning; we don't capture the
// pointer until it actually moves >4px. A click without movement therefore reaches

});

function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));

    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;

function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}

// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Search-only entries (POIs on a sub-map): match by name, navigate to the sub-map.
  const extraHits=[];
  for(const e of SEARCH_EXTRA){if(e.s.includes(q)&&extraHits.length<20)extraHits.push(e)}
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0&&extraHits.length===0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0&&extraHits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  const exRow=e=>'<a data-extra="1" href="'+e.u+'"><span class="dot" style="background:#ffd54a"></span><span class="nm">'+e.n.replace(/[<>]/g,'')+'</span><span class="gr">›</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('')+extraHits.map(exRow).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const ax=e.target.closest('a[data-extra]');
  if(ax)return; // sub-map link: let the browser navigate
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
