const POI_CARD={"armenia-yerevan-cities-v2":{"i":"/poi-images/armenia-yerevan-cities-v2.webp","s":"Erivan ist die Hauptstadt und größte Stadt Armeniens, bekannt als die rosa Stadt wegen ihrer Gebäude aus vulkanischem Tuffstein.","f":["Gegründet 782 v. Chr. als Erebuni.","Beherbergt den massiven Kaskaden-Komplex."]},"armenia-gyumri-cities-v2":{"i":"/poi-images/armenia-gyumri-cities-v2.webp","s":"Gjumri ist die zweitgrößte Stadt in Armenien, berühmt für ihre historische Architektur und ihr reiches kulturelles Erbe.","f":["Wurde durch das Erdbeben 1988 schwer beschädigt.","Bekannt als die Kulturhauptstadt Armeniens."]},"armenia-vanadzor-cities-v2":{"i":"/poi-images/armenia-vanadzor-cities-v2.webp","s":"Wanadsor ist eine Industrie- und Kurstadt im Norden Armeniens, umgeben von malerischen Bergen und Wäldern.","f":["Früher bekannt als Kirowakan.","Hauptstadt der Provinz Lori."]},"armenia-vagharshapat-cities-v2":{"i":"/poi-images/armenia-vagharshapat-cities-v2.webp","s":"Oft als Etschmiadsin bezeichnet, ist diese Stadt das spirituelle Zentrum der armenisch-apostolischen Kirche.","f":["Sitz des Muttersitzes des heiligen Etschmiadsin.","Eine der ältesten kontinuierlich bewohnten Städte Armeniens."]},"armenia-abovyan-cities-v2":{"i":"/poi-images/armenia-abovyan-cities-v2.webp","s":"Abowjan ist eine moderne Industriestadt nördlich von Erivan, die als wichtige Satellitenstadt dient.","f":["Benannt nach dem Schriftsteller Chatschatur Abowjan.","Wurde während der Sowjetära schnell entwickelt."]},"armenia-kapan-cities-v2":{"i":"/poi-images/armenia-kapan-cities-v2.webp","s":"Kapan ist die Hauptstadt der Provinz Sjunik und liegt in einem üppigen Tal, das von hohen Bergen umgeben ist.","f":["Ein bedeutendes Zentrum für den Kupferbergbau.","Die Stadt wird vom Berg Chustup überschattet."]},"armenia-hrazdan-cities-v2":{"i":"/poi-images/armenia-hrazdan-cities-v2.webp","s":"Hrasdan ist ein wichtiges Industriezentrum in der Provinz Kotajk, gelegen an den Ufern des Flusses Hrasdan.","f":["Beherbergt ein bedeutendes Wärmekraftwerk.","Hauptstadt der Provinz Kotajk."]},"armenia-armavir-cities-v2":{"i":"/poi-images/armenia-armavir-cities-v2.webp","s":"Armawir ist eine alte Stadt, die einst eine der historischen Hauptstädte Armeniens war und heute ein modernes Verwaltungszentrum ist.","f":["Hauptstadt der Provinz Armawir.","Gelegen in der fruchtbaren Ararat-Ebene."]},"armenia-artashat-cities-v2":{"i":"/poi-images/armenia-artashat-cities-v2.webp","s":"Artaschat ist die Hauptstadt der Provinz Ararat, erbaut in der Nähe der Ruinen der gleichnamigen antiken armenischen Hauptstadt.","f":["Bekannt für sein prominentes Weingut.","Gegründet von König Artaxias I. im Jahr 176 v. Chr."]},"armenia-ijevan-cities-v2":{"i":"/poi-images/armenia-ijevan-cities-v2.webp","s":"Idschewan ist eine waldreiche Stadt im Nordosten Armeniens, berühmt für ihre Teppiche, Weine und malerischen Landschaften.","f":["Hauptstadt der Provinz Tawusch.","Bekannt als Zentrum der Holzschnitzerei in der Region."]},"armenia-gavar-cities-v2":{"i":"/poi-images/armenia-gavar-cities-v2.webp","s":"Gawar ist eine Bergstadt in der Nähe des Sewansees, bekannt für ihre kalten Winter und historischen Denkmäler.","f":["Hauptstadt der Provinz Gegharkunik.","Berühmt für ein traditionelles Gebäck namens Pachlawa."]},"armenia-goris-cities-v2":{"i":"/poi-images/armenia-goris-cities-v2.webp","s":"Goris ist berühmt für seinen gitterförmigen Straßenplan und die umliegenden Höhlenwohnungen, die in den weichen Fels gehauen wurden.","f":["Weist einzigartige Steinpyramidenformationen auf.","Ein wichtiger Halt auf dem Weg nach Arzach."]},"armenia-charentsavan-cities-v2":{"i":"/poi-images/armenia-charentsavan-cities-v2.webp","s":"Tscharenzawan wurde Mitte des 20.","f":["Benannt nach dem Dichter Jeghische Tscharenz.","Wuchs um ein großes Wasserkraftwerk herum."]},"armenia-ararat-cities-v2":{"i":"/poi-images/armenia-ararat-cities-v2.webp","s":"Die Stadt Ararat ist eine Industriestadt in der Ararat-Ebene, die vor allem für akaberd-history-v2.webp","s":"Die offizielle Gedenkstätte Armeniens für die Opfer des Völkermords an den Armeniern im Jahr 1915.","f":["Der 44 Meter hohe Obelisk symbolisiert die nationale Wiedergeburt der Armenier.","Eine ewige Flamme brennt im Zentrum der 12 Pylonen."]},"mother-armenia-history-v2":{"i":"/poi-images/mother-armenia-history-v2.webp","s":"Eine monumentale Statue in Jerewan, die den Frieden durch Stärke symbolisiert.","f":["Ersetzte 1967 eine monumentale Statue von Josef Stalin.","Das Podest beherbergt ein Militärmuseum."]},"haghpat-monastery-history-v2":{"i":"/poi-images/haghpat-monastery-history-v2.webp","s":"Ein mittelalterlicher Klosterkomplex im Norden Armeniens, der im 10.","f":["Wurde von Königin Chosrowanusch gegründet.","Gehört seit 1996 zum UNESCO-Welterbe."]},"sanahin-monastery-history-v2":{"i":"/poi-images/sanahin-monastery-history-v2.webp","s":"Ein bedeutendes religiöses und kulturelles Zentrum des mittelalterlichen Armeniens, nahe Haghpat gelegen.","f":["Der Name bedeutet auf Armenisch »dieses ist älter als jenes«.","Berühmt für seine mittelalterliche Schreibschule und Bibliothek."]},"amberd-fortress-history-v2":{"i":"/poi-images/amberd-fortress-history-v2.webp","s":"Eine Festungsruine aus dem 7.","f":["Der Name bedeutet »Festung in den Wolken«.","Wurde im 11. Jahrhundert von den Seldschuken eingenommen."]},"smbataberd-fortress-history-v2":{"i":"/poi-images/smbataberd-fortress-history-v2.webp","s":"Eine beeindruckende mittelalterliche Festung in der Provinz Wajoz Dsor, die auf einem hohen Bergkamm liegt.","f":["Wurde im 10. Jahrhundert von der Orbelian-Dynastie erbaut.","Ihre massiven Mauern blieben lange Zeit uneinnehmbar."]},"karahunj-history-v2":{"i":"/poi-images/karahunj-history-v2.webp","s":"Eine prähistorische archäologische Stätte, die oft als das »armenische Stonehenge« bezeichnet wird.","f":["Besteht aus über 200 großen Basaltsteinen.","Viele der Steine weisen rätselhafte Löcher auf."]},"oshakan-church-history-v2":{"i":"/poi-imag sten Parks in Eriwan, der im 19.","f":["Im Jahr 1860 angelegt.","Oft als Kulisse für Hochzeitsfotos genutzt."]},"armenia-lovers-park-yerevan-life-v2":{"i":"/poi-images/armenia-lovers-park-yerevan-life-v2.webp","s":"Ein wunderschön gestalteter japanischer Garten im Zentrum von Eriwan, der als romantischer Treffpunkt für Paare dient.","f":["Stammt aus dem 18. Jahrhundert.","2008 im japanischen Stil renoviert."]},"armenia-tumanyan-park-life-v2":{"i":"/poi-images/armenia-tumanyan-park-life-v2.webp","s":"Ein weitläufiger Stadtpark benannt nach dem berühmten armenischen Dichter Howhannes Tumanjan, ideal für Spaziergänge und Erholung.","f":["Liegt in der Hrasdan-Schlucht.","Wurde 1970 eröffnet."]},"armenia-victory-park-life-v2":{"i":"/poi-images/armenia-victory-park-life-v2.webp","s":"Ein großer Vergnügungspark auf einem Hügel, der neben Fahrgeschäften auch einen atemberaubenden Blick über Eriwan bietet.","f":["Beherbergt die Mutter Armenien-Statue.","Erinnert an den sowjetischen Sieg im Zweiten Weltkrieg."]},"armenia-ijevan-dendropark-life-v2":{"i":"/poi-images/armenia-ijevan-dendropark-life-v2.webp","s":"Ein malerisches Arboretum in der Region Tawusch, das für seine Sammlung seltener Nadelbäume und ruhigen Spazierwege bekannt ist.","f":["Wurde 1962 gegründet.","Beherbergt über 650 Pflanzenarten."]},"armenia-stepanavan-dendropark-life-v2":{"i":"/poi-images/armenia-stepanavan-dendropark-life-v2.webp","s":"Der größte botanische Garten Armeniens, der sich tief in der bewaldeten Region Lori befindet und eine friedliche Atmosphäre bietet.","f":["Umfasst 35 Hektar Waldfläche.","Wurde 1931 vom polnischen Biologen Edmon Leonowicz gegründet."]},"armenia-erebuni-state-reserve-life-v2":{"i":"/poi-images/armenia-erebuni-state-reserve-life-v2.webp","s":"Ein Schutzgebiet zur Erhaltung seltener Wildweizenarten und endemischer Flora der Kaukasusregion.","f":["Erstreckt sich über 120 Hektar.","Schützt wilden Triticum urartu Weizen."]},"armenia-sev-lich-sanctuary-life-v2":{"i":"/poi-images/armenia-sev-lich-sanctuary-life-v2.webp","s":"Ein geschützter Kratersee im Vulkangebirge von Sjunik, der als Trinkwasserquelle und Lebensraum für Wasservögel dient.","f":["Liegt auf über 2600 Metern Höhe.","Das Wasser ist fast eiskalt."]},"armenia-goris-state-sanctuary-life-v2":{"i":"/poi-images/armenia-goris-state-sanctuary-life-v2.webp","s":"Ein Gebiet mit tiefen Schluchten und Höhlen, das dem Schutz des bedrohten kaukasischen Leoparden und anderer Großtiere dient.","f":["Bekannt für die einzigartigen Felsformationen.","Beherbergt Braunbären und Luchse."]},"armenia-zangezur-sanctuary-life-v2":{"i":"/poi-images/armenia-zangezur-sanctuary-life-v2.webp","s":"Ein raues Berggebiet im Süden Armeniens, das als entscheidendes Habitat für die vom Aussterben bedrohten Bezoarziegen fungiert.","f":["Gegründet im Jahr 2009.","Grenzt direkt an das Arewik-Nationalparkgebiet."]},"armenia-ararat-valley-vineyards-life-v2":{"i":"/poi-images/armenia-ararat-valley-vineyards-life-v2.webp","s":"Die sonnenverwöhnten Hänge am Fuße des Berges Ararat bringen einige der besten Weintrauben für die Weinproduktion im Kaukasus hervor.","f":["Eine der ältesten Weinbauregionen der Welt.","Profitiert vom vulkanischen Boden."]},"armenia-areni-wine-region-life-v2":{"i":"/poi-images/armenia-areni-wine-region-life-v2.webp","s":"Die bergige Region Areni ist weltberühmt für ihre alten Rebsorten und die traditionelle armenische Weinherstellung in Tonkrügen.","f":["Die Höhle von Areni-1 zeigt 6000 Jahre alten Weinbau.","Bekannt für den Areni Noir-Wein."]},"armenia-armavir-apricot-orchards-life-v2":{"i":"/poi-images/armenia-armavir-apricot-orchards-life-v2.webp","s":"Weite Plantagen im Westen Armeniens kultivieren die legendäre armenische Aprikose, die tief in der nationalen Kultur verwurzelt ist.","f":["Die Aprikose heißt wissenschaftlich Prunus armeniaca.","Armenien exportiert tonnenweise frische Aprikosen."]},"armenia-vayots-dzor-pomegranate-orchards-life-v2":{"i":"/poi-images/armenia-vayots-dzor-pomegranate-orchards-life-v2.webp","s":"Die warmen und trockenen Bedingungen in Wajoz Dsor sind ideal für den Anbau von Granatäpfeln, dem Symbol des Lebens in Armenien.","f":["Der Granatapfel steht für Fruchtbarkeit und Glück.","Wird für Säfte und traditionelle Weine geerntet."]},"armenia-shirak-wheat-fields-life-v2":{"i":"/poi-images/armenia-shirak-wheat-fields-life-v2.webp","s":"Die weiten, goldenen Weizenfelder in der Provinz Schirak sichern die Getreideversorgung des Landes und prägen die flache Landschaft.","f":["Schirak ist die Kornkammer Armeniens.","Wird hauptsächlich im Trockenfeldbau kultiviert."]},"armenia-gegharkunik-potato-farms-life-v2":{"i":"/poi-images/armenia-gegharkunik-potato-farms-life-v2.webp","s":"Die kühlen klimatischen Bedingungen rund um den Sewansee eignen sich hervorragend für den Anbau hochwertiger armenischer Kartoffeln.","f":["Ein Hauptbestandteil der ländlichen Wirtschaft in Gegharkunik.","Die Kartoffeln sind für ihren einzigartigen Geschmack bekannt."]},"armenia-water-world-yerevan-life-v2":{"i":"/poi-images/armenia-water-world-yerevan-life-v2.webp","s":"Ein großes Freibad in der Hauptstadt, das in den heißen Sommermonaten erfrischende Rutschen und Wellenbäder für die ganze Familie bietet.","f":["Im Jahr 2001 eröffnet.","Verfügt über mehrere große Wasserrutschen."]},"armenia-play-city-yerevan-life-v2":{"i":"/poi-images/armenia-play-city-yerevan-life-v2.webp","s":"Ein modernes Unterhaltungszentrum, das eine Vielzahl von Indoor- und Outdoor-Aktivitäten wie Kartfahren und Minigolf bietet.","f":["Bietet eine große Bowlingbahn.","Zahlreiche Arcade-Spiele für Kinder."]},"lake-sevan-nature-v2":{"i":"/poi-images/lake-sevan-nature-v2.webp","s":"Der Sewansee ist der größte See in Armenien und einer der größten Hochgebirgsseen der Welt.","f":["Fläche von etwa 1.242 km².","Liegt auf 1.900 Metern Höhe."]},"mount-aragats-nature-v2":{"i":"/poi-images/mount-aragats-nature-v2.webp","s":"Der Aragaz ist der höchste Berg in Armenien und ein erloschener Schicht en.","f":["Gegründet im Jahr 2009.","Fläche von über 344 km²."]},"mount-azhdahak-nature-v2":{"i":"/poi-images/mount-azhdahak-nature-v2.webp","s":"Der Aschdahak ist der höchste Punkt des Geghama-Gebirges und hat einen Kratersee auf dem Gipfel.","f":["Höhe von 3.597 Metern.","Bekannt für alte Petroglyphen."]},"vorotan-river-nature-v2":{"i":"/poi-images/vorotan-river-nature-v2.webp","s":"Der Worotan gräbt sich durch eine tiefe Schlucht in Südarmenien, die für ihre landschaftliche Schönheit bekannt ist.","f":["Länge von 178 Kilometern.","Fließt durch die Provinz Sjunik."]},"lake-kari-nature-v2":{"i":"/poi-images/lake-kari-nature-v2.webp","s":"Der Karisee ist ein hochgelegener Bergsee am Fuße des Berges Aragaz, der größtenteils aus Schmelzwasser besteht.","f":["Auf 3.185 Metern Höhe.","Wird von Schnee gespeist."]},"kasagh-river-nature-v2":{"i":"/poi-images/kasagh-river-nature-v2.webp","s":"Der Kassagh fließt durch den Westen Armeniens und hat eine tiefe Schlucht geschaffen, an der viele Klöster liegen.","f":["Länge von 89 Kilometern.","Schneidet durch vulkanisches Gestein."]},"lake-akna-nature-v2":{"i":"/poi-images/lake-akna-nature-v2.webp","s":"Der Aknasee ist ein malerischer Kratersee im Geghama-Gebirge, umgeben von alpinen Wiesen.","f":["Auf 3.030 Metern Höhe.","Fläche von nur 0,8 km²."]},"debed-river-nature-v2":{"i":"/poi-images/debed-river-nature-v2.webp","s":"Der Debed fließt durch tiefe, bewaldete Schluchten im Norden Armeniens in Richtung Georgien.","f":["Länge von 176 Kilometern.","Teil des Kura-Beckens."]},"lake-parz-nature-v2":{"i":"/poi-images/lake-parz-nature-v2.webp","s":"Der Parz-See ist ein kleiner Waldsee im Nationalpark Dilidschan, der für sein kristallklares Wasser bekannt ist.","f":["Name bedeutet „klarer See“.","Beliebtes Ziel für Wanderer."]},"mount-khustup-nature-v2":{"i":"/poi-images/mount-khustup-nature-v2.webp","s":"Der Chustup ist ein prominenter Berg in Südarmenien, dessen Hänge mit dichten Wäldern und Alpenwiesen bedeckt sind.","f":["Höhe von         ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
