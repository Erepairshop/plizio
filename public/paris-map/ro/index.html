vre.webp","s":"Luvrul din Paris este cel mai mare și cel mai vizitat muzeu de artă din lume.","f":["Muzeul și-a deschis porțile pentru prima dată în 1793 în timpul Revoluției Franceze.","Luvrul găzduiește peste 35.000 de lucrări expuse pe 73.000 de metri pătrați."]},"notre-dame":{"i":"/geo-images/france/notre-dame.webp","s":"Catedrala Notre-Dame de Paris este o capodoperă remarcabilă a arhitecturii gotice franceze și una dintre cele mai faimoase biserici din lume.","f":["Piatra de temelie a fost pusă în anul 1163.","Timpul de construcție a durat aproape 200 de ani."]},"fr-chateau-fontainebleau":{"i":"/geo-images/france/chateau-fontainebleau.webp","s":"Castelul Fontainebleau este unul dintre cele mai mari palate regale din Franța, situat la sud de Paris.","f":["Napoleon Bonaparte l-a numit 'adevărata casă a regilor'.","Găzduiește singura sală a tronului păstrată intactă din Franța."]},"fr-chateau-vincennes":{"i":"/geo-images/france/chateau-vincennes.webp","s":"Castelul Vincennes, situat la marginea de est a Parisului, este cea mai mare fortăreață medievală păstrată în Europa.","f":["Donjonul a fost finalizat în secolul al XIV-lea sub Carol al V-lea.","Printre prizonierii celebri s-au numărat Marchizul de Sade și Diderot."]},"chateau-versailles":{"i":"/geo-images/france/chateau-versailles.webp","s":"Palatul Versailles este unul dintre cele mai faimoase simboluri ale Franței și al monarhiei absolute.","f":["Sala Oglinzilor este cea mai cunoscută încăpere a palatului.","Ansamblul face parte din Patrimoniul Mondial UNESCO din 1979."]},"musee-dorsay":{"i":"/geo-images/france/musee-dorsay.webp","s":"Muzeul Orsay din Paris este celebru pentru arta secolului al XIX-lea și de la începutul secolului al XX-lea.","f":["Muzeul a fost deschis în 1986.","Este cunoscut mai ales pentru Monet, Van Gogh și Renoir."]},"palace-versailles-gardens":{"i":"/geo-images/france/palace-versailles-gardens.webp","s":"Grădinile Versailles sunt o capodoperă a artei franceze a grădinilor.","f":["Grădinile au fost proiectate de André Le Nôtre.","Sunt aproape la fel de celebre ca palatul însuși."]},"sainte-chapelle":{"i":"/geo-images/france/sainte-chapelle.webp","s":"Sainte-Chapelle de pe Île de la Cité este o bijuterie a arhitecturii gotice.","f":["Capela a fost construită în secolul al XIII-lea.","Vitraliile sale sunt printre cele mai frumoase din Europa."]},"notre-dame-de-paris":{"i":"/geo-images/france/notre-dame-de-paris.webp","s":"Notre-Dame de Paris este una dintre cele mai cunoscute catedrale din lume și o operă-cheie a goticului francez.","f":["Catedrala a fost restaurată amplu după incendiul din 2019.","Este strâns legată de romanul lui Victor Hugo."]},"saint-denis":{"i":"/poi-images/saint-denis.webp","s":"Saint-Denis se află la nord de Paris și este cunoscut pentru bazilica regilor Franței și pentru marele cartier al stadionelor.","f":["Abația Saint-Denis a fost fondată în secolul al VII-lea de către regele Dagobert I.","În interiorul bazilicii se află peste 70 de monumente funerare ale monarhilor francezi."]},"argenteuil":{"i":"/poi-images/argenteuil.webp","s":"Argenteuil se află pe Sena, în zona metropolitană a Parisului, și este o suburbie tipică legată puternic de istoria industrială.","f":["Claude Monet a pictat peste 170 de tablouri în timpul celor șapte ani petrecuți la Argenteuil.","Abația din Argenteuil a fost locul unde a trăit celebra stareță Héloïse în secolul al XII-lea."]},"chartres":{"i":"/poi-images/chartres.webp","s":"Chartres este cunoscut pentru catedrala sa celebră și centrul istoric bine păstrat de pe râul Eure.","f":["Catedrala din Chartres a fost înscrisă în patrimoniul UNESCO în anul 1979.","Suprafața totală a vitraliilor originale din catedrală depășește 2.500 de metri pătrați."]},"kid-landmark-parc-asterix-extra":{"i":"/poi-images/kid-landmark-parc-asterix-extra.webp","s":"Parc Astérix este un parc tematic bazat pe faimoasa serie de benzi desenate de Goscinny și Uderzo.","f":["Lumi tematice: Galia, Imperiul Roman, Grecia.","Peste 40 de atracții și spectacole."]},"forest-fontainebleau-forest-extra":{"i":"/poi-images/forest-fontainebleau-forest-extra.webp","s":"Pădurea Fontainebleau este o pădure vastă la sud de Paris, renumită pentru formațiunile sale stâncoase folosite pentru bouldering și pentru istoria sa bogată.","f":["Una dintre cele mai mari păduri din Franța.","Destinație populară pentru bouldering și drumeții."]},"nanterre":{"i":"/poi-images/nanterre.webp","s":"Nanterre este reședința departamentului Hauts-de-Seine și un pol economic și universitar major situat la vest de Paris.","f":["Sediul prefecturii departamentului Hauts-de-Seine.","Găzduiește Universitatea Paris-Nanterre, celebră pentru istoria sa."]},"vitry-sur-seine":{"i":"/poi-images/vitry-sur-seine.webp","s":"Vitry-sur-Seine este un oraș industrial situat la sud de Paris, renumit astăzi pentru arta sa stradală vibrantă și muzeul MAC VAL.","f":["Găzduiește MAC VAL, primul muzeu de artă contemporană din suburbiile Parisului.","Este considerată una dintre capitalele artei stradale din Franța."]},"asnieres-sur-seine":{"i":"/poi-images/asnieres-sur-seine.webp","s":"Asnières-sur-Seine este un oraș elegant situat la nord-vest de Paris, cunoscut pentru castelul său, istoria impresionistă și celebrul cimitir pentru câini.","f":["Găzduiește Cimetière des Chiens, cel mai vechi cimitir de animale din lume.","Adăpostește magnificul Castel din Asnières, construit în secolul al XVIII-lea."]},"creteil":{"i":"/poi-images/creteil.webp","s":"Créteil este reședința departamentului Val-de-Marne, renumit pentru arhitectura sa modernă inovatoare și marele lac artificial.","f":["Sediul prefecturii și al Palatului de Justiție din Val-de-Marne.","Celebru pentru 'Les Choux de Créteil', blocuri cu balcoane în formă de frunze."]},"colombes":{"i":"/poi-images/colombes.webp","s":"Colombes este o suburbie istorică din nord-vestul Parisului, cunoscută pentru moștenirea sa olimpică și amestecul de zone industriale și rezidențiale.","f":["Gazda principală a Jocurilor Olimpice de vară din 1924 pe stadionul Yves-du-Manoir.","A fost un centru major al industriei auto franceze la începutul secolului XX."]},"aubervilliers":{"i":"/poi-images/aubervilliers.webp","s":"Aubervilliers este un oraș industrial dinamic din nordul Parisului, renumit pentru viața sa culturală, Canalul Saint-Denis și centrele de comerț textil.","f":["Traversat de Canalul Saint-Denis, cu ecluzele și cheiurile sale istorice.","Găzduiește Campus Condorcet, un pol major pentru științele umaniste."]},"aulnay-sous-bois":{"i":"/poi-images/aulnay-sous-bois.webp","s":"Aulnay-sous-Bois este un oraș diversificat din nord-estul Parisului, cunoscut pentru parcurile sale vaste și importanța industrială.","f":["Găzduiește Parcul Sausset, una dintre cele mai mari zone verzi din regiune.","A fost sediul unei fabrici majore PSA Peugeot Citroën timp de decenii."]},"courbevoie":{"i":"/poi-images/courbevoie.webp","s":"Acest oraș dinamic de pe malul Senei găzduiește o parte importantă a cartierului modern de afaceri La Défense.","f":["Situat în departamentul Hauts-de-Seine","Parte a cartierului de afaceri La Défense"]},"rueil-malmaison":{"i":"/poi-images/rueil-malmaison.webp","s":"Acest oraș istoric este faimos pentru Castelul Malmaison, reședința lui Napoléon Bonaparte și a lui Joséphine.","f":["Sediul multor companii internaționale","Găzduiește Castelul Malmaison"]},"champigny-sur-marne":{"i":"/poi-images/champigny-sur-marne.webp","s":"Un oraș plin de viață pe malul râului Marne, cunoscut pentru parcurile sale și rolul său în războiul franco-prusac.","f":["Situat în departamentul Val-de-Marne","Faimos pentru bătălia de la Champigny (1870)"]},"saint-maur-des-fosses":{"i":"/poi-images/saint-maur-des-fosses.webp","s":"Acest oraș aproape complet înconjurat de o buclă a râului Marne este cunoscut pentru calitatea ridicată a vieții și cartierele de vile.","f":["Aproape o peninsulă în râul Marne","Abacie istorică importantă (Saint-Maur)"]},"noisy-le-grand":{"i":"/poi-images/noisy-le-grand.webp","s":"Acest oraș din estul Parisului este cunoscut pentru arhitectura sa futuristă și rolul său în districtul de afaceri Marne-la-Vallée.","f":["Poarta către orașul planificat Marne-la-Vallée","Complexuri arhitecturale celebre (Espaces d'Abraxas)"]},"drancy":{"i":"/poi-images/drancy.webp","s":"Un oraș cu o importanță istorică semnificativă, cunoscut ca loc de comemorare a victimelor deportărilor din al Doilea Război Mondial.","f":["Sediul Memorialului Shoah","Fost lagăr de tranzit pentru deportări"]},"cergy":{"i":"/poi-images/cergy.webp","s":"Centrul administrativ al departamentului Val-d'Oise, cunoscut pentru arhitectura sa modernă și marea bază de agrement de pe Oise.","f":["Parte a orașului nou Cergy-Pontoise","Găzduiește celebra Axe Majeur"]},"issy-les-moulineaux":{"i":"/poi-images/issy-les-moulineaux.webp","s":"Un oraș media ultra-modern situat chiar la sud de Paris, cunoscut pentru inovația digitală și heliportul său.","f":["Sediul marilor companii media (TF1, Canal+)","Pionier în domeniul Smart City"]},"levallois-perret":{"i":"/poi-images/levallois-perret.webp","s":"Levallois-Perret este unul dintre cele mai dens populate orașe din Europa și un centru de afaceri important lângă Paris.","f":["Cea mai mare densitate a populației din Franța","Locul de naștere al Statuii Libertății (atelier)"]},"evry-courcouronnes":{"i":"/poi-images/evry-courcouronnes.webp","s":"Un oraș tânăr și modern la sud de Paris, cunoscut pentru catedrala sa modernă și ca centru al industriei aerospațiale.","f":["Sediul agenției spațiale franceze (CNES)","Singura catedrală modernă din Franța (sec. XX)"]},"clichy":{"i":"/poi-images/clichy.webp","s":"Clichy este un oraș situat la granița directă cu Parisul, cunoscut pentru istoria sa lungă ca reședință merovingiană și sedii comerciale moderne.","f":["Vecin direct al Parisului la nord","Fostă reședință a regilor merovingieni"]},"ivry-sur-seine":{"i":"/poi-images/ivry-sur-seine.webp","s":"Ivry-sur-Seine este un oraș industrial la marginea de sud-est a Parisului, cunoscut pentru arhitectura sa avangardistă și cultura muncitorească.","f":["Se învecinează cu arondismentul 13 al Parisului","Centru de arhitectură modernă (Jean Renaudie)"]},"antony":{"i":"/poi-images/antony.webp","s":"Antony este un oraș prosper la sud de Paris, cunoscut pentru calitatea ridicată a vieții, parcurile sale și conexiunile excelente de transport.","f":["Punct de intersecție pentru linii importante RER","Găzduiește o parte din Parcul Sceaux"]},"le-blanc-mesnil":{"i":"/poi-images/le-blanc-mesnil.webp","s":"Le Blanc-Mesnil este un oraș multicultural la nord de Paris, caracterizat prin proximitatea față de aeroportul Le Bourget și parcurile sale verzi.","f":["Vecin cu aeroportul Le Bourget","Găzduiește marele Parc Jacques-Duclos"]},"neuilly-sur-seine":{"i":"/poi-images/neuilly-sur-seine.webp","s":"Neuilly-sur-Seine este unul dintre cele mai exclusive și bogate orașe din Franța, situat între Paris și cartierul de afaceri La Défense.","f":["Cea mai bogată comună din Franța","Adiacent parcului Bois de Boulogne"]},"pantin":{"i":"/poi-images/pantin.webp","s":"Pantin este un oraș în plină ascensiune la nord-est de Paris, adesea numit 'Brooklyn-ul Parisului', cunoscut pentru canalele sale și industria creativă.","f":["Situat pe malul Canal de l'Ourcq","Centru important al modei (Hermès)"]},"villejuif":{"i":"/poi-images/villejuif.webp","s":"Villejuif este un oraș la sud de Paris, cunoscut la nivel internațional ca un centru important pentru cercetarea cancerului și medicină.","f":["Sediul Institutului Gustave Roussy","Locație majoră de cercetare în Europa"]},"sarcelles":{"i":"/poi-images/sarcelles.webp","s":"Un oraș multicultural situat la nord de Paris, renumit pentru planificarea sa urbană modernă și rolul său semnificativ în istoria locuințelor sociale.","f":["Situat în departamentul Val-d'Oise.","Face parte din zona metropolitană Paris."]},"clamart":{"i":"/poi-images/clamart.webp","s":"Un oraș fermecător la sud-vest de Paris, cunoscut pentru pădurile sale vaste și rolul său important în istoria aviației.","f":["Situat în departamentul Hauts-de-Seine.","Găzduiește o parte din pădurea Meudon."]},"maisons-alfort":{"i":"/poi-images/maisons-alfort.webp","s":"Un oraș elegant situat la confluența fluviului Sena cu râul Marna, renumit mondial pentru prestigioasa sa școală veterinară.","f":["Situat în departamentul Val-de-Marne.","Găzduiește Școala Națională Veterinară din Alfort."]},"belleville":{"i":"/poi-images/belleville.webp","s":"Un cartier vibrant și deluros din estul Parisului, cunoscut pentru atmosfera sa boemă, arta stradală și diversitatea multiculturală.","f":["Fost sat independent până în 1860.","Unul dintre cele mai înalte puncte din Paris."]},"bobigny":{"i":"/poi-images/bobigny.webp","s":"Un oraș administrativ dinamic la nord-est de Paris, cunoscut pentru arhitectura sa modernă și rolul său important în istoria Rezistenței franceze.","f":["Prefectura departamentului Seine-Saint-Denis.","Traversat de canalul de l'Ourcq."]},"meaux":{"i":"/poi-images/meaux.webp","s":"Un oraș bogat în istorie la est de Paris, faimos pentru brânza Brie, catedrala sa gotică și muzeul major dedicat Primului Război Mondial.","f":["Patria brânzei 'Brie de Meaux'.","Situat pe o buclă a râului Marna."]},"epinay-sur-seine":{"i":"/poi-images/epinay-sur-seine.webp","s":"Épinay-sur-Seine este o comună situată la periferia nordică a Parisului, pe malul drept al Senei, în departamentul Seine-Saint-Denis.","f":["Situată în departamentul Seine-Saint-Denis.","Gazda studiourilor cinematografice Éclair."]},"evry":{"i":"/poi-images/evry.webp","s":"Évry este reședința departamentului Essonne, fiind un oraș nou creat în anii '60, cunoscut pentru arhitectura sa contemporană și polul universitar.","f":["Capitala departamentului Essonne.","Unul dintre cele 5 'orașe noi' din regiune."]},"chelles":{"i":"/poi-images/chelles.webp","s":"Chelles este un oraș situat în estul regiunii Île-de-France, pe malul râului Marna, având o istorie bogată legată de dinastia merovingiană.","f":["Parte a departamentului Seine-et-Marne.","Fostă reședință a regilor merovingieni."]},"bondy":{"i":"/poi-images/bondy.webp","s":"Bondy este o comună situată în departamentul Seine-Saint-Denis, la est de Paris, traversată de Canalul de l'Ourcq și renumită pentru diversitatea sa culturală.","f":["Situată în departamentul Seine-Saint-Denis.","Traversată de Canalul de l'Ourcq."]},"corbeil-essonnes":{"i":"/poi-images/corbeil-essonnes.webp","s":"Corbeil-Essonnes este un oraș situat la confluența râului Essonne cu fluviul Sena, fiind un centru industrial istoric din sudul regiunii pariziene.","f":["Confluența râurilor Sena și Essonne.","Fost centru major al morăritului de făină."]},"fontenay-sous-bois":{"i":"/poi-images/fontenay-sous-bois.webp","s":"Fontenay-sous-Bois este o comună situată în departamentul Val-de-Marne, la est de Paris, faimoasă pentru proximitatea de pădurea Vincennes și polul său economic.","f":["Liniile RER A și RER E deservesc orașul.","Adiacent parcului Bois de Vincennes."]},"saint-ouen-sur-seine":{"i":"/poi-images/saint-ouen-sur-seine.webp","s":"Saint-Ouen-sur-Seine este o localitate aflată la limita nordică a Parisului, celebră pentru cea mai mare piață de vechituri din lume și patrimoniul său industrial.","f":["Gazda celebrului 'Marché aux Puces'.","Sediul clubului istoric de fotbal Red Star FC."]},"sartrouville":{"i":"/poi-images/sartrouville.webp","s":"Un oraș dinamic situat la nord-vest de Paris, pe malul Senei, în regiunea Île-de-France.","f":["Al doilea oraș ca mărime din departamentul Yvelines.","Are o conexiune feroviară directă cu Parisul."]},"sevran":{"i":"/poi-images/sevran.webp","s":"Un oraș dinamic la nord-est de Paris, marcat de Canalul Ourcq și spații verzi vaste.","f":["Situat în departamentul Seine-Saint-Denis.","Traversat de Canalul Ourcq."]},"massy":{"i":"/poi-images/massy.webp","s":"Un nod de transport important la sud de Paris, cu o viață culturală bogată și un aspect urban modern.","f":["Dispune de o gară TGV importantă.","Găzduiește singura operă dintr-o suburbie a Parisului."]},"gennevilliers":{"i":"/poi-images/gennevilliers.webp","s":"Un oraș industrial pe Sena, care găzduiește cel mai mare port fluvial din regiunea Parisului.","f":["Cel mai mare port fluvial din Franța.","Situat într-o buclă a Senei."]},"vincennes":{"i":"/poi-images/vincennes.webp","s":"Un oraș elegant la marginea Parisului, faimos pentru castelul său regal și pădurea urbană vastă.","f":["Găzduiește castelul din Vincennes.","Situat direct lângă pădurea Vincennes."]},"montrouge":{"i":"/poi-images/montrouge.webp","s":"Montrouge este un oraș dinamic situat imediat la sud de Paris, cunoscut pentru moștenirea sa industrială și arhitectura modernă.","f":["Se învecinează direct cu arondismentul 14 din Paris.","A fost un centru major al industriei tipografice."]},"suresnes":{"i":"/poi-images/suresnes.webp","s":"Suresnes este un oraș istoric pe malul Senei, vizavi de Bois de Boulogne, cunoscut pentru podgoriile sale și pentru Mont Valérien.","f":["Găzduiește singura podgorie activă din regiunea pariziană.","Locația fortului Mont Valérien și a memorialului național."]},"livry-gargan":{"i":"/poi-images/livry-gargan.webp","s":"Livry-Gargan este un oraș rezidențial plin de verdeață la est de Paris, cunoscut pentru parcurile sale și legătura cu scriitoarea Madame de Sévigné.","f":["Fostul amplasament al abației istorice din Livry.","Madame de Sévigné a petrecut mult timp aici, scriind celebrele sale scrisori."]},"rosny-sous-bois":{"i":"/poi-images/rosny-sous-bois.webp","s":"Un oraș dinamic situat la est de Paris, faimos pentru fortul său istoric și pentru rolul său de hub comercial regional.","f":["Situat în departamentul Seine-Saint-Denis","Găzduiește fortul istoric Rosny"]},"la-courneuve":{"i":"/poi-images/la-courneuve.webp","s":"Un oraș multicultural la nord de Paris, gazda imensului parc Georges-Valbon și a celebrului festival Fête de l'Humanité.","f":["Găzduiește parcul Georges-Valbon (400 ha)","Centru important pentru arhivele media naționale"]},"meudon":{"i":"/poi-images/meudon.webp","s":"Un oraș elegant la sud-vest de Paris, renumit pentru pădurile sale, observatoarele astronomice și casa lui Auguste Rodin.","f":["Găzduiește Observatorul din Paris (secția Meudon)","Locul unde a trăit și a murit sculptorul Auguste Rodin"]},"choisy-le-roi":{"i":"/poi-images/choisy-le-roi.webp","s":"Un oraș istoric pe malul Senei, care a găzduit cândva o reședință regală a lui Ludovic al XV-lea.","f":["Fostul amplasament al unui castel regal dispărut","Port fluvial activ pe râul Sena"]},"noisy-le-sec":{"i":"/poi-images/noisy-le-sec.webp","s":"Un nod feroviar istoric la est de Paris, reconstruit arhitectural după cel de-al Doilea Război Mondial.","f":["Unul dintre cele mai mari triaje feroviare din Europa","Distrus masiv în bombardamentele din 1944"]},"melun":{"i":"/poi-images/melun.webp","s":"Prefectura istorică a departamentului Seine-et-Marne, situată pe malul Senei și celebră pentru brânza sa Brie.","f":["Capitala administrativă a departamentului Seine-et-Marne","Locul de origine al brânzei Brie de Melun"]},"saint-germain-en-laye":{"i":"/poi-images/saint-germain-en-laye.webp","s":"Un oraș regal istoric la vest de Paris, renumit pentru castelul său magnific și ca fiind locul de naștere al regelui Ludovic al XIV-lea.","f":["Locul de naștere al regelui Ludovic al XIV-lea.","Găzduiește Muzeul Național de Arheologie."]},"alfortville":{"i":"/poi-images/alfortville.webp","s":"Un oraș dinamic la confluența râurilor Sena și Marne, cunoscut pentru comunitatea sa armeană importantă.","f":["Situat între râurile Sena și Marne.","Centru al diasporei armene din Franța."]},"puteaux":{"i":"/poi-images/puteaux.webp","s":"Un oraș prosper la vest de Paris, care găzduiește o mare parte din cartierul modern de afaceri La Défense.","f":["Găzduiește Grande Arche de la Défense.","Fost centru al industriei auto și aeronautice."]},"mantes-la-jolie":{"i":"/poi-images/mantes-la-jolie.webp","s":"Un oraș istoric pe Sena, renumit pentru colegiata sa gotică și poziția strategică între Paris și Normandia.","f":["Găzduiește biserica colegiată gotică Notre-Dame.","Locul unde a murit regele Filip al II-lea August."]},"bagneux":{"i":"/poi-images/bagneux.webp","s":"O suburbie la sud de Paris, cunoscută pentru fostele sale cariere de piatră și diversitatea sa arhitecturală.","f":["Renumit pentru 'Pierre de Bagneux' (piatră de calcar).","Găzduiește unul dintre cele mai mari cimitire din regiunea Parisului."]},"garges-les-gonesse":{"i":"/poi-images/garges-les-gonesse.webp","s":"Un oraș multicultural la nord de Paris, marcat de proximitatea aeroportului Le Bourget și de dezvoltarea urbană modernă.","f":["Se învecinează cu aeroportul istoric Le Bourget.","Centru multicultural cu peste 60 de naționalități."]},"bagnolet":{"i":"/poi-images/bagnolet.webp","s":"O municipalitate vibrantă situată la est de Paris, recunoscută ca un centru logistic major și o zonă de expansiune urbană modernă.","f":["Se învecinează direct cu arondismentul 20 din Paris.","Găzduiește autogara internațională Paris-Gallieni."]},"gagny":{"i":"/poi-images/gagny.webp","s":"O oază verde la est de Paris, cunoscută pentru patrimoniul său cultural și episodul istoric al 'Taxiurilor de pe Marne'.","f":["Situat în departamentul Seine-Saint-Denis.","Punct de plecare pentru Taxiurile de pe Marne în 1914."]},"villepinte":{"i":"/poi-images/villepinte.webp","s":"Un oraș modern la nord-est de Paris, sediul celui mai mare centru expozițional din Franța, situat lângă aeroportul CDG.","f":["Găzduiește vastul centru expozițional Parc des Expositions.","Situat strategic lângă aeroportul internațional Paris-CDG."]},"stains":{"i":"/poi-images/stains.webp","s":"O localitate istorică la nord de Paris, cunoscută pentru arhitectura sa de tip 'oraș-grădină' și trecutul său industrial.","f":["Celebru pentru cartierul 'Cité-jardin', monument istoric.","Suburbană nordică în departamentul Seine-Saint-Denis."] s Sciences."]},"la-garenne-colombes":{"i":"/poi-images/la-garenne-colombes.webp","s":"O suburbie densă și animată situată lângă districtul financiar La Défense de lângă Paris.","f":["A devenit comună independentă în 1910.","Cunoscut pentru piața Place de la Liberté."]},"saint-cloud":{"i":"/poi-images/saint-cloud.webp","s":"Un oraș elegant situat la vest de Paris, faimos pentru parcul său vast și manufactura istorică de porțelan.","f":["Fostul sediu al unui castel regal.","Găzduiește un parc de 460 de hectare."]},"draveil":{"i":"/poi-images/draveil.webp","s":"Un oraș verde situat la marginea pădurii Sénart, cunoscut pentru orașele-grădină și bazele de agrement.","f":["Se învecinează cu pădurea Sénart.","Găzduiește baza de agrement Port aux Cerises."]},"le-plessis-robinson":{"i":"/poi-images/le-plessis-robinson.webp","s":"Un oraș-grădină fermecător situat la sud-vest de Paris, faimos pentru localurile istorice și arhitectura neotradițională.","f":["Primul oraș-grădină din Franța.","Renumit pentru 'guinguettes' (localuri de petrecere)."]},"villiers-le-bel":{"i":"/poi-images/villiers-le-bel.webp","s":"Un oraș dinamic în departamentul Val-d'Oise, la nord de Paris, cunoscut pentru amestecul său de nucleu istoric și cartiere moderne.","f":["Situat la 18 km nord de Paris","Fondat în epoca galo-romană"]},"guyancourt":{"i":"/poi-images/guyancourt.webp","s":"Un oraș modern la sud-vest de Paris, parte a orașului nou Saint-Quentin-en-Yvelines și sediul Renault Technocentre.","f":["Parte din Saint-Quentin-en-Yvelines","Sediul centrului tehnic Renault"]},"bois-colombes":{"i":"/poi-images/bois-colombes.webp","s":"Un oraș rezidențial prosper la nord-vest de Paris, cunoscut pentru moștenirea sa arhitecturală din anii 1930 și calitatea vieții ridicată.","f":["Fondat în 1896 prin separarea de Colombes","Fost sediu al fabricilor Hispano-Suiza"]},"fresnes":{"i":"/poi-images/fresnes.webp","s":"Un oraș la sud de Paris, cunoscut în principal pentru închisoarea sa istorică și evoluția sa de ":"Limeil-Brévannes este un oraș în departamentul Val-de-Marne, cunoscut pentru instituțiile sale medicale importante și proiectele urbane ecologice inovatoare.","f":["Găzduiește spitalul de mare capacitate Émile-Roux.","Locul primei școli ecologice din Franța."]},"sucy-en-brie":{"i":"/poi-images/sucy-en-brie.webp","s":"Sucy-en-Brie este o comună rezidențială verde la sud-est de Paris, cunoscută pentru castelul său și proximitatea față de pădurea Notre-Dame.","f":["Găzduiește un castel splendid construit în secolul al XVII-lea.","Se află la marginea vastei păduri Notre-Dame."]},"rambouillet":{"i":"/poi-images/rambouillet.webp","s":"Rambouillet este un oraș elegant la vest de Paris, cunoscut pentru castelul său istoric, pădurea vastă și rezidența prezidențială.","f":["Castelul Rambouillet a fost o reședință de vară a președinților francezi.","Găzduiește 'Bergerie Nationale', o celebră fermă de oi merinos."]},"gonesse":{"i":"/poi-images/gonesse.webp","s":"Gonesse este un oraș istoric la nord de Paris, odinioară renumit pentru pâinea sa excelentă, iar astăzi un punct strategic lângă aeroportul Roissy.","f":["În Evul Mediu, a fost principalul furnizor de pâine pentru curtea regală din Paris.","Locul de naștere al regelui Filip al II-lea August în 1165."]},"taverny":{"i":"/poi-images/taverny.webp","s":"Taverny este un oraș atractiv la marginea pădurii Montmorency, cunoscut pentru biserica sa gotică și importanța sa istorică militară.","f":["Biserica Notre-Dame din Taverny a fost ctitorită de puternica familie Montmorency.","A găzduit timp de decenii cartierul general strategic al forțelor aeriene franceze."]},"bussy-saint-georges":{"i":"/poi-images/bussy-saint-georges.webp","s":"Bussy-Saint-Georges este un oraș modern și verde lângă Disneyland Paris, cunoscut pentru comunitatea sa internațională și arhitectura sustenabilă.","f":["Parte a proiectului 'Villes Nouvelles' (orașe noi) din estul Parisului.","Găzduiește 'Square des Religions', un spațiu unic de dialog interreligios."]},"champs-sur-marne":{"i":"/poi-images/champs-sur-marne.webp","s":"Un oraș situat la est de Paris, renumit pentru castelul său baroc magnific și ca centru academic modern.","f":["Găzduiește faimosul Castel Champs-sur-Marne.","Sediul clusterului științific Cité Descartes."]},"bretigny-sur-orge":{"i":"/poi-images/bretigny-sur-orge.webp","s":"Un oraș istoric la sud de Paris, cunoscut pentru tratatul de pace din 1360 și fosta sa bază aeriană.","f":["Locul Tratatului de la Brétigny din timpul Războiului de 100 de ani.","Fostul amplasament al bazei aeriene 217."]},"cormeilles-en-parisis":{"i":"/poi-images/cormeilles-en-parisis.webp","s":"Un oraș cu vedere panoramică spre Paris, locul de naștere al lui Louis Daguerre și cunoscut pentru industria sa istorică de ghips.","f":["Locul de naștere al pionierului fotografiei, Louis Daguerre.","Găzduiește Fortul de Cormeilles, construit în secolul al XIX-lea."]},"sens":{"i":"/poi-images/sens.webp","s":"Un oraș istoric din Burgundia, casa primei catedrale gotice din Franța și un fost centru gallo-roman.","f":["Găzduiește Catedrala Saint-Étienne, prima catedrală gotică construită.","În antichitate a fost capitala senonilor, sub numele de Agendicum."]},"sannois":{"i":"/poi-images/sannois.webp","s":"O suburbie fermecătoare a Parisului, cunoscută pentru moara de vânt istorică și pentru că a inspirat pictori precum Maurice Utrillo.","f":["Găzduiește celebra moară de vânt Moulin d'Orgemont.","A fost un subiect preferat al pictorului Maurice Utrillo."]},"villeparisis":{"i":"/poi-images/villeparisis.webp","s":"Un oraș dinamic situat la nord-est de Paris, traversat de Canalul de l'Ourcq și aflat în apropierea aeroportului Charles de Gaulle.","f":["Situat în departamentul Seine-et-Marne.","Canalul de l'Ourcq traversează orașul."]},"etampes":{"i":"/poi-images/etampes.webp","s":"Un oraș istoric regal situat la sud de Paris, renumit pentru patrimoniul său medieval bogat și cursurile de apă pitorești.","f":["Deține titlul de 'Oraș de Artă și Istorie'.","Situat la confluența mai multor râuri mici."]},"brunoy":{"i":"/poi-images/brunoy.webp","s":"Un oraș rezidențial fermecător situat în valea râului Yerres, la sud-est de Paris, cunoscut pentru arhitectura sa și cadrul natural bogat.","f":["Situat în departamentul Essonne.","Se învecinează cu pădurea Sénart."]},"elancourt":{"i":"/poi-images/elancourt.webp","s":"Un oraș modern din departamentul Yvelines, renumit pentru parcurile sale tehnologice și atracția France Miniature.","f":["Face parte din comunitatea de aglomerare Saint-Quentin-en-Yvelines.","Găzduiește parcul tematic France Miniature."]},"vaugirard":{"i":"/poi-images/vaugirard.webp","s":"Fostă comună independentă, astăzi inima arondismentului 15 din Paris, cunoscută pentru istoria sa și Parcul Georges-Brassens.","f":["Anexat Parisului în anul 1860.","Inițial un sat agricol renumit pentru vița-de-vie."]},"eaubonne":{"i":"/poi-images/eaubonne.webp","s":"Un oraș istoric în Val-d'Oise, fost refugiu pentru nobilimea pariziană și faimos pentru legătura sa cu Jean-Jacques Rousseau.","f":["Situat în departamentul Val-d'Oise (95).","Numele provine de la izvoarele de apă pură din zonă."]},"villeneuve-la-garenne":{"i":"/poi-images/villeneuve-la-garenne.webp","s":"Un oraș dinamic pe malul Senei, la nord de Paris, cunoscut pentru spațiile verzi extinse și facilitățile moderne de recreere.","f":["Situat pe malul stâng al Senei","Fondat oficial în anul 1929"]},"les-ulis":{"i":"/poi-images/les-ulis.webp","s":"Un oraș planificat modern la sud de Paris, cunoscut pentru arhitectura inovatoare din anii 1970 și parcul tehnologic Courtabœuf.","f":["Fondat oficial în anul 1977","Parte a departamentului Essonne"]},"le-kremlin-bicetre":{"i":"/poi-images/le-kremlin-bicetre.webp","s":"Un oraș aflat chiar lângă Paris, renumit pentru spitalul său istoric și numele curios de inspirație rusă.","f":["Vecinătate directă cu Parisul","Sediul spitalului Bicêtre"]},"les-pavillons-sous-bois":{"i":"/poi-images/les-pavillons-sous-bois.webp","s":"Un oraș rezidențial verde în estul Parisului, format din fostele pavilioane de vânătoare ale castelului Le Raincy.","f":["Fondat oficial în anul 1905","Situat pe malul Canalului Ourcq"]},"saint-ouen-l-aumone":{"i":"/poi-images/saint-ouen-l-aumone.webp","s":"Un oraș istoric pe malul Oise, cunoscut pentru abadia cisterciană Maubuisson și zona sa industrială importantă.","f":["Situat pe râul Oise","Găzduiește abadia Maubuisson"]},"fontenay-aux-roses":{"i":"/poi-images/fontenay-aux-roses.webp","s":"Un oraș rezidențial elegant la sud de Paris, renumit istoric pentru cultivarea trandafirilor și instituțiile sale educaționale importante.","f":["Fost centru al cultivării trandafirilor","Sediul instalației de cercetare nucleară Fontenay"]},"vernon":{"i":"/poi-images/vernon.webp","s":"Vernon este un oraș pitoresc pe malul Senei, în Normandia, renumit pentru casele sale medievale din lemn și proximitatea față de Giverny.","f":["Situat pe malurile fluviului Sena.","Simbolul orașului este 'Le Vieux Moulin' (Moara Veche)."]},"orly":{"i":"/poi-images/orly.webp","s":"Un oraș strategic la sud de Paris, faimos la nivel mondial pentru aeroportul său internațional și rolul crucial în istoria aviației franceze.","f":["Situat în departamentul Val-de-Marne","Găzduiește Aeroportul Paris-Orly"]},"montgeron":{"i":"/poi-images/montgeron.webp","s":"Un oraș elegant din Île-de-France, cunoscut ca locul de start al primului Tour de France în 1903 și pentru proximitatea față de pădurea Sénart.","f":["Situat în departamentul Essonne","Locul de start al Turului Franței din 1903"]},"sevres":{"i":"/poi-images/sevres.webp","s":"Un oraș istoric la marginea Parisului, renumit la nivel mondial pentru manufactura regală de porțelan și sediul Biroului Internațional de Măsuri și Greutăți.","f":["Situat în departamentul Hauts-de-Seine","Patria porțelanului de Sèvres"]},"maisons-laffitte":{"i":"/poi-images/maisons-laffitte.webp","s":"Oraș situat la nord-vest de Paris, renumit pentru castelul său baroc magnific și pentru tradiția sa îndelungată ca centru al sporturilor ecvestre franceze.","f":["Găzduiește unul dintre cele mai importante hipodromuri din Franța.","Castelul a fost proiectat de celebrul arhitect François Mansart."]},"les-lilas":{"i":"/poi-images/les-lilas.webp","s":"O suburbie fermecătoare la porțile Parisului, cunoscută pentru viața sa culturală vibrantă și pentru melodia celebră a lui Serge Gainsbourg.","f":["Numele provine de la tufele de liliac ce înfloreau odinioară aici.","A inspirat cântecul iconic 'Le Poinçonneur des Lilas'."]},"torcy":{"i":"/poi-images/torcy.webp","s":"Un oraș modern la est de Paris, care, ca parte a orașului nou Marne-la-Vallée, oferă un amestec perfect de natură și urbanitate.","f":["Face parte din orașul nou Marne-la-Vallée.","Cunoscut pentru lacurile sale mari și centrele de agrement."]},"dammarie-les-lys":{"i":"/poi-images/dammarie-les-lys.webp","s":"Un oraș verde la marginea sudică a pădurii Fontainebleau, renumit pentru ruinele abației Notre-Dame-du-Lys și locația sa pe malul Senei.","f":["Găzduiește ruinele abației regale Lys, fondată în secolul al XIII-lea.","Se învecinează direct cu celebra pădure Fontainebleau."]},"roissy-en-brie":{"i":"/poi-images/roissy-en-brie.webp","s":"Un oraș prietenos pentru familii în departamentul Seine-et-Marne, cunoscut pentru zonele sale forestiere întinse și ca locul de naștere al fotbalistului Paul Pogba.","f":["Adăpostește pădurea vastă 'Forêt de Roissy'.","Face parte din regiunea istorică Brie."]},"combs-la-ville":{"i":"/poi-images/combs-la-ville.webp","s":"Un oraș verde și sustenabil la sud-est de Paris, cunoscut pentru parcurile sale, râul Yerres și rolul său istoric în silvicultură.","f":["Situat pitoresc pe malurile râului Yerres.","Găzduiește parcul 'Parc de la Borne Blanche'."]},"deuil-la-barre":{"i":"/poi-images/deuil-la-barre.webp","s":"Un oraș rezidențial istoric la nord de Paris, la poalele pădurii Montmorency, cunoscut pentru liniștea și calitatea vieții sale.","f":["Situat în departamentul Val-d'Oise.","Aflat la doar 9 km de centrul Parisului."]},"velizy-villacoublay":{"i":"/poi-images/velizy-villacoublay.webp","s":"Un centru major de tehnologie și aviație la sud-vest de Paris, sediul unui aerodrom militar important și al numeroaselor sedii de firme.","f":["Găzduiește baza aeriană militară 107 Villacoublay.","Include Inovel Parc, unul dintre cele mai mari centre de afaceri."]},"saint-mande":{"i":"/poi-images/saint-mande.webp","s":"O comună elegantă și dens populată la marginea estică a Parisului, situată direct lângă Bois de Vincennes și cunoscută pentru nivelul ridicat de trai.","f":["Se învecinează direct cu arondismentul 12 din Paris.","Una dintre cele mai mici comune ca suprafață din Franța."]},"mantes-la-ville":{"i":"/poi-images/mantes-la-ville.webp","s":"Un oraș industrial dinamic la vest de Paris, faimos pentru fabricarea instrumentelor muzicale.","f":["Situat în departamentul Yvelines","Centru pentru instrumente de suflat"]},"montereau-fault-yonne":{"i":"/poi-images/montereau-fault-yonne.webp","s":"Un oraș istoric la confluența râurilor Sena și Yonne, faimos pentru o bătălie a lui Napoleon.","f":["Confluența a două fluvii","Locul bătăliei din 1814"]},"acheres":{"i":"/poi-images/acheres.webp","s":"Un oraș verde situat într-o buclă a Senei la vest de Paris, adiacent pădurii Saint-Germain-en-Laye.","f":["Situat în departamentul Yvelines","Nod feroviar important"]},"arcueil":{"i":"/poi-images/arcueil.webp","s":"Arcueil este un oraș dinamic la sud de Paris, faimos pentru apeductele sale monumentale și patrimoniul său industrial bogat.","f":["Situat în departamentul Val-de-Marne.","Faimos pentru apeductele din Arcueil."]},"longjumeau":{"i":"/poi-images/longjumeau.webp","s":"Longjumeau este un oraș istoric la sud de Paris, cunoscut pentru tratatul de pace din 1568 și poziția sa pe râul Yvette.","f":["Locul păcii de la Longjumeau (1568).","Situat în departamentul Essonne."]},"neuilly-plaisance":{"i":"/poi-images/neuilly-plaisance.webp","s":"Neuilly-Plaisance este un oraș verde pe malul Marnei, cunoscut pentru calitatea vieții și platoul Avron.","f":["Situat în departamentul Seine-Saint-Denis.","Se învecinează direct cu râul Marna."]},"nogent-sur-oise":{"i":"/poi-images/nogent-sur-oise.webp","s":"Nogent-sur-Oise este un oraș industrial în nordul Franței, care joacă un rol important în transporturi și în economia regională.","f":["Situat în departamentul Oise.","Nod feroviar important."]},"montmorency":{"i":"/poi-images/montmorency.webp","s":"Montmorency este un oraș elegant pe un deal la nord de Paris, faimos pentru Jean-Jacques Rousseau și cireșele sale.","f":["Reședința puternicei familii Montmorency.","Locul unde a trăit Jean-Jacques Rousseau."]},"saint-michel-sur-orge":{"i":"/poi-images/saint-michel-sur-orge.webp","s":"O comună rezidențială fermecătoare situată la sud de Paris, pe malul râului Orge.","f":["Situat la sud de Paris.","Traversat de râul Orge."]},"villeneuve-le-roi":{"i":"/poi-images/villeneuve-le-roi.webp","s":"Un oraș plin de istorie pe malul Senei, situat chiar lângă aeroportul Paris-Orly.","f":["Situat pe malul Senei.","Adiacent aeroportului Orly."]},"morsang-sur-orge":{"i":"/poi-images/morsang-sur-orge.webp","s":"O suburbie verde a Parisului în departamentul Essonne, cu un castel magnific.","f":["Situat la sud de Paris.","Deține un castel istoric."]},"lagny-sur-marne":{"i":"/poi-images/lagny-sur-marne.webp","s":"Un oraș istoric cu o abație pe malul Marnei, situat în apropiere de Disneyland Paris.","f":["Abație medievală importantă.","Situat pe malul râului Marne."]},"la-celle-saint-cloud":{"i":"/poi-images/la-celle-saint-cloud.webp","s":"O localitate rezidențială elegantă la vest de Paris, caracterizată prin castele istorice și zone împădurite vaste.","f":["Suburbie vestică a Parisului","Găzduiește castele importante"]},"saint-gratien":{"i":"/poi-images/saint-gratien.webp","s":"Un oraș rezidențial plăcut la nord de Paris, cunoscut pentru legăturile sale cu personalități ise, care îmbină un centru vechi pitoresc cu o planificare urbană modernă și ecologică.","f":["Face parte din orașul nou Cergy-Pontoise.","Găzduiește un sit megalitic important (Allée couverte)."]},"mennecy":{"i":"/poi-images/mennecy.webp","s":"Un oraș elegant în Île-de-France, renumit pentru porțelanul său de odinioară și vastul parc Villeroy.","f":["Situat în departamentul Essonne","Faimos pentru porțelanul de Mennecy"]},"coulommiers":{"i":"/poi-images/coulommiers.webp","s":"Un oraș fermecător în regiunea Brie, cunoscut în întreaga lume pentru brânza sa omonimă și istoria sa medievală.","f":["Situat în departamentul Seine-et-Marne","Patria brânzei Coulommiers"]},"verneuil-sur-seine":{"i":"/poi-images/verneuil-sur-seine.webp","s":"Un oraș atractiv în departamentul Yvelines, cunoscut pentru centrul său de recreere de pe malul Senei și calitatea înaltă a vieții.","f":["Situat în departamentul Yvelines","Centru mare de recreere (Base de Loisirs)"]},"le-pecq":{"i":"/poi-images/le-pecq.webp","s":"Un oraș fermecător de pe malul Senei, în departamentul Yvelines, legat istoric de castelul Saint-Germain-en-Laye.","f":["Situat direct pe malul Senei.","Oraș vecin cu Saint-Germain-en-Laye."]},"saint-leu-la-foret":{"i":"/poi-images/saint-leu-la-foret.webp","s":"Un oraș fermecător din Val-d'Oise, la marginea pădurii Montmorency, cunoscut pentru istoria sa napoleoniană.","f":["Situat în departamentul Val-d'Oise.","La marginea pădurii Montmorency."]},"domont":{"i":"/poi-images/domont.webp","s":"Domont este un oraș rezidențial la nord de Paris, situat la marginea pădurii Montmorency, apreciat pentru cadrul său natural și liniște.","f":["Situat în nordul Parisului.","Învecinat cu pădurea Montmorency."]},"noisiel":{"i":"/poi-images/noisiel.webp","s":"Noisiel este un oraș pe malul râului Marne, faimos la nivel mondial pentru fosta fabrică de ciocolată Menier și arhitectura industrială inovatoare.","f":["Situat pe malul râului Marne.","Sediul fabricii de ciocolată Menier."]},"fontaineb images/vernouillet.webp","s":"Un oraș în departamentul Eure-et-Loir, cunoscut ca un centru industrial important și o zonă rezidențială lângă Dreux.","f":["Situat în regiunea Centre-Val de Loire.","Face parte din aglomerația urbană Dreux."]},"l-isle-adam":{"i":"/poi-images/l-isle-adam.webp","s":"Un oraș elegant în Val-d'Oise, cunoscut sub numele de „Grădina Parisului”, cu cea mai mare plajă fluvială din Franța.","f":["Situat pe malul râului Oise.","Găzduiește celebra plajă „La Plage de l’Isle-Adam”."]},"louvres":{"i":"/poi-images/louvres.webp","s":"Un oraș cu o bogată istorie merovingiană, situat la marginea aeroportului Paris-Charles-de-Gaulle.","f":["Situat în departamentul Val-d'Oise.","Găzduiește muzeul de arheologie ARCHÉA."]},"triel-sur-seine":{"i":"/poi-images/triel-sur-seine.webp","s":"Triel-sur-Seine este un oraș fermecător pe malul Senei, în departamentul Yvelines, cunoscut pentru tradiția sa viticolă și observatorul astronomic.","f":["Situat în departamentul Yvelines","Fost centru viticol"]},"la-queue-en-brie":{"i":"/poi-images/la-queue-en-brie.webp","s":"Un oraș fermecător în Val-de-Marne, care îmbină viața urbană cu zone forestiere vaste și natură.","f":["Situat la aproximativ 18 km est de Paris.","Găzduiește o parte din pădurea Notre-Dame."]},"charonne":{"i":"/poi-images/charonne.webp","s":"Un fost sat care astăzi, ca un cartier fermecător în arondismentul 20 al Parisului, și-a păstrat caracterul rural.","f":["Comună independentă până în anul 1860.","Găzduiește biserica medievală Saint-Germain de Charonne."]},"saint-pierre-du-perray":{"i":"/poi-images/saint-pierre-du-perray.webp","s":"Un oraș modern în plină expansiune din departamentul Essonne, parte a nucleului 'Orașului Nou' Senart.","f":["Situat la aproximativ 30 de kilometri sud-est de Paris.","Face parte din comunitatea de aglomerare Grand Paris Sud."]},"villepreux":{"i":"/poi-images/villepreux.webp","s":"Un oraș rezidențial elegant în departamentul Yvelines, parte a axei istorice a Versailles-ulu function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
const mapcard=document.getElementById('mapcard');
let mcActiveEl=null;
function markerScreen(cx,cy){const r=svg.getBoundingClientRect();const sc=Math.min(r.width/W,r.height/H);const ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;return[r.left+ox+(cx*s+tx)*sc,r.top+oy+(cy*s+ty)*sc];}
function placeMapcardAt(sx,sy){
  const below=sy<195;
  mapcard.classList.toggle('mapcard--below',below);
  const cw=mapcard.offsetWidth||190;const half=cw/2+10;
  const left=Math.max(half,Math.min(window.innerWidth-half,sx));
  // keep the arrow pointing at the marker even after horizontal clamping
  const ax=Math.max(12,Math.min(cw-12,cw/2+(sx-left)));
  mapcard.style.setProperty('--ax',ax+'px');
  mapcard.style.left=left+'px';
  mapcard.style.top=sy+'px';
}
function placeMapcard(cx,cy){const[sx,sy]=markerScreen(cx,cy);placeMapcardAt(sx,sy);}
function closeMapcard(){if(!mapcard.classList.contains('open'))return;mapcard.classList.remove('open');if(mcActiveEl){mcActiveEl.classList.remove('active');mcActiveEl=null}}
function fillCard(d){
  const id=d.id;
  mapcard.querySelector('.mc-type').textContent=d.grp||'';
  mapcard.querySelector('.mc-name').textContent=d.name||id;
  const mb=mapcard.querySelector('.mc-more');
  if(d.url){mb.href=d.url;mb.style.display=''}else{mb.style.display='none'}
  const c=POI_CARD[id]||{};
  const img=mapcard.querySelector('.mc-img');
  if(c.i){img.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';img.classList.add('has')}else{img.classList.remove('has');img.style.backgroundImage=''}
  const ds=mapcard.querySelector('.mc-desc');
  if(c.s){ds.textContent=c.s;ds.classList.add('show')}else{ds.textContent='';ds.classList.remove('show')}
}
function openPopup(el){
  closePopup();
  el.classList.add('active');mcActiveEl=el;
  fillCard({id:el.getAttribute('data-id'),name:el.getAttribute('data-name'),grp:el.getAttribute('data-grp'),url:el.getAttribute('data-url')});
  const cx=+el.getAttribute('data-cx')||0,cy=+el.getAttribute('data-cy')||0;
  mapcard.classList.add('open');
  placeMapcard(cx,cy);
}
// Cluster "burst": fan the POIs out around the cluster center as glow dots
// linked by light arcs. Big clusters (>=15) just fly-zoom in instead.
const burst=document.getElementById('burst'),burstSvg=document.getElementById('burstSvg'),burstDots=document.getElementById('burstDots');
let burstData={};
function closeBurst(){if(!burst.classList.contains('open'))return;burst.classList.remove('open');burstSvg.innerHTML='';burstDots.innerHTML='';burstData={};if(!pop.classList.contains('open'))svg.classList.remove('dim-pois')}
function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));
    const dx=CX+R*Math.cos(a),dy=CY+R*Math.sin(a),col=GCOL2[p.grp]||'#9ca3af';
    lines+='<line class="burst-line" x1="'+CX.toFixed(1)+'" y1="'+CY.toFixed(1)+'" x2="'+dx.toFixed(1)+'" y2="'+dy.toFixed(1)+'"/>';
    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));
  burst.classList.add('open');
}
burstDots.addEventListener('click',e=>{const b=e.target.closest('.burst-dot');if(!b)return;e.stopPropagation();const p=burstData[b.getAttribute('data-id')];if(!p)return;fillCard(p);mapcard.classList.add('open');placeMapcardAt(parseFloat(b.style.left),parseFloat(b.style.top));});
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openBurst(cl)})}
function closePopup(){pop.classList.remove('open');clearMode();closeMapcard();closeBurst();svg.classList.remove('dim-pois');document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
document.getElementById('mcx').onclick=function(e){e.stopPropagation();closeMapcard()};
mapcard.addEventListener('click',e=>e.stopPropagation());
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')&&!e.target.closest('.mapcard')&&!e.target.closest('.burst-dot')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Search-only entries (POIs on a sub-map): match by name, navigate to the sub-map.
  const extraHits=[];
  for(const e of SEARCH_EXTRA){if(e.s.includes(q)&&extraHits.length<20)extraHits.push(e)}
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0&&extraHits.length===0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0&&extraHits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  const exRow=e=>'<a data-extra="1" href="'+e.u+'"><span class="dot" style="background:#ffd54a"></span><span class="nm">'+e.n.replace(/[<>]/g,'')+'</span><span class="gr">›</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('')+extraHits.map(exRow).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const ax=e.target.closest('a[data-extra]');
  if(ax)return; // sub-map link: let the browser navigate
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
