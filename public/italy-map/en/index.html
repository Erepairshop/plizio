 breathtaking panoramic views.","f":["350m above sea level","Founded in 5th century"]},"rimini":{"i":"/poi-images/rimini.webp","s":"A vibrant seaside resort on the Adriatic, blending ancient Roman monuments with kilometers of sandy beaches.","f":["Arch of Augustus","Tiberius Bridge"]},"riomaggiore":{"i":"/poi-images/riomaggiore.webp","s":"Riomaggiore, the southernmost village of the Cinque Terre, clings steeply to the cliffs and is famous for its picturesque natural harbor and the renowned Path of Love.","f":["Southernmost Cinque Terre village","Founded in 13th century"]},"santa-margherita-ligure":{"i":"/poi-images/santa-margherita-ligure.webp","s":"An elegant port town on the Tigullio Gulf, blending Belle Époque glamour with Mediterranean ease and luxurious villas.","f":["In the heart of the Tigullio Gulf","Elegant palm-lined promenade"]},"trento":{"i":"/poi-images/trento.webp","s":"A historic city in the Adige Valley, famous for the Council of Trent.","f":["Council of Trent","Buonconsiglio Castle"]},"trieste":{"i":"/poi-images/trieste.webp","s":"An elegant port city on the Adriatic, once the main seaport of the Austro-Hungarian Empire.","f":["Largest seafront square in Europe","Major European coffee import hub"]},"urbino":{"i":"/poi-images/urbino.webp","s":"A perfectly preserved Renaissance jewel in the Marche region, the birthplace of Raphael and home to a magnificent Ducal Palace.","f":["UNESCO World Heritage","Birthplace of Raphael"]},"varenna":{"i":"/poi-images/varenna.webp","s":"A picturesque fishing village on Lake Como with brightly colored houses and romantic alleys.","f":["Famous waterfront 'Walk of Lovers'","Magnificent gardens of Villa Monastero"]},"vicenza":{"i":"/poi-images/vicenza.webp","s":"The city of Palladio, famous for its elegant Renaissance architecture and as a global hub for Italian gold jewelry.","f":["Palladian architecture","UNESCO World Heritage"]},"vieste":{"i":"/poi-images/vieste.webp","s":"The white pearl of the Gargano Peninsula, Vieste sits atop dramatic cliffs and is legendary for its massive Pizzomunno monolith.","f":["Gargano National Park","White limestone houses"]},"alassio":{"i":"/poi-images/alassio.webp","s":"A charming seaside resort famous for its fine sandy beaches, the celebrity-signed 'Muretto' wall, and the historic shopping lane 'Budello'.","f":["Sandy beach","Muretto Wall"]},"aquileia":{"i":"/poi-images/aquileia.webp","s":"Aquileia was one of the largest cities of the Roman Empire and now hosts Europe's most significant early Christian floor mosaics within its basilica.","f":["UNESCO World Heritage site","Roman river port"]},"arezzo":{"i":"/poi-images/arezzo.webp","s":"Arezzo is an elegant Tuscan city famous for its gold smithing tradition, masterpieces by Piero della Francesca, and as the filming site for 'Life is Beautiful'.","f":["Italy's capital of gold and jewelry production","Birthplace of the famous poet Francesco Petrarch"]},"argentario":{"i":"/poi-images/argentario.webp","s":"The main town of the Monte Argentario peninsula, an exclusive harbor town featuring a Spanish fortress and a lively fishing port.","f":["Promontory hub","Spanish Fortress"]},"ascoli-piceno":{"i":"/poi-images/ascoli-piceno.webp","s":"Ascoli Piceno is a city built of travertine stone, celebrated for its harmonious Piazza del Popolo and the famous stuffed fried olives.","f":["City of Travertine","Piazza del Popolo"]},"asiago":{"i":"/poi-images/asiago.webp","s":"Asiago is the heart of the Plateau of the Seven Communities, world-famous for its namesake cheese and its poignant World War I history.","f":["Capital of the Seven Communities Plateau","Origin of the world-renowned Asiago cheese"]},"bardolino":{"i":"/poi-images/bardolino.webp","s":"Bardolino, on the eastern shore of Lake Garda, is world-famous for its light red wine and its charming old town overlooking the water.","f":["Bardolino DOC wine","Lake Garda eastern shore"]},"cagliari":{"i":"/poi-images/cagliari.webp","s":"Cagliari, the capital of Sardinia, blends ancient Roman ruins, a medieval hilltop castle district, and miles of sandy beaches.","f":["Capital city of Sardinia","Historic Castello district"]},"elba-portoferraio":{"i":"/poi-images/elba-portoferraio.webp","s":"The capital of Elba Island, defined by massive Medici fortifications and the historical legacy of Napoleon's exile.","f":["Island capital","Medici forts"]},"lazise":{"i":"/poi-images/lazise.webp","s":"Lazise boasts perfectly preserved medieval walls, an imposing Scaliger Castle, and a picturesque harbor reflecting its Venetian past.","f":["First free commune in Italy (983)","Scaliger Castle"]},"lipari":{"i":"/poi-images/lipari.webp","s":"Lipari is the largest of the Aeolian Islands, offering a fascinating blend of ancient history, pumice quarries, and vibrant harbor life.","f":["Largest Aeolian Island","Historic citadel (Castello)"]},"maratea":{"i":"/poi-images/maratea.webp","s":"Maratea is the jewel of the Tyrrhenian Sea in Basilicata, famous for its 44 churches and the massive Christ the Redeemer statue.","f":["City of 44 churches","Only coastal town in Basilicata"]},"olbia":{"i":"/poi-images/olbia.webp","s":"Olbia is the main gateway to the Costa Smeralda, a dynamic port city in northeast Sardinia boasting ancient Punic and Roman heritage.","f":["Most important port city in Sardinia","Originally a Punic settlement"]},"ortisei":{"i":"/poi-images/ortisei.webp","s":"Ortisei is the main village of Val Gardena, famous for its picturesque pedestrian center and its long-standing tradition of wooden sculpture.","f":["Administrative center of Val Gardena","Capital of Tyrolean woodcarving art"]},"pantelleria":{"i":"/poi-images/pantelleria.webp","s":"Pantelleria is a rugged volcanic island between Sicily and Tunisia, famous for its unique 'dammusi' stone houses, thermal springs, and Passito wine.","f":["Volcanic origin","Closer to Africa than to Sicily"]},"perugia":{"i":"/poi-images/perugia.webp","s":"Perugia, the capital of Umbria, stands out with its Etruscan walls, vibrant university culture, and as the home of the world-famous Baci chocolate.","f":["Capital city of the Umbria region","Home to one of Italy's oldest universities (est. 1308)"]},"pienza":{"i":"/poi-images/pienza.webp","s":"Pienza is the 'ideal city' of the Renaissance, redesigned by Pope Pius II in the Val d'Orcia, famous for its urban harmony and pecorino cheese.","f":["UNESCO World Heritage site since 1996","Birthplace of Pope Pius II"]},"pizzo":{"i":"/poi-images/pizzo.webp","s":"Pizzo is a picturesque town in Calabria, famous for its Tartufo ice cream and the historic castle where Joachim Murat was executed.","f":["Home of Tartufo ice cream","Murat Castle"]},"porto-cervo":{"i":"/poi-images/porto-cervo.webp","s":"Porto Cervo is the luxurious heart of the Costa Smeralda, world-renowned for its exclusive yacht marina, designer boutiques, and emerald waters.","f":["Main village of the Costa Smeralda","Founded by Prince Karim Aga Khan IV"]},"san-remo":{"i":"/poi-images/san-remo.webp","s":"The City of Flowers on the Italian Riviera, world-famous for its annual music festival, historic casino, and lush Mediterranean gardens.","f":["City of Flowers","Music Festival"]},"selva-val-gardena":{"i":"/poi-images/selva-val-gardena.webp","s":"Situated at 1,563 meters, Selva is the highest village in Val Gardena, nestled directly beneath the spectacular Sella and Sassolungo massifs.","f":["Highest village in the Val Gardena valley","Direct access to the Sellaronda ski tour"]},"sestriere":{"i":"/poi-images/sestriere.webp","s":"Sestriere is a world-famous ski resort in the Piedmontese Alps, purpose-built in the 1930s by the Agnelli family for winter sports.","f":["Highest municipality in Italy (village center)","Founded by FIAT chief Giovanni Agnelli"]},"spoleto":{"i":"/poi-images/spoleto.webp","s":"Spoleto is a captivating Umbrian city, famous for its massive medieval aqueduct, imposing fortress, and the world-renowned Festival of Two Worlds.","f":["Former capital of the powerful Duchy of Spoleto","Ponte delle Torri is a stunning 80m-high aqueduct"]},"stintino":{"i":"/poi-images/stintino.webp","s":"Stintino is a picturesque fishing village in northwest Sardinia, world-famous for the stunning La Pelosa beach and its views over Asinara Island.","f":["Founded in 1885","Home to the iconic La Pelosa beach"]},"stromboli-village":{"i":"/poi-images/stromboli-village.webp","s":"Stromboli village lies at the foot of one of the world's most active volcanoes, featuring white-washed houses, black sand beaches, and unique tranquility.","f":["Constantly active volcano","Black sand beaches"]},"viareggio":{"i":"/poi-images/viareggio.webp","s":"The carnival capital of Tuscany, famous for its grand Art Nouveau promenade, wide sandy beaches, and luxury yacht building.","f":["Carnival Capital","Art Nouveau style"]},"viterbo":{"i":"/poi-images/viterbo.webp","s":"Viterbo is famously known as the City of the Popes, featuring one of Italy's best-preserved medieval centers, San Pellegrino, enclosed within ancient stone walls.","f":["Seat of the Popes","San Pellegrino district"]},"volterra":{"i":"/poi-images/volterra.webp","s":"Volterra is an ancient Tuscan hilltop city, renowned for its Etruscan heritage, imposing fortress, and centuries-old tradition of alabaster carving.","f":["Once a major power in the Etruscan League","Global center for alabaster craftsmanship"]},"rome":{"i":"/geo-images/italy/rome.webp","s":"Rome, the 'Eternal City', is the capital of Italy and a living museum of world history, known for the Colosseum, the Vatican, and its ancient splendor.","f":["Rome is often referred to as the 'Eternal City'.","It was founded in 753 BC, according to tradition by Romulus and Remus."]},"milan":{"i":"/geo-images/italy/milan.webp","s":"Milan, a metropolis in Italy's northern Lombardy region, is a global capital of fashion and design.","f":["Milan is the second most populous city in Italy after Rome.","The Duomo di Milano took nearly six centuries to complete."]},"venice":{"i":"/geo-images/italy/venice.webp","s":"Venice, the capital of northern Italy's Veneto region, is built on more than 100 small islands in a lagoon in the Adriatic Sea.","f":["Venice is built on millions of petrified wooden piles driven into the marsh.","There are over 400 bridges connecting the city's islands."]},"florence":{"i":"/geo-images/italy/florence.webp","s":"Florence, capital of Italy's Tuscany region, is home to many masterpieces of Renaissance art and architecture.","f":["Florence is considered the birthplace of the Italian Renaissance.","The city was governed for centuries by the powerful Medici family."]},"naples":{"i":"/geo-images/italy/naples.webp","s":"Naples is a vibrant and historic city in southern Italy, located on the picturesque Gulf of Naples.","f":["Naples is the third-largest municipality in Italy after Rome and Milan.","It is considered the birthplace of the modern pizza, specifically the Margherita."]},"colosseum":{"i":"/geo-images/italy/colosseum.webp","s":"The Colosseum is an iconic ancient amphitheater situated in the center of Rome, built during the Flavian dynasty.","f":["The Colosseum is also officially known as the Flavian Amphitheater.","It was built primarily of travertine limestone, tuff, and brick-faced concrete."]},"pisa-tower":{"i":"/geo-images/italy/pisa-tower.webp","s":"The Leaning Tower of Pisa is the freestanding bell tower of the cathedral of the Italian city of Pisa.","f":["The tower leans because its foundations were laid on unstable subsoil.","It stands at roughly 56 meters (183 feet) tall on the high side."]},"pompeii":{"i":"/geo-images/italy/pompeii.webp","s":"Pompeii was a vast Roman city located near modern Naples that was buried under volcanic ash and pumice after the catastrophic eruption of Mount Vesuvius in 79 AD.","f":["Pompeii was buried under 4 to 6 meters of volcanic ash and lapilli.","The eruption preserved stunning frescoes, mosaics, and everyday objects."]},"vatican":{"i":"/geo-images/italy/vatican.webp","s":"Vatican City, entirely enclaved within Rome, is the smallest independent state in the world both by area and population.","f":["Vatican City has an area of just 44 hectares (110 acres).","It mints its own euros, prints its own stamps, and issues passports."]},"it-herculaneum":{"i":"/geo-images/italy/it-herculaneum.webp","s":"Herculaneum was an ancient Roman town of immense wealth that shared the tragic fate of Pompeii when Mount Vesuvius erupted in 79 AD.","f":["Herculaneum was buried under approximately 20 meters of volcanic material.","The town was discovered by accident in 1709 during the digging of a well."]},"it-ostia-antica":{"i":"/geo-images/italy/it-ostia-antica.webp","s":"Ostia Antica was a vital harbor city of ancient Rome, situated at the mouth of the River Tiber on the Tyrrhenian coast.","f":["Ostia derives its name from 'os' or 'ostium', meaning 'mouth' in Latin.","It is believed to be the first Roman colony, possibly founded by King Ancus Marcius."]},"it-siena":{"i":"/geo-images/italy/it-siena.webp","s":"Siena is a stunning medieval city in the heart of Tuscany, distinguished by its medieval brick buildings and its fan-shaped central square, the Piazza del Campo.","f":["The historic center of Siena was declared a UNESCO World Heritage site in 1995.","The Palio horse race takes place on July 2 and August 16 every year."]},"it-san-gimignano":{"i":"/geo-images/italy/it-san-gimignano.webp","s":"San Gimignano is a highly distinctive small walled medieval hill town in the province of Siena, Tuscany.","f":["San Gimignano's historic center has been a UNESCO World Heritage site since 1990.","The town produces Vernaccia di San Gimignano, one of Italy's finest white wines."]},"it-assisi":{"i":"/geo-images/italy/it-assisi.webp","s":"Assisi is a serene and profoundly spiritual hill town in the Umbria region of central Italy.","f":["Assisi is also the birthplace of St. Clare, the founder of the Poor Clares.","The Basilica of San Francesco contains the sacred tomb of St. Francis."]},"it-montecassino":{"i":"/geo-images/italy/it-montecassino.webp","s":"Monte Cassino is a rocky hill situated about 130 kilometers southeast of Rome, famed as the site of the first house of the Benedictine Order.","f":["St. Benedict wrote his 'Rule' at Monte Cassino, which became the foundational guide for Western monasticism.","The abbey was completely destroyed by Allied bombing in February 1944."]},"it-orvieto":{"i":"/geo-images/italy/it-orvieto.webp","s":"Orvieto is a striking medieval city in Umbria, spectacularly perched atop a steep, flat-topped cliff of volcanic tuff.","f":["The city sits on a plug of volcanic tuff, giving it a natural defense.","The Duomo of Orvieto took over three centuries to complete."]},"it-matera-sassi":{"i":"/geo-images/italy/it-matera-sassi.webp","s":"The Sassi di Matera are ancient cave dwellings carved directly into the calcareous rock of the Gravina gorge in the Basilicata region.","f":["People have lived in the Sassi di Matera for at least 9,000 years.","In the 1950s, the Italian government relocated residents due to severe unsanitary conditions."]},"it-pietraperla":{"i":"/geo-images/italy/it-pietraperla.webp","s":"Pietraperla is a serene, hidden gem nestled in the picturesque landscapes of the Marche region.","f":["Pietraperla remains largely undiscovered by international tourism.","Its architecture is primarily composed of local white and pink limestone."]},"it-gran-paradiso":{"i":"/geo-images/italy/it-gran-paradiso.webp","s":"Gran Paradiso National Park is Italy's oldest and one of its most stunning national parks, situated in the Graian Alps between the Aosta Valley and Piedmont.","f":["The park was originally the private hunting reserve of King Victor Emmanuel II.","It succeeded in saving the Alpine ibex, which is now the symbol of the park."]},"it-abruzzo-np":{"i":"/geo-images/italy/it-abruzzo-np.webp","s":"The Abruzzo, Lazio and Molise National Park is one of Italy's most vital nature reserves, located in the heart of the Apennine Mountains.","f":["The park was officially established in 1923 to protect local wildlife.","It is the last stronghold of the critically endangered Marsican brown bear."]},"it-pollino-np":{"i":"/geo-images/italy/it-pollino-np.webp","s":"Pollino National Park is the largest national park in Italy, sprawling across the southern regions of Basilikata and Calabria.","f":["The park covers a massive area of almost 2,000 square kilometers.","The Bosnian pine trees here can live for over a thousand years."]},"it-lago-di-garda":{"i":"/geo-images/italy/it-lago-di-garda.webp","s":"Lake Garda is Italy's largest and most geographically diverse lake, situated gracefully between the Alps and the Po Valley.","f":["Lake Garda covers an area of roughly 370 square kilometers.","The lake spans three Italian regions: Lombardy, Veneto, and Trentino-Alto Adige."]},"it-lago-di-como":{"i":"/geo-images/italy/it-lago-di-como.webp","s":"Lake Como, located in the Lombardy region, is globally renowned for its spectacular, inverted Y-shape and breathtaking alpine scenery.","f":["Lake Como is the deepest lake in Italy, reaching a depth of over 400 meters (1,300 feet).","The lake is of glacial origin, carved out over millions of years."]},"it-lago-maggiore":{"i":"/geo-images/italy/it-lago-maggiore.webp","s":"Lake Maggiore is a stunning pre-alpine lake that straddles the border between Italy and Switzerland.","f":["The northern tip of Lake Maggiore extends into the Ticino canton of Switzerland.","The Borromean Islands are named after the aristocratic Borromeo family, who acquired them in the 16th century."]},"it-vesuvio":{"i":"/geo-images/italy/it-vesuvio.webp","s":"Mount Vesuvius is a looming stratovolcano located on the Gulf of Naples, holding a formidable place in history and geology.","f":["Vesuvius is part of the Campanian volcanic arc, formed by the convergence of the African and Eurasian plates.","The 79 AD eruption is often considered the first documented volcanic eruption, described by Pliny the Younger."]},"it-stromboli":{"i":"/geo-images/italy/it-stromboli.webp","s":"Stromboli is a small volcanic island in the Tyrrhenian Sea off the north coast of Sicily, part of the Aeolian archipelago.","f":["Stromboli gives its name to the specific 'Strombolian' type of volcanic eruption.","The volcano stands about 924 meters above sea level, but its base is deep on the ocean floor."]},"it-portofino":{"i":"/geo-images/italy/it-portofino.webp","s":"Portofino is an iconic, impossibly picturesque fishing village on the Italian Riviera, renowned as a haven for the wealthy and the jet-set crowd since the 1950s.","f":["Portofino became a symbol of 'La Dolce Vita' in the 1950s, attracting Hollywood stars and royals.","The name originates from 'Portus Delphini', meaning Port of the Dolphin, named by the Romans."]},"it-cinque-terre":{"i":"/geo-images/italy/it-cinque-terre.webp","s":"Cinque Terre, meaning 'Five Lands', is a remarkably rugged portion of the Italian Riviera coastline in the Liguria region.","f":["The region is connected by a scenic 19th-century railway line that tunnels through the cliffs.","Corniglia is the only village not situated directly on the water, sitting 100 meters above the sea."]},"it-lecce":{"i":"/geo-images/italy/it-lecce.webp","s":"Lecce, often dubbed the 'Florence of the South', is the principal city of the Salento peninsula in Apulia.","f":["The Basilica of Santa Croce is the pinnacle of Lecce's Baroque architectural style.","The local 'pietra leccese' stone hardens over time but is soft when initially quarried."]},"it-bari":{"i":"/geo-images/italy/it-bari.webp","s":"Bari is the capital city of the Apulia region, situated on the Adriatic Sea in southern Italy.","f":["Bari is the second most important economic center of mainland Southern Italy.","The Basilica of Saint Nicholas holds the relics of St. Nicholas (Santa Claus)."]},"it-perugia":{"i":"/geo-images/italy/it-perugia.webp",  Andrew supposedly contains the relics of the Apostle Andrew."]},"castel-del-monte":{"i":"/geo-images/italy/castel-del-monte.webp","s":"Castel del Monte is a 13th-century fortress in Apulia known for its exact octagonal plan and striking geometric design.","f":["Its eight-sided shape is mirrored by eight towers around the perimeter.","It is a UNESCO World Heritage site and its purpose is still debated."]},"castello-sforzesco":{"i":"/geo-images/italy/castello-sforzesco.webp","s":"Castello Sforzesco is a massive Renaissance fortress in Milan that once protected the rulers of the city.","f":["It was built by the Visconti and later expanded by the Sforza family.","The complex contains museums, courtyards, and works linked to Michelangelo."]},"palazzo-ducale-venezia":{"i":"/geo-images/italy/palazzo-ducale-venezia.webp","s":"The Doge's Palace is the former seat of Venetian power, standing beside St.","f":["It was the residence of the Doge and the center of the Venetian Republic.","The palace is linked to the prison by the famous Bridge of Sighs."]},"palazzo-pitti":{"i":"/geo-images/italy/palazzo-pitti.webp","s":"Pitti Palace is a vast Renaissance palace in Florence that became one of the principal homes of the Medici family.","f":["The palace now contains several museums, including the Palatine Gallery.","Behind it lie the Boboli Gardens, one of Italy's most influential historic gardens."]},"reggia-di-caserta":{"i":"/geo-images/italy/reggia-di-caserta.webp","s":"The Royal Palace of Caserta is a monumental Bourbon palace near Naples, created to rival the grandeur of Versailles.","f":["Architect Luigi Vanvitelli designed both the palace and its formal park.","It is a UNESCO World Heritage site and one of Italy's largest palaces."]},"palazzo-vecchio":{"i":"/geo-images/italy/palazzo-vecchio.webp","s":"Palazzo Vecchio is Florence's medieval town hall and one of the city's strongest symbols of civic power.","f":["The Arnolfo Tower rises above Piazza della Signoria.","It was onc function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});
  if(!list.length)return;
  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));
    const a=off+idx*(2*Math.PI/Math.max(1,cnt));

    html+='<button class="burst-dot" data-id="'+escAttrJs(p.id)+'" style="left:'+dx.toFixed(1)+'px;top:'+dy.toFixed(1)+'px;color:'+col+'"><span class="bd"></span><span class="bl">'+escAttrJs(p.name)+'</span></button>';
  });
  burstSvg.innerHTML=lines+'<circle class="burst-core" cx="'+CX.toFixed(1)+'" cy="'+CY.toFixed(1)+'" r="6"/>';
  burstDots.innerHTML=html;
  burstData=Object.fromEntries(list.map(p=>[p.id,p]));

function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}

// Chip toggle: hide POIs of disabled group

// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0

const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){

        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
