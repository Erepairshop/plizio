Tremat) oferă o fereastră încântătoare către viața autentică de zi cu zi a văilor andorrane."},"city-mosquera-extra":{"i":"/poi-images/city-mosquera-extra.webp","s":"La Mosquera este un cartier tradițional fermecător din parohia Encamp, situat în inima Andorrei, care captează vizitatorii prin autenticitatea sa pirineică."},"city-port-denvalira-extra":{"i":"/poi-images/city-port-denvalira-extra.webp","s":"Port d'Envalira este un pas montan spectaculos din Andorra care, la o altitudine de 2."},"city-les-pardines-extra":{"i":"/poi-images/city-les-pardines-extra.webp","s":"Amplasată în peisajele alpine uluitoare ale parohiei Encamp, zona Les Pardines este cea mai celebrată printre iubitorii de natură și familii pentru găzduirea unuia dintre cele mai frumoase și acces..."},"city-les-costes-extra":{"i":"/poi-images/city-les-costes-extra.webp","s":"Așezată cu grație pe pantele mângâiate de soare cu vedere la orașul plin de viață Encamp, zona liniștită Les Costes prezintă un refugiu idilic pentru călătorii dornici să experimenteze latura pașni..."},"city-vall-dorient-extra":{"i":"/poi-images/city-vall-dorient-extra.webp","s":"Vall d'Orient, sau valea estică a râului Valira, este una dintre cele mai captivante și bogate istoric regiuni din Andorra."},"city-riu-dels-llacs-extra":{"i":"/poi-images/city-riu-dels-llacs-extra.webp","s":"Zona din jurul Riu dels Llacs din parohia Encamp este un paradis pentru iubitorii de natură și pentru drumeții care doresc să descopere frumusețea pură a Pirineilor andorrani."},"city-les-ortes-extra":{"i":"/poi-images/city-les-ortes-extra.webp","s":"Ascunsă în cutele pitorești ale parohiei Encamp, fermecătoarea enclavă Les Ortes oferă o evadare frumos de senină care conectează călătorii moderni cu bogata moștenire agricolă a Andorrei."},"city-pal-extra":{"i":"/poi-images/city-pal-extra.webp","s":"Un sat pitoresc cu una dintre cele mai bine conservate biserici romanice din Andorra, Sant Climent de Pal.","f":["Patrimoniu cultural","Domeniul schiabil Pal-Arinsal"]},"city-erets-extra":{"i":"/poi-images/city-erets-extra.webp","s":"Satul pitoresc andorran Erts, situat idilic în parohia La Massana, este o bijuterie fascinantă aflată exact la confluența râurilor de munte Arinsal și Pal."},"city-sispony-extra":{"i":"/poi-images/city-sispony-extra.webp","s":"Un sat fermecător și însorit, cu străzi înguste și Muzeul Casa Rull, care prezintă viața în secolul al XIX-lea.","f":["Muzeu etnografic","Vederi panoramice"]},"city-anyos-extra":{"i":"/poi-images/city-anyos-extra.webp","s":"Un sat cocoțat pe un deal, cu o biserică veche și vederi superbe asupra văii La Massana și Escaldes.","f":["Biserica Sant Cristòfol","Centru sportiv"]},"city-laldosa-massana-extra":{"i":"/poi-images/city-laldosa-massana-extra.webp","s":"O zonă rezidențială liniștită în La Massana, cunoscută pentru școala sa de echitație.","f":["Centru de echitație","Potrivit pentru familii"]},"city-escas-extra":{"i":"/poi-images/city-escas-extra.webp","s":"Un mic sat agățat pe versanții de deasupra centrului La Massana.","f":["Arhitectură tradițională","Trasee de drumeții în apropiere"]},"city-puiol-del-piu-extra":{"i":"/poi-images/city-puiol-del-piu-extra.webp","s":"O mică așezare lângă La Massana, înconjurată de natură.","f":["Liniște și pace","Aproape de oraș"]},"city-xixerella-extra":{"i":"/poi-images/city-xixerella-extra.webp","s":"Un mic sat pe malul râului, cunoscut pentru campingul și terenul de golf Pitch & Putt.","f":["Camping","Minigolf"]},"city-mas-de-ribafeta-extra":{"i":"/poi-images/city-mas-de-ribafeta-extra.webp","s":"Un mic cătun lângă Arinsal, care oferă un refugiu liniștit.","f":["Atmosferă rurală","Înconjurat de munți"]},"city-el-cortalet-extra":{"i":"/poi-images/city-el-cortalet-extra.webp","s":"Ascuns în pădurile dese și verzi din parohia La Massana, El Cortalet este o adevărată comoară ascunsă pentru cei care caută liniște și doresc să descopere frumusețea pură a Andorrei, departe de cen..."},"city-jan-dels-plans-extra":{"i":"/poi-images/city-jan-dels-plans-extra.webp","s":"O zonă rezidențială cu case și apartamente moderne în La Massana.","f":["Facilități urbane","Locație însorită"]},"city-padola-extra":{"i":"/poi-images/city-padola-extra.webp","s":"Un mic cartier la altitudine, cu vederi uluitoare.","f":["Locație exclusivistă","Vedere la Casamanya"]},"city-borda-rossell-extra":{"i":"/poi-images/city-borda-rossell-extra.webp","s":"O zonă numită după o colibă tradițională andorrană, care acum găzduiește un restaurant.","f":["Gastronomie","Ambianță rurală"]},"city-comapedrosa-base-extra":{"i":"/poi-images/city-comapedrosa-base-extra.webp","s":"Punctul de plecare pentru ascensiunea pe Coma Pedrosa, cel mai înalt munte din Andorra.","f":["Centru de alpinism","Refugiu în apropiere"]},"city-llorts-extra":{"i":"/poi-images/city-llorts-extra.webp","s":"Un sat renumit pentru mina sa de fier și 'Ruta Fierului', care onorează trecutul industriei siderurgice din regiune.","f":["Patrimoniu industrial","Sculpturi în aer liber"]},"city-el-serrat-extra":{"i":"/poi-images/city-el-serrat-extra.webp","s":"Un mic sat la capătul văii Ordino, aproape de stațiunea de schi Ordino-Arcalís și de Parcul Natural Sorteny.","f":["Poarta către munți","Capăt de drum"]},"city-la-cortinada-extra":{"i":"/poi-images/city-la-cortinada-extra.webp","s":"Cunoscut pentru biserica sa romanică Sant Martí, cu fresce frumoase din secolul al XII-lea, și un centru de natură.","f":["Capodopere romanice","Gater și moară"]},"city-segudet-extra":{"i":"/poi-images/city-segudet-extra.webp","s":"Un sat pitoresc și liniștit, cu case tradiționale, foarte aproape de centrul Ordino.","f":["Ansamblu arhitectural","Casa Areny-Plandolit în apropiere"]},"city-sorna-extra":{"i":"/poi-images/city-sorna-extra.webp","s":"Un mic sat în valea Ordino, cu o bisericuță fermecătoare și o atmosferă rurală.","f":["Viață rurală","Biserica Sant Roc"]},"city-ancodina-extra":{"i":"/poi-images/city-ancodina-extra.webp","s":"O mică grupare de case între Ordino și La Cortinada.","f":["Locație liniștită","Bine conectat"]},"city-arans-extra":{"i":"/poi-images/city-arans-extra.webp","s":"Arans este un sat pitoresc din parohia andorreză Ordino, care se integrează armonios în peisajul montan spectaculos al Munților Pirinei."},"city-casa-molines-extra":{"i":"/poi-images/city-casa-molines-extra.webp","s":"Un conac istoric care face parte dintr-un mic cătun lângă Ordino.","f":["Conac nobiliar","Arhitectură istorică"]},"city-els-plans-ordino-extra":{"i":"/poi-images/city-els-plans-ordino-extra.webp","s":"Un platou înalt lângă El Serrat, care servește ca punct de plecare pentru excursii montane.","f":["Pajiști alpine","Zone de picnic"]},"city-ordino-arcalis-extra":{"i":"/poi-images/city-ordino-arcalis-extra.webp","s":"O stațiune de schi renumită pentru zăpada sa excelentă și oportunitățile de freeride.","f":["Paradis pentru freeride","Etapă în Turul Franței"]},"city-sorteny-valley-extra":{"i":"/poi-images/city-sorteny-valley-extra.webp","s":"Un parc natural protejat, cu o diversitate botanică excepțională și trasee de drumeții.","f":["Rezervație a biosferei UNESCO","Peste 700 de specii de plante"]},"city-pont-d-arcalis-extra":{"i":"/poi-images/city-pont-d-arcalis-extra.webp","s":"Un pod și o zonă care marchează începutul urcării finale spre stațiunea de schi Arcalís.","f":["Urcare iconică","Loc pentru fotografii"]},"city-les-salines-extra":{"i":"/poi-images/city-les-salines-extra.webp","s":"O zonă în Ordino cunoscută pentru facilitățile sale de agrement, cum ar fi o piscină în aer liber.","f":["Activități de vară","Zonă sportivă"]},"city-pla-dordino-extra":{"i":"/poi-images/city-pla-dordino-extra.webp","s":"O zonă plată și deschisă lângă satul Ordino, folosită pentru plimbări și recreere.","f":["Zonă verde","Plimbări ușoare"]},"city-riu-de-tristaina-extra":{"i":"/poi-images/city-riu-de-tristaina-extra.webp","s":"Râul care coboară de la faimoasele lacuri Tristaina, curgând prin valea superioară Ordino.","f":["Apă limpede de munte","Drumeții pe malul râului"]},"city-aixirivall-extra":{"i":"/poi-images/city-aixirivall-extra.webp","s":"Un sat însorit cu vedere la Sant Julià, cunoscut pentru biserica sa Sant Pere și atmosfera sa liniștită.","f":["Vederi panoramice","Aproape de Naturlandia"]},"city-bixessarri-extra":{"i":"/poi-images/city-bixessarri-extra.webp","s":"Un sat pitoresc, așezat într-o vale îngustă, traversat de râul Os.","f":["Case tradiționale din piatră","Poartă către granița cu Spania"]},"city-fontaneda-extra":{"i":"/poi-images/city-fontaneda-extra.webp","s":"Un mic sat izolat, cunoscut pentru capela sa romanică și traseele de drumeții din jur.","f":["Frumusețe izolată","Capătul drumului asfaltat"]},"city-aubinya-extra":{"i":"/poi-images/city-aubinya-extra.webp","s":"Un mic sat cunoscut pentru replica sa medievală și apropierea de podgorii.","f":["Centru medieval","Vin andorran"]},"city-juberri-extra":{"i":"/poi-images/city-juberri-extra.webp","s":"Juberri este un sat montan fermecător din sudul Andorrei și face parte din parohia Sant Julià de Lòria."},"city-nagol-extra":{"i":"/poi-images/city-nagol-extra.webp","s":"Un mic sat cu una dintre cele mai vechi biserici romanice din țară, Sant Serni de Nagol, datând din secolul al XI-lea.","f":["Fresce romanice","Situl istoric"]},"city-certers-extra":{"i":"/poi-images/city-certers-extra.webp","s":"Un sat foarte mic și izolat, cunoscut pentru arhitectura sa tradițională și liniște.","f":["Case istorice","Izolare"]},"city-lumeneneres-extra":{"i":"/poi-images/city-lumeneneres-extra.webp","s":"Llumeneres este un sat montan minuscul, aproape ascuns, din parohia andorrană Sant Julià de Lòria, care încântă prin atmosfera sa intimă și pașnică."},"city-aixovall-extra":{"i":"/poi-images/city-aixovall-extra.webp","s":"Situat la confluența vitală a râurilor Valira și Os, Aixovall este un sat mic, dar semnificativ din punct de vedere istoric, în parohia Sant Julià de Lòria, servind drept poartă de acces către spec..."},"city-canolich-extra":{"i":"/poi-images/city-canolich-extra.webp","s":"Sus, în munții izolați din sud-vestul parohiei Sant Julià de Lòria, se află Canòlic, un loc cu o profundă semnificație spirituală și naturală în Andorra."},"city-mas-dalins-extra":{"i":"/poi-images/city-mas-dalins-extra.webp","s":"Mas d'Alins este o proprietate agricolă istorică izolată și un mic cătun din parohia Sant Julià de Lòria."},"city-naturlandia-base-extra":{"i":"/poi-images/city-naturlandia-base-extra.webp","s":"Naturlandia Base, cunoscută astăzi sub numele de sectorul inferior (Cota 1600) al vastului parc de aventură Naturland, este destinația supremă pentru familii și dependenții de adrenalină din Andorra."},"city-les-cases-noves-extra":{"i":"/poi-images/city-les-cases-noves-extra.webp","s":"Les Cases Noves este un cartier fermecător din parohia Sant Julià de Lòria, care creează o punte fascinantă între stilul de viață tradițional andorran și confortul rezidențial alpin modern."},"city-la-feria-extra":{"i":"/poi-images/city-la-feria-extra.webp","s":"La Fèira este o bijuterie ascunsă în parohia andorrană Sant Julià de Lòria și reprezintă latura liniștită și neatinsă a Pirineilor."},"city-pont-de-fontaneda-extra":{"i":"/poi-images/city-pont-de-fontaneda-extra.webp","s":"Pont de Fontaneda este un pod pitoresc și plin de importanță istorică din parohia Sant Julià de Lòria, care traversează cursul râului și deschide calea către fermecătorul sat Fontaneda."},"city-coll-de-la-gallina-extra":{"i":"/poi-images/city-coll-de-la-gallina-extra.webp","s":"Coll de la Gallina este o trecătoare montană legendară din parohia andorrană Sant Julià de Lòria și este considerată una dintre cele mai solicitante destinații pentru bicicliștii ambițioși din Piri..."},"city-santa-coloma-extra":{"i":"/poi-images/city-santa-coloma-extra.webp","s":"Satul Santa Coloma este o așezare fermecătoare, în mare parte rezidențială, cuibărită în valea de la marginea centrului orașului Andorra la Vella."},"city-la-margineda-extra":{"i":"/poi-images/city-la-margineda-extra.webp","s":"La Margineda este o zonă cu o semnificație istorică deosebită și o atracție vizuală captivantă, situată la periferia sudică a orașului Andorra la Vella."},"city-ciutat-de-valls-extra":{"i":"/poi-images/city-ciutat-de-valls-extra.webp","s":"Ciutat de Valls este un cartier rezidențial și urban fascinant, situat în partea de sud-vest a orașului Andorra la Vella, oferind vizitatorilor o perspectivă unică asupra vieții de zi cu zi a locui..."},"city-comella-extra":{"i":"/poi-images/city-comella-extra.webp","s":"La Comella este o zonă naturală și de recreere uluitoare, situată chiar deasupra orașului Andorra la Vella, renumită în primul rând pentru punctul său de belvedere spectaculos, Mirador de la Comella."},"city-barri-antic-extra":{"i":"/poi-images/city-barri-antic-extra.webp","s":"Barri Antic, sau Cartierul Vechi, este sufletul istoric al orașului Andorra la Vella și oferă un contrast izbitor cu bulevardele comerciale moderne aflate la doar câțiva pași distanță."},"city-avinguda-meritxell-area-extra":{"i":"/poi-images/city-avinguda-meritxell-area-extra.webp","s":"Zona Avinguda Meritxell este inima comercială vibrantă a orașului Andorra la Vella și, fără îndoială, cea mai faimoasă stradă de cumpărături din întregul lanț al Munților Pirinei."},"city-parc-central-area-extra":{"i":"/poi-images/city-parc-central-area-extra.webp","s":"Plămânul verde al capitalei, un loc popular pentru localnici și turiști pentru a se relaxa.","f":["Parc urban","Loc de joacă pentru copii"]},"city-riu-valira-area-extra":{"i":"/poi-images/city-riu-valira-area-extra.webp","s":"Zona Riu Valira urmărește cursul râului Valira, principala cale navigabilă care trece chiar prin inima orașului Andorra la Vella și a orașului vecin Escaldes-Engordany."},"city-santa-coloma-d-andorra-extra":{"i":"/poi-images/city-santa-coloma-d-andorra-extra.webp","s":"Zona care înconjoară biserica istorică Santa Coloma d'Andorra este unul dintre cele mai semnificative și pitorești situri din punct de vedere cultural din întregul Principat."},"city-les-escaldes-extra":{"i":"/poi-images/city-les-escaldes-extra.webp","s":"Principalul oraș al parohiei, renumit pentru izvoarele sale termale fierbinți și centrul spa Caldea.","f":["Cel mai mare centru termal din Europa","Muzeul Parfumului"]},"city-engolasters-extra":{"i":"/poi-images/city-engolasters-extra.webp","s":"O zonă cunoscută pentru lacul său pitoresc și biserica romanică Sant Miquel d'Engolasters.","f":["Lac de acumulare","Biserică cu clopotniță lombardă"]},"city-els-vilars-extra":{"i":"/poi-images/city-els-vilars-extra.webp","s":"O zonă rezidențială liniștită, cu vederi panoramice asupra văii Escaldes-Engordany.","f":["Zonă rezidențială exclusivistă","Orientare însorită"]},"city-engordany-extra":{"i":"/poi-images/city-engordany-extra.webp","s":"Nucleul istoric care a fuzionat cu Les Escaldes, cunoscut pentru străzile sale de piatră.","f":["Artă romanică","Arhitectură tradițională"]},"city-fener-extra":{"i":"/poi-images/city-fener-extra.webp","s":"Un cartier modern și central din Escaldes-Engordany.","f":["Magazine și servicii","Aproape de Caldea"]},"city-pla-dels-vilars-extra":{"i":"/poi-images/city-pla-dels-vilars-extra.webp","s":"Un platou plat în zona rezidențială Els Vilars.","f":["Zonă rezidențială","Locuri de joacă"]},"city-madriu-pera-claror-valley-entrance-extra":{"i":"/poi-images/city-madriu-pera-claror-valley-entrance-extra.webp","s":"Accesul principal la Valea Madriu-Perafita-Claror, un sit al Patrimoniului Mondial UNESCO, dinspre Escaldes.","f":["Patrimoniul Mondial UNESCO","Paradis pentru drumeții"]},"city-pont-d-engordany-extra":{"i":"/poi-images/city-pont-d-engordany-extra.webp","s":"Un pod istoric care leagă nucleele vechi ale Escaldes și Engordany.","f":["Pod medieval","Simbol istoric"]},"city-rambla-molleres-extra":{"i":"/poi-images/city-rambla-molleres-extra.webp","s":"O zonă pietonală modernă și un district comercial în Escaldes.","f":["Zonă pietonală","Cafenele și magazine"]},"city-caldea-area-ext const svg=document.getElementById('svg'),stage=document.getElementById('stage');
const gR=document.getElementById('gR'),gL=document.getElementById('gL'),gP=document.getElementById('gP'),gC=document.getElementById('gC');
const EXPAND_SCALE=3.5;
let s=1,tx=0,ty=0;
function ap(){const tr='translate('+tx+','+ty+') scale('+s+')';gR.setAttribute('transform',tr);gL.setAttribute('transform',tr);gP.setAttribute('transform',tr);if(gC)gC.setAttribute('transform',tr);svg.classList.toggle('expand',s>=EXPAND_SCALE)}
function clmp(v){return Math.max(.5,Math.min(8,v))}
function toVb(cx,cy){const r=svg.getBoundingClientRect();return[(cx-r.left)*(W/r.width),(cy-r.top)*(H/r.height)]}
function zoomAt(f,cx,cy){const[vx,vy]=toVb(cx,cy);const ns=clmp(s*f);const k=ns/s;tx=vx-k*(vx-tx);ty=vy-k*(vy-ty);s=ns;ap()}
function zoomCenter(f){const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
let dr=false,dx=0,dy=0;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.poi'))return;if(e.isPrimary===false)return;dr=true;dx=e.clientX;dy=e.clientY;svg.classList.add('drag');svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!dr)return;const r=svg.getBoundingClientRect();const k=W/r.width;tx+=(e.clientX-dx)*k;ty+=(e.clientY-dy)*k;dx=e.clientX;dy=e.clientY;ap()});
svg.addEventListener('pointerup',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('pointercancel',()=>{dr=false;svg.classList.remove('drag')});
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
document.getElementById('zin').onclick=()=>zoomCenter(1.3);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.3);
let pD=0,pS=1;
svg.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pD=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);pS=s;dr=false}},{passive:true});
svg.addEventListener('touchmove',e=>{if(e.touches.length===2){const[a,b]=e.touches;const d=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);const cx=(a.clientX+b.clientX)/2,cy=(a.clientY+b.clientY)/2;const f=(d/pD)*(pS/s);zoomAt(f,cx,cy);e.preventDefault()}},{passive:false});
const pop=document.getElementById('popup');
const GCOL2={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function clearMode(){pop.classList.remove('mode-single','mode-list')}
function openPopup(el){
  document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  const t=el.getAttribute('data-grp')||'';
  const id=el.getAttribute('data-id');
  document.getElementById('ptype').textContent=t;
  document.getElementById('pname').textContent=el.getAttribute('data-name')||id;
  const u=el.getAttribute('data-url');
  const moreBtn=document.getElementById('pmore');
  if(u){moreBtn.href=u;moreBtn.style.display=''}else{moreBtn.style.display='none'}
  // Card data (image + 1-sentence desc + 2 facts) — only when we have it for this POI.
  const c=POI_CARD[id]||{};
  const card=document.getElementById('pcard');
  if(c.i){card.style.backgroundImage='url("'+c.i.replace(/"/g,'\"')+'")';card.classList.add('has-img')}else{card.classList.remove('has-img');card.style.backgroundImage=''}
  const pd=document.getElementById('pdesc');
  if(c.s){pd.textContent=c.s;pd.classList.add('show')}else{pd.textContent='';pd.classList.remove('show')}
  const pf=document.getElementById('pfacts');
  if(c.f&&c.f.length){pf.innerHTML=c.f.map(s=>'<li>'+String(s).replace(/[<>]/g,'')+'</li>').join('');pf.classList.add('show')}else{pf.innerHTML='';pf.classList.remove('show')}
  clearMode();pop.classList.add('mode-single','open');
}
function openClusterList(i){const all=CLUSTERS[i];if(!all)return;const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(p=>p.url?'<a href="'+p.url+'"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+'"></span><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></a>':'<div class="nl"><span class="dot" style="background:'+(GCOL2[p.grp]||'#9ca3af')+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem"></span>'+escAttrJs(p.name)+'</div>').join('');clearMode();pop.classList.add('mode-list','open')}
function escAttrJs(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
gP.addEventListener('click',e=>{const el=e.target.closest('.poi');if(el){e.stopPropagation();openPopup(el)}});
if(gC){gC.addEventListener('click',e=>{const cl=e.target.closest('.cluster');if(!cl)return;e.stopPropagation();openClusterList(+cl.getAttribute('data-i'))})}
function closePopup(){pop.classList.remove('open');clearMode();document.querySelectorAll('.poi.active').forEach(n=>n.classList.remove('active'))}
document.getElementById('px').onclick=closePopup;
stage.addEventListener('click',e=>{if(!e.target.closest('.poi')&&!e.target.closest('.cluster')&&!e.target.closest('.popup')){closePopup()}});
// Chip toggle: hide POIs of disabled group
const activeGrps=new Set(["city","sight","nature","history","industry"]);
function applyGrpFilter(){
  gP.querySelectorAll('.poi').forEach(p=>{const g=p.getAttribute('data-grp');p.classList.toggle('hidden',!activeGrps.has(g))});
  // Cluster + reveal-id computation moved to applySearch() so chip + search
  // combine consistently. Just re-trigger applySearch (it reads activeGrps).
  if(typeof applySearch==='function')applySearch();
}
document.querySelectorAll('.chip[data-g]').forEach(ch=>{ch.addEventListener('click',()=>{const g=ch.getAttribute('data-g');if(activeGrps.has(g)){activeGrps.delete(g);ch.classList.remove('on')}else{activeGrps.add(g);ch.classList.add('on')}applyGrpFilter()})});
// Search: dim non-matching POIs + recompute cluster visibility (only count matches)
const sIn=document.getElementById('searchIn'),sX=document.getElementById('searchX'),sW=document.getElementById('searchWrap'),sRes=document.getElementById('searchRes');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',
    url:p.getAttribute('data-url')||null,
    cx:m?+m[1]:0,cy:m?+m[2]:0
  };
});
const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);
    p.classList.toggle('dim',!m);
  });
  // Phase 2: cluster visibility — combine search match WITH group filter
  if(!gC)return;
  const revealIds=new Set();
  gC.querySelectorAll('.cluster').forEach(c=>{
    const i=+c.getAttribute('data-i');
    const list=CLUSTERS[i]||[];
    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}
    else{c.classList.remove('hidden');if(txt)txt.textContent=String(vis.length)}
  });
  gP.querySelectorAll('.poi.in-cluster').forEach(p=>{
    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });
  // Phase 3: dropdown list of top matches (count ALL matching for auto-zoom decision)
  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.
  // "Visible thing" = either a single non-clustered POI, or one cluster with all matches inside it.
  // Compute by examining current cluster visibility (already set in Phase 2 above).
  if(hits.length>0){
    // Map: poi-id -> cluster index it belongs to (if any)
    const poiToCluster={};
    for(let i=0;i<CLUSTERS.length;i++)for(const p of CLUSTERS[i])poiToCluster[p.id]=i;
    // Group matches by their visible "thing": either a visible cluster (id of cluster) or 'solo' + poi-id.
    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.
    // A POI is "shown solo" if either: not in any cluster, OR in a cluster whose .cluster element IS hidden (= cluster collapsed to <=1 match).
    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI, do NOT auto-navigate (user can click again on map dot for that)
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
</body>
