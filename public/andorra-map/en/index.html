 Museum"]},"city-engolasters-extra":{"i":"/poi-images/city-engolasters-extra.webp","s":"An area known for its picturesque lake and the Romanesque church of Sant Miquel d'Engolasters.","f":["Reservoir lake","Church with Lombard bell tower"]},"city-els-vilars-extra":{"i":"/poi-images/city-els-vilars-extra.webp","s":"A quiet residential area offering panoramic views over the Escaldes-Engordany valley.","f":["Exclusive residential area","Sunny orientation"]},"city-engordany-extra":{"i":"/poi-images/city-engordany-extra.webp","s":"The historic core that merged with Les Escaldes, known for its stone streets.","f":["Romanesque art","Traditional architecture"]},"city-fener-extra":{"i":"/poi-images/city-fener-extra.webp","s":"A modern and central neighborhood of Escaldes-Engordany.","f":["Shops and services","Close to Caldea"]},"city-pla-dels-vilars-extra":{"i":"/poi-images/city-pla-dels-vilars-extra.webp","s":"A flat plateau within the residential area of Els Vilars.","f":["Residential area","Playgrounds"]},"city-madriu-pera-claror-valley-entrance-extra":{"i":"/poi-images/city-madriu-pera-claror-valley-entrance-extra.webp","s":"The main access point to the Madriu-Perafita-Claror Valley, a UNESCO World Heritage site, from Escaldes.","f":["UNESCO World Heritage","Hiking paradise"]},"city-pont-d-engordany-extra":{"i":"/poi-images/city-pont-d-engordany-extra.webp","s":"A historic bridge connecting the old cores of Escaldes and Engordany.","f":["Medieval bridge","Historic symbol"]},"city-rambla-molleres-extra":{"i":"/poi-images/city-rambla-molleres-extra.webp","s":"A modern pedestrian street and shopping district in Escaldes.","f":["Pedestrian area","Cafes and shops"]},"city-caldea-area-extra":{"i":"/poi-images/city-caldea-area-extra.webp","s":"The area surrounding the iconic Caldea thermal spa, which dominates the city's skyline.","f":["Architectural landmark","Wellness and relaxation"]},"city-carrer-del-riu-extra":{"i":"/poi-images/city-carrer-del-riu-extra.webp","s":"A street along the river known for its restaurants and nightlife.","f":["Gastronomic hub","Bars and pubs"]},"city-entrada-sud-extra":{"i":"/poi-images/city-entrada-sud-extra.webp","s":"The southern entrance area of Escaldes-Engordany, bordering Andorra la Vella.","f":["Transport hub","Transition between cities"]},"city-vivand-area-extra":{"i":"/poi-images/city-vivand-area-extra.webp","s":"The Vivand area, centrally located along the famous Avinguda Carlemany in Escaldes-Engordany, is universally recognized as Andorra's premier pedestrian shopping and lifestyle destination."},"ad-animal-habitat-marmot-viewpoint-canillo-extra":{"i":"/poi-images/ad-animal-habitat-marmot-viewpoint-canillo-extra.webp","s":"A known spot in the Canillo valley for watching alpine marmots in their natural habitat.","f":["Best viewing time is early morning","Marmots are very social animals"]},"ad-animal-habitat-pyrenean-chamois-ordino-extra":{"s":"The rocky slopes around Ordino are a prime habitat for the agile Pyrenean chamois.","f":["Perfectly adapted to mountain terrain","Can jump very high"]},"ad-animal-habitat-griffon-vulture-nesting-la-massana-extra":{"i":"/poi-images/ad-animal-habitat-griffon-vulture-nesting-la-massana-extra.webp","s":"High cliffs in La Massana serve as nesting sites for griffon vultures, often seen soaring in the sky.","f":["Wingspan of up to 2.8 meters","Scavengers that play an important ecological role"]},"ad-animal-habitat-wild-boar-forest-encamp-extra":{"i":"/poi-images/ad-animal-habitat-wild-boar-forest-encamp-extra.webp","s":"The dense forests of Encamp are a common habitat for wild boars, especially at dusk.","f":["Omnivores","Nocturnal animals"]},"ad-animal-habitat-brook-trout-river-sant-julia-extra":{"i":"/poi-images/ad-animal-habitat-brook-trout-river-sant-julia-extra.webp","s":"The cool, clear rivers around Sant Julià de Lòria are ideal for brook trout.","f":["Prefer cold, oxygen-rich water","An indicator of good water quality"]},"ad-animal-habitat-golden-eagle-peaks-escaldes-extra":{"i":"/poi-images/ad-animal-habitat-golden-eagle-peaks-escaldes-extra.webp","s":"The high peaks above Escaldes-Engordany are hunting grounds for the majestic golden eagle.","f":["One of the largest birds of prey in the Northern Hemisphere","Monogamous birds"]},"ad-animal-habitat-fire-salamander-damp-forests-extra":{"i":"/poi-images/ad-animal-habitat-fire-salamander-damp-forests-extra.webp","s":"Damp, shady forests throughout Andorra provide a habitat for the striking fire salamander.","f":["Bright coloring warns predators of its toxicity","Nocturnal"]},"ad-animal-habitat-red-squirrel-pine-forests-extra":{"i":"/poi-images/ad-animal-habitat-red-squirrel-pine-forests-extra.webp","s":"The pine forests in La Massana are full of red squirrels, jumping from cone to cone.","f":["Collect food supplies for the winter","Bushy tail helps with balance"]},"ad-animal-habitat-butterfly-meadows-ordino-extra":{"i":"/poi-images/ad-animal-habitat-butterfly-meadows-ordino-extra.webp","s":"The flower-rich meadows in the Sorteny Valley are a paradise for numerous butterfly species in summer.","f":["Species like the Apollo butterfly can be found here","They pollinate many alpine plants"]},"ad-animal-habitat-bat-caves-sant-julia-extra":{"i":"/poi-images/ad-animal-habitat-bat-caves-sant-julia-extra.webp","s":"Several small caves in the Sant Julià de Lòria region serve as roosts for various bat species.","f":["Important insect predators","Use echolocation to navigate"]},"ad-animal-habitat-ptarmigan-high-altitudes-extra":{"i":"/poi-images/ad-animal-habitat-ptarmigan-high-altitudes-extra.webp","s":"The rock ptarmigan is found in the highest, rockiest areas of Andorra, changing its plumage with the seasons.","f":["Perfect camouflage in the snow","Feathered feet act as snowshoes"]},"ad-animal-habitat-asp-viper-sunny-slopes-extra":{"i":"/poi-images/ad-animal-habitat-asp-viper-sunny-slopes-extra.webp","s":"On sunny, rocky slopes in Andorra la Vella, the asp viper can be spotted basking in the sun.","f":["Venomous snake","Characteristic upturned snout"]},"ad-animal-habitat-badger-den-la-massana-extra":{"i":"/poi-images/ad-animal-habitat-badger-den-la-massana-extra.webp","s":"The woodlands and meadows of La Massana are home to badgers, which create complex underground setts.","f":["Nocturnal omnivores","Live in social groups called clans"]},"ad-animal-habitat-weasel-farmlands-canillo-extra":{"i":"/poi-images/ad-animal-habitat-weasel-farmlands-canillo-extra.webp","s":"Near farms and fields in Canillo, weasels can be found hunting small rodents.","f":["The world's smallest carnivore","Long, slender body"]},"ad-animal-habitat-capercaillie-forests-ordino-extra":{"i":"/poi-images/ad-animal-habitat-capercaillie-forests-ordino-extra.webp","s":"The old-growth forests in the Ordino valley are one of the few places in Andorra to find the elusive capercaillie.","f":["Europe's largest grouse species","Spectacular mating display"]},"ad-animal-habitat-otter-valira-river-extra":{"i":"/poi-images/ad-animal-habitat-otter-valira-river-extra.webp","s":"Though rare, otters have been spotted along quiet stretches of the Valira River, a sign of a healthy ecosystem.","f":["Semi-aquatic mammals","Feed mainly on fish"]},"ad-animal-habitat-red-deer-forests-encamp-extra":{"i":"/poi-images/ad-animal-habitat-red-deer-forests-encamp-extra.webp","s":"The extensive forests around Encamp provide habitat for populations of red deer.","f":["One of the largest deer species","Males have impressive antlers"]},"ad-animal-habitat-bearded-vulture-high-peaks-extra":{"i":"/poi-images/ad-animal-habitat-bearded-vulture-high-peaks-extra.webp","s":"This rare vulture is found in the highest Pyrenean peaks, feeding almost exclusively on bones.","f":["Also known as the Lammergeier","Drops bones from great heights to break them"]},"ad-animal-habitat-pyrenean-newt-streams-extra":{"i":"/poi-images/ad-animal-habitat-pyrenean-newt-streams-extra.webp","s":"The cold, clear mountain streams of Ordin function openBurst(clEl){
  closePopup();
  const i=+clEl.getAttribute('data-i');
  const ccx=+clEl.getAttribute('data-cx')||0,ccy=+clEl.getAttribute('data-cy')||0;
  const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';
  const list=(CLUSTERS[i]||[]).filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});

  if(list.length>=15){openClusterList(i);return;}
  svg.classList.add('dim-pois');
  const[CX,CY]=markerScreen(ccx,ccy);
  const n=list.length,ring1=Math.min(n,7),r1=72,r2=124;
  let lines='',html='';
  list.forEach((p,k)=>{
    const inner=k<ring1,cnt=inner?ring1:(n-ring1),idx=inner?k:(k-ring1);
    const R=inner?r1:r2,off=inner?-Math.PI/2:(-Math.PI/2+Math.PI/Math.max(1,cnt));

  });

  burstDots.innerHTML=html;

function openClusterList(i){const all=CLUSTERS[i];if(!all)return;closeMapcard();closeBurst();const sInEl=document.getElementById('searchIn');const q=sInEl?norm(sInEl.value.trim()):'';const list=all.filter(p=>{if(!activeGrps.has(p.grp))return false;if(q&&!((POI_SEARCH_BY_ID[p.id]||'').includes(q)))return false;return true});const el=document.getElementById('plist');function row(p){const c=POI_CARD[p.id]||{};const col=GCOL2[p.grp]||'#9ca3af';const th=c.i?'<span class="lthumb" style="background-image:url('+String(c.i).replace(/[()]/g,'')+')"></span>':'<span class="lthumb ln" style="background:'+col+'22;color:'+col+'"><span class="dot" style="background:'+col+'"></span></span>';const body='<span class="lbody"><span class="n">'+escAttrJs(p.name)+'</span><span class="g">'+p.grp+'</span></span>';return p.url?'<a href="'+p.url+'">'+th+body+'<span class="lgo">›</span></a>':'<div class="nl">'+th+body+'</div>';}svg.classList.add('dim-pois');el.innerHTML='<p class="lh">'+list.length+' '+(LANG==='hu'?'hely ezen a környéken':LANG==='de'?'Orte in dieser Gegend':LANG==='ro'?'locuri în zonă':'places nearby')+'</p>'+list.map(row).join('');clearMode();pop.classList.add('mode-list','open')}

// Search: dim non-matching POIs + recompute cluster visibility (only count matches)

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// Quick lookup of POI's normalized search text + display name + group + coords by id
const POI_INDEX={};
gP.querySelectorAll('.poi').forEach(p=>{
  const id=p.getAttribute('data-id');
  const t=p.getAttribute('transform')||'';
  const m=t.match(/translate\(([-\d.]+),([-\d.]+)\)/);
  POI_INDEX[id]={
    search:p.getAttribute('data-search')||'',
    name:p.getAttribute('data-name')||id,
    grp:p.getAttribute('data-grp')||'other',

const POI_SEARCH_BY_ID={};
for(const id in POI_INDEX)POI_SEARCH_BY_ID[id]=POI_INDEX[id].search;
const GCOL_JS={city:'#60a5fa',sight:'#fbbf24',nature:'#22c55e',history:'#c084fc',industry:'#fb923c',other:'#9ca3af'};
function applySearch(){
  const q=norm(sIn.value.trim());
  sW.classList.toggle('has-q',!!q);
  // Phase 1: per-POI dim/match
  gP.querySelectorAll('.poi').forEach(p=>{
    if(!q){p.classList.remove('dim');p.classList.remove('match');return}
    const t=p.getAttribute('data-search')||'';
    const m=t.includes(q);
    p.classList.toggle('match',m);

  });

  if(!gC)return;

    // POI counts as "visible" if: group active AND (no query OR matches query)
    const vis=list.filter(p=>{
      if(!activeGrps.has(p.grp))return false;
      if(!q)return true;
      return (POI_SEARCH_BY_ID[p.id]||'').includes(q);
    });
    const txt=c.querySelector('text');
    if(vis.length===0){c.classList.add('hidden')}
    else if(vis.length===1){c.classList.add('hidden');revealIds.add(vis[0].id)}

  });

    p.classList.toggle('reveal',revealIds.has(p.getAttribute('data-id')))
  });

  if(!q){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  const hits=[];
  for(const id in POI_INDEX){
    const e=POI_INDEX[id];
    if(!activeGrps.has(e.grp))continue;
    if(!e.search.includes(q))continue;
    if(hits.length<50)hits.push({id,...e});
  }
  // Auto-zoom: only ONE visible thing on the map → pan-zoom there.

  if(hits.length>0){

    // A cluster is "visible" if its DOM .cluster element does NOT have .hidden.

    const visibleClusterIdx=new Set();
    if(gC){
      gC.querySelectorAll('.cluster:not(.hidden)').forEach(c=>visibleClusterIdx.add(+c.getAttribute('data-i')));
    }
    const visibleThings=new Set();
    for(const h of hits){
      const ci=poiToCluster[h.id];
      if(ci!==undefined && visibleClusterIdx.has(ci)){
        visibleThings.add('c'+ci);
      }else{
        visibleThings.add('p'+h.id);
      }
    }
    const onlyOneThing=visibleThings.size===1;
    if(onlyOneThing){
      const thing=Array.from(visibleThings)[0];
      let cx,cy;
      if(thing[0]==='p'){
        // Solo POI (or revealed cluster-POI)
        const id=thing.slice(1);
        const e=POI_INDEX[id];
        if(e){cx=e.cx;cy=e.cy}
      }else{
        // Visible cluster (c<idx>) — center = avg of cluster's POI coords
        const ci=+thing.slice(1);
        const cl=CLUSTERS[ci]||[];
        let sx=0,sy=0,n=0;
        for(const p of cl){sx+=p.cx||0;sy+=p.cy||0;n++}
        if(n>0){cx=sx/n;cy=sy/n}
      }
      if(cx!==undefined){
        // Use 4× zoom (below EXPAND_SCALE=6 so clusters stay collapsed as numbers,
        // POI doesn't disappear into expanded form)
        s=4;
        tx=W/2-cx*s;
        // Bias the target 20% above viewBox center so it's not hidden behind the search dropdown / header
        ty=H*0.32-cy*s;
        ap();
        sRes.innerHTML='';
        sRes.classList.remove('has-hits');
        return;
      }
    }
  }
  if(hits.length===0){sRes.innerHTML='';sRes.classList.remove('has-hits');return}
  // Show first N by default; rest behind a "+more" button so the dropdown
  // stops covering the map when a query has many matches.
  const FIRST_N=8;
  const row=h=>'<a data-id="'+h.id+'" data-cx="'+h.cx+'" data-cy="'+h.cy+'"'+(h.url?' href="'+h.url+'"':'')+'><span class="dot" style="background:'+(GCOL_JS[h.grp]||'#9ca3af')+'"></span><span class="nm">'+h.name.replace(/[<>]/g,'')+'</span><span class="gr">'+String(h.grp)+'</span></a>';
  let html=hits.slice(0,FIRST_N).map(row).join('');
  if(hits.length>FIRST_N){
    const rest=hits.slice(FIRST_N).map(row).join('');
    const moreLabel=LANG==='hu'?'Még':LANG==='de'?'Mehr':LANG==='ro'?'Mai mult':'More';
    html+='<div class="srest" hidden>'+rest+'</div>'
        +'<button type="button" class="smore" aria-expanded="false">▾ '+moreLabel+' (+'+(hits.length-FIRST_N)+')</button>';
  }
  sRes.innerHTML=html;
  sRes.classList.add('has-hits');
  const moreBtn=sRes.querySelector('.smore');
  if(moreBtn){moreBtn.addEventListener('click',function(e){e.preventDefault();const r=sRes.querySelector('.srest');const open=!r.hasAttribute('hidden');if(open){r.setAttribute('hidden','');this.setAttribute('aria-expanded','false');this.firstChild.nodeValue='▾ '}else{r.removeAttribute('hidden');this.setAttribute('aria-expanded','true');this.firstChild.nodeValue='▴ '}})}
}
sIn.addEventListener('input',applySearch);
sX.addEventListener('click',()=>{sIn.value='';applySearch();sIn.focus()});
// Click on dropdown item: zoom-pan to POI AND open its popup (same as clicking the marker).
sRes.addEventListener('click',e=>{
  const a=e.target.closest('a[data-id]');
  if(!a)return;
  e.preventDefault();
  const id=a.getAttribute('data-id');
  const cx=+a.getAttribute('data-cx'),cy=+a.getAttribute('data-cy');
  s=4;
  tx=W/2-cx*s;
  ty=H*0.32-cy*s;
  ap();
  sRes.classList.remove('has-hits');
  sIn.blur();
  // Find the .poi element and trigger openPopup (mirrors marker click).
  const el=gP.querySelector('.poi[data-id="'+id.replace(/"/g,'\"')+'"]');
  if(el)openPopup(el);
});
// Close dropdown on outside click
document.addEventListener('click',e=>{if(!sW.contains(e.target))sRes.classList.remove('has-hits')});
</script>
